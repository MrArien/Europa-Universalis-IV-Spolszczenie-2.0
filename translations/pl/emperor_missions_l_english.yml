l_english:
 bav_reunite_bavaria_title: "Zjednoczona i silna Bawaria"
 bav_reunite_bavaria_desc: "Księstwo Bawarskie jest podzielone od połowy XIV wieku, kiedy to synowie Ludwika IV, a później Stefana II, postanowili formalnie podzielić swoje dziedzictwo. Jednak podzielona Bawaria jest słaba i podatna na grabieże ze strony silniejszych sąsiadów. Musimy zjednoczyć ziemie naszych przodków, jeśli mamy przetrwać próbę czasu!"
 bav_expand_in_bavaria_title: "Rozszerz Bawarię"
 bav_expand_in_bavaria_desc: "Nawet zjednoczona Bawaria nie może sama przeciwstawić się Austrii i Czechom. Musimy rozszerzyć nasze rdzenne terytoria i poddać naszych słabszych sąsiadów naszym rządom."
 emp_bav_union_with_palatinate_title: "Zjednocz Wittelsbachów"
 emp_bav_union_with_palatinate_desc: "Podziały w dynastii Wittelsbachów sięgają daleko poza granice Bawarii. Jedna z gałęzi rodu Wittelsbachów już od dłuższego czasu rządzi Palatynatami Reńskim i Górnym, a także otrzymała status elektora, który zdecydowanie bardziej należy się Wittelsbachom bawarskim. Musimy ponownie zjednoczyć ród i wykorzystać siłę perswazji, aby Cesarz mógł nam przyznać tytuł elektorski Palatynatu."
 emp_bav_union_with_palatinate_effect_tooltip: "Jeżeli ukończymy tę misję poprzez wprowadzenie unii personalnej z §YPalatynatem§!:"
 emp_bav_union_with_palatinate_effect_tooltip2: "§YŚwięty Cesarz Rzymski§! podejmie decyzję, czy należący do §YPalatynatu§! tytuł elektorski powinien przejść na państwo §Y[Root.GetName]§!."
 emp_bav_union_with_palatinate_effect_tooltip3: "\nJeżeli ukończymy tę misję bez unii personalnej z §YPalatynatem§!:"
 emp_bav_be_good_at_religion_title: "Pokaż pobożność"
 emp_bav_be_good_at_religion_desc: "Nie można pozwolić, by religijne rozłamy, które nękają inne państwa, miały miejsce w Bawarii. Musimy dopilnować, aby pobożność i wierność były kamieniami węgielnymi naszego narodu."
 emp_bav_be_good_at_religion_reformation_started_tooltip: "§YReformacja§! rozpoczęła się co najmniej §Y20§! lat temu."
 emp_bav_center_of_counter_reformation_title: "Szerz pobożność"
 emp_bav_center_of_counter_reformation_desc: "Powinniśmy stworzyć centrum [Root.Religion.GetName] uczące się działać jako baza, z której możemy wywierać wpływ i zapewnić, że nasi sąsiedzi postrzegają sprawy religii w taki sam sposób, jak my."
 emp_bav_center_of_counter_reformation_tooltip: "Żaden sąsiadujący kraj nie wyznaje religii §Yheretyckiej§!."
 emp_bav_center_of_counter_reformation_tooltip2: "§YReformacja§! rozpoczęła się co najmniej §Y50§! lat temu."
 emp_bav_conquer_tirol_title: "Roszczenia do Tyrolu"
 emp_bav_conquer_tirol_desc: "Tyrol należał niegdyś do Księstwa Bawarskiego, a roszczenia do niego straciliśmy dopiero w 1369 roku. Powinniśmy wznowić te roszczenia i zakończyć okupację hrabstwa przez Habsburgów."
 emp_bav_union_with_austria_title: "Unia z Austrią"
 emp_bav_union_with_austria_desc: "Rozwijający się Habsburgowie stworzyli w Austrii wielkie imperium terytorialne, które niegdyś należało do książąt bawarskich. Mimo że było to wiele wieków temu, Bawarczycy nigdy w pełni nie zadowolili się życiem w cieniu Austrii i chętnie skorzystaliby z okazji, aby się na nich odegrać, gdyby tylko nadarzyła się okazja."
 emp_bav_italian_sun_title: "Ekspansja ku Włochom"
 emp_bav_italian_sun_desc: "Przez pokolenia naród bawarski odczuwał wielką tęsknotę za świeżym morskim powiewem wybrzeża Adriatyku. Teraz jednak nasz naród jest w stanie pozyskać takie tereny dla naszego [Root.GetGovNameGen]. Musimy zagarnąć dla siebie Wenecję i Karnawalię!"
 emp_bav_oktoberfest_mission_title: "Ustanów Oktoberfest"
 emp_bav_oktoberfest_mission_desc: "Nasz prestiż i sława nie miałyby sobie równych, gdybyśmy ustanowili coroczny festiwal ku chwale naszego narodu, sławiący wspaniałość jego władców, uczciwość jego ludzi, szybkość jego koni i smak jego piwa."
 emp_bav_illuminati_mission_title: "Rozpraw się z Illuminati"
 emp_bav_illuminati_mission_desc: "W nasz[Root.GetGovGender_nasz] [Root.GetGovNameIns] doszło do powstania tajnej organizacji, która nazywa siebie 'oświeconymi'. Podczas gdy niektóre z ich założeń są szczytne, inne są potencjalnie niebezpieczne, opierając się na rewolucyjnych ideach. Powinniśmy zająć zdecydowane stanowisko w tej sprawie i przyjąć ich program, albo zniszczyć organizację."
 emp_bav_cultural_center_title: "Rozwiń [Root.Capital.GetCapitalName]"
 emp_bav_cultural_center_desc: "Nasi rówieśnicy na wielkich dworach Europy nigdy nie będą nas traktować poważnie, dopóki nie będziemy mieli stolicy równej ich wspaniałości."
 emp_bav_splendour_title: "Monarszy splendor"
 emp_bav_splendour_desc: "Im bardziej hołdujemy przepychowi i luksusowi, tym bardziej inni władcy Europy czynią to samo. Nie możemy pozwolić, aby inni nas wyprzedzili, jeśli chodzi o wspaniałość naszych władców i chwałę naszego narodu."
 emp_bav_cultural_dominance_title: "Boarisch als Leitkultur"
 emp_bav_cultural_dominance_desc: "Kultura bawarska musi zająć pierwsze miejsce wśród niemieckich królestw, a nasz piękny dialekt musi stać się lingua franca w całych Niemczech."
 emp_bav_cultural_dominance_trigger_tooltip: "Wszystkie prowincje w regionach Niemiec Północnych i Niemiec Południowych są posiadane przez państwo §Y[Root.GetName]§! lub nie mają wyższego poziomu rozwoju niż nasza stolica, prowincja §Y[Root.Capital.GetName]§!."
 emp_bav_standing_army_title: "Utwórz stałą armię"
 emp_bav_standing_army_desc: "Rosnące zapotrzebowanie na nasze wojsko w celu obrony i powiększania naszych terytoriów wymaga utworzenia silnej, stałej armii, narodowej siły Bawarii, która może działać samodzielnie bez konieczności uzupełniania jej przez zawodnych najemników."
 emp_bav_sway_cologne_title: "Wpłyń na Kolonię"
 emp_bav_sway_cologne_desc: "Wiążąc niezależny Elektorat Kolonii z naszą władzą - w ten czy inny sposób - usuniemy jeszcze jedną przeszkodę w dojściu do władzy w Niemczech."
 emp_bav_sway_cologne_effect_tooltip: "Jeżeli misję ukończymy poprzez uzależnienie §YKolonii§! od naszego państwa:"
 emp_bav_sway_cologne_effect_tooltip2: "\nJeżeli misję ukończymy bez uzależnienia §YKolonii§! od naszego państwa:"
 emp_bav_tame_brandenburg_title: "Poskrom Brandenburgię"
 emp_bav_tame_brandenburg_desc: "Brandenburgia to kolejne z terytoriów należących niegdyś do rodu Wittelsbachów. Jednak młodzi Hohenzollernowie mają ambicje stworzenia własnego potężnego państwa w północnych Niemczech. Powinniśmy zadbać o to, aby te ambicje nie pozostały jedynie w sferze marzeń."
 emp_bav_netherlands_title: "Bawarskie Niderlandy"
 emp_bav_netherlands_desc: "Bawaria ma bezsprzecznie roszczenia do różnych terytoriów w Niderlandach. Teraz, gdy przywróciliśmy bawarską potęgę do dawnej świetności, wydaje się słuszne, aby odnowić te roszczenia i przywrócić kontrolę nad tym dobrze prosperującym regionem."
 theocracy.1.desc.KOL_secondogeniture_of_BAV: "Jako iż nie mamy następcy tronu, państwo [Root.GovernmentName] [Root.GetAdjective] wysłało do nas arystokratę z dynastii [probably_bavaria.Monarch.Dynasty.GetName] na pozycję naszego następcy."
 theocracy.1.i: "Niech tak będzie."
 new_flavour_bav.10.t: "Czy przekazać Bawarii tytuł elektorski Palatynatu?"
 new_flavour_bav.10.d: "Po zjednoczeniu posiadłości Domu Wittelsbach w osobie [From.Monarch.GetRulerGen] z [From.GetGovNameGen] [From.GetAdjective], apeluje [From.Monarch.GetSheHe] do nas o zapewnienie poszanowania [From.Monarch.GetHerHis] praw do Elektoratu. Jako prawowit[From.Monarch.GetAY] władc[From.Monarch.GetZyniA] zarówno [From.GetGovNameGen] [From.GetAdjective] jak i Palatynatu, prosi, zgodnie z rzekomymi historycznymi roszczeniami [From.GetGovNameGen] [From.GetAdjective] do Elektoratu (które [From.Monarch.GetSheHe] szeroko rozgłasza), aby Elektorat został przeniesiony z Palatynatu na [From.GovernmentName] [From.GetAdjective]."
 new_flavour_bav.10.d.bav: "Po dodaniu do naszej listy tytułów panowania nad hrabstwem Palatynatu Elektorskiego, wydawałoby się, że jest to idealny moment, aby zażądać dla siebie elektoratu, który posiadała palatyńska gałąź rodu Wittelsbachów."
 new_flavour_bav.10.a: "Niech żyje elektor [From.GetAdjective]!"
 new_flavour_bav.10.a2: "Niech będzie zrobione."
 new_flavour_bav.10.b: "Niech elektorat pozostanie w rękach Palatynatu."
 new_flavour_bav.10.b2: "Nie potrzebujemy tytułu elektora."
 new_flavour_bav.11.t: "Kolońska sekundogenitura"
 new_flavour_bav.11.d: "Elektorat Kolonii znalazł się pod naszą kontrolą. Aby jak najlepiej rozwinąć nasze ambicje w Świętym Cesarstwie Rzymskim, opracowano schemat, w którym członek rodu [Root.Monarch.Dynasty.GetName], który nie jest w kolejce do sukcesji po [Root.GovernmentName] z [Root.GetGovNameGen] [Root.GetAdjective] zostanie wysłany, aby zająć pozycję [KOL.GetAdjective] [KOL.Monarch.GetTitle], aby upewnić się, że nasze interesy są reprezentowane w [KOL.GovernmentName]."
 new_flavour_bav.11.a: "Niech tak się stanie."
 new_flavour_bav.11.A.tooltip: "Zostanie ustanowiona §YKolońska sekundogenitura§!:\nPrzyszli władcy [KOL.GetAdjective] zostaną przejęci od dynastii [Root.GetAdjective], tak długo jak:\n §Y[Root.GetName]§! pozostaje §Ymonarchą§! z dynastią rządzącą.\n §YKolonia§! pozostaje poddanym państwa §Y[Root.GetName]§!.\n §YKolonia§! pozostaje §Yteokracją§!.\n"
 new_flavour_bav.11.b: "Lepiej nie."
 bav_rising_power: "Bawaria ponownie zjednoczona"
 desc_bav_rising_power: "Nasza silna, świeżo zjednoczona Bawaria posiada mocną podstawę, która pozwoli nam rosnąć w siłę w dążeniu do stania się pierwszorzędną potęgą w Świętym Cesarstwie Rzymskim."
 bav_professional_army: "Profesjonalne wojsko Bawarii"
 desc_bav_professional_army: "Stworzyliśmy dobrze wyszkoloną, profesjonalną armię, która jest w stanie bronić i poszerzać granice Bawarii."
 bav_professional_army2: "Profesjonalne wojsko Bawarii"
 desc_bav_professional_army2: "Stworzyliśmy dobrze wyszkoloną, profesjonalną armię, która jest w stanie bronić i poszerzać granice Bawarii."
 bav_boarisch_als_leitkultur: "Bawarska dominacja kulturowa"
 desc_bav_boarisch_als_leitkultur: "Bawaria stała się centrum aktywności gospodarczej i kultury elitarnej w Niemczech."
 bav_italian_coast: "Nadmorska Bawaria"
 desc_bav_italian_coast: "Poprzez zajęcie części wybrzeża Adriatyku Bawaria spełniła w końcu jedno z najskrytszych pragnień swojego narodu i stała się potencjalną potęgą morską."
 bav_splendorous_bavaria: "Splendor Bawarii"
 desc_bav_splendorous_bavaria: "W miarę jak rośnie nasz splendor, władcy Europy zauważają naszą wschodzącą gwiazdę."
 bav_established_oktoberfest: "Oktoberfest"
 desc_bav_established_oktoberfest: "Ustanowiliśmy coroczny festiwal ku chwale naszego narodu, sławiący wspaniałość jego władców, uczciwość jego ludzi, szybkość jego koni i smak jego piwa."
 bav_tamed_brandenburg: "Poskromiono Brandenburgię"
 desc_bav_tamed_brandenburg: "Zlikwidowawszy zagrożenie ze strony Brandenburgii, możemy teraz wykorzystać ich wysoko wykwalifikowanych mistrzów i strategów wojskowych, aby poprawić jakość naszej własnej armii."
 bav_piety_shown: "Pobożność religijna"
 desc_bav_piety_shown: "Religijna pobożność i wierność są kamieniami węgielnymi naszego wielkiego narodu."
 bav_piety_spread: "Naród prozelityczny"
 desc_bav_piety_spread: "Poprzez nasze przykładne życie i zdecydowane działania sprawiliśmy, że nasi sąsiedzi szukają u nas wskazówek w sprawach wiary."
 opinion_bav_center_of_religion: "Wskaż drogę prawdziwej wiary"
 opinion_bav_repealed_electorate: "Unieważniono nasz elektorat"
 opinion_bav_gave_electorate: "Przyznano nam status elektora"
 opinion_bav_refused_to_transfer_electorate: "Odmówiona nam statusu elektora"
 bav_bavarian_netherlands: "Bawarskie Niderlandy"
 desc_bav_bavarian_netherlands: "Niderlandzkie miasta portowe i handlarze należą teraz do nas, co pozwala nam przekierowywać ich bogactwo do naszego własnego skarbca."
 emp_sax_conquer_brunswick_title: "Ekspansja na zachód"
 emp_sax_conquer_brunswick_desc: "Nasi sąsiedzi, Welfowie z Brunszwiku, Askańczycy z Anhaltu i biskupi z Magdeburga rzuciliby się na nas przy najmniejszym przejawie słabości. Powinni stać się częścią naszego [Root.GovernmentName]."
 emp_sax_reclaim_ancestral_lands_title: "Odzyskaj ziemie ojców"
 emp_sax_reclaim_ancestral_lands_desc: "Serce byłego Księstwa Saksonii znajdowało się w Westfalii i Dolnej Saksonii. Odzyskanie naszych ziem naszych ojców to godny cel, który powinien zrealizować ambitny [Root.Monarch.GetTitle] [Root.GetAdjective]."
 emp_sax_defragment_title: "Uniknij podziałów"
 emp_sax_defragment_desc: "Ród Wettynów jest często rozdzierany przez podziały i fragmentację w wyniku sporów o sukcesję. Jeśli mamy pozostać znaczącą siłą w Świętym Cesarstwie Rzymskim, musimy upewnić się, że tego unikniemy i utrzymamy jedność ziem saksońskich."
 emp_sax_conquer_brandenburg_title: "Podbij Brandenburgię"
 emp_sax_conquer_brandenburg_desc: "Hohenzollernowie z Brandenburgii pragną utworzyć potężne państwo w północnych Niemczech. Musimy dopilnować, żeby ich marzenie nie stało się rzeczywistością, aby nasze ziemie nie były chętnie odwiedzane przez ich armie."
 emp_sax_conquer_erzgebirge_title: "Roszczenia do pogranicza"
 emp_sax_conquer_erzgebirge_desc: "Potężne Królestwo Czech zagraża nam swoją obecnością u naszych granic. Jednakże łużyckie i rudawskie pogranicze przyciągnęło wielu osadników z Saksonii i innych części Niemiec. Jeśli uda nam się pokonać Czechów, z pewnością chętnie zaakceptują nowych panów z [Root.GetAdjective]."
 emp_sax_conquer_silesia_title: "Zajmij Śląsk"
 emp_sax_conquer_silesia_desc: "Bogate ziemie Śląska, które podobnie jak Łużyce są atrakcyjnym celem dla saksońskich osadników, stoją między nami a dalszą ekspansją na wschód. Powinniśmy starać się podbić ten strategicznie ważny obszar."
 emp_sax_union_with_poland_title: "Król Polski"
 emp_sax_union_with_poland_desc: "Powinniśmy ugruntować naszą rosnącą potęgę, wiążąc jedno z naszych największych potencjalnych zagrożeń z nami jako posiadaczem [Root.GetAdjective] [Root.Monarch.GetTitle]."
 emp_sax_conquer_franconia_title: "Podbij Frankonię"
 emp_sax_conquer_franconia_desc: "Od dawna uważamy Coburg za naszą bazę we Frankonii. Być może nadszedł czas, abyśmy wykorzystali go jako bazę wypadową do poszerzenia naszych posiadłości w tym regionie."
 emp_sax_found_wittenberg_title: "Uniwersytet w Wittenberdze"
 emp_sax_found_wittenberg_desc: "Musimy stworzyć centrum nauki, w którym będziemy mogli kształcić przyszłych teologów, prawników i medyków, a także przyciągnąć wiodące umysły z Niemiec, aby służyły ku chwale naszego [Root.GetGovNameGen]."
 emp_sax_victor_for_faith_title: "Prawdziwa wiara zwycięży!"
 emp_sax_victor_for_faith_desc: "Dla dobra Europy musimy zadbać o to, abyśmy wygrali wojny reformacyjne o naszą wiarę [Root.Religion.GetName]."
 emp_sax_victor_for_faith_religious_wars_happened_tooltip: "Wojny lig religijnych dobiegły końca."
 hre_religion_is_root_tooltip: "§Y[Root.Religion.GetName]§! jest dominującą wiarą w Świętym Cesarstwie Rzymskim."
 emp_sax_weimar_classicism_title: "Klasyka weimarska"
 emp_sax_weimar_classicism_desc: "Nasze miasta muszą stać się znanymi ośrodkami kultury elitarnej w Niemczech."
 emp_sax_spread_wettins_title: "[Root.GetSpreadDynastyOrFallbackMissionTitle]"
 emp_mission_spread_dynasty_title: "Rozszerz ród [Root.Monarch.Dynasty.GetName]"
 emp_mission_spread_nodynasty_title: "Rozprzestrzeń nasze wpływy"
 emp_sax_spread_wettins_desc: "[Root.GetSAXSpreadDynastyOrFallbackMissionDesc]"
 emp_sax_mission_spread_dynasty_desc: "Ród [Root.Monarch.Dynastia.GetName] ma długą i znamienitą historię. Aby zabezpieczyć prestiż i wpływy, które zgromadziliśmy w przyszłości, powinniśmy starać się o kolejne tytuły dla naszego Domu i upewnić się, że [Root.Monarch.Dynasty.GetName] zajmują jak najwięcej tronów."
 emp_sax_mission_spread_nodynasty_desc: "Nasza siła leży nie tyle w naszym wojsku, co w naszej dyplomacji. Musimy wzmocnić nasze relacje z tymi, których można skłonić do postrzegania świata w taki sam sposób jak my."
 emp_sax_become_king_title: "Zostań królem"
 emp_sax_become_king_desc: "[Root.GetName] nigdy nie będzie postrzegana jako coś więcej niż państwo drugiej kategorii, dopóki nie będziemy w stanie ubiegać się o tytuł króla."
 emp_sax_manufacturing_title: "Saksońska produkcja"
 emp_sax_manufacturing_desc: "Saksonia ma wiele zasobów naturalnych. Przekształcając te surowce w gotowe produkty, będziemy w stanie znacznie zwiększyć dobrobyt naszego kraju."
 emp_sax_meissen_porcelain_title: "Porcelana z Miśni"
 emp_sax_meissen_porcelain_desc: "Europa od dawna tradycyjnie importuje porcelanę z Dalekiego Wschodu. Poznając tajniki produkcji porcelany i zakładając warsztaty produkcyjne na naszych ziemiach, możemy zdobyć dla siebie znaczne bogactwo."
 emp_sax_meissen_porcelain_trigger_tooltip: "Miało miejsce wydarzenie §Y'europejscy handlarze w Chinach'§!."
 emp_sax_industrialisation_title: "Industrializacja Saksonii"
 emp_sax_industrialisation_desc: "Musimy zadbać o to, aby nasza siła produkcyjna stale rosła, żeby Saksonia mogła stać się jednym z ośrodków przemysłowych Niemiec."
 sax_saxon_settlement: "Saksońskie osady"
 desc_sax_saxon_settlement: "Na tym obszarze osiedliła już się duża liczba Saksończyków."
 sax_saxon_ambition: "Saksońskie ambicje"
 desc_sax_saxon_ambition: "Zjednoczyliśmy ponownie dawne terytoria Księstwa Saksonii. Teraz nic nie stoi na przeszkodzie, aby zdominować północne Niemcy."
 sax_defeated_brandenburg: "Zdobywca Brandenburgii"
 desc_sax_defeated_brandenburg: "Po upokorzeniu Brandenburgii, jesteśmy teraz w stanie wykorzystać ich wysoko wykwalifikowanych instruktorów musztry i strategów wojskowych, aby poprawić jakość naszej armii."
 sax_king_of_poland: "Władca Polski"
 desc_sax_king_of_poland: "Nie jesteśmy już drugorzędnym krajem: teraz Saksonia rządzi Polską!"
 sax_meissen_porcellan_province_mod: "Produkcja miśnieńskiej porcelany"
 desc_sax_meissen_porcellan_province_mod: "Nasi pomysłowi przedsiębiorcy założyli fabrykę porcelany - pierwszą tego rodzaju w Europie - w Miśni."
 sax_meissen_development: "Inwestycja w Miśni"
 desc_sax_meissen_development: "Miśnia i okolice przeżywają znaczne ożywienie inwestycyjne."
 sax_wittenberg_uni: "Uniwersytet w Wittenberdze"
 desc_sax_wittenberg_uni: "Nasz nowy uniwersytet w Wittenberdze bez wątpienia zwiększy nasz prestiż i pozycję moralną wśród książąt niemieckich."
 sax_victory_of_faith: "Zwycięstwo wiary"
 desc_sax_victory_of_faith: "Odnieśliśmy wspaniałe zwycięstwo ku chwale naszej wiary, wypleniając heretyckie wierzenia, gdziekolwiek się pojawią."
 sax_weimar_classicism: "Klasyka weimarska"
 desc_sax_weimar_classicism: "Wielu wybitnych artystów i literatów założyło swoje siedziby w naszych miastach."
 sax_production_prospering: "Prosperująca produkcja"
 desc_sax_production_prospering: "Uprzemysłowienie nabiera tempa w Saksonii, a nasze manufaktury osiągają bezprecedensowo wysokie zyski."
 sax_holder_of_duchies: "Władca księstw"
 desc_sax_holder_of_duchies: "Zjednoczyliśmy Księstwo Frankonii z Księstwem Saksonii i Turyngii. Obecnie niewielu rzeczywiście wątpi w naszą waleczność jako jednej z rosnących potęg Niemiec."
 sax_many_thrones: "Sieć dynastyczna"
 desc_sax_many_thrones: "Nasza dynastia rozprzestrzeniła się w całej Europie i dała nam dużą sieć rodów, na których możemy polegać, aby osiągnąć nasze cele dyplomatyczne."
 sax_lots_of_influence: "Wpływy saskie"
 desc_sax_lots_of_influence: "Zbudowaliśmy znaczące wpływy w całej Europie. Obecnie istnieje wiele państw, które postrzegają świat mniej więcej tak jak my, co daje nam duże możliwości osiągania naszych celów dyplomatycznych."
 flavor_sax.3.name: "Lipsk prosperuje"
 flavor_sax.3.desc: "Lipsk stał się dużym miastem handlowym, przyciągającym rzemieślników i kupców z całego Świętego Cesarstwa Rzymskiego. Ci imigranci przynoszą ze sobą znaczne bogactwo i nowe zawody: Ostatnio Konrad Kachelofen, jeden z najwybitniejszych drukarzy w Norymberdze, przeprowadził się do miasta i założył w nim dużą drukarnię. To z pewnością doprowadzi do wielkiego dobrobytu miasta w przyszłości i wyższych dochodów z podatków w przyszłości."
 flavor_sax.3.A: "Doskonale."
 emp_mlo_subdue_genoa_title: "Ujarzmij Genuę"
 emp_mlo_subdue_genoa_desc: "Złoty wiek Genui minął - teraz wreszcie nadszedł czas, aby zdobyć przewagę nad naszym odwiecznym wrogiem. Nasza siła byłaby znacznie większa, gdybyśmy mogli wchłonąć ich miasto do naszego rozwijającego się państwa."
 emp_mlo_emilia_romagna_title: "Ekspansja na południe"
 emp_mlo_emilia_romagna_desc: "Poprzedni książęta Mediolanu Visconti stoczyli wiele wojen, aby kontrolować pogranicze Emilii-Romanii. Jednak wojny te okazały się ostatecznie daremne, a miasta Ferrara i Bolonia wciąż się nam przeciwstawiają. Musimy przełamać ich opór."
 emp_mlo_tuscany_title: "Podbij Toskanię"
 emp_mlo_tuscany_desc: "Miasta Toskanii od dawna kusiły bogactwem książęta Mediolanu. Jeśli uda nam się włączyć je do naszego państwa, będziemy na dobrej drodze do osiągnięcia celu, jakim jest utworzenie potężnego państwa w północnych Włoszech."
 emp_mlo_reclaim_ducal_lands_title: "Odzyskaj ziemie książęce"
 emp_mlo_reclaim_ducal_lands_desc: "Wenecja zajmuje Brescię i Bergamo, miasta, które z mocy prawa powinny należeć do Mediolanu, jako że zostały włączone w granice księstwa określone w dyplomie cesarskim z 1395 roku. Jeśli mamy powrócić do dawnej siły, musimy odzyskać te miasta!"
 emp_mlo_terra_firma_title: "Zajmij suchy ląd"
 emp_mlo_terra_firma_desc: "Wenecja od dawna była naszym rywalem w walce o kontrolę nad północnymi Włochami. Podbijając Terra Firma, możemy zredukować posiadłości Wenecji w północnych Włoszech do samego miasta i raz na zawsze zapewnić sobie nad nim przewagę!"
 emp_mlo_terra_firma_trigger_tooltip: "§YWenecja§! nie posiada żadnych prowincji z wyjątkiem §YWenecji§! w §YPółnocnych włoszech§!, ani żadnych §Yłacińskich§! prowincji w §YKrainie czy Tyrolu§!."
 emp_mlo_kingdom_of_lombardy_title: "Królestwo Lombardii"
 emp_mlo_kingdom_of_lombardy_desc: "W wiekach XII i XIII Lombardia była zjednoczona jako sojusz miast znany pod nazwą Ligi Lombardzkiej. Z czasem jednak ta liga się rozpadła, pozostawiając po sobie Mediolan i kilka innych państw-miast. Powinniśmy odtworzyć Ligę, tym razem pod rządami Mediolanu, ze stałym przywództwem państwa mediolańskiego i zapewnić jej jedność jako prawdziwego państwa Lombardii."
 string_republic: "Republika"
 string_kingdom: "Królestwo"
 string_theocratic_state: "Państwo teokratyczne"
 emp_mlo_union_with_naples_title: "Unia z Neapolem"
 emp_mlo_union_with_naples_desc: "Podobnie jak inne wielkie mocarstwa, udało nam się znaleźć niejasny pretekst dla naszych roszczeń do Królestwa Neapolu. Egzekwowanie tego roszczenia pozwoliłoby nam zjednoczyć większą część Włoch pod naszym panowaniem."
 emp_mlo_destroy_austria_title: "Zniszcz Austrię"
 emp_mlo_destroy_austria_desc: "Zbyt długo północne Włochy żyły w cieniu cesarzy austriackich. Musimy sprawić, by Włochy na stałe pozostały bezpieczne od ich zagrożenia."
 emp_mlo_friends_in_high_places_title: "Wpływowi przyjaciele"
 emp_mlo_friends_in_high_places_desc: "Nagroda w postaci Mediolanu jest kusząca dla wielkich mocarstw Europy, które często spoglądały łakomym okiem na bogaty, ale podzielony Półwysep Apeniński. Jeśli mamy przetrwać i prosperować, będziemy potrzebować potężnych patronów, którzy będą gotowi i zdolni odeprzeć niedoszłych zdobywców."
 emp_mlo_friends_in_high_places_trigger_tooltip: "kraje:\nJedno z poniższych musi być prawdziwe:\nSprzymierzony z państwem §Y[Root.GetName]§!. \nJest poddanym państwa §Y[Root.GetName]§!."
 emp_mlo_secure_rule_title: "Zabezpiecz nasze rządy"
 emp_mlo_secure_rule_desc: "Zbuntowani poddani, gniewni cesarze i mściwi papieże zagrażają przetrwaniu Mediolańskiemu [Root.GovernmentName]. Musimy zdobyć powszechną aprobatę i uznanie, jeśli chcemy zapewnić przetrwanie naszego państwa."
 emp_mlo_secure_rule_effect_tooltip: "Wszystkie państwa posiadające Casus Belli typu §YOdbudowa Unii§! przeciwko Mediolanowi utracą to Casus Belli."
 emp_mlo_swiss_mercs_title: "Wykorzystaj Szwajcarów"
 emp_mlo_swiss_mercs_desc: "Szwajcarscy najemnicy byli ostoją wielu armii wykorzystywanych w konfliktach po obu stronach Alp. Jeśli zapewnimy sobie do nich preferencyjny dostęp, zyskamy znaczącą przewagę nad naszymi wrogami."
 emp_mlo_swiss_mercs_own_swiss_province_tooltip: "Państwo §Y[Root.GetName]§! posiada co najmniej jedną prowincję w §YSzwajcarii§!."
 emp_mlo_fortify_alps_title: "Ufortyfikuj przełęcze"
 emp_mlo_fortify_alps_desc: "Położenie na północy Włoch sprawia, że jesteśmy dobrze przygotowani do wykorzystania Alp jako dodatkowego muru obronnego. Powinniśmy skierować naszą pomysłową energię na umocnienie terenów przygranicznych i upewnienie się, że nasze terytorium nie będzie łatwym celem do podboju."
 emp_mlo_fortify_alps_effects_tooltip: "Fortyfikacje posiadane przez państwo §Y[Root.GetName]§! położone w każdej z §Ywyszczególnionych prowincji§! zostaną §Gulepszone§!."
 emp_mlo_alpine_wall_title: "Wał alpejski"
 emp_mlo_alpine_wall_desc: "Północne Włochy były narażone na inwazje obcych od tak dawna, jak długo żyli tu ludzie. Jedynie naturalna bariera Alp i militarna sprawność rdzennych mieszkańców stoją na przeszkodzie obcej dominacji. Musimy zapewnić, że ta wolność pozostanie nienaruszona."
 emp_mlo_alpine_wall_trigger_tooltip: "Żadna prowincja w §Ypółnocnych Włoszech§! nie spełnia żadnego z niżej wymienionych warunków:\n Prowincja jest posiadana przez państwo będące w innej grupie kulturowej niż §Yłacińska§!.\n Prowincja jest posiadana przez państwo zależne od państwa będącego w innej grupie kulturowej niż §Yłacińska§!."
 emp_mlo_italian_freedom_title: "Włoska wolność"
 emp_mlo_italian_freedom_desc: "Włochy już zbyt długo cierpią z powodu upokorzeń związanych z obcą ingerencją w ich sprawy. Nadszedł czas, by raz na zawsze położyć kres obcej dominacji."
 emp_mlo_italian_freedom_trigger_tooltip: "Posiadacze żadnej prowincji we §YWłoszech§! nie spełniają żadnego z niżej wymienionych warunków:\n Kultura państwowa nie należy do grupy §Yłacińskiej§!.\n Państwo jest zależne od państwa będącego w innej grupie kulturowej niż §Yłacińska§!."
 emp_mlo_renaissance_city_title: "Renesansowe miasto"
 emp_mlo_renaissance_city_desc: "Mediolan musi doświadczyć odrodzenia swojego bogactwa i kultury, jeśli chce mieć pewność, że nie spożył ostatniej wieczerzy jako wolny i niepodległy naród."
 emp_mlo_develop_po_valley_title: "Rozwiń Lombardię"
 emp_mlo_develop_po_valley_desc: "Lombardia już teraz jest jedną z najbogatszych części Europy, nie wspominając już o Włoszech. Stosując nowe praktyki produkcyjne w naszej ojczyźnie, możemy stać się prawdziwą potęgą gospodarczą."
 emp_mlo_italian_riches_title: "Bogactwo Włoch"
 emp_mlo_italian_riches_desc: "Bogactwa Włoch sprawiają, że są one cennym celem dla tych, którzy chcą poszerzyć swoją władzę. W naszych rękach ułatwiłoby nam to drogę do stania się jedną z największych potęg Europy."
 emp_mlo_italian_riches_effect_tooltip: "Każda prowincja o kulturze §Ylombardzkiej§! nie odczuwająca separatyzmu otrzymuje §Y1§! punkt rozwoju."
 emp_mlo_all_roads_lead_to_milan_title: "Wsz. drogi pr. do Mediolanu"
 emp_mlo_all_roads_lead_to_milan_desc: "Mediolan jest tak samo stary i ma prawie tak samo znamienitą historię jak Rzym. Teraz, w tym nowym wieku, który może być świadkiem odrodzenia włoskiej kultury i potęgi, mamy możliwość domagać się dla siebie prymatu we Włoszech, którym Rzym cieszył się wiele lat temu. "
 emp_mlo_control_the_vatican_title: "Kontroluj Watykan"
 emp_mlo_control_the_vatican_desc: "Papież jest nie tylko moralną siłą w chrześcijaństwie - ma on również znaczącą bezpośrednią władzę nad dużymi terytoriami we Włoszech. Jako taki stanowiłby strasznego wroga. W ten czy inny sposób musimy zapewnić, że nie wykorzysta on swoich znacznych zasobów przeciwko naszym interesom."
 emp_mlo_milan_victorious_title: "Zwycięski Mediolan"
 emp_mlo_milan_victorious_desc: "Nasze armie będą triumfować nad wszystkimi, którzy mogą się nam przeciwstawić, przynosząc chwałę naszemu narodowi z każdą nową potyczką!"
 emp_mlo_milan_victorious_tooltip: "Nie istnieje państwo, które spełnia wszystkie poniższe wymagania:\n Państwo sąsiaduje z państwem §Y[Root.GetName]§! lub posiada swoją stolicę w regionie §YFrancji§!, §YNiemiec Południowych§!, §YPółwyspu Iberyjskiego§!, §YWłoch§! lub §YBałkanów§!.\n Państwo posiada armię większą lub równą w stosunku do armii państwa §Y[Root.GetName]§!.\n Państwo nie zostało pokonane na wojnie przez państwo §Y[Root.GetName]§! w okresie ostatnich §Y100§! lat."
 emp_mlo_university_rules_title: "[Root.GetMLOMissionUniversityRulesTitle]"
 emp_mlo_university_rules_desc: "[Root.GetMLOMissionUniversityRulesDesc]"
 emp_mlo_university_rules_monarchy_title: "Szkoły prawa"
 emp_mlo_university_rules_monarchy_desc: "Wspierając rozwój uczelni prawniczych, będziemy w stanie zapewnić sobie stały dopływ wielkich myślicieli."
 emp_mlo_university_rules_democracy_title: "Rządy oświeconych"
 emp_mlo_university_rules_democracy_desc: "Uczelnie prawnicze są bastionem naszej wspaniałej republiki. Musimy wspierać ich rozwój i upewnić się, że nadal będą dostarczać nam wiodących obywateli, którzy będą chronić naszą wolność teraz i w przyszłości."
 emp_mlo_ambrosian_republic_mission_title: "Republikańskie aspiracje"
 emp_mlo_ambrosian_republic_mission_desc: "Są w naszym państwie tacy, którzy woleliby rządy republikańskie od autokratycznych rządów książąt. Musimy rozstrzygnąć te spory w naszych szeregach - czy Mediolan ma być Republiką czy Księstwem?"
 emp_mlo_ambrosian_republic_mission_trigger_tooltip: "Rozwiązał katastrofę  §Y'Złotej Republiki Ambrozjańskej'§!."
 new_flavour_mlo.15.name: "Jedwab w [Root.GetName]?"
 new_flavour_mlo.15.desc: "[Root.Owner.mlo_silk_guy.GetName], jeden z prominentnych posiadaczy ziemskich w [Root.GetName], kwitnącym mieście w północnej Lombardii, zdołał pozyskać jedwabniki i wprowadzić je do swoich posiadłości, wraz z wystarczającą ilością drzew morwowych, aby móc utrzymać dużą ich populację. Teraz prosi o pożyczkę na budowę fabryki w [Root.GetCapitalName], w której będzie można produkować i eksportować duże ilości precyzyjnie tkanego jedwabiu - inwestycja ta, jak twierdzi, przyniesie okolicy wielki dobrobyt."
 new_flavour_mlo.15.a: "Daj mu to, czego potrzebuje."
 new_flavour_mlo.15.b: "Powinniśmy skierować jego pomysłowość w innym kierunku."
 mlo_milan_victorious_modifier: "Zwycięski Mediolan"
 desc_mlo_milan_victorious_modifier: "Nasze armie odnoszą triumfy w całej Europie."
 mlo_taken_genoa: "Integracja Genui"
 mlo_ascendant_force: "Dominujący Mediolan"
 desc_mlo_ascendant_force: "Po upadku Habsburgów Mediolan ma szansę stać się wielką potęgą."
 mlo_has_friends: "Silni sojusznicy"
 desc_mlo_has_friends: "Dzięki zręcznej dyplomacji zapewniliśmy naszemu miastu bezpieczeństwo przed naszymi wrogami - w każdym razie w najbliższej przyszłości."
 mlo_successful_ambrosian_republic: "Za św. Ambrożego!"
 desc_mlo_successful_ambrosian_republic: "Złota Republika Ambrozjańska przezwyciężyła trudności pierwszych lat swojego istnienia i stała się kwitnącym państwem i bastionem wolności w północnych Włoszech."
 mlo_law_courts_and_university: "Sądy i uniwersytety Lombardii"
 desc_mlo_law_courts_and_university: "Wielkie uczelnie prawnicze i uniwersytety w naszych miastach kwitną, zapewniając nam stały dopływ wielkich myślicieli, którzy gwarantują nam dalszy dobrobyt w przyszłości."
 mlo_expanded_fortifications: "Rozbudowane fortyfikacje"
 desc_mlo_expanded_fortifications: "Nasi innowacyjni inżynierowie wojskowi dodali różne ulepszenia do fortec w tej prowincji, stanowiąc teraz główne przeszkody dla naszych wrogów."
 mlo_alpine_fortifications: "Alpejskie fortyfikacje"
 desc_mlo_alpine_fortifications: "Nasi innowacyjni inżynierowie wojskowi dodali różne ulepszenia do naszych twierdz, stanowiąc teraz główne przeszkody dla naszych wrogów."
 mlo_lombard_renaissance: "Lombardzki renesans"
 desc_mlo_lombard_renaissance: "Renesans przyniósł naszemu państwu nową epokę dobrobytu."
 mlo_controls_pope: "Il Nostro Papa"
 desc_mlo_controls_pope: "Sprawiliśmy, że papież, nasz duchowy przywódca, użyje dostępnych mu środków, aby służyć naszym interesom."
 mlo_controls_pope_heretic: "Kontrola nad heretyckim papieżem"
 desc_mlo_controls_pope_heretic: "Papież, niegdyś dumny i arogancki władca Chrześcijaństwa, jest pod naszą kontrolą. Już nigdy więcej jego heretyckie przekonania nie zatrują Europy!"
 mlo_mona_lisa: "Mona Lisa"
 desc_mlo_mona_lisa: "Władcy Mediolanu nabyli obraz przedstawiający Monę Lisę i umieścili go w honorowym miejscu wśród eksponatów sztuki w swojej stolicy."
 mlo_unified_italy: "Zjednoczenie Włoch"
 desc_mlo_unified_italy: "Ludność z otwartymi ramionami wita nowych władców, przyjmując ideał zjednoczonych Włoch."
 mlo_the_swiss_mercs: "Szwajcarscy kapitanowie najemników"
 desc_mlo_the_swiss_mercs: "Udało nam się zawrzeć umowę ze szwajcarskimi kapitanami najemników, która daje nam preferencyjny dostęp do najlepszych sił najemnych w całej Europie."
 mlo_capital_of_italy: "Stolica Włoch"
 desc_mlo_capital_of_italy: "Mediolan jest dziś tak samo centralnym punktem Włoch, jak Rzym był nim w latach minionych."
 mlo_secure_state: "Zabezpiecz przywództwo"
 desc_mlo_secure_state: "Kwestie prawomocności naszych rządów zostały rozstrzygnięte. Teraz nie ma nikogo, kto kwestionowałby nasze prawa do podległego nam terytorium!"
 mlo_italian_freedom: "Strażnicy włoskiej wolności"
 desc_mlo_italian_freedom: "Mediolan jest bastionem chroniącym Półwysep Apeniński przed obcą dominacją, a zarazem ośrodkiem, z którego włoska potęga promieniuje na resztę Europy."
 mlo_dealt_with_republicanism: "Przywrócony porządek"
 desc_mlo_dealt_with_republicanism: "Przywróciliśmy porządek w Mediolanie po napięciach związanych ze sposobem sprawowania rządów."
 emp_sav_conquer_counties_title: "Zjednocz Piemont"
 emp_sav_conquer_counties_desc: "Posiadamy znaczne ziemie w Piemoncie, jednak hrabiowie Saluzzo i Montferratu wciąż cieszą się pewną niezależnością. Powinniśmy umocnić naszą władzę, podporządkowując ich bezpośrednio naszemu panowaniu."
 emp_sav_conquer_genoa_title: "Podbij Genuę"
 emp_sav_conquer_genoa_desc: "Dostęp do wybrzeża zapewnia nam wąski korytarz wokół Nicei, który łatwo odciąć. Jeśli przyłączymy Genuę i pozostałą część Ligurii, zagrożenie to zmaleje, a my zyskamy warunki, by stać się silną regionalną potęgą morską i handlową."
 emp_sav_conquer_sardinia_title: "Zjednoczenie z Sardynią"
 emp_sav_conquer_sardinia_desc: "Sardynia być może nie jest najbogatszym z terytoriów, ale Królestwo Sardynii to tytuł o ugruntowanej pozycji. Jeśli uda nam się odebrać wyspę - i jej tytuł królewski - będziemy mogli w końcu legalnie zaliczyć się do czołowych królestw Europy."
 emp_sav_conquer_sicily_title: "Zajmij Sycylię"
 emp_sav_conquer_sicily_desc: "Teraz, gdy kontrolujemy Sardynię, powinniśmy skierować nasz wzrok na Sycylię, wyspę o wspaniałej historii i sporych bogactwach. Zdobywając ją, moglibyśmy kontrolować sytuację na morzach na zachód od Włoch i mieć silną pozycję, by kierować bogactwa ze śródziemnomorskich szlaków handlowych wprost do naszej stolicy."
 emp_sav_conquer_lombardy_title: "Zajmij Lombardię"
 emp_sav_conquer_lombardy_desc: "Mediolańczycy reprezentują potężną i agresywną siłę na naszej wschodniej granicy. Jednak ich bogate miasta poddane są kapryśne i łatwo można by je skłonić do zrzucenia ich rządów - i być może zaakceptowania naszego przywództwa. "
 emp_sav_conquer_UPCI_title: "Parcie tu Toskanii"
 emp_sav_conquer_UPCI_desc: "Miastom-państwom Toskanii i Emilii-Romanii brakuje silnego przywództwa. Powinniśmy... przekonać je, by pozwoliły nam im to zapewnić."
 emp_sav_union_with_naples_title: "Unia z Neapolem"
 emp_sav_union_with_naples_desc: "Neapolitańczycy posiadają rozległe ziemie na południu Italii. Od zawsze stanowią cel wrogich przejęć ze strony obcych mocarstw. [Root.GetMissionSavUnionNaples]"
 GetMissionSavUnionNaples_italian: "Teraz czas upomnieć się o Królestwo dla Włochów i przyłączyć je do naszej rosnącej potęgi!"
 GetMissionSavUnionNaples_french: "Nie zrobimy wyjątku - czas powiększyć nasze udziały we Włoszech!"
 emp_sav_conquer_venetia_title: "Zajmij Wenecję"
 emp_sav_conquer_venetia_desc: "Wenecja jest klejnotem w koronie Włoch. Nasza kontrola nad północą nigdy nie będzie zabezpieczona, dopóki nie znajdzie się pod naszą władzą."
 emp_sav_integrate_geneva_title: "Zintegruj Genewę"
 emp_sav_integrate_geneva_desc: "Miasto Genewa cieszy się znaczną autonomią od naszych rządów. W istocie, jest silnie związane z rosnącą Konfederacją Szwajcarską i z pewnością skorzystałoby z szansy przyłączenia się do niej. Musimy wzmocnić naszą kontrolę nad nimi, aby nie próbowali uwolnić się spod naszej władzy."
 emp_sav_defeat_the_swiss_title: "Monter l'Escalade"
 emp_sav_defeat_the_swiss_desc: "Konfederacja Szwajcarska na naszej północnej granicy jest naturalnym wrogiem kraju [Root.GetName]. Są zaciekle niezależni, ich światopogląd różni się od naszego w wielu aspektach i często są źródłem heretyckich wierzeń. Dobrze byłoby ich wytępić."
 emp_sav_conquer_burgundy_title: "Podbij Burgundię"
 emp_sav_conquer_burgundy_desc: "Od północy zagrażają nam książęta Burgundii. Zmierzenie się z nimi i zjednoczoną Francją byłoby przerażającą perspektywą. Jeśli uda nam się przejąć burgundzkie terytoria w środkowej Francji, być może zdołamy pokonać Francuzów raz na zawsze."
 emp_sav_conquer_provence_title: "Zajmij Prowansję"
 emp_sav_conquer_provence_desc: "Książę Prowansji ma wielkie ambicje i rości sobie prawa do rozległych terytoriów. W rzeczywistości włada jednak jedynie niewielkim skrawkiem wybrzeża Morza Śródziemnego oraz kilkoma odizolowanymi eksklawami w innych częściach Francji. Wykorzystajmy jego słabość, by zjednoczyć prowansalskie ziemie południowej Francji z naszymi posiadłościami i zdominować obszary wokół Alp."
 emp_sav_conquer_occitania_title: "Sabaudzka Oksytania"
 emp_sav_conquer_occitania_desc: "W przeszłości byliśmy tylko małą enklawą we Francji, otoczoną przez silniejsze narody. Możemy to jednak zmienić. Nasz podbój Prowansji otworzył nam drogę do zdominowania południowej Francji. Musimy uchwycić nasze przeznaczenie!"
 emp_sav_conquer_occitania_effect_tooltip: "Wszystkie posiadane prowincje o kulturze §Yoksytańskiej§! otrzymają na §Y30 lat§! modyfikator §YSabaudzka Oksytania§!, przyznający:\n Lokalny niepokój: §G-2.00§!\n Miesięczna zmiana autonomii: §G-0.05§!"
 emp_sav_claim_france_title: "Roszczenia do Francji"
 emp_sav_claim_france_desc: "Królowie Francji często zwracali swoje chciwe oczy w stronę Sabaudii. Teraz, gdy nasze pozycje się odwróciły, nadszedł czas, abyśmy zajęli należne nam miejsce na ich tronie."
 emp_sav_claim_france_effect_tooltip: "Ranga rządów w §YSabaudii§! zostaje zmieniona na §YKrólestwo§!."
 emp_sav_have_a_friend_title: "Siła w liczbach"
 emp_sav_have_a_friend_desc: "Sabaudia jest kuszącą nagrodą dla niedoszłych zdobywców. Ważne jest, abyśmy zaprzyjaźnili się z jednym z wielkich mocarstw Europy i tym samym mieli jakieś zabezpieczenie przed zagranicznymi grabieżami."
 emp_sav_cover_your_bases_title: "Chroń nasze tyły"
 emp_sav_cover_your_bases_desc: "Historia naszego narodu pokazała, że wkładanie wszystkich owoców do jednego koszyka może łatwo okazać się zgubne. Musimy zadbać o to, by nasza sieć sojuszy była wystarczająca i tym samym zapewnić sobie silne wsparcie, bez względu na to, co się wydarzy."
 emp_sav_cover_your_bases_trigger_tooltip: " państw jest sojusznikami lub poddanymi §Y[Root.GetName]§!."
 emp_sav_fortify_all_title: "Alpejskie fortyfikacje"
 emp_sav_fortify_all_desc: "Naturalne ukształtowanie terenu Sabaudii i Piemontu — wyżyny po obu stronach Alp — zapewnia wiele dogodnych pozycji obronnych. Silnie ufortyfikujmy nasze ziemie, aby żaden agresor nie mógł łatwo nas podbić."
 emp_sav_self_reliant_army_title: "Wojskowa autonomia"
 emp_sav_self_reliant_army_desc: "Prawdziwą gwarancję przetrwania może dać nam tylko utworzenie dużej, stałej armii, zdolnej do podjęcia walki z każdym z naszych sąsiadów, który chciałby zagarnąć nasze ziemie."
 emp_sav_wealth_of_the_alps_title: "Rozwój Piemontu"
 emp_sav_wealth_of_the_alps_desc: "Nasze ziemie na wschód od Alp leżą na ważnym skrzyżowaniu szlaków łączących Genuę, Wenecję i Francję. Inwestycje w ich dobrobyt nie tylko zwiększą dochody naszego skarbca, lecz także pomogą nam stworzyć bazę do dalszej ekspansji we Włoszech."
 emp_sav_glorious_citadel_title: "Chwała [Root.Capital.GetName]!"
 emp_sav_glorious_citadel_desc: "Inni europejscy władcy rozbudowywali swoje stolice, wznosili pomniki swojej wielkości i budowali piękne pałace. Musimy zadbać o to, abyśmy nie pozostali w tyle w tej rywalizacji o splendor!"
 emp_sav_powerhouse_of_the_north_title: "[Root.GetSavPowerhouseNorthOrSouthTitle]"
 emp_sav_powerhouse_of_the_north_title2: "Potęga północy"
 emp_sav_powerhouse_of_the_south_title: "Potęga na południu"
 emp_sav_powerhouse_generic_title: "Potęga gospodarcza"
 emp_sav_powerhouse_of_the_north_desc: "Wprowadzając nowoczesne praktyki gospodarcze i inwestując w rozwój naszych miast, możemy przekształcić państwo w potęgę zdolną zdominować [Root.GetSavPowerhouseNorthOrSouthDesc]. Przywództwo polityczne z pewnością szybko podąży za gospodarczą supremacją."
 emp_sav_powerhouse_of_the_north_desc2: "Włochy"
 emp_sav_powerhouse_of_the_south_desc: "Francja"
 emp_sav_powerhouse_generic_desc: "nasi sąsiedzi"
 same_area_as_capital_trigger: "§YProwincja§! znajduje się na tym samym obszarze co §Y[Root.Capital.GetName]§!."
 emp_sav_order_of_saints_maurice_and_lazarus_title: "Centrum wiary"
 emp_sav_order_of_saints_maurice_and_lazarus_desc: "W tych dniach, kiedy nikczemne herezje rozprzestrzeniają się jak ogień, musimy uczynić z naszego narodu bastion czystości doktrynalnej i poprawnych praktyk religijnych."
 emp_sav_kingdom_of_cyprus_title: "Królestwo Cypru"
 emp_sav_kingdom_of_cyprus_desc: "Poprzez małżeństwo księcia Ludwika I z Anną de Lusignan, ród Sabaudzki ma prawo do Królestwa Cypru, ostatniego bastionu krzyżowców na Bliskim Wschodzie. Powinniśmy objąć nasz prawowity tron i stworzyć warunki umożliwiające nam rozpoczęcie odzyskiwania dla chrześcijaństwa utraconych terytoriów."
 sav_trade_in_venice: "Ród Sabaudzki w Wenecji"
 sav_tyrrhenian_sea: "Podbój wysp"
 desc_sav_tyrrhenian_sea: "Nasze posiadłości dominują obecnie nad Morzem Tyrreńskim. Musimy wykorzystać tę okazję i zapewnić dominację również naszym flotom."
 sav_garibaldis_handshake: "Jedność Włoch"
 desc_sav_garibaldis_handshake: "Wraz z naszym przystąpieniem do rządzenia Królestwem Neapolu, zjednoczyliśmy pod sobą dużą część Włoch. Obecnie istnieje szerokie poparcie społeczne dla naszych rządów we Włoszech, zarówno w naszych granicach, jak i poza nimi."
 sav_piedmont_lombardy: "Wielki Piemont"
 desc_sav_piedmont_lombardy: "Zjednoczyliśmy Lombardię z Piemontem i Ligurią, łącząc trzy terytoria o niezwykłym bogactwie. Cała nasza gospodarka jest w stanie czerpać z tego korzyści."
 sav_savoyard_occitania: "Sabaudzka Oksytania"
 desc_sav_savoyard_occitania: "Rozszerzyliśmy posiadłości rodu Sabaudzkiego o większą część południowej Francji. Podkreślając nasze francuskie powiązania, jesteśmy w stanie uzyskać większą akceptację wśród mieszkańców."
 sav_duke_of_burgundy: "Książę Burgundii"
 desc_sav_duke_of_burgundy: "Książęta Burgundii twierdzili, że są spadkobiercami Lothaira, syna Karola Wielkiego, który stał się potężnym królem rządzącym rozległym terytorium obejmującym Sabaudię. Teraz i my możemy rościć sobie prawo do jego dziedzictwa."
 sav_northern_italian_empire: "Wschodząca siła"
 desc_sav_northern_italian_empire: "Zjednoczyliśmy bogate ziemie północnych Włoch pod naszym panowaniem dzięki mieszance zręcznej dyplomacji i zdecydowanych działań wojskowych, umacniając naszą reputację jako wschodzącej siły w Europie."
 sav_king_of_france: "Król Francji"
 desc_sav_king_of_france: "Odwróciliśmy układ sił w stosunkach z francuskimi monarchami: z niepewnej pozycji półzależności awansowaliśmy do roli władców całej Francji."
 sav_prosperous_homelands: "Dostatnie ojczyzny"
 desc_sav_prosperous_homelands: "Nasze ojczyzny rozkwitają dzięki wzrostowi naszego kapitału."
 sav_holy_order_of_maurice_and_lazarus: "Order Świętych Maurycego i Łazarza"
 desc_sav_holy_order_of_maurice_and_lazarus: "Po połączeniu dwóch zakonów rycerskich — św. Maurycego i św. Łazarza, dawnego zakonu krzyżowców — dynastia sabaudzka objęła w nich pozycję przywódczą. Dzięki temu możemy korzystać ze znacznego autorytetu moralnego i religijnego, jaki wiąże się z tym urzędem."
 sav_holy_order_of_maurice_and_lazarus_fallback: "Order Świętych Maurycego i Łazarza"
 desc_sav_holy_order_of_maurice_and_lazarus_fallback: "Po połączeniu dwóch zakonów rycerskich — św. Maurycego i św. Łazarza, dawnego zakonu krzyżowców — dynastia sabaudzka objęła w nich pozycję przywódczą. Dzięki temu możemy korzystać ze znacznego autorytetu moralnego i religijnego, jaki wiąże się z tym urzędem."
 sav_alpine_powerhouse: "Alpejskie mocarstwo"
 desc_sav_alpine_powerhouse: "Naszą siłę oparliśmy na dobrobycie naszej ojczyzny. Przywództwo polityczne z pewnością szybko podąży za przewagą gospodarczą."
 sav_savoyard_diplomacy: "Zręczna dyplomacja"
 desc_sav_savoyard_diplomacy: "Nasza zręczna dyplomacja przyniosła nam potężnych sojuszników. Teraz musimy się tylko upewnić, że ich zatrzymamy... i że nie ulegniemy zbytnio ich wpływom."
 sav_savoyard_diplomacy2: "Sabaudzka dyplomacja"
 desc_sav_savoyard_diplomacy2: "Kunszt naszej służby dyplomatycznej jest znany daleko poza granicami kraju. Zdołaliśmy stworzyć rozległą sieć sojuszy, nie uzależniając się nadmiernie od żadnego stronnictwa. Nasza silna pozycja pozwala nam wręcz rozgrywać jedną stronę przeciwko drugiej, gdy spory między obcymi państwami mogą pomóc nam osiągnąć własne cele."
 sav_savoyard_army: "Stała armia sabaudzka"
 desc_sav_savoyard_army: "Nasza nowa armia stała jest jedną z najwspanialszych i najlepiej wyszkolonych w Europie. Z pewnością poprowadzi nas do chwały!"
 sav_king_of_cyprus: "Król Cypru"
 desc_sav_king_of_cyprus: "Zrealizowaliśmy nasze roszczenia do Królestwa Cypru i zdobyliśmy bazę we wschodniej części Morza Śródziemnego, z której możemy przeprowadzać kolejne wyprawy przeciwko niewiernym."
 new_flavour_sav.1.name: "Miasto Turyn"
 new_flavour_sav.1.desc: "W ostatnich latach Turyn coraz bardziej rozkwita i wielu uważa go za równie ważne centrum naszego [Root.GovernmentName] co [Root.Capital.GetName]. Oprócz prężnej gospodarki miasto łatwo obronić, zwłaszcza przed atakami z zachodniej strony Alp. Leży również bliżej naszych włoskich poddanych, którzy są kulturowo bliżsi klasom rządzącym niż mieszkańcy samej Sabaudii. Wielu otwarcie proponuje zatem przeniesienie stolicy do Turynu. Czy powinniśmy podjąć ten krok?"
 new_flavour_sav.1.A: "Turyn będzie naszą nową stolicą."
 new_flavour_sav.1.B: "Sercem naszego państwa jest [Root.Capital.GetName]."
 new_flavour_sav.2.name: "Order Świętych Maurycego i Łazarza"
 new_flavour_sav.2.desc1: "Jego Świątobliwość, papież [PAP.Monarch.GetName], ogłosił, że stary i cieszący się wielkim prestiżem Zakon św. Łazarza zostanie połączony z Zakonem św. Maurycego, na którego czele stoi [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Odtąd ten drugi będzie uznawany za jedynego prawowitego następcę zakonu łazarystów. Choć możemy chcieć przemilczeć dawną działalność łazarystów, polegającą na prowadzeniu szpitali dla trędowatych, połączenie z pewnością wzmocni nasz autorytet moralny i religijny."
 new_flavour_sav.2.desc2: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] uzyskał zgodę władz Zakonu św. Łazarza na połączenie go z Zakonem św. Maurycego, na którego czele stoi [Root.Monarch.GetSheHe]. Nowy Zakon Świętych Maurycego i Łazarza będzie odtąd uznawany za jedynego prawowitego następcę zakonu łazarystów. Choć możemy chcieć przemilczeć dawną działalność łazarystów, polegającą na prowadzeniu szpitali dla trędowatych, połączenie z pewnością wzmocni nasz autorytet moralny i religijny."
 new_flavour_sav.2.A: "Doskonale."
 emp_hab_austrian_netherlands_title: "Austriackie Niderlandy"
 emp_hab_austrian_netherlands_desc: "Na ziemiach holenderskich znajduje się wiele dobrze prosperujących miast. Jeśli uda nam się uczynić je naszymi, będziemy w stanie znacznie wzmocnić nasz skarbiec i tym samym sprawić, że zaspokoimy ambicje zamorskiego imperium."
 emp_hab_ostend_company_title: "Kompania Ostendzka"
 emp_hab_ostend_company_desc: " Inne europejskie mocarstwa stały się bajecznie bogate dzięki swoim kompaniom handlowym w koloniach. Teraz, gdy kontrolujemy Holandię, powinniśmy starać się im dorównać."
 emp_hab_ostend_company_effect_tooltip: "§YAustria§! otrzyma permanentne roszczenia terytorialne do wszystkich przybrzeżnych centrów handlowych o poziomie 1 lub wyższym w regionach §YIndii§! oraz §YIndonezji§!."
 emp_hab_ostend_company_trigger_tooltip: "Posiadaj co najmniej §Yjedną§! kompanię handlową."
 emp_hab_indian_trading_title: "Posiadłości w Indiach"
 emp_hab_indian_trading_desc: "Nasze imperium kolonialne nie będzie pełne, dopóki nie będzie posiadać znaczących posiadłości w Indiach oraz Indonezji."
 emp_hab_indian_trading_effect_tooltip: "Otrzymasz permanentne roszczenia terytorialne do wszystkich prowincji w regionach §YIndii§! oraz §YIndonezji§! sąsiadujących z prowincjami posiadanymi przez państwo §Y[Root.GetName]§!."
 emp_hab_foothold_in_china_title: "Bogactwa Chin"
 emp_hab_foothold_in_china_desc: "Kupcy opowiadają o krainie bajecznych bogactw na dalekim wschodzie. Musimy wysłać nasze okręty wojenne i negocjatorów, aby upewnić się, że to bogactwo wpłynie wprost do naszych kieszeni."
 emp_hab_austrialasia_title: "Osadnictwo w Australazji"
 emp_hab_austrialasia_desc: "Ziemie na dalekim południowym wschodzie znanego świata otrzymały nazwę dziwnie podobną do nazwy naszego narodu. Jest jasne, że miały być nasze."
 emp_hab_union_with_poland_title: "Król Polski"
 emp_hab_union_with_poland_desc: "Nasza północno-wschodnia granica nigdy nie będzie naprawdę bezpieczna, dopóki cała Polska nie będzie własnością [Root.GetStateForm_gen]."
 emp_hab_imperial_border_title: "Granica cesarstwa"
 emp_hab_imperial_border_desc: "Niektóre terytoria Cesarstwa odrzucił nasze zwierzchnictwo i są rządzone przez tych, którzy nie uznają władzy Cesarza. Ta sytuacja musi zostać naprawiona."
 emp_hab_imperial_border_effect_tooltip: "Każdy członek ŚCR niebędący rywalem Austrii otrzymuje §G10§! punktów zaufania do §YAustrii§!."
 emp_hab_no_one_to_threaten_us_title: "Cesarskie panowanie"
 emp_hab_no_one_to_threaten_us_desc: "Są wśród książąt tacy, którzy mają ambicje rzucić nam wyzwanie i przejąć kontrolę nad Imperium. Pokaz siły dyplomatycznej i militarnej będzie konieczny, aby stłumić te ambicje i zapewnić, że nasza władza jest niekwestionowana."
 emp_hab_no_one_to_threaten_us_trigger_tooltip: "Żaden członek ŚCR nie spełnia obydwu poniższych wymagań:\n Państwo oraz wasale nie będący trybutatiuszami posiadą co najmniej §Y10§! prowincji w §YEuropie§!.\n Państwo nie jest wasalem od §YAustrii§!."
 emp_hab_no_one_to_threaten_us_trigger2_tooltip: " członków ŚĆR to Wolne Miasta."
 emp_hab_empire_united_in_religion_title: "Święte cesarstwo"
 emp_hab_empire_united_in_religion_desc: "Napięcia między państwami członkowskimi zostały spotęgowane przez różnice religijne. Musimy przywrócić jedność religijną, jeśli chcemy odzyskać autorytet moralny, do którego pretendujemy jako 'Święte' Cesarstwo Rzymskie."
 emp_hab_empire_united_in_religion_trigger_tooltip: "Żadne państwo członkowskie ŚCR NIE wyznaje §Y[Root.Religion.GetReligion_gen]§!"
 emp_hab_empire_united_in_religion_effect_remove_tooltip: "Ten modyfikator zostanie usunięty, jeśli Austria nie będzie już cesarzem ŚCR."
 emp_hab_an_empire_roman_title: "Rzymskie cesarstwo"
 emp_hab_an_empire_roman_desc: "Święte Cesarstwo Rzymskie nigdy nie będzie całkowicie wolne od kpin, dopóki jego granice nie obejmą miasta Rzymu."
 emp_hab_empire_pass_reforms_title: "A.E.I.O.U."
 emp_hab_empire_pass_reforms_desc: "Musimy przekuć Święte Cesarstwo Rzymskie w duże państwo z silną, scentralizowaną władzą centralną mogącą zdominować wszystkich pozostałych członków Cesarstwa. Dopiero wtedy, i tylko wtedy, prawdziwe stanie się motto Fryderyka III: Austriae est imperare orbi universo (cały świat należy do Austrii)."
 emp_hab_empire_pass_reforms_trigger_tooltip: "Każdy członek ŚCR:\n   Opinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y1§!."
 emp_hab_spread_dynasties_title: "[Root.GetSpreadDynastyOrFallbackMissionTitle]"
 emp_hab_spread_dynasties_desc: "[Root.GetHABDynastyOrFallbackMissionDesc]"
 emp_hab_spread_dynasties_has_dynasty_desc: "Naturalnym miejscem rodziny Habsburgów jest tron. Musimy zdobyć trony Europy dla naszej rodziny."
 emp_hab_spread_dynasties_nodynasty_desc: "Nasza siła leży w naszych wpływach dyplomatycznych, tak samo jak w naszej sile militarnej. Musimy wzmocnić nasze relacje z tymi, których można skłonić do postrzegania świata w taki sam sposób jak my."
 emp_hab_spread_dynasties_trigger_tooltip: "Państwa rządzone przez członków rodu §Y[Root.Monarch.Dynasty.GetName]§! są obecne na co najmniej §Y5§! kontynentach."
 emp_hab_spread_dynasties_trigger_tooltip2: " państwa (oprócz §Y[Root.GetAdjective]§!):\n         Opinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y120§!\n         Spełnione jedno z poniższych:\n            Rządzone przez władcę §Y[Root.GetAdjective]§!\n            Rządzone przez ród '§Y[Root.Monarch.Dynasty.GetName]§!'"
 emp_hab_viennese_waltz_title: "Walc wiedeński"
 emp_hab_viennese_waltz_desc: "Nasza stolica [Root.Capital.GetCapitalName] musi rozkwitnąć i stać się miastem muzyki i wysokiej kultury, godnym władcy naszej rangi i prawdziwą stolicą Świętego Cesarstwa Rzymskiego."
 emp_hab_imperial_capitals_title: "Cesarskie stolice"
 emp_hab_imperial_capitals_desc: "Musimy zadbać o to, aby stolice naszych prowincji odzwierciedlały naszą pozycję jako filaru siły, na którym opiera się Święte Cesarstwo Rzymskie."
 emp_hab_the_hungarian_question_title: "Kwestia węgierska"
 emp_hab_the_hungarian_question_desc: "Węgry stanowią rdzeń naszego imperium. Naród węgierski jest jednak zaciekle niezależny i nie najlepiej znosi podporządkowanie obcej władzy. Jeśli mamy zabezpieczyć naszą stabilność, musimy zapewnić - w ten czy inny sposób - by węgierskie prowincje z całego serca zaakceptowały nasze rządy."
 emp_hab_all_minorities_are_welcome_title: "Cesarstwo wielokulturowe"
 emp_hab_all_minorities_are_welcome_desc: "Prowadzona przez nas ekspansja na wschód i południe sprawia, że do naszego Imperium napływa coraz więcej nieniemieckojęzycznych obcokrajowców. Nasza długoterminowa stabilność zależy od naszej zdolności do efektywnego zintegrowania tych poddanych narodów."
 emp_hab_take_salzburg_title: "Rozpraw się z biskupstwami"
 emp_hab_take_salzburg_desc: "Na naszych granicach znajduje się szereg słabych, autonomicznych biskupstw. Gdybyśmy chcieli wzmocnić Austrię, byłyby one łatwym celem do ekspansji."
 emp_hab_union_bayern_title: "Księstwo Bawarii"
 emp_hab_union_bayern_desc: "Bawarczycy od dawna są problemem na naszej północno-zachodniej granicy. Ich bogate księstwo ma potencjał, by być wielkim cierniem w naszym boku. Powinniśmy zabezpieczyć nasze granice i naszą dominację, przejmując je dla siebie."
 emp_hab_swabia_title: "Kontrolowanie Szwabii"
 emp_hab_swabia_desc: "Nasze posiadłości w Przedniej Austrii obejmują rozmaite majątki i terytoria rozrzucone po Szwabii. Powinniśmy je skonsolidować, podporządkowując sobie okoliczne miasta i książąt oraz ustanawiając na zachodzie bastion naszej potęgi."
 emp_hab_connect_further_austria_title: "Połączenie z Austrią Przednią"
 emp_hab_connect_further_austria_desc: "Nasze terytoria w Austrii Przedniej są odcięte od Austrii Właściwej. Powinniśmy połączyć je z resztą naszych ziem."
 emp_hab_union_brandenburg_title: "Rozpraw się z Brandenburgią"
 emp_hab_union_brandenburg_desc: "Brandenburgia może stać się bazą potęgi państwa w północnych Niemczech, zdolnego rzucić nam wyzwanie. Musimy zneutralizować to zagrożenie, jeśli nasza dominacja w Niemczech ma pozostać niezachwiana."
 emp_hab_conquer_switzerland_title: "Zemsta Gesslera"
 emp_hab_conquer_switzerland_desc: "Już wcześniej próbowaliśmy zaanektować Szwajcarię, ale za każdym razem nam się to nie udawało - w jednym przypadku przez prostego rolnika z łukiem i strzałami. Musimy przezwyciężyć pokolenia upokorzeń, których doświadczyliśmy i sprowadzić tych zbuntowanych rolników pod nasze rządy."
 emp_hab_conquer_burgundy_title: "Odzyskanie Burgundii"
 emp_hab_conquer_burgundy_desc: "Terytoria Burgundii przestały należeć do Świętego Cesarstwa Rzymskiego. Musimy zadbać o to, by w ten czy inny sposób ponownie znalazły się pod naszą panowaniem."
 emp_hab_conquer_burgundy_trigger_tooltip: "Żadna prowincja:\n   §YProwincja§! znajduje się w regionie §YFrancji§!.\n   Należy do Świętego Cesarstwa Rzymskiego.\n   Musi być spełniony jeden z poniższych warunków:\n      Jest własnością państwa nienależącego do Świętego Cesarstwa Rzymskiego.\n      Jest własnością państwa podległego państwu nienależącemu do Świętego Cesarstwa Rzymskiego."
 emp_hab_conquer_france_title: "Osłabienie Francji"
 emp_hab_conquer_france_desc: "Francuzi są naszymi głównymi rywalami w walce o hegemonię nad Niemcami i całą Europą. Musimy ich osłabić do tego stopnia, aby już nigdy nie mogli stanowić zagrożenia dla naszych imperialnych ambicji."
 emp_hab_conquer_france_tooltip: "Roczny dochód jest niższy niż dochód §Y[Root.GetName]§!."
 emp_hab_take_serbia_title: "Pokonanie Serbów"
 emp_hab_take_serbia_desc: "Zaciekle niepodlegli Serbowie i Bośniacy zajmują strategicznie ważne miejsce u naszych wrót do Grecji. Musimy napiąć nasze mięśnie i wciągnąć ich do naszego imperium."
 emp_hab_take_wallachia_bulgaria_title: "Parcie ku Bułgarii"
 emp_hab_take_wallachia_bulgaria_desc: "Bułgaria dostała się pod panowanie Osmanów. Musimy odwrócić ich zdobycze i zepchnąć ich z powrotem w kierunku Bosforu, budując przy okazji nasze imperium na Bałkanach."
 emp_hab_take_wallachia_bulgaria_effect_tooltip: "Otrzymujesz roszczenia do wszystkich pozostałych prowincji §YOttomanów§! w §YEuropie§! (z wyłączeniem Anatolii i Kaukazu)."
 emp_hab_scourge_of_europe_title: "Zaraza Europy"
 emp_hab_scourge_of_europe_desc: "Chrześcijaństwo nigdy nie będzie bezpieczne przed niewiernymi, dopóki nie wypędzimy osmańskiego zagrożenia z Europy."
 emp_hab_scourge_of_europe_trigger_tooltip: "Jest własnością §YOttomanów§!.\n   §YProwincja§! NIE znajduje się w regionie §YAnatolii§!.\n   §YProwincja§! NIE znajduje się w regionie §YKaukazu§!."
 emp_hab_veneto_lombardy_title: "Księstwo Mediolanu"
 emp_hab_veneto_lombardy_desc: "[MLO.GovernmentName] Mediolanu sprawia problemy, aczkolwiek jest ważną częścią Cesarstwa. Musimy się upewnić, że jej bogactwa nie zostaną wykorzystane przeciwko nam poprzez zwiększenie naszej kontroli nad nimi."
 emp_hab_naples_title: "Król Neapolu"
 emp_hab_naples_desc: "Dodając Królestwo Neapolu do naszej kolekcji tytułów, możemy umocnić naszą kontrolę nad Włochami i zbliżyć się o krok do poddania całego półwyspu pod nasze panowanie."
 emp_hab_prospering_nation_title: "Austria w rozkwicie"
 emp_hab_prospering_nation_desc: "Od winnic na północy po kopalnie i kuźnie na południu, cała Austria będzie prosperować, gdy nasz naród będzie wzrastał w siłę."
 emp_hab_develop_hungary_bohemia_title: "Inwestuj w prowincjach"
 emp_hab_develop_hungary_bohemia_desc: "Na naszych węgierskich i czeskich terytoriach jest wiele biedy. Nasze imperium miałoby o wiele mocniejsze fundamenty, gdybyśmy zainwestowali w nie tak, jak w nasze austriackie terytoria."
 emp_hab_balanced_estates_title: "Równowaga klas"
 emp_hab_balanced_estates_desc: "Zbyt często niezgoda i podziały nękały nasz kraj. Szlachta, duchowieństwo i mieszczanie muszą działać jako jedność, aby osiągnąć cel, jakim jest większa chwała i dobrobyt Austrii."
 emp_hab_balance_of_power_title: "Równowaga sił"
 emp_hab_balance_of_power_desc: "Musimy ustanowić równowagę sił w Europie, w której zagwarantowana będzie nasza stała dominacja."
 emp_hab_our_balance_of_power_title: "Zmiana równowagi"
 emp_hab_our_balance_of_power_desc: "Równowaga sił jest bardzo dobra, ale jeśli uda nam się ją przesunąć na naszą korzyść. Będziemy wtedy na dobrej drodze do zajęcia należnej nam pozycji dominującego państwa w całej Europie."
 emp_hab_our_balance_of_power_tooltip: " prowincji:\n   Kontynent to §YEuropa§!.\n   Właściciel:\n      Musi być spełniony jeden z poniższych warunków:\n         Jest państwem §Y[Root.GetName]§!.\n         Jest poddanym państwa §Y[Root.GetName]§!.\n         Jest sojusznikiem państwa §Y[Root.GetName]§!.\n         Jest poddanym państwa sprzymierzonego z §Y[Root.GetName]§!.\n         Należy do Świętego Cesarstwa Rzymskiego, którego §Ycesarzem§! jest §Y[Root.GetName]§!.\n         Jest poddanym państwa należącego do Świętego Cesarstwa Rzymskiego, którego §Ycesarzem§! jest §Y[Root.GetName]§!."
 emp_hab_crush_the_revolution_title: "[Root.GetEmbraceOrCrushRevolutionMissionTitle]"
 emp_crush_the_revolution_title: "Zgnieć rewolucję"
 emp_embrace_the_revolution_title: "Wprowadź rewolucję"
 emp_hab_crush_the_revolution_desc: "[Root.GetEmbraceOrCrushRevolutionMissionDesc]"
 emp_crush_the_revolution_desc: "Armie politycznych radykałów roją się na ulicach miast Europy. Nie możemy znieść tego zakłócenia naturalnego porządku, dlatego musimy wkroczyć w samo serce tej rewolucji i całkowicie ją zdławić."
 emp_embrace_the_revolution_desc: "Czas starego porządku dobiegł końca - niech z jego popiołów wykuwa się nowy porządek. Gdy polityczni radykałowie roją się na ulicach miast Europy, musimy do nich dołączyć i całkowicie zmiażdżyć tyranię, która uciska ludzkość."
 emp_hab_crush_the_revolution_trigger_tooltip: "Żadne państwo:\n         Musi być spełniony jeden z poniższych warunków:\n            Jest §Yrepubliką rewolucyjną§!.\n            Jest §Ycesarstwem rewolucyjnym§!."
 emp_hab_power_to_habsburg_title: "[Root.GetGloryToDynastyOrFallbackMissionTitle]"
 emp_mission_power_to_dynasty_title: "Chwała rodowi [Root.Monarch.Dynasty.GetName]!"
 emp_mission_power_to_country_title: "Chwała państwu [Root.GetName]!"
 emp_hab_power_to_habsburg_desc: "Hegemonia nad Europą jest naszym przeznaczeniem. Musimy chwycić ją w obie ręce i zapewnić, że nie pozostanie nikt, kto nie uzna naszej wyższości."
 emp_hab_power_to_habsburg_trigger_tooltip: "Żadne państwo:\n   §YStolica§! znajduje się na kontynencie §YEuropa§!.\n   Jest światową potęgą.\n   NIE jest sojusznikiem §YAustrii§!.\n   NIE poniosło porażki w wojnie z §YAustrią§! w ciągu ostatnich 100 lat."
 emp_hab_power_to_habsburg_trigger2_tooltip: "Żadne państwo:\n   §YStolica§! znajduje się na kontynencie §YEuropa§!.\n   Posiada co najmniej §Y300§! punktów rozwoju.\n   NIE jest sojusznikiem §YAustrii§!.\n   NIE jest poddanym §YAustrii§!.\n   NIE poniosło porażki w wojnie z §YAustrią§! w ciągu ostatnich 100 lat."
 no_hre_province_owned_by_non_hre_member_or_overlord_trigger: "Żadna prowincja:\n   Należy do Świętego Cesarstwa Rzymskiego.\n   Musi być spełniony jeden z poniższych warunków:\n      Jest własnością państwa nienależącego do Świętego Cesarstwa Rzymskiego.\n      Jest własnością państwa podległego państwu nienależącemu do Świętego Cesarstwa Rzymskiego."
 hab_austrian_netherlands: "Austriackie Niderlandy"
 desc_hab_austrian_netherlands: "Po zabezpieczeniu Niderlandów możemy skierować nasze ambicje ku stworzeniu imperium kolonialnego dorównującego posiadłościom naszych europejskich rywali."
 hab_conquest_of_italy: "Podporządkowanie Italii"
 desc_hab_conquest_of_italy: "Rozszerzyliśmy nasze panowanie na większość Italii i jesteśmy obecnie postrzegani jako dominująca potęga na półwyspie."
 hab_victory_over_ottomans: "Pokonanie Osmanów"
 desc_hab_victory_over_ottomans: "Pokonaliśmy Osmanów, wypierając ich plagę z wybrzeży Europy. Cały świat chrześcijański docenia nasze niestrudzone wysiłki, które doprowadziły do tego zwycięstwa."
 hab_aeiou_mod: "A.E.I.O.U."
 desc_hab_aeiou_mod: "Przekształciliśmy mozaikę państw tworzących Święte Cesarstwo Rzymskie w silną i zwartą potęgę, zdolną dorównać nowoczesnym państwom Europy — Austriae est imperare orbi universo."
 hab_invested_in_provinces: "Prowincjonalne inwestycje"
 desc_hab_invested_in_provinces: "Znaczne inwestycje w prowincjach zwiększyły dobrobyt naszych ziem, a ich mieszkańców przekonały, że państwo rzeczywiście troszczy się o poprawę ich losu."
 hab_many_thrones: "Rozległa dynastia"
 desc_hab_many_thrones: "Nasza dynastia rządzi wieloma królestwami i księstwami w całej Europie. Dzięki temu posiadamy wiele rodów, na których możemy polegać, aby osiągnąć nasze cele dyplomatyczne."
 hab_lots_of_influence: "Austriackie wpływy"
 desc_hab_lots_of_influence: "Zbudowaliśmy znaczące wpływy w całej Europie. Obecnie istnieje wiele państw, które postrzegają świat mniej więcej tak jak my, co daje nam duże możliwości osiągania naszych celów dyplomatycznych."
 hab_ascendancy_in_empire: "Dominacja w Cesarstwie"
 desc_hab_ascendancy_in_empire: "Zapewniliśmy sobie dominującą pozycję w Świętym Cesarstwie Rzymskim. Książęta mogą narzekać, lecz nie mają już sił, by nam się przeciwstawić."
 hab_empire_united_in_religion_mod_catholic: "Zjednoczeni przez religię"
 desc_hab_empire_united_in_religion_mod_catholic: "Wiara katolicka przetrwała liczne próby i wyszła z nich silniejsza niż kiedykolwiek, stając się dominującym wyznaniem Świętego Cesarstwa Rzymskiego."
 hab_empire_united_in_religion_mod_protestant: "Zjednoczeni przez religię"
 desc_hab_empire_united_in_religion_mod_protestant: "Protestantyzm zrzucił jarzmo Rzymu i stał się dominującym wyznaniem Świętego Cesarstwa Rzymskiego."
 hab_empire_united_in_religion_mod_reformed: "Zjednoczeni przez religię"
 desc_hab_empire_united_in_religion_mod_reformed: "Kalwinizm zrzucił jarzmo Rzymu oraz innych herezji i stał się dominującym wyznaniem Świętego Cesarstwa Rzymskiego."
 hab_empire_united_in_religion_mod_generic: "Zjednoczeni przez religię"
 desc_hab_empire_united_in_religion_mod_generic: "Nasza wiara przezwyciężyła wszelkie przeciwności i stała się dominującym wyznaniem Świętego Cesarstwa Rzymskiego."
 hab_empire_has_rome: "Rzymskie cesarstwo"
 desc_hab_empire_has_rome: "Święte Cesarstwo Rzymskie nie jest już cesarstwem rzymskim, które nie obejmuje Rzymu."
 hab_prosperity_windfall: "Niespodziewany przypływ dobrobytu"
 desc_hab_prosperity_windfall: "Austriacka gospodarka przeżywa okres bezprecedensowego rozkwitu. Dzięki temu poborcy podatkowi mogą zgromadzić w naszym skarbcu wyjątkowo wysokie dochody."
 hab_flourishing_in_empire: "Cesarskie miasta"
 desc_hab_flourishing_in_empire: "Nasze starania o podniesienie splendoru miast wzbudziły podziw i zazdrość książąt Cesarstwa."
 hab_balance_of_power_mod: "Równowaga sił"
 desc_hab_balance_of_power_mod: "Równowaga sił jest delikatnym układem, który należy starannie podtrzymywać, aby żadne mocarstwo nie urosło w siłę na tyle, by nam zagrozić."
 hab_reactionary_zeal: "Zapał reakcyjny"
 desc_hab_reactionary_zeal: "Rewolucja została zdławiona, a niebezpieczne idee, które próbowała szerzyć, zostały zniszczone w zarodku."
 hab_supreme_in_europe: "Supremacja nad Europą"
 desc_hab_supreme_in_europe: "W Europie nie pozostał nikt, kto nie uznawałby wyższości Cesarstwa Austriackiego."
 hab_viennese_ballrooms: "Wiedeńskie sale balowe"
 desc_hab_viennese_ballrooms: "Przepych naszych sal balowych nie ma sobie równych. Dają one szlachcie z kraju i zagranicy okazję do zaprezentowania swej świetności i zwrócenia na siebie uwagi arcyksięcia."
 hab_tolerant_society: "Cesarstwo wielokulturowe"
 desc_hab_tolerant_society: "Z powodzeniem zintegrowaliśmy wiele ludów podległych naszemu państwu, sprawiając, że są równie zadowolone z naszych rządów, jak byłyby z panowania jednego ze swoich."
 hab_holdings_in_swabia: "Przednia Austria"
 desc_hab_holdings_in_swabia: "Ta prowincja jest częścią bastionu zwanego „Przednią Austrią”, który strzeże zachodnich rubieży Cesarstwa Austriackiego."
 hab_empire_in_the_west: "Odrodzenie Cesarstwa na Zachodzie"
 desc_hab_empire_in_the_west: "Przywróciliśmy władzę cesarską nad zachodnimi terytoriami Cesarstwa."
 opinion_hab_back_into_empire: "Święte Cesarstwo Francuskie"
 hab_back_into_empire: "Powrót do Cesarstwa"
 desc_hab_back_into_empire: "Ta prowincja raduje się z ponownego przyłączenia do Świętego Cesarstwa Rzymskiego."
 hab_take_that_napoleon: "Supremacja nad Francją"
 desc_hab_take_that_napoleon: "Po podporządkowaniu Francji zarówno nasze armie, jak i służba dyplomatyczna czują się niezwyciężone."
 hab_pure_bavarian_beer: "Prawdziwe bawarskie piwo"
 desc_hab_pure_bavarian_beer: "Dzięki surowym lokalnym przepisom bawarskie piwo jest najlepsze i najczystsze w całej Europie. Teraz możemy również cieszyć się nim jako naszym miejscowym trunkiem."
 hab_conquered_serbia: "Podbój Serbii i Bośni"
 desc_hab_conquered_serbia: "Włączyliśmy Bośnię i Serbię do naszego cesarstwa, a wielkie miasto Sarajewo, Jerozolima Europy, stało się jedną z naszych stolic. Niech zawsze będzie bezpieczną przystanią dla naszego ludu."
 hab_our_balance_of_power_mod: "Wzrost potęgi Austrii"
 desc_hab_our_balance_of_power_mod: "Dzięki dyplomatycznemu majstersztykowi, który przyciągnął uwagę wszystkich europejskich dworów, udało nam się przesunąć równowagę sił na naszą korzyść."
 hab_chinese_riches: "Chiński handel"
 desc_hab_chinese_riches: "Nasi kupcy zmonopolizowali handel z Chinami, zapewniając obfity strumień bogactw do naszego skarbca."
 hab_austrian_australia: "Austriacka Australia"
 desc_hab_austrian_australia: "Przez wieki wielu ludzi będzie łamać sobie język, próbując wymówić nazwę naszej najnowszej zdobyczy kolonialnej."
 austrian_dual_monarchy_legacy: "Imperialna monarchia austriacka"
 austrian_dual_monarchy_legacy_desc: "Forma rządów monarchicznych stworzona z myślą o utrzymaniu jedności mozaikowego imperium, złożonego z wielu kultur, miast i terytoriów."
 austrian_dual_monarchy: "Imperialna monarchia austriacka"
 austrian_dual_monarchy_desc: "Forma rządów monarchicznych stworzona z myślą o utrzymaniu jedności mozaikowego imperium, złożonego z wielu kultur, miast i terytoriów."
 flavor_hab.20.name: "Zreformować austriacki rząd cesarski?"
 flavor_hab.20.desc: "Wraz z rozwojem Cesarstwa Austriackiego coraz więcej poddanych niebędących Niemcami musi zostać zintegrowanych z naszym państwem. Jak dotąd radziliśmy sobie z tym najlepiej, jak potrafiliśmy, tłumiąc sprzeciw wobec naszych rządów. Mieszkańcy wielu prowincji wciąż jednak postrzegają [Root.Monarch.GetTitle] jako obcych despotów. Przedstawiono radykalny pakiet reform, który ma zagwarantować prawa poddanym ludom i włączyć je do rządów, zwiększając tym samym naszą długofalową stabilność."
 flavor_hab.20.A: "Wprowadź pełną reformę."
 flavor_hab.20.B: "Wprowadź ograniczoną reformę."
 emp_hun_fund_monasteries_title: "Zakładaj klasztory"
 emp_hun_fund_monasteries_desc: "Zakon paulinów odgrywa ważną rolę na Węgrzech od czasu jego założenia w 1250 roku przez błogosławionego Euzebiusza z Ostrzyhomia. Zakon rozprzestrzenił się nawet na sąsiednie kraje. Przeznaczenie środków na zapewnienie sobie jego przychylności byłoby rozsądną inwestycją."
 emp_hun_religious_unity_title: "Jedność w wierze"
 emp_hun_religious_unity_desc: "Terytoria Węgier są domem dla ludzi o różnych wyznaniach. Tak czy inaczej musimy zadbać o to, by różnice religijne nie dzieliły naszego państwa."
 emp_hun_take_galicia_title: "Osłab Polskę"
 emp_hun_take_galicia_desc: "[POL.GovernmentName] Polski to potężny kraj, kontrolujący ziemie za naszą północną granicą. Stanowiliby poważne zagrożenie dla naszej niezależności, gdyby stali się wrogo nastawieni. Powinniśmy dokonać ataku wyprzedzającego, aby przesunąć polską granicę jak najdalej od naszego centrum."
 emp_hun_jagiellonian_union_title: "Unia Jagiellońska"
 emp_hun_jagiellonian_union_desc: "Aż do jego śmierci w bitwie pod Warną w 1444 r. Węgrami wraz z Polską i Litwą rządził Władysław III Jagiellończyk. Powinniśmy przywrócić unię między naszymi tronami, która istniała za jego czasów – i sprawić, że wynik będzie bardziej pomyślny niż ostatnim razem."
 emp_hun_black_army_supreme_title: "Chwała Czarnej Armii"
 emp_hun_black_army_supreme_desc: "Otoczona licznymi wrogami armia węgierska ma bogate doświadczenie w obronie niepodległości naszego państwa. Nie możemy jednak spocząć na laurach — musimy nieustannie doskonalić nasze umiejętności, aby nie utracić przewagi, jaką zapewnia nam znakomite wojsko."
 emp_hun_black_army_supreme_trigger_tooltip: "Obecną erą jest §Yera absolutyzmu§! lub późniejsza era."
 emp_hun_improve_economy_title: "Silna gospodarka"
 emp_hun_improve_economy_desc: "Nasza zdolność do konkurowania z wielkimi mocarstwami, pośród licznych potencjalnych zagrożeń, zależy od tego, czy zdołamy wydobyć z naszych ziem każdą ostatnią odrobinę bogactwa."
 emp_hun_corviana_library_title: "Bibliotheca Corviniana"
 emp_hun_corviana_library_desc: "Odrodzenie wiedzy klasycznej i postęp, jaki przyniosło naszym uczonym oraz filozofom, sprawiają, że powinniśmy założyć bibliotekę, w której zgromadzimy dorobek intelektualny całej Europy."
 emp_hun_nagyszombat_university_title: "Uniwersytet w Nagyszombat"
 emp_hun_nagyszombat_university_desc: "Powinniśmy stworzyć centrum religijnego i świeckiego nauczania, w którym będzie wpierane następne pokolenie myślicieli, którzy będą wspierać rozwój naszego narodu."
 emp_hun_great_city_of_pest_title: "Wielkie miasto [Root.Capital.GetCapitalName]"
 emp_hun_great_city_of_pest_desc: "Państwo węgierskie istnieje od stuleci, a nasza stolica rozrosła się do rangi ważnego miasta. Rozmiarami i przepychem ustępuje jednak Pradze i Wiedniowi, stolicom naszych zachodnich rywali. Byłby to wspaniały dzień, gdyby [Root.Capital.GetCapitalName] przewyższyło oba te miasta i zostało uznane za główny ośrodek Europy Środkowej."
 emp_hun_strong_government_title: "Silny rząd"
 emp_hun_strong_government_desc: "Musimy zreformować państwo, aby było gotowe stawić czoła każdej przeszkodzie bez szwanku."
 emp_hun_hungarian_succession_title: "Węgierska sukcesja"
 emp_hun_hungarian_succession_desc: "Klęska krucjaty warneńskiej sprawiła, że nasz kraj ostał się pozbawiony przywódcy i bezbronny. Musimy uporać się z tym kryzysem, nie tracąc naszej niezależności na rzecz któregokolwiek z naszych oportunistycznych sąsiadów."
 emp_hun_hungarian_succession_tooltip: "Musi być spełniony jeden z poniższych warunków:\n   Wydarzenie §Y„Mátyás Corvinus”§! miało miejsce.\n   Jest co najmniej §Y1457§! rok."
 emp_hun_bohemian_borderlands_title: "Czeskie pogranicze"
 emp_hun_bohemian_borderlands_desc: "Elektorat Czech jest właścicielem obszarów granicznych na naszym północnym zachodzie. Ponieważ jest silnym i dobrze prosperującym królestwem znanym z paskudnych herezji, powinniśmy podjąć działania przeciwko nim, aby zapobiec rozprzestrzenianiu się ich na nasze ziemie."
 emp_hun_bohemian_crown_title: "Korona Czeska"
 emp_hun_bohemian_crown_desc: "Zjednoczenie korony czeskiej z naszą własną znacznie zwiększyłoby siłę naszego państwa - szczególnie, jeśli możemy dopilnować, aby jej elektorat został nam przekazany."
 emp_hun_bohemian_crown_effect_tooltip: "Jeżeli ukończymy tę misję poprzez wprowadzenie unii personalnej z §YCzechami§!:"
 emp_hun_weaken_austria_title: "Osłab Austrię"
 emp_hun_weaken_austria_desc: "Pokój z Austrią nie może trwać wiecznie — nasze ziemie są zbyt kuszące, by arcyksiążę nie snuł wobec nich planów. Powinniśmy osłabić Austrię, aby zabezpieczyć się przed atakiem zachodnich sąsiadów."
 emp_hun_weaken_austria_trigger_tooltip: "§YAustria§! oraz jej wasale nie będący trybutariuszami posiadają nie więcej niż 13 prowincji."
 emp_hun_duchy_of_austria_title: "Księstwo Austrii"
 emp_hun_duchy_of_austria_desc: "Wiedeń byłby wspaniałym nabytkiem dla naszego [Root.GovernmentName]. Powinniśmy go zdobyć."
 emp_hun_bulwark_of_christianity_title: "Przedmurze chrześcijaństwa"
 emp_hun_bulwark_of_christianity_desc: "Jako główni obrońcy chrześcijaństwa przed zagrożeniem osmańskim zyskaliśmy miano Przedmurza Chrześcijaństwa. Udowadniając, że potrafimy stawić czoło wszystkiemu, co niewierni mogą przeciw nam rzucić, sprawimy, że tytuł ten będzie w pełni zasłużony."
 emp_hun_bulwark_of_christianity_trigger_tooltip: "Nie istnieje państwo spełniające wszystkie poniższe warunki:\n   Państwo wyznaje §YIslam§!.\n   Państwo spełnia jeden z poniższych warunków:\n      Państwo należy to §Ylewantyńskiej§! grupy kulturowej.\n      Państwo sąsiaduje z państwem §Y[Root.GetName]§!.\n      Państwo ma swoją stolicę w §YEuropie§!.\n   Państwo posiada większą armię niż państwo §Y[Root.GetName]§!."
 hun_funded_paulines: "Życzliwość Paulinów"
 desc_hun_funded_paulines: "Dzięki naszym funduszom, wpływy Zakonu Świętego Pawła Pierwszego Pustelnika zyskały na sile. W rezultacie ich życzliwość wobec państwa węgierskiego wzrosła."
 hun_hungary_poland: "Węgierska Polska"
 desc_hun_hungary_poland: "Administrowanie Polską i Węgrami będzie wymagało bardziej elastycznego podejścia rządowego, przy czym Polacy będą odgrywać znaczącą rolę w rządzie, a większy korpus dyplomatów będzie w stanie poradzić sobie z każdą ewentualnością."
 hun_supreme_black_army: "Wspaniała armia "
 desc_hun_supreme_black_army: "Widok naszej armii budzi strach w sercach naszych wrogów i jest powodem do świętowania wśród naszych sojuszników."
 hun_strong_economy: "Siła gospodarcza"
 desc_hun_strong_economy: "Nasza gospodarka prosperuje, co ułatwia nam pozyskiwanie funduszy potrzebnych do utrzymania naszej armii i różnych innych projektów, które możemy rozważyć."
 hun_corviana_library: "Bibliotheca Corviniana"
 desc_hun_corviana_library: "Nasza biblioteka narodowa zawiera w sobie zgromadzoną wiedzę o cywilizacji europejskiej, zapewniając naszym myślicielom dostęp do najnowszej wiedzy z zakresu filozofii, teologii, prawa, historii, geografii, literatury, nauk przyrodniczych, medycyny, architektury i wielu innych dziedzin."
 hun_nagysz_uni_catholic: "Uniwersytet Nagyszombat"
 desc_hun_nagysz_uni_catholic: "Stworzyliśmy jezuicką instytucję szkolnictwa wyższego, która będzie wspierać nasze następne pokolenie myślicieli."
 hun_nagysz_uni_non_catholic: "Uniwersytet Nagyszombat"
 desc_hun_nagysz_uni_non_catholic: "Stworzyliśmy narodową instytucję szkolnictwa wyższego, która będzie wspierać nasze następne pokolenie myślicieli."
 hun_great_city: "Wielkie miasto"
 desc_hun_great_city: "Miasto wspaniale prosperuje, wyprzedzając Wiedeń i Pragę pod względem dobrobytu."
 hun_golden_age_of_hungary: "Stabilność i dobrobyt"
 desc_hun_golden_age_of_hungary: "Dzięki bezprecedensowej stabilności i dobremu zarządzaniu, można naprawdę powiedzieć, że Węgry przeżywają złoty wiek."
 hun_bulwark_of_christianity: "Przedmurze chrześcijaństwa"
 desc_hun_bulwark_of_christianity: "Uznając naszą wyższość nad niewiernymi, cieszymy się powszechnym uznaniem jako przedmurze chrześcijaństwa."
 hun_hungarian_austria: "Władca Austrii"
 desc_hun_hungarian_austria: "Jako nowi władcy Austrii możemy czerpać korzyści z reputacji jej byłych władców - a także z mechanizmów rządzenia, które Habsburgowie stworzyli, aby wywierać wpływ na całe Niemcy."
 opinion_hun_let_into_empire: "Nadanie godności elektorskiej"
 opinion_hun_didnt_let_into_empire: "Odrzucono propozycję przyłączenia do Cesarstwa"
 new_flavour_hun.1.name: "Członkostwo w Cesarstwie"
 new_flavour_hun.1.desc: "Odkąd Królestwa Węgier i Czech zostały zjednoczone pod berłem [Root.Monarch.GetTitle] [Root.Monarch.GetName], niektórzy sugerują, by Węgry przystąpiły do Świętego Cesarstwa Rzymskiego i przejęły czeską godność elektorską. Takie rozwiązanie przyniosłoby znaczne korzyści, zwłaszcza gdybyśmy z czasem zdołali zdobyć również tytuł cesarski.\n\nAby jednak wejść w skład Cesarstwa, potrzebujemy zgody obecnego cesarza. Czy powinniśmy o nią wystąpić?"
 new_flavour_hun.1.A: "Węgry są członkiem Cesarstwa."
 new_flavour_hun.1.B: "Nasza obecna sytuacja jest wystarczająco zadowalająca."
 new_flavour_hun.2.name: "Węgry chcą dołączyć do Cesarstwa"
 new_flavour_hun.2.desc: "Po zjednoczeniu Królestw Węgier i Czech pod berłem [hungary_country.Monarch.GetTitle] [hungary_country.Monarch.GetName] Węgrzy zwrócili się do [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName], który — w [Emperor.Monarch.GetHerHis] roli cesarza Świętego Cesarstwa Rzymskiego — miałby zezwolić im na przystąpienie do Cesarstwa. Ponadto nalegają, by skoro Czechy są teraz jedynie częścią ich rozleglejszych posiadłości, czeska godność elektorska została oficjalnie przekazana węgierskiej dynastii [hungary_country.Monarch.Dynasty.GetName]."
 new_flavour_hun.2.A: "Członkostwo węgierskie może wzmocnić Cesarstwo."
 new_flavour_hun.2.B: "Członkostwo węgierskie może osłabić Cesarstwo."
 new_flavour_hun.3.name: "Grecy w prowincji [151.GetName]"
 new_flavour_hun.3.desc: "Osmanowie wypędzili prawosławną ludność grecką z miasta [151.GetName] i osiedlili na jej miejscu tureckich przybyszów. Grecy nadal stanowią jednak większość mieszkańców okolicznych wsi i innych części Grecji. Teraz, gdy miasto należy do nas, domagają się zemsty i żądają, by wypędzeni powrócili na swoje miejsce, zastępując najeźdźców."
 new_flavour_hun.3.A: "Niechaj prowincję [151.GetName] zamieszkają Grecy."
 new_flavour_hun.3.B: "Turcy mogą pozostać."
 emp_gen_trade_league_title: "Wyłączenie dla handlu"
 emp_gen_trade_league_desc: "Musimy związać naszych partnerów handlowych z naszym państwem i zapewnić sobie ich ochronę w razie zagrożenia. Dzięki temu zyskamy przewagę liczebną, której potrzebujemy, by przetrwać i rozwijać się w nieprzyjaznym oraz niestabilnym regionie Morza Śródziemnego."
 emp_gen_trade_league_tooltip: " państw należy do tej samej ligi handlowej co §YGenua§!."
 emp_gen_safety_at_home_and_abroad_title: "Zabezpiecz [Root.GovernmentName]"
 emp_gen_safety_at_home_and_abroad_desc: "Musimy zadbać o to, by nasza armia i instytucje potrafiły zapewnić nam bezpieczeństwo zarówno w kraju, jak i za granicą. Tylko w ten sposób zagwarantujemy dalsze istnienie naszego [Root.GovernmentName], wolnego od niestabilności i obcej dominacji."
 emp_gen_reinvigoration_title: "Wzmocnij republikę"
 emp_gen_reinvigoration_desc: "Gdy po epidemii czarnej śmierci przyszły klęski w wojnach z Wenecją oraz okupacja francuska i mediolańska pod koniec XIV i na początku XV wieku, wydawało się, że złoty wiek Genui dobiegł końca na zawsze. Odrodzona Genua może jednak odzyskać dawną chwałę, sięgnąć po nowe wyżyny i umocnić pozycję czołowego włoskiego miasta-państwa."
 emp_gen_mare_nostrum_title: "Mare Nostrum"
 emp_gen_mare_nostrum_desc: "Morze Śródziemne może nie jest jeszcze naszym stawem z kaczkami, ale mimo to jesteśmy w stanie zdominować je jako imperium handlowe. Musimy dopilnować, aby nikt nie był w stanie podważyć naszej kontroli nad morzami i - co równie ważne - szlakami żeglugowymi, które stanowią życiodajną krew naszego imperium handlowego."
 emp_gen_mare_nostrum_trigger_tooltip: "Nie istnieje państwo spełniające obydwa poniższe warunki:\n   Państwo posiada prowincję portową na §YMorzu Śródziemnym§!.\n   Państwo posiada więcej galer niż §YGenua§!."
 emp_gen_mare_nostrum_trigger_tooltip2: "węzłów handlowych graniczących z §YMorzem Śródziemnym§! lub §YCzarnym Morzem§! ma §YGenuę§! jako państwo o największej sile handlowej."
 emp_gen_expand_genoese_coastline_title: "Zniszcz Pizę"
 emp_gen_expand_genoese_coastline_desc: "Bitwa pod Melorią w 1284 roku ustanowiła genueńską przewagę nad Pizańczykami, trwale kładąc kres pizańskiemu imperium morskiemu. Jednak te czasy już dawno minęły, a kontrola, jaką kiedyś mogliśmy sprawować nad Pizańczykami, wymknęła nam się z rąk. W ostatnich czasach walczymy o utrzymanie naszej niezależności od naszych silniejszych sąsiadów. Jeśli mamy odzyskać naszą wielkość, musimy wziąć przykład z Wenecji i zapewnić sobie silny włoski rdzeń naszego imperium handlowego, poprzez ponowne umocnienie naszej rodowej dominacji nad Pizą i rozszerzenie kontroli nad wybrzeżem Ligurii."
 emp_gen_grand_fleet_title: "Ochrona przed Hiszpanią"
 emp_gen_grand_fleet_desc: "Hiszpanie pozostaną stałym zagrożeniem dla naszego morskiego imperium tak długo, jak długo ich flota będzie w stanie przewyższać naszą. Aby odepchnąć ich od włoskich wybrzeży, musimy rozbudować naszą flotę i upewnić się, że jest ona w stanie zdominować Hiszpanów."
 emp_gen_take_sardinia_title: "Zajmij Sardynię"
 emp_gen_take_sardinia_desc: "Od dawna dążymy do przejęcia Sardynii. Aragończycy okazali się jednak cierniem w naszym boku, odbierając nam bazę w Sassari. Nadszedł czas, by odzyskać Sassari i podbić pozostałą część wyspy."
 emp_gen_the_spanish_question_title: "Kwestia Hiszpanii"
 emp_gen_the_spanish_question_desc: "Teraz, gdy odzyskaliśmy Sardynię i pokazaliśmy siłę naszej floty, musimy dokonać wyboru: kontynuować wojnę z Hiszpanami, spróbować całkowicie wyprzeć ich z Italii i przejąć kontrolę nad wybrzeżem Półwyspu Iberyjskiego, czy raczej zawrzeć pokój i zyskać ich przyjaźń, aby móc bezpiecznie skupić się na innych sprawach, nie obawiając się ich najazdów?"
 emp_gen_the_spanish_question_alliance_ARA_tooltip: "Jeśli dążymy do zawarcia sojuszu z §YAragonią§!:\n"
 emp_gen_the_spanish_question_alliance_SPA_tooltip: "Jeśli dążymy do zawarcia sojuszu z §YHiszpanią§!:\n"
 emp_gen_the_spanish_question_victory_ARA_tooltip: "\nJeśli dążymy do pokonania §YAragonii§!:\n"
 emp_gen_the_spanish_question_victory_SPA_tooltip: "\nJeśli dążymy do pokonania §YHiszpanii§!:\n"
 emp_gen_venetian_naval_power_title: "Przyćmij Wenecję"
 emp_gen_venetian_naval_power_desc: "Nigdy nie prześcigniemy naszego odwiecznego wroga, Wenecji, jeśli nie pokonamy jej potężnej floty. Jeżeli jednak zdołamy zapewnić sobie przewagę na morzu, otworzy się przed nami droga do zdobycia miasta. Musimy rozbudować flotę, by urzeczywistnić ten plan."
 emp_gen_two_cities_title: "Pokonaj Wenecję"
 emp_gen_two_cities_desc: "Pozbawiona przewagi morskiej Wenecja jest bezbronna. Włączając ją do naszego państwa, raz na zawsze zlikwidujemy zagrożenie, jakie Wenecjanie stanowią dla naszego wspaniałego [Root.GovernmentName]!"
 emp_gen_dominate_italian_trade_title: "Zdominuj włoski handel"
 emp_gen_dominate_italian_trade_desc: "Po opanowaniu Wenecji nic nie stoi nam na przeszkodzie, by sprawować hegemonię nad całym handlem płynącym do Włoch."
 gen_ambitions_on_venice: "Genueński podbój Wenecji"
 gen_dominant_trader: "Dominacja handlowa"
 desc_gen_dominant_trader: "Genua pokonała Wenecję, stając się niekwestionowanym hegemonem włoskiego handlu."
 gen_dominance_of_tyrrhennian: "Opanowanie Morza Tyrreńskiego"
 opinion_gen_spanish_alliance: "Sojusz zachodniego Morza Śródziemnego"
 gen_victory_over_spain: "Przewaga nad Hiszpanią"
 desc_gen_victory_over_spain: "Wyparliśmy Hiszpanów jako dominującą siłę w basenie Morza Śródziemnego, począwszy od Półwyspu Apenińskiego aż po wybrzeże Katalonii, zarówno pod względem militarnym, jak i handlowym."
 gen_spanish_alliance_modifier: "Sojusz zachodniego Morza Śródziemnego"
 desc_gen_spanish_alliance_modifier: "Nasz sojusz z Hiszpanami pozwolił nam wspólnie zdominować zachodnią część Morza Śródziemnego i wesprzeć naszą flotę handlową potężnymi siłami wojskowymi, zarówno na lądzie, jak i na morzu."
 gen_leader_of_trade_league: "Przymierze handlowe"
 desc_gen_leader_of_trade_league: "Genua stała się centrum potężnej ligi handlowej, która jest w stanie obronić się przed większością potencjalnych zagrożeń."
 gen_achieved_mare_nostrum: "Mare Nostrum"
 desc_gen_achieved_mare_nostrum: "Genua zdołała osiągnąć niekwestionowaną dominację nad Morzem Śródziemnym i sprawuje zarówno wojskową, jak i handlową kontrolę nad wszystkimi ważnymi węzłami w regionie."
 gen_ascendant_force: "Wzrost potęgi Genui"
 desc_gen_ascendant_force: "Ostatni wzrost naszej siły ośmielił nas pchnięcia naszego państwa na nowe wyżyny."
 gen_prosperous_republic: "Rozkwit Genui"
 desc_gen_prosperous_republic: "Dzięki nowemu dobrobytowi Genui dawna chwała i bogactwa znów wydają się w zasięgu ręki. Napływ majątku jest znaczny, a elity intelektualne sąsiednich państw coraz chętniej przenoszą się do naszego miasta."
 emp_bur_nevers_title: "Zintegruj Nevers"
 emp_bur_nevers_desc: "Chodzą słuchy, że nasza marionetka na tronie Nevers praktykuje czarną magię. Nie wypada zadawać się z taką herezją; lepiej, żeby Nevers zostało sprowadzone na ścieżki słusznej wiary."
 emp_bur_romandie_title: "Odzyskaj Transjuranię"
 emp_bur_romandie_desc: "Królestwo Górnej Burgundii od dawna znajduje się pod kontrolą Cesarstwa. Niegdyś stanowiło jedną trzecią Burgundii — musi do nas powrócić."
 emp_bur_cisjurania_title: "Królestwo Arles"
 emp_bur_cisjurania_desc: "Księstwo Dolnej Burgundii, niegdyś rządzone przez Ryszarda Prawodawcę, który zjednoczył całą Burgundię za swojego panowania, powinno zostać nam zwrócone. Arelat musi zostać odbudowany!"
 emp_bur_lombardy_title: "Zaatakuj Lombardię"
 emp_bur_lombardy_desc: "Bogata kraina Lombardii leży tuż za Alpami. Jej obecni władcy są w większości uzurpatorami, którzy mają słabe roszczenia do swoich ziem. Bylibyśmy w stanie zapewnić ludom Lombardii znacznie silniejsze i bardziej zdecydowane przywództwo, gdybyśmy mogli przejąć nad nimi kontrolę."
 emp_bur_italy_title: "Królestwo Włoch"
 emp_bur_italy_desc: "Miasta-państwa Włoch są nękane przez podziały. Musimy położyć kres ich rozłamowi, przywracając dawne Królestwo Włoch, a tym samym zagarniając dla siebie terytorium o znacznych bogactwach i wyrafinowanej kulturze."
 emp_bur_chivalry_is_not_dead_title: "Rycerskość wciąż trwa"
 emp_bur_chivalry_is_not_dead_desc: "Ideały rycerstwa i gościnności są warte zachowania. Musimy trzymać się tych filarów i dbać o to, by nasz dwór słynął w całej Europie z rycerskiego splendoru."
 emp_bur_secure_succession_title: "Zabezpiecz sukcesję"
 emp_bur_secure_succession_desc: "Zarówno król Francji, jak i cesarz Świętego Cesarstwa Rzymskiego mają chrapkę na nasze ziemie i wykorzystają każdy pretekst, by zgłosić do nich pretensje. Musimy zabezpieczyć sukcesję, aby dzieci naszych dzieci odziedziczyły [Root.GovernmentName]."
 emp_bur_unite_the_realm_title: "Zjednocz kraj"
 emp_bur_unite_the_realm_desc: "Nasze posiadłości w Niderlandach nie podlegają bezpośredniej kontroli [Root.GetAdjective] i niechętnie znoszą nasze rządy. Powinniśmy zintegrować je z państwem [Root.GetName] i dopilnować, by obowiązywały tam takie same prawa jak w pozostałych domenach."
 emp_bur_papal_relations_title: "Relacje z papieżem"
 emp_bur_papal_relations_desc: "Papież od dawna stara się ingerować w sprawy Niemiec i Francji. Być może jednak przesadził - w wielu kręgach narasta niechęć do papieskiego establishmentu. Nie możemy zajmować dwuznacznego stanowiska. Musimy albo zobowiązać się do bycia dobrymi katolikami i zwolennikami papieża, albo dążyć do czystego rozstania się z nim i wszystkim, co reprezentuje."
 emp_bur_kingdom_of_bavaria_title: "Królestwo Bawarii"
 emp_bur_kingdom_of_bavaria_desc: "Podbój Frankonii Wschodniej otworzył nam drogę do Bawarii i Austrii. Te ziemie również wchodziły niegdyś w skład imperium karolińskiego. Musimy włączyć je do naszego państwa!"
 emp_bur_subjects_title: "Uspokój poddanych"
 emp_bur_subjects_desc: "Jako przywódca tak wielu niestabilnych unii nie możemy być postrzegani jako posiadający jakichkolwiek nielojalnych poddanych. Podczas gdy rozważamy nasze roszczenia wobec Lotaryngii, musimy upewnić się, że wszyscy nasi partnerzy są pełni sił i gotowi do działania."
 emp_bur_lorraine_title: "Podzielone królestwo"
 emp_bur_lorraine_desc: "Nasze posiadłości na północy i południu są rozległe, lecz podział naszego dziedzictwa jest co najmniej problematyczny. Księstwa Lotaryngii i Baru stanowią brakujące ogniwo i bezsprzecznie powinny znaleźć się pod naszym panowaniem."
 emp_bur_liege_title: "Podbij Liege"
 emp_bur_liege_desc: "Historycznie Biskupstwo Liège miało znaczący głos w Watykanie i Świętym Cesarstwie Rzymskim. Co więcej, gdybyśmy mieli kontrolować ten głos, moglibyśmy lepiej reprezentować nasze interesy."
 emp_bur_join_the_empire_title: "Dołącz do Cesarstwa"
 emp_bur_join_the_empire_desc: "Posiadamy terytoria wchodzące w skład Świętego Cesarstwa Rzymskiego, lecz ponieważ w przeszłości byliśmy formalnie poddanymi Francji, nigdy do niego nie przystąpiliśmy. Członkostwo zapewniłoby nam tak potrzebną ochronę przed Francuzami... i stworzyłoby nowe możliwości rozszerzania naszych wpływów w Niemczech."
 emp_bur_crown_of_lothair_title: "Korona Lotara"
 emp_bur_crown_of_lothair_desc: "Król Franków Lotar II stworzył niegdyś potężne królestwo rozciągające się od Niderlandów po Sabaudię. Jesteśmy oczywistymi następcami jego państwa, a mimo to musimy zadowalać się niższymi tytułami. Nie możemy tego dłużej tolerować. Musimy odzyskać pozostałe ziemie Lotara i doprowadzić do koronacji na królów Lotaryngii."
 emp_bur_east_francia_title: "Podbij Państwo Wschodniofrankijskie"
 emp_bur_east_francia_desc: "Jako główni spadkobiercy Imperium Karolingów, naszym zadaniem jest przywrócenie dawnej chwały Franków poprzez odzyskanie Wschodniej Francji i zbudowanie potężnego imperium w Niemczech."
 emp_bur_carolingian_empire_title: "Cesarstwo Karolingów"
 emp_bur_carolingian_empire_desc: "Nasi frankijscy przodkowie władali rozległymi terytoriami Francji, Niemiec i Włoch pod rządami wielkiego króla Karola Wielkiego. Wzrost potęgi naszego narodu sprawił, że ta dawna chwała jest w naszym zasięgu. Będziemy naśladować naszych przodków i zdominujemy całą Europę."
 emp_bur_carolingian_empire_effect_tooltip: "Ranga rządów państwa §Y[Root.GetName]§! zostaje zmieniona na §YCesarstwo§!."
 emp_bur_frisia_title: "Podbij Fryzję"
 emp_bur_frisia_desc: "Reszta regionu Niderlandów należy do nas. Tylko Fryzja pozostaje poza naszą kontrolą - będziemy mieć ją dla siebie."
 emp_bur_flemish_trade_title: "Zdominuj Kanał La Manche"
 emp_bur_flemish_trade_desc: "Miasta portowe w Niderlandach są bogatymi ośrodkami handlowymi, ale muszą stawić czoła ostrej konkurencji ze strony Anglików zza kanału La Manche. Musimy się upewnić, że mamy monopol na handel w tych rejonach."
 emp_bur_english_alliance_title: "Sojusz z Anglią"
 emp_bur_english_alliance_desc: "Kiedy przyjdzie czas na pozbycie się francuskiego zagrożenia na zachodzie, Anglicy będą naszym naturalnym sojusznikiem. Powinniśmy rozważyć zapewnienie sobie ich lojalności."
 emp_bur_league_of_public_weal_title: "Liga Dobra Publicznego"
 emp_bur_league_of_public_weal_desc: "W praktyce jesteśmy poddanymi króla Francji, ale dzięki naszej sile udało nam się zapewnić sobie znaczną autonomię. Francuzi mają nam to za złe i dążą do centralizacji swojej władzy. Musimy przeciwdziałać tym wysiłkom i - przy wsparciu regionalnej szlachty Francji - doprowadzić do powszechnego buntu przeciwko królowi."
 emp_bur_league_of_public_weal_trigger_tooltip: "Wszyscy wasale Francji zlokalizowani w regionie francuskim:\n   Opinia o państwie §Y[Root.GetName]§! co najmniej §Y100§!."
 emp_bur_league_of_public_weal_trigger_tooltip2: " sojuszników §Y[Root.GetName]§! jest rywalami §YFrancji§!."
 emp_bur_league_of_public_weal_effect_tooltip: "Państwo §Y[This.GetName]§! otrzyma permanentne roszczenia terytorialne do wszystkich prowincji posiadanych przez §YFrancję§! w regionie Francji."
 emp_bur_king_of_the_franks_title: "Król Franków"
 emp_bur_king_of_the_franks_desc: "Musimy zniszczyć siłę króla Francji oraz przejąć jego tytuły i domenę dla siebie."
 emp_bur_king_of_the_franks_effect_tooltip: "Wszyscy wasale §YFrancji§! w regionie Francji stają się wasalami §Y[Root.GetName]§!."
 emp_bur_influence_the_princes_title: "Wpłyń na książęta"
 emp_bur_influence_the_princes_desc: "W przeszłości byliśmy uważani w Cesarstwie za obcych. To się musi zmienić. Powinniśmy działać w kierunku poprawy naszej pozycji wśród członków Cesarstwa."
 emp_bur_influence_the_princes_trigger_tooltip: " państw członkowskich Cesarstwa:\n      Opinia o §Y[Root.GetName]§! wynosi co najmniej §Y60§!."
 emp_bur_feast_of_pheasants_title: "Uczta bażantów"
 emp_bur_feast_of_pheasants_desc: "Wzrost potęgi Osmanów jest niepokojący. Musimy przygotować się do nowej krucjaty, aby ponownie wypędzić ich z wybrzeży Europy."
 emp_bur_feast_of_pheasants_trigger_tooltip: " sojuszników §Y[Root.GetName]§! rywalizuje z §YOsmanami§!."
 emp_bur_feast_of_pheasants_effect_tooltip: "§YPodczas Uczty Bażantów wypowiemy Turkom krucjatę!§!\n\nWszystkie państwa wyznające religię §Y[Root.Religion.GetName]§!, które spełniają poniższe warunki:\n   Mają dodatnią opinię o §Y[Root.GetName]§!.\n   Ich opinia o §YOsmanach§! jest niższa niż §Y50§!.\nOtrzymują na 5 lat casus belli §YŚwięta wojna§! przeciwko §YOttomanom§!."
 emp_bur_feast_of_pheasants_event_effect_tooltip: "Wszystkie państwa wyznające religię §Y[From.Religion.GetName]§!, które spełniają poniższe warunki:\n   Mają dodatnią opinię o §Y[From.GetName]§!.\n   Ich opinia o §YOsmanach§! jest niższa niż §Y50§!.\nOtrzymują na 5 lat casus belli §YŚwięta wojna§! przeciwko §YOttomanom§!."
 emp_bur_lead_the_empire_title: "Rządź Cesarstwem"
 emp_bur_lead_the_empire_desc: "Jeśli mamy być częścią Imperium, to z pewnością tylko po to, abyśmy mogli objąć nad nim przywództwo. Tron jest do wzięcia."
 emp_bur_secure_the_lowlands_title: "Zabezpiecz Niderlandy"
 emp_bur_secure_the_lowlands_desc: "Narody Holandii mają ambicje niepodległościowe. Musimy je stłumić i upewnić się, że nasza kontrola nad podległymi nam terytoriami pozostanie pełna i nieprzerwana."
 emp_bur_appease_the_estates_title: "Udobruchaj klasy"
 emp_bur_appease_the_estates_desc: "Utrzymanie zadowolenia stanów często wymagało od [Root.GetAdjective] [Root.Monarch.GetTitle] żmudnego balansowania sprzecznych interesów. Musimy położyć kres niezgodzie i podziałom nękającym nasze ziemie oraz zadbać, by wszyscy współpracowali na rzecz większej chwały i dobrobytu."
 new_flavour_bur.1.name: "Uczta bażanta"
 new_flavour_bur.1.desc: "[From.Monarch.GetTitle] [From.GetAdjective] zgromadził wszystkich [From.Monarch.GetHerHis] przyjaciół i sojuszników na wystawnej uczcie. Pośród rozmaitych kosztownych rozrywek [From.Monarch.GetSheHe] zwrócił się do wszystkich, którzy stanęli przed [From.Monarch.GetHerHim], z apelem o rozpoczęcie nowej krucjaty przeciwko [TUR.GetUsableName]. Goście byli olśnieni przepychem uroczystości, a liczne beczki najlepszego burgundzkiego wina zdawały się rozbudzać apetyt na wojnę. Dopiero następny poranek pokaże jednak, czy ten zapał przetrwa noc."
 new_flavour_bur.1.A: "Rozumiem."
 new_flavour_bur.2.A: "Poganie będą się przed nami kulić ze strachu!"
 new_flavour_bur.3.name: "Uczta bażanta"
 new_flavour_bur.3.desc: "[From.Monarch.GetTitle] [From.GetAdjective] zgromadził wszystkich [From.Monarch.GetHerHis] przyjaciół i sojuszników na wystawnej uczcie. Pośród rozmaitych wystawnych hulankek [From.Monarch.GetSheHe] zwrócił się do wszystkich, którzy stanęli przed [From.Monarch.GetHerHim], z apelem o rozpoczęcie nowej krucjaty przeciwko naszemu państwu. Goście byli olśnieni przepychem uroczystości, a liczne beczki najlepszego burgundzkiego wina zdawały się rozbudzać apetyt na wojnę. Dopiero następny poranek pokaże jednak, czy ten zapał przetrwa noc."
 new_flavour_bur.3.A: "Niech przyjdą."
 new_flavour_bur.4.name: "Dziedzictwo Lotara"
 new_flavour_bur.4.desc.pope: "Podczas uroczystości, w której uczestniczył cały dwór burgundzki oraz liczni zagraniczni dostojnicy, papież [PAP.Monarch.GetName] koronował dziś [Root.Monarch.GetName] na króla Lotaryngii. Uroczystości trwały do późnej nocy, a nadworni bardowie śpiewali ballady o dawnych i współczesnych władcach dynastii [Root.Monarch.Dynasty.GetName], porównując [Root.Monarch.GetName] do Lotara, a nawet wielkiego Karola Wielkiego. Dla wszystkich jest jasne, że rozpoczęła się nowa epoka chwały i dobrobytu naszego państwa. [Root.GetBurHREAscensionText]"
 new_flavour_bur.4.desc.nopope: "Podczas uroczystości, w której uczestniczył cały dwór burgundzki oraz liczni zagraniczni dostojnicy, [Root.bur_bishop_name.GetName], biskup Verdun, koronował dziś [Root.Monarch.GetName] na króla Lotaryngii. Uroczystości trwały do późnej nocy, a nadworni bardowie śpiewali ballady o dawnych i współczesnych władcach dynastii [Root.Monarch.Dynasty.GetName], porównując [Root.Monarch.GetName] do Lotara, a nawet wielkiego Karola Wielkiego. Dla wszystkich jest jasne, że rozpoczęła się nowa epoka chwały i dobrobytu naszego państwa. [Root.GetBurHREAscensionText]"
 BUR_HRE_positive: "\n\nZe swojej strony cesarz Świętego Cesarstwa Rzymskiego, [Emperor.Monarch.GetName] z państwa [Emperor.GetName], z radością przyjmuje nas do [Emperor.Monarch.GetHerHis] Cesarstwa jako nową i potężną siłę, wzmacniając tym samym [Emperor.Monarch.GetHerHis] imperium."
 BUR_HRE_neutral: "\n\nCesarz Świętego Cesarstwa Rzymskiego, [Emperor.Monarch.GetName] z państwa [Emperor.GetName], był obecny na uroczystości i złożył [Emperor.Monarch.GetHerHis] gratulacje, choć [Emperor.Monarch.GetSheHe] podobno z niepokojem obserwuje, jak te wydarzenia wpłyną na równowagę sił w Cesarstwie."
 BUR_HRE_hostile: "\n\nCesarz Świętego Cesarstwa Rzymskiego, [Emperor.Monarch.GetName] z państwa [Emperor.GetName], ostentacyjnie nie pojawił się na uroczystości i przesłał jedynie lakoniczne potwierdzenie przyjęcia do wiadomości naszego nowego tytułu. Wygląda na to, że [Emperor.Monarch.GetSheHe] słusznie obawia się, iż pragniemy uzurpować sobie [Emperor.Monarch.GetHerHis] tytuł."
 BUR_HRE_nostring: ""
 new_flavour_bur.4.A: "Przyjmiemy dziedzictwo Lotara."
 new_flavour_bur.4.B: "Musimy sami wykuć nasz los."
 new_flavour_bur.5.name: "Dwór [Root.Monarch.GetRulerGen]"
 new_flavour_bur.5.desc: "Wszyscy z podziwem spoglądają na przepych dworu [Root.Monarch.GetTitle] [Root.Monarch.GetName], powszechnie uznawanego za najwystawniejszy w Europie — stolicę dobrego smaku, mody i rycerskości. [Root.Monarch.GetName] otacza opieką wszystkie sztuki piękne: zamawia gobeliny, gości kompozytorów szkoły burgundzkiej, gromadzi liczne rękopisy i zaprasza utalentowanych malarzy. Na [Root.Monarch.GetHerHisCap] dworze działa również Zakon Złotego Runa, a na [Root.Monarch.GetHerHis] ziemiach odbywa się wiele turniejów rycerskich."
 new_flavour_bur.5.A: "Oby trwało to jak najdłużej!"
 new_flavour_bur.6.name: "Liga Dobra Publicznego"
 new_flavour_bur.6.desc: "[From.Monarch.GetTitle] państwa [From.GetName] od pewnego czasu próbuje podważyć naszą władzę, podsycając niezgodę wśród poddanych i otwarcie sprzeciwiając się naszym rozkazom. Teraz [From.Monarch.GetSheHe] posunął się jeszcze dalej: przy wsparciu części naszych poddanych [From.Monarch.GetSheHeCap] ogłosił powstanie Ligi Dobra Publicznego — sojuszu, którego celem jest trwałe wyzwolenie się spod naszego panowania. Musimy natychmiast zareagować, w przeciwnym razie szybko utracimy kontrolę nad Francją."
 new_flavour_bur.6.A: "Należy ich zdławić."
 new_flavour_bur.7.name: "[From.Monarch.GetName]: Król Franków"
 new_flavour_bur.7.desc: "[From.Monarch.GetName], [From.GetAdjective] [From.Monarch.GetTitle], uzurpował sobie tytuł króla Franków należący do [Root.Monarch.GetName]. Nielojalni wasale feudalni masowo nas opuścili i złożyli przysięgę wierności rosnącemu w siłę [From.GetAdjective] [From.GovernmentName]."
 new_flavour_bur.7.A: "Non! To désastre!"
 opinion_bur_rebellious_burgundy: "Liga Dobra Publicznego"
 bur_italian_king: "Rex Italiae"
 desc_bur_italian_king: "Przywróciliśmy jedność włoskim państwom-miastom, które teraz całym sercem uznają nas za swoich panów."
 bur_channel_trading: "Dominacja handlowa na kanale La Manche"
 desc_bur_channel_trading: "Nasi kupcy na kanale La Manche są w stanie prześcignąć wszystkich konkurentów, przynosząc naszemu skarbcowi obfite bogactwa."
 bur_english_diplomacy: "Burgundzka dyplomacja"
 desc_bur_english_diplomacy: "Nasza niezrównana biegłość dyplomatyczna jeszcze bardziej wzrosła dzięki niedawnym rozgrywkom po drugiej stronie kanału La Manche."
 bur_king_of_franks: "Rex Francorum"
 desc_bur_king_of_franks: "Tron Francji jest nasz! Naprzód, ku większej chwale!"
 bur_influence_over_princes: "Wpływ na książąt Cesarstwa"
 desc_bur_influence_over_princes: "Nasze wysiłki dyplomatyczne opłaciły się. Cieszymy się teraz znaczącą pozycją wśród książąt Imperium."
 bur_carolingia: "Universum Regnum"
 desc_bur_carolingia: "Nowe Imperium Karolińskie powstało na prochach starego. Będziemy naśladować naszych przodków i zdominujemy całą Europę."
 bur_german_empire: "Rex Germaniae"
 desc_bur_german_empire: "Nasze chwalebne imperium obejmuje poddanych z wielu kultur. Francuzi, Niemcy, Włosi - wszyscy są teraz zaliczani do naszych poddanych. Musimy stworzyć wspólną tożsamość, aby zapewnić długowieczność naszych zdobyczy."
 bur_seed_is_strong: "Silne korzenie dynastii"
 desc_bur_seed_is_strong: "Nasza dynastia już raz otarła się o bycie zapomnianą. Postaramy się być na tyle 'aktywni', aby w przyszłości uniknąć takiego podobnego losu."
 bur_we_shall_not_be_annexed: "Przywrócenie autorytetu dynastii"
 desc_bur_we_shall_not_be_annexed: "Umocnienie władzy państwowej Burgundii pozwoliło nam podjąć zdecydowane działania na rzecz centralizacji państwa."
 bur_special_place_in_popes_heart: "Papieska przysługa"
 desc_bur_special_place_in_popes_heart: "Papież jest bardzo zadowolony z naszej pobożności - naprawdę cieszymy się szczególnym miejscem w jego sercu."
 bur_pope_is_hated: "Wróg papieża"
 desc_bur_pope_is_hated: "Pokazaliśmy nikczemnemu papieżowi, co dokładnie o nim myślimy. Niech nikt nas nie posądza o bycie sympatykami jego sprawy."
 bur_lowlands_secured_mod: "Zabezpieczono Niderlandy"
 desc_bur_lowlands_secured_mod: "Ambicje niepodległościowe, jakie żywiły narody Niderlandów, zostały zdławione. Nie pozostaje im nic innego, jak zaakceptować naszą władzę."
 bur_realm_united_mod: "Burgundzkie Niderlandy"
 desc_bur_realm_united_mod: "Księstwa Niderlandów zostały włączone do Księstwa Burgundii i rządzą się teraz tymi samymi prawami, co reszta królestwa."
 bur_prestigious_duchy_mod: "Patronat dworski"
 desc_bur_prestigious_duchy_mod: "Dwór burgundzki należy do najwspanialszych w Europie - to europejska stolica dobrego smaku, mody i rycerstwa."
 opinion_bur_usurpers_of_france: "Uzurpatorzy Królestwa Franków"
 pal_expand_a_bit_title: "Poszerzenie naszych posiadłości"
 pal_expand_a_bit_desc: "Nasze ziemie dziedziczne w Palatynacie Reńskim należą do największych państw terytorialnych tej części Niemiec. Mimo to są dość skromne w porównaniu z posiadłościami potężniejszych władców. Musimy rozszerzyć nasze terytorium i wzmocnić państwo, aby stać się dominującą siłą w Cesarstwie."
 pal_connect_oberpfalz_title: "Droga do Amberga"
 pal_connect_oberpfalz_desc: "Na wschodzie odziedziczyliśmy terytoria znane jako Górny Palatynat. Są jednak odizolowane od reszty naszych ziem. Konieczne są dalsze podboje, aby zapewnić integralność terytorialną naszego państwa."
 pal_one_true_wittelsbach_title: "Zjednocz Wittelsbachów"
 pal_one_true_wittelsbach_desc: "Posiadłości rodu Wittelsbachów zostały podzielone w 1294 roku, przy czym starsza gałąź rodu przejęła Palatynat, a młodsza Bawarię. O niegodności młodszych Wittelsbachów do posiadania tak żyznego terytorium świadczy fakt, że nie mogli go utrzymać w całości. Powinniśmy dochodzić prawa naszych przodków do tych ziem i zagarnąć je dla siebie."
 pal_kingdom_of_the_rhine_title: "Królestwo Renu"
 pal_kingdom_of_the_rhine_desc: "Nadrenia to terytorium bogatych miast i żyznych pól uprawnych, które, gdyby zostało zjednoczone, stanowiłoby znaczącą siłę. Jest jednak bardzo rozdrobniona, z małymi państewkami rozciągającymi się od źródeł do morza i niewielkim poczuciem wspólnej tożsamości wśród jej mieszkańców. Musimy przekuć się w potężne państwo zdolne do zdominowania Renu i zapewnienia jedności jego ludom, a także zdobyć dla siebie tytuł Królów Nadrenii."
 pal_protect_from_france_title: "Zachodnia granica"
 pal_protect_from_france_desc: "Jako że Francuzi planują ekspansję w Niemczech, nasze położenie może stać się jednym z ich pierwszych celów. Musimy zaznaczyć naszą przewagę i zapewnić, że my - i Imperium - jesteśmy bezpieczni przed atakami z zachodu."
 pal_protect_from_france_trigger_tooltip: "Żadne państwo w regionie Francji nie posiada większej armii niż [Root.GetName]."
 pal_religious_leadership_title: "Przywództwo religijne"
 pal_religious_leadership_desc: "Ci, którzy pragną większej niezależności od papieża i bardziej sprawiedliwego podziału władzy religijnej w Europie, oczekują od nas militarnego przywództwa. Nie możemy ich zawieść."
 pal_religious_leadership_trigger_tooltip: " sąsiednich państw wyznaje wiarę §Y[Root.Religion.GetName]§!."
 pal_kingdom_of_bohemia_title: "Korona Czeska"
 pal_kingdom_of_bohemia_desc: "Sympatycy w Czechach sugerowali, że gdybyśmy zjednoczyli nasze terytoria z ich, stanowilibyśmy skuteczną przeciwwagę dla austriackich Habsburgów. Powinniśmy działać zgodnie z ich planami i przejąć władzę w Imperium lub przynajmniej spróbować i ponieść porażkę w blasku chwały..."
 pal_glorious_palatine_title: "Chwalebny palatyn"
 pal_glorious_palatine_desc: "Nasz tytuł wywodzi się od hrabiów palatynów dawnych królów Franków. Nie możemy jednak spocząć na laurach, jakie przynosi nam jego starożytne pochodzenie. Jeśli mamy być traktowani poważnie, nasz dwór musi zachowywać najwyższe standardy przepychu i prezentować naszą świetność całej Europie."
 pal_kingdom_of_the_rhine_mod: "Królestwo Renu"
 desc_pal_kingdom_of_the_rhine_mod: "Zjednoczyliśmy terytoria wzdłuż Renu w jedno zjednoczone, potężne państwo."
 pal_great_king: "Zimowy król"
 desc_pal_great_king: "Zdobywszy koronę Czech, z pewnością staniemy się wielką potęgą w Niemczech... jeśli tylko uda nam się powstrzymać naszych wrogów na tyle długo, byśmy mogli cieszyć się owocami naszych zdobyczy."
 pal_glorious_palatine_mod: "Chwalebny palatyn"
 desc_pal_glorious_palatine_mod: "Jako jeden z czołowych krajów związkowych Niemiec zawsze dbamy o zachowanie najwyższych standardów przepychu."
 gen_hre_theocracy_house_of_god_title: "Dom Boży"
 gen_hre_theocracy_house_of_god_desc: "Musimy zadbać o to, by nasz Pan odbierał należną Mu cześć w całym kraju, w świątyniach godnych Jego imienia."
 gen_hre_theocracy_lords_army_title: "Armia Pana"
 gen_hre_theocracy_lords_army_desc: "Jeśli my nie będziemy chronić naszej wiary, to nikt tego nie zrobi. Musimy zbudować potężną armię, aby wzbudzić strach w niewierzących!"
 theocracy_lords_army_mod: "Armia Pana"
 desc_theocracy_lords_army_mod: "Nasza armia jest gotowa chronić naszą wiarę!"
 gen_hre_theocracy_divine_empire_title: "Boskie cesarstwo"
 gen_hre_theocracy_divine_empire_desc: "Podziały religijne godzą w Cesarstwo i prowadzą je ku upadkowi. Dla zbawienia własnych dusz musimy dopilnować, by jedyna prawdziwa wiara była wyznawana w całych Niemczech."
 gen_hre_theocracy_divine_empire_trigger_tooltip: " prowincji w regionach północnych i południowych Niemiec wyznaje wiarę §Y[Root.Religion.GetName]§!."
 theocracy_divine_empire_mod: "Niebiańskie imperium"
 desc_theocracy_divine_empire_mod: "Dzięki naszym wysiłkom i sojuszom, udało nam się wykorzenić herezję w imperium."
 bishop_elector_relations_with_emperor_title: "Relacje z cesarzem"
 bishop_elector_relations_with_emperor_desc: "Bez wsparcia ze strony cesarza jesteśmy bezbronni. Musimy mieć pewność, że będzie nas chronił przed każdym wrogiem."
 bishop_elector_good_diplomacy: "Cesarska dyplomacja"
 desc_bishop_elector_good_diplomacy: "Cesarz daje nam siłę, by wesprzeć nasz święty autorytet."
 bishop_elector_elect_emperors_title: "Wybierz cesarzy"
 bishop_elector_elect_emperors_desc: "Nasza pozycja jako Elektora daje nam wpływ na przywództwo cesarstwie. Musimy wykorzystać ten wpływ, aby zapewnić, że tylko ci, którzy okażą nam swoją przychylność, zostaną wybrani na najwyższy urząd."
 bishop_elector_elects_emperor: "Kluczowe głosowanie"
 desc_bishop_elector_elects_emperor: "Nasz głos jest uznawany za wyznacznik nastrojów podczas elekcji cesarskich, ponieważ wskazaliśmy zwycięzców trzech ostatnich wyborów."
 opinion_I_like_my_bishop_electors: "Przychylność cesarska"
 bishop_elector_ecclesiastic_league_title: "Liga Kościelna"
 bishop_elector_ecclesiastic_league_desc: "Biskupi-elektorzy Kolonii, Trewiru i Moguncji muszą działać jako jedność, aby zapewnić duchowieństwu silny głos w sprawach cesarskich."
 bishop_elector_ecclesiastic_league: "Liga Kościelna"
 desc_bishop_elector_ecclesiastic_league: "Nasz sojusz z innymi biskupami-elektorami daje duchowieństwu silny głos w polityce cesarstwa."
 bishop_elector_unity_in_faith_title: "Jedność w wierze"
 bishop_elector_unity_in_faith_desc: "W obliczu religijnych wstrząsów rozdzierających Europę tylko wspólna obrona wiary [Root.Religion.GetName] pozwoli biskupom-elektorom zagwarantować przestrzeganie właściwych praktyk religijnych w całym Cesarstwie."
 bishop_elector_unity_in_faith: "Jedność w wierze"
 desc_bishop_elector_unity_in_faith: "Kolonia, Trewir i Moguncja wspólnie bronią Imperium przed bezwyznaniowością i herezją."
 mai_take_erfurt_title: "Własność Erfurtu"
 mai_take_erfurt_desc: "Przysługują nam prawa do miasta Erfurt. Nadszedł czas, by je wyegzekwować i dopilnować, aby miasto rzeczywiście należało do nas."
 kol_consolidate_lands_title: "Zjednocz włości"
 kol_consolidate_lands_desc: "Nasze westfalskie prowincje są oddzielone od miast Kolonii i Bonn. Powinniśmy powiększyć nasze terytorium, aby przestały być rozdzielone."
 kol_subdue_munster_title: "Ujarzmij Münster"
 kol_subdue_munster_desc: "Biskup Münster ma duże terytorium kościelne. Chociaż w przeszłości był wobec nas bardzo niezależny, to gdybyśmy mogli przyłączyć jego ziemie do naszych, stanowilibyśmy siłę, z którą należałoby się liczyć w północnych Niemczech."
 tri_found_the_university_title: "Załóż Uniwersytet w Trewirze"
 tri_found_the_university_desc: "Musimy stworzyć centrum nauki, w którym będziemy mogli kształcić przyszłych teologów, prawników i medyków, a także przyciągnąć wiodące umysły z Niemiec, aby służyły ku chwale nasz[Root.GetGovGender_nasz] [Root.GetGovNameGen]."
 emp_ned_seize_ceylon_title: "Zajmij Cejlon"
 emp_ned_seize_ceylon_desc: "Bogata wyspa Cejlon jest nie tylko lukratywnym źródłem dochodów, ale także kluczowym punktem orientacyjnym dla statków płynących dalej na wschód. Jeśli my jej nie zajmiemy, nasi wrogowie z pewnością to zrobią."
 emp_ned_found_batavia_title: "Załóż Batawię"
 emp_ned_found_batavia_desc: "Nasza rosnąca obecność w Indiach Wschodnich wymaga pobliskiego centrum administracyjnego, gdzie nasi kupcy mogą być chronieni przez nasze działa, a podległe nam statki mogą bezpiecznie cumować."
 emp_ned_conquer_malacca_title: "Podbij Malakkę"
 emp_ned_conquer_malacca_desc: "Malakka to ważne miasto w Indiach Wschodnich i nie możemy pozwolić, aby dostało się w ręce naszych konkurentów. Musi zostać zdobyta!"
 emp_ned_dutch_formosa_title: "Holenderska Formoza"
 emp_ned_dutch_formosa_desc: "Aby lepiej przechwytywać handel naszych konkurentów na Dalekim Wschodzie, a także pomóc naszym własnym kupcom w handlu z Chinami i Japonią, powinniśmy założyć bazę na wyspie Formosa."
 emp_ned_assert_dutch_sovereignty_title: "Ugruntuj naszą niepodległość"
 emp_ned_assert_dutch_sovereignty_desc: "Nie możemy dłużej tolerować sytuacji, w której nasze bogactwo jest uszczuplane, aby napełnić kieszenie jakiegoś odległego szlachcica. Najważniejsze jest, abyśmy uzyskali pełną niezależność i prawo do kształtowania własnej przyszłości."
 emp_ned_assert_dutch_sovereignty_tt: "Posiadać §Y4§! prowincje narodowe"
 emp_ned_challenge_spanish_power_title: "Rzuć rękawicę Hiszpanii"
 emp_ned_challenge_spanish_power_desc: "Iberyjczycy nieustannie spoglądają na nasz handel, a nawet na nasze ziemie z wyraźną zazdrością. Musimy być gotowi, by im się przeciwstawić!"
 emp_ned_challenge_spanish_power_1_tt: "Posiadaj co najmniej §Y33%§! siły morskiej §YHiszpanii§!"
 emp_ned_challenge_spanish_power_2_tt: "Posiadaj co najmniej §Y50%§! siły morskiej §YKastylii§!"
 emp_ned_challenge_spanish_power_3_tt: "Posiadaj co najmniej §Y50%§! siły morskiej §YAragonii§!"
 emp_ned_fixed_garrison_system_title: "System garnizonów"
 emp_ned_fixed_garrison_system_desc: "Nasze ojczyzny nie są duże, dlatego tym ważniejsza jest obrona tego, co mamy. Musimy stworzyć silny system garnizonowy, który będzie w stanie chronić nasz ukochany kraj."
 emp_ned_fixed_garrison_system_tt: " prowincji w regionie §YNiderlandów§! posiada najnowocześniejszy typ fortu dostępny na obecnym poziomie technologii militarnej."
 emp_ned_charter_the_voc_title: "Przywileje HKW"
 emp_ned_charter_the_voc_desc: "Konsorcja kupieckie, takie jak Heren XVII, chętnie poszerzają swoje wpływy i inwestują w handel zamorski. Gdybyśmy wsparli utworzenie czegoś na kształt Brytyjskiej Kompanii Wschodnioindyjskiej, zyski mogłyby być ogromne!"
 emp_ned_colonize_the_cape_title: "Skolonizuj Kapsztad"
 emp_ned_colonize_the_cape_desc: "Przylądek Dobrej Nadziei jest ważnym punktem na trasie do Indii Wschodnich. Ustanowienie tam bazy i zaoferowanie bezpiecznej przystani dla naszych statków w trakcie długiej podróży na wschód jest rozważnym wyborem."
 emp_ned_discover_australia_title: "Odkryj Australię"
 emp_ned_discover_australia_desc: "Nasze kontakty w Indiach mówią o krainie na południe od nich, pełnej dziwnych stworzeń, takich jak gigantyczne szczury z sakiewkami i bóbr z dziobem kaczki. Nawet jeśli te ziemie nie są bogate w surowce, to jest to coś, co musimy zobaczyć na własne oczy."
 emp_ned_settle_north_america_title: "Osadnictwo w Ameryce Płn."
 emp_ned_settle_north_america_desc: "Ameryka produkuje wiele lukratywnych towarów, których zignorowanie byłoby głupotą. Istotne jest, abyśmy zaznaczyli swoją obecność na północy, gdzie być może moglibyśmy zaangażować się w handel futrem z bobrów i szukać jakiegoś rodzaju porozumienia z tubylcami."
 emp_ned_baltic_bulk_trades_title: "Wspieraj handel masowy"
 emp_ned_baltic_bulk_trades_desc: "Zboże znad Bałtyku od dawna jest przewożone na zachód przez naszych kupców, lecz wciąż istnieje tam wiele niewykorzystanych możliwości. Rozszerzenie naszej obecności na bałtyckich rynkach mogłoby przynieść dochody wystarczające do sfinansowania wyprawy w poszukiwaniu kolejnych rynków zbytu."
 emp_ned_invest_in_the_rich_trades_title: "Inwestycje w dochodowy handel"
 emp_ned_invest_in_the_rich_trades_desc: "Handlowanie zbożem i drewnem przynosi korzyści, jednakże istnieje bardziej dochodowy handel, w którym możemy uczestniczyć. Wybrzeże Gwinei oferuje kość słoniową i inne poszukiwane towary. Bylibyśmy głupcami, gdybyśmy nie próbowali przejąć kontroli nad tym interesem."
 emp_ned_charter_the_wic_title: "Przywileje HKZ"
 emp_ned_charter_the_wic_desc: "Indie Wschodnie nie są jedynym źródłem bajecznych bogactw za granicą. Więcej pieniędzy można zarobić na handlu transatlantyckim, który moglibyśmy mieć, gdyby rząd był skłonny wesprzeć kilku kluczowych kupców..."
 emp_ned_explore_caribbean_title: "Zbadaj Karaiby"
 emp_ned_explore_caribbean_desc: "Karaiby mogłyby być doskonałym miejscem na założenie kolonii - musimy tylko najpierw dowiedzieć się, co tam jest."
 emp_ned_colonize_brazil_title: "Skolonizuj Brazylię"
 emp_ned_colonize_brazil_desc: "Brazylia to kraj bogactwa i cudów. Byłoby mądrze z naszej strony skolonizować te tereny, lub wziąć je, jeśli ktoś popełnił błąd kolonizacji tych ziem, którymi jesteśmy zainteresowani."
 emp_ned_strengthen_the_vroedschappen_title: "Wzmocnij Vroedschappen"
 emp_ned_strengthen_the_vroedschappen_desc: "Vroedschap, czyli skromna rada miejska, stanowi fundament naszego wspaniałego systemu rządów. Zyskanie jej przychylności oznacza zdobycie przychylności całego narodu."
 emp_ned_strengthen_the_vroedschappen_tt: " prowincji w regionie §YNiderlandów§! posiada §YWarsztaty§! lub §YKantory§!."
 emp_ned_reform_the_generality_lands_title: "Prowincje Generalne"
 emp_ned_reform_the_generality_lands_desc: "Ważne jest, aby zarządzać naszym krajem sprawiedliwie, nigdy nie faworyzując zbytnio jednej prowincji kosztem drugiej. W tym celu rząd centralny musi czasami bezpośrednio zarządzać ziemią, aby zapobiec zbyt dużemu wpływowi jednej regionalnej frakcji na sprawy kraju."
 emp_ned_adjust_the_general_means_title: "Reforma systemu podatkowego"
 emp_ned_adjust_the_general_means_desc: "Generaliteitsmiddelen to centralny mechanizm finansów publicznych naszego państwa, rozdzielający ciężar podatkowy między prowincje. Niektórzy zarzucają rządowi, że nie rozkłada go sprawiedliwie — i trzeba przyznać, że mogą mieć rację. Gdybyśmy zadbali, by wszystkie podatki nie pochodziły z jednej prowincji, znacznie ograniczylibyśmy niezadowolenie pozostałych z systemu podatkowego."
 emp_ned_adjust_the_general_means_tt: " posiadanych prowincji w regionie §YNiderlandów§! ma co najmniej §Y8§! §Ypodstawowego podatku§!."
 emp_ned_interest_of_holland_title: "Interes Holandii"
 emp_ned_interest_of_holland_desc: "Wolna konkurencja i wolny rząd były kluczami do naszego sukcesu, a przynajmniej tak twierdzili niektórzy z naszych największych myślicieli. Rozsądnym wydaje się promowanie skutecznej polityki handlowej, która już tak dobrze nam służy."
 emp_ned_the_true_freedom_title: "Prawdziwa wolność"
 emp_ned_the_true_freedom_desc: "Wolności, jakimi cieszy się nasze społeczeństwo, pozwalają naszym obywatelom angażować się w naprawdę niezwykłe działania. Zwłaszcza interesy kupieckie zawdzięczają niektóre ze swoich sukcesów naszemu szczególnemu podejściu do działalności gospodarczej i praw obywatelskich."
 emp_ned_merge_the_stadtholders_title: "Zjednocz stadhouderów"
 emp_ned_merge_the_stadtholders_desc: "Każda prowincja ma prawo mianować własnego stadhoudera, pełniącego funkcję przywódcy politycznego i wojskowego. Wraz z rozwojem naszego państwa i jednoczeniem prowincji wielu namiestników zaczyna jednak stwarzać problemy, szczególnie dla armii. Potrzebujemy jednego dowódcy kierującego całością działań wojskowych. Najprościej będzie mianować tę samą osobę namiestnikiem kilku prowincji."
 emp_ned_contracts_of_correspondence_title: "Kontrakty regentów"
 emp_ned_contracts_of_correspondence_desc: "Regenci to szczególna klasa prowincjonalnych patrycjuszy, przywódców rad miejskich i mędrców, którzy zasiadają w komitetach narodowych. Wśród nich zdarzają się przebłyski partyjniactwa, powodowane ambicjami dynastycznymi, osobistymi pretensjami, a rzadko prawdziwymi różnicami ideologicznymi. Jako że ci ludzie są naszymi głównymi administratorami i odpowiadają za zarządzanie naszymi miastami, w interesie rządu leży złagodzenie napięć między regentami. Jednym z prostszych rozwiązań jest zachęcanie do zawierania kontraktów między regentami, w których zgadzają się oni na naprzemienne sprawowanie kontroli nad jakimś urzędem politycznym. W ten sposób, nawet jeśli jednej rodzinie nie podoba się inna rodzina u władzy, wie ona, że jej kolej przyjdzie wkrótce, jeśli tylko poczeka."
 emp_ned_general_reglement_title: "Ogłoszenie Generalnego Reglement"
 emp_ned_general_reglement_desc: "Niezliczone prawa prowincjonalne naszych ziem stwarzają wiele okazji do nadużyć i korupcji. Ogólne przepisy, jednakowe dla wszystkich prowincji, mogą kolidować z tradycyjnymi prawami stanów, lecz w znacznym stopniu przyczynią się do zapewnienia sprawnych i uczciwych rządów dla całego społeczeństwa."
 emp_ned_the_glorious_revolution_title: "Chwalebna rewolucja"
 emp_ned_the_glorious_revolution_desc: "Wyspy Brytyjskie od dawna są źródłem konkurencji dla naszego kraju. Szczęśliwie dla nas, Brytyjczycy mają swoje własne problemy wewnętrzne i przy odpowiedniej okazji moglibyśmy wykorzystać jedną z ich wewnętrznych bolączek, aby usprawiedliwić naszą własną... interwencję w sprawy brytyjskie."
 emp_ned_je_maintiendrai_title: "Je Maintiendrai"
 emp_ned_je_maintiendrai_desc: "Nasze sukcesy są naprawdę chwalebne, a nasze przywództwo nie ma sobie równych. Nasi ludzie i narody świata muszą wiedzieć, jak wspaniali jesteśmy naprawdę."
 emp_ned_indonesia_cot_title: "Indonezyjski handel"
 emp_ned_indonesia_cot_desc: "Indie Wschodnie są pełne przypraw i innych lukratywnych towarów. Musimy zadomowić się w Indiach i przejąć kontrolę nad tak dużą częścią handlu, jak to tylko możliwe."
 emp_ned_secure_dejima_title: "Zabezpiecz Dejimę"
 emp_ned_secure_dejima_desc: "Wyspa Dejima leży na południu Japonii, tuż przy portowym mieście handlowym Nagasaki. Japońskie władze niechętnie patrzą na zakładanie przez nas licznych placówek w całym kraju, lecz zdobycie przyczółka na Dejimie wystarczyłoby, by wejść do japońskich sieci handlowych."
 emp_ned_sea_beggars_title: "Gezowie"
 emp_ned_sea_beggars_desc: "Aby bronić naszych praw i swobód, musimy stworzyć siły, które będą w stanie chronić nasze wybrzeża i nękać naszych wrogów. Marynarka złożona z lekkich okrętów, które mogą dowolnie atakować morza, byłaby doskonałym rozwiązaniem."
 emp_ned_reform_the_admiralty_colleges_title: "Kolegia admiralskie"
 emp_ned_reform_the_admiralty_colleges_desc: "Profesjonalna marynarka wojenna wymaga wyszkolonych dowódców. Potrzebujemy uregulowanego systemu szkoleń i awansów, aby zapewnić, że doskonali marynarze mogą stać się doskonałymi kapitanami, a doskonali kapitanowie mogą stać się doskonałymi admirałami."
 emp_ned_leiden_university_title: "Uniwersytet w Lejdzie"
 emp_ned_leiden_university_desc: "Uczciwy dyskurs i wolność intelektualna to fundamenty, na których opierają się nasze uczelnie. Wsparcie państwa i promocja naszych szacownych i otwartych instytucji z pewnością przyciągnie utalentowane umysły z całej Europy."
 emp_ned_control_coromandel_trade_title: "Kontroluj Koromandel"
 emp_ned_control_coromandel_trade_desc: "Z naszej bazy na Cejlonie do bogatych rynków południowych Indii dzieli nas zaledwie krótki rejs. Zignorowanie tej okazji do poszerzenia naszych wpływów gospodarczych byłoby czystym szaleństwem."
 emp_ned_dutch_east_indies_title: "Holenderskie Indie Wsch."
 emp_ned_dutch_east_indies_desc: "Nasz handel w Indiach kwitnie, ale jego bezpieczeństwo i naszych kupców są zagrożone tak długo, jak długo nasza kontrola ekonomiczna nad regionem nie idzie w parze z kontrolą polityczną. Dla dalszego dobrobytu regionu i naszych interesów narodowych, konieczne jest, abyśmy przejęli kontrolę nad jak największą częścią Indii."
 ned_security_on_and_from_the_sea: "Bezpieczeństwo na morzu i od strony morza"
 desc_ned_security_on_and_from_the_sea: "Flota godna tego miana pozwala nam chronić nasze wybrzeża i interesy."
 ned_fixed_garrisons: "Stałe garnizony"
 desc_ned_fixed_garrisons: "Współpraca rządu centralnego i stanów tworzy potężne zaplecze do rekrutacji żołnierzy garnizonowych."
 ned_leiden_faculty: "Wydział w Lejdzie"
 desc_ned_leiden_faculty: "Sława Uniwersytetu w Lejdzie przyciąga najbystrzejsze umysły do naszego państwa."
 ned_sea_beggar_activity: "Aktywność gezów"
 desc_ned_sea_beggar_activity: "Nasze lekkie okręty doskonale sprawdzają się w utrudnianiu handlu naszych wrogów i wspieraniu naszej własnej niezależnej potęgi handlowej."
 ned_west_indies_charter: "Czarter Indii Zachodnich"
 desc_ned_west_indies_charter: "Rozwój handlu zagranicznego stwarza możliwości pozyskania nowych źródeł bogactwa."
 ned_distributed_tax_burden: "Równomierny rozkład podatków"
 desc_ned_distributed_tax_burden: "System podatkowy, który akceptują wszystkie prowincje, pomaga zapewnić równie skuteczny pobór danin przez każdą władzę."
 ned_dutch_overseas_trade: "Holenderski handel zamorski"
 desc_ned_dutch_overseas_trade: "Nasi kupcy sięgają coraz dalej, szukając nowych rynków, na które mogą wejść."
 ned_dutch_free_trade: "Holenderski wolny handel"
 desc_ned_dutch_free_trade: "Istotnym składnikiem naszych wolności i praw jest wolność gospodarcza, pobudzająca ducha kupieckiego wśród naszych obywateli."
 DUTCH_CHANNEL_SUPREMACY: "Holenderska dominacja na kanale La Manche"
 DUTCH_DEJIMA: "Holenderska Dejima"
 DUTCH_EAST_INDIES_TRADE: "Holenderskie Indie Wsch."
 emp_lan_confront_the_lombards_title: "Konfrontacja z Lombardczykami"
 emp_lan_confront_the_lombards_desc: "Władcy Lombardii są zagrożeniem dla naszego państwa i przyszłego dobrobytu. Musimy zmiażdżyć Lombardczyków, zanim oni zmiażdżą nas!"
 emp_lan_adriatic_access_title: "Dostęp do Adriatyku"
 emp_lan_adriatic_access_desc: "Wenecka laguna jest zarówno bezpieczną przystanią dla statków, jak i niezwykle dochodowym portem handlowym. Musimy koniecznie przejąć te bogate, otoczone wodą ziemie i wykorzystać je dla dobra państwa [Root.GetName]."
 emp_lan_personal_diplomacy_title: "Dyplomacja personalna"
 emp_lan_personal_diplomacy_desc: "Czym byłoby państwo bez księcia? Aby [Root.GetName] mogło odnieść sukces, potrzebujemy zdolnego przywódcy, obdarzonego rzadkim talentem do prowadzenia rozmów na zdradliwych wodach włoskiej dyplomacji."
 emp_lan_italian_league_title: "Związek Włoski"
 emp_lan_italian_league_desc: "Lokalne problemy wymagają lokalnych rozwiązań. Sprzymierzanie się z większymi potęgami poza granicami Włoch prowadzi jedynie do zależności, długów i utraty autonomii. Musimy być zdolni do samodzielnego zarządzania."
 emp_lan_italian_league_tt: "Być sojusznikiem co najmniej §Y2§! państw ze stolicami w §YItalii§!"
 emp_lan_tuscan_birthright_title: "Toskańskie pierworództwo"
 emp_lan_tuscan_birthright_desc: "Zielone wzgórza Toskanii wołają do nas. Zbyt długo ograniczaliśmy się do naszej małej domeny. Nadszedł czas, abyśmy się rozwinęli i ruszyli do Toskanii."
 emp_lan_heights_of_grandeur_title: "Marzenia o wielkości"
 emp_lan_heights_of_grandeur_desc: "Nasz skromny [Root.GovernmentName] nie może już dłużej pozostawać skromny. Wraz z rozwojem państwa wzrosły również nasze ambicje. Zasługujemy na wyższy status i wszystkie związane z nim przywileje."
 emp_lan_end_genoese_competition_title: "Koniec rywalizacji z Genuą"
 emp_lan_end_genoese_competition_desc: "Choć szanujemy prawa Genui, jej uprzywilejowana pozycja jednego z największych emporiów handlowych w basenie Morza Śródziemnego zdławiła nasze własne wysiłki kupieckie. Dla dobra naszej ekonomii, Genua musi zostać doprowadzona do porządku."
 emp_lan_reaffirm_civic_values_title: "Potwierdź wartości obywatelskie"
 emp_lan_reaffirm_civic_values_desc: "Nasze czcigodne państwo jest bastionem postaw patrycjuszowskich i myśli postępowej. Musimy podtrzymywać nasze tradycje dla dobra stabilności naszego społeczeństwa i siły politycznej naszego rządu."
 emp_lan_hand_picked_bureaucrats_title: "Dobrani biurokraci"
 emp_lan_hand_picked_bureaucrats_desc: "Osoby obejmujące najważniejsze stanowiska administracyjne w naszym państwie muszą być wzorem profesjonalizmu, niezależnie od swojego wcześniejszego statusu. Aby wprowadzić tę zmianę, musimy jednak uzyskać zgodę klasy rządzącej — w przeciwnym razie możemy wywołać poważny opór."
 emp_lan_immaculate_government_title: "Niepokalany rząd"
 emp_lan_immaculate_government_desc: "W obliczu wszystkich traktatów, układów i obietnic składanych ludowi reputacja naszego [Root.GovernmentName] musi pozostać nieskazitelna. Jeśli pojawi się choć cień wątpliwości co do naszych słów, cała nasza dyplomacja i intrygi mogą pójść na marne."
 emp_lan_make_haste_slowly_title: "Spiesz się powoli"
 emp_lan_make_haste_slowly_desc: "Porywczość jest fatalną cechą przywódcy, lecz szybkie działanie po podjęciu decyzji jest zaletą. Ostrożnie budowaliśmy naszą pozycję w państwie, przedstawiając każdą politykę jako służącą dobru kraju i jego mieszkańców. Teraz, gdy nasza potęga osiągnęła szczyt, a starannie przygotowane plany zaczynają przynosić owoce, możemy przystąpić do działania."
 emp_lan_florentine_renaissance_title: "Florencki renesans"
 emp_lan_florentine_renaissance_desc: "Nasze prestiżowe i zamożne państwo jest gotowe na odrodzenie kultury — ponowne zainteresowanie sztuką, nauką i dziedziną, którą niektórzy zaczynają nazywać humanistyką. Powinniśmy zrobić wszystko, co w naszej mocy, by wesprzeć ten ruch."
 emp_lan_commission_the_mona_lisa_title: "Zleć Mona Lisę"
 emp_lan_commission_the_mona_lisa_desc: "Jedna z dam w [Root.Capital.GetCapitalName] ma... osobliwy uśmiech, niezwykle trudny do uchwycenia na obrazie. Musimy znaleźć wyjątkowo utalentowanego artystę, który zdoła oddać jej wyraz twarzy. A kto wie? Być może osoba zdolna namalować ją tak, jak na to zasługuje, posiada również inne talenty."
 emp_lan_influence_the_church_title: "Wpłyń na Kościół"
 emp_lan_influence_the_church_desc: "Nasze wpływy polityczne i kulturowe w państwie są znaczne, lecz dotkliwie brakuje nam znaczenia w sferze duchowej. Powinniśmy zrobić wszystko, by zdobyć wpływy w instytucjach naszej wiary, a tym samym oddziaływać na każdy aspekt życia poddanych i zapewnić sobie bardziej prominentną pozycję."
 emp_lan_control_the_church_title: "Kontroluj Kościół"
 emp_lan_control_the_church_desc: "Nasi ludzie zasiadają teraz w wyższych szczeblach hierarchii naszego kościoła. Żaden z nich nie spoczywa jednak na samym szczycie. Musimy wykorzystać ten moment i kontrolować kierunek rozwoju samej wiary!"
 emp_lan_academy_of_the_bran_title: "Akademia Plew"
 emp_lan_academy_of_the_bran_desc: "Nasza potęga i prestiż sięgają we wszystkich kierunkach. Nasze wpływy odcisnęły piętno na dziedzictwie kulturowym kraju i wierze obywateli, lecz pozostała jeszcze jedna dziedzina, w której nie zaznaczyliśmy swojej obecności: język naszego ludu. Dzięki naszej wyjątkowej pozycji możemy ujednolicić język i upowszechnić jego wzorcową formę wśród sąsiadów. Blask naszego państwa nigdy nie zgaśnie, dopóki będzie rozbrzmiewać nasza mowa."
 emp_lan_reform_the_monte_title: "Zreformuj Monte"
 emp_lan_reform_the_monte_desc: "Finanse są krwiobiegiem naszego państwa, a jego gospodarka opiera się na wspólnym długu publicznym zwanym Monte. Potrzebujemy rygorystycznych przepisów, by obywatele ufali funduszowi, jednak z czasem standardy nieco się rozluźniły, a stan finansów stał się wątpliwy. Jedynym sposobem na odzyskanie zaufania do Monte jest udowodnienie, że można sięgnąć po zgromadzone tam środki i że fundusz rzeczywiście posiada deklarowane zabezpieczenie."
 emp_lan_reliable_mints_title: "Księgi bankowe Medyceuszy"
 emp_lan_reliable_mints_desc: "Zaufanie stanowi fundament finansów. Jeśli ludzie przestaną ufać naszym finansom, nasze banki upadną. Musimy prowadzić nieskazitelną dokumentację i oferować uczciwe oprocentowanie, aby obywatele nadal ufali naszym instytucjom finansowym."
 emp_lan_reliable_mints_tt: "Posiadaj §Ymniejszą inflację niż jakikolwiek sąsiad§! lub posiadaj inflację wynoszącą §Y0§!"
 emp_lan_public_works_title: "Roboty publiczne"
 emp_lan_public_works_desc: "Silna gospodarka i zdrowe finanse pozwalają nam sfinansować rozległe przedsięwzięcia budowlane w całym kraju. W końcu po co gromadzić pieniądze, jeśli nie można się nimi pochwalić i ich wydać?"
 emp_lan_public_works_tt: "§Y6§! posiadanych prowincji:\nWybudowana jakakolwiek §Ymanufaktura§!"
 emp_lan_levee_the_arno_title: "Obwałuj Arno"
 emp_lan_levee_the_arno_desc: "Arno przepływa przez serce Florencji, lecz od zawsze jest rzeką dziką i zdradliwą. Powodzie zdarzają się regularnie, wyrządzając rozległe szkody w mieście i okolicy. Dysponując naszymi zasobami i potęgą, nadszedł czas, by wznieść najsilniejsze wały przeciwpowodziowe we Włoszech i ujarzmić niesforne Arno."
 lan_affable_leadership: "Przystępne przywództwo"
 desc_lan_affable_leadership: "Przywódcy naszego państwa słyną z osobistego uroku i charyzmy."
 lan_da_vincis_notebooks: "Notatniki Da Vinci'ego"
 desc_lan_da_vincis_notebooks: "Ta zdumiewająca kolekcja dokumentów zawiera liczne szkice, ryciny i zapiski, które mogą stać się podstawą przełomowych badań."
 lan_la_crusca: "La Crusca"
 desc_lan_la_crusca: "Akademia della Crusca to szanowana akademia językowa, promująca włoską działalność literacką i badania nad znormalizowanym językiem włoskim."
 lan_tuscan_naval_expansion: "Toskańska ekspansja morska"
 desc_lan_tuscan_naval_expansion: "Stocznie tętnią życiem, a nasza flota rozwija się w zadziwiającym tempie."
 lan_florentine_renaissance_modifier: "Florencki renesans"
 desc_lan_florentine_renaissance_modifier: "Mnogość nowych idei wychodzących z naszego kraju sprawia, że jesteśmy bijącym sercem renesansu."
 lan_secure_public_funds: "Zabezpiecz fundusze publiczne"
 desc_lan_secure_public_funds: "Dowód naszej kondycji finansowej sprawia, że finansowanie długu jest jedną z najbezpieczniejszych inwestycji, jaką może zrobić obywatel."
 lan_medici_banking: "Bankowość Medyceuszy"
 desc_lan_medici_banking: "Księgowość podwójnego zapisu i inne innowacje finansowe pomagają utrzymać stabilność naszej waluty i siłę finansów."
 lan_arno_flood_controls: "Regulacja rzeki Arno"
 desc_lan_arno_flood_controls: "Wały i śluzy kontrolują nurt Arno przepływającego przez Florencję, zapobiegając katastrofalnym powodziom."
 lan_monumental_construction: "Monumentalne budowle"
 desc_lan_monumental_construction: "Finansowane przez nas budowle są przedmiotem rozmów w całym mieście i dają nam doświadczenie w realizacji jeszcze większych przedsięwzięć."
 lan_clean_government: "Uczciwa administracja"
 desc_lan_clean_government: "Nasi pracowici i uczciwi urzędnicy nie tylko budzą zaufanie, lecz także chronią nas przed podstępem i intrygami."
 emp_ser_moravian_arms_title: "Armia morawska"
 emp_ser_moravian_arms_desc: "Aby odzyskać wpływy w regionie, musimy najpierw odbudować potęgę militarną. Wzmocnienie naszej armii, przez długi czas zaniedbywanej, znacznie przyczyni się do odnowienia naszej pozycji w regionie."
 emp_ser_hungarian_belgrade_title: "Dziedzictwo Stefana IV"
 emp_ser_hungarian_belgrade_desc: "W 1404 roku Stefan Lazarević otrzymał Belgrad od Węgier w ramach układu dyplomatycznego, choć Serbia utraciła miasto po jego śmierci. Jego następca, Đurađ, oddał Belgrad królowi Węgier, który przypadkiem był jego wujem. Choć sytuacja zmieniła się od czasów Lazarevicia, warto sprawdzić, czy Węgry nadal są tak skłonne do układów terytorialnych jak na początku XV wieku."
 emp_ser_hungarian_belgrade_mission_tooltip: "Jeśli §YWęgry§! posiadają §Y[4239.GetName]§!, a Serbia utrzymuje dobre stosunki z państwem [HUN.GovernmentName], zostanie uruchomione wydarzenie §YZobowiązania serbskie§!."
 emp_ser_fortress_of_belgrade_title: "Twierdza Belgrad"
 emp_ser_fortress_of_belgrade_desc: "Belgrad leży u zbiegu Dunaju i Sawy, w jednym z najbardziej strategicznych miejsc na całych Bałkanach. Pozostawienie tak ważnej pozycji bez obrony byłoby nierozsądne. Gdybyśmy ją ufortyfikowali, otaczające umocnienia ukształtowanie terenu uczyniłoby ją niemal niezdobytą. Musimy ufortyfikować Belgrad!"
 emp_ser_fortress_of_belgrade_1_tt: "Posiadać §YZamek§!\n§RWraz z rozwojem technologii militarnej konieczna będzie budowa wyższych poziomów fortyfikacji.§!"
 emp_ser_fortress_of_belgrade_2_tt: "Posiadać §YBastion§!\n§RWraz z rozwojem technologii militarnej konieczna będzie budowa wyższych poziomów fortyfikacji.§!"
 emp_ser_fortress_of_belgrade_3_tt: "Posiadać §YFort gwiaździsty§!\n§RWraz z rozwojem technologii militarnej konieczna będzie budowa wyższych poziomów fortyfikacji.§!"
 emp_ser_danubian_power_title: "Dunajska siła"
 emp_ser_danubian_power_desc: "Musimy opłacać nasze armie i utrzymywać twierdze, na szczęście jednak leżymy przy jednym z najbardziej ruchliwych szlaków handlowych Europy. Powinniśmy wykorzystać ten handel i pozwolić, by pieniądze płynęły do naszego skarbca."
 emp_ser_northern_trade_title: "Północny handel"
 emp_ser_northern_trade_desc: "Przepływ handlu przez nasze ziemie zależy od popytu na północy i zachodzie. Jeśli wnikniemy na rynki naszych odbiorców, zwiększymy obroty na własnych targowiskach i będziemy mogli żądać wyższych cen za przewożone towary."
 emp_ser_pacify_albanian_lands_title: "Spacyfikuj ziemie Albanii"
 emp_ser_pacify_albanian_lands_desc: "Za panowania Stefana Duszana Albania podporządkowała się naszemu dworowi. Po jego śmierci stworzone przez niego imperium zaczęło jednak upadać, a Albańczycy ogłosili niepodległość. Nadszedł czas, by ponownie upomnieć się o nasze dawne prawa i odzyskać Albanię."
 emp_ser_expand_adriatic_presence_title: "Zajmij porty Adriatyku"
 emp_ser_expand_adriatic_presence_desc: "Nie wszyscy nasi rywale są na tyle blisko, by można było pokonać ich armią lądową. Potrzebujemy floty, a do jej budowy niezbędne są porty."
 emp_ser_suppress_bosnian_heresy_title: "Walcz z bośniackimi herezjami"
 emp_ser_suppress_bosnian_heresy_desc: "Bośnia jest... osobliwą krainą. Jej mieszkańcy ulegają dawnym herezjom, a przywódcy odmawiają jedności z naszą wiarą. Bośnia potrzebuje przewodnictwa, a my musimy jej go udzielić."
 emp_ser_secure_the_sava_title: "Zabezpiecz Sawę"
 emp_ser_secure_the_sava_desc: "Sawa przepływa przez Chorwację i Slawonię, zanim uchodzi do Dunaju w Belgradzie. To jedna z najważniejszych dróg wodnych na Bałkanach, ustępująca znaczeniem jedynie potężnemu Dunajowi. Pozostawienie jej poza naszą kontrolą oznacza oddanie w ręce wrogów ważnego szlaku handlowego i drogi przemarszu wojsk. Musimy ją zabezpieczyć!"
 emp_ser_encroach_on_the_germans_title: "Wkrocz do Niemiec"
 emp_ser_encroach_on_the_germans_desc: "Niemcy rzucają długi cień na nasze ziemie. Ich tak zwane „Cesarstwo” wielokrotnie mieszało się w sprawy Bałkanów, a ich królowie, książęta i hrabiowie pożądają naszych ziem. Dość tego! Zepchniemy Niemców z powrotem za ich granice i pokażemy im, że z Serbią nie należy igrać."
 emp_ser_tame_the_magnates_title: "Okiełznaj magnatów"
 emp_ser_tame_the_magnates_desc: "Nieustanne spory naszej szlachty są jedną z głównych przyczyn upadku imperium Stefana Duszana. Aby zbudować silniejsze i stabilniejsze państwo, musimy znaleźć sposób na osłabienie możnowładców i sprawić, by ich drobne waśnie przestały zagrażać dobru państwa."
 emp_ser_retake_macedonia_title: "Odzyskaj Macedonię"
 emp_ser_retake_macedonia_desc: "Serbia niegdyś kontrolowała ziemie na południu, a nawet miała dostęp do Morza Egejskiego. Nasza potęga rośnie z każdym dniem, więc nadszedł czas, by uderzyć i ponownie odzyskać ziemie, które niegdyś do nas należały!"
 emp_ser_legacy_of_the_sclavinias_title: "Dziedzictwo Sklawinów"
 emp_ser_legacy_of_the_sclavinias_desc: "Dawno temu nasi przodkowie osiedlili się głęboko na ziemiach greckich, docierając nawet na Peloponez. Ziemie te należą nam się z racji urodzenia i musimy dążyć do ich odzyskania."
 emp_ser_protectors_of_christendom_title: "Obrońcy chrześcijaństwa"
 emp_ser_protectors_of_christendom_desc: "Grecy z trudem chronili wiarę na Bałkanach. Teraz ten święty obowiązek spoczywa na naszych barkach. Musimy zrobić wszystko, co w naszej mocy, by bronić wiernych pod osłoną naszego autorytetu."
 emp_ser_take_constantinople_title: "Zajmij Konstantynopol"
 emp_ser_take_constantinople_desc: "Konstantynopol jest jednym z najświętszych i najbardziej czcigodnych miast Europy. Powinniśmy podporządkować sobie miasto i jego zaplecze, aby pomnażało naszą sprawiedliwą chwałę, a my mogliśmy zapewnić mu państwo godne jego majestatu."
 emp_ser_emperor_and_autocrat_title: "Cesarz i autokrata"
 emp_ser_emperor_and_autocrat_desc: "Nasze rozległe ziemie rozciągają się przez całe Bałkany, a nasza potęga nie ma sobie równych. Nadszedł czas, by przywrócić nam należny status i sprawić, aby wszyscy w kraju i poza jego granicami uznali nas za cesarstwo."
 emp_ser_reform_the_nomocanon_title: "Zreformuj Nomokanon"
 emp_ser_reform_the_nomocanon_desc: "Prawa kościelne, którymi kieruje się nasze duchowieństwo, są przestarzałe i opierają się na dawnych tradycjach, które nie przystają do współczesności. Doprecyzowanie podstawowych zasad naszej wiary i udzielenie wskazówek kapłanom pomoże zjednoczyć lud oraz Kościół."
 ser_has_any_icon: "Wybrać §Ydowolną ikonę§!"
 emp_ser_promote_the_patriarchate_title: "Promuj patriarchat"
 emp_ser_promote_the_patriarchate_desc: "Nasza wiara jest silna, lecz może być jeszcze silniejsza. Kościół potrzebuje naszej pomocy, by zdobyć należny mu autorytet i jedność, a w zamian sam obdarzy nas większym zaufaniem."
 emp_ser_guardians_of_st_sava_title: "Strażnicy Św. Sawy"
 emp_ser_guardians_of_st_sava_desc: "Dzięki silnemu Kościołowi i silnemu państwu jesteśmy naturalnymi przywódcami wyznawców wiary [Root.Religion.GetName]. Nadszedł czas, by przyjąć rolę opiekunów i stać się prawdziwymi obrońcami wiary."
 emp_ser_law_of_the_pious_title: "Prawo pobożnego cesarza"
 emp_ser_law_of_the_pious_desc: "U szczytu potęgi naszego dawnego imperium ustanowiliśmy nowy kodeks praw, oparty na czcigodnych tradycjach, takich jak Kodeks Justyniana, oraz praktycznych rozporządzeniach naszych monarchów. Nadszedł czas, by dokonać przeglądu i rewizji tych przepisów oraz dostosować je do współczesności."
 emp_ser_reissue_the_novo_brdo_code_title: "Wznów kodeks górniczy"
 emp_ser_reissue_the_novo_brdo_code_desc: "Kodeks górniczy to późnośredniowieczny zbiór przepisów dotyczących wydobycia surowców i organizacji pracy. Wraz z rozwojem naszych ziem i odkrywaniem nowych zasobów musimy zadbać, by Kodeks górniczy pozostawał aktualny i odpowiadał obecnym potrzebom."
 emp_ser_great_school_of_belgrade_title: "Wielka szkoła"
 emp_ser_great_school_of_belgrade_desc: "Nie całe nasze bogactwo może pochodzić z kopalń, a cały prestiż — z podbojów. Musimy uczynić z Serbii potęgę intelektualną. W tym celu powinniśmy założyć najlepszy uniwersytet na Bałkanach, który przyciągnie zdolnych studentów i będzie wspierał nowe idee."
 ser_novo_brdo_code: "Kodeks Novo Brdo"
 desc_ser_novo_brdo_code: "Kodeks Novo Brdo stanowi główną część serbskiego prawa górniczego i reguluje wydobycie w Novo Brdo, jednym z największych ośrodków górniczych kraju."
 ser_great_school_modifier: "Wielka szkoła"
 desc_ser_great_school_modifier: "Wielka Szkoła pobudza rozwój intelektualny naszego państwa i zachęca do poszukiwania innowacyjnych rozwiązań."
 ser_moravian_valor: "Morawska waleczność"
 desc_ser_moravian_valor: "Mieszkańców doliny Morawy rozpala słuszny zapał, a wielu z nich jest gotowych chwycić za broń w obronie ojczyzny."
 ser_citadel_of_belgrade: "Cytadela Belgradzka"
 desc_ser_citadel_of_belgrade: "Potężne fortyfikacje chroniące Belgrad są dodatkowo zabezpieczone przez naturalne ukształtowanie terenu."
 ser_united_balkans: "Zjednoczone Bałkany"
 desc_ser_united_balkans: "Ludy Bałkanów zostały zjednoczone w granicach naszego państwa i świętują nasze łagodne rządy."
 ser_expanding_trade_networks: "Rozbudowa sieci handlowej"
 desc_ser_expanding_trade_networks: "Nasi kupcy z niezwykłą energią zdobywają nowe rynki i błyskawicznie zawierają kolejne umowy, rozbudowując naszą prężną sieć handlową."
 ser_caesaropapism: "Cezaropapizm"
 desc_ser_caesaropapism: "Rola rządu w kierowaniu naszą wiarą wzmocniła zdolność Kościoła do szerzenia religii i wspierania naszej polityki."
 SER_PATRIARCHATE_SUPPORTED_BY_STATE: "Patriarchat wspierany przez państwo"
 flavor_ser.EVTNAME1: "Serbskie zobowiązania"
 flavor_ser.EVTDESC1: "Rząd Serbii zwrócił się do nas z prośbą o przekazanie im prowincji [4239.GetName]. Przypominają, że już dwukrotnie okazaliśmy Serbii przyjaźń, oddając im to miasto, a ponowne uczynienie tego byłoby jedynie podtrzymaniem tradycji. Oczywiście będą zachwyceni, jeśli przyjmiemy ich prośbę, i wściekli, jeśli odmówimy."
 flavor_ser.EVTOPTA1: "Przekażemy [4239.GetName] Serbii."
 flavor_ser.EVTOPTB1: "Niedorzeczne! [4239.GetName] należy wyłącznie do nas."
 flavor_ser.EVTNAME2: "Węgry zwracają [4239.GetName]"
 flavor_ser.EVTDESC2: "Węgry przyjęły naszą prośbę i w geście przyjaźni ponownie przekazały nam [4239.GetName]."
 flavor_ser.EVTOPTA2: "Niech żyje przyjaźń!"
 flavor_ser.EVTNAME3: "Węgry odrzucają naszą prośbę!"
 flavor_ser.EVTDESC3: "Węgry bezczelnie odrzuciły naszą prośbę i nie chcą uznać, że wzajemna przyjaźń wymaga wzajemnych gestów dyplomatycznych!"
 flavor_ser.EVTOPTA3: "Czy oni nie wiedzą, na czym polega dyplomacja?"
 flavor_ser.EVTNAME4: "Trzeci Rzym"
 flavor_ser.EVTDESC4: "Nasi żołnierze weszli do nowo ochrzczonego miasta Carogródu, dawnego Konstantynopola, aby uczcić heroiczne zwycięstwa, które doprowadziły do tego momentu. Wraz z tym nowym podbojem prowincji [Root.GetName] będzie postrzegane w oczach świata jako prawdziwy Trzeci Rzym!\n\nPozostaje tylko zdecydować o stolicy naszego odnowionego narodu; czy pozostanie ona w wielkim mieście [Root.Capital.GetName], czy też przeniesiemy dwór do Carogrodu?"
 flavor_ser.EVTOPTA4: "Carogród będzie naszą stolicą!"
 flavor_ser.EVTOPTB4: "[Root.Capital.GetName] będzie jeszcze wspanialsza!"
 emp_ita_prosperity_for_all_title: "Dobrobyt dla wszystkich"
 emp_ita_prosperity_for_all_desc: "Nasze wielkie zjednoczenie nie może ograniczać się wyłącznie do polityki. Musimy zrobić wszystko, by zapewnić wszystkim Włochom bezpieczeństwo i siłę gospodarczą, tak aby każdy mógł cieszyć się dobrobytem."
 emp_ita_develop_the_south_title: "Rozwiń południe"
 emp_ita_develop_the_south_desc: "Sama stabilność nie wystarczy, by poprawić los całego społeczeństwa. Szczególnie południowe Włochy od wieków cierpią z powodu trudnych warunków. Jeśli chcemy, by wszyscy Włosi byli zadowoleni z naszych rządów, musimy poświęcić szczególną uwagę Mezzogiorno."
 emp_ita_continue_the_renaissance_title: "Kontynuuj renesans"
 emp_ita_continue_the_renaissance_desc: "Włochy od dawna są kolebką myśli intelektualnej i osiągnięć artystycznych. Powinniśmy jak najlepiej wspierać te wspaniałe tradycje i rozbudowywać ośrodki edukacyjne, które tak wiele uczyniły dla szerzenia nowych idei oraz inspirowania kolejnych pokoleń myślicieli i artystów."
 emp_ita_italia_transalpina_title: "Italia Transalpina"
 emp_ita_italia_transalpina_desc: "Prowansja i Sabaudia mają historyczne związki z naszym wielkim państwem. Powinniśmy zrobić wszystko, by je umocnić, na przykład poprzez podbój tych ziem."
 emp_ita_the_seven_provinces_title: "Siedem prowincji"
 emp_ita_the_seven_provinces_desc: "Oksytańczycy z południowej Francji od dawna utrzymują związki z Italią, a nasze kultury, poglądy i społeczeństwa wzajemnie na siebie oddziałują. Słuszne będzie wspieranie tych więzi i włączenie południowej Francji do naszego państwa."
 emp_ita_the_gallic_wars_title: "Wojny galijskie"
 emp_ita_the_gallic_wars_desc: "Dawno temu nasi przodkowie wyruszyli na podbój Galii i przynieśli jej cywilizację. Szczerze mówiąc, najwyższy czas, byśmy zrobili to ponownie."
 emp_ita_give_him_back_his_legions_title: "Powrót jego legionów"
 emp_ita_give_him_back_his_legions_desc: "Wkroczyliśmy głęboko na dawne ziemie galijskie, lecz nasze osiągnięcia wciąż przyćmiewają podboje wielkiego Juliusza Cezara. Musimy podjąć wyprawę i dokonać tego, czego nie zdołali starożytni Rzymianie: pokonać Germanów w Lesie Teutoburskim!"
 emp_ita_alpine_defenses_title: "Alpejska obrona"
 emp_ita_alpine_defenses_desc: "Naturalną północną granicę Italii stanowią Alpy, lecz same góry nie powstrzymają najeźdźców. Musimy zadbać o odpowiednie umocnienia, aby wrogie armie nie mogły przedostać się przez alpejskie przełęcze na nasze ziemie."
 emp_ita_take_the_littoral_title: "Zajmij wybrzeże"
 emp_ita_take_the_littoral_desc: "Italia kontroluje wiele portów nad Adriatykiem, lecz liczne inne państwa również posiadają tam swoje przystanie. Rozsądnie będzie zabezpieczyć wybrzeże i nie dopuścić, by obcy wtrącali się w nasze sprawy na tych wodach."
 emp_ita_redeem_tirolo_title: "Odzyskanie Tyrolu"
 emp_ita_redeem_tirolo_desc: "Tyrol, jak nazywają go Niemcy, to rozległy obszar alpejski, który przez wieki był skrzyżowaniem szlaków i bastionem wielu wielkich imperiów, w tym Rzymian. Wśród tamtejszych gór wciąż mieszkają niektórzy z naszych rodaków, zwłaszcza na południu. Zdobycie tych ziem pozwoliłoby nam przyłączyć kolejnych Włochów i stworzyć potężną linię obronną na północy."
 emp_ita_humiliate_austria_title: "Upokórz Austrię"
 emp_ita_humiliate_austria_desc: "Austriacy od dawna są cierniem w naszym boku i wciąż udają, że są od nas lepsi. Posunęli się nawet do bezczelnego ogłoszenia się cesarzami „rzymskimi”! Nadszedł czas, by pokazać im, że nie wolno z nami igrać."
 emp_ita_a_real_roman_empire_title: "Prawdziwe Imp. Rzymskie"
 emp_ita_a_real_roman_empire_desc: "Nasze domeny rozciągają się na rozległych obszarach, a rywale zostali upokorzeni. Nadszedł czas, byśmy uznali się za jedynych prawdziwych dziedziców wielkości Rzymu."
 emp_ita_spagna_tarraconense_title: "Hiszpania Tarrakońska"
 emp_ita_spagna_tarraconense_desc: "Nasza kontrola nad Morzem Śródziemnym nigdy nie będzie pełna, dopóki w pobliżu pozostaną intruzi tacy jak Hiszpanie. Musimy umocnić naszą władzę na wschodnim wybrzeżu Półwyspu Iberyjskiego i powstrzymać Hiszpanów przed naruszaniem naszych wód."
 emp_ita_hispaniae_title: "Hispaniae"
 emp_ita_hispaniae_desc: "Słabi Hiszpanie wciąż upierają się przy zacofanym życiu z dala od naszych łagodnych rządów. Musimy wyciągnąć do nich rękę i pomóc im rozkwitnąć pod światłym przewodnictwem Italii."
 emp_ita_complete_the_risorgimento_title: "Ukończ Risorgimento"
 emp_ita_complete_the_risorgimento_desc: "Choć stworzyliśmy już państwo włoskie, nasza praca jeszcze się nie skończyła! Wciąż żyją Włosi, którzy pragną ponownego zjednoczenia ze swoimi braćmi. Musimy wyzwolić cały nasz lud spod obcego panowania!"
 emp_ita_answer_the_roman_question_title: "Kwestia rzymska"
 emp_ita_answer_the_roman_question_desc: "Naród włoski i papiestwo znalazły się w niezręcznym położeniu. Powołując się na tradycję i historię, papiestwo rości sobie prawa do rozległych obszarów środkowej Italii. Z kolei naród i geografia przemawiają za prawem Italii do panowania nad całym półwyspem. Napięcia między tymi instytucjami nie ustaną, dopóki nie uda się zawrzeć trwalszego porozumienia."
 emp_ita_a_place_among_the_great_powers_title: "Pośród mocarstw"
 emp_ita_a_place_among_the_great_powers_desc: "Nasz prestiż i potęga niewiele znaczą, jeśli sąsiedzi ich nie uznają. Musimy zapewnić sobie miejsce wśród światowych mocarstw i sprawić, by traktowały nas jak równych sobie pod względem wpływów i siły."
 emp_ita_cross_the_pindus_title: "Przekrocz Pindos"
 emp_ita_cross_the_pindus_desc: "Nasze panowanie nad Adriatykiem nie będzie bezpieczne, dopóki na jego zapleczu panuje niezgoda. Pokój może zapanować tam tylko pod naszymi rządami, dlatego musimy wyruszyć i objąć te rozdarte wojną ziemie naszym sprawnym zarządem."
 emp_ita_reclaim_our_latin_heritage_title: "Odzyskaj łac. dziedzictwo"
 emp_ita_reclaim_our_latin_heritage_desc: "Przed wiekami nasi przodkowie próbowali zakończyć Wielką Schizmę i przejąć kontrolę nad sercem świata wschodniorzymskiego. Przez pewien czas im się to udało, ale ich władza stopniowo słabła, a ich włości upadły. Czas spróbować ponownie."
 emp_ita_anatolian_frontier_title: "Granica anatolijska"
 emp_ita_anatolian_frontier_desc: "Nasze wschodnie posiadłości nie będą bezpieczne, dopóki Turcy zagrażają nam w Anatolii. Musimy ustanowić nową granicę w Azji Mniejszej i podporządkować sobie tych, którzy mogliby zagrozić naszym domenom."
 emp_ita_a_worthy_navy_title: "Wybitna marynarka"
 emp_ita_a_worthy_navy_desc: "Italia jest rozległym półwyspem otoczonym wielkimi wodami i licznymi potęgami morskimi. Bez godnej floty bylibyśmy bezbronni wobec blokad morskich i desantów. Musimy zbudować flotę, która obroni nasze ziemie i naszą chwałę."
 emp_ita_africa_proconsulare_title: "Africa Proconsularis"
 emp_ita_africa_proconsulare_desc: "Naszej kontroli nad Morzem Śródziemnym zagrażają berberyjscy piraci i inni łotrzy z Afryki Północnej. Jeśli chcemy rozszerzać nasze wpływy, musimy zniszczyć kryjówki piratów oraz północnoafrykańskie rządy, które ich chronią."
 emp_ita_befriend_ethiopia_title: "Zaprzyjaźnij się z Etiopią"
 emp_ita_befriend_ethiopia_desc: "Dawne legendy opowiadają o królestwie Prezbitera Jana, chrześcijańskiego władcy żyjącego za ziemiami niewiernych. Z czasem dowiedzieliśmy się więcej: sam Marco Polo wspominał o wielkim chrześcijańskim królestwie Etiopii, a nasze kontakty z tym afrykańskim państwem stale się rozwijają. Zarówno w interesie przyszłych pokoleń, jak i z powodów strategicznych powinniśmy nawiązać kontakty z Etiopczykami oraz zawrzeć z nimi więzi przyjaźni i wzajemnej ochrony."
 emp_ita_befriend_ethiopia_capital_tt: "Stolica znajduje się w regionie §YRogu Afryki§!"
 emp_ita_invade_egypt_title: "Zaatakuj Egipt"
 emp_ita_invade_egypt_desc: "Nasze włości mogą rozciągać się daleko, ale wielebny Egipt wciąż pozostaje poza naszym zasięgiem. Te bogate ziemie byłyby bramą na wschód i do lukratywnego handlu w Azji i Afryce."
 emp_ita_terra_santa_title: "Terra Santa"
 emp_ita_terra_santa_desc: "Jako wielkie państwo naszym uroczystym i prawowitym obowiązkiem jest ochrona Ziemi Świętej. Opatrzność wzywa nas do ustanowienia nowych rządów w Jerozolimie i objęcia całego Lewantu naszą pobożną administracją."
 ita_italian_prosperity: "Włoski dobrobyt"
 desc_ita_italian_prosperity: "Nasze bezpieczne i nietknięte wojną ziemie prosperują jak nigdy dotąd."
 ita_southern_focus: "Skupienie na południu"
 desc_ita_southern_focus: "Inwestycje w dobrobyt naszych południowych ziem przyniosły korzyści całemu państwu: przestępczość spada, a prawo naszego rządu dociera do coraz głębszych warstw społeczeństwa."
 ita_continued_renaissance: "Kontynuowany renesans"
 desc_ita_continued_renaissance: "Nasze wsparcie dla sztuki i nauki uczyniło z nas bastion wiedzy. Najnowsze osiągnięcia pojawiają się u nas wcześniej, a świeże wynalazki szybko znajdują zastosowanie."
 ita_further_than_caesar: "Dalej niż Cezar"
 desc_ita_further_than_caesar: "Nasze armie odniosły zwycięstwa, których nie osiągnęli Rzymianie, a nasze triumfy nie mają sobie równych w historii Italii. Cieszymy się szacunkiem, a nasze ambicje są powszechnie znane i w pełni uzasadnione."
 ita_from_po_to_toe: "Od Padu po sam czubek buta"
 desc_ita_from_po_to_toe: "Doprowadziliśmy do prawdziwego i ostatecznego zjednoczenia całej Italii. W ojczyźnie jesteśmy chwaleni za nasze dokonania, a za granicą uznawani za wschodzącą potęgę — i słusznie."
 ita_the_roman_answer: "Rzymska odpowiedź"
 desc_ita_the_roman_answer: "Kościół i Italia doszły do porozumienia, a obie strony zgadzają się, że nowe rozwiązanie przyniesie korzyści nam wszystkim."
 ita_eastern_romans: "Wschodni Rzymianie"
 desc_ita_eastern_romans: "Nasza kontrola nad byłym Cesarstwem Wschodniorzymskim oznacza, że jesteśmy w stanie wykorzystać niektóre z instytucji starego imperium, aby zwiększyć naszą zdolność do zaciągania wojska, które może być natychmiast wysłane do obrony naszych długich granic."
 ita_scipios_helmet: "Hełm Scypiona"
 desc_ita_scipios_helmet: "Nasza potęga na morzu rośnie z każdym dniem, a my po raz kolejny rzuciliśmy Afrykę Północną na kolana."
 ita_experienced_alpini: "Doświadczeni alpiniści"
 desc_ita_experienced_alpini: "Nasze walki w Alpach uczyniły z naszej piechoty szczególnie sprawnych wojowników."
 emp_ita_alpine_defenses_tooltip: "§RWraz z rozwojem technologii wojskowej, konieczne będzie budowanie wyższych poziomów fortyfikacji.§!"
 emp_ita_prosperity_for_all_tt: "Co najmniej 8 posiadanych prowincji musi osiągnąć §Ydobrobyt§!."
 emp_ita_develop_the_south_tt: "Co najmniej 5 posiadanych prowincji w §YPołudniowych Włoszech§! musi mieć co najmniej §Y25§! poziom rozwoju"
 emp_ita_the_gallic_wars_tt: "Posiadać lub mieć niebędącego trybutariuszem poddanego posiadającego co najmniej §Y50§! prowincji w regionie §YFrancji§!"
 emp_ita_redeem_tirolo_tt: "Posiadać 4 prowincje w obszarze §YTyrolu§!"
 emp_ven_aldine_monopoly_title: "Aldiński monopol"
 emp_ven_aldine_monopoly_desc: "Prasa drukarska przyniosła Wenecji wiele nowych innowacji, w tym wprowadzenie pochyłej, kursywnej czcionki nazwanej na cześć regionu w którym powstała, 'Italiką', oraz wczesną formę ochrony praw autorskich poprzez przyznanie monopolu na produkcję dzieł napisanych w języku greckim. Te innowacje w dziedzinie druku z pewnością przyczynią się do rozwoju nowych idei w całej Republice Weneckiej."
 emp_ven_plague_doctor_training_title: "Szkolenie doktorów plagi"
 emp_ven_plague_doctor_training_desc: "Lekarze zarazy są w większości amatorami. Wykwalifikowani medycy i chirurdzy zajmują się najzamożniejszymi, podczas gdy gorzej przygotowani lekarze zarazy wędrują po kraju, lecząc ludzi, których nie stać na najlepszą opiekę. Ich umiejętności są bardzo zróżnicowane, lecz wprowadzenie programu szkoleniowego, który zapewniłby im podstawową wiedzę, mogłoby znacząco poprawić stan zdrowia mieszkańców prowincji."
 emp_ven_plague_doctor_training_tt: "Mieszkańcy państwa §Y[Root.GetName]§! będą rzadziej dotknięci wydarzeniami związanymi z zarazą."
 emp_ven_promote_the_carnevale_title: "Promuj Karnawał"
 emp_ven_promote_the_carnevale_desc: "Nasz słynny karnawał sięga 1162 roku i wspaniałego zwycięstwa nad patriarchą Akwilei. Od tamtej pory uroczystości stały się jeszcze wystawniejsze, stroje bardziej wyszukane, a zabawy bardziej rozpustne. Szczerze mówiąc, ich przepych znacznie wykracza poza to, co właściwie mają upamiętniać, ale możemy to wykorzystać. Im więcej zagranicznych dyplomatów zetknie się ze wspaniałością Carnevale, tym szybciej rozejdzie się wieść o naszym bogactwie."
 emp_ven_new_pilings_title: "Nowe pale"
 emp_ven_new_pilings_desc: "Wenecja została wzniesiona na niezliczonych drewnianych palach, z których część liczy sobie setki lat. Najwyższy czas przeprowadzić niezbędne prace remontowe."
 emp_ven_patronize_the_scuole_grandi_title: "Patronuj Scuole Grandi"
 emp_ven_patronize_the_scuole_grandi_desc: "Scuole Grandi, czyli „Wielkie Szkoły” Wenecji, to rozmaite bractwa i inne świeckie organizacje społeczne. Początkowo zajmowały się głównie działalnością charytatywną, lecz z biegiem wieków rozszerzyły zakres działań. Obecnie wiele z nich wspiera muzykę, sztukę i medycynę. Objęcie tych organizacji patronatem znacznie zjedna nam zamożnych obywateli, którzy nimi kierują i zasilają ich szeregi."
 emp_ven_patronize_the_scuole_grandi_adm_advisor_tt: "Posiadać doradcę administracyjnego o umiejętności §Y2§!"
 emp_ven_patronize_the_scuole_grandi_dip_advisor_tt: "Posiadać doradcę dyplomatycznego o umiejętności §Y2§!"
 emp_ven_expand_the_doges_palace_title: "Rozbuduj pałac Dożów"
 emp_ven_expand_the_doges_palace_desc: "Pałac Dożów był budowany, odnawiany i przebudowywany wiele razy na przestrzeni wieków. Dalsza rozbudowa, bardziej ozdobna niż jakakolwiek inna w historii naszego królestwa, znacznie wzmocniłaby pozycję urzędu i naszego narodu jako całości."
 emp_ven_standardize_relazioni_title: "Ujednolicenie relazioni"
 emp_ven_standardize_relazioni_desc: "Relazioni to raporty przesyłane rządowi przez naszych ambasadorów, opisujące sytuację polityczną, finansową i społeczną państw, w których przebywają. Dokumenty te są niezbędne zarówno dla naszych działań dyplomatycznych, jak i dla utrzymania przewagi konkurencyjnej naszych kupców za granicą. Coraz częściej jednak kopie relazioni są publikowane i udostępniane każdemu, kto jest gotów zapłacić za nie wysoką cenę. Stanowi to zagrożenie dla naszej dyplomacji i bezpieczeństwa. Musimy ukrócić te praktyki i ustanowić wspólny, bezpieczny system sporządzania oraz rozpowszechniania relazioni."
 emp_ven_nuova_promissione_ducale_title: "Promissione Ducale"
 emp_ven_nuova_promissione_ducale_desc: "Promissione Ducale to przysięga urzędowa, którą musi złożyć każdy kandydat ubiegający się o urząd nowego doży Wenecji. Określa ona obowiązki doży i wyznacza granice jego władzy. Z biegiem lat niektóre ograniczenia... nieco osłabły. Gdybyśmy opracowali nową Promissione Ducale, która wyraźniej określałaby nasze wartości i rolę doży, nie tylko wzmocnilibyśmy rząd, lecz także moglibyśmy zachęcić bardziej cnotliwych kandydatów do ubiegania się o urząd."
 emp_ven_nuova_promissione_ducale_trigger_tt: "Ukończono wszystkie poziomy reform rządowych"
 emp_ven_nuova_promissione_ducale_tt: "Umiejętności kandydatów w losowaniu zostaną zwiększone o §G1§! punkt do końca gry"
 emp_ven_hire_more_venture_captains_title: "Więcej kapitanów"
 emp_ven_hire_more_venture_captains_desc: "Kapitanowie kompanii są niezbędną częścią naszych sił zbrojnych i pomagają nam rekrutować najlepszych spośród najemników. Jeśli zwiększymy nasze możliwości finansowe, by zatrudnić więcej takich kapitanów, pomogą nam oni pozyskać więcej ludzi do służby."
 emp_ven_land_grants_for_free_companies_title: "Dotacje dla kontrahentów"
 emp_ven_land_grants_for_free_companies_desc: "Koszty najemników to zawsze poważny wydatek w rządowych księgach rachunkowych, ale są sposoby, by złagodzić to obciążenie. Gdybyśmy obiecali najemnikom ziemię w zamian za ich usługi, moglibyśmy rekrutować ludzi po okazyjnych cenach. Oczywiście, będziemy potrzebować wolnej ziemi, ale nasi sąsiedzi mają jej pod dostatkiem..."
 emp_ven_expand_the_terraferma_title: "Rozszerz Terrafermę"
 emp_ven_expand_the_terraferma_desc: "Nasza flota chroni spokojne państwo przed atakami od strony morza, lecz nasza obrona lądowa jest zdecydowanie niewystarczająca. Najlepszym rozwiązaniem będzie utworzenie większej liczby terytoriów buforowych, które zmuszą wrogów do przebicia się przez nie, zanim dotrą do stolicy."
 emp_ven_north_italian_rivals_title: "Rywale północnowłoscy"
 emp_ven_north_italian_rivals_desc: "Nasz naród nigdy nie będzie bezpieczny tak długo, jak nasi zazdrośni rywale będą mieli siłę i możliwości, by uderzyć w nas w każdej chwili. Musimy być zapobiegawczy i rozbić naszych wrogów we Włoszech, zanim oni będą mogli zrobić to nam!"
 emp_ven_up_the_adige_title: "W górę Adygi"
 emp_ven_up_the_adige_desc: "Nasza obecność na kontynencie włoskim zawsze będzie niepewna, dopóki nie opanujemy Alp. Nasi wrogowie mogą swobodnie schodzić z gór, by nas atakować, i wycofywać się tam, gdy muszą przejść do obrony. Gdybyśmy sami kontrolowali alpejskie przełęcze w pobliżu naszych ziem, moglibyśmy równie swobodnie schodzić z nich do ataku i wracać na pozycje obronne."
 emp_ven_destroy_austria_title: "Zniszcz Austrię"
 emp_ven_destroy_austria_desc: "Austria przez wieki stanowiła dla nas odwieczny problem. Jej władcy wielokrotnie grozili nam, przymuszali nas i próbowali dyktować warunki. Jest tylko jeden sposób, aby położyć kres austriackiemu zagrożeniu, a jest nim całkowita klęska samej Austrii. Jeśli Austria przestanie być problemem, to będzie o jedno wyzwanie mniej dla naszego politycznego i dyplomatycznego panowania w Europie."
 emp_ven_expand_the_arsenal_title: "Powiększ arsenał"
 emp_ven_expand_the_arsenal_desc: "Arsenał Wenecki to czcigodna i kluczowa instytucja, odpowiedzialna za budowę i utrzymanie floty naszego spokojnego państwa. W dzisiejszych niestałych czasach, ważniejsze niż kiedykolwiek jest upewnienie się, że Arsenał stanie na wysokości zadania, poprzez oddanie do użytku nowej serii okrętów, które wzmocnią naszą flotę i zapewnią nam dominację na morzu na długie lata."
 emp_ven_contest_genoese_trade_title: "Rywalizacja z gen. handlem"
 emp_ven_contest_genoese_trade_desc: "Genua od dawna jest cierniem w naszym boku, a rosnące znaczenie handlu w zachodniej części Morza Śródziemnego tylko wzmacnia jej pozycję i czyni ją większym zagrożeniem. Musimy uderzyć w źródła jej dochodów. Jeśli ograniczymy genueńskie zyski, miasto nie będzie już na tyle bogate, by poważnie rzucać nam wyzwanie, co pozwoli nam jeszcze bardziej je upokorzyć."
 emp_ven_the_francocracy_title: "Frankokracja"
 emp_ven_the_francocracy_desc: "Po czwartej krucjacie ustanowiliśmy kilka państewek na dawnych ziemiach bizantyjskich i przez pewien czas pomagaliśmy im utrzymać pozycję w regionie. Grecy pogardliwie nazywali te państwa Frankokracją, czyli rządami Franków, lecz dla nas były one użytecznym narzędziem rozszerzania wpływów. To były wspaniałe czasy dla Wenecjan. Nadszedł odpowiedni moment, by ponownie zaznaczyć naszą obecność w Konstantynopolu, prawdziwym centrum władzy w regionie, tym razem odgrywając jednak bardziej aktywną rolę w jego administracji."
 emp_ven_challenge_papal_supremacy_title: "Zmierz się z papieżem"
 emp_ven_challenge_papal_supremacy_desc: "Długo utrzymywaliśmy pewne porozumienie z papiestwem. Papież nie wtrącał się w sprawy naszych kościelnych, a my nie wtrącaliśmy się w sprawy papieża. Jednak w dzisiejszych czasach papiestwo stało się bardziej asertywne, nawet gdy nasza własna potęga rośnie, i zaczęło się angażować w sprawy Kościoła w całej Europie. Nadszedł czas, abyśmy przypomnieli papieżowi o naszych dawnych ustaleniach i sprawdzili, czy papiestwo nie sięga po władzę."
 emp_ven_monopolize_adriatic_trade_title: "Monopol na Adriatyku"
 emp_ven_monopolize_adriatic_trade_desc: "Wenecja powinna kontrolować handel na całym Morzu Adriatyckim, co stawia nas w konflikcie z nowo powstałym miastem Ragusa."
 emp_ven_reclaim_the_aegean_title: "Odzyskaj Wyspy Egejskie"
 emp_ven_reclaim_the_aegean_desc: "Mamy długą historię handlu we wschodniej części Morza Śródziemnego, ale w miarę jak zmieniały się losy Grecji i Azji Mniejszej, ucierpiały losy naszych kupców. Odzyskanie naszej pozycji na Morzu Egejskim będzie wymagało użycia siły zbrojnej, ale jeśli nam się uda, będziemy prosperować."
 emp_ven_annex_cyprus_title: "Zaanektuj Cypr"
 emp_ven_annex_cyprus_desc: "Cypr jest klejnotem w koronie wschodniej części Morza Śródziemnego. Z Cypru moglibyśmy sprawować wspaniałą kontrolę nad handlem morskim Lewantu, Anatolii, a nawet Egiptu! Najpierw jednak musimy zająć wyspę."
 emp_ven_control_the_means_of_transaction_title: "Sposoby transakcji"
 emp_ven_control_the_means_of_transaction_desc: "Rozkwit naszego handlu jest hamowany przez arbitralne zarządzenia lokalnych władców, którzy nie dostrzegają pełnych korzyści płynących z naszych wzajemnych porozumień i upierają się przy drobnych utrudnieniach, takich jak podatki, dopłaty czy nadrzędność własnego prawa nad naszymi agentami. Jedynym sposobem na rozwiązanie tego impasu jest ustanowienie naszej administracji na tych dochodowych ziemiach."
 emp_ven_this_mythical_realm_title: "To mityczne królestwo"
 emp_ven_this_mythical_realm_desc: "Handel lewantyński od dawna był dla nas źródłem bogactwa, ale odkrycia ujawniły nam jeszcze bogatszą krainę: Indie. Jeśli uda nam się zdobyć pozycję w tym bogatym obszarze na wschodzie, nasi kupcy mogą stać się bogaci ponad wyobrażenie."
 emp_ven_this_mythical_realm_tt: "Załóż kompanię handlową w dowolnym miejscu wzdłuż wybrzeża §YIndii§!"
 emp_ven_the_shape_of_trades_to_come_title: "Przyszłość handlu"
 emp_ven_the_shape_of_trades_to_come_desc: "Nasze doświadczenie w Indiach pokazało nam, że przyszłość nadzwyczajnych zysków nie leży w basenie Morza Śródziemnego, ale za granicą: w Indiach i na Wschodzie. Musimy silniej zaznaczyć swoją obecność na tych ziemiach, abyśmy mogli czerpać z ich ogromnych bogactw."
 emp_ven_the_shape_of_trades_to_come_tt: " prowincji posiadanych w Indiach lub Indiach Wschodnich"
 ven_venetian_carnevale: "Wenecki karnawał"
 desc_ven_venetian_carnevale: "Wenecki karnawał jest tematem rozmów w całej Europie. Przybywajcie i dajcie się olśnić!"
 ven_aldine_monopoly_modifier: "Monopol oficyny Alda"
 desc_ven_aldine_monopoly_modifier: "Monopol oficyny Alda na wydawanie specjalistycznych druków zapewnia jej zyski i pozwala publikować bardziej niszowe dzieła bez obaw, że nieautoryzowane przedruki odbiorą jej dochody i uczynią publikacje nieopłacalnymi."
 ven_standardized_relazioni: "Standaryzowane Relazioni"
 desc_ven_standardized_relazioni: "Bezpieczne relazioni dostarczają państwu niezbędnych informacji, które pozwalają poruszać się po zdradliwych wodach europejskiej dyplomacji, nie narażając tajemnic na odkrycie przez wrogów."
 ven_urban_renewal: "Odbudowa miejska"
 desc_ven_urban_renewal: "Nowa infrastruktura daje nam możliwość zbudowania czegoś lepszego."
 ven_political_monopolist: "Polityczny monopolista"
 desc_ven_political_monopolist: "Gdy nasi najwięksi wrogowie zostali pokonani, nikt nie jest w stanie oprzeć się potędze naszego pióra."
 ven_autonomous_venetian_patriarchate: "Autonomiczny patriarchat wenecki"
 desc_ven_autonomous_venetian_patriarchate: "Po osiągnięciu pewnego porozumienia z papiestwem, nasz kościół może zajmować się swoimi sprawami bez żadnych dodatkowych kłopotów z zewnątrz."
 ven_genoese_humiliation: "Genueńskie upokorzenie"
 desc_ven_genoese_humiliation: "Dzięki dominacji nad jednym z naszych największych konkurentów, Włochami, łatwiej jest nam przyciągać handel do własnych portów."
 ven_nothing_ventured_nothing_gained: "Kto nie ryzykuje, ten nie zyskuje"
 desc_ven_nothing_ventured_nothing_gained: "Nasi kupcy przesuwają granice znanego świata, poszukując nowych rynków i możliwości handlowych."
 ven_la_francocrazia: "La Francocrazia"
 desc_ven_la_francocrazia: "Powrót weneckiej potęgi do wschodniej części Morza Śródziemnego i jednego z najbardziej prestiżowych miast Europy zapewnia nam miejsce w historii wśród największych potęg morskich naszej epoki."
 PROTECTED_VENETIAN_MERCHANTS: "Chronieni weneccy kupcy"
 emp_pap_patrimony_of_st_peter_title: "Patrymonium Św. Piotra"
 emp_pap_patrimony_of_st_peter_desc: "Chociaż Rudolf von Habsburg przekazał Romanię i inne terytoria do naszej świętej domeny w XIII wieku, nasza kontrola była często w najlepszym wypadku nominalna. Nadszedł czas, abyśmy potwierdzili doczesną władzę Rzymu i przywrócili te krnąbrne ziemie pod naszą kontrolę."
 emp_pap_suppress_the_italian_cities_title: "Zniszcz włoskie miasta"
 emp_pap_suppress_the_italian_cities_desc: "Miasta-państwa Toskania i Liguria już zbyt długo są naszym politycznym utrapieniem. Nie dość, że ciągle kwestionują zakres naszych rządów, to jeszcze ośmielają się osadzać swoich ludzi na tronie papieskim! Nadszedł czas, abyśmy uznali, że jedynym sposobem na ostateczne rozwiązanie problemu jest ich wyeliminowanie."
 emp_pap_sweep_the_po_title: "Oczyścić dolinę Padu"
 emp_pap_sweep_the_po_desc: "Obszary od doliny Padu aż po Adriatyk są rządzone przez ludzi dumnych i grzesznych, którzy bezczelnie odmawiają uznania naszej władzy, a nawet próbują mianować własnych duchownych. Takie zniewagi wobec papiestwa nie mogą się ostać!"
 emp_pap_island_screens_title: "Wyspy na straży"
 emp_pap_island_screens_desc: "Z Rzymu nad Morze Śródziemne prowadzi krótka droga morska, a rozległe wody tego morza mogą w każdej chwili posłużyć naszym wrogom do przeprowadzenia ataku. Aby chronić Rzym, powinniśmy przejąć kontrolę nad głównymi wyspami strzegącymi dostępu do zachodniego wybrzeża Italii."
 emp_pap_italian_supremacy_title: "Włoska supremacja"
 emp_pap_italian_supremacy_desc: "W miarę jak rozrastały się domeny Świętego Piotra, zaczęła się kształtować pewna idea. Nasza potęga i prestiż czynią nas naturalnymi przywódcami Półwyspu Apenińskiego i nie potrzeba wiele wysiłku, aby ten pomysł stał się rzeczywistością."
 emp_pap_swiss_guard_title: "Utwórz Gwardię Szw."
 emp_pap_swiss_guard_desc: "Powszechne obowiązki Kościoła wymagają większej ochrony niż ta, którą mogą zapewnić tylko nasze opłaty. Byłoby mądrze, gdybyśmy zawarli umowę ze Szwajcarami w celu ustanowienia straży dla papieża i Rzymu."
 emp_pap_swiss_guard_mercs_enabled: "§YGwardia Szwajcarska§! stanie się unikalną jednostką najemną dostępną tylko dla Państwa Papieskiego."
 emp_pap_catholic_volunteers_title: "Katoliccy ochotnicy"
 emp_pap_catholic_volunteers_desc: "Kościół potrzebuje silnej obrony, jeśli ma przetrwać w tych burzliwych czasach. Musimy zebrać największą armię, jaką możemy, z tak wielu ludzi, jak tylko jesteśmy w stanie zwerbować."
 emp_pap_roman_navy_title: "Zbuduj rzymską flotę"
 emp_pap_roman_navy_desc: "Nasi wrogowie mogą zbliżyć się do nas drogą morską równie łatwo jak lądową. Dla naszej obrony i dla naszych świętych obowiązków za granicą, musimy zbudować godną flotę."
 emp_pap_the_holy_league_title: "Święta Liga"
 emp_pap_the_holy_league_desc: "W tych mrocznych czasach musimy zjednoczyć wiernych i stworzyć silny front przeciwko heretykom i poganom. Silny front wymaga jednak silnych sojuszników. Potrzebujemy po naszej stronie kogoś budzącego grozę, jeśli chcemy poważnie realizować naszą świętą misję."
 faux_is_catholic: "Jest §Ykatolickie§!"
 emp_pap_the_holy_league_tt: "Każdy §Ykatolicki§! sojusznik otrzymuje modyfikator „§YPomoc wojskowa papieża§!” na §Y10§! lat, zapewniający następujące efekty:\nModyfikator kosztów utrzymania najemników: §G-25.0%§!\nKoszt najemników: §G-10.0%§!"
 emp_pap_catholic_alliances_title: "Bractwo katolickie"
 emp_pap_catholic_alliances_desc: "Choć nasza sprawa jest słuszna, sama wiara nie zapewni nam bezpieczeństwa ani zwycięstwa na ziemi. Możemy szerzyć Słowo Boże dzięki dobrym uczynkom sprzymierzonych książąt."
 emp_pap_catholic_alliances_tt: "[Root.GetName] musi być sprzymierzone z §Y3§! państwami §Ykatolickimi§!"
 emp_pap_support_the_knightly_orders_title: "Wesprzyj zakony"
 emp_pap_support_the_knightly_orders_desc: "Zakony w Europie toczą bogobojną wojnę, ale są odizolowane i słabo wspierane nawet przez swoich katolickich sąsiadów. Powinniśmy im przypominać - także zakonom rezydującym w naszym własnym królestwie - że dostrzegamy ich zmagania i w pełni wspieramy ich w prowadzonej przez nich misji."
 emp_pap_eastern_alliances_title: "Wschodnie sojusze"
 emp_pap_eastern_alliances_desc: "Wschodnia granica Chrześcijaństwa jest krucha, nieustannie przesuwa się w tę i z powrotem. Powinniśmy pomóc w ustabilizowaniu tego frontu, nawet jeśli oznacza to zaprzyjaźnienie się z tymi, którzy są po niewłaściwej stronie Wielkiej Schizmy."
 emp_pap_eastern_alliances_trigger_tt: "§Y[Root.GetName]§! jest sojusznikiem lub zwierzchnikiem dowolnego państwa §Ychrześcijańskiego§! w regionach §YBałkanów§!, §YAnatolii§! lub §YKaukazu§!"
 emp_pap_eastern_alliances_tt: "Każdy §Ychrześcijański§! sojusznik i poddany w regionach §YBałkanów§!, §YAnatolii§! i §YKaukazu§! otrzymuje modyfikator „§YKorpus Gasmoulikon§!” na §Y15§! lat, zapewniający następujące efekty:\nGlobalny modyfikator marynarzy: §G+20%§!\nGlobalny modyfikator zasobów ludzkich: §G+20.0%§!"
 emp_pap_prester_john_title: "Ksiądz Jan"
 emp_pap_prester_john_desc: "Społeczności chrześcijańskie w Górnym Nilu i poza nim są stale zagrożone przez pogan. Musimy zrobić wszystko, co w naszej mocy, aby wesprzeć tych ludzi w ich walce."
 emp_pap_prester_john_tt: "Dowolne państwo §Ychrześcijańskie§! w regionie §YRogu Afryki§! ma opinię o §Y[Root.GetName]§! wynoszącą co najmniej §Y100§!"
 emp_pap_prester_john_land_tt: "Posiadaj §Y6§! prowincji w regionie §YRogu Afryki§!"
 emp_pap_rebuild_the_papal_treasury_title: "Odbuduj skarbiec papieski"
 emp_pap_rebuild_the_papal_treasury_desc: "Ziemskie sprawy wymagają ziemskich środków. Aby osiągnąć nasze duchowe cele, musimy wzmocnić nasze własne finanse."
 emp_pap_restore_curia_funding_title: "Przywróć finansowanie kurii"
 emp_pap_restore_curia_funding_desc: "Poza kosztami administracyjnymi państwa, musimy troszczyć się o pieniądze potrzebne na zaopatrzenie wiernych w artykuły pierwszej potrzeby. Nie możemy pozwolić, by organy Kościoła usychały z powodu braku środków."
 emp_pap_new_st_peters_basilica_title: "Nowa Bazylika św. Piotra"
 emp_pap_new_st_peters_basilica_desc: "Stara Bazylika Świętego Piotra jest budowlą pochodzącą z czasów cesarza Konstantyna. Zbyt długo była zaniedbywana, a teraz prawdopodobnie jest już zbyt zniszczona, by można ją było odrestaurować. Budowa nowej bazyliki na jej miejscu daje nam możliwość wzniesienia prawdziwie monumentalnej budowli sławiącej chwałę Chrystusa."
 emp_pap_establish_vatican_library_title: "Biblioteka Watykańska"
 emp_pap_establish_vatican_library_desc: "Mamy wiele dokumentów zgromadzonych w licznych kolekcjach, lecz brakuje nam jednego miejsca, w którym moglibyśmy przechowywać wszystkie posiadane dzieła pisane. Nadszedł czas, by zorganizować oficjalną bibliotekę Stolicy Apostolskiej."
 emp_pap_subiaco_press_title: "Drukarnia w Subiaco"
 emp_pap_subiaco_press_desc: "Praca kopistów jest szlachetna, lecz współczesne czasy wymagają nowoczesnych rozwiązań. Powinniśmy przyjąć nową technikę druku, aby łatwiej sporządzać encykliki, traktaty i wszystkie inne dokumenty niezbędne Kościołowi."
 emp_pap_support_eastern_catholiczation_title: "Katolicyzacja wschodu"
 emp_pap_support_eastern_catholiczation_desc: "Ziemie Litwinów, Polaków i Rusinów są miejscem rozdrobnionym, podzielonym na wyznawców wiary katolickiej i prawosławia. Powinniśmy uczynić wszystko, co w naszej mocy, aby wesprzeć wysiłki tamtejszych władz katolickich w szerzeniu prawdziwej wiary."
 emp_pap_support_eastern_catholiczation_lit_tt: "Państwo [LIT.GetName] otrzymuje modyfikator „§YMisja papieska§!” na §Y15§! lat, zapewniający następujące efekty:\nGlobalna siła misjonarzy: §G+2.0%§!\nKoszt utrzymania misjonarzy: §G-50.0%§!"
 emp_pap_support_eastern_catholiczation_pol_tt: "Państwo [POL.GetName] otrzymuje modyfikator „§YMisja papieska§!” na §Y15§! lat, zapewniający następujące efekty:\nGlobalna siła misjonarzy: §G+2.0%§!\nKoszt utrzymania misjonarzy: §G-50.0%§!"
 emp_pap_support_eastern_catholiczation_plc_tt: "Państwo [PLC.GetName] otrzymuje modyfikator „§YMisja papieska§!” na §Y15§! lat, zapewniający następujące efekty:\nGlobalna siła misjonarzy: §G+2.0%§!\nKoszt utrzymania misjonarzy: §G-50.0%§!"
 emp_pap_start_the_counter_reformation_title: "Przeciwdziałaj reformacji"
 emp_pap_start_the_counter_reformation_desc: "Wobec narastającej retoryki heretyckiej musimy działać szybko, aby powstrzymać te błędne nauki i utrzymać jednolitość wiary w Kościele."
 emp_pap_concessions_title: "Zaoferuj kompromis"
 emp_pap_concessions_desc: "Z biegiem czasu niektóre elementy wiary mogły odejść od właściwego nauczania. Powinniśmy skorygować błędy w praktykach kościelnych i rozwiązać część problemów, które przyczyniły się do szerzenia myśli heretyckiej."
 emp_pap_back_the_catholic_powers_title: "Poparcie dla Ligi Katolickiej"
 emp_pap_back_the_catholic_powers_desc: "Wierni gromadzą się, by walczyć z heretykami, a nasze wezwania brzmiałyby fałszywie, gdybyśmy sami nie stanęli w ich szeregach. Musimy przystąpić do Ligi Katolickiej!"
 emp_pap_fight_the_heretics_title: "Walcz z heretykami"
 emp_pap_fight_the_heretics_desc: "Herezja musi zostać wytępiona. Przywództwo Rzymu nie może być dłużej kwestionowane przez niemieckich książąt!"
 emp_pap_levantine_missions_title: "Lewantyńskie misje"
 emp_pap_levantine_missions_desc: "Ziemie Święte są przedmiotem gorących sporów między chrześcijanami a muzułmanami i byłoby naszym zaniedbaniem, gdybyśmy nie kontynuowali tej walki. Powinniśmy zrobić wszystko, co w naszej mocy, aby ziemie Lewantu wróciły pod panowanie katolickich książąt."
 emp_pap_levantine_missions_tt: " prowincje w regionie §YMaszreku§! muszą należeć do kraju §Ykatolickiego§!"
 emp_pap_mission_to_china_title: "Misja do Chin"
 emp_pap_mission_to_china_desc: "Naszym świętym obowiązkiem jest ewangelizacja całego świata i niesienie Słowa Bożego na wszystkie krańce ziemi. Wraz z poszerzaniem naszej wiedzy o świecie rośnie również nasza powinność. Odkrywcy na Dalekim Wschodzie nawiązali pierwsze kontakty z chińskimi kupcami — to znak, że powinniśmy wyruszyć i szerzyć wśród nich naszą wiarę."
 emp_pap_mission_to_china_tt: "§YChiny§! zostały odkryte"
 emp_pap_mission_to_china_tt2: " prowincje w §YPółnocnych Chinach§! lub §YPołudniowych Chinach§! należą do kraju §Ykatolickiego§!"
 emp_pap_mission_to_japan_title: "Misja do Japonii"
 emp_pap_mission_to_japan_desc: "Legendarne ziemie Japonii wołają nas o zbawienie. Powinniśmy szukać tych wysp Dalekiego Wschodu i głosić Dobrą Nowinę wśród ich mieszkańców."
 emp_pap_mission_to_japan_tt: "§YJaponia§! została odkryta"
 emp_pap_mission_to_japan_tt2: " prowincje w §YJaponii§! należą do §Ykatolickiego§! kraju"
 emp_pap_end_the_schism_title: "Koniec schizmy"
 emp_pap_end_the_schism_desc: "Chrześcijaństwo od zbyt dawna pozostaje podzielone z powodu błahych różnic w wierze. Gdyby jednak pobożni książęta zdołali osadzić prawowiernych katolików na stolicach najbardziej szanowanych patriarchatów prawosławia, moglibyśmy poważnie rozważyć zakończenie Wielkiej Schizmy."
 emp_pap_end_the_schism_tt: "Każde państwo §Yprawosławne§! otrzyma wydarzenie „§YPapiestwo leczy schizmę§!”"
 emp_pap_destroy_heretic_strongholds_title: "Zniszcz twierdze heretyków"
 emp_pap_destroy_heretic_strongholds_desc: "Mimo że Kościół triumfuje w Imperium, heretyckie słowa nadal są szeptane na jego ziemiach, wspierane przez dumnych książąt, którzy nadal wyznają błędną wiarę. Musimy wyruszyć i zniszczyć źródło tych nauk! Tylko w ten sposób możemy raz na zawsze zakończyć tę tak zwaną 'reformację'."
 emp_pap_destroy_heretic_strongholds_tt: "Każda prowincja w Świętym Cesarstwie Rzymskim należy do państwa §Ykatolickiego§!"
 emp_pap_pontifical_universities_title: "Pontyfikalne uniwersytety"
 emp_pap_pontifical_universities_desc: "Tajemnice Stworzenia są na wyciągnięcie ręki i czekają na odkrycie. Należy zachęcać do nauki i badań naukowych - kto wie, jakie jeszcze cuda mogą zostać odkryte?"
 pap_papal_swiss_guard: "Papieska Gwardia Szwajcarska"
 desc_pap_papal_swiss_guard: "Specjalne kontrakty pozwalają nam rekrutować najlepszych żołnierzy, jakich można nabyć za pieniądze."
 pap_papal_mission: "Misja papieska"
 desc_pap_papal_mission: "Papiescy wysłannicy mają na celu pomóc nam w głoszeniu Słowa Bożego"
 pap_papal_military_aid: "Papieska pomoc wojskowa"
 desc_pap_papal_military_aid: "Wsparcie papieża pomaga nam zwerbować najbardziej gorliwe wolne kompanie do naszej sprawy."
 pap_roman_leadership: "Przywództwo Rzymu"
 desc_pap_roman_leadership: "Nasze przywództwo i inicjatywa inspiruje wielkich ludzi do przyłączenia się do naszej sprawiedliwej sprawy."
 pap_italian_federation: "Federacja Włoska"
 desc_pap_italian_federation: "Naród włoski prosperuje pod rządami Kościoła"
 pap_eastern_mediterranean_routes: "Szlaki wschodniego Morza Śródziemnego"
 desc_pap_eastern_mediterranean_routes: "Nasze działania na Wschodzie pozwoliły nam poznać tajniki podróżowania i rozszerzyć zasięg naszych wpływów."
 pap_st_peters_basilica: "Bazylika św. Piotra"
 desc_pap_st_peters_basilica: "Ta wspaniała budowla jest jednym z najwspanialszych kościołów w całym świecie chrześcijańskim."
 pap_universal_church: "Kościół powszechny"
 desc_pap_universal_church: "Nasz Kościół nie ma sobie równych"
 pap_roman_renaissance: "Rzymski renesans"
 desc_pap_roman_renaissance: "Sztuka i nauka kwitną na naszych ziemiach"
 pap_papal_press_rb: "Prasa papieska"
 desc_pap_papal_press_rb: "Wykorzystujemy najnowsze innowacje, aby zarządzać królestwem i promować Kościół."
 pap_papal_press_no_rb: "Prasa papieska"
 desc_pap_papal_press_no_rb: "Wykorzystujemy najnowsze innowacje, aby zarządzać królestwem i promować Kościół."
 pap_african_connections: "Afrykańskie powiązania"
 desc_pap_african_connections: "Nasza praca w Afryce dała nam lepsze zrozumienie specyfiki terenu i sposobu zawierania umów z lokalnymi osobistościami."
 pap_gasmoulikon_corps: "Korpus Gasmoulikon"
 desc_pap_gasmoulikon_corps: "Ci ludzie czują się tak samo dobrze wśród Latynosów, jak wśród Greków, i są gotowi walczyć dla nas na rozkaz papieża."
 pap_chinese_jesuits_catholic: "Twierdza jezuitów w Chinach"
 desc_pap_chinese_jesuits_catholic: "Ta prowincja jest wspierana przez wspólnotę jezuitów, którzy opiekują się wiernymi i prowadzą szkoły na tym terenie."
 pap_chinese_jesuits_noncatholic: "Misja jezuitów w Chinach"
 desc_pap_chinese_jesuits_noncatholic: "Jezuici aktywnie szerzą wiarę katolicką w tej prowincji, wspomagając wysiłki państwa w nawracaniu mieszkańców i ułatwianiu im konwersji."
 pap_visitor_of_missions_in_the_indies_catholic: "Wizytator misji w Indiach"
 desc_pap_visitor_of_missions_in_the_indies_catholic: "Administracja tej pustyni jest wspomagana przez starszego misjonarza jezuitów, który oprócz spraw kościelnych zajmuje się także kwestiami prawnymi."
 pap_visitor_of_missions_in_the_indies_noncatholic: "Wizytator misji w Indiach"
 desc_pap_visitor_of_missions_in_the_indies_noncatholic: "Starszy misjonarz jezuita pomaga w zarządzaniu tą prowincją i szerzeniu w niej wiary katolickiej."
 pap_japanese_jesuits: "Japońscy jezuici"
 desc_pap_japanese_jesuits: "Ci duchowni nawrócili się na katolicyzm i pragną szerzyć swoją wiarę w ojczyźnie. Ich kontakty z duchownymi z innych krajów zapewniają im również doskonałą wiedzę o kupcach Nanban i oceanicznych szlakach handlowych."
 pap_latin_patriarch_of_jerusalem: "Łaciński Patriarchat Jerozolimy"
 desc_pap_latin_patriarch_of_jerusalem: "Gorliwi chrześcijanie zjeżdżają się teraz do Jerozolimy, aby usłyszeć poruszające słowa przywróconego do życia łacińskiego patriarchy. Kierowani jego kazaniami, przysięgają, że już nigdy nie dopuszczą do upadku Jerozolimy i na zawsze będą bronić swojej wiary."
 flavor_pap.EVTNAME11: "Papiestwo leczy schizmę"
 flavor_pap.EVTDESC11: "Biskup Rzymu ogłosił koniec Wielkiej Schizmy, a deklaracja ta została poparta przez jego uległe nowe kościelne marionetki w Konstantynopolu i Moskwie. Podczas, gdy my moglibyśmy dalej podążać naszymi starymi ścieżkami, zwycięstwa papiestwa sugerują, że Bóg może być naprawdę po jego stronie."
 flavor_pap.EVTOPTA11: "Przyjmiemy katolicyzm."
 flavor_pap.EVTOPTB11: "Dopóki mówią „Filioque”, pozostaniemy prawosławni!"
 flavor_pap.EVTNAME12: "Papiestwo nas popiera!"
 flavor_pap.EVTDESC12: "Wysłannik z Rzymu przybył do naszej stolicy, dając nam znać, że Jego Świątobliwość zauważył nasze wysiłki na rzecz wiary i gorąco je popiera. Aby jeszcze bardziej wspomóc nas w naszej pracy, Rzym wysłał również kilku swoich najlepszych misjonarzy do naszego królestwa."
 flavor_pap.EVTOPTA12: "Alleluja!"
 flavor_pap.EVTNAME13: "Powrót jezuitów"
 flavor_pap.EVTDESC13: "Chociaż już raz odtrąciliśmy jezuitów, ich przywódcy nie chcą przyjąć odmowy i wysłali kolejną misję na nasze ziemie. Są bardzo wytrwali. Czy powinniśmy ustąpić i pozwolić tym misjonarzom zostać?"
 flavor_pap.EVTOPTA13: "Bardzo dobrze, możemy skorzystać z ich nauki"
 flavor_pap.EVTOPTB13: "Nie, ich zagraniczne idee są nadal nie do przyjęcia"
 flavor_pap.EVTNAME14: "Przybycie jezuitów"
 flavor_pap.EVTDESC14: "Misjonarze z odległych krain przypłynęli do naszych ziem, przynosząc dary dla [Root.Monarch.GetTitle] i prezentując rozmaite mechaniczne wynalazki z Europy. Wykazali się również wielką wiedzą, tworząc ogromną mapę świata i przedstawiając rozsądne propozycje reformy kalendarza. Przynieśli jednak także osobliwe idee religijne i filozoficzne, które mogą zachwiać tradycyjnym porządkiem Chin. Czy powinniśmy pozwolić im pozostać?"
 flavor_pap.EVTOPTA14: "Tak, możemy skorzystać na ich wiedzy"
 flavor_pap.EVTOPTB14: "Nie, ich cudzoziemskie pomysły są dla nas nie do przyjęcia"
 flavor_pap.EVTNAME15: "Kirishitan"
 flavor_pap.EVTDESC15: "Katoliccy misjonarze, wspierani przez dalekiego papieża, zaczęli przybywać do naszych brzegów. Próbują szerzyć chrześcijaństwo i masowo nawracać ludność. Jeśli ci jezuici, franciszkanie i dominikanie nie zostaną zatrzymani, mogą stanowić poważne zagrożenie dla sintoizmu."
 flavor_pap.EVTOPTA15: "Powstrzymać misjonarzy!"
 flavor_pap.EVTOPTB15: "Niech szerzą swoją wiarę"
 emp_pro_arts_title: "Sponsor sztuki"
 emp_pro_arts_desc: "Musimy pokazać chrześcijańskim władcom, że Prowansja jest kulturalnym i pobożnym państwem. Patronowanie pracom włoskich artystów i wystawianie ich w naszych kościołach z pewnością przyniesie taki efekt."
 emp_pro_toulon_title: "Stocznie w Tulonie"
 emp_pro_toulon_desc: "Tulon jest idealną lokalizacją do budowy nowej wielkiej stoczni morskiej i arsenału. Z Tulonu nasza flota zdominuje Morze Śródziemne!"
 emp_pro_marseille_title: "Rozwiń Prowansję"
 emp_pro_marseille_desc: "Prowansalskie ziemie ojczyste są bogate, lecz mogą być jeszcze zamożniejsze. Musimy rozwinąć Marsylię oraz otaczające ją tereny."
 emp_pro_sicily_title: "Król Sycylii"
 emp_pro_sicily_desc: "Skoro rościmy sobie prawa do korony Aragonii, powinniśmy również upomnieć się o koronę Sycylii. Musimy odebrać wyspę Aragończykom i oddać ją pod panowanie jej prawowitego króla."
 emp_pro_jerusalem_title: "Król Jerozolimy"
 emp_pro_jerusalem_desc: "Wielu władców tytułuje się królami Jerozolimy, lecz żaden nie ma dość siły ani ambicji, by wkroczyć do Ziemi Świętej i wyegzekwować swoje roszczenia. Żaden poza naszym szlachetnym monarchą!"
 emp_pro_corsica_title: "Roszczenia króla Rene"
 emp_pro_corsica_desc: "René Andegaweński jest prawowitym władcą wielu królestw. Tragicznie utracił tron Neapolu, odmówiono mu korony Aragonii, a mimo to wciąż rości sobie prawa do Jerozolimy. Niewielu traktuje te pretensje poważnie. Musimy pokazać władcom chrześcijaństwa, że roszczeń Prowansji nie wolno lekceważyć."
 emp_pro_naples_title: "Król Neapolu"
 emp_pro_naples_desc: "Dobry król René zasiadał niegdyś na neapolitańskim tronie, dopóki nie odebrał mu go bezprawnie ród Trastámara z Aragonii. Musimy przywrócić dynastię René na tron Neapolu."
 emp_pro_hungary_title: "Król Węgier"
 emp_pro_hungary_desc: "Dynastia Andegawenów rządziła niegdyś na Węgrzech, tracąc tron dopiero pod koniec XIV wieku. Musimy osadzić z powrotem naszą dynastię na tronie węgierskim!"
 emp_pro_aragon_title: "Król Aragonii"
 emp_pro_aragon_desc: "René ma wielu wrogów, lecz najbardziej dokuczają mu Aragończycy. Po odmowie przyznania mu tronu Aragonii i pokonaniu jego wojsk pod Neapolem nie może być mowy o pojednaniu."
 emp_pro_avignon_title: "Negocjuj o Awinion"
 emp_pro_avignon_desc: "Awinion od dawna należy do Kościoła i w latach 1309–1376 był nawet siedzibą papiestwa. Kwestia niewoli awiniońskiej została już ostatecznie rozwiązana, a Ojciec Święty nie potrzebuje Awinionu, więc być może uda nam się wynegocjować jego przekazanie naszemu państwu."
 emp_pro_lorraine_title: "Zintegruj Lotaryngię"
 emp_pro_lorraine_desc: "Księstwo Lotaryngii jest jednym z nielicznych tytułów, które udało nam się zachować po druzgocącej klęsce z rąk Aragończyków. Musimy w pełni włączyć Lotaryngię do naszych domen."
 emp_pro_occitania_title: "Zjednocz Oksytanię"
 emp_pro_occitania_desc: "Oksytania cierpi pod panowaniem Francji. Spustoszona podczas krucjaty albigeńskiej, a obecnie wyniszczana wojną stuletnią z Anglią, jej ludność i szlachta mają dość francuskich rządów. Powinniśmy wyzwolić ich spod władzy Francji i podporządkować Prowansji."
 emp_pro_france_title: "Król Francji"
 emp_pro_france_desc: "Choć nie posiadamy roszczeń do francuskiego tronu, nie stanowi to przeszkody dla dalszej ekspansji. Powinniśmy po prostu wystawić armię i rozpocząć kampanię podboju pozostałości Królestwa Francji."
 emp_pro_la_marseillaise_title: "Marsylianka"
 emp_pro_la_marseillaise_desc: "Aux armes, citoyens\nFormez vos bataillons\nMarchons, marchons!"
 emp_pro_join_the_empire_title: "Dołącz do Cesarstwa"
 emp_pro_join_the_empire_desc: "Nasze ambicje są wielkie, lecz pod względem militarnym ustępujemy wielu sąsiadom. Rozsądnie byłoby poszukać ochrony poprzez przystąpienie do Świętego Cesarstwa Rzymskiego."
 emp_pro_king_of_kings_title: "Król królów"
 emp_pro_king_of_kings_desc: "Gromadzenie koron niemal stało się hobby naszych wspaniałych monarchów. Rozwijajmy tę pasję i zdobywajmy kolejne tytuły. W razie potrzeby możemy nawet wymyślić nowe królestwa, nad którymi będzie panował nasz władca."
 pro_king_of_hungary: "Król Węgier"
 desc_pro_king_of_hungary: "Dynastia Andegawenów powróciła na tron Węgier. Pozostałości Czarnej Gwardii zgodziły się służyć nowemu królowi."
 pro_king_of_kings: "Król królów"
 desc_pro_king_of_kings: "Kolekcjonowanie królestw stało się hobby naszych monarchów."
 pro_lorraine_modifier: "Książę Lotaryngii"
 desc_pro_lorraine_modifier: "Księstwo Lotaryngii zostało w pełni zintegrowane z naszym państwem."
 pro_imperial_diplomacy: "Cesarska dyplomacja"
 desc_pro_imperial_diplomacy: "Jako książę Świętego Cesarstwa Rzymskiego cieszymy się ochroną cesarza i pewnym prestiżem wśród europejskiej szlachty."
 pro_king_of_france: "Król Francji"
 desc_pro_king_of_france: "Nasi żołnierze ciężko walczyli o nasze zwycięstwo; Francja jest nasza!"
 toulon_dockyards: "Stocznia w Tulon"
 desc_toulon_dockyards: "Stocznie i arsenał w Tulonie stanowią naszą najważniejszą bazę morską. Stąd będziemy panować nad Morzem Śródziemnym."
 pro_la_marseillaise: "Marsylianka"
 desc_pro_la_marseillaise: "Aux armes, citoyens\nFormez vos bataillons\nMarchons, marchons!"
 pro_la_marseillaise_2: "Marsylianka"
 desc_pro_la_marseillaise_2: "Aux armes, citoyens\nFormez vos bataillons\nMarchons, marchons!"
 pro_renaissance: "Renesansowe miasto"
 desc_pro_renaissance: "Nasze poparcie dla architektury renesansowej uczyniło ze stolicy latarnię kultury."
 pro_marseille: "Rozwój Marsylii"
 desc_pro_marseille: "Marsylia szybko się rozwija, stając się coraz ważniejszym ośrodkiem handlu i przemysłu."
 pro_avignon_tt: "Jeśli utrzymujemy dobre stosunki z papieżem, przekaże nam §YAwinion§!."
 pro_avignon_tt_2: "Papież przekaże §YAwinion§! krajowi [Root.GetName]"
 emp_fra_reconquer_normandy_title: "Odzyskaj Normandię"
 emp_fra_reconquer_normandy_desc: "Księstwo Normandii jest de jure poddanym Królestwa Francji. Powinno więc wrócić pod nasze rządy."
 emp_fra_subjugate_brittany_title: "Ujarzmij Bretanię"
 emp_fra_subjugate_brittany_desc: "Księstwo Bretanii nie uznaje prawowitego zwierzchnictwa Korony Francuskiej. Powinniśmy przekonać ich do zmiany zdania."
 emp_fra_conquer_picardy_fra_title: "Podbij Pikardię"
 emp_fra_conquer_picardy_fra_desc: "Pikardia to bogaty region, będący niegdyś częścią Francji, ale teraz nie podlega już naszym rządom. Powinniśmy go odzyskać."
 emp_fra_conquer_flanders_wallonia_title: "Podbij Flandrię"
 emp_fra_conquer_flanders_wallonia_desc: "W ciągu stuleci Księstwo Flandrii zmieniło swoją lojalność między Francją, Świętym Cesarstwem Rzymskim i nowym Księstwem Burgundii. Powinno na stałe wrócić do Francji."
 emp_fra_build_french_fleet_title: "Marynarka francuska"
 emp_fra_build_french_fleet_desc: "Francja musi zbudować flotę, która będzie w stanie z flotą Anglii, abyśmy nie zostali przykuci do naszych brzegów na wieczność."
 emp_fra_india_expansion_title: "Francuskie Indie Wsch."
 emp_fra_india_expansion_desc: "Bogactwa Indii są rzeczywiście kuszącym łupem. Gdybyśmy mogli utworzyć przyczółek na wybrzeżu, moglibyśmy zdominować handel w regionie."
 emp_fra_reconquer_gascony_title: "Odzyskaj Gaskonię"
 emp_fra_reconquer_gascony_desc: "Gaskonia jest prawowitą ziemią francuską, okupowaną przez bezprawnego pretendenta do korony. Każdy angielski przyczółek we Francji musi zostać odzyskany."
 emp_fra_conquer_provence_title: "Podbij Prowansję"
 emp_fra_conquer_provence_desc: "Książęta Prowansji mają wielkie ambicje, ale niewiele osiągają. Lepiej byłoby, gdyby byli poddanymi Francji."
 emp_fra_conquer_burgundy_area_title: "Podbij Burgundię"
 emp_fra_conquer_burgundy_area_desc: "Zarozumiali książęta Burgundii uważają się za wielką potęgę, jednakże w rzeczywistości są jedynie wasalami. Powinniśmy przypomnieć im o tym fakcie."
 emp_fra_french_colony_in_north_america_title: "Bazy w Ameryce Płn."
 emp_fra_french_colony_in_north_america_desc: "Kompania handlowa prosi o wsparcie finansowe w celu założenia baz w Ameryce Północnej. Mówią, że wymaga tego honor Francji."
 emp_fra_subjugate_lorraine_title: "Ujarzmij Lotaryngię"
 emp_fra_subjugate_lorraine_desc: "Księstwo Lotaryngii zajmuje strategiczną pozycję na granicy pomiędzy Cesarstwem, a Francją. Jeśli kiedyś miałby rozpocząć się jakiś konflikt między Francją a Cesarstwem, dobrze byłoby, gdyby książęta uznawali króla Francji za swojego pana."
 emp_fra_annex_savoy_title: "Zaanektuj Sabaudię"
 emp_fra_annex_savoy_desc: "Księstwo Sabaudii stoi na drodze włoskiej inwazji w kierunku Francji. Aby mieć pewność, iż droga ta jest odpowiednio chroniona, musimy włączyć Sabaudię w skład Francji."
 emp_fra_france_discovers_the_carribean_title: "Ekspansja kolonialna"
 emp_fra_france_discovers_the_carribean_desc: "Chwała Francji wymaga, abyśmy byli największym państwem chrześcijańskim. Nasi odkrywcy proszą zatem o królewski patronat, aby zorganizować ekspedycje na wschód."
 emp_fra_recover_calais_title: "Odzyskaj Calais"
 emp_fra_recover_calais_desc: "Zdradziecki król Edward III z Anglii zagarnął Calais jako bazę do ataku na Francję. Musimy temu zapobiec i dać Francji Pays Reconquis."
 emp_fra_france_discovers_north_america_title: "Odkryj Amerykę Płn."
 emp_fra_france_discovers_north_america_desc: "Nasi nawigatorzy błagają koronę, aby zatwierdziła misję zbadania mórz na zachód od nas. Słyszeli pogłoski o bogatych krainach, o które chcą się ubiegać ku chwale Francji."
 emp_fra_french_claim_to_naples_title: "Fr. roszczenia do Neapolu"
 emp_fra_french_claim_to_naples_desc: "Sukcesja neapolitańska jest sprawą złożoną i sporną. Sam Neapol dąży do niepodległości, ale zarówno Francja, jak i książęta iberyjscy również się o niego ubiegają. Problem ten należy rozwiązać."
 emp_fra_brest_title: "Stocznie Brestu"
 emp_fra_brest_desc: "Brześć znajduje się w niezwykle strategicznym miejscu na wybrzeżu Atlantyku. Musimy zbudować tam stocznię i uczynić ją główną bazą naszej floty atlantyckiej."
 emp_fra_england_title: "Pokonaj Anglików"
 emp_fra_england_desc: "Anglia zawsze była naszym znienawidzonym wrogiem i rywalem oraz solą w naszym oku. Musimy ominąć lub pokonać Royal Navy, dotrzeć do samej Wielkiej Brytanii i raz na zawsze położyć kres państwu angielskiemu."
 emp_fra_louisiana_title: "Kompania Mississippi"
 emp_fra_louisiana_desc: "Powinniśmy założyć monopolistyczną kompanię handlującą w imieniu [Root.GetAdjective] wzdłuż rzeki Missisipi."
 emp_fra_end_hyw_title: "Wojna stuletnia"
 emp_fra_end_hyw_desc: "Chociaż osiągnęliśmy sukcesy w ostatnich konfliktach z Anglikami, nadal zajmują terytoria, które słusznie są częścią Francji. Musimy całkowicie wyrzucić Anglików z naszych ziem!"
 emp_fra_conquer_milan_title: "Podbij Mediolan"
 emp_fra_conquer_milan_desc: "Aby umocnić naszą pozycję w Północnych Włoszech, musimy rozszerzyć nasze włości o Mediolan."
 emp_fra_spanish_succession_title: "Hiszpańska sukcesja"
 emp_fra_spanish_succession_desc: "Krążą plotki, że korona Hiszpanii jest słaba i niepewna. Musimy ubiegać się o tron, zanim nasi wrogowie zdołają go przejąć."
 emp_fra_native_relations_title: "Handel z tubylcami"
 emp_fra_native_relations_desc: "Bitwy o dominację nad handlem futrami w Ohio nie można wygrać tylko dzięki sile wojskowej. Musimy nawiązać stosunki handlowe z rdzennymi Amerykanami mieszkającymi w regionie, aby zabezpieczyć interesy skarbu [Root.GetAdjective]."
 emp_fra_toulon_dockyard_title: "Stocznie w Tulonie"
 emp_fra_toulon_dockyard_desc: "Tulon jest idealną lokalizacją do budowy nowej wielkiej stoczni morskiej i arsenału. Z Tulonu nasza flota zdominuje Morze Śródziemne!"
 emp_fra_annex_genoa_title: "Zaanektuj Genuę"
 emp_fra_annex_genoa_desc: "Portowa Genua oraz jej ziemie leżą zbyt blisko francuskich wybrzeży. Powinniśmy włączyć je do naszego królestwa, aby chronić nasze wpływy na Morzu Śródziemnym."
 emp_fra_switzerland_title: "Podbój Helwecji"
 emp_fra_switzerland_desc: "Szwajcarzy myślą, że są bezpieczni w swoich alpejskich fortecach. Pokażemy im, że nie ma przeszkody, której nie można zburzyć francuską armatą!"
 emp_fra_annex_alsace_title: "Zaanektuj Alzację"
 emp_fra_annex_alsace_desc: "Forteca w Strasburgu broni jednego z najważniejszych przejść w rejonie górnego Renu. Jeśli chcemy zwiększyć obronność Francji, powinniśmy przesunąć naszą granicę nad Ren i upewnić się, że tylko my sprawujemy kontrolę nad tą fortecą."
 emp_fra_germany_title: "Zdominuj cesarstwo"
 emp_fra_germany_desc: "Święte Cesarstwo Rzymskie jest największą barierą dla ekspansji Francji i wiecznym cierniem w naszym boku. Cesarstwo albo musi zostać rozwiązane, torując drogę naszym ambicjom, albo poddane kontroli [Root.GetAdjective]."
 emp_fra_poland_title: "Polscy poddani"
 emp_fra_poland_desc: "Polacy raczej nie poradzą sobie bez potężnego obrońcy, a nasi rywale zachłannie przyglądają ich ojczyźnie. Powinniśmy rozpocząć kampanię mającą na celu utworzenie polskiego protektoratu w regionie."
 emp_fra_russia_title: "Kampania rosyjska"
 emp_fra_russia_desc: "Rosja jest jedną z ostatnich przeszkód dla hegemonii [Root.GetAdjective] w Europie. Musimy zdobyć Moskwę, nawet jeśli nasze armie będą musiały przetrwać zamarznięte piekło, jakim jest Rosja zimą."
 emp_fra_indochina_title: "Francuskie Indochiny"
 emp_fra_indochina_desc: "Bogactwo Indochin nie jest prawie wcale wykorzystywane przez europejskie państwa. Powinniśmy być pierwsi w regionie."
 emp_fra_integrate_vassals_title: "Scentralizuj Francję"
 emp_fra_integrate_vassals_desc: "Era feudalnych wasali władających własnymi autonomicznymi ziemiami musi się skończyć. Ziemiaństwo musi zostać powstrzymane, a [Root.GetName] zjednoczona w jedno państwo."
 emp_fra_wars_of_religion_title: "Ustanów dragonady"
 emp_fra_wars_of_religion_desc: "Chociaż przeżyliśmy najgorsze problemy spowodowane protestancką reformacją, we [Root.GetAdjective] nadal przebywa wielu potencjalnie zdradzieckich heretyków. Powinniśmy ustanowić politykę zastraszania i dyskryminowania tych heretyków, aby wypędzić ich z naszego kraju."
 emp_fra_establish_the_musketeers_title: "Utwórz muszkieterów"
 emp_fra_establish_the_musketeers_desc: "Powinniśmy utworzyć elitarny korpus żołnierzy, który będzie strzegł monarchy i stanowił zbrojne ramię Maison du Roi. Ograniczenie członkostwa do wyższych warstw społecznych zachęci arystokrację do wybierania kariery wojskowej."
 emp_fra_i_am_the_state_title: "L'État, c'est moi"
 emp_fra_i_am_the_state_desc: "Monarcha nie powinien podlegać ograniczeniom wynikającym z tradycji, lokalnych przywilejów czy woli szlachty. Jako pierwszy pośród równych musi samodzielnie kierować nawą państwa."
 emp_fra_move_court_to_versailles_title: "Pałac wersalski"
 emp_fra_move_court_to_versailles_desc: "Ziemie wokół wioski Wersal od dawna mają opinię doskonałych terenów łowieckich. Ciągle rozbudowywany domek myśliwski coraz bardziej przypomina wspaniały pałac. Być może nadałby się na siedzibę rządu Francji?"
 emp_fra_revolution_title: "Rewolucja francuska"
 emp_fra_revolution_desc: "Tyrania monarchii musi się skończyć! Vive la France!"
 emp_fra_empire_title: "Francuska hegemonia"
 emp_fra_empire_desc: "Państwo [Root.GetAdjective] stanie się jedynym światowym supermocarstwem — niezrównanym hegemonem, bez godnych rywali i z pełną władzą nad losem narodów."
 emp_fra_indian_dominance_title: "Dominacja w Indiach"
 emp_fra_indian_dominance_desc: "Bogactwa Indii powinny być zarezerwowane wyłącznie dla [Root.GetAdjective]. Wszystkie pozostałe państwa europejskie obecne w Indiach muszą zostać stamtąd wyparte, w razie potrzeby siłą."
 emp_fra_south_america_title: "France Antarctique"
 emp_fra_south_america_desc: "[Root.GetName] musi zdobyć przyczółek w Ameryce Południowej. Inne państwa mogły już ustanowić swoje posiadłości na tym rozległym kontynencie, dlatego powinniśmy przygotować się na wrogie reakcje polityczne."
 emp_fra_auld_alliance_title: "Wzmocnij Auld Alliance"
 emp_fra_auld_alliance_desc: "Od dawna utrzymujemy dobre stosunki i pakt obronny ze Szkocją, ponieważ łączy nas rywalizacja z Anglią. Powinniśmy zacieśnić tę współpracę, przygotowując się do ataku na angielskie ziemie."
 emp_fra_les_invalides_title: "Les Invalides"
 emp_fra_les_invalides_desc: "Zakładając szpitale wojskowe dla naszych dzielnych weteranów, możemy skrócić czas potrzebny na ich powrót na linię frontu. Będzie to również doskonała okazja do prowadzenia badań medycznych, które przysłużą się całemu społeczeństwu."
 emp_fra_client_states_title: "Państwa zależne"
 emp_fra_client_states_desc: "Państwo [Root.GetAdjective] może rozszerzać się tylko do pewnych granic. Powinniśmy ustanowić państwa klienckie, aby rządzić rozleglejszymi terytoriami bez nadmiernego obciążania naszej administracji."
 emp_fra_american_independence_title: "Amerykańska niepodległość"
 emp_fra_american_independence_desc: "Powinniśmy wspierać niepodległość kolonii należących do naszych rywali. Z pewnością skorzystamy na reputacji obrońców wolności."
 fra_client_states_tt: " poddanych posiada §Yeuropejskie§! stolice i co najmniej §Y100§! łącznego rozwoju"
 fra_auld_alliance_tt: "Dowolne państwo w regionie §YWysp Brytyjskich§!, z wyjątkiem §YAnglii§! lub §YWielkiej Brytanii§!, posiadające co najmniej §Y70§! łącznego rozwoju, ma opinię o §Y[Root.GetName]§! wynoszącą co najmniej §Y100§!"
 fra_liberation_wars_enabled_tt: "Odblokowuje casus belli §YWyzwolenie§!"
 fra_had_wars_of_religion: "Przetrwać katastrofę §YWojen religijnych we Francji§!"
 fra_british_claims_tt: "§Y[Root.GetName]§! otrzymuje roszczenia do wszystkich prowincji w regionie §YWysp Brytyjskich§! należących do §YAnglii§! lub §YWielkiej Brytanii§!"
 fra_louisiana_colony.tooltip2: "Co najmniej §Y20§! prowincji w §YKolonialnej Luizjanie§! należy do §Y[Root.GetName]§! lub jego poddanych niebędących państwami suwerennymi."
 duchy_of_warsaw_tt: "Właściciel prowincji §Y[257.GetName]§! otrzymuje stałe roszczenia do regionu §YPolski§!"
 french_revolution_mission: "Francuski ferwor rewolucyjny"
 desc_french_revolution_mission: "Vive la France!"
 fra_master_of_india: "Władca Indii"
 desc_fra_master_of_india: "Francja ma swobodę ekspansji w Indiach bez ingerencji rywalizujących mocarstw europejskich."
 fra_master_of_india_2: "Władca Indii"
 desc_fra_master_of_india_2: "Francja ma swobodę ekspansji w Indiach bez ingerencji rywalizujących mocarstw europejskich."
 les_invalides: "Les Invalides"
 desc_les_invalides: "Nasze szpitale wojskowe leczą rannych, aby mogli jak najszybciej powrócić do walki."
 dragonnades: "Dragonady"
 desc_dragonnades: "Wprowadziliśmy politykę zastraszenia heretyków mającą na celu zmuszenie ich opuszczenia naszego kraju."
 france_rules_the_waves: "Francja włada morzami"
 desc_france_rules_the_waves: "Po pokonaniu Royal Navy, Francja włada morzami."
 fra_native_relations_mission: "Relacje z tubylcami"
 desc_fra_native_relations_mission: "Nawiązaliśmy silne stosunki handlowe z kilkoma grupami tubylców z Ameryki Północnej."
 french_client_states_mission: "Francuskie państwa zależne"
 desc_french_client_states_mission: "Utworzyliśmy państwa zależne, aby rządziły terytoriami bez nadmiernej rozbudowy naszej administracji."
 emp_mission_events.6.t: "Pożar w [295.GetName]"
 emp_mission_events.6.d: "W szokująco bezwzględnym posunięciu taktycznym [firestarter_country.GetAdjective] władcy miasta [295.GetName] podpalili własne miasto, by spowolnić nasz marsz. Większość zabudowy legła w gruzach lub stanęła w płomieniach, a niegdyś wspaniała metropolia zamieniła się w dymiące zgliszcza."
 emp_mission_events.6.a: "Niech płonie."
 emp_mission_events.7.t: "Książęcy pierścień Normandii"
 emp_mission_events.7.d: "Po ponownym podboju Normandii rada obraduje nad losem historycznego księstwa i chaosem, jaki przez stulecia wywoływało. Na postumencie przed zgromadzonymi leży książęcy pierścień.\nJeden z doradców zabiera głos: „Ma rację, nie możemy go używać”.\n„Mamy tylko jedno wyjście. Pierścień musi zostać zniszczony” — odpowiada inny.\nTrzecia postać wstaje i rusza naprzód, dobywając topora. „Na co więc czekamy?”.\nMężczyzna zadaje pierścieniowi jeden potężny cios."
 emp_mission_events.7.d2: "Po ponownym podboju Normandii rada obraduje nad losem historycznego księstwa i chaosem, jaki przez stulecia wywoływało. Na postumencie przed zgromadzonymi leży książęcy pierścień Normandii. Podjęto decyzję, że należy go zniszczyć. [Root.Monarch.GetTitle] wykonuje widowiskowy zamach toporem, kładąc kres waśniom."
 emp_mission_events.7.a: "Pierścień zostaje roztrzaskany. Księstwo przestaje istnieć."
 emp_swi_vaud_wallis_title: "Vaud i Wallis"
 emp_swi_vaud_wallis_desc: "Mieszkańcy Vaud i Wallis są niezadowoleni z rządów sabaudzkich władców. Musimy zapewnić im wolność poprzez włączenie ich do Konfederacji."
 emp_swi_geneva_title: "Wpłyń na Genewę"
 emp_swi_geneva_desc: "Zamożne miasto-państwo Genewa pragnie samodzielnie o sobie stanowić i postrzega autonomię w ramach Konfederacji Szwajcarskiej jako atrakcyjną alternatywę dla podporządkowania obcemu władcy. Spełnimy jego prośbę."
 emp_swi_start_title: "Zjednocz Szwajcarię"
 emp_swi_start_desc: "Musimy zadbać o to, by sojusze między kantonami były silne i trwałe, dzięki czemu Konfederacja będzie mogła występować jako zjednoczony front przeciwko zagrożeniom zewnętrznym."
 emp_swi_three_leagues_title: "Zintegruj Trzy Ligi"
 emp_swi_three_leagues_desc: "Związki Trzech Lig pod wieloma względami przypominają naszą Konfederację. Liga Domu Bożego, Szara Liga i Liga Dziesięciu Jurysdykcji to związki szwajcarskich miast-państw, które łączą siły dla obopólnych korzyści. Powinniśmy włączyć je do Konfederacji, co przyniesie korzyści wszystkim stronom."
 emp_swi_confederacy_title: "Zreorganizuj konfederację"
 emp_swi_confederacy_desc: "Konfederacja Szwajcarska musi stać się czymś więcej niż luźnym sojuszem w dużej mierze niezależnych miast. Powinniśmy przekształcić ją w sprawnie funkcjonujące państwo, zachowując autonomię kantonów."
 emp_swi_imperial_status_title: "Szwajcaria i Cesarstwo"
 emp_swi_imperial_status_desc: "Stosunki Szwajcarii z cesarzami Świętego Cesarstwa Rzymskiego od dawna są trudne. Musimy albo wynegocjować sobie silną pozycję w Cesarstwie, albo znaleźć bezpieczną drogę do jego opuszczenia."
 emp_swi_swabia_title: "Rozszerz konfederację"
 emp_swi_swabia_desc: "Szwabia jest podzielona i bezbronna, przez co stanowi łatwy cel podbojów dla wielkich potęg cesarskich. Powinniśmy objąć ją ochroną Konfederacji."
 emp_swi_swiss_guard_title: "Rozszerz Gwardię Szw."
 emp_swi_swiss_guard_desc: "Gwardia Szwajcarska papieża jest źródłem wielkiej dumy naszego narodu. Powinniśmy poprawić stosunki z Ojcem Świętym i zaoferować mu pomoc w walce."
 emp_swi_mercenaries_title: "Kompanie najemników"
 emp_swi_mercenaries_desc: "Szwajcarscy najemnicy walczyli niemal dla każdego państwa w Europie. Powinniśmy zbadać, w jaki sposób ci doświadczeni żołnierze mogliby lepiej służyć własnej ojczyźnie."
 emp_swi_mountain_forts_title: "Alpejskie bastiony"
 emp_swi_mountain_forts_desc: "Alpy stanowią naszą najpotężniejszą obronę przed najeźdźcami. Powinniśmy wznieść solidne zamki w strategicznych przełęczach, aby uczynić nasze państwo niezdobytym."
 emp_swi_protect_against_austria_title: "Ochrona przed Austrią"
 emp_swi_protect_against_austria_desc: "Habsburgowie austriaccy wielokrotnie próbowali podporządkować sobie nasze państwo. Musimy zgromadzić siły i poszukać sojuszników wśród ich wrogów."
 emp_swi_end_the_habsburgs_title: "Kres Habsburgów"
 emp_swi_end_the_habsburgs_desc: "Szwajcaria nigdy nie będzie naprawdę bezpieczna, dopóki choć jeden Habsburg pozostanie przy władzy."
 emp_swi_reformation_title: "Sprawa kiełbas"
 emp_swi_reformation_desc: "Nigdzie w Piśmie Świętym nie zakazano jedzenia kiełbasy podczas postu! Kościół katolicki stał się skorumpowany i narzuca nam edykty sprzeczne ze Słowem Bożym. Powinniśmy posłuchać Zwingliego i Kalwina oraz zerwać więzi z arcyheretykiem z Rzymu."
 emp_swi_convert_title: "Rezolucja religijna"
 emp_swi_convert_desc: "Szwajcaria nie może paść ofiarą podziałów religijnych. Katolicy i reformatorzy muszą odłożyć różnice na bok i nauczyć się żyć w pokoju. W przeciwnym razie nie pozostanie nam nic innego, jak narzucić prawdziwą wiarę."
 emp_swi_evangelize_title: "Konwencje genewskie"
 emp_swi_evangelize_desc: "Uczynimy z Genewy nowy Rzym — duchowe centrum reformacji. Spróbujemy ustanowić w tym mieście radę reformatorów różnych nurtów z całej Europy. Choć zapewne nie uda nam się całkowicie rozstrzygnąć sporów religijnych, możemy przynajmniej podjąć próbę pokojowego współistnienia mimo różnic doktrynalnych."
 swi_12_reformer_countries: " europejskich państw wyznaje protestantyzm lub kalwinizm"
 swi_20_catholic_countries: " europejskich państw wyznaje katolicyzm"
 integration_of_the_three_leagues: "Integracja Trzech Lig"
 desc_integration_of_the_three_leagues: "Trzy Ligi przystąpiły do Konfederacji Szwajcarskiej, a ich miasta zostały przyjęte do wspólnoty."
 reorganzied_swiss_confederacy: "Reorganizacja Konfederacji Szwajcarskiej"
 desc_reorganzied_swiss_confederacy: "Po zjednoczeniu Szwajcarii musimy skupić się na sprawach wewnętrznych i przekształcić rząd w sprawnie funkcjonujące państwo."
 swi_expanded_papal_guard: "Rozszerzono Gwardię Papieską"
 desc_swi_expanded_papal_guard: "Papieska Gwardia Szwajcarska zawsze będzie stać u boku Ojca Świętego."
 ended_the_habsburgs: "Koniec panowania Habsburgów"
 desc_ended_the_habsburgs: "Ostatni Habsburgowie zostali usunięci ze swoich tronów. Wreszcie świat uwolnił się od ich podstępnych intryg!"
 swi_swabia_joins_the_confederacy: "Szwabia dołącza do konfederacji"
 desc_swi_swabia_joins_the_confederacy: "Szwabia przystąpiła do Konfederacji. Jej mieszkańcy zaczynają dostrzegać korzyści płynące ze szwajcarskiego systemu rządów."
 opinion_sausage_eaters: "Zjadacze kiełbasy"
 emp_mission_events.2.t: "Genewa dołącza do konfederacji"
 emp_mission_events.2.d: "Nasi dyplomaci niestrudzenie pracowali nad zacieśnieniem więzi z nowo powstałym, niezależnym miastem-państwem Genewa. Po długich negocjacjach władcy miasta zgodzili się przystąpić do Konfederacji, choć na ograniczonych zasadach."
 emp_mission_events.2.a: "Witamy naszych nowych rodaków."
 emp_mission_events.3.t: "Konwencje genewskie"
 emp_mission_events.3.d: "Zwołaliśmy w Genewie radę reformatorów religijnych, jakiej dotąd nie widziano. Wśród uczestników znaleźli się radykalni duchowni z państwa [geneva_conventions_1.GetName], [geneva_conventions_3.GetAdjective] możnowładcy, a nawet [geneva_conventions_2.Monarch.GetTitle] [geneva_conventions_2.Monarch.GetName] z państwa [geneva_conventions_2.GetName].\n\nRada osiągnęła kilka ważnych porozumień doktrynalnych, które spotkały się z szeroką akceptacją europejskich reformatorów. Genewa zyskuje miano Rzymu wyznawców [Root.Religion.GetName] ze względu na swoją rolę jako ośrodek reformacji."
 emp_mission_events.3.a: "Jesteśmy sercem reformacji."
 emp_mission_events.4.t: "Wolność dla Genewy"
 emp_mission_events.4.d: "Władcy Genewy wystąpili wobec nas z bezczelnym żądaniem: mamy natychmiast uwolnić miasto spod naszego panowania i uznać je za suweronnego członka Konfederacji Szwajcarskiej. Bez wątpienia stoją za tym agenci Konfederacji."
 emp_mission_events.4.a: "Genewa słusznie należy do nas!"
 emp_mission_events.4.b: "Nie warto o to walczyć."
 opinion_geneva_conventions: "Konwencje genewskie"
 swi_geneva_mission_tt: "§YGenewa§! może zostać naszym poddanym."
 geneva_religious_center: "§YGenewa§! stanie się §Yośrodkiem religijnym§!"
 EMP_crusader_navy_title: "Flota krzyżowców"
 EMP_crusader_navy_desc: "Nie możemy liczyć na odzyskanie ziem z rąk niewiernych, jeśli na morzu ich przewaga będzie przytłaczająca. Musimy zbudować flotę, która wyrówna szanse."
 EMP_crusader_antioch_title: "Przywróć Szpitalników"
 EMP_crusader_antioch_desc: "Zakon św. Jana jest jedynie cieniem dawnej potęgi. Jeśli odzyskamy dawne państwo krzyżowców — Antiochię — stanie się ono doskonałą bazą do odbudowy zakonu."
 EMP_crusader_syria_title: "Królestwo niebieskie"
 EMP_crusader_syria_desc: "Jerozolima należy już do nas, lecz aby przetrwać w Ziemi Świętej, musimy umocnić tam naszą pozycję. Powinniśmy stworzyć królestwo na syryjskiej pustyni."
 EMP_crusader_jerusalem_title: "Jerozolima!"
 EMP_crusader_jerusalem_desc: "Najświętsze miasto chrześcijaństwa czeka na nasz powrót. Musimy zebrać odwagę i odzyskać je w imię Boga. Naprzód, ku Jerozolimie!"
 EMP_crusader_egypt_title: "Ziemia Mojżesza"
 EMP_crusader_egypt_desc: "Musimy zabezpieczyć naszą krucjatę, przejmując kontrolę nad Egiptem, przywracając arcybiskupstwo Aleksandrii i czyniąc tę ziemię bezpiecznym miejscem dla chrześcijańskich pielgrzymów."
 EMP_crusader_convert_the_holy_land_title: "Nawróć ziemię świętą"
 EMP_crusader_convert_the_holy_land_desc: "To hańba, że wiele z naszych najświętszych miast popadło w niewiarę i grzech. Musimy przywrócić chrześcijaństwo w Ziemi Świętej."
 EMP_crusader_pope_title: "Wpłyń na papieża"
 EMP_crusader_pope_desc: "Poparcie dla ponownej krucjaty przeciwko poganom w Grecji osłabło od czasu porażki pod Warną. Musimy przekonać papieża, aby uzasadnił nasze niezachwiane wysiłki w celu odzyskania Grecji w imię Chrystusa."
 EMP_crusader_greece_title: "Przyczółek w Grecji"
 EMP_crusader_greece_desc: "Rozsądnie byłoby rozpocząć podbój Grecji od zdobycia przyczółka na południu. Nie ma znaczenia, czy osiągniemy to, walcząc bezpośrednio z niewiernymi, czy odbierając posiadłości innym chrześcijańskim władcom. Te ziemie mają kluczowe znaczenie dla naszej krucjaty."
 EMP_crusader_latin_empire_title: "Cesarstwo Łacińskie"
 EMP_crusader_latin_empire_desc: "Po czwartej krucjacie w Konstantynopolu ustanowiono Cesarstwo Łacińskie, które rościło sobie prawa do dawnych ziem bizantyjskich. Musimy odbudować to imperium i przejąć dziedzictwo Rzymu."
 EMP_crusader_catholic_title: "Tarcza chrześcijaństwa"
 EMP_crusader_catholic_desc: "Słowo Chrystusa musi dotrzeć do czterech krańców świata. Zarówno heretycy, jak i poganie muszą nawrócić się na prawdziwą wiarę, w przeciwnym razie zostaną skazani na wieczne potępienie."
 EMP_crusader_spain_title: "Floty sojuszników"
 EMP_crusader_spain_desc: "Nasza sytuacja strategiczna jest niebezpieczna. Przetrwaliśmy głównie dlatego, że wrogowie nie zdecydowali się jeszcze użyć przeciwko nam pełni swoich sił. Musimy zdobyć sojusznika na zachodzie i przekonać go, by przekazał nam bardziej dogodne do obrony terytorium."
 EMP_crusader_malta_title: "Ufortyfikuj Maltę"
 EMP_crusader_malta_desc: "Wyspa Malta będzie doskonałą bazą wypadową w naszych wojnach z niewiernymi piratami Afryki. Musimy przekształcić ją w potężną i niezdobytą twierdzę."
 EMP_crusader_africa_title: "Baza w Afryce"
 EMP_crusader_africa_desc: "Nadszedł czas, by przenieść walkę na wybrzeża Barbarii. Musimy zdobyć ważny port, wypędzić piratów, a następnie przygotować się do jeszcze większego starcia."
 EMP_crusader_piracy_title: "Krucjata antypiracka"
 EMP_crusader_piracy_desc: "Piraci berberyjscy muszą zostać raz na zawsze pokonani. Zdobędziemy wszystkie ich porty i położymy kres haniebnemu handlowi chrześcijańskimi niewolnikami."
 EMP_crusader_knights_of_the_new_world_title: "Rycerze Nowego Świata"
 EMP_crusader_knights_of_the_new_world_desc: "Nowy Świat oferuje wielkie możliwości. Jest nie tylko rozległym, niewykorzystanym źródłem bogactw, które mogą sfinansować nasze krucjaty, lecz także domem wielu ludów, które nie słyszały jeszcze Słowa Bożego. Musimy założyć kolonię i rozszerzyć naszą misję na zachód."
 EMP_crusader_fountain_of_youth_title: "Fontanna Młodości"
 EMP_crusader_fountain_of_youth_desc: "Legendy opowiadają o Fontannie Młodości, której woda ma tak cudowne właściwości, że leczy chorych i chroni przed śmiercią ze starości. Jeśli takie źródło naprawdę istnieje, musimy zdobyć je dla naszego świętego zakonu. Nieśmiertelność czeka!"
 EMP_crusader_ark_of_the_covenant_title: "Arka Przymierza"
 EMP_crusader_ark_of_the_covenant_desc: "Abisyńczycy twierdzą, że są strażnikami Arki Przymierza — świętej skrzyni zawierającej tablice Dziesięciu Przykazań przekazanych Mojżeszowi. Tak święta relikwia będzie bezpieczna tylko w naszych rękach. Musimy odkryć miejsce jej przechowywania i sprowadzić ją do naszej stolicy."
 crusader_egypt_tt: "Co najmniej §Y15§! prowincji w regionie §YEgiptu§! należy do [Root.GetName] lub jego poddanych niebędących trybutariuszami"
 crusader_greece_tt: "Co najmniej §Y5§! prowincji w obszarach Morei i Archipelagu Egejskiego należy do [Root.GetName] lub jego poddanych niebędących trybutariuszami"
 cruader_piracy_tt: "Co najmniej §Y10§! nadbrzeżnych prowincji w regionie §YMaghrebu§! należy do [Root.GetName] lub jego poddanych niebędących trybutariuszami"
 knights_missions.1.t: "Odrodzenie joannitów"
 knights_missions.1.d: "Odzyskanie Antiochii jest powodem do wielkiej radości. Rycerze św. Jana odzyskują poczucie celu, ustanawiając w mieście nową siedzibę zakonu. Ozdabiają budynki swoimi sztandarami i gromadzą się, gdy kapłani dokonują poświęcenia ziemi. Nasi kapitanowie i generałowie z zapałem omawiają plany reorganizacji zakonu oraz szkolenia nowych rekrutów napływających ze wszystkich zakątków chrześcijaństwa."
 knights_missions.1.d2: "Odzyskanie Antiochii jest powodem do wielkiej radości. Gdy tłumy gromadzą się, by obserwować kapłanów poświęcających ziemię, wysłannik joannitów zwraca się do [Root.Monarch.GetTitle]. Sugeruje, że Antiochia byłaby doskonałym miejscem do odrodzenia zakonu. Jeśli [Root.GetName] przekaże miasto wraz z okolicznymi ziemiami rycerzom, ci na zawsze przysięgną nam wierność."
 knights_missions.1.a: "Przywróćmy joannitów w Antiochii."
 knights_missions.1.b: "Nasza twierdza została odzyskana!"
 knights_missions.1.c: "Przyznajmy im jedynie prawo do założenia komandorii."
 knights_missions.2.t: "Zwycięska krucjata o Jerozolimę"
 knights_missions.2.d: "Zdobyliśmy Jerozolimę! Święte miasto należy do nas, a chrześcijanie na całym świecie radują się z tej wspaniałej nowiny. To chwalebny dzień w historii państwa [Root.GetName]!"
 knights_missions.2.a: "Miasto należy do nas!"
 kni_jerusalem_tt: "Stan §YDuchowieństwo§! na stałe zyskuje §G+10§! lojalności"
 knights_missions.3.t: "Cesarstwo Łacińskie"
 knights_missions.3.d: "Po czwartej krucjacie w Konstantynopolu ustanowiono Cesarstwo Łacińskie, które rościło sobie prawa do dziedzictwa upadłego Cesarstwa Bizantyjskiego. Region ponownie znalazł się pod panowaniem katolickim, tym razem w wyniku kampanii podbojów przeprowadzonej przez [Root.GetName]. [Root.Monarch.GetName] ogłosił, że [Root.GetName] przejmie dziedzictwo Rzymu, i przysiągł bronić Konstantynopola przed wrogami Boga i papieża."
 knights_missions.3.a: "Konstantynopol należy do nas."
 knights_missions.3.b: "Deus vult!"
 knights_missions.4.t: "Arka Przymierza"
 knights_missions.4.d: "Po krwawej walce z obrońcami odzyskaliśmy Arkę Przymierza. Umierający strażnicy ostrzegali nas, by nigdy nie otwierać świętej skrzyni, lecz gdy wspaniała, złocona arka spoczywa na posadzce pałacu w [Root.Capital.GetCapitalName], [Root.Monarch.GetTitle] [Root.Monarch.GetName] nie może oprzeć się pokusie.\n\nPodobno Arka zawiera dwie tablice z Dziesięcioma Przykazaniami, które Bóg osobiście przekazał Mojżeszowi. Takiego skarbu nie sposób zignorować — nawet samo spojrzenie na święte relikwie byłoby boskim doświadczeniem. A może jednak bluźnierstwem? Gdy [Root.Monarch.GetTitle] zbliża się do Arki, [Root.Monarch.GetSheHe] zastanawia się, czy [Root.Monarch.GetSheHe] jest jej godzien."
 knights_missions.4.a: "[Root.Monarch.GetName] otwiera Arkę."
 knights_missions.4.b: "[Root.Monarch.GetName] odsuwa się."
 kni_converted_the_holy_land: "Nawrócono ziemię świętą"
 desc_kni_converted_the_holy_land: "Ziemia Święta wyznaje teraz prawdziwą wiarę. Zaprawdę, zyskaliśmy przychylność Pana."
 kni_new_crusade: "Odnowiony duch krzyżowców"
 desc_kni_new_crusade: "Nasi żołnierze ponownie czują ducha krucjat, który porywa ich do walki o odzyskanie Ziemi Świętej."
 kni_kingdom_of_heaven: "Królestwo niebieskie"
 desc_kni_kingdom_of_heaven: "Zabezpieczyliśmy dawne Królestwo Jerozolimskie. Niech długo pozostanie w rękach dobrych chrześcijańskich żołnierzy."
 kni_alexandrian_archbishopric: "Arcybiskupstwo Aleksandrii"
 desc_kni_alexandrian_archbishopric: "W Aleksandrii powstało katolickie arcybiskupstwo, które cieszy się wielkim uznaniem wśród duchowieństwa."
 kni_ark_of_the_covenant: "Arka Przymierza"
 desc_kni_ark_of_the_covenant: "Legendarna Arka Przymierza, o której mówi się, że zawiera odłamki Dziesięciu Przykazań, została znaleziona w Etiopii."
 kni_ten_commandments: "Tablice Dziesięciu Przykazań"
 desc_kni_ten_commandments: "Fragmenty oryginalnych Dziesięciu Przykazań, dane Mojżeszowi przez samego Boga, zostały znalezione w świętej Arce Przymierza."
 malta_fort: "Maltańskie fortyfikacje"
 desc_malta_fort: "Fortyfikacje, które zbudowaliśmy na Malcie, są niezrównane i na pewno wytrzymają atak naszych znienawidzonych wrogów."
 kni_crusade_against_piracy: "Krucjata antypiracka"
 desc_kni_crusade_against_piracy: "Zwyciężyliśmy w naszej krucjacie przeciwko przerażającym piratom berberyjskim. Nasze okręty mogą teraz swobodnie żeglować po Morzu Śródziemnym."
 restored_hospitaler_knights: "Przywrócono Zakon Szpitalników"
 desc_restored_hospitaler_knights: "Przywróciliśmy Order Świętego Jana Jerozolimskiego do jego dawnej świetności."
 emp_boh_hussite_start_title: "Husycka regencja"
 emp_boh_hussite_start_desc: "Konflikt między różnymi frakcjami Husytów i tymi lojalnymi wobec Kościoła Rzymskiego osiągnął niełatwe rozwiązanie. Niepewność co do linii sukcesji po raz kolejny wywołuje napięcia między frakcjami religijnymi. Musimy rozwiązać kwestię sukcesji i zająć zdecydowane stanowisko w kwestii ortodoksji religijnej."
 emp_boh_hussite_one_title: "Husyckie odrodzenie"
 emp_boh_hussite_one_desc: "Pomimo, a może właśnie z powodu śmierci Jana Husa w 1415 roku, zwolennicy ruchu husyckiego przez wiele lat żywili do nas gorzką urazę. Konflikty ponownie stanęły na ostrzu noża i jest tylko kwestią czasu, kiedy będziemy musieli dokonać wyboru w imieniu naszego ludu."
 emp_boh_defenestrate_the_heretics_title: "Defenestracja heretyków"
 emp_boh_defenestrate_the_heretics_desc: "Reformacja przetacza się przez Europę, a nasza historia nieortodoksji stawia nas na czele teologicznego i politycznego konfliktu. Musimy stanąć w obronie prawdziwej wiary i wyrzucić naszych heretyckich wrogów przez okno!"
 emp_boh_development_one_title: "Roboty publiczne"
 emp_boh_development_one_desc: "Państwo [Root.GovernmentName] [Root.GetAdjective] pozostaje w tyle za naszymi sąsiadami pod względem uprzemysłowienia. Warto zainwestować w podniesienie naszej rangi w regionie, a tym samym w promowanie większego przemysłu."
 emp_boh_bohemian_crystal_title: "Czeski kryształ"
 emp_boh_bohemian_crystal_desc: "Produkcja szczególnie pięknych wyrobów ze szkła stała się popularna w naszym królestwie. Powinniśmy promować ten przemysł i zapewnić, że nasze dzieła będą cenione na europejskich dworach."
 emp_boh_bergordnung_reforms_title: "Zreformuj Ordunek Gorny"
 emp_boh_bergordnung_reforms_desc: "Odkrywane są nowe zastosowania węgla, które mogą zrewolucjonizować oblicze przemysłu na całym świecie. Powinniśmy zreformować nasze prawa górnicze, abyśmy mogli zacząć wydobywać węgiel z najwyższą wydajnością."
 emp_boh_integrate_silesia_title: "Zintegruj Śląsk"
 emp_boh_integrate_silesia_desc: "Teraz, gdy nasza własny domena jest uporządkowana, powinniśmy spojrzeć na naszą królewszczyznę. Śląsk zawsze był częścią naszego królestwa i najwyższy czas, by cieszył się pełnym statusem w naszym społeczeństwie."
 emp_boh_great_moravia_title: "Podbij Nitrę"
 emp_boh_great_moravia_desc: "Państwo wielkomorawskie, poprzednik Czech, rozciągało się niegdyś daleko poza tereny Czech. Powinniśmy dążyć do ponownego rozszerzenia naszych granic, poczynając od aneksji starego Księstwa Nitry."
 emp_boh_hungarian_union_title: "Unia z Węgrami"
 emp_boh_hungarian_union_desc: "Węgry i Czechy były wcześniej zjednoczone pod jednym królem, a rozdzielone zostały dopiero w 1439 r. wraz ze śmiercią Alberta II Habsburga. Powinniśmy przywrócić ten słuszny stan rzeczy."
 emp_boh_protect_against_turks_title: "Ochrona przed Turkami"
 emp_boh_protect_against_turks_desc: "Turcy osmańscy są zaangażowani w niebezpieczny podbój terytorialny, który grozi pochłonięciem chrześcijaństwa. Musimy dopilnować, by granice zostały ufortyfikowane przed nieuchronnym tureckim atakiem."
 emp_boh_revenge_for_nicopolis_title: "Zemsta za Nikopolis"
 emp_boh_revenge_for_nicopolis_desc: "W 1396 roku korona czeska wyruszyła na sprawiedliwą krucjatę przeciwko Turkom w Bułgarii, ale została pokonana przez pogan. Musimy ponownie zebrać nasze siły, odbić Bułgarię i przepędzić Turków z powrotem za morze!"
 emp_boh_polish_diplomacy_title: "Polska dyplomacja"
 emp_boh_polish_diplomacy_desc: "Charakter monarchii elekcyjnej w Polsce jest okazją dla naszych dyplomatów do promowania czeskiego następcy polskiego tronu. Powinniśmy upewnić się, że w Polsce rządzi ktoś z rodu [Root.Monarch.Dynasty.GetName]."
 emp_boh_prem_conquest_title: "Dziedzictwo Przemyślidów"
 emp_boh_prem_conquest_desc: "Czechy znów mają władzę. Jednak jeden z margrabiów na naszym dworze chytrze zauważył, że mamy uzasadnione roszczenia do ziem naszych przodków, Przemyślidów. Czasy poszły do przodu, granice się przesunęły, ale wierzymy, że niektóre z tych roszczeń nadal mają znaczenie."
 emp_boh_prem_conquest_two_title: "Podbij Pomorze Wsch."
 emp_boh_prem_conquest_two_desc: "Sukces naszego podboju wciąż brzmi w naszych uszach. Ziemie pomorskie na północy również znajdowały się pod kontrolą Wacława II, a zatem muszą należeć do nas."
 emp_boh_bohemian_commonwealth_title: "Rzeczpospolita Czeska"
 emp_boh_bohemian_commonwealth_desc: "Musimy spojrzeć poza to, co tradycyjnie uważano za Czechy, aby ustanowić większą wspólnotę. Nasze imperium obejmie Europę Środkową i zajmiemy miejsce wśród wielkich mocarstw świata."
 emp_boh_humiliate_austria_title: "Upokórz Austrię"
 emp_boh_humiliate_austria_desc: "Austria nadużywa cesarskiego tronu i nie ukrywa swoich planów podporządkowania sobie naszego narodu. Musimy pokazać książętom Niemiec i całemu światu, że Austria nie jest tak potężnym potworem, za jakiego się podaje."
 emp_boh_electorate_of_brandenburg_title: "Elektorat Brandenburgii"
 emp_boh_electorate_of_brandenburg_desc: "Jeśli chcemy zapewnić sobie tron Świętego Cesarstwa Rzymskiego, będziemy potrzebować poparcia elektorów. A czy jest lepszy sposób na zdobycie głosów niż podporządkowanie Brandenburgii naszym politycznym zachciankom?"
 emp_boh_electorate_of_saxony_title: "Elektorat Saksonii"
 emp_boh_electorate_of_saxony_desc: "Potrzebujemy wsparcia dodatkowych elektorów. W następnej kolejności powinniśmy skupić się na elektorze Saksonii, ponieważ od dawna szukaliśmy okazji do przejęcia kontroli nad Dreznem."
 emp_boh_reformatio_sigismundi_title: "Reformacja Zygmuntowska"
 emp_boh_reformatio_sigismundi_desc: "Cesarz Zygmunt, były król Czech, zaplanował wielką reformę Świętego Cesarstwa Rzymskiego. Powinniśmy kontynuować jego dziedzictwo i skierować Cesarstwo na nową, chwalebną ścieżkę."
 emp_boh_peace_in_europe_title: "Pokój w Europie"
 emp_boh_peace_in_europe_desc: "Od pokoleń Europę nękają wojny między wielkimi mocarstwami i pomniejszymi książętami. Nadszedł czas, by położyć kres konfliktom. Pod naszymi życzliwymi rządami znacznie powiększymy Cesarstwo, aby zapoczątkować złoty wiek pokoju i dobrobytu."
 defenestrations_of_prague: "Defenestracja praska"
 desc_defenestrations_of_prague: "Nasi heretyccy przeciwnicy zostali wyrzuceni z okien Pragi."
 bergordnung_reforms: "Reformy Ordunku Gornego"
 desc_bergordnung_reforms: "Zreformowaliśmy nasze przepisy dotyczące górnictwa, aby zwiększyć produkcję węgla w naszym kraju."
 boh_integrated_silesia: "Integracja Śląska"
 desc_boh_integrated_silesia: "Zintegrowaliśmy różne księstwa śląskie z naszym królestwem."
 boh_fortification_effort: "Działania fortyfikacyjne"
 desc_boh_fortification_effort: "Zbudowaliśmy nasze mury solidnie, gotowi na potencjalną inwazję osmańską."
 boh_sigismund_reforms: "Reformacja Zygmuntowska"
 desc_boh_sigismund_reforms: "Poprowadziliśmy Cesarstwo nową, chwalebną ścieżką."
 boh_peace_in_europe: "Pokój w Europie"
 desc_boh_peace_in_europe: "Pod ochroną Cesarstwa Europa może wkroczyć w złoty wiek pokoju i dobrobytu."
 bohemian_commonwealth: "Rzeczpospolita Czeska"
 desc_bohemian_commonwealth: "Nosimy wiele koron i rządzimy wieloma narodami. Naprawdę zajęliśmy miejsce pośród mocarstw świata."
 emp_mission_events.8.t: "Los Brandenburgii"
 emp_mission_events.8.d: "Zgodnie z prawem cesarskim godność elektorska Brandenburgii pozostaje w rękach [BRA.Monarch.GetTitle], mimo że kraj ten jest naszym poddanym. Pozostali elektorzy niechętnie poparliby naszą kandydaturę do tronu cesarskiego, gdyby uznali, że zmuszamy ich współbraci do głosowania na naszą korzyść. Gdybyśmy jednak zdetronizowali [BRA.Monarch.GetTitle] i osadzili na tronie naszego [Root.Monarch.GetTitle], elektorat przeszedłby na [Root.Monarch.GetHerHim], a problem zostałby rozwiązany. Z pewnością rozgniewałoby to jednak brandenburskich możnowładców.\nMożemy też przywrócić historyczną Marchię Brandenburską, która niegdyś stanowiła strefę buforową chroniącą niemieckich władców przed wrogami ze wschodu."
 emp_mission_events.8.a: "Ustanowić unię personalną."
 emp_mission_events.8.b: "Przywrócić Marchię Brandenburską."
 emp_mission_events.8.c: "Obecna sytuacja nam odpowiada."
 emp_mission_events.9.t: "Los Saksonii"
 emp_mission_events.9.d: "Zgodnie z prawem Świętego Cesarstwa Rzymskiego godność elektorska Saksonii pozostaje w rękach [SAX.Monarch.GetTitle], mimo że państwo to zostało naszym poddanym. Pozostali elektorzy raczej nie poprą naszej kandydatury, jeśli uznają, że zmuszamy elektora saskiego do posłuszeństwa. Moglibyśmy jednak zdetronizować [SAX.Monarch.GetTitle] i zastąpić go naszym [Root.Monarch.GetTitle], ustanawiając unię personalną. Wówczas elektorat przeszedłby na [Root.Monarch.GetHerHim]. Niestety, taki plan nie spodobałby się saskim możnowładcom."
 emp_brapru_reclaim_neumark_title: "Odzyskaj Nową Marchię"
 emp_brapru_reclaim_neumark_desc: "Prowincja Nowa Marchia była kiedyś integralną częścią Brandenburgii. Została wydzierżawiona Krzyżakom, ale zaniedbywali ziemię, powodując, że miejscowi mieszczanie zażądali powrotu do starej administracji."
 emp_brapru_conquer_pomerania_title: "Sukcesja pomorska"
 emp_brapru_conquer_pomerania_desc: "Mamy prawo do sukcesji Księstwa Pomorskiego. Jedynym sposobem, aby upewnić się, że nasze roszczenia nie zostaną zapomniane, jest przejęcie regionu siłą."
 emp_brapru_connect_the_prussian_lands_title: "Pruska ekspansja"
 emp_brapru_connect_the_prussian_lands_desc: "Po zjednoczeniu Brandenburgii z Prusami mamy problem z obroną tych odrębnych części naszego państwa. Aby podnieść jego obronność, musimy podbić wszystkie pruskie ziemie, nie tylko te, które są już pod naszą kontrolą."
 emp_brapru_army_reforms_1_title: "Profesjonalna armia"
 emp_brapru_army_reforms_1_desc: "Musimy zrezygnować z praktyki zatrudniania najemników do walki w naszych bitwach. Zamiast tego stworzymy profesjonalną armię dla naszego kraju."
 emp_brapru_renovate_berlin_title: "Odnów Berlin"
 emp_brapru_renovate_berlin_desc: "Berlin od dawna jest spóźniony z remontami architektonicznymi, a infrastruktura potrzebuje pilnej modernizacji. Musimy zainwestować w znaczne ulepszenia miasta oraz promować jego rozwój"
 emp_brapru_army_reforms_2_title: "Reformy armii"
 emp_brapru_army_reforms_2_desc: "Dyscyplina oddziela armię od motłochu. Musimy zapewnić, by nasi żołnierze byli dobrze wyszkoleni, dobrze wyposażeni, a przede wszystkim zdyscyplinowani."
 emp_brapru_army_reforms_3_title: "Armia z państwem"
 emp_brapru_army_reforms_3_desc: "Mniejsze państwa mają armię. Nasza armia będzie miała państwo."
 emp_brapru_ansbach_succession_title: "Sukcesja ansbachska"
 emp_brapru_ansbach_succession_desc: "Hohenzollernowie z Ansbachu są ściśle spokrewnieni z naszą własną linią rodową. Powinniśmy upewnić się, że sukcesja Ansbachu ostatecznie doprowadzi do ponownego zjednoczenia z naszymi kuzynami."
 emp_brapru_franconian_conquest_title: "Podbój Frankonii"
 emp_brapru_franconian_conquest_desc: "Po przyłączeniu Ansbachu powinniśmy poszerzyć nasze posiadłości we Frankonii."
 emp_brapru_conquer_silesia_title: "Podbij Śląsk"
 emp_brapru_conquer_silesia_desc: "Mimo iż niektórzy powiedzieliby, że nasze pretensje wobec Śląska są nieco wątłe, mamy pewne podstawy do roszczenia sobie praw do tej prowincji. Prestiż naszego kraju zależy od tego, czy te podstawy będą wystarczające."
 emp_brapru_prussia_partitions_poland_title: "Podbij Wielkopolskę"
 emp_brapru_prussia_partitions_poland_desc: "Polska jest słaba, a Rosja nadal chce nad nią panować - abyśmy zaakceptowali taki stan rzeczy, musimy otrzymać rekompensatę w postaci polskich ziem."
 emp_brapru_chinese_trade_title: "Handel w Kantonie"
 emp_brapru_chinese_trade_desc: "Bogactwa orientu nie zostały jeszcze wykorzystane przez europejskich kupców. Musimy spieszyć, aby wykorzystać to nowe źródło bogactwa. Płyńmy do Kataju!"
 emp_brapru_edict_of_potsdam_title: "Edykt poczdamski"
 emp_brapru_edict_of_potsdam_desc: "Rządy w całej Europie uchwalają prawa dyskryminujące naszych braci w wierze. Powinniśmy ogłosić nasz własny edykt, który potwierdza naszą pobożność i zachęca wiernych do osiedlenia się w obrębie naszego kraju"
 emp_brapru_reform_the_state_title: "Zreformuj państwo"
 emp_brapru_reform_the_state_desc: "Nasze prawa i rząd muszą odzwierciedlać charakter naszego narodu. Uchwalona zostanie seria reform, które przekształcą państwo w dobrze naoliwiony aparat rządowy."
 emp_brapru_enlightened_absolutism_title: "Absolutyzm oświecony"
 emp_brapru_enlightened_absolutism_desc: "Wszystko dla ludu, nic poprzez lud."
 emp_brapru_show_of_strength_title: "Pokaz siły"
 emp_brapru_show_of_strength_desc: "Zanim zgłosimy roszczenia do rozległych ziem w Niemczech, musimy najpierw udowodnić książętom, że jesteśmy siłą, z którą należy się liczyć."
 emp_brapru_lower_saxony_title: "Podbij Dolną Saksonię"
 emp_brapru_lower_saxony_desc: "Dolna Saksonia stanowi naturalny kierunek naszej ekspansji. Prowadząc kampanię w tym regionie, musimy również pokonać naszych rywali w Lüneburgu i Magdeburgu oraz zabezpieczyć port w Emden."
 emp_brapru_emden_company_title: "Kompania Emdeńska"
 emp_brapru_emden_company_desc: "Skoro dzięki portowi w Emden uzyskaliśmy dostęp do Atlantyku, musimy powołać Królewską Kompanię Azjatycką, która przemierzy oceany w poszukiwaniu bogactw dla naszej ojczyzny."
 emp_brapru_kiel_canal_title: "Zbuduj Kanał Kiloński"
 emp_brapru_kiel_canal_desc: "Pojawiły się sugestie, że można połączyć Ocean Atlantycki z Oceanem Spokojnym, budując kanał w Panamie. To oczywiście absurd. Realne może być jednak wykopanie kanału łączącego Bałtyk z Morzem Północnym, dzięki któremu statki mogłyby przepływać z Emden do naszych bałtyckich portów."
 emp_brapru_westphalian_conquest_title: "Podbój Westfalii"
 emp_brapru_westphalian_conquest_desc: "Powinniśmy rozszerzyć nasze wpływy w Niemczech na zachód, na ziemie Westfalii."
 emp_brapru_duchy_of_cleves_title: "Księstwo Kleve"
 emp_brapru_duchy_of_cleves_desc: "Dzięki zawiłym prawom sukcesyjnym mamy roszczenia do Księstwa Kleve. Mimo, że są słabe, stanowią dobry powód do ekspansji w Nadrenii."
 emp_brapru_rhineland_conquest_title: "Podbój Nadrenii"
 emp_brapru_rhineland_conquest_desc: "Nadrenia jest regionem będącym przedmiotem zaciekłej rywalizacji, areną konfliktów wielkich mocarstw, a zarazem domem wielu zamożnych miast. Powinniśmy podbić ten obszar, przygotowując się do opanowania całych Niemiec."
 emp_brapru_german_empire_title: "Związek Niemiecki"
 emp_brapru_german_empire_desc: "Staliśmy się potężnym państwem, budzącym strach i szacunek wszystkich rozsądnych mężów stanu. Nadszedł czas, by zjednoczyć Niemcy w jednym państwie — siłą lub dyplomacją."
 emp_brapru_the_balance_of_power_title: "Równowaga sił"
 emp_brapru_the_balance_of_power_desc: "Przez większą część naszej historii odgrywaliśmy niewielką rolę na światowej scenie. Musimy zmusić wielkie mocarstwa, by zaliczyły nas do swojego grona."
 emp_brapru_konigsberg_development_title: "Rozwiń Królewiec"
 emp_brapru_konigsberg_development_desc: "Królewiec jest najważniejszym miastem Prus. Musimy ufundować tam uniwersytet i zainwestować w rozwój miasta."
 emp_brapru_empower_the_junkers_title: "Wzmocnij junkrów"
 emp_brapru_empower_the_junkers_desc: "Junkrzy, czyli drobna szlachta ziemiańska, mają ogromne wpływy w naszym państwie. Musimy ich zorganizować i uregulować zakres ich władzy, aby służyli interesom państwa."
 pru_space_marines: "Armia z państwem"
 desc_pru_space_marines: "Inne państwa mają armię. Nasza armia ma państwo."
 pru_space_marines_2: "Armia z państwem"
 desc_pru_space_marines_2: "Inne państwa mają armię. Nasza armia ma państwo."
 pru_chinese_trade: "Chiński handel"
 desc_pru_chinese_trade: "Ustanowiliśmy szlak handlowy z Niemiec do Chin, otwierając przed naszym państwem bogactwa Orientu."
 pru_emden_company_modifier: "Kompania Emdeńska"
 desc_pru_emden_company_modifier: "Kompania Emdeńska została założona w celu nawiązania zamorskich kontaktów handlowych."
 pru_construction_modifier: "Niemiecka inżynieria"
 desc_pru_construction_modifier: "Nasi inżynierowie i architekci zyskali sławę dzięki projektowaniu funkcjonalnych budowli, które można wznosić sprawnie i niewielkim nakładem pracy."
 edict_of_potsdam_modifier: "Edykt poczdamski"
 desc_edict_of_potsdam_modifier: "Nasz edykt zachęca wiernych z całej Europy do osiedlania się w naszym państwie."
 pru_german_confederation: "Związek Niemiecki"
 desc_pru_german_confederation: "Książęta niemieccy jednoczą swoje ziemie w jedno państwo pod naszym czujnym nadzorem."
 emp_nap_roman_relations_title: "Relacje z Rzymem"
 emp_nap_roman_relations_desc: "Bliskość Neapolu i Rzymu wymaga jasnego określenia naszych stosunków z Ojcem Świętym. Musimy albo dążyć do przyjaźni z Państwem Kościelnym, albo obrać niebezpieczną drogę otwartego sprzeciwu."
 emp_nap_defender_of_the_faith_title: "Obrońca wiary"
 emp_nap_defender_of_the_faith_desc: "Południowe Włochy zamieszkuje wielu pobożnych chrześcijan, którzy oczekują, że nasze państwo aktywnie zaangażuje się w obronę wiary. Musimy sprostać tym oczekiwaniom i zdobyć poparcie zarówno ludu, jak i Pana."
 emp_nap_state_of_the_presidi_title: "Stato dei Presidi"
 emp_nap_state_of_the_presidi_desc: "Kilka miast na toskańskim wybrzeżu, znanych jako Państwo Presidi, uznaje zwierzchnictwo Neapolu i [Root.Monarch.GetName]. Terytoria te powinny stać się podstawą naszej dalszej ekspansji w Toskanii."
 emp_nap_italian_wars_title: "Wygraj wojny włoskie"
 emp_nap_italian_wars_desc: "W całej Italii trwa wojna o dominację w regionie. Wielu pragnie panować nad Neapolem, lecz państwo [Root.GetName] ma własne ambicje. Musimy zwyciężyć w tych wojnach i stworzyć większe państwo na Półwyspie Apenińskim."
 emp_nap_dalmatian_conquest_title: "Podbój Dalmacji"
 emp_nap_dalmatian_conquest_desc: "Musimy kontynuować ekspansję wzdłuż wybrzeża Adriatyku, pamiętając przy tym o zdobyciu bogatego portu handlowego w Ragusie."
 emp_nap_independent_naples_title: "Niepodległy Neapol"
 emp_nap_independent_naples_desc: "Neapol musi wywalczyć niepodległość od obcych mocarstw, które pragną decydować o jego losie."
 emp_nap_two_sicilies_title: "Zjednoczenie Obojga Sycylii"
 emp_nap_two_sicilies_desc: "Królestwa Sycylii i Neapolu były niegdyś zjednoczone, lecz wydarzenia polityczne doprowadziły do ich rozdzielenia. Powinniśmy naprawić tę sytuację, rozszerzając nasze panowanie na Sycylię i Neapol, aby ponownie zjednoczyć królestwo."
 emp_nap_despot_of_epirus_title: "Despota Epiru"
 emp_nap_despot_of_epirus_desc: "Wielu pomniejszych władców Epiru przysięgało niegdyś wierność królowi Neapolu. Musimy ponownie objąć władzę nad Epirotami i upomnieć się o tytuł despoty."
 emp_nap_king_of_jerusalem_title: "Król Jerozolimy"
 emp_nap_king_of_jerusalem_desc: "Krucjaty zakończyły się niepowodzeniem, a Ziemia Święta ponownie znalazła się w rękach niewiernych. Nadszedł czas, by ponownie chwycić za krzyż i walczyć o odzyskanie Jerozolimy!"
 emp_nap_crown_of_aragon_title: "Korona Aragonii"
 emp_nap_crown_of_aragon_desc: "Król Aragonii uważał się niegdyś za prawowitego władcę Neapolu. Odwrócimy sytuację i uczynimy z Aragonii domenę [Root.GetAdjective]."
 emp_nap_neapolitan_navy_title: "Neapolitańska marynarka"
 emp_nap_neapolitan_navy_desc: "Nasze państwo jest niemal całkowicie otoczone wodą, przez co pozostaje narażone na ataki od strony morza. Musimy zbudować znaczną flotę, jeśli chcemy nie tylko się bronić, lecz także rozszerzać nasze wpływy za oceanem."
 emp_nap_med_islands_title: "Zabezpiecz M. Śródziemne"
 emp_nap_med_islands_desc: "Wyspy zachodniej części Morza Śródziemnego miałyby wielką wartość strategiczną w naszych rękach, a w posiadaniu rywali stanowią nieustanne zagrożenie. Musimy je zdobyć i ustanowić tam nasze panowanie."
 emp_nap_barbary_pirates_title: "Pokonaj berber. piratów"
 emp_nap_barbary_pirates_desc: "Piraci berberyjscy są plagą naszego państwa: najeżdżają wybrzeża i porywają naszych ludzi w niewolę. Muszą zostać raz na zawsze pokonani."
 emp_nap_renaissance_city_title: "Renesansowe miasto"
 emp_nap_renaissance_city_desc: "Italia przeżywa odrodzenie sztuki, kultury i nauki. Neapol musi znaleźć się w awangardzie tego renesansu, otaczając opieką artystów i finansując budowę nowych, wspaniałych kościołów."
 emp_nap_develop_naples_title: "Rozwiń [Root.GetName]"
 emp_nap_develop_naples_desc: "Neapol jest wielkim miastem, lecz może stać się jeszcze wspanialszy. Wiele mniejszych ośrodków na obrzeżach naszej domeny pozostaje jednak zaniedbanych. Powinniśmy inwestować w rozwój państwa dla dobrobytu naszego ludu."
 emp_nap_rein_in_nobility_title: "Ogranicz szlachtę"
 emp_nap_rein_in_nobility_desc: "[Root.GetAdjective] szlachta od zawsze jest cierniem w boku państwa, knując intrygi w pogoni za władzą i wpływami. Musimy ją poskromić, aby jej działania służyły przede wszystkim interesom państwa."
 emp_nap_neapolitan_governance_title: "Neapolitańskie panowanie"
 emp_nap_neapolitan_governance_desc: "Państwo [Root.GetName] musi zdecydować o swoim ustroju. Republika czy monarchia? Despotyzm czy konstytucjonalizm? Musimy ostatecznie rozstrzygnąć te kwestie."
 naples_government_tt: "Ukończyć wszystkie reformy rządowe lub stać się republiką"
 naples_dotf_modifier: "Neapol broni wiary"
 desc_naples_dotf_modifier: "Nasz lud raduje się, że przyjęliśmy na siebie obowiązki obrońcy wiary."
 nap_italian_wars_modifier: "Zwycięstwo w wojnach włoskich"
 desc_nap_italian_wars_modifier: "Odnieśliśmy zdecydowane zwycięstwo w wojnach włoskich i zdobyliśmy przy tym cenne doświadczenie w skutecznym wykorzystywaniu kondotierów."
 nap_ragusa_trade: "Handel adriatycki"
 desc_nap_ragusa_trade: "Nasze posiadłości na wybrzeżu Adriatyku wspierają handel w całym państwie."
 nap_liberty_desire: "Uprzywilejowani poddani"
 desc_nap_liberty_desire: "Nasze państwa podległe przekonają się, że nasze rządy są łagodne i życzliwe, o ile pozostaną lojalne."
 nap_barbary_pirates: "Pokonanie piratów berberyjskich"
 desc_nap_barbary_pirates: "Pokonaliśmy budzących postrach piratów berberyjskich. Nasze statki mogą teraz bez przeszkód przemierzać morza."
 emp_ger_hlr_lowlands_title: "Zabezpiecz Niderlandy"
 emp_ger_hlr_lowlands_desc: "Dążenia niepodległościowe Holendrów muszą zostać zdławione. Nie wystarczy podporządkować sobie Niderlandów — musimy również zająć je bezpośrednio i objąć ścisłą kontrolą."
 emp_ger_hlr_rhineland_title: "Przemył w Nadrenii"
 emp_ger_hlr_rhineland_desc: "Nadrenia ma potencjał, by stać się wielkim ośrodkiem przemysłu. Nie możemy go zmarnować. Powinniśmy poczynić znaczne inwestycje w regionalny przemysł wytwórczy."
 emp_ger_hlr_education_title: "Kształcenie obowiązkowe"
 emp_ger_hlr_education_desc: "Każde dziecko w naszym państwie powinno mieć obowiązek uczęszczania do niemieckiej szkoły. Dzięki temu nie tylko zapewnimy sobie wykształconą siłę roboczą, lecz także zaszczepimy młodym właściwe niemieckie wartości i język."
 emp_ger_hlr_blood_and_iron_title: "Krew i żelazo"
 emp_ger_hlr_blood_and_iron_desc: "Książęta, którzy dotąd opierali się naszym rządom, muszą zostać podporządkowani. Zjednoczenie Niemiec wymaga czegoś więcej niż łagodnej perswazji — potrzebujemy polityki siły i użycia potęgi militarnej."
 emp_ger_hlr_urbanization_title: "Promuj urbanizację"
 emp_ger_hlr_urbanization_desc: "Liczne niewielkie miasteczka rozsiane po niemieckich ziemiach muszą przekształcić się we wspaniałe miasta, będące ośrodkami kultury i handlu."
 emp_ger_hlr_dominant_economy_title: "Dominująca gospodarka"
 emp_ger_hlr_dominant_economy_desc: "Gospodarka [Root.GetAdjective] będzie największa w całej Europie. Jeśli w pełni wykorzystamy potencjał naszego państwa, innym krajom nie uda się dorównać naszemu bogactwu."
 emp_ger_hlr_chancellorship_title: "Ustanowienie urzędu kanclerza"
 emp_ger_hlr_chancellorship_desc: "Państwo [Root.GetName] nie może polegać wyłącznie na zdolnościach [Root.Monarch.GetTitle]. Potrzebujemy zaufanego gabinetu ministrów, któremu można powierzyć właściwe zarządzanie państwem, a na jego czele musi stanąć silny przywódca. Powinniśmy ustanowić urząd kanclerza, który pokieruje pracą rządu."
 emp_ger_hlr_junkers_title: "Kontroluj junkrów"
 emp_ger_hlr_junkers_desc: "Szlachta ziemiańska, czyli junkrzy, wywiera ogromny wpływ na państwo [Root.GetAdjective]. Musimy poskromić tych możnowładców i zmusić ich, by służyli narodowi, zamiast wyciągać z niego kolejne przywileje."
 emp_ger_hlr_kaiserreich_title: "Kaiserreich"
 emp_ger_hlr_kaiserreich_desc: "Cesarstwo Niemieckie przyćmi wszystkie pozostałe. Los świata będzie spoczywał wyłącznie w naszych rękach."
 kaiserreich_tt: "Posiadać więcej łącznego rozwoju niż jakiekolwiek inne państwo na świecie."
 emp_ger_hlr_italy_title: "Inwazja na Włochy"
 emp_ger_hlr_italy_desc: "Od czasów Karolingów losy Niemiec i Italii są ze sobą związane. Nadszedł czas, by przywrócić niemiecką hegemonię nad Italią."
 emp_ger_hlr_protected_markets_title: "Chronione rynki"
 emp_ger_hlr_protected_markets_desc: "Zyski z handlu niemieckimi towarami powinny przypadać mieszkańcom niemieckich państw. Musimy podjąć działania, które ochronią niemieckie rynki przed obcą ingerencją."
 emp_ger_hlr_imperial_navy_title: "Cesarska flota"
 emp_ger_hlr_imperial_navy_desc: "Żadne niemieckie państwo nie odniosło dotąd większych sukcesów na morzu. Powinniśmy zbudować flotę ciężkich okrętów wojennych, aby to zmienić."
 emp_ger_hlr_overseas_empire_title: "Imperium zamorskie"
 emp_ger_hlr_overseas_empire_desc: "Powinniśmy wykorzystać nasze faktorie handlowe w Afryce jako przyczółek do rozszerzenia wpływów na Daleki Wschód. Bogactwa Chin czekają!"
 emp_ger_hlr_poland_title: "Anektuj Polskę"
 emp_ger_hlr_poland_desc: "Żyzne ziemie uprawne Polski mogłyby przynosić ogromne zyski i wyżywić wielu mieszkańców naszego państwa, gdyby udało się odebrać je nieudolnym rządom naszych wrogów. Powinniśmy najechać Polskę i zabezpieczyć jak największą część tych urodzajnych ziem."
 emp_ger_hlr_holy_state_title: "Państwo kościelne"
 emp_ger_hlr_holy_state_desc: "Nowo zjednoczone Cesarstwo musi dowieść swojego oddania wierze. Ogłośmy światu, że będziemy bronić religii [Root.Religion.GetName] za wszelką cenę."
 emp_ger_hlr_roman_politics_title: "Rozstrzygnięcie kwestii rzymskiej"
 emp_ger_hlr_roman_politics_desc: "Kościół rzymski wywiera wpływ na Cesarstwo od chwili jego powstania, a napięcia między papieżem i cesarzem nigdy nie zostały naprawdę rozwiązane. Musimy wymusić ostateczne rozstrzygnięcie tej kwestii, nawet jeśli będziemy musieli wkroczyć z armią do samego Rzymu."
 opinion_hre_crowned_by_the_pope: "Koronacja przez papieża"
 emp_ger_hlr_centralized_empire_title: "Centralizacja cesarstwa"
 emp_ger_hlr_centralized_empire_desc: "Gdy kwestie wiary zostały rozstrzygnięte zgodnie z naszymi oczekiwaniami, musimy zadbać o przyszłość Świętego Cesarstwa Rzymskiego. Książęta zbyt długo cieszyli się autonomią, lecz teraz, gdy Cesarstwo jest zjednoczone, musimy całkowicie podporządkować sobie każde miasto i każdą wieś. Niech nikt nie powie, że nie jesteśmy święci, rzymscy ani cesarscy!"
 emp_ger_hlr_crush_the_revolution_title: "Zgnieć rewolucję"
 emp_ger_hlr_crush_the_revolution_desc: "Armie politycznych radykałów roją się na ulicach miast Europy. Nie możemy znieść tego zakłócenia naturalnego porządku, dlatego musimy wkroczyć w samo serce tej rewolucji i całkowicie ją zdławić."
 emp_ger_hlr_france_title: "Zaatakuj Francję"
 emp_ger_hlr_france_desc: "Francja od stuleci snuje plany ekspansji w Niemczech. Nie możemy pozwolić, by tak potężne państwo zagrażało jedności naszego kraju. Przenieśmy walkę na ich ziemie i najeźdźmy Francję!"
 emp_ger_hlr_baltic_title: "Podbój Bałtyku"
 emp_ger_hlr_baltic_desc: "Musimy zdobyć bogate porty handlowe Bałtyku i ustanowić w regionie obecność wojskową."
 emp_ger_hlr_scramble_for_africa_title: "Wyścig o Afrykę"
 emp_ger_hlr_scramble_for_africa_desc: "Europejskie mocarstwa ścigają się w zdobywaniu przyczółków w Afryce, głównie po to, by rozszerzyć swoje wpływy na Wschodzie. Państwo [Root.GetName] nie może pozostać bez własnych posiadłości afrykańskich, dlatego musimy zorganizować wyprawę!"
 emp_ger_hlr_concert_of_europe_title: "Jednomyślność Europy"
 emp_ger_hlr_concert_of_europe_desc: "Europejską dyplomacją rządzi obecnie troska o równowagę sił. Coraz mniej wielkich państw decyduje o sprawach całego kontynentu. Niemcy muszą znaleźć się wśród tych potęg i zdobyć należne im miejsce na światowej scenie."
 emp_ger_hlr_caprathian_conquest_title: "Podbój Karpat"
 emp_ger_hlr_caprathian_conquest_desc: "Królestwo Węgier stało się polem walki wielkich mocarstw. Musimy poprowadzić nasze armie nad Dunaj i w Karpaty, by zgłosić własne roszczenia do tego regionu, zanim zagarną go nasi oportunistyczni rywale."
 emp_ger_hlr_burn_the_wooden_wall_title: "Spal drewniany mur"
 emp_ger_hlr_burn_the_wooden_wall_desc: "Królewska Marynarka Wojenna Wysp Brytyjskich pozwala Anglikom rozszerzać wpływy na całym świecie, a przede wszystkim w Niemczech. Musimy położyć kres ich ingerencji i spalić ich drewniany mur, aż pozostanie z niego popiół na dnie oceanu!"
 burn_wooden_wall_tt: "Żadne państwo ze stolicą w regionie §YWysp Brytyjskich§! nie posiada floty liczącej więcej niż §Y5§! ciężkich okrętów."
 ger_rhineland_tt: "Każda posiadana prowincja z manufakturą w obszarach §YPółnocnej Nadrenii§!, §YDolinnej Nadrenii§! i §YPalatynatu§! otrzymuje do końca gry modyfikator §YZindustrializowana Nadrenia§!, zapewniający następujący efekt:\nLokalny modyfikator produkcji dóbr: §G+15.0%§!"
 dominant_economy_tt: "Posiadać wyższy miesięczny dochód niż jakiekolwiek inne państwo w Europie"
 germany_ned_tt: "§YNiderlandy§! nie posiadają żadnych prowincji w regionie §YNiderlandów§!"
 ger_chancellor_tt: "Zatrudniać §Y3§! doradców o umiejętnościach co najmniej §Y3§!."
 emp_mission_events.5.t: "Ukoronowany przez papieża"
 emp_mission_events.5.d: "Zawarliśmy ostateczne i trwałe porozumienie z Namiestnikiem Chrystusa, papieżem [PAP.Monarch.GetName]. Od tej pory Ojciec Święty będzie osobiście koronował cesarza Świętego Cesarstwa Rzymskiego.\nUzgodniono również, że cesarz uzyska faktyczne zwierzchnictwo nad Kościołem na obszarze Cesarstwa, co zakończy trwające od stuleci, często krwawe spory między papieżem a cesarzem."
 emp_mission_events.5.a: "Jesteśmy prawdziwym imperium rzymskim."
 EST_VAL_GER_URBAN: "Niemiecka urbanizacja: §G$VAL$§!"
 industrialized_rhineland: "Przemył w Nadrenii"
 desc_industrialized_rhineland: "Nasze inwestycje w Nadrenii skutkują szybką industrializacją."
 ger_german_education: "Niemiecka edukacja"
 desc_ger_german_education: "Promowanie niemieckiej edukacji gwarantuje, że nasze wartości kulturowe są zaszczepione w całym kraju."
 ger_chancellorship: "Kanclerz"
 desc_ger_chancellorship: "Powołaliśmy kanclerza, który będzie przewodniczył rządowi i przejmie wiele obowiązków związanych z zarządzaniem państwem niemieckim."
 ger_kaiserreich: "Kaiserreich"
 desc_ger_kaiserreich: "Deutschland, Deutschland über alles"
 ger_burned_wooden_wall: "Spalono drewniany mur"
 desc_ger_burned_wooden_wall: "Brytyjska marynarka wojenna została zredukowana do kupy zwęglonego drewna na dnie oceanu."
 ger_concert_of_europe: "Jednomyślność Europy"
 desc_ger_concert_of_europe: "Aby zachować równowagę sił, europejska dyplomacja musi ewoluować."
 ger_reactionary_zeal: "Zapał reakcyjny"
 desc_ger_reactionary_zeal: "Rewolucja została zdławiona, a niebezpieczne idee, które próbowała szerzyć, zostały zniszczone w zarodku."
 german_asia_companies: "Azjatyckie kompanie handlowe"
 desc_german_asia_companies: "Nasze wpływy sięgają najdalszych zakątków Azji Wschodniej, a nasi kupcy wracają z egzotycznymi towarami z Japonii i Chin."
 german_asia_companies_backup: "Azjatyckie kompanie handlowe"
 desc_german_asia_companies_backup: "Nasze wpływy sięgają najdalszych zakątków Azji Wschodniej, a nasi kupcy wracają z egzotycznymi towarami z Japonii i Chin."
 roman_hre: "Rzymskie cesarstwo"
 desc_roman_hre: "Spory między papieżem a cesarzem dobiegły końca, a trwająca od stuleci walka została rozstrzygnięta."
 hre_autonomy: "Centralizacja cesarstwa"
 desc_hre_autonomy: "Oby nikt nie powiedział, że nie jesteśmy ani Święci, ani Rzymscy ani Cesarstwem!"
 ger_crushed_dutch_independence: "Zdławiono holenderską niepodległość"
 desc_ger_crushed_dutch_independence: "Holenderskie aspiracje do niepodległości zostały zdławione. Niderlandy powróciły pod prawowite niemieckie panowanie."
 alb_skanderbeg_rebellion_title: "Bunt Skanderbega"
 alb_skanderbeg_rebellion_desc: "Skanderbeg stanął na czele oporu przeciwko osmańskiej inwazji na Albanię. Jego bohaterskie wysiłki dotąd chroniły nas przed tureckimi najazdami, lecz aby kontynuować powstanie, będzie potrzebował więcej ludzi."
 alb_withstand_the_turks_title: "Wystąp przeciwko Turkom"
 alb_withstand_the_turks_desc: "Musimy przeciwstawić się Turkom wszelkimi dostępnymi środkami. Samo przetrwanie tej nawałnicy będzie wymagało wojskowego i dyplomatycznego geniuszu."
 alb_inspire_resistance_title: "Wspieraj opór"
 alb_inspire_resistance_desc: "Nasze dalsze przetrwanie inspiruje chrześcijan na Bałkanach do chwycenia za broń przeciwko tureckim ciemiężcom. Musimy wesprzeć ich wysiłki i rozszerzyć powstanie na ludy wszystkich narodów."
 alb_lord_of_albania_title: "Władca Albanii"
 alb_lord_of_albania_desc: "Turcy nie są jedynymi niesprawiedliwymi okupantami albańskich ziem. Musimy również wypędzić włoskich książąt kupieckich, którzy zajęli znaczną część wybrzeża. Albania nie będzie wolna, dopóki nie odzyskamy każdego skrawka ziemi!"
 alb_end_turkish_rule_title: "Kres tureckich rządów"
 alb_end_turkish_rule_desc: "Nadszedł czas, by przenieść walkę na terytorium wroga. Powstanie Skanderbega stanie się początkiem krucjaty, która zjednoczy ludy Bałkanów przeciwko wspólnemu nieprzyjacielowi."
 albanian_victory_tt: "Wygrać bitwę z §YOsmanami§!"
 albanian_inspiration_tt: "Wszystkie chrześcijańskie prowincje należące do §YOsmanów§! w regionie §YBałkanów§! otrzymują §R+10§! niepokojów"
 ottoman_balkans_alb_tt: "§Y[Root.GetName]§! otrzymuje roszczenia do wszystkich prowincji §Yosmańskich§! w regionie §YBałkanów§!"
 opinion_nominal_albanian_fealty: "Formalna podległość"
 opinion_pap_albania: "Heroiczni obrońcy"
 skanderbeg_rebellion: "Bunt Skanderbega"
 desc_skanderbeg_rebellion: "Przywództwo Skanderbega inspiruje jego ludzi do wielkich czynów."
 albanian_diplomacy: "Wieści o oporze"
 desc_albanian_diplomacy: "Wieści o naszym przetrwaniu wbrew wszelkim przeciwnościom rozchodzą się po całym znanym świecie. Pokazaliśmy wrogom, że potrafimy się bronić, i możemy teraz znaleźć poparcie dla naszej sprawy w innych państwach."
 alb_inspire_resistance: "Inspirujący opór"
 desc_alb_inspire_resistance: "Albański opór przeciwko tureckiej inwazji zainspirował powstania przeciwko panowaniu osmańskiemu w całych Bałkanach."
 legacy_of_skanderbeg: "Dziedzictwo Skanderbega"
 desc_legacy_of_skanderbeg: "Studiowanie kampanii Skanderbega jest obowiązkowe dla każdego albańskiego księcia. Musimy dążyć do naśladowania jego geniuszu wojskowego w nadchodzących bitwach."
 opinion_legacy_of_varna: "Dziedzictwo Warny"
 cro_tur_army: "Względna siła armii wynosi co najmniej §Y50%§! siły armii §YOsmanów§!"
 alb_inspired_resistance: "Wsparto opór"
 bul_independence_title: "Bułgarska niepodległość"
 bul_independence_desc: "Bułgaria ponownie znalazła się wśród narodów świata. Musimy odzyskać nasze ziemie narodowe i zabezpieczyć niepodległość."
 bul_restore_empire_title: "Imperium Bułgarskie"
 bul_restore_empire_desc: "Bułgaria kiedyś rządziła wielkim imperium, które rozciągało się na większą część Bałkanów. Przywróćmy te ziemie pod nasze panowanie!"
 bul_extend_empire_title: "Rozszerz imperium"
 bul_extend_empire_desc: "Granice imperium muszą zostać jeszcze bardziej przesunięte. Kontynuujmy naszą kampanię w Grecji i Karpatach."
 peasants_likedealers_title: "Odnowienie Likedeelerów"
 peasants_likedealers_desc: "Jeszcze niedawno dzielna grupa banitów zwanych Likedeelerami napadała na statki handlowe i rozdzielała ich niesprawiedliwie zdobyte zyski między ubogich. Musimy odnowić działalność Likedeelerów, aby bogactwo północy mogło być dzielone sprawiedliwie."
 peasants_hemmingstedt_title: "Bitwa pod Hemmingstedt"
 peasants_hemmingstedt_desc: "Król Danii pragnie podporządkować sobie niezwykle niezależny lud państwa [Root.GetName]. Choć z pewnością będziemy ustępować Duńczykom liczebnością i siłą, musimy zaufać Bogu i wykorzystać każdą przewagę taktyczną, by odeprzeć ich armie. Jeśli dzięki łasce Bożej zwyciężymy, powinniśmy ruszyć dalej i wyzwolić Holsztyn spod duńskiego panowania."
 peasants_denmark_title: "Pokonaj Danię"
 peasants_denmark_desc: "Nigdy nie będziemy naprawdę bezpieczni, dopóki tyran, król Danii, nie zostanie całkowicie pokonany. Musimy wyzwolić chłopów Jutlandii i wypędzić arystokrację z całej Danii."
 peasants_conquest_of_bread_title: "Podbój chleba"
 peasants_conquest_of_bread_desc: "W innych państwach szlachetni robotnicy pracujący na polach i w fabrykach spotkaliby się z bagnetami i kartaczami, gdyby zażądali chleba za swoją pracę. W państwie [Root.GetName] żaden mężczyzna, kobieta ani dziecko nie umrze z głodu. Zapewnijmy chleb wszystkim!"
 peasants_means_of_production_title: "Środki produkcji"
 peasants_means_of_production_desc: "Ci, którzy posiadają środki produkcji materialnej, kontrolują również środki produkcji umysłowej, przez co idee klasy rządzącej podporządkowują sobie umysły ubogich. Musimy dopilnować, by środki produkcji materialnej znajdowały się w rękach ludu, a nie wąskiej elity."
 peasants_bremen_title: "Pobożny sojusz"
 peasants_bremen_desc: "Bezpieczeństwo naszego ludu od dawna było gwarantowane politycznie przez księcia-arcybiskupa Bremy. Musimy nadal zabiegać o wsparcie kościelne, aby nie zostać wydanymi na łaskę oportunistycznych panów feudalnych."
 peasants_north_germany_title: "Opór wobec feudalizmu"
 peasants_north_germany_desc: "Książęta niemieccy przy każdej sposobności próbują podporządkować sobie nasz lud i zmusić go do poddaństwa. Musimy uderzyć pierwsi, wkroczyć do Dolnej Saksonii i położyć kres rządom arystokracji."
 peasants_protect_frisia_title: "Wzajemna pomoc"
 peasants_protect_frisia_desc: "Wielu fryzyjskich chłopów, podobnie jak my, organizuje się w autonomiczne wspólnoty. Fryzja zaczyna jednak popadać w feudalną zależność. Musimy zrobić wszystko, co w naszej mocy, by ich ochronić."
 protect_frisia_tt: " prowincji w §YFryzji§! należy do §Y[Root.GetName]§! lub sojusznika będącego republiką chłopską."
 peasants_the_peasants_war_title: "Wojna chłopska"
 peasants_the_peasants_war_desc: "W całych Niemczech chłopi powstają przeciwko swoim panom. Musimy wesprzeć ich pobożną walkę i pomóc naszym braciom oraz siostrom w zakładaniu własnych republik chłopskich."
 peasants_break_the_chains_title: "Zerwij łańcuchy"
 peasants_break_the_chains_desc: "Rewolucja! Nie możemy po prostu spokojnie żyć w naszych komunach, podczas gdy straszliwy nowy absolutyzm dławi Europę. Staniemy się jasnym symbolem wolności dla wszystkich ludów świata. Nie mamy nic do stracenia poza naszymi kajdanami!"
 peasants_terror_in_russia_title: "Terror w Rosji"
 peasants_terror_in_russia_desc: "Nigdzie nie ma straszliwszego bastionu tyrańskiej samowładzy niż w Rosji. Nadszedł czas, by zadać autokracji w Europie śmiertelny cios, maszerując na Moskwę i obalając cara."
 peasant_bremen_claims: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do prowincji w obszarach §YWesery§! i §YDolnej Saksonii§!, które nie należą do naszych sojuszników."
 dtt_peasants_war_tt_1: "Odnieść zwycięstwo chłopów w Wielkiej Wojnie Chłopskiej"
 dtt_peasants_war_tt_2: " prowincji w Niemczech należy do państw o ustroju republiki chłopskiej"
 knights_templar_tt: "Kompania najemników — templariusze — staje się dostępna do wynajęcia."
 likedeelers_modifier: "Likedeelers"
 desc_likedeelers_modifier: "Likedeelerzy patrolują wybrzeże, rabując bogate statki kupieckie i rozdzielając łupy między zwykłych ludzi."
 hemmingstedt_victory: "Zwycięstwo pod Hemmingstedt"
 desc_hemmingstedt_victory: "Odnieśliśmy wielkie zwycięstwo nad Duńczykami. Lud jest przekonany, że to sam Pan zesłał nam ten triumf."
 integrating_the_peasantry: "Integracja chłopstwa"
 desc_integrating_the_peasantry: "Chłopi duńscy są wyzwalani spod opresyjnych instytucji feudalizmu."
 conquest_of_bread_modifier: "Podbój chleba"
 desc_conquest_of_bread_modifier: "Wszystko dla wszystkich! Jeśli mężczyźni i kobiety wykonują sprawiedliwą część pracy, mają prawo do sprawiedliwej części owoców wspólnego wysiłku — a udział ten powinien wystarczyć im do godnego życia."
 means_of_production: "Środki produkcji"
 desc_means_of_production: "Klasa, która dysponuje środkami produkcji materialnej, sprawuje zarazem kontrolę nad środkami produkcji umysłowej."
 pious_peasants: "Pobożność chłopska"
 desc_pious_peasants: "Wielu naszych ludzi uważa pobożność religijną za najwyższą z cnót, dlatego doceniają nasze bliskie stosunki z władzami kościelnymi w Bremie."
 peasants_war_victory: "Zwycięstwo chłopstwa"
 desc_peasants_war_victory: "Nasze zwycięstwo w Wielkiej Wojnie Chłopskiej z pewnością zainspiruje chłopów na całym świecie do powstania przeciwko swoim panom."
 peasant_revolutionary_zeal: "Rewolucyjny zapał ludu"
 desc_peasant_revolutionary_zeal: "Rewolucja! Wołanie mas o wolność nie może być dłużej ignorowane."
 cro_reconquer_dalmatia_title: "Podbij Dalmację"
 cro_reconquer_dalmatia_desc: "Oportunistyczni kupcy weneccy wykorzystali naszą opieszałość, by przejąć kontrolę nad wybrzeżem Adriatyku. Musimy odzyskać Dalmację dla państwa [Root.GetName]."
 cro_dominate_dubrovnik_title: "Zdominuj Dubrownik"
 cro_dominate_dubrovnik_desc: "Republika Raguzy rozwijała się jako niezależne państwo dzięki zręcznej dyplomacji i korzystnym umowom handlowym. Nadszedł jednak czas, by Ragusa ponownie dołączyła do większego państwa chorwackiego."
 cro_expel_italians_title: "Wypędź Włochów"
 cro_expel_italians_desc: "Morza Adriatyckie i Egejskie są pełne włoskich kupców, którzy czerpią zyski z niestabilnej sytuacji na Bałkanach. Musimy wypędzić tych spekulantów z regionu i rozszerzyć własne państwo."
 cro_withstand_ottomans_title: "Przeciwstaw się Turkom"
 cro_withstand_ottomans_desc: "Turcy osmańscy stanowią największe zagrożenie dla naszej niepodległości. Musimy zbudować armię zdolną stawić im czoło i stworzyć potężne państwo, które będzie przedmurzem chroniącym przed tureckim zagrożeniem."
 cro_independence_title: "Chorwacka niepodległość"
 cro_independence_desc: "Unia Węgier i Chorwacji przynosiła znacznie większe korzyści Węgrom niż samej Chorwacji. Nadszedł czas, by przywrócić naszą niepodległość."
 cro_reclaim_bosnia_title: "Odzyskaj Bośnię"
 cro_reclaim_bosnia_desc: "Bośnia była niegdyś częścią Królestwa Chorwacji. Pod naszą nieobecność stała się siedliskiem herezji i niepokojów. Musimy ponownie narzucić chorwacką hegemonię i przywrócić prawdziwej wierze należną jej dominującą pozycję."
 cro_croatian_fleet_title: "Flota [Root.GetAdjective]"
 cro_croatian_fleet_desc: "Chorwacka potęga morska osłabła od czasów naszej niepodległości, choć mamy długą tradycję prowadzenia działań na morzu. Powinniśmy zbudować flotę i przywrócić te tradycje."
 cro_conquer_carniola_title: "Podbij Krainę"
 cro_conquer_carniola_desc: "Krainą rządzi obecnie potężna dynastia Habsburgów. Musimy ostrożnie postępować z naszym cesarskim sąsiadem i uderzyć dopiero w odpowiednim momencie."
 cro_gosti_title: "Goście"
 cro_gosti_desc: "Powinniśmy uczynić państwo [Root.GetName] gościnnym miejscem dla przybyszów, ponieważ napływ pracowników i zasobów ludzkich może przynieść państwu wyłącznie korzyści. Ci Gosti, podlegając bezpośrednio Koronie, będą nam dobrze służyć."
 cro_zagreb_title: "Odnów Zagrzeb"
 cro_zagreb_desc: "Zagrzeb podupadł w ostatnich latach i pilnie potrzebuje odnowy. Musimy przeznaczyć zasoby państwa na odbudowę naszej historycznej stolicy."
 balkan_liberator: "Bałkańscy wyzwoliciele"
 desc_balkan_liberator: "Wyrzuciliśmy oportunistycznych włoskich kupców z Bałkanów."
 croatian_fleet: "Chorwacka marynarka"
 desc_croatian_fleet: "Chorwackie galery sieją postrach na morzach, a nasze statki handlowe przynoszą bogactwo z zagranicznych portów."
 gosti_guests: "Goście"
 desc_gosti_guests: "Zaprosiliśmy wielu gości do życia na naszych ziemiach, pod bezpośrednim nadzorem państwa."
 french_minors_independence_title: "Książęca niepodległość"
 french_minors_independence_desc: "[Root.GetName] nigdy nie rozkwitnie jako zwykłe księstwo podległe obcemu władcy. Musimy wyciągnąć wnioski z doświadczeń Normandii i Burgundii i zrzucić królewskie jarzmo."
 french_minors_claim_state_title: "Rozszerz księstwo"
 french_minors_claim_state_desc: "Teraz, gdy zabezpieczyliśmy niepodległość, musimy znaleźć sposób na rozszerzenie domeny [Root.GetAdjective]. Na szczęście od stuleci przysługują nam dynastyczne roszczenia do okolicznych ziem, które powinniśmy wykorzystać w pełni."
 french_minors_paris_title: "Zdobądź Paryż"
 french_minors_paris_desc: "Jeśli chcemy zostać nowymi królami Francji, musimy zdobyć Paryż, historyczną siedzibę francuskiej władzy."
 french_minors_become_france_title: "Uzurpuj tron"
 french_minors_become_france_desc: "Nadszedł czas, by [Root.Monarch.GetName] zdobył tron Francji dla [Root.Monarch.GetHerHim] osobiście. Dawny rząd musi zostać całkowicie zniszczony, aby zrobić miejsce nowemu porządkowi."
 own_all_cores_fra_minors: "Posiadać wszystkie prowincje z §Yrdzeniem państwa [Root.GetAdjective]§!."
 EST_VAL_GERMAN_JUNKERS: "Lojalni junkrzy: "
 guardians_of_the_fountain: "Strażnicy Fontanny Młodości"
 desc_guardians_of_the_fountain: "Pan powierzył nam zadanie strzeżenia Fontanny Młodości przed niegodnymi duszami. W tym celu pijemy z jej wód, by zachować życie i przedłużyć lata naszej służby."
 swi_empire_tt: "Mieć za sobą incydent cesarski „Szwajcaria i Cesarstwo”"
 empowered_junkers: "Wzmocnieni junkrzy"
 desc_empowered_junkers: "Junkrzy mają w naszym państwie ogromną władzę, lecz są również zobowiązani do niemal nieustannej służby wojskowej."
 itm_italian_renaissance_title: "Włoski renesans"
 itm_italian_renaissance_desc: "Świat się zmienia, a my znajdujemy się w samym centrum tych przemian. Ponownie udostępniono nam pisma starożytnych Greków, a studia nad tymi czcigodnymi dziełami stają się prężnie rozwijającą się dziedziną nauki. Nie możemy pozwolić, by nasz kraj stał się intelektualnym zaściankiem, gdy tak wspaniałe osiągnięcia powstają tuż obok nas!"
 itm_urbanization_title: "Promuj urbanizację"
 itm_urbanization_desc: "Miasta stają się nowymi motorami wzrostu gospodarczego. Aby zapewnić sobie dobrobyt, musimy zadbać, by nasze miasta, a przede wszystkim stolica, tętniły handlem i przemysłem. Jeśli na naszych nowych rynkach i w manufakturach pojawi się zbyt wielu robotników, zawsze możemy uzupełnić nimi szeregi armii."
 itm_merchant_princes_title: "Kupieccy książęta"
 itm_merchant_princes_desc: "Mimo rosnącej potęgi gospodarczej nasi kupcy wciąż mają trudności ze znalezieniem sobie miejsca w lokalnej sieci handlowej. Wspieranie interesów naszych handlarzy znacznie wzmocni handel i zaskarbi nam ich przychylność."
 itm_princely_rule_title: "Rządy księcia"
 itm_princely_rule_desc: "Prowadząc dyplomatyczne rozmowy z sąsiadami i utrzymując z nimi przyjazne stosunki, pokażemy poddanym, że inne państwa traktują nasz rząd poważnie. Wzrośnie wówczas również ich szacunek dla naszych rządów i praw."
 itm_princely_rule_marriage: "§Y2§! sojuszników musi łączyć z państwem §Y[Root.GetName]§! małżeństwo królewskie"
 itm_princely_rule_relations: "§Y2§! sojuszników musi mieć opinię o państwie §Y[Root.GetName]§! wynoszącą co najmniej §Y150§!"
 itm_educated_court_title: "Wykształcony dwór"
 itm_educated_court_desc: "Roztropny książę powinien gardzić pochlebcami i słuchać mądrych rad. Do tego potrzebni są jednak mądrzy doradcy, a... wciąż brakuje nam kilku takich osób."
 itm_spheres_of_influence_title: "Strefy wpływów"
 itm_spheres_of_influence_desc: "Książęta nie mogą rządzić wyłącznie siłą. Czasami potrzebne jest subtelniejsze podejście, dzięki któremu słabsi będą postrzegać nas jako obrońców, a nie zdobywców. Oczywiście nie zrozumieją, że nawet bez dobywania miecza przyciągamy ich coraz bliżej siebie i ich własnego podporządkowania."
 itm_two_guaranteed_countries: "Co najmniej §Y2§! państwa musi mieć zagwarantowaną niepodległość przez §Y[Root.GetName]§!."
 itm_prelate_power_title: "Władza prałatów"
 itm_prelate_power_desc: "Nie ma nic złego w wykorzystywaniu wiary ludzi do świeckich celów. Każdy rozumny książę powinien dążyć do jak najpełniejszego wykorzystania potęgi Kościoła."
 itm_assuming_control_title: "Przejęcie kontroli"
 itm_assuming_control_desc: "Dysponując wszystkimi narzędziami państwa, możemy teraz sięgnąć po większe cele. Warto rozważyć politykę cesarską, lecz przejęcie kontroli nad sprawami Rzymu byłoby równie godną nagrodą."
 fla_lowlands_one_title: "Podbij ziemie flamandzkie"
 fla_lowlands_one_desc: "Nasi bracia cierpią z powodu obcych ciemiężców. Jesteśmy zobowiązani do ich wyzwolenia."
 fla_lowlands_two_title: "Kontroluj Walonię"
 fla_lowlands_two_desc: "Najbardziej wysunięte na południe ziemie Niderlandów zamieszkują Walonowie. Ich wełna trafia już do naszych warsztatów tkackich, a nasze tkaniny sprzedawane są na ich rynkach. Musimy chronić wspólne więzi, jeszcze bardziej zbliżając do siebie nasze ziemie."
 fla_lowlands_three_title: "Zjednoczenie Niderlandów"
 fla_lowlands_three_desc: "Mieszkańcy północnych Niderlandów wciąż cierpią, nie korzystając z naszych łagodnych rządów. Musimy ich wyzwolić, anektując ich ziemie."
 fla_flemish_trade_title: "Flamandzki handel"
 fla_flemish_trade_desc: "Nasze miasta wytwarzają jedne z najlepszych i najliczniejszych tkanin w Europie, przekształcając surową wełnę wytwarzaną przez hodowców w eleganckie wyroby. Nie tylko my czerpiemy jednak zyski z tej pracy — rynki pełne są spekulantów i pośredników, którzy manipulują handlem i niszczą uczciwych rzemieślników. Jeśli zdobędziemy większy udział w lokalnych rynkach, nasi kupcy z pewnością rozkwitną."
 fla_further_urbanization_title: "Rozbuduj miasta"
 fla_further_urbanization_desc: "Flamandzkie miasta są już zamożne i ludne, lecz miasta naszych sąsiadów rozwijają się w szybkim tempie. Musimy wspierać dalszy rozwój własnych ośrodków, aby [Root.GetName] nie stało się prowincjonalnym zaściankiem."
 fla_commercial_infrastructure_title: "Izby handlowe"
 fla_commercial_infrastructure_desc: "Nasze magazyny są wypełnione po brzegi, a kupcy zarabiają pieniądze szybciej, niż są w stanie je wydawać. Aby nadążyć za rozwojem gospodarki, musimy rozbudować infrastrukturę handlową państwa."
 fla_commercial_infrastructure_tt: "Wszystkie posiadane prowincje w regionie §YNiderlandów§! mają §Ybudynek podatkowy§!, §Ybudynek produkcyjny§! i §Ybudynek handlowy§!"
 fla_flemish_cloth_title: "Fabryki Flandrii"
 fla_flemish_cloth_desc: "Nasi rzemieślnicy nie nadążają z zaspokajaniem popytu na nasze towary. Jeśli nie zwiększymy produkcji tkanin i innych wyrobów przemysłowych, nabywcy mogą zwrócić się do innych dostawców, a nasza gospodarka upadnie. Musimy rozwinąć produkcję przemysłową!"
 fla_european_networks_title: "Agenci w Europie"
 fla_european_networks_desc: "Nie możemy chronić naszych interesów wyłącznie z poziomu [Root.GetName]. Potrzebujemy oczu i uszu w każdym zakątku świata, które będą informować nas o przepływie handlu za granicą i sytuacji naszych kupców. Niektórzy w [Root.Capital.GetCapitalName] mogą uważać nas za szaleńców z powodu tej troski o handel, lecz tylko dzięki skrupulatnym rejestrom i stałemu napływowi informacji zachowamy przewagę konkurencyjną."
 fla_european_agents_tt: " Sieci szpiegowskie państwa [Root.GetAdjective] w państwach europejskich mają rozmiar co najmniej §Y25§!"
 emp_ned_leiden_university_fla_title: "Uniwersytet w Lejdzie"
 emp_ned_leiden_university_fla_desc: "Uczciwy dyskurs i wolność intelektualna to fundamenty, na których opierają się nasze uczelnie. Wsparcie państwa i promocja naszych szacownych i otwartych instytucji z pewnością przyciągnie utalentowane umysły z całej Europy."
 itm_italian_renaissance_modifier: "Włoski renesans"
 desc_itm_italian_renaissance_modifier: "Sztuka i nauki humanistyczne rozkwitają, a wraz z nimi nasz prestiż!"
 itm_labor_surplus: "Nadwyżka siły roboczej"
 desc_itm_labor_surplus: "Bezczynne ręce potrzebują tylko narzędzi."
 itm_influential_government: "Wpływowy rząd"
 desc_itm_influential_government: "Nasi dyplomaci znakomicie potrafią olśniewać innych naszym majestatem."
 itm_italian_powerhouse: "Włoska potęga"
 desc_itm_italian_powerhouse: "Nasze osiągnięcia uczyniły z nas jedno z najbardziej wpływowych i prestiżowych państw całej Italii. Wysłannicy z najdalszych zakątków świata przybywają na nasz dwór, a wielu waha się przed otwartym rzuceniem nam wyzwania."
 itm_merchant_princes_prosper: "Dobrobyt kupców"
 desc_itm_merchant_princes_prosper: "Nasi kupcy radzą sobie znakomicie i doskonale wiedzą, komu zawdzięczają swój sukces."
 itm_loyalists_control_the_church: "Lojaliści kontrolują Kościół"
 desc_itm_loyalists_control_the_church: "Ludzie, których starannie wspieraliśmy i promowaliśmy, przejęli kontrolę nad instytucjami naszej wiary. Dzięki nim duchowieństwo będzie znacznie mniej kłopotliwe."
 ned_discovered_new_world: "Państwo §Y[Root.GetName]§! odkrył dowolną prowincję w Nowym Świecie."
 ned_je_maintiendrai_mod: "Je Maintiendrai"
 desc_ned_je_maintiendrai_mod: "Osiągnięcia naszego państwa nie mają sobie równych, a nasza chwała nie zna granic. Naszą wielkość uznają zarówno nasi poddani, jak i mocarstwa całego świata."
 emp_pap_patrimony_of_st_peter_tt: "§Y6§! prowincji w obszarach §YMarchii–Abruzji§! lub §YEmilii-Romanii§! należy do ciebie lub twoich poddanych niebędących trybutariuszami"
 emp_pap_mission_to_china_noncatholic_tt: "Każda prowincja w §YChinach§!, która należy do państwa katolickiego, lecz sama nie wyznaje katolicyzmu, otrzyma modyfikator §YMisja jezuicka w Chinach§! na §Y20 lat§!, zapewniający następujące efekty:\nLokalny koszt utrzymania misjonarzy: §G-25.0%§!\nLokalna siła misjonarzy: §G+3.0%§!\nLokalne niepokoje: §G-3§!\n"
 emp_pap_mission_to_china_catholic_tt: "Każda prowincja w §YChinach§!, która należy do państwa katolickiego i sama wyznaje katolicyzm, otrzyma modyfikator §YChińska twierdza jezuicka§! na §Y20 lat§!, zapewniający następujące efekty:\nLokalna siła misjonarzy: §R-5.0%§!\nLokalny koszt rozwoju: §G-10.0%§!\n"
 emp_pap_back_the_catholic_powers_league_tt: "Każde państwo należące do §YLigi Katolickiej§! otrzymuje modyfikator §YPomoc wojskowa papieża§! na §Y10§! lat, zapewniający następujące efekty:\nUtrzymanie najemników: §G-25.0%§!\nKoszt najemników: §G-10.0%§!"
 fla_belgium_nostrum: "Belgica Nostrum"
 desc_fla_belgium_nostrum: "Nasze ziemie ojczyste zamieszkują liczne ludy, lecz wciąż możemy odnaleźć jedność we wspólnej geografii i wspólnym pochodzeniu narodowym — w Belgice i w dawnych, dzielnych Belgach z czasów Cezara."
 fla_prosperous_burghers: "Zamożne mieszczaństwo"
 desc_fla_prosperous_burghers: "Nasi kupcy radzą sobie znakomicie i doskonale wiedzą, komu zawdzięczają swój sukces."
 fla_european_agents_mod: "Agenci w Europie"
 desc_fla_european_agents_mod: "Nasi ludzie zajmują strategiczne pozycje na całym kontynencie, dyskretnie dbając o ochronę naszych interesów handlowych i dalszy rozwój wymiany. Być może pewnego dnia wykorzystamy zgromadzoną wiedzę o Europie, by stworzyć coś bardziej pokojowego, lecz ten dzień jeszcze nie nadszedł."
 emp_ita_develop_the_south_tt2: "Każda posiadana prowincja w obszarze §YNeapolu§!, §Ywschodniej Sycylii§!, §Yzachodniej Sycylii§!, §YKalabrii§! i §YApulii§!:"
 swa_expand_a_bit_title: "Zdominuj Szwabię"
 swa_expand_a_bit_desc: "Szwabia jest domem licznych książąt, biskupów i republik, z których każda włada niewielkim terytorium. Musimy zjednoczyć wystarczającą część okolicznych ziem, by stać się dominującą siłą w tej części Niemiec."
 swa_swabian_league_mission_title: "Związek Szwabski"
 swa_swabian_league_mission_desc: "Książęta Szwabii nie są wystarczająco potężni, aby wystąpić samotnie przeciwko dużym państwom terytorialnym. Tylko dzięki połączeniu sił możemy być silni."
 swa_swabian_league_mission_trigger_tooltip: " §YSzwabskie§! prowincje w regionie południowych Niemiec:\n      Musi być spełniony jeden z poniższych warunków:\n         Są własnością §Y[Root.GetName]§! lub jego poddanych niebędących trybutariuszami.\n         Są własnością §Yszwabskiego§! sojusznika państwa §Y[Root.GetName]§!."
 swa_swabian_liberty_title: "Szwabska wolność"
 swa_swabian_liberty_desc: "Austriacy z południa i Bawarczycy ze wschodu wdarli się na szwabskie ziemie, naruszając naszą wolność. Jeśli chcemy zdobyć należne nam miejsce wśród czołowych państw Niemiec, będziemy musieli z nimi walczyć, by wyzwolić naszych rodaków."
 swa_swabian_liberty_effect_tooltip: "§YSzwabscy§! sojusznicy państwa §Y[Root.GetName]§! otrzymają możliwość przyłączenia się do naszego państwa."
 swa_stem_duchy_title: "Księstwo plemienne"
 swa_stem_duchy_desc: "Dawne Księstwo Szwabii obejmowało ziemie wykraczające poza obszary zamieszkane obecnie przez Szwabów, w tym rozległe terytoria w Szwajcarii i Vorarlbergu. Pokazując naszą siłę, możemy ponownie włączyć te ziemie do naszego państwa."
 swa_austria_shall_fall_title: "Austria upadnie"
 swa_austria_shall_fall_desc: "Silna Szwabia nie może współistnieć z silną Austrią. Dawne Księstwo Szwabii upadło wraz z ostatnimi cesarzami z dynastii Hohenstaufów. Teraz, gdy je odbudowaliśmy, powinniśmy zwrócić się przeciwko Austriakom i odzyskać należną nam pozycję cesarza Niemców."
 swa_foothold_in_italy_title: "Przyczółek we Włoszech"
 swa_foothold_in_italy_desc: "U szczytu potęgi Hohenstaufowie ze Szwabii sprawowali władzę nad znaczną częścią Italii i Niemiec. Powinniśmy pójść w ich ślady i zdobyć przyczółek do dalszych kampanii we Włoszech."
 swa_lombard_league_title: "Zniszcz Lombardczyków"
 swa_lombard_league_desc: "Wcześniejsze próby podboju północnej Italii przez Szwabów zostały udaremnione przez Ligę Lombardzką — sojusz miast sprzeciwiających się najeźdźcom. Musimy zdławić te zbuntowane miasta i urzeczywistnić marzenia dawnych cesarzy szwabskich."
 swa_kingdom_of_sicily_title: "Królestwo Sycylii"
 swa_kingdom_of_sicily_desc: "Hohenstaufowie byli nie tylko cesarzami Świętego Cesarstwa Rzymskiego i książętami Szwabii — zdobyli również Królestwo Sycylii. Choć nasze roszczenia są odległe, wyspa byłaby cennym nabytkiem dla naszego imperium."
 swa_supremacy_title: "Rex Italiae et Germaniae"
 swa_supremacy_desc: "Panowanie nad całą Germanią i Italią oznaczałoby prześcignięcie dokonań nawet naszych największych przodków i stworzenie potężnego imperium zdolnego zdominować Europę — nowego, prawdziwie rzymskiego cesarstwa."
 swa_supremacy_trigger_tooltip: "Wszystkie państwa posiadające §Y5§! prowincji w regionach północnych Niemiec, południowych Niemiec lub Italii:\n   Musi być spełniony jeden z poniższych warunków:\n      Opinia o §Y[Root.GetName]§! wynosi co najmniej §Y0§!.\n      Zostały pokonane przez §Y[Root.GetName]§! w ciągu ostatnich §Y50§! lat."
 swa_supremacy_trigger_tooltip2: "Święte Cesarstwo Rzymskie przestało istnieć."
 swa_war_on_infidel_title: "Wyruszenie na krucjatę"
 swa_war_on_infidel_desc: "Nawałnica Saracenów doprowadziła niewiernych aż do wybrzeży Europy. Nadszedł czas, by przywrócić dawny zapał krucjat i wyruszyć do walki, która odwróci losy wojny."
 swa_war_on_infidel_trigger_tooltip: "Żadne państwo §Ymuzułmańskie§! nie posiada §Y300§! łącznego rozwoju."
 swa_war_on_infidel_trigger_tooltip2: "§Y[Root.GetName]§! wypowiedziało wojnę państwu §Ymuzułmańskiemu§! posiadającemu co najmniej §Y300§! łącznego rozwoju."
 swa_war_on_infidel_effect_tooltip: "§YSzwabia§! otrzymuje tymczasowe roszczenia do prowincji w regionie §YBałkanów§! należących do państw §Yniechrześcijańskich§!."
 swa_balkans_freed_title: "Wyzwól Bałkany"
 swa_balkans_freed_desc: "Aby odeprzeć niewiernych i odesłać ich tam, skąd przybyli, musimy oczyścić Bałkany z ich wpływów i stworzyć tam przedmurze chrześcijaństwa, na którego wsparcie będziemy mogli liczyć podczas kolejnych kampanii."
 swa_balkans_freed_trigger_tooltip: " prowincji w regionie Bałkanów należy do §Y[Root.GetName]§!, jego sojuszników lub poddanych."
 swa_crusader_title: "Królestwo Jerozolimy"
 swa_crusader_desc: "Cesarz Fryderyk Barbarossa nigdy nie dotarł do Ziemi Świętej, a Jerozolima pozostała w rękach niewiernych. Lecz to już przeszłość! Nasze nowe Cesarstwo odzyska ziemie Wschodu i raz na zawsze przywróci Jerozolimę chrześcijaństwu!"
 opinion_swabian_league: "Związek Szwabski"
 swa_lombard_league_mod: "Północnowłoska hegemonia"
 desc_swa_lombard_league_mod: "Przejęliśmy kontrolę nad północną Italią. Jej bogactwo i wiedza należą teraz do nas."
 swa_restored_stem_duchy: "Księstwo plemienne przywrócone"
 desc_swa_restored_stem_duchy: "Przywróciliśmy Księstwo Szwabii do jego dawnego, największego zasięgu. Nikt nie wątpi już, że zasługujemy na miejsce wśród czołowych potęg Niemiec."
 swa_supremacy_mod: "Rex Italiae et Germaniae"
 desc_swa_supremacy_mod: "Prześcignęliśmy dokonania nawet naszych największych przodków i stworzyliśmy potężne imperium zdolne zdominować Europę — nowe, prawdziwie rzymskie cesarstwo."
 swa_new_diplomatic_relevance_mod: "Znaczenie dyplomatyczne"
 desc_swa_new_diplomatic_relevance_mod: "Obcy często ignorowali Szwabów, uznając, że są zbyt podzieleni, by mieć jakiekolwiek znaczenie poza własnymi granicami. Nasza niedawna ekspansja to zmieniła i teraz zarówno Szwabowie, jak i cudzoziemcy zabiegają o naszą przyjaźń."
 swa_crusader_lord: "Władca krzyżowców"
 desc_swa_crusader_lord: "Królestwo Jerozolimy należy do nas! Nasz sztandar budzi strach w sercach niewiernych, którzy pierzchają przed naszymi armiami."
 emp_mission_events.11.name: "Wierność państwu [From.GetUsableName]?"
 emp_mission_events.11.desc: "Państwo [From.GetUsableNameCap] stało się główną potęgą Szwabii i chroni naszą niepodległość przed większymi obcymi państwami. Sukces Ligi Szwabskiej sprawił, że wielu mieszkańców naszego kraju opowiada się za trwałym zjednoczeniem obu państw, aby mogło ponownie powstać Księstwo Szwabii."
 emp_mission_events.11.a: "Połączmy nasze siły."
 emp_mission_events.11.b: "Nie oddamy naszej niepodległości."
 emp_mission_events.12.name: "Państwo [From.GetUsableNameCap] zachowuje niepodległość"
 emp_mission_events.12.desc: "Państwo [From.GetUsableNameCap] odrzuciło nasze rozsądne propozycje połączenia sił. Woli samodzielnie stawić czoło niebezpieczeństwom związanym z niepodległością."
 fkn_defeat_rivals_title: "Pokonaj rywali"
 fkn_defeat_rivals_desc: "Frankonia jest podzielona między liczne słabe, pomniejsze państwa. Tylko siła militarna może przywrócić jedność księstwu."
 fkn_liberty_title: "Frankońska wolność"
 fkn_liberty_desc: "Słabość Frankonii pozwoliła naszym północnym i zachodnim sąsiadom wkroczyć na nasze ziemie. Musimy zakończyć tę okupację i przywrócić wolność naszemu ludowi."
 fkn_greater_franconia_title: "Zjednocz Wielką Frankonię"
 fkn_greater_franconia_desc: "Dawne Księstwo Frankonii obejmowało ziemie znacznie rozleglejsze niż te, na których żyją dziś ludzie nazywający siebie Frankończykami. Musimy odzyskać utracone terytoria i zjednoczyć Wielką Frankonię!"
 fkn_subjugate_bavaria_title: "Ujarzmij Bawarię"
 fkn_subjugate_bavaria_desc: "Nasi południowi sąsiedzi spoglądają łakomym wzrokiem na nasze ziemie. Konflikt jest nieunikniony. Musimy ich sobie podporządkować, jeśli nie chcemy sami znaleźć się pod ich panowaniem."
 fkn_kingdom_of_the_franks_title: "Królestwo Franków"
 fkn_kingdom_of_the_franks_desc: "Czymże jest Francja, jeśli nie największym rozszerzeniem ziem ludu frankijskiego? Chwała czeka nas, jeśli pójdziemy w ślady wielkiego Karola Wielkiego i ponownie zjednoczymy Franków wschodnich i zachodnich."
 fkn_franconian_prosperity_title: "Frankoński dobrobyt"
 fkn_franconian_prosperity_desc: "Frankonia jest w większości krainą rolniczą, w której poza Norymbergą znajduje się niewiele dużych miast. Z tego powodu często popadała pod wpływy zamożniejszych sąsiadów. Musimy odwrócić ten trend i zapewnić naszemu państwu większy dobrobyt."
 fkn_patronage_of_the_arts_title: "Patronat sztuki"
 fkn_patronage_of_the_arts_desc: "Nasz lud jest obdarzony talentem artystycznym i duchem wynalazczości. Powinniśmy umocnić reputację oświeconych [Root.Monarch.GetTitle], zachęcając poddanych do wykorzystywania tych zdolności dla splendoru naszego dworu i chwały państwa."
 fkn_industrial_revolution_title: "Rozwój manufaktur"
 fkn_industrial_revolution_desc: "Podstawą siły naszego państwa jest przemysł wytwórczy. Musimy go rozbudować, jeśli chcemy stać się potęgą gospodarczą zdolną zdominować Niemcy."
 fkn_sanspareil_title: "Wspaniały Sans Pareil"
 fkn_sanspareil_desc: "Musimy wznieść wspaniały pałac, któremu nie będzie równych i który zazdrośni sąsiedzi będą próbowali naśladować, lecz nigdy mu nie dorównają."
 fkn_union_with_brandenburg_title: "Roszczenia do Brandenburgii"
 fkn_union_with_brandenburg_desc: "Rodzina Hohenzollernów z Ansbach i Bayreuth zgłosiła pretensje do Brandenburgii. Ich marchia brandenburska jest jedynie marną imitacją naszego frankońskiego państwa, mimo ledwie skrywanych ambicji ekspansjonistycznych. Musimy włączyć tych nowicjuszy z północy do naszych domen!"
 fkn_we_prosper: "Kraina dobrobytu"
 desc_fkn_we_prosper: "Niedawny rozwój naszego kraju zapoczątkował okres bezprecedensowego dobrobytu."
 fkn_we_produce_stuff: "Boom produkcyjny"
 desc_fkn_we_produce_stuff: "Frankońskie manufaktury wytwarzają towary, które wzbogacą mieszkańców i zasilą skarbiec państwa."
 fkn_arts_patronised: "Patronat sztuki"
 desc_fkn_arts_patronised: "Nasza gotowość do wspierania sztuk wyzwolonych przynosi owoce. Artyści z odległych krain tłumnie przybywają, by przyczyniać się do splendoru naszego dworu."
 fkn_franconia_ascendant: "Panowanie Frankonii"
 desc_fkn_franconia_ascendant: "Przywróciliśmy dawne Księstwo Frankonii i zdominowaliśmy środkowe Niemcy. Nikt nie może już lekceważyć potęgi, którą reprezentujemy!"
 fkn_kingdom_of_the_franks_mod: "Królestwo Franków"
 desc_fkn_kingdom_of_the_franks_mod: "Wzrost naszej potęgi pozwolił nam odnowić roszczenia przodków do Królestwa Franków Zachodnich. Dziedzictwo Karola Wielkiego czeka, jeśli tylko zdobędziemy się na ambicję, by po nie sięgnąć."
 fkn_expansionist_ambition: "Ambicje ekspansjonistyczne"
 desc_fkn_expansionist_ambition: "Przekształciliśmy państwo [Root.GetName] w najbardziej dominującą i prestiżową potęgę Niemiec. Teraz powinniśmy nieustannie dążyć ku chwale!"
 fkn_franconian_palace: "Pałac Sanspareil"
 desc_fkn_franconian_palace: "Wznieśliśmy pałac o niezrównanym pięknie i przepychu."
 emp_mlo_all_roads_lead_to_milan_trigger_tooltip: "Żadna prowincja w Europie Zachodniej nie ma większego rozwoju niż §Y[104.GetName]§!."
 han_unite_the_welfs_title: "Zjednocz Welfów"
 han_unite_the_welfs_desc: "Ziemie rodu Welfów są podzielone. Jeśli zdołamy zjednoczyć Brunszwik, Lüneburg i Hanower, umocnimy naszą pozycję jako jednej z najbardziej wpływowych dynastii Niemiec."
 han_defend_against_neighbors_title: "Obroń się przed Sasami"
 han_defend_against_neighbors_desc: "Sasi i Brandenburczycy ze wschodu spoglądają na nasze ziemie z ledwie skrywaną chciwością. Musimy zadbać, by nasza armia stanowiła wystarczający czynnik odstraszający, który powstrzyma sępy... a być może pozwoli nam również realizować własne ambicje."
 han_expand_into_saxony_title: "Ekspansja ku Saksonii"
 han_expand_into_saxony_desc: "Stulecia podzieliły Sasów górnych i dolnych. Gdyby Górna Saksonia została zjednoczona, mogłaby stać się silna — być może na tyle, by rzucić nam wyzwanie. Musimy zatem wykorzystać podziały i ponownie zjednoczyć dawne księstwo saskie pod naszym sztandarem."
 han_subdue_brandenburg_title: "Ujarzmij Brandenburgię"
 han_subdue_brandenburg_desc: "Hohenzollernowie z Brandenburgii mają wielkie ambicje zdominowania północnych Niemiec. Musimy sprawić, by te plany spełzły na niczym, podporządkowując sobie ich jako pierwszych."
 han_herrenhausen_gardens_mission_title: "Świetność Herrenhausen"
 han_herrenhausen_gardens_mission_desc: "Musimy odnowić naszą stolicę i pałace, aby stały się wspaniałym ucieleśnieniem splendoru naszego [Root.GovernmentName]."
 han_herrenhausen_pu_eng_effect_tooltip: "Jeśli państwo §Y[Root.GetName]§! ukończyło misję §YWładaj morzami§! i wyznaje tę samą religię co §Y[ENG.GetName]§!:\n   §Y[Root.GetName]§! otrzymuje casus belli §YPrzywrócenie unii§! przeciwko §Y[ENG.GetName]§!."
 han_herrenhausen_pu_gbr_effect_tooltip: "Jeśli państwo §Y[Root.GetName]§! ukończyło misję §YWładaj morzami§! i wyznaje tę samą religię co §Y[GBR.GetName]§!:\n   §Y[Root.GetName]§! otrzymuje casus belli §YPrzywrócenie unii§! przeciwko §Y[GBR.GetName]§!."
 han_herrenhausen_claims_eng_effect_tooltip: "Jeśli państwo §Y[Root.GetName]§! ukończyło misję §YWładaj morzami§!:\n   §Y[Root.GetName]§! otrzymuje stałe roszczenia do §YAnglii§!."
 han_herrenhausen_pu_gbr_anglican_effect_tooltip: "Jeśli §Y[GBR.GetName]§! wyznaje §Yanglikanizm§!, państwo §Y[Root.GetName]§! może wyznawać §Yanglikanizm§! lub §Yprotestantyzm§!."
 han_herrenhausen_pu_eng_anglican_effect_tooltip: "Jeśli §Y[ENG.GetName]§! wyznaje §Yanglikanizm§!, państwo §Y[Root.GetName]§! może wyznawać §Yanglikanizm§! lub §Yprotestantyzm§!."
 han_rule_the_waves_title: "Władaj morzami"
 han_rule_the_waves_desc: "Jeśli chcemy zdominować morza tak, jak niegdyś czyniła to Hanza, musimy zbudować potężną flotę zdolną pokonać każdego, kto rzuci nam wyzwanie. Żadne inne państwo nie będzie już rościć sobie prawa do panowania nad falami — staną się one wyłącznie naszą domeną."
 han_rule_the_waves_trigger_tooltip: "Żadne państwo:\n   Nie posiada portu nad §YMorzem Północnym§!.\n   Nie ma większej floty niż §Y[Root.GetName]§!."
 han_rule_the_waves_pu_eng_effect_tooltip: "Jeśli państwo §Y[Root.GetName]§! ukończyło misję §YSplendor Herrenhausen§! i wyznaje tę samą religię co §Y[ENG.GetName]§!:\n   §Y[Root.GetName]§! otrzymuje casus belli §YPrzywrócenie unii§! przeciwko §Y[ENG.GetName]§!."
 han_rule_the_waves_pu_gbr_effect_tooltip: "Jeśli państwo §Y[Root.GetName]§! ukończyło misję §YSplendor Herrenhausen§! i wyznaje tę samą religię co §Y[GBR.GetName]§!:\n   §Y[Root.GetName]§! otrzymuje casus belli §YPrzywrócenie unii§! przeciwko §Y[GBR.GetName]§!."
 han_rule_the_waves_claims_eng_effect_tooltip: "Jeśli państwo §Y[Root.GetName]§! ukończyło misję §YSplendor Herrenhausen§!:\n   §Y[Root.GetName]§! otrzymuje stałe roszczenia do §YAnglii§!."
 han_rule_the_waves_pu_gbr_anglican_effect_tooltip: "Jeśli §Y[GBR.GetName]§! wyznaje §Yanglikanizm§!, państwo §Y[Root.GetName]§! może wyznawać §Yanglikanizm§! lub §Yprotestantyzm§!."
 han_rule_the_waves_pu_eng_anglican_effect_tooltip: "Jeśli §Y[ENG.GetName]§! wyznaje §Yanglikanizm§!, państwo §Y[Root.GetName]§! może wyznawać §Yanglikanizm§! lub §Yprotestantyzm§!."
 han_naval_dominance_trade_mod: "Dominacja morska na Morzu Północnym"
 han_hansa_cities_title: "Porty handlowe Hanzy"
 han_hansa_cities_desc: "Miasta Hanzy wzbogaciły się dzięki handlowi przepływającemu przez Morze Północne i Bałtyk. Powinniśmy zagarnąć ich bogactwa, zmuszając je do przyjęcia naszego panowania."
 han_english_crown_title: "Korona Anglii"
 han_english_crown_desc: "Anglia jest potężną siłą w europejskiej polityce, lecz bezpieczeństwo opiera głównie na przewadze morskiej. Teraz, gdy nasza flota może ją prześcignąć, powinniśmy rozważyć, czy tak kłopotliwa wyspa powinna zachować niepodległość... czy też należy odnowić pradawną bliskość Niemców i Anglików."
 han_anglo_german_unity_title: "Jedność Anglii i Niemiec"
 han_anglo_german_unity_desc: "Przed wiekami Anglowie i Sasi osiedlili się w Brytanii, dając początek ludowi angielskiemu. Choć od tamtej pory nasze języki się rozeszły, pod pewnymi względami wciąż jesteśmy braćmi. Nadszedł czas, by ponownie stać się jednym narodem."
 han_dominant_in_northern_germany: "Panowanie nad płn. Niemcami"
 desc_han_dominant_in_northern_germany: "Pokonując Saksończyków i Brandenburgię, zyskaliśmy panowanie nad północnymi Niemcami."
 han_herrenhausen_gardens_mod: "Świetność Herrenhausen"
 desc_han_herrenhausen_gardens_mod: "Nasza stolica i jej ogrody są dowodem chwały naszego narodu i zazdrości obcych władców."
 han_hansa_cities_mod: "Siły morskie Hanzy"
 desc_han_hansa_cities_mod: "Porty handlowe Hanzy należą teraz do nas. Ich żeglarze będą nam służyć, pozwalając zbudować potężną flotę i stać się nową potęgą morską na Morzu Północnym i Bałtyku."
 han_kings_of_england: "Król Anglii"
 desc_han_kings_of_england: "Włączyliśmy Anglię do naszego państwa i jesteśmy teraz dziedzicami jej kunsztu dyplomatycznego."
 han_anglo_german_unity: "Jedność Anglii i Niemiec"
 desc_han_anglo_german_unity: "Przed wiekami Anglowie i Sasi osiedlili się w Brytanii, dając początek ludowi angielskiemu. Choć od tamtej pory nasze języki się rozeszły, pod pewnymi względami wciąż jesteśmy braćmi. Przywróciliśmy jedność naszych ludów."
 same_government_as_root: "Ustrój to §Y[Root.GovernmentName]§!"
 emp_bur_league_of_public_weal_effect_tooltip2: "Poniższe efekty dotyczą wyłącznie prowincji należących do Francji:"
 rivalled_or_rival_of: "Rywalizuje z §Y[Root.GetName]§! lub jest przez nie uznawane za rywala"
 cb_crusade_pheasants: "Święta wojna"
 cb_crusade_pheasants_desc: "Śmierć niewiernym!"
 emp_bur_influence_the_princes_trigger_tooltip2: " państw członkowskich Cesarstwa:\n      Opinia o §Y[Root.GetName]§! wynosi co najmniej §Y60§!."
 emp_bur_influence_the_princes_trigger_tooltip3: " państw:\n      Stolica znajduje się w regionie północnych lub południowych Niemiec.\n      Opinia o §Y[Root.GetName]§! wynosi co najmniej §Y60§!."
 emp_bur_lead_the_empire_fallback_trigger: "Żadne państwo:\n   Stolica znajduje się w regionie północnych lub południowych Niemiec.\n   Państwo lub jego poddani niebędący trybutariuszami posiadają co najmniej §Y10§! prowincji."
 emp_bur_dutch_revolt_has_happened: "Wybuchła §Yrewolta holenderska§!."
 gen_trade_spanish_alliance: "Hiszpański sojusz"
 gen_trade_spanish_conquest: "Hiszpańskie podboje"
 emp_mlo_swiss_mercs_trigger_tooltip: "§Y[Root.GetName]§! wygrało wojnę, korzystając z najemników ze §YSzwajcarii§! lub §YRomandii§!."
 emp_gen_safety_at_home_and_abroad_trigger: "Wszystkie sąsiednie państwa posiadające prowincje w regionie §YItalii§!:\n   Musi być spełniony jeden z poniższych warunków:\n      Są sojusznikami państwa §Y[Root.GetName]§!\n      Posiadają armię mniejszą niż armia państwa §Y[Root.GetName]§!"
 add_5_crown_land_share: "§Y[Root.GetName]§! zyskuje §G5§! własności królewszczyzny."
 VAL_HAB_BALANCED_ESTATES: "Zrównoważone stany: §G$VAL$§!"
 VAL_BUR_APPEASED_ESTATES: "Uspokojone stany: §G$VAL$§!"
 VAL_BAV_DEALT_WITH_ILLUMINATI: "Rozprawiono się z iluminatami: §G$VAL$§!"
 bav_bavarian_absolutism: "Monarchia oświecona"
 desc_bav_bavarian_absolutism: "Państwo przyjęło ideały despotyzmu oświeconego."
 bav_revolutionary_zeal: "Oświecony idealizm"
 desc_bav_revolutionary_zeal: "Państwo całkowicie przyjęło ideały oświeceniowe."
 emp_bav_illuminati_mission_effect_tooltip: "Ukończenie tej misji poprzez wsparcie szlachty lub duchowieństwa zwiększy równowagę lojalności o §G+10§! dla tych klas.\n\nUkończenie tej misji poprzez wsparcie mieszczaństwa zwiększy maksymalny poziom absolutyzmu o §G+5§!.\n\nUkończenie tej misji poprzez rewolucję zwiększy roczną wzrost legitymizacji o §G+0.5§! lub tradycji republikańskich o §G+0.25§!."
 incident_hungary_mission: "Węgry chcą dołączyć do Cesarstwa"
 new_flavour_hun.2.C: "Starannie rozważymy tę prośbę."
 gain_claims_on_palatinate_provinces: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do wszystkich pozostałych prowincji należących do §YPalatynatu§!."
 pal_protect_from_france_effect_tooltip1: "Jeśli ukończysz tę misję, zyskując przyjaźń Francji, otrzymasz następującą nagrodę:"
 pal_protect_from_france_effect_tooltip2: "\nW przeciwnym razie otrzymasz następującą nagrodę:"
 bri_build_alliances_title: "Buduj sojusze"
 bri_build_alliances_desc: "Ściśnięta między znacznie silniejszymi krajami, Bretania będzie potrzebowała potężnych sojuszników, jeśli ma przetrwać i prosperować."
 bri_expand_up_the_loire_title: "Ekspansja wzdłuż Loary"
 bri_expand_up_the_loire_desc: "Ziemie położone w górnym biegu Loary od Nantes są równie zamożne, co sporne. Ich potężne zamki i żyzne pola często stają się celem armii Francji, Anglii i innych państw. Być może nadszedł moment, by zgłosić własne roszczenia do tych ziem i rozszerzyć nasze wpływy we Francji, tak aby nie można nas było dłużej lekceważyć w walce o dominację w Paryżu."
 bri_seize_normandy_title: "Podbij Normandię"
 bri_seize_normandy_desc: "Wiele lat temu Cotentin i piękny kościół-twierdza na Mont Saint-Michel należały do ziem bretońskich. Książęta Normandii odebrali nam je jednak i od tamtej pory pozostają one w rękach ich oraz królów Anglii. Teraz, gdy angielska potęga na kontynencie słabnie, być może będziemy mogli odwrócić skutki dawnych strat i zdobyć Normandię."
 bri_shatter_france_title: "La Guerre Folle"
 bri_shatter_france_desc: "Aroganccy królowie Francji przy pierwszej sposobności zgłosiliby roszczenia do naszych ziem. Musimy złamać ich potęgę, zdobywając Paryż, aby już nigdy nie odważyli się chwycić za broń przeciwko nam."
 bri_brest_title: "Stocznie Brestu"
 bri_brest_desc: "Brest zajmuje strategiczne położenie na wybrzeżu Atlantyku. Musimy zbudować tam stocznię, która stanie się główną bazą floty bretońskiej i punktem wypadowym do ekspansji za morzami."
 bri_new_brittany_title: "Załóż Nową Bretanię"
 bri_new_brittany_desc: "Za Atlantykiem leży kraina bardzo podobna do naszej. Jej kolonizacja i włączenie do państwa bretońskiego byłyby czymś zupełnie naturalnym."
 bri_better_weather_title: "W poszukiwaniu lepszej pogody"
 bri_better_weather_desc: "Bretania słynie z ponurej pogody, która przynosi nieustanny wiatr i deszcz. Doceniają to nasi rolnicy, lecz niewielu innych. Powinniśmy dać mieszkańcom możliwość osiedlenia się w cieplejszym klimacie, zakładając kolonię na Karaibach... choć i tamtejsza pogoda czasami może pozostawiać wiele do życzenia."
 bri_atlantic_trade_title: "Zdominuj handel adriatycki"
 bri_atlantic_trade_desc: "Kolonie mogą przynieść nam bogactwo, jeśli zapewnimy, że ich dochody handlowe będą trafiać do naszych głównych ośrodków w Breście i Nantes. Musimy zadbać, by Bretania stała się potęgą — przynajmniej pod względem znaczenia w atlantyckich sieciach handlowych."
 bri_rulers_of_paris: "Władcy Paryża"
 desc_bri_rulers_of_paris: "Bretania rozszerzyła swoje wpływy i objęła nimi Paryż, wspaniałe miasto pełne cudów."
 bri_colonialism: "Wyścig o kolonie"
 desc_bri_colonialism: "Bretońscy chłopi, rybacy i kupcy nabrali ducha przygody, odkąd zdobyliśmy nowe ziemie za Atlantykiem. W Bretanii trwa gorączkowy wyścig o powiększenie naszych posiadłości w Ameryce i zdobycie niezmierzonych bogactw Nowego Świata."
 bri_breton_better_weather: "Bretońskie interesy handlowe"
 has_colony_in_colonial_canada: "§Y[Root.GetName]§! jest zwierzchnikiem kolonialnym państwa w regionie kolonialnym §YKana­dy§!."
 has_colony_in_colonial_caribbean: "§Y[Root.GetName]§! jest zwierzchnikiem kolonialnym państwa w regionie kolonialnym §YKaraibów§!."
 gen_hre_relations_with_emperor_title: "Relacje z cesarzem"
 gen_hre_relations_with_emperor_desc: "Jako jedno z mniejszych państw Świętego Cesarstwa Rzymskiego powinniśmy zabiegać o przyjaźń cesarza, aby zabezpieczyć nasze dalsze istnienie."
 gen_hre_financial_centre_title: "Centrum handlu"
 gen_hre_financial_centre_desc: "Musimy przekształcić [Root.Capital.GetCapitalName] w centrum wszelkiej działalności handlowej, aby najzdolniejsi i najbogatsi mieszczanie z całych Niemiec zechcieli osiedlić się w naszym mieście."
 gen_hre_republic_reform_government_title: "Zreformuj administrację"
 gen_hre_republic_reform_government_desc: "Musimy przyjąć nowe rozwiązania i zreformować administrację, przekształcając ją w nowoczesne [Root.GovernmentName], jeśli nasze państwo ma przetrwać przemiany ogarniające Europę."
 imperial_beneficience: "Cesarska dobroć"
 desc_imperial_beneficience: "Cesarz obdarzył nasze miasto wieloma korzyściami w zamian za nasze wierne poparcie dla jego rządów."
 republic_bourgeois_center: "Miasto burżuazji"
 desc_republic_bourgeois_center: "Nasze miasto jest centrum wszelkiej działalności handlowej i przyciąga najzdolniejszych oraz najbogatszych mieszczan z całych Niemiec."
 republic_reformed_government: "Zreformowana administracja"
 desc_republic_reformed_government: "Przyjęliśmy nowe rozwiązania i zreformowaliśmy administrację, przekształcając ją w sprawną machinę zarządzania państwem."
 new_flavour_bav.101.name: "Przekazanie godności elektorskiej Palatynatu państwu [Root.GetName]"
 new_flavour_bav.101.desc: "Państwo [From.GetUsableNameCap] zgodziło się na naszą prośbę o przekazanie nam godności elektorskiej Palatynatu."
 new_flavour_bav.101.option: "Świetne wieści."
 new_flavour_bav.102.name: "[From.GetName] odrzuca naszą prośbę"
 new_flavour_bav.102.desc: "Państwo [From.GetUsableNameCap] odrzuciło naszą prośbę o przekazanie nam godności elektorskiej Palatynatu i zamiast tego domaga się przywrócenia niepodległości Palatynatu."
 new_flavour_bav.102.option: "Być może potrzebujemy nowego cesarza."
 THIS_vassalised_by_FROM: "§Y[This.GetName]§! staje się wasalem państwa §Y[From.GetName]§!."
 new_flavour_bav.110.t: "Kolońska sekundogenitura"
 new_flavour_bav.110.d: "Nasza niepodległość dobiegła końca — państwo [From.GetUsableName] sprawuje teraz nad nami zwierzchnictwo. Na domiar upokorzenia opracowano plan, zgodnie z którym członek rodu [From.Monarch.Dynasty.GetName], niebędący następcą tronu [From.GovernmentName] państwa [From.GetUsableName], obejmie urząd [KOL.Monarch.GetTitle] państwa [KOL.GetAdjective]. Zapewni to ścisłą kontrolę [From.GetAdjective] nad naszym [Root.GovernmentName]."
 new_flavour_bav.110.A.tooltip: "Zostanie ustanowiona §Ysekundogenitura kolońska§!:\nPrzyszli [KOL.GetAdjective] [KOL.Monarch.GetTitle] będą wybierani spośród dynastii rządzącej państwem [From.GetAdjective], o ile:\n   §Y[From.GetName]§! pozostaje §Ymonarchią§! z dynastią panującą.\n   §YKolo­nia§! pozostaje poddanym państwa §Y[From.GetName]§!.\n   §YKolo­nia§! pozostaje §Yteokracją§!.\n"
 HAB_owns_nothing_in_tirol: "Żadna prowincja w obszarze §YTyrolu§! nie należy do państwa §Y[HAB.GetName]§!"
 no_swabians_with_more_dev_tooltip: "Żadne §Yszwabskie§! państwo nie ma większego łącznego rozwoju niż §Y[Root.GetName]§!."
 swabian_unification_unrest: "Dążenie do jedności Szwabii"
 swa_swabian_league_mission_effect_tooltip: "§Y[This.GetName]§! będzie bardziej skłonne do buntu przeciwko swoim ciemiężcom."
 emp_mission_events.13.name: "Państwo [From.GetUsableNameCap] przystępuje do państwa [Root.GetUsableName]"
 emp_mission_events.13.desc: "Państwo [From.GetUsableNameCap] zdecydowało się połączyć z nami siły. Razem będziemy potężniejsi!"
 swa_heathen_crusader_lord: "Władca Jerozolimy"
 desc_swa_heathen_crusader_lord: "Przejęliśmy kontrolę nad zaciekle spornym Królestwem Jerozolimy, kończąc trwającą od stuleci walkę o ten region."
 any_rival_allied_with_root_and_120_opinion: "   Dowolne państwo będące rywalem:\n         Jest sojusznikiem państwa §Y[Root.GetName]§!\n         Opinia o §Y[Root.GetName]§! wynosi co najmniej §Y120§!."
 emp_sav_conquer_provence_reward_tooltip: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do wszystkich europejskich prowincji kultury §Yoksytańskiej§!."
 emp_sav_conquer_occitania_effect_tooltip2: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do wszystkich europejskich prowincji kultury §Ygaskońskiej§!."
 full_annexation_tooltip: "§RWybór tej opcji doprowadzi do całkowitej aneksji państwa [Root.GetName].§!"
 fla_flemish_cloth_trigger_tooltip: "Wszystkie posiadane prowincje w regionie §YNiderlandów§! mają §Ymanufakturę§!"
 emp_pap_rebuild_the_papal_treasury_effect_tooltip: "Dochód z dziesięciny papieskiej wzrasta o §G20%§! na §Y20§! lat."
 pap_higher_curia_contribution_hidden_modifier: "Podstawa:"
 desc_pap_higher_curia_contribution_hidden_modifier: ""
 hsa_hanseatic_army_mission_title: "Chroń miasto"
 hsa_hanseatic_army_mission_desc: "Nasze miasto jest narażone na niebezpieczeństwo — nasza armia jest niewielka, a ogromne bogactwo kusi liczne mocarstwa ekspansjonistyczne. Musimy rozbudować siły zbrojne, aby zabezpieczyć się przed atakiem."
 hsa_hanseatic_mecklenburg_mission_title: "Wismar i Rostock"
 hsa_hanseatic_mecklenburg_mission_desc: "Nasze silne więzi z miastami Wismar i Rostock nie powstrzymały ich przed podporządkowaniem się woli książąt Meklemburgii, nawet wbrew naszym interesom. Zbyt długo tolerowaliśmy ich nieustępliwość. Nadszedł czas, by objąć je ściślejszą kontrolą."
 hsa_baltic_trade_mission_title: "Zabezpiecz handel bałtycki"
 hsa_baltic_trade_mission_desc: "Bogactwo państwa [Root.GetName] i portów hanzeatyckich opiera się na kierowaniu handlu bałtyckiego przez nasze przystanie. W ostatnich latach nieco utraciliśmy kontrolę nad tymi obszarami. Musimy ponownie zaznaczyć tam swoją obecność, aby móc konkurować z nowymi, wschodzącymi potęgami Bałtyku."
 hsa_seize_jutland_mission_title: "Zajmij Jutlandię"
 hsa_seize_jutland_mission_desc: "Od stuleci kupcy mogą wybierać między przewozem towarów lądem przez nasze rynki a opłynięciem Jutlandii i podróżą przez Danię. Musimy zakończyć ten podział, włączając Jutlandię do naszych bezpośrednich posiadłości. Wówczas wszyscy kupcy podróżujący między Bałtykiem a Zachodem będą korzystać z portów kontrolowanych przez nas i naszych sprzymierzeńców."
 hsa_subjugate_norway_mission_title: "Ujarzmij Norwegię"
 hsa_subjugate_norway_mission_desc: "Norwegowie od dawna chcieli pozbyć się wpływów Hanzy. Nie spełnimy ich życzenia. Zamiast tego powinniśmy stać się ich panami!"
 hsa_queen_of_the_league_mission_title: "Królowa ligi"
 hsa_queen_of_the_league_mission_desc: "Nasze wspaniałe i bogate miasto, Królowa Ligi Bałtyckiej, jest prawdziwym sercem naszego państwa. Musimy je odnowić, aby zyskało splendor godny swojego statusu."
 hsa_return_visby_mission_title: "Powrót Visby do ligi"
 hsa_return_visby_mission_desc: "Visby, główne miasto Gotlandii, było do niedawna bazą operacji Hanzy we wschodniej części Bałtyku i ważnym przystankiem na szlaku między Nowogrodem, Rygą a Lubeką. Wraz z powstaniem unii kalmarskiej nie zdołaliśmy jednak powstrzymać spadku naszych wpływów w mieście. Musimy zakwestionować duńskie i szwedzkie roszczenia do wyspy, jeśli chcemy odzyskać dominację na Bałtyku."
 hsa_return_novgorod_mission_title: "Pkt handl. w Nowogrodzie"
 hsa_return_novgorod_mission_desc: "Handel z Nowogrodem, a tym samym z głębią Rosji, ma kluczowe znaczenie dla dobrobytu miast hanzeatyckich. Kupcy nowogrodzcy i ambitni carowie moskiewscy dążą jednak do przejęcia kontroli nad handlem miasta i wyeliminowania konkurentów. Musimy zadbać, by nikt nie podważał naszej dominacji na tamtejszych rynkach."
 hsa_dominate_commerce_mission_title: "Zdominuj handel"
 hsa_dominate_commerce_mission_desc: "Nasze potężne imperium handlowe jest gotowe do ustanowienia monopolu na handel w północnych Niemczech. Zdobycie takiego monopolu powinno stać się naszym najwyższym priorytetem."
 hsa_unite_hanseatic_league_mission_title: "Zjednocz ligę"
 hsa_unite_hanseatic_league_mission_desc: "Stara Liga Hanzeatycka przeżyła już swoją epokę. Zamiast kurczowo trzymać się przeszłości, musimy przekształcić ją w zjednoczone państwo, zdolne sprostać wyzwaniom współczesności."
 hsa_london_channel_mission_title: "Więzi z Anglią"
 hsa_london_channel_mission_desc: "Anglicy znajdują się w doskonałej pozycji, by czerpać bogactwa z handlu. Powinniśmy albo nawiązać z nimi współpracę, albo rzucić wyzwanie ich rodzącemu się imperium handlowemu, zanim będzie za późno."
 hsa_edinburgh_mission_title: "Baza w Szkocji"
 hsa_edinburgh_mission_desc: "Edynburg byłby cennym nabytkiem dla naszej ligi, ponieważ stanowiłby dogodną bazę nad Morzem Północnym. Powinniśmy ich „przekonać”, by uczynili nas swoim głównym partnerem handlowym."
 hsa_north_sea_trade_mission_title: "Chroń handel na Morzu Płn."
 hsa_north_sea_trade_mission_desc: "W przeszłości głównym źródłem naszego bogactwa był handel ze Wschodem. Obecnie jednak bogactwa Rosji bledną w porównaniu z ogromnymi zasobami płynącymi z kolonii do Europy. Północny szlak tego handlu prowadzi przez Morze Północne do Niderlandów i Anglii, lecz być może uda nam się przekonać kupców, by zamiast tego zawijali do [Root.Capital.GetCapitalName]..."
 hsa_newfoundland_trading_ports_mission_title: "Porty handl. w N. Fundlandii"
 hsa_newfoundland_trading_ports_mission_desc: "Odkrywcy opowiadają o żyznej, nowej krainie na dalekim zachodzie. Nierozsądnie byłoby pozostawić jej eksploatację innym."
 hsa_new_lubeck_mission_title: "Odkrywcy gwiezdnego pyłu"
 hsa_new_lubeck_mission_desc: "Nowy Świat oferuje ambitnym wiele możliwości. Zakładając tam rozległe kolonie, możemy znacznie rozszerzyć dawną Ligę Bałtycką w nowych, nieprzewidzianych kierunkach."
 hsa_merchant_navy_mission_title: "Marynarka kupiecka"
 hsa_merchant_navy_mission_desc: "Piraci i korsarze próbują wzbogacić się, rabując nasze statki handlowe. Musimy zbudować flotę zdolną ochronić nas przed agresorami."
 hsa_hanseatic_shipwrights_mission_title: "Hanzeatyccy szkutnicy"
 hsa_hanseatic_shipwrights_mission_desc: "Bez potęgi morskiej, która zabezpieczy nasze imperium handlowe, ryzykujemy utratę wszystkiego, co osiągnęliśmy. Nasi słynni szkutnicy muszą otrzymać najlepsze warunki pracy, aby naszej flocie nigdy nie zabrakło okrętów."
 hsa_hanseatic_bookkeeping_mission_title: "Hanzeatycka księgowość"
 hsa_hanseatic_bookkeeping_mission_desc: "Teraz, gdy nasze imperium morskie jest bezpieczne, musimy zadbać o nienaganną księgowość, aby ani grosz przeznaczony do naszego skarbca nie trafiał do kieszeni skorumpowanych urzędników."
 hsa_hanseatic_shipwrights: "Hanzeatyccy szkutnicy"
 hsa_adler_von_lubeck_mission_title: "Orzeł mórz"
 hsa_adler_von_lubeck_mission_desc: "Nasza flota jest krwiobiegiem Ligi Hanzeatyckiej. Dopóki jakiekolwiek państwo może rzucić wyzwanie naszej kontroli nad morzami, dominacja handlowa nie będzie pewna. Musimy zbudować potężną flotę, której żaden konkurent nie odważy się stawić czoła!"
 hsa_build_lubeck_krantor_mission_title: "Budowa żurawia Krantor"
 hsa_build_lubeck_krantor_mission_desc: "Wraz z napływem bogactw do naszych portów infrastruktura portowa zaczyna okazywać się niewystarczająca. Nasi architekci przygotowali plany budowy ogromnego żurawia portowego, który nazwali Krantor. Choć jego wzniesienie będzie kosztowne, znacznie ułatwi pracę kupcom, pozwalając sprawniej załadowywać i rozładowywać statki. Musimy doprowadzić do realizacji tych planów."
 hsa_london_steelyard_mission_title: "Londyński bezmian"
 hsa_london_steelyard_mission_desc: "Kupcy hanzeatyccy są już obecni w Londynie, gdzie nad Tamizą działa ich kantor Steelyard. Anglicy niechętnie tolerują jednak naszą obecność, sami pragnąc stać się wielkim państwem handlowym i rywalizować z Ligą Hanzeatycką. W obliczu tego zagrożenia istnieje tylko jedno rozsądne rozwiązanie: musimy uczynić Londyn pełnoprawnym i stałym członkiem naszej ligi handlowej."
 hsa_london_steelyard: "Londyński bezmian"
 hsa_hanseatic_channel: "Hanzeatyccy handlarze"
 hsa_lubeck_ascendant: "Przywrócenie potęgi Hanzy"
 hsa_hansa_in_novgorod: "Hanzeatycka kontrola nad Nowogrodem"
 hanseatic_merchant_navy_modifier: "Marynarka kupiecka"
 desc_hanseatic_merchant_navy_modifier: "Nasza flota handlowa jest w stanie bronić się przed atakami piratów i korsarzy."
 hanseatic_shipwrights_modifier: "Szkutnicy i żeglarze"
 desc_hanseatic_shipwrights_modifier: "Szkutnicy i żeglarze państwa [Root.GetName] należą do najlepszych na świecie. Poświęcają się służbie flocie, aby nasze miasto mogło panować nad morzami."
 hsa_advance_our_interests_modifier: "Rozszerzona Liga Hanzeatycka"
 desc_hsa_advance_our_interests_modifier: "Nasza dominacja nad handlem północnych Niemiec przynosi korzyści. Nie tylko najlepsi kupcy garną się do naszej ligi, lecz stajemy się również najważniejszym autorytetem w sprawach handlowych."
 hsa_united_league_modifier: "Zjednoczony Związek Hanzeatycki"
 desc_hsa_united_league_modifier: "Odnowiliśmy potęgę Ligi Hanzeatyckiej i przekształciliśmy ją w zjednoczone państwo. Nie zapominamy jednak o naszych tradycjach i nadal jesteśmy dobrze przygotowani do współpracy z licznymi partnerami dyplomatycznymi."
 new_lubeck_modifier: "Amerykańskie kolonie"
 desc_new_lubeck_modifier: "Założyliśmy kolonie w Ameryce, pozwalając dawnej Lidze Bałtyckiej rozwijać się w nowych, nieprzewidzianych kierunkach."
 adler_von_lubeck_modifier: "Hegemonia morska"
 desc_adler_von_lubeck_modifier: "Nasza potężna flota dominuje na Bałtyku i Morzu Północnym. Nikt nie odważy się rzucić wyzwania naszej kontroli nad falami!"
 hsa_baltic_trade_modifier: "Zabezpieczony handel bałtycki"
 desc_hsa_baltic_trade_modifier: "Przywróciliśmy naszą potęgę na Bałtyku, tradycyjnym źródle bogactwa Hanzy. Nikt nie odważy się już omijać Lubeki podczas żeglugi ze wschodu!"
 hanseatic_queen_modifier: "Królowa Ligi Bałtyckiej"
 desc_hanseatic_queen_modifier: "Splendor naszego miasta przyciąga licznych aspirujących artystów, intelektualistów i zagranicznych dostojników, którzy chcą prowadzić interesy z naszym [Root.GovernmentName]."
 hanseatic_bookkeeping_modifier: "Hanzeatycka księgowość"
 desc_hanseatic_bookkeeping_modifier: "Nasi sumienni księgowi dbają o to, by każdy grosz trafiał tam, gdzie jego miejsce — do naszego skarbca."
 hsa_north_sea_trading: "Szlach handlowy na Morzu Północnym"
 desc_hsa_north_sea_trading: "Dominujemy teraz na Morzu Północnym, tak jak niegdyś dominowaliśmy na Bałtyku, kierując do naszego skarbca dochody handlowe zarówno z kolonii, jak i z Rosji."
 emp_mission_events.14.name: "Zjednoczenie Ligi Hanzeatyckiej"
 emp_mission_events.14.desc: "W ostatnich latach nierównowaga między Lubeką a pozostałymi członkami Ligi Hanzeatyckiej znacznie się pogłębiła. Lubeka zalicza się obecnie do wielkich mocarstw Europy, podczas gdy państwo [Root.GetName] pozostaje niewielkim krajem o skromnym terytorium i bogactwie.\n\nWygląda na to, że przywódcy Lubeki wykorzystali tę nierównowagę jako pretekst do własnego wywyższenia. Nie jesteśmy pewni, na który podpunkt naszego porozumienia się powołali, lecz wygląda na to, że staliśmy się ich wasalem."
 OH_NO: "Niefortunny obrót spraw."
 advance_our_interests.tooltip: " należą do tej samej §YLigi Handlowej§! co §Y[Root.GetName]§!."
 hsa_united_league.tooltip: "Podporządkować jako wasali wszystkich członków Ligi Hanzeatyckiej, którzy nie prowadzą wojny i posiadają następujące miasta: §YAntwerpia§!, §YBrema§!, §YBruksela§!, §YGdańsk§!, §YGotlandia§!, §YGroningen§!, §YHamburg§!, §YKöln§!, §YLüneburg§!, §YRyga§!, §YSzczecin§! i §YUtrecht§!."
 hsa_united_league_no_valid_targets.tooltip: "§RŻadne państwo nie zostanie podporządkowane!§!"
 adler_von_lubeck.tooltip: "Podjąć decyzję §Y„Adler von Lübeck”§!."
 adler_von_lubeck_supreme.tooltip: "Żadne państwo posiadające port nad §YBałtykiem§! lub §YMorzem Północnym§! nie ma więcej ciężkich okrętów niż §Y[Root.GetName]§!."
 form_hanseatic_league.tooltip: "Anektować wszystkich wasali i marchie przekierowujące siłę handlową, których opinia wynosi §G200§!, a pragnienie wolności jest niższe niż §R50%§!."
 HANSEATIC_LEAGUE: "Związek Hanzeatycki"
 HANSEATIC_LEAGUE_ADJ: "Hanzy"
 supported_three_successive_emperors_tooltip: "§Y[Root.GetName]§! skutecznie poparło wybór §Y3§! kolejnych cesarzy Świętego Cesarstwa Rzymskiego."
 mission_rewards_power_projection: "Nagrody za misje i wydarzenia"
 westphal_lower_saxon_tt: "Posiadać wszystkie §Ydolnosaksońskie§! prowincje w §YEuropie§!."
 westphalia_low_saxon_claims_tt: "Otrzymać stałe roszczenia do wszystkich prowincji kultury §Ydolnosaksońskiej§! w §YEuropie§!."
 westphalia_saxon_claims_tt: "Otrzymać stałe roszczenia do wszystkich prowincji kultury §Ysaskiej§! w §YEuropie§!."
 westfalen_capital_modifier: "Nowa stolica"
 desc_westfalen_capital_modifier: "Państwo to niedawno wyznaczyło tę prowincję na stolicę Westfalii. Przyciąga ona obecnie imigrantów i ambitnych architektów, którzy mają uczynić ją przedmiotem zazdrości całego świata."
 westphalia_religious_supermacy_mod: "Pokój w Westfalii"
 desc_westphalia_religious_supermacy_mod: "W Westfalii podpisano traktat, który zagwarantował, że wszyscy członkowie Cesarstwa będą wyznawać jedyną prawdziwą wiarę."
 westphalia_religious_peace_mod: "Pokój w Westfalii"
 desc_westphalia_religious_peace_mod: "W Westfalii podpisano traktat, który zagwarantował wszystkim chrześcijanom bezpieczny przejazd przez Cesarstwo i ochronę przed prześladowaniami."
 westphalian_mission_events.1.t: "Roszczenia do Westfalii"
 westphalian_mission_events.1.d: "Wraz z rozwojem naszych ambicji w Westfalii możemy umocnić nasze prawa do tych ziem, przenosząc stolicę do [82.GetName]. Niektórzy uważają, że byłby to nierozsądny krok, ponieważ [Root.Capital.GetName] doskonale sprawdza się jako ośrodek administracyjny naszego państwa."
 westphalian_mission_events.1.a: "Musimy wzmocnić nasze roszczenia do Westfalii."
 westphalian_mission_events.1.b: "[82.GetName] nie dorównuje nawet wielkością [Root.Capital.GetName]!"
 wes_enforce_sovereignty_title: "Umocnienie naszej suwerenności"
 wes_enforce_sovereignty_desc: "W obecnym kształcie Westfalia i Nadrenia są niewiele więcej niż zbiorem nieznaczących mikropaństw. Jeśli chcemy zgłosić roszczenia do suwerenności i sprawić, by obce mocarstwa traktowały je poważnie, musimy rozszerzyć nasze wpływy w ojczystym regionie."
 wes_conquest_of_westfalen_title: "Roszczenia do Westfalii"
 wes_conquest_of_westfalen_desc: "Teraz, gdy umocniliśmy naszą władzę w ojczystym regionie, pozostało już tylko zjednoczyć wszystkich Westfalczyków w jednym państwie! Zdobywając prowincję Westfalen, udowodnimy, że państwo [Root.GetName] jest prawowitą ojczyzną wszystkich Westfalczyków."
 wes_unite_westphalia_title: "Zjednocz Westfalię"
 wes_unite_westphalia_desc: "Kiedy już podbijemy całe prawowite terytorium Westfalii, nadejdzie czas na podbój obcych krajów i kultur oraz stworzenie własnego imperium!"
 wes_widukind_title: "Dziedzictwo Widukinda"
 wes_widukind_desc: "Legendarny Widukind, który przeciwstawił się frankijskim najeźdźcom w Saksonii, przyszedł na świat właśnie tutaj, w Westfalii. Jest ikoną kultury Sasów, a przywłaszczając sobie jego dziedzictwo, możemy zacząć przyciągać Sasów do naszego państwa."
 wes_hre_peace_title: "Pokój w Westfalii"
 wes_hre_peace_desc: "W miarę jak wojny religijne pustoszą Europę, coraz bardziej potrzebny staje się rozejm. Rokowania w Westfalii rozstrzygną o przyszłości Świętego Cesarstwa Rzymskiego i całego chrześcijańskiego świata."
 wes_rheinland_start_title: "Reńska supremacja handlowa"
 wes_rheinland_start_desc: "Niestety, wśród mieszkańców Nadrenii nie istnieje jeszcze pojęcie narodu westfalskiego, choć mogliby oni wnieść wielki wkład w rozwój naszego państwa. Być może, udowadniając, że dominujemy w handlu nadreńskim, zdołamy stworzyć więź między ludnością Nadrenii i Westfalii."
 wes_rheinland_mid_title: "Reńscy Westfalczycy"
 wes_rheinland_mid_desc: "Tylko garstka mieszkańców Nadrenii wierzy w ideę narodu westfalskiego. Zwiększając liczbę Nadreńczyków żyjących w naszym państwie, możemy sprawić, że idea ta stanie się bardziej atrakcyjna."
 wes_rheinland_end_title: "Zdominuj Ren"
 wes_rheinland_end_desc: "Gdy handel w Nadrenii znajdzie się całkowicie w naszym żelaznym uścisku, nikt nie będzie mógł zaprzeczyć naszej boskiej suwerenności nad tym regionem."
 fra_defeat_england_tt: "§YAnglia§! lub §YWielka Brytania§! posiada mniej niż 10 prowincji w regionie §YWysp Brytyjskich§!."
 fra_colonial_enthusiasm: "Francuski entuzjazm kolonialny"
 desc_fra_colonial_enthusiasm: "Nasi ludzie chętnie osiedlają się w Nowym Świecie i czerpią z niego niekończące się korzyści."
 fra_colonial_enthusiasm_2: "France Antarctique"
 desc_fra_colonial_enthusiasm_2: "Ogromne połacie Ameryki Południowej są gotowe do kolonizacji, a do osiedlenia się w naszych nowych koloniach nie brakuje chętnych."
 gc_mor_wattasid_title: "Rezolucja Wattasydów"
 gc_mor_wattasid_desc: "Wattasydzi są potężną dynastią w Maroku i często pełnią funkcję wezyrów sułtana. Ledwie skrywają ambicje sięgnięcia po tron i zdają się umacniać swoją pozycję w ramach przygotowań do otwartego buntu."
 gc_mor_wattasid_tt: "Rozstrzygnąć łańcuch wydarzeń dotyczących buntu Wattasydów"
