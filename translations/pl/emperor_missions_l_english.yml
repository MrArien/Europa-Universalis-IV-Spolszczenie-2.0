 COUNTRY_NAME_WILL_BE_RESTORED: "Nazwa kraju zostanie przywrócona do pierwotnej nazwy"
 KINGDOM_OF_GOD: "Królestwo Boże"
 KINGDOM_OF_GOD_ADJ: "Państwa Kościelnego"
 pom_unite_pomerania_title: "Zjednocz Pomorze"
 pom_unite_pomerania_desc: "Musimy dążyć do zjednoczenia Pomorza. Razem możemy rozwijać się w nieprzyjaznym środowisku jako silny naród."
 pom_reclaim_frontiers_title: "Odzyskaj granice"
 pom_reclaim_frontiers_desc: "Pogranicza Uckermark i Neumark niegdyś należały do nas, lecz bezprawnie rościli sobie do nich prawa i odebrali je nasi sąsiedzi oraz rywale — Brandenburgia i zakon krzyżacki. Powinniśmy odzyskać to, co słusznie nam się należy, i zabezpieczyć nasze granice."
 pom_subdue_brandenburg_title: "Kontroluj Marchię Środkową"
 pom_subdue_brandenburg_desc: "Mieszkańcy Mittelmarku od dawna są naszym wrogiem, usiłując najechać nasze ziemie, gdy mają na to okazję. Ich niezależność jest zagrożeniem dla naszego przetrwania, a każde zagrożenie musi zostać wyeliminowane."
 pom_strengthen_old_ties_title: "Wzmocnij dawne więzi"
 pom_strengthen_old_ties_desc: "Niegdyś dzieliliśmy nasze ziemie z Wielkopolską, dopóki na początku XIV wieku nie utraciła ona kontroli nad tym regionem. Teraz, gdy staliśmy się silniejszym państwem, powinniśmy odnowić i umocnić dawne więzi z Polską, zanim zmiażdżymy zakon krzyżacki w Prusach. Jeśli jednak uznamy, że lepiej będzie rywalizować, powinniśmy pokazać im naszą potęgę — dyplomatycznie lub militarnie."
 pom_revenge_on_knights_title: "Zemsta na Krzyżakach"
 pom_revenge_on_knights_desc: "Odkąd Krzyżacy zajęli ziemie pruskie w 1225 roku na prośbę księcia Konrada Mazowieckiego, rozpoczęli ekspansję na zachód, odbierając nam nasze rodowe domy na wschodzie. Nie tylko zagarnęli ziemię dla siebie, ale narazili na nas grozę barbarzyńskiej przemocy. Teraz, gdy jesteśmy silnym narodem, razem z sojusznikami dokonamy wyrównania rachunków."
 pom_hanseatic_seat_title: "Siedziba Hanzy"
 pom_hanseatic_seat_desc: "Lubeka jest stolicą Ligi Hanzeatyckiej. Jeśli przejmiemy kontrolę nad miastem, będziemy mogli skierować znaczną część bogactw handlowych Bałtyku do naszego skarbca."
 pom_control_hanseatic_title: "Kontroluj dolną Łabę"
 pom_control_hanseatic_desc: "Samo posiadanie Lubeki, głównego miasta handlowego, nie wystarczy. Nadszedł czas, by rozszerzyć naszą strefę wpływów na sąsiednie miasta."
 pom_baltic_struggle_title: "Walka o Bałtyk"
 pom_baltic_struggle_desc: "Duńscy i szwedzcy najeźdźcy z północy wielokrotnie próbowali najechać i podbić nasze ziemie. Teraz, gdy rozszerzyliśmy obszar wybrzeża pod naszą kontrolą, powinniśmy rozważyć budowę znacznej floty, która dorówna ich potędze morskiej i pozwoli nam rzucić wyzwanie na Bałtyku. Wkrótce ich ziemie staną się nasze."
 pom_consolidated_front: "Zjednoczony front"
 desc_pom_consolidated_front: "Mając Mittelmark pod naszą kontrolą, udało nam się skonsolidować naszą obronę przed zagrożeniami zewnętrznymi. Nadszedł czas, aby być bardziej dyplomatycznym i zwracać większą uwagę na sprawy wewnętrzne."
 pom_inspiring_revenge: "Inspirująca zemsta"
 desc_pom_inspiring_revenge: "Udana zemsta na Krzyżakach jest zawsze słodka i inspirująca dla naszego ludu."
 pom_trade_boom: "Rozkwit handlu morskiego"
 desc_pom_trade_boom: "Dzięki przejęciu miast hanzeatyckich możemy wreszcie pokazać naszą dominację na Bałtyku."
 pom_royal_solidarity: "Królewska solidarność"
 desc_pom_royal_solidarity: "Stajemy razem z polskimi książętami i uwalniamy ich od ciemiężców!"
 pom_pol_unity: "Odbudowa starych więzi"
 desc_pom_pol_unity: "Ponownie jesteśmy zjednoczeni z polskim narodem. W ten sposób miejscowi polscy książęta dostarczyli nam rycerskiego wsparcia."
 build_manufactories_mission_tooltip: "prowincje należące do §Y[Root.GetName]§! mają manufakturę."
 hin_industrial_tt: " posiadanych prowincji w regionie §YBengalu§! ma §Ymanufakturę§!."
 peasants_means_of_production_tt: " posiadanych prowincji ma młyn, manufakturę tekstylną, manufakturę uzbrojenia, manufakturę wyposażenia morskiego lub hutę."
