 cloves: "Goździki"
 clovesDESC: "Goździki są bardzo wartościową przyprawą, naturalnie występującą na wyspach Indonezji. Stanowiły przyczynę wielu wojen, które miały na celu kontrolę ich produkcji. Goździki to aromatyczne pąki kwiatowe, które są zbierane wtedy, gdy te pąki zmieniają swój odcień z pierwotnego wyblakłego na jasnoczerwony. Goździki wykorzystywane są w kuchniach wielu regionów, od Azji do Morza Śródziemnego, a także w kolonialnej Ameryce."
 khmer.1.t: "Mroczny wiek Kambodży"
 khmer.1.d: "Potężne niegdyś Imperium Khmerów upadło. Angkor, serce khmerskiej cywilizacji, leży zrujnowane i opuszczone po tym, jak zostało zniszczone przez tajskich najeźdźców. W całej Kambodży świątynie i miasta niszczeją, gdy król [Root.Monarch.GetName] walczy o utrzymanie [Root.Monarch.GetHerHis] władzy poza nową stolicą w [Root.Capital.GetCapitalName]. To mroczny czas dla Khmerów."
 khmer.1.a: "Powstaniemy ponownie."
 khmer_dark_age_tt: "§YWszystkie koszty w punktach monarchy§! zostaną zwiększone o §R25%§!."
 khmer.2.t: "Odrodzenie Khmerów"
 khmer.2.d: "Lata, które upłynęły od upadku Angkoru, były ciężką próbą, lecz dzięki niestrudzonym wysiłkom [Root.Monarch.GetTitle] wydobyliśmy się z mroku, który spowił [Root.GetName]. Wielkie miasto Angkor i jego majestatyczny kompleks świątynny zostały odbudowane, a [Root.Monarch.GetTitle] ponownie uczynił je stolicą. Okoliczne ziemie znów są zaludnione i urodzajne, a serca naszego ludu zaznały duchowego spełnienia. Imperium Khmerów jest gotowe, by ponownie powstać."
 khmer.2.a: "Zwycięstwo dla [Root.GetName]!"
 khmer.3.t: "Wiara w państwie [Root.GetName] — [Root.GovernmentName]"
 khmer.3.d: "Nasze przejście na buddyzm therawady nie przebiegło całkowicie gładko. Niektórzy sprzeciwiali się naukom Buddy i nadal praktykują hinduizm, podczas gdy inni uważają, że prawdziwą ścieżką jest odłam mahajany. Teraz, gdy udało nam się osiągnąć względny pokój religijny, powinniśmy zdecydować, którą wiarę przyjąć jako religię państwową."
 khmer.3.a: "Wiara therawadyjska doprowadzi nas do oświecenia."
 khmer.3.b: "Spójrzmy w przeszłość — powróćmy do hinduizmu."
 khmer.3.c: "Buddyzm mahajany jest dla nas właściwą drogą."
 dark_age_of_cambodia: "Mroczny wiek Kambodży"
 desc_dark_age_of_cambodia: "Nasza cywilizacja jest zrujnowana. Imperium Khmerów upadło."
 siamese_nation_title: "Utwórz państwo syjamskie"
 siamese_nation_desc: "Powinniśmy zjednoczyć ludy Tajlandii w jedno państwo. Pozwoli nam to utworzyć imperium, które osiągnie dominującą pozycję w Azji Południowo-Wschodniej."
 flavor_peg.1.t: "Shin Sawbu"
 flavor_peg.1.d1: "Męska linia dynastii Pegu niemal wygasła, a [Root.Heir.GetName] jest wciąż zaledwie dzieckiem. Królestwo Pegu pozostaje więc bez przywódcy. W tych niespokojnych czasach, naznaczonych wojną i niepewnością, lud zwraca się ku Shin Sawbu, matce króla Binnya Waru, by objęła stery rządów. Shin Sawbu jest kobietą o niezwykłym talencie administracyjnym i głębokiej pobożności, która od dziesięcioleci nadzoruje dwór królewski. Ogłoszenie jej królową-regentką z pewnością spotka się z przychylnością poddanych."
 flavor_peg.1.d2: "Męska linia dynastii Pegu niemal wygasła, a sukcesja pozostaje niepewna. W tych niespokojnych czasach, naznaczonych wojną i niepewnością, lud zwraca się ku Shin Sawbu, matce króla Binnya Waru, by objęła stery rządów. Shin Sawbu jest kobietą o niezwykłym talencie administracyjnym i głębokiej pobożności, która od dziesięcioleci nadzoruje dwór królewski. Ogłoszenie jej dziedziczką królestwa z pewnością spotka się z przychylnością poddanych."
 flavor_peg.1.a: "Shin Sawbu zostanie naszą królową."
 flavor_peg.1.b: "Nie nadaje się na tron."
 flavor_peg.2.t: "Dhammazedi"
 flavor_peg.2.d: "Podczas trudnych lat spędzonych na dworze Avy Shin Sawbu poznała mnicha Mon o imieniu Pitakahara. Był on niezwykle mądry zarówno w sprawach duchowych, jak i doczesnych, dlatego Shin Sawbu objęła go patronatem. Pitakahara był bardzo lojalny wobec przyszłej królowej i wspólnie opracowali plan ucieczki z powrotem do Pegu. Obecnie jest jej najbliższym doradcą. W miarę starzenia się Shin Sawbu pragnie ona wycofać się z życia publicznego i poświęcić duchowości. Otwarcie rozważa wydanie jednej ze swoich córek za Pitakaharę, nadanie mu tytułu Dhammazedi i ogłoszenie go królem Pegu."
 flavor_peg.2.a: "Niech Dhammazedi natychmiast obejmie tron."
 flavor_peg.2.b: "Wyznaczmy Dhammazediego na następcę tronu."
 flavor_peg.2.c: "Nie pozwolimy, by rządził nami mnich."
 flavor_suk.1.t: "Wstąpienie Trailoka na tron"
 flavor_suk.1.d: "W ostatnich latach niegdyś potężne królestwo Sukhothai stało się jedynie wicekrólestwem Ayutthayi. Wykorzystując okazję do przejęcia większej kontroli nad Sukhothai, książę Ayutthayi został mianowany jego królem po śmierci ostatniego niezależnego władcy, Borommapana. Książę ten, Trailok, wstąpił teraz na tron Ayutthayi. Stwarza to wyjątkową sposobność, by w pełni zintegrować Sukhothai z naszym państwem."
 flavor_suk.1.a: "Włączmy Sukhothai do Królestwa Ayutthayi."
 flavor_suk.1.b: "Mianujmy nowego wicekróla Sukhothai."
 flavor_suk.1.c: "Pozwólmy Trailokowi podjąć decyzję."
 flavor_suk.2.a: "Rządźmy z Sukhothai i mianujmy księcia w Ayutthayi."
 flavor_suk.2.b: "Odrzućmy tron Ayutthayi."
 flavor_suk.2.c: "Mianujmy gubernatora Sukhothai."
 abandoned_mlc: "Opuszczona Malakka"
 emerald_buddha: "Szmaragdowy Budda"
 desc_emerald_buddha: "Ten święty artefakt znajduje się w świątyni na terenie tej prowincji. Strzeż go dobrze, gdyż nasi wrogowie bardzo go pożądają."
 emerald_buddha_tt: "§YSzmaragdowy Budda§! zostanie usunięty z prowincji §Y[emerald_buddha_province.GetName]§!."
 emerald_buddha_alternate: "Szmaragdowy Budda"
 desc_emerald_buddha_alternate: "Ten święty artefakt znajduje się w świątyni na terenie tej prowincji. Strzeż go dobrze, gdyż nasi wrogowie bardzo go pożądają."
 renovate_emerald_buddha_shrine_title: "Renowacja świątyni Szmaragdowego Buddy (§YKarma +§!)"
 renovate_emerald_buddha_shrine_desc: "Świątynia przechowująca świętego Szmaragdowego Buddę wymaga renowacji, nie tylko ze względu na jej materialne utrzymanie, ale także w celu podkreślenia aspektów buddyzmu, które są obecnie przydatne dla państwa."
 renovate_emerald_buddha_shrine_alternate_title: "Renowacja świątyni Szmaragdowego Buddy (§YKarma -§!)"
 renovate_emerald_buddha_shrine_alternate_desc: "Świątynia przechowująca świętego Szmaragdowego Buddę wymaga renowacji, nie tylko ze względu na jej materialne utrzymanie, ale także w celu podkreślenia aspektów buddyzmu, które są obecnie przydatne dla państwa."
 flavor_lna.1.t: "Szmaragdowy Budda"
 flavor_lna.1.d: "Bramy miasta [From.GetCapitalName] upadły, pozostawiając otwartą drogę do świątyni Szmaragdowego Buddy. Pomimo protestów mnichów opiekujących się świątynią, nasi żołnierze przejmują świętą ikonę i przygotowują ją do podróży do miasta [Root.Capital.GetCapitalName]. Tam będzie czczona i chroniona przez bardziej godnych opiekunów."
 flavor_lna.1.a: "Obywatele [From.Owner.GetAdjective] nie byli godni nawet na nią patrzeć."
 flavor_lna.2.t: "Kradzież Szmaragdowego Buddy"
 flavor_lna.2.d: "Katastrofa uderza, gdy bramy miasta [emerald_buddha_province.GetName] upadają, pozostawiając otwartą drogę do świątyni Szmaragdowego Buddy. Pomimo protestów mnichów opiekujących się świątynią, żołnierze wroga przejmują świętą ikonę dla bluźnierczego [From.Monarch.GetRulerGen] i przygotowują się do przetransportowania jej do miasta [From.Capital.GetName]."
 flavor_lna.2.a: "To wielkie upokorzenie."
 estate_church_brahmins_at_court: "Bramini na dworze"
 estate_church_brahmins_at_court_desc: "Choć nie wyznajemy hinduizmu, bramini wciąż zajmują zaszczytne miejsce w społeczeństwie i na dworze."
 estate_burghers_khmer_irrigation: "Zaawansowane techniki irygacyjne"
 estate_burghers_khmer_irrigation_desc: "Państwo zapewnia infrastrukturę i narzędzia umożliwiające wykorzystanie jednych z najbardziej zaawansowanych technik irygacyjnych na świecie. Obfitość żywności pozwala dzięki temu na szybki wzrost liczby ludności."
 estate_vaisyas_khmer_irrigation: "Zaawansowane techniki irygacyjne"
 estate_vaisyas_khmer_irrigation_desc: "Państwo zapewnia infrastrukturę i narzędzia umożliwiające wykorzystanie jednych z najbardziej zaawansowanych technik irygacyjnych na świecie. Obfitość żywności pozwala dzięki temu na szybki wzrost liczby ludności."
 estate_burghers_khmer_irrigation_effect_tooltip: "Każda posiadana prowincja produkująca §Yzboże§! zyskuje:\nLokalny koszt rozwoju: §G-10%§!"
 estate_burghers_khmer_irrigation_revoke_effect_tooltip: "Modyfikator §YZaawansowane techniki nawadniania§! jest usuwany ze wszystkich posiadanych prowincji."
 estate_burghers_khmer_irrigation_mod: "Zaawansowane techniki nawadniania"
 desc_estate_burghers_khmer_irrigation_mod: "Państwo zapewnia infrastrukturę i narzędzia umożliwiające wykorzystanie jednych z najbardziej zaawansowanych technik irygacyjnych na świecie. Obfitość żywności pozwala dzięki temu na szybki wzrost liczby ludności."
 siamese_absolutism: "Ćakrawarti"
 siamese_absolutism_desc: "Monarcha jest kimś więcej niż zwykłym człowiekiem. To boski władca, sam środek wszechświata. Tylko dzięki niemu na świecie mogą zapanować pokój i harmonia."
 flavor_lna.3.t: "Absolutyzm [Root.GetAdjective]"
 flavor_lna.3.d: "[Root.Monarch.GetTitle] jest kimś znacznie więcej niż śmiertelnym człowiekiem. [Root.Monarch.GetSheHeCap] jest Ćakrawartinem — boskim światłem oświetlającym ludzkość, wielką latarnią wskazującą drogę ku harmonii i oświeceniu. Władza [Root.Monarch.GetTitle] [Root.Monarch.GetName] musi być odczuwalna w każdym zakątku świata, aby wszyscy mogli zaznać pokoju i dobrobytu."
 flavor_lna.3.a: "Zaprowadzimy porządek na świecie."
 flavor_lna.3.b: "Obecny ustrój całkowicie nam odpowiada."
 ming_crisis.10.t: "Niepokoje w Chinach"
 ming_crisis.10.d: "Dynastia Ming przeżywa kryzys. Państwo z trudem kontroluje nawet własne terytorium, a watażkowie wystawiają armie i walczą o władzę w całych Chinach. Musimy zadać sobie pytanie, czy tak pogrążone w chaosie państwo rzeczywiście nadal posiada Mandat Niebios, a co za tym idzie — czy [Root.GetName] nie powinno ponownie rozważyć swojego trybutarnego związku z Mingami."
 ming_crisis.10.a: "Mingowie nie są nam już potrzebni."
 ming_crisis.10.b: "Pozostaniemy wierni cesarzowi w [MNG.Capital.GetCapitalName]."
 ming_crisis.10.tt: "[Root.GetName] pozostanie państwem trybutarnym Mingów"
 ming_crisis.11.t: "Separatyści [ming_disaster_new_tag.GetName] wzniecają powstanie w prowincji [ming_disaster_nationalist_province.GetName]!"
 ming_crisis.11.d: "Grupa buntowników [ming_disaster_new_tag.GetName] ośmiela się podważać autorytet naszego [Root.Monarch.GetTitle] i twierdzić, że nie jesteśmy już potomkami Niebios! Zgromadzili groźne siły w prowincji [ming_disaster_nationalist_province.GetName] i otwarcie wystąpili przeciwko nam!"
 ming_crisis.11.a: "Trzeba ich natychmiast zmiażdżyć!"
 ming_crisis.11.b: "Może kilka ustępstw zdoła ich udobruchać..."
 estate_church_karma_temples: "Świątynie klasztorne"
 estate_church_karma_temples_desc: "Powinniśmy powierzyć mnichom opiekę nad świętymi świątyniami buddyjskimi."
 estate_church_karma_temples_tt: "§Y+3 karmy§! za wzniesienie budowli typu §YŚwiątynia§!.\\n§Y-3 karmy§! za zburzenie budowli typu §YŚwiątynia§!."
 estate_church_karma_temples_ct: "§Y+5 karmy§! za wzniesienie budowli typu §YŚwiątynia§!.\\n§Y-5 karmy§! za zburzenie budowli typu §YŚwiątynia§!."
 estate_church_influence_temples: "Azyle kościelne"
 estate_church_influence_temples_desc: "Uszanujmy przywilej Kościoła do udzielania azylu podejrzanym przestępcom i dłużnikom. Zadowoli to lokalne władze kościelne, które będą mogły pobierać od nich opłaty za zakwaterowanie, a także sam papiestwo — nawet jeśli odbędzie się to kosztem naszej świeckiej władzy."
 estate_church_influence_temples_tt: "Ukończenie budowy §Ykościołów§! przyznaje §Y+3 punkty wpływu papieskiego§!.\nZburzenie §Ykościołów§! zabiera §Y-3 punkty wpływu papieskiego§!."
 estate_burghers_tropical_mod: "Planowanie miast tropikalnych"
 desc_estate_burghers_tropical_mod: "Dzięki tysiącom lat doświadczeń potrafimy wznosić rozległe miasta w naszej ojczyźnie pomimo trudności wynikających z klimatu."
 estate_burghers_tropical_nation: "Planowanie miast tropikalnych"
 estate_burghers_tropical_nation_desc: "Dzięki tysiącom lat doświadczeń potrafimy wznosić rozległe miasta w naszej ojczyźnie pomimo trudności wynikających z klimatu."
 estate_burghers_tropical_effect_tooltip: "Każda posiadana prowincja położone w tropikalnej strefie klimatycznej otrzymuje:\nLokalny koszt rozwoju prowincji: §G-5%§!\nLokalny przyrost osadników: §G+10%§!"
 estate_burghers_tropical_revoke_effect_tooltip: "Każda posiadana prowincja położona w tropikalnej strefie klimatycznej traci:\nLokalny koszt rozwoju prowincji: §G-5%§!\nLokalny przyrost osadników: §G+10%§!"
 estate_church_lao_animism: "Tolerancja religii ludowych"
 estate_church_lao_animism_desc: "Choć nie jest to zgodne z naszą wiarą, akceptujemy fakt, że wielu w naszym narodzie wciąż podąża za dawnymi religiami ludowymi."
 estate_church_lao_animism_effect_tooltip: "Każda posiadana prowincja wyznająca §Yanimizm§! zyskuje:\nLokalna siła misjonarzy: §R-100§!\nLokalny wkład w jedność religijną: §G-100%§!"
 estate_church_lao_animism_revoke_effect_tooltip: "Modyfikator §Y'Tolerancja dla religii ludowych'§! zostanie usunięty ze wszystkich posiadanych prowincji wyznających §Yanimizm§!."
 estate_church_lao_animism_mod: "Tolerancja dla religii ludowych"
 desc_estate_church_lao_animism_mod: "Choć nie jest to zgodne z naszą wiarą, akceptujemy fakt, że wielu mieszkańców naszego kraju nadal wyznaje dawne religie ludowe."
 flavor_mlc.9.t: "Państwo nadmorskie"
 flavor_mlc.9.desc: "Różne ludy malajskie zaczynają się jednoczyć politycznie pod skrzydłami naszego szybko rozwijającego się państwa. Po raz pierwszy archipelag rozwija pewien rodzaj świadomości narodowej, przekształcając nas z wyniosłego państwa-miasta otoczonego wasalami w jeden zjednoczony naród. Ten nowy etap rozwoju zmusza nas do zastanowienia się, jak powinniśmy nazwać nasze rodzące się państwo."
 flavor_mlc.9.a: "Przywołamy imperium naszych przodków – Sriwijaję."
 flavor_mlc.9.b: "Madżapahit jest chwalebne i takim pozostanie."
 flavor_mlc.9.c: "Wszyscy, którzy zamieszkują wyspy Nusantary, są nam winni posłuszeństwo."
 flavor_mlc.9.d: "Nasza ziemia to ojczyzna ludów malajskich — Malaja."
 SRIVIJAYA: "Sriwidźaja"
 SRIVIJAYA_ADJ: "Sriwidźaji"
 MAJAPAHIT_EMPIRE: "Imperium Majapahitu"
 MAJAPAHIT_EMPIRE_ADJ: "Imperium Majapahitu"
 NUSANTARA: "Nusantara"
 NUSANTARA_ADJ: "Nusantary"
 siamese_revolution: "Rewolucja syjamska"
 desc_siamese_revolution: "Napięcia między Europejczykami a lokalnymi zwyczajami groziły pogrążeniem naszego narodu — teraz wszystko to odeszło w niepamięć."
 siamese_revolution_event_tt: "Nawiązano kontakt z kupcami z Europy."
 siamese_revolution_tt: "Jest §Yeuropejskim§! państwem posiadającym co najmniej jedną prowincję w superregionie §YIndonezji§!"
 siamese_revolution_religion_tt: "Nie wyznaje religii §Y[Root.Religion.GetName]§!"
 siamese_revolution_progression_tt: "Państwo ma stolicę w §YEuropie§!"
 phetracha_coup_tt: "Osiągnij §Y10§! poziom §Yotwartości§! (obecnie: §Y[Root.siam_openness.GetValue]§!)"
 phetracha_arrested_tt: "Osiągnij §Y10§! poziom §Yreakcjonizmu§! (obecnie: §Y[Root.siam_reactionism.GetValue]§!)"
 siam_openness: "Otwartość"
 siam_reactionism: "Reakcjonizm"
 siamese_rev.1.t: "Rewolucja syjamska"
 siamese_rev.1.d: "Wraz z zacieśnianiem naszych kontaktów z ludami Zachodu coraz więcej mieszkańców [Root.GetName] zaczyna podejrzliwie patrzeć na cudzoziemców. Obawy są liczne: jedni sądzą, że dyplomaci z państwa [siam_european_country.GetAdjective] próbują nas osłabić przed inwazją, inni uważają misjonarzy wyznających [siam_european_country.Religion.GetName] za zagrożenie dla naszej wiary [Root.Religion.GetName]. Kupcy z kolei obawiają się, że umowy zawierane z Europejczykami godzą w nasze interesy handlowe. Nastroje antyeuropejskie szybko przybierają na sile w [Root.GetName] i wkrótce sytuacja może wymknąć się spod kontroli."
 siamese_rev.1.a: "To bardzo poważna sprawa."
 siamese_rev.2.t: "Koniec rewolucji syjamskiej"
 siamese_rev.2.d: "Kurz opadł po błyskawicznym i sprawnie przeprowadzonym zamachu stanu Phetrachy. Europejczycy zostali wypędzeni, a buntownicze elementy w pałacu aresztowane i stracone. Dziś wysłaliśmy potężny sygnał: ludność [Root.GetAdjective|l] i cały świat wiedzą już, że nie pozwolimy, by państwo [Root.GetName] uległo obcym wpływom."
 siamese_rev.2.d2: "Kurz opadł po błyskawicznym aresztowaniu i egzekucji Phetrachy. Reakcjoniści zostali uciszeni, a buntownicze elementy w pałacu aresztowane i stracone. Dziś wysłaliśmy potężny sygnał: państwo [Root.GetName] jest otwarte na współpracę z innymi narodami, handel i nowe idee."
 siamese_rev.2.a: "Na razie nasze problemy zdają się być rozwiązane."
 opinion_siam_antiimperialist: "Antyimperialistyczny Syjam"
 opinion_open_siam: "Otwacie Syjamu"
 siamese_rev.3.t: "Misjonarze z [siam_foreign_missionary_country.GetAdjective] napadnięci"
 siamese_rev.3.d: "Misjonarze wyznający [siam_foreign_missionary_country.Religion.GetName], działający pod ochroną państwa [siam_foreign_missionary_country.GetName], zostali zaatakowani przez wyznawców [siam_foreign_missionary_province.Religion.GetName] z prowincji [siam_foreign_missionary_province.GetName]. Misjonarze domagają się, by rząd [Root.GetAdjective] zapewnił im ochronę przed tłumem i pozwolił głosić nauki. Mieszkańcy natomiast żądają wydalenia misjonarzy, aby mogli w spokoju praktykować swoją religię [siam_foreign_missionary_province.Religion.GetName]."
 siamese_rev.3.a: "Musimy pozwolić im głosić nauki."
 siamese_rev.3.b: "Stanowią zagrożenie dla wiary [Root.Religion.GetName]."
 EST_VAL_SIA_RESTRICTED_FOREIGN_MISSIONARIES: "Ograniczona działalność zagranicznych misjonarzy"
 siam_allowed_misionaries: "Misjonarze objęci ochroną"
 siam_denied_misionaries: "Ataki na misjonarzy"
 siamese_rev.4.t: "Spiskowcy w prowincji [sia_noble_plot_province.GetName]"
 siamese_rev.4.d: "Nasi informatorzy donoszą, że grupa lokalnych możnowładców w prowincji [sia_noble_plot_province.GetName] spiskuje, by przeciwstawić się rosnącym wpływom europejskim w regionie. Niewykluczone, że ich działania obejmą również próbę usunięcia obcych wpływów z pałacu w [Root.Capital.GetName]."
 siamese_rev.4.a: "Musimy zdusić spisek w zarodku."
 siamese_rev.4.b: "Potajemnie poprzyjmy ich dążenia."
 EST_VAL_SIA_PROVOKED_NOBLES: "Prowokowanie możnowładców"
 EST_VAL_SIA_SUPPORTED_NOBLE_PLOTS: "Poparcie dla spisków możnowładców"
 siamese_rev.5.t: "Aktywność wojskowa państwa [sia_european_aggressor_country.GetAdjective]"
 siamese_rev.5.d: "Wśród nielicznych oddziałów garnizonowych państwa [sia_european_aggressor_country.GetAdjective], którym zezwoliliśmy stacjonować w naszym kraju, zaobserwowano podejrzane ruchy wojsk. Istnieją uzasadnione obawy, że manewry te zapowiadają inwazję — niespodziewany atak, którego celem będzie szybkie zajęcie pałacu i narzucenie nam rządów [sia_european_aggressor_country.GetAdjective]. Możliwe jednak, że działania te mają całkowicie niewinny charakter."
 siamese_rev.5.a: "Nic nie możemy zrobić."
 siamese_rev.5.b: "Natychmiast wydalmy te oddziały."
 opinion_sia_aggressive_acts: "Wydalenie obcych wojsk"
 siamese_rev.6.t: "Umowy handlowe z państwem [sia_european_embassy_country.GetName]"
 siamese_rev.6.d: "Ambasadorowie państwa [sia_european_embassy_country.GetName] przybyli do pałacu z propozycją zawarcia szeregu umów handlowych, które — jak twierdzą — przyniosą korzyści obu naszym krajom. Bardziej dociekliwi doradcy [Root.Monarch.GetTitle] sugerują jednak, że warunki te są znacznie bardziej jednostronne, niż się wydaje. Ich przyjęcie mogłoby jednak znacząco poprawić stosunki między naszymi państwami."
 siamese_rev.6.a: "Ta umowa przyniesie korzyści obu stronom."
 siamese_rev.6.b: "Ta umowa jest obrazą."
 opinion_sia_embassy_good: "Korzystna umowa"
 opinion_sia_embassy_bad: "Niekorzystna umowa"
 siamese_rev.7.t: "Przewrót Phetrachy"
 siamese_rev.7.d: "Nastroje antyeuropejskie ogarnęły całe państwo [Root.GetName]. Grupa możnowładców skupiła się wokół człowieka imieniem Phetracha i z powodzeniem przeprowadziła przewrót przeciwko [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Błyskawiczny przebieg zamachu pozwolił Phetrachy zaskoczyć europejskie garnizony stacjonujące w stolicy i natychmiast wydalić wszystkich europejskich dyplomatów z [Root.GetName]. Zwolennicy Phetrachy ogłosili go [Root.Monarch.GetTitle], rozpoczynając okres, który prawdopodobnie przyniesie [Root.GetName] względną izolację."
 siamese_rev.7.a: "Wypędzimy cudzoziemców z naszych ziem."
 opinion_siam_isolationism: "Izolacjonizm"
 siamese_rev.8.t: "Aresztowanie Phetrachy"
 siamese_rev.8.d: "Nastroje antyeuropejskie ogarnęły całe państwo [Root.GetName]. Grupa możnowładców skupiła się wokół człowieka imieniem Phetracha i podjęła nieudaną próbę zamachu pałacowego przeciwko [Root.Monarch.GetName]. Zwolennicy przewrotu zostali schwytani i aresztowani, a europejskich dyplomatów przebywających w stolicy zapewniono o ich bezpieczeństwie. Wszystko wskazuje na to, że [Root.GetName] czeka teraz okres otwartości i postępu."
 siamese_rev.8.a: "Zdrajcy zostaną straceni o świcie."
 siamese_age_of_openness: "Wiek otwartości"
 desc_siamese_age_of_openness: "Nasz kraj otworzył się na świat i nowe wpływy, które ze sobą niesie."
 siamese_rev.9.t: "Polityka zagraniczna [Root.Monarch.GetName]"
 siamese_rev.9.d: "Rosnąca obecność europejskich kupców, dyplomatów i wojsk w Azji Wschodniej budzi poważny niepokój [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Jak dotąd nasze stosunki z Europejczykami pozostają ograniczone, a ambasadorowie państwa [narai_foreign_policy_country.GetName] zapewniają nas, że pragną jedynie handlować z naszym krajem i lepiej go poznać. [Root.Monarch.GetTitle] oraz jego doradcy mają wiele do przemyślenia."
 siam_rev.9.a: "Musimy zachować ostrożność w kontaktach z cudzoziemcami."
 siam_rev_can_start_tt: "§YRewolucja syjamska§! może się teraz rozpocząć."
 siamese_rev.10.t: "Okazja w państwie [From.GetName]"
 siamese_rev.10.d: "Nasze wyprawy rozpoznawcze w państwie [From.GetName] ujawniły szereg słabości taktycznych i politycznych w jego obronie, przez co jest ono podatne na niespodziewany atak. Nasi szpiedzy i oficerowie zapewniają, że jeśli uderzymy szybko, [From.GetAdjective] nie będą mieli innego wyjścia, jak podporządkować się naszej władzy."
 siam_rev.10.a: "Okazja nie czeka na nieprzygotowanych."
 arrest_phetracha_decision_title: "Aresztuj Phetrachę"
 arrest_phetracha_decision_desc: "Phetracha stanowi zagrożenie dla państwa i dla naszego wspólnego dobra należy go aresztować."
 phetracha_coup_decision_title: "Poprzyj Phetrachę"
 phetracha_coup_decision_desc: "Phetracha ma rację i musimy poprzeć jego sprawę, bez względu na cenę."
 arrest_phetracha_tt: "Phetracha zostanie aresztowany."
 majapahit.1.t: "Pojawia się bohater"
 majapahit.1.d: "Niedawno na naszym dworze pojawił się siostrzeniec wielkiego wezyra. Nie wiedzieliśmy o nim niemal nic poza imieniem — Damarwulan. Służył nam jako stajenny, lecz wkrótce wieści o jego niezwykłej urodzie dotarły do córki wielkiego wezyra. Niewiele jest płomieni trudniejszych do ugaszenia niż młodzieńcza miłość.\\nLos, jaki powinien go spotkać za to zuchwalstwo, wydaje się oczywisty. Jednak nasz władca, [Root.Monarch.GetName], pewnej nocy obudził się zlany potem, z oczami szeroko otwartymi ze zdumienia: „Miałem sen — oznajmił — że młodzieniec imieniem Damarwulan ocalił nasze królestwo”."
 majapahit.1.a: "Być może jest naszym wybawcą."
 majapahit.1.b: "Wypędźmy go za jego występek."
 damarwulan_tt: "§YDamarwulan§! musi wygrać §Y5§! bitew z wrogami §YMajapahitu§!."
 majapahit.2.t: "Zwycięstwo Damarwulana"
 majapahit.2.d: "Nigdy nie staje się to łatwiejsze. Zapach rozlanej krwi wciąż jest odrażający, oczy wrogów pozostają ludzkimi oczami, a noc przed bitwą nadal nie pozwala Damarwulanowi zmrużyć oka.\\nBitwa kończy się zwycięstwem, tak jak wszystkie poprzednie. To już piąta walka i Damarwulan ma nadzieję, że będzie ostatnią. Gdy wraca na dwór, witają go z najwyższymi honorami. Jego imię powtarzane jest tak często, że sam zapomina, iż to jego imię, i zaczyna myśleć, że oznacza po prostu „zwycięstwo”. [Root.Monarch.GetName] podchodzi do niego z sercem przepełnionym radością. „Młody Damarwulanie — mówi — nie jesteś już taki młody”."
 majapahit.2.a: "Zostanie naszym małżonkiem."
 majapahit.2.b: "Zostanie dziedzicem [Root.GetName]."
 majapahit.2.c: "Zostanie hojnie wynagrodzony."
 majapahit.3.t: "Upadek Majapahitu"
 majapahit.3.d: "Majapahit jest imperium dogorywającym w agonii. Niegdyś stanowiło centrum rozległej sieci królestw wasalnych i państw trybutarnych, lecz dziś jego władza nie sięga niemal poza [Root.Capital.GetCapitalName]. Chińskie wsparcie dla naszych rywali w Malakce oraz rosnąca potęga Brunei doprowadziły do upadku naszej hegemonii. Co gorsza, wewnętrzne walki o sukcesję grożą rozdarciem od środka nawet tego, co pozostało z imperium."
 majapahit.3.a: "Nastały mroczne czasy."
 majapahit.4.t: "Nowy świt dla państwa [Root.GetName]"
 majapahit.4.d: "Wbrew wszelkim przeciwnościom [Root.GetName] podniosło się po dziesięcioleciach zamętu i upadku, ponownie stając się potęgą. Stabilne [Root.GovernmentName], lojalni poddani i wspólna wiara wzmacniają naszą determinację, gdy przypominamy sobie przysięgę Gajah Mady: pewnego dnia Majapahit zapanuje nad całą Nusantarą."
 majapahit.4.a: "Powróciliśmy znad przepaści."
 majapahit.5.t: "Powstanie Demaku"
 majapahit.5.d: "Coraz bardziej niezależna społeczność muzułmańska w Demaku znalazła obrońcę w osobie zbuntowanego księcia Majapahitu, [Root.demak_sultan.GetName]. [Root.demak_sultan.GetName] nie tylko ogłosił niepodległość Sułtanatu Demaku, lecz także zamierza zdobyć dla siebie tron Majapahitu. Uwikłani w liczne konflikty, niewiele możemy zrobić, gdy Demak gromadzi siły."
 majapahit.5.a: "Zdrajcy!"
 majapahit.6.t: "Powstanie Mataramu"
 majapahit.6.d: "Majapahit okazał się niezdolny do sprawowania władzy nawet nad własnymi posiadłościami na Jawie. Na południu wyspy wyłoniło się konkurencyjne państwo, ogłaszające się Sułtanatem Mataramu i roszczące sobie prawa do dziedzictwa imperium. [Root.Monarch.GetTitle] może jedynie patrzeć, jak [Root.Monarch.GetHerHis] imperium rozpada się na [Root.Monarch.GetHerHim] oczach."
 majapahit.7.t: "Nielojalność wobec Majapahitu"
 majapahit.7.d: "Władcy państwa [maj_tributary_country.GetName] coraz częściej lekceważą zwierzchnictwo [Root.GetAdjective]. Teraz posunęli się do jawnego nieposłuszeństwa: wstrzymują daninę i okazują brak szacunku naszym wysłannikom."
 majapahit.7.a: "Pożałują tego."
 majapahit.7.b: "Poczynimy ustępstwa, by przywrócić ich lojalność."
 majapahit.8.t: "[Root.maj_pretender.GetName] rzuca wyzwanie tronowi"
 majapahit.8.d: "Walki o sukcesję stały się w [Root.GetName] codziennością. Tym razem książę imieniem [Root.maj_pretender.GetName] zgromadził armię i ruszył na stolicę, by obalić [Root.Monarch.GetTitle]."
 majapahit.8.a: "Zmiażdżymy tego uzurpatora."
 majapahit.9.t: "Oferta pomocy"
 majapahit.9.d: "Sytuacja w [Root.GetName] jest rozpaczliwa, lecz wydaje się, że nie wszystko jeszcze stracone. Grupa zamożnych muzułmańskich kupców zwróciła się do [Root.Monarch.GetTitle] z pewną propozycją. Zapłacą nam sowicie za przywileje handlowe w naszych portach oraz prawo do swobodnego praktykowania religii w [Root.GetName]. Bhattara Saptaprabhu ostrzegają, że niestabilność imperium może skłonić naszych poddanych do przyjęcia obcej wiary kupców i porzucenia tradycji, na których zbudowano Majapahit. Srebro stanowi jednak argument, któremu trudno się oprzeć."
 majapahit.9.a: "Ich pomoc jest bardzo mile widziana."
 majapahit.9.b: "Nie potrzebujemy pomocy pogan. Wypędźmy ich."
 maj_muslim_traders_tt: "§YMuzułmańscy kupcy będą szerzyć w naszych prowincjach sunnizm§!"
 majapahit.10.t: "Rozprzestrzenianie się islamu w prowincji [maj_sunni_province.GetName]"
 majapahit.10.d: "Społeczności muzułmańskie istnieją w Majapahicie co najmniej od czasów Zheng He. Dzięki handlowi, migracjom i działalności misyjnej stale się rozrastają. W tych mrocznych czasach islam oferuje pocieszenie i stabilność społecznościom, które nie mogą już liczyć na ochronę ze strony państwa. Mieszkańcy prowincji [maj_sunni_province.GetName] w dużej mierze przyjęli sunnizm, odchodząc od tradycyjnego hinduizmu i buddyzmu."
 majapahit.10.a: "Ośmielają się porzucać naszych bogów?"
 maj_harmed_trade_relations: "Pogorszone stosunki handlowe"
 desc_maj_harmed_trade_relations: "Odmówiliśmy muzułmańskim kupcom, którzy chcieli z nami handlować. Pozostaliśmy w gospodarczej izolacji."
 fall_of_majapahit: "Upadek Majapahitu"
 desc_fall_of_majapahit: "Utraciliśmy niemal całe niegdyś chwalebne Imperium Majapahitu, a to, co pozostało, jest niebezpiecznie bliskie całkowitego upadku."
 grow_cloves_in_zanzibar_title: "Uprawa goździków na Zanzibarze"
 grow_cloves_in_zanzibar_desc: "Odkryliśmy, że goździki, cenny towar handlowy występujący obecnie tylko na Wyspach Korzennych, mogą być uprawiane na wyspie Zanzibar u wybrzeży Afryki."
 MAJ_ideas: "Idee Majapahitu"
 MAJ_ideas_start: "Tradycje Majapahitu"
 MAJ_ideas_bonus: "Ambicja Majapahitu"
 maj_restore_candi: "Odbudowa świątyń Candi"
 maj_restore_candi_desc: "Na obszarze całej Nusantary rozsiane są świątynie znane jako candi. Powinniśmy odbudowywać je wszędzie tam, gdzie je znajdziemy, aby odnowić wiarę naszego ludu."
 maj_gajah_madas_oath: "Przysięga Gajah Mady"
 maj_gajah_madas_oath_desc: "Gajah Mada, wielki mąż stanu i dowódca z czasów złotego wieku Majapahitu, przysiągł nie spożywać żadnych przypraw, dopóki nie podbije całej Nusantary. Jego dążenie do jedności i podbojów wciąż żyje w odrodzonym imperium Majapahitu."
 maj_majapahit_armada: "Armada Majapahitu"
 maj_majapahit_armada_desc: "Majapahit niegdyś władał morzami dzięki potężnej armadzie, w której służyły między innymi wielkie dżongi. Musimy pozostać wierni naszym tradycjom morskim i przywrócić flocie dawną świetność."
 maj_reformed_bhattara_saptaprabhu: "Zreformowana rada Bhattara Saptaprabhu"
 maj_reformed_bhattara_saptaprabhu_desc: "Tradycyjnie monarsze doradzała rada starszych członków rodziny królewskiej. Nadszedł czas, by zreformować tę instytucję i dopuścić do niej najzdolniejszych mężów stanu imperium."
 maj_nusantara_tributaries: "Państwa trybutarne Nusantary"
 maj_nusantara_tributaries_desc: "U szczytu potęgi mieliśmy niezliczonych poddanych trybutarnych w całej Nusantarze. Przyznawaliśmy im znaczną autonomię, o ile płacili daniny i nie podważali naszej hegemonii."
 maj_maritime_silk_road: "Morski Jedwabny Szlak"
 maj_maritime_silk_road_desc: "Zanim nadeszły nasze kłopoty, Majapahit kontrolował rozległą i dochodową sieć handlową, którą jedwab i przyprawy przewożono ze wschodu na zachód. Gdy odzyskamy imperium, ponownie obejmiemy nad nią pieczę."
 maj_nusa_tenggara: "Kolonie Nusa Tenggara"
 maj_nusa_tenggara_desc: "Majapahit niegdyś władał dziesiątkami drobnych królestw i plemion Nusa Tenggara na wschodzie, a także odleglejszymi obszarami Moluków i Celebesu. W odrodzonym imperium powinniśmy działać bardziej bezpośrednio i zakładać kolonie na tych wyspach."
