l_english:
 desc_japan_increased_demand_of_spice: "Nasi poddani rozsmakowali się w przyprawach, dlatego zwiększyliśmy ich produkcję, aby zaspokoić rosnący popyt."
 desc_japan_increased_demand_of_tea: "Nasi poddani rozsmakowali się w herbacie, dlatego zwiększyliśmy jej produkcję, aby zaspokoić rosnący popyt."
 desc_jap_onna_musha_modifier: "Kobiety z klasy wojowników samurajów chętnie służą nam w bitwie."
 desc_mch_nurhaci_ruler_reforms_modifier: "Reformy administracyjne naszego chwalebnego przywódcy, Nurhaczego, staną się fundamentem naszego wspaniałego imperium na całe stulecia."
 desc_mch_nurhaci_general_reforms_modifier: "Reformy wojskowe naszego chwalebnego przywódcy, Nurhaczego, staną się fundamentem naszego wspaniałego imperium na całe stulecia."
 desc_mch_nurhaci_advisor_reforms_modifier: "Reformy biurokratyczne naszego chwalebnego przywódcy, Nurhaczego, staną się fundamentem naszego wspaniałego imperium na całe stulecia."
 desc_mch_seven_grievances_declaration_modifier: "Cesarze Chin zbyt długo trzymali nasz lud pod swoim butem. Dziś kończy się złe traktowanie ze strony naszych południowych sąsiadów!"
 desc_mch_studied_korea_alphabet_modifier: "Podboje nie są obce naszemu sposobowi życia. Jeśli jednak chcemy zbudować trwałe imperium, musimy poznawać ludy, które sobie podporządkowujemy, i wykorzystywać zdobytą wiedzę do realizacji naszych celów wojskowych i politycznych."
 desc_mch_hyang_yak_system_modifier: "Zwycięstwa na polu bitwy to tylko jeden z elementów podporządkowania sobie wrogów. Aby sprawnie zarządzać naszymi koreańskimi poddanymi, musimy wprowadzić system umów i przyznać im pewien zakres autonomii lokalnej w zamian za wyższe podatki."
 desc_mch_hopae_system_modifier: "Wykorzystajmy nasze rezerwy ludzkie na wzór dynastii Joseon, ucząc się od niej skutecznych metod."
 desc_mch_kyujanggak_modifier: "Badania koreańskich uczonych oświecą nas i przyczynią się do rozwoju rodzimych nurtów myślowych."
 desc_mch_forced_integration_modifier: "Nie możemy pozwolić, by nasi dawni wrogowie rozwijali się w ramach naszego państwa bez przyjęcia naszych obyczajów."
 desc_qng_high_qing_era_modifier: "W tej epoce cesarze dynastii Qing cieszyli się niezwykłym dobrobytem. Nasze panowanie nad Chinami zostało ugruntowane, a nam sprzyja błogosławieństwo Niebios."
 desc_qng_subjugation_of_burma_modifier: "Birma, wspaniała i prestiżowa kraina granicząca z naszymi południowymi ziemiami, znajduje się teraz całkowicie w naszym władaniu!"
 desc_no_road_maintenance_modifier: "Drogi w naszym państwie są w opłakanym stanie. Transport towarów został poważnie utrudniony."
 desc_shared_prosperity_modifier: "Dzięki sprawnej infrastrukturze towary i dobrobyt mogą być łatwo rozprowadzane po całym kraju."
 desc_embarassing_display_modifier: "Żenujący występ naszego władcy na dworze nie zostanie szybko zapomniany."
 desc_great_reputation_modifier: "Nasi najemnicy słyną z honorowego postępowania, a nie z brutalności i grabieży, które niestety są tak powszechne wśród ich kompanów."
 desc_shift_on_military_affairs_modifier: "Zmodyfikowaliśmy sposób prowadzenia spraw wojskowych, przez co nasi najemnicy stali się mniej niezawodni."
 desc_fra_improved_court_houses_modifier: "Nasze starania na rzecz usprawnienia lokalnej administracji sprawiły, że sądy stały się wzorem efektywności."
 desc_mng_appeased_the_eunuchs_modifier: "Potężne stronnictwa eunuchów na naszym dworze na razie popierają nasze decyzje administracyjne."
 desc_mng_upset_eunuchs_modifier: "Potężne stronnictwa eunuchów na naszym dworze na razie nie popierają naszych decyzji administracyjnych."
 desc_mng_tranquil_mil_modifier: "Dowództwo wojskowe harmonijnie współpracuje ze sprawami pałacu, nad którymi pieczę sprawują najbardziej wpływowi eunuchowie."
 desc_mng_palatial_disorganization_modifier: "Sprawy pałacowe cechuje skrajna dezorganizacja, co osłabia naszą kontrolę nad władzą."
 desc_mng_efficient_governance_modifier: "Nasze ostatnie decyzje dotyczące funkcjonowania administracji pozytywnie wpływają na sprawy wewnętrzne państwa."
 desc_mng_inefficient_governance_modifier: "Nasze ostatnie decyzje dotyczące funkcjonowania administracji negatywnie wpływają na sprawy wewnętrzne państwa."
 desc_mng_restored_meritocratic_procedures_modifier: "Nasz lud z dumą stoi pod sztandarem merytokracji, na którym opiera się nasze państwo."
 desc_mng_fall_of_meritocracy_modifier: "Sprawy pałacowe poważnie cierpią z powodu wewnętrznej dezorganizacji i nielojalności doradców."
 desc_mng_heavens_favor_modifier: "Niebiosa sprzyjają naszemu Cesarzowi, zapewniając mu wskazówki i legitymizację wśród stronnictw."
 desc_mng_imperial_fall_from_grace_modifier: "Niebiosa nie pochwalają drogi obranej przez naszego Cesarza. Nadchodzą ciężkie czasy!"
 desc_mng_eunuch_privileges_modifier: "Silna grupa eunuchów stojąca po stronie Cesarza z pewnością pomoże w zwalczaniu korupcji."
 desc_mng_the_puppetmaster_modifier: "Nasze zabiegi dyplomatyczne i kunszt negocjacyjny przyniosły znakomite rezultaty. Potrafimy skutecznie żądać trybutu od poddanych i utrzymywać ich w posłuszeństwie."
 desc_estate_jains_development_of_cities_mod: "Rozwój naszych ziem ma kluczowe znaczenie dla dobrobytu naszego wielkiego państwa."
 desc_eng_the_two_houses: "[Root.GetParliamentOrFallbackName] państwa [Root.GetAdjective] jest podzielony między Izbę Lordów a Izbę Gmin. Zjednanie sobie obu tych potężnych izb pozwala nam sprawniej rozstrzygać najpilniejsze sprawy państwa."
 desc_eng_order_of_chivalry: "Zakon Rycerski wywodzi swoje inspiracje z katolickich zakonów wojskowych epoki krucjat. Zakon [Root.GetAdjective] ma jednak charakter dworski i obecnie stanowi przede wszystkim symbol statusu szlachty ceniącej honor i rycerskie cnoty."
 desc_eng_jousting_tournaments: "Początkowo turnieje rycerskie były ćwiczeniami wojskowymi, lecz rozwój zbroi i technik walki na kopie przekształcił je w widowiskową rozrywkę dla pospólstwa.\\n§YTrwa do końca epoki odkryć.§!"
 desc_gbr_pax_britannica: "Dokądkolwiek sięgnąć wzrokiem na mapie, wszędzie widać potęgę Brytanii. Nasze imperium nie ma sobie równych, a jego mieszkańcy cieszą się wolnością, bezpieczeństwem i stabilnością. Oto prawdziwa Pax Britannica."
 desc_ave_pax_angevina: "Dokądkolwiek sięgnąć wzrokiem na mapie, wszędzie widać potęgę imperium Andegawenów. Nasze imperium nie ma sobie równych, a jego mieszkańcy cieszą się wolnością, bezpieczeństwem i stabilnością. Oto prawdziwa Pax Angevina."
 desc_jap_firearm_production_modifier: "Produkujemy stałe dostawy broni palnej, co dodatkowo napędza naszą gospodarkę."
 desc_fra_reintegration_of_burgundian_lands_modifier: "Ponowne włączenie ziem Korony Burgundzkiej do naszego państwa z pewnością przyniesie znaczne korzyści administracyjne."
 desc_fra_victory_germany_modifier: "Odnieśliśmy zwycięstwo w naszych staraniach o rozgromienie niemieckich wrogów!"
 desc_fra_french_buffer_modifier: "Prowincje na wschodnich rubieżach naszego państwa są pilnie strzeżone i umocnione, tworząc osłonę przed wrogami."
 desc_fra_imperial_messengers_modifier: "Nasi dyplomaci posługują się cesarskim glejtem, dzięki czemu mogą bez przeszkód prowadzić sprawy dyplomatyczne na całym obszarze naszego państwa."
 desc_fra_french_canadian_settlers_modifier: "Nasze próby zasiedlenia nowych ziem przyniosą ogromne korzyści, gdy tylko utworzymy tam państwa kolonialne."
 desc_fra_overseas_focus_modifier: "Handel to dochodowe przedsięwzięcie. Opanowaliśmy sztukę zawierania korzystnych transakcji i możemy liczyć na pokaźne zyski."
 desc_fra_masters_of_india_modifier: "Bogactwa jednego z najzamożniejszych subkontynentów świata znajdują się teraz w naszym zasięgu."
 desc_fra_compagnie_francaise_modifier: "W tym miejscu znajduje się jedna z najważniejszych i najbardziej zaawansowanych technologicznie manufaktur w Indiach."
 desc_fra_growth_appanages: "Silni i lojalni wasale oraz książęta oznaczają silnego i stabilnego króla Francji."
 desc_fra_increased_crown_authority_modifier: "Epoka rozdrobnionej Francji powoli dobiega końca..."
 desc_fra_catholic_supremacy_modifier: "Katolicyzm odniósł triumf. Nasza wiara jest świetlistym wzorem moralności i wytrwałości."
 desc_fra_heart_of_protestantism_modifier: "Jesteśmy bastionem protestantyzmu, gotowym wyplenić herezję szerzoną przez inne nieprawowite wyznania."
 desc_fra_moderate_path_modifier: "Droga do zbawienia wymaga tolerancji i zrozumienia. Dlatego obejmiemy naszym społecznym porządkiem wyznawców wszystkich religii i ludzi wszelkiego pochodzenia."
 desc_fra_iberian_domination_modifier: "Nasze zwycięstwa w walce o Półwysep Iberyjski skłoniły naszą armię do przejęcia najlepszych rozwiązań hiszpańskich sił zbrojnych i dalszego ich udoskonalenia."
 desc_fra_elite_guard_modifier: "Nasza gwardia rewolucyjna jest niezwykle zdyscyplinowana."
 desc_fra_mass_guard_modifier: "Postępy w zakresie rozmieszczania wojsk i zaopatrzenia sprawią, że nasza Gwardia stanie się niezwykle skuteczną formacją."
 desc_fra_vanguard_guard_modifier: "Gwardia Królewska stanowi awangardę naszego władcy i chroni go przed wszelkimi zagrożeniami."
 desc_fra_professional_guard_modifier: "Dobrze wyszkolone oddziały stanowią podstawę każdej zwycięskiej armii."
 desc_fra_trained_revolutionary_guard1_modifier: "Nieustanne ćwiczenia naszych sił zbrojnych przyniosły znaczne korzyści w zakresie dyscypliny wojskowej i profesjonalizmu."
 desc_fra_trained_revolutionary_guard2_modifier: "Nieustanne ćwiczenia naszych sił zbrojnych przyniosły znaczne korzyści w zakresie dyscypliny wojskowej i profesjonalizmu."
 desc_fra_rightful_emperor_of_italy_modifier: "Nasze starania o przywrócenie Włoch pod opiekę Świętego Cesarstwa Rzymskiego przyniosły znakomite rezultaty."
 desc_fra_franco_iberian_cooperation_modifier: "Bliskie więzi z naszymi iberyjskimi braćmi stanowią siłę napędową, która wyniesie oba nasze wielkie państwa na szczyty prestiżu i nieprzemijającej chwały."
 desc_fra_light_of_catholicism_modifier: "Nasza pozycja w Stolicy Apostolskiej zapewniła nam ogromne wpływy u Ojca Świętego."
 desc_fra_colonial_rush_modifier: "Nowy Świat naprawdę istnieje! Nasi ludzie ruszają, by kolonizować i ujarzmiać te obce ziemie, obiecujące wielkie bogactwa."
 desc_fra_hudson_bay_fur_modifier: "Futra pochodzące z chłodniejszych regionów Nowego Świata odznaczają się wyjątkową jakością."
 desc_fra_french_bombards_modifier: "Nasza artyleria oblężnicza przełamie każdy opór w walce o wyzwolenie naszych ziem i ochronę naszego ludu."
 desc_fra_proper_legal_systems_modifier: "Państwo tak rozległe i bogate jak nasze potrzebuje odpowiedniego, sprawnie działającego systemu prawnego."
 desc_fra_napoleonic_warfare_modifier: "Szybkie rozmieszczanie wojsk, manewry i przytłaczająca siła ognia to niektóre z cech sztuki wojennej naszych czasów."
 desc_fra_subjugation_of_the_germans_modifier: "Nasi wrogowie znaleźli się pod naszym panowaniem, a ich administracje zostały trwale włączone do naszej własnej struktury."
 desc_fra_french_supremacy_modifier: "Francuski sztandar góruje nad wszystkimi innymi potęgami Europy. Nikt nie ośmieli się podważyć naszej potęgi."
 desc_fra_church_and_state_harmony_modifier: "Nasza administracja ściśle współpracuje z duchowieństwem państwa, tworząc harmonijny i wzajemnie korzystny układ."
 desc_fra_popularization_of_secular_beliefs_modifier: "Świeckie poglądy zdobyły silną pozycję w naszym społeczeństwie."
 desc_center_mil_matters_strategy_modifier: "To miejsce stanowi centrum naszych działań wojskowych: kształcą się tu zdolni generałowie, a rozkazy logistyczne są stąd rozsyłane po całym państwie."
 desc_fra_iron_crowned_modifier: "Nasz władca niepodzielnie góruje nad pokonanymi przeciwnikami."
 desc_fra_venetian_craftsmanship_modifier: "Umiejętności weneckich szkutników będą służyć francuskiemu dworowi królewskiemu."
 desc_fra_roi_palace_triggered_modifier: "Francuska letnia rezydencja królewska w Wenecji została ozdobiona wspaniałym pałacem, marmurem i dziełami sztuki, stanowiącymi pokaz potęgi, kontroli i królewskiego majestatu."
 desc_fra_roi_palace_modifier: "Francuska letnia rezydencja królewska w Wenecji została ozdobiona wspaniałym pałacem, marmurem i dziełami sztuki, stanowiącymi pokaz potęgi, kontroli i królewskiego majestatu."
 desc_fra_coronated_by_the_pope_modifier: "Nasz władca został koronowany przez samego Ojca Świętego, zyskując legitymizację i prestiż."
 desc_fra_golden_march_modifier: "Włochy słusznie należą do Korony Francuskiej!"
 desc_fra_golden_march2_modifier: "Włochy słusznie należą do Korony Francuskiej!"
 desc_fra_french_cloth_centers_modifier: "Ośrodki produkcji sukna w naszym państwie słyną z wysokiej jakości tkanin i ogromnej skali produkcji."
 desc_fra_channel_dominance_modifier: "Nasza dominacja nad kanałem La Manche przyniosła ogromne korzyści finansowe i stała się punktem wyjścia do dalszego wzmacniania naszej obecności na morzu."
 desc_fra_letat_cest_moi_modifier: "Państwo to ja!"
 desc_fra_absolutism_modifier: "Państwo to ja!"
 desc_fra_french_industrial_revolution_modifier: "Opanowanie zdobyczy rewolucji przemysłowej wyniosło nasze wielkie państwo na czoło postępu technologicznego i metod produkcji fabrycznej."
 desc_fra_canal_royal_en_languedoc_modifier: "Ta prowincja jest częścią rozbudowanej sieci kanałów i dróg wodnych, dzięki czemu czerpie znaczne korzyści handlowe."
 desc_fra_metal_barons_modifier: "Prowincja znajduje się pod zarządem lokalnych przedsiębiorców, których celem jest zwiększanie produkcji i efektywności."
 desc_fra_riches_of_italy_modifier: "Bogactwa Włoch pomogą nam zrealizować nasze ambicje."
 desc_fra_stable_currency_modifier: "Niestabilność wywołana rewolucją została zażegnana dzięki wprowadzeniu stabilnej waluty."
 desc_fra_code_napoleon_modifier: "Kodeks Napoleona ma na celu usprawnienie infrastruktury wewnętrznej i poprawę warunków życia naszego ludu."
 desc_fra_strong_familial_ties_modifier: "Silne więzi łączące nas z poddanymi pozwolą nam wymagać od nich większego wsparcia i zapewnić ich bezwzględne posłuszeństwo."
 desc_fra_kingdom_sea_modifier: "Podbój Neapolu w połączeniu z naszymi działaniami handlowymi przyniósł znakomite rezultaty!"
 desc_fra_host_city_of_lights_modifier: "Jesteśmy teraz dumnymi obrońcami i właścicielami Miasta Świateł!"
 desc_fra_supplementary_pi_and_dip_rep_modifier: "Nasza kontrola nad Miastem Świateł zapewnia nam ogromne wpływy w kurii."
 desc_fra_catholic_head_of_state_modifier: "Nasza głowa państwa korzysta z wyjątkowego traktowania i szczególnych względów ze strony kurii."
 desc_fra_fervent_call_to_arms_modifier: "Nasza wiara napędza działania rekrutacyjne prowadzone przez wojsko."
 desc_fra_entry_in_italy_modifier: "Podbijając bogate ziemie Italii, musimy postępować ostrożnie. Nasi dyplomaci nieustannie pracują nad uzasadnieniem naszych działań wojskowych."
 desc_fra_influx_of_milanese_engineers_modifier: "Niedawny podbój ziem mediolańskich sprawił, że do naszych miast napływa coraz więcej wybitnych umysłów."
 desc_fra_first_opera_house_modifier: "Narodziny opery jako hołdu dla potęgi i narzędzia legitymizacji władzy królewskiej dają monarchom potężny instrument, a ludowi źródło kultury i rozrywki."
 desc_fra_catholic_italy_modifier: "Katolicyzm jest najżywotniejszą religią Italii. Pod naszą opieką będzie się rozwijał i rozkwitał!"
 desc_fra_suzerainty_italy_modifier: "Podporządkowanie sobie Italii otwiera drogę do wielu możliwości, które niektórzy uznaliby za... nienaturalne."
 desc_fra_golden_march3_modifier: "Włochy słusznie należą do Korony Francuskiej!"
 desc_fra_leonardo_workshop_modifier: "W tym miejscu znajduje się pracownia jednego z najsłynniejszych twórców renesansu – Leonarda da Vinci."
 desc_fra_centralized_commerce_modifier: "Centralizacja naszych działań handlowych doprowadzi do powstania silniejszych ośrodków wymiany."
 desc_fra_cabinet_reforms_modifier: "Reforma gabinetu odnowiła zainteresowanie reformami politycznymi i przyspieszyła proces integracji ziem w całym naszym państwie."
 desc_fra_economic_reforms_modifier: "Udało nam się podporządkować sobie prowincję i przeprowadzić liczne plany rozwoju miast."
 desc_fra_colbert_trade_reforms_modifier: "Reformy handlowe Colberta znacząco zwiększą nasze możliwości finansowe."
 desc_fra_colbert_naval_reforms_modifier: "Reformy morskie Colberta znacząco zwiększą nasze możliwości na morzu."
 desc_fra_increased_naval_capacity_modifier: "Niedawna rozbudowa infrastruktury pozytywnie wpłynęła na potencjał naszej floty."
 desc_fra_studying_dutch_naval_conduct_modifier: "Jeśli chcemy zapanować nad morzami, musimy poznać zagraniczne zasady prowadzenia działań morskich."
 desc_fra_funded_reforms_of_condorcet_modifier: "W epoce oświecenia finansowanie sztuki i nauki świadczy o dobrobycie oraz intelektualnej dojrzałości społeczeństwa."
 desc_fra_conquered_the_capetian_house_of_anjou_modifier: "Ród Andegawenów został już w pełni zintegrowany z naszym państwem. Jego niezgłoszone roszczenia pomogą złagodzić napięcia wywołane naszymi podbojami."
 desc_fra_resurgence_of_crusader_fervor_modifier: "Po raz kolejny rozbrzmiewają dzwony, wzywając do odrodzenia armii krzyżowców!"
 desc_fra_italian_wars_modifier: "Niestabilność, która ogarnęła Italię, stwarza doskonałą okazję do włączenia jej ziem do naszego państwa."
 desc_fra_sword_of_christianity_modifier: "Jesteśmy dumnymi obrońcami naszej wiary!"
 desc_fra_sword_of_christianity_modifier2: "Jesteśmy dumnymi obrońcami naszej wiary!"
 desc_fra_sword_of_christianity_modifier3: "Jesteśmy dumnymi obrońcami naszej wiary!"
 desc_fra_sword_of_christianity_modifier4: "Jesteśmy dumnymi obrońcami naszej wiary!"
 desc_fra_sword_of_christianity_modifier5: "Jesteśmy dumnymi obrońcami naszej wiary!"
 desc_fra_support_of_the_french_crown_modifier: "Korzystamy ze wsparcia Korony Francuskiej."
 desc_fra_provincial_road_system: "Rozbudowana sieć dróg i infrastruktury usprawnia komunikację, transport oraz wymianę handlową."
 desc_fra_developing_urban_center_modifier: "Gęsto zaludnione ośrodki miejskie są żywotnymi ogniwami łączącymi nasze wielkie państwo."
 desc_fra_trade_fair_prosperity_modifier: "Dobrobyt rozprzestrzeniający się po naszym kraju dzięki licznym jarmarkom handlowym pozytywnie wpływa na zamożność niższych warstw społecznych."
 desc_fra_french_dockyard_industry_modifier: "Francuski przemysł stoczniowy i szkutniczy będzie główną siłą napędową naszych planów ekspansji morskiej."
 desc_fra_toulon_dockyards_modifier: "Jeden z najsłynniejszych arsenałów morskich, Tulon, będzie z dumą służył naszej flocie!"
 desc_fra_naval_due_diligence_modifier: "Nasze wysiłki na rzecz modernizacji floty przyniosły oczekiwane rezultaty!"
 desc_fra_french_naval_dominance_modifier: "Rozgromienie wrogów zapewniło nam niekwestionowaną dominację na morzach!"
 desc_fra_trade_hegemony_modifier: "Nasze państwo obejmuje najpotężniejsze i najbardziej dochodowe rynki handlowe na całym świecie."
 desc_fra_replenished_slave_crews_modifier: "Zatrudniając doświadczone załogi niewolników na naszych okrętach, zapewniamy sobie nieprzerwane dostawy marynarzy."
