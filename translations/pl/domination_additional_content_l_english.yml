 desc_tur_city_of_faiths: "[This.GetName] jest ważnym miejscem świętym dla wielu religii. Jako jedno z nielicznych miejsc otwiera swoje bramy dla wyznawców wszystkich religii pragnących odbyć pielgrzymkę do [This.GetName]."
