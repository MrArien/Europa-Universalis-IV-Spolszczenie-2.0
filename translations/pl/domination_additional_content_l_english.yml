 desc_acts_of_taxation_parliament: "[Root.GetParliamentOrFallbackName] podjął decyzję: obywatele państwa [Root.GetUsableName] będą płacić nam podatki bez względu na miejsce zamieszkania. Obowiązek podatkowy obejmie nawet najodleglejsze kolonie Korony [Root.GetAdjective]."
 desc_act_of_representation_parliament: "Zamorskie kolonie odmawiają płacenia nam danin, dopóki nie zapewnimy im właściwej reprezentacji w parlamencie. [Root.GetParliamentOrFallbackName] postanowił przyznać naszym koloniom dodatkowe miejsca. Choć koszty tych zmian równoważą dodatkowe wpływy podatkowe, przynajmniej zapewniają lojalność naszych poddanych."
 desc_military_reassignment_act_modifier: "Nasze wojska lądowe pilnie potrzebują dodatkowego wsparcia ogniowego. Przenosimy do armii marines i marynarzy naszej floty, którzy dobrze posługują się bronią palną, aby zwiększyć nasze zdolności bojowe."
 desc_acts_of_development_modifier: "Biurokracja odpowiedzialna za integrację poddanych nie jest nam już potrzebna. W związku z tym [Root.GetParliamentOrFallbackName] postanowił powierzyć naszej administracji zadania związane z rozwojem wewnętrznym państwa."
 desc_global_empire_act_modifier: "Kolonizacja Nowego Świata nie ma już znaczenia dla naszego [Root.GovernmentName]. Zamiast tego musimy skupić się na rozbudowie globalnego imperium poprzez podboje."
 desc_naval_reassignment_act_modifier: "[Root.GetParliamentOrFallbackName] podjął decyzję: żołnierze wojsk lądowych zostaną przeniesieni do służby na pokładach naszej wielkiej floty."
 desc_diplomatic_act_modifier: "Zgodnie z decyzją [Root.GetParliamentOrFallbackName] nasi żołnierze będą służyć ojczyźnie jako dyplomaci i ambasadorowie na obcej ziemi."
 desc_internal_focus_act_modifier: "Nasza administracja została skierowana na rozbudowę infrastruktury wewnętrznej. Integracja nowych prowincji znacznie zwolni, ponieważ priorytetem będzie rozwój ziem macierzystych."
