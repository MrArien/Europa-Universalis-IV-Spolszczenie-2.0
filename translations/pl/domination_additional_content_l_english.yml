 desc_decline_of_the_ottomans: "Nasze wielkie państwo [Root.GovernmentName] należy do światowych potęg. Kształtowaliśmy świat i zapisaliśmy się w historii, która nigdy o nas nie zapomni.\\nJednak wielkie sukcesy zrodziły samozadowolenie. Osiągnięcia naszych przodków zaczęto traktować jak coś oczywistego. [Root.GetUsableName] musi zmierzyć się z rzeczywistością, w której własna administracja i elity zagrażają przetrwaniu państwa."
 desc_kor_expanded_capital: "Administracja i infrastruktura prowincji [This.GetName] są perłą [Owner.GetAdjective] [Owner.GovernmentName]."
 desc_rus_western_military_tactics: "Nasza armia studiowała zagraniczne taktyki wojenne. Dostosowaliśmy również szkolenie żołnierzy do tych strategii, znacznie podnosząc ogólną jakość naszych wojsk w walce."
 desc_eng_reformer_ruler_for_catholic_gb: "§YModyfikator ten obowiązuje do końca epoki reformacji lub do chwili, gdy przestaniemy być chrześcijanami.§!"
