 desc_aristocratic_rule_act: "Rządy arystokracji w naszym państwie wzmocnią władzę królewską."
 desc_plutocratic_rule_act: "Rządy plutokracji w naszym państwie wzmocnią władzę centralną."
 desc_theocratic_rule_act: "Rządy teokracji w naszym państwie przysłużą się władzy królewskiej."
 desc_head_of_state_act: "Nasze przywiązanie do papierowych dóbr złagodzi ból i żal po stracie ukochanego przywódcy."
 desc_zealous_court_act: "Dwór naszego państwa potrafi rozbudzać żarliwość religijną i zapał do podbojów."
 desc_financial_miracle_act: "Zatrudniając doradców wywodzących się z naszego ludu, z pewnością dokonamy cudu w dziedzinie polityki podatkowej."
 desc_subject_obligations_act: "Mistrzowsko wykorzystujemy naszą zdolność do nakładania ceł na kolonie i jednoczesnego tłumienia ich nadziei na niepodległość."
 desc_big_government_act: "Naukowo dowiedziono, że rozbudowane rządy są znacznie skuteczniejsze od małych. Potwierdza to również sprawność naszej własnej administracji."
 desc_humanitarian_administration_act: "Radykalny pomysł poszanowania tradycji i kultur podbitych ludów może przynieść nam długofalowe korzyści."
 desc_blessed_construction_act: "Zatrudniając kapłanów do błogosławienia i poświęcania terenów budowy, zyskujemy podstawę do żądania zniżek od wykonawców i robotników."
 desc_military_innovation_act: "Dobrobyt? Medycyna? Rozwój kultury? Nie – przede wszystkim musimy finansować przemysł wojenny, aby chronić się przed sąsiadami dzięki przewadze ogniowej i podbojom."
 desc_efficient_war_taxes_act: "Gdy nasi chłopi i robotnicy mówią „Dość!” w sprawie podatków, my słyszymy „Jeszcze więcej!”. Dzięki tej metodzie zwiększymy wpływy skarbca i sfinansujemy kolejne kontrakty kondotierów. Korzyść dla wszystkich!"
 desc_peace_keeping_force_act: "Mamy dane nam przez Boga prawo do zapewnienia stabilności państwa i pokojowego tłumienia wszelkich możliwych buntów."
 desc_indigenous_development_act: "Budowa sieci dróg przyniesie korzyści społeczeństwu, w którym żyjemy."
 desc_mercenary_registration_act: "Prowadzenie pisemnej ewidencji płatności i konwojów zaopatrzeniowych dla naszych najemników może rzeczywiście ograniczyć wydatki."
 desc_innovative_payment_techniques_act: "A gdybyśmy zatrudniali tych samych najemników, ale po prostu płacili im mniej? Cóż za nowatorski pomysł!"
 desc_plutocratic_ethos_act: "Nasza republika opiera się na silnym etosie oraz całkowitym braku nepotyzmu i zakulisowych układów."
 desc_clan_unity_act: "Nasze wielkie plemię przetrwa próbę czasu i będzie budzić mniejszy strach, jeśli umiejętnie wykorzystamy naszą potęgę i wystawny dwór."
 desc_the_spy_network_act: "Przyznając naszym szpiegom i dyplomatom specjalne przepustki, zwiększymy skuteczność naszych tajnych działań."
 desc_the_smooth_integration_act: "Przemawiając spokojnie i powoli, zdołamy złagodzić warunki integracji związane z aneksją państw unijnych."
 desc_global_trade_networks_act: "Obecność naszych sieci handlowych za morzami pozytywnie wpłynie na stan naszych finansów."
 desc_colonial_boost_act: "Nasi doradcy popierają teorię, że wysyłając więcej ludzi do kolonii, zwiększymy ich zaludnienie, a tym samym produkcję towarów i wpływy podatkowe."
 desc_sailor_efficiency_act: "Rozwój infrastruktury morskiej i konstrukcji okrętów pozwolił nam ograniczyć liczbę marynarzy na statkach oraz obniżyć koszty ich napraw i utrzymania."
 desc_diplomatic_consolidation_act: "Dyplomatyczne fortele i przysługi pozwolą nam rozpocząć szeroko zakrojoną kampanię roszczeń, rozciągając nasze prawowite pretensje od jednego krańca świata po drugi."
 desc_centralization_power_act: "Z pewnością poradzilibyśmy sobie lepiej, gdyby cała władza skupiła się w rękach naszego ukochanego przywódcy. Najbliżsi doradcy nie mają co do tego wątpliwości."
 desc_loyal_conduct_act: "Grupa lojalnych szpiegów ochroni nasze państwo przed zagrożeniami zarówno wewnętrznymi, jak i zewnętrznymi."
 desc_diplomatic_arms_act: "Musimy wywierać presję na inne państwa i pokojowo narzucać im nasze interesy."
 desc_merchants_hire_act: "Koncentrując wysiłki morskie na silnej obecności handlowej, sprawimy, że nasze okręty staną się znacznie cenniejsze."
 desc_transportation_act: "Nasi doradcy wpadli na znakomity pomysł wykorzystania floty. Budując solidne środki transportu morskiego, ograniczymy liczbę nieszczęśników ginących podczas podróży, a zamiast tego wykorzystamy ich jako korsarzy, by mogli zginąć od kul armatnich, a nie z wycieńczenia. Cóż za wspaniały plan!"
 desc_maritime_expertise_act: "Przenosząc więcej najemnego mięsa armatniego z armii do floty, wzmocnimy piechotę morską i jednocześnie obniżymy koszty obsadzania okrętów."
 desc_client_state_act: "Zmysł handlowy naszego władcy podczas negocjacji zapewni nam nie tylko większe kontyngenty wojskowe od poddanych, lecz także nowe rodzaje państw zależnych. Cóż za czasy!"
 desc_native_emissaries_act: "Przekazując za pośrednictwem wysłanników nasze zamiary wyniszczenia sąsiadów, z pewnością napotkamy mniejszy opór ze strony pozostałych państw ościennych."
 desc_mobile_siege_engines_act: "Nasza infrastruktura pozwoli szybciej rozmieszczać machiny oblężnicze i zadawać jeszcze potężniejsze ciosy murom wrogów, którym z pewnością się to należy."
 desc_bolstered_defence_act: "Sieć dróg wokół naszych fortyfikacji pozwoli obsadzić zamki niespotykaną dotąd liczbą garnizonów."
 desc_handpicked_recruits_act: "Jeśli zaczniemy wybierać dowódców na podstawie zasług, a nie przysług czy więzów krwi, jakość naszej armii może wzrosnąć – twierdzą niektórzy doradcy."
 desc_mass_conscription_act: "Budowa lepszych dróg łączących miasta i wsie z ośrodkami poboru zwiększy liczbę ochotników gotowych zginąć dla chwały naszego państwa."
 desc_naval_armament_act: "Nasi doświadczeni szkutnicy potrafią nie tylko sprawnie organizować wodowanie okrętów, lecz także wykorzystywać wysokiej jakości materiały, dzięki czemu jednostki są szybsze."
 desc_mercenary_tactical_movement_act: "Ćwiczenia taktyczne i sprawne manewrowanie naszych najemników uczynią z nich siłę, z którą należy się liczyć."
 desc_universal_serfdom_act: "Według naszej szlachty całkowite podporządkowanie chłopstwa to znakomity pomysł, który należy wprowadzić w całym państwie."
 desc_gentle_conquest_act: "Rewolucyjny pomysł, by po podboju nie pustoszyć doszczętnie ziem wroga, może okazać się kluczowy, jeśli chcemy zachować tam jakąkolwiek infrastrukturę."
 desc_sharp_wits_act: "Jeśli chodzi o nasz kunszt dyplomatyczny, pióro rani mocniej niż miecz."
 desc_sturdy_argument_act: "Przedstawiając rzeczowe argumenty i fakty uzasadniające nasze podboje, z pewnością zmniejszymy podejrzliwość sąsiadów i uspokoimy własne wojska."
 desc_special_forces_act: "Wysłanie specjalnych, doskonale wyszkolonych żołnierzy zwiększy nasze możliwości prowadzenia wojny i potencjał militarny."
 desc_plentiful_materials_act: "Na naszych ziemiach miedź i żelazo są tanie i łatwo dostępne. Finansując ich wydobycie, zapewnimy sobie równie tanich i łatwych do zastąpienia rekrutów."
 desc_naval_competence_act: "Nasza dbałość o sprawy morskie zaowocowała powstaniem sprawnej floty."
 desc_dutiful_mercenaries_act: "Rekrutując żarliwych najemników i uzasadniając ich udział w wojnie prawem boskim, wzmocnimy pierwszą linię frontu i wesprzemy wysiłki na rzecz nawracania."
 desc_hired_expeditions_act: "Nie ma powodu, by nasi ludzie ginęli w obcych dżunglach pełnych nieznanych chorób i niebezpieczeństw, skoro możemy wysłać tam zdolnych, lecz kiepsko opłacanych najemników i poganiać ich batem, by maszerowali szybciej."
 defender_of_faith_1: "Obrońca Wiary"
 defender_of_faith_1_DESC: "Przysięgliśmy chronić naszych braci i siostry wyznających religię [Root.Religion.GetName] przed wszelkimi zagrożeniami."
