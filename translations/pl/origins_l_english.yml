 solomonic_empire: "Cesarstwo Solomonidów"
 solomonic_empire_legacy: "Cesarstwo Solomonidów"
 solomonic_empire_legacy_desc: "Imperium Salomonidów to reforma ustrojowa Etiopii, wprowadzana po pełnej konsolidacji państwa. Spory religijne przestają mieć znaczenie, a imperium zaczyna rozszerzać swoje wpływy na zewnątrz."
 solomonic_empire_desc: "Imperium Salomonidów to reforma ustrojowa Etiopii, wprowadzana po pełnej konsolidacji państwa. Spory religijne przestają mieć znaczenie, a imperium zaczyna rozszerzać swoje wpływy na zewnątrz."
 sacred_kingdom: "Święte królestwo"
 sacred_kingdom_legacy: "Święte królestwo"
 sacred_kingdom_desc: "Monarchia absolutna, w której władca jest nie tylko głową państwa, lecz także zwierzchnikiem religii i zostaje ubóstwiony jako bóg swojego ludu."
 sacred_kingdom_legacy_desc: "Monarchia absolutna, w której władca jest nie tylko głową państwa, lecz także zwierzchnikiem religii i zostaje ubóstwiony jako bóg swojego ludu."
 sacred_kingdom_tt: "Mieszkańcy państwa [Root.GetName] ubóstwili dynastię."
 tribal_confederacy: "Konfederacja plemienna"
 tribal_confederacy_legacy: "Konfederacja plemienna"
 tribal_confederacy_desc: "Forma rządów, w której kilku wodzów i pomniejszych królów uznaje zwierzchnictwo władzy centralnej, zachowując jednak pewien zakres wewnętrznej autonomii."
 tribal_confederacy_legacy_desc: "Forma rządów, w której kilku wodzów i pomniejszych królów uznaje zwierzchnictwo władzy centralnej, zachowując jednak pewien zakres wewnętrznej autonomii."
 tribe_remain_tribal_reform: "Utwórz zaawansowane plemię"
 tribe_remain_tribal_reform_desc: "Dzięki konsolidacji władzy nasze plemię rozwinęło sprawniejszy ustrój, który zapewnia zadowolenie ludności i utrzymuje władcę przy władzy."
