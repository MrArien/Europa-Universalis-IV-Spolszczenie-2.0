 mechanic_has_locked_government_yes: "Nie można zmienić formy rządu za pomocą reform."
 mossi_federal_kingdom: "Konfederacyjne Królestwo Mossi"
 mossi_federal_kingdom_legacy: "Konfederacyjne Królestwo Mossi"
 mossi_federal_kingdom_desc: "Królestwo Mossi nie jest jednolitym państwem, lecz konfederacją kilku mniejszych królestw Mossi, połączonych więzami pokrewieństwa, wspólnotą wojskową i obrzędami."
 mossi_federal_kingdom_legacy_desc: "Królestwo Mossi nie jest jednolitym państwem, lecz konfederacją kilku mniejszych królestw Mossi, połączonych więzami pokrewieństwa, wspólnotą wojskową i obrzędami."
 shaka_regime: "Plemię Zulusów"
 shaka_regime_legacy: "Plemię Zulusów"
 shaka_regime_desc: "Monarchia plemienna skupiona na militarnym podporządkowywaniu innych plemion i militaryzacji państwa."
 shaka_regime_legacy_desc: "Monarchia plemienna skupiona na militarnym podporządkowywaniu innych plemion i militaryzacji państwa."
 mechanic_has_federal_kingdoms_yes: "Posiada §YKrólestwa konfederacyjne§!"
 tribe_tribal_unity: "Jedność plemienna"
 tribe_tribal_unity_desc: "Życie plemienne jest naszym dziedzictwem i powinno pozostać nim na zawsze. Jesteśmy zjednoczeni niczym jedna wielka rodzina."
 matrilineal_system: "System matrylinearny"
 matrilineal_system_legacy: "System matrylinearny"
 matrilineal_system_desc: "Szczególny system dziedziczenia, w którym rzeczywista władza w państwie przechodziła na córki władcy."
 matrilineal_system_legacy_desc: "Szczególny system dziedziczenia, w którym rzeczywista władza w państwie przechodziła na córki władcy."
 musa_rule: "Rządy Musy"
 musa_rule_legacy: "Rządy Musy"
 musa_rule_desc: "Ustrój imperium Mali. Choć przypomina inne monarchie, wyróżnia się dopuszczeniem dziedziczenia matrylinearnego. Ponadto przewiduje rolę urzędników dworskich, którzy przejmują sprawy państwowe podczas panowania nieudolnych następców."
 musa_rule_legacy_desc: "Ustrój imperium Mali. Choć przypomina inne monarchie, wyróżnia się dopuszczeniem dziedziczenia matrylinearnego. Ponadto przewiduje rolę urzędników dworskich, którzy przejmują sprawy państwowe podczas panowania nieudolnych następców."
 mechanic_has_tributaries_yes: "Może posiadać §Ypaństwa trybutarne§!"
 feudal_tribe: "Plemię feudalne"
 feudal_tribe_legacy: "Plemię feudalne"
 feudal_tribe_desc: "System plemienny przypominający klasyczną monarchię feudalną. Zamiast należeć do monarchy lub jego szlachty, poddani płacą daninę władcy państwa."
 feudal_tribe_legacy_desc: "System plemienny przypominający klasyczną monarchię feudalną. Zamiast należeć do monarchy lub jego szlachty, poddani płacą daninę władcy państwa."
 great_man: "Wielki przywódca"
 great_man_legacy: "Wielki przywódca"
 great_man_desc: "System rządów przywódców plemiennych, którzy kierują kolonizacją terenów od dżungli po równiny i prowadzą wojowników swojego plemienia."
 great_man_legacy_desc: "System rządów przywódców plemiennych, którzy kierują kolonizacją terenów od dżungli po równiny i prowadzą wojowników swojego plemienia."
 estate_church_yakobs_churches: "Reforma szabatu biblijnego"
 estate_church_yakobs_churches_desc: "Negus Negest Zara Jakub zjednoczył niegdyś podzielony Kościół koptyjski, znajdując kompromis między różnymi poglądami na dni weekendu. Dzięki jego działaniom duchowieństwo wprowadziło reformę, która ułatwia nauczanie doktryny Jakuba wśród innych gorliwych wyznawców."
 estate_burghers_control_over_the_mint: "Kontrolowane wydobycie złota"
 estate_burghers_control_over_the_mint_desc: "Wydobycie złota może być bardzo dochodowe, lecz niekontrolowane kopanie może mieć katastrofalne skutki dla gospodarki. Przyznając [Root.GetBurghersName] większą bezpośrednią kontrolę nad biciem monet i wydobyciem, możemy dopilnować, by do skarbca nie trafiało jednocześnie zbyt wiele złota."
 estate_burghers_control_over_the_mint_gt: "Każda posiadana prowincja ze złożami §Yzłota§! otrzyma §R-15,0%§! modyfikatora produkcji dóbr."
 estate_burghers_control_over_the_mint_rt: "Usuń karę do produkcji dóbr ze wszystkich posiadanych prowincji ze złożami §Yzłota§!."
 estate_church_one_faith_one_culture: "Kultura religijna"
 estate_church_one_faith_one_culture_desc: "Jedność społeczeństwa można osiągnąć tylko wtedy, gdy [Root.GetClergyName] zajmują się nie tylko sprawami duchowymi, lecz odgrywają również ważniejszą rolę w kwestiach kulturowych i społecznych państwa."
 estate_church_one_faith_one_culture_gta: "Każda posiadana prowincja wyznająca religię §Y[Root.Religion.GetName]§!, należąca do grupy kulturowej §Y[Root.Culture.GetGroupName]§! lub posiadająca §Yakceptowaną kulturę§!, otrzyma modyfikator „§YSpołeczeństwo religijne§!”, zapewniający następujące efekty:\nLokalne niepokoje: §G-1,00§!\nLokalny modyfikator podatkowy: §G+10,0%§!\nLokalna wydajność produkcji: §G+10,0%§!\nLokalny modyfikator siły żywej: §G+10,0%§!"
 estate_church_one_faith_one_culture_buffed_gta: "Każda posiadana prowincja wyznająca religię §Y[Root.Religion.GetName]§!, należąca do grupy kulturowej §Y[Root.Culture.GetGroupName]§! lub posiadająca §Yakceptowaną kulturę§!, otrzyma modyfikator „§YSpołeczeństwo religijne§!”, zapewniający następujące efekty:\nLokalne niepokoje: §G-1,00§!\nLokalny modyfikator podatkowy: §G+10,0%§!\nLokalna wydajność produkcji: §G+10,0%§!\nLokalny modyfikator siły żywej: §G+10,0%§!\nLokalna siła handlowa: §G+10,0%§!\nKoszt zarządzania prowincją: §G-10,0%§!"
 estate_church_one_faith_one_culture_gtb: "Każda posiadana prowincja, która NIE należy do grupy kulturowej §Y[Root.Culture.GetGroupName]§! i NIE posiada §Yakceptowanej kultury§!, otrzyma modyfikator §YKultura heretycka§!, zapewniający następujące efekty:\nLokalne niepokoje: §R+3,00§!\nKoszt zmiany kultury: §G-10,0%§!"
 estate_church_one_faith_one_culture_rta: "Modyfikator „§YSpołeczeństwo religijne§!” zostanie usunięty ze wszystkich prowincji wyznających religię §Y[Root.Religion.GetName]§! i posiadających §Yakceptowaną kulturę§! lub kulturę z grupy kulturowej §Y[Root.Culture.GetGroupName]§!."
 estate_church_one_faith_one_culture_rtb: "Modyfikator „§YKultura heretycka§!” zostanie usunięty ze wszystkich prowincji, które nie posiadają §Yakceptowanej kultury§! ani kultury z grupy kulturowej §Y[Root.Culture.GetGroupName]§!."
 estate_brahmins_one_faith_one_culture: "Kultura religijna"
 estate_brahmins_one_faith_one_culture_desc: "Jedność społeczeństwa można osiągnąć tylko wtedy, gdy [Root.GetClergyName] zajmują się nie tylko sprawami duchowymi, lecz odgrywają również ważniejszą rolę w kwestiach kulturowych i społecznych państwa."
 estate_dhimmi_guarantee_of_traditions: "Gwarancja zachowania tradycji"
 estate_dhimmi_guarantee_of_traditions_desc: "Wiara w naszym państwie [Root.GovernmentName] od zawsze łączyła wyższą klasę wyznającą [Root.Religion.GetName] z niższą klasą wyznającą fetyszyzm. Gwarantując swobodę praktykowania tych tradycji i rezygnując z ingerencji rządu w wierzenia mieszkańców, możemy zapewnić zadowolenie ludności wiejskiej."
 MONOPOLY_INCOME_IVORY_DESC: "z produkcji kości słoniowej."
 MONOPOLY_INCOME_GOLD_DESC: "z wydobycia złota."
 estate_nobles_better_integration: "Polityka integracyjna [Root.GetNobilityOrFallbackName]"
 estate_nobles_better_integration_desc: "Centralizacja państwa i anektowanie poddanych nie są łatwymi zadaniami, ponieważ nasi administratorzy i dyplomaci są zajęci procesem integracji. Możemy tego uniknąć, pozwalając [Root.GetNobilityOrFallbackName] przejąć kontrolę nad polityką integracyjną naszego kraju."
 estate_maratha_better_integration: "Polityka integracyjna [Root.GetMarathaOrFallbackName]"
 estate_maratha_better_integration_desc: "Centralizacja państwa i anektowanie poddanych nie są łatwymi zadaniami, ponieważ nasi administratorzy i dyplomaci są zajęci procesem integracji. Możemy tego uniknąć, pozwalając [Root.GetMarathaOrFallbackName] przejąć kontrolę nad polityką integracyjną naszego kraju."
 estate_rajput_better_integration: "Polityka integracyjna [Root.GetRajputOrFallbackName]"
 estate_rajput_better_integration_desc: "Centralizacja państwa i anektowanie poddanych nie są łatwymi zadaniami, ponieważ nasi administratorzy i dyplomaci są zajęci procesem integracji. Możemy tego uniknąć, pozwalając [Root.GetRajputOrFallbackName] przejąć kontrolę nad polityką integracyjną naszego kraju."
 estate_church_religious_diplomats: "Religijni dyplomaci"
 estate_church_religious_diplomats_desc: "Prowadzenie skutecznej dyplomacji nie jest łatwe. Wystarczy kilka drobnych nieporozumień, by stosunki między dwoma państwami gwałtownie się pogorszyły.\nWysyłając do naszych współwyznawców głęboko religijnych dyplomatów, możemy przynajmniej zapobiec takim sytuacjom."
 estate_brahmins_religious_diplomats: "Religijni dyplomaci"
 estate_brahmins_religious_diplomats_desc: "Prowadzenie skutecznej dyplomacji nie jest łatwe. Wystarczy kilka drobnych nieporozumień, by stosunki między dwoma państwami gwałtownie się pogorszyły.\nWysyłając do naszych współwyznawców głęboko religijnych dyplomatów, możemy przynajmniej zapobiec takim sytuacjom."
 estate_church_heir_shrine: "Budowa kaplic dla następców tronu"
 estate_church_heir_shrine_desc: "Zazwyczaj kulty są sprawą naszych [Root.Monarch.GetTitle], a nie ich następców. Możemy to jednak zmienić, budując kaplice, które będą służyć następcom tronu jako miejsca religijnego odosobnienia i pozwolą im wyrażać własne przywiązanie do wybranego kultu."
 estate_burghers_hydraulic_rights: "Prawa do korzystania z wód"
 estate_burghers_hydraulic_rights_desc: "Podział zasobów wodnych od zawsze niepokoi mieszkańców odległych wsi. Pozwalając [Root.GetBurghersName] przejąć bardziej bezpośrednią kontrolę nad prawami do korzystania z wody, możemy zapewnić sprawiedliwy i wydajny dostęp do jej zasobów."
 estate_burghers_enslaving_rights_gt: "Zmniejsz koszt rozwoju wynikający z rodzaju terenu o §G50,0%§! w każdej posiadanej prowincji typu §Ypustynia§!, §Ypustynia przybrzeżna§!, §Ystepy§! lub §Ysawanna§!."
 estate_burghers_enslaving_rights_rt: "Usuń obniżkę kosztu rozwoju ze wszystkich posiadanych prowincji typu §Ypustynia§!, §Ypustynia przybrzeżna§!, §Ystepy§! lub §Ysawanna§!."
 estate_nobles_cawa_peace_keepers: "Przydzielenie Cawa do utrzymywania porządku"
 estate_nobles_cawa_peace_keepers_desc: "Cawa to elitarna formacja i szlachecka klasa wojowników Etiopii. Przyznając im określone przywileje, możemy zapewnić, że wykorzystają swoje umiejętności do utrzymywania porządku w odległych prowincjach."
 estate_nobles_cawa_offensive_fighters: "Przydzielenie Cawa do podbojów"
 estate_nobles_cawa_offensive_fighters_desc: "Cawa to elitarna formacja i szlachecka klasa wojowników Etiopii. Przyznając im określone przywileje, możemy zapewnić, że wykorzystają swoje umiejętności do przełamywania obrony fortów naszych wrogów."
 eth_estate_did_not_have_cawa_privilege_for_five_years: "Nie wybraliśmy przywileju przydziału Cawa w ciągu ostatnich §Y5 lat§!."
 estate_church_embrace_singluar_cult: "Przyjęcie jednego kultu"
 estate_church_embrace_singluar_cult_desc: "Nasza religia oddaje cześć wielu różnym kultom, lecz jeden z nich ma znacznie większe znaczenie niż pozostałe. Powinniśmy przyjąć jeden kult i uczynić czczone w nim bóstwo naszym głównym kultem."
 estate_church_flexible_cults: "Elastyczność kultów"
 estate_church_flexible_cults_desc: "Nasza religia stanowi zbiór różnych wierzeń. Pozwalając szamanom poszczególnych kultów regularnie się spotykać, możemy zmieniać nasze wierzenia nawet za życia jednego władcy."
 estate_church_scholar_connections: "Zakładanie szkół religijnych"
 estate_church_scholar_connections_desc: "Zaproszenie uczonego z jednej z innych szkół wiąże się z nakładami administracyjnymi. Pozwalając [Root.GetClergyName] zakładać szkoły religijne, możemy ułatwić integrację licznych uczonych z naszym krajem."
 estate_church_integrated_school: "Przyznanie uczonemu prawa pobytu"
 estate_church_integrated_school_desc: "Przyznając uczonemu z obcego kraju prawo pobytu w naszych granicach, możemy korzystać z jego wiedzy bez konieczności angażowania się w sprawy polityczne."
 estate_nobles_neighbor_raids: "Najazdy na sąsiadów"
 estate_nobles_neighbor_raids_desc: "Zasoby siły żywej nie są gwarantowanym dobrem żadnego państwa. Przyznając [Root.GetNobilityOrFallbackName] środki do kontrolowania podporządkowanych sił, możemy zapewnić państwu [Root.GovernmentName] stały napływ nowych rekrutów."
 estate_nobles_decentralized_tribe: "Zdecentralizowana konfederacja"
 estate_nobles_decentralized_tribe_desc: "Państwo [Root.GetName] składa się z kilku państw wasalnych, z których każde jest rządzone przez [Root.GetNobilityOrFallbackName]. Plemiona wewnętrzne mogą mieć mniejszą swobodę niż zwykli wasale, lecz absolutna władza monarchy jest bez wątpienia osłabiona, dopóki nie podejmiemy działań na rzecz centralizacji."
 estate_nobles_decentralized_tribe_tt: "Ten przywilej zostanie odebrany po nadaniu [Root.GetNobilityOrFallbackName] przywileju „§YOdebranie przywilejów plemiennych§!”."
 estate_nobles_tribe_unification: "Odebranie przywilejów plemiennych"
 estate_nobles_tribe_unification_desc: "Państwo [Root.GetName] podejmuje szeroko zakrojone działania centralizacyjne, odbierając przywileje rządzącym [Root.GetNobilityOrFallbackName]. Choć potęga plemion konfederacyjnych wciąż jest w [Root.GetName] niezaprzeczalna, otwiera to drogę do pełnej centralizacji państwa [Root.GovernmentName] i wzmocnienia autorytetu [Root.Monarch.GetTitle]."
 estate_nobles_tribe_unification_tt: "Ten przywilej zostanie odebrany po nadaniu [Root.GetNobilityOrFallbackName] przywileju „§YZjednoczenie plemion§!”."
 estate_nobles_tribe_centralization: "Zjednoczenie plemion"
 estate_nobles_tribe_centralization_desc: "Nadszedł czas, by rozwiązać konfederację plemienną i scentralizować władzę!"
 can_not_have_tributaries: "Nie możemy ustanawiać §Ypaństw trybutarnych§!."
 estate_nobles_grant_power_to_the_bashorun: "Przekazanie władzy Baszorunowi"
 estate_nobles_grant_power_to_the_bashorun_desc: "Baszorun jest przywódcą [Root.GetNobilityOrFallbackName] i równoważy władzę [Root.Monarch.GetTitle]. Przekazując Baszorunowi dodatkowe uprawnienia w zakresie rządzenia i organizacji, możemy zapewnić stabilność państwa [Root.GetName] nawet podczas panowania nieudolnych władców."
 ETH_CONTROL_OVER_GATE_OF_TEARS: "Kontrola nad Bab al-Mandab"
 MALI_IVORY: "Kość słoniowa z Mali"
 unlock_privilege_estate_burghers_control_over_the_mint_tt: "Odblokowuje przywilej [Root.GetBurghersName]: „§YKontrolowane wydobycie złota§!”."
 unlock_privilege_estate_nobles_cawa_peace_keepers_tt: "Odblokowuje przywilej [Root.GetNobilityOrFallbackName]: „§YWykorzystanie Cawa do utrzymywania porządku§!”."
 unlock_privilege_estate_nobles_cawa_offensive_fighters_tt: "Odblokowuje przywilej [Root.GetNobilityOrFallbackName]: „§YWykorzystanie Cawa do podbojów§!”."
 mal_add_disaster_stability_tt: "Zyskaj §G1§! punkt stabilności (§G50§! punktów władzy administracyjnej, jeśli masz już 3 punkty stabilności), gdy aktywna jest katastrofa §YUpadek Mali§!."
 set_prestige_to_zero_tt: "Ustaw prestiż państwa [This.GetName] na §Y0§!."
 enable_cult_for_heirs_tt: "Następcy tronu mogą wybrać słabszą wersję §Ykultu§!."
 disable_cult_for_heirs_tt: "§RSpadkobiercy nie mogą już wybierać słabszej wersji §Ykultu§!.§!"
 unlock_cult_through_selection_tt: "Odblokuj wybrany przez siebie §Ykult§!.\nKulty innych religii wymagają wcześniejszego poznania ich istnienia, aby można było je odblokować."
 enable_development_on_buildings_built_tt: "Wznoszenie budynków innych niż obronne będzie §Yzwiększać§! rozwój prowincji.\nZniszczenie budynków wzniesionych w czasie działania tego efektu spowoduje jednak utratę uzyskanego rozwoju."
 enable_primary_cult_tt: "Umożliwia korzystanie z mechaniki §YGłównego kultu§!, która zwiększa siłę kultu i usuwa utratę stabilności po śmierci monarchy, ale uniemożliwia korzystanie z innych kultów.\nGłówny kult można zmieniać co §Y50§! lat."
 disable_primary_cult_tt: "Wyłącza mechanikę §YGłównego kultu§! i umożliwia korzystanie z innych kultów."
 select_primary_cult_yemoja_cult_tt: "§YJemoji§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Jemoji zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
 select_primary_cult_roog_cult_tt: "§YRoog§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Rooga zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
 select_primary_cult_nyame_cult_tt: "§YNyame§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Nyame zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
 select_primary_cult_cwezi_cult_tt: "§YCwezi§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Cwezi zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
 select_primary_cult_central_african_ancestor_cult_tt: "§YMlira§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Mlira zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
 select_primary_cult_mwari_cult_tt: "§YMwari§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Mwari zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
 select_primary_cult_enkai_cult_tt: "§YEnkai§! staje się naszym §YGłównym kultem§!.\nPozostałe kulty staną się niedostępne, lecz śmierć naszego [Root.Monarch.GetTitle] nie spowoduje utraty stabilności. Dodatkowo efekty modyfikatorów kultu Enkai zostaną wzmocnione.[Root.GetHeirPrimaryCultFeature]"
