 primary_jewish_cult: "Główny kult: Hajmanot"
 desc_primary_jewish_cult: "Hajmanot jest naszym głównym kultem. Nasi poddani wyznają go bardziej niż jakąkolwiek inną religię, a po śmierci władca dołączy do wspólnoty przodków."
 primary_zoroastrian_cult: "Główny kult: Mazdajazna"
 desc_primary_zoroastrian_cult: "Mazdajazna jest naszym głównym kultem. Nasi poddani wyznają ją bardziej niż jakąkolwiek inną religię, a po śmierci władca dołączy do wspólnoty przodków."
 junior_yemoja_cult: "Jemoja"
 desc_junior_yemoja_cult: "Jemoja, Matka Wód, jest potężną oriszą czczoną przez lud Joruba. Prosimy ją o opiekę nad kobietami, bezpieczne podróże morskie i obfite plony."
 junior_roog_cult: "Roog"
 desc_junior_roog_cult: "Roog, Stwórca, to imię i siła boskości dla ludu Serer. Składając ofiary duchom przodków zwanym pangool, uznajemy świętość naszego życia."
 junior_nyame_cult: "Nyame"
 desc_junior_nyame_cult: "Według ludu Aszanti Nyame, Bóg Nieba, stworzył pierwszych ludzi. Jego dziećmi są abosom — pomniejsi bogowie i przodkowie, którzy pomagają nam, ludziom, na Ziemi. Razem stanowimy jedność."
 junior_cwezi_cult: "Czwezi"
 desc_junior_cwezi_cult: "Czcimy tradycje dawnego imperium Kitara. Zachowując przychylność duchów natury, oddając cześć przodkom z Kitara i rodom strzegącym ich świątyń, możemy liczyć na boską przychylność."
 junior_central_african_ancestor_cult: "Mlira"
 desc_junior_central_african_ancestor_cult: "Za pośrednictwem wyroczni możemy porozumiewać się ze zmarłymi przodkami i duchami natury. Dzięki temu oddajemy cześć tym, którzy żyli przed nami, i zyskujemy pomoc w radzeniu sobie z nieprzyjaznym otoczeniem."
 junior_mwari_cult: "Mwari"
 desc_junior_mwari_cult: "Czcimy wielkiego boga Mwari, który stworzył świat z nicości i którego głos sprawia, że drżą góry. Mwari jest jedynym prawdziwym bogiem, a nasz władca jest jego wyrocznią i głosem na ziemi."
 junior_enkai_cult: "Enkai"
 desc_junior_enkai_cult: "Podążamy za Enkai, Człowiekiem na Niebie, który zesłał nam swoje stada i uczynił nas prawowitymi właścicielami całego bydła na świecie. Jako władca niebios błogosławi nas deszczem lub odmawia go nam w gniewie."
 junior_waaq_cult: "Waaq"
 desc_junior_waaq_cult: "Wielki Waaq jest Bogiem Nieba, najwyższym i wszechmocnym władcą wszechświata. Jego wyznawcy modlą się o pokój i harmonię, wierząc, że równowaga świata pozwala uniknąć katastrof i nieszczęść."
 junior_zanahary_cult: "Zanahary"
 desc_junior_zanahary_cult: "Zanahary, Stwórca, ma dwoistą naturę: jest zarazem mężczyzną i kobietą, światłem i ciemnością, niebem i ziemią. Przodkowie są najważniejszymi członkami wspólnoty, ponieważ mają bezpośredni kontakt z boskością, podczas gdy żyjący są jedynie jej tymczasowym przedłużeniem."
 junior_christianity_cult: "Chrześcijaństwo"
 desc_junior_christianity_cult: "Podążamy ścieżką Boga, który zesłał na ziemię Jezusa Chrystusa, by umarł za nasze grzechy."
 junior_islam_cult: "Islam"
 desc_junior_islam_cult: "Podążamy ścieżką wielkiego Boga, którego objawienie światu przekazał jego prorok Mahomet."
 junior_buddhism_cult: "Dharmabuddyzm"
 desc_junior_buddhism_cult: "Podążamy ścieżką wielkiego nauczyciela Gautamy Buddy, który żył na ziemi przed wieloma wiekami. Dzięki niemu poznaliśmy cztery szlachetne prawdy, odrodzenie oraz naturę tego świata."
 junior_dharmic_cult: "Sanatana dharma"
 desc_junior_dharmic_cult: "Podążamy za pradawnymi naukami hinduskich bogów. Dzięki nim poznaliśmy reinkarnację oraz zasady sprawnego organizowania społeczeństwa opartego na kastach."
 junior_south_central_american_cult: "Teotl"
 desc_junior_south_central_american_cult: "Poznaliśmy mistyczne obyczaje bogów Teotl zza morza. Dzięki ofiarom i uważnej obserwacji niebios możemy wpływać na życie na ziemi i zapobiec końcowi znanej nam cywilizacji."
 junior_norse_cult: "Freja"
 desc_junior_norse_cult: "Podążamy za piękną Freją, boginią miłości, wojny i magii. Dzięki darowi jej magii odniesiemy chwalebne zwycięstwa!"
 junior_zoroastrian_cult: "Mazdajazna"
 desc_junior_zoroastrian_cult: "Podążamy za naukami proroka Zaratustry i czcimy mądrego Ahura Mazdę. Aby zadowolić bogów, będziemy na wieki podtrzymywać święty ogień."
 junior_jewish_cult: "Hajmanot"
 desc_junior_jewish_cult: "Wierzymy w jedynego Boga i jesteśmy dziećmi Abrahama. Przez stulecia utraciliśmy więź z naszymi żydowskimi korzeniami, lecz teraz ponownie przyjmujemy dawne tradycje."
 UNTIL_HEIR_SUCCESSION_OR_DEATH: "do chwili wstąpienia naszego następcy na tron lub jego śmierci"
 UNTIL_RULER_DEATH: "do śmierci naszego władcy"
 swapped_primary_cult: "Zmiana tradycji"
 desc_swapped_primary_cult: "Właśnie zmieniliśmy religijny kierunek naszego państwa. Ludność musi przyzwyczaić się do nagłej zmiany głównego kultu."
 tooltip_yemoja_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nModyfikator utrzymania floty: §G-15.0%§!"
 tooltip_roog_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nWyniszczenie na lądzie: §G-15.0%§!"
 tooltip_nyame_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nReputacja dyplomatyczna: §G+1.00§!"
 tooltip_cwezi_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nPopraw stosunki: §G+20.0%§!"
 tooltip_central_african_ancestor_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nTolerancja dla prawdziwej wiary: §G+2.00§!"
 tooltip_mwari_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nDyscyplina: §G+2.5%§!"
 tooltip_enkai_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nSzybkość regeneracji zasobów ludzkich: §G+15.0%§!"
 tooltip_waaq_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nKrajowy poziom niepokojów: §G-2.00§!"
 tooltip_zanahary_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nMiesięczne wyczerpanie wojną: §G-0.05§!"
 tooltip_christianity_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nWewnętrzna siła handlu: §G+25.0%§!"
 tooltip_islam_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nRozprzestrzenianie się nurtów: §G+10.0%§!"
 tooltip_buddhism_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nKoszt rozwoju: §G-10.0%§!"
 tooltip_dharmic_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nModyf. produkowanych tow.: §G+10.0%§!"
 tooltip_south_central_american_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nMorale armii: §G+5.0%§!"
 tooltip_norse_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nTolerancja dla pogan: §G+2.00§!"
 tooltip_zoroastrian_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nKupcy: §G+2§!"
 tooltip_jewish_cult: "Ten kult ma następujące korzyści, gdy jest wybrany:\nKoszt doradców: §G-10.0%§!"
 judaism_abrahamic_roots: "Korzenie abrahamowe"
 desc_judaism_abrahamic_roots: "Mieszkańcy tej prowincji uznają wspólne korzenie abrahamowe, łączące ich z żydowskim zwierzchnikiem. Dzięki temu chrześcijanie i muzułmanie cieszą się tu większą tolerancją, co zwiększa ich produktywność."
 judaism_community_wrong_culture: "Zjednoczona wspólnota"
 desc_judaism_community_wrong_culture: "Mieszkańcy tej prowincji przezwyciężyli różnice kulturowe ze swoim zwierzchnikiem i postrzegają siebie przede wszystkim jako Żydów, co zbliża ich do właściciela prowincji."
 judaism_community_same_culture_group: "Zjednoczona wspólnota"
 desc_judaism_community_same_culture_group: "Mieszkańcy tej prowincji przezwyciężyli różnice kulturowe ze swoim zwierzchnikiem i postrzegają siebie przede wszystkim jako Żydów, co zbliża ich do właściciela prowincji."
 judaism_yom_kippur_aspect_war_modifier: "Jom Kipur"
 desc_judaism_yom_kippur_aspect_war_modifier: "Nadeszła wojna, lecz nasz lud przetrwa. Nauki przeszłości pomagają nam wytrwać w wojennych zmaganiach."
 judaism_yom_kippur_aspect_defensive_war_modifier: "Wezwanie do broni"
 desc_judaism_yom_kippur_aspect_defensive_war_modifier: "Wrogowie naszego ludu stoją u naszych bram i próbują nas podbić. Każdy z nas jest gotów stawić czoła najeźdźcom!"
 itinerant_capital_area: "Obszar wędrującej stolicy"
 desc_itinerant_capital_area: "Ta prowincja należy do obszaru, na którym znajduje się wędrująca stolica."
 itinerant_capital_just_moved: "Reorganizacja stolicy"
 desc_itinerant_capital_just_moved: "Nasza wędrująca stolica została niedawno przeniesiona. W dającej się przewidzieć przyszłości kolejna przeprowadzka będzie niezwykle kosztowna."
 has_invited_scholar_recently: "Zaproszono uczonego"
 desc_has_invited_scholar_recently: "Mamy już na dworze uczonego, dlatego nie możemy zatrudnić kolejnego."
 ZAN_ideas: "Idee Kilwy"
 ZAN_ideas_start: "Tradycje Kilwy"
 ZAN_ideas_bonus: "Ambicja Kilwy"
 zan_kilwa_latitude_staves: "Kijwyjskie laski nawigacyjne"
 zan_kilwa_latitude_staves_desc: "Nasza zaawansowana technologia okrętowa pozwala nam żeglować dalej i sprawniej niż konkurenci, zapewniając nam przewagę."
 zan_shirazis_legacy: "Dziedzictwo Sziraziego"
 zan_shirazis_legacy_desc: "Nasz legendarny założyciel pochodził z Szirazu i był synem emira Persji, co nie pozostawia wątpliwości co do naszych praw do tronu."
 zan_the_deal_with_almuli: "Układ z królem Almulim"
 zan_the_deal_with_almuli_desc: "Otrzymaliśmy naszą wyspę od króla Almuliego. Nasza reputacja uczciwych handlarzy powinna być znana wszystkim."
 zan_gold_of_sofala: "Złoto z Sofali"
 zan_gold_of_sofala_desc: "Złoto z Sofali od zawsze stanowiło jedno z naszych głównych źródeł bogactwa, dlatego nasza gospodarka jest do niego przyzwyczajona."
 zan_trade_center_of_zanzibar: "Kupcy Zanzibaru"
 zan_trade_center_of_zanzibar_desc: "Zanzibar od zawsze przyciągał kupców, którzy przybywają tu z najdalszych zakątków świata, by prowadzić handel."
 zan_center_of_migration: "Ośrodek migracji"
 zan_center_of_migration_desc: "Rozwój handlu wiąże się również ze zwiększonym napływem ludności, dzięki czemu nasze miasta rozwijają się jeszcze szybciej."
 zan_kilwa_the_melting_pot: "Kulturowy tygiel"
 zan_kilwa_the_melting_pot_desc: "Wraz z przepływem towarów przez nasze ziemie rośnie również wymiana idei. Możemy czerpać wiedzę ze wszystkich zakątków świata."
 eth_accepted_society: "Akceptowana społeczność"
 desc_eth_accepted_society: "Żydzi zamieszkujący tę prowincję są traktowani tak samo jak Koptowie."
 hau_hausa_conquest: "Podbój Hausa"
 desc_hau_hausa_conquest: "Ta prowincja została podporządkowana przez Hausa. Mimo to miejscowa ludność cieszy się większą swobodą, niż można by się spodziewać."
 desc_eth_blessing_of_kings: "Z niewytłumaczalnych powodów nasza dynastia panująca zdaje się być obdarzona szczęściem i pomyślnością."
 estate_nobles_neighbor_raids_fort: "Złupiony fort"
 desc_estate_nobles_neighbor_raids_fort: "Fort został niedawno złupiony. Nie ma w nim doświadczonej załogi ani kosztowności, które uzasadniałyby ponowny najazd."
 gathers_soldiers_for_the_ruler: "Gromadzenie wojsk"
 desc_gathers_soldiers_for_the_ruler: "W tej prowincji trwa obecnie zbieranie żołnierzy. Zadania o niższym priorytecie muszą poczekać."
 internal_marriage: "Małżeństwo wewnątrzdynastyczne"
 desc_internal_marriage: "Nasz władca poślubił osobę pochodzącą z jednego z wewnętrznych królestw."
 msi_federal_kingdom_focus: "Przywileje dla królestw"
 desc_msi_federal_kingdom_focus: "Postanowiliśmy skoncentrować wysiłki na zwiększeniu lojalności królestw konfederacji."
 msi_federal_kingdom_focus_desc: "trwa do chwili odebrania reformy „§YKonfederacyjne królestwo Mossi§!”."
 msi_centralization_focus: "Centralizacja państwa Mossi"
 desc_msi_centralization_focus: "Postanowiliśmy skoncentrować wysiłki na zwiększeniu centralizacji naszego państwa."
 msi_centralization_focus_desc: "trwa do chwili wybrania reformy „§YKonfederacyjne królestwo Mossi§!”."
 city_of_401_deities: "Miasto 401 bóstw"
 desc_city_of_401_deities: "Ile-Ife to słynne Miasto 401 Bóstw i święte miejsce dla wielu wyznawców tradycyjnych religii afrykańskich."
 hau_chief_of_power: "Ośrodek władzy"
 desc_hau_chief_of_power: "To miasto jest historycznym ośrodkiem władzy ludu Hausa. Niezależnie od obecnego położenia stolicy prowincja ta ma ogromne znaczenie dla historii Hausa."
 hau_chiefs_of_market: "Miasto targów"
 desc_hau_chiefs_of_market: "To miasto jest historycznym miejscem targów dla ludu Hausa. Przyciąga handel z całej Afryki Zachodniej."
 hau_chief_of_war: "Miasto wojny"
 desc_hau_chief_of_war: "To miasto jest historycznym miejscem walk dla ludu Hausa. Tutaj tworzy się broń, tutaj szkoli się żołnierzy."
 hau_chiefs_of_indigo: "Miasto indygo"
 desc_hau_chiefs_of_indigo: "To miasto jest historycznym ośrodkiem produkcji indygo ludu Hausa. Miało ono wielką wartość dla mieszkańców Afryki Zachodniej, a teraz ponownie stało się regionalnym centrum produkcji barwników."
 hau_chief_of_slaves: "Miasto niewolników"
 desc_hau_chief_of_slaves: "To miasto jest historycznym miejscem niewolnictwa dla ludu Hausa. Wielkie budynki zostały zbudowane przy użyciu niewolników z tego regionu."
 zul_provocated_locals: "Niepokoje wśród Nguni"
 desc_zul_provocated_locals: "Mieszkańcy tej prowincji należący do ludu Nguni zostali zmuszeni przez obce kulturowo siły do służby wojskowej. W przyszłości mogą wyrazić niezadowolenie, wzniecając bunt."
 hau_city_builders: "Budowniczowie miast"
 desc_hau_city_builders: "Bez wątpienia jesteśmy największym i najbardziej wpływowym spośród miast Hausa."
 hau_the_jiihad: "Dżihad"
 desc_hau_the_jiihad: "Naszym świętym obowiązkiem jest przeciwstawianie się wszystkim, którzy odrzucają nauki Proroka."
 hau_caliphate_of_the_sahel: "Kalifat Sahelu"
 desc_hau_caliphate_of_the_sahel: "Staliśmy się niekwestionowanym kalifatem całego Sahelu."
 aju_gold_trade_deal_refused: "Skupienie na własnej gospodarce"
 desc_aju_gold_trade_deal_refused: "Postanowiliśmy skupić się na własnej gospodarce zamiast zawierać układ handlowy z naszym sojusznikiem, zachowując całe wydobywane złoto dla siebie."
 aju_gold_trade_deal_ajuuraan: "Układ handlowy dotyczący złota"
 desc_aju_gold_trade_deal_ajuuraan: "Uzyskaliśmy dostęp do złóż złota naszego bliskiego sojusznika. Choć dodatkowy kruszec wywiera presję na naszą gospodarkę, z pewnością przyda się w naszej mennicy."
 aju_ajuuran_influence_in_java: "Wpływy handlowe Adżuranu"
 desc_aju_ajuuran_influence_in_java: "Ta prowincja znajduje się pod wpływem handlowym Adżuranu. Obecność zagranicznych kupców osłabia naszą siłę handlową, lecz ich siła nabywcza znacząco wspiera miejscową produkcję."
 warband_assembled: "Zgromadzono drużynę wojenną"
 desc_warband_assembled: "Zgromadziliśmy prawdziwą drużynę wojenną i możemy teraz pokazać naszym rywalom, na co nas stać!"
 w_african_modern_weapons: "Nowoczesna broń"
 desc_w_african_modern_weapons: "Pozyskaliśmy broń palną dla naszych wojowników, a teraz potrafimy nawet wytwarzać ją na własnych ziemiach."
 w_african_unity_of_west_african: "Jedność Afryki Zachodniej"
 desc_w_african_unity_of_west_african: "Odnieśliśmy zwycięstwo tam, gdzie Mali poniosło klęskę i teraz wszystkie ziemie i ludy Afryki Zachodniej są zjednoczone pod naszym panowaniem!"
 w_african_cult_collector: "Tradycje fetyszystyczne"
 desc_w_african_cult_collector: "Nasi mieszkańcy przyjęli dawne rytuały naszej wiary i kultury."
 w_african_shamans: "Szamani"
 desc_w_african_shamans: "Nasi szamani szerzą nasze wierzenia na sąsiednich ziemiach."
 w_african_fetishist_rights: "Prawa fetyszystów"
 desc_w_african_fetishist_rights: "Nasi ludzie są bardziej zjednoczeni, wyznając nasze tradycyjne kulty."
 w_african_tolerance: "Jedność w religii"
 desc_w_african_tolerance: "Głosimy prawdziwą wiarę w Afryce Zachodniej! Pobożność i oddanie Allahowi będą niekwestionowane!"
 w_african_tolerance_fetishist: "Jedność w religii"
 desc_w_african_tolerance_fetishist: "Głosimy prawdziwą wiarę w Zachodniej Afryce! Tradycje i autorytet naszych szamanów pozostaną niekwestionowane!"
 w_african_defender_of_sunni_faith: "Obrońcy wiary sunnickiej"
 desc_w_african_defender_of_sunni_faith: "Zjednoczyliśmy nasz naród w wierze islamskiej."
 w_african_missionaries: "Misjonarze"
 desc_w_african_missionaries: "Teraz mamy ludzi, którzy chętnie szerzą wiarę wśród naszych sąsiadów."
 w_african_sunni_rights: "Lokalny marabut"
 desc_w_african_sunni_rights: "Nasi marabuci szerzą nasze wierzenia na sąsiednich ziemiach."
 w_african_tax_collectors: "Poborcy podatkowi"
 desc_w_african_tax_collectors: "Zebraliśmy należne daniny od naszych sąsiadów, tak jak powinno się to odbywać."
 w_african_develop_modifier: "Karczowanie i nawadnianie"
 desc_w_african_develop_modifier: "Rozwinęliśmy nasze ziemie dzięki zaplanowanym pracom karczunkowym i systemom nawadniania."
 w_african_tolerance_desc: "Dopóki nie zmienimy religii"
 estate_nobles_cawa_peace_keepers_modifier: "Strażnicy pokoju Cawa"
 desc_estate_nobles_cawa_peace_keepers_modifier: "Nasze oddziały Cawa skupiają się na utrzymywaniu pokoju w granicach imperium i oszczędzaniu sił na przyszłość."
 estate_nobles_cawa_offensive_fighters_modifier: "Zdobywcy Cawa"
 desc_estate_nobles_cawa_offensive_fighters_modifier: "Nasze oddziały Cawa skupiają się na odpieraniu wrogów od granic imperium. Szukają walki i atakują przeciwnika z pełną mocą."
 jol_dominant_trade: "Biegłość w handlu"
 desc_jol_dominant_trade: "Wykorzystanie nauk, które przyswoiliśmy od Europejczyków, pozwala nam czerpać zyski z zawieranych umów handlowych."
 jol_imperial_ambitions: "Zwycięstwo nad Songhajem"
 desc_jol_imperial_ambitions: "Nasze zwycięstwo nad zagrożeniem ze strony Songhaju przynosi nam sławę i chwałę! Ani poddani, ani cudzoziemcy nie będą już wątpić w naszą potęgę!"
 jol_west_african_great_power: "Mocarstwo Afryki Zachodniej"
 desc_jol_west_african_great_power: "Pokonaliśmy największe zagrożenia w Afryce Zachodniej, zastąpiliśmy niegdyś wspaniałe imperium Mali i wznieśliśmy się ponad wszystkich rywali. Doprawdy jesteśmy mocarstwem Afryki Zachodniej!"
 zim_nguni_militarization: "Militaryzacja Nguni"
 desc_zim_nguni_militarization: "Zmilitaryzowaliśmy lud Nguni i ustanowiliśmy ogólnokrajowy program rekrutacyjny, by wzmocnić nasze regimenty."
 oyo_access_to_horses: "Dostęp do koni"
 desc_oyo_access_to_horses: "Uzyskaliśmy dostęp do koni, dzięki czemu możemy z łatwością formować regimenty kawalerii."
 oyo_empire: "Imperium Oyo"
 desc_oyo_empire: "Staliśmy się prawdziwym imperium — nikt nie może temu zaprzeczyć."
 oyo_shaman_gathering: "Zgromadzenie szamanów"
 desc_oyo_shaman_gathering: "Różni szamani naszej wiary potrafią stworzyć wspólną wizję wierzeń naszego państwa."
 zan_kilwan_embassy: "Ambasada Kilwy"
 desc_zan_kilwan_embassy: "W tej prowincji mieści się ambasada Kilwy, która pełni funkcję łącznika dyplomatycznego między Persją a Afryką.\n\n§YModyfikator zostanie usunięty, jeśli zmieni się właściciel prowincji.§!"
 zan_persian_embassy: "Ambasada perska"
 desc_zan_persian_embassy: "W tej prowincji mieści się ambasada państwa [2218.Owner.GetName], która pełni funkcję łącznika dyplomatycznego między Persją a Afryką.\n\n§YModyfikator zostanie usunięty, jeśli zmieni się właściciel prowincji.§!"
 zan_embassy_desc: "trwa do momentu zmiany właściciela prowincji"
 zan_expansion_into_the_cape: "Ekspansja na Przylądek"
 desc_zan_expansion_into_the_cape: "Poszukiwacze przygód i odkrywcy z naszego kraju zgłosili się na ochotnika, by rozszerzyć nasze wpływy na południu Afryki i odkryć ukryte tam bogactwa."
 zan_great_kilwa: "Wielka Kilwa"
 desc_zan_great_kilwa: "Miasto Wielka Kilwa zostało gruntownie rozbudowane i odrestaurowane. Teraz jest perłą Wybrzeża Suahili."
 zan_kilwan_trade_dominance: "Dominacja handlowa Kilwy"
 desc_zan_kilwan_trade_dominance: "Nasi kupcy dominują w handlu w Zatoce Adeńskiej. Teraz rozszerzają swoje wpływy na inne węzły handlowe, przynosząc nam korzyści."
 zan_master_of_the_trade: "Mistrz handlu"
 desc_zan_master_of_the_trade: "Żadne inne państwo nie osiągnęło takiego mistrzostwa w handlu jak my. Jesteśmy bezsprzecznymi władcami handlu afrykańskiego i azjatyckiego!"
 zan_conversion_of_fetishist: "Suahilijska dominacja"
 desc_zan_conversion_of_fetishist: "Prowincja znalazła się pod wpływem Suahili, którzy próbują teraz nawrócić miejscową ludność."
 zan_riches_of_china: "Bogactwa Chin"
 desc_zan_riches_of_china: "Opowieści o bogactwach Chin skłoniły wielu naszych kupców do zintensyfikowania działalności handlowej, by zdobyć część azjatyckich bogactw."
 zan_trade_with_india: "Handel z Indiami"
 desc_zan_trade_with_india: "Dzięki doświadczeniom zdobytym w Indiach nasz handel osiągnął nowy poziom wydajności."
 zan_colonial_ambition: "Ambicje kolonialne"
 desc_zan_colonial_ambition: "Choć koncentrujemy się przede wszystkim na handlu, nie możemy zapominać o pokusie kolonizowania dzikich wysp i… uwalniania cennych dóbr, które skrywają."
 zan_australian_colony: "Koloniści z Kilwy"
 desc_zan_australian_colony: "Kolonizacja Australii bardziej niż kiedykolwiek zachęca naszych mieszkańców do osiedlania się w nowych zakątkach świata."
 msi_conquerors_of_west_africa: "Organizacja Mossi"
 desc_msi_conquerors_of_west_africa: "Naszym celem jest podporządkowanie i podbój całej Afryki Zachodniej. Powierzając administrację licznym królestwom konfederacyjnym, możemy zapewnić sobie sprawniejszy przebieg kampanii podbojowej."
 msi_west_african_hegemony: "Hegemon Afryki Zachodniej"
 desc_msi_west_african_hegemony: "Dominujemy w Afryce Zachodniej! Jako najsilniejsze państwo regionu w naturalny sposób rościmy sobie prawo do tytułu regionalnego hegemona!"
 msi_prepared_for_war: "Przygotowania wojenne"
 desc_msi_prepared_for_war: "Zgromadziliśmy wojska, zwerbowaliśmy najlepszych generałów i przygotowaliśmy machinę wojenną naszego państwa. Jesteśmy gotowi na wielkie wojny, które nas czekają."
 msi_integrated_province: "Zintegrowani poganie"
 desc_msi_integrated_province: "Poganie zamieszkujący tę prowincję korzystają ze specjalnych przywilejów w zamian za płacenie wyjątkowych podatków na rzecz państwa Mossi."
 msi_the_kingdom_federation: "Lojalność konfederacyjna"
 desc_msi_the_kingdom_federation: "Królestwa wchodzące w skład naszego państwa przysięgły lojalność [Root.Monarch.GetTitle] i uznają [Root.Monarch.GetHerHim] za najwyższego przywódcę ludu Mossi."
 aju_gold_trade_deal_ally: "Umowa handlowa z Adżuranem"
 desc_aju_gold_trade_deal_ally: "Postanowiliśmy przyjąć ofertę Adżuranu i dostarczać mu nasz cenny kruszec do bicia monet."
 kon_great_power: "Przewaga nad mocarstwem"
 desc_kon_great_power: "Wbrew wszelkim przeciwnościom nasz kraj zdołał odnieść decydujące zwycięstwo nad jednym z wielkich mocarstw tego świata! Chwała państwu [Root.GetName]!"
 east_africa_economic_base_title: "Stworzenie podstaw gospodarczych"
 east_africa_economic_base_desc: "Aby nasz naród mógł się rozwijać, musimy stworzyć solidne fundamenty gospodarcze. Oszczędzajmy złoto i zakładajmy przedsięwzięcia przynoszące dochody."
 east_africa_trade_consolidation_title: "Konsolidacja handlu"
 east_africa_trade_consolidation_desc: "Nasze ziemie i okoliczne obszary obfitują w zasoby pożądane przez inne państwa. Z pewnością możemy spełnić ich życzenia — oczywiście za odpowiednią cenę."
 east_africa_dominate_tn_title: "Dominacja w węźle handlowym"
 east_africa_dominate_tn_desc: "Jako wschodzące państwo handlowe musimy kontrolować największe ośrodki handlu w naszym regionie, aby zapewnić sobie dominację."
 east_africa_trading_navy_title: "Flota handlowa"
 east_africa_trading_navy_desc: "Nasi główni partnerzy handlowi mieszkają daleko od nas. Budując okręty, możemy sami popłynąć do ich wybrzeży, zamiast czekać, aż przybędą do nas, i samodzielnie ustalać warunki sprzedaży naszych towarów."
 east_africa_commercial_treaties_title: "Traktaty handlowe"
 east_africa_commercial_treaties_desc: "Tradycyjnie naszymi głównymi partnerami handlowymi byli Arabowie i mieszkańcy południowych Indii. Wysyłając tam kupców i budując silną pozycję na ich rodzimych rynkach, będziemy mogli negocjować z korzystniejszej pozycji."
 east_africa_zheng_he_title: "Odwrócona wyprawa Zheng He"
 east_africa_zheng_he_desc: "Nie tak dawno temu u naszych wybrzeży pojawił się admirał z odległych Chin. Do dziś na naszych ziemiach żyją potomkowie marynarzy z jego floty, którzy tu pozostali. Nasz kraj jest teraz potężny i możemy złożyć im wizytę. Nie będzie to jedynie kurtuazyjna podróż, lecz także sposób na zapewnienie naszemu państwu stałych dostaw porcelany."
 chinese_trade_agreement: "Chińska umowa handlowa"
 east_africa_rising_lion_title: "Powstający lew"
 east_africa_rising_lion_desc: "Żadne państwo nie cieszy się szacunkiem, jeśli nie broni go potężna armia. Zwerbujemy najlepszych ludzi z naszych ziem i stworzymy silne wojsko, które sprawi, że każdy dwa razy się zastanowi, zanim nas rozgniewa."
 east_africa_hear_me_roar_title: "Usłyszcie mój ryk"
 east_africa_hear_me_roar_desc: "Dominujące państwo handlowe potrzebuje dwóch rzeczy, by narzucać swoją wolę: portów i ziem. Musimy kontrolować zarówno ląd, jak i morze."
 east_africa_international_influence_title: "Wpływy międzynarodowe"
 east_africa_international_influence_desc: "Nasza potęga jest oczywista, lecz jeśli inne państwa nie uznają naszej wielkości, jej wartość będzie mniejsza. Wyślemy ambasady do innych wielkich narodów i zdobędziemy uznanie jako prawdziwe mocarstwo."
 international_influence.tooltip: "Co najmniej §Y2§! wielkie mocarstwa:\nSojusz z państwem §Y[Root.GetName]§!.\nOpinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y150§!."
 east_africa_lion_king_title: "Król Lew"
 east_africa_lion_king_desc: "Dopiero kontrolując nasz region, będziemy mogli nazywać się królami handlu. Nie ma znaczenia, czy osiągniemy to podbojem, czy dyplomacją. Wszystkie okoliczne państwa albo się nam pokłonią, albo zginą."
 east_africa_horn_trade_title: "Handel z Rogu Afryki"
 east_africa_horn_trade_desc: "Cieśnina Bab al-Mandab to ważny wąski przesmyk na szlaku handlowym, który musimy kontrolować, jeśli chcemy stać się wielkim państwem handlowym. Nie musimy podbijać wszystkiego wokół — wystarczy utrzymać właściwe prowincje."
 east_africa_horn_trade_tooltip: "Otrzymamy roszczenia do kilku portów w regionie węzła handlowego Adenu."
 east_africa_eastern_trade_title: "Wschodnie szlaki handlowe"
 east_africa_eastern_trade_desc: "Chińskie towary i orientalne przyprawy przepływają przez południowe Indie. Jeśli zdobędziemy tam kilka portów, łatwiej skierujemy te cenne produkty do naszego rodzimego węzła handlowego."
 east_africa_eastern_trade_tooltip: "Otrzymamy roszczenia do kilku portów w regionie węzła handlowego Koromandelu."
 east_africa_modern_army_title: "Nowoczesna armia"
 east_africa_modern_army_desc: "Państwo nie może uchodzić za wielkie mocarstwo, jeśli jego armia i flota nie należą do najlepszych. Zmodernizujemy nasze wojska i okręty, by budziły postrach na całym świecie."
 east_africa_modern_nation_title: "Państwo wyznaczające trendy"
 east_africa_modern_nation_desc: "Jako wiodące państwo możemy wpływać na trendy i obyczaje narodów, które nas znają. Będą patrzeć na nas z mieszaniną zazdrości i podziwu."
 east_africa_big_treasury_title: "Wielki skarbiec"
 east_africa_big_treasury_desc: "Musimy zgromadzić jak najwięcej pieniędzy, aby stworzyć solidne podstawy do osiągnięcia statusu wielkiego mocarstwa."
 east_africa_blooming_nation: "Rozkwitające państwo"
 desc_east_africa_blooming_nation: "Nasze państwo rozkwita niczym kwiat i staje się perłą regionu, wzbudzając u sąsiadów zarówno zazdrość, jak i podziw."
 east_africa_trading_hub: "Ośrodek handlowy"
 desc_east_africa_trading_hub: "Gdy handel zaczyna zalewać nasze miasta kupcami z najdalszych stron, wiele miejsc w całym kraju zaczyna rozkwitać."
 east_africa_trading_hub_tooltip: "Do końca kampanii jedna posiadana prowincja w naszym rodzimym węźle handlowym otrzyma:\nKoszt ulepszenia ośrodka handlu: §G-20%§!\nLokalna siła handlowa: §G+10.00§!"
 east_africa_money_calls_money: "Pieniądz przyciąga pieniądz"
 desc_east_africa_money_calls_money: "Oszczędności pozwoliły nam udoskonalić sposoby pomnażania majątku poprzez rozsądne inwestycje."
 east_africa_modern_army: "Nowoczesna armia"
 desc_east_africa_modern_army: "Wyszkoliliśmy nasze wojska lądowe i morskie w zakresie dyscypliny oraz nowoczesnej taktyki. Dzięki tym naukom nasze siły zbrojne jeszcze przez długi czas będą budzić postrach wśród wrogów."
 east_africa_modern_nation: "Nowoczesne państwo"
 desc_east_africa_modern_nation: "Czasy się zmieniły. Niegdyś z podziwem spoglądaliśmy na inne państwa, lecz teraz to my jesteśmy wzorem do naśladowania. Ambasady z całego świata przybywają do nas, by poznać nasze metody."
 east_africa_commercial_routes: "Szlaki handlowe"
 desc_east_africa_commercial_routes: "Dzięki potężnej flocie handlowej nawet najodleglejsze wybrzeża wydają się bliższe. Ułatwia nam to dostęp do nowych bogactw i eksport naszych produktów."
 east_africa_attracting_capital: "Przyciąganie kapitału"
 desc_east_africa_attracting_capital: "Nasza stolica przyciągnęła wielu ludzi i inwestycje, dzięki czemu stale się rozwija. Bogactwo jest tak wielkie, że korzystają z niego również sąsiednie prowincje."
 east_africa_indian_trade: "Handel z Indiami"
 desc_east_africa_indian_trade: "Nasza strategia zakładania faktorii handlowych przekierowuje szlaki handlowe z południowych Indii, sprowadzając bogactwa tego kraju na nasze wybrzeża i przynosząc nam zyski."
 east_africa_fearless_army: "Nieustraszona armia"
 desc_east_africa_fearless_army: "Nasze wojska są gotowe do bitwy i świadome swej wyższości nad żałosnymi przeciwnikami."
 east_africa_big_friends: "Potężni przyjaciele"
 desc_east_africa_big_friends: "Przyjaźń z innymi mocarstwami zapewni nam ochronę, gdy będziemy rosnąć w siłę. Być może w przyszłości zdołamy nawet wbić im nóż w plecy…"
 east_africa_regional_hegemon: "Regionalny hegemon"
 desc_east_africa_regional_hegemon: "Żadne państwo w naszym regionie nie jest potężniejsze od nas. Wewnętrzna ani zewnętrzna opozycja nie ma szans w starciu z aparatem państwowym. Jesteśmy przywódcami i będziemy przewodzić przez następne tysiąc lat."
 c_a_prepare_for_war_mission_title: "Przygotowania do wojny"
 c_a_prepare_for_war_mission_desc: "Otacza nas wiele państw, które w każdej chwili mogą stać się naszymi wrogami. Musimy być na to przygotowani."
 c_a_war_mission_title: "Czerpanie zysków z wojny"
 c_a_war_mission_desc: "Musimy łupić naszych wrogów, by zdobywać ich zasoby. Osłabimy ich, a sami staniemy się silniejsi. Dzięki temu później znacznie łatwiej będzie ich zmiażdżyć."
 c_a_conquest_mission_title: "Rozszerzenie granic państwa"
 c_a_conquest_mission_desc: "Nasi wrogowie są nieustępliwi i nie brakuje ich nigdy. Tylko eliminując ich jednego po drugim i rosnąc w siłę ich kosztem, zdołamy stawić czoła większym zagrożeniom. Rozszerzenie naszego terytorium to dopiero pierwszy krok na drodze do chwały."
 c_a_become_empire_mission_title: "Przekształcenie w imperium"
 c_a_become_empire_mission_desc: "Jesteśmy więksi i potężniejsi niż kiedykolwiek wcześniej, lecz to wciąż za mało! Musimy sięgnąć szczytu potęgi i upomnieć się o należne nam prawo do panowania nad wszystkimi wrogami. Musimy stać się prawdziwym, wspaniałym imperium."
 c_a_train_army_mission_title: "Wyszkolenie armii"
 c_a_train_army_mission_desc: "Jeśli chcemy przetrwać i pokonać każdego, kto ośmieli się nam przeciwstawić, nie możemy polegać na motłochu, który ledwie odróżnia ostry koniec włóczni od tępego. Musimy przekształcić go w prawdziwą armię."
 c_a_military_hegemon_mission_title: "Zapewnienie przewagi militarnej"
 c_a_military_hegemon_mission_desc: "Nasza wspaniała armia dobrze nam służyła, lecz wciąż nie jest wystarczająco potężna, by osiągnąć nasze cele. Musimy ją rozbudować i przekształcić w znaczącą siłę, budzącą postrach wśród wrogów."
 c_a_military_hegemon_mission_ct: "Posiadaj największą armię w regionach §YAfryki Środkowej§! i §YKonga§!."
 c_a_ally_big_mission_title: "Zjednaj sobie wielkie ryby"
 c_a_ally_big_mission_desc: "Choć otaczają nas potencjalni wrogowie, niektórzy z nich stanowią znacznie większe zagrożenie niż inni. Być może powinniśmy strategicznie zjednać sobie tych najgroźniejszych i zaprzyjaźnić się z nimi, zanim postanowią nas zmiażdżyć. Przynajmniej do czasu, aż sami zdecydujemy się ich zmiażdżyć."
 c_a_ally_big_mission_ct: "Posiadaj sojusznika z opinią o państwie §Y[Root.GetName]§! wynoszącą co najmniej §Y150§!, którym jest §YKongo§!, §YMutapa§! lub §YKilwa§!, albo który ma ponad §Y100§! rozwoju."
 c_a_loyal_ally_mission_title: "Lojalny sojusznik"
 c_a_loyal_ally_mission_desc: "Udało nam się zdobyć kilku sojuszników, teraz musimy sprawić, by nam zaufali. Im większym zaufaniem nas obdarzą, tym więcej korzyści od nich uzyskamy i tym łatwiej będzie nam ich zdradzić, jeśli zajdzie taka potrzeba."
 c_a_get_vassals_mission_title: "Pozyskanie wasali"
 c_a_get_vassals_mission_desc: "Cóż nam po całej naszej potędze, jeśli nie mamy nikogo, komu moglibyśmy ją narzucić? Państwa składające nam pokłon pokażą całemu światu naszą prawdziwą siłę."
 c_a_humiliate_rival_mission_title: "Upokorzenie rywala"
 c_a_humiliate_rival_mission_desc: "Nasi wrogowie zbyt długo byli cierniem w naszym boku - czas z tym skończyć. Musimy zadać im tak decydujący cios, że już nigdy nie odważą się stanąć nam na drodze."
 c_a_humiliate_rival_mission_ct: "Posiadaj §Y100§! wyniku wojennego w wojnie przeciwko rywalowi lub wrogowi"
 c_a_get_cults_mission_title: "Czerpanie z tradycji"
 c_a_get_cults_mission_desc: "Nasi sąsiedzi nie zawsze podzielają te same poglądy religijne, co my. Nasze tradycje zawsze były zróżnicowane, więc nie jest zaskoczeniem, że wśród naszych braci istnieją inne, odmienne poglądy na pewne aspekty. Dlatego powinniśmy nauczyć się od nich tak wiele, jak tylko możemy."
 c_a_contact_muslims_mission_title: "Kontakt z muzułmanami"
 c_a_contact_muslims_mission_desc: "Wśród naszych sąsiadów są tacy, którzy mają zupełnie inne spojrzenie na świat niż my. Mówią, że postępują zgodnie z naukami Proroka, ale są one dla nas zupełnie obce. Musimy utrzymywać z nimi bliskie relacje. Być może wiele możemy się od nich nauczyć."
 c_a_contact_muslims_mission_ct: "Posiadaj sojusznika z grupy religijnej §Ymuzułmańskiej§!, którego opinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y200§!."
 c_a_expand_religion_mission_title: "Szerzenie naszych poglądów religijnych"
 c_a_expand_religion_mission_desc: "Nasza wiara i nasz obraz świata są bez wątpienia jedynymi prawdziwymi. Każdy, kto twierdzi inaczej, jest po prostu zbyt zaślepiony, by dostrzec prawdę. Musimy do nich dotrzeć, jeśli chcemy otworzyć im oczy."
 c_a_expand_religion_mission_ct: "Granicz z dowolną prowincją, która nie wyznaje religii §Y[Root.Religion.GetName]§!."
 c_a_convert_mission_title: "Przyjęcie do wspólnoty wiernych"
 c_a_convert_mission_desc: "Wciąż wielu ludzi pozostaje w błędzie i nie podziela naszych przekonań. Nie możemy na to pozwolić. Musimy uświadomić im ich pomyłkę i skłonić ich do przyjęcia jedynej prawdy."
 c_a_convert_mission_tt: "Nawróć §Y10§! prowincji (§Y[Root.GetNumConvertedProvinces]§!/§Y10§!)"
 c_a_improve_infrastructure_title: "Rozbudowa infrastruktury"
 c_a_improve_infrastructure_desc: "Choć łupienie naszych sąsiadów od dawna stanowi ważną część gospodarki, powinniśmy rozwinąć własną infrastrukturę, by zwiększyć produkcję bogactwa. Musimy stworzyć silną, samowystarczalną gospodarkę, która nie będzie zależeć od obecności sąsiadów, których można złupić."
 c_a_preparing_for_war: "Przygotowania do wojny"
 desc_c_a_preparing_for_war: "Zebraliśmy armię, więc nadszedł czas, aby ją wykorzystać"
 c_a_training: "Szkolenie armii"
 desc_c_a_training: "Teraz, gdy nasza armia jest w pełni wyszkolona, stała się potężną siłą"
 c_a_hegemon: "Hegemon militarny"
 desc_c_a_hegemon: "Staliśmy się najpotężniejszym państwem w okolicy. Wszystkie ziemie powinny nam się pokłonić."
 c_a_spoils_of_war: "Łupy wojenne"
 desc_c_a_spoils_of_war: "Napadanie na naszych sąsiadów dla zysku jest najlepszym sposobem na wzmocnienie naszej gospodarki"
 c_a_vassals: "Lojalni wasale"
 desc_c_a_vassals: "Zdobycie tak wielu wasali dało wszystkim do zrozumienia, że jesteśmy dyplomatycznie silni"
 c_a_humiliated_rival: "Upokorzenie naszych rywali"
 desc_c_a_humiliated_rival: "Zadając tak decydujący cios naszym rywalom, sprawiliśmy, że zastanowią się oni dwa razy, zanim ponownie się nam przeciwstawią"
 c_a_only_truth: "Jedyna prawda"
 desc_c_a_only_truth: "Nasze wierzenia są jedyną prawdą — musimy przekonać o tym innych."
 c_a_united_cults: "Zjednoczone kulty"
 desc_c_a_united_cults: "Nasze różnorodne kulty zostały wreszcie zjednoczone. Staliśmy się jednością."
 gen_hoa_building_religious_alliances_title: "Sojusze religijne"
 gen_hoa_building_religious_alliances_desc: "Świat zawsze był niebezpieczny i nieprzewidywalny. Musimy budować trwałe relacje z tymi, którzy podzielają nasze wartości i przekonania."
 building_religious_alliances.tooltip: "Co najmniej §Y2§! państwa z tej samej grupy religijnej:\nSojusz z państwem §Y[Root.GetName]§!.\nOpinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y150§!."
 gen_hoa_subjugate_heathens_title: "Podporządkowanie pogan"
 gen_hoa_subjugate_heathens_desc: "Liczne pogańskie plemiona i państwa zagrażają naszemu ludowi oraz naszym sojusznikom. Gdyby połączyły siły, mogłyby stanowić poważne niebezpieczeństwo. Osłabimy je, zanim do tego dojdzie, podporządkowując je naszej sprawiedliwej władzy."
 gen_hoa_heretic_convert_cost_modifier: "Duchowni weterani"
 desc_gen_hoa_heretic_convert_cost_modifier: "Duchowieństwo z Rogu Afryki nieustannie styka się z poganami i heretykami, którzy opierają się ich naukom. Ciągła walka czyni z nich wielkich obrońców wiary."
 gen_hoa_convert_60_provinces_tooltip_tt: "Prowincje w regionie §YRogu Afryki§! muszą wyznawać religię §Y[Root.Religion.GetName]§!."
 gen_hoa_convert_30_provinces_tooltip_tt: "Nawrócono co najmniej 30 prowincji w tym regionie."
 gen_hoa_join_forces_title: "Połączenie sił"
 gen_hoa_join_forces_desc: "Droga naszych wasali była długa i trudna, lecz teraz są już gotowi. Przyjmiemy ich z otwartymi ramionami do naszego wielkiego państwa i wspólnie przyniesiemy tej ziemi wiarę oraz dobrobyt."
 gen_hoa_join_forces.tooltip: "To państwo na drodze dyplomacji zaanektowało wszystkich swoich pogańskich wasali."
 gen_hoa_become_great_power_title: "Światło Rogu Afryki"
 gen_hoa_become_great_power_desc: "Świat jest teraz o wiele większy niż w czasach naszych przodków. Wielkie mocarstwa kształtują swoje ziemie zgodnie z własną wolą. Nie możemy pozwolić, by te pozbawione wiary olbrzymy robiły z nią, co im się żywnie podoba. Musimy się zjednoczyć, podnieść pochodnię wiary i poprowadzić dumny lud Rogu Afryki do raju."
 gen_hoa_great_power_modifier: "Światło Rogu Afryki"
 desc_gen_hoa_great_power_modifier: "Wielka siła, która przewodzi mieszkańcom Rogu Afryki, jest znana i szanowana w każdym zakątku Ziemi."
 gen_hoa_prepare_for_war_title: "Przygotowanie do wojny"
 gen_hoa_prepare_for_war_desc: "Poza naszymi granicami wciąż mamy wielu wrogów, pogan, którzy wierzą w straszliwych bogów i chcą doprowadzić do naszego upadku. Musimy jak najszybciej zebrać nasze siły i przygotować się do nieuniknionej wojny."
 gen_hoa_attack_the_heathens_title: "Atak na pogan"
 gen_hoa_attack_the_heathens_desc: "Wysiłki naszych ludzi opłaciły się i nasza armia jest wreszcie gotowa do obrony naszej ojczyzny. Teraz, gdy mamy przewagę, musimy zaatakować pogan i odebrać im zasoby, które gromadzą, zanim połączą siły i zaatakują nas."
 gen_hoa_attack_the_heathens.tooltip: "Ma swoją stolicę w §YRogu Afryki§!."
 gen_hoa_horn_bravery_modifier: "Męstwo wiernych"
 desc_gen_hoa_horn_bravery_modifier: "Nasi wojownicy są znani ze swojego okrucieństwa i bezwzględności wobec wrogów naszej wiary."
 gen_hoa_expand_borders_title: "Rozszerzenie granic"
 gen_hoa_expand_borders_desc: "Granice naszego państwa nie obejmują jeszcze całego obszaru naszego wielkiego przeznaczenia. Musimy je rozszerzyć i wykorzystać wszystkie dostępne na tych ziemiach zasoby, by spełnić marzenia o bezpiecznej i zamożnej przyszłości."
 gen_hoa_unify_the_horn_of_africa_title: "Zjednoczenie Rogu Afryki"
 gen_hoa_unify_the_horn_of_africa_desc: "Czasy niepokojów i wojen między ludami Rogu Afryki dobiegają końca. Zjednoczymy każde plemię i każdy lud pod naszym sztandarem i doprowadzimy je do pomyślnej i pokojowej przyszłości."
 gen_hoa_unify_horn_modifier: "Zjednoczony Róg Afryki"
 desc_gen_hoa_unify_horn_modifier: "Wszyscy cieszą się teraz, że Róg Afryki został wreszcie zjednoczony we wspólnym państwie."
 gen_hoa_favor_church_title: "Wsparcie [Root.GetChurchOrFallbackName]"
 gen_hoa_favor_church_desc: "Nasz region od zawsze był podzielony, a ludzi zwodziły fałszywe kulty. Połóżmy temu kres, wspierając [Root.GetChurchOrFallbackName] w misji uświadamiania wszystkim poganom ich błędów i przyjmowania ich do wspólnoty wiernych."
 gen_hoa_convert_conquered_title: "Nawracanie podbitych"
 gen_hoa_convert_conquered_desc: "Gdy nowe prowincje dołączają do naszego wielkiego państwa, naszym obowiązkiem jest wskazać podopiecznym drogę do zbawienia. Tylko wierni mogą w pełni zintegrować się z naszym krajem i wraz ze współobywatelami uczestniczyć w naszej chwalebnej przyszłości."
 gen_hoa_convert_conquered_modifier: "Nawracanie pokonanych"
 desc_gen_hoa_convert_conquered_modifier: "Ci, którzy są pod naszą opieką, muszą przestrzegać naszych tradycji i z wdzięcznością przyjąć swoje zbawienie."
 gen_hoa_convert_the_horn_title: "Ocalenie Rogu Afryki"
 gen_hoa_convert_the_horn_desc: "Wielkim przeznaczeniem naszego państwa jest poprowadzenie ludzkości do zbawienia, a czyniąc prawdziwą religię dominującą w Rogu Afryki, zrobimy pierwszy krok ku naszej przyszłości."
 gen_hoa_convert_the_horn_modifier: "Święty Róg Afryki"
 desc_gen_hoa_convert_the_horn_modifier: "Mieszkańcy Rogu Afryki są wreszcie zjednoczeni pod jedną prawdziwą wiarą."
 gen_hoa_stabilize_economy_mission_title: "Stabilizacja gospodarki"
 gen_hoa_stabilize_economy_mission_desc: "Niestabilność naszego regionu jest wielką szansą dla tych, którzy są na tyle odważni, by z niej skorzystać. Musimy zrobić wszystko, aby zwiększyć dochody państwa i przygotować się na nadchodzące trudne czasy."
 gen_hoa_stabilize_economy_mission.tooltip: "Nie posiada pożyczek zaciągniętych u stanów."
 gen_hoa_developing_economy_modifier: "Rozwijająca się gospodarka"
 desc_gen_hoa_developing_economy_modifier: "Gospodarka naszego kraju odzyskała swój wigor i stwarza nowe możliwości dla naszych ludzi."
 gen_hoa_build_temples_title: "Kamienne świątynie"
 gen_hoa_build_temples_desc: "Nowo zgromadzone bogactwo państwa musi teraz wrócić do ludzi. Wypełnimy nasz obowiązek dobroczynności, odbudowując świątynie i infrastrukturę naszej wiary."
 gen_hoa_build_temples_modifier: "Nowe świątynie"
 desc_gen_hoa_build_temples_modifier: "Ulepszenia naszej stolicy i budowa nowych świątyń uspokajają poddanych i dają im nadzieję na przyszłość."
 gen_hoa_build_trade_navy_title: "Zbuduj flotę"
 gen_hoa_build_trade_navy_desc: "Nasz lud ma wielkie tradycje kupieckie, jednakże zawsze handlowaliśmy z obcokrajowcami, którzy przybywali do naszych wybrzeży. Teraz nadszedł czas, abyśmy zbudowali wielką flotę handlową, która będzie podróżować do odległych krain i przywozić najwspanialsze bogactwa."
 gen_hoa_trade_navy_modifier: "Flota handlowa"
 desc_gen_hoa_trade_navy_modifier: "Wielka marynarka naszego państwa jest gotowa za wszelką cenę przynieść zysk naszym ludziom."
 gen_hoa_control_coastline_title: "Kontrola linii brzegowej"
 gen_hoa_control_coastline_desc: "Kupcy z naszego ludu są podstawą naszej siły. Zanim zaczniemy patrzeć na zewnątrz, musimy dołożyć wszelkich starań, aby umocnić ich pozycję w handlu w naszym regionie."
 gen_hoa_control_coastline_modifier: "Morze możliwości"
 desc_gen_hoa_control_coastline_modifier: "Rozległa linia brzegowa naszego państwa jest niezwykle kluczowa dla naszego handlu z resztą świata i jako taka jest naszym najważniejszym zasobem."
 gen_hoa_control_india_ocean_title: "Zdominowanie Oceanu Indyjskiego"
 gen_hoa_control_india_ocean_desc: "Róg Afryki ma uprzywilejowane położenie i musimy je wykorzystać, aby rozszerzyć nasze wpływy i stać się najbardziej skutecznymi kupcami na Oceanie Indyjskim."
 gen_hoa_control_india_ocean.tooltip1: "Państwo §Y[Root.GetName]§! ma §Y70%§! siły handlowej w §YZatoce Adeńskiej§!"
 gen_hoa_control_india_ocean.tooltip2: "Państwo §Y[Root.GetName]§! ma §Y50%§! siły handlowej w §YEtiopii§!"
 gen_hoa_control_india_ocean.tooltip3: "Państwo §Y[Root.GetName]§! ma §Y30%§! siły handlowej w §YGudźaracie§!"
 gen_hoa_control_india_ocean.tooltip4: "Państwo §Y[Root.GetName]§! posiada §Y30%§! siły handlowej w §YKoromandelu§!"
 gen_hoa_control_india_ocean.tooltip5: "Państwo §Y[Root.GetName]§! ma §Y15%§! siły handlowej w §YBengalu§!"
 gen_hoa_control_india_ocean.tooltip6: "Państwo §Y[Root.GetName]§! ma §Y15%§! siły handlowej w §YMalakce§!"
 west_africa_assemble_warband_title: "Zgromadzenie drużyny wojennej"
 west_africa_assemble_warband_desc: "Aby skutecznie umocnić kontrolę nad naszym terytorium, musimy zgromadzić drużynę dzielnych wojowników."
 west_africa_strong_leadership_title: "Silne przywództwo"
 west_africa_strong_leadership_desc: "Nasi rywale muszą być świadomi naszej odwagi i potęgi. Musimy więc pokazać, że jesteśmy najsilniejsi w okolicy, upokarzając ich na polu bitwy."
 west_africa_strong_leadership_ct: "Żaden znany kraj ze stolicą w §YSahelu§!, §YNigrze§! i §YGwinei§! nie jest niepodległym państwem o większym rozwoju niż §Y[Root.GetName]§!."
 west_africa_unite_home_region_title: "Zjednocz region macierzysty"
 west_africa_unite_home_region_desc: "W ostatnich latach urośliśmy w siłę i mamy okazję zjednoczyć wszystkich mieszkańców naszego regionu po raz pierwszy od pokoleń."
 west_africa_gunpowder_weapons_title: "Broń prochowa"
 west_africa_gunpowder_weapons_desc: "Jesteśmy teraz potężną siłą w naszym regionie, ale zauważyliśmy pojawienie się nowego rodzaju broni. Handlują nią zagraniczni kupcy i nazywają prochem strzelniczym. Musimy zagwarantować, że będą ją posiadać nasi wojownicy i to bez konieczności polegania na tych cudzoziemcach."
 west_africa_greater_than_mali_title: "Potężniejsi niż Mali!"
 west_africa_greater_than_mali_desc: "Po zjednoczeniu naszego regionu, z nową bronią w rękach naszych wojowników, jesteśmy gotowi podbić wszystkie ziemie pomiędzy Saharą a Zatoką Gwinejską. Nie możemy zmarnować okazji, aby stać się największą potęgą od czasu upadku Imperium Mali, a nawet jeszcze większą!"
 west_africa_embracing_old_traditions_title: "Podążanie za starymi tradycjami"
 west_africa_embracing_old_traditions_desc: "Od pokoleń przestrzegamy naszych starożytnych tradycji. Teraz gdy nowe religie rozprzestrzeniają się wśród naszych ludzi, musimy trzymać się razem i podporządkować naszym starym rytuałom, aby przetrwać."
 west_africa_brothers_in_tradition_fetishist_title: "Bracia w wierze"
 west_africa_brothers_in_tradition_fetishist_desc: "Nasz lud ma długą tradycję konfliktów z sąsiednimi ludami z powodu naszych i ich wierzeń. Teraz jednak nadszedł czas, aby sprzymierzyć się z nimi przeciwko wiarom osłabiającym nasze terytoria."
 west_africa_shamans_title: "Szamani"
 west_africa_shamans_desc: "Nasze wierzenia są silne wśród naszych ludzi, ale uważamy, że samo oddawanie czci to za mało. Nasi szamani chętnie nauczą cudzoziemców o kulcie, który czyni nas silniejszymi."
 west_africa_sankore_university_fetishist_title: "Uniwersytet Sankore"
 west_africa_sankore_university_fetishist_desc: "Medresa Sankore w Timbuktu od dziesięcioleci jest najważniejszym ośrodkiem wiedzy na południe od Sahary. Teraz nadszedł czas, aby przejąć to miasto i wykorzystać przechowywane tam manuskrypty."
 west_africa_sincretic_rituals_title: "Rytuały synkretyczne"
 west_africa_sincretic_rituals_desc: "W regionach Sahelu, Nigru i Gwinei rozpowszechnione są liczne kulty, tradycje i wierzenia. W naszym interesie leży stworzenie tygla, w którym wszystkie te nurty będą mogły współistnieć. Lepsze wzajemne zrozumienie poddanych wesprze rosnącą potęgę naszego państwa w tych regionach."
 west_africa_embracing_new_traditions_title: "Przyjmij nowe tradycje"
 west_africa_embracing_new_traditions_desc: "Islam jest obecny w naszym regionie od dawna, lecz nasi mieszkańcy nie przyjęli go jeszcze w pełni. Musimy to zmienić i zadbać o to, by nasza pobożność zyskała nam szacunek."
 west_africa_brothers_in_faith_sunni_title: "Bracia w wierze"
 west_africa_brothers_in_faith_sunni_desc: "Nasz lud ma długą tradycję konfliktów z sąsiednimi ludami z powodu naszych i ich wierzeń. Teraz jednak nadszedł czas, aby sprzymierzyć się z nimi przeciwko wiarom osłabiającym nasze terytoria."
 west_africa_marabouts_title: "Marabuci"
 west_africa_marabouts_desc: "Marabuci od pokoleń szerzą w tym regionie pięć filarów islamu. Teraz nadszedł czas, aby wesprzeć ich wysiłki i sprawić, by ich słowo rozprzestrzeniało się szerzej."
 west_africa_sankore_university_sunni_title: "Uniwersytet Sankore"
 west_africa_sankore_university_sunni_desc: "Medresa Sankore w Timbuktu od dziesięcioleci jest najważniejszym ośrodkiem wiedzy na południe od Sahary. Teraz nadszedł czas, aby przejąć to miasto i wykorzystać przechowywane tam manuskrypty."
 west_africa_the_only_faith_title: "Jedyna wiara"
 west_africa_the_only_faith_desc: "Nasze wysiłki na rzecz szerzenia szahady i innych filarów islamu oraz Koranu wśród rządzonych przez nas ludzi były intensywne przez dziesięciolecia. Teraz musimy potwierdzić, że islam jest jedyną religią, ponieważ nie ma boga prócz Allaha."
 west_africa_gathering_tributes_title: "Zbieranie danin"
 west_africa_gathering_tributes_desc: "Konieczne jest, aby nasi ludzie zbierali daniny od naszych sąsiadów, ponieważ potrzebujemy ich, aby urosnąć w siłę w ciągu najbliższych kilku lat."
 west_africa_clearings_irrigations_title: "Wycinka i nawadnianie"
 west_africa_clearings_irrigations_desc: "Nasze ziemie były odpowiednie dla rolnictwa, odkąd ludzie zaczęli je uprawiać, ale jeśli chcemy wyżywić większą liczbę ludności mieszkającej na naszym terytorium, musimy wprowadzić pewne wyręby w lasach i dżunglach oraz zorganizować nawadnianie w dolinach naszych rzek."
 west_africa_salt_cloth_shells_title: "Sól, sukno i muszle"
 west_africa_salt_cloth_shells_desc: "Handel przez saharyjskie korytarze i Zatokę Gwinejską od pewnego czasu wzrasta, a w naszych miastach pojawiają się nowi kupcy z zagranicy, którzy handlują nowymi produktami. Teraz musimy przejąć kontrolę nad tym lukratywnym handlem i wykorzystać go na naszą korzyść."
 west_africa_manufacturing_africa_title: "Produkcja w Afryce"
 west_africa_manufacturing_africa_desc: "Luksusowe towary handlowe zza oceanu od kilku lat zalewają nasze terytoria. Teraz mamy możliwość powielania i tworzenia nowych towarów we własnym zakresie, czerpania zysków z ich sprzedaży wśród naszych ludzi, a nawet eksportowania ich za granicę."
 west_africa_bilad_sudan_trade_title: "Handel w Bilad as-Sudan"
 west_africa_bilad_sudan_trade_desc: "Kilka ważnych ośrodków rozwinęło się wraz ze wzrostem handlu w ostatnich dziesięcioleciach w całym regionie. Timbuktu jest bramą na północ, Kanem-Borno kontroluje handel ze wschodem, a Benin jest głównym miejscem na południowym wybrzeżu. Teraz konieczne jest przejęcie kontroli nad tymi miejscami i przepływającym przez nie handlem."
 zan_centralize_trade_at: "Państwo §Y[Root.GetName]§! ma §Y85%§! siły handlowej w którymkolwiek z tych węzłów handlowych: §YZanzibar§!, §YPrzylądek Dobrej Nadziei§! lub §YWybrzeże Kości Słoniowej§!."
 zan_centralize_trade_bt: "Państwo §Y[Root.GetName]§! posiada co najmniej §Y30%§! siły handlowej lub jest §Ynajsilniejszym uczestnikiem handlu§! w węźle handlowym §YZambezi§! albo §YZatoki Adeńskiej§!."
 zan_centralize_trade_ct: "Państwo §Y[Root.GetName]§! posiada co najmniej §Y10%§! siły handlowej lub jest §Ynajsilniejszym uczestnikiem handlu§! w węźle handlowym §YGudźaratu§! albo §YKoromandelu§!."
 mal_second_branch_mission_title: "[Root.GetSelectableMissionTitle]"
 mal_second_branch_mission_desc: "[Root.GetSelectableMissionDescription]"
 obj_convert_25_provinces_tooltip: "Nawróć §Y25§! prowincji (§Y[Root.GetNumConvertedProvinces]§!/§Y25§!)."
 eth_secure_religious_unity_title: "Zabezpieczenie religijnej jedności"
 eth_secure_religious_unity_desc: "Nasze państwo jest religijnie podzielone między Koptów, Żydów i muzułmanów. Prowadzi to do braku jedności religijnej, co sprawia, że wszelkie wysiłki zmierzające do centralizacji państwa i przezwyciężenia problemów są prawie niemożliwe. Musimy zabezpieczyć naszą religijną jedność!"
 hausa_claims_tt: "§Y[Root.GetName]§! uzyskuje stałe roszczenia do każdej prowincji §YHausa§! w regionie §YNigru§!."
 hau_build_armies_ct: "Państwo §Y[Root.GetName]§! otrzyma stałe roszczenia do każdej prowincji Hausa w regionie §YNigru§!, jeśli ukończy misję „§YZawarcie sojuszy§!”."
 hau_the_seven_great_cities_tt: "Prowincje §Y[2280.GetName]§!, §Y[1149.GetName]§!, §Y[2279.GetName]§!, §Y[1148.GetName]§!, §Y[1155.GetName]§!, §Y[2281.GetName]§! i §Y[1154.GetName]§! otrzymają specjalny modyfikator prowincji na §Y10 lat§!, upamiętniający ich historyczne znaczenie w dziejach Hausa."
 hau_the_seven_great_cities_decision_tt: "Odblokuje decyzję pozwalającą państwu [Root.GetName] nakładać modyfikatory prowincji §YSiedmiu Miast§! na prowincje §Y[2280.GetName]§!, §Y[1149.GetName]§!, §Y[2279.GetName]§!, §Y[1148.GetName]§!, §Y[1155.GetName]§!, §Y[2281.GetName]§! i §Y[1154.GetName]§! na §Y10 lat§! co §Y20 lat§!, za cenę §Y75§! punktów administracyjnych."
 hau_gather_allies_ct: "Państwo §Y[Root.GetName]§! otrzyma stałe roszczenia do każdej prowincji Hausa w regionie §YNigru§!, jeśli ukończy misję „§YZgromadzenie armii§!”."
 hau_the_kanuri_threat_tt: "Każda posiadana prowincja Kanuri otrzyma modyfikator „§YPodbój Hausa§!” na §Y30 lat§!, zapewniający następujące efekty:\nLokalne niepokoje: §G-2.00§!\nLokalny separatyzm: §G-5.00§!"
 hau_prepare_the_jihad_tt: "Państwo §Y[Root.GetName]§! uzyskuje trwałe roszczenia do każdej prowincji w regionie §YSahelu§!, §YNigru§! lub §YGwinei§!, która nie jest wyznania §Ymuzułmańskiego§!."
 JOL_TRADE_DEAL_AGREEMENT: "Umowa handlowa Jolofu"
 JOL_INCREASED_IVORY_DEMAND: "Zwiększony popyt na kość słoniową"
 jol_gain_ports_tt: "Losowy posiadany port rozpocznie bezpłatną budowę §Y6 lekkich okrętów§! oraz §Ywielkiej stoczni§! w §Y50%§! standardowego czasu."
 four_years_of_trade_income: "Uzyskaj §G4-letni§! dochód z handlu."
 jol_centralize_the_state_ct: "Zmniejsz autonomię każdej posiadanej prowincji, w której wynosi ona co najmniej §Y5§!, o §G100%§! i zyskaj §G0.1§! absolutyzmu za każdą prowincję."
 msi_integrate_the_muslims_ct: "Popraw opinię każdego znanego kraju §Ymuzułmańskiego§! w §YAfryce Zachodniej§! o §G50§!."
 msi_integrate_the_muslims_at: "Każda posiadana prowincja §Ymuzułmańska§! otrzymuje modyfikator prowincji '§YZintegrowani poganie§!' na §Y25 lat§!, co daje następujące efekty:\nWkład w lokalną jedność religijną: §G-100,0%§!\nLokalne niepokoje: §G-2.00§!\nModyfikator podatków lokalnych: §G+15.0%§!"
 msi_integrate_the_muslims_bt: "Każda posiadana prowincja §Ypogańska§! otrzymuje modyfikator prowincji '§YZintegrowani poganie§!' na §Y25 lat§!, co daje następujące efekty:\nWkład w lokalną jedność religijną: §G-100,0%§!\nLokalne niepokoje: §G-2.00§!\nModyfikator podatków lokalnych: §G+15.0%§!"
 msi_gather_the_troops_ct: "Państwo §Y[Root.GetName]§! uzyskuje stałe roszczenia do wszystkich prowincji §YMossi§! w regionie §YNigru§!."
 west_africa_shamans_ct: "Każda posiadana prowincja §Ypogańska§! zyskuje modyfikator prowincji '§YPrawa fetyszystów§!' na §Y25 lat§!, co daje następujące efekty:\nLokalne niepokoje: §G-2.00§!\nMiesięczna zmiana lokalnej autonomii: §G-0.05§!"
 west_africa_marabouts_ct: "Każda posiadana prowincja §Ymuzułmańska§! zyskuje na §Y25 lat§! modyfikator prowincji '§YLokalny marabut§!', dający następujące efekty:\nLokalne niepokoje: §G-2.00§!\nMiesięczna zmiana lokalnej autonomii: §G-0,05§!"
 oyo_trade_with_the_muslims_at: "Posiada §Ycentrum handlowe§! w węźle handlowym §YTimbuktu§!."
 oyo_trade_with_the_muslims_bt: "Dowolny właściciel §Yośrodka handlu§! w węźle handlowym §YTimbuktu§! ma opinię o państwie [Root.GetName] wynoszącą co najmniej §Y90§! lub jest jego państwem podległym."
 oyo_chaaargee_ct: "Stolica §Yrywala§!, §Ywroga§!, §Ywielkiego mocarstwa§! lub państwa o większym całkowitym rozwoju niż §Y[Root.GetName]§! znajduje się pod naszą kontrolą, a w tej stolicy stacjonuje jednostka kawalerii."
 oyo_chaaargee_tt: "Kompania najemników §YKawaleria Oyo§! nie będzie już obniżać §Yprofesjonalizmu armii§! podczas rekrutacji."
 CAPITAL_MONOPOLY: "Produkcja stolicy."
 hau_build_armies_title: "Zebranie armii"
 hau_build_armies_desc: "Jeśli mamy przetrwać i odnieść sukces jako naród, pierwszą rzeczą, którą musimy zrobić, to upewnić się, że nikt nie będzie w stanie nas zniszczyć. Musimy zebrać armię, która zapewni nam bezpieczeństwo i którą będziemy mogli wykorzystać do pokonania naszych wrogów."
 hau_the_yoruba_and_nupe_title: "Joruba i Nupe"
 hau_the_yoruba_and_nupe_desc: "Ludy Joruba oraz Nupe są tuż obok, a ich ziemie stanowią doskonały cel naszej ekspansji. Musimy je podbić, aby stworzyć solidną pozycję, z której później będziemy mogli dalej się rozwijać."
 hau_gain_sea_access_title: "Uzyskanie dostępu do morza"
 hau_gain_sea_access_desc: "Zbyt długo byliśmy otoczeni zewsząd lądem. Musimy uzyskać dostęp do morza, co pozwoliłoby nam rozszerzyć nasz zasięg bardziej niż kiedykolwiek wcześniej."
 hau_unite_the_cities_title: "Zjednoczenie miast"
 hau_unite_the_cities_desc: "Poszczególne miasta Hausa były zbyt długo podzielone i konkurowały między sobą. Musimy zjednoczyć je wszystkie pod jednym sztandarem, naszym."
 hau_develop_the_cities_title: "Rozwój miast"
 hau_develop_the_cities_desc: "Teraz, gdy wszystkie miasta Hausa są pod naszą kontrolą, musimy je rozwijać, aby błyszczały jak klejnoty, którymi powinny być."
 hau_resolve_internal_issues_title: "Rozwiązywanie wewn. problemów"
 hau_resolve_internal_issues_desc: "Po zjednoczeniu wszystkich miast Hausa, nieuniknione jest powstanie wewnętrznych konfliktów. Musimy pracować nad rozwiązaniem tych kwestii, abyśmy mogli naprawdę stać się jednym narodem."
 hau_contact_with_the_fulani_title: "Kontakt z Fulanami"
 hau_contact_with_the_fulani_desc: "Fulanie niespodziewanie stali się ostatnio bardziej istotni. Musimy nawiązać z nimi kontakt i ocenić, czy współpraca z nimi będzie dla nas korzystna."
 hau_gather_allies_title: "Zawrzyj sojusze"
 hau_gather_allies_desc: "Jeśli mamy przetrwać i odnieść sukces jako naród, pierwszą rzeczą, którą musimy zrobić, to upewnić się, że nikt nie będzie w stanie nas zniszczyć. Musimy zawrzeć sojusze, aby zmniejszyć zagrożenia przeciwko nam i jednocześnie zapewnić sobie protektorów."
 hau_the_kanuri_threat_title: "Zagrożenie od Kanurów"
 hau_the_kanuri_threat_desc: "Kanuri są tuż obok i stanowią zagrożenie dla naszej ekspansji. Musimy ich pokonać, zanim staną się na tyle potężni, by podbić nas."
 hau_the_tuareg_title: "Tuaregowie"
 hau_the_tuareg_desc: "Tuaregowie zawsze żyli na pustynnych obszarach położonych na północ od nas. Nadszedł czas, abyśmy rozszerzyli nasze działania w tym kierunku i podporządkowali ich naszym rządom."
 hau_prepare_the_jihad_title: "Przygotowanie do dżihadu"
 hau_prepare_the_jihad_desc: "Jest jasne, że nauki Proroka są jedyną prawdziwą wiarą. Musimy być przygotowani do walki z każdym, kto ośmieli się twierdzić inaczej."
 hau_convert_west_africa_title: "Nawróć Afrykę Zach."
 hau_convert_west_africa_desc: "Wciąż jest zbyt wielu ludzi, którzy nie wierzą w nauki Proroka, ale nie możemy dłużej tego tolerować. Musimy szerzyć Jego nauki, jeśli mamy stać się latarnią cywilizacji."
 hau_finish_the_jihad_title: "Ukończ dżihad"
 hau_finish_the_jihad_desc: "Udało nam się skutecznie rozpowszechnić nauki Proroka, ale wciąż są ludzie, którzy w nie nie wierzą. Musimy przekonać ich wszystkich, aby stać się prawdziwym kalifatem."
 aju_completely_modernized_army: "Modernizacja armii"
 desc_aju_completely_modernized_army: "Zdecydowaliśmy się na masowe inwestycje w naszą armię i zmodernizowanie jej w oparciu o wskazówki osmańskie."
 aju_bought_new_guns: "Broń od Osmanów"
 desc_aju_bought_new_guns: "Postanowiliśmy zainwestować w naszą armię i wyposażyć ją w broń palną Imperium Osmańskiego."
 aju_keep_the_ways: "Zachowanie starych metod"
 desc_aju_keep_the_ways: "Postanowiliśmy zrezygnować z przewodnictwa Turków. Zamiast tego zachowujemy stare sposoby prowadzenia wojny, które są bardziej przystępne dla większości naszych ludzi."
 jol_the_mali_border_title: "Granica z Mali"
 jol_the_mali_border_desc: "Na wschodzie silne państwo Mali zagraża naszemu bezpieczeństwu i nasi doradcy, słusznie, mówią nam, abyśmy zaczęli opracowywać strategię obrony.\nNa wszelki wypadek."
 jol_take_over_futa_jallon_title: "Przejmij Futa Dżalon"
 jol_take_over_futa_jallon_desc: "Futa Dżalon to piaskowcowy płaskowyż, mocno zerodowany przez obfite opady deszczu, leżący na południowy zachód od naszego państwa. Region ten może być wykorzystany jako początek dłuższego frontu, który rzuci wyzwanie potędze Mali."
 jol_gain_ports_title: "Zdobądź porty"
 jol_gain_ports_desc: "Przez wieki nasi ludzie patrzyli na morze jako na szansę, ponieważ większość naszego kraju leży nad morzem. Teraz, bardziej niż kiedykolwiek, nasza ekspansja musi skupić się na uzyskaniu większej liczby portów, jeśli chcemy polegać na morzu."
 jol_discover_europe_title: "Odkrywanie Europy"
 jol_discover_europe_desc: "Wielokrotnie do naszych brzegów przybijali płynący z północy ludzie o bladej skórze, którzy przeważnie próbowali z nami handlować. Wiedząc, skąd pochodzą, możemy ustalić warunki wymiany handlowej i uniknąć kolejnych prób zastraszania nas."
 jol_trade_experts_title: "Eksperci handlowi"
 jol_trade_experts_desc: "Teraz gdy znamy praktyki handlowe w Europie, możemy przyjrzeć się naszym i poprawić je tam, gdzie uważamy, że zawodzą. Wykorzystamy te nowe i lepsze techniki, aby stać się dominującym handlowcem w naszym regionie."
 jol_the_fulani_title: "Fulanie"
 jol_the_fulani_desc: "Fulanie są naszymi sąsiadami i od wieków nasze ludy utrzymują kontakty. Nie zawsze były to relacje przyjazne, ale istnieje między nami pewien rodzaj pokrewieństwa i sądzimy, że możliwe byłoby pełne włączenie ich do naszego państwa."
 jol_push_further_into_mali_title: "Dalsza ekspansja w Mali"
 jol_push_further_into_mali_desc: "W miarę jak rośnie nasza siła, siła Mali zaczyna słabnąć. Nadszedł czas, aby zrewanżować się za jarzmo, pod którym nasi ludzie cierpieli przez lata. Zaatakujemy §YBaghenę§!, §YManding§! i §YMassinę§!."
 jol_replace_mali_title: "Zastąp Mali"
 jol_replace_mali_desc: "Mali zajęło miejsce imperium Ghany jako hegemon Afryki Zachodniej. Teraz nadszedł nasz czas. Mali musi paść albo jako nasz poddany, albo jako truchło."
 jol_the_songhai_threat_title: "Zagrożenie z Songhaju"
 jol_the_songhai_threat_desc: "Ponieważ Songhaj jest jednym z najpotężniejszych krajów w okolicy, jego istnienie stanowi zagrożenie dla naszego państwa. Tak długo, jak nie będzie się ich trzymać w ryzach, istnieje niebezpieczeństwo. Uklękną przed nami lub zginą."
 jol_west_african_great_power_title: "Mocarstwo Afryki Zach."
 jol_west_african_great_power_desc: "Aby świat wiedział, kto rządzi w Afryce Zachodniej, musimy zapewnić sobie bezpośrednią kontrolę nad wystarczającą ilością ziemi. Do broni!"
 jol_the_tribal_confederacy_title: "Konfederacja plemienna"
 jol_the_tribal_confederacy_desc: "Nasz naród to kilka drobnych królestw, które samodzielnie są słabe. Jednakże, gdy będą działać wspólnie, mogą stanowić ogromne zagrożenie dla naszych wrogów. Powinniśmy zjednoczyć naszych ludzi i podbić świat."
 jol_reforms_for_the_state_title: "Reformy państwowe"
 jol_reforms_for_the_state_desc: "Jako konfederacja plemienna nasi mieszkańcy częściej walczyli między sobą niż z przeciwnikami. W rezultacie wciąż obowiązują u nas przestarzałe prawa, które ograniczają sprawność państwa. Musimy to zmienić!"
 jol_centralize_the_state_title: "Centralizacja państwa"
 jol_centralize_the_state_desc: "Zbyt długo władza była podzielona między Burów, czyli króla, a pomniejszych królów i wodzów naszego państwa. Musimy przywrócić całą tę utraconą władzę naszemu władcy."
 zim_militarize_the_nguni_title: "Rekrutacja Nguni"
 zim_militarize_the_nguni_desc: "Choć nasi mieszkańcy są z natury walecznymi i silnymi wojownikami, nadal pozostają [Root.GetAdjective] — poddanymi naszego [Root.GovernmentName]. Powinniśmy rozważyć zaciągnięcie dzikich plemion i klanów z południa, by oszczędzić własnych ludzi."
 zim_learn_from_the_nguni_title: "Nauka od Nguni"
 zim_learn_from_the_nguni_desc: "Nguni udowodnili swoją wartość w walce. Wykazali się siłą i sprytem na polu bitwy. Powinniśmy rozwinąć potencjał militarny Nguni i wykorzystać ich pomysłowość w nadchodzących wojnach."
 oyo_trade_with_the_muslims_title: "Handel z muzułmanami"
 oyo_trade_with_the_muslims_desc: "Handel zawsze odgrywał istotną rolę w naszym regionie, zwłaszcza ten prowadzony przez muzułmanów przez Timbuktu i Gao. Nie możemy pozostawać w tyle za nimi. Jeśli mamy odnosić zyski, musimy również aktywnie uczestniczyć w przepływie handlu i być w stanie go kontrolować."
 oyo_found_the_cavalry_regiment_title: "Kawaleria dla [Root.GetAdjective]"
 oyo_found_the_cavalry_regiment_desc: "Dzięki naszej wymianie handlowej z krajami muzułmańskimi mamy teraz dostęp do koni, surowca do tej pory u nas niespotykanego. Musimy również utworzyć pułki kawalerii, na wzór tych, które posiadają kraje muzułmańskie."
 oyo_chaaargee_title: "Szaaarża!!"
 oyo_chaaargee_desc: "Teraz, gdy mamy już pułki kawalerii, nadszedł czas, aby je wykorzystać. Możemy wykorzystać ich doskonałą manewrowość do szybkiego zdobycia stolicy wroga i całkowitego jej zmiażdżenia. Dokładnie tak zrobimy."
 oyo_appease_the_oyo_mesi_title: "Udobruchaj Ojo Mesi"
 oyo_appease_the_oyo_mesi_desc: "Oyo Mesi, nasza rada możnych, od zawsze stanowi integralną część rządu. Żaden władca nie może zostać intronizowany bez jej zgody, a rada może również pozbawić go tronu, jeśli uzna go za zbyt tyrańskiego. Musimy zadbać o to, by była zadowolona z naszych rządów."
 oyo_perma_claims_tt: "Państwo §Y[Root.GetName]§! otrzyma permanentne roszczenia do obszarów §YBeninu§!, §YDolnego Nigru§!, §YZarii§!, §YAtakora Oueme§! oraz §YDolnej Wolty§!."
 oyo_appease_the_oyo_mesi_ct: "Państwo §Y[Root.GetName]§! otrzyma permanentne roszczenia do obszarów §YBeninu§!, §YDolnego Nigru§!, §YZarii§!, §YAtakora Oueme§! oraz §YDolnej Wolty§!, jeżeli wcześniej wykonało misję '§YUdobruchaj Ogboni§!'."
 oyo_push_north_tt: "Państwo §Y[Root.GetName]§! otrzyma permanentne roszczenia do wszystkich prowincji w regionach §YSahelu§!, §YNigru§! i §YGwinei§! wyznających inną religię niż §Y[Root.Religion.GetName]§!."
 oyo_appease_the_ogboni_ct: "Państwo §Y[Root.GetName]§! otrzyma permanentne roszczenia do obszarów §YBeninu§!, §YDolnego Nigru§!, §YZarii§!, §YAtakora Oueme§! oraz §YDolnej Wolty§!, jeżeli wcześniej wykonało misję '§YUdobruchaj Ojo Mesi§!'."
 oyo_push_north_title: "Ekspansja na północ"
 oyo_push_north_desc: "W przeciwieństwie do gęstych dżungli Południa, bujne równiny Sahelu na północy są świetnym źródłem bogactwa. Stąd uważamy, że naszym jedynym rozsądnym wyborem jest ekspansja w kierunku północnym."
 oyo_eradicate_the_muslims_title: "Wypleń muzułmanów"
 oyo_eradicate_the_muslims_desc: "Otaczający nas muzułmanie przestali nam służyć i zaczęli być uciążliwi. Musimy pozbyć się ich całkowicie, aby zrobić miejsce dla naszej własnej chwalebnej ekspansji."
 oyo_eradicate_the_muslims_ct: "Jest poddanym państwa §Y[Root.GetName]§! albo wyznaje §Y[Root.Religion.GetName]§!."
 oyo_growth_of_power_title: "Rośnij w siłę"
 oyo_growth_of_power_desc: "My, Ojo, jesteśmy wielkim narodem. Ale zawsze możemy stać się jeszcze większym. Musimy rozbudować nasz chwalebny naród, aby mógł być przedmiotem zazdrości świata."
 oyo_develop_the_capital_title: "Rozwiń stolicę"
 oyo_develop_the_capital_desc: "Nasza stolica to lśniący klejnot naszego kraju i jego symbol. Musimy przekształcić je w prawdziwe, tętniące życiem miasto, które wyraźnie pokazuje swoje znaczenie."
 oyo_reform_the_government_title: "Zreformuj rząd"
 oyo_reform_the_government_desc: "Nasze stare tradycje plemienne stały się zbyt małe dla naszych wielkich ambicji. Musimy zreformować nasz rząd w chwalebne państwo, jeśli mamy stanąć wśród gigantów świata."
 oyo_imperial_oyo_title: "Cesarstwo Ojo"
 oyo_imperial_oyo_desc: "Ojo zawsze było Imperium w naszych oczach. Nadszedł czas, aby stało się nim w oczach wszystkich. Musimy pokazać prawdziwą siłę, jeśli chcemy zasłużyć na to miano."
 oyo_appease_the_ogboni_title: "Udobruchaj Ogboni"
 oyo_appease_the_ogboni_desc: "Członkowie Ogboni zawsze stanowili wpływową część naszego rządu. Ich zaangażowanie nie ogranicza się tylko do spraw religijnych, ale mają oni również wpływ na wybór władców. Dlatego też musimy się upewnić, że są po naszej stronie."
 oyo_unite_the_fetishists_title: "Zjednocz fetyszystów"
 oyo_unite_the_fetishists_desc: "Nasze przekonania zawsze stanowiły integralną część naszej tożsamości. Musimy przekonać ludzi wokół nas, aby podzielali tę samą wizję, którą my mamy."
 oyo_gather_cults_title: "Zdobądź kulty"
 oyo_gather_cults_desc: "Teraz, gdy znacznie więcej ludzi podziela nasze wierzenia, wyraźniej dostrzegamy subtelne różnice między szamanami. Musimy zebrać i pogodzić te odmienności, by wypracować jednolitą, prawdziwą wizję wiary."
 msi_balance_of_power_title: "Równowaga sił"
 msi_balance_of_power_desc: "Nasze państwo składa się z wodzów i przywódców religijnych, którzy ku naszej rozpaczy nieustannie walczą między sobą o większą władzę. Powinniśmy porozumieć się z obiema stronami, by zaczęły współpracować dla dobra narodu."
 msi_integrate_the_muslims_title: "Zintegruj muzułmanów"
 msi_integrate_the_muslims_desc: "Społeczeństwo Mossi składa się zarówno z muzułmanów, jak i wyznawców religii fetyszystycznych, którzy często popadają w konflikty. Musimy współpracować z obiema grupami i znaleźć wspólną płaszczyznę porozumienia, by zakończyć te spory religijne. Nasz naród musi przede wszystkim być ludem Mossi."
 msi_invade_the_west_title: "Zaatakuj zachód"
 msi_invade_the_west_desc: "Na zachód od naszego państwa Massina i Dżenne kontrolują śródlądowe ziemie pełne złota i stanowią cenny cel dla naszej ekspansji. Jeśli przejmiemy kontrolę nad tymi dwoma kluczowymi ośrodkami, okoliczne obszary szybko wpadną w nasze ręce. Ponadto kryją one skarby, które zapełnią nasze skarbce."
 msi_gather_the_troops_title: "Zdobądź żołnierzy"
 msi_gather_the_troops_desc: "Nasi mieszkańcy są wojownikami i coraz bardziej niecierpliwią się, pragnąc wyzwań oraz wojny. Powinniśmy skierować tę energię na rozbudowę armii i wyszukanie obiecujących dowódców. Spełnimy ich pragnienia, lecz na naszych warunkach."
 msi_unite_the_kingdoms_title: "Zjednocz królestwo"
 msi_unite_the_kingdoms_desc: "Od czasów księżniczki Yennegi, jej syna Wedraogo oraz ich dzieci i wnuków nasz lud pozostaje podzielony na kilka królestw. Zjednoczeni jesteśmy silni, podzieleni — upadniemy jeden po drugim. Zgromadzimy wszystkie ziemie Mossi pod jednym sztandarem."
 msi_invade_the_north_title: "Zaatakuj północ"
 msi_invade_the_north_desc: "W zakolu rzeki Niger, na północy, potężne miasta Timbuktu i Gao kontrolują bogactwa Afryki Zachodniej i handel z ludami zamieszkującymi wielką pustynię. Ich bogactwo jest niezmierzone i musi być nasze."
 msi_ruler_of_the_river_title: "Władca rzek"
 msi_ruler_of_the_river_desc: "Rzeka Niger błogosławi ziemie, przez które przepływa, okresowymi wylewami, czyniąc glebę niewiarygodnie żyzną. Będziemy mogli nazywać się Władcami Rzeki i korzystać z tej żyzności tylko wtedy, gdy obszar wokół Zakola Nigru będzie należał do nas i tylko do nas."
 msi_hegemony_of_west_africa_title: "Hegemonia w Zach. Afryce"
 msi_hegemony_of_west_africa_desc: "Przez pokolenia Mali kontrolowało większość Afryki Zachodniej żelazną ręką. Ich potęga jednak słabnie, podczas gdy nasza rośnie w siłę z dnia na dzień. Aby objąć hegemonię nad tym regionem, musimy go zdominować i zniszczyć lub podporządkować sobie Mali."
 msi_the_kingdom_confederacy_title: "Królewska Konfederacja"
 msi_the_kingdom_confederacy_desc: "Nasz lud tradycyjnie był rozproszony między liczne królestwa Mossi — większe i mniejsze, lecz mimo to niezdolne do zjednoczenia. Jeśli chcemy przetrwać jako naród, musimy połączyć się w konfederację."
 msi_the_kingdom_confederacy_ct: "Wystąpiło wydarzenie „§YKonfederacyjne Królestwo Mossi§!”."
 msi_the_centralization_question_title: "Scentralizuj konfederację"
 msi_the_centralization_question_desc: "Czasy lokalnych rządów muszą odejść w niepamięć i tylko centralna władza powinna zachować zdolność do kierowania tym narodem. Zadbamy o to, by ludzie zarządzający prowincjami naszego królestwa odpowiadali bezpośrednio przed nami."
 msi_the_centralization_question_tt: "Państwo [Root.GetName] podjęło co najmniej §Y2§! decyzje dotyczące Królestw Konfederacyjnych."
 msi_invade_the_south_title: "Zaatakuj południe"
 msi_invade_the_south_desc: "Choć nie są tak bogate jak ich odpowiedniki na północy, miasta Kong i Bonoman są ośrodkami handlowymi, gdzie pieniądze płyną obficie. Jeśli chcemy dalej finansować nasze kampanie wojskowe, musimy mieć pewność, że kontrolujemy jak najwięcej z tych źródeł bogactwa."
 msi_balance_of_power_ct: "Różnica wpływów [Root.GetClergyName_gen] oraz [Root.GetNobilityOrFallbackName_gen] wynosi §Y5%§! lub mniej."
 ada_prepare_second_invasion_title: "Przygotuj wojsko"
 ada_prepare_second_invasion_desc: "Od chwili powstania na ruinach Ifatu barbarzyńscy chrześcijanie z Etiopii nieustannie zagrażają państwu [Root.GetName]. Nasze ostatnie zwycięstwo nad Etiopią przyniosło nam w 1443 roku prowincję [1210.GetName], lecz to tylko kwestia czasu, zanim Etiopczycy uderzą ponownie. Powinniśmy przygotować siły do nadchodzących konfliktów."
 ada_prepare_second_invasion_tt: "Państwo §Y[Root.GetName]§! otrzymuje następujący bonus, dopóki aktywny jest modyfikator „§YPrzygotowania wojenne Adalu§!”:\nPaństwo [Root.GetName] otrzymuje modyfikator „§YWojna Adalu z Etiopią§!” na czas wojny z państwem §Y[ETH.GetName]§!, którego rozwój jest równy lub większy od rozwoju państwa [Root.GetName]. Zapewnia on następujące efekty:\nMorale armii: §G+5.0%§!\nSzybkość odzyskiwania siły ludzkiej: §G+10.0%§!\nMiesięczna pobożność: §Y+0.1§!"
 ada_justification_for_unity_title: "Uzasadnienie jedności"
 ada_justification_for_unity_desc: "My, Somalijczycy, od zawsze stanowiliśmy zbiór różnych klanów, które wielokrotnie walczyły ze sobą. Żaden z klanów plemiennych nie pragnie zjednoczyć naszego ludu, a zarozumiali Adżurańczycy wolą podlewać swoje pola. To na nas spoczywa obowiązek zjednoczenia Somali i poprowadzenia ich przeciw chrześcijańskim oraz pogańskim zagrożeniom.\nZanim jednak to nastąpi, potrzebujemy oficjalnego uzasadnienia wojny, inaczej klany nigdy się nam nie podporządkują."
 ada_justification_for_unity_at: "Żadne państwo inne niż §Y[Root.GetName]§! nie ma kultury §Ysomalijskiej§! jako głównej."
 ada_justification_for_unity_bt: "§Y[Root.GetName]§! posiada casus belli typu '§Ypodbój§!' przeciwko dowolnemu państwu §Ysomalijskiemu§!."
 ada_restore_the_old_mosque_title: "Odnów stary meczet"
 ada_restore_the_old_mosque_desc: "Zeila była jednym z pierwszych miast, które przyjęły oświecenie islamu. Około 700 lat temu, pierwsi muzułmanie w Rogu Afryki zbudowali meczet Masjid Al Qiblatayn, co czyni go najstarszym meczetem do dnia dzisiejszego. Jednak okazało się, że czas silnie na ten meczet oddziałuje, czego skutkiem jest znaczne ograniczenie możliwości korzystania z niego. Powinniśmy odrestaurować ten wspaniały zabytek naszego narodu!"
 ada_prepare_second_invasion_ct: "Państwo §Y[Root.GetName]§! otrzyma permanentne roszczenia do obszarów §YHadiji§!, §YSzewy§!, §YTigraju§! i §YEtiopii Środkowej§! oraz prowincji §Y[2768.GetName]§!, jeżeli wcześniej wykonało misję '§Yodnów stary meczet§!'."
 ada_restore_the_old_mosque_ct: "Państwo §Y[Root.GetName]§! otrzyma permanentne roszczenia do obszarów §YHadiji§!, §YSzewy§!, §YTigraju§! i §YEtiopii Środkowej§! oraz prowincji §Y[2768.GetName]§!, jeżeli wcześniej wykonało misję '§Yprzygotuj wojsko§!'."
 ada_turkish_alliance_title: "Nawiązanie kontaktu z Turkami"
 ada_turkish_alliance_desc: "Koptowie z Rogu Afryki są zaciekli i agresywni. Nawet przy całej naszej potędze militarnej mamy niewielkie szanse w starciu z Etiopczykami, którzy wykorzystują przeciw nam przewagę wysokości. Potrzebujemy silnego sojusznika.\nMogliby nim być Mamelucy, lecz krążą pogłoski o powstającym imperium muzułmańskim, które wkrótce przyćmi ich potęgę. Tak zwani Turcy są ludem tego imperium. Powinniśmy nawiązać z nimi kontakt i sprawdzić, czy uda się zawrzeć sojusz."
 ada_turkish_alliance_ct: "Jakikolwiek pułk §Y[Root.GetAdjective]§! jest położony w prowincji portowej w regionie §YEgiptu§! lub §YMaszreku§! położonej nad Morzem Śródziemnym, albo w prowincji posiadanej przez państwo §Ytureckie§!."
 ada_turkish_alliance_tt: "Nasz pułk uda się łodzią do §YAnatolii§! szukać nowych sojuszników."
 ada_destroy_ethiopia_title: "Zniszcz Etiopię"
 ada_destroy_ethiopia_desc: "Zgromadziliśmy potężnych sojuszników i przygotowaliśmy nasze siły. Nadszedł czas, by raz na zawsze zakończyć niekończący się konflikt z Etiopią!"
 ada_push_further_north_title: "Usuń Koptów z Nubii"
 ada_push_further_north_desc: "Po całkowitej klęsce Etiopii północna i zachodnia część Rogu Afryki stoi przed nami otworem. Większość chrześcijan znajduje się już pod naszym panowaniem, lecz wciąż pozostali nubijscy Koptowie, którzy sprzeciwiają się władzy islamu. Powinniśmy przejąć ich ziemie i wykorzenić tę pogańską wiarę."
 ada_push_further_north_ct: "Wszystkie prowincje w obszarach §YDongola§!, §YGórna Nubia§! i §YSennar§! są posiadane przez państwo wyznające §Y[Root.Religion.GetName]§ lub poddanego państwa §Y[Root.GetName]§!."
 ada_the_sahel_corridor_title: "Przez Saharę"
 ada_the_sahel_corridor_desc: "Na zachód od Rogu Afryki rozciąga się pas Sahelu — obszar umożliwiający podróż między niegościnną pustynią Sahary a dzikimi lasami dorzecza Konga. Zaleca się przejęcie kontroli nad tym korytarzem i stworzenie pomostu między Afryką Zachodnią a Rogiem Afryki."
 ada_modernize_army_title: "Zmodernizuj wojsko"
 ada_modernize_army_desc: "Kontakty z mieszkańcami Anatolii uświadomiły nam, jak wielkie znaczenie ma technologia dla kondycji państwa. Powinniśmy zmodernizować armię i rozwinąć taktykę, by nasze wojska sprostały nadchodzącym bitwom."
 ada_the_gold_of_ethiopia_title: "Złoto Rogu Afryki"
 ada_the_gold_of_ethiopia_desc: "Róg Afryki nie obfituje w cenne surowce, które mogłyby pobudzić naszą gospodarkę — z wyjątkiem dwóch wyjątkowych prowincji złotonośnych: [2762.GetName] i [2757.GetName]. Powinniśmy uzyskać do nich dostęp i wykorzystać ten szlachetny kruszec dla własnej korzyści."
 ada_convert_the_horn_title: "Nawróć Róg Afryki"
 ada_convert_the_horn_desc: "Nasza ojczyzna jest nękana zarówno przez pogan, jak i heretyków. Dopóki w naszym [Root.GovernmentName] nie zapanuje jedność religijna, wszelkie nadzieje na pokój będą daremne. Nawracajmy niewiernych i prowadźmy ich ku światłu wiary [Root.Religion.GetName]!"
 ada_conquer_war_mre_title: "Wojny klanów"
 ada_conquer_war_mre_desc: "Warsangali i Marehan to niesforne klany, zajęte wewnętrznymi walkami i plemiennymi sporami. Ich mieszkańcy mają dość zdecentralizowanego państwa, które raz za razem ich zawodzi. Somalijczycy potrzebują silnego władcy — i to my nim zostaniemy!"
 ada_conquer_ogd_aju_title: "Ujarzmij Ajuran"
 ada_conquer_ogd_aju_desc: "W przeciwieństwie do plemiennych klanów Somali państwo Adżuran posiada scentralizowany rząd w postaci teokracji. Mimo że jego mieszkańcy mienią się pobożnymi muzułmanami, nie interesuje ich nasza walka z chrześcijańskim zagrożeniem. Zamiast tego skupiają się na handlu i ekspansji zamorskiej. Ich rządy są bezwartościowe, lecz żyzne ziemie na południu mogą nam się przydać."
 ada_expand_into_arabia_title: "Zdobądź Święte Miasto"
 ada_expand_into_arabia_desc: "[385.GetName] jest niezwykle ważnym ośrodkiem religijnym dla wiary muzułmańskiej. Jako pobożni muzułmanie mamy obowiązek chronić to miejsce przed zagrożeniami z zewnątrz. Aby jednak osłonić Święte Miasto, musimy najpierw ustanowić nad nim naszą dominację."
 ada_somali_empire_title: "Stwórz Cesarstwo Adalu"
 ada_somali_empire_desc: "Przez długi czas jedynym imperium w Rogu Afryki było pogańskie państwo Etiopii. Teraz jednak wszystko się zmieniło. Etiopczycy zostali pokonani, Róg Afryki zjednoczono pod rządami [Root.GetAdjective], a konflikty religijne wreszcie rozwiązano! Od dziś będziemy znani jako nowe imperium Afryki Wschodniej!"
 muslim_school_events.24.t: "Zagraniczny uczony przybywa do [Root.GetName]"
 muslim_school_events.24.d: "Postanowiliśmy przyznać miejsce zamieszkania uczonemu z zagranicznej szkoły. Nie zdecydowaliśmy jednak jeszcze, który z nich otrzyma przywilej zamieszkania w bezpiecznych granicach państwa [Root.GetName]."
 muslim_school_events.24.a: "Przyznaj przywilej uczonemu ze szkoły hanafickiej."
 muslim_school_events.24.b: "Przyznaj przywilej uczonemu ze szkoły hanbalickiej."
 muslim_school_events.24.c: "Przyznaj przywilej uczonemu ze szkoły malikickiej."
 muslim_school_events.24.e: "Przyznaj przywilej uczonemu ze szkoły szafi’ickiej."
 muslim_school_events.24.f: "Przyznaj przywilej uczonemu ze szkoły ismailickiej."
 muslim_school_events.24.g: "Przyznaj przywilej uczonemu ze szkoły dżafaryckiej."
 muslim_school_events.24.h: "Przyznaj przywilej uczonemu ze szkoły zajdyckiej."
 flavor_eth.39.b.tt: "Umożliwia podjęcie decyzji o utworzeniu §YAksum§!."
 flavor_msi.2.a.tt: "Zyskaj §G§0[Root.federal_manpower_gain_tooltip.GetValue]§! siły ludzkiej od [Root.GetAdjective] Królestw Federalnych."
 flavor_msi.5.a.tt: "Zyskaj §G§0[Root.allegience_tooltip.GetValue]§! lojalności plemiennej od [Root.GetAdjective] Królestw Federalnych."
 flavor_nub.1.b: "Ciekawe, czy zaakceptują mnie jako swojego władcę…"
 flavor_zim.3.a.tt: "Odblokowuje decyzję umożliwiającą przyciągnięcie ludu §Y[ZUL.GetName]§!."
 fetishist_flavor.603.t: "Nowy kult dla [Root.GetName]"
 fetishist_flavor.603.desc: "Nasi szamani zgromadzili duchowych przywódców różnych kultów. Każdy z nich przedstawia [Root.Monarch.GetName] zalety wiary w swoje bóstwo, mając nadzieję przekonać [Root.Monarch.GetHerHim], by wybrał ich kult zamiast pozostałych."
 fetishist_flavor.603.a: "Wybierz kult Yemoji."
 fetishist_flavor.603.b: "Wybierz kult Rooga."
 fetishist_flavor.603.c: "Wybierz kult Nyame."
 fetishist_flavor.603.d: "Wybierz kult Cwezi."
 fetishist_flavor.603.e: "Wybierz kult Mliry."
 fetishist_flavor.603.f: "Wybierz kult Mwari."
 fetishist_flavor.603.g: "Wybierz kult Enkai."
 fetishist_flavor.603.h: "Wybierz kult Waaqa."
 fetishist_flavor.603.i: "Wybierz kult Zanahary."
 fetishist_flavor.603.j: "Wybierz kult chrześcijański."
 fetishist_flavor.603.k: "Wybierz kult islamski."
 fetishist_flavor.603.l: "Wybierz kult Buddhadharmy."
 fetishist_flavor.603.m: "Wybierz kult Sanatana Dharmy."
 fetishist_flavor.603.n: "Wybierz kult Teotl."
 fetishist_flavor.603.o: "Wybierz kult Freyji."
 fetishist_flavor.603.p: "Wybierz kult Haymanot."
 fetishist_flavor.603.q: "Wybierz kult Mazdayasny."
 fetishist_flavor.603.r: "Powinniśmy pozostać przy obecnym kulcie."
 flavor_zul.1.t: "Powstanie ludu [ZUL.GetName]"
 flavor_zul.1.d.a: "Nguni wiedli spokojne życie w niewielkich wspólnotach plemiennych. Wszystko zmieniło się, gdy [Root.GetAdjective] doradcy wojskowi wpadli na pomysł militaryzacji i rekrutacji mieszkańców prowincji [789.GetName] do armii państwa [Root.GetName]. Młody wódz Nguni zjednoczył klany w prowincji [789.GetName] i wykorzystał naszą własną wiedzę wojskową oraz broń, by zbuntować się przeciwko nam! Teraz nazywają siebie ludem [ZUL.GetName] i ogłaszają niepodległość od państwa [Root.GetName]!"
 flavor_zul.1.d.b: "Nguni byli grupą klanów i wspólnot, które przez wiele lat trzymały się z dala od innych. Zmieniło się to w 1816 roku, gdy młody wódz Czaka Zuluski objął władzę po swoim ojcu, który wcześniej skazał go na wygnanie, i zmilitaryzował klan liczący 1500 ludzi. Dzięki swoim zdolnościom wojskowym oraz zuluskiemu impi zjednoczył klany Nguni i założył królestwo [ZUL.GetName]."
 flavor_zul.1.a: "Musimy ich powstrzymać!"
 flavor_zul.1.b: "Mogą uzyskać niepodległość, skoro tak bardzo jej pragną."
 flavor_zul.1.c: "Ciekawe, jak to jest być Zulusem…"
 flavor_aju.13.a.tt: "Każda posiadana prowincja na wyspie §YJawa§! otrzyma modyfikator prowincji „§YWpływy handlowe Adżuranu§!” na §Y25 lat§!, zapewniający następujące efekty:\nModyfikator lokalnej siły handlowej: §R-10.0%§!\nModyfikator lokalnej produkcji dóbr: §G+25.0%§!"
 flavor_hau.1.t: "Prośba o wsparcie wojskowe"
 flavor_hau.1.d: "Miasta Hausa są podzielone, a apele dyplomatyczne nie przynoszą skutku. Zjednoczenie naszego ludu jest możliwe tylko w jeden sposób — siłą!\nJest jednak pewien problem: rywalizujące miasta-państwa gromadzą sojuszników, by się bronić. Jeśli chcemy przeprowadzić skuteczną ofensywę, sami potrzebujemy pomocy wojskowej. Powinniśmy poprosić o nią naszych sojuszników."
 flavor_hau.1.a: "To rozsądny plan."
 flavor_hau.1.b: "Prosić o pomoc? Nigdy!"
 flavor_hau.2.t: "[From.GetName] prosi o pomoc wojskową"
 flavor_hau.2.d: "[From.GovernmentName] państwa [From.GetName] ma wielkie ambicje: chce zjednoczyć państwa Hausa i zakończyć rywalizację między miastami-państwami. Ze względu na niewielkie rozmiary brakuje mu jednak siły ludzkiej, by osiągnąć ten cel. Niedawno na nasz dwór przybył ambasador państwa [From.GetName] z prośbą o pomoc wojskową, która pozwoli im zrealizować te ambicje. Oczywiście perspektywa ich powodzenia wydaje się śmieszna, lecz warto zainwestować w [From.GetName] na wypadek, gdyby mimo wszystko stali się regionalną potęgą…"
 flavor_hau.2.a: "Cóż znaczy kilku żołnierzy, jeśli możemy pomóc państwu spełnić marzenia?"
 flavor_hau.2.b: "To byłaby tylko strata [Root.GetAdjective] ludzi."
 flavor_hau.3.t: "Przybywa posiłek z państwa [From.GetName]!"
 flavor_hau.3.d: "Dobre wieści! Nasza prośba została rozpatrzona, a państwo [From.GetAdjective] wysłało tysiąc swoich najlepszych ludzi, by wsparli nas w walce!"
 flavor_hau.3.a: "Doskonale."
 flavor_hau.4.t: "Państwo [From.GetName] odmawia nam pomocy!"
 flavor_hau.4.d: "Mimo naszych najlepszych starań dyplomatycznych tchórze z państwa [From.GetName] nie widzą powodu, by wesprzeć nas w szlachetnej walce! Najwyraźniej nie zasługują na miano naszych sojuszników."
 flavor_hau.4.a: "Niech będą przeklęci ci [From.GetAdjective]!"
 flavor_hau.5.t: "Muzułmański uczony Fulani"
 flavor_hau.5.d: "Według pogłosek lud Fulani przechodzi obecnie religijną rewolucję. Trudno zweryfikować te wieści, lecz muzułmański uczony Fulani przebywający w stolicy [Root.Capital.GetName] wpadł na pomysł przeprowadzenia reform w naszym własnym kraju. Jego żarliwe przesłanie i charyzma wywarły wrażenie na części ludności, jednak brak dowodów na udane dżihady na zachodzie ogranicza jego wpływy. Mimo to popularność uczonego sprawiła, że kultura Fulani stała się w naszym kraju niezwykle modna — co wprawia w zdumienie nawet naszych najbystrzejszych doradców."
 flavor_hau.5.a: "Nie wiem, czy to dobre, czy złe wieści…"
 flavor_zim.3.t: "Militaryzacja Nguni"
 flavor_zim.3.d: "Nguni udowodnili, że są groźnymi i wartościowymi wojownikami, stanowiącymi poważną konkurencję nawet dla naszych własnych oddziałów! Szczególnie jeden klan, tak zwani Zulusi, wykazał się wyjątkowym sprytem i zdolnością adaptacji w ogniu walki. Warto rozważyć utworzenie tam państwa marchijnego, aby Nguni mogli się zorganizować i wspierać nas w potrzebie."
 flavor_zim.3.a: "Sądzę, że lepiej będzie włączyć ich bezpośrednio do naszego państwa."
 flavor_zim.3.b: "To brzmi jak dobry pomysł."
 flavor_zim.3.c: "Myślę, że zasługują na niepodległość."
 kilwan_embassy_holder_name: "[kilwan_embassy_holder.GetName]"
 persian_embassy_holder_name: "[persian_embassy_holder.GetName]"
 kilwan_embassy_holder_adjective: "[kilwan_embassy_holder.GetAdjective]"
 persian_embassy_holder_adjective: "[persian_embassy_holder.GetAdjective]"
 kilwan_embassy_holder_religion: "[kilwan_embassy_holder.Religion.GetName]"
 persian_embassy_holder_religion: "[persian_embassy_holder.Religion.GetName]"
 flavor_zan.8.t: "Wysłać ambasadę do Persji?"
 flavor_zan.8.desc: "Niektóre opowieści i legendy opisują pochodzenie ludu Shirazi, który obecnie zamieszkuje nasz kraj, lecz wywodzi się z odległej krainy Eran, daleko od Kilwy. Nasi kupcy nawiązali teraz kontakty z ludźmi po drugiej stronie cieśniny zwanej Ormuz, posługującymi się językiem farsi. Być może zaprowadzi nas to do legendarnej ojczyzny. Czy zatem, mój sułtanie, powinniśmy wysłać ambasadę do tej odległej krainy za morzem, by sprawdzić, czy opowieści są prawdziwe? A może wysłanie jej w głąb lądu byłoby zbyt ryzykowne i powinniśmy zadowolić się dotychczasowym handlem na znanych wodach?"
 flavor_zan.8.a: "Wyślij ambasadora do Persji."
 flavor_zan.8.a.tt: "Poprosimy państwo §Y[2218.Owner.GetName]§! o ustanowienie ambasady [Root.GetAdjective] w prowincji §Y[2218.GetName]§! w zamian za ambasadę państwa [2218.Owner.GetAdjective] w naszej stolicy §Y[Root.Capital.GetName]§!.\nPaństwo [2218.Owner.GetName] może całkowicie odmówić, jeśli jego kultura główna NIE jest §Yperska§!."
 flavor_zan.8.b: "To chyba nie jest tego warte."
 flavor_zan.9.t: "Przybywa do nas ambasador [From.GetAdjective]"
 flavor_zan.9.desc: "Mój panie, ambasada z odległej krainy na południu, po drugiej stronie oceanu, zwanej przez niektórych Zandż, przybyła do naszego kraju. Jej przedstawiciele pragną poznać pochodzenie własnego ludu, który nazywają Kilwą, i twierdzą, że mogą wywodzić się od Persów. Czy powinniśmy przyjąć tę ambasadę i nawiązać z nimi stałe stosunki dyplomatyczne?"
 flavor_zan.9.a: "Witajcie!"
 flavor_zan.9.b: "Nie potrzebujemy dyplomacji z Kilwą."
 flavor_zan.10.t: "Persja przyjmuje naszą ambasadę!"
 flavor_zan.10.desc: "Wspaniałe wieści, mój sułtanie! Nasz ambasador wysłany do Eranu donosi, że dotarł do kraju zwanego [From.GetAdjective], którego władca z entuzjazmem przyjął propozycję nawiązania stosunków dyplomatycznych z naszym państwem."
 flavor_zan.10.a: "To bardzo uprzejme z ich strony!"
 flavor_zan.11.t: "Persja wydaliła ambasadora!"
 flavor_zan.11.desc: "Złe wieści, mój sułtanie! Nasza ambasada dotarła do odległej krainy [From.GetAdjective], lecz jej władca okazał się tak ograniczony, że odrzucił nasze perskie pochodzenie i wygnał naszych ludzi ze swojego kraju."
 flavor_zan.11.a: "Ach, ci przeklęci dranie!"
 flavor_zan.12.t: "Zniszczenie perskiej ambasady"
 flavor_zan.12.desc: "Mimo naszych najlepszych starań utraciliśmy perską ambasadę! Nasze kontakty z tamtejszymi dyplomatami zostały zerwane. Tylko czas pokaże, jak wpłynie to na nasze stosunki…"
 flavor_zan.12.a: "To niedobrze…"
 flavor_zan.12.b: "To niedobrze…"
 flavor_zan.13.t: "Państwo [From.GetName] utraciło ambasadę [Root.GetAdjective]!"
 flavor_zan.13.desc: "Mój panie, straciliśmy kontakt z ambasadą wysłaną przez lud Zandż. Nie rozumiemy w pełni przyczyn tego zdarzenia. Niektórzy twierdzą, że wrócili do swojej ojczyzny, inni zaś, że postanowili udać się do kolejnych odległych krain. Prawdopodobnie nigdy nie poznamy ich losu."
 flavor_zan.13.a: "Co za strata czasu!"
 flavor_zan.14.t: "Państwo [From.GetName] utraciło ambasadę [Root.GetAdjective]!"
 flavor_zan.14.desc: "Mój panie, zagraniczna ambasada wysłana przez lud Zandż została niedawno rozwiązana. Dziwne, że odmówili pozostania tutaj, skoro przebyli tak długą drogę z tak odległej krainy."
 flavor_zan.14.a: "To byli dziwni ludzie."
 flavor_zan.15.t: "Nasi kupcy odwiedzają [OppositeEmbassyHolderName]"
 flavor_zan.15.desc: "Ambasada, którą ustanowiliśmy w odległej krainie [OppositeEmbassyHolderName], odkryła przed nami interesujących partnerów handlowych. Ostatnio również niektórzy nasi kupcy zaczęli odwiedzać te ziemie, wymieniając nasze towary na ich produkty i osiągając przy tym niemałe zyski."
 flavor_zan.15.a: "Zawsze miło zdobyć trochę dóbr i pieniędzy!"
 flavor_zan.16.t: "Wymiana wiedzy z [OppositeEmbassyHolderName]"
 flavor_zan.16.desc: "Szlak handlowy ustanowiony przez naszych kupców z odległym państwem [OppositeEmbassyHolderName] sprawił, że wysiłek włożony w założenie tam ambasady się opłacił. Poza towarami i pieniędzmi między naszymi narodami zaczęło jednak krążyć coś znacznie ciekawszego — idee. W ostatnich latach przyniosło to wielkie korzyści rozwojowi naszego kraju, mój sułtanie."
 flavor_zan.16.a: "Wymiana nowych idei zawsze jest tego warta."
 flavor_zan.17.t: "Wzajemne kontakty religijne"
 flavor_zan.17.desc: "Ambasada ustanowiona przed kilkoma laty dostarczyła nam również informacji o wierzeniach mieszkańców [OppositeEmbassyHolderName], które nie są tak odmienne od naszych. Pobudziło to działalność naszych uczonych religijnych, przynosząc korzyści praktykowaniu wiary w naszym kraju i pobożności wiernych, mój sułtanie."
 flavor_zan.17.a: "Religia łączy nasze państwa."
 flavor_zan.18.t: "Wpływ religii [OppositeEmbassyHolderReligion]"
 flavor_zan.18.desc: "Wieloletnie dyskusje religijne między uczonymi z naszego kraju a uczonymi z [OppositeEmbassyHolderName] głęboko wpłynęły na nasze wierzenia. Wśród naszych teologów pojawił się nurt głoszący, że nasza religia nie różni się aż tak bardzo od ich wyznania. Z tych rozważań wyłania się ważne pytanie: czy przyjęcie religii naszych wieloletnich przyjaciół przyniosłoby krajowi większe korzyści i jeszcze bardziej umocniło nasze stosunki?"
 flavor_zan.18.a: "[OppositeEmbassyHolderReligion] stanie się naszą nową wiarą."
 flavor_zan.18.b: "Dziękujemy, pozostaniemy przy własnych wierzeniach."
 flavor_zan.19.t: "Roszczenia potomków Shirazi"
 flavor_zan.19.desc: "Ambasadę wysłaliśmy do odległej krainy [OppositeEmbassyHolderName], by zbadać pochodzenie ludu Shirazi. Po tylu latach jesteśmy pewni, że odnaleźliśmy ziemię, z której się wywodzi. Może nam to również dać w oczach naszego ludu prawowite roszczenia do tych odległych, lecz bogatych ziem, gdzie moglibyśmy założyć przyczółek na kontynencie azjatyckim. Mój [Root.Monarch.GetTitle], czy powinniśmy wysunąć te ambitne żądania?"
 flavor_zan.19.a: "Musimy dochodzić roszczeń wynikających z pochodzenia Shirazi!"
 flavor_zan.19.b: "Nie sądzę, by dochodzenie tych roszczeń było rozsądne."
 flavor_zan.20.t: "Mogadiszu przyznaje się do porażki"
 flavor_zan.20.desc: "Pokonaliśmy handlowy ośrodek przeładunkowy w Mogadiszu, a teraz możemy zabrać im tyle łupów, ile tylko zechcemy!"
 flavor_zan.20.a: "Grabież to najlepsza część życia!"
 flavor_zan.21.t: "Szlak handlowy do Chin"
 flavor_zan.21.desc: "Dzięki naszej obecności w Malakce kupcy zdobyli wiedzę o morskim szlaku handlowym prowadzącym do Chin!"
 flavor_zan.21.a: "Na wschód!"
 flavor_msi.1.t: "Konfederacyjne Królestwo Mossi"
 flavor_msi.1.d: "Królestwa Mossi są teraz zjednoczone po raz pierwszy od wielu pokoleń, lecz nie zawsze tak było. Nasi starsi opowiadają historię księżniczki Yennegi, która uciekła na te ziemie z miasta Gambaga należącego do ludu Mamprusi, oraz jej syna Wedraogo, założyciela miasta Tenkodogo. Miał on później jeszcze trzech synów. Najstarszy, Diaba, założył również Fada N’Gurmę. Drugi, Rawa, założył królestwo Zondoma. Najmłodszy, Zoungrana, został władcą Tenkodogo i doczekał się syna Oubriego, który założył Wagadugu. Takie są początki ludu Mossi. W ich następstwie my, Mossi, zorganizowaliśmy się w niezależne królestwa. Nadszedł jednak czas na ustanowienie wspólnego rządu, nawet jeśli uszanujemy pochodzenie i odrębność każdego z królestw Mossi."
 flavor_msi.1.a: "Nadszedł czas na utworzenie zjednoczonego Konfederacyjnego Królestwa Mossi."
 flavor_msi.2.t: "Posiłki z królestw Mossi"
