 zan_has_embassy: "Posiada naszą ambasadę"
 zan_declined_embassy: "Odrzucili naszą ambasadę"
 msi_accepts_muslims: "Przyznali przywileje naszym współwyznawcom"
 kongo_nation_title: "Przywróć Królestwo Konga"
 kongo_nation_desc: "Plemienne królestwo Konga było niegdyś główną potęgą regionalną i dało nazwę całemu regionowi. Po jego upadku nikt nie zajął jego miejsca, a powstałą próżnię zaczęli wykorzystywać Europejczycy i inni cudzoziemcy. Nadszedł czas, byśmy sami ją wypełnili i kontynuowali dziedzictwo królestwa!"
 ethiopia_nation_title: "Przywróć dziedzictwo Salomonidów"
 ethiopia_nation_desc: "Imperium Etiopii jest duchowym następcą Imperium Aksumickiego, ojczyzną syna legendarnego króla Salomona i królowej Saby oraz obrońcą wiary koptyjskiej. Jego upadek był tragedią dla etiopskiego Kościoła koptyjskiego, lecz duch Etiopii wciąż żyje — czekając na godnego następcę, który go odrodzi!"
 set_focus_on_professional_army_title: "Skupienie na armii zawodowej"
 set_focus_on_professional_army_desc: "Wraz z wstąpieniem [Root.Monarch.GetName] na tron wojsko oczekuje przydzielenia zasobów niezbędnych do stworzenia mniejszej, lecz skuteczniejszej armii."
 set_focus_on_professional_army_ct: "Wojsko NIE otrzymało nowego kierunku rozwoju za życia [Root.Monarch.GetName] w ciągu ostatnich §Y20 lat§!."
 send_the_shaman_to_a_foreign_country_title: "Wyślij szamana do obcych kultów"
 send_the_shaman_to_a_foreign_country_desc: "Możemy wysłać szamana naszego państwa [Root.GovernmentName] do kraju wyznającego obcy kult, aby poznał jego praktyki religijne i obrzędy."
 zulu_nation_ct: "Prowokuje miejscową ludność Nguni, co może doprowadzić do przedwczesnego powstania państwa §Y[ZUL.GetName]§!."
 federal_kingdoms_gather_the_armies_tt: "Królestwa konfederacyjne zbiorą swoje wojska w ciągu najbliższych §Y6 miesięcy§!, co później zapewni §Y1000 rekrutów§! za każdy punkt bazowej siły żywej w prowincjach kultury §Y[Root.Culture.GetName]§!.\nPrzyrost siły żywej skaluje się z §Ykrajowymi modyfikatorami siły żywej§!.\nKażda prowincja kultury §Y[Root.Culture.GetName]§! otrzyma §R+20,0%§! lokalnej autonomii."
 federal_kingdoms_internal_royal_marriage_tt: "Królestwa konfederacyjne zorganizują małżeństwo w ciągu najbliższych §Y6 miesięcy§!, co później doprowadzi do zawarcia wewnętrznego małżeństwa dynastycznego, zapewniającego następujące efekty przez §Y20 lat§!:\nRównowaga lojalności [Root.GetNobilityOrFallbackName]: §G+10,0%§!\nWpływy [Root.GetNobilityOrFallbackName]: §Y+5,0%§!\nSzansa na narodziny następcy tronu: §G+100,0%§!"
 federal_celebrate_rituals_together_tt: "Królestwa konfederacyjne przygotują święto w ciągu najbliższych §Y6 miesięcy§!, co później zapewni §G+1§! punkt stabilności.\nKażda prowincja kultury §Y[Root.Culture.GetName]§! otrzyma §R+10,0%§! lokalnej autonomii."
 federal_gain_tribal_allegiance_tt: "Królestwa konfederacyjne wyrażą lojalność wobec [Root.Monarch.GetName] w ciągu najbliższych §Y6 miesięcy§!, co później zapewni §G+3§! punkty wierności plemiennej oraz §R+5,0%§! lokalnej autonomii w każdej prowincji kultury §Y[Root.Culture.GetName]§!."
 has_adopted_any_cult: "Przyjęto dowolny §Ykult§!."
 switch_active_cult_decision_title: "Wybierz nowy kult"
 switch_active_cult_decision_desc: "Wiara [Root.Religion.GetName] nie jest sztywnym systemem opartym na jednym bóstwie. Wierzymy w zbiór różnych bóstw i kultów oddających im cześć. Od czasu do czasu władca musi jednak zmienić kierunek kultu w państwie. Dzięki pomocy naszych [Root.GetClergyName] możemy dość łatwo zmienić jego główny nurt."
 switch_permanent_scholar_title: "Zastąp rezydującego uczonego"
 switch_permanent_scholar_desc: "Czasami nauki danej szkoły przestają przynosić korzyści naszemu państwu. W takich przypadkach zaleca się wydalenie zagranicznego uczonego i zastąpienie go przedstawicielem bardziej przydatnej szkoły.\nDzięki kontaktom naszych [Root.GetClergyName] nie poniesiemy przy tym żadnych strat w stosunkach dyplomatycznych z zagranicą."
 invest_into_the_seven_cities_title: "Inwestycje w Siedem Miast"
 invest_into_the_seven_cities_desc: "Siedem Miast Hausa ma ogromne znaczenie dla naszej historii kulturowej. Możemy zainwestować w ich dobrobyt, aby przywrócić im regionalne i kulturowe znaczenie dla naszego państwa."
 zulu_nation_title: "Zmilitaryzuj lud Nguni"
 zulu_nation_desc: "Armie państwa [Root.GetName] są wspaniałe, ale mogą być jeszcze lepsze. Uzbrajając miejscową ludność Nguni i militaryzując jej społeczność, zapewnimy [Root.GetAdjective] państwu [Root.GovernmentName] setki nowych rekrutów."
 aksumite_nation_title: "Przywróć Aksum"
 aksumite_nation_desc: "Starszyzna opowiada o starożytnym i potężnym Królestwie Aksum oraz jego wspaniałym królu Kalebie, który niepodzielnie władał Morzem Czerwonym i znany był jako święty Elesbaan. Teraz wreszcie możemy napisać nowy rozdział historii, przejmując dziedzictwo naszych przodków i odzyskując dawną chwałę."
 great_zimbabwe_nation_title: "Przywróć Zimbabwe"
 great_zimbabwe_nation_desc: "Radujmy się! Wielkie kamienne miasto znów jest zamieszkane, jego budowle odbudowane, a potęga odzyskana! Nadszedł czas, by wznieść wysoko jego sztandar i oznajmić światu, że Wielkie Zimbabwe ponownie jest lśniącym klejnotem Afryki, którym niegdyś było."
 hausa_nation_title: "Zjednocz Hausa"
 hausa_nation_desc: "Po wielu latach waśni i wojen pustoszących te ziemie dawne rywalizacje wreszcie wygasły i nastał pokój. Synowie Bawo ponownie zjednoczyli się pod jednym sztandarem. Nadszedł czas, by lud Hausa znów powstał jako jedność!"
 israel_nation_title: "Odbuduj Izrael"
 israel_nation_desc: "Zgodnie z obietnicą ziemia Izraela jest ponownie wolna od tyranii gojów, przywrócono majestat Dawida, a święte miasto Jerozolima zostało odbudowane. Pan powrócił do Syjonu z miłosierdziem, a miasta znów opływają w dobrobyt."
 federal_kingdoms_gather_the_armies_title: "Królestwa konfederacyjne: Zbierz wojska"
 federal_kingdoms_gather_the_armies_desc: "Dzięki naszym stosunkom z licznymi królestwami państwa [Root.GetName] możemy zorganizować nowe kontyngenty rekrutów."
 federal_kingdoms_internal_royal_marriage_title: "Królestwa konfederacyjne: Zaaranżuj małżeństwo"
 federal_kingdoms_internal_royal_marriage_desc: "Możemy wykorzystać nasze wewnętrzne powiązania, aby zaaranżować małżeństwo [Root.Monarch.GetName] z jednym z członków rodzin panujących w pozostałych królestwach naszego państwa."
 federal_celebrate_rituals_together_title: "Królestwa konfederacyjne: Wspólne obchody rytuałów"
 federal_celebrate_rituals_together_desc: "W szczególnych chwilach ważne jest, by przypominać sobie, co nas łączy, i wspólnie obchodzić święta naszego ludu."
 federal_gain_tribal_allegiance_title: "Królestwa konfederacyjne: Zdobądź wierność plemion"
 federal_gain_tribal_allegiance_desc: "Królestwa ogłaszają wierność [Root.Monarch.GetTitle]."
 kitara_nation_title: "Przyjmij tytuł cesarza Kitary"
 kitara_nation_desc: "Po wielu zmaganiach i cierpieniach zjednoczyliśmy ludy Wielkich Jezior i zażegnaliśmy podziały, które nas rozdzielały. Nadszedł czas, by odbudować utraconą niegdyś jedność i ponownie wznieść sztandar Kitary, aby wszyscy mogli zobaczyć, że stanowimy jedność."
 macina_nation_title: "Utwórz Macinę"
 macina_nation_desc: "Nasz lud doświadczył straszliwych krzywd i tyranii ze strony dawnych zwierzchników, lecz w końcu zrzuciliśmy ich jarzmo i jesteśmy gotowi wytyczyć własną drogę. Wznieśmy nowy sztandar jako symbol naszej wolności i ostrzeżenie dla tych, którzy odważyliby się jej zagrozić."
 mali_nation_title: "Przejmij dziedzictwo Mali"
 mali_nation_desc: "Potężne i zamożne imperium Mali upadło przed wieloma laty wskutek zazdrości sąsiadów i sporów między wodzami. Mimo to ducha Mali nie da się zniszczyć — zawsze będzie żył w jego mieszkańcach. Teraz, gdy ziemie wokół Mandingu ponownie zostały zjednoczone, nadszedł czas, by nowy Mansa powstał i przywrócił imperium dawną chwałę."
 mossi_nation_title: "Zjednocz królestwa Mossi"
 mossi_nation_desc: "Przez zbyt wiele lat synowie księżniczki Yennegi walczyli między sobą. Teraz jednak dawne rywalizacje i waśnie ucichły, a bracia, którzy dawno się rozdzielili, znów jadą ramię w ramię. Czas skierować wzrok ku światu i oznajmić, że Mossi stanowią jedność."
 nubian_nation_title: "Zjednocz Nubijczyków"
 nubian_nation_desc: "Od starożytności królestwom Nubii zagrażają od północy i południa poganie, którzy pragną jedynie zagarnąć nasz lud i nasze bogactwa. Nadszedł czas, by odłożyć różnice na bok i zjednoczyć się jako jeden nubijski naród pod opieką Boga."
 rozwi_nation_title: "Ustanów państwo Rozwi"
 rozwi_nation_desc: "Jesteśmy wojownikami. Wypędziliśmy obcych najeźdźców, spacyfikowaliśmy ziemie Zimbabwe, wznieśliśmy wielkie kamienne miasta, wydobywaliśmy złoto z głębi ziemi, polowaliśmy na dzikie bestie, chroniliśmy handel i zjednoczyliśmy lud. Jesteśmy Rozwi!"
 somalia_nation_title: "Zjednocz klany Somalii"
 somalia_nation_desc: "Od starożytności Somalijczycy zamieszkują Róg Afryki, lecz zawsze byli podzieleni i rywalizowali ze sobą zarówno w handlu, jak i na polu bitwy. Teraz wszystko się zmieni: nasz lud porzuci dawne spory i wreszcie zjednoczy się pod jednym sztandarem."
 zim_declining_city: "Opuszczone ruiny"
 desc_zim_declining_city: "Ta prowincja jest opuszczonym miastem, pozbawionym zasobów i zamieszkanym jedynie przez garstkę osób zarządzających okolicą. Próby ponownego zaludnienia miasta okażą się trudne."
 zim_restored_capital: "Odbudowana stolica"
 desc_zim_restored_capital: "Dzięki wspólnym wysiłkom i poświęceniu miasto Zimbabwe odzyskało dawną świetność i ponownie służy dworowi królewskiemu jako siedziba władzy."
 zim_desecrated_kingdom: "Zbezczeszczone królestwo"
 desc_zim_desecrated_kingdom: "Zimbabwe jest siedzibą naszych przodków. Porzucając je na pastwę wrogów naszego państwa, święty król okazał słabość i dowiódł, że nie jest godzien sprawować władzy."
 zim_desecrated_kingdom_tt: "trwa, dopóki Zimbabwe nie znajdzie się ponownie pod kontrolą państwa [Root.GetName]"
 ada_preperation_for_war: "Przygotowania Adalu do wojny"
 desc_ada_preperation_for_war: "Wojna jest nieodłączną częścią społeczeństwa Adalu. Wszyscy czekamy i przygotowujemy się na dzień, w którym uderzymy na Etiopczyków...\n\nOtrzymujemy modyfikator „§YWojna adalsko-etiopska§!”, gdy prowadzimy wojnę z państwem §Y[ETH.GetName]§!, którego rozwój jest równy lub większy od naszego. Zapewnia on następujące efekty:\nMorale armii: §G+5,0%§!\nSzybkość odzyskiwania siły żywej: §G+10,0%§!\nMiesięczna pobożność: §Y+0,1§!\n"
 ada_war_against_ethiopia: "Wojna adalsko-etiopska"
 desc_ada_war_against_ethiopia: "Nasz lud ponownie walczy ze swoim odwiecznym rywalem, Etiopią, o dominację na Rogu Afryki! Nasze wojska rozgromią chrześcijan i położą kres zagrożeniu, które stwarzali przez dziesięciolecia."
 ada_expelling_of_the_christians: "Działania Adalu na rzecz nawracania"
 desc_ada_expelling_of_the_christians: "Chrześcijanie na Rogu Afryki sprowadzili na nasz lud nieszczęścia i cierpienia, próbując rozszerzać swoje wpływy. Musimy nawrócić tych ludzi na prawdziwą wiarę, aby zapewnić pokój!"
 ada_professional_army: "Zmodernizowana armia"
 desc_ada_professional_army: "Armia państwa [Root.GetName] przeszła gruntowną modernizację, a jakość wyszkolenia żołnierzy znacznie wzrosła."
 ada_religious_unity_in_the_horn: "Zjednoczony religijnie Róg Afryki"
 desc_ada_religious_unity_in_the_horn: "Zjednoczyliśmy Róg Afryki i wypędziliśmy z naszej ojczyzny wojowniczych pogan oraz heretyków! Autorytet religii [Root.Religion.GetName] nie podlega żadnej dyskusji!"
 ada_imperial_adal_sultanate: "Imperialny Adal"
 desc_ada_imperial_adal_sultanate: "Przezwyciężyliśmy podziały między klanami somalijskimi, wyeliminowaliśmy zagrożenie ze strony Etiopczyków, zjednoczyliśmy cały Róg Afryki, a nawet rozszerzyliśmy nasze wpływy na Arabię. Bez wątpienia jesteśmy imperium, a tym samym jedną z wielkich potęg Afryki."
 harsh: "Surowe"
 neutral: "Neutralne"
 concilatory: "Pojednawcze"
 concessions: "Ustępstwa"
 zim_african_great_power: "Wielka potęga Afryki §Y(na stałe)§!"
 eth_cawa_discipline_title: "Wyszkol Cawa"
 eth_cawa_discipline_desc: "Cawa to feudalna klasa szlacheckich wojowników naszego państwa. Ci zawodowi żołnierze, pierwotnie mianowani przez samego Negusa Nagasta, stanowią trzon naszej armii i zapewniają porządek w odległych prowincjach.\nZawsze jednak można się doskonalić. Powinniśmy zwerbować więcej tych nieustraszonych wojowników i wyszkolić ich do perfekcji."
 eth_reform_the_negusa_government_title: "Scentralizuj państwo"
 eth_reform_the_negusa_government_desc: "Dawna monarchia Negusa Nagasta okazała się sztywnym systemem. Choć zasada wędrownej stolicy skutecznie pozwalała utrzymywać kontrolę nad danym obszarem, ujawniła również, jak zdecentralizowane — i jak bezsilne — jest w rzeczywistości państwo. Musimy zreformować rząd i scentralizować władzę, jeśli nasze imperium ma przetrwać."
 eth_reform_the_negusa_government_ct: "Odblokowuje reformę ustrojową §YImperium Salomonidów§!."
 eth_conquest_of_qasr_ibrim_title: "Zajmij Kasr Ibrim"
 eth_conquest_of_qasr_ibrim_desc: "Wiara koptyjska jest silnie związana z kilkoma świętymi miejscami na świecie. Jednym z nich jest starożytne miasto Kasr Ibrim, które w VIII wieku było centrum chrześcijaństwa. Jego chwalebne dni dobiegły jednak końca, gdy mieszkańcy zwrócili się ku pogańskim wierzeniom. Powinniśmy wyzwolić je spod władzy nieudolnego właściciela i przywrócić tam prawdziwą wiarę."
 eth_conquest_of_alexandria_title: "Wyzwól Aleksandrię"
 eth_conquest_of_alexandria_desc: "Aleksandria jest siedzibą starożytnego patriarchatu koptyjskiego i papieża koptyjskiego. Kościół oraz znaczna część społeczności koptyjskiej cierpią jednak pod obcymi, niewiernymi rządami Mameluków. Musimy wyzwolić miasto spod władzy muzułmanów i pomóc Koptom, którzy wciąż ukrywają się przed prześladowaniami."
 eth_conquest_of_antioch_title: "Podbij Antiochię"
 eth_conquest_of_antioch_desc: "Starożytne miasto Antiochia było niegdyś kolebką chrześcijaństwa i jednym z jego najważniejszych ośrodków. Wyprawy krzyżowe i ekspansja islamu odmieniły jednak ten stan rzeczy, a miasto stało się cieniem dawnej świetności. Choć chrześcijańskie duchowieństwo w Antiochii zostało wyplenione, miejsce to nadal ma ogromne znaczenie dla naszej wiary. Musimy odzyskać tę starożytną siedzibę i przywrócić chrześcijańskie wpływy na Bliskim Wschodzie."
 eth_please_the_vassals_title: "Damot i Hadija"
 eth_please_the_vassals_desc: "Nasz wasal Damot był niegdyś państwem, które podporządkowało sobie Sułtanat Szeua. Drugi z naszych wasali, Sułtanat Hadiya, również wchodził dawniej w skład Szeua.\nOba państwa mają bogatą historię, lecz od czasu, gdy Zara Amda Sejon I przejął inicjatywę i podbił je w 1309 roku, są jedynie naszymi poddanymi. Nadszedł czas, by oba królestwa dołączyły do naszego wielkiego imperium! Ich władcy mogą jednak wymagać pewnej perswazji."
 eth_unify_the_kingdoms_title: "Zjednocz plemiona"
 eth_unify_the_kingdoms_desc: "Nasze państwo było niegdyś wielkim Imperium Aksumickim, rozciągającym się od pustyń Dongoli aż po wybrzeże Mukki w Jemenie. Wszystko zmieniło się, gdy królowa Gudit i jej wojownicy z Semien złupili Aksum i wymordowali dynastię aksumicką. Wkrótce potem imperium rozpadło się na liczne plemiona.\nTeraz jednak na tronie zasiada nowa dynastia! Dynastia godna tytułu „Króla Królów”, która odzyska ziemie naszego upadłego poprzednika — zaczynając od zjednoczenia plemion!"
 eth_retake_suakin_title: "Podbij Sawakin"
 eth_retake_suakin_desc: "Port Suakin okazał się ważnym ośrodkiem handlu na Morzu Czerwonym. Nie ma wprawdzie dowodów, że kiedykolwiek należał do Imperium Aksumickiego, lecz mieszkało w nim wielu [Root.GetAdjective] chrześcijan, zanim miasto wpadło w ręce muzułmanów. Mamy więc aż nadto powodów, by przejąć ten port i wyzwolić nielicznych chrześcijan, którzy wciąż się tam ukrywają."
 eth_develop_the_ancestors_city_title: "Stolica przodków"
 eth_develop_the_ancestors_city_desc: "Choć najważniejsza część historii naszego narodu wiąże się z wielkim królem Menelikiem i królową Saby, nasze dzieje sięgają czasów jeszcze dawniejszych niż legendy o tej parze. Nasz wspaniały naród był niegdyś częścią Imperium Aksumickiego — imperium naszych przodków. Jego potęga dawno przeminęła za sprawą muzułmańskich najeźdźców i wojowniczej królowej Gudit, lecz dawna stolica, Aksum, wciąż istnieje.\nObecnie odbywają się tam koronacje naszych władców. Czas nie obszedł się jednak łaskawie z miastem i pozostawił na nim swoje piętno. Powinniśmy je odnowić, aby zachować pamięć o naszej przeszłości."
 eth_harbor_city_adulis_title: "Odbuduj Adulis"
 eth_harbor_city_adulis_desc: "Żaden port nie był ważniejszy dla starożytnego Imperium Aksumickiego niż Adulis. Był kluczowym punktem dawnego handlu na Morzu Czerwonym i utrzymywał bliskie kontakty ze starożytną Grecją oraz Cesarstwem Bizantyjskim. Dzięki swojemu położeniu umożliwił Aksum zdobycie dominacji nad Morzem Czerwonym.\nNiestety, około 702 roku miasto zostało zdobyte przez muzułmanów, co doprowadziło do izolacji, a ostatecznie nieuchronnego upadku Imperium Aksumickiego. Nie wszystko jednak stracone! Infrastruktura miasta wciąż istnieje. Jeśli odzyskamy ten port, będziemy mogli odbudować Adulis i uczynić z niego wspanialsze miasto niż kiedykolwiek wcześniej."
 eth_conquer_adal_title: "Podbij Adal"
 eth_conquer_adal_desc: "Stosunki między państwem [Root.GetName] a Adalem od zawsze były napięte z powodu różnic religijnych i nierówności sił. Dzięki przewadze nasze państwo [Root.GovernmentName] mogło dotąd domagać się od sułtana Adalu należnego trybutu. Odkąd jednak Osmanowie nawiązali kontakt z sułtanem, mieszkańcy Adalu coraz bardziej opierają się płaceniu daniny i dążą do zniszczenia naszego państwa przy pomocy Turków. Powinniśmy zachować ostrożność i podbić ich, zanim staną się realnym zagrożeniem dla [Root.GetName]."
 eth_unify_the_horn_of_africa_title: "Zjednocz Róg Afryki"
 eth_unify_the_horn_of_africa_desc: "Róg Afryki jest ojczyzną wielu starożytnych królestw. Wiele z nich powstawało i upadało na przestrzeni wieków, lecz żadne nie zdołało zjednoczyć całego regionu. Powinniśmy wziąć sprawy w swoje ręce i raz na zawsze zakończyć nieustanne wojny na Rogu Afryki."
 eth_yemens_coasts_title: "Przyczółek w Arabii"
 eth_yemens_coasts_desc: "Imperium Aksumickie posiadało niegdyś ziemie w południowej Arabii, wzdłuż wybrzeży obszarów dzisiejszego Jemenu, już w III wieku. Podobnie jak wiele innych wielkich osiągnięć tego starożytnego imperium, również nasze przyczółki w Arabii wpadły w ręce muzułmanów. Nadszedł czas, by je odzyskać."
 eth_restore_aksumite_empire_title: "Prześcignij przeszłość"
 eth_restore_aksumite_empire_desc: "Imperium naszych przodków upadło, lecz jego dziedzictwo wciąż w nas żyje. Dzięki niemu mamy siłę nie tylko odbudować to, co zostało zniszczone przed wiekami, lecz także wznieść się ponad dawną potęgę!"
 eth_eliminate_the_semien_rebels_title: "Bunt Gedeona"
 eth_eliminate_the_semien_rebels_desc: "Zdradziecki król Gideon V przewodzi rebelii przeciwko [Root.Monarch.GetName] i próbuje oderwać swoje królestwo od naszego imperium. Powinniśmy dać temu zdrajcy nauczkę i przepędzić jego stronników."
 eth_church_reforms_title: "Rozwiąż spór o szabat"
 eth_church_reforms_desc: "Choć problem może wydawać się błahy, nasz Kościół od niemal całego stulecia jest podzielony w kwestii przestrzegania biblijnego szabatu. Lojaliści Kościoła Aleksandryjskiego uważają, że dniem odpoczynku powinna być niedziela, podczas gdy zwolennicy Ewostatewosa opowiadają się za świętowaniem obu dni weekendu. Jeśli chcemy zachować jedność religijną, musimy znaleźć kompromis zadowalający obie grupy."
 eth_church_reforms_ct: "Wystąpiło wydarzenie „§YReformy centralizacyjne Zary Jakuba§!”."
 unlock_privilege_estate_church_yakobs_churches_tt: "Odblokowuje przywilej [Root.GetClergyName]: „§YReforma szabatu biblijnego§!”."
 unlock_privilege_estate_burghers_hydraulic_rights_tt: "Odblokowuje przywilej [Root.GetBurghersName]: „§YPrzyznanie praw do korzystania z wód§!”."
 eth_build_an_army_title: "Armia [Root.GetAdjective]"
 eth_build_an_army_desc: "Nasze państwo jest otoczone przez niewiernych i wrogów [Root.GovernmentName]. Jeśli chcemy przetrwać i rozszerzać nasze granice, musimy wzmocnić armię, zwiększając liczbę żołnierzy i zatrudniając kompetentnego generała."
 eth_conquer_southern_kingdoms_title: "Podbij południe"
 eth_conquer_southern_kingdoms_desc: "Na południowych granicach naszego wielkiego państwa [Root.GovernmentName] znajdują się potencjalni rywale. Królestwo Kaffy może wyznawać tę samą wiarę koptyjską, lecz jego władcy nie zamierzają dzielić się złotem z naszym prawowitym [Root.Monarch.GetTitle]. Królestwo Ennarei jest żałosną namiastką państwa i może jedynie wzmocnić wschodnich barbarzyńców wyznających fetyszyzm.\nPowinniśmy podbić południowe królestwa i skonsolidować region Etiopii."
 eth_the_riches_of_the_south_title: "Bogactwa Kaffy"
 eth_the_riches_of_the_south_desc: "Ludzie oczywiście nie są zadowoleni, gdy tracą suwerenność na rzecz obcego państwa. Tak właśnie wygląda wojna i podbój, a podbita ludność zwykle z czasem przyzwyczaja się do nowych zwierzchników. Czasami jednak trzeba sprawić, by ta zmiana była dla niej mniej dotkliwa. Kaffa jest jednym z takich przypadków. Jej złoto ma dla naszego kraju nieocenioną wartość, lecz dopóki miejscowa ludność pozostaje niezadowolona, nie możemy go wydobywać. Powinniśmy rozwinąć infrastrukturę w Kaffie i Damocie, aby pokazać nasze dobre intencje."
 eth_gain_sea_access_title: "Dostęp do Morza Czerwonego"
 eth_gain_sea_access_desc: "Od upadku Imperium Aksumickiego nasze państwo nie miało dostępu do morza, które łączyło nas z innymi chrześcijanami na świecie. Musimy to zmienić, podbijając port i rozbudowując go o odpowiednią stocznię! W końcu ani nasi żołnierze, ani dyplomaci nie zamienią się w statki po dotknięciu wody."
 eth_gain_sea_access_tt: "W losowym posiadanym porcie natychmiast powstanie §YStocznia§!."
 eth_create_a_navy_title: "Utwórz flotę [Root.GetAdjective]"
 eth_create_a_navy_desc: "Skoro nasze państwo ma już możliwości budowy statków, naturalnym krokiem jest rozpoczęcie ich produkcji. Aby zapewnić stały kontakt z naszymi chrześcijańskimi braćmi i siostrami, musimy dysponować sprawną flotą."
 eth_create_a_navy_tt: "Niewielka flota statków popłynie wielkim Nilem, aby dotrzeć do Morza Śródziemnego."
 eth_ethiopian_empire_title: "Wielka potęga Afryki"
 eth_ethiopian_empire_desc: "Europejczycy darzą nas sympatią ze względu na wspólną wiarę, lecz nadal postrzegają nas jako plemię mieszkające w lepiankach. Pokażemy im, że jesteśmy potęgą, z którą należy się liczyć, tak samo jak każde z wielkich państw Europy!"
 eth_find_other_christians_title: "Kontakt z Portugalią"
 eth_find_other_christians_desc: "Już za panowania wielkiego Negusa Nagasta Dawita I nasze państwo [Root.GovernmentName] utrzymywało kontakty z Europejczykami. Jednak z powodu dużych odległości i przeszkód powodowanych przez Mameluków żadne z europejskich państw nie było w stanie utrzymywać z nami stałych relacji. Zmieniło się to, gdy Portugalczycy zaczęli budować swoje globalne imperium i potrzebowali sojuszników w pobliżu Oceanu Indyjskiego.\nPowinniśmy nawiązać kontakty z Portugalczykami!"
 eth_find_other_christians_ct: "Wystąpiło wydarzenie „§YPêro da Covilhá§!”."
 eth_find_other_christians_tt: "[Root.GetName] odkrył jakiekolwiek prowincje posiadane przez §Y[POR.GetName]§!."
 eth_market_of_the_west_title: "Rynek Zachodu"
 eth_market_of_the_west_desc: "Handel na Morzu Czerwonym był niegdyś jednym z najważniejszych węzłów handlowych świata. Łączył Cesarstwo Rzymskie z bogactwami Indii, dzięki czemu Rzymianie mogli cieszyć się indyjskimi towarami bez konieczności mierzenia się z Persami. Zmieniło się to po upadku jego następcy, Cesarstwa Bizantyjskiego, pod naporem Turków osmańskich. Od tamtej pory Morze Czerwone nie jest już tak dochodowe jak dawniej, a europejski kolonializm sprawia, że prawdopodobnie nigdy nie odzyska dawnego znaczenia.\nNadal mamy jednak możliwości działania. Dzięki nowym kontaktom z Europejczykami możemy zaistnieć w ich znacznie bardziej aktywnych węzłach handlowych. Musimy tylko znaleźć sposób, by dotrzeć na ich bogate rynki."
 eth_ideas_and_institutions_title: "Idee Zachodu"
 eth_ideas_and_institutions_desc: "Nasza religia i kultura są najważniejszymi aspektami naszej cywilizacji. Dotychczas technologia nie budziła jednak naszego szczególnego zainteresowania.\nWszystko zmieniło się, gdy poznaliśmy możliwości Europejczyków. Dzięki stosunkom handlowym z Europą nasi kupcy mogli na własne oczy zobaczyć europejską myśl techniczną. Szczególne wrażenie zrobiły na nich osiągnięcia militarne, które zarazem wzbudziły niepokój naszego narodu. Musimy zadbać o to, by żadne z państw europejskich nie uzyskało nad nami przewagi!"
 has_better_tech_than_westerns_tt: "Żadne państwo §YZachodu§! nie posiada więcej technologii niż §Y[Root.GetName]§!."
 has_more_institutions_than_westerns_tt: "Żadne państwo §YZachodu§! nie przyjęło większej liczby instytucji niż §Y[Root.GetName]§!."
 eth_westernize_the_army_title: "Zmodernizuj armię"
 eth_westernize_the_army_desc: "W przeszłości nasz naród mógł przekonać się o skuteczności i brutalności europejskich armii. Szczególnie podczas konfliktów z Sułtanatem Adalu państwo [Root.GetName] obserwowało dzięki Portugalczykom technologiczne osiągnięcia w sztuce wojennej. Powinniśmy zmodernizować armię i przyswoić zachodnią technologię, inaczej możemy paść ofiarą dobrze przygotowanych europejskich najeźdźców."
 eth_blessed_empire_title: "Błogosławione imperium"
 eth_blessed_empire_desc: "Nasz naród przezwyciężył liczne wyzwania i wyszedł z nich zwycięsko. Przywróciliśmy kontakty z chrześcijanami Europy, zmodernizowaliśmy technologię i społeczeństwo! Odtworzyliśmy granice starożytnego imperium, a nawet je przekroczyliśmy! Otrzymaliśmy także święte światło samego Pana! Bez wątpienia jesteśmy Błogosławionym Imperium, górującym nad wszystkimi innymi imperiami!"
 mal_pick_religious_direction_title: "Wybierz kierunek"
 mal_pick_religious_direction_desc: "Nasze państwo — zarówno cała rodzina królewska, jak i arystokracja — składa się z gorliwych muzułmanów, podczas gdy chłopi i niższe warstwy mieszczaństwa wyznają plemienne wierzenia pogańskie. W takim państwie [Root.GovernmentName] kwestia kierunku religijnego jest ważniejsza niż kiedykolwiek. Musimy dokonać wyboru, jeśli chcemy zachować wewnętrzną stabilność."
 mal_pick_a_religious_direction_tt: "W zależności od wyboru państwo [Root.GetName] odblokuje §Ymisję religijną§! albo §Ymisję tolerancji§!."
 mal_pick_a_religious_direction_ct: "Wystąpiło wydarzenie „§YIslamizacja arystokracji§!” i wybraliśmy jedną z dwóch możliwości."
 mal_create_navy_title: "Utwórz flotę handlową"
 mal_create_navy_desc: "Od czasów naszej złotej ery kupcy [Root.GetAdjective] polegali na karawanach i szlakach lądowych prowadzących do Egiptu, Arabii i Europy. Upadek naszego państwa po śmierci Mansy Musy pokazał jednak, że te szlaki handlowe nie są już wystarczające.\nMusimy się dostosować i podróżować drogą morską, aby dotrzeć do bardziej dochodowych rynków. Najpierw jednak potrzebujemy floty handlowej."
 mal_new_world_ambition_title: "Tajemnica Ko Mamadiego"
 mal_new_world_ambition_desc: "Poprzednikiem Mansy Musy był — jak twierdził sam Musa — ciekawski Mansa Ko Mamadi, znany w języku arabskim jako Muhammad ibn Qu. Ko Mamadi zniknął z Mali, gdy wraz z flotą tysiąca statków wypłynął na zachód i nigdy nie powrócił.\nNasz dobrotliwy Musa był człowiekiem pobożnym i hojnym, lecz prawdziwość opowieści o Ko Mamadim budzi... wątpliwości naszego dworu. Mimo to tajemnica Ko Mamadiego intryguje zarówno naszych żeglarzy, jak i członków rodziny królewskiej, dlatego warto rozważyć zbadanie zachodnich mórz."
 mal_discover_the_new_world_title: "Poszukaj zaginionej floty"
 mal_discover_the_new_world_desc: "Poszukiwania zaginionej floty wciąż trwają. Gdzieś musi znajdować się wrak potwierdzający istnienie okrętów i legendę Ko Mamadiego..."
 mal_discover_the_new_world_tt: "Odkryj co najmniej jedną prowincję w §YAmeryce Południowej§!."
 mal_abu_bakr_ambition_title: "Ambicja Ko Mamadiego"
 mal_abu_bakr_ambition_desc: "Choć istnienie Mansy Ko Mamadiego i jego floty pozostaje tajemnicą, odkrycie Ameryki Południowej jest skutkiem fascynacji, jaką wzbudziła w nas jego historia. Aby ostatecznie oddać hołd tej legendzie, powinniśmy podjąć jego dzieło i skolonizować ten kontynent ku chwale państwa [Root.GetName]."
 mal_conquer_jol_title: "Podporządkuj Dżolof"
 mal_conquer_jol_desc: "Dżolof był naszym wasalem w początkowym okresie swojego istnienia, lecz wskutek naszych wewnętrznych sporów zdołał ogłosić niepodległość. Przez sto lat cieszył się suwerennością, ale teraz nadszedł czas, by ponownie znalazł się pod naszą opieką."
 mal_trade_with_maghreb_title: "Nawiąż kontakty z Maghrebem"
 mal_trade_with_maghreb_desc: "Od śmierci wielkiego Mansy Musy nasze państwo [Root.GovernmentName] pozostaje odizolowane od reszty świata muzułmańskiego. Nie możemy na to pozwolić — musimy ponownie nawiązać kontakty z naszymi współwyznawcami w Maghrebie."
 mal_trade_with_maghreb_tt: "Umożliwia jednorazowy zakup prowincji w §YEuropie§! za pomocą decyzji."
 mal_trade_with_europeans_title: "Dotrzyj do Europy"
 mal_trade_with_europeans_desc: "Choć handel w Safi zwiększa nasze dochody, nie może równać się z potencjalnymi zyskami, jakie przyniosłaby nam obecność na europejskim rynku. W naszym interesie leży zatem uzyskanie dostępu do jednego z europejskich węzłów handlowych."
 mal_econimical_hegemony_title: "Przygotuj pielgrzymkę"
 mal_econimical_hegemony_desc: "Pielgrzymka do Mekki jest świętym obowiązkiem każdego pobożnego muzułmanina. Ma ona dla nas dodatkowe znaczenie, ponieważ nasi Mansas tradycyjnie podróżowali do Mekki z bogactwami ofiarowanymi w imię Allaha. Tym razem powinniśmy zorganizować jeszcze większą pielgrzymkę, która obejmie również cuda Europy. Potrzebujemy jednak gospodarki zdolnej sfinansować podróż [Root.Monarch.GetTitle] oraz kompetentnego dworu, który w tym czasie przejmie [Root.Monarch.GetHerHis] obowiązki."
 mal_riches_of_trade_tt: "§Y[Root.GetName]§! posiada co najmniej §Y50%§! siły handlowej i jest najsilniejszym państwem pod względem §Ysiły handlowej§! w dowolnym §Yeuropejskim§! węźle handlowym."
 mal_fighting_musa_title: "Mansa do boju"
 mal_fighting_musa_desc: "Wspaniałe czasy Mansy Musy dobiegły końca, lecz nasze państwo nigdy nie zdołało się po nich podnieść.\nTo musi się zmienić! Prawowitość wszystkich Mansasów po Musie była mocno kwestionowana i żaden z nich nie zdobył poparcia naszego ludu. [Root.Monarch.GetName] nie podzieli ich losu — osobiście poprowadzi nasze wojska do zwycięstwa."
 mal_subjugate_zaf_title: "Udobruchaj Bambara"
 mal_subjugate_zaf_desc: "Bambara z Segu w regionie Massina wyrażają wielkie niezadowolenie z naszych rządów i pragną się od nas odłączyć. W rezultacie zwracają się teraz do naszego rywala, Songhaju, szukając poparcia dla ruchu niepodległościowego.\nNie możemy do tego dopuścić! Powinniśmy jak najszybciej udobruchać Bambara, aby zatrzymać ich w granicach naszego państwa."
 mal_reintegrate_son_title: "Ponownie zjednocz Songhaj"
 mal_reintegrate_son_desc: "Kolejnym państwem, które niegdyś należało do [Root.GetAdjective], jest [SON.GetName]. W przeciwieństwie do [ZAF.GetName], [SON.GetName] zamierza jednak rosnąć w siłę i wypełnić próżnię polityczną w Afryce Zachodniej, powstałą wskutek naszego początkowego upadku. Jeśli nasze państwo ma przetrwać, musimy zażegnać zagrożenie ze strony [SON.GetAdjective] i ponownie włączyć lud Songhaju do naszego narodu."
 mal_restore_the_mali_empire_title: "Przywróć imperium"
 mal_restore_the_mali_empire_desc: "Niegdyś byliśmy główną potęgą i kulturowym sercem Afryki Zachodniej. Niestety, wskutek nieudanych sukcesji nasze imperium zaczęło podupadać i mogło całkowicie zniknąć.\nZdołaliśmy jednak przetrwać, a nawet odwrócić bieg wydarzeń. Teraz nadszedł czas, by rozszerzyć granice poza dawne imperium i odzyskać nasz dawny tytuł!"
 mal_control_the_niger_river_title: "Kontroluj rzekę"
 mal_control_the_niger_river_desc: "Rzeka Niger jest życiodajną arterią Afryki Zachodniej i ma ogromne znaczenie dla całego regionu. Najlepiej byłoby, gdyby znalazła się pod naszą całkowitą kontrolą."
 mal_control_the_niger_river_ct: "Posiadaj wszystkie prowincje narodowe położone nad rzeką §YNiger§!."
 mal_control_the_niger_river_tt: "Każda posiadana prowincja położona nad rzeką §YNiger§! otrzyma na §Y25§! lat modyfikator „§YKultywowana dolina rzeki§!”, zapewniający następujące efekty:\nKoszt rozwoju: §G-10,0%§!\nLokalna wydajność produkcji: §G+10,0%§!\nLokalny modyfikator podatkowy: §G+10,0%§!"
 mal_dominate_ivory_coast_and_timbuktu_title: "Chroń handel Afryki Zachodniej"
 mal_dominate_ivory_coast_and_timbuktu_desc: "Cały handel Afryki Zachodniej powinien odbywać się pod naszym nadzorem. Nie możemy pozwolić cudzoziemcom ani rywalom znaleźć sposobu na wykorzystywanie handlu w naszym rodzimym regionie."
 mal_dominate_ivory_coast_and_timbuktu_tt: "Żadne państwo §Yeuropejskie§! nie posiada §Y20%§! siły handlowej w węzłach handlowych §YZłote Wybrzeże§!, §YTimbuktu§! ani §YKatsina§!."
 mal_trade_domination: "Chroniony zachodnioafrykański handel"
 mal_retake_the_mosque_title: "Podbij Dżenne"
 mal_retake_the_mosque_desc: "Państwo Dżenne było niegdyś naszym partnerem handlowym, a przez pewien czas nawet wasalem wielkiego imperium Mali. Wraz z naszym upadkiem Dżenne zdołało uzyskać niepodległość. Obecnie prowadzi handel z naszymi rywalami i udziela im wsparcia. Nie możemy na to pozwolić — musimy zaanektować ich państwo."
 mal_conquer_tmb_title: "Odzyskaj Timbuktu"
 mal_conquer_tmb_desc: "Wielkie miasto Timbuktu było niegdyś niezbędną częścią naszego imperium, ponieważ stanowiło placówkę handlową łączącą Afrykę Zachodnią z Europą. Wskutek naszego upadku miasto wymknęło się spod naszej kontroli i utworzyło własne państwo. Nadszedł czas, by odzyskać to bezcenne miasto i ponownie włączyć je do naszego państwa [Root.GovernmentName]."
 mal_absolute_authority_title: "Przywróć władzę Mali"
 mal_absolute_authority_desc: "Wielu uważało, że potężne imperium Mali już nigdy nie powróci i że z czasem całkowicie znikniemy z kart historii.\nTo nieprawda! Zdołaliśmy rozszerzyć nasze granice ponad wszelkie oczekiwania i zażegnać zagrożenia wewnętrzne. Niech wszyscy wiedzą, że władza Mali została w pełni przywrócona!"
 mal_absolute_authority_ct: "Katastrofa §YUpadek Mali§! dobiegnie końca."
 mal_west_african_great_power_title: "Mocarstwo Afryki Zachodniej"
 mal_west_african_great_power_desc: "Nasze imperium stało na skraju całkowitego upadku, a jednak zdołaliśmy przetrwać, a nawet się rozwinąć! Choć dominujemy w naszym regionie, nie jesteśmy jedyną wielką potęgą na świecie. Europejczycy również utworzyli potężne państwa i próbują narzucać swoją wolę mieszkańcom Afryki.\nMusimy wzrosnąć w siłę i pokazać tym zarozumiałym Europejczykom, że nie zdołają narzucić nam swoich ambicji!"
 mal_west_african_great_power_ct: "Żaden §YEuropejski§! kraj nie ma więcej całkowitego rozwoju niź §Y[Root.GetName]§!."
 mal_brace_for_decline_title: "Zdobądź przychylność stanów"
 mal_brace_for_decline_desc: "Nie jest tajemnicą, że nasze państwo przeżywa najciemniejszy okres w swojej historii. Wielu mieszkańców obawia się najgorszego, a poddani i rywale szukają okazji, by wykorzystać naszą słabość. W takich czasach jedność i lojalność na dworze są ważniejsze niż kiedykolwiek. Powinniśmy zdobyć przychylność stanów, aby nie zwróciły się przeciwko nam przy pierwszej sposobności."
 mal_brace_for_decline_tt: "Stany pozostaną §Ylojalne§! wobec państwa [Root.GetName] podczas katastrofy §YUpadek Mali§!."
 mal_get_competent_court_title: "Kompetentny dwór"
 mal_get_competent_court_desc: "Po śmierci Mansy Musy w 1337 roku tron objął jego syn Maghan — pierwszy z wielu fatalnych władców, których musieliśmy znosić po naszej złotej erze. W 1341 roku Maghana zastąpił jego stryj Sulejman, który naprawił liczne błędy finansowe popełnione przez bratanka. Po jego śmierci Mali miało już tylko Mansasów panujących przez kilka miesięcy albo będących bezwzględnymi tyranami.\n\nJeśli chcemy wreszcie przezwyciężyć naszą przeszłość, na tronie musi zasiąść kompetentny Mansa — a przynajmniej taki, który potrafi dobrać kompetentnych ludzi na dwór."
 mal_get_competent_court_tt: "Podczas katastrofy §YUpadek Mali§! po koronacji nowego Mansy nie będą już wybuchać bunty §Ypretendentów§!."
 mal_handle_the_kaabu_title: "Rozwiąż kwestię Kaabu"
 mal_handle_the_kaabu_desc: "[1114.GetName] należy do państwa [Root.GetName] od XIII wieku. Jednak wskutek niemal stuletniego stopniowego upadku mieszkańcy [1114.GetName] czują się zaniedbywani i pragną utworzyć własne, całkowicie niezależne państwo — zwłaszcza odkąd nawiązali kontakty z Europejczykami i nie chcą już pośredniczyć w naszym handlu.\nPowinniśmy okazać im zrozumienie i przychylność, aby kolejna część naszego kraju nie wymknęła się spod naszej kontroli."
 mal_handle_the_kaabu_ct: "Każda prowincja będąca jednocześnie prowincją narodową innego państwa pozostanie §Ylojalna§! wobec [Root.GetName] podczas katastrofy §YUpadek Mali§!."
 mal_gold_and_ivory_title: "Złoto i kość słoniowa"
 mal_gold_and_ivory_desc: "Złoto od zawsze było głównym towarem eksportowym państwa [Root.GetName], a wielu cudzoziemców zrobiłoby wszystko, by zdobyć samorodki należące do naszego wielkiego [Root.Monarch.GetTitle]. Mamy jednak dostęp również do innego surowca, którego popularność ostatnio wzrosła — kości słoniowej.\nPowinniśmy zwiększyć produkcję obu tych dóbr i rozwinąć naszą gospodarkę."
 mal_give_gold_away_title: "Okaż hojność"
 mal_give_gold_away_desc: "[Root.GetMaliReligionGenorisityMissionText]"
 mal_give_gold_away_desc_muslim: "Posiadanie bogactwa i skarbów ziemi jest wspaniałe, lecz nie realizuje wizji Proroka. Zamiast gromadzić nasze zasoby, powinniśmy pójść w ślady wielkiego Mansy Musy i podzielić się złotem z naszymi współwyznawcami, przede wszystkim w Anatolii, Egipcie i oczywiście Mekce."
 mal_give_gold_away_desc_fetishist: "Świat obdarzył nas cennymi kruszcami i innymi bogactwami, a my potrafimy się nimi cieszyć. Nie jest to jednak zgodne z duchem naszych szamanów i naszych wierzeń. Zamiast tego powinniśmy podzielić się naszym bogactwem z innymi wielkimi plemionami świata!"
 mal_jihad_upon_own_population_title: "[Root.GetPreviewColorMAL]Nawróć państwo [Root.GetName][Root.GetPreviewColorMAL_end]"
 mal_jihad_upon_own_population_desc: "Po islamizacji naszej arystokracji postanowiliśmy przekonać również lud do przyjęcia islamu. Powinniśmy rozpocząć działania, wykorzenić dawne pogańskie praktyki i pozbawić [Root.GetDhimmiName] wpływów, jakie nad nami sprawuje."
 mal_more_tolerance_to_heathens_title: "[Root.GetPreviewColorMAL]Toleruj tradycję[Root.GetPreviewColorMAL_end]"
 mal_more_tolerance_to_heathens_desc: "Postanowiliśmy pozwolić ludności wiejskiej nadal praktykować tradycyjną religię. Wyższe warstwy naszego społeczeństwa nie są jednak tym zachwycone. Musimy zwiększyć społeczną tolerancję dla dawnych tradycji i ograniczyć wpływy [Root.GetClergyName] w naszym państwie [Root.GovernmentName]."
 son_build_military_title: "Przygotowania wojenne"
 son_build_military_desc: "Niegdyś byliśmy poddanymi Mali, dopóki państwo to nie utraciło kontroli nad swoimi ziemiami. Od tamtej pory jesteśmy niepodlegli i sami musimy bronić się przed zagrożeniami z zewnątrz. Powinniśmy rozbudować nasze siły zbrojne i zatrudnić kompetentnego generała, ponieważ zbliża się czas konfliktów."
 son_conquer_tmb_title: "Podbij Timbuktu"
 son_conquer_tmb_desc: "Timbuktu jest sercem kultury i handlu Afryki Zachodniej, przyciągającym kupców, uczonych, ulemów i cudzoziemców. W naszym interesie leży przejęcie kontroli nad tym ważnym miastem."
 son_conquer_zaf_title: "Podbij Kumbi Salih"
 son_conquer_zaf_desc: "Około 300 lat temu potężne Imperium Ghany władało ziemiami, które obecnie zajmuje Mali. Z czasem imperium rozpadło się, a jego niegdyś imponująca stolica, Kumbi Salih, jest dziś jedynie opuszczonym miastem.\nPodbój tych ruin może jednak pomóc nam zdobyć przyczółek na ziemiach Mali. Możemy również odnaleźć dawne pisma, które okażą się przydatne dla naszego państwa."
 son_prepare_troops_title: "Zdobądź tytuł imperium"
 son_prepare_troops_desc: "Nadszedł czas, aby Mali oddało nam swój tytuł. Upadek ich osłabił i teraz są jedynie cieniem tego, czym byli kiedyś. Jednak aby zdobyć tytuł Imperium Afryki Zachodniej, musimy zademonstrować naszą siłę, deklasując Mali pod każdym możliwym względem."
 son_invade_mali_title: "Wyeliminuj Mali"
 son_invade_mali_desc: "Mali przeżyło swoje czasy. Wyciągnięcie tej żałosnej krainy z nędzy i zintegrowanie jej ludności z naszym własnym, prawowitym imperium jest aktem miłosierdzia!"
 son_west_african_great_power_title: "Podbij Zach. Afrykę"
 son_west_african_great_power_desc: "Wraz z upadkiem Mali nasz największy rywal przestał istnieć. Cały Niger, Sahel i Gwinea stoją przed nami otworem, a o wpływy w Maghrebie możemy rywalizować bez obaw o ataki z naszego rodzimego regionu."
 son_competence_in_court_title: "Usprawnić biurokrację"
 son_competence_in_court_desc: "Biurokracja nie jest zbyt ekscytującym tematem, ale jest niezbędna dla każdego kraju, który ma wielkie ambicje. Obecny stan naszej biurokracji wygląda jednak fatalnie. Musimy uporządkować naszą administrację, zanim w ogóle zaczniemy myśleć o ekspansji."
 son_military_expertise_title: "Profesjonalizm armii"
 son_military_expertise_desc: "Wielu władców dynastii Sonni widziało w każdym chłopie jedynie kolejnego potencjalnego żołnierza, którego można poświęcić w bezsensownej wojnie. Takie podejście pomagało nam w przeszłości zdobywać więcej rekrutów, lecz z pewnością nie było efektywne kosztowo. Powinniśmy z niego zrezygnować i stworzyć zawodową armię, osobiście dowodzoną przez naszego [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself]."
 son_win_battles_title: "Rozkoszuj się chwałą bitew"
 son_win_battles_desc: "Zawodowa armia jest jedynie ozdobą, jeśli nie wykorzystujemy jej w walce. Powinniśmy uwolnić jej potęgę przeciwko naszym wrogom i zdobyć chwałę na polu bitwy!"
 son_win_battles_bt: "Warunek tej misji zostanie ujawniony po ukończeniu misji „§YProfesjonalizacja armii§!”."
 son_win_battles_ct: "Wygraj co najmniej §Y30§! bitew (obecnie §Y[Root.son_fight_counter.GetValue]§!/§Y30§!).\nZwycięskie bitwy armii dowodzonych przez §Y[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§! liczą się podwójnie."
 son_modernize_army_title: "Zreformuj armię"
 son_modernize_army_desc: "Chociaż użycie broni palnej i pistoletów zakrada się do naszego wojska, to wciąż jest ono daleko od powszechnego stosowania przez nasze wojska. Większość naszych żołnierzy nadal polega na włóczniach i łukach, podczas gdy Maghrebczycy i Europejczycy opanowali broń palną. Jeśli chcemy uniknąć przejęcia przez naszych północnych sąsiadów, musimy zreformować armię i zmodernizować jej uzbrojenie."
 son_modernize_army_tt: "Żadne państwo z grupy technologicznej §YZachodu§! nie ma wyższej technologii wojskowej niż §Y[Root.GetName]§!."
 son_westernize_state_title: "Modernizacja [Root.GetAdjective]"
 son_westernize_state_desc: "Choć nasza armia przechodzi reformy i modernizację, nasze państwo [Root.GovernmentName] nadal opiera się na dawnych prawach i średniowiecznych zasadach, a [Root.Monarch.GetTitle] nie jest postrzegany jako absolutny władca [Root.GetName]. Powinniśmy skupić się na reorganizacji rządu i przyjęciu licznych osiągnięć nowoczesnej technologii."
 son_stop_the_air_raids_title: "Powstrzymaj najazdy Tuaregów"
 son_stop_the_air_raids_desc: "Od powstania naszego państwa lud [Root.GetAdjective] musi odpierać najazdy ze strony [AIR.GetName]. Obrona nie jest jednak rozwiązaniem — Tuaregowie będą nadal łupić nasze wioski.\nAby położyć kres temu zagrożeniu, musimy przejść do ofensywy i wyeliminować niebezpieczeństwo ze strony [AIR.GetAdjective]."
 son_take_djenne_title: "Podbij [1134.GetName]"
 son_take_djenne_desc: "[1134.GetName] od momentu powstania było niezwykle ważnym ośrodkiem handlu nad Nigrem. Znajduje się tam również Wielki Meczet w Dżenne. Miasto należało niegdyś do naszego rywala, Mali, lecz obecnie jest niepodległe, a przez to stanowi łatwy cel.\nPowinniśmy przejąć kontrolę nad tym ważnym miastem ku chwale państwa [Root.GetName]."
 son_expand_djenne_mosque_title: "Odnów Wielki Meczet"
 son_expand_djenne_mosque_desc: "Podczas podboju miasta Wielki Meczet w Dżenne ucierpiał wskutek zniszczeń ubocznych. Musimy odnowić go w imię Allaha!"
 son_contact_with_morocco_title: "Kontakt z Maghrebem"
 son_contact_with_morocco_desc: "W czasach Imperium Ghany regiony Sahelu i Nigru często odwiedzali podróżnicy z Arabii i Maghrebu. Tak samo było za istnienia Imperium Mali, lecz obecnie kupcy i podróżnicy z tych ziem rzadko już do nas przybywają. Powinniśmy odnowić kontakty z naszymi współwyznawcami, przynajmniej z mieszkańcami Maghrebu, którzy są nam najbliżsi."
 son_contact_with_morocco_tt: "Odkryj dowolną prowincję w §YMaghrebie§!"
 son_invade_maghreb_title: "Zaatakuj Maghreb"
 son_invade_maghreb_desc: "Mieliśmy nadzieję na lepsze stosunki dyplomatyczne z mieszkańcami Maghrebu, lecz interesują ich wyłącznie nasze złoto i sól. Co gorsza, Marokańczycy planowali nawet inwazję na nasze ziemie, aby przejąć wydobycie soli i złota! Dla własnego bezpieczeństwa powinniśmy uprzedzić ich atak i sami przejść do ofensywy!"
 son_consolidate_maghreb_title: "Skonsoliduj Maghreb"
 son_consolidate_maghreb_desc: "Maghreb to rozległy region pełen cennych zasobów. Powinniśmy rozszerzyć tam nasze wpływy i podbić pozostałe prowincje, aby czerpać z nich korzyści."
 son_conquer_the_mossi_title: "Zlikwiduj zagrożenie ze strony Mossi"
 son_conquer_the_mossi_desc: "Plemiona Mossi na południu od dawna są cierniem w naszym boku. Choć regularnie walczą między sobą, wraz z Tuaregami wciąż organizują najazdy na nasze wioski. Jeśli chcemy zaznać spokoju od tych pogan, musimy okazać siłę i zlikwidować ich plemiona."
 son_conquer_the_mossi_tt: "Każda prowincja §YMossi§! należy do państwa §Y[Root.GetName]§! lub jego poddanych niebędących państwami trybutarnymi."
 son_convert_the_mossi_title: "[Root.GetPreviewColorSON]Nawróć Mossi[Root.GetPreviewColorSON_end]"
 son_convert_the_mossi_desc: "[Root.GetClergyName] zbadali historię Mossi i ich najazdów na nasz lud, po czym zaproponowali rozwiązanie: całkowite nawrócenie Mossi na prawdziwą wiarę! Ci poganie muszą ujrzeć światło Allaha!"
 son_convert_the_mossi_tt: "Każda prowincja §YMossi§! wyznaje religię §Y[Root.Religion.GetName]§!."
 son_convert_the_mossi_ct: "Każda prowincja §YMossi§! utraci §G100§ punktów autonomii i otrzyma na §Y30§! lat modyfikator „§YWierni wyznawcy§!”, zapewniający następujący efekt:\nLokalny separatyzm: §G-10,0§!"
 son_invite_foreign_scholars_title: "Zaproś zagranicznych uczonych"
 son_invite_foreign_scholars_desc: "Dzieli nas wielka odległość od naszych współwyznawców w Arabii, a nasi uczeni są od nich równie odlegli. W rezultacie nasze prawa rozwijały się niezależnie od ich praw. Powinniśmy zaprosić uczonych ze wschodu i poznać ich najnowsze osiągnięcia w dziedzinie prawa [Root.Religion.GetName]."
 son_invite_foreign_scholars_ct: "Z państwem §Y[Root.GetName]§! sprzymierzone jest dowolne państwo, którego stolica NIE znajduje się w regionie §YSahelu§!, §YNigru§! ani §YGwinei§! i które wyznaje religię §Y[Root.Religion.GetName]§!."
 son_invite_foreign_scholars_bt: "Państwo [Root.GetName] będzie mogło zaprosić §Yuczonego§! bez spełniania wymagań dyplomatycznych.\n"
 son_invite_foreign_scholars_at: "Rodzaj uczonego zależy od tego, jaka szkoła zostanie zaproszona w chwili ukończenia tej misji."
 son_invite_foreign_scholars_tt: "Posiada stolicę, która NIE znajduje się w regionie §YSahelu§!, §YNigru§! ani §YGwinei§!\n  Wyznaje religię §Y[Root.Religion.GetName]§!\n  Ma opinię o państwie §Y[Root.GetName]§! wynoszącą co najmniej §Y150§!"
 son_power_to_the_ulema_title: "Większa władza dla [Root.GetClergyName]"
 son_power_to_the_ulema_desc: "Nasz [Root.GovernmentName] zmierza ku jedności religijnej i oświeceniu. Wciąż jednak wiele pozostaje do zrobienia. [Root.GetClergyName] zarządzają świętymi prawami naszego kraju i nadzorują nawracanie niewiernych, lecz ogranicza ich nasz rząd. Powinniśmy przyznać im większą swobodę i dodatkowe przywileje, aby mogli przyspieszyć rozwój naszego prawodawstwa."
 son_convert_west_africa_title: "Nawróć Afrykę Zachodnią"
 son_convert_west_africa_desc: "Afryka Zachodnia zawsze wyróżniała się pod względem religijnym. Gdy islam umocnił tu swoją pozycję, wyższe warstwy społeczne przyjęły prawdziwą wiarę, lecz nie narzucały jej swoim poddanym. W rzadkich przypadkach przyznawały nawet pogańskim chłopom prawa i tolerowały ich obyczaje.\nCzas tolerancji jednak minął. Teraz także tych niewiernych należy skierować na właściwą drogę."
 son_convert_west_africa_tt: "Wszystkie skolonizowane prowincje w regionach §YSahelu§!, §YNigru§! i §YGwinei§! wyznają religię §Y[Root.Religion.GetName]§!."
 son_build_workshops_title: "Zbuduj warsztaty"
 son_build_workshops_desc: "Popyt na nasze wyroby rośnie, a coraz więcej kupców chce handlować z nami solą i innymi towarami. Powinniśmy zbudować warsztaty, aby zwiększyć wydajność produkcji."
 son_own_develop_clothes_and_salt_title: "Rozwiń produkcję soli i tkanin"
 son_own_develop_clothes_and_salt_desc: "Złoto uchodzi na świecie za niezwykle cenny surowiec. Jednak w Afryce Zachodniej ustępuje ono miejsca innemu, znacznie ważniejszemu bogactwu — soli. Złoto zasila nasz skarbiec, ale nie nadaje się do spożycia, dlatego sól ma tutaj ogromną wartość.\nNie możemy też zapominać o tkaninach, które odgrywają istotną rolę w ochronie ciała przed palącym słońcem.\n\nPowinniśmy rozwinąć produkcję obu tych towarów, aby zaopatrywać nasz rynek i rozszerzyć handel daleko poza Sahel i dorzecze Nigru."
 son_own_develop_clothes_and_salt_ct: "Państwo [Root.GetName] otrzymuje modyfikator „§YGłówne centrum produkcji soli i tkanin§!” na §Y25 lat§!, zapewniający następujące efekty:\nSiła handlu na świecie: §G+25,0%§!\nKażda posiadana prowincja produkująca §Y sól§! lub §Y tkaniny§!:\nLokalna produkcja dóbr: §G+0,50§!"
 son_gold_of_west_africa_title: "Bogactwo Afryki Zachodniej"
 son_gold_of_west_africa_desc: "Nasz rodzimy region słynie z bogatych złóż złota. Powinniśmy rozwinąć wydobycie tego kruszcu i założyć targowiska, aby rozprowadzać go do najdalszych zakątków świata."
 son_dominate_west_african_trade_title: "Chroń handel Afryki Zachodniej"
 son_dominate_west_african_trade_desc: "Cały handel w Afryce Zachodniej będzie prowadzony pod naszym nadzorem. Nie możemy pozwolić, aby obcokrajowcy i rywale znaleźli sposób na wykorzystanie handlu w naszym rodzimym regionie."
 son_guarantee_the_fetishist_title: "Zagwarantuj wolność dawnych tradycji"
 son_guarantee_the_fetishist_desc: "[Root.GetName], podobnie jak inne państwa Afryki, niegdyś wyznawało dawne tradycje i wiarę przodków. Podczas gdy nasze wyższe warstwy społeczne przyjęły światło Allaha, ludność wiejska nadal hołduje pogańskim obyczajom. Powinniśmy uszanować nasze korzenie i zagwarantować naszym poddanym wolność wyznania."
 son_guarantee_the_fetishist_ct: "Państwo [Root.GetName] ma co najmniej §Y1§! punkt tolerancji pogan."
 son_fetishist_alliances_title: "Pogańskie sojusze"
 son_fetishist_alliances_desc: "Aby lepiej zrozumieć naszą przeszłość i tradycje, musimy poznać obyczaje pogan. Powinniśmy zgromadzić pogańskich sojuszników lub poddanych i przyjrzeć się ich zwyczajom."
 son_fetishist_alliances_ct: "Ma swoją stolicę w §YAfryce§!"
 son_eliminate_other_muslims_title: "Chroń nasze dziedzictwo"
 son_eliminate_other_muslims_desc: "Wiara fetyszystów może być dla nas i wyznawców islamu pogańska, ale stanowi ważną część naszej tożsamości i dziedzictwa. Musimy je chronić przed religijnymi fanatykami, którzy pragną je zniszczyć."
 son_eliminate_other_muslims_tt: "Żadna prowincja fetyszystyczna w regionie §YSahelu§!, §YNigru§! ani §YGwinei§! nie jest w posiadaniu państwa niebędącego fetyszystycznym, z wyjątkiem państwa §Y[Root.GetName]§! i jego poddanych."
 son_back_to_the_roots_title: "Zjednocz plemiona"
 son_back_to_the_roots_desc: "Wiele państw wyznających dawne wierzenia jest rozdrobnionych na plemiona, które toczą wojny między sobą i z nami, stopniowo tracąc na znaczeniu. Los tych plemion nie jest dla nas szczególnie istotny, lecz tradycje i historia, które kultywują, zasługują na ochronę i zachowanie. Powinniśmy wyświadczyć przysługę ich wiejskiej ludności i wyzwolić ją spod władzy plemion."
 son_back_to_the_roots_ct: "Państwo [Root.GetName] ma co najmniej §Y3§! punkty tolerancji pogan."
 son_european_gold_market_title: "Europejski rynek"
 son_european_gold_market_desc: "Europejskie rynki oferują wiele możliwości. Rozwój naszych własnych węzłów handlowych i wydobycia złota poprawia sytuację finansową, ale istnieją jeszcze inne sposoby na zdobycie większej liczby dukatów."
 son_first_branch_mission_title: "[Root.GetSelectableMissionTitle]"
 son_first_branch_mission_desc: "[Root.GetSelectableMissionDescription]"
 son_second_branch_mission_title: "[Root.GetSelectableMissionTitle]"
 son_second_branch_mission_desc: "[Root.GetSelectableMissionDescription]"
 son_third_branch_mission_title: "[Root.GetSelectableMissionTitle]"
 son_third_branch_mission_desc: "[Root.GetSelectableMissionDescription]"
 son_fourth_branch_mission_title: "[Root.GetSelectableMissionTitle]"
 son_fourth_branch_mission_desc: "[Root.GetSelectableMissionDescription]"
 SELECTABLE_MISSION_TITLE: "Misja z rozgałęzieniem"
 SELECTABLE_MISSION_DESCRIPTION: "Ta misja to §Ymisja z rozgałęzieniem§! W wyniku wydarzeń lub innych misji ta misja zostanie zastąpiona nową, ostateczną wersją."
 selectable_mission_trigger_tt: "Tej misji nie można ukończyć, ponieważ jest to §Ymisja rozgałęziona§!."
 son_religious_triggers_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yreligijną§!, do ukończenia tej misji będą wymagane następujące warunki:"
 son_tolerance_triggers_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ytolerancji§!, do ukończenia tej misji będą wymagane następujące warunki:"
 son_religious_effects_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yreligijną§!, wystąpią następujące efekty:"
 son_tolerance_effects_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ytolerancji§!, wystąpią następujące efekty:"
 kon_develop_country_title: "Rozwiń [Root.GetName]"
 kon_develop_country_desc: "Nasz [Root.GovernmentName] stoi u progu wielkości. Aby jednak ją osiągnąć, potrzebujemy więcej ludności oraz infrastruktury, która będzie w stanie ją utrzymać. Powinniśmy rozwinąć [1170.GetCapitalName] i okoliczne tereny."
 kon_colonize_coast_title: "Źródła nzimbu"
 kon_colonize_coast_desc: "Tradycyjnie muszle małży, zwane nzimbu, służyły państwu [Root.GetName] jako środek płatniczy. Łatwo je zdobyć, lecz ponieważ dostęp do złota w naszym rodzimym regionie jest ograniczony, potrzebujemy tych muszli, aby nadal bić własną walutę.\nNa szczęście istnieje dobre źródło tych cennych muszli: na wyspach u wybrzeży [1167.GetName] żyją małże, z których pochodzą. Powinniśmy rozszerzyć nasze terytorium i włączyć to wybrzeże do państwa, aby zwiększyć dostęp do nzimbu."
 kon_protect_trade_title: "Kontroler handlu"
 kon_protect_trade_desc: "Gospodarka państwa [Root.GetName] opiera się na nzimbu jako walucie oraz na handlu wewnętrznym. Sam handel wewnętrzny nie jest jednak wystarczająco wydajny, dlatego powinniśmy rozszerzyć wymianę handlową na plemiona Konga, region Wielkich Jezior i Wybrzeże Kości Słoniowej."
 kon_seize_crown_land_title: "Przejmij władzę mani"
 kon_seize_crown_land_desc: "[Root.GetName] jest konfederacją prowincji zarządzanych przez mani naszego państwa. Pobierają oni podatki z obszarów wiejskich, a każdego roku przedstawiają swoje dochody [Root.Monarch.GetTitle]. Jeśli nasz [Root.Monarch.GetTitle] jest z nich zadowolony, mani mogą zachować władzę na kolejny rok.\nChoć ten system sprawdzał się w przeszłości, jest już przestarzałą formą rządów. Jeśli nasz [Root.GovernmentName] ma przetrwać, musimy odebrać mani władzę i scentralizować państwo."
 kon_seize_crown_land_tt: "§GZmniejsz§! autonomię lokalną wszystkich posiadanych prowincji w regionach §YKonga§! i §YAfryki Środkowej§! do minimum."
 kon_absolute_rule_title: "Rządy absolutne"
 kon_absolute_rule_desc: "Świat się zmienia, a wraz z nim nasze miejsce w nim. Europejczycy przynieśli nowe idee. Nie wszystkie są dla nas praktyczne, lecz koncepcja absolutyzmu zasługuje na uwagę. Stoi ona w bezpośredniej sprzeczności z dawnymi tradycjami sprawowania władzy, ale nasz lud dostrzegł postępy, jakie Europejczycy osiągnęli dzięki temu modelowi rządów.\nPowinniśmy przyjąć tę koncepcję i wprowadzić rządy absolutne również w naszym państwie."
 absolutism_dynamic_reward_tt: "§YAbsolutyzm§! NIE jest aktywny.\nWarunki ukończenia tej misji ulegną znaczącej zmianie, gdy absolutyzm stanie się aktywny w §YWieku Absolutyzmu§! lub §YWieku Rewolucji§!."
 kon_annex_vassals_title: "Los Loango i Ndongo"
 kon_annex_vassals_desc: "Historia państw Ndongo i Loango jest niejasna i — podobnie jak nasza własna — opiera się na legendach. Mimo to oba te państwa są wasalami [Root.GetName], przynajmniej formalnie. Żadne z tych królestw nie jest już zdolne do samodzielnych rządów, dlatego powinny zostać włączone bezpośrednio do naszego [Root.GovernmentName]."
 kon_conquer_ksj_title: "Zagrożenie wojownikiem"
 kon_conquer_ksj_desc: "Nasza ojczyzna jest domem nie tylko dla ludu [Root.GetAdjective], lecz także dla wielu innych plemion. Choć łączą nas pewne podobieństwa i żyjemy blisko siebie, nasze kultury znacznie się różnią. Dwie z nich stanowią wręcz zagrożenie dla naszych granic: napadający na sąsiadów Jakowie oraz zmilitaryzowani Mbangala. Powinniśmy szybko podporządkować sobie te ludy, zanim staną się poważnym problemem."
 kon_conquer_ksj_tt: "Każda prowincja kultury §YYaka§! jest w posiadaniu państwa §Y[Root.GetName]§! lub jego poddanych niebędących trybutariuszami."
 kon_conquer_ksj_ct: "Każda prowincja kultury §YMbangala§! jest w posiadaniu państwa §Y[Root.GetName]§! lub jego poddanych niebędących trybutariuszami."
 kon_conquer_ckw_title: "Czokwe i Lunda"
 kon_conquer_ckw_desc: "W głębi regionu Konga żyją Czokwe i Lunda — dwa plemiona o własnych, wyjątkowych kulturach i tradycjach.\nCzokwe są znakomitymi rzemieślnikami i artystami, a ich dzieła stanowią skarb całego regionu.\nLunda słyną wśród naszego ludu ze sprawnego zarządzania państwem i głębokiego przywiązania do religii.\nNasz [Root.GovernmentName] mógłby wiele zyskać na włączeniu obu kultur do naszego państwa."
 kon_conquer_ckw_at: "Każda prowincja kultury §YChokwe§! jest w posiadaniu państwa §Y[Root.GetName]§! lub jego poddanych niebędących trybutariuszami."
 kon_conquer_ckw_bt: "Każda prowincja kultury §YLunda§! jest w posiadaniu państwa §Y[Root.GetName]§! lub jego poddanych niebędących trybutariuszami."
 kon_conquer_ckw_ct: "Każda posiadana przez państwo §Y[Root.GetName]§! lub jego poddanych prowincja produkująca §Ykość słoniową§! otrzymuje modyfikator „§YRzemiosło Czokwe§!” na §Y30 lat§!, zapewniający następujące efekty:\nLokalna produkcja dóbr: §G+1,0§!\nLokalny wzrost dobrobytu: §G+0,25§!"
 kon_conquer_kub_title: "Podbój Kuby"
 kon_conquer_kub_desc: "Według legend założycielskich Kuba to pradawne królestwo dżungli, mające co najmniej 900 lat. Ich legendy nie mają jednak dla nas większego znaczenia. O wiele ważniejsza jest sztuka, którą potrafią tworzyć mieszkańcy Kuby. Ich maski i szerokie miecze — miecze Ilwoon — świadczą zarówno o ich kunszcie artystycznym, jak i umiejętnościach wojennych.\nPowinniśmy włączyć lud Kuba do naszego państwa i wykorzystać oba te charakterystyczne dobra."
 kon_conquer_kub_tt: "Każda prowincja kultury §YKuba§! jest w posiadaniu państwa §Y[Root.GetName]§! lub jego poddanych niebędących trybutariuszami."
 kon_conquer_lub_title: "Lubańskie żelazo"
 kon_conquer_lub_desc: "Aby utrzymać władzę, nasz [Root.GovernmentName] potrzebuje strategicznych surowców, takich jak miedź i żelazo. Miedź nie stanowi większego problemu, lecz zasoby żelaza w Mpembie nie wystarczają, by utrzymać naszą gospodarkę i armię. Na szczęście na wschodzie Luba dysponują bogatymi złożami żelaza. Przydałoby nam się, gdybyśmy… uwolnili ich żelazo."
 kon_conquer_lub_tt: "§Y[Root.GetName]§! otrzymuje od każdego poddanego równowartość §G4§! lat produkcji §Yżelaza§! lub §Ymiedzi§! tego poddanego, wyrażoną w $COST|Y$¤."
 kon_consolidate_central_africa_title: "Zjednocz plemiona Konga"
 kon_consolidate_central_africa_desc: "Plemiona Konga od niepamiętnych czasów żywią do siebie wzajemną niechęć.\nTo musi się skończyć! W obliczu zagrożeń zewnętrznych i kolonistów próbujących wedrzeć się do naszej ojczyzny musimy zjednoczyć skłócone plemiona!"
 kon_consolidate_central_africa_tt: "Każda prowincja z grupy kultur §YKongo§! (z wyjątkiem kultur Sawabantu i Jukun) jest w posiadaniu państwa §Y[Root.GetName]§! lub stanowi część jego państwa poddanego."
 kon_greatest_power_kongo_title: "Hegemonia afrykańska"
 kon_greatest_power_kongo_desc: "Po zjednoczeniu regionu Konga otwiera się przed nami dostęp do Wielkich Jezior, Afryki Wschodniej i Południowej. Nadszedł czas, aby w Afryce Południowej powstało imperium, które połączy te regiony i ochroni je przed wścibskimi Europejczykami — a tym imperium będziemy my!"
 kon_greatest_power_kongo_tt: "Prowincje należące do grup kultur §YAfryki Południowej§!, §YWschodniego Bantu§! i §YWielkich Jezior§! nie będą otrzymywać kar za nieakceptowaną kulturę.\n\nModyfikator §YHegemon Afryki Południowej§! zostanie §Rusunięty§!, jeśli [Root.GetName] zmieni grupę kulturową."
 kon_reform_army_title: "Utwórz armię"
 kon_reform_army_desc: "Tradycyjnie [Root.GetName] nigdy nie posiadało regularnej armii. Co najwyżej mieliśmy Gwardię Królewską, która zapewniała bezpieczeństwo naszemu [Root.Monarch.GetTitle]. Poza tym zawsze musieliśmy polegać na nieprofesjonalnym wojsku chłopskim.\nChoć w przeszłości to wystarczało, nie jest to dobra strategia na przyszłość. Musimy utworzyć stałą armię."
 kon_obliterate_great_power_army_title: "Dowód siły"
 kon_obliterate_great_power_army_desc: "Na świecie wyrosły wielkie mocarstwa, które teraz decydują o losach Afryki — a więc i o naszych losach! Choć nie jesteśmy królestwem wojowników, będziemy zmuszeni udowodnić naszą siłę, pokonując w wojnie inne wielkie mocarstwo. W przeciwnym razie nigdy nie będziemy panami własnego losu."
 kon_obliterate_great_power_army_at: "Dowolne §Ywielkie mocarstwo§! ma wynik wojenny przeciwko państwu §Y[Root.GetName]§! niższy niż §Y50§! punktów."
 kon_obliterate_great_power_army_bt: "Dowolne państwo, którego całkowity rozwój (wraz z poddanymi) jest równy lub większy niż rozwój państwa [Root.GetName], ma wynik wojenny przeciwko państwu §Y[Root.GetName]§! niższy niż §Y50§! punktów."
 kon_obliterate_great_power_army_tt: "Państwo §Y[Root.GetName]§! jest jedynym pozostałym wielkim mocarstwem."
 kon_anzikus_copper_title: "Miedź Makoko"
 kon_anzikus_copper_desc: "Król Tyo, zwany Makoko, włada Anziku i jego bogatymi złożami miedzi. W przeszłości nie mieliśmy żadnych sporów z ludem Tyo, lecz ich miedź jest doskonałej jakości i potrzebujemy jej do celów cywilnych oraz wojskowych w naszym królestwie. Korzystne byłoby włączenie Tyo do państwa [Root.GetName]."
 kon_collect_cults_title: "Poznaj inne kulty"
 kon_collect_cults_desc: "Żadna religia nie jest tak różnorodna i złożona jak religie i kulty Afryki. Wszystkie plemiona i królestwa mają własne wyobrażenia o kosmologii naszego świata, a jednak te wierzenia rzadko stają się powodem wzajemnych waśni. Zamiast tego szukamy kontaktu z innymi plemionami, aby lepiej poznać ich wierzenia, a nawet wzbogacić o nie nasze własne."
 kon_fetishist_alliances_title: "Szamańskie sojusze"
 kon_fetishist_alliances_desc: "Nasza religia opiera się na wymianie kulturowej i dyplomacji plemiennej. Powinniśmy zgromadzić sojuszników i poddanych, aby lepiej podtrzymywać relacje między różnymi kultami."
 kon_fetishist_alliances_tt: "Państwo wyznaje §Yfetyszyzm§! oraz jest §Ypoddanym§! lub §Ysojusznikiem§! państwa §Y[Root.GetName]§! lub posiada co najmniej §Y150§! punktów opinii o państwie §Y[Root.GetName]§!."
 kon_repel_the_missionaries_title: "Odeprzyj chrześcijan"
 kon_repel_the_missionaries_desc: "Ludzie o bardzo jasnej karnacji pojawili się u wybrzeży naszego państwa i zaczęli głosić idee o 'człowieku, który został powieszony na krzyżu'. Na pierwszy rzut oka przypominali oni przyjaznych gawędziarzy, ale okazało się, że mają plan, by zniszczyć nasze dawne tradycje, a ludzie, który za nimi podążają, przysłuchują się ich historiom! Nie możemy pozwolić, by ci misjonarze kontynuowali swoją działalność!"
 kon_repel_the_missionaries_tt: "Państwo §Y[Root.GetName]§! przestanie być celem zagranicznych misjonarzy."
 kon_convert_west_africa_title: "Wyzwól kulty"
 kon_convert_west_africa_desc: "Afryka doświadczyła najazdów zarówno muzułmanów, jak i chrześcijan — jedni i drudzy próbowali wyplenić nasze tradycje i dziedzictwo, zastępując je własnymi ideami. To musi się skończyć! Wypędzimy tych fanatyków z powrotem do ich ojczyzn i odzyskamy kontynent dla naszych pobratymców!"
 kon_convert_west_africa_bt: "Wszystkie skolonizowane prowincje w regionach §YNigru§! i §YGwinei§! wyznają §Yfetyszyzm§!."
 kon_convert_west_africa_ct: "Państwo [Root.GetName] zdecydowało się §Yprzeciwstawić§! Europejczykom."
 kon_convert_the_country_title: "Przyjmij chrześcijaństwo"
 kon_convert_the_country_desc: "Zdecydowaliśmy się nawiązać relacje z Europejczykami, ale ci nie będą chcieli nas uznać za równorzędnych partnerów, dopóki nie przyjmiemy światła Pana. Musimy oficjalnie stać się katolikami i nawrócić zarówno króla, jak i lud."
 kon_churches_for_the_pope_title: "Kościoły dla naszego ludu"
 kon_churches_for_the_pope_desc: "Gdy oddawaliśmy cześć duchom natury i duchom przodków, nie mieliśmy żadnych świątyń. Co najwyżej posiadaliśmy kapliczki, którymi opiekował się szaman.\nNa szczęście te czasy minęły. Teraz naszym najważniejszym zadaniem jest budowa kościołów, aby każdy z naszych ludzi mógł nawiązać więź z Panem."
 kon_gain_cardinal_title: "Kardynał dla [Root.GetName]"
 kon_gain_cardinal_desc: "Nasz lud coraz lepiej poznaje pisma Biblii i nauki Chrystusa, a wpływy katolicyzmu w Afryce Środkowej rosną. Jeśli chcemy utrzymać ten trend, potrzebujemy oficjalnie mianowanego kardynała. Korzystne byłoby nawiązanie kontaktu z papieżem lub przynajmniej z jednym z katolickich państw posiadających kardynała."
 kon_gain_cardinal_at: "§YPaństwo Kościelne§! lub inne państwo posiadające kardynała jest §Yw sojuszu§! z państwem [Root.GetName] lub ma co najmniej §Y100§! opinii o państwie [Root.GetName]."
 kon_gain_cardinal_bt: "§YPaństwo Kościelne§! nie istnieje, a żadne państwo nie posiada kardynała."
 kon_spread_catholicism_title: "Głoś słowo Boże"
 kon_spread_catholicism_desc: "Europejczycy przynieśli nam choroby i nieuczciwy handel, ale także technologię i postęp. Najważniejszym darem, jaki ze sobą przywieźli, było jednak światło Pana. W interesie mieszkańców Afryki leży przyjęcie tego daru i dołączenie do Kościoła katolickiego."
 kon_build_navy_title: "Flota [Root.GetAdjective]"
 kon_build_navy_desc: "Świat się zmienia. Bladzi ludzie w niespotykanych zbrojach odwiedzają nasze wybrzeża i przynoszą nowe idee, podczas gdy inni cudzoziemcy handlują z nami swoimi towarami. Nie wiadomo jednak, czy ich zamiary są dla nas korzystne. Musimy zatem przygotować obronę ojczyzny przed najeźdźcami z morza i zbudować własne okręty wojenne."
 kon_find_europe_title: "Odnajdź Europejczyków"
 kon_find_europe_desc: "Ci ludzie z dalekich stron — Europejczycy — opowiadali nam rozmaite historie o swojej ojczyźnie i powodach, dla których potrzebują niewolników do pracy. Powinniśmy sami sprawdzić, ile prawdy kryje się w ich opowieściach, i zobaczyć Europę na własne oczy."
 kon_find_europe_tt: "Państwo [Root.GetName] odkryło co najmniej 1 prowincję w §YEuropie§!."
 kon_find_europe_ct: "Państwo [Root.GetName] nawiązało kontakt z §YEuropejczykami§!."
 kon_face_off_against_europeans_title: "Pokonaj zniewalających"
 kon_face_off_against_europeans_desc: "Europejscy handlarze niewolników stają się coraz bardziej bezczelni w pogoni za kolejnymi ludźmi. Nie rozróżniają już niższych warstw społecznych od mani i porywają każdego, kogo zechcą, na plantacje w swoich koloniach. Oficjalne wypędzenie ich przyniosło niewielki skutek, a docierają do nas nawet doniesienia o napadach na nasze wsie i porywaniu mieszkańców.\nNie możemy dłużej tego tolerować! Musimy przeciwstawić się Europejczykom i pokonać ich w bitwie, jeśli chcemy położyć kres tej zuchwałości!"
 kon_face_off_against_europeans_bt: "Wymagania zostaną ujawnione po wcześniejszym ukończeniu misji „§YOdnajdź Europejczyków§!”."
 kon_face_off_against_europeans_ct: "§Y[Root.GetName]§! otrzymuje permanentne roszczenia do każdej prowincji na podkontynentach §YPółnocnej§! i §YPołudniowej Afryki§!, która jest w posiadaniu państwa §Yeuropejskiego§!."
 kon_banish_the_westerners_from_africa_title: "Wypędź Europejczyków"
 kon_banish_the_westerners_from_africa_desc: "Nigdy nie będziemy bezpieczni, dopóki Europejczycy będą mieli jakiekolwiek wpływy w Afryce Południowej. Musimy wypędzić to zagrożenie z naszego regionu i odesłać ich z powrotem na zimną północ!"
 kon_banish_the_westerners_from_africa_tt: "Żadna prowincja na podkontynencie §YPołudniowej Afryki§! ani w regionach §YNigru§! i §YGwinei§! nie jest w posiadaniu państwa, którego stolica znajduje się w §YEuropie§!, chyba że jest to europejski poddany państwa §Y[Root.GetName]§!."
 kon_protector_of_africa_title: "Obrońca Afryki"
 kon_protector_of_africa_desc: "Nasze państwo to teraz coś więcej niż [Root.GovernmentName] w Afryce Środkowej. Rozwinęliśmy się na tyle, by przyjąć status obrońcy Afryki, strzegącego jej mieszkańców przed zapędami Europejczyków!"
 kon_become_proper_monarchy_title: "Prawdziwe królestwo"
 kon_become_proper_monarchy_desc: "W naszym społeczeństwie nasz [Root.Monarch.GetTitle] już teraz jest prawdziwym monarchą. W oczach tych bladych ludzi jesteśmy jednak „barbarzyńcami” — członkami plemion. Oczywiście nie mają oni pojęcia o naszej kulturze, ale dopóki nie będą traktować nas jak równych sobie, nie zdołamy poznać ich technologii ani idei, które ze sobą przynoszą."
 kon_accelerate_slave_trade_title: "Handel niewolnikami"
 kon_accelerate_slave_trade_desc: "Nasze państwo wymienia z Europejczykami wiele towarów — od kości słoniowej po miedź. Jeden z nich zdobył wśród Europejczyków szczególną popularność: niewolnicy. Sprzedawani im ludzie należą do niższych warstw naszego [Root.GovernmentName] i albo popadli w niewyobrażalne długi, albo popełnili przestępstwa.\nPopyt Europejczyków na niewolników gwałtownie wzrósł, a organizacja tego handlu stała się trudna. Powinniśmy rozbudować ośrodki handlu niewolnikami i poprawić lokalną infrastrukturę, aby usprawnić zarządzanie tym procederem."
 kon_study_european_technology_title: "Modernizacja [Root.GetAdjective]"
 kon_study_european_technology_desc: "Osiągnięcia Europejczyków budzą podziw zarówno naszego ludu, jak i mani. Zawarliśmy z nimi układ i rozpoczęliśmy handel niewolnikami, aby poznać ich technologię i rozwinąć naszą cywilizację. Nadszedł czas, aby zmodernizować nasz [Root.GovernmentName]!"
 kon_abolish_slavery_title: "Wypędź handlarzy niewolników"
 kon_abolish_slavery_desc: "Handel niewolnikami spełnił już swoje zadanie. Otworzył nam drogę do modernizacji państwa. Teraz jednak jego negatywne skutki przeważają nad korzyściami: Europejczycy stają się coraz bardziej bezczelni w swoich żądaniach, organizują nawet łapanki i pojmują naszych ludzi bez względu na ich status społeczny. Musimy znieść niewolnictwo i wypędzić Europejczyków z Afryki, jeśli chcemy położyć kres ich zuchwałości!"
 kon_abolish_slavery_tt: "Żadne §Yeuropejskie§! państwo nie posiada prowincji w §YAfryce§!, która wytwarza §Yniewolników§!."
 kon_abolish_slavery_bt: "Wymagania ukończenia misji zostaną ujawnione po ukończeniu misji '§YModernizacja [Root.GetAdjective]§!'."
 kon_amongst_the_great_powers_title: "Pośród mocarstw"
 kon_amongst_the_great_powers_desc: "Nie jesteśmy już plemieniem - staliśmy się jednym z silniejszych państw na świecie! Udało się nam zmodernizować państwo, wyplenić kolonistów i zdławić barbarzyński proceder niewolnictwa!"
 zim_decline_of_zimbabwe_title: "Los Zimbabwe"
 zim_decline_of_zimbabwe_desc: "Zimbabwe jest stolicą dawnego wielkiego imperium Wielkiego Zimbabwe, a obecnie stanowi centrum naszej władzy państwowej. Przyszłość tego miasta jest jednak niepewna: niedobór surowców zmusił mieszkańców do opuszczenia go i osiedlenia się w różnych prowincjach naszego państwa.\nW takich czasach niezwykle ważne jest, aby nasz [Root.GovernmentName] zachował jak największą stabilność."
 zim_decline_of_zimbabwe_tt: "Wydarzenie „§YUpadek Zimbabwe§!” zostało uruchomione."
 zim_restore_the_city_title: "Odbuduj Zimbabwe"
 zim_restore_the_city_desc: "Wielkie miasto Zimbabwe zostało wzniesione 200 lat temu i odgrywa ważną rolę w naszej historii. Znajdują się w nim liczne wspaniałe kamienne domy naszego ludu, kryje ono wiele opowieści o naszej przeszłości, a cudzoziemcy, którzy je odwiedzili, opisywali je nawet w świętych księgach jako złote miasto.\nDziś niegdyś wspaniałe miasto jest jedynie opuszczoną ruiną — miejscem, w którym nie chcieliby pozostać nawet duchy naszych przodków. Nie możemy pozwolić, by to ważne miasto popadło w ruinę!"
 zim_restore_old_empire_title: "Przyćmij Wielkie Zimbabwe"
 zim_restore_old_empire_desc: "Zanim nastały czasy Mutapy, Imperium Wielkiego Zimbabwe dominowało w Afryce Południowej pod względem kultury, gospodarki i siły militarnej. Z czasem jednak rozpadło się, a nasze państwo powstało, by zająć jego miejsce. Po odbudowie dawnego miasta naszym obowiązkiem jest dorównać potędze tego imperium, a nawet ją przewyższyć."
 zim_european_contact_title: "Kontakt z Europejczykami"
 zim_european_contact_desc: "Nasze państwo od zawsze przyciągało cudzoziemców z odległych krain. Europejczycy, jeszcze bardziej obcy niż muzułmanie, nie są wyjątkiem i w końcu również dotarli do naszych ziem. Nasze kontakty z nimi były jednak co najwyżej powierzchowne. Musimy znaleźć lepszy sposób utrzymywania stosunków z Europejczykami, aby móc z nimi handlować i czerpać wiedzę z ich doświadczeń."
 zim_european_contact_tt: "Dowolne państwo §Ychrześcijańskie i europejskie§! ma opinię o państwie [Root.GetName] wynoszącą co najmniej §Y75§!, jest jego §Ypoddanym§! lub §Yzwierzchnikiem§!, gwarantuje niepodległość państwa §Y[Root.GetName]§! albo jest jego §Ysojusznikiem§!."
 zim_develop_gold_title: "Legenda Ofiru"
 zim_develop_gold_desc: "Muzułmanie z północy i podróżnicy z zachodu twierdzą, że jesteśmy słynną krainą Ofiru, miejscem znanym z ich świętych pism, gdzie miasta zbudowane są ze złota. Powinniśmy dorównać tej legendzie i zwiększyć wydobycie złota. Jeśli nie dla podniesienia naszego prestiżu, to przynajmniej dla dobra gospodarki."
 zim_conquer_coast_title: "Podbij Sofalę"
 zim_conquer_coast_desc: "Portowe miasto Sofala jest ważnym ośrodkiem handlowym, przez który od stuleci nasze towary trafiają do Azji. Nigdy jednak nie należało do nas, a jeśli chcemy odbudować więzi z Azją, musimy podbić to ważne miasto."
 zim_build_navy_title: "Zbuduj flotę handlową"
 zim_build_navy_desc: "Imperium Zimbabwe utrzymywało niegdyś kwitnące stosunki handlowe z ludami dalekiego wschodu. Był to jednak handel jednostronny, ponieważ to kupcy musieli przybywać do nas.\nTaka strategia handlowa nie jest już wystarczająca. Sofala pokazała nam, że handel może rozkwitać tylko wtedy, gdy panuje się nad morzami. Musimy więc dostosować się do nowych okoliczności i zbudować własną flotę handlową."
 zim_build_navy_tt: "§Y[Root.GetName]§! otrzymuje permanentne roszczenia do każdej nadbrzeżnej prowincji w regionie §YRogu Afryki§!."
 zim_dominate_upstream_trade_title: "Bogactwo Adenu"
 zim_dominate_upstream_trade_desc: "Choć niegdyś prowadziliśmy handel z ludami dalekiego wschodu, przywrócenie tych dawnych stosunków handlowych jest bardzo mało prawdopodobne. Nie mamy jednak powodów do obaw. Bogactwa handlu wschodnioazjatyckiego przepływają przez Indie, by ostatecznie dotrzeć do Zatoki Ormuz i Zatoki Adeńskiej. Ormuz może być poza naszym zasięgiem, ale Zatoka Adeńska jest osiągalna. Wystarczy, że… wyzwolimy wybrzeże Rogu Afryki."
 zim_dominate_upstream_trade_at: "Jest prowincją §Ynabrzeżną§! w regionie §YRogu Afryki§!."
 zim_dominate_upstream_trade_ct: "Otrzymuje dochód z handlu równy §G2 latom§!."
 zim_dominate_upstream_trade_tt: "Wpływy handlowe Mutapy"
 zim_zanzibar_greatest_market_title: "Zmonopolizuj Afrykę Wschodnią"
 zim_zanzibar_greatest_market_desc: "Handel kwitnie, a nasz skarbiec się zapełnia, lecz to wciąż za mało. Bogactwa z przeszłości nadal rywalizują z naszym obecnym majątkiem. Musimy to zmienić! Powinniśmy kontrolować przepływ dukatów na wybrzeżu Afryki Wschodniej, zmonopolizować ważne ośrodki handlowe i skierować na nasze rynki jak najwięcej egzotycznych towarów z Indii i Azji."
 ZIM_TRADE_DOMINANCE: "Dominacja handlowa Mutapy"
 zim_zanzibar_greatest_market_tt: "Dzięki skutecznej kontroli przepływu bogactw państwo [Root.GetName] odzyskało swoją pozycję na rynkach Dalekiego Wschodu.\nPaństwo [Root.GetName] uzyskuje §Ydominację handlową Mutapy§! (siła handlu: §G15,0§!) w węzłach handlowych §YZatoka Adeńska§!, §YZanzibar§!, §YPrzylądek Dobrej Nadziei§!, §YGudźarat§!, §YKormandel§!, §YMalakka§!, §YKanton§!, §YHangzhou§! i §YPekin§! do końca gry."
 zim_zanzibar_greatest_market_at: "Węzeł handlowy §YPrzylądek Dobrej Nadziei§!, §YZanzibar§! lub §YZatoka Adeńska§! jest najcenniejszym węzłem handlowym na świecie, a §Y[Root.GetName]§! ma w nim największą siłę handlu."
 zim_zanzibar_greatest_market_bt: "§Y[Root.GetName]§! ma największą siłę handlu lub co najmniej §Y10%§! siły handlu w jednym z węzłów: §YGudźarat§!, §YKormandel§! lub §YMalakka§!."
 zim_cults_title: "Wiara w Mwari"
 zim_cults_desc: "Choć Mwenemutapa jest boskim władcą naszej religii i państwa, [Root.Monarch.GetSheHe] nadal pozostaje posłuszny wszechmocnemu Mwari — istocie władającej duchami naszych przodków, bóstwu stworzenia, szczęścia i wielu innych aspektów życia. Musimy oddawać cześć jego imieniu, wznosząc świątynie."
 zim_council_title: "Zrównoważ wpływy rady"
 zim_council_desc: "W naszym państwie działa rada doradzająca [Root.Monarch.GetTitle] w podejmowaniu decyzji. Jej członkowie, zwani ministrami, mają znaczną władzę na lokalnych obszarach naszego [Root.GovernmentName], między innymi w zakresie wydawania wyroków. Są również ważnymi przedstawicielami dawnych plemion, które zdecydowały się do nas przyłączyć zamiast walczyć. Powinniśmy zadbać o ich zadowolenie na dworze królewskim."
 zim_reform_army_title: "Zreformuj wojsko"
 zim_reform_army_desc: "Według ustnych przekazów naszego ludu nasze państwo założył pierwszy Mwene, książę-wojownik Nyatsimba Mutota. To on położył podwaliny pod potężną armię.\nNie możemy jednak opierać się wyłącznie na dokonaniach jednego Mwene z przeszłości. Powinniśmy dalej doskonalić nasze wojska, aby zapewnić bezpieczeństwo [Root.GovernmentName]."
 zim_conquer_north_title: "Żelazo i tkaniny"
 zim_conquer_north_desc: "Choć złoto jest niezwykle cennym metalem, a kość słoniowa bardzo poszukiwanym towarem, żadne z nich nie nadaje się do wykuwania broni ani szycia charakterystycznych mundurów żołnierskich. Prowincje Kalonga i Lundu posiadają surowce, których szukamy. Powinniśmy je zdobyć i wykorzystać ich zasoby do realizacji naszych celów."
 zim_discover_the_cape_title: "Odkryj południe"
 zim_discover_the_cape_desc: "Zawsze tajemnicą pozostawało to, co dokładnie znajduje się na południe od naszego państwa. Powinniśmy zorganizować wyprawę na południe i zbadać równiny rozciągające się w tamtym kierunku."
 zim_annex_vassals_title: "Rozstrzygnij los Torwa"
 zim_annex_vassals_desc: "Dynastia Torwa jest pozostałością dawnego imperium Zimbabwe i stała się naszym poddanym po tym, jak zastąpiliśmy poprzednie państwo. Choć jakość ich wojsk nie ma sobie równych, ich lojalność wobec [Root.Monarch.GetTitle] bywa wątpliwa. Nadszedł czas, aby właściwie zintegrować ich z naszym państwem."
 zim_annex_vassals_ct: "§YWojownicy Butua§! staną się unikalną jednostką najemną dostępną wyłącznie dla państwa [Root.GetName]."
 zim_strong_rulership_title: "Silna władza monarsza"
 zim_strong_rulership_desc: "Nasz [Root.Monarch.GetTitle] uosabia nasze państwo i religię. [Root.Monarch.GetSheHeCap] jest centrum naszego społeczeństwa i dlatego zasługuje na wszystko, co najlepsze."
 zim_dominate_south_africa_title: "Zdominuj Afrykę Południową"
 zim_dominate_south_africa_desc: "Równiny na południe od naszego państwa nie podlegają niczyjej kontroli, a zatem słusznie nam się należą. Powinniśmy zadbać o to, by nasze roszczenia stały się rzeczywistością."
 zim_amongst_the_great_powers_title: "Mocarstwo Afryki"
 zim_amongst_the_great_powers_desc: "Świat staje się coraz mniejszy, gdy cudzoziemcy z północy próbują rozszerzać swoje wpływy na całym globie. Musimy stać się jednym z wielkich graczy na arenie międzynarodowej, aby nasze państwo nie popadło w zapomnienie i nie stało się kolejnym celem Europejczyków."
 zim_amongst_the_great_powers_tt: "Ta projekcja siły jest §Ypermanentna§!.\n "
 zim_modernize_state_title: "Zmodernizuj państwo"
 zim_modernize_state_desc: "Od chwili założenia naszego państwa lud czcił Mwenemutapę jako wcielenie Mwari, bóstwa Zimbabwe. Wraz z przybyciem obcych z północy w umysłach mieszkańców zagościł nowy obraz świata. Według jednego z nich Mwenemutapa miałby być poddanym naszego boga. Według innego zaś to sam lud miałby faktycznie rządzić państwem [Root.GetName].\nSame rozważania nie wystarczą jednak do modernizacji państwa. Potrzebujemy technologii i wiedzy, aby zmienić podstawy naszego rządu dla dobra mieszkańców."
 aju_annex_mogadishu_title: "Przyłącz Mogadiszu"
 aju_annex_mogadishu_desc: "Mogadiszu jest perłą Rogu Afryki. To wspaniałe centrum handlowe przyciąga kupców z całego świata arabskiego i Indii. Nadszedł czas, aby włączyć to piękne miasto do naszego państwa i wykorzystać jego wpływy dla własnych korzyści."
 aju_gold_minting_title: "Zdobądź dostęp do złota"
 aju_gold_minting_desc: "Mogadiszu biło własne monety, co pomogło scentralizować jego hegemonię handlową. W Arabii i Indiach są już w obiegu monety, lecz jest ich zbyt mało, by wywierały znaczący wpływ. Powinniśmy uzyskać dostęp do dobrego źródła złota i bić więcej monet, aby móc oddziaływać na gospodarki tych ważnych regionów."
 aju_gold_minting_ct: "Jeśli misja zostanie ukończona, gdy państwo [Root.GetName] posiada co najmniej §Y1§! prowincję produkującą złoto lub gdy taka prowincja należy do jego poddanego, państwo [Root.GetName] otrzyma dochód ze złota z tej prowincji równy §G4 latom§! produkcji.\nJeśli państwo [Root.GetName] ukończy tę misję drogą dyplomatyczną, sojusznik zapewniający dostęp do złota otrzyma wydarzenie „§YUkład w sprawie złota z państwem [Root.GetName]§!”."
 aju_the_mamluk_soldiers_tt: "Państwo [Root.GetName] zatrudniło kompanię najemników §YMameluccy żołnierze§!."
 aju_invent_istunka_tt: "W prowincji §Y[2776.GetName]§! stacjonuje co najmniej §Y20§! pułków piechoty."
 aju_indian_trade_ct: "Każde państwo posiadające co najmniej §Y5%§! siły handlu w dowolnym indyjskim węźle handlowym otrzymuje wydarzenie „§YMonety państwa [Root.GetName]§!”."
 AJU_INDIAN_MERCHANTS: "Ajurańscy kupcy w Indiach"
 AJU_JAVA_MERCHANTS: "Ajurańscy kupcy na Jawie"
 aju_invent_istunka_ct: "Prowincja §Y[2776.GetName]§! otrzymuje do końca gry modyfikator prowincji „§YOjczyzna Istunki§!”, zapewniający następujące efekty:\nNiepokoje na świecie: §G-1,00§!\nLokalny koszt rozwoju: §G-5,0%§!"
 aju_oromo_invasion_tt: "Wydarzenie „§YOromowie§!” wystąpiło §Y10 lat§! temu."
 aju_unite_the_clans_tt: "Każda prowincja somalijska otrzymuje modyfikator prowincji „§YZjednoczone klany§!” na §Y25 lat§!, zapewniający następujące efekty:\nLokalne niepokoje: §G-4,00§!\nLokalny modyfikator siły żywej: §G+10,0%§!\nLokalny modyfikator podatków: §G+10,0%§!\nLokalna wydajność produkcji: §G+10,0%§!"
 aju_indian_trade_title: "Handel z Indiami"
 aju_indian_trade_desc: "Indie są pełne bogactw, których nasi sąsiedzi jeszcze nie wykorzystali. Jeśli uda nam się ustanowić tam swoją obecność handlową, możemy osiągnąć niewyobrażalne korzyści."
 aju_chinese_trade_company_title: "Handel ze Smokiem"
 aju_chinese_trade_company_desc: "Po rynku indyjskim kolejnym logicznym krokiem jest wejście na rynek chiński. Stamtąd możemy pozyskiwać jeszcze bardziej egzotyczne i dochodowe towary oraz bogactwa. Musimy również umocnić tam swoją pozycję."
 aju_castle_builders_title: "Ufortyfikuj [Root.Capital.GetName]"
 aju_castle_builders_desc: "Nasza stolica jest centrum naszej potęgi, a zarazem najważniejszą częścią państwa. Musimy ją ufortyfikować, aby wzmocnić obronę i zagwarantować, że nigdy nie wpadnie w ręce wroga."
 aju_hydraulic_expertise_title: "Mistrzostwo w gospodarce wodnej"
 aju_hydraulic_expertise_desc: "Żywność i woda są najważniejsze dla przetrwania ludności, a ta z kolei stanowi podstawę każdego państwa. Musimy rozbudować i udoskonalić infrastrukturę irygacyjną, aby móc kontrolować i zwiększać dostępność obu tych zasobów."
 aju_maldives_dynasty_title: "Odzyskaj Malediwy"
 aju_maldives_dynasty_desc: "Choć niegdyś ustanowiliśmy swoją obecność na Malediwach, utraciliśmy nad nimi kontrolę, gdy zdradzieccy członkowie naszej rodziny odłączyli się od nas. Nadszedł czas, aby odzyskać to, co nasze."
 aju_invent_istunka_title: "Rozwiń Istunkę"
 aju_invent_istunka_desc: "Nasi wojownicy zawsze byli dumni ze swoich umiejętności i my również powinniśmy być z nich dumni. Zorganizowanie święta, podczas którego będą mogli zaprezentować swój kunszt bojowy, napełni dumą cały nasz lud."
 aju_merchants_in_dai_viet_title: "Handel z Wietnamem"
 aju_merchants_in_dai_viet_desc: "Po Indiach naturalnym krokiem jest rozszerzenie naszej działalności na Wietnam i Indochiny. Nie tylko uzyskamy dostęp do jeszcze większych bogactw, ale także będziemy mogli kontrolować handel napływający z Chin i dalszych krain."
 aju_markets_of_ajuuran_title: "Rozbuduj targowiska"
 aju_markets_of_ajuuran_desc: "Nasza stolica od zawsze była centrum handlu. Powinniśmy rozbudować targowiska, aby jeszcze bardziej pobudzić wymianę handlową i zwiększyć napływające do miasta bogactwo."
 aju_sofaala_claims_title: "Odzyskaj [1186.GetName]"
 aju_sofaala_claims_desc: "Sofala zapewniała nam dostęp do rynków południowych, dopóki nie została nam odebrana. Powinniśmy ją odzyskać, aby znów móc swobodnie rozszerzać handel na południe."
 aju_trade_on_java_title: "Handluj z Jawą"
 aju_trade_on_java_desc: "Po Indiach powinniśmy rozszerzyć naszą działalność na rynki Jawy. Pozwoli nam to kontrolować handel napływający z Wysp Korzennych, a korzyści będą niezmierzone."
 aju_protect_trade_aden_title: "Zdominuj Zatokę Adeńską"
 aju_protect_trade_aden_desc: "Nasze rynki od zawsze miały znaczące wpływy, lecz stabilność i dalszą ekspansję zapewni nam dopiero całkowita dominacja nad handlem w naszym regionie, zwłaszcza tym morskim."
 aju_expand_navy_title: "Rozbuduj flotę"
 aju_expand_navy_desc: "Sukces możemy osiągnąć tylko dzięki całkowitej dominacji na morzu. Musimy zbudować więcej okrętów, aby żadne inne państwo nie było w stanie przeciwstawić się naszej flocie."
 aju_ally_the_ottomans_title: "Sojusz z Osmanami"
 aju_ally_the_ottomans_desc: "Osmanowie zdołali już umocnić swoją pozycję w Anatolii. Powinniśmy nawiązać z nimi kontakt i zaproponować sojusz — z tej przyjaźni możemy wiele zyskać i się nauczyć."
 aju_buy_modernization_title: "Zmodernizuj armię"
 aju_buy_modernization_desc: "Armia osmańska to siła, z którą należy się liczyć. Powinniśmy spróbować ją naśladować: możemy zatrudnić ich instruktorów wojskowych i zakupić ich wyposażenie, aby również dysponować potężną, nowoczesną armią."
 aju_oromo_invasion_title: "Pokonaj Oromów"
 aju_oromo_invasion_desc: "Oromowie od zawsze są dla nas solą w oku. Powinniśmy raz na zawsze się z nimi rozprawić."
 aju_the_mamluk_soldiers_title: "Zwerbuj Mameluków"
 aju_the_mamluk_soldiers_desc: "Mamelucy należą do najgroźniejszych wojowników na świecie. Musimy zwerbować część z nich, aby zwiększyć siłę naszej armii. Dzięki temu łatwiej podbijemy naszych wrogów."
 aju_the_tip_of_the_horn_title: "Podbij Róg Afryki"
 aju_the_tip_of_the_horn_desc: "Jeśli mamy przetrwać w otoczeniu wrogów, pierwszym krokiem powinno być przejęcie kontroli nad Rogiem Afryki. Tylko w ten sposób zbudujemy wystarczająco silną bazę, z której będziemy mogli później rozszerzać nasze wpływy."
 aju_unite_the_clans_title: "Zjednocz klany"
 aju_unite_the_clans_desc: "Wokół nas żyje wiele niezależnych klanów somalijskich, które mogą pokrzyżować nasze ambicje, jeśli nie podporządkujemy ich naszej władzy. Dopiero po zjednoczeniu wszystkich klanów będziemy mogli myśleć o dalszej ekspansji."
 aju_liberate_sheik_hussein_title: "Wyzwól Szejcha Husajna"
 aju_liberate_sheik_hussein_desc: "Szejch Husajn zbyt długo pozostaje w rękach koptyjskich niewiernych. Nadszedł czas, aby odzyskać go dla chwały islamu."
 aju_consolidate_the_horn_title: "Skonsoliduj władzę w Rogu Afryki"
 aju_consolidate_the_horn_desc: "Choć nasza obecność w Rogu Afryki wyraźnie wzrosła, wciąż nie kontrolujemy jego części. Powinniśmy wyeliminować wszelki opór, aby móc jednoznacznie ogłosić panowanie nad całym regionem."
 zan_annex_sofala_title: "Przyłącz [SFA.GetName]"
 zan_annex_sofala_desc: "[SFA.GetName] od dawna pozostaje pod naszymi wpływami, lecz nadszedł czas, aby przejąć nad nim bezpośrednią kontrolę i włączyć go do naszego terytorium."
 zan_mutapan_gold_title: "Złoto Zimbabwe"
 zan_mutapan_gold_desc: "Ziemie Zimbabwe są bogate w złoto. Musimy je podbić, aby zdobyć te bogactwa. Dopiero wtedy będziemy dysponować wystarczającą siłą gospodarczą, by kontynuować ekspansję."
 zan_discover_the_cape_title: "Niezbadane południe"
 zan_discover_the_cape_desc: "Południowe ziemie od zawsze spowija tajemnica. Kto wie, jakie niewyobrażalne bogactwa mogą się tam kryć? Musimy zbadać te obszary, jeśli chcemy czerpać z nich korzyści."
 zan_colonize_the_cape_title: "Skolonizuj Przylądek"
 zan_colonize_the_cape_desc: "Południowy kraniec kontynentu ma kluczowe znaczenie, jeśli chcemy kontrolować przepływ handlu na zachód. Musimy ustanowić tam stałą obecność, która pozwoli nam sprawować kontrolę nad całym handlem."
 zan_settle_trade_posts_title: "Faktorie handlowe Afryki"
 zan_settle_trade_posts_desc: "Na północy i zachodzie znajduje się wiele miejsc, przez które przepływa znaczny handel. Musimy przejąć te obszary i samodzielnie kontrolować wymianę handlową."
 zan_establish_contact_with_persia_title: "Odnów kontakty z Persją"
 zan_establish_contact_with_persia_desc: "Wiadomo, że nasz przodek Ali ibn al-Hasan Szirazi był synem perskiego emira Szirazu. Musimy odnowić więzi z naszą ojczyzną przodków."
 zan_build_workshops_title: "Zwiększ produkcję kości słoniowej"
 zan_build_workshops_desc: "Kość słoniowa od zawsze stanowi jedno z naszych głównych źródeł dochodu. Powinniśmy dołożyć wszelkich starań, aby zwiększyć jej produkcję."
 zan_expand_the_capital_title: "Rozbuduj [1196.GetName]"
 zan_expand_the_capital_desc: "Nasza stolica jest symbolem naszego narodu i miejscem, w którym koncentruje się większość naszego bogactwa. Powinniśmy ją ulepszyć i dalej rozwijać, aby stała się najbogatszym miastem świata."
 zan_build_manufactories_title: "Zbuduj manufaktury"
 zan_build_manufactories_desc: "Nie ma wątpliwości, że im więcej produkujemy, tym większe bogactwo możemy zgromadzić. Dlatego powinniśmy rozbudować manufaktury, aby zwiększyć produkcję."
 zan_trade_fleet_title: "Utwórz flotę handlową"
 zan_trade_fleet_desc: "Przez nasze wody nieustannie przepływają statki handlowe. Jeśli chcemy czerpać z tego korzyści, musimy zbudować flotę, która pozwoli nam kontrolować ten ruch."
 zan_conquer_the_coast_title: "Podbij linię brzegową"
 zan_conquer_the_coast_desc: "Mając do dyspozycji flotę, musimy już tylko umocnić swoją obecność na całym wybrzeżu, aby kontrolować jego bogactwa. Powinniśmy podbić wszystkie obszary, które mogą nam w tym przeszkodzić."
 zan_conquer_mogadishu_title: "Podbij Mogadiszu"
 zan_conquer_mogadishu_desc: "Mieszkańcy Mogadiszu od zawsze utrudniają realizację naszych ambicji handlowych. Musimy raz na zawsze położyć temu kres, podbijając ich miasto."
 zan_dominate_gulf_of_aden_title: "Zatoka Adeńska"
 zan_dominate_gulf_of_aden_desc: "Zatoka Adeńska od zawsze tętniła handlem. Musimy przejąć nad nią pełną kontrolę i wykorzystać jej potencjał dla własnych korzyści."
 zan_dominate_gulf_of_aden_ct: "§Y[Root.GetName]§! otrzymuje roszczenia do każdego nadbrzeżnego centrum handlu w węzłach handlowych §YGudźarat§! i §YKormandel§!."
 zan_centralize_trade_title: "Zdobądź hegemonię handlową"
 zan_centralize_trade_desc: "Handel przepływający przez nasze państwo, a także ten kierujący się na zachód wzdłuż całego wybrzeża, może być ogromnym źródłem bogactwa, jeśli zdołamy go kontrolować. Powinniśmy całkowicie zdominować tę wymianę i jednocześnie skierować ku sobie cały handel z okolicznych regionów, aby czerpać z niego jak największe korzyści."
 zan_transport_fleet_title: "Przygotuj inwazję"
 zan_transport_fleet_desc: "Wyspa Madagaskar leży tuż u naszych wybrzeży i jest zbyt kuszącym łupem, by ją zignorować. Na dodatek zamieszkują ją niewierni. Musimy zebrać armię i flotę oraz przygotować się do jej zdobycia."
 zan_conquer_madagascar_title: "Najedź Madagaskar"
 zan_conquer_madagascar_desc: "Nasza armia i flota są gotowe. Nadszedł czas, aby uderzyć, oczyścić wyspę z niewiernych, przejąć nad nią kontrolę i wykorzystać jej bogactwa."
 zan_dominate_the_malacca_trade_title: "Handel malakkański"
 zan_dominate_the_malacca_trade_desc: "Kupcy nieustannie opowiadają nam dziwne historie o tajemniczym Wschodzie i Wyspach Korzennych. Musimy rozszerzyć nasze wpływy na te obszary i samodzielnie przejąć kontrolę nad tamtejszym handlem."
 zan_trade_with_china_title: "Handluj z Chinami"
 zan_trade_with_china_desc: "Daleki Wschód jest źródłem niewyobrażalnych, legendarnych bogactw. Jeśli chcemy mieć w nich udział, musimy zdobyć tam silną pozycję handlową."
 zan_trade_of_the_east_title: "Zdobądź dostęp do rynku indyjskiego"
 zan_trade_of_the_east_desc: "Przez Indie od zawsze przepływał ogromny strumień handlu. Nie możemy pozostać poza tym źródłem bogactwa — musimy również ustanowić swoją obecność na indyjskich rynkach."
 zan_explore_the_malacca_trade_title: "Zbadaj Ocean Indyjski"
 zan_explore_the_malacca_trade_desc: "Indie okazały się wspaniałym źródłem bogactw. Kto wie, jakie inne krainy kryją się za oceanem i czekają na odkrycie oraz wykorzystanie? Powinniśmy podjąć wysiłek zbadania oceanu w poszukiwaniu kolejnych źródeł jeszcze większego bogactwa."
 zan_dominate_moluccas_title: "Handel molukański"
 zan_dominate_moluccas_desc: "Skoro kontrolujemy już handel przepływający przez Cieśninę Malakka, nadszedł czas, aby pójść jeszcze dalej i dotrzeć na same Wyspy Korzenne. Tylko w ten sposób zdołamy naprawdę kontrolować cały szlak handlowy i płynące z niego bogactwa."
 zan_colonize_australia_title: "Skolonizuj Australię"
 zan_colonize_australia_desc: "Rozszerzyliśmy nasze wpływy na odległości i ziemie, o których wcześniej nawet nie marzyliśmy. Musimy jednak posunąć się jeszcze dalej, ku tajemniczym Ziemiom Południowym, o których słyszeliśmy i które wyraźnie znajdują się w naszym zasięgu."
 aju_merchants_in_india: "Ajurańska obecność w Indiach"
 desc_aju_merchants_in_india: "Nasi kupcy prowadzą działalność handlową w Indiach i wymieniają towary z tamtejszą ludnością, przynosząc korzyści naszemu państwu."
 aju_exotic_zoo: "Egzotyczne zoo"
 desc_aju_exotic_zoo: "Kupcy z Afryki przywieźli cesarzowi niezwykłe i osobliwe stworzenia. Aby zapewnić im schronienie, mieszkańcy zbudowali ogród zoologiczny tuż obok Zakazanego Miasta."
 ajuuran_place_of_istunka: "Ojczyzna Istunki"
 desc_ajuuran_place_of_istunka: "Ta prowincja jest ojczyzną święta noworocznego zwanego Istunką, obchodzonego przez wszystkich mieszkańców Ajuranu."
 aju_trade_influence: "Rozbudowane rynki"
 desc_aju_trade_influence: "Dzięki budowie kilku nowych targowisk handel w naszym państwie kwitnie jak nigdy dotąd."
 aju_ajuuran_sofala: "Administracja ajurańska"
 desc_aju_ajuuran_sofala: "Sofala była niegdyś kolonią Ajuranu. Gdy Ajurańczycy powrócili, by odzyskać tę prowincję, wielu Suahili zostało wypędzonych i zastąpionych lojalnymi członkami klanów Ajuranu."
 aju_fleet_investment: "Inwestycje we flotę handlową"
 desc_aju_fleet_investment: "Nasza dominacja nad handlem w Zatoce Adeńskiej zapewnia nam środki na inwestycje w budowę wielkiej floty handlowej."
 aju_united_somali_clans: "Zjednoczone klany"
 desc_aju_united_somali_clans: "Somalijczycy zamieszkujący tę prowincję zostali zjednoczeni przez swojego zwierzchnika."
 aju_mogadishu_currency: "Inwestycje ajurańskie"
 desc_aju_mogadishu_currency: "Postanowiliśmy zezwolić ajurańskim kupcom na pozostanie w naszym państwie i inwestowanie w naszą produkcję."
 zan_establish_contact_with_persia_at: "W prowincji §Y[2218.GetName]§! stacjonuje co najmniej §Y1§! pułk dowolnego rodzaju."
 zan_establish_contact_with_persia_bt: "Właściciel prowincji §Y[2218.GetName]§! jest sojusznikiem lub poddanym państwa §Y[Root.GetName]§!."
 zan_build_manufactories_ct: "Do §Y6§! posiadanych prowincji z §Ymanufakturą§! otrzymuje §G2§! punkty produkcji."
 zan_explore_the_malacca_trade_tt: "§Y[Root.GetName]§! otrzymuje permanentne roszczenia do wysp §YSumatra§! i §YJawa§!."
 zan_conquer_madagascar_tt: "Każda prowincja na §YMadagaskarze§! należąca do państwa [Root.GetName] lub jego poddanych otrzymuje modyfikator prowincji „§YSuahilijska dominacja§!” na §Y25 lat§!, zapewniający następujące efekty:\nLokalna siła misjonarzy: §G+2,0%§!\nLokalna produkcja dóbr: §G+0,25§!"
 zan_colonize_the_cape_ct: "§Y[Root.GetName]§! otrzymuje permanentne roszczenia do każdej prowincji posiadającej §Ycentrum handlu§! w regionach §YKonga§! i §YAfryki Środkowej§!."
 zan_settle_trade_posts_ct: "Otrzymuje dochód z handlu równy §G4 latom§!."
 ZAN_DOMINATION: "Dominacja kupców Kilwy"
 eth_legacy_of_alexandria: "Dziedzictwo Aleksandrii"
 desc_eth_legacy_of_alexandria: "Choć Biblioteka Aleksandryjska spłonęła wiele wieków temu, w mieście nadal znajdują się niezwykle ważne biblioteki, skrywające bezcenną wiedzę dla duchowieństwa i myślicieli naszego państwa."
 eth_coptic_offense: "Koptyjska ofensywa"
 desc_eth_coptic_offense: "Stoimy u progu ziem niewiernych. Istnieje tylko jeden sposób, by bronić Koptów na całym świecie: musimy przejść do ofensywy i odeprzeć muzułmanów!"
 eth_conversion_focus: "Powrót Koptów"
 desc_eth_conversion_focus: "Większość najważniejszych świętych miejsc została wyzwolona z rąk pogan. Teraz nadszedł czas, aby przywrócić mieszkańców tych ziem pod opiekę Pana."
 eth_blessing_of_kings: "Błogosławieństwo Pana"
 eth_restoration_of_antioch: "Odbudowa Antiochii"
 desc_eth_restoration_of_antioch: "Święte miasto Antiochia ponownie znajduje się w chrześcijańskich rękach. Wielu Koptów podróżuje do tego miasta, aby przywrócić mu życie i odbudować je do dawnej świetności."
 eth_obelisk_of_axum: "Obelisk Aksum"
 desc_eth_obelisk_of_axum: "Obelisk Aksum jest starożytną pozostałością po imperium Aksum i został wzniesiony w V wieku. Wielu pielgrzymów podróżuje do tego obelisku, aby oddać cześć przeszłości i teraźniejszości."
 eth_lord_of_the_horn: "Władca Rogu Afryki"
 desc_eth_lord_of_the_horn: "Po wiekach wewnętrznych walk i wojen wreszcie się udało. Róg Afryki został zjednoczony pod jednym sztandarem — pod sztandarem państwa [Root.GetAdjective]!"
 eth_restoration_of_ancient_borders: "Imperium nad imperiami"
 desc_eth_restoration_of_ancient_borders: "Nasze państwo nie tylko odtworzyło dawną potęgę historyczną, ale znacznie ją przewyższyło! Nasze imperium będzie górować nad wszystkimi pozostałymi!"
 eth_new_christians: "Falash Mura"
 desc_eth_new_christians: "Falash Mura to Żydzi, którzy zostali siłą nawróceni. Choć nie wszyscy są zadowoleni ze swojego nowego losu, większość Falash Mura cieszy się znacznymi korzyściami wynikającymi z życia w Etiopii, co znacznie ułatwia im przemianę."
 eth_united_church: "Zjednoczony Kościół"
 desc_eth_united_church: "Etiopski Kościół koptyjski był podzielony w kwestii biblijnego szabatu, czyli przestrzegania dni odpoczynku. Choć była to stosunkowo błaha sprawa, miała duże znaczenie dla etiopskich wspólnot kościelnych. Rozwiązanie znaleziono dopiero w 1442 roku, gdy sam Negusa Nagast Zara Yaqob zaangażował się w tę kwestię. Od tamtej pory Kościół jest bardziej zjednoczony niż kiedykolwiek wcześniej."
 eth_active_missionaries: "Aktywni misjonarze"
 desc_eth_active_missionaries: "Po podboju dokonanym przez Etiopię w tej prowincji działają teraz misjonarze wysłani przez Negusa Nagasta. Powinni oni dopilnować, aby miejscowa ludność ponownie odnalazła właściwą drogę."
 eth_increased_gold_mining: "Wydajne wydobycie złota"
 desc_eth_increased_gold_mining: "Dzięki rozbudowie infrastruktury znacznie zwiększyła się wydajność wydobycia złota."
 eth_merchants_in_europe: "Kupcy w Europie"
 desc_eth_merchants_in_europe: "Nasi kupcy znaleźli szczęście na europejskich rynkach. Przywożą bogactwa z Europy do państwa [Root.GetName], sprzedając tam jednocześnie wiele naszych własnych towarów, co przynosi znaczne zyski z handlu."
 eth_modernized_army: "Modernizacja armii"
 desc_eth_modernized_army: "Ze względu na modernizację naszej wielkiej armii średnia dyscyplina żołnierzy została zauważalnie zwiększona."
 eth_blessed_empire: "Błogosławione imperium"
 desc_eth_blessed_empire: "Nasz naród przewyższył dokonania przeszłości, zabezpieczył przyszłość i zyskał przychylność samego Pana. Doprawdy jesteśmy błogosławionym imperium!"
 eth_better_integration: "Zwiększone wysiłki integracyjne"
 desc_eth_better_integration: "Postanowiliśmy zintensyfikować wysiłki na rzecz integracji naszych wasali."
 eth_better_vassal_handling: "Skuteczniejszy pobór podatków"
 desc_eth_better_vassal_handling: "Postanowiliśmy zintensyfikować wysiłki na rzecz pobierania podatków od naszych wasali."
 eth_surpassed_aksumite_empire: "Dziedzictwo Aksum"
 desc_eth_surpassed_aksumite_empire: "Nasze państwo przekroczyło granice imperium Aksum. Przejęliśmy starożytne dziedzictwo Aksum!"
 eth_negusa_nagast_issues: "Zdecentralizowane państwo"
 desc_eth_negusa_nagast_issues: "Etiopia jest niemal całkowicie pozbawiona centralizacji. Jedynym źródłem władzy jest obecność samego Negusa Nagasta, który przenosi swoją stolicę do obszaru wymagającego kontroli."
 eth_refused_annexation: "Odrzucona aneksja"
 eth_war_times_ahead: "Nadchodzą czasy wojny"
 eth_restored_contact: "Przywrócone kontakty"
 eth_banned_jesuits: "Wypędzeni jezuici"
 mal_gold_of_mali: "Złoto Mali"
 mal_ivory_of_mali: "Kość słoniowa Mali"
 mal_invested_into_mecca: "Inwestycje w Mekkę"
 mal_accepted_gift: "Przyjęto nasz dar"
 mal_refused_gift: "Odrzucono nasz dar"
 mal_investments_enabled: "Przekazane złoto"
 zim_preferred_by_mutapa: "Wyróżniony przez Mutapę"
 zim_refused_by_mutapa: "Odrzucony przez Mutapę"
 zim_exploited_merchants: "Wykorzystani kupcy"
 mal_colonial_enthusiasm: "Entuzjazm kolonialny"
 desc_mal_colonial_enthusiasm: "Legenda o Ko Mamadim skłoniła wielu naszych młodych ludzi do zbadania jego losów i rozpoczęcia nowego życia w Ameryce Południowej w nadziei na odnalezienie jego szczątków i pozostałości po jego załogach."
 mal_controller_of_the_market: "Kontroler rynku"
 desc_mal_controller_of_the_market: "Dzięki dostępowi do złota udało nam się zdobyć znaczące wpływy na rynkach znajdujących się daleko poza naszą strefą oddziaływania."
 mal_economic_oppression: "Ucisk gospodarczy"
 desc_mal_economic_oppression: "Wskutek zalania najbogatszego rynku świata złotem jego wartość spadła do absolutnego minimum. W rezultacie nikt nie jest w stanie konkurować z naszymi cenami, a my możemy wykorzystywać światowy rynek, dopóki większość państw nie zreformuje swoich walut."
 mal_closed_gold_mine: "Zamknięta kopalnia"
 desc_mal_closed_gold_mine: "Ta prowincja nie będzie już produkować złota, dopóki sytuacja na rynku złota się nie ustabilizuje."
 mal_protected_economy: "Chroniona gospodarka"
 desc_mal_protected_economy: "Dzięki intensywniejszej ochronie naszego handlu gospodarka rozwija się w niespotykanym dotąd tempie."
 mal_a_new_golden_age: "Drugi złoty wiek"
 desc_mal_a_new_golden_age: "Nasze imperium odmieniło bieg losu! Tam, gdzie kiedyś byliśmy upadającym i sparaliżowanym królestwem, teraz stoi nowe Imperium Mali, silniejsze i potężniejsze niż kiedykolwiek wcześniej!"
 mal_great_imperial_power: "Patron Afryki"
 desc_mal_great_imperial_power: "Nasza potęga osiągnęła imponujące rozmiary, a nawet Europejczycy nie mogą stanowić zagrożenia dla naszego wielkiego imperium!"
 mal_river_cultivation: "Uprawa nadrzeczna"
 desc_mal_river_cultivation: "Rzeka przepływająca przez tę prowincję jest intensywnie wykorzystywana gospodarczo i rolniczo, dzięki czemu ziemie stają się żyźniejsze."
 mal_generous_realm: "Hojne państwo"
 desc_mal_generous_realm: "Nasze dary dla współwyznawców sprawiły, że zarówno my, jak i nasi ambasadorowie, którzy przywieźli złoto, cieszymy się dużą popularnością."
 mal_fan_of_the_ulema: "Pełne poparcie ulemów"
 desc_mal_fan_of_the_ulema: "Nasza decyzja o szerzeniu prawdziwej wiary i nawracaniu niewiernych zainspirowała ulemów. Teraz wspierają nas najlepiej, jak potrafią."
 mal_fan_of_the_dhimmi: "Pełne poparcie dhimmi"
 desc_mal_fan_of_the_dhimmi: "Nasza decyzja o tolerowaniu niewiernych i przyznaniu im większych praw zainspirowała dhimmi. Teraz wspierają nas najlepiej, jak potrafią."
 great_mosque_djenne_modifier: "Wielki Meczet w Dżenne"
 desc_great_mosque_djenne_modifier: "W tej prowincji znajduje się Wielki Meczet w Dżenne. Ulemowie z prowincji poświęcili ogromną ilość czasu i środków na jego renowację, przekształcając go w perłę Afryki Zachodniej."
 mal_mansas_journey: "Pielgrzymka mansy"
 desc_mal_mansas_journey: "Nasz władca odbywa obecnie pielgrzymkę do Mekki, podążając szlakiem przez świat chrześcijański. Po drodze podziwia cuda Europy."
 mal_advisors_journey: "Pielgrzymka doradców"
 desc_mal_advisors_journey: "Nasi doradcy odbywają obecnie pielgrzymkę do Mekki, podążając szlakiem przez świat chrześcijański."
 mal_pilgrimage_desc: "do końca pielgrzymki"
 mal_the_pilgrim: "Pobożne rządy"
 desc_mal_the_pilgrim: "Liczne pielgrzymki do Mekki sprawiły, że nasze państwo stało się krainą pobożności i prawowitości."
 mal_nobles_take_over: "Przejęcie władzy przez szlachtę"
 desc_mal_nobles_take_over: "Ta prowincja znalazła się pod kontrolą malijskiej szlachty, która dąży do zwiększenia swoich wpływów w imperium kosztem miejscowej ludności."
 mal_burghers_take_over: "Przejęcie władzy przez mieszczan"
 desc_mal_burghers_take_over: "Ta prowincja znalazła się pod kontrolą malijskich mieszczan, którzy dążą do zwiększenia swoich wpływów w imperium kosztem miejscowej ludności."
 mal_radical_clergy: "Radykalni ulemowie"
 desc_mal_radical_clergy: "Ulemowie przejęli większą część władzy w Mali i próbują osłabić wpływy dhimmich oraz wyznawców innych religii."
 mal_radical_dhimmi: "Radykalni dhimmi"
 desc_mal_radical_dhimmi: "Dhimmi przejęli większą część władzy w Mali i próbują osłabić wpływy ulemów oraz muzułmanów."
 mal_the_declining_authority_of_mali: "Upadek autorytetu"
 desc_mal_the_declining_authority_of_mali: "Poddani Mali nie traktują już poważnie władzy mansy. Utrzymanie ich lojalności w tych trudnych czasach będzie niezwykle trudne."
 mal_investment_of_the_mansa: "Dar od Mali"
 desc_mal_investment_of_the_mansa: "Pielgrzymi z Mali pozostawili w naszej ojczyźnie ogromne ilości złota. Choć ich przybycie zaszkodziło naszej gospodarce, pozostawione kruszce obniżają koszty rozwoju infrastruktury."
 mal_the_gold_inflation: "Złoto z Mali"
 desc_mal_the_gold_inflation: "Nasza gospodarka zmaga się obecnie z napływem obcego złota."
 mal_investing_in_own_provinces: "Inwestycja w prowincję"
 desc_mal_investing_in_own_provinces: "Ta prowincja otrzymała wsparcie finansowe w postaci złota z Mali."
 mal_second_target: "Drugi cel"
 desc_mal_second_target: "Pamiętaj, aby znaleźć drugi cel, do którego można wysłać złoto."
 estate_chieftains: "Wodzowie"
 estate_tengbiise: "Tengbiise"
 estate_nakomse: "Nakomse"
 estate_oyo_mesi: "Ojo Mesi"
 estate_ogboni: "Ogboni"
 estate_burghers_control_over_gold_mine: "Kontrolowane wydobycie złota"
 desc_estate_burghers_control_over_gold_mine: "Mieszczanie tej prowincji przejęli kontrolę nad wydobyciem i pilnują, by zbyt duże ilości złota nie trafiały do gospodarki właściciela."
 estate_church_united_faith_and_culture: "Społeczeństwo religijne"
 desc_estate_church_united_faith_and_culture: "Duchowieństwo sprawuje pieczę nad tą prowincją i odgrywa kluczową rolę w sprawach społecznych oraz kulturowych, łącząc religię i kulturę jej mieszkańców."
 estate_church_false_culture: "Kultura heretycka"
 desc_estate_church_false_culture: "Większość mieszkańców tej prowincji wyznaje religię lub reprezentuje kulturę nieakceptowaną przez jej zwierzchnika. Duchowieństwo próbuje zatem ich reedukować, aby mogli dołączyć do wspólnoty religijnej."
 estate_burghers_hydraulic_rights_desert: "Ulepszone nawadnianie"
 desc_estate_burghers_hydraulic_rights_desert: "Dzięki działaniom miejscowych mieszczan znacznie poprawił się dostęp do wody w tej prowincji."
 estate_burghers_hydraulic_rights_coastal_desert: "Ulepszone nawadnianie"
 desc_estate_burghers_hydraulic_rights_coastal_desert: "Dzięki działaniom miejscowych mieszczan znacznie poprawił się dostęp do wody w tej prowincji."
 estate_burghers_hydraulic_rights_steppes: "Ulepszone nawadnianie"
 desc_estate_burghers_hydraulic_rights_steppes: "Dzięki działaniom miejscowych mieszczan znacznie poprawił się dostęp do wody w tej prowincji."
 estate_burghers_hydraulic_rights_savanna: "Ulepszone nawadnianie"
 desc_estate_burghers_hydraulic_rights_savanna: "Dzięki działaniom miejscowych mieszczan znacznie poprawił się dostęp do wody w tej prowincji."
 son_salt_cloth_production: "Przyspieszona produkcja"
 son_salt_cloth_production_tt: "Trwa do wygaśnięcia modyfikatora państwa §YSól i główna produkcja sukna§!."
 desc_son_salt_cloth_production: "W tej prowincji zintensyfikowano produkcję soli i sukna."
 son_fetishism_as_secondary_religion: "Fetyszyzm drugorzędną religią"
 desc_son_fetishism_as_secondary_religion: "Każda posiadana prowincja z §fetyszyzmem§! otrzymuje następujące efekty: \nLokalny wzrost dobrobytu: §G+0.05§!\nLokalny wkład w jedność religijną: §G-100.0%§!\nLokalna siła misjonarzy: §R-2.0%§!\nFetyszyści zyskali duże wpływy i tolerancję w naszym państwie i są obecnie postrzegani jako drugorzędna religia państwa.\nModyfikator zostanie usunięty, jeśli państwo [Root.GetName] zmieni swoją religię na §Yfetyszyzm§!."
 son_fetishism_as_secondary_religion_desc: "§YWygaśnie kiedy religia państwowa zmieni się na fetyszyzm.§!"
 son_fetishism_as_secondary_religion_tt: "Państwo [Root.GetName] otrzymuje '§YFetyszyzm drugorzędną religią§!' do końca gry lub do momentu, gdy religia w państwie [Root.GetName] zmieni się na §Yfetyszyzm§!, dając następujące efekty:\nPoprawa relacji: §G+10.0%§!\nKażda posiadana prowincja z §fetyszyzmem§!:\nLokalny wzrost dobrobytu: §G+0.05§!\nLokalny wkład w jedność religijną: §G-100.0%§!\nLokalna siła misjonarzy: §R-2.0%§!"
 son_fetishism_as_secondary_religion_province: "Tolerancja fetyszyzmu"
 desc_son_fetishism_as_secondary_religion_province: "Właściciel tej prowincji uważa fetyszyzm za drugorzędną religię państwową."
 son_fetishism_as_secondary_religion_province_desc: "§YWygaśnie kiedy religia państwowa zmieni się na fetyszyzm.§!"
 son_separitism_killer: "Gorliwi wyznawcy"
 desc_son_separitism_killer: "Wiejska ludność Mossi została wprowadzona w świat islamu i nie przejawia buntowniczej postawy wobec swojego władcy."
 son_embrace_legalism: "Poparcie dla ulemów"
 desc_son_embrace_legalism: "[Root.Monarch.GetName] wysłuchał argumentów dotyczących dekoracji Wielkiego Meczetu w Djenné i w tej sprawie stanął po stronie [Root.GetClergyName_gen]."
 son_embrace_mysticism: "Poparcie dla dhimmich"
 desc_son_embrace_mysticism: "[Root.Monarch.GetName] wysłuchał argumentów dotyczących dekoracji Wielkiego Meczetu w Dżenne i w tej sprawie opowiedział się po stronie [Root.GetDhimmiName]."
 son_foothold_in_enemy_territory: "Granica z Mali"
 desc_son_foothold_in_enemy_territory: "Ta prowincja stanowi najbardziej wysuniętą granicę imperium Songhaj, sąsiadującą z Mali. Wielu rzemieślników i murarzy zebrało się tutaj, aby przygotować umocnienia."
 son_professional_songhaian_army: "Pierwsza stała armia profesjonalna"
 desc_son_professional_songhaian_army: "[Root.Monarch.GetName] zdecydował się skupić na bardziej wyrafinowanej, stałej armii. W rezultacie jakość wojska wzrosła, jednak rekruterzy stali się bardziej wybredni w doborze żołnierzy."
 son_focus_on_professional_armies: "Profesjonalna stała armia"
 desc_son_focus_on_professional_armies: "[Root.Monarch.GetName] zdecydował się skoncentrować na bardziej zorganizowanej, stałej armii. Dzięki tym wymaganiom jakość wojska wzrosła, lecz rekruterzy stali się bardziej wybredni w doborze poborowych."
 son_reformed_army_technology: "Arsenał Songhaju"
 desc_son_reformed_army_technology: "Broń palna była dotąd nieznana w wojnach Afryki Zachodniej. Songhaj jako pierwszy sięgnął po muszkiety i armaty, czyniąc z nich narzędzie dominacji nad innymi potęgami regionu.\nKontakty z Europejczykami i przejęcie ich wiedzy technicznej sprawiły, że jakość tej broni osiągnęła jeszcze wyższy poziom."
 son_modern_government: "Nowoczesne państwo"
 desc_son_modern_government: "Nasz kraj osiągnął kluczowy postęp w zakresie sztuki rządzenia i administracji, stając się pierwszym nowoczesnym państwem w Afryce Zachodniej."
 son_songhaian_empire: "Imperium Songhaju"
 desc_son_songhaian_empire: "Staliśmy się wspaniałą hegemonią Afryki Zachodniej! Imperium Songhaju będzie rozkwitać i trwać!"
 son_religious_scholars: "Uczeni religijni"
 desc_son_religious_scholars: "[Root.GetClergyName] wspiera uczonych religijnych w naszym państwie i zapewnia im własne środki na działalność."
 son_religious_friends: "Pobożna reputacja"
 desc_son_religious_friends: "Nasze starania o poprawę stosunków z braćmi w wierze zapewniły nam dobrą reputację wśród licznych sunnickich państw świata i wyznawców naszej religii."
 son_tolerance_of_old_traditions: "Tolerancja dla tradycji"
 desc_son_tolerance_of_old_traditions: "Nasze państwo zaczęło okazywać większą tolerancję wobec ludności wiejskiej, która wciąż kultywuje pogańskie tradycje i obyczaje."
 son_defender_of_traditions: "Obrońca tradycji"
 desc_son_defender_of_traditions: "Nasza tolerancja i gotowość do niesienia pomocy wyznawcom pogańskich religii zapewniły nam dobrą reputację wśród państw hołdujących tym wierzeniom."
 son_salt_cloth_trader: "Główna produkcja soli i sukna"
 desc_son_salt_cloth_trader: "Znaczną część naszych manufaktur i warsztatów przeznaczyliśmy na produkcję soli i sukna, co daje nam istotną przewagę w węzłach handlowych."
 son_beacon_of_islam: "Latarnia islamu"
 desc_son_beacon_of_islam: "Nasze zaangażowanie w nawracanie całej Afryki Zachodniej uczyniło z nas latarnię wiary muzułmańskiej w tym regionie. Nikt nie zakwestionuje pobożności naszych rządów."
 kon_south_african_hegemony: "Hegemon południowej Afryki"
 desc_kon_south_african_hegemony: "Prowincje należące do grup kulturowych §Ypołudniowoafrykańskiej§!, §Ywschodniobantu§! lub §YWielkich Jezior§! nie odczuwają kar za nieakceptowaną kulturę, dopóki ten modyfikator pozostaje aktywny.\n\nPodbiliśmy południową Afrykę i stworzyliśmy imperium rozciągające się od Wybrzeża Kości Słoniowej po Madagaskar. Nikt nie ośmieli się zakwestionować naszej władzy!"
 kon_south_african_hegemony_province: "Hegemon południowej Afryki"
 desc_kon_south_african_hegemony_province: "Właściciel tej prowincji ogłosił się „hegemonem południowej Afryki”. Jej mieszkańcy nie zakwestionują władzy zwierzchnika, nawet jeśli ich kultura oficjalnie nie jest akceptowana."
 temporary_colonist: "Osadnicy-awanturnicy"
 desc_temporary_colonist: "Niektórzy z naszych poddanych to awanturnicy poszukujący nowych możliwości na niezbadanych ziemiach. Są gotowi osiedlać się nawet w prowincjach, do których nikt z naszego państwa jeszcze nie dotarł."
 kon_european_influence: "Wpływy europejskie"
 desc_kon_european_influence: "Kontakt z europejską technologią przyspiesza rozwój instytucji i przyswajanie nowych idei w naszym państwie."
 zim_trade_dominance: "Dominacja handlowa"
 desc_zim_trade_dominance: "Kontrolujemy jedno z najbogatszych centrów handlowych świata i dominujemy nad przepływem bogactw na Oceanie Indyjskim!"
 zim_advanced_military: "Zreformowana armia"
 desc_zim_advanced_military: "Nasza armia przeszła gruntowne reformy oparte na doświadczeniach zdobytych na polu bitwy oraz zaleceniach doradców wojskowych."
 zim_weapon_forgery: "Wytwórnia broni Mutapy"
 desc_zim_weapon_forgery: "Ta prowincja jest głównym ośrodkiem produkcji broni dla armii Mutapy."
 zim_uniform_tailoring: "Szwalnia mundurów Mutapy"
 desc_zim_uniform_tailoring: "Ta prowincja jest głównym ośrodkiem szycia mundurów dla armii Mutapy."
 zim_sacred_court: "Święty dwór"
 desc_zim_sacred_court: "Na dworze Mwenemutapy służą wyłącznie najmądrzejsi i najbardziej kompetentni doradcy, godni przebywać u boku władcy otaczanego boską czcią."
 zim_mutapan_influence: "Wpływy Mutapy"
 desc_zim_mutapan_influence: "Prowincja otrzymuje znaczne wsparcie od swojego zwierzchnika, co zwiększa produkcję i zapewnia dobrobyt tej ziemi."
 promised_land_modifier: "Ziemia obiecana"
 desc_promised_land_modifier: "Zgodnie z Torą sam Bóg obiecał Żydom ziemię Palestyny."
 kongo_cardinal_modifier: "Kardynał Afryki"
 desc_kongo_cardinal_modifier: "Dopóki właściciel tej prowincji jest gorliwym katolikiem, zostanie w niej ustanowiony §Ykardynał§!.\nW tej prowincji znajduje się siedziba Kardynała Afryki."
 kon_absolute_rulership: "Władza absolutna"
 desc_kon_absolute_rulership: "Nasz [Root.Monarch.GetTitle] sprawuje absolutną władzę nad państwem [Root.GetName] i cieszy się poparciem poddanych."
 kon_kuban_art: "Sztuka Kubanów"
 desc_kon_kuban_art: "Kubanowie tworzyli wspaniałe, a zarazem zabójcze miecze oburęczne zwane ilwoon, a także okazałe maski wojenne dla naszych żołnierzy. Miecze zwiększają zdolności bojowe naszych wojsk, a maski stanowią przerażający widok dla każdego wroga stającego naprzeciw naszych walecznych wojowników."
 kon_intensified_copper_mining: "Miedź Anziku"
 desc_kon_intensified_copper_mining: "Miedź z Anziku od dziesięcioleci budziła wielkie zainteresowanie Konga i była przyczyną konfliktów między Kongiem a Tyo. Po podboju Anziku Kongijczycy uzyskali pełny dostęp do złóż miedzi w tych prowincjach i rozpoczęli intensywniejsze wydobycie tego cennego metalu."
 kon_defender_of_the_old_ways: "Obrońca dawnych obyczajów"
 desc_kon_defender_of_the_old_ways: "Bronimy dawnych, tradycyjnych obyczajów i zdobyliśmy szacunek naszych fetyszystycznych współwyznawców oraz poddanych."
 kon_united_shaman_tribes: "Zjednoczeni szamani"
 desc_kon_united_shaman_tribes: "Szamani naszych ziem zjednoczyli się, by wypędzić chrześcijańskich misjonarzy, i odnieśli sukces. Ich zadanie nie zostało jednak zakończone — teraz kierują uwagę na prowincje, które również uległy obcym religiom."
 kon_catholic_fortress_of_africa: "Katolicka twierdza Afryki"
 desc_kon_catholic_fortress_of_africa: "Jesteśmy twierdzą Chrystusa w Afryce! Niesiemy światło Pana niecywilizowanym barbarzyńcom i poświęcamy Afrykę Stolicy Apostolskiej!"
 kon_chokwe_craftsmenship: "Rzemiosło Czokwe"
 desc_kon_chokwe_craftsmenship: "W tej prowincji pracują rzemieślnicy z ludu Czokwe, którzy tworzą artystyczne wyroby, takie jak idole i maski z drewna oraz kości słoniowej."
 kon_defender_of_africa: "Obrońca Afryki"
 desc_kon_defender_of_africa: "Nasze państwo wzniosło się ponad wszystkie inne, stawiło czoła Europejczykom pragnącym nas zniewolić i zniszczyć, a następnie wypędziło ich z naszego rodzinnego kontynentu!"
 kon_great_power_of_africa: "Wielka potęga Afryki"
 desc_kon_great_power_of_africa: "Nasze państwo wzniosło się ponad wszystkie inne, zmodernizowało się i stało się zamożnym krajem, a także stawiło czoła Europejczykom pragnącym nas zniewolić! Teraz jesteśmy jednym z wielkich imperiów świata!"
 primary_yemoja_cult: "Główny kult: Jemoja"
 desc_primary_yemoja_cult: "Jemoja jest naszym głównym kultem. Nasi poddani czczą ją bardziej niż jakiekolwiek inne bóstwo, a po śmierci władcy dołączy on do niej jako przodek."
