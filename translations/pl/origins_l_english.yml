 son_competence_in_court_desc: "Biurokracja nie jest zbyt ekscytującym tematem, ale jest niezbędna dla każdego kraju, który ma wielkie ambicje. Obecny stan naszej biurokracji wygląda jednak fatalnie. Musimy uporządkować naszą administrację, zanim w ogóle zaczniemy myśleć o ekspansji."
