 son_prepare_troops_title: "Zdobądź tytuł imperium"
 son_prepare_troops_desc: "Nadszedł czas, aby Mali oddało nam swój tytuł. Upadek ich osłabił i teraz są jedynie cieniem tego, czym byli kiedyś. Jednak aby zdobyć tytuł Imperium Afryki Zachodniej, musimy zademonstrować naszą siłę, deklasując Mali pod każdym możliwym względem."
 son_invade_mali_title: "Wyeliminuj Mali"
 son_invade_mali_desc: "Mali przeżyło swoje czasy. Wyciągnięcie tej żałosnej krainy z nędzy i zintegrowanie jej ludności z naszym własnym, prawowitym imperium jest aktem miłosierdzia!"
