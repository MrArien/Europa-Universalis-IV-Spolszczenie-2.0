 c_a_improve_infrastructure_title: ""
 c_a_improve_infrastructure_desc: ""
 c_a_preparing_for_war: "Przygotowania do wojny"
 desc_c_a_preparing_for_war: "Zebraliśmy armię, więc nadszedł czas, aby ją wykorzystać"
 c_a_training: "Szkolenie armii"
 desc_c_a_training: "Teraz, gdy nasza armia jest w pełni wyszkolona, stała się potężną siłą"
 c_a_hegemon: ""
 desc_c_a_hegemon: ""
 c_a_spoils_of_war: "Łupy wojenne"
 desc_c_a_spoils_of_war: "Napadanie na naszych sąsiadów dla zysku jest najlepszym sposobem na wzmocnienie naszej gospodarki"
 c_a_vassals: "Lojalni wasale"
 desc_c_a_vassals: "Zdobycie tak wielu wasali dało wszystkim do zrozumienia, że jesteśmy dyplomatycznie silni"
 c_a_humiliated_rival: "Upokorzenie naszych rywali"
 desc_c_a_humiliated_rival: "Zadając tak decydujący cios naszym rywalom, sprawiliśmy, że zastanowią się oni dwa razy, zanim ponownie się nam przeciwstawią"
 c_a_only_truth: ""
 desc_c_a_only_truth: ""
 c_a_united_cults: ""
 desc_c_a_united_cults: ""
 gen_hoa_building_religious_alliances_title: "Sojusze religijne"
 gen_hoa_building_religious_alliances_desc: "Świat zawsze był niebezpieczny i nieprzewidywalny. Musimy budować trwałe relacje z tymi, którzy podzielają nasze wartości i przekonania."
 building_religious_alliances.tooltip: ""
 gen_hoa_subjugate_heathens_title: ""
 gen_hoa_subjugate_heathens_desc: ""
 gen_hoa_heretic_convert_cost_modifier: "Duchowni weterani"
 desc_gen_hoa_heretic_convert_cost_modifier: "Duchowieństwo z Rogu Afryki nieustannie styka się z poganami i heretykami, którzy opierają się ich naukom. Ciągła walka czyni z nich wielkich obrońców wiary."
 gen_hoa_convert_60_provinces_tooltip_tt: ""
 gen_hoa_convert_30_provinces_tooltip_tt: ""
 gen_hoa_join_forces_title: ""
 gen_hoa_join_forces_desc: ""
 gen_hoa_join_forces.tooltip: "To państwo na drodze dyplomacji zaanektowało wszystkich swoich pogańskich wasali."
 gen_hoa_become_great_power_title: "Światło Rogu Afryki"
 gen_hoa_become_great_power_desc: "Świat jest teraz o wiele większy niż w czasach naszych przodków. Wielkie mocarstwa kształtują swoje ziemie zgodnie z własną wolą. Nie możemy pozwolić, by te pozbawione wiary olbrzymy robiły z nią, co im się żywnie podoba. Musimy się zjednoczyć, podnieść pochodnię wiary i poprowadzić dumny lud Rogu Afryki do raju."
 gen_hoa_great_power_modifier: "Światło Rogu Afryki"
 desc_gen_hoa_great_power_modifier: "Wielka siła, która przewodzi mieszkańcom Rogu Afryki, jest znana i szanowana w każdym zakątku Ziemi."
 gen_hoa_prepare_for_war_title: "Przygotowanie do wojny"
 gen_hoa_prepare_for_war_desc: "Poza naszymi granicami wciąż mamy wielu wrogów, pogan, którzy wierzą w straszliwych bogów i chcą doprowadzić do naszego upadku. Musimy jak najszybciej zebrać nasze siły i przygotować się do nieuniknionej wojny."
 gen_hoa_attack_the_heathens_title: "Atak na pogan"
 gen_hoa_attack_the_heathens_desc: "Wysiłki naszych ludzi opłaciły się i nasza armia jest wreszcie gotowa do obrony naszej ojczyzny. Teraz, gdy mamy przewagę, musimy zaatakować pogan i odebrać im zasoby, które gromadzą, zanim połączą siły i zaatakują nas."
 gen_hoa_attack_the_heathens.tooltip: "Ma swoją stolicę w §YRogu Afryki§!."
 gen_hoa_horn_bravery_modifier: "Męstwo wiernych"
 desc_gen_hoa_horn_bravery_modifier: "Nasi wojownicy są znani ze swojego okrucieństwa i bezwzględności wobec wrogów naszej wiary."
 gen_hoa_expand_borders_title: ""
 gen_hoa_expand_borders_desc: ""
 gen_hoa_unify_the_horn_of_africa_title: "Zjednoczenie Rogu Afryki"
 gen_hoa_unify_the_horn_of_africa_desc: "Czasy niepokojów i wojen między ludami Rogu Afryki dobiegają końca. Zjednoczymy każde plemię i każdy lud pod naszym sztandarem i doprowadzimy je do pomyślnej i pokojowej przyszłości."
 gen_hoa_unify_horn_modifier: "Zjednoczony Róg Afryki"
 desc_gen_hoa_unify_horn_modifier: "Wszyscy cieszą się teraz, że Róg Afryki został wreszcie zjednoczony we wspólnym państwie."
 gen_hoa_favor_church_title: ""
 gen_hoa_favor_church_desc: ""
 gen_hoa_convert_conquered_title: ""
 gen_hoa_convert_conquered_desc: ""
 gen_hoa_convert_conquered_modifier: "Nawracanie pokonanych"
 desc_gen_hoa_convert_conquered_modifier: "Ci, którzy są pod naszą opieką, muszą przestrzegać naszych tradycji i z wdzięcznością przyjąć swoje zbawienie."
 gen_hoa_convert_the_horn_title: ""
 gen_hoa_convert_the_horn_desc: "Wielkim przeznaczeniem naszego państwa jest poprowadzenie ludzkości do zbawienia, a czyniąc prawdziwą religię dominującą w Rogu Afryki, zrobimy pierwszy krok ku naszej przyszłości."
 gen_hoa_convert_the_horn_modifier: "Święty Róg Afryki"
 desc_gen_hoa_convert_the_horn_modifier: "Mieszkańcy Rogu Afryki są wreszcie zjednoczeni pod jedną prawdziwą wiarą."
 gen_hoa_stabilize_economy_mission_title: "Stabilizacja gospodarki"
 gen_hoa_stabilize_economy_mission_desc: "Niestabilność naszego regionu jest wielką szansą dla tych, którzy są na tyle odważni, by z niej skorzystać. Musimy zrobić wszystko, aby zwiększyć dochody państwa i przygotować się na nadchodzące trudne czasy."
 gen_hoa_stabilize_economy_mission.tooltip: ""
 gen_hoa_developing_economy_modifier: "Rozwijająca się gospodarka"
 desc_gen_hoa_developing_economy_modifier: "Gospodarka naszego kraju odzyskała swój wigor i stwarza nowe możliwości dla naszych ludzi."
 gen_hoa_build_temples_title: ""
 gen_hoa_build_temples_desc: ""
 gen_hoa_build_temples_modifier: "Nowe świątynie"
 desc_gen_hoa_build_temples_modifier: ""
 gen_hoa_build_trade_navy_title: "Zbuduj flotę"
 gen_hoa_build_trade_navy_desc: "Nasz lud ma wielkie tradycje kupieckie, jednakże zawsze handlowaliśmy z obcokrajowcami, którzy przybywali do naszych wybrzeży. Teraz nadszedł czas, abyśmy zbudowali wielką flotę handlową, która będzie podróżować do odległych krain i przywozić najwspanialsze bogactwa."
 gen_hoa_trade_navy_modifier: "Flota handlowa"
 desc_gen_hoa_trade_navy_modifier: "Wielka marynarka naszego państwa jest gotowa za wszelką cenę przynieść zysk naszym ludziom."
 gen_hoa_control_coastline_title: "Kontrola linii brzegowej"
 gen_hoa_control_coastline_desc: "Kupcy z naszego ludu są podstawą naszej siły. Zanim zaczniemy patrzeć na zewnątrz, musimy dołożyć wszelkich starań, aby umocnić ich pozycję w handlu w naszym regionie."
 gen_hoa_control_coastline_modifier: "Morze możliwości"
 desc_gen_hoa_control_coastline_modifier: "Rozległa linia brzegowa naszego państwa jest niezwykle kluczowa dla naszego handlu z resztą świata i jako taka jest naszym najważniejszym zasobem."
 gen_hoa_control_india_ocean_title: "Zdominowanie Oceanu Indyjskiego"
 gen_hoa_control_india_ocean_desc: "Róg Afryki ma uprzywilejowane położenie i musimy je wykorzystać, aby rozszerzyć nasze wpływy i stać się najbardziej skutecznymi kupcami na Oceanie Indyjskim."
 gen_hoa_control_india_ocean.tooltip1: "Państwo §Y[Root.GetName]§! ma §Y70%§! siły handlowej w §YZatoce Adeńskiej§!"
 gen_hoa_control_india_ocean.tooltip2: "Państwo §Y[Root.GetName]§! ma §Y50%§! siły handlowej w §YEtiopii§!"
 gen_hoa_control_india_ocean.tooltip3: "Państwo §Y[Root.GetName]§! ma §Y30%§! siły handlowej w §YGudźaracie§!"
 gen_hoa_control_india_ocean.tooltip4: ""
 gen_hoa_control_india_ocean.tooltip5: "Państwo §Y[Root.GetName]§! ma §Y15%§! siły handlowej w §YBengalu§!"
 gen_hoa_control_india_ocean.tooltip6: "Państwo §Y[Root.GetName]§! ma §Y15%§! siły handlowej w §YMalakce§!"
 west_africa_assemble_warband_title: ""
 west_africa_assemble_warband_desc: ""
 west_africa_strong_leadership_title: "Silne przywództwo"
 west_africa_strong_leadership_desc: "Nasi rywale muszą być świadomi naszej odwagi i potęgi. Musimy więc pokazać, że jesteśmy najsilniejsi w okolicy, upokarzając ich na polu bitwy."
 west_africa_strong_leadership_ct: "Żaden znany kraj ze stolicą w §YSahelu§!, §YNigrze§! i §YGwinei§! nie jest niepodległym państwem o większym rozwoju niż §Y[Root.GetName]§!."
 west_africa_unite_home_region_title: "Zjednocz region macierzysty"
 west_africa_unite_home_region_desc: "W ostatnich latach urośliśmy w siłę i mamy okazję zjednoczyć wszystkich mieszkańców naszego regionu po raz pierwszy od pokoleń."
 west_africa_gunpowder_weapons_title: "Broń prochowa"
 west_africa_gunpowder_weapons_desc: "Jesteśmy teraz potężną siłą w naszym regionie, ale zauważyliśmy pojawienie się nowego rodzaju broni. Handlują nią zagraniczni kupcy i nazywają prochem strzelniczym. Musimy zagwarantować, że będą ją posiadać nasi wojownicy i to bez konieczności polegania na tych cudzoziemcach."
 west_africa_greater_than_mali_title: "Potężniejsi niż Mali!"
 west_africa_greater_than_mali_desc: "Po zjednoczeniu naszego regionu, z nową bronią w rękach naszych wojowników, jesteśmy gotowi podbić wszystkie ziemie pomiędzy Saharą a Zatoką Gwinejską. Nie możemy zmarnować okazji, aby stać się największą potęgą od czasu upadku Imperium Mali, a nawet jeszcze większą!"
 west_africa_embracing_old_traditions_title: "Podążanie za starymi tradycjami"
 west_africa_embracing_old_traditions_desc: "Od pokoleń przestrzegamy naszych starożytnych tradycji. Teraz gdy nowe religie rozprzestrzeniają się wśród naszych ludzi, musimy trzymać się razem i podporządkować naszym starym rytuałom, aby przetrwać."
 west_africa_brothers_in_tradition_fetishist_title: "Bracia w wierze"
 west_africa_brothers_in_tradition_fetishist_desc: "Nasz lud ma długą tradycję konfliktów z sąsiednimi ludami z powodu naszych i ich wierzeń. Teraz jednak nadszedł czas, aby sprzymierzyć się z nimi przeciwko wiarom osłabiającym nasze terytoria."
 west_africa_shamans_title: "Szamani"
 west_africa_shamans_desc: "Nasze wierzenia są silne wśród naszych ludzi, ale uważamy, że samo oddawanie czci to za mało. Nasi szamani chętnie nauczą cudzoziemców o kulcie, który czyni nas silniejszymi."
 west_africa_sankore_university_fetishist_title: "Uniwersytet Sankore"
 west_africa_sankore_university_fetishist_desc: "Medresa Sankore w Timbuktu od dziesięcioleci jest najważniejszym ośrodkiem wiedzy na południe od Sahary. Teraz nadszedł czas, aby przejąć to miasto i wykorzystać przechowywane tam manuskrypty."
 west_africa_sincretic_rituals_title: ""
 west_africa_sincretic_rituals_desc: ""
 west_africa_embracing_new_traditions_title: "Przyjmij nowe tradycje"
 west_africa_embracing_new_traditions_desc: ""
 west_africa_brothers_in_faith_sunni_title: "Bracia w wierze"
 west_africa_brothers_in_faith_sunni_desc: "Nasz lud ma długą tradycję konfliktów z sąsiednimi ludami z powodu naszych i ich wierzeń. Teraz jednak nadszedł czas, aby sprzymierzyć się z nimi przeciwko wiarom osłabiającym nasze terytoria."
 west_africa_marabouts_title: "Marabuci"
 west_africa_marabouts_desc: "Marabuci od pokoleń szerzą w tym regionie pięć filarów islamu. Teraz nadszedł czas, aby wesprzeć ich wysiłki i sprawić, by ich słowo rozprzestrzeniało się szerzej."
 west_africa_sankore_university_sunni_title: "Uniwersytet Sankore"
 west_africa_sankore_university_sunni_desc: "Medresa Sankore w Timbuktu od dziesięcioleci jest najważniejszym ośrodkiem wiedzy na południe od Sahary. Teraz nadszedł czas, aby przejąć to miasto i wykorzystać przechowywane tam manuskrypty."
 west_africa_the_only_faith_title: "Jedyna wiara"
 west_africa_the_only_faith_desc: "Nasze wysiłki na rzecz szerzenia szahady i innych filarów islamu oraz Koranu wśród rządzonych przez nas ludzi były intensywne przez dziesięciolecia. Teraz musimy potwierdzić, że islam jest jedyną religią, ponieważ nie ma boga prócz Allaha."
 west_africa_gathering_tributes_title: "Zbieranie danin"
 west_africa_gathering_tributes_desc: "Konieczne jest, aby nasi ludzie zbierali daniny od naszych sąsiadów, ponieważ potrzebujemy ich, aby urosnąć w siłę w ciągu najbliższych kilku lat."
 west_africa_clearings_irrigations_title: "Wycinka i nawadnianie"
 west_africa_clearings_irrigations_desc: "Nasze ziemie były odpowiednie dla rolnictwa, odkąd ludzie zaczęli je uprawiać, ale jeśli chcemy wyżywić większą liczbę ludności mieszkającej na naszym terytorium, musimy wprowadzić pewne wyręby w lasach i dżunglach oraz zorganizować nawadnianie w dolinach naszych rzek."
 west_africa_salt_cloth_shells_title: "Sól, sukno i muszle"
 west_africa_salt_cloth_shells_desc: "Handel przez saharyjskie korytarze i Zatokę Gwinejską od pewnego czasu wzrasta, a w naszych miastach pojawiają się nowi kupcy z zagranicy, którzy handlują nowymi produktami. Teraz musimy przejąć kontrolę nad tym lukratywnym handlem i wykorzystać go na naszą korzyść."
 west_africa_manufacturing_africa_title: "Produkcja w Afryce"
 west_africa_manufacturing_africa_desc: "Luksusowe towary handlowe zza oceanu od kilku lat zalewają nasze terytoria. Teraz mamy możliwość powielania i tworzenia nowych towarów we własnym zakresie, czerpania zysków z ich sprzedaży wśród naszych ludzi, a nawet eksportowania ich za granicę."
 west_africa_bilad_sudan_trade_title: ""
 west_africa_bilad_sudan_trade_desc: "Kilka ważnych ośrodków rozwinęło się wraz ze wzrostem handlu w ostatnich dziesięcioleciach w całym regionie. Timbuktu jest bramą na północ, Kanem-Borno kontroluje handel ze wschodem, a Benin jest głównym miejscem na południowym wybrzeżu. Teraz konieczne jest przejęcie kontroli nad tymi miejscami i przepływającym przez nie handlem."
