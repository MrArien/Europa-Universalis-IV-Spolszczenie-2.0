 kon_repel_the_missionaries_title: ""
 kon_repel_the_missionaries_desc: "Ludzie o bardzo jasnej karnacji pojawili się u wybrzeży naszego państwa i zaczęli głosić idee o 'człowieku, który został powieszony na krzyżu'. Na pierwszy rzut oka przypominali oni przyjaznych gawędziarzy, ale okazało się, że mają plan, by zniszczyć nasze dawne tradycje, a ludzie, który za nimi podążają, przysłuchują się ich historiom! Nie możemy pozwolić, by ci misjonarze kontynuowali swoją działalność!"
 kon_repel_the_missionaries_tt: "Państwo §Y[Root.GetName]§! przestanie być celem zagranicznych misjonarzy."
 kon_convert_west_africa_title: ""
 kon_convert_west_africa_desc: ""
