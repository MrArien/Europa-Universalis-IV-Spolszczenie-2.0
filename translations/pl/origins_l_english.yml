 swap_primary_cult_desc: "[Root.Monarch.GetTitle] naszego państwa [Root.GovernmentName] ma prawo wybrać nowy Główny kult dla państwa [Root.GetName]. Taka decyzja wzbudzi jednak niezadowolenie wśród naszego ludu."
