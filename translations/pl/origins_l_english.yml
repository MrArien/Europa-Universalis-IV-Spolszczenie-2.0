 primary_dharmic_cult: "Główny kult: sanatana dharma"
 desc_primary_dharmic_cult: "Sanatana dharma jest naszym głównym kultem. Nasi poddani wyznają ją bardziej niż jakąkolwiek inną religię, a po śmierci władca dołączy do wspólnoty przodków."
