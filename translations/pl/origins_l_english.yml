 mal_purchase_trade_colony_title: "Kup kolonię handlową"
 mal_purchase_trade_colony_desc: "Europejczycy nie darzą nas zaufaniem, lecz nasze złoto pozwoli nam ich przekonać, by sprzedali nam jedną ze swoich prowincji.\nPowinniśmy jednak zadbać o utrzymywanie w miarę dobrych stosunków z państwem, do którego należy wybrana prowincja."
 mal_purchase_trade_colony_tt: "§YBędziemy mogli poprosić właściciela jednej z pięciu wybranych prowincji o jej sprzedaż.\nSzansa na to, że właściciel sprzeda nam prowincję, zależy od jego opinii o nas. Im jest ona niższa, tym mniejsze prawdopodobieństwo, że zgodzi się sprzedać wybraną prowincję.§!"
