l_english:
 flavor_eth.29.t: "Wędrowna stolica [Root.GetName]"
 flavor_eth.29.desc: "Stolica [Root.GetName] nigdy nie była stała, gdyż Negusa Nagastowie z [Root.GetName] przenosił swój dwór na obszary, które uważał za stosowne. Podczas gdy system ten zapewniał, że lokalny obszar wokół nowej stolicy znajdował się pod wpływem Solomona, pozostałe prowincje [Root.GetName] były w większości autonomiczne, co powodowało utratę kontroli nad tymi obszarami."
 flavor_eth.29.a: "Rozumiem."
 flavor_eth.30.t: "Ustanowienie stałej stolicy"
 flavor_eth.30.desc: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] zmodernizował państwo [Root.GetName] i założył pierwszą stolicę w [Root.Capital.GetName] w roku [GetYear]. Dodatkowo [Root.Monarch.GetSheHe] rozwiązał spory religijne, które przeciągały ważne decyzje, oraz scentralizował rząd. Osiągnięcia [Root.Monarch.GetHerHisCap] zostaną na zawsze zapamiętane w historii [Root.GetAdjective]."
 flavor_eth.30.a: "Wreszcie. Wędrująca stolica już nie istnieje."
 flavor_eth.30.b: "Niemniej podobała mi się ruchoma stolica."
 flavor_eth.33.t: "Otwarcie Arki Przymierza"
 flavor_eth.33.desc: "Przez tysiące lat nikt nie otworzył prawdziwej Arki Przymierza. Dlatego jej zawartość pozostawała tajemnicą zarówno dla zwykłych wiernych, jak i duchowieństwa, dla którego takie wydarzenie było czymś bez precedensu. Aby zapobiec ewentualnej panice w kraju, [Root.Monarch.GetName] postanowił otworzyć ten legendarny artefakt w pałacu, z dala od ciekawskich spojrzeń tłumów.\nGdy nasz dostojny [Root.Monarch.GetTitle] i [Root.Monarch.GetHerHis] najbliżsi otworzyli pokrytą złotem drewnianą skrzynię, znaleźli w niej to, co zapowiadano: dwie starożytne kamienne tablice z Dziesięciorgiem Przykazań, a także laskę Aarona i naczynie z manną. Nie było to najbardziej spektakularne wydarzenie, lecz z pewnością pełne pobożności. Po potwierdzeniu autentyczności tych artefaktów duchowieństwo ponownie umieściło je w skrzyni i znów ukryło Arkę Przymierza.\nOd tamtego wydarzenia minęło kilka dni i odtąd wiele spraw zdaje się przychodzić naszemu [Root.Monarch.GetTitle] z większą łatwością. Jak gdyby sam Bóg pobłogosławił naszą chwalebną dynastię i pomyślność naszego państwa!"
 flavor_eth.33.a: "Niech Bóg Ojciec nam błogosławi, niech Chrystus się nami opiekuje!"
 flavor_eth.35.t: "Poddani państwa [Root.GetName]"
 flavor_eth.35.desc: "Damot i Hadiya od ponad stu lat są lennikami naszego chwalebnego państwa [Root.GovernmentName]. Choć składane przez nie daniny dobrze nam służyły, na dworze [Root.Monarch.GetName] coraz częściej słychać głosy, że nadszedł czas, by w pełni włączyć je do [Root.GetName]. Ostateczna decyzja o losie tych dwóch państw należy jednak do naszego dobrego [Root.Monarch.GetTitle]."
 flavor_eth.35.a: "Staną się częścią naszego narodu! "
 flavor_eth.35.b: "Są bardziej przydatni jako wasale."
 flavor_eth.37.t: "Przywrócenie chrześcijaństwa w Suakin"
 flavor_eth.37.desc: "Choć miasto poddało się Mamelukom w 1317 roku, wielu wciąż uważało je za ośrodek chrześcijaństwa. Sytuacja ta uległa zmianie, gdy w Suakin zaczęło osiedlać się coraz więcej muzułmańskich imigrantów. Z czasem ostatni pozostali chrześcijanie — nasi bracia i siostry w wierze — zniknęli w mrokach historii. Te czasy dobiegły jednak końca: Suakin ponownie należy do prawdziwie chrześcijańskiego państwa [Root.GovernmentName], a wielu ukrywających się Koptów powróciło na światło dzienne!"
 flavor_eth.37.a: "Błogosławione niech będą te dusze!"
 flavor_eth.38.t: "Adulis, wielki port Aksum"
 flavor_eth.38.desc: "Piaskowcowe mury i opustoszałe, nierówne ulice zdobią ruiny miasta, które niegdyś było klejnotem w koronie starożytnego imperium. Nasi przodkowie widzieliby w tym przygnębiający widok — aż do chwili, gdy ujrzeliby dzieło dumnych i pracowitych mieszkańców [Root.GetName]! W niezwykle krótkim czasie nasi konstruktorzy i budowniczowie przywrócili portowemu miastu dawną świetność, a wielu naszych rodaków osiedla się w nim!"
 flavor_eth.38.a: "Tym razem Adulis przetrwa znacznie dłużej!"
 flavor_eth.39.t: "Przekroczenie granic państwa Aksum"
 flavor_eth.39.desc: "Pierwotnie imperium Aksum obejmowało jedynie Nubię, północne obszary Etiopii oraz południowe wybrzeże Arabii. Jego granice nie mogą się równać z naszymi! [Root.Monarch.GetName] poprowadził nasze państwo [Root.GovernmentName] do wielu zwycięskich bitew i kampanii wojennych. Nie tylko przywróciliśmy dawne imperium, lecz nawet przekroczyliśmy jego granice — imperium, które upadło ponad 400 lat temu!\nPo tych rozległych kampaniach podbojów wielu naszych możnych domaga się oficjalnego powrotu do nazwy „Imperium Aksum”, aby pokazać światu naszą potęgę i zdolność odrodzenia dawnego państwa. Z drugiej strony doradcy [Root.Monarch.GetName] zalecają, byśmy patrzyli w przyszłość. Jaką decyzję podejmie nasz ukochany [Root.Monarch.GetTitle]?"
 flavor_eth.39.a: "Powinniśmy przyjąć dziedzictwo Imperium Aksum!"
 flavor_eth.39.b: "Doradcy mają rację. Musimy odcisnąć własne piętno na tym świecie!"
 flavor_eth.40.t: "Królestwo Semien"
 flavor_eth.40.desc: "W czasach, gdy Imperium Aksum panowało nad tymi ziemiami, żyła tu grupa Żydów, którzy odrzucali prawdziwą wiarę. Sprzeciwili się religijnej deklaracji Ezany i wzniecali bunty przeciwko prawowitemu cesarzowi. Wiele stuleci później żydowska królowa Gudit zebrała armię i ostatecznie zniszczyła Imperium Aksum.\nTo wszystko należy już do odległej przeszłości, lecz Beta Israel nadal pozostają kłopotliwą społecznością — nawet dla [Root.GetName]. Możemy spróbować nawrócić ich na [Root.Religion.GetName], choć musimy liczyć się z silnym oporem ze strony Beta Israel."
 flavor_eth.40.a: "Wskażmy im drogę wiary [Root.Religion.GetName]."
 flavor_eth.40.b: "Nie powinniśmy pogłębiać podziałów między naszymi ludźmi."
 flavor_eth.41.t: "Podróż przez Nil"
 flavor_eth.41.desc: "Zazwyczaj większość naszych ambasadorów podróżuje pieszo do Egiptu, a następnie najlepszym dostępnym statkiem dociera do Europy. Jednak czasami ludzie stają się odważni i próbują różnych sposobów dotarcia do celu. Nasz obecny ambasador jest jednym z nich, ponieważ zabrał kilka galer z naszej potężnej floty i podróżował nimi po Nilu. Na szczęście dla ambasadora, Pan chronił go od niebezpieczeństwa wielkiej rzeki i niewiernych na północy i prowadził go do Morza Śródziemnego."
 flavor_eth.41.a: "Nie sądziłem, że dojdzie tak daleko."
 flavor_eth.42.t: "Kontakt z chrześcijanami!"
 flavor_eth.42.desc: "Po kolejnych 50 dniach podróży ambasador dotarł do celu: nawiązał kontakt z chrześcijanami z Europy! Choć ich poglądy wydają się nam dość heretyckie, nasi dyplomaci cieszą się z ponownego kontaktu z innymi krajami. Co więcej, ci 'katolicy' podzielają nasze ambicje dotyczące krucjaty przeciwko muzułmańskiemu zagrożeniu, co czyni ich potencjalnymi sojusznikami."
 flavor_eth.42.a: "Niech Bóg błogosławi tego ambasadora i naszych nowo odkrytych sojuszników!"
 flavor_eth.43.t: "Dziwny ambasador"
 flavor_eth.43.desc: "Dziś rano nasi strażnicy dostrzegli dziwną grupę trzech galer zmierzających prosto do Rzymu. Gdy ich załogi zapewniły, że przybywają w pokojowych zamiarach, nasza flota przechwytująca pozwoliła im przepłynąć. Okazało się, że są to nasi współwyznawcy, chrześcijanie, którzy eskortują osobliwego ambasadora. Twierdzi on, że dotarł tu z Etiopii, pokonując długą drogę wzdłuż potężnego Nilu.\nAmbasador przybył, by odnowić dawne kontakty między [From.GetName] a Cesarstwem Rzymskim!"
 flavor_eth.43.a: "Etiopia? Chwileczkę... Czyżby był sługą legendarnego Księdza Jana?!"
 flavor_eth.43.a.tt: "Odkryj wszystkie prowincje państwa §Y[From.GetName]§!."
 flavor_eth.44.t: "Sojusz z Portugalczykami?"
 flavor_eth.44.desc: "[Root.GetName] utrzymywało już wcześniej kontakty z Portugalczykami, lecz nigdy nie pragnęliśmy zawierać z nimi sojuszu. Jednak poganie depczą nam po piętach, a katolicki papież nie jest w stanie nam pomóc, więc nasi dyplomaci uznali, że warto sprzymierzyć się z Portugalią. Nasz ambasador czeka jedynie na rozkaz [Root.Monarch.GetName]!"
 flavor_eth.44.a: "Płyń, mój synu, i złóż im naszą ofertę sojuszu!"
 flavor_eth.44.b: "Po namyśle...  Państwo [Root.GetName] radzi sobie lepiej bez nich."
 flavor_eth.45.t: "Prośba państwa [From.GetName] o zawarcie sojuszu"
 flavor_eth.45.desc: "Na dwór [Root.Monarch.GetTitle] [Root.Monarch.GetName] przybył młody dyplomata z obcego kraju, który prosi o audiencję! Jak się okazuje, pochodzi on ze starożytnej krainy [From.GetName]. Jako współwyznawcy chrześcijaństwa, jego mocodawcy wysłali go, by zaproponował nam sojusz.\nDzieli nas zbyt wielka odległość, by [From.GetName] mogło udzielić nam jakiejkolwiek pomocy w Europie, lecz może okazać się użytecznym sprzymierzeńcem w realizacji naszych ambicji na Oceanie Indyjskim."
 flavor_eth.45.a: "Powinniśmy przyjąć ich ofertę."
 flavor_eth.45.a.at: "Państwo §Y[From.GetName]§! uzyska dostęp do kompanii najemników §YPortugalscy muszkieterzy§!, jeśli znajdzie się w stanie wojny z [ADA.GetName], a [ADA.GetName] otrzyma pomoc z zewnątrz."
 flavor_eth.45.b: "Mogą być przydatni, tak, ale są lepsi sojusznicy niż [From.GetName]."
 flavor_eth.46.t: "[From.GetName] akceptuje sojusz"
 flavor_eth.46.desc: "Nasz dyplomata powraca! Z wyrazem podekscytowania w oczach z powodu wykonania swojej pierwszej udanej misji donosi, że Portugalczycy przyjmują ofertę i chcą zostać naszym sojusznikiem!"
 flavor_eth.46.a: "To wspaniała wiadomość!"
 flavor_eth.46.a.at: "Państwo §Y[From.GetName]§! wesprze nas w wojnie z [ADA.GetName], jeśli [ADA.GetName] otrzyma pomoc z zagranicy."
 flavor_eth.47.t: "[From.GetName] odmawia sojuszu"
 flavor_eth.47.desc: "Nasz dyplomata wraca! Młody mężczyzna wygląda na rozczarowanego. Donosi, że Portugalczycy nie są zainteresowani sojuszem z państwem [Root.GetName] i odesłali naszego dyplomatę!"
 flavor_eth.47.a: "Nie martw się. Dałeś z siebie wszystko. To ich strata, nie nasza."
 flavor_eth.48.t: "Modernizacja armii"
 flavor_eth.48.desc: "Dzięki staraniom [Root.Monarch.GetTitle] [Root.Monarch.GetName] nasze armie zdołały się zmodernizować. Nasze wojska w pełni przyswoiły zachodnie metody prowadzenia wojny!\nPoznały strategie francuskiej Wielkiej Armii.\nPrzeszły pruskie szkolenie.\nOtrzymały szwajcarską broń.\nTeraz są gotowe walczyć o chwałę [Root.GetName]!"
 flavor_eth.48.a: "Chwała państwu [Root.GetName]!"
 flavor_eth.49.t: "Wsparcie Osmanów"
 flavor_eth.49.desc: "W wielkiej wojnie etiopsko-adalskiej w 1529 roku, Imperium Osmańskie zawarło sojusz z Sułtanatem Adal, aby pokonać Cesarstwo Etiopii i zgasić ostatni chrześcijański bastion na Rogu Afryki. Chociaż dla Osmanów nie była to wojna na pełną skalę, wspierali Adal kilkoma kompaniami tureckich żołnierzy."
 flavor_eth.49.ada.desc: "Wojna między [Root.GetName] a [ETH.GetName] wciąż trwa. Żadna ze stron nie zyskuje wyraźnej przewagi, a na niektórych frontach wojska [Root.GetAdjective] są nawet spychane do odwrotu. Na szczęście przygotowaliśmy się na taki obrót wydarzeń. Tureccy żołnierze elitarni z Anatolii przybyli do [Root.GetName], by dołączyć do walki z chrześcijańskim zagrożeniem!"
 flavor_eth.49.a: "Niech będą błogosławieni Osmanowie za ich pomoc!"
 flavor_eth.49.a.tt: "Odblokowuje kompanię najemników §YOttomańscy janczarzy§!."
 flavor_eth.50.t: "Wsparcie Portugalczyków"
 flavor_eth.50.desc: "Wojna etiopsko-adalska była katastrofą dla Etiopii. Wiele miast zostało zrównanych z ziemią, stolica została oblężona przez połączone siły Adal i Imperium Osmańskiego, a pozostała armia Etiopii musiała wycofać się w góry. Muzułmanie zakładali, że upadek Etiopii jest tylko kwestią czasu.\nPotem przybył Portugalczyk. W roku 1541 Portugalczycy wysłali dowódcę Cristóvão da Gamę z kompanią wojsk portugalskich, aby pomógł Etiopii i walczył z Imperium Osmańskim. Te nowe wojska pozwoliły Etiopii odwrócić sytuację i pokonać znacznie większą armię muzułmańską, co doprowadziło do białego pokoju w 1543 roku."
 flavor_eth.50.a: "Dzięki Bogu, że przybyli Portugalczycy!"
 flavor_eth.50.a.tt: "Odblokowuje kompanię najemników §YPortugalscy muszkieterzy§!."
 flavor_eth.51.t: "Koniec konfliktów portugalsko-osmańskich"
 flavor_eth.51.desc: "Portugalczycy i Osmanowie od dawna rywalizowali ze sobą, odkąd Imperium Osmańskie zablokowało szlak handlowy prowadzący z Jedwabnego Szlaku do Europy. Do pierwszego otwartego starcia doszło jednak w 1538 roku, gdy Osmanowie wsparli sułtanat Gudźaratu podczas oblężenia Diu. Od tamtej pory te dwie potęgi wielokrotnie prowadziły ze sobą wojny, z których najbardziej znaczącą wojną zastępczą był konflikt etiopsko-adalski.\nPo skromnym zwycięstwie Etiopii Portugalczycy kontynuowali pasmo sukcesów w starciach z Osmanami. W 1559 roku Sulejman I musiał uznać, że odniesienie rozstrzygającego zwycięstwa nad Portugalczykami jest przedsięwzięciem skazanym na niepowodzenie. W rezultacie militarna aktywność obu potęg w Rogu Afryki znacznie osłabła."
 flavor_eth.51.a: "Niech tak będzie."
 flavor_eth.51.a.tt: "Kompania najemników §YOttomańscy janczarzy§! oraz §YPortugalscy muszkieterzy§! nie będzie już dostępna."
 flavor_eth.52.t: "Działalność jezuitów w państwie [Root.GetName]"
 flavor_eth.52.desc: "W latach 1555 i 1557 do Etiopii przybyli pierwsi portugalscy jezuici. Początkowo mieli reprezentować niewielką portugalską społeczność, która rozwijała się w Etiopii od 1543 roku. Z czasem jednak ich wpływy na etiopskim dworze rosły. Doszło do tego, że Kościół katolicki zaczął stanowić realne zagrożenie dla autorytetu Kościoła koptyjskiego, a teraz jezuici próbują nakłonić [Root.Monarch.GetName] do przejścia na katolicyzm! Jak powinniśmy postąpić z tymi obcymi misjonarzami?"
 flavor_eth.52.a: "Wygnamy te pasożyty!"
 flavor_eth.52.b: "Powinni zostać ostrzeżeni!"
 flavor_eth.52.c: "Może mają rację. Powinniśmy nawrócić się na katolicyzm."
 west_african.19.b: "Wiesz, tron [ASH.GetName] wygląda na wygodniejszy od naszego..."
 flavor_mal.2.b: "Hej, zaczekaj! Zabierz mnie ze sobą!"
 flavor_mal.6.a.tt: "Ta opcja odblokuje dla państwa [Root.GetName] §Ymisję religijną§!."
 flavor_mal.6.b.tt: "Ta opcja odblokuje dla państwa [Root.GetName] §Ymisję tolerancji§!."
 flavor_mal.9.t: "Upadek państwa [Root.GetName]"
 flavor_mal.9.d: "Po śmierci Mansy Sulejmana Keity, brata potężnego Mansy Musy, imperium [Root.GetName] przez kolejne dziesięciolecia nieustannie traciło potęgę, wpływy i bogactwo. Wojny domowe, walki o tron i seria nieudolnych mansów podkopały stabilność [Root.GetName]. Dawni poddani, tacy jak Songhaj czy Timbuktu, ogłosili niepodległość, a państwo nadal traci znaczenie."
 flavor_mal.9.a: "Nastały mroczne czasy..."
 flavor_mal.10.t: "Powrót do dawnej chwały dla państwa [Root.GetName]"
 flavor_mal.10.d: "Jakimś cudem państwo [Root.GovernmentName] [Root.GetName] przetrwało wewnętrzne walki o władzę między stronnictwami, przekonało poddanych do pozostania wiernymi mansie, a nawet zjednoczyło dwór królewski. Co więcej, przywróciliśmy dawne granice państwa [Root.GetName] [Root.GovernmentName], a wraz z nimi jego niegdysiejsze wpływy w Afryce Zachodniej.\nTeraz [Root.Monarch.GetTitle] [Root.Monarch.GetName] musi rozszerzyć potęgę i wpływy [Root.GetName], przewyższając nawet osiągnięcia potężnego Mansy Musy!"
 flavor_mal.10.a: "Dla [Root.GetName] nastał nowy świt!"
 flavor_mal.11.t: "[Root.mal_pretender.GetName] wyzywa [Root.Monarch.GetRulerGen]!"
 flavor_mal.11.d: "Od śmierci Sulejmana walki o tron są w [Root.GetName] na porządku dziennym. Nie dziwi zatem, że ambitny generał [Root.mal_pretender.GetName] próbuje obalić [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Generał zebrał armię i oblega teraz prowincję [mal_pretender_province.GetName]."
 flavor_mal.11.a: "Śmiesz rzucać mi wyzwanie?"
 flavor_mal.12.t: "Bunt [Root.GetNobilityOrFallbackName_gen] w prowincji [mal_disaster_estate_province.GetName]!"
 flavor_mal.12.d: "Od czasu naszego upadku [Root.GetNobilityOrFallbackName] stali się nadmiernie ambitni i próbują przejąć prowincję [mal_disaster_estate_province.GetName] na własny użytek."
 flavor_mal.12.a: "Zmiażdżymy ich!"
 flavor_mal.12.b: "Prowincja [mal_disaster_estate_province.GetName] nie jest warta zachodu."
 flavor_mal.13.t: "Bunt [Root.GetClergyName_gen] w prowincji [mal_disaster_estate_province.GetName]!"
 flavor_mal.13.d: "[Root.GetClergyName] wyrazili niezadowolenie z przebiegu nawracania wiejskiej ludności wyznającej fetyszyzm oraz z braku pobożności na dworze. W nadziei na przejęcie władzy nad [Root.GetName] wzniecili teraz bunt w prowincji [mal_disaster_estate_province.GetName]!"
 flavor_mal.13.a: "Zmiażdżymy ich!"
 flavor_mal.13.b: "Prawdopodobnie powinniśmy ich wysłuchać."
 flavor_mal.14.t: "Bunt [Root.GetDhimmiName_gen] w prowincji [mal_disaster_estate_province.GetName]!"
 flavor_mal.14.d: "[Root.GetDhimmiName] wyrazili niezadowolenie z muzułmańskiej hierarchii i zażądali większych praw dla wiejskiej ludności wyznającej fetyszyzm. W nadziei na przejęcie władzy nad [Root.GetName] wzniecili teraz bunt w prowincji [mal_disaster_estate_province.GetName]!"
 flavor_mal.14.a: "Zmiażdżymy ich!"
 flavor_mal.14.b: "Prawdopodobnie powinniśmy ich wysłuchać."
 flavor_mal.15.t: "Bunt [Root.GetBurghersOrFallbackName_gen] w prowincji [mal_disaster_estate_province.GetName]!"
 flavor_mal.15.d: "Od czasu naszego upadku [Root.GetBurghersOrFallbackName] stali się nadmiernie ambitni i próbują przejąć prowincję [mal_disaster_estate_province.GetName] na własny użytek."
 flavor_mal.15.a: "Zmiażdżymy ich!"
 flavor_mal.15.b: "Prowincja [mal_disaster_estate_province.GetName] nie jest warta zachodu."
 flavor_mal.16.t: "Prowincja [mal_disaster_independent_province.GetName] żąda niepodległości!"
 flavor_mal.16.d: "Prowincja [mal_disaster_independent_province.GetName] oficjalnie przestała uznawać władzę [Root.Monarch.GetName] i zażądała ponownego przyłączenia do państwa [mal_original_owner.GetName]!"
 flavor_mal.16.a: "Prędzej zginę!"
 flavor_mal.16.b: "Jasne. Zejdź mi z oczu."
 flavor_mal.17.t: "Kaabu żąda niepodległości!"
 flavor_mal.17.d: "Mieszkańcy Kaabu czują się coraz bardziej lekceważeni przez [Root.Monarch.GetTitle] i pragną teraz utworzyć własne państwo. Na dworze [Root.Monarch.GetName] dyplomata z Kaabu przedstawił [Root.Monarch.GetTitle] ultimatum: albo przyznamy Kaabu niepodległość, albo jego mieszkańcy będą walczyć o wolność."
 flavor_mal.17.a: "W takim razie zginiecie za swoją niepodległość!"
 flavor_mal.17.b: "Kaabu i tak nie było nam potrzebne."
 flavor_mal.18.t: "Dżolof domaga się niepodległości"
 flavor_mal.18.d: "Podbój Dżolofu nie był łatwym zadaniem dla upadającego królestwa. Jeszcze trudniej jest utrzymać ludność Dżolofu w ryzach. Wraz z naszym szybkim upadkiem, nacjonaliści z Dżolofu uzbroili się i domagają się natychmiastowego uwolnienia i niepodległości!"
 flavor_mal.18.a: "A więc zginiesz za swoją niepodległość!"
 flavor_mal.18.b: "Dżolof i tak nie był nam potrzebny."
 flavor_mal.19.t: "Jenné żąda niepodległości!"
 flavor_mal.19.d: "Miasto Jenné było niegdyś lennikiem imperium [Root.GetName]. Nasz upadek doprowadził jednak do jego uniezależnienia, a mieszkańcy tego ośrodka handlowego zdążyli się do tego przyzwyczaić. Nic dziwnego, że nasz uzasadniony podbój miasta nie spotkał się z ich aprobatą. Mieszkańcy uzbroili się po zęby i żądają przywrócenia niepodległości!"
 flavor_mal.19.a: "W takim razie zginiecie za swoją niepodległość!"
 flavor_mal.19.b: "To miasto i tak nie jest nam potrzebne..."
 flavor_mal.20.t: "Kong żąda niepodległości!"
 flavor_mal.20.d: "Podbój Konga nie był łatwym zadaniem dla upadającego królestwa. Jeszcze trudniej jest utrzymać ludność Konga w ryzach. Wraz z naszym szybkim upadkiem, kongijscy nacjonaliści uzbroili się i domagają się natychmiastowego uwolnienia i niepodległości!"
 flavor_mal.20.a: "A więc umrzesz za swoją niezależność!"
 flavor_mal.20.b: "I tak nie potrzebowaliśmy Konga."
 flavor_mal.21.t: "Poddani odrzucają władzę [Root.Monarch.GetTitle]!"
 flavor_mal.21.d: "Nasz nieustanny upadek zniszczył wszelkie zaufanie poddanych do stabilności naszego państwa. Teraz zwracają się przeciwko [Root.Monarch.GetTitle] i czekają na odpowiedni moment, by uderzyć..."
 flavor_mal.21.a: "Zdrajcy!"
 flavor_mal.22.t: "Chłopi [Root.GetAdjective] buntują się w prowincji [mal_disaster_peasant_province.GetName]!"
 flavor_mal.22.d: "Chłopi z prowincji [mal_disaster_peasant_province.GetName] mają dość niestabilnej sytuacji i wypowiedzieli wojnę pozbawionemu poparcia [Root.Monarch.GetTitle]!"
 flavor_mal.22.a: "Głupcy! Sami jesteście częścią problemu!"
 flavor_mal.22.b: "Po prostu przyznajmy im pewne ustępstwa. To ich zadowoli."
 flavor_mal.23.t: "Skandal w [Root.GetName]"
 flavor_mal.23.d: "Skandal na dworze [Root.Monarch.GetTitle] wywołał oburzenie wśród naszej elity. Stabilność [Root.GetName] jest zagrożona!"
 flavor_mal.23.a: "Przynajmniej nie grozi nam nuda..."
 flavor_mal.24.t: "Poszukiwania zaginionej floty"
 flavor_mal.24.desc: "Choć opowieści o Ko Mamadim są jedynie legendą związaną z Mansą Musą, wciąż rozpalają wyobraźnię wielu młodych i żądnych przygód żeglarzy naszego państwa. Jeden z nich zgodził się nawet poprowadzić niebezpieczną wyprawę na zachód w nadziei na odnalezienie szczątków floty Ko Mamadiego i odkrycie, jaki los spotkał samego Ko Mamadiego."
 flavor_mal.24.a: "Cóż, nie będę cię powstrzymywać przed wyprawą na pewną śmierć."
 flavor_mal.25.t: "ODKRYTO LĄD!"
 flavor_mal.25.desc: "Do [Root.Monarch.GetTitle] dotarły niewiarygodne wieści! Wyprawa odkrywcza zakończyła się sukcesem i rzeczywiście coś odnalazła, lecz przerosło to wszystko, co [Root.GetName] mogło sobie wyobrazić: podróżnicy odkryli nowe, niezbadane ziemie za zachodnioafrykańskim morzem! Dalsze badania wykazały, że nie jest to wyspa, lecz ogromny kontynent.\nŻeglarze osiedlili się na wybrzeżu, które nazwali „[755.GetName]”, i są gotowi szukać na tym nowym lądzie śladów Ko Mamadiego."
 flavor_mal.25.a: "Szukaliśmy spróchniałego drewna, a znaleźliśmy diamenty!"
 flavor_mal.26.t: "Wysokiej jakości kość słoniowa z [Root.GetName]"
 flavor_mal.26.desc: "[Root.GetName] zawsze słynęło z bogactwa płynącego ze złota, lecz teraz zasłynęliśmy również z handlu i produkcji kości słoniowej! Eksportujemy najlepszą kość słoniową, a na rynkach europejskich i azjatyckich nasze towary cieszą się ogromnym powodzeniem!"
 flavor_mal.26.a: "Wspaniale!"
 flavor_mal.27.t: "Wysokiej jakości kość słoniowa z państwa [From.GetName]"
 flavor_mal.27.desc: "Państwo [From.GetName] zawsze słynęło z bogactwa płynącego ze złota, lecz teraz zasłynęło również z handlu i produkcji kości słoniowej! Najwyższej jakości kość słoniowa z tego kraju trafiła na rynki europejskie i azjatyckie, wywołując ogromne zainteresowanie tym cennym surowcem!"
 flavor_mal.27.a: "Dobrze."
 flavor_mal.28.t: "Los Timbuktu"
 flavor_mal.28.desc: "Miasto Timbuktu odgrywało ważną rolę w Afryce Zachodniej i niegdyś stanowiło główne połączenie między Europą a regionem Sahelu. Teraz, gdy odzyskaliśmy kontrolę nad miastem, rozgorzała dyskusja, czy nie powinniśmy przenieść naszej stolicy do tego kluczowego ośrodka handlowego..."
 flavor_mal.28.a: "Uczyńmy Timbuktu naszą stolicą."
 flavor_mal.28.b: "Powinniśmy raczej rozbudować obecną stolicę."
 can_colonize_the_strait_tt: "Odblokowana zostanie decyzja, która pozwoli nam skolonizować prowincję §Y[1127.GetName]§!."
 can_colonize_djado_and_tajarhi_tt: "Odblokowana zostanie decyzja, która pozwoli nam skolonizować prowincje §Y[2474.GetName]§! oraz §Y[2475.GetName]§!."
 flavor_mal.29.t: "Wielki Meczet w Dżenne"
 flavor_mal.29.desc: "Wielki Meczet w Dżenne jest regionalnym cudem, a wielu przedstawicieli naszych wyższych warstw społecznych pielgrzymuje do tej świętej budowli, by się modlić. Ostatnio meczet popadł jednak w ruinę. Na szczęście dla miasta i zabytku nasi [Root.GetClergyName] przeznaczyli znaczną część swoich zasobów na odnowienie meczetu i nawracanie miejscowej ludności."
 flavor_mal.29.a: "Niech będzie błogosławiony [Root.GetClergyName]."
 flavor_mal.30.t: "[Root.GetName] i Songhaj"
 flavor_mal.30.desc: "Przed 1430 rokiem ziemie Songhaju były naszymi poddanymi. W 1430 roku, wskutek problemów i walk wewnętrznych w ojczyźnie, państwo [Root.GetName] utraciło kontrolę nad bogatym miastem Gao, które wraz z okolicznymi ziemiami zbuntowało się przeciwko nam. Ziemie te przejęła dynastia Sonni, a ich władcy ogłosili powstanie własnego państwa, rzucającego wyzwanie naszej potędze.\nTeraz to już przeszłość. Gao ponownie znajduje się pod naszą kontrolą, a większość osób utożsamiających się z ludem Songhaj znów jest naszymi poddanymi."
 flavor_mal.30.a: "Tak właśnie powinno być."
 flavor_mal.30.a.tt: "Każda posiadana prowincja kultury §YSonghaj§! otrzyma §G-30§! lat separatyzmu."
 flavor_mal.31.t: "[Root.GetName] i Maghreb"
 flavor_mal.31.desc: "Maghreb jest ojczyzną wieloletniego partnera handlowego państwa [Root.GetName], choć sytuacja może wkrótce ulec zmianie, ponieważ tamtejsze kraje znalazły się w trudnym położeniu wobec zagrożenia ze strony Iberii. Nasi współwyznawcy najwyraźniej słyszeli wspaniałe opowieści o Mansie Musie i proszą nas teraz o wsparcie w postaci złota lub kości słoniowej. Oczywiście taka pomoc jest kosztowna, lecz możliwość zawarcia sojuszu na północy może być tego warta."
 flavor_mal.31.a: "Wyślijmy im pomoc w postaci złota."
 flavor_mal.31.b: "Wesprzyjmy ich kością słoniową."
 flavor_mal.31.c: "Zatrzymajmy złoto i kość słoniową dla siebie."
 flavor_mal.32.t: "Liczne możliwości założenia europejskich faktorii handlowych"
 flavor_mal.32.desc: "Europa jest rozległym kontynentem, na którym można by wybrać wiele miejsc na założenie faktorii. Jednak na radę ministra [Root.Monarch.GetTitle] [Root.Monarch.GetName] ograniczyliśmy listę potencjalnych prowincji do tych pięciu."
 flavor_mal.32.a: "Złóżmy państwu [226.Owner.GetName] ofertę zakupu prowincji [226.GetName]."
 flavor_mal.32.a.tt: "Zaoferujemy państwu §Y[226.Owner.GetName]§! §Y2000§! dukatów za prowincję §Y[226.GetName]§!."
 flavor_mal.32.b: "Złóżmy państwu [1247.Owner.GetName] ofertę zakupu prowincji [1247.GetName]."
 flavor_mal.32.b.tt: "Zaoferujemy państwu §Y[1247.Owner.GetName]§! §Y2000§! dukatów za prowincję §Y[1247.GetName]§!."
 flavor_mal.32.c: "Złóżmy państwu [126.Owner.GetName] ofertę zakupu prowincji [126.GetName]."
 flavor_mal.32.c.tt: "Zaoferujemy państwu §Y[126.Owner.GetName]§! §Y2000§! dukatów za prowincję §Y[126.GetName]§!."
 flavor_mal.32.d: "Złóżmy państwu [4559.Owner.GetName] ofertę zakupu prowincji [4559.GetName]."
 flavor_mal.32.d.tt: "Zaoferujemy państwu §Y[4559.Owner.GetName]§! §Y2000§! dukatów za prowincję §Y[4559.GetName]§!."
 flavor_mal.32.e: "Złóżmy państwu [102.Owner.GetName] ofertę zakupu prowincji [102.GetName]."
 flavor_mal.32.e.tt: "Zaoferujemy państwu §Y[102.Owner.GetName]§! §Y2000§! dukatów za prowincję §Y[102.GetName]§!."
 flavor_mal.32.f: "Powinniśmy poczekać na lepszy moment na zakup."
 flavor_mal.32.f.tt: "Nikt nie otrzyma oferty. W późniejszym terminie będziemy mogli kupić europejską kolonię handlową."
 flavor_mal.32.g: "Zakup? Przecież już wszystkie należą do nas!"
 mal_will_accept_offer: "Państwo §Y[This.GetName]§! §Gprzyjmie§! ofertę."
 mal_will_probably_accept_offer: "Państwo §Y[This.GetName]§! §Gprawdopodobnie przyjmie§! ofertę."
 mal_could_accept_offer: "Państwo §Y[This.GetName]§! §Ymoże przyjąć ofertę, ale nie musi§!."
 mal_will_probably_not_accept_offer: "Państwo §Y[This.GetName]§! §Rraczej nie przyjmie§! oferty."
 mal_will_naver_accept_offer: "Państwo §Y[This.GetName]§! §Rnie przyjmie§! oferty."
 mal_offer_outcome_unkonwn: "Nie możemy przewidzieć, czy państwo §Y[This.GetName]§! przyjmie ofertę."
 flavor_mal.33.t: "Oferta złota od państwa [From.GetName]"
 flavor_mal.33.desc: "Na dwór [Root.Monarch.GetName] przybył ambasador odziany w [From.GetAdjective] szaty! Już samo to jest niezwykłym wydarzeniem, lecz ambasador pokazuje naszemu [Root.Monarch.GetTitle] również skrzynię pełną złota! Proponuje układ, w ramach którego otrzymamy tę ogromną sumę w zamian za prowincję [mal_colony_to_buy.GetName]. Wspomina też, że jeśli nie przyjmiemy złota, [From.Monarch.GetName] może być „lekko rozczarowany”..."
 flavor_mal.33.a: "Cóż, z przyjemnością przyjmę złoto. Serdecznie dziękuję."
 flavor_mal.33.b: "Niech więc będzie rozczarowany! Prowincja [mal_colony_to_buy.GetName] pozostanie w naszych rękach!"
 flavor_mal.34.t: "Państwo [From.GetName] przyjmuje ofertę!"
 flavor_mal.34.desc: "Dobre wieści, mój [Root.Monarch.GetTitle]: [From.Monarch.GetTitle] [From.Monarch.GetName] przyjął naszą hojną ofertę i odstąpił nam prowincję [mal_colony_to_buy.GetName]!"
 flavor_mal.34.a: "Wspaniale!"
 flavor_mal.35.t: "Państwo [From.GetName] odrzuca ofertę!"
 flavor_mal.35.desc: "Złe wieści, mój [Root.Monarch.GetTitle]: [From.Monarch.GetTitle] [From.Monarch.GetName] odrzucił naszą hojną ofertę i pozostawia prowincję [mal_colony_to_buy.GetName] pod kontrolą państwa [From.GetAdjective]."
 flavor_mal.35.a: "Cóż, istnieją inne sposoby zdobycia kolonii niż samo złoto..."
 flavor_mal.36.t: "Napływ złota z państwa [Root.GetName]"
 flavor_mal.36.desc: "Wraz ze wzrostem wpływów [Root.GetName] w Europie i rozwojem jego handlu na europejski rynek napłynęły oszałamiające ilości złota. Wiele kopalń jest obecnie zamykanych, ponieważ ich eksploatacja przestała być opłacalna, a ilość dukatów na europejskim rynku osiągnęła nowy szczyt."
 flavor_mal.36.a: "Proszę, weźcie moje złoto, nalegam!"
 flavor_mal.36.a.tt: "Wszystkie prowincje złotonośne kontrolowane przez państwo §Yeuropejskie§! lub jego poddanych otrzymają modyfikator „§YZamknięta kopalnia§!” na §Y15§! lat, zapewniający następujący efekt:\nWydajność produkcji: §R-1000,0%§!"
 flavor_mal.36.a.at: "Każde państwo europejskie otrzyma §R+1,5§! inflacji za każdy procent dochodu z handlu w stosunku do całkowitego dochodu."
 flavor_mal.36.a.bt: "Państwa graczy i ich poddani otrzymają zamiast tego jedynie §R+0,15§! inflacji za każdy procent dochodu z handlu w stosunku do całkowitego dochodu."
 flavor_mal.37.t: "Hojna pielgrzymka [Root.Monarch.GetName]"
 flavor_mal.37.desc: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] udał się do wielkiego miasta [385.GetName]. Podobnie jak niegdyś wielki Mansa Musa, obecny [Root.Monarch.GetTitle] przywiózł do miasta bogactwa [Root.GetName] — tym razem jednak znacznie mniej złota, gdyż [Root.Monarch.GetSheHe] nie chciał zaszkodzić naszym współwyznawcom.\nPo przybyciu do miasta [Root.GetClergyName] zalecili przekazanie złota na budowę wielkiego meczetu, który uzupełniłby wspaniałość świętej Kaaby. Niektórzy bardziej współczujący doradcy sugerowali natomiast zainwestowanie w kantor w [385.GetName], aby ubodzy mogli z pomocą Allaha sami poprawić swój los."
 flavor_mal.37.a: "W [385.GetName] powstanie wielki meczet!"
 flavor_mal.37.a.tt: "[Root.Monarch.GetName] przeznaczy swoje pieniądze na budowę §YWielkiego meczetu§! w [385.GetName]."
 flavor_mal.37.b: "Ubodzy potrzebują większej pomocy niż [Root.GetClergyName]!"
 flavor_mal.37.b.tt: "[Root.Monarch.GetName] przeznaczy swoje pieniądze na budowę §YKantoru§! w [385.GetName]."
 flavor_mal.38.t: "[From.Monarch.GetName] przekazuje złoto na budowę wielkiego meczetu!"
 flavor_mal.38.desc: "Hojny [From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.GetName] odbył pielgrzymkę do naszego świętego miasta [385.GetName] i przekazał niewyobrażalne ilości złota na budowę nowego wielkiego meczetu, który uzupełniłby świętą Kaabę!"
 flavor_mal.38.a: "Niech będzie błogosławiona [From.Monarch.GetHerHis] mądrość!"
 flavor_mal.39.t: "[From.Monarch.GetName] przekazuje złoto na budowę kantoru!"
 flavor_mal.39.desc: "Hojny [From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.GetName] odbył pielgrzymkę do naszego świętego miasta [385.GetName] i przekazał ogromne ilości złota na budowę nowego kantoru, który zapewni pracę i wsparcie ubogim!"
 flavor_mal.39.a: "Niech będzie błogosławione [From.Monarch.GetHerHis] serce!"
 flavor_mal.40.t: "Nowy szlak pielgrzymkowy"
 flavor_mal.40.desc: "Wielu naszych mansów odbywało w przeszłości pielgrzymki do Mekki. Za każdym razem wybierali tradycyjną drogę przez Egipt i spędzali czas w świecie arabskim. Choć jest to najbezpieczniejsza i najszybsza trasa, nie należy do szczególnie ekscytujących. Taka pielgrzymka nie różniłaby się od wielu innych.\nDwór wpadł jednak na nowy pomysł: wielką podróż do Mekki przez świat chrześcijański, aby podziwiać cuda Europy."
 flavor_mal.40.a: "Nie mogę się doczekać, by zobaczyć Europę!"
 flavor_mal.40.a.tt: "[Root.Monarch.GetName] uda się do Mekki trasą prowadzącą przez Europę.\n§YPielgrzymka może zakończyć się przedwcześnie, jeśli [Root.Monarch.GetName] umrze podczas podróży.§!"
 flavor_mal.40.b: "Uważam, że pielgrzymkę na taką skalę powinni odbyć moi doradcy."
 flavor_mal.40.b.tt: "Doradcy [Root.Monarch.GetName] wybiorą trasę prowadzącą przez Europę."
 flavor_mal.40.c: "Wolę jednak tradycyjny szlak."
 flavor_mal.40.c.tt: "[Root.Monarch.GetName] wybierze tradycyjną trasę do Mekki."
 GREAT_PILGRIMAGE: "Wielka pielgrzymka"
 GREAT_TOUR: "Wielka podróż"
 flavor_mal.41.t: "[Root.GetMaliPigrimageTour]"
 mal_visiting_foreign_regional_power: "\n\nGrupa odwiedziła w końcu wspaniałe miasto [selected_biggest_country_of_region.Capital.GetName], stolicę państwa [selected_biggest_country_of_region.GetName]. Kultura [selected_biggest_country_of_region.Culture.GetName] przyciągnęła uwagę podróżników, a gościnność gospodarzy tak zaimponowała najbliższym [Root.Monarch.GetName], że zasugerowali przekazanie części naszego wspaniałego złota [selected_biggest_country_of_region.Monarch.GetTitle] państwa [selected_biggest_country_of_region.GetName]."
 flavor_mal.41.mansa.maghreb: "Po długiej podróży przez gorącą Saharę nasz [Root.Monarch.GetTitle] i [Root.Monarch.GetHerHis] najbliżsi towarzysze dotarli do górzystego Maghrebu. [Root.Monarch.GetName] spędził [Root.Monarch.GetHerHis] czas, zwiedzając wspaniałe ufortyfikowane miasto Ajt Bin Haddu w Demnacie. [Root.Monarch.GetSheHeCap] poznał bogactwo kultur Maghrebu i zakupił kilka ksiąg — najważniejszą z nich były pisma Ibn Sa'ida al-Maghribiego.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.iberia: "Pielgrzymka trwała dalej i grupa [Root.Monarch.GetName] dotarła następnie na Półwysep Iberyjski, ojczyznę upadłego sułtanatu Andaluzji. Podróżnicy podziwiali piękno Alhambry. Choć chrześcijanie na Półwyspie Iberyjskim są bardzo religijni i nie ufają ludziom takim jak my, tolerowali naszą obecność, gdy [Root.Monarch.GetTitle] wyjaśnił im [Root.Monarch.GetHerHis] sytuację. Oczywiście pomogło również przywiezione przez nas złoto...[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.france: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] towarzysze wkroczyli do Francji, krainy wielu krzyżowców, którzy próbowali prowadzić wojny przeciwko światu muzułmańskiemu. Dziś jednak nie zostanie dobyty żaden miecz, gdyż podróżujący [Root.Monarch.GetTitle] ogłosił mieszkańcom [Root.Monarch.GetHerHis] pokojowe zamiary pielgrzymki. Francuzi powitali mądrego [Root.Monarch.GetTitle], a na znak gościnności pozwolili nawet [Root.Monarch.GetHerHim] wejść do imponującej katedry Notre-Dame.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.italy: "[Root.Monarch.GetTitle] dotarł w końcu do Italii. [Root.Monarch.GetSheHeCap] i [Root.Monarch.GetHerHis] poddani starali się uzyskać audiencję u wielkiego papieża, głowy chrześcijaństwa, lecz nawet [Root.GetAdjective] złoto nie zdołało przekonać świętego męża do spotkania z [Root.Monarch.GetName]. Mimo to pobyt w Italii pozwolił [Root.Monarch.GetTitle] lepiej poznać wierzenia chrześcijańskie.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.south_germany: "Mimo ogromnych wysokości i surowych warunków pogodowych grupa [Root.Monarch.GetName] zdołała przekroczyć Alpy i dotarła na ziemie osławionego Świętego Cesarstwa Rzymskiego. Stan tego imperium przypomniał [Root.Monarch.GetTitle] sytuację, w jakiej niegdyś znalazło się nasze wielkie państwo [Root.GovernmentName]. [Root.Monarch.GetSheHeCap] współczuje [Emperor.Monarch.GetTitle] i przesłał [Emperor.Monarch.GetHerHis] najlepsze życzenia w przezwyciężeniu wewnętrznych konfliktów podupadającego imperium.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.balkans: "Podróż przez Bałkany była spotkaniem z wielką różnorodnością kulturową: Słowianie południowi, Włosi, Grecy, a wreszcie Osmanowie — wszyscy w jednym regionie. Ostatecznie [Root.Monarch.GetName] stanął przed wspaniałą Hagia Sophią w [151.GetName], podziwiając jej majestat.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.anatolia: "Ojczyzna Turków osmańskich — piękne ziemie Anatolii. Wkraczając do tego regionu, grupa [Root.Monarch.GetName] powróciła do świata muzułmańskiego, a pielgrzymka zbliża się ku końcowi.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.mashriq: "Po przemierzeniu Anatolii [Root.Monarch.GetTitle] znalazł [Root.Monarch.GetHerselfHimself] na pustyniach Maszriku. W drodze do Egiptu [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] świta dotarli do świętego miasta Jerozolimy, niezwykle ważnego dla Żydów, chrześcijan i muzułmanów, gdzie spędzili wiele godzin na modlitwie.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.egypt: "Egipt nie jest obcą krainą dla [Root.Monarch.GetTitle] państwa [Root.GetName]. Wielu naszych przodków podziwiało wielką piramidę Cheopsa. Nic więc dziwnego, że również [Root.Monarch.GetName] odwiedził tę piramidę.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.arabia: "Po wielu latach podróży wielki i mądry [Root.Monarch.GetTitle] oraz najbliżsi spośród [Root.Monarch.GetHerHis] wyznawców dotarli wreszcie do najświętszego z miast: [385.GetName]! Mieszkańcy wciąż pamiętają ostatnią pielgrzymkę [Root.GetAdjective], dlatego powitali [Root.Monarch.GetName] z otwartymi ramionami.\nPrzez kolejne dwa tygodnie [Root.Monarch.GetTitle] modlił się w mieście i spisywał doświadczenia z pielgrzymki. Przed powrotem do domu [Root.Monarch.GetSheHe] postanowił pozostawić mieszkańcom [385.GetName] pożegnalny dar.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.horn_of_africa: "Choć grupa doskonale znała drogę powrotną do domu, [Root.Monarch.GetName] postanowił wybrać alternatywną trasę. Przepływając przez cieśninę [1330.GetName], [Root.Monarch.GetSheHe] i [Root.Monarch.GetHerHis] towarzysze dotarli do krainy człowieka zwanego Księdzem Janem.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.mansa.home: "Ponad pięć lat temu wielki [Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] rozpoczął [Root.Monarch.GetHerHis] pielgrzymkę do [385.GetName]. Podjęto jednak śmiałą decyzję, by poprowadzić trasę przez Europę zamiast wybrać najszybszą drogę, pozwalając [Root.Monarch.GetTitle] zobaczyć i poznać rzeczy, których [Root.Monarch.GetSheHe] nigdy wcześniej by nie doświadczył.\nPo tak długim czasie [Root.Monarch.GetName] wreszcie powrócił do [Root.Capital.GetName]!"
 flavor_mal.41.advisor.maghreb: "Po długiej podróży przez gorącą Saharę trzej doradcy dotarli do górzystego Maghrebu. Spędzili czas, zwiedzając wspaniałe ufortyfikowane miasto Ajt Bin Haddu w Demnacie. Poznali bogactwo kultur Maghrebu i zakupili kilka ksiąg — najważniejszą z nich były pisma Ibn Sa'ida al-Maghribiego.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.iberia: "Pielgrzymka trwała dalej i grupa doradców dotarła następnie na Półwysep Iberyjski, ojczyznę upadłego sułtanatu Andaluzji. Podróżnicy podziwiali piękno Alhambry. Choć chrześcijanie na Półwyspie Iberyjskim są bardzo religijni i nie ufają ludziom takim jak my, tolerowali naszą obecność, gdy trzej pielgrzymi wyjaśnili im swoją sytuację. Oczywiście pomogło również przywiezione przez nas złoto...[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.france: "Doradcy wkroczyli do Francji, krainy wielu krzyżowców, którzy próbowali prowadzić wojny przeciwko światu muzułmańskiemu. Dziś jednak nie zostanie dobyty żaden miecz, gdyż podróżnicy ogłosili mieszkańcom pokojowe zamiary pielgrzymki. Francuzi powitali trzech uczonych, a na znak gościnności pozwolili im nawet wejść do imponującej katedry Notre-Dame.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.italy: "Grupa dotarła w końcu do Italii. Trzej pielgrzymi starali się uzyskać audiencję u wielkiego papieża, głowy chrześcijaństwa, lecz nawet [Root.GetAdjective] złoto nie zdołało przekonać świętego męża do spotkania z nimi. Mimo to pobyt w Italii pozwolił im lepiej poznać wierzenia chrześcijańskie.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.south_germany: "Mimo ogromnych wysokości i surowych warunków pogodowych grupa doradców zdołała przekroczyć Alpy i dotarła na ziemie osławionego Świętego Cesarstwa Rzymskiego. Stan tego imperium przypomniał im sytuację, w jakiej niegdyś znalazło się nasze wielkie państwo [Root.GovernmentName]. Współczują [Emperor.Monarch.GetTitle] i przesłali [Emperor.Monarch.GetHerHis] najlepsze życzenia w przezwyciężeniu wewnętrznych konfliktów podupadającego imperium.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.balkans: "Podróż przez Bałkany była spotkaniem z wielką różnorodnością kulturową: Słowianie południowi, Włosi, Grecy, a wreszcie Osmanowie — wszyscy w jednym regionie. Ostatecznie trzej uczeni stanęli przed wspaniałą Hagia Sophią w [151.GetName], podziwiając jej majestat.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.anatolia: "Ojczyzna Turków osmańskich — piękne ziemie Anatolii. Wkraczając do tego regionu, grupa powróciła do świata muzułmańskiego, a pielgrzymka zbliża się ku końcowi.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.mashriq: "Po przemierzeniu Anatolii trzej pielgrzymi znaleźli się na pustyniach Maszriku. W drodze do Egiptu dotarli do świętego miasta Jerozolimy, niezwykle ważnego dla Żydów, chrześcijan i muzułmanów, gdzie spędzili wiele godzin na modlitwie.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.egypt: "Egipt nie jest obcą krainą dla [Root.Monarch.GetTitle] państwa [Root.GetName]. Wielu naszych przodków podziwiało wielką piramidę Cheopsa. Nic więc dziwnego, że również trzej podróżnicy odwiedzili tę piramidę.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.arabia: "Po wielu latach podróży trzej mędrcy dotarli wreszcie do najświętszego z miast: [385.GetName]! Mieszkańcy wciąż pamiętają ostatnią pielgrzymkę [Root.GetAdjective], dlatego powitali przybyszów z otwartymi ramionami.\nPrzez kolejne dwa tygodnie pielgrzymi modlili się w mieście i spisywali doświadczenia byłych doradców z pielgrzymki. Przed powrotem do domu postanowili pozostawić mieszkańcom [385.GetName] pożegnalny dar.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.horn_of_africa: "Choć grupa doskonale znała drogę powrotną do domu, podróżnicy postanowili wybrać alternatywną trasę. Przepływając przez cieśninę [1330.GetName], trzej mężczyźni dotarli do krainy człowieka zwanego Księdzem Janem.[Root.GetMaliRegionalCapital]"
 flavor_mal.41.advisor.home: "Ponad pięć lat temu trzej wielcy doradcy potężnego [Root.Monarch.GetTitle] [Root.Monarch.GetName] z dynastii [Root.Monarch.Dynasty.GetName] wyruszyli w imieniu swojego [Root.Monarch.GetTitle] na pielgrzymkę do [385.GetName]. Podjęto jednak śmiałą decyzję, by poprowadzić trasę przez Europę zamiast wybrać najszybszą drogę, pozwalając tym mężom zobaczyć i poznać rzeczy, których [Root.Monarch.GetSheHe] nigdy wcześniej by nie doświadczył.\nPo tak długim czasie wreszcie powrócili do [Root.Capital.GetName]! Choć po pielgrzymce nie mogą już pełnić obowiązków doradców, ich mądrość będzie oświecać [Root.Monarch.GetName]!"
 flavor_mal.41.a: "Mieszkańcy państwa [selected_biggest_country_of_region.GetName] z pewnością zasługują na hojną darowiznę!"
 flavor_mal.41.a.tt: "Państwo [Root.GetName] przekaże złoto państwu [selected_biggest_country_of_region.GetName].\nDarowizna wyniesie §R[Root.mal_money_to_give_tt.GetValue]§! dukatów dla państwa [selected_biggest_country_of_region.GetName]. Jeśli zostanie przyjęta, inflacja w państwie [selected_biggest_country_of_region.GetName] wzrośnie o §R[Root.trade_income_variable_tt.GetValue]§!, lecz koszty budynków, wielkich projektów, armii i floty zostaną zmniejszone o §G25,0%§! na §Y5 lat§!.\n\nWskutek napływu [Root.GetAdjective] złota każde państwo ze stolicą w regionie [selected_biggest_country_of_region.Capital.GetRegionName] otrzyma modyfikator „§YZłoto Mali§!” na §Y5 lat§!, zapewniający następujący efekt:\nRoczna redukcja inflacji: §R-1,00§!"
 flavor_mal.41.b: "Nieco złota dla mieszkańców regionu powinno wystarczyć."
 flavor_mal.41.b.tt: "Wskutek napływu [Root.GetAdjective] złota każde państwo ze stolicą w regionie [selected_biggest_country_of_region.Capital.GetRegionName] otrzyma modyfikator „§YZłoto Mali§!” na §Y5 lat§!, zapewniający następujący efekt:\nRoczna redukcja inflacji: §R-1,00§!"
 flavor_mal.41.c: "Nie stać nas na żadną darowiznę."
 flavor_mal.41.c.tt: "Żadne [Root.GetAdjective] złoto nie zasili gospodarki regionu [selected_biggest_country_of_region.Capital.GetRegionName]."
 flavor_mal.41.d: "Nigdzie nie jest lepiej niż w domu."
 flavor_mal.41.e: "Co za piękny region!"
 flavor_mal.41.f: "Jakie urocze miejsce!"
 mal_invest_in_region_tt: "Państwo [Root.GetName] zainwestuje część złota w region §Y[selected_biggest_country_of_region.Capital.GetRegionName]§!. Każda posiadana prowincja w regionie §Y[selected_biggest_country_of_region.Capital.GetRegionName]§! otrzyma modyfikator „§YInwestycja w złoto§!”, zapewniający następujące efekty:\nLokalny koszt budowy: §G-15,0%§!\nLokalny czas budowy: §G-15,0%§!"
 flavor_mal.43.t: "[From.GetName] odwiedza [Root.GetName]!"
 flavor_mal.43.desc.a: "[From.Monarch.GetTitle] państwa [From.GetName] przybył do [Root.Capital.GetName]. Mądry [From.Monarch.GetTitle] pielgrzymuje do [385.GetName] i odwiedził nasze wsie oraz miasta. Najwyraźniej [From.Monarch.GetSheHe] był pod wrażeniem naszej gościnności i oferuje nam teraz darowiznę w wysokości [Root.mal_money_to_give_tt.GetValue] dukatów. Ilość czystego złota jest znacznie większa niż wszystko, co kiedykolwiek widzieliśmy. Przyjęcie darowizny może zaszkodzić naszej gospodarce, lecz pozwoliłoby nam znacznie rozbudować infrastrukturę."
 flavor_mal.43.desc.b: "Trzej doradcy z państwa [From.GetName] przybyli do [Root.Capital.GetName]. Ci mądrzy mężowie pielgrzymują do [385.GetName] i odwiedzili nasze wsie oraz miasta. Najwyraźniej byli pod wrażeniem naszej gościnności i oferują nam teraz darowiznę w wysokości [Root.mal_money_to_give_tt.GetValue] dukatów. Ilość czystego złota jest znacznie większa niż wszystko, co kiedykolwiek widzieliśmy. Przyjęcie darowizny może zaszkodzić naszej gospodarce, lecz pozwoliłoby nam znacznie rozbudować infrastrukturę."
 flavor_mal.43.a: "Weźmy te pieniądze."
 flavor_mal.43.a.tt: "[Root.GetName] otrzymuje §G[Root.mal_money_to_give_tt.GetValue]§! Dukatów."
 add_025_inflation: "[Root.GetName] otrzyma §R[Root.trade_income_variable_tt.GetValue]§! Inflacja."
 flavor_mal.43.b: "Nasza gospodarka nie poradzi sobie z takim napływem złota."
 flavor_mal.43.b.tt: "Choć odrzucimy darowiznę państwa [From.GetName], pielgrzymi nadal będą wydawać złoto w naszym kraju."
 flavor_mal.44.t: "Państwo [From.GetName] przyjmuje dar!"
 flavor_mal.44.desc.a: "Po audiencji u [From.Monarch.GetName] wielki [From.Monarch.GetTitle] państwa [From.GetName] przyjął dar od [Root.Monarch.GetName] i życzy [Root.Monarch.GetHerHim] udanej podróży."
 flavor_mal.44.desc.b: "Po audiencji u [From.Monarch.GetName] wielki [From.Monarch.GetTitle] państwa [From.GetName] przyjął dar od trzech pielgrzymów i życzy im udanej podróży."
 flavor_mal.44.a: "Niech [From.Culture.GetName] dobrze wykorzystają to złoto."
 flavor_mal.44.a.tt: "Przekazanie §R[Root.mal_money_to_give.GetValue]§! Dukatów do §Y[From.GetName]§!."
 flavor_mal.45.t: "Państwo [From.GetName] odrzuca dar"
 flavor_mal.45.desc.a: "Choć [Root.Monarch.GetName] zamierzał przekazać znaczną sumę złota, [From.Monarch.GetTitle] państwa [From.GetName] odmówił jego przyjęcia. [From.Monarch.GetName] twierdzi, że złoto przyniosłoby więcej szkody niż pożytku."
 flavor_mal.45.desc.b: "Choć trzej mężczyźni zamierzali przekazać znaczną sumę złota, [From.Monarch.GetTitle] państwa [From.GetName] odmówił jego przyjęcia. [From.Monarch.GetName] twierdzi, że złoto przyniosłoby więcej szkody niż pożytku."
 flavor_mal.45.a: "Niech tak będzie."
 flavor_mal.45.b: "Może [mal_next_gold_target.Monarch.GetTitle] państwa [mal_next_gold_target.GetName] zechce przyjąć ten dar."
 flavor_mal.46.t: "Napływ złota z państwa [From.GetName]!"
 flavor_mal.46.desc: "Ważni pielgrzymi z państwa [From.GetName] przybyli do naszego regionu i przywieźli niewyobrażalne ilości złota! Nasi mincerze robią wszystko, by ograniczyć skutki tego napływu, lecz inflacja będzie rosła przez najbliższe pięć lat."
 flavor_mal.46.a: "Czekają nas ciężkie lata..."
 flavor_mal.47.t: "Zgin[Root.Monarch.GetEndPast] [Root.Monarch.GetTitle]!"
 flavor_mal.47.desc: "Pielgrzymka do [385.GetName] nie jest całkowicie bezpieczna — nawet dla [Root.Monarch.GetTitle]. Śmierć naszego władcy mocno dotknęła lud [Root.GetAdjective], lecz dziedzictwo pielgrzymki pozostanie z nami na zawsze."
 flavor_mal.47.a: "Modlimy się za [Root.Monarch.GetHerHis] duszę."
 flavor_mal.47.a.tt: "§YPielgrzymka zakończyła się przedwcześnie.§!"
 flavor_mal.48.t: "Wizyta państwa [From.GetName]"
 flavor_mal.48.desc: "[385.GetName] jest świętym miejscem islamu. Nie powinno więc dziwić, że pielgrzymi z państwa [From.GetName] ponownie odwiedzają nasze wspaniałe miasto [385.GetName]. Tym razem przywieźli hojne dary w złocie dla naszych [Root.GetClergyName], aby Kaaba mogła stać się tak wspaniałym pomnikiem, jakim zawsze miała być."
 flavor_mal.48.a: "Niech będzie błogosławione państwo [From.GetName]."
 flavor_son.4.t: "Droga Mahometa do władzy"
 flavor_son.4.d: "Muhammad Ture pochodzi z ludu Soninke i rozpoczął karierę w Songhaju jako główny minister Alego Ber Sonniego. Po śmierci Alego Ber i objęciu tronu przez jego syna Ko Mamadiego Dao minister Muhammad zakwestionował władzę Abu w 1493 roku, a następnie obalił go po zwycięskiej bitwie pod Anfao. Sam objął tron Songhaju i założył dynastię Askiów, przyjmując imię Muhammad I Askia.\nJego panowanie przyniosło wielkie sukcesy militarne i reformy polityczne, które zapewniły ludowi Songhaj dziedzictwo nauki i piśmiennictwa."
 flavor_son.4.a: "Niech żyje Muhammad Askia!"
 flavor_son.4.b: "Dynastia [Root.Monarch.Dynasty.GetName] nie ugnie się przed takim uzurpatorem!"
 flavor_son.5.t: "Kwestia pobożności i tradycji"
 flavor_son.5.d: "Po podboju głęboko przywiązanego do tradycji ludu Mossi państwo [Root.GetName] znalazło się na rozdrożu religijnym i społecznym: [Root.GetClergyName] domagają się wykorzenienia dawnych wierzeń i pragną przywieść wiejską ludność ku światłu Allaha. [Root.GetNobilityOrFallbackName] podkreślają jednak korzyści, jakie [Root.GetName] odniesie, jeśli pozostawimy chłopów przy ich wierzeniach — między innymi mniejsze ryzyko chłopskich buntów przeciwko [Root.Monarch.GetTitle].\nOstatecznie to [Root.Monarch.GetTitle] [Root.Monarch.GetName] musi zdecydować o losie tych ludzi i religijnym kierunku państwa [Root.GetName]."
 flavor_son.5.a: "Nawrócimy ich na jedyną prawdziwą wiarę!"
 flavor_son.5.b: "Powinniśmy zostawić ich w spokoju."
 flavor_son.5.a.tt: "Odblokowuje misje §Yreligijne§!.\n§YTej decyzji nie można cofnąć.§!"
 flavor_son.5.b.tt: "Odblokowuje misje §Ytolerancji§!.\n§YTej decyzji nie można cofnąć.§!"
 flavor_son.6.t: "Ali Ber, wielki zdobywca"
 flavor_son.6.d: "Ali Sonni był piętnastym władcą dynastii Sonni i pierwszym, który przeszedł do historii jako właściwy król Songhaju. Za jego panowania wiele wielkich miast, takich jak Dżenne czy Timbuktu, dostało się w ręce armii Songhaju, a królestwo przekształciło się w imperium, które miało zastąpić Mali w roli hegemona Afryki Zachodniej. Choć był muzułmaninem, jego represyjna polityka wobec uczonych z Timbuktu i tolerancja dla tradycyjnych religii sprawiały, że był muzułmaninem raczej tylko z nazwy."
 flavor_son.6.a: "Ali Ber poprowadzi nas do zwycięstwa!"
 flavor_son.6.b: "Doprawdy wielki zdobywca."
 flavor_son.7.t: "Powstanie państwa [From.GetName]"
 flavor_son.7.d: "Wschodnie państwo [From.GetName] rozrosło się do rozmiarów, jakich imperium Mali nigdy nie zdołało osiągnąć. Jego władcy przyjęli tytuł cesarski i stali się nową regionalną potęgą Afryki Zachodniej. Podczas gdy my wciąż zmagamy się z wewnętrznymi konfliktami, wojska [From.GetAdjective] stoją już u naszych bram!"
 flavor_son.7.a: "To naprawdę złe wieści..."
 flavor_son.8.t: "Reformy armii [Root.Monarch.GetName]"
 flavor_son.8.d: "Zanim [Root.Monarch.GetName] wstąpił na tron, armie Songhaju były już siłą, z którą należało się liczyć, lecz nie stanowiły stałej armii. Wraz z dojściem [Root.Monarch.GetName] do władzy sytuacja uległa zmianie — utworzył on pierwszą stałą armię Songhaju. Za jego panowania wojsko zostało zmodernizowane, a większy nacisk położono na surowsze szkolenie i rekrutację. Dzięki temu już wcześniej potężne wojska Songhaju stały się dominującą siłą początku XVI wieku."
 flavor_son.8.a: "Skupienie się na rozbudowie stałej armii to dobry pomysł."
 flavor_son.8.b: "Historia wojskowości jest tak fascynująca!"
 flavor_son.10.t: "Propozycja małżeństwa od wdowy"
 flavor_son.10.d: "Miasto [1134.GetName] poddało się chwalebnym armiom państwa [Root.GetName]! Choć szlachetny [JNN.Monarch.GetTitle] [JNN.Monarch.GetName] walczył do ostatniego tchu, nie zdołał powstrzymać naszych wojsk i poległ w bitwie. Jego wdowa zwróciła się następnie do naszego [Root.Monarch.GetTitle] i zaoferowała siebie w zamian za oszczędzenie miasta."
 flavor_son.10.a: "Z radością przyjmuję tę hojną propozycję."
 flavor_son.10.b: "Nie potrzebuję wdowy jako małżonki."
 flavor_son.11.t: "Wielki Meczet w Dżenne"
 flavor_son.11.d: "Meczet w [1134.GetName], niegdyś pałac sułtana Kunburu, został poważnie uszkodzony podczas oblężenia i wymagał renowacji. Dzięki wysiłkom robotników [Root.GetAdjective] udało się przywrócić mu dawną świetność, z jednym wyjątkiem: pierwotny projekt meczetu przewidywał liczne kosztowne ozdoby pochodzące z czasów, gdy budowla pełniła funkcję pałacu. Zostały one jednak zniszczone podczas wojny.\n[Root.GetClergyName] twierdzą, że odtworzenie tych dekoracji jest konieczne, by okazać nasze oddanie Allahowi. [Root.GetDhimmiName] podkreślają jednak, że kościoły i świątynie innych religii nie otrzymują podobnych ozdób, dlatego Wielki Meczet powinien być traktowany na równi z nimi."
 flavor_son.11.a: "Po stronie [Root.GetClergyName]."
 flavor_son.11.b: "Po stronie [Root.GetDhimmiName]."
 flavor_son.12.t: "Korzenie [Root.GetName]"
 flavor_son.12.d: "Przed islamizacją Afryki Zachodniej mieszkańcy Songhaju wyznawali tradycyjne religie ludowe. Uważano, że nasza klasa rządząca nigdy nie rozważy powrotu do dawnych wierzeń, lecz nasza wyjątkowo tolerancyjna postawa wobec tradycji sprawiła, że zaczęła kwestionować swój status muzułmanów. Zwykle byłby to grzech niewybaczalny, lecz nawet [Root.Monarch.GetName] rozważa powrót do religijnych korzeni państwa [Root.GetName]..."
 flavor_son.12.a: "Nie powinniśmy rozważać tak heretyckiego czynu. Nasza wiara wymaga jednak pewnych zmian."
 flavor_son.12.b: "Nadszedł czas powrotu do dawnych obyczajów!"
 flavor_son.12.b.tt: "Religia każdej posiadanej prowincji §Ysunnickiej§! zmieni się na §Yfetyszyzm§!."
 flavor_son.13.t: "Upadek [Root.Monarch.GetName] i miasta [Root.Capital.GetName]"
 flavor_son.13.d: "Żołnierze [From.GetAdjective] przez wiele miesięcy oblegali naszą ukochaną stolicę. Mimo naszych najlepszych starań dzielni obrońcy nie zdołali powstrzymać inwazji [From.GetAdjective]. W desperackiej próbie nasz [Root.Monarch.GetTitle] osobiście walczył na murach [Root.Capital.GetName], lecz poległ w bitwie.\nNie wszystko jednak stracone. Małżonek poległego [Root.Monarch.GetTitle] ma jeszcze jeden pomysł: wojnę można zakończyć za cenę małżeństwa z [From.Monarch.GetName]."
 flavor_son.13.a: "To jedyne słuszne rozwiązanie."
 flavor_son.13.b: "Wciąż możemy odwrócić losy wojny!"
 EVTOPTI5060: "Cóż za wspaniały początek nowego roku!"
 EVTOPTJ5060: "Jeszcze tylko kilka lat, a potem będzie to problem Victorii..."
 EVTOPTK5060: "To koniec. Nie żyję."
 flavor_kon.4.a.tt: "Mieszkańcy państwa [Root.GetName] poczują się zdradzeni przez swojego [Root.Monarch.GetTitle], co spowoduje utratę §R3§! punktów stabilności.\nPaństwo [Root.GetName] zastąpi misje „Fetyszyzm” i „Walka z Europejczykami” misjami „§Ykatolicyzmu§!”.\n§YTej decyzji nie można cofnąć.§!"
 flavor_kon.4.b.tt: "[Root.GetNobilityOrFallbackName] państwa [Root.GetName] poczują się zdradzeni przez [Root.GetAdjective] tłum, co spowoduje utratę §R3§! punktów stabilności.\nPaństwo [Root.GetName] zastąpi misje „Katolicyzm” misjami „§Yfetyszyzmu§!”.\n§YTej decyzji nie można cofnąć.§!"
 flavor_kon.7.t: "Cudzoziemcy przybywają do [Root.GetName]!"
 flavor_kon.7.desc.ib: "Na naszych wybrzeżach dostrzeżono dziwnych, bladych mężczyzn w srebrnych zbrojach i długich, brązowych szatach. Po nawiązaniu pierwszego kontaktu stało się jasne, że przybyli z bardzo daleka, z krainy zwanej przez nich „Iberią”. Zorganizowano krótką audiencję u [Root.Monarch.GetName], podczas której nieznajomi wyjaśnili swoje zamiary: ci „Portugalczycy” i „Kastylijczycy” przybyli, by odkrywać świat i szerzyć imię tego, którego nazywają „Chrystusem”. Ich technologia jest bardziej zaawansowana niż wszystko, co kiedykolwiek widziano w [Root.GetName], dlatego zarówno [Root.Monarch.GetTitle], jak i [Root.GetNobilityOrFallbackName] zainteresowali się przybyszami."
 flavor_kon.7.desc.pap: "Na nasze wybrzeże przybyła grupa starszych mężczyzn. Wszyscy noszą długie, białe szaty i zabawne kapelusze. Twierdzą, że przybyli w imieniu swojego „papieża” i proszą o audiencję u naszego [Root.Monarch.GetTitle]. Podobno są biskupami z kraju zwanego „[PAP.GetName]” i przybyli szerzyć słowo „Chrystusa”. Nikt z nas nie rozumie, o czym mówią, lecz ich technologia znacznie przewyższa naszą, a ich wierzenia zaintrygowały zarówno [Root.Monarch.GetName], jak i [Root.GetNobilityOrFallbackName]."
 flavor_kon.7.desc.catholic: "Na nasze wybrzeże przybyli ludzie w długich, brązowych szatach i z dziwnymi złotymi krzyżami. Twierdzą, że przybyli, by „sprowadzić nas na właściwą drogę”, i poprosili o audiencję u [Root.Monarch.GetName]. Okazali się „misjonarzami Kościoła rzymskokatolickiego”. Choć nikt z nas nie rozumie, co to oznacza, ich technologia wzbudziła nasze zainteresowanie."
 flavor_kon.7.desc.christian: "U naszych wybrzeży rozbiła się niewielka łódź. Gdy kilku wojowników ostrożnie się do niej zbliżyło, znalazło pięciu skrajnie wyczerpanych mężczyzn w brązowych szatach. Ich ubrania wyglądały tak, jakby próbowano spalić ich żywcem, a oni ledwo zdołali uciec bez poważnych obrażeń. Zaprowadzono ich przed oblicze [Root.Monarch.GetName], gdyż wieść o odkryciu tych bladych przybyszów szybko rozeszła się wśród ludu. Okazało się, że są to prześladowani „misjonarze”, którzy padli ofiarą ataków „protestanckich” heretyków. Opowiedzieli nam o swojej technologii i religii, czym przyciągnęli uwagę naszej elity."
 flavor_kon.7.desc.others: "Na naszych brzegach pojawiło się trzech mężczyzn w mocno zniszczonych szatach, z poważnymi ranami! Kilku mieszkańców natychmiast podeszło do nich i opatrzyło ich rany. Po kilku tygodniach mężczyźni odzyskali siły i opowiedzieli nam o swojej ojczyźnie oraz o tym, jak została zniszczona przez nieświęte siły. Opowiedzieli również o swojej religii, „katolicyzmie”, i o tym, że każdy może do nich dołączyć. Ich opowieści o religii i technologii wzbudziły zainteresowanie [Root.Monarch.GetName], a ostatecznie przyciągnęły [Root.Monarch.GetHerHis] uwagę."
 flavor_kon.7.a: "Zaprośmy cudzoziemców, by zatrzymali się u nas na jakiś czas."
 flavor_kon.7.a.tt: "Opowiedz się po stronie Europejczyków.\nPaństwo [Root.GetName] zastąpi misje „Fetyszyzm” misjami „§Ykatolicyzmu§!”."
 flavor_kon.7.b: "Ich zamiary nie mogą być dobre. Natychmiast wypędźmy ich z naszej ojczyzny!"
 flavor_kon.7.b.tt: "Sprzeciw się Europejczykom.\nPaństwo [Root.GetName] §Yzachowa§! obecne misje."
 flavor_kon.8.t: "[Root.GetName] i Europejczycy"
 flavor_kon.8.d: "[Root.GetName] odwiedziło wielu bladych mężczyzn w lśniących zbrojach i z dziwnymi krzyżami na szyjach. Ci tak zwani Europejczycy już wcześniej próbowali wpływać na nasz lud.\nPo odrodzeniu [Root.GetName] ponownie musimy rozstrzygnąć, jak postępować z Europejczykami."
 flavor_kon.8.a: "Powinniśmy spróbować zyskać ich przychylność."
 flavor_kon.8.a.tt: "Opowiedz się po stronie Europejczyków.\nPaństwo [Root.GetName] zastąpi misje „Fetyszyzm” misjami „§Ykatolicyzmu§!”.\n§YTej decyzji nie można cofnąć.§!"
 flavor_kon.8.b: "Przynoszą zły omen i powinniśmy zrobić wszystko, by im się przeciwstawić!"
 flavor_kon.8.b.tt: "Sprzeciw się Europejczykom.\nPaństwo [Root.GetName] §Yzachowa§! obecne misje.\n§YTej decyzji nie można cofnąć.§!"
 flavor_kon.9.t: "[Root.GetName] Nawrócony!"
 flavor_kon.9.d: "Po miesiącach starań zagranicznych misjonarzy i przygotowań do konwersji wreszcie się udało: [Root.Monarch.GetName] dołączył do wspólnoty katolików na całym świecie!"
 flavor_kon.9.a: "Amen!"
 flavor_kon.10.t: "Prowincja [kon_converted_province.GetName] przeszła na katolicyzm!"
 flavor_kon.10.d: "Mieszkańcy prowincji [kon_converted_province.GetName] zaczęli porzucać dawne tradycje i przechodzić na katolicyzm! Jeśli nie zareagujemy, cała prowincja zostanie nawrócona. Jeżeli jednak zdecydujemy się stłumić ich nową wiarę, będziemy musieli stawić czoła katolikom na polu bitwy!"
 flavor_kon.10.a: "Pozwólmy im wierzyć w ich krzyże."
 flavor_kon.10.a.tt: "[Root.GetClergyName] uznają to za zdradę i wzniecą kontrrewoltę przeciwko katolickiej inwazji."
 flavor_kon.10.b: "Nie możemy na to pozwolić!"
 flavor_kon.10.b.tt: "[Root.GetNobilityOrFallbackName] uznają to za marnotrawstwo zasobów i spróbują osłabić nasz rząd."
 flavor_kon.11.t: "Podróż do Europy"
 flavor_kon.11.d: "W porcie [kon_port.GetName] przygotowano trzy statki. Zabiorą naszych kapłanów i ambasadorów, wybranych do podróży do Europy, aby zdobyć dla [Root.GetName] przychylność Stolicy Apostolskiej i jej sojuszników.\nPodróż potrwa pewien czas, lecz z Bożym błogosławieństwem ci dzielni mężowie dotrą do celu."
 flavor_kon.11.a: "Miejmy nadzieję, że papież przyjmie tę hojną ofertę."
 flavor_kon.11.a.tt: "Państwo [Root.GetName] wyśle ambasadorów i kapłanów do Europy, aby zaoferować papieżowi 500 $COST|Y$¤ w zamian za §Ygwarantowanego kardynała§!."
 flavor_kon.11.b: "Mam nadzieję, że nasz sojusznik doceni tę ofertę."
 flavor_kon.11.b.tt: "Państwo [Root.GetName] wyśle ambasadorów i kapłanów do Europy, aby zaoferować sojusznikowi 500 $COST|Y$¤ w zamian za §Ygwarantowanego kardynała§!."
 flavor_kon.11.c: "Oby władca Rzymu przyjął tę ofertę..."
 flavor_kon.11.c.tt: "Państwo [Root.GetName] wyśle ambasadorów i kapłanów do Europy, aby zaoferować 1000 $COST|Y$¤ władcy świętego miasta Rzymu w zamian za §Ygwarantowanego kardynała§!."
 flavor_kon.12.t: "Hojna oferta od państwa [From.GetName]!"
 flavor_kon.12.d: "W tym miesiącu do Europy przybyły trzy obce statki z ambasadorami i kapłanami z afrykańskiego państwa [From.GetName]. Proponują nam korzystny układ: proszą o zagwarantowanie miejsca dla kardynała w zamian za hojny dar w wysokości 500 dukatów!"
 flavor_kon.12.a: "Miejsce dla kardynała? Oczywiście, mamy ich pod dostatkiem."
 flavor_kon.13.t: "Hojna oferta od państwa [From.GetName]!"
 flavor_kon.13.d: "W tym miesiącu do Europy przybyły trzy obce statki z ambasadorami i kapłanami z afrykańskiego państwa [From.GetName], naszego sojusznika. Proponują nam korzystny układ: proszą o jednego z naszych kardynałów w zamian za hojny dar w wysokości 500 dukatów!"
 flavor_kon.13.a: "Biorę pieniądze, dziękuję!"
 flavor_kon.14.t: "Hojna oferta od państwa [From.GetName]!"
 flavor_kon.14.d: "W tym miesiącu do Europy przybyły trzy obce statki z ambasadorami i kapłanami z afrykańskiego państwa [From.GetName]. Proponują nam korzystny układ: proszą o miejsce dla swojego kardynała w Rzymie w zamian za 1000 dukatów!"
 flavor_kon.14.a: "Brzmi uczciwie."
 flavor_kon.15.t: "Kardynał dla [Root.GetName]!"
 flavor_kon.15.d: "Układ z państwem [From.GetName] zakończył się pełnym sukcesem, a państwo [Root.GetName] ma teraz zagwarantowane miejsce dla kardynała w Stolicy Apostolskiej!"
 flavor_kon.15.a: "Bóg jest dobry!"
 flavor_kon.15.a.tt: "Prowincja §Y[This.GetName]§! otrzyma aktywowany modyfikator „§YKardynał Afryki§!”, zapewniający następujące efekty:\nLokalny modyfikator podatkowy: §G+25,0%§!\nTolerancja prawdziwej wiary: §G+1,00§!\nRoczny wpływ papieski: §G+1,00§!\nRównowaga lojalności [Root.GetClergyName]: §G+10,0%§!\n\nDodatkowo w prowincji zawsze będzie urzędował §Ykardynał§!, dopóki [Root.GetName] kontroluje [This.GetName], a państwo [Root.GetName] i prowincja [This.GetName] pozostają gorliwymi wyznawcami wiary §Ykatolickiej§!."
 flavor_kon.16.t: "Ustanowienie królestwa"
 flavor_kon.16.d: "Jest oczywiste, że nasze dawne struktury nie są już w stanie sprostać nowym wyzwaniom. Cudzoziemcy lądują na naszych wybrzeżach, przynosząc ludowi nowe idee i technologie. Stanowią jednak również zagrożenie dla naszego społeczeństwa. Doradcy zalecają przekształcenie naszego rządu w prawdziwą monarchię."
 flavor_kon.16.a: "Przekształćmy państwo w prawdziwe królestwo."
 flavor_kon.16.b: "Dawne obyczaje w zupełności wystarczą."
 flavor_zim.1.t: "Upadek Zimbabwe"
 flavor_zim.1.d: "Zimbabwe było niegdyś wspaniałą stolicą imperium Zimbabwe, które rozpadło się przed wiekami wskutek wojen domowych. Od tamtej pory miasto służy nam jako znakomita stolica, pełna kamiennych domów.\nJednak jego dni są policzone. Nieurodzaj zniszczył uprawy zapewniające utrzymanie temu wielkiemu miastu, zasoby podtrzymujące jego gospodarkę przez tak długi czas wyczerpały się, a lokalne niepokoje zmusiły wielu mieszkańców do wyjazdu i osiedlenia się w innych prowincjach państwa [Root.GetName]."
 flavor_zim.1.a: "Dla Zimbabwe nastały mroczne czasy..."
 flavor_zim.1.a.tt: "Mieszkańcy Zimbabwe przeniosą się do innych prowincji państwa [Root.GetName]."
 flavor_zim.1.a.at: "Jeśli państwo [Root.GetName] kiedykolwiek utraci kontrolę nad Zimbabwe, jego mieszkańcy zakwestionują władzę władcy państwa [Root.GetName]. Państwo otrzyma modyfikator „§YZbezczeszczone królestwo§!”, zapewniający następujące efekty:\nPrawowitość: §R-1,00§!\nTolerancja prawdziwej wiary: §R-3,00§!"
 flavor_zim.2.t: "Prześcignięcie Zimbabwe"
 flavor_zim.2.d: "Niegdyś potężne Zimbabwe dominowało w Afryce Południowej, stanowiąc centrum kultury i handlu całego regionu. Wzniesiono tam wspaniałe pomniki i położono podwaliny naszej cywilizacji.\nTeraz nie tylko osiągnęliśmy szczyt ich potęgi, lecz całkowicie ich prześcignęliśmy. Państwo [Root.GetName] [Root.GovernmentName] osiągnęło poziom potęgi, o którym nasi przodkowie mogli jedynie marzyć. Podczas uroczystości [Root.GetClergyName] spotkali się z [Root.Monarch.GetTitle] i pogratulowali mu tego sukcesu. Zalecili również zmianę nazwy naszego państwa na Wielkie Zimbabwe, aby oddać cześć Mwari i naszym przodkom."
 flavor_zim.2.a: "Oczywiście! Odtąd będziemy znani jako Zimbabwe!"
 flavor_zim.2.b: "Przodkowie należą do przeszłości. Przyszłość należy do [Root.GetName]!"
 flavor_zim.2.b.tt: "Umożliwia podjęcie decyzji o utworzeniu §YZimbabwe§!."
 flavor_zim.5.t: "Konflikt religijny wśród kupców"
 flavor_zim.5.desc: "Dzięki dostępowi do złota i kości słoniowej państwo [Root.GetName] przyciąga kupców z całego świata. Przynosi nam to wielki dobrobyt, ale ma też niepożądany skutek w postaci konfliktów religijnych między handlarzami. Tak właśnie dzieje się w [Root.Capital.GetName], gdzie chrześcijańscy i muzułmańscy kupcy rywalizują ze sobą zarówno na targowiskach, jak i na dworze królewskim.\nJeśli chcemy położyć kres temu problemowi, [Root.Monarch.GetName] musi zdecydować, jak postąpić z agresywnymi kupcami."
 flavor_zim.5.a: "Opowiedzmy się po stronie chrześcijańskich kupców."
 flavor_zim.5.a.tt: "[Root.Monarch.GetName] poprze chrześcijańskich kupców, co może mieć później §Ykonsekwencje religijne§!..."
 flavor_zim.5.b: "Opowiedzmy się po stronie muzułmańskich kupców."
 flavor_zim.5.b.tt: "[Root.Monarch.GetName] poprze muzułmańskich kupców, co może mieć później §Ykonsekwencje religijne§!..."
 flavor_zim.5.c: "Powinniśmy wykorzystać ich wzajemne różnice!"
 flavor_zim.5.d: "Wypędźmy z miasta obie grupy kupców."
 flavor_zim.6.t: "Nawrócenie [Root.Monarch.GetName]"
 flavor_zim.6.d.a: "Muzułmańscy kupcy zostali wygnani z naszych miast, a chrześcijańscy mogli cieszyć się handlem bez konkurencji. Z czasem nasz [Root.Monarch.GetTitle] bardzo polubił chrześcijan. Pewnego dnia [Root.Monarch.GetName] odwiedzili misjonarze przebrani za kupców i [Root.Monarch.GetSheHe] nawrócił się na chrześcijaństwo, nie zastanawiając się zbytnio nad swoją decyzją. Teraz na tronie państwa [Root.GetName] zasiada chrześcijański [Root.Monarch.GetTitle]!"
 flavor_zim.6.d.b: "Chrześcijańscy kupcy zostali wygnani z naszych miast, a muzułmańscy mogli cieszyć się handlem bez konkurencji. Z czasem nasz [Root.Monarch.GetTitle] bardzo polubił muzułmanów. Pewnego dnia [Root.Monarch.GetName] odwiedzili misjonarze przebrani za kupców i [Root.Monarch.GetSheHe] nawrócił się na islam, nie zastanawiając się zbytnio nad swoją decyzją. Teraz na tronie państwa [Root.GetName] zasiada muzułmański [Root.Monarch.GetTitle]!"
 flavor_zim.6.a: "Odtąd wszyscy jesteśmy chrześcijanami!"
 flavor_zim.6.b: "Odtąd wszyscy jesteśmy muzułmanami!"
 flavor_zim.6.c: "Ściąć mu głowę!"
 flavor_zim.6.d: "To nie jest sprawa państwa [Root.GetAdjective]."
 flavor_zim.7.t: "Mapy Sofali"
 flavor_zim.7.d: "Po podboju Sofali nasze państwo [Root.GovernmentName] uzyskało dostęp do map tego bogatego miasta handlowego. Przedstawiają one wiele ważnych miast portowych zachodniej części Oceanu Indyjskiego, a także inne ośrodki istotne dla świata muzułmańskiego."
 flavor_zim.7.a: "Te mapy okażą się bardzo przydatne."
 flavor_zim.7.a.tt: "Odkryj regiony §YRogu Afryki§!, §YEgiptu§!, §YArabii§!, §YMaszriku§! oraz §YZachodniego Oceanu Indyjskiego§!."
 flavor_zim.8.t: "Starożytne mapy azjatyckich szlaków handlowych"
 flavor_zim.8.d: "Utworzenie nowej floty handlowej przyciągnęło wielu kupców poszukujących nowych możliwości. Jeden z nich posiada starożytne mapy z czasów, gdy Zimbabwe utrzymywało kontakty handlowe z Chinami. Kupiec ten postanowił przekazać je naszemu [Root.Monarch.GetTitle]."
 flavor_zim.8.a: "Jesteśmy bardzo wdzięczni."
 flavor_zim.8.a.tt: "Odkryj morski szlak handlowy do prowincji §Y[1816.GetName]§!."
 flavor_zim.9.t: "[1184.GetName] stracony!"
 flavor_zim.9.d: "Wielkie miasto [1184.GetName] zostało utracone na rzecz naszych wrogów z państwa [Root.GetName]! Nasz lud zwątpił w naszego świętego króla i popadł w zamęt!"
 flavor_zim.9.a: "Niedobrze..."
 flavor_zim.10.t: "[1184.GetName] ponownie pod kontrolą [Root.GetAdjective]!"
 flavor_zim.10.d: "Wielkie miasto [1184.GetName] wróciło pod naszą kontrolę! Niezadowolenie naszego ludu zostało stłumione!"
 flavor_zim.10.a: "Dobrze."
 flavor_aju.1.t: "Układ handlowy ze złotem z państwem [From.GetName]"
 flavor_aju.1.d: "Państwo [From.GetName] wysłało dyplomatów i kupców na dwór [Root.Monarch.GetName]. Najwyraźniej przybysze pragną uzyskać audiencję u naszego [Root.Monarch.GetTitle]. Proponują układ handlowy: przekażemy państwu [From.GetName] złoto z naszych kopalń w zamian za odpowiednią walutę, która zasili naszą gospodarkę."
 flavor_aju.1.a: "Przyjmijmy ofertę."
 flavor_aju.1.b: "Odrzućmy ofertę."
 flavor_aju.5.t: "Kupcy z państwa [From.GetName]"
 flavor_aju.5.d: "Kupcy z państwa [From.GetName] stali się ostatnio częstym widokiem w Indiach. Są uczciwymi handlarzami, a przywożone przez nich towary odznaczają się wysoką jakością. Szczególnie wyróżnia ich zaangażowanie w miejscowe procesy produkcyjne oraz waluta, którą nam płacą. Mogą pomóc nam usprawnić produkcję wielu towarów, lecz istnieje ryzyko, że staniemy się zbyt zależni od tych cudzoziemców."
 flavor_aju.5.a: "Lepsza produkcja zawsze jest korzystna."
 flavor_aju.5.b: "Wypędźmy ich."
 flavor_aju.6.t: "Żyrafa dla Syna Niebios"
 flavor_aju.6.d: "Odległe państwo [From.GetName] wysłało ambasadorów do naszego wspaniałego władcy [Root.Monarch.GetName]. Przywieźli wieści ze swojej ojczyzny i wystawne podarunki. Jeden z nich szczególnie przykuł uwagę naszego [Root.Monarch.GetTitle]. To żyrafa — zwierzę przypominające w naszym kraju stworzenie z mitów i legend. Przedstawili je jako dar od swojego [From.Monarch.GetTitle], będący wyrazem przyjaźni."
 flavor_aju.6.a: "Ona jest... jest... PRZEPIĘKNA!"
 flavor_aju.6.b: "Dziękujemy, ale żyrafy nie są nam potrzebne."
 flavor_aju.2.t: "Przyjęli naszą ofertę"
 flavor_aju.2.d: "Władca państwa [From.GetName] łaskawie przyjął naszą ofertę handlową. Z pewnością przyniesie to obopólne korzyści obu krajom, w tym znaczny wzrost naszej gospodarki."
 flavor_aju.2.a: "Wspaniale!"
 flavor_aju.3.t: "Odrzucili naszą ofertę"
 flavor_aju.3.d: "Głupcy z państwa [From.GetName] ośmielili się odrzucić naszą hojną ofertę handlową. Stracą na tej decyzji, a my w przyszłości nie okażemy im już takiej wspaniałomyślności."
 flavor_aju.3.a: "Zapamiętamy to."
 flavor_aju.4.t: "Bicie monety"
 flavor_aju.4.d: "Dostęp do kopalń złota pozwala nam lepiej regulować produkcję i wybijanie monet, co zwiększa bogactwo naszego państwa. Rozwinięcie odpowiedniego i stabilnego przemysłu menniczego z pewnością wzmocni naszą potęgę gospodarczą."
 flavor_aju.4.a: "Wspaniale!"
 flavor_aju.4.a.tt: "Otrzymaj równowartość §G4 lat§! wydobycia złota z prowincji złotonośnej należącej do twojego poddanego."
 flavor_aju.7.t: "Cesarz zachwycony żyrafą"
 flavor_aju.7.d: "Ambasadorowie wysłani przez nas do państwa [From.GetName] wreszcie powrócili. Jak się okazuje, [From.Monarch.GetTitle] [From.Monarch.GetName] był zachwycony naszym podarunkiem i łaskawie przyjął ofiarowaną przez nas żyrafę. Stosunki między naszymi krajami z pewnością rozkwitną."
 flavor_aju.7.a: "Miło wiedzieć, że mu się spodobała."
 flavor_aju.8.t: "Powiedzieli, że była taka sobie..."
 flavor_aju.8.d: "Ambasadorowie wysłani przez nas do państwa [From.GetName] wreszcie powrócili. Jak się okazuje, [From.Monarch.GetTitle] [From.Monarch.GetName] nie był pod wrażeniem naszego podarunku i odmówił przyjęcia żyrafy. Ambasadorowie musieli zabrać ją z powrotem, lecz niestety biedne zwierzę nie przeżyło podróży. Nieprędko zapomnimy tej zniewagi."
 flavor_aju.8.a: "Sam też jesteś taki sobie..."
 flavor_aju.9.t: "Zjednoczone dynastie"
 flavor_aju.9.d: "Nasze wyspy były niegdyś kolonią państwa [From.GetName]. Ostatecznie odzyskaliśmy wolność, ponieważ zarządzanie Malediwami okazało się zbyt trudne — przynajmniej do teraz. Ambasadorowie [From.GetAdjective] przybyli do nas z kontynentu, prosząc o zakończenie tego stanu rzeczy. Ponieważ oba kraje od pokoleń były rządzone przez tę samą rodzinę, twierdzą, że nie ma sensu uważać nas za dwa odrębne państwa i że ponowne zjednoczenie z naszymi pobratymcami przyniosłoby korzyści obu stronom."
 flavor_aju.9.a: "Dobrze znów być razem."
 flavor_aju.9.b: "Nie podporządkujemy się państwu [From.GetName]!"
 flavor_aju.10.t: "Zjednoczone dynastie — przyjmują ofertę!"
 flavor_aju.10.d: "Ambasadorowie wysłani przez nas do państwa [From.GetName] powrócili ze wspaniałymi wieściami! [From.Monarch.GetTitle] państwa [From.GetName] zgodził się, że ponowne zjednoczenie naszych krajów pod jednym sztandarem przyniesie korzyści obu stronom."
 flavor_aju.10.a: "Dobrze znów być razem."
 flavor_aju.11.t: "Zjednoczone dynastie — odrzucają ofertę!"
 flavor_aju.11.d: "Ambasadorowie wysłani przez nas do państwa [From.GetName] powrócili z ponurymi wieściami! [From.Monarch.GetTitle] państwa [From.GetName] odrzucił naszą propozycję ponownego zjednoczenia krajów. Głupiec musi uważać [From.Monarch.GetHerselfHimself] za kogoś lepszego od nas. Nie rozumie jednak, że przedstawiona oferta była jedynie formalnością — tamte ziemie należą do naszego państwa, czy im się to podoba, czy nie. Zadbamy o to, by się o tym przekonali."
 flavor_aju.11.a: "Ich ziemie i tak należą do nas!"
 flavor_aju.12.t: "Kupcy z państwa [From.GetName] w kraju [Root.GetName]"
 flavor_aju.12.d: "Kupcy przysłani przez państwo [From.GetName] z pewnością przyniosą nam znaczne zyski. Możliwość handlu z tak odległymi krainami zapewni wielki napływ bogactwa i ludności, zamieniając [613.GetName] w tętniący życiem targ."
 flavor_aju.12.a: "Wspaniale!"
 flavor_aju.13.t: "Kupcy z państwa [From.GetName] na Jawie"
 flavor_aju.13.d: "Kupcy przysłani przez państwo [From.GetName] z pewnością przyniosą nam znaczne zyski. Możliwość handlu z tak odległymi krainami zapewni wielki napływ bogactwa i ludności, zwiększając różnorodność towarów dostępnych na naszych targowiskach."
 flavor_aju.13.a: "Wspaniale!"
 flavor_aju.14.t: "Modernizacja armii"
 flavor_aju.14.d: "Pod osmańskim przewodnictwem moglibyśmy stworzyć nowoczesną i imponującą armię. Możemy zatrudnić ich instruktorów, którzy gruntownie zreformują nasze wojska. Nie będzie to tanie, ale okaże się skuteczne. Alternatywnie możemy kupić część ich nadwyżkowej broni. Zdobędziemy lepsze wyposażenie, lecz nie wiedzę potrzebną do jego wykorzystania — tę będziemy musieli zdobyć samodzielnie."
 flavor_aju.14.a: "Poprośmy ich o wsparcie i wskazówki."
 flavor_aju.14.b: "Kupmy nowe wyposażenie."
 flavor_aju.14.c: "To chyba nie jest warte zachodu."
 flavor_ada.2.t: "Z [From.GetAdjective] Pułki dotarły do [Root.Capital.GetName]"
 flavor_ada.2.d: "Dziś na dwór [Root.GetAdjective] przybyli zagraniczni goście — całe pułki żołnierzy eskortujące jednego dyplomatę. Najwyraźniej przebyli długą drogę z [From.Capital.GetName] do [Root.Capital.GetName], aby uzyskać audiencję u [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Dyplomata prosi o zawarcie sojuszu z państwem [From.GetName], który pozwoli powstrzymać [ETH.GetAdjective], zagrażających naszym współwyznawcom."
 flavor_ada.2.a: "Udzielimy wsparcia państwu [From.GetName]!"
 flavor_ada.2.a.tt: "Państwo §Y[From.GetName]§! uzyska dostęp do kompanii najemników §YJanczarzy§!, jeśli znajdzie się w stanie wojny z [ETH.GetName]."
 flavor_ada.2.b: "To nie nasza wojna."
 flavor_ada.3.t: "Państwo [From.GetAdjective] przyjmuje sojusz!"
 flavor_ada.3.d: "Nasz dyplomata bezpiecznie powrócił do [Root.Capital.GetName] i przywiózł wspaniałe wieści! Mądry [From.Monarch.GetTitle] przyjął propozycję sojuszu i zagwarantował pomoc wojskową, gdy uderzymy na Etiopię!"
 flavor_ada.3.a: "Wspaniale!"
 flavor_ada.3.a.tt: "Otrzymamy pomoc państwa §Y[From.GetName]§! podczas naszej następnej wojny z [ETH.GetName]!"
 ada_discover_anatolia: "Odkryj cały region §YAnatolii§!."
 flavor_ada.4.t: "Państwo [From.GetAdjective] odrzuca sojusz!"
 flavor_ada.4.d: "Nasz dyplomata powrócił do domu z ponurymi wieściami: obiecujące państwo [From.GetAdjective] odrzuciło pomysł sojuszu, uznając, że nie jesteśmy warci ich czasu. Oczywiście takie podejście jest niedorzeczne. Mimo to nasza sytuacja dyplomatyczna wcale się nie poprawiła..."
 flavor_ada.4.a: "Niech to!"
 flavor_ada.5.t: "Brak imperium w Anatolii"
 flavor_ada.5.d: "Nasz dyplomata powrócił do domu. Wygląda jednak na pokonanego, wręcz wstrząśniętego. Najwyraźniej w Anatolii nie ma żadnego wielkiego imperium, które zechciałoby nam pomóc. Niewierni i heretycy podbili Anatolię, a Turcy, którzy zapowiadali się na obiecujących sojuszników, są teraz poddanymi wrogiej potęgi."
 flavor_ada.5.a: "Nie mamy innego wyjścia. Ostatecznie musimy poprosić o pomoc Mameluków."
 flavor_ada.5.b: "Niedobrze."
 flavor_ada.6.a.tt: "Państwo §Y[From.GetName]§! uzyska dostęp do kompanii najemników §YŻołnierze mameluccy§! do końca gry."
 flavor_ada.7.t: "Mamelucy wpsierają [Root.GetName]"
 flavor_ada.7.d: "Choć Mamelucy nie byli naszym pierwszym wyborem na sojusznika, dostrzegli zagrożenie ze strony Etiopii i postanowili pomóc nam, udostępniając niewielką kompanię mameluckich żołnierzy."
 flavor_ada.7.a: "Cóż, lepsze to niż nic."
 flavor_ada.7.a.tt: "Kompania najemników §YŻołnierze mameluccy§! będzie dostępna dla państwa [Root.GetName]."
 flavor_ada.8.t: "Mamelucy odmawiają pomocy państwu [Root.GetName]"
 flavor_ada.8.d: "Dotarły do nas wieści od Mameluków. Mimo naszych najlepszych starań dyplomatycznych nie widzą oni powodu, by wspierać nas w zmaganiach z Etiopczykami."
 flavor_ada.8.a: "Niech będą przeklęci!"
 fetishist_flavor.600.t: "Kult dla [Root.Heir.GetTitle]"
 fetishist_flavor.600.desc: "Zgodnie z tradycją to nasz [Root.Monarch.GetTitle] pełni rolę przewodnika kultu państwa [Root.GetName]. Tradycje nie są jednak niezmienne i mogą ewoluować, dlatego wybór kultu dla następcy tronu również stał się istotną kwestią."
