 primary_christianity_cult: "Główny kult: chrześcijaństwo"
 desc_primary_christianity_cult: "Chrześcijaństwo jest naszym głównym kultem. Nasi poddani wyznają je bardziej niż jakąkolwiek inną religię, a po śmierci władca dołączy do wspólnoty przodków."
 primary_islam_cult: "Główny kult: islam"
 desc_primary_islam_cult: "Islam jest naszym głównym kultem. Nasi poddani wyznają go bardziej niż jakąkolwiek inną religię, a po śmierci władca dołączy do wspólnoty przodków."
 primary_buddhism_cult: "Główny kult: buddyzm"
