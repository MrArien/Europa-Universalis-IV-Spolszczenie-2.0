 kon_convert_west_africa_ct: ""
 kon_convert_the_country_title: ""
 kon_convert_the_country_desc: "Zdecydowaliśmy się nawiązać relacje z Europejczykami, ale ci nie będą chcieli nas uznać za równorzędnych partnerów, dopóki nie przyjmiemy światła Pana. Musimy oficjalnie stać się katolikami i nawrócić zarówno króla, jak i lud."
