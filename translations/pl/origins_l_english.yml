 son_fetishism_as_secondary_religion: "Fetyszyzm drugorzędną religią"
 desc_son_fetishism_as_secondary_religion: "Każda posiadana prowincja z §fetyszyzmem§! otrzymuje następujące efekty: \nLokalny wzrost dobrobytu: §G+0.05§!\nLokalny wkład w jedność religijną: §G-100.0%§!\nLokalna siła misjonarzy: §R-2.0%§!\nFetyszyści zyskali duże wpływy i tolerancję w naszym państwie i są obecnie postrzegani jako drugorzędna religia państwa.\nModyfikator zostanie usunięty, jeśli państwo [Root.GetName] zmieni swoją religię na §Yfetyszyzm§!."
 son_fetishism_as_secondary_religion_desc: "§YWygaśnie kiedy religia państwowa zmieni się na fetyszyzm.§!"
 son_fetishism_as_secondary_religion_tt: "Państwo [Root.GetName] otrzymuje '§YFetyszyzm drugorzędną religią§!' do końca gry lub do momentu, gdy religia w państwie [Root.GetName] zmieni się na §Yfetyszyzm§!, dając następujące efekty:\nPoprawa relacji: §G+10.0%§!\nKażda posiadana prowincja z §fetyszyzmem§!:\nLokalny wzrost dobrobytu: §G+0.05§!\nLokalny wkład w jedność religijną: §G-100.0%§!\nLokalna siła misjonarzy: §R-2.0%§!"
 son_fetishism_as_secondary_religion_province: "Tolerancja fetyszyzmu"
 desc_son_fetishism_as_secondary_religion_province: "Właściciel tej prowincji uważa fetyszyzm za drugorzędną religię państwową."
 son_fetishism_as_secondary_religion_province_desc: "§YWygaśnie kiedy religia państwowa zmieni się na fetyszyzm.§!"
 son_separitism_killer: "Gorliwi wyznawcy"
 desc_son_separitism_killer: "Wiejska ludność Mossi została wprowadzona w świat islamu i nie przejawia buntowniczej postawy wobec swojego władcy."
 son_embrace_legalism: "Poparcie dla ulemów"
 desc_son_embrace_legalism: "[Root.Monarch.GetName] wysłuchał argumentów dotyczących dekoracji Wielkiego Meczetu w Djenné i w tej sprawie stanął po stronie [Root.GetClergyName_gen]."
 son_embrace_mysticism: ""
 desc_son_embrace_mysticism: ""
 son_foothold_in_enemy_territory: "Granica z Mali"
 desc_son_foothold_in_enemy_territory: "Ta prowincja stanowi najbardziej wysuniętą granicę imperium Songhaj, sąsiadującą z Mali. Wielu rzemieślników i murarzy zebrało się tutaj, aby przygotować umocnienia."
 son_professional_songhaian_army: "Pierwsza stała armia profesjonalna"
 desc_son_professional_songhaian_army: "[Root.Monarch.GetName] zdecydował się skupić na bardziej wyrafinowanej, stałej armii. W rezultacie jakość wojska wzrosła, jednak rekruterzy stali się bardziej wybredni w doborze żołnierzy."
 son_focus_on_professional_armies: "Profesjonalna stała armia"
 desc_son_focus_on_professional_armies: "[Root.Monarch.GetName] zdecydował się skoncentrować na bardziej zorganizowanej, stałej armii. Dzięki tym wymaganiom jakość wojska wzrosła, lecz rekruterzy stali się bardziej wybredni w doborze poborowych."
 son_reformed_army_technology: "Arsenał Songhaju"
 desc_son_reformed_army_technology: "Broń palna była dotąd nieznana w wojnach Afryki Zachodniej. Songhaj jako pierwszy sięgnął po muszkiety i armaty, czyniąc z nich narzędzie dominacji nad innymi potęgami regionu.\nKontakty z Europejczykami i przejęcie ich wiedzy technicznej sprawiły, że jakość tej broni osiągnęła jeszcze wyższy poziom."
 son_modern_government: "Nowoczesne państwo"
 desc_son_modern_government: "Nasz kraj osiągnął kluczowy postęp w zakresie sztuki rządzenia i administracji, stając się pierwszym nowoczesnym państwem w Afryce Zachodniej."
 son_songhaian_empire: "Imperium Songhaju"
 desc_son_songhaian_empire: "Staliśmy się wspaniałą hegemonią Afryki Zachodniej! Imperium Songhaju będzie rozkwitać i trwać!"
