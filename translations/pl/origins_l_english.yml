 celebrate: "Świętuj święto"
 judaism_rosh_hashanah_aspect: "Święto Rosz ha-Szana"
 desc_judaism_rosh_hashanah_aspect: "£adm£ §YAspekt§!\n§YŚwiętowanie święta§! zapewnia nam §G+1§! punkt stabilności.\n\nChoć nasz lud przez wiele lat żył pod uciskiem faraona, nigdy nie utracił swojej tożsamości ani wiary w Boga. Po opuszczeniu Egiptu szybko odbudował własną wspólnotę narodową."
 judaism_simchat_torah_aspect: "Święto Simchat Tora"
 desc_judaism_simchat_torah_aspect: "£adm£ §YAspekt§!\n§YŚwiętowanie święta§! zapewnia nam §G+25§! postępu reform, §G+5§! prawowitości (lub jej odpowiednika w innych ustrojach) oraz §G+5§! siły roszczenia następcy tronu.\n\nTora jest świętym tekstem judaizmu i obejmuje pięć pierwszych ksiąg Biblii hebrajskiej. Stanowi również źródło naszych najświętszych praw i tradycji oraz zawiera wiedzę o wielkiej dla nas wartości."
 judaism_sukkot_aspect: "Święto Sukot"
 desc_judaism_sukkot_aspect: "£adm£ §YAspekt§!\n§YŚwiętowanie święta§! zapewnia nam dochód równy §G0,3 roku§! oraz zmniejsza inflację o §G-1§!.\n\nSukot to niezwykle ważne żydowskie święto, będące zarówno symbolem zbiorów, jak i naszego związku z wolą Boga. W tym czasie praca jest zakazana lub podlega poważnym ograniczeniom."
 judaism_communities_aspect: "Społeczność żydowska"
 desc_judaism_communities_aspect: "£dip£ §YAspekt§!\nŻadna posiadana prowincja §Yżydowska§! nie będzie podlegać karom za §Ynieakceptowaną kulturę§! ani §Ykulturę z tej samej grupy kulturowej§!, dopóki ten aspekt pozostaje aktywny.\n\nPrzez stulecia Żydzi stanowili mniejszość w wielu prowincjach i państwach. Choć status ten niepotrzebnie utrudniał im życie, przyczynił się przynajmniej do powstania silnego poczucia wspólnoty w judaizmie, które pozwalało przezwyciężać różnice kulturowe dzielące wyznawców innych religii."
 jewish_abrahamic_aspect: "Korzenie abrahamowe"
 desc_jewish_abrahamic_aspect: "£dip£ §YAspekt§!\nŻadna posiadana prowincja §Ychrześcijańska§! ani §Ymuzułmańska§! nie będzie już podlegać karom za niewłaściwą religię. Ponadto zmniejszy się w nich lokalny wkład do jedności religijnej o §G-100,0%§! oraz lokalna siła misjonarzy o §R-100,0%§!.\n\nŻydzi, chrześcijanie i muzułmanie mogą się różnić, lecz ostatecznie wszystkie nasze religie wywodzą się od wielkiego Abrahama. Dlatego chrześcijan i muzułmanów w naszym państwie traktujemy jak braci, nawet jeśli podążają inną drogą."
 judaism_diplomatic_rabbi_aspect: "Ojczyzna Żydów"
 desc_judaism_diplomatic_rabbi_aspect: "£dip£ §YAspekt§!\nKażde państwo §Ychrześcijańskie§! lub §Ymuzułmańskie§!, które nie jest teokracją, zyska o nas opinię §G+35§!.\n\nJesteśmy ostoją dla naszego ludu i dlatego przyciągamy do kraju wielu Żydów z obcych państw. Skutkiem ubocznym jest zadowolenie chrześcijan i muzułmanów, że ich „niepożądani” znaleźli u nas dom."
 judaism_yom_kippur_aspect: "Jom Kipur"
 desc_judaism_yom_kippur_aspect: "£mil£ §YAspekt§!\nPodczas wojny nasze państwo otrzymuje §G+20,0%§! szybkości odzyskiwania siły żywej oraz §G+25,0%§! mocy wiary. Efekt ten jest dwukrotnie silniejszy, jeśli prowadzimy wojnę §Yobronną§!.\n\nJom Kipur to najświętszy dzień w naszym kalendarzu — dzień pokuty za przewinienia i żalu za grzechy. W Jom Kipur każdy Żyd powinien pościć, wyznawać grzechy i modlić się, często podczas nabożeństw w synagodze."
 judaism_remember_passover_aspect: "Pamięć o Pesach"
 desc_judaism_remember_passover_aspect: "£mil£ §YAspekt§!\nOblężenia naszych utraconych fortów rozpoczynają się z §G+2§! postępami oblężenia na naszą korzyść. Zwycięskie oblężenia wrogich fortów zapewniają nam §G+5§! mocy wiary.\n\nPesach to jedno z najważniejszych świąt judaizmu, przypominające czasy niewoli naszego ludu w Egipcie i jego wyzwolenie. Każdy powinien pamiętać o wytrwałości naszych przodków i o tym, że każde zwycięstwo zasługuje na świętowanie."
 judaism_purim_teachings_aspect: "Nauki Purim"
 desc_judaism_purim_teachings_aspect: "£mil£ §YAspekt§!\nKażda wygrana bitwa zmniejsza wyczerpanie wojną o §G-0,05§!. Każda wygrana wojna zapewnia nam §G+75§! mocy wiary. Odrębne traktaty pokojowe zawarte podczas wojny nie uruchamiają tego efektu.\n\nPurim to żydowskie święto upamiętniające ocalenie naszego ludu przed Hamanem z perskiego imperium Achemenidów. Pamiętamy i czcimy wytrwałość naszego ludu w trudnych czasach, kierując się jego przykładem."
