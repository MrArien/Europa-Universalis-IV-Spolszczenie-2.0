 fetishist_flavor.601.t: "Poszukiwanie nowego kultu"
 fetishist_flavor.601.desc: "Szaman naszego państwa [Root.GovernmentName] poprosił o nawiązanie kontaktu z jednym z innych kultów lub ze znanym krajem wyznającym inną religię. Nie ma jednak szczególnych preferencji co do tego, z jakim kultem powinniśmy się spotkać, dlatego nasz wielki [Root.Monarch.GetTitle] powinien wskazać mu właściwą drogę."
