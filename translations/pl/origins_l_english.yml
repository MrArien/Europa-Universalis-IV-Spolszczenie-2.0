 negusa_nagast: "Monarchia Negusa Nagasta"
 negusa_nagast_legacy: "Monarchia Negusa Nagasta"
 negusa_nagast_legacy_desc: "Choć Etiopia jest imperium, nie dysponuje odpowiednimi środkami, by egzekwować władzę Negusa Nagasta — cesarza Etiopii. Monarchia Negusa Nagasta to wczesna forma ustroju imperium, którym Etiopia dopiero się stanie. Reforma ta wiąże się zatem z rozłamem religijnym, brakiem scentralizowanej władzy oraz wędrowną stolicą, która przysparzała więcej problemów, niż przynosiła korzyści."
 negusa_nagast_desc: "Choć Etiopia jest imperium, nie dysponuje odpowiednimi środkami, by egzekwować władzę Negusa Nagasta — cesarza Etiopii. Monarchia Negusa Nagasta to wczesna forma ustroju imperium, którym Etiopia dopiero się stanie. Reforma ta wiąże się zatem z rozłamem religijnym, brakiem scentralizowanej władzy oraz wędrowną stolicą, która przysparzała więcej problemów, niż przynosiła korzyści."
