 fetishist_flavor.601.r.tt: "Szaman pozostanie w państwie [Root.GetName] i będzie czekał na twoje rozkazy."
 fetishist_flavor.602.t: "Główny kult państwa [Root.GetName]"
 fetishist_flavor.602.desc: "[Root.GetClergyName] zgromadzili się na dworze państwa [Root.GetName]. Wyrazili zaniepokojenie, że zbyt wiele kultów próbuje zdobyć wpływy w naszym państwie [Root.GovernmentName], i zalecili przyjęcie bardziej monoteistycznego podejścia poprzez ustanowienie jednego głównego kultu. Byłby to kult, którego zawsze przestrzegałby mądry [Root.Monarch.GetTitle] państwa [Root.GetName]."
