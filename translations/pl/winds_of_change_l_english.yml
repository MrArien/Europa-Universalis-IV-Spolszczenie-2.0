 SUN_expel_colonists: "Wypędzenie kolonistów"
 desc_SUN_expel_colonists: "Ziemie, które najeźdźcy nazywają „Ameryką”, nie należą do nich. Wypędźmy ich tam, skąd przybyli."
 SUN_integrate_colonists: "Integracja cudzoziemców"
 desc_SUN_integrate_colonists: "Postanowiliśmy włączyć nowe terytoria wraz z ich kolonialną ludnością do naszej administracji."
 SUN_resist_european_advance: "Opór wobec ekspansji europejskiej"
 desc_SUN_resist_european_advance: "Nikczemni konkwistadorzy pożądają naszego złota i bogactw. Niech ta żądza doprowadzi ich do zguby na naszych palach."
 SUN_offers_of_peace: "Oferty pokoju"
 desc_SUN_offers_of_peace: "Dziwni ludzie zza mórz przybywają z niejasnymi zamiarami. Wyjdźmy im naprzeciw, aby zadbać o to, by nasze kontakty przyniosły wyłącznie pokój."
 SUN_contacts_with_strange_men: "Kontakty z osobliwymi przybyszami"
 desc_SUN_contacts_with_strange_men: "Ludzie o niezwykłej karnacji założyli osady w pobliżu naszych granic. Nawiążmy z nimi stosunki i sprawdźmy, czy możemy się czegoś nauczyć."
 SUN_symposium_modifier: "Sympozjum starego i nowego"
 desc_SUN_symposium_modifier: "Przyjmijmy wynalazki technologiczne najeźdźców, nie porzucając przy tym naszych odwiecznych przystosowań."
 SUN_combat_penalty_reduction: "Żegluga po Pacyfiku"
 desc_SUN_combat_penalty_reduction: "Dzięki odpowiednim przygotowaniom inwazja na Zachód stanie się rzeczywistością w niedalekiej przyszłości."
 SUN_dragon_slayer: "Pogromca Smoka"
 desc_SUN_dragon_slayer: "Potężny tron Smoka został obalony. Żadna siła ani władza nie jest w stanie powstrzymać naszego pochodu — nawet rzekomy „Syn Niebios”!"
 SUN_destruction_of_france: "Zniszczenie Francji"
 desc_SUN_destruction_of_france: "Żadna kraina nie uniknie naszego gniewu, nawet rzekomo najpotężniejsze państwo Europy Zachodniej."
 SUN_tariffs_for_colonies_modifier: "Kolonia zachodzącego słońca: cła"
 desc_SUN_tariffs_for_colonies_modifier: "Będziemy nakładać podatki na nasze kolonie, nie zapewniając im reprezentacji."
 SUN_gp_for_colonies_modifier: "Kolonia Zachodzącego Słońca: ekspansja gospodarcza"
 desc_SUN_gp_for_colonies_modifier: "Dzięki naszym koloniom zapuściliśmy korzenie, które pozwolą nam rozpocząć wielką ekspansję gospodarczą."
 SUN_less_ld_for_colonies_modifier: "Kolonia Zachodzącego Słońca: biurokracja"
 desc_SUN_less_ld_for_colonies_modifier: "Rozbudowana biurokracja w koloniach pozostawia ich mieszkańcom mniej czasu na wzniecanie buntów."
 SUN_modernization_period: "Okres adaptacji"
 desc_SUN_modernization_period: "Przystosowujemy się do zmian technologicznych, które przynieśli nam Europejczycy."
 SUN_modernization_period_no_dlc: "Okres adaptacji"
 desc_SUN_modernization_period_no_dlc: "Przystosowujemy się do zmian technologicznych, które przynieśli nam Europejczycy."
 SUN_doctrine: "Żegluga po Pacyfiku"
 desc_SUN_doctrine: "Konieczność żeglowania przez Pacyfik w celu zarządzania naszymi zachodnimi posiadłościami nauczyła nas, jak nie zboczyć z kursu."
 SUN_reaching_the_sunlight: "Dotarcie do krainy wschodu słońca"
 desc_SUN_reaching_the_sunlight: "Wreszcie dotarliśmy do krainy, w której wschodzi słońce."
 pacific_voyaging_doctrine: "Żegluga po Pacyfiku"
 pacific_voyaging_doctrine_desc: "Konieczność żeglowania przez Pacyfik w celu zarządzania naszymi zachodnimi posiadłościami nauczyła nas, jak nie zboczyć z kursu."
 CANNOT_EXPAND_AS_SUNSET_COLONY: "§YKolonie Zachodzącego Słońca§! nie mogą wypowiadać wojen, dopóki ich suweren nie wybierze opcji „§YPrzyznaj im autonomię operacyjną§!” w wydarzeniu §YSystem kolonialny§!."
 SUN_sunset_invasion_pp: "Inwazja Zachodzącego Słońca"
 SUN_sunrise_invasion_pp: "Inwazja Wschodzącego Słońca"
 cb_sunrise_invasion: "Inwazja Wschodzącego Słońca"
 cb_sunrise_invasion_desc: "Na zachodzie leżą potężne krainy Smoka i ziemia wschodzącego słońca. Obie powinny obawiać się naszej potęgi."
 SUN_sunrise_invasion_wargoal: "Udowodnij wyższość"
 SUN_sunrise_invasion_wargoal_desc: "Celem wojny jest wykazanie wyższości naszych armii poprzez wygrywanie bitew."
 cb_sunset_invasion: "Inwazja Zachodzącego Słońca"
 cb_sunset_invasion_desc: "Nikczemni koloniści z kontynentu europejskiego ośmielili się postawić stopę na naszym kontynencie. Teraz sami stawimy im czoła."
 SUN_sunset_invasion_wargoal: "Udowodnij wyższość"
 SUN_sunset_invasion_wargoal_desc: "Celem wojny jest wykazanie wyższości naszych armii poprzez wygrywanie bitew."
 SUN_SUNSET_INVASION_WARNAME: "Inwazja $ORDER$na kraj $SECOND_NAME$"
 SUN_ALL_EUROPE: "Wszystkie prowincje na subkontynencie §YZachodniej Europy§! oraz w regionie §YMagrzebu§!"
 SUN_ALL_FAR_EAST: "Wszystkie prowincje na subkontynentach §YDalekiego Wschodu§! i §YChin§!"
 estate_burghers_SUN_support_recovering_populations: "Wsparcie odbudowującej się ludności"
 estate_burghers_SUN_support_recovering_populations_desc: "Nasza ludność została zdziesiątkowana przez obce choroby, które stały się prawdziwą plagą. Zmniejszmy jej podatki i pozwólmy cierpiącym rodzinom podnieść się po tej katastrofie."
 sunset_invasion.1.t: "Los uzurpatorów"
 sunset_invasion.1.d: "Po pokonaniu zamorskich najeźdźców i ich odwrocie do ojczyzny wielu osadników, którzy niegdyś upatrywali w tych ziemiach nowej nadziei na chwałę i zysk, pozostało uwięzionych na naszych terytoriach. Możemy potraktować to jako kolejny podbój, lecz obecność tych ludzi może stać się problemem dla naszego rządu."
 sunset_invasion.1.a: "Wypędzenie to jedyne wyjście."
 sunset_invasion.1.b: "Potraktujmy te ziemie po prostu jako podbite terytoria."
 sunset_invasion.1.c: "Sprowadzimy terror na ich wybrzeża!"
 sunset_invasion.2.t: "W kierunku Europy"
 sunset_invasion.2.d: "Tysiące statków wypłynęło w stronę miejsca, gdzie wschodzi słońce. Tysiące okrętów i dziesiątki tysięcy ludzi gotowych podbić pierwsze napotkane wybrzeże. Jeśli obrońcy będą przygotowani, rozprawimy się z nimi; jeśli nie, nasze zwycięstwo będzie pewne."
 sunset_invasion.2.a: "Odkryjmy, gdzie wschodzi Słońce!"
 sunset_invasion.3.t: "Los Francji"
 sunset_invasion.3.d: "Francuzi słyną z największej dumy w Europie. Ta sama duma doprowadziła jednak do ich upadku. Ich ziemie są teraz na naszej łasce. Możemy zachować ich zabytki albo je zniszczyć, pokazując Europejczykom, co naprawdę oznacza nasza inwazja."
 sunset_invasion.3.a: "Oszczędźmy ich zabytki."
 sunset_invasion.3.b: "Zniszczmy ich dziedzictwo."
 sunset_invasion.4.t: "Inwazja Zachodzącego Słońca"
 sunset_invasion.4.d: "Przed laty europejscy najeźdźcy przybyli na nasze ziemie, szukając nowych szlaków handlowych do Indii. Wypłynęli na zachód, by dotrzeć na wschód, lecz nie wiedzieli, że ich ambicje zaprowadzą ich do nas. Po latach konfliktów, gdy Europa znalazła się pod naszą kontrolą, wreszcie możemy ogłosić się hegemonami Zachodu."
 sunset_invasion.4.a: "Role wreszcie się odwróciły."
 sunset_invasion.5.t: "W stronę zachodzącego Słońca"
 sunset_invasion.5.d: "Gdy spoglądamy na zachód, widzimy zachodzące słońce. Jego zachód oznacza koniec kolejnego dnia i początek nowego cyklu, który bogowie nam wyznaczyli. Wielu naszych ludzi pragnie dowiedzieć się, co czeka nas u kresu tego cyklu, i przygotowuje się do wypłynięcia w stronę zachodzącego słońca."
 sunset_invasion.5.a: "Dopędzimy zachodzące słońce."
 sunset_invasion.6.t: "Inwazja Wschodzącego Słońca"
 sunset_invasion.6.d: "Po wylądowaniu w Azji założyliśmy tam imperium kolonialne. Miejscowa ludność była waleczna, lecz kolejne państwa padały jedno po drugim. Ich obyczaje mogły stanowić dla nas wyzwanie, ale ostatecznie nie kierowali nimi bogowie. To bowiem bogowie pragnęli, byśmy dotarli do krainy wschodzącego słońca i zgładzili smoka Chin."
 sunset_invasion.6.a: "Bogowie będą zadowoleni."
 sunset_invasion.7.t: "System kolonialny"
 sunset_invasion.7.d: "Utworzyliśmy w Europie liczne administracje kolonialne, lecz większość z nich szybko okazała się przestarzała. Nie zdołamy zmodernizować każdego elementu tej administracji, możemy jednak skupić się na jej specjalizacji. Możemy opodatkować tamtejsze kolonie, dostosować biurokrację do naszych potrzeb lub wprowadzić dowolne inne zmiany."
 sunset_invasion.7.a: "Skupmy się na biurokracji."
 sunset_invasion.7.b: "Musimy zadbać o rozwój handlu między ojczyzną a naszymi koloniami."
 sunset_invasion.7.e: "Podatki bez reprezentacji!"
 sunset_invasion.8.t: "Zabić smoka"
 sunset_invasion.8.d: "Chińczycy wychwalają swoich cesarzy, jak gdyby byli prowadzeni przez same niebiosa. Nazywają to Mandatem Niebios. Taka boskość jest jednak jedynie kolejną pożywką dla bogów. Pojmaliśmy chińskiego cesarza, smoka Chin, i możemy teraz go zabić, a jego serce złożyć bogom w ofierze."
 sunset_invasion.8.a: "Smoczy Tron jest teraz pusty."
 european_colony: "Kolonia Zachodzącego Słońca"
 european_colony_long_desc: "Kolonia Zachodzącego Słońca to typ państwa podległego podobny do innych kolonii, z tą różnicą, że można go ustanowić na terytoriach zamorskich. Jego głównym zadaniem jest sprawniejsze zarządzanie ludnością poza Amerykami, przy jednoczesnym utrzymaniu naszej kontroli nad regionem."
 european_colony_is_our: "$NAME|Y$ jest naszą Kolonią Zachodzącego Słońca"
 european_colony_title: "Kolonia Zachodzącego Słońca"
 european_colony_plural: "Kolonie Zachodzącego Słońca"
 european_colony_title_plural: "Kolonie Zachodzącego Słońca"
 is_european_colony: "Jest Kolonią Zachodzącego Słońca"
 create_european_colony: "Ustanów Kolonię Zachodzącego Słońca"
 create_european_colony_title: "Ustanów Kolonię Zachodzącego Słońca"
 create_european_colony_desc: "Przekształć [From.GetName] w §YKolonię Zachodzącego Słońca§!, działającą podobnie do innych kolonii. Możesz ustanowić tylko jedną taką kolonię w każdym regionie."
 create_european_colony_tooltip: "Przekształć [From.GetName] w Kolonię Zachodzącego Słońca."
