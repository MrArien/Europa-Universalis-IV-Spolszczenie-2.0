 GER_distribute_10_base_tax_5_base_production: "Rozdziel §G10§! podatku bazowego i §G5§! produkcji bazowej pomiędzy nasze prowincje spoza §Ygermańskiej§! grupy kulturowej."
 GER_begin_integrating: "Rozpoczniemy integrację wybranej kultury. Proces zakończy się, gdy §Yjedność kulturowa§! osiągnie poziom §Y100,0§!."
 german_cultural_disunity_reform: "Rozdrobnienie kulturowe"
 german_cultural_disunity_reform_desc: "Stulecia rozdrobnienia pod rządami Świętego Cesarstwa Rzymskiego doprowadziły do głębokiego podziału narodu niemieckiego. Musimy to zmienić."
 GER_unlocked_via_kaiserreich: "Ta reforma została odblokowana dzięki misji „§YKaiserreich§!”."
 german_franconian_reform: "Druk norymberski"
 german_franconian_reform_desc: "Nacisk na upowszechnianie wiedzy wysunął nas na czoło postępu intelektualnego."
 german_westphalian_reform: "Westfalska pobożność"
 german_westphalian_reform_desc: "Westfalia przez długi czas znajdowała się pod rządami biskupstwa Münster. To właśnie w Münster anabaptyści chcieli założyć swoją „Nową Jerozolimę”."
 german_rhenish_reform: "Dyplomacja nadreńska"
 german_rhenish_reform_desc: "Nadrenia, gdzie znajdują się Akwizgran i Frankfurt — dwa ważne miasta cesarskie — oraz czterech elektorów, nauczyła nas prowadzić dyplomację z najwyższą skutecznością."
 german_lower_saxon_reform: "Tradycje morskie"
 german_lower_saxon_reform_desc: "Dolna Saksonia, Pomorze i inflanckie wybrzeże Bałtyku są od powstania Hanzy silnie związane z handlem i morzem. Dlatego jesteśmy panami fal."
 german_prussian_reform: "Armia państwem"
 german_prussian_reform_desc: "Od dziesięcioleci możemy poszczycić się wspaniałymi tradycjami wojskowymi. Rozwijajmy je, by nasza armia budziła strach u każdego, kto odważy się nam przeciwstawić."
 german_austrian_reform: "Cesarskie pochodzenie"
 german_austrian_reform_desc: "Bliskość cesarskiego centrum nauczyła nas wielu rzeczy o dyplomacji."
 german_saxon_reform: "Saksońskie górnictwo"
 german_saxon_reform_desc: "Na przestrzeni stuleci górnikom przyznano liczne przywileje i przywileje prawne, dzięki którym Saksonia znalazła się w czołówce wczesnej industrializacji."
 german_bavarian_reform: "Bawarska duma"
 german_bavarian_reform_desc: "Bawaria, będąca ojczyzną wielu regionalnych tradycji i odrębnej kultury, jest znana daleko poza granicami Niemiec."
 german_swiss_reform: "Szwajcarscy landsknechci"
 german_swiss_reform_desc: "Szwajcaria jest regionem niezwykle trudnym do zdobycia, a jednym z jej największych towarów eksportowych są — ku zaskoczeniu wielu — najemnicy. Papież nieustannie korzysta ze szwajcarskich oddziałów, podobnie jak wiele państw Europy. Będziemy nadal świadczyć takie usługi innym i sobie samym."
 german_swabian_reform: "Bankowość Fuggerów"
 german_swabian_reform_desc: "Augsburg jest siedzibą słynnej rodziny Fuggerów, bankierów Świętych Cesarzy Rzymskich i papieży. Kontynuujemy tę tradycję jako bankierzy Europy. Nie obawiajcie się — z pewnością nie zaoferujemy wam pożyczek, które doprowadzą waszą gospodarkę do ruiny."
 german_other_reform: "Cesarstwo Niemieckie"
 german_other_reform_desc: "Władamy potężnym imperium w sercu Europy. Żadne państwo nie może nam się przeciwstawić."
 GER_pick_culture_to_integrate_title: "Wybierz kulturę do integracji"
 GER_pick_culture_to_integrate_desc: "Obecnie nie integrujemy żadnej kultury. Najwyższy czas to zmienić."
 GER_economic_influence: "Wpływy gospodarcze"
 desc_GER_economic_influence: "Potężna gospodarka, powiązana z gospodarkami naszych sąsiadów, pozwala nam wywierać na nich presję ekonomiczną."
 GER_destruction_of_france: "Traktat frankfurcki"
 desc_GER_destruction_of_france: "Francja była jednym z największych przeciwników zjednoczenia Niemiec. Jej klęska pozwoliła nam wreszcie podpisać traktat uznający powstanie nowego wielkiego mocarstwa."
 GER_blut_and_eisen: "Krew i żelazo"
 desc_GER_blut_and_eisen: "Trzeba powiedzieć jasno: o wielkich problemach naszych czasów nie zdecyduje dyplomacja, lecz krew i żelazo."
 GER_shadow_kingdom: "Królestwo wyłaniające się z cienia"
 desc_GER_shadow_kingdom: "Przywróciliśmy Italię do Świętego Cesarstwa Rzymskiego."
 GER_enemies_remain_divided: "Podzielone Włochy są bezpieczniejsze"
 desc_GER_enemies_remain_divided: "Aby zabezpieczyć naszą nowo zdobytą pozycję na arenie międzynarodowej, powinniśmy utrzymać podział Italii."
 GER_hanseatic_doctrine_upgrade: "Ulepszenie doktryny hanzeatyckiej"
 desc_GER_hanseatic_doctrine_upgrade: "Przez lata udoskonalaliśmy naszą doktrynę morską."
 GER_doctrine_of_the_navy: "Flota kupiecka"
 desc_GER_doctrine_of_the_navy: "Naszym ostatecznym celem na morzach jest zbudowanie globalnego imperium połączonego siecią szlaków handlowych."
 GER_wilhelmshaven_modifier: "Port floty Morza Północnego"
 desc_GER_wilhelmshaven_modifier: "Port w tej prowincji został specjalnie rozbudowany z myślą o obsłudze naszej floty na Morzu Północnym."
 GER_resolved_the_border_dispute: "Rozwiązano spór graniczny"
 desc_GER_resolved_the_border_dispute: "Między Królestwem Danii a niemieckim Świętym Cesarstwem Rzymskim od dawna trwał spór graniczny. Odziedziczyliśmy go i ostatecznie rozwiązaliśmy."
 GER_passage_through_the_sound: "Nowe porty na Bałtyku"
 GER_ostsee: "Kontrola nad Bałtykiem"
 GER_max_abso: "Żelazna pięść"
 desc_GER_max_abso: "Nasz kanclerz rządzi żelazną ręką, wzmacniając autorytet cesarza."
 GER_industrialization_rhineland: "Industrializacja Nadrenii"
 desc_GER_industrialization_rhineland: "Rozbudowa przemysłu w Nadrenii wysunęła nas na czoło europejskiej produkcji."
 GER_industrialization_silesia: "Industrializacja Śląska"
 desc_GER_industrialization_silesia: "Górny Śląsk jest naszym drugim najważniejszym ośrodkiem przemysłowym."
 GER_industrialization: "Niemiecka industrializacja"
 desc_GER_industrialization: "Staliśmy się przemysłowym gigantem."
 GER_one_province_gets_converted: "Jeśli to możliwe, jedna losowa §Ypolska§! prowincja zmieni kulturę na §Ypruską§! lub §Ysaską§!."
 GER_merge_industrial_modifier_into_one: "Połącz modyfikatory „§YIndustrializacja Nadrenii§!” i „§YIndustrializacja Śląska§!” w jeden — „§YNiemiecka industrializacja§!” — i zmodyfikuj go następująco:
  Wydajność produkcji: §G+5,0%§!
  Koszt rozwoju: §G-5,0%§!"
 GER_guard_upgrade: "Walka o rewolucję"
 desc_GER_guard_upgrade: "Nasza gwardia jest gotowa walczyć do upadłego, by podtrzymać płomień rewolucji."
 GER_revolutionary: "Płomienie rewolucji"
 desc_GER_revolutionary: "Szlachta wystarczająco długo nas uciskała. Czas zrzucić jej kajdany!"
 GER_rapid_industrialization: "Gwałtowna industrializacja"
 desc_GER_rapid_industrialization: "Wkraczamy w okres szybkiego rozwoju. Miasteczka przekształcają się w miasta, które wyrastają w każdym zakątku kraju."
 GER_mining_provinces_saxon: "Przywileje górnicze"
 desc_GER_mining_provinces_saxon: "Od stuleci przyznajemy górnikom specjalne przywileje, zwiększające wydobycie w kopalniach."
 GER_paper_provinces_franconian: "Frankoński druk"
 desc_GER_paper_provinces_franconian: "Ta prowincja wspiera upowszechnianie wiedzy za pośrednictwem druku."
 GER_refused_to_renew_diploma_andreanum: "Odmówiono odnowienia Dyplomu Andreanum"
 desc_GER_refused_to_renew_diploma_andreanum: "Odmowa odnowienia przywileju wysłała jasny sygnał: zamierzamy integrować nowe terytoria z najwyższą tolerancją."
 GER_transylvanian_saxon_minority: "Mniejszość siedmiogrodzkich Sasów"
 desc_GER_transylvanian_saxon_minority: "W prowincji żyje mniejszość „siedmiogrodzkich Sasów” — potomków germańskich osadników, którzy przybyli tu w XIII wieku."
 GER_defeated_habsburgs: "Pokonano Habsburgów"
 desc_GER_defeated_habsburgs: "Klęska Habsburgów, od dawna dzierżących godność cesarzy Świętego Cesarstwa Rzymskiego, wyprowadza południowych Niemców poza obręb cesarstwa, umożliwiając ich szybszą integrację."
 GER_major_city: "Ważne miasto"
 desc_GER_major_city: "W tej prowincji znajduje się ważne miasto, które przeżywa rozkwit dzięki postępującej urbanizacji."
 GER_a_turn_inwards: "Zwrot ku własnej gospodarce"
 desc_GER_a_turn_inwards: "Elity państwowe pokładają nadzieję na przyszłość gospodarki w rodzimych zasobach, a nie w zagranicznych partnerach."
 GER_fight_against_the_catholic_church: "Walka z Kościołem katolickim"
 desc_GER_fight_against_the_catholic_church: "Polski Kościół katolicki i jego rozległe wpływy stanowią zagrożenie dla państwa."
 GER_stopping_polish_independence_drive: "Powstrzymanie polskich dążeń niepodległościowych"
 desc_GER_stopping_polish_independence_drive: "Mimo wspólnej religii Polacy pozostają odrębnym narodem, silnie dążącym do niepodległości."
 GER_marienburg_castle_seized: "Zdobycie zamku w Malborku"
 desc_GER_marienburg_castle_seized: "Zamek w Malborku, symbol zakonu krzyżackiego aż do jego nieszczęsnego upadku, został zdobyty i góruje teraz nad Prusami Wschodnimi."
 GER_privilege_slot: "Poparcie junkrów"
 desc_GER_privilege_slot: "Pozyskaliśmy poparcie szlachty."
 GER_extra_prov_trade_power: "Część niemieckiej unii celnej"
 GER_early_coal_mining: "Wczesne wydobycie węgla"
 desc_GER_early_coal_mining: "W tej prowincji znajduje się kopalnia węgla, choć jej wydobycie nie służy jeszcze celom przemysłowym."
 GER_treaty_port: "Port traktatowy"
 desc_GER_treaty_port: "Ta prowincja jest niemieckim portem traktatowym, zapewniającym znaczne korzyści handlowe mimo niewielkich rozmiarów."
 GER_diplomatic_revolution: "Rewolucja dyplomatyczna"
 desc_GER_diplomatic_revolution: "Musimy wytyczyć nowy kierunek naszej polityki."
 GER_the_reform_is_unlocked: "Powyższa §Yreforma§! została odblokowana, ale nie została przyjęta."
 GER_staying_in_lubeck: "Pozostanie w Lubece"
 desc_GER_staying_in_lubeck: "Postanowiliśmy przedkładać własne porty ponad wszystkie inne."
 GER_accepted_cultures: "\\nLiczba kultur zintegrowanych z §Yjednością kulturową§!"
 cultural_unity_gain_modifier: "Modyfikator przyrostu jedności kulturowej"
 monthly_cultural_unity: ""
 cultural_unity_desc: "§YJedność kulturowa§! określa stopień integracji danej kultury z naszym państwem. Aby uznać kulturę za zintegrowaną, jej §Yjedność kulturowa§! musi osiągnąć 100. Po integracji kultura nie zajmuje już miejsca w limicie §Ykultur akceptowanych§!, a przy odpowiednim poziomie §Yintegracji§! możemy utworzyć §Yunię kulturową§!. Z czasem misja „§YZaufaj sąsiadowi§!” pozwoli nam usunąć brak §Yunii kulturowej§!. Aby rozpocząć §Yintegrację§! kultury, należy skorzystać z decyzji „§YWybierz kulturę do integracji§!”.\n\nPrzyrost jedności kulturowej:\nPodstawa: §G+0,83§! miesięcznie.\nKultura docelowa jest akceptowana: §G+0,33§! miesięcznie.\nStabilność: od §R-0,3§! do §G+0,3§! miesięcznie.\nRozwój prowincji kultury docelowej: §G+1,50§! za każdy punkt rozwoju.\nBrak przynależności do germańskiej grupy kulturowej: §R-1,00§!\nBrak integracji kultury: §R-1,00§!\nPokój: §G+0,1§!\nWyczerpanie wojenne: §R-0,05§! za każdy punkt wyczerpania wojennego.\nJedność religijna: §G+0,1§! przy 100,0%.\nPrawowitość: od §R-0,1§! do §G+0,1§!.\nUkończone idee dworskie: §G+0,5§!\n\n"
 ability_cultural_unity_mechanic: "Mechanika jedności kulturowej"
 GET_can_integrate_a_culture: "Istnieje §yniemiecka§! kultura, która może być §Yzintegrowana§!."
 GER_not_integrating_a_culture: "Obecnie nie trwa §Yintegracja§! żadnej kultury."
 GER_until_demotion: "do momentu zdegradowania tej §Ykultury§!"
 GER_prussian_modifier: "Zintegrowana kultura: Pruska"
 desc_GER_prussian_modifier: "Zintegrowana kultura: pruska"
 GER_lower_saxon_modifier: "Zintegrowana kultura: dolnosaksońska"
 desc_GER_lower_saxon_modifier: "Zintegrowana kultura: dolnosaksońska"
