 has_completed_hsn_suez_canal_tt: "Ukończono misję §YKanał As-Suwajs§!"
 ORM_mahra_title: "Podporządkowanie Mahryjczyków"
 ORM_mahra_desc: "Południowa Arabia jest ojczyzną Mahryjczyków, ludu o kulturze odmiennej od pozostałych plemion arabskich. Podobnie jak my słyną oni z żeglarskich umiejętności, co czyni ich jednak naszymi konkurentami. Wkroczymy na ich ziemie i zmusimy ich do uznania naszego panowania."
 ORM_holy_cities_title: "Opiekun Świętych Miast"
 ORM_holy_cities_desc: "Świętymi Miastami świata islamu władają słabeusze. My, kupcy z [Root.GetName], dysponujący złotem i stalą, znacznie lepiej nadajemy się do pełnienia funkcji opiekuna. Mekka i Medyna wkrótce znajdą się w naszych rękach."
 ORM_india_title: "Powiązania w Indiach"
 ORM_india_desc: "Nasi kupcy mają placówki nawet na ziemiach Indii. Wielu z nich jest jednak uciskanych przez władców licznych indyjskich królestw. Wyruszmy więc w morze i pomóżmy im odzyskać należne wpływy w Indiach."
 ORM_malay_title: "Wybrzeża Malajów"
 ORM_malay_desc: "Choć wpływy naszych kupców kończą się na indyjskich portach, ziemie Azji Południowo-Wschodniej od dawna znajdują się pod wpływem muzułmańskich handlarzy. Jeśli popłyniemy tam i przejmiemy tamtejsze szlaki handlowe, jeszcze bardziej rozszerzymy nasze wpływy w Azji."
 ORM_spice_trade_title: "Korzenie muszą płynąć"
 ORM_spice_trade_desc: "Przyprawy mogą nie przynosić naszemu państwu bezpośrednich korzyści, lecz sam handel nimi okazał się dla nas bardzo dochodowy. Musimy zabezpieczyć dostęp do przypraw i odpędzić konkurentów, jeśli chcemy zmonopolizować ten cenny towar."
 ORM_oman_title: "Zmierzch Omanu"
 ORM_oman_desc: "Od wielu lat toczymy konflikt z sułtanatem Omanu. Jego wpływy ograniczają się już do fortu Nizwa, a klęska jest nieunikniona. Uderzmy po raz ostatni i wymażmy jego wpływy z naszych ziem."
 ORM_central_arabia_title: "Konsolidacja Arabii Środkowej"
 ORM_central_arabia_desc: "Arabię Środkową zamieszkuje wiele wrogich plemion, znacznie lepiej od nas obeznanych z walką na pustyni. Brakuje im jednak bogactwa, by stawić nam opór. Nasze złoto pozwoli zwerbować tysiąc wojowników, a z ich pomocą podporządkujemy sobie te plemiona."
 ORM_Baghdad_title: "Upadek Bagdadu"
 ORM_Baghdad_desc: "Dom Mądrości jest prawdopodobnie najsłynniejszą biblioteką świata islamu. Założony w Bagdadzie, przyczynił się do rozkwitu islamskiego złotego wieku. Od czasu najazdu Mongołów utracił jednak dawną świetność. Pomożemy mu odzyskać jeszcze większą chwałę, zaczynając od zdobycia Bagdadu."
 ORM_unify_arabia_title: "Nasz półwysep"
 ORM_unify_arabia_desc: "Wreszcie ziemie Arabii zostały zjednoczone. Od upadku kalifatu, gdy kalif stał się jedynie marionetką, świat islamu pozostawał podzielony. Teraz, gdy zjednoczyliśmy ziemie proroka, możemy ogłosić się nowym kalifem."
 ORM_trading_outposts_title: "Poszerzenie naszych wpływów"
 ORM_trading_outposts_desc: "Jeśli kiedykolwiek mamy stworzyć sieć handlową poza Arabią, musimy przygotować się do zdobywania i umacniania zamorskich placówek. Aby je założyć, potrzebujemy floty, która wesprze naszych kupców w działalności handlowej poza ojczyzną."
 ORM_china_title: "Chińskie bogactwa"
 ORM_china_desc: "Chiny są prawdopodobnie najbogatszym regionem, jaki kiedykolwiek napotkali nasi kupcy. Od herbaty i porcelany po wszelkie towary, których brakuje w świecie islamu. Zdobywając wpływy w chińskich portach, możemy utworzyć nową kompanię, która przyniesie nam niewyobrażalne zyski."
 ORM_thalassocracy_title: "Arabska talassokracja"
 ORM_thalassocracy_desc: "Nasze marzenia o dominacji kupieckiej i morskiej nad Oceanem Indyjskim oraz resztą Azji wreszcie się spełniły. Nasi kupcy mogą swobodnie kupować i sprzedawać swoje towary w każdym zakątku zamorskiego imperium. Niech rozpocznie się nowa era dla przedsiębiorczych kupców islamu."
 ORM_haasa_title: "Ziemia Bahrajnu"
 ORM_haasa_desc: "Bahrajn jest ojczyzną jednych z najcenniejszych klejnotów Arabii. Kontrolują je jednak obcy, którzy nie wykorzystują ich pełnego potencjału. Być może nadszedł czas, by przejąć te ziemie i handlować klejnotami na własny rachunek."
 ORM_yemen_title: "Podbój Jemenu"
 ORM_yemen_desc: "Jemen leży na skrzyżowaniu szlaków między Arabią a Afryką. Jest również producentem jednej z najsłynniejszych kaw na świecie. Jemeńczycy są jednak naszymi wrogami i musimy się z nimi rozprawić. Podbijemy ich tak jak resztę Arabii."
 ORM_buffing_outposts_title: "Zamorskie placówki"
 ORM_buffing_outposts_desc: "Aby nasi kupcy mieli szansę na sukces z dala od Arabii, musimy zapewnić im wsparcie. Zakładając nowe placówki i rozbudowując je w celu zabezpieczenia szlaków handlowych, pozwolimy im jeszcze bardziej umocnić wpływy na obcych ziemiach."
 ORM_trade_influence_mechanic_title: "Najlepsi kupcy Arabii"
 ORM_trade_influence_mechanic_desc: "Mieszkańcy [Root.GetName] są najsłynniejszymi kupcami Arabii. Ich wpływy sięgają wielu portów Oceanu Indyjskiego, a my czerpiemy z tego znaczne korzyści. Być może jeśli przyznamy niektórym kupcom większą władzę w naszym państwie, będą skłonni jeszcze bardziej nam pomóc."
 ORM_even_more_trade_influence_buff_title: "Dominacja na Oceanie Indyjskim"
 ORM_even_more_trade_influence_buff_desc: "Ocean Indyjski jest ogromny, ale nie powstrzyma nas to przed zdobyciem nad nim władzy. Zabezpieczymy szlaki handlowe, a nasze statki zapanują nad jego wodami — wszystko w imię zysku."
 ORM_exploiting_the_secret_title: "Wykorzystanie tajemnicy kawy"
 ORM_exploiting_the_secret_desc: "Kawa z Jemenu jest jednym z najbardziej dochodowych towarów Arabii. Jako kupcy powinniśmy wykorzystać tę okazję i zwiększyć produkcję tego dobra."
 ORM_across_hormuz_title: "Przez cieśninę Ormuz"
 ORM_across_hormuz_desc: "Zatoka Perska może znajdować się pod naszą kontrolą, lecz po jej drugiej stronie leży Persja, gdzie niegdyś posiadaliśmy własne ziemie. Przygotujmy siły inwazyjne i spróbujmy odzyskać to, co utraciliśmy w przeszłości."
 ORM_reclaim_lost_territory_title: "Perski przyczółek"
 ORM_reclaim_lost_territory_desc: "Po ustanowieniu przyczółka w Persji musimy przygotować się do zabezpieczenia umocnień w głębi lądu. Perskie królestwa mogą próbować stawić nam opór, lecz dopilnujemy, byśmy już nigdy nie ponieśli klęski."
 ORM_timurs_overlord_title: "Władca zza kulis Timura"
 ORM_timurs_overlord_desc: "Naszymi najbardziej zaufanymi, a zarazem nie do końca godnymi zaufania partnerami mogą być Timurydzi, którzy niegdyś udzielili nam pomocy. Ich państwo jest jednak teraz rozbite. Być może możemy pociągać za sznurki zza ich pleców i przejąć kontrolę nad imperium timurydzkim."
 ORM_hormuz_toll_title: "Cło w Ormuz"
 ORM_hormuz_toll_desc: "Kontrola nad Zatoką Perską pozwoliła nam przejąć handel między Azją a Bliskim Wschodem, ponieważ każdy statek zmierzający do Mezopotamii musi przepłynąć przez nasze wspaniałe miasto. Jeśli nałożymy rozsądne cło na każdą przepływającą flotę, być może jeszcze bardziej zwiększymy zyski z handlu prowadzonego przez cudzoziemców."
 ORM_gems_of_arabia_title: "Klejnoty Arabii"
 ORM_gems_of_arabia_desc: "Arabskie klejnoty są znane w całym świecie islamu. Nasze pragnienie bogactwa stale jednak rośnie. Musimy zwiększyć wydobycie tych klejnotów, abyśmy wszyscy mogli żyć jak królowie."
 ORM_religious_propogation_title: "Drogi Proroka"
 ORM_religious_propogation_desc: "Jeśli kupcy świata islamu czegoś dokonali, to z pewnością rozprzestrzenili swoją wiarę w całej Azji dzięki handlowi. Przekazują nasze nauki, najpierw przedstawiając je mieszkańcom nowych wybrzeży, do których docierają, a następnie pozwalając ludności stopniowo się nawracać. Podążymy tą tradycją, by szerzyć naszą wiarę w każdym zakątku świata."
 ORM_fars_title: "Kampania w Farsie"
 ORM_fars_desc: "Władcy Farsu od zawsze stanowili zagrożenie dla naszego państwa. Organizują przeciw nam wyprawy i rywalizują o kontrolę nad Zatoką Perską. Musimy ich pokonać, aby raz na zawsze usunąć to zagrożenie."
 ORM_persia_title: "Dominacja nad Persją"
 ORM_persia_desc: "Ziemie Persji stanowią doskonałą bazę dla naszych kupców. Leżąc na skrzyżowaniu szlaków między światem islamu, Chinami i Indiami, region ten pozwoli nam skuteczniej kierować handel do naszego państwa."
 ORM_fortifying_hormuz_title: "Ufortyfikowanie wyspy"
 ORM_fortifying_hormuz_desc: "Ormuz jest wyspą, lecz nadal może paść ofiarą ataku każdego, kto zechce nas zniszczyć. Dodatkową korzyścią będzie jeszcze większa kontrola nad handlem w regionie, dlatego wielu naszych kupców domaga się rozwiązania tego problemu."
 ORM_ibadi_religion_title: "Odłam ibadycki"
 ORM_ibadi_religion_desc: "Ziemie Omanu są ojczyzną szkoły ibadyckiej, której wyznawcy sprawiają nam kłopoty od czasu wzrostu naszych wpływów w regionie. Musimy rozwiązać ten problem — tolerując ich, nawracając albo przyjmując ich nauki i szerząc je dalej..."
 arabic_plutocracy_reform: "Arabijska plutokracja"
 arabic_plutocracy_reform_desc: "Podczas gdy inne arabskie państwa opierają swoje rządy na wierze lub sile, my kierujemy się najważniejszą rzeczą, jaką zna ten świat: pieniędzmi. Ta forma rządów koncentruje się na pomnażaniu majątku i wpływach zamorskich, aby jeszcze bardziej umocnić zależność państwa od handlu."
 ability_arabic_trade_influence: "Arabski merkantylizm"
 arabic_trade_influence_power_desc: "§YArabski merkantylizm§! odzwierciedla nasze zamorskie powiązania handlowe.\\n\\nZyskujemy go dzięki:\\n   -Wysokiej §Ytradycji morskiej§![Root.GetArabicTradeDescMOH][Root.GetArabicTradeDescWONDHA]\\n   -Umiejętności §Ydyplomatycznej§! władcy\\n   -Pozostawaniu w stanie §Ypokoju§!\\n\\nTracimy go z powodu:\\n   -Wysokiej §Ykorupcji§!\\n   -Niskiego §Yudziału dochodów z handlu§!\\n   -Wysokiego §Ywyczerpania wojennego§!\\n   -Prowadzenia §Ywojny§!\\n\\n"
 arabic_trade_influence_power_desc_MOH: "\\n   -Trwania §YZłotej ery§!"
 arabic_trade_influence_power_desc_WON_DHA: "\\n   -Posiadania §Ykompanii handlowych§! z co najmniej §Y51%§! §Yprowincjonalnej siły handlowej węzła§!"
 arabic_trade_influence_power: "Arabski merkantylizm"
 monthly_arabic_trade_influence_power: "Miesięczny przyrost arabskiego merkantylizmu"
 arabic_trade_influence_power_gain_modifier: "Modyfikator przyrostu arabskiego merkantylizmu"
 propogate_religion_interaction: "Wzmocnienie szerzenia religii"
 propogate_religion_interaction_desc: "Wzmocnienie wsparcia dla kupców pragnących szerzyć islam w zagranicznych portach pozwoli nam skuteczniej rozprzestrzeniać naszą religię."
 strengthen_outposts_interaction: "Wzmocnienie zamorskich placówek"
 strengthen_outposts_interaction_desc: "Wpływy naszych placówek handlowych osłabły. Musimy zadbać o to, by ten spadek się zatrzymał."
 support_overseas_merchants_interaction: "Wsparcie zamorskich kupców"
 support_overseas_merchants_interaction_desc: "Wielu naszych kupców zostało bez wsparcia i pilnie potrzebuje pomocy. Przekazanie im niezbędnych środków może pomóc skuteczniej konkurować."
 ORM_ALLOW_PROPAGATION_OF_RELIGION_EARLIER: "\\nPrzez następne §Y15§! lat możemy §Ykrzewić religię§! bez konieczności posiadania §Y[Root.Religion.GetName]§! jako dominującego wyznania. Wymagany udział w sile handlowej zostanie również zmniejszony do §Y35%§!."
