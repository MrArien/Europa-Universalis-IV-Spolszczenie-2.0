 TIM_yuan_title: "[Root.GetPreviewColorTIM]Ambicje w państwie Yuan[Root.GetPreviewColorTIM_end]"
 TIM_rumors_of_rebellion_title: "Pogłoski o buncie"
 TIM_rumors_of_rebellion_desc: "Powierzyliśmy Muhammadowi bin Bajsankorowi zarządzanie ziemiami na zachodzie. Od tamtej pory okazuje nam wyłącznie lekceważenie, umacniając tam własną władzę i ignorując Herat. Takiej zuchwałości nie możemy tolerować."
 TIM_mushasha_title: "Zaprowadzenie porządku w Chuzestanie"
 TIM_mushasha_desc: "Millenarystyczny zakon Muszasza, któremu przewodzi charyzmatyczny Muhammad ibn Falah, sprawuje obecnie kontrolę nad Chuzestanem. Nie jest to pierwsza sekta millenarystyczna, która powstała w tym regionie, a działalność innych radykalnych ugrupowań stworzyła już niebezpieczny precedens. Musimy pozbyć się tego zagrożenia."
 TIM_trade_in_west_title: "[Root.GetPreviewColorTIM]Handel na zachodzie[Root.GetPreviewColorTIM_end]"
 TIM_trade_in_west_desc: "Odzyskaliśmy znaczną część zachodnich ziem, lecz musimy znać granice naszych możliwości i umocnić tamtejsze rządy. Powinniśmy również przywrócić podupadłe szlaki handlowe, przerwane przez wieloletnie konflikty w tym regionie."
 TIM_mamluks_title: "[Root.GetPreviewColorTIM]Urojenia Mameluków[Root.GetPreviewColorTIM_end]"
 TIM_mamluks_desc: "Potężny Sułtanat Mameluków w Egipcie jest jednym z dwóch najpotężniejszych państw muzułmańskich w całym Dar al-Islam. Musimy zatem upokorzyć to mocarstwo."
 TIM_rightful_protector_title: "Prawowity obrońca"
 TIM_rightful_protector_desc: "Władcy noszący tytuł [Root.Monarch.GetTitle] w państwie [Root.GetName] są oskarżani o podporządkowanie się mongolskiej jassie i innym tradycjom. Musimy udowodnić naszym perskim poddanym, że jesteśmy w pełni oddani reformowaniu państwa."
 TIM_defy_the_yasa_title: "Odrzucenie jassy"
 TIM_defy_the_yasa_desc: "Mongolska jassa stanowi najważniejszy zbiór praw i tradycji, których przestrzegamy. Budzi to sprzeciw wielu przedstawicieli ulemów i zapewnia wojsku zbyt duży wpływ na sprawy administracyjne. Musimy złagodzić napięcia na dworze."
 TIM_diwan_title: "Timurydzki diwan"
 TIM_diwan_desc: "Timurydzki diwan składa się z dwóch izb. Jedna zajmuje się efektywnym wykorzystaniem ziemi, dzierżawą podatków i ogólną administracją, druga zaś wszystkimi sprawami wojskowymi. Pierwsza jest zdominowana przez perską szlachtę, podczas gdy druga wywodzi się z plemion."
 TIM_military_title: "Zreformuj wojsko"
 TIM_military_desc: "Nasza armia, choć niezwykle potężna, zaczyna ulegać dekadencji szerzącej się wśród elit społeczeństwa. Wpływowi możni prędzej czy później padną ofiarą własnej pychy."
 TIM_recruits_title: "Tadżyccy rekruci"
 TIM_recruits_desc: "Aby zwiększyć siłę naszych wojsk, zrekrutujmy pułki spośród miejscowej ludności irańskiej. Nie dorównują może umiejętnościami naszym tureckim żołnierzom, lecz nadal mogą stać się cennym wsparciem dla armii."
 TIM_rise_of_artillery_title: "[Root.GetPreviewColorTIM]Nadejście ery prochu[Root.GetPreviewColorTIM_end]"
 TIM_rise_of_artillery_desc: "Czasy się zmieniają i coraz wyraźniej widać, że o przyszłych wojnach nie będzie już rozstrzygać szarża kawalerii, lecz huk armat. Musimy znaleźć się w awangardzie tej technologicznej przemiany."
 TIM_horsemen_of_apocalypse_title: "[Root.GetPreviewColorTIM]Jeźdźcy apokalipsy[Root.GetPreviewColorTIM_end]"
 TIM_horsemen_of_apocalypse_desc: "Nasza kawaleria cieszy się ponurą sławą. Wszędzie, dokąd ją poślemy, sieje zniszczenie i strach. Podtrzymujmy tę reputację i zadbajmy, by samą grozą potrafiła zapewniać nam zwycięstwa."
 TIM_fresh_blood_title: "Świeża krew"
 TIM_fresh_blood_desc: "Trzeba przyznać, że w ostatnich dekadach państwo Timurydów nie prowadziło wielu wojen. Z każdym rokiem odchodzą kolejne pokolenia doświadczonych wojowników i dowódców, których zastępują niedoświadczeni generałowie. Nie możemy pozwolić, by ten stan się utrzymał."
 TIM_traitor_title: "Pokonać zdrajcę"
 TIM_traitor_desc: "Muhammad bin Bajsankor z każdym rokiem staje się coraz potężniejszy. Jego działania w Isfahanie nie pozostawiają wątpliwości, że jest zdrajcą. Nie okażemy mu litości."
 TIM_qoyunlu_title: "Poskromienie plemion Qoyunlu"
 TIM_qoyunlu_desc: "Plemiona Qoyunlu ośmielają się podważać naszą zwierzchność. Co więcej, wysyłają wyprawy, by zdobywać przygraniczne miasta, takie jak Kazwin czy Soltanije. Musimy ukrócić ich zuchwałość i nauczyć je szacunku dla naszej władzy."
 TIM_ottomans_title: "[Root.GetPreviewColorTIM]Osmańska buta[Root.GetPreviewColorTIM_end]"
 TIM_ottomans_desc: "Dynastia osmańska ośmieliła się odrzucić naszą zwierzchność. Zetrzyjmy tych pyszałków z powierzchni ziemi. Nie będziemy tolerować takiej pogardy."
 TIM_great_power_title: "[Root.GetPreviewColorTIM]Wśród wielkich mocarstw[Root.GetPreviewColorTIM_end]"
 TIM_great_power_desc: "Pokonaliśmy naszych najpotężniejszych muzułmańskich rywali i możemy wreszcie ogłosić się obrońcami Dar al-Islam oraz mocarstwem, z którym należy się liczyć. Jesteśmy prawdziwymi następcami imperium Timura."
 TIM_land_tenure_title: "Reforma systemu własności ziemskiej"
 TIM_land_tenure_desc: "Nasz system dzierżawy podatków znajduje się w opłakanym stanie. Dziesięciolecia przyznawania zwolnień podatkowych na nadanych ziemiach, zwanych sojurgalami, poważnie osłabiły skarbiec. Musimy zreformować sposób zarządzania administracją podatkową państwa."
 TIM_soyurghals_title: "[Root.GetPreviewColorTIM]Reforma sojurgali[Root.GetPreviewColorTIM_end]"
 TIM_soyurghals_desc: "Choć instytucja sojurgali przynosiła wcześniej szkody naszej gospodarce, być może uda się ją przekształcić w taki sposób, by nie dochodziło do nadużyć, a państwo czerpało z niej długofalowe korzyści."
 TIM_rugs_title: "[Root.GetPreviewColorTIM]Perskie dywany[Root.GetPreviewColorTIM_end]"
 TIM_rugs_desc: "Persja słynie z najwspanialszych dywanów. Jako prawowici następcy Persów podtrzymajmy tradycję ich wytwarzania i zaopatrujmy świat w dywany produkowane w Persji. Dziś będą to dywany, a jutro — wszystko inne."
 TIM_chagatai_elites_title: "Elita czagatajska"
 TIM_chagatai_elites_desc: "Wśród tureckich elit naszej armii trwa nieustanna rywalizacja. Muszą zjednoczyć się we wspólnej walce, lecz jej celem powinni być wyłącznie nasi wrogowie."
 TIM_ulugh_beg_observatory_title: "[Root.GetPreviewColorTIM]Obserwatorium Uług Bega[Root.GetPreviewColorTIM_end]"
 TIM_ulugh_beg_observatory_desc: "Uług Beg, jeden z naszych namiestników i przywódca sprawy timurydzkiej w Transoksanii, hojnie wspiera rozwój nauki. To właśnie dzięki niemu w Samarkandzie powstało wspaniałe obserwatorium. Kontynuujmy jego patronat nad badaniami."
 TIM_governors_at_bay_title: "Ujarzmienie namiestników"
 TIM_governors_at_bay_desc: "Nasza kontrola nad namiestnikami nieustannie słabnie. Mimo szanowanych rządów Szahrucha pojawiają się oznaki buntu, a po jego śmierci państwu grozi rozpad i wojna domowa. Nie możemy do tego dopuścić."
 TIM_timurid_empire_title: "Imperium Timurydów"
 TIM_timurid_empire_desc: "Mimo przeciwności i groźby niestabilności udało nam się przetrwać burzę i odwrócić zgubny bieg wydarzeń. Nadszedł czas, by stworzyć imperium równie sławne jak państwo Czyngis-chana. W końcu jesteśmy Gurkanami — zięciami wielkiego chana."
 TIM_mazandaran_title: "Odzyskanie Mazandaran"
 TIM_mazandaran_desc: "Nadmorskie państewka Tabaristanu są słabe, podzielone, a mimo to niezwykle odporne na obce wpływy i podbój. Ich upadek może zapoczątkować długi okres licznych buntów. Musimy być gotowi rozwiązać ten problem raz na zawsze."
 TIM_caucasia_title: "Podbój Kaukazu"
 TIM_caucasia_desc: "Kaukaz stanowi naturalną barierę między irańskim centrum naszego państwa a wojowniczymi plemionami stepu pontyjskiego. Musimy ostatecznie zabezpieczyć lojalność tych ziem."
 TIM_herat_title: "Rozwój Heratu"
 TIM_herat_desc: "Herat, perła Chorasanu, jest naszą stolicą od 1405 roku, gdy Szahruch podjął przełomową decyzję o przeniesieniu jej z Samarkandy. Od tego czasu miasto stało się centrum mecenatu kulturalnego w naszym państwie. Powinniśmy nadal wspierać rozwój tego wspaniałego ośrodka."
 TIM_persian_capital_title: "Perska stolica"
 TIM_persian_capital_desc: "Choć Herat leży na pograniczu, jest bez wątpienia miastem irańskim. Przeniesienie tu stolicy było przemyślaną decyzją — miasto odegra ważną rolę w przemianie naszego państwa w bardziej osiadły, perski sułtanat."
 TIM_seat_of_operations_title: "[Root.GetPreviewColorTIM]Przygotowanie zaplecza wojennego[Root.GetPreviewColorTIM_end]"
 TIM_seat_of_operations_desc: "Ludy koczownicze nieustannie przemieszczają się z miejsca na miejsce. My również potrzebujemy jednak bezpiecznej siedziby, w której [Root.Monarch.GetTitle] będzie mógł rezydować i planować kolejne podboje. [Root.Capital.GetName] doskonale spełni to zadanie."
 TIM_persian_acculturation_title: "[Root.GetPreviewColorTIM]Persjanizacja[Root.GetPreviewColorTIM_end]"
 TIM_persian_acculturation_desc: "Lojalność przywódców plemiennych jest zawsze krucha i zmienna. Tylko silni i autorytarni władcy potrafią utrzymać plemiona w ryzach. Przejście do bardziej osiadłego modelu władzy pomoże rozwiązać ten problem."
 TIM_heirs_of_ancients_title: "[Root.GetPreviewColorTIM]Dziedzice starożytnych[Root.GetPreviewColorTIM_end]"
 TIM_heirs_of_ancients_desc: "Naszą najważniejszą ambicją i głównym celem persjanizacji jest uznanie nas za prawdziwe imperium perskie, a nie brutalną siłę najeźdźczą, która przynosi wyłącznie zniszczenie."
 TIM_baluchistan_title: "Pogranicze Beludżystanu"
 TIM_baluchistan_desc: "Słabo zaludniony Beludżystan zamieszkuje wiele plemion, które niekoniecznie uznają zwierzchność naszego [Root.Monarch.GetTitle]. Musimy je sobie podporządkować, zanim staną się poważnym zagrożeniem."
 TIM_hindusthan_title: "[Root.GetPreviewColorTIM]Podbój Hindustanu[Root.GetPreviewColorTIM_end]"
 TIM_hindusthan_desc: "Indie kryją niezliczone bogactwa. Rządziło nimi wiele muzułmańskich dynastii, w tym potężny Sułtanat Delhijski, który niegdyś władał większością subkontynentu. Timur położył kres jego istnieniu, a my ponownie zmusimy indyjskich władców do ugięcia kolan."
 TIM_frontiers_title: "[Root.GetPreviewColorTIM]Wschodnie pogranicza[Root.GetPreviewColorTIM_end]"
 TIM_frontiers_desc: "Bogactwa Indii są ogromne i niezwykle kuszące. Podbój i bezpośrednie rządy nad tym krajem byłyby jednak trudnym zadaniem. Znacznie lepiej będzie zapewnić sobie przewagę, wiążąc indyjskie gospodarki z naszym handlem i skutecznie chroniąc pogranicze."
 TIM_recover_north_title: "Odzyskanie północy"
 TIM_recover_north_desc: "Ziemie za rzeką Amu-daria wielokrotnie padały ofiarą najazdów i grabieży Szejbanidów z północy, którzy próbowali uszczknąć dla siebie część tych terytoriów. Odzyskajmy je i rozszerzmy nasze władztwo."
 TIM_tokhtamysh_title: "[Root.GetPreviewColorTIM]Dziedzictwo Tochtamysza[Root.GetPreviewColorTIM_end]"
 TIM_tokhtamysh_desc: "Zaledwie kilka dekad temu, za życia Timura, ziemie zachodniego stepu były podzielone. Pojawił się jednak Tochtamysz, którego ambicja i wsparcie Timura pozwoliły zjednoczyć ziemie Złotej Ordy. Ostatecznie zwrócił się przeciwko swemu dobroczyńcy i poniósł konsekwencje. Od tamtej pory żaden chan nie zdołał dorównać temu, co Tochtamysz osiągnął dzięki pomocy Timura. Umocnijmy naszą władzę w tym regionie."
 TIM_madrasa_title: "Medresa w Heracie"
 TIM_madrasa_desc: "Kontynuując rozbudowę naszej stolicy, wznieśmy kolejne medresy, w których spotykają się tradycje uczonych i duchownych. Umocni to rozwój miasta i pozwoli mu jeszcze bardziej rozkwitnąć."
 TIM_golden_age_title: "Złoty wiek Timurydów"
 TIM_golden_age_desc: "Pod rządami późnego imperium Timurydów wszystkie dziedziny kultury przeżyły prawdziwe odrodzenie. Dzięki mecenatowi władców i wpływowych możnych artyści oraz architekci mogli rozwinąć skrzydła w Heracie i na innych znamienitych dworach. Elity zaczęły również tworzyć dzieła w językach perskim i uzbeckim, umacniając tę epokę rozkwitu kultury."
 TIM_trade_with_india_title: "Handel z Indiami"
 TIM_trade_with_india_desc: "Indie słyną ze swego bogactwa. Rozszerzenie wymiany handlowej z tym regionem przyniesie korzyści naszemu skarbcowi."
 TIM_silk_road_title: "[Root.GetPreviewColorTIM]Przywrócenie Jedwabnego Szlaku[Root.GetPreviewColorTIM_end]"
 TIM_silk_road_desc: "Stopniowy rozpad porządku stworzonego przez imperium mongolskie doprowadził do upadku Jedwabnego Szlaku. Musimy odbudować wszystkie ogniwa, których utrata spowodowała degradację tego szlaku handlowego."
 TIM_east_title: "Zabezpieczenie wschodu"
 TIM_east_desc: "Wschodnie pogranicza są znacznie słabiej zurbanizowane niż zachód, a władają nimi plemiona, które uznają naszą władzę tylko wtedy, gdy jest im to na rękę. Nadszedł czas, by mocniej zacisnąć kontrolę nad tymi ziemiami."
 TIM_delhi_title: "Rzucić wyzwanie Delhi"
 TIM_delhi_desc: "Zuchwali Lodowie z Delhi ośmielają się sprzeciwiać naszej woli. Nie możemy tolerować takiej bezczelności i musimy szybko się z nimi rozprawić. Skoro lekceważą nasze rozkazy, nie będziemy okazywać im dobrej woli podczas wymierzania kary."
 TIM_river_title: "[Root.GetPreviewColorTIM]Wzdłuż rzeki[Root.GetPreviewColorTIM_end]"
 TIM_river_desc: "Ziemie nad Indusem, rządzone przez władców Multanu i Sindhu, są silnie związane z kulturą perską. Ich mieszkańcy wyznają islam, a same terytoria stanowią naturalne przedłużenie naszego państwa."
 TIM_northern_flank_title: "Umocnienie północnej flanki"
 TIM_northern_flank_desc: "Szejbanidzi i chanat Moghulistanu wielokrotnie naruszają nasze północne granice. Musimy powstrzymać ich dalszą ekspansję."
 TIM_moghulistan_title: "Osłabienie Moghulistanu"
 TIM_moghulistan_desc: "Rywalizujące chanaty na wschodzie mogą stanowić dla nas poważne zagrożenie. Musimy doprowadzić do ich upadku i pozyskać lojalność tamtejszych plemion, by zwiększyć nasze siły przed przyszłymi kampaniami."
TIM_yuan_title: "[Root.GetPreviewColorTIM]Ambicje wobec Yuan[Root.GetPreviewColorTIM_end]"
 TIM_yuan_desc: "Timur marzył o stworzeniu potężnego państwa będącego następcą Imperium Mongolskiego. Choć jego cel był szlachetny i ambitny, ostatecznie nie zdołał go osiągnąć — zmarł w drodze na podbój Yuan, jednego z najważniejszych, jeśli nie najważniejszego, regionów Imperium Mongolskiego. My podejmiemy się realizacji jego dziedzictwa."
 TIM_sufi_support_title: "Wsparcie dla sufich"
 TIM_sufi_support_desc: "W większości państw Zachodu, a zwłaszcza w okolicach Świętych Miast, instytucje sufickie traktowane są z lekceważeniem. Na wschodzie, w państwie Timurydów, sufi stanowią integralną część społeczeństwa, a jeszcze dalej na wschód, w Indiach, są jedną z głównych sił napędzających nawrócenia."
 TIM_ansari_title: "Grobowiec Ansariego"
 TIM_ansari_desc: "Abdullah Ansari był słynnym sufickim uczonym szkoły hanbalickiej, którego mauzoleum w Heracie stało się ważnym ośrodkiem religijnym za panowania Timurydów. Uczyńmy jego dziedzictwo nieśmiertelnym."
 TIM_persian_gulf_title: "Handel w Zatoce Perskiej"
 TIM_persian_gulf_desc: "Położenie na skrzyżowaniu szlaków między Zachodem a Indiami daje Zatoce Perskiej potencjał, by stać się bogatym ośrodkiem handlowym. Wykorzystajmy go w pełni."
 TIM_hormuz_title: "Monopol na Ormuz"
 TIM_hormuz_desc: "Nie możemy uznać, że bogata zatoka nie ma konkurencji. Sułtanów Ormuzu, otoczonych kupcami zabiegającymi o kolejne przywileje handlowe, należy usunąć z drogi."
 TIM_persian_riches_title: "Bogactwa Persji"
 TIM_persian_riches_desc: "Nadszedł czas, by w pełni wykorzystać bogactwa Persji i Indii. Dopilnujmy, aby wszyscy indyjscy i arabscy kupcy kierowali swoje towary do Ormuzu i Mogostanu, a nie do Zanzibaru czy Adenu."
