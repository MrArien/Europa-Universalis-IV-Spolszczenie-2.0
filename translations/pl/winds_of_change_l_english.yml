 integrated_personal_union_title_plural: "Inkorporowane unie personalne"
 is_integrated_personal_union: "Jest inkorporowaną unią personalną"
 incident_universal_empire: "Uniwersalne imperium"
 incident_universal_empire_emperor_alert: "Wzrost potęgi monarchii dynastii [Emperor.Monarch.Dynasty.GetName] zaniepokoił wiele państw Świętego Cesarstwa Rzymskiego. Zaczęły postrzegać ją jako zagrożenie dla swojej suwerenności, a nie obrońcę. Dwór cesarski musi rozstrzygnąć, jaki będzie los tego uniwersalnego imperium."
 convert_to_core_personal_union: "Przekształć w zintegrowaną unię personalną"
 convert_to_core_personal_union_desc: "Przekształć państwo [From.GetName] w zintegrowaną unię personalną, dzięki czemu łatwiej będzie je zintegrować, a jego utrzymanie nie będzie wymagało stosunków dyplomatycznych."
 convert_to_core_personal_union_tooltip: "Przekształć państwo [From.GetName] w zintegrowaną unię personalną, dzięki czemu łatwiej będzie je zintegrować, a jego utrzymanie nie będzie wymagało stosunków dyplomatycznych."
 convert_subject_to_incorporated_subject_cooldown_flag: "Odnowienie możliwości przekształcenia poddanego w zintegrowanego poddanego"
 last_knight_personality: "Ostatni rycerz"
 desc_last_knight_personality: "Maksymilian I jest jednym z najwybitniejszych cesarzy Świętego Cesarstwa Rzymskiego w historii. Dzięki swoim ambicjom zjednoczył ziemie austriackie, prowadził kampanie wojenne przeciwko Francuzom, zgłaszał roszczenia do tronów Węgier, Czech, Hiszpanii i Burgundii oraz zmienił układ sił w Europie na korzyść Austrii."
 last_knight_personality_die_desc: "[Root.Monarch.GetSheHeCap] zostanie zapamiętany dzięki [Root.Monarch.GetHisHer] osiągnięciom dyplomatycznym i wojskowym."
 VOC: "Vereenigde Oostindische Compagnie"
 VOC_ADJ: "Holenderski"
 establish_voc_title: "Utworzenie VOC"
 establish_voc_desc: "Zamiast bezpośrednio zarządzać ziemiami w Indiach, powołajmy Vereenigde Oostindische Compagnie, która będzie nimi rządzić w naszym imieniu."
 expand_voc_title: "Rozbudowa VOC"
 expand_voc_desc: "Posiadamy ziemie w Indiach, które powinniśmy przekazać Vereenigde Oostindische Compagnie."
