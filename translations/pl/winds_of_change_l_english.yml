 TIM_religious_diplomats_hanbali_tt: "Wzmocnij przywilej stanu „§YReligijni dyplomaci§!” dla §Y[Root.GetClergyName]§!, aby zapewniał §G+1.00§! tolerancji prawdziwej wiary, gdy zaprosiliśmy uczonego szkoły §Yhanbalickiej§!."
