 czech_nationalism2: "Czeski nacjonalizm"
 czech_nationalism2_desc: "Czesi przetrwali wszystko, co świat rzucił przeciwko nim. dowodząc w ten sposób swojej wytrwałości."
 vozove_hradby_reform: "Taktyka taborowa"
 vozove_hradby_reform_desc: "Podczas wojen husyckich husyci zrewolucjonizowali wykorzystanie opancerzonych wozów na polu bitwy, dzięki czemu odnosili zwycięstwa mimo ogromnej przewagi przeciwnika. Niezależnie od naszego stosunku do husytów nierozsądnie byłoby porzucić tę skuteczną taktykę."
 bergordnung_reforms_reform: "Reformy Bergordnung"
 bergordnung_reforms_reform_desc: "Odkrywane są nowe zastosowania węgla, które mogą zrewolucjonizować oblicze przemysłu na całym świecie. Powinniśmy zreformować nasze prawa górnicze, abyśmy mogli zacząć wydobywać węgiel z najwyższą wydajnością."
 unlock_bergordnung_reforms_reform_tt: "Odblokuj reformę ustrojową VIII poziomu „§YReformy Bergordnung§!”, zapewniającą następujące efekty:\nWydajność produkcji: §G+10.0%§!\n\nReforma ta wprowadza również następującą mechanikę rządową:\nRozwijanie prowincji z §Ymanufakturą§! ma §G+10.0%§! szans na przyznanie §G1§! dodatkowego punktu rozwoju."
 unlock_vozove_hradby_reform_tt: "Odblokuj reformę ustrojową V poziomu „§YTaktyka taborowa§!”, zapewniającą następujący efekt:\nOtrzymywane obrażenia morale: §G-10.0%§!\n\nReforma ta wprowadza również następującą mechanikę rządową:\nWygrywanie bitew na terytorium §Y[Root.GetAdjectiveCap]§! zapewnia §G+0.1§! dodatkowej tradycji armii."
