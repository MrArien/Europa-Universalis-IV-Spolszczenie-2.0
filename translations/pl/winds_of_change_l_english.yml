 AUH_ideas_start: "Tradycje austro-węgierskie"
 AUH_ideas_bonus: "Ambicje austro-węgierskie"
 auh_first: "Cesarska i Królewska Armia"
 auh_first_desc: "Podczas gdy armie naszych sąsiadów wciąż polegają na przestarzałym systemie feudalnego pospolitego ruszenia, tworząc niezdyscyplinowane i chaotyczne siły, my powołamy ściśle zorganizowane oddziały piechoty, rekrutowane z całego imperium i podporządkowane scentralizowanemu naczelnemu dowództwu."
 auh_second: "Wielokulturowe imperium"
 auh_second_desc: "Granice Austro-Węgier obejmują coraz rozleglejsze ziemie niemieckie, węgierskie i słowiańskie. Aby zapobiec separatyzmowi i wspierać przenikanie się kultur, wprowadzimy politykę równego traktowania wszystkich narodów imperium."
 auh_third: "Ośrodki przemysłowe"
 auh_third_desc: "Od złóż węgla w Czechach i na Śląsku, przez góry rudne Słowacji, po kopalnie złota w Tyrolu i pola zbożowe Kotliny Karpackiej — nasze ziemie obfitują w surowce czekające na przetworzenie. Musimy inwestować w najnowsze technologie przemysłowe, by przyspieszyć wydobycie i produkcję dóbr."
 auh_fourth: "Gwarancja praw mniejszości"
 auh_fourth_desc: "Choć imperium tradycyjnie faworyzowało dwie główne kultury — austriacką i węgierską — kontrola nad ziemiami słowiańskimi i innymi obszarami wymaga zagwarantowania równych praw nawet najmniejszym grupom zamieszkującym nasze granice."
 auh_fifth: "Decentralizacja"
 auh_fifth_desc: "Zarządzanie tym rozległym, wielokulturowym państwem często przekracza możliwości naszej biurokracji. Rozwiążemy ten problem poprzez decentralizację i przyznanie prowincjom większej autonomii."
 auh_sixth: "Błękitny Dunaj"
 auh_sixth_desc: "Potężny Dunaj jest życiodajną arterią naszego imperium. Rzeka łączy najważniejsze miasta i ma kluczowe znaczenie dla transportu oraz handlu wewnętrznego."
 auh_seventh: "Przyszłość wojny"
 auh_seventh_desc: "Artyleria jest bez wątpienia przyszłością wojskowości. W miarę jak armie coraz bardziej polegają na działach, musimy wykorzystać talent naszych inżynierów wojskowych, by uczynić naszą artylerię znacznie potężniejszą, trwalszą i tańszą od dział przeciwników. O zwycięstwie przesądzi przytłaczająca siła ognia, a austro-węgierskie kanony i haubice zbiorą całą chwałę!"
 flavor_hun.38.t: "Ludy Węgier"
 flavor_hun.38.d: "Od chwili powstania Królestwo Węgier było domem dla wielu narodów i kultur, nie tylko Węgrów — Słowaków, Rusinów, Rumunów, Chorwatów, Niemców, Żydów, Kumanów i wielu innych. Przez stulecia ludzie ci uważali Węgry za swoją ojczyznę oraz pomagali nam je budować i bronić. Ostatnio jednak nowe idee rozprzestrzeniające się po Europie zmieniają sposób postrzegania narodu. Różne grupy etniczne zamieszkujące nasze królestwo przyjęły nowoczesną koncepcję tożsamości narodowej i zaczęły domagać się reprezentacji politycznej oraz praw chroniących ich tożsamość i języki. Wielu uważa to za naturalny rozwój wydarzeń i pragnie zagwarantować prawa wszystkim ludom zamieszkującym Węgry. Inni postrzegają jednak tę sytuację jako poważne zagrożenie, obawiając się, że rosnąca autonomia polityczna doprowadzi w końcu do terytorialnego rozpadu królestwa. Najwyższy czas zająć się tą kwestią i wybrać odpowiednie podejście."
 flavor_hun.38.a: "Musimy skupić się na promowaniu kultury węgierskiej."
 flavor_hun.38.b: "Węgry są domem dla wszystkich, którzy tu mieszkają."
 flavor_hun.39.t: "Balázs Magyar"
 flavor_hun.39.d: "Balázs Magyar jest jednym z najważniejszych dowódców Czarnej Armii Węgier. Pełnił funkcję bana Chorwacji, Slawonii i Bośni, wojewody Siedmiogrodu oraz kapitana Górnych Węgier. Karierę wojskową rozpoczął u boku Jánosa Hunyadiego, a jego talent na polu bitwy i lojalność wobec króla Macieja wyróżniły go w węgierskiej armii. Odegrał istotną rolę w licznych bitwach na Węgrzech, w Czechach i na Bałkanach. Czarna Armia wiele zawdzięcza jego wyjątkowym zdolnościom przywódczym. Nadszedł czas, by nagrodzić tego bohatera Węgier za lata służby, oferując mu zasłużone stanowisko i uznanie."
 flavor_hun.39.a: "Zaproponujmy mu stanowisko na dworze."
 flavor_hun.39.b: "Powinien dowodzić naszymi armiami."
 flavor_hun.39.c: "Jego służba jest potrzebna gdzie indziej."
 flavor_hun.40.t: "Powstanie chłopskie Gubeca"
 flavor_hun.40.d: "Pod koniec XVI wieku możnowładcy zachodnich Bałkanów nieustannie podnosili podatki i ograniczali prawa miejscowych chłopów. Panowie feudalni często stosowali okrutne i brutalne kary wobec tych, którzy odmawiali płacenia danin. Sytuacja stała się nie do zniesienia i wybuch buntu był tylko kwestią czasu. W Chorwacji surowe traktowanie przez miejscowych baronów oraz spory o ziemię doprowadziły do niepokojów społecznych, które często przeradzały się w konflikty zbrojne. Skargi uciskanej ludności pozostały bez odpowiedzi, a pogłoski głoszą, że chorwaccy chłopi zjednoczyli się pod przywództwem Matiji Gubeca i planują otwarty bunt przeciwko naszej władzy. Musimy działać szybko i rozwiązać tę sytuację."
 flavor_hun.40.a: "Możnowładcy posunęli się za daleko. Chłopom należy się zadośćuczynienie."
 flavor_hun.40.b: "Możnowładcy mieli rację."
 flavor_hun.41.t: "Los imperium"
 flavor_hun.41.d: "Upadek Habsburgów wstrząsnął Świętym Cesarstwem Rzymskim, a książęta Rzeszy z przerażeniem obserwują rozwój wydarzeń. Bez cesarskiej dynastii imperium jest słabsze niż kiedykolwiek, co daje nam wyjątkową okazję do zdecydowania o jego losie. Czy wypełnimy próżnię po Habsburgach i wstąpimy na tron jako nowa dynastia cesarska, czy też przypieczętujemy los imperium, rozbierając je raz na zawsze?"
 flavor_hun.41.a: "Korona cesarska będzie nasza!"
 flavor_hun.41.b: "Staniemy się zgubą imperium."
 flavor_hun.42.t: "Adam František Kollár"
 flavor_hun.42.d: "Adam František Kollár był prawnikiem, radcą cesarsko-królewskim, głównym bibliotekarzem dworu, historykiem i wpływowym orędownikiem oświeconej polityki cesarzy austriackich. Prowadził rozległe badania, przyczyniając się do rozwoju etnologii jako dyscypliny naukowej, a także należał do pierwszych pionierów panslawizmu w Cesarstwie Austriackim. Szkoda, że tak wpływowa osoba urodzona na Węgrzech służy interesom obcego mocarstwa. Być może powinniśmy zaoferować mu wysokie stanowisko na naszym dworze, aby mógł służyć ojczyźnie zamiast chronić zagraniczne interesy."
 flavor_hun.42.a: "Zaproponujmy mu stanowisko na naszym dworze."
 flavor_hun.42.b: "Jest potrzebny gdzie indziej."
 flavor_hun.43.t: "Pál Kinizsi"
 flavor_hun.43.d: "Pál Kinizsi jest legendą naszych sił zbrojnych i od dziesięcioleci służy naszemu dworowi. Ten weteran stoczył liczne bitwy i odniósł wiele zwycięstw nad Turkami oraz innymi przeciwnikami. Dzięki wyjątkowym zdolnościom wojskowym nie przegrał ani jednej bitwy w całej swojej karierze. Przez dziesięciolecia odpowiadał za obronę rozległych terytoriów rozciągających się od Slawonii po Siedmiogród, a także zajmował różne stanowiska administracyjne. Jego kariera wojskowa powoli dobiega końca, lecz królestwo może jeszcze wykorzystać jego doświadczenie w innych dziedzinach. Jak powinniśmy spożytkować jego umiejętności?"
 flavor_hun.43.a: "Mógłby wiele nauczyć naszych generałów."
 flavor_hun.43.b: "Dwór również skorzystałby z jego doświadczenia."
 flavor_hun.43.c: "Zasłużył na odpoczynek po latach służby."
 flavor_hun.44.t: "Beatrycze Aragońska"
 flavor_hun.44.d: "Beatrycze Aragońska, znana również jako Beatrycze Neapolitańska, była ważną postacią włoskiego renesansu, słynącą z mecenatu nad sztuką oraz wpływu na sprawy kulturalne i polityczne. Urodziła się w 1457 roku w rodzie Trastámara jako córka Ferdynanda I Neapolitańskiego i Izabeli de Clermont. Dorastanie w tętniącym życiem środowisku kulturowym Neapolu rozbudziło w niej głębokie zainteresowanie sztuką i naukami humanistycznymi. Jej małżeństwo z Maciejem Korwinem, królem Węgier, zawarte w 1476 roku, ugruntowało jej pozycję jako ważnej postaci dyplomatycznej renesansowej Europy. Dzięki mecenatowi wspierała wymianę kulturową między Włochami a Węgrami, ułatwiając przepływ idei artystycznych, rękopisów i uczonych. Na Węgrzech założyła słynną bibliotekę dworską Bibliotheca Corviniana, która stała się ośrodkiem humanistycznej nauki i badań. Wspierała wybitnych pisarzy i uczonych humanistycznych, przyczyniając się do intelektualnego rozkwitu renesansu. Oprócz działalności kulturalnej odgrywała kluczową rolę w dyplomacji, pośrednicząc między włoskimi miastami-państwami a interesami Węgier. Jej talent dyplomatyczny i wpływy polityczne pomogły wzmocnić więzi między Neapolem, Węgrami i innymi europejskimi potęgami. Być może nasz dwór również mógłby skorzystać z jej umiejętności."
 flavor_hun.44.a: "Jej praca jest bezcenna."
 flavor_hun.44.b: "Nie powinna mieszać się do spraw państwowych."
 flavor_hun.45.t: "Tripartitum"
 flavor_hun.45.d: "Tripartitum, znane również jako Opus Tripartitum, było ważnym dziełem prawniczym opracowanym w Królestwie Węgier w okresie renesansu. Powstało pod koniec XV wieku i stanowiło obszerny zbiór praw obejmujący zarówno szlachtę, jak i pospólstwo. Jego celem było zebranie i skodyfikowanie prawa węgierskiego na podstawie wcześniej ustanowionego prawa zwyczajowego. Opracowanie kodeksu było monumentalnym przedsięwzięciem, odzwierciedlającym zaangażowanie króla w reformę prawa i sprawowanie rządów. Mimo dużego wpływu Tripartitum nigdy nie uzyskało oficjalnego uznania w całym kraju. Czy powinniśmy je skodyfikować?"
 flavor_hun.45.a: "Skodyfikujmy je!"
 flavor_hun.45.b: "Taki kodeks nie jest potrzebny."
 flavor_hun.46.t: "Sasi siedmiogrodzcy przechodzą na protestantyzm"
 flavor_hun.46.d: "Johannes Honterus, jedna z najważniejszych postaci życia religijnego i intelektualnego Siedmiogrodu w XVI wieku, odegrał istotną rolę w szerzeniu protestantyzmu wśród miejscowych Sasów. Urodził się w Siedmiogrodzie, był uczonym, humanistą i duchownym, na którego silny wpływ wywarły idee reformacji protestanckiej. Wykształcony w Niemczech, powrócił do Siedmiogrodu z gorącym pragnieniem szerzenia zasad reformacji. Pod jego wpływem Sasi siedmiogrodzcy zaczęli przyjmować nauki protestanckie, zwłaszcza luteranizm. Jego wymowne kazania, pisma naukowe i niestrudzona działalność na rzecz reformacji przekonały wielu członków saskiej społeczności, stopniowo odchodzących od tradycyjnego katolicyzmu. Konwersja Sasów pod przywództwem Honterusa miała ogromne znaczenie dla religijnej i kulturowej tożsamości Siedmiogrodu. Jego wpływy wzrosły tak bardzo, że poza kilkoma niewielkimi obszarami pozostającymi wiernymi katolicyzmowi niemal wszystkie regiony Siedmiogrodu zamieszkane przez Sasów przyjęły już protestantyzm."
 flavor_hun.46.a: "Niech tak będzie."
 flavor_hun.46.b: "Musimy wykorzenić tę herezję!"
 flavor_hun.47.t: "Bibliotheca Corviniana"
 flavor_hun.47.d: "Na zlecenie Macieja Korwina, króla Węgier w latach 1458–1490, powstała wspaniała biblioteka, która pod koniec XV wieku należała do najbardziej cenionych ośrodków nauki w Europie. Maciej Korwin, znany z mecenatu nad sztuką i nauką, zgromadził niezwykły zbiór rękopisów i drukowanych dzieł z wielu dziedzin, między innymi filozofii, teologii, historii, medycyny, matematyki i literatury. Bibliotheca Corviniana mieściła ponad 2000 tomów, co czyniło ją jedną z największych bibliotek swoich czasów. Jej znaczenie wykraczało jednak daleko poza imponujące zbiory. Była ośrodkiem wymiany naukowej i odgrywała kluczową rolę w rozpowszechnianiu wiedzy w całej Europie. Uczeni z całego kontynentu przybywali do biblioteki, przyczyniając się do intelektualnego rozkwitu renesansu. Stanowi ona symbol intelektualnego zapału epoki oraz siły mecenatu w rozwijaniu wiedzy i innowacji, a także przypomina o trwałej wartości ochrony i pielęgnowania naszego dziedzictwa kulturowego."
 flavor_hun.47.a: "Wiedza to potęga."
 flavor_hun.48.t: "Stolica w niebezpieczeństwie"
 flavor_hun.48.d: "Wskutek niedawnej ekspansji osmańskiej nasza stolica, [153.GetName], znalazła się w bardzo niebezpiecznym położeniu. Choć [153.GetName] jest dobrze ufortyfikowane, otaczający je teren nie daje obrońcom żadnej przewagi, jeśli miasto zostanie oblężone przez Turków. Wielu doradców sugeruje, że rozsądniej byłoby przenieść dwór do innego miasta, położonego dalej od granicy z Osmanami. Najlepszym kandydatem wydaje się górnowęgierskie miasto [1772.GetName]. Co powinniśmy zrobić?"
 flavor_hun.48.a: "Nigdy nie opuścimy [153.GetName]!"
 flavor_hun.48.b: "Rozsądniej będzie przenieść dwór do [1772.GetName]."
 flavor_hun.49.t: "Juraj Janosik"
 flavor_hun.49.d: "Osławiony zbójnik Juraj Janosik i jego banda terroryzują możnowładców oraz mieszczan Górnych Węgier. Ich zuchwałe napady wywołały ogromny niepokój i zamieszanie, a schwytanie herszta wydaje się niemal niemożliwe. Dzieli się on bowiem częścią łupów z miejscowymi chłopami, którzy w zamian chronią go przed władzami. Powoli staje się bohaterem słowackiego ludu, a jego banda szybko rośnie, ponieważ dołączają do niej ludzie nawet z Polski i Moraw. Stany nie potrafią samodzielnie opanować sytuacji i zwróciły się do nas ze skargami oraz prośbami o pomoc. Domagają się interwencji korony, schwytania Janosika i postawienia go przed sądem."
 flavor_hun.49.a: "Zorganizujmy grupę, która go wytropi."
 flavor_hun.49.b: "Węgierskie stany nie potrafią poradzić sobie z jednym zbójnikiem?"
 flavor_hun.50.t: "Janosik znów uderza"
 flavor_hun.50.d: "Zignorowanie próśb stanów przyniosło opłakane skutki — Juraj Janosik i jego banda ponownie zaatakowali, tym razem z jeszcze większą zuchwałością i brutalnością. Stany są wściekłe, a ludność żyje w strachu. Korona nie może już przymykać oczu na terror szerzony przez Janosika."
 flavor_hun.50.a: "Zmobilizować wojska!"
 flavor_hun.51.t: "Koniec Janosika"
 flavor_hun.51.d: "Dzięki naszym wysiłkom osławiony zbójnik Juraj Janosik i większość jego bandy zostali wreszcie schwytani i postawieni przed sądem. Po procesie w Liptowskim Mikułaszu Janosik został skazany na śmierć. Nie udało nam się schwytać wszystkich członków jego grupy, lecz bez przywództwa Janosika zbójnicy prawdopodobnie rozproszą się i zakończą działalność. Stany wreszcie odetchnęły z ulgą, a na Górnych Węgrzech ponownie zapanował spokój."
 flavor_hun.51.a: "Niech jego los będzie przestrogą dla wszystkich."
 hun_end_of_banditry: "Koniec rozbójnictwa"
 desc_hun_end_of_banditry: "Po egzekucji Juraja Jánosíka rozbójnictwo na Górnych Węgrzech ustało, a zarówno stany, jak i miejscowa ludność odetchnęły z ulgą."
 flavor_hun.53.t: "Kierunek produkcji w [153.GetName]"
 flavor_hun.53.d: "Nasze nowe inwestycje w rozwój [153.GetName] przyniosły oczekiwane rezultaty. Miasto stale się bogaci i rozrasta, dlatego możemy już myśleć o przyszłości. Wielu zastanawia się, czy nie powinniśmy wykorzystać nowych możliwości produkcyjnych do zmiany profilu wytwarzanych w stolicy towarów. Być może warto skupić się na dobrach, które w przyszłości zapewnią większe zyski. Niektórzy proponują przetwarzanie surowców sprowadzanych z kopalń Górnych Węgier i Siedmiogrodu, inni zaś chcą zakładać nowe manufaktury sukiennicze lub huty szkła, które dorównają słynnym zakładom czeskim i weneckim. Co powinniśmy zrobić?"
 flavor_hun.53.a: "Zainwestujmy w przemysł sukienniczy."
 flavor_hun.53.b: "Miedź jest niezbędnym towarem w wielu dziedzinach."
 flavor_hun.53.c: "Będziemy przetwarzać surowce z naszych miast górniczych."
 flavor_hun.53.de: "Nasze szkło dorówna czeskiemu i weneckiemu."
 flavor_hun.53.e: "Obecny kierunek dobrze nam służy."
 golden_city_gp_reward1: "Wydarzenie „§YZŁOTA GORĄCZKA!§!” zapewnia teraz równowartość §G1,5§! roku dochodów zamiast §G1§! roku dochodów."
 golden_city_gp_reward2: "Wydarzenie „§YZŁOTA GORĄCZKA!§!” zapewnia teraz równowartość §G2§! lat dochodów zamiast §G1,5§! roku dochodów."
 hun_pest_production_insight_tt: "\\n§GInformacje o wydarzeniu:§!\\nTo wydarzenie pozwala wybrać §Yżelazo§!, §Ymiedź§!, §Ytkaniny§! lub §Yszkło§! jako nowy towar handlowy prowincji §Y[153.GetName]§! i uzyskać §G1§! lokalny poziom rozwoju £dip£ albo zachować obecny towar handlowy i uzyskać §G3§! lokalne poziomy rozwoju £dip£."
 azt_imperial_tributes_title: "Daniny dla stolicy"
 azt_imperial_tributes_desc: "Nasze wielkie miasto $CAPITAL$ jest najważniejszym ośrodkiem całego państwa, złożonego z wielu trybutariuszy, którzy biją przed nami pokłony. Umocnienie tego systemu pozwoli $CAPITAL$ jeszcze bardziej rozkwitnąć."
 azt_mayan_frontier_title: "Granica Majów"
 azt_mayan_frontier_desc: "Za ziemiami wschodniego Meksyku i Zapoteków leżą ziemie Majów — ludu podobnego do nas, a zarazem odmiennego. Ostatecznie jednak ich mieszkańcy nadają się na ofiary."
 azt_north_mayans_title: "Najazd na Chichén Itzá"
 azt_north_mayans_desc: "W krainie piramid znajduje się Chichén Itzá, najsłynniejsza piramida Majów. Po jej zdobyciu będziemy mogli składać tam ofiary."
 azt_mayan_cocoa_title: "Majskie xocolatl"
 azt_mayan_cocoa_desc: "Kakao jest jednym z najsłynniejszych bogactw ziem Majów. Teraz, gdy podporządkowaliśmy ich sobie, możemy zacząć wykorzystywać ich zapasy kakao na własny użytek."
 azt_sacrifices_for_the_gods_title: "Pokarm dla bogów"
 azt_sacrifices_for_the_gods_desc: "Według mitologii Azteków bogowie czerpią siłę z krwi składanych im ofiar. Wykorzystują ją, by nie dopuścić do nadejścia dnia zagłady. Musimy nadal ofiarowywać im krew — pokarm, który nie pozwala słońcu zgasnąć."
 azt_fifth_cradle_title: "Piąta kolebka"
 azt_fifth_cradle_desc: "Zanim powstał nasz świat, Pięć Słońc walczyło między sobą o prawo do bycia bóstwem słonecznym. Pierwszy był Tezcatlipoca, którego ludzkość została pożarta przez jaguary po tym, jak jego brat Quetzalcoatl strącił go z tronu. Drugim był Quetzalcoatl, którego ludzkość popadła w zepsucie, co doprowadziło do jej wygnania. Trzecim był Tlaloc — jego żal, smutek i gniew zniszczyły ziemię zamieszkaną przez ludzi. Czwartą była Chalchiuhtlicue, którą Tezcatlipoca podstępem skłonił do znienawidzenia własnego Słońca. Piątym jest Huitzilopochtli, bóg wojny i obecne Słońce ludzkości. Aby wspierać go w nieustannej walce o przetrwanie ludzkości, musimy składać mu ofiary z ludzi, powstrzymywać Tezcatlipocę i ofiarowywać krew wielkiemu Quetzalcoatlowi."
 azt_seperation_of_classes_title: "Rozdzielenie warstw społecznych"
 azt_seperation_of_classes_desc: "W społeczeństwie Azteków od zawsze brakowało wyraźnego podziału stanów. Szlachcice i chłopi mogli ubierać się tak samo i mieszkać w podobnych domach, różniąc się jedynie tytułami. Musimy jasno oddzielić szlachtę od pospólstwa, by zwiększyć kontrolę nad społeczeństwem."
 azt_chinampa_farms_title: "Uprawy chinampowe"
 azt_chinampa_farms_desc: "Chinampy to szczególne pola uprawne zakładane na sztucznych wyspach wodnych, służące zwiększeniu produkcji kukurydzy. Zabezpieczenie tych upraw odciąży naszych rolników i zapewni im wydajniejsze grunty."
 azt_arts_and_crafts_title: "Sztuka i rzemiosło"
 azt_arts_and_crafts_desc: "Uprawy na chinampach zapewniły nam obfitość żywności. Dzięki temu znaczna część ludności mogła poświęcić się rzemiosłu i sztuce. Musimy wykorzystać tę nową sytuację."
 azt_coronation_campaigns_title: "Powstanie znad jeziora"
 azt_coronation_campaigns_desc: "W XIV wieku założyliśmy miasto na jeziorze Texcoco. To bóg Huitzilopochtli wskazał nam miejsce, w którym mieliśmy wznieść Tenochtitlan. Nasza potęga wciąż rośnie, nadszedł więc czas, by wyjść poza jego granice i ustanowić się jedynymi władcami Meksyku."
 azt_tlaxcala_title: "Zmiażdż Tlaxcalę"
 azt_tlaxcala_desc: "Związek miast pod przewodnictwem Tlaxcali leży tuż przy naszej granicy. Bogowie żądają ofiar, a mieszkańcy Tlaxcali również czczą czterech Tezcatlipoków. Rozpoczniemy więc wojny kwietne — rytualne konflikty, których celem jest zdobywanie jeńców na ofiary dla bogów."
 azt_zapotec_title: "Dziel i rządź"
 azt_zapotec_desc: "Zapotekowie, znani również jako Lud Chmur, zamieszkują ziemie między Meksykiem a Jukatanem. Wyruszmy na ich ziemie i podporządkujmy ich sobie."
 azt_south_mayans_title: "Wyżyny Majów"
 azt_south_mayans_desc: "W przeciwieństwie do północnej części półwyspu Jukatan jego południowe obszary są słabiej rozwinięte, pełne wzgórz i dżungli. Utrudni nam to podbój, lecz pokonamy wszelkie przeszkody, bez względu na koszty."
 azt_securing_central_america_title: "Zjednocz półwysep Jukatan"
 azt_securing_central_america_desc: "Jukatan, niegdyś ojczyzna Majów, znajduje się teraz pod naszym panowaniem. Rozpoczniemy stąd pobieranie danin i pozyskiwanie ofiar."
 azt_tlatoani_title: "Rządy tlatoanich"
 azt_tlatoani_desc: "Liczne miasta-państwa w Imperium Azteków, z których każde jest rządzone przez tlatoaniego, uzyskały zbyt dużą autonomię. Dzięki nowym kampaniom i podporządkowaniu ich sobie będziemy mogli sprawniej nimi zarządzać."
 azt_squashing_rebellious_tributaries_title: "Boskie panowanie"
 azt_squashing_rebellious_tributaries_desc: "Jeśli chcemy utrzymać stały napływ ofiar dla bogów, musimy podbijać kolejne ziemie, podporządkowywać sobie następne ludy i sprawować władzę nad coraz większym obszarem. Wyruszmy ponownie po ofiary, by zapobiec nadejściu dnia zagłady!"
 azt_fate_of_city_alliance_title: "Los związku miast"
 azt_fate_of_city_alliance_desc: "Związek miast, który dał początek Imperium Azteków, jest dziś jedynie cieniem dawnej potęgi. Musimy zadać mu ostateczny cios albo przekształcić go tak, by służył przede wszystkim interesom Tenochtitlanu."
 azt_roads_title: "Drogi dla ludu"
 azt_roads_desc: "Stan [Root.GetBurghersName] pilnie potrzebuje naszej pomocy. Brak dróg w naszym państwie poważnie utrudnia transport. Aby wesprzeć kupców, musimy zbudować nowe trakty dla wszystkich, którzy chcą pokonywać duże odległości drogą lądową."
 AZTMacehualtinMissionName: "Urbanizacja [Root.GetName]"
 MacehualtinMissionName: "Urbanizacja Mezoameryki"
 azt_shifting_the_macehualtin_title: "[GetMacehualtinMissionName]"
 azt_shifting_the_macehualtin_desc: "Nowo odkryte źródła kukurydzy umożliwiły znacznej części ludności przeniesienie się do miast i rozpoczęcie tam nowego życia. Musimy pomóc każdemu mieszkańcowi naszego imperium, który zechce to uczynić."
 azt_gold_income_title: "Złoto Meksyku"
 azt_gold_income_desc: "Choć złoto nie jest środkiem płatniczym w naszym imperium, jego wartość poza naszymi granicami jest niezaprzeczalna. Dla nas to surowiec rzemieślniczy, dla innych zaś waluta. Im więcej złota wydobędziemy, tym większym prestiżem będziemy cieszyć się na świecie."
 azt_mexico_title: "Rozszerz Anahuac"
 azt_mexico_desc: "Choć Tenochtitlan i okoliczne miasta są już zabezpieczone, serce Meksyku wciąż nie podporządkowało się naszej władzy. Czas to zmienić."
 azt_maize_farms_title: "Uprawa kukurydzy"
 azt_maize_farms_desc: "Kukurydza jest najpowszechniejszą uprawą na naszych ziemiach. Musimy obsiać nią więcej pól i zwiększyć zbiory, aby nigdy nie zabrakło jej podczas naszych świąt."
 azt_unify_mexico_title: "[GetUnifyMissionName]"
 AZTNonTheocracyName: "[Root.Monarch.GetTitle] Meksyku"
 AZTTheocracyName: "Zjednocz Meksyk"
 azt_unify_mexico_desc: "Po wielu latach kampanii nasi wrogowie zostali pokonani. Padali jeden po drugim, gdy wkraczaliśmy do ich miast. Wypędziliśmy ich z domów, tak jak przed wiekami sami zostaliśmy wygnani. Marzenie o nowym Aztlanie stało się rzeczywistością."
 azt_city_alliance_title: "Potrójny Sojusz"
 azt_city_alliance_desc: "Potrójny Sojusz Tenochtitlanu, Tetzcoco i Tlacopanu stanowił fundament naszego imperium. Rozwijając wszystkie trzy miasta, będziemy mogli skuteczniej wyruszać na podbój kolejnych ziem i zdobywać daniny."
 azt_religious_schools_title: "Teopixqui w szkołach"
 azt_religious_schools_desc: "Większość naszych mieszkańców słyszała o bogach Nahua, lecz niewielu przestrzega tradycji głoszonych przez teopixqui. Musimy szerzej edukować ludność w zakresie tych wartości religijnych."
 azt_blood_for_the_gods_title: "Krew dla bogów"
 azt_blood_for_the_gods_desc: "Krew, którą przelewamy dla bogów, nigdy nie wystarcza. Pomimo licznych złożonych ofiar nasze ziemie wciąż nękają susze i głód. To znak, że bogowie słabną, a ich zdolność do ochrony nas maleje. Dlatego musimy ofiarować im jeszcze więcej krwi."
 azt_quauhpilli_title: "Rytuały Cuauhtli"
 azt_quauhpilli_desc: "W społeczeństwie Azteków tytuł Orlego Wojownika jest jednym z najbardziej prestiżowych stopni, jakie może osiągnąć człowiek spoza szlachty. Wzmacniając tę część naszej kultury wojowników, będziemy mogli lepiej podtrzymywać tradycje wojskowe."
 azt_western_expedition_title: "Wyprawa na zachód"
 azt_western_expedition_desc: "Ziemie na zachodzie zamieszkuje wiele różnych ludów, które niegdyś rzucały wyzwanie naszej władzy nad Meksykiem. Przygotujmy siły ekspedycyjne, by je sobie podporządkować."
 azt_tarascan_title: "Rywalizacja z Purepechami"
 azt_tarascan_desc: "Imperium Purepechów rośnie w siłę i zagraża naszej wyprawie na zachód. Wzdłuż naszej granicy wznieśli szereg umocnień, przez co kampania przeciwko nim będzie niebezpieczniejsza. Nie ustąpimy jednak. Rozwińmy sztandary i ruszmy na podbój ich ziem."
 azt_end_of_western_expedition_title: "Zdobycie ziem Tepików"
 azt_end_of_western_expedition_desc: "Wełna jest w Mezoameryce towarem deficytowym. Lud Tepików posiada jej pod dostatkiem, lecz nie chce z nami handlować. Jeśli nie zamierzają czerpać korzyści z pokoju, pokażemy im, jaka jest alternatywa."
 azt_hueyi_teocalli_title: "Hueyi Teocalli"
 azt_hueyi_teocalli_desc: "Huey Teocalli, monumentalna piramida w sercu azteckiej stolicy Tenochtitlan, była świadectwem architektonicznego kunsztu tej cywilizacji. Wzniesiona w XV wieku, służyła jako główne centrum religijne i miejsce kultu wielu bóstw, w tym Huitzilopochtliego i Tlaloca."
 azt_capital_of_the_empire_title: "Miasto złota"
 azt_capital_of_the_empire_desc: "Tenochtitlan jest prawdopodobnie jednym z największych miast Meksyku. Położone nad jeziorem Texcoco, szybko rozwinęło się jako centrum Związku Miast. Dalsza rozbudowa miasta pomoże nam utrzymać kontrolę nad tym obszarem."
 azt_warrior_societies_title: "Kultura wojowników"
 azt_warrior_societies_desc: "Społeczeństwo Azteków słynie z tradycji wojskowych. Religia promuje konflikt i przelewanie krwi, a struktura społeczna pozwala nawet pospólstwu osiągać wysokie stopnie wojskowe. Możemy wykorzystać to, by jeszcze bardziej wzmocnić nasze szeregi."
 azt_telpochcalli_schools_title: "Szkoły telpochcalli"
 azt_telpochcalli_schools_desc: "Telpochcalli były azteckimi placówkami edukacyjnymi przeznaczonymi do kształcenia młodych chłopców z rodzin pospólstwa. Ośrodki te uczyły praktycznych umiejętności, w tym sztuki wojennej, rzemiosła i kultury, przygotowując uczniów do przyszłych ról w społeczeństwie Azteków."
 azt_calpulli_households_title: "Gospodarstwa calpulli"
 azt_calpulli_households_desc: "Calpulli, czyli „wielkie domy”, były dużymi gospodarstwami podzielonymi na grupy oparte na więzach pokrewieństwa, funkcjonującymi w meksykańskich miastach-państwach. Ułatwiały sprawniejsze pobieranie danin oraz wykorzystywanie ziemi pod uprawę i produkcję żywności. W tych „wielkich domach” kobiety uczono gotowania, opieki nad dziećmi i innych obowiązków przypisywanych im w społeczeństwie azteckim, mężczyzn zaś szkolono w sztuce wojennej."
 azt_securing_obsidian_title: "Źródło obsydianu"
 azt_securing_obsidian_desc: "Obsydian jest podstawowym materiałem wykorzystywanym przez szlachtę do wyrobu broni. Jest jednak surowcem rzadkim, na który stać jedynie najbogatszych członków społeczeństwa [Root.GetName]. Jeśli uda nam się zmonopolizować jego wydobycie, będziemy mogli skuteczniej wyposażać nasze armie do wojny."
 azt_subduing_migratory_tribes_title: "Marzenia o Aztlanie"
 azt_subduing_migratory_tribes_desc: "Przed wiekami nasz lud został wypędzony z ojczyzny przez tyranicznego władcę tych ziem. Huitzilopochtli poprowadził nas ku nowemu domowi. Nasza prastara ojczyzna nosiła nazwę Aztlan, czyli Kraina Bieli. Choć lud zapomniał jej dokładne położenie, wie przynajmniej, że znajduje się na północy, gdzie włada Tezcatlipoca. Wyruszmy więc na północ i stopniowo odzyskajmy ziemie naszych przodków."
 azt_expansion_of_tenochtitlan_title: "Rozbudowa Tenochtitlanu"
 azt_expansion_of_tenochtitlan_desc: "Tenochtitlan przeżywa ostatnio rozkwit. Do miasta napływają nowi mieszkańcy, zapełniają ulice, kupują i sprzedają towary, doskonalą swoje rzemiosło i przyczyniają się do wzrostu dobrobytu. Wesprzyjmy tych, którzy chcą zbudować tu swoje życie."
 azt_tenochitlan_aqueduct_title: "Akwedukt Chapultepec"
 azt_tenochitlan_aqueduct_desc: "Tenochtitlan jest otoczony wodą, lecz większość jej zasobów nie nadaje się do picia. Musimy więc znaleźć inne sposoby doprowadzania do miasta świeżej wody. Akwedukt Chapultepec, który ją dostarcza, w ostatnich latach podupadł. Jego wzmocnienie pozwoli nam zabezpieczyć to niezawodne źródło wody."
 azt_in_navel_of_the_moon_title: "Centrum Księżyca"
 azt_in_navel_of_the_moon_desc: "Jeśli jezioro Texcoco jest Księżycem, Tenochtitlan stanowi jego środek. Wkrótce nasze miasto stanie się centrum świata, tak jak jest centrum naszego imperium — imperium, które podbije każdą cywilizację ośmielającą się mu przeciwstawić. Dlatego Tenochtitlan musi stać się najwspanialszym miastem, pożądanym przez cały świat!"
 azt_prisoners_for_sacrifices_title: "Ofiary dla bogów"
 azt_prisoners_for_sacrifices_desc: "Pomimo przelanej krwi i wygranych bitew bogowie wciąż nie są zadowoleni. Żądają kolejnych ofiar i jeszcze więcej krwi, by móc nas chronić. Spełnimy ich wolę — wyruszymy na nowe podboje i złożymy więcej ofiar."
 azt_jaguars_and_eagles_title: "Jaguarzy i Orły"
 azt_jaguars_and_eagles_desc: "Wojownicy Jaguara i Orła należą do najbardziej elitarnych formacji w społeczeństwie Azteków. Reprezentują Tezcatlipocę, boga konfliktu, oraz Huitzilopochtliego, boga wojny, i budzą postrach na polu bitwy. Wykorzystując ich reputację, będziemy mogli jeszcze skuteczniej dominować w walce."
 AZT_ADD_30_LD_WITH_SUBJECTS: "Wszyscy nasi §Ypoddani§! zyskają §R40%§! pragnienia wolności.

Każdy §Ypoddany§!, którego pragnienie wolności wynosi co najmniej §Y50%§!, wyzwoli się spod naszego panowania."
