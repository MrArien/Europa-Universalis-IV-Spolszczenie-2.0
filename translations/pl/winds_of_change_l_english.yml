 TIM_soyurghals_will_be_less_penalizing: "Usuwa wymóg §Yżądzy wolności poddanych§! dla decyzji §YOdbudowa skarbu§!, która odbiera przywilej §YNadania sojurgali§! stanowi [Root.GetNobilityName]."
