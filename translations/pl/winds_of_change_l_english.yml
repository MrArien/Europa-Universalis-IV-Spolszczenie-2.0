 monthly_divine_authority: "Miesięczny autorytet Inków"
 divine_authority_gain_modifier: "Modyfikator przyrostu autorytetu Inków"
 ability_divine_authority_mechanic: "Autorytet Inków"
 divine_authority_desc: "§YAutorytet Inków§! to miara religijnego autorytetu, jakim cieszy się nasz [Root.Monarch.GetTitle] w oczach ludu.\n\nNa §YAutorytet Inków§! wpływają:\nStabilność: od §R-0.15§! do §G+0.15§! miesięcznie.\nPrawowitość: od §R-0.15§! do §G+0.15§! miesięcznie.\nTolerancja prawdziwej wiary: §G+0.03§! miesięcznie za każdy punkt.\nProjekcja siły: §G+0.05§! miesięcznie przy §Y100.00§!.\nPrestiż: od §R-0.10§! do §G+0.10§! miesięcznie.\nUmiejętności władcy: §G+0.01§! za każdy punkt.\nŚrednia autonomia krajowa: §R-0.50§! przy §Y100.0%§!.\nŚrednie niepokoje: §R-0.05§!, jeśli niepokoje wynoszą §Y-5.00§! lub mniej, aż do §R-0.50§! przy wartości §Y+4.00§! lub wyższej.\nStraty zadane przez armię dowodzoną przez władcę-generała: §G+0.01§! za każde §Y100§! ofiar.\n\n"
 MAY_highlander_resistance_title: "Opór górskich Majów"
 MAY_highlander_resistance_desc: "Majowie zamieszkujący wyżyny od zawsze pozostawali na uboczu świata Majów z nizin. Ich trudna do zdobycia ojczyzna pozwoliła im jednak opierać się ekspansji północnych Majów, a później także Hiszpanom przez ponad stulecie."
 MAY_collapse_of_mayapan_title: "Upadek Mayapan"
 MAY_collapse_of_mayapan_desc: "Najpotężniejsze państwo Majów naszych czasów — Liga Mayapan, kierowana przez ród Cocom — ostatecznie upadło. Utrzymywało ono lojalność poddanych przemocą i więżąc rodziny królewskie w mieście Mayapan."
 MAY_ancient_ruins_title: "Starożytne ruiny"
 MAY_ancient_ruins_desc: "Przed wiekami surowe niziny śródlądowej części ziem Majów zamieszkiwały potężne miasta, wznoszące monumentalne budowle i tworzące silne państwa. Z czasem wiele z tych organizmów politycznych opustoszało, a ich miasta — o ile nie całkiem wymarłe — są jedynie cieniem dawnej świetności."
 MAY_reform_the_league_title: "Reforma ligi"
 MAY_reform_the_league_desc: "Liga Mayapan niegdyś władała znaczną częścią północnego Jukatanu, a jej wpływy sięgały znacznie dalej. Wykorzystajmy naszą nowo zdobytą potęgę, by podporządkować sobie wszystkie ludy Majów."
 MAY_zapotec_and_mixtec_title: "Dolina Oaxaca"
 MAY_zapotec_and_mixtec_desc: "Zapotekowie i Mistekowie to dwa spokrewnione, lecz bardzo odmienne ludy zamieszkujące dolinę Oaxaca. Opierają się ekspansji Tenochtitlan i walczą między sobą. Zmuśmy ich, by dołączyli do naszej ligi."
 MAY_yucatan_renaissance_title: "Dominacja nad Jukatanem"
 MAY_yucatan_renaissance_desc: "Majowskie państwa Jukatanu znajdują się u szczytu potęgi. W okresie schyłkowego klasycyzmu wiele społeczności ze śródlądowych obszarów przeniosło się na wybrzeże, zakładając miasta na północy. Choć Mayapan upadło, to właśnie ten region może wydać nowego hegemona."
 MAY_wastek_title: "Odnowienie więzi z Huastekami"
 MAY_wastek_desc: "Majowie Huastekowie od wieków rozwijali się odrębnie od pozostałych ludów Majów. Zachowali wiele cech wspólnych ze swoimi krewniakami, lecz poza handlem nie odnowili z nimi bliższych kontaktów."
 MAY_obsidian_weapons_title: "Ostrza z obsydianu"
 MAY_obsidian_weapons_desc: "Majowski lud pospolity posługuje się bronią kamienną, lecz majowska szlachta używa ostrzy z obsydianu. Pozyskiwany w całej Mezoameryce, szczególnie na wyżynach, obsydian pozwalał Majom wytwarzać najostrzejszą broń, jaką mogli zdobyć."
 MAY_reform_religion_title: "Reforma wierzeń"
 MAY_reform_religion_desc: "Musimy dostosować nasze tradycje do interesu państwa. Opór może być silny, a nasi trybutariusze mogą nawet ogłosić secesję, lecz musimy działać zdecydowanie."
 MAY_intercity_politics_title: "Polityka miast"
 MAY_intercity_politics_desc: "Znaczna część wojen prowadzonych przez Majów sprowadza się do konfliktów między miastami-państwami, połączonymi sojuszami dynastycznymi lub zależnościami trybutarnymi. Jeśli skutecznie odnajdziemy się w tej sieci powiązań, będziemy pierwszym państwem, które wyrwie się z cyklu wzrostu i upadku."
 MAY_batob_title: "Pozyskanie nowych batabilo'ob"
 MAY_batob_desc: "Majowska prowincja, czyli kuchkabal, składa się z wielu miast i wsi zwanych batabilo'ob. Każdym batabilem rządzi wódz zwany batabem — samodzielnie lub pod zwierzchnictwem miasta-państwa. Aby zwiększyć naszą potęgę, musimy podporządkować [Root.Capital.GetCapitalName] jak najwięcej batabilo'ob."
 MAY_hegemonic_ambitions_title: "Ambicje hegemoniczne"
 MAY_hegemonic_ambitions_desc: "Wiele państw Mezoameryki tworzyło imperia nie poprzez sam podbój terytorialny, lecz rozbudowę sieci trybutariuszy i sojuszy, które zapewniały hegemonowi potęgę. W ten sposób będziemy umacniać naszą pozycję, aż przerwiemy cykl kolejnych upadków."
 MAY_defeat_tenochtitlan_title: "Pokonanie Tenochtitlan"
 MAY_defeat_tenochtitlan_desc: "Zainspirowany chwałą Teotihuacan i wypełniający pozostawioną przez nie próżnię sił, sojusz trzech miast Nahua pod wodzą Tenochtitlan wyrasta na naszego największego rywala w znanym świecie. Uderzmy zdecydowanie i pokrzyżujmy jego niepohamowane ambicje."
 MAY_unite_mesoamerica_title: "Zjednoczenie Mezoameryki"
 MAY_unite_mesoamerica_desc: "Mezoameryka jest kolebką cywilizacji. Otoczeni przez koczownicze i słabo zorganizowane plemiona na wschodzie i północy, podbijemy tyle ziem, ile zdołamy sprawnie zarządzać. Znany świat znajdzie się pod panowaniem naszym i naszych opiekuńczych bóstw."
 MAY_appease_gods_title: "Udobruchać Bogów"
 MAY_appease_gods_desc: "Religia nie ma już takiego znaczenia jak dawniej. W miastach śródlądowych królowie byli niegdyś kapłanami, a ku chwale bogów wznoszono wspaniałe świątynie. Ułagodźmy naszych patronów, rozgniewanych zmianą naszego stylu życia."
 MAY_divine_kingship_title: "Los boskiego królestwa"
 MAY_divine_kingship_desc: "Dawniej królowie pełnili zarazem funkcję kapłanów i składali ofiary bogom na szczytach wielkich świątyń, na oczach całej społeczności. Być może powinniśmy powrócić do tej tradycji."
 MAY_chontal_maya_title: "Majowie Chontal"
 MAY_chontal_maya_desc: "Majowie Chontal Champutun z zachodnich nizin, nazywający siebie Yokot'an, są ludem o silnych tradycjach kupieckich. Zajmują się handlem wzdłuż północnego wybrzeża, a z ich pomocą możemy zbudować rozległą sieć handlową."
 MAY_maize_title: "Uprawa kukurydzy"
 MAY_maize_desc: "Kukurydza jest nieodłącznym elementem majowskiego sposobu życia. Według wierzeń bogowie próbowali stworzyć ludzi z gliny i drewna, lecz dopiero z ciasta kukurydzianego powstały istoty zdolne żyć i sławić swoich patronów."
 MAY_plaster_temples_title: "Tynkowanie świątyń"
 MAY_plaster_temples_desc: "Majowie nie wznosili swoich wielkich świątyń od razu. Początkowo budowali proste konstrukcje, a każdy kolejny patron nakazywał nakładać na nie nową warstwę tynku, aż powstawały jedne z najwspanialszych zabytków świata."
 MAY_trading_society_title: "Społeczeństwo kupieckie"
 MAY_trading_society_desc: "Uważa się, że Majowie okresu klasycznego zamieszkiwali przede wszystkim wielkie miasta południowych nizin, gdzie królowie byli zarazem kapłanami i gwarantami przychylności bogów. Nic dziwnego, że słynęli ze wspaniałych świątyń. Gdy jednak Majowie zaczęli opuszczać te miasta, ich społeczeństwo coraz bardziej skupiało się na handlu, nadając religii i monumentalnej architekturze mniejsze znaczenie niż w czasach klasycznych."
 MAY_trade_guilds_title: "Wsparcie dla Ppolomo'ob"
 MAY_trade_guilds_desc: "Wraz z rozwojem naszych instytucji finansowych musimy przeznaczyć część zasobów na zapewnienie kupcom jak najkorzystniejszych warunków handlu."
 MAY_environment_title: "Przystosowanie do środowiska"
 MAY_environment_desc: "Uważa się, że nadmierna eksploatacja ziemi, susze, erozja gleby i wojny między państwami przyczyniły się do upadku politycznego świata Majów w centrum regionu. Nie powinno to dziwić, skoro żyjemy w wyjątkowo surowym środowisku. Jesteśmy jednak odporni i przystosujemy się do wszelkich przeciwności, jakie rzucą nam Jukatan i dżungle."
 MAY_restore_lowland_ruins_title: "Odbudowa ruin nizin"
 MAY_restore_lowland_ruins_desc: "Środkowe niziny Majów usiane są opuszczonymi miastami, przypominającymi o złotych czasach dawnych imperiów. Mimo to nadal odwiedzamy miejscowe świątynie, by składać ofiary bóstwom. Przywróćmy tym ruinom dawną świetność."
 MAY_trade_2_title: "Nowe szlaki handlowe"
 MAY_trade_2_desc: "Przepływ handlu jest jak woda, która daje życie ziemi. Utrzymując i poszerzając nasze trasy handlowe i obecność, możemy zapewnić nam dobrobyt i bogactwo."
 MAY_cocoa_title: "Bogactwo kakao"
 MAY_cocoa_desc: "Znaczenia ziaren kakaowca w życiu Majów nie sposób przecenić. Wykorzystuje się je nie tylko jako podstawowy składnik pożywienia, lecz także w medycynie, a nawet jako środek wymiany w handlu wymiennym i płatnościach."
 MAY_venus_title: "Znak Chac Ek"
 MAY_venus_desc: "Dla Majów pojawienie się na niebie Chac Ek — Wenus — zwiastuje czas wojny i nadejście wielkich wydarzeń. Takie konflikty nazywa się „wojnami gwiezdnymi”. Wiele z nich toczyły między sobą Tikal i Calakmul w okresie klasycznym."
 MAY_realm_size_title: "Sezon wypraw wojennych"
 MAY_realm_size_desc: "Surowy klimat ziem Majów i ich pograniczy utrudnia prowadzenie długich kampanii. Pora deszczowa komplikuje transport, który i tak jest trudny z powodu braku zwierząt jucznych i pociągowych. Sprzęt przenoszą tragarze, którzy sami mogą potrzebować kolejnych tragarzy do dostarczania zapasów. Jeśli szlak biegnie wzdłuż rzeki, zasięg wypraw można zwiększyć dzięki wykorzystaniu canoe."
 MAY_pass_reform_title: "Reforma naszego społeczeństwa"
 MAY_pass_reform_desc: "Krok po kroku wkroczymy w nową erę świata — taką, w której bogowie zawsze są zadowoleni, a człowiek nie musi obawiać się niczego ani nikogo."
