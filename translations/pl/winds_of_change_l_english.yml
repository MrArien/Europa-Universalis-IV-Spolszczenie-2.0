 cb_reconquest_of_china: "Odzyskanie ziem Yuan"
 cb_reconquest_of_china_desc: "Stworzymy imperium dorównujące państwu Czyngis-chana. Zanim jednak osiągniemy ten cel, musimy odzyskać ziemie dynastii Yuan."
 TIM_yuan_reconquest: "Pokaz siły"
 TIM_yuan_reconquest_desc: "Celem wojny jest wykazanie przewagi naszych armii poprzez zwycięstwa w bitwach."
 TIM_YUAN_RECONQUEST_WARNAME: "Inwazja $ORDER$$SECOND_NAME$"
 TIM_bring_taxation_under_control_title: "Odbudowa skarbu"
 TIM_bring_taxation_under_control_desc: "Nasze finanse ucierpiały wskutek hojnego rozdawnictwa sojurgali. Musimy ponownie wzmocnić skarb państwa."
 TIM_supremacy_of_the_sharia_title: "Wyższość szariatu"
 TIM_supremacy_of_the_sharia_desc: "Ulemowie od dawna domagają się zniesienia praw jassy i pełnego poszanowania prawa szariatu. Najwyższy czas spełnić ich żądania."
