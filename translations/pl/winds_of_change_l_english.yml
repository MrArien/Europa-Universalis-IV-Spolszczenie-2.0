 hsn_political_security_title: "Bezpieczeństwo polityczne"
 hsn_political_security_desc: "Nasz sułtanat spotkał nieszczęsny los i został zredukowany do roli niewielkiego państwa. Jeśli chcemy przetrwać i odzyskać należną nam pozycję sułtanów Egiptu i Syrii, musimy poszukać potężnych sojuszników, którzy pomogą nam zrealizować te ambicje."
 hsn_expand_the_domain_title: "Rozszerzenie domeny"
 hsn_expand_the_domain_desc: "Zabezpieczywszy sytuację wewnętrzną, musimy teraz spojrzeć na zewnątrz i podporządkować sobie okoliczne regiony. Wkrótce sztandar z orłem załopocze nad całym Maszrekiem!"
 hsn_slay_white_sheep_title: "Poskromienie Turkomanów"
 hsn_slay_white_sheep_desc: "Turkomani stanowią najpilniejsze zagrożenie dla naszej niepodległości. Nadszedł czas, by pokazać im należne miejsce i dowieść, na co stać potomków Saladyna."
 hsn_appease_ulema_title: "Udobruchanie ulemów"
 hsn_appease_ulema_desc: "Nasza religia jest jednym z filarów społeczeństwa. Zjednanie sobie religijnych stanów państwa umocni nasze rządy i dowiedzie wszystkim pobożności naszych władców."
 hsn_build_mosques_title: "Budowa meczetów"
 hsn_build_mosques_desc: "Duchowe potrzeby naszego ludu i nauki islamu stanowią fundament naszego społeczeństwa. Aby je zaspokoić, musimy sfinansować rozbudowę naszych świętych miejsc."
 hsn_recover_baghdad_title: "Zabezpieczenie Mezopotamii"
 hsn_recover_baghdad_desc: "Mezopotamia jest jednym z najważniejszych regionów całego Bliskiego Wschodu. Niedawny upadek Dżalajirydów doprowadził do powstania próżni władzy, którą wypełnili Turkomani, lecz ich panowanie nad tym regionem również jest bardzo słabe. Daje nam to doskonałą okazję, by przejąć te ziemie i otworzyć sobie dalsze drogi ekspansji."
 hsn_city_of_peace_title: "Miasto Pokoju"
 hsn_city_of_peace_desc: "Bagdad był niegdyś największym miastem świata. Zniszczenia dokonane przez Mongołów były tak ogromne, że miasto nigdy w pełni się po nich nie podniosło. Pod naszym panowaniem Miasto Pokoju odzyska dawną świetność."
 hsn_house_wisdom_title: "Wielka Biblioteka Bagdadu"
 hsn_house_wisdom_desc: "Dom Mądrości był miejscem przechowywania wszystkich naukowych osiągnięć muzułmańskich uczonych. Skupiał najwybitniejszych intelektualistów całej cywilizacji islamskiej. Aby przywrócić złoty wiek, musimy sprowadzić na nasz dwór największe umysły świata islamu i odtworzyć to, co utraciliśmy. Będzie to trudne, ponieważ nie wiemy dokładnie, co przepadło, lecz jest konieczne, jeśli chcemy wskrzesić naukowe dziedzictwo islamu."
 hsn_madrasas_title: "Zakładanie nowych medres"
 hsn_madrasas_desc: "Niestrudzenie pracujemy nad odnową intelektualną naszego państwa. Aby zapoczątkować nowy islamski złoty wiek, musimy założyć nowe medresy, które staną się ośrodkami nauki dla naszych najwybitniejszych uczonych."
 hsn_golden_age_title: "Nowy złoty wiek"
 hsn_golden_age_desc: "Od czasów renesansu świat zachodni przewodzi innowacjom i postępowi. Nasze niedawne osiągnięcia naukowe stopniowo przenoszą jednak centrum wiedzy z Zachodu z powrotem do świata islamu. Wkrótce zapoczątkujemy drugi islamski złoty wiek!"
 hsn_eagle_flies_alone_title: "Orzeł leci samotnie"
 hsn_eagle_flies_alone_desc: "Orzeł został zraniony, lecz to nie znaczy, że nie może odzyskać sił. Musimy uleczyć rany Hisn Kajfy — Ajjubidów — i odbudować naszą pozycję, by nie stać się jedynie martwym państwem na kartach historii. Wkrótce orzeł znów wzleci, tym razem samotnie, a wszyscy znajdą się w cieniu jego potężnych skrzydeł."
 hsn_saladins_legacy_title: "Dziedzictwo Saladyna"
 hsn_saladins_legacy_desc: "Żadna postać nie miała dla naszej dynastii większego znaczenia niż Saladyn. Bez jego dokonań Ajjubidzi nigdy by nie powstali, dlatego naszym obowiązkiem jest jak najlepiej uczcić jego dziedzictwo."
 hsn_fate_of_anatolia_title: "Los Anatolii"
 hsn_fate_of_anatolia_desc: "Historycznie Anatolia nigdy nie należała do sułtanatu ajjubidzkiego. Stojąc u jej bram, musimy zdecydować, czy podbić ten region siłą, czy też zawrzeć sojusze z miejscowymi potęgami."
 hsn_branching_first_title: "Misja z rozgałęzieniem"
 hsn_branching_first_desc: "Ta misja jest §Ymisją rozgałęziającą§!. Jej wymagania i skutki będą zależeć od sposobu ukończenia misji „§YLos Anatolii§!”."
 hsn_turn_against_mamluks_title: "Wystąpienie przeciw Mamelukom"
 hsn_turn_against_mamluks_desc: "Mamelucy doprowadzili do upadku naszego sułtanatu i okupują teraz ziemie, które słusznie należą do nas. Najwyższy czas zgromadzić nasze armie i wreszcie wystąpić przeciw tym zdrajcom."
 hsn_ayyubid_restoration_title: "Odrodzenie Ajjubidów"
 hsn_ayyubid_restoration_desc: "Dzięki podbojowi Palestyny nasze państwo wreszcie zdołało przyćmić mameluckich zdrajców, którzy doprowadzili do upadku naszej dynastii. Dziś dysponujemy już środkami i legitymacją, by z dumą ogłosić, że księstwo Hisn Kajfa przywróciło sułtanat ajjubidzki!"
 hsn_crusaders_title: "Wygnanie krzyżowców"
 hsn_crusaders_desc: "Choć Saladyn zdołał wyprzeć krzyżowców z kontynentu, nadal okupują oni wyspy we wschodniej części Morza Śródziemnego. Oczyśćmy Lewant z ich obecności raz na zawsze."
 hsn_recover_egypt_title: "Odzyskanie Egiptu"
 hsn_recover_egypt_desc: "Przed wiekami Egipt był sercem imperium ajjubidzkiego. Bez kontroli nad nim nigdy nie przywrócimy dawnej chwały. Musimy odzyskać ten region bez względu na koszty."
 hsn_ayyubid_caliphate_title: "Zgłoszenie pretensji do kalifatu"
 hsn_ayyubid_caliphate_desc: "Wśród naszych elit trwa zażarta debata. Dotychczas uznawaliśmy autorytet kalifów Abbasydów, lecz niektórzy domagają się, byśmy sami sięgnęli po kalifat, co ugruntowałoby naszą pozycję prawdziwych przywódców islamu. Musimy natychmiast rozstrzygnąć tę sprawę."
 hsn_alexandria_title: "Odbudowa Aleksandrii"
 hsn_alexandria_desc: "Aleksandria jest jednym z najważniejszych ośrodków handlu we wschodniej części Morza Śródziemnego. Musimy utrzymać jej status centrum handlowego i zwiększyć znaczenie miasta, by przyciągało zagranicznych kupców, rzemieślników i handlarzy."
 hsn_granary_title: "Spichlerz Morza Śródziemnego"
 hsn_granary_desc: "Nil dał początek wielu potężnym cywilizacjom. Jeśli chcemy zapewnić sobie przetrwanie, musimy zadbać o to, by dobrobyt i bogactwo tej rzeki znalazły się pod naszą ścisłą kontrolą."
 hsn_conquer_basra_title: "Podbój Basry"
 hsn_conquer_basra_desc: "Basra jest bramą do Zatoki Perskiej. Kontrola nad nią zapewni nam dostęp do handlu z Indiami i Dalekim Wschodem."
 hsn_consolidate_coastline_title: "Umocnienie wybrzeża"
 hsn_consolidate_coastline_desc: "Aby skuteczniej kontrolować handel w Zatoce Perskiej, musimy utworzyć kolejne bazy operacyjne zarówno po arabskiej, jak i perskiej stronie zatoki."
 hsn_monopolize_gulf_trade_title: "Monopol na handel w Zatoce"
 hsn_monopolize_gulf_trade_desc: "Handel jest siłą napędową imperiów. Napędza ich rozwój, a jego kondycja odzwierciedla zarówno dobre, jak i złe czasy. Musimy zadbać o konkurencyjność naszej gospodarki, dlatego powinniśmy zdominować handel w Zatoce Perskiej."
 hsn_sultan_shah_title: "Sułtan i szach"
 hsn_sultan_shah_desc: "Granice sułtanatu ajjubidzkiego stykają się z granicami Persji w górach Zagros. Szach jest potężnym przeciwnikiem, ale może również okazać się cennym sojusznikiem. Czas zdecydować, czy zostanie naszym najdroższym przyjacielem, czy śmiertelnym wrogiem."
 hsn_branching_second_title: "Misja z rozgałęzieniem"
 hsn_branching_second_desc: "Ta misja jest §Ymisją rozgałęziającą§!. Jej wymagania i skutki będą zależeć od sposobu ukończenia misji „§YSułtan i szach§!”."
 hsn_custodian_title: "Opiekun Świętych Miast"
 hsn_custodian_desc: "Ajjubidzi niegdyś sprawowali władzę nad świętymi miastami, co wiązało się z obowiązkiem ochrony pielgrzymów odbywających hadżdż. Wraz z naszym powrotem na dawne ziemie naturalnym celem jest odzyskanie tego zaszczytnego obowiązku. Święte miasta znajdą się pod ochroną Ajjubidów."
 hsn_red_sea_title: "Kontrola nad Morzem Czerwonym"
 hsn_red_sea_desc: "Morze Czerwone jest nie tylko kluczowym szlakiem handlowym między Egiptem a Adenem, lecz także strategicznie ważnym obszarem zapewniającym łatwy dostęp do najświętszych miast islamu. Aby zagwarantować swobodny handel i ochronę naszego wybrzeża, musimy przejąć nad nim pełną kontrolę morską i odpierać każdego, kto ośmieli się wpłynąć na nasze wody."
 hsn_aden_title: "Dotarcie do Adenu"
 hsn_aden_desc: "Przez Aden przepływa handel przyprawami — jeden z najbardziej pożądanych szlaków handlowych świata, przynoszący bogactwo zarówno muzułmanom, jak i chrześcijanom. Nasze położenie w pobliżu Adenu daje nam udział w tym handlu, lecz to za mało. Musimy go zdominować i całkowicie podporządkować sobie jego zyski."
 hsn_sands_of_arabia_title: "Piaski Arabii"
 hsn_sands_of_arabia_desc: "Islam jest prawdziwą wiarą, a prawowite kalifaty islamu często władały całym Półwyspem Arabskim. Jesteśmy wprawdzie jedynie sułtanatem, a większość Arabii stanowi niegościnna pustynia, jednak nasza odradzająca się potęga wywiera presję, by ponownie zjednoczyć arabskie plemiona. Niech historia zatoczy koło, a miejsce narodzin islamu znów zjednoczy się pod jednym sztandarem — sztandarem Ajjubidów."
 hsn_fertile_crescent_title: "Życiodajne źródło Maszreku"
 hsn_fertile_crescent_desc: "Dwie wielkie rzeki Mezopotamii — Tygrys i Eufrat — stanowią życiodajne źródło Maszreku i były kolebką wielu cywilizacji. Jeśli chcemy wyżywić rosnącą populację i nasze armie, musimy przejąć pełną kontrolę nad bogactwem i dobrobytem tego regionu."
 hsn_last_bastion_title: "Ostatni bastion"
 hsn_last_bastion_desc: "Hisn Kajfa jest ostatnim przyczółkiem dynastii ajjubidzkiej. Musimy zadbać o solidne ufortyfikowanie miasta, aby mogło służyć nam jako baza operacyjna."
 hsn_eastern_frontier_title: "Zabezpieczenie Kaukazu"
 hsn_eastern_frontier_desc: "Zabezpieczenie Kaukazu i przesunięcie naszych granic aż po pasmo górskie zapewni państwu cenną strategiczną linię obrony."
 hsn_dar_al_islam_title: "Dar al-Islam"
 hsn_dar_al_islam_desc: "Jako najpotężniejsi obrońcy Allaha mamy obowiązek zjednoczyć ummę pod sztandarem prawowitych kalifów. Maszerujemy w cieniu ajjubidzkiego orła i Czarnego Sztandaru Mahometa. Jesteśmy mieczem islamu i to my zjednoczymy wszystkich wiernych!"
 hsn_suez_canal_title: "Kanał As-Suwajs"
 hsn_suez_canal_desc: "Pomysł połączenia Nilu z Morzem Czerwonym sięga czasów starożytnego Egiptu. Teraz, gdy dysponujemy środkami niezbędnymi do realizacji tego inżynieryjnego cudu, powinniśmy rozważyć taką inwestycję. Jeśli uda nam się zbudować kanał, cały sułtanat skorzysta z handlu i pobieranych opłat."
 hsn_a_sublime_alliance_title: "[Root.GetPreviewColorHSN]Wzniosły sojusz[Root.GetPreviewColorHSN_end]"
 hsn_a_sublime_alliance_desc: "Synowie Osmana władają rozległym imperium, które zdołało wedrzeć się głęboko w serce Europy i zagraża już nawet siedzibie Rzymian. W naszym interesie leży nieustanne dbanie o utrzymanie sojuszu."
 hsn_overthrow_the_ottomans_title: "[Root.GetPreviewColorHSN]Obalenie Osmanów[Root.GetPreviewColorHSN_end]"
 hsn_overthrow_the_ottomans_desc: "Turcy wydają się najpotężniejszym państwem całego świata islamu, lecz powinni wiedzieć, że ich era dominacji dobiega gwałtownego końca. Armie Ajjubidów wkroczą do Anatolii i podporządkują ten region władzy orła."
 hsn_subjugate_eranshahr_title: "[Root.GetPreviewColorHSN2]Podporządkowanie Eranszahru[Root.GetPreviewColorHSN2_end]"
 hsn_subjugate_eranshahr_desc: "Potężny Iran został spustoszony przez hordy mongolskie i timurydzkie. Musimy przywrócić tę wspaniałą ziemię, jedną z kolebek islamu, we władanie ludu, który będzie rządził nią sprawiedliwie i przywróci jej dawny splendor oraz dobrobyt."
 hsn_befriend_the_shah_title: "[Root.GetPreviewColorHSN2]Pozyskanie przyjaźni szacha[Root.GetPreviewColorHSN2_end]"
 hsn_befriend_the_shah_desc: "Szachowie Persji są potężnymi władcami, dysponującymi licznymi armiami i ogromnym bogactwem. Musimy dążyć do zawiązania nierozerwalnej więzi między naszymi państwami, aby nikt nie ośmielił się nas zaatakować, dopóki trwa sojusz."
 hsn_ayyubid_golden_age: "Złoty wiek Ajjubidów"
 desc_hsn_ayyubid_golden_age: "Nasze wielkie osiągnięcia w nauce i edukacji staną się początkiem drugiego islamskiego złotego wieku."
 hsn_political_security: "Bezpieczeństwo polityczne"
 desc_hsn_political_security: "Udało nam się ustabilizować sytuację polityczną, a nasi potężni sojusznicy będą nas chronić, gdy będziemy odbudowywać siły."
 hsn_persian_support: "Perscy katafrakci"
 desc_hsn_persian_support: "Perscy katafrakci przysłani przez naszych sojuszników staną się elitarną częścią naszych oddziałów kawalerii."
 hsn_ottoman_janissaries: "Osmańscy janczarzy"
 desc_hsn_ottoman_janissaries: "Janczarzy dostarczeni przez naszych anatolijskich przyjaciół staną się ważną częścią naszej struktury wojskowej."
 hsn_mamluk_reinforcements: "Mameluccy żołnierze niewolni"
 desc_hsn_mamluk_reinforcements: "Egipscy żołnierze niewolni spustoszą pole bitwy i zapewnią nam liczne zwycięstwa."
 hsn_resurgent_ayyubids: "Odrodzeni Ajjubidzi"
 desc_hsn_resurgent_ayyubids: "Udało nam się rozszerzyć granice poza twierdzę Hisn Kajfa i przygotowujemy się do odtworzenia sułtanatu ajjubidzkiego."
 hsn_ayyubid_architecture: "Architektura ajjubidzka"
 desc_hsn_ayyubid_architecture: "Aby wzmocnić kulturowe znaczenie naszego państwa, rozwijajmy własny, niepowtarzalny styl architektoniczny."
 hsn_jizya: "Podatek dżizja"
 desc_hsn_jizya: "Niewierni żyjący pod naszym panowaniem mogą zachować swoje prawa, lecz oczekujemy od nich płacenia podatku dżizja."
 hsn_restoration_baghdad: "Odbudowa Bagdadu"
 desc_hsn_restoration_baghdad: "Bagdad bardzo ucierpiał od czasu upadku pod naporem mongolskich hord. Dopilnujemy, by Miasto Pokoju odzyskało dawną wielkość i znów stało się potężną metropolią."
 hsn_patron_science: "Mecenas nauki"
 desc_hsn_patron_science: "Wysiłki [Root.Monarch.GetName] na rzecz odbudowy Domu Mądrości przyniosły [Root.Monarch.GetHerHim] przydomek Mecenasa Nauki."
 hsn_paradise_gardens: "Rajskie ogrody Bagdadu"
 desc_hsn_paradise_gardens: "Udało nam się przywrócić Bagdadowi dawną pozycję. Miasto znów ma globalne znaczenie i budzi zazdrość całego znanego świata."
 hsn_city_of_peace: "Miasto Pokoju"
 desc_hsn_city_of_peace: "Bagdad był niegdyś znany jako Miasto Pokoju. Wreszcie udało nam się przezwyciężyć jego najmroczniejszy okres i ponownie przywrócić mu ten status."
 hsn_madrasas: "Ajjubidzkie medresy"
 desc_hsn_madrasas: "Nasze medresy staną się ośrodkami wiedzy, które będą przewodzić nowemu złotemu wiekowi."
 hsn_fertile_crescent: "Żyzny Półksiężyc"
 desc_hsn_fertile_crescent: "Mezopotamskie ziemie mogą wyżywić i utrzymać całe cywilizacje. Musimy jak najlepiej wykorzystać ich potencjał dla własnej korzyści."
 hsn_sword_of_islam: "Miecz islamu"
 desc_hsn_sword_of_islam: "Jesteśmy najpotężniejszymi wojownikami Allaha, Mieczem Islamu. Niech niewierni drżą przed potęgą naszych armii!"
 hsn_rock_fortress: "Skalna twierdza"
 desc_hsn_rock_fortress: "Hisn Kajfa jest naszą stolicą i bazą operacyjną. Musimy zadbać o kluczowe umocnienia miasta."
 hsn_rise_of_the_eagle: "Powstanie orła"
 desc_hsn_rise_of_the_eagle: "Ajjubidzki orzeł ponownie wzbija się do lotu i wkrótce obejmie wzrokiem rozległe ziemie odrodzonego sułtanatu ajjubidzkiego."
 hsn_vengeful: "Marsz mścicieli"
 desc_hsn_vengeful: "Nasze żądne zemsty armie maszerują na Egipt, serce państwa mameluckich zdrajców, by pomścić nasz upadek i odzyskać to, co słusznie nam się należy."
 hsn_east_mediterranean: "Zabezpieczona wschodnia część Morza Śródziemnego"
 desc_hsn_east_mediterranean: "Wraz z upadkiem ostatniego bastionu krzyżowców wschodnia część Morza Śródziemnego znalazła się pod naszą pełną kontrolą."
 hsn_ayyubid_tolerance: "Tolerancja Ajjubidów"
 desc_hsn_ayyubid_tolerance: "Nasz rząd zawsze pozwalał ludziom o różnym pochodzeniu zdobywać wysoką pozycję i wpływy."
 hsn_anatolian_alliance: "Sojusz anatolijski"
 desc_hsn_anatolian_alliance: "Sojusz z Turkami zabezpieczy nasze północne granice i zapewni regionowi trwały pokój."
 hsn_anatolian_alliance2: "Sojusz anatolijski"
 desc_hsn_anatolian_alliance2: "Sojusz z Turkami zabezpieczy nasze północne granice i zapewni regionowi trwały pokój."
 hsn_a_sublime_alliance: "Wzniosły sojusz"
 desc_hsn_a_sublime_alliance: "Synowie Osmana władają rozległym imperium, które zdołało wedrzeć się głęboko w serce Europy i zagraża już nawet siedzibie Rzymian. W naszym interesie leży nieustanne dbanie o utrzymanie sojuszu."
 hsn_center_of_commerce: "Centrum handlu"
 desc_hsn_center_of_commerce: "Dzięki naszym wysiłkom Iskandariyya ponownie stała się jednym z najważniejszych ośrodków handlowych całego basenu Morza Śródziemnego."
 hsn_latin_quarters: "Dzielnica łacińska"
 desc_hsn_latin_quarters: "Nasze zdolności dyplomatyczne pozwoliły nam nawiązać bliskie stosunki z bogatymi włoskimi kupcami, którzy założyli już własną dzielnicę łacińską w Iskandariyya."
 hsn_granary: "Spichlerz Morza Śródziemnego"
 desc_hsn_granary: "Delta Nilu od zawsze była znana jako spichlerz Morza Śródziemnego. Dopilnujemy, by zachowała status żywicielki całego świata."
 granary_of_the_mediterranean_key: "Spichlerz Morza Śródziemnego"
 hsn_abbasid_authority: "Autorytet Abbasydów"
 desc_hsn_abbasid_authority: "Podążajmy za przykładem Saladyna i szanujmy autorytet kalifów Abbasydów."
 hsn_ayyubid_caliphate: "Kalifat ajjubidzki"
 desc_hsn_ayyubid_caliphate: "Nasi władcy ogłosili się prawowitymi kalifami islamu, ponieważ tylko w ten sposób możemy zdobyć legitymację do sprawowania władzy nad ummą."
 hsn_black_banner: "Czarny Sztandar Mahometa"
 desc_hsn_black_banner: "Jesteśmy nosicielami Czarnego Sztandaru Mahometa. Podążamy właściwą drogą, a pod naszym panowaniem świat islamu zostanie zjednoczony."
 hsn_trading_network: "Rozbudowa sieci handlowej"
 desc_hsn_trading_network: "Morze Czerwone ma ogromne znaczenie dla gospodarki naszego sułtanatu. Rozbudowa lokalnych szlaków handlowych jest naszym priorytetem."
 hsn_bab_el_mandeb: "Kontrola nad cieśniną Bab al-Mandab"
 hsn_safeguard_gulf_entrance: "Zabezpieczone wejście do Zatoki"
 desc_hsn_safeguard_gulf_entrance: "Cieśnina Ormuz jest ważnym i łatwym do obrony wąskim gardłem, dzięki któremu możemy przejąć kontrolę nad całą Zatoką Perską."
 hsn_riches_of_persia: "Bogactwa Persji"
 desc_hsn_riches_of_persia: "Przed wiekami Persja była bez wątpienia najbogatszym regionem świata. Cofniemy zniszczenia spowodowane przez Mongołów i Timura, przywracając dawną świetność."
 hsn_red_sea_trade_hegemony: "Hegemonia handlowa na Morzu Czerwonym"
 desc_hsn_red_sea_trade_hegemony: "Nasze wpływy handlowe i potężne floty zapewniły nam całkowitą hegemonię nad Morzem Czerwonym."
 hsn_suez_canal: "Cud inżynierii"
 desc_hsn_suez_canal: "Budowa Kanału Sueskiego jest bez wątpienia jednym z najbardziej ambitnych przedsięwzięć inżynieryjnych w historii — prawdziwym cudem, któremu nie dorównuje żaden inny projekt."
 hsn_suez_canal_dlcless: "Kanał Sueski"
 desc_hsn_suez_canal_dlcless: "Budowa Kanału Sueskiego jest bez wątpienia jednym z najbardziej ambitnych przedsięwzięć inżynieryjnych w historii — prawdziwym cudem, któremu nie dorównuje żaden inny projekt."
 hsn_legacy_of_saladin: "Dziedzictwo Saladyna"
 desc_hsn_legacy_of_saladin: "Nasi doradcy wojskowi będą czerpać inspirację z dziedzictwa Saladyna, dbając o sprawne funkcjonowanie struktur wojskowych i gotowość armii do wojny."
 hsn_restoring_damascus: "Odbudowany Damaszek"
 desc_hsn_restoring_damascus: "Damaszek był niegdyś stolicą Ajjubidów i siedzibą Saladyna. Przywróciliśmy nasz dwór temu wspaniałemu miastu, odbudowując jego dawną świetność."
 hsn_subjugate_eranshahr: "Podporządkowany Eranszahr"
 desc_hsn_subjugate_eranshahr: "Potężny Iran został spustoszony przez hordy mongolskie i timurydzkie. Przywróciliśmy tę wspaniałą ziemię, jedną z kolebek islamu, we władanie ludu, który będzie rządził nią sprawiedliwie i odbuduje jej splendor oraz dobrobyt."
 hsn_pact_with_shah: "Układ z szachem"
 desc_hsn_pact_with_shah: "Szachowie Persji są potężnymi władcami, dysponującymi licznymi armiami i ogromnym bogactwem. Zawarliśmy nierozerwalny układ między naszymi państwami, aby nikt nie ośmielił się nas zaatakować, póki trwa sojusz."
 hsn_overthrow_the_ottomans: "Koniec osmańskiej hegemonii"
 desc_hsn_overthrow_the_ottomans: "Turcy wydawali się najpotężniejszym państwem całego świata islamu, lecz ich era dominacji dobiega gwałtownego końca. Armie Ajjubidów wkroczyły do Anatolii i podporządkowały ten region władzy orła."
 hsn_rely_on_own_armies: "Poleganie na własnych armiach"
 desc_hsn_rely_on_own_armies: "Mameluccy żołnierze niewolni nie są godni zaufania. Musimy nadal polegać na własnych, zawodowych armiach."
 hsn_mamluk_reconciliation: "Pojednanie z Mamelukami"
 desc_hsn_mamluk_reconciliation: "Mamelucy historycznie dobrze służyli naszej dynastii. Musimy zapomnieć o dawnych urazach i dążyć do pojednania."
 hsn_protector_of_pilgrims: "Obrońca pielgrzymów"
 desc_hsn_protector_of_pilgrims: "Chronimy wszystkich pielgrzymów przemierzających nasze ziemie."
 hsn_fertile_crescent_no_moh: "Żyzny Półksiężyc"
 desc_hsn_fertile_crescent_no_moh: "Mezopotamskie ziemie mogą wyżywić i utrzymać całe cywilizacje. Musimy jak najlepiej wykorzystać ich potencjał dla własnej korzyści."
 ayyubid_dynasty: "Dynastia ajjubidzka"
 ayyubid_dynasty_desc: "Historycznie dynastia ajjubidzka pozwalała lokalnym elitom cieszyć się znaczną autonomią, choć wszystkie podlegały sułtanowi al-Mu'azzamowi. Nasz rząd umożliwiał ludziom o różnym pochodzeniu osiąganie wysokich stanowisk w państwie — to tradycja, którą nasza dynastia musi podtrzymywać."
 mechanic_negate_unaccepted_levantine_culture_yes: "Prowincje z grupy kulturowej §Lewantyńskiej§! będą miały §Gzniwelowany§! modyfikator nieakceptowanej kultury."
 mechanic_negate_unaccepted_levantine_culture_no: ""
 mechanic_army_tradition_for_generals_yes: "Rekrutacja §Ygenerałów§! zapewnia teraz §G0,5§! tradycji armii."
 mechanic_army_tradition_for_generals_no: ""
 ayyubid_high_command: "Naczelne dowództwo Ajjubidów"
 ayyubid_high_command_desc: "Za panowania Saladyna nasze armie były niepokonaną siłą na polu bitwy. Jeśli chcemy odzyskać ten status, musimy położyć nacisk na odpowiednie szkolenie generałów. Ich znajomość sztuki wojennej przełoży się na zwycięstwa na polu bitwy."
 AYB_ideas: "Idee ajjubidzkie"
 AYB_ideas_start: "Tradycje ajjubidzkie"
 AYB_ideas_bonus: "Ambicja ajjubidzka"
 hsn2_citadels_and_fortesses: "Cytadele i twierdze"
 hsn2_citadels_and_fortesses_desc: "Z dala od tętniącej życiem metropolii skalny zamek Hisn Kajfa jest starożytną warownią w górach kurdyjskich. Podobne skalne twierdze od pokoleń służyły kurdyjskim plemionom, a my powinniśmy czerpać z ich doświadczeń. Nie sposób przecenić wartości dobrze utrzymanego zamku — zarówno nad brzegami Tygrysu, jak i w wielkim Kairze czy na wzgórzach Palestyny."
 hsn2_ayyubid_heritage: "Dziedzictwo przodków"
 hsn2_ayyubid_heritage_desc: "Nasi przodkowie władali niegdyś wielkim imperium obejmującym całą Syrię, Górną Mezopotamię, Egipt i Hidżaz. Choć niewiele z niego pozostało, nasze imię wciąż budzi szacunek wśród kurdyjskich plemion, którymi teraz rządzimy. Jeśli zdołamy zjednoczyć tych wojowników wokół naszej sprawy, być może odbudujemy to, co odebrali nam zdradzieccy niewolnicy."
 hsn2_righteousness_of_the_faith: "Prawość wiary"
 hsn2_righteousness_of_the_faith_desc: "Nasz wielki przodek Salah ad-Din wyniósł naszą rodzinę do potęgi dzięki niezłomnemu przywiązaniu do prawości swojej wiary. Obalił kalifów fatymidzkich i ich państwo szyickie, a także pokonał chrześcijańskich krzyżowców w Lewancie.\\nNasze czasy ponownie naznaczone są religijnymi niepokojami, a szyizm zyskuje na znaczeniu. Musimy podjąć dziedzictwo wielkiego zdobywcy i stanąć w obronie prawowiernych na Bliskim Wschodzie."
 hsn2_elite_warriors: "Elitarni wojownicy"
 hsn2_elite_warriors_desc: "Armie tureckiej kawalerii dominują na polach bitew Bliskiego Wschodu — czy to doskonale wyszkoleni Mamelucy, szyiccy sekciarze z ugrupowania Kyzyłbaszów, czy sipahowie anatolijskich Turków. Zrekrutujmy również licznych koczowniczych wojowników przemierzających te ziemie i stawmy czoła wrogom na równych warunkach."
 hsn2_rise_of_the_eagle: "Powstanie orła"
 hsn2_rise_of_the_eagle_desc: "Nadszedł czas, by odzyskać to, co utracili nasi przodkowie. Działajmy teraz, aby odbudować dawne imperium i stworzyć na Bliskim Wschodzie potężną sunnicką ostoję przeciw niewiernym, szyitom i zdrajcom."
 hsn2_strenghten_central_authority: "Wzmocnienie władzy centralnej"
 hsn2_strenghten_central_authority_desc: "Niegdyś nasza rodzina dzieliła łupy z odniesionych zwycięstw między swoich krewnych. Polityka ta osłabiała jednak sułtanat na wiele sposobów i siała wśród nas ziarna niezgody. Tym razem pójdziemy za przykładem innych imperiów tego regionu i stworzymy silną władzę centralną, która będzie nadzorować wszystkie nadania ziemskie."
 hsn2_state_economics: "Gospodarka państwowa"
 hsn2_state_economics_desc: "Nasi przodkowie rozumieli, że aby imperium mogło rozkwitać, jego władcy muszą zapewnić pokój i ochronę poddanym. Niektóre dziedziny gospodarki najlepiej pozostawić prywatnym obywatelom, inne zaś warto powierzyć naszym ministrom. Handel, przemysł i rzemiosło pozwolą rozkwitnąć naszemu imperium."
 AYB: "Ajjubidzi"
 AYB_ADJ: "Ajjubidzki"
 hsn_move_capital_to_damascus_title: "Przeniesienie stolicy do Damaszku"
 hsn_move_capital_to_damascus_desc: "Damaszek był niegdyś stolicą Ajjubidów i siedzibą Saladyna. Powróćmy z naszym dworem do tego wspaniałego miasta i przywróćmy mu dawną świetność."
 flavor_hsn.1.t: "Odrodzenie Ajjubidów"
 flavor_hsn.1.d: "Imperium ajjubidzkie rozciągało się niegdyś na rozległych obszarach, będąc lwem islamu i opiekunem najświętszych miast. Następcy Saladyna nie zdołali uczcić jego dziedzictwa, osłabili sułtanat, a nieszczęśliwy obrót wydarzeń doprowadził do jego upadku. Od tamtej pory pogrążaliśmy się w stagnacji, lecz nasze niedawne kampanie podbojów dowodzą, że skrzydła orła wciąż nie zostały złamane. Zdeterminowani, by przywrócić chwałę naszych przodków, ruszamy naprzód — jesteśmy bowiem potomkami Saladyna i to nam przypada w udziale odzyskanie jego dziedzictwa!"
 flavor_hsn.1.a: "Orzeł ponownie wzbija się do lotu!"
 flavor_hsn.2.t: "Los Mameluków"
 flavor_hsn.2.d: "Egipt, niegdyś serce naszego imperium, od stuleci znajduje się pod kontrolą Mameluków. Byli oni kiedyś naszymi najwierniejszymi żołnierzami, lecz później stali się zdrajcami, którzy doprowadzili do upadku sułtanatu. Odzyskaliśmy już znaczną część ziem, które słusznie nam się należą, ale teraz musimy odpowiedzieć na trudne pytanie: co zrobić z Mamelukami? Czy możemy wybaczyć im zdradę, by ponownie służyli naszej dynastii, czy też powinniśmy raz na zawsze ich rozwiązać i polegać wyłącznie na regularnej armii?"
 flavor_hsn.2.a: "Musimy dążyć do pojednania."
 flavor_hsn.2.b: "Nie możemy im już ufać!"
 flavor_hsn.3.t: "Tytuł kalifa"
 flavor_hsn.3.d: "Przed wiekami wielki Salah ad-Din zmienił przynależność Egiptu, podporządkowując go Abbasydom. Była to ogromna zmiana, gdyż wcześniej Egiptem rządzili szyiccy Fatymidzi. Od czasu objęcia władzy nasi władcy uznawali autorytet kalifów Abbasydów, okazując im szacunek i wierność jako duchowym przywódcom islamu. Wraz z odrodzeniem naszego państwa staliśmy się znaczącą siłą w świecie islamu — zdobyliśmy potęgę militarną, umiejętność sprawnego rządzenia i podziw ludu za naszą lojalność. W miarę jak sułtanat rozrasta się i obejmuje najważniejsze miasta islamu, coraz silniejsza staje się pokusa wysunięcia własnych pretensji do kalifatu. Wielu doradza nam dalsze uznawanie autorytetu Abbasydów, lecz inni są przekonani, że przejęcie kalifatu otworzy drogę do bezprecedensowej wielkości. Musimy podjąć decyzję."
 flavor_hsn.3.a: "Uszanujemy autorytet Abbasydów!"
 flavor_hsn.3.b: "Sami przyjmiemy dziedzictwo Mahometa!"
 flavor_hsn.5.t: "Dziedzictwo Saladyna"
 flavor_hsn.5.d: "Opowieści o geniuszu wojskowym Saladyna rozbrzmiewają przez wieki. Jego kunszt taktyczny na polu bitwy i talent dyplomatyczny podczas trzeciej krucjaty na zawsze odcisnęły piętno na świecie. Jako sułtan Egiptu i Syrii Saladyn założył dynastię ajjubidzką i poprowadził ją do wielkich zwycięstw, w tym odzyskania Al-Kuds z rąk krzyżowców, kończąc niemal dziewięćdziesięcioletnią frankijską okupację. Nasza dynastia pragnie przywrócić dawną wielkość, a dziedzictwo Saladyna wzywa nas do działania. Jak powinniśmy je uczcić?"
 flavor_hsn.5.a: "Nasi doradcy muszą przestudiować jego taktykę."
 flavor_hsn.5.b: "Jego dziedzictwo będzie przewodnikiem dla naszych najlepszych generałów."
 flavor_hsn.5.c: "Mądrość Saladyna zainspiruje naszych władców."
 flavor_hsn.5.de: "Potrzebujemy teraz jego ducha, by nas poprowadził!"
 flavor_hsn.6.t: "Odbudowa mauzoleum Saladyna"
 flavor_hsn.6.d: "Gdy wielki Salah ad-Din zmarł, jego doczesne szczątki złożono w nowo wybudowanym mauzoleum obok meczetu Umajjadów w Damaszku. Przez stulecia miejsce to popadło w ruinę i nie jest już godnym miejscem spoczynku tak ważnej postaci. W naszym interesie leży odnowienie tego grobowca."
 flavor_hsn.6.a: "Inshallah, odbudujemy je."
 flavor_hsn.6.b: "Potrzebujemy zasobów gdzie indziej."
 flavor_hsn.7.t: "Umocnienie władzy w Egipcie"
 flavor_hsn.7.d: "Przed podbojem przez Mameluków Egipt był sercem naszego imperium. To właśnie tutaj Saladyn odebrał władzę Fatymidom i założył naszą wspaniałą dynastię, dlatego znaczenia tego regionu nie sposób przecenić. Kontrolujemy już najważniejsze miasta Egiptu, więc niektórzy sugerują przeniesienie tam stolicy, aby jeszcze bardziej umocnić nasze panowanie. W końcu [361.GetName] służyło nam jako stolica przez dziesięciolecia. Co powinniśmy zrobić?"
 flavor_hsn.7.a: "Przenieśmy siedzibę władzy do [361.GetName]."
 flavor_hsn.7.b: "[358.GetName] będzie znacznie lepszym wyborem."
 flavor_hsn.7.c: "[Root.Capital.GetName] dobrze nam służy."
