 hungarian_revolt_events.2.a: "Wyślijcie więcej żołnierzy!"
 hungarian_revolt_events.3.t: "Koniec rewolucji węgierskiej"
 hungarian_revolt_events.3.d: "[HungarianRevolutionEnd]"
 hungarian_revolt_events.3.a: "Kompromis przyniesie pokój."
 hungarian_revolt_events.3.b: "Zwycięstwo dla Korony [Root.Monarch.GetName]."
 hungarian_revolt_events.3.c: "Jeszcze tu wrócimy!"
 hungarian_revolt_events.3.dd: "Być może uda nam się wynegocjować kompromis na naszych warunkach…"
 hungarian_revolt_events.4.t: "Węgierska korona"
 hungarian_revolt_events.4.d: "Pomimo odziedziczenia przez nas ziem węgierskich, większość tamtejszej szlachty jest zafascynowana własnymi ziemiami. Decydują się ignorować [Root.Monarch.GetRulerGen] i zamiast tego skupiają się na własnych interesach, co zostało im przyznane przez Złotą Bullę z 1222 roku."
 hungarian_revolt_events.4.a: "Musimy znaleźć sposób na rozprawienie się z tymi szlachcicami..."
 hungarian_revolt_events.5.t: "Bunt w naszym państwie"
 hungarian_revolt_events.5.d: "Choć nie są bezpośrednio częścią nowej rewolucji, inne grupy etniczne w naszym państwie wykorzystały tę okazję, by zażądać od nas większej autonomii."
 hungarian_revolt_events.5.a: "Nigdy!"
 hungarian_revolt_events.5.b: "Spełnijmy ich żądania."
 hungarian_revolt_events.6.t: "Słaby cesarz"
 hungarian_revolt_events.6.d: "Trwający bunt w naszym państwie sprawia, że wielu książąt cesarskich uważa nas za słabego cesarza, podważając nasz autorytet."
 hungarian_revolt_events.6.a: "Pokażemy im, kto jest słaby."
 hungarian_revolt_events.7.t: "Sympatia dla rewolucji"
 hungarian_revolt_events.7.d: "Część naszego społeczeństwa uważa, że od zbyt dawna uciskamy mniejszości etniczne. Teraz, gdy nasze państwo ogarnął bunt, ludzie ci znaleźli okazję, by zaprotestować przeciwko naszym rządom."
 hungarian_revolt_events.7.a: "Niech ich diabli…"
 hungarian_revolt_events.8.t: "Węgrzy przyłączają się do państwa [From.GetName]"
 hungarian_revolt_events.8.d: "Choć Węgrzy podlegają [Root.Monarch.GetTitle] i [Root.GetAdjective] [Root.GovernmentName], ponownie zapragnęli wyrwać się spod naszej władzy. Utworzenie państwa [From.GetName] zapewniło Węgrom szeroki zakres przywilejów, nie do pomyślenia w naszym kraju. W rezultacie nasz niegdyś lojalny poddany postanowił się od nas odłączyć!"
 hungarian_revolt_events.8.a: "Musimy sprowadzić ich z powrotem, siłą!"
 hungarian_revolt_events.8.b: "Niech ich diabli…"
 hungarian_revolt_events.9.t: "Węgrzy dołączają do nas!"
 hungarian_revolt_events.9.d: "Po utworzeniu państwa [Root.GetName] Węgrzy ze wszystkich zakątków Europy postanowili przybyć do nas, by korzystać z nowo zdobytych przywilejów. Przybyli nie tylko ludzie – dołączyło do nas całe państwo, ponieważ [HUN.GetName] zrezygnowało ze służby pod władzą [From.GetName]. Niestety [From.Monarch.GetTitle] nie podziela tego entuzjazmu i wypowiedział nam wojnę, by odzyskać utracone ziemie. Świat może jednak obarczyć nas winą za ten konflikt…"
 hungarian_revolt_events.9.a: "Do broni!"
 hungarian_revolt_events.10.t: "Węgrzy dołączają do nas!"
 hungarian_revolt_events.10.d: "Po utworzeniu państwa [Root.GetName] Węgrzy ze wszystkich zakątków Europy postanowili przybyć do nas, by korzystać z nowo zdobytych przywilejów. Przybyli nie tylko ludzie – dołączyło do nas całe państwo, ponieważ [HUN.GetName] zrezygnowało ze służby pod władzą [From.GetName]."
 hungarian_revolt_events.10.a: "Miła niespodzianka!"
 HAB_EVERY_HUNGARIAN_PROVINCE_GAINS_35_AUTONOMY: "Wszystkie §Ywęgierskie§! prowincje narodowe zyskają §R35%§! autonomii."
 HAB_ALL_HUNGARIAN_PROVINCES_LOSE_AUTONOMY_AND_GAIN_THE_FOLLOWING_MODIFIER: "Wszystkie §Ywęgierskie§! prowincje narodowe stracą §G50%§! autonomii i uzyskają następujące premie:"
 HungarianRevolutionCompromise: "Nadszedł koniec rewolucji węgierskiej. Żadna ze stron nie zdołała zwyciężyć, więc przywódcy obu obozów zawarli kompromis. Zamiast niepodległego państwa węgierskiego lub zwycięstwa austriackiej Korony najlepszym rozwiązaniem okazało się utworzenie Austro-Węgier. Węgierska szlachta otrzyma teraz wyższą pozycję w państwie [Root.GetName]."
 HungarianRevolutionVictory: "Nadszedł koniec rewolucji węgierskiej. Pomimo bohaterskiego oporu Węgrów zwyciężyła Korona państwa [Root.GetName]. Los Węgier znajduje się teraz w jej rękach."
 HungarianRevolutionDefeat: "Nadszedł koniec rewolucji węgierskiej. Węgierscy rewolucjoniści zwyciężyli w tym konflikcie. Pomimo naszych wysiłków, by utrzymać ich w ryzach, zdołali utworzyć niepodległe państwo węgierskie. Znaczna część świata uważa to za upokorzenie dla państwa [Root.GetName]."
 german_revolt: "Rewolucja austriacka"
 GERMAN_REVOLUTION_CRUSHED_AND_HAS_1_STABILITY: "W naszym państwie nie ma armii §Yrebeliantów§! ani okupowanych prowincji, a nasza stabilność wynosi co najmniej §Y1§!."
 GERMAN_REVOLUTION_VICTORY_OF_THE_REVOLUTION: "§YRewolucja§! zakończyła się sukcesem, a suwerenność §Yaustriacka§! została przywrócona."
 HUN_ALL_AUSTRIAN_PROVINCES_GAIN_THE_FOLLOWING: "Każda prowincja z §Yaustriackim§! rdzeniem otrzyma następujący efekt:"
 hun_austrian_privileges: "Przywileje austriackie"
 hun_austrian_privileges_desc: "Ta prowincja korzysta ze zwiększonego zakresu przywilejów nadanych przez koronę węgierską."
 HUN_END_DISASTER: "Katastrofa §YRewolucja austriacka§! dobiegnie końca. Nasze państwo zmieni się w §Y[AUH.GetName]§!, a §Yaustriackie przywileje§! zostaną nam narzucone."
 austrian_revolt_events.1.t: "Rewolucja austriacka"
 austrian_revolt_events.1.d: "W ostatnich latach Korona austriacka utraciła znaczną część swojej autonomii i praw na rzecz państwa [Root.GetName]. Rozgniewało to wielu mieszkańców, w tym szlachtę, której przywileje ograniczono niemal do zera. Teraz, gdy Austriacy pragną odzyskać należną im pozycję w państwie [Root.GetName], chwycili za broń."
 austrian_revolt_events.1.a: "Niech ich diabli!"
 austrian_revolt_events.2.t: "Austriackie powstania"
 austrian_revolt_events.2.d: "Płomienie rewolucji rozprzestrzeniają się po Austrii. Wielu szlachciców, kupców i chłopów przyłącza się do buntu, by podważyć nasze panowanie w tym kraju."
 austrian_revolt_events.2.a: "Wyślijcie więcej żołnierzy!"
 austrian_revolt_events.3.t: "Koniec rewolucji austriackiej"
 austrian_revolt_events.3.d: "[AustrianRevolutionEnd]"
 austrian_revolt_events.3.a: "Kompromis przyniesie pokój."
 austrian_revolt_events.3.b: "Zwycięstwo dla Korony [Root.Monarch.GetName]."
 austrian_revolt_events.3.c: "Jeszcze tu wrócimy!"
 austrian_revolt_events.3.dd: "Być może uda nam się wynegocjować kompromis na naszych warunkach…"
 austrian_revolt_events.8.t: "Austriacy przyłączają się do państwa [From.GetName]"
 austrian_revolt_events.8.d: "Choć Austriacy podlegają [Root.Monarch.GetTitle] i [Root.GetAdjective] [Root.GovernmentName], ponownie zapragnęli wyrwać się spod naszej władzy. Utworzenie państwa [From.GetName] zapewniło im szeroki zakres przywilejów, nie do pomyślenia w naszym kraju. W rezultacie nasz niegdyś lojalny poddany postanowił się od nas odłączyć!"
 austrian_revolt_events.8.a: "Musimy sprowadzić ich z powrotem, siłą!"
 austrian_revolt_events.8.b: "Niech ich diabli…"
 austrian_revolt_events.9.t: "Austriacy dołączają do nas!"
 austrian_revolt_events.9.d: "Po utworzeniu państwa [Root.GetName] Austriacy ze wszystkich zakątków Europy postanowili przybyć do nas, by korzystać z nowo zdobytych przywilejów. Przybyli nie tylko ludzie – dołączyło do nas całe państwo, ponieważ [HAB.GetName] zrezygnowało ze służby pod władzą [From.GetName]. Niestety [From.Monarch.GetTitle] nie podziela tego entuzjazmu i wypowiedział nam wojnę, by odzyskać utracone ziemie. Świat może jednak obarczyć nas winą za ten konflikt…"
