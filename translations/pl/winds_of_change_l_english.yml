 mechanic_GER_unlock_integrated_vassal_yes: "Umożliwia przekształcanie §Ywasali§! w poddanych typu §YZintegrowany wasal§! za pomocą działania dyplomatycznego „§YWłącz wasala do administracji§!”. §YZintegrowani wasale§! są o §G-25,0%§! tańsi w aneksji dyplomatycznej, ale zmniejszają naszą zdolność administracyjną o §R-100,00§!."
 incorporated_vassal: "Zintegrowany wasal"
 incorporated_vassal_long_desc: "Zintegrowany wasal musi podążać za swoim suwerenem na wojnę, nie może podejmować niektórych działań dyplomatycznych i przekazuje suwerenowi część swoich dochodów. Jest łatwiejszy do aneksji dyplomatycznej, ale zmniejsza też zdolność administracyjną suwerena."
