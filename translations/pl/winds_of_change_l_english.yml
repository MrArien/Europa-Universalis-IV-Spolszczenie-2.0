 establish_american_frontier_desc: "Ameryki są kontrolowane przez wiele różnych plemion, z których część nie jest zorganizowana i łatwo ją podbić poprzez kolonizację. Ustanówmy więcej amerykańskich pograniczy, aby rozwinąć nasze państwo."
