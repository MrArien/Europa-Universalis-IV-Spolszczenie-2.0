 flavor_ita.1.t: "Roszczenie do rzymskiego dziedzictwa"
 flavor_ita.1.d: "Czasy się zmieniły, lecz wciąż wielu nawołuje do powrotu do przeszłości. Nasze zjednoczone państwo dopiero wyrasta na wielką potęgę. Jako bezpośredni spadkobiercy Rzymian moglibyśmy jednak przejąć ich dziedzictwo i dążyć do odbudowy imperium. Tak jawny przejaw imperialistycznych ambicji nie przyniesie nam jednak korzyści na arenie międzynarodowej."
 flavor_ita.1.a: "Jesteśmy prawdziwymi dziedzicami Rzymu!"
 flavor_ita.1.b: "Obierzmy bardziej dyskretną drogę."
 flavor_ita.2.t: "Przyszłość polityki gospodarczej"
 flavor_ita.2.d: "Nasze państwo składa się z wielu prowincji odziedziczonych po krajach, które wchłonęliśmy podczas procesu zjednoczenia. Każde z nich miało własnych ekonomistów i odrębne poglądy na politykę fiskalną. Najpowszechniejsze pozostają jednak tradycyjny merkantylizm oraz dość popularna koncepcja liberalizmu gospodarczego stosowana przez Camilla Bensa, hrabiego Cavour."
 flavor_ita.2.a: "Zatrudnijmy Cavoura!"
 flavor_ita.2.b: "Merkantylizm został już sprawdzony w praktyce."
 flavor_ita.3.t: "Połączenie galery i galeonu"
 flavor_ita.3.d: "Galeas to osiągnięcie inżynierii morskiej, opracowane na potrzeby śródziemnomorskich republik kupieckich, a zwłaszcza Wenecji. Okręty te łączą cechy galery i galeonu, a ich przeznaczeniem jest walka na morzu. Można je jednak przystosować również do współczesnych potrzeb. Zbierzmy się i zdecydujmy o ich przyszłości."
 flavor_ita.3.a: "Powinny służyć jako transportowce!"
 flavor_ita.3.b: "Nasza flota potrzebuje czegoś więcej."
 flavor_ita.3.c: "Nie są wystarczająco wytrzymałe."
 flavor_ita.4.t: "Ewolucja gubernatorstw wojskowych"
 flavor_ita.4.d: "W miarę jak mierzymy się z wielkimi mocarstwami i zajmujemy rozległe terytoria, zaczęliśmy eksperymentować ze starą strategią powierzania nowo podbitych ziem administracji naszych generałów. Może to zmotywować wojskowych i odciążyć administrację państwową."
 flavor_ita.4.a: "Generałowie powinni rządzić twardą ręką."
 flavor_ita.4.b: "Przyznajmy im większe uprawnienia wykonawcze."
 flavor_ita.4.c: "Potrzebujemy generałów na polu bitwy!"
 flavor_ita.5.t: "Wieczny Rzym"
 flavor_ita.5.d: "Wielu rościło sobie prawo do tego tytułu i próbowało dokonać tego, czemu inni nie podołali, lecz nikomu się nie udało. Dla wielu Cesarstwo Rzymskie było jedynie odległym celem, do którego można dążyć, ale którego nigdy nie da się osiągnąć. Udowodniliśmy jednak, że nie musi tak być. Przejmując inicjatywę, krwią i ciężką pracą odbudowaliśmy imperium. Będziemy szczycić się tym osiągnięciem przez całą wieczność, ponieważ Rzym jest niezwyciężony."
 flavor_ita.5.a: "Chwała Rzymowi!"
 flavor_ita.6.t: "Włoska armia"
 flavor_ita.6.d: "Włochy były niegdyś podzielone między dziesiątki książąt, z których każdy miał własną świtę i armię. Jeśli jednak istniał czynnik jednoczący, byli nim kondotierzy — najemnicy zatrudniani przez bogate włoskie miasta do wykonywania ich rozkazów. Możemy oprzeć na nich naszą obronę albo przyjąć nowocześniejsze metody prowadzenia wojny."
 flavor_ita.6.a: "Przystosujmy kondotierów do nowych czasów!"
 flavor_ita.6.b: "Skupmy się na sile ognia."
 flavor_ita.7.t: "Wezwanie do broni!"
 flavor_ita.7.d: "Dotarła do nas wieść, że wypowiedziano wojnę najdostojniejszemu cesarzowi, próbując doprowadzić do upadku Cesarstwa. Jako najczcigodniejsi elektorzy i strażnicy dawnych obyczajów jesteśmy żywotnie zainteresowani wsparciem sprawy cesarskiej i zapobieżeniem tej katastrofie. Ta wojna już teraz zapowiada się na jedno z najważniejszych wydarzeń tego stulecia."
 flavor_ita.7.a: "Musimy bronić Cesarstwa!"
 flavor_ita.7.b: "To pułapka! Podstęp mający rozwiązać Cesarstwo!"
 flavor_ita.9.t: "Włoskie wino"
 flavor_ita.9.d: "Ścisła kontrola nad produkcją najlepszego wina zapewniła nam wyjątkową pozycję. Możemy w pełni wykorzystać popyt na nasze wino i właśnie to zamierzamy zrobić. Takie działania z pewnością wpłyną na ceny wina na całym świecie."
 flavor_ita.9.a: "Spróbuj raz, a będziesz wracać na zawsze."
 flavor_ita.10.t: "Szlak przypraw"
 flavor_ita.10.d: "Podupadające szlaki handlowe z Indii Wschodnich do Wenecji ponownie rozkwitły. Jeśli wsiądziesz na statek kupiecki w Aceh lub Malakce, istnieje duża szansa, że przez Kanał Sueski dotrzesz ostatecznie do Wenecji."
 flavor_ita.10.a: "Wszystkie przyprawy należą do nas!"
 flavor_ita.11.t: "Za Słupami Herkulesa"
 flavor_ita.11.d: "Od odkrycia Ameryki przez włoskiego żeglarza Krzysztofa Kolumba minęły już dziesięciolecia. Kontynent, pełen wolnych ziem gotowych do zajęcia, stał się przedmiotem zainteresowania władców Francji, Brytanii i Iberii. Od tego czasu wielu monarchów próbowało zdobywać terytoria w Ameryce, aby kierować ich bogactwa do własnych portów. Najwyższy czas pójść w ich ślady lub podjąć działania, które skierują ich statki do naszych portów."
 flavor_ita.11.a: "Załóżmy osady na niezamieszkanych ziemiach!"
 flavor_ita.11.b: "Zajmijmy obce kolonie."
 flavor_ita.12.t: "Włoski Nowy Świat"
 flavor_ita.12.d: "Nowy Świat został odkryty przez Krzysztofa Kolumba. Choć ziemie te mogły zostać zajęte w imieniu innych państw, odkrycia dokonał Włoch, a wydarzenie to zapoczątkowało naszą obecną dominację w Nowym Świecie. Dziś jesteśmy jednym z głównych mocarstw władających kontynentami amerykańskimi."
 flavor_ita.12.a: "Doskonale."
 JHC_ITA_prosperity_for_all_title: "Dobrobyt dla wszystkich"
 JHC_ITA_prosperity_for_all_desc: "Nasze wielkie zjednoczenie nie może ograniczać się wyłącznie do polityki. Musimy dołożyć wszelkich starań, by zapewnić wszystkim Włochom bezpieczeństwo i siłę gospodarczą, tak abyśmy wszyscy mogli się bogacić."
 JHC_ITA_develop_the_south_title: "Rozwój południa"
 JHC_ITA_develop_the_south_desc: "Sama stabilność nie wystarczy, by poprawić los wszystkich naszych mieszkańców. Szczególnie południowe Włochy od wieków zmagają się z poważnymi trudnościami. Jeśli chcemy, by wszyscy Włosi byli zadowoleni z naszych rządów, musimy poświęcić szczególną uwagę Mezzogiorno."
 JHC_ITA_continue_the_renaissance_title: "Kontynuacja renesansu"
 JHC_ITA_continue_the_renaissance_desc: "Włochy od dawna są kolebką myśli intelektualnej i osiągnięć artystycznych. Powinniśmy dołożyć wszelkich starań, by wspierać te wspaniałe tradycje i rozbudowywać ośrodki edukacyjne, które tak wiele zrobiły dla szerzenia nowych idei oraz inspirowania kolejnych pokoleń myślicieli i artystów."
 JHC_ITA_italia_transalpina_title: "Italia Transalpina"
 JHC_ITA_italia_transalpina_desc: "Prowansja i Sabaudia mają historyczne związki z naszym wielkim państwem. Powinniśmy zrobić wszystko, co w naszej mocy, by je umocnić — między innymi poprzez podbój tych ziem."
 JHC_ITA_the_seven_provinces_title: "Siedem prowincji"
 JHC_ITA_the_seven_provinces_desc: "Oksytańczycy z południowej Francji od dawna utrzymują bliskie związki z Włochami, wzajemnie oddziałując na swoją kulturę, myśl i społeczeństwa. Powinniśmy pielęgnować te więzi i włączyć południową Francję do naszego państwa."
 JHC_ITA_the_gallic_wars_title: "Wojny galijskie"
 JHC_ITA_the_gallic_wars_desc: "Przed wiekami nasi przodkowie wyruszyli na podbój Galii, niosąc jej cywilizację. Prawdę mówiąc, najwyższy czas, byśmy zrobili to ponownie."
 JHC_ITA_give_him_back_his_legions_title: "Zwróćmy mu legiony"
 JHC_ITA_give_him_back_his_legions_desc: "Dotarliśmy głęboko na dawne ziemie Galii, lecz nasze osiągnięcia wciąż przyćmiewają podboje wielkiego Juliusza Cezara. Musimy dokonać czegoś, co nie udało się starożytnym Rzymianom: pokonać Germanów w Lesie Teutoburskim!"
 JHC_ITA_alpine_defenses_title: "Obrona Alp"
 JHC_ITA_alpine_defenses_desc: "Naturalną północną granicą Włoch są Alpy, lecz same góry nie powstrzymają najeźdźców. Musimy zadbać o odpowiednie umocnienia, które uniemożliwią wrogim armiom przedostanie się na nasze ziemie przez alpejskie przełęcze."
 JHC_ITA_take_the_littoral_title: "Zajęcie wybrzeża"
 JHC_ITA_take_the_littoral_desc: "Włochy kontrolują wiele portów nad Adriatykiem, lecz liczne inne państwa również posiadają porty nad tym wielkim morzem. Rozsądnie będzie zabezpieczyć całe wybrzeże i nie dopuścić, by obcy naruszali nasze wody."
 JHC_ITA_redeem_tirolo_title: "Odzyskanie Tyrolu"
 JHC_ITA_redeem_tirolo_desc: "Tyrol, jak nazywają go Niemcy, to rozległy region alpejski, który służył za skrzyżowanie szlaków i bastion wielu wielkich imperiów, w tym Rzymu. W tamtejszych górach, zwłaszcza na południu, wciąż mieszkają nasi rodacy. Zabezpieczenie tych ziem pozwoliłoby nam przyłączyć kolejnych Włochów i stworzyć silną linię obrony na północy."
 JHC_ITA_humiliate_austria_title: "Upokorzenie Austrii"
 JHC_ITA_humiliate_austria_desc: "Austriacy od dawna są cierniem w naszym boku i wciąż udają, że są od nas lepsi. Ośmielili się nawet ogłosić cesarzami „rzymskimi”! Czas pokazać im, że nie można z nami igrać."
 JHC_ITA_a_real_roman_empire_title: "Prawdziwe Cesarstwo Rzymskie"
 JHC_ITA_a_real_roman_empire_desc: "Nasze posiadłości rozciągają się na całym kontynencie, a nasi rywale zostali upokorzeni. Nadszedł czas, byśmy uznali się za jedynych prawowitych dziedziców wielkości Rzymu."
 JHC_ITA_spagna_tarraconense_title: "Hiszpania Tarrakońska"
 JHC_ITA_spagna_tarraconense_desc: "Nie możemy w pełni panować nad Morzem Śródziemnym, dopóki wciąż obecni są na nim intruzi tacy jak Hiszpanie. Musimy umocnić naszą władzę na wschodnim wybrzeżu Półwyspu Iberyjskiego i powstrzymać Hiszpanów przed naruszaniem naszych wód."
 JHC_ITA_hispaniae_title: "Hispania"
 JHC_ITA_hispaniae_desc: "Słabi Hiszpanie wciąż upierają się przy zacofanym życiu z dala od naszych dobroczynnych rządów. Musimy wyciągnąć do nich rękę i pomóc im rozkwitnąć pod światłym przewodnictwem Włoch."
 JHC_ITA_complete_the_risorgimento_title: "Dokończenie risorgimenta"
 JHC_ITA_complete_the_risorgimento_desc: "Choć udało nam się stworzyć państwo włoskie, nasza praca jeszcze się nie skończyła! Wciąż żyją Włosi, którzy pragną ponownego zjednoczenia ze swoimi rodakami. Musimy wyzwolić cały nasz naród spod obcego panowania!"
 JHC_ITA_answer_the_roman_question_title: "Kwestia rzymska"
 JHC_ITA_answer_the_roman_question_desc: "Naród włoski i papiestwo znajdują się w niezręcznym położeniu. Tradycja i historia dają papiestwu podstawy do roszczeń wobec rozległych obszarów środkowych Włoch. Z kolei względy ludnościowe i geograficzne przemawiają za tym, by Włochy władały całym Półwyspem Apenińskim. Napięcia między tymi dwiema instytucjami będą trwać, dopóki nie uda się osiągnąć trwalszego porozumienia."
 JHC_ITA_a_place_among_the_great_powers_title: "Miejsce wśród wielkich mocarstw"
 JHC_ITA_a_place_among_the_great_powers_desc: "Nasz prestiż i potęga niewiele znaczą, jeśli sąsiedzi ich nie uznają. Musimy zapewnić sobie miejsce wśród wielkich mocarstw świata i sprawić, by traktowały nas jak równych sobie pod względem pozycji i siły."
 JHC_ITA_cross_the_pindus_title: "Przekroczenie Pindosu"
 JHC_ITA_cross_the_pindus_desc: "Nasze panowanie nad Adriatykiem nie będzie bezpieczne, dopóki na jego zapleczu rozciąga się rozległy, ogarnięty konfliktami obszar. Pokój może tam zapanować wyłącznie pod naszymi rządami, dlatego musimy wyruszyć i objąć te wyniszczone wojną ziemie naszą sprawną administracją."
 JHC_ITA_reclaim_our_latin_heritage_title: "Odzyskanie łacińskiego dziedzictwa"
 JHC_ITA_reclaim_our_latin_heritage_desc: "Przed wiekami nasi przodkowie próbowali zażegnać wielką schizmę i przejąć kontrolę nad sercem świata wschodniorzymskiego. Przez pewien czas im się to udawało, lecz stopniowo ich potęga osłabła, a posiadłości upadły. Czas spróbować ponownie."
 JHC_ITA_anatolian_frontier_title: "Granica anatolijska"
 JHC_ITA_anatolian_frontier_desc: "Nasze wschodnie posiadłości nie będą bezpieczne, dopóki Turcy zagrażają nam w Anatolii. Musimy ustanowić nową granicę w Azji Mniejszej i podporządkować sobie tych, którzy mogliby zagrozić naszym ziemiom."
 JHC_ITA_a_worthy_navy_title: "Flota godna naszego państwa"
 JHC_ITA_a_worthy_navy_desc: "Włochy są rozległym półwyspem otoczonym wielkimi akwenami i licznymi potęgami morskimi. Bez odpowiednio silnej floty bylibyśmy bezbronni wobec blokad morskich i inwazji. Musimy zbudować flotę, która obroni nasze ziemie i naszą chwałę."
 JHC_ITA_africa_proconsulare_title: "Afryka Prokonsularna"
 JHC_ITA_africa_proconsulare_desc: "Naszej kontroli nad Morzem Śródziemnym zagrażają berberyjscy piraci i inni łotrzy z Afryki Północnej. Jeśli chcemy chronić nasze ziemie, musimy zniszczyć kryjówki piratów oraz północnoafrykańskie rządy, które udzielają im ochrony."
 JHC_ITA_befriend_ethiopia_title: "Zawarcie przyjaźni z Etiopią"
 JHC_ITA_befriend_ethiopia_desc: "Starożytne legendy opowiadają o królestwie Księdza Jana — chrześcijańskiego władcy żyjącego za ziemiami pogan. Z czasem dowiedzieliśmy się więcej. Sam Marco Polo wspominał o wielkim chrześcijańskim królestwie Etiopii, a nasze kontakty z tym afrykańskim krajem od tamtej pory stale się rozwijają. W interesie przyszłych pokoleń, a także z powodów strategicznych, powinniśmy nawiązać stosunki z Etiopczykami i zbudować więzi przyjaźni oraz wzajemnej ochrony."
 JHC_ITA_befriend_ethiopia_capital_tt: "Stolica znajduje się w regionie §YRogu Afryki§!"
 JHC_ITA_invade_egypt_title: "Inwazja na Egipt"
 JHC_ITA_invade_egypt_desc: "Nasze posiadłości mogą rozciągać się daleko, lecz czcigodny Egipt wciąż pozostaje poza naszym zasięgiem. Te bogate ziemie stanowiłyby bramę na Wschód oraz do lukratywnego handlu Azji i Afryki."
 JHC_ITA_terra_santa_title: "Terra Santa"
 JHC_ITA_terra_santa_desc: "Jako wielkie państwo mamy uroczysty i sprawiedliwy obowiązek ochrony Ziemi Świętej. Opatrzność wzywa nas do ustanowienia nowego porządku w Jerozolimie i objęcia całego Lewantu naszym pobożnym zarządem."
 imperial_prince: "Książę Rzeszy"
 GER_break_the_habsburgs_title: "[Root.GetBreakTheHabsburgsTitle]"
 GER_break_the_habsburgs_desc: "[Root.GetBreakTheHabsburgsDesc]"
 GER_break_the_habsburgs_generic_title: "Złamać potęgę Habsburgów"
 GER_break_the_habsburgs_generic_desc: "Habsburgowie tradycyjnie dzierżyli godność cesarzy Świętego Cesarstwa Rzymskiego i nadal pozostają największą przeszkodą na drodze do zjednoczenia Niemiec. Musimy zniweczyć ich sprzeciw."
 GER_break_the_habsburgs_HAB_title: "Posiadłości Habsburgów"
 GER_break_the_habsburgs_HAB_desc: "Posiadłości Habsburgów od stuleci stanowią polityczne centrum Świętego Cesarstwa Rzymskiego. Włączenie tych ziem do naszego państwa wzmocni jego legitymację."
 GER_silesia_title: "Uprzemysłowienie Śląska"
 GER_silesia_desc: "Na naszych wschodnich rubieżach leży Śląsk — ziemia silnie ukształtowana przez niemieckich osadników, bogata w złoża węgla, zwłaszcza na wschodzie. Przekształcenie go w przemysłowe zaplecze naszego państwa ma kluczowe znaczenie."
 GER_secure_north_title: "Zabezpieczenie północy"
 GER_secure_north_desc: "Musimy połączyć obie części naszego potencjału morskiego. Jednym ze sposobów osiągnięcia tego celu jest uzyskanie gwarancji od państw skandynawskich."
 GER_german_industry_title: "Zjednoczony przemysł"
 GER_german_industry_desc: "Powinniśmy zadbać o wzajemne połączenie i rozwój naszych ośrodków przemysłowych. Dzięki temu staniemy się przemysłowym gigantem i zdominujemy europejski handel."
 GER_zollverein_title: "Zollverein"
 GER_zollverein_desc: "Podatki i cła nakładane między bratnimi państwami jedynie hamują wspólny rozwój. Utwórzmy unię celną, aby zintegrować gospodarczo bratnie narody z naszym państwem."
 GER_kiel_canal_title: "Budowa Kanału Kilońskiego"
 GER_kiel_canal_desc: "Poleganie na cieśninie Sund podczas żeglugi między Morzem Bałtyckim a Północnym byłoby błędem. Powinniśmy zbudować kanał łączący oba akweny, aby uniknąć konieczności wybierania długiej drogi wokół Półwyspu Jutlandzkiego."
 GER_wilhelmshaven_title: "Założenie Wilhelmshaven"
 GER_wilhelmshaven_desc: "Wschodząca potęga morska potrzebuje strategicznie położonego portu, w którym jej okręty będą bezpieczne. Wybraliśmy już miejsce pod tę przystań i położyliśmy kamień węgielny. Teraz musimy ją rozbudować."
 GER_place_in_the_sun_title: "Zaufaj sąsiadowi"
 GER_place_in_the_sun_desc: "Naród niemiecki jest podzielony przez drobne spory. Nie możemy pozwolić, by podziały zawładnęły naszym krajem. Musimy się zjednoczyć, aby wspólnie stawić czoła wyzwaniom przyszłości."
 GER_diplomatic_revolution_title: "Rewolucja dyplomatyczna"
 GER_diplomatic_revolution_desc: "W samym sercu Europy pojawił się nowy gracz. Nadszedł czas, by inne państwa zaczęły poważnie uwzględniać nas w swoich planach — nie jesteśmy już pomniejszą potęgą."
 GER_may_build_canal_regardless_of_tech: "Będziemy mogli zbudować §YKanał Kiloński§! niezależnie od poziomu naszej §Ytechnologii administracyjnej§!."
 GER_kiel_canal_will_now_give_better_traders_and_merchants: "Wielki projekt „§YKanał Kiloński§!” na poziomie §YWspaniałym§! będzie teraz zapewniał §G+1,00§! kupca."
 GER_3_most_developed_provinces: "§G3§! najbardziej rozwinięte prowincje:"
 GER_enable_the_customs_union_estate_privilege: "Odblokowuje przywilej stanowy „§YUnia celna§!” dla §Y[Root.GetBurghersName]§!, zapewniający §G-5,0%§! kosztu aneksji dyplomatycznej, §G+0,25§! miesięcznej jedności kulturowej oraz §G+33,0%§! modyfikatora siły handlowej prowincji w naszych §Ypaństwach wasalnych§!."
 GER_our_vassals_will_gain: "Nasze §Ypaństwa wasalne§! otrzymają §G+33,0%§! modyfikatora siły handlowej prowincji."
 GER_a_turn_towards_mercantilism_privilege: "Odblokowuje przywilej stanowy „§YWspieranie merkantylizmu§!” dla §Y[Root.GetBurghersName]§!, zapewniający premie zależne od naszego poziomu §Ymerkantylizmu§!:\\n\\nPrzy co najmniej §M60§! merkantylizmu:\\nSiła handlowa okrętów: §G+20,0%§!\\nPrzy co najmniej §M75§! merkantylizmu:\\nProdukcja towarów: §G+0,05§!\\nPrzy co najmniej §M90§! merkantylizmu:\\nModyfikator produkcji towarów: §G+5,0%§!"
 estate_burghers_GER_turn_towards_mercantilism: "Wspieranie merkantylizmu"
 estate_burghers_GER_turn_towards_mercantilism_desc: "Musimy stworzyć samowystarczalną gospodarkę. Powinniśmy ograniczyć zależność od zagranicznych towarów i zwiększyć eksport własnych produktów."
 estate_burghers_GER_customs_union: "Unia celna"
 estate_burghers_GER_customs_union_desc: "Wolna od ceł wymiana handlowa to być może największy dar, jaki może otrzymać kupiec. Pozwólmy rozwijać się naszym gospodarkom."
 estate_nobles_GER_diploma_andreanum: "Odnowienie Dyplomu Andreanum"
 estate_nobles_GER_diploma_andreanum_desc: "Dyplom Andreanum umożliwił Niemcom kolonizację Siedmiogrodu. Jego odnowiona wersja pozwoli nam jeszcze bardziej rozszerzyć nasze terytorium."
