 empire_of_trebizond: "Cesarstwo Trapezuntu"
 empire_of_trebizond_desc: "Choć było cesarstwem jedynie z nazwy, Trapezunt powstał po złupieniu Konstantynopola przez krzyżowców podczas czwartej krucjaty. Od tamtej pory Komnenowie starali się przetrwać i rozwijać pośród morza państw muzułmańskich. Aby zapewnić państwu przetrwanie, władcy Trapezuntu ustanowili tradycję zawierania małżeństw z muzułmańskimi dynastiami."
