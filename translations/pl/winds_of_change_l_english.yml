 YUA_EXPLAIN_NADAAM_FESTIVAL: "Otrzymamy różne premie w zależności od tego, na czym postanowimy skupić obchody, lecz przez pewien czas nie będziemy mogli zorganizować kolejnego święta."
 naadam_festival_cooldown: "Oczekiwanie na kolejne święto Naadam"
 moghulistan_caucasia_title: "Przeprawa przez Kaukaz"
 moghulistan_caucasia_desc: "Góry Kaukazu stanowiły naturalną granicę dla wielu wielkich imperiów, lecz nasza ekspansja nie zna ograniczeń. Podporządkujemy sobie mieszkańców gór i ruszymy ku bogatym ziemiom leżącym za nimi."
 flavor_yua.1.t: "Święto Naadam"
 flavor_yua.1.d: "Święto Naadam w imperium Yuan było wielkim tradycyjnym wydarzeniem obchodzonym przez lud mongolski. Obejmowało zawody w „Trzech męskich grach”: wyścigi konne, łucznictwo i zapasy. Konkurencje te ukazywały umiejętności i waleczność mongolskich wojowników, a często przyglądali im się cesarz i arystokracja. W programie święta znajdowały się również występy kulturalne, uczty i różnorodne rozrywki, dzięki czemu stanowiło ono ważny element życia społecznego i kulturalnego imperium."
 flavor_yua.1.a: "Tym razem zahartujmy naszych wojowników."
 flavor_yua.1.b: "Zorganizujmy wielkie święto, by pokazać wszystkim nasze bogactwo."
 flavor_yua.1.c: "Wykorzystajmy tę okazję, by powiększyć nasze szeregi."
