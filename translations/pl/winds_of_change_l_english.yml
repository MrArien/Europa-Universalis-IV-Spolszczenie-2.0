 flavor_may.8.t: "Upadek Mayapan"
 flavor_may.8.d: "Liga Mayapan dobiegła końca. Wewnętrzne podziały doprowadziły do tego, że wódz Tutul Xiu postanowił wreszcie pomścić krzywdy sprzed dziesięcioleci, mordując wszystkich Cocome w Mayapan. Doprowadziło to do upadku konfederacji, a następnie do jej rozpadu. Obecnie niezależne cahob planują rozszerzyć swoje kuchkabale poprzez zdobywanie nowych batob."
 flavor_may.8.a: "Wykorzystajmy okazję."
 flavor_may.8.b: "Zarabiajmy na ich wojnie."
 flavor_may.8.c: "Zignorujmy ten rozwój wydarzeń."
 flavor_may.9.t: "Przedłużenie monopolu na kakao"
 flavor_may.9.d: "Wygasł monopol na handel kakao, który przyznaliśmy stanowi [Root.GetClergyName]. Możemy teraz ponownie przejąć dochody z handlu tym towarem. Duchowieństwo pragnie jednak zachować swoje przywileje i oferuje nam jednorazową zapłatę w zamian za przedłużenie monopolu o kolejne 10 lat."
 flavor_may.10.t: "Przyszłość Konfederacji"
 flavor_may.10.d: "Podobnie jak w innych krainach, na Jukatanie i wyżynach Majów istnieje wiele różnych form rządów. Od boskich królów-kapłanów, którzy niegdyś władali wielkimi miastami, dziś w większości opuszczonymi, na południowych nizinach Majów, przez konfederację dynastii w Mayapan, aż po oligarchiczne rządy w Ah Canul – wypróbowano już wiele ustrojów."
 flavor_may.10.a: "Musimy zreformować kilka aspektów państwa."
 flavor_may.10.b: "Powróćmy do rządów kapłańskich królów."
 flavor_may.10.c: "Zainspirujmy się kuchkabalem Ah Canul."
 flavor_may.10.e: "Wzmocnijmy kapłanów!"
 flavor_may.10.f: "Nie potrzebujemy zmian."
 flavor_may.11.t: "Kupcy ppolomo'ob"
 flavor_may.11.d: "Kupcy, zwani ppolomo'ob, przeżywają obecnie rozkwit pod naszym panowaniem. Dzięki odpowiedniej polityce możemy ich dotować, by podejmowali przedsięwzięcia zagraniczne, albo skupić się na doskonaleniu sektora opartego na produkcji. Każde z tych rozwiązań przyniesie nam inne korzyści."
 flavor_may.11.a: "Kupcy ppolomo'ob powinni reprezentować nasze państwo."
 flavor_may.11.b: "Skupmy się na produkcji."
 maya_confederation_reform: "Konfederacja Majów"
 maya_confederation_reform_desc: "Liga wielu miast-państw Majów, rządzona przez jednego zwierzchniego władcę. Jej ustrój wzorowany jest na dawnej Lidze Mayapan."
 divine_kingship_reform: "Boska władza królewska"
 divine_kingship_reform_desc: "W zamierzchłych czasach wieloma miastami-państwami rządzili królowie, którzy byli zarazem kapłanami i sprawowali władzę zgodnie z wolą bogów. Nadeszły czasy powrotu do tych tradycji, a granice między kapłaństwem i dynastią ponownie się zacierają."
 mechanic_MAY_free_diplo_annexation_yes: "Aneksja dyplomatyczna nie będzie już powodować kary do §Yreputacji dyplomatycznej§!."
 mechanic_MAY_max_abso_buff_yes: "Przywilej stanu „§YNadzór duchowieństwa§!” będzie teraz zapewniać §G+15,0%§! maksymalnego efektu absolutyzmu."
 MAY_defeat_of_tenochtitlan: "Pokonanie Tenochtitlan"
 estate_almahen: "Almeheno'ob"
 estate_ppolom: "Ppolomo'ob"
 SUN_disease_title: "Walka z chorobami"
 SUN_disease_desc: "Przybycie cudzoziemców na nasze wybrzeża wywołało poważny kryzys w naszym społeczeństwie. Główną przyczyną jest mnogość nowych chorób, które ze sobą przynieśli i które doprowadziły do śmierci znacznej części naszej ludności. Musimy znaleźć sposób, by pokonać tego nowego wroga."
 SUN_panama_canal_title: "Połączenie dwóch oceanów"
 SUN_panama_canal_desc: "Kontynent amerykański oddziela Ocean Spokojny od Atlantyckiego. Choć może to być korzystne, gdy chcemy odizolować od siebie te dwie części świata, doprowadziło do podziału naszej floty na dwie części. Jeśli rozpoczniemy przekopywanie przesmyku panamskiego, być może otworzymy nową drogę, którą nasze okręty będą mogły przepływać między oceanami."
 SUN_spain_title: "Iberyjskie wiatraki"
 SUN_spain_desc: "Na południu Europy leży Półwysep Iberyjski. Jest to region podzielony pod względem kultury i religii, lecz mimo to cenny, jeśli chcemy przeprowadzać najazdy na Morzu Śródziemnym."
 SUN_punish_colonialism_title: "Ukarz najeźdźców"
 SUN_punish_colonialism_desc: "Ostatnie zmiany i odkrycie naszego kontynentu przez najeźdźców radykalnie zmieniły sytuację geopolityczną naszych ziem. Nasi ludzie to zauważyli i domagają się podjęcia działań oraz rozprawienia się z intruzami w tradycyjny sposób."
 SUN_ships_title: "Flota inwazyjna"
 SUN_ships_desc: "Najeźdźcy ujawnili swoje prawdziwe zamiary — brutalną kampanię podbojów. Przygotujmy się, by odwrócić bieg wydarzeń: przyjmijmy obce techniki budowy okrętów i przejmijmy inicjatywę. Europa będzie nasza!"
 SUN_france_title: "Róża i lilia"
 SUN_france_desc: "Ziemie Francji, ojczyzny fleur-de-lis, są rozległe i bogate. Znajduje się tam wiele różnych kultur, zabytków i miast, które tylko czekają na podbój."
 SUN_sunset_invasion_title: "Żegluj ku wschodowi słońca"
 SUN_sunset_invasion_desc: "Nasi bogowie obdarzyli nas słońcem. Daje ono życie nam i otaczającej nas ziemi. Pewnego dnia musi jednak zgasnąć, by ponownie wzejść. Żeglując ku miejscu, w którym wschodzi słońce, położymy kres staremu światu, który nas dręczy, i sprawimy, że narodzi się nowy — rządzony przez [Root.Monarch.GetName]!"
 SUN_technology_adoption_title: "Wymiana krwi na broń"
 SUN_technology_adoption_desc: "Jest nas wielu, lecz zamorscy najeźdźcy przywieźli ze sobą nieznaną nam broń, której zamierzają użyć przeciwko nam. Nie możemy powstrzymać ich przed korzystaniem z tych nowych rodzajów uzbrojenia, ale przynajmniej możemy zdobyć część z nich i włączyć je do naszej armii."
 SUN_britain_title: "Upadek Wysp"
 SUN_britain_desc: "Wyspy Brytyjskie są otoczone wodą, co czyni ich inwazję trudnym zadaniem. Nie powstrzyma nas to jednak, gdyż opanowaliśmy już wody Atlantyku."
 SUN_strangers_title: "Poza znanym światem"
 SUN_strangers_desc: "Podczas gdy nasze państwo skupiało się na centralizacji i wartościach religijnych, u naszych wybrzeży pojawili się nowi ludzie. Noszą miecze i broń palną, a ich ciała okrywają lśniące zbroje. Nie wiemy, czego chcą, dlatego musimy zachować wobec nich ostrożność."
 SUN_symposium_title: "Sympozjum dwóch światów"
 SUN_symposium_desc: "Połączymy tradycje przeszłości z technologią współczesności. W ten sposób połączymy zalety obu światów, stając się pionierami nowatorskiego myślenia, a zarazem na zawsze zachowując pamięć o naszej przeszłości."
 SUN_china_title: "Mandat Niebios"
 SUN_china_desc: "W Chinach od dawna panuje tradycja władców uznawanych za istoty boskie. Mieszkańcy podporządkowują się tym fałszywym bogom, kłaniając się zwykłym śmiertelnikom, którzy nie potrafią zapobiec apokalipsie. Konieczne jest ukazanie prawdziwej boskiej łaski."
 SUN_settling_europe_title: "Zasiedlenie Europy"
 SUN_settling_europe_desc: "Odległość dzieląca nasze ziemie od Europy utrudnia nam sprawne zarządzanie tamtejszymi posiadłościami. Być może podział tych ziem na gubernatorstwa, których zarządcy będą odpowiadać przed nami, pozwoli skuteczniej wykorzystać bogactwa Europy."
 SUN_colonial_system_title: "System kolonialny"
 SUN_colonial_system_desc: "Założyliśmy kolonie w Europie, a tamtejsi gubernatorzy pozostają wierni naszej władzy, dzięki czemu zaczęliśmy sprawniej wykorzystywać te ziemie. Nadal jednak wiele pozostaje do zrobienia, zanim będziemy mieć pewność, że miejscowa ludność nie zbuntuje się przeciwko nam. Rozbudowa nowego systemu kolonialnego przyniosłaby nam korzyści."
 SUN_pacific_title: "Zbadaj nieznane ziemie"
 SUN_pacific_desc: "Być może najodważniejszym czynem, na jaki może zdobyć się człowiek, jest wyruszenie w nieznane, poszukiwanie nowych lądów i podbijanie wszystkiego, co stanie mu na drodze. Wielu naszych arystokratów i kupców już przygotowuje się do wypłynięcia na ziemie leżące za Oceanem Spokojnym. Wesprzyjmy ich pragnienie odkrycia tego, co oferuje im Terra Incognita."
 SUN_japan_title: "Kraj Wschodzącego Słońca"
 SUN_japan_desc: "Wyspy Japonii często nazywa się Nippon, czyli „Krajem Wschodzącego Słońca”. Słońce wschodzi wraz z nastaniem nowego dnia i nowego cyklu. Podbijając Japonię, przyniesiemy Azji nowy początek."
 SUN_sunrise_title: "W pogoni za Słońcem"
 SUN_sunrise_desc: "Na zachodzie wschodzi słońce. Oznacza początek nowego dnia i nowego cyklu, w którym musimy pozostać wierni naszym przekonaniom. Nakazują nam one wyruszyć na zachód i odkryć, co kryje się u kresu tej drogi."
