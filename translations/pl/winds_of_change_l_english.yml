 TIM_unlock_privilege_for_innovativeness_gain: "Odblokuj przywilej stanu „§YPromowanie idżazy§!” dla §Y[Root.GetClergyName]§!, który pozwoli nam zdobywać §G+0.5§! rocznej innowacyjności, zależnie od lojalności §Y[Root.GetClergyName]§!, ale zwolni §Y[Root.GetClergyName]§! z działania §Yprzejmowania ziemi§!."
 TIM_patron_of_art_personality_unlock: "Osobowość władcy „§YPatron sztuki§!” zostanie odblokowana niezależnie od §Yumiejętności administracyjnych§! i będzie §Ybardziej prawdopodobna§! do uzyskania. Zapewni ona następujące modyfikatory:\\n  Koszt technologii: §G-5.0%§!\\n  Koszt idei: §G-5.0%§!"
