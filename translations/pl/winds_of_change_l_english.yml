 citadel_of_aleppo: "Cytadela w Aleppo"
 us_heit_personality: "Us Heit"
 desc_us_heit_personality: "„Us Heit”, czyli „Nasz Ojciec”, to popularny przydomek Wilhelma Ludwika von Nassau, nadany mu za zasługi w walce z Hiszpanią i Świętym Cesarstwem Rzymskim oraz zapewnienie niepodległości Niderlandom."
 us_heit_personality_die_desc: "[GetHerHisCap] dokonania zostaną zapamiętane w historii Niderlandów."
 bestevaer_personality: "Bestevaer"
 desc_bestevaer_personality: "„Bestevaer”, czyli „Dziadek”, to przydomek legendarnego admirała Michiela de Ruytera, jednego z najwybitniejszych dowódców morskich w historii, znanego z najazdów na posiadłości angielskiej korony."
 bestevaer_personality_die_desc: "[GetHerHisCap] wrogowie mogą odetchnąć z ulgą — [GetHerHis] najazdy nie będą już pustoszyć ich portów."
 orangist_stadholder_personality: "Oranżystowski namiestnik"
 desc_orangist_stadholder_personality: "Polityczny mistrz stronnictwa oranżystowskiego. Nasz władca zrobi wszystko, by zapewnić władzę swoim stronnikom i ograniczyć wpływy etatystów."
 orangist_stadholder_personality_die_desc: "[GetHerHisCap] polityczne intrygi na rzecz oranżystów dobiegły końca."
 ned_kept_sound_toll: "Utrzymana opłata sundzka"
 ned_removed_sound_toll: "Zniesiona opłata sundzka"
 overthrow_statist_stadholder: "Obal etatystycznego władcę [Root.Monarch.GetTitle]"
 overthrow_statist_stadholder_title: "Obal etatystycznego namiestnika"
 overthrow_statist_stadholder_desc: "Obecny [Root.Monarch.GetTitle] naszego państwa nie reprezentuje interesów stronnictwa oranżystowskiego. Obalmy [Root.Monarch.GetHerHim] i dopilnujmy, by [Root.Monarch.GetSheHe] nie został pożarty."
 dutch_mission_events.1.t: "Od miast handlowych do państwa"
 dutch_mission_events.1.d: "Mieszkańcy Holandii od zawsze żyli w rozproszonej federacji miast handlowych na niderlandzkim wybrzeżu. Gdy nasze ziemie odziedziczyli Burgundczycy, wiele z tych miast po prostu zaakceptowało zmianę władzy. Teraz, po zrzuceniu burgundzkiego jarzma, miasta handlowe chwyciły za broń we wspólnej sprawie: zjednoczenia Niderlandów. Rozpoczęły podbój kolejnych ośrodków, by ostatecznie stworzyć własne państwo."
 dutch_mission_events.1.a: "Nasi sąsiedzi zostali wreszcie pokonani."
 dutch_mission_events.2.t: "Nasi flamandzcy bracia"
 dutch_mission_events.2.d: "Mieszkańcy Flandrii od zawsze byli do nas podobni. Jednak wieloletnie panowanie francuskiej korony nadało im bardziej obcy charakter. Jeśli mamy uznać ich za naszych braci, musimy najpierw wyplenić francuskie wpływy, by nie próbowali rządzić według własnych, odmiennych wartości."
 dutch_mission_events.2.a: "Zanim będziemy mogli w pełni zintegrować Flamandów, musimy uporać się z francuskimi wpływami."
 dutch_mission_events.2.b: "W głębi serca nadal są Holendrami."
 dutch_mission_events.3.t: "Tron Anglii"
 dutch_mission_events.3.d: "Upadek Londynu i koronacja władcy [Root.Monarch.GetName] sprawiły, że wielu angielskich możnych ukorzyło się przed nami, choć nie wszyscy akceptują ten obrót spraw. Jako ich nowi seniorzy możemy teraz zdecydować o ich losie."
 dutch_mission_events.3.a: "Zadbajmy o to, by oba państwa zachowały niezależność."
 dutch_mission_events.3.b: "Powinni stać się częścią państwa niderlandzkiego."
 dutch_mission_events.4.t: "Brama na Bałtyk"
 dutch_mission_events.4.d: "Upadek Kopenhagi zapewnił nam kontrolę nad cieśninami duńskimi, a tym samym nad pobieranymi tam opłatami sundzkimi. Możemy je znieść, umożliwiając większej liczbie kupców swobodny przepływ i zadowalając licznych handlarzy bałtyckich, albo zachować je, by jeszcze bardziej umocnić naszą pozycję w regionie."
 dutch_mission_events.4.a: "Teraz to my sprawujemy tu władzę."
 dutch_mission_events.4.b: "Czas wreszcie znieść opłaty w cieśninach duńskich."
 dutch_mission_events.5.t: "Pionierzy nowoczesnej sztuki oblężniczej"
 dutch_mission_events.5.d: "Być może najważniejszym elementem kampanii wojennej są oblężenia. Źle poprowadzona bitwa może być kosztowna, lecz nieprzemyślane oblężenie potrafi przynieść równie katastrofalne skutki. Wielu teoretyków wojskowości w naszym kraju zaproponowało nowe sposoby prowadzenia działań oblężniczych."
 dutch_mission_events.5.a: "Oblężenia stanowią większą część kampanii, dlatego musimy doprowadzić tę sztukę do perfekcji."
 dutch_mission_events.6.t: "Organizacja admiralicji"
 dutch_mission_events.6.d: "Holenderskie admiralicje od zawsze kierowały się odmiennymi interesami, co prowadziło między nimi do rywalizacji i licznych konfliktów w naszej marynarce. Możemy jednak wykorzystać te interesy, by skuteczniej realizować własne cele."
 dutch_mission_events.6.a: "Ich partykularne interesy muszą ustąpić miejsca scentralizowanemu dowództwu."
 dutch_mission_events.6.b: "Niech zachowają własne interesy, dopóki działają one na naszą korzyść."
 dutch_mission_events.7.t: "Kształtowanie państwa"
 dutch_mission_events.7.d: "Republika Holenderska jest młodym państwem pośród wielu innych narodów. Aby przetrwać w tej geopolitycznej rzeczywistości, musimy przede wszystkim odpowiednio rozwiązać konflikt między oranżystami a etatystami, wybierając stronnictwo, które zechcemy poprzeć."
 dutch_mission_events.7.a: "Stronnictwo oranżystowskie pomoże nam rywalizować z resztą świata."
 dutch_mission_events.7.b: "Państwo musi stać ponad wszystkim!"
 dutch_mission_events.8.t: "Renesans Północy"
 dutch_mission_events.8.d: "Renesans flamandzki, rozkwitający w XV i XVI wieku, był okresem ożywienia kulturalnego i artystycznego we Flandrii, obejmującej dzisiejszą Belgię i Niderlandy. Łączył mistrzostwo artystyczne, rozkwit handlu i intelektualną innowacyjność. Artyści tacy jak Jan van Eyck i Pieter Bruegel Starszy stali się symbolami tej epoki, rozwijając technikę malarstwa olejnego i przedstawiając codzienne życie z niespotykanym realizmem."
 dutch_mission_events.8.a: "Zaprośmy na nasz dwór wielu wybitnych artystów i architektów!"
 dutch_mission_events.9.t: "Pieter Post"
 dutch_mission_events.9.d: "Pieter Post, wybitny przedstawiciel holenderskiej architektury barokowej XVII wieku, na trwałe odcisnął piętno na krajobrazie architektonicznym Niderlandów. Zasłynął z umiejętnego łączenia monumentalności z funkcjonalnością, a jego projekty uosabiały elegancję i wyrafinowanie epoki. Do jego najważniejszych dzieł należą pałac Mauritshuis w Hadze oraz słynny pałac Huis ten Bosch. Charakterystyczne dla jego stylu symetryczne fasady, klasyczne elementy i dbałość o szczegóły wzbogaciły holenderskie miasta i wpłynęły na późniejsze kierunki architektoniczne. Jego dziedzictwo nadal inspiruje architektów i miłośników sztuki."
 dutch_mission_events.9.a: "Jego talent nie może się zmarnować."
 ned_unite_two_crowns_title: "Zjednoczenie dwóch koron"
 ned_unite_two_crowns_desc: "Los Wysp Brytyjskich jest nierozerwalnie związany z naszym własnym. Błyskawiczne zwycięstwo nad północnymi rywalami i nasze stopniowe podporządkowanie regionu były zaledwie pierwszym krokiem ku zbliżeniu obu narodów. Zintegrowanie naszych poddanych na północy przyniesie chwałę i splendor naszemu dziedzictwu. Niech żyją Zjednoczone Korony!"
 UCN: "Zjednoczone Korony"
 UCN_ADJ: "Angielsko-holenderski"
 UCN_ideas: "Idee Zjednoczonych Koron"
 UCN_ideas_start: "Tradycje angielsko-holenderskie"
 UCN_ideas_bonus: "Ambicje angielsko-holenderskie"
 ned_unite_two_crowns_tt: "Proklamuj Imperium Zjednoczonych Koron."
 ned_dutch_bookmarket_key: "Niderlandzki rynek książki"
 hol_parliament_of_mechelen_modifier: "Parlament w Mechelen"
 desc_hol_parliament_of_mechelen_modifier: "Naród posiadający parlament może liczyć na silny system sprawiedliwości i trwałe zasady moralne."
 hol_influx_prosperity_modifier: "Napływ dobrobytu"
 desc_hol_influx_prosperity_modifier: "Nowo zdobyte bogactwa portów nad Bałtykiem przyniosą błogosławieństwo naszemu narodowi!"
 hol_ample_grain_trade_modifier: "Obfitość zboża"
 desc_hol_ample_grain_trade_modifier: "Nikt nie zdobył legendarnej sławy z pustym żołądkiem."
 ned_illustrious_schools_low_countries_modifier: "Znakomite szkoły Niderlandów"
 desc_ned_illustrious_schools_low_countries_modifier: "Bogactwo naszego regionu najlepiej obrazuje wysoki poziom edukacji, jaki zapewniamy mieszkańcom!"
 flavor_hol.200.t: "Wielka Rada Niderlandów"
 flavor_hol.200.d: "Wszyscy mieszkańcy kraju — od najskromniejszych chłopów po najwyższych rangą możnowładców — podlegają prawom [Root.GetAdjective]. Dzięki autorytetowi głowy państwa Wielka Rada cieszy się prestiżem i prawowitością, a jej zadaniem jest rozpatrywanie codziennych skarg oraz rozstrzyganie spraw prawnych i sądowych."
 flavor_hol.200.a: "Rada Państwa rozstrzyga wszystkie sprawy, wielkie i małe!"
 flavor_hol.201.t: "Zmienne wiatry handlu"
 flavor_hol.201.d: "Kupcy z Hanzy cieszyli się niegdyś ogromną władzą i prestiżem. Dzięki monopolowi na handel zbożem na północy nikt nie śmiał przeciwstawić się ich potężnym i dobrze zaopatrzonym armiom. Wszystko jednak się zmienia, a czas nikogo nie oszczędza. W rezultacie uścisk Hanzy na handlu zbożem osłabł, dając początek złotej epoce [Root.GetAdjective] i wspaniałemu napływowi zagranicznych towarów."
 flavor_hol.201.a: "Wreszcie zwyciężyliśmy!"
 flavor_hol.202.t: "Centrum handlu międzynarodowego"
 flavor_hol.202.d: "Przybywajcie wszyscy! [1744.GetName] było niegdyś sercem zachodniego handlu. Miasto ozdobione pięknem tysiąca arkad, obdarzone monetami z czterech stron świata, niestety popadło w ruinę!\nNa szczęście nasze niedawne podboje w regionie i odbudowa miasta przywróciły mu znaczną część dawnej świetności i znaczenia — wszystko dzięki wspaniałej administracji [Root.GetAdjective]!"
 flavor_hol.202.a: "Pieniądze wprawiają świat w ruch!"
 flavor_hol.203.t: "Prawo nadawania stopni doktorskich w Niderlandach"
 flavor_hol.203.d: "Mimo że w naszych miastach żyje wielu ludzi piśmiennych, przez stulecia prawo nadawania stopni doktorskich było wyłączną domeną szlachty, która zazdrośnie strzegła tego przywileju. Dzięki budowie pierwszych państwowych wydziałów szkolnictwa wyższego możemy teraz zwiększyć dostęp obywateli do edukacji i nadawać stopnie doktorskie."
 flavor_hol.203.a: "Edukacja powinna być dostępna i przystępna cenowo dla wszystkich!"
 flavor_hol.204.t: "Port w Amsterdamie"
 flavor_hol.204.d: "Pierwsza działalność portowa w Amsterdamie sięga XIII wieku. O porcie wspomniano po raz pierwszy w 1342 roku, kiedy miasto Amsterdam otrzymało prawa miejskie. W ostatnim czasie, w złotej epoce [Root.GetAdjective], port przekształcił się w jeden z głównych portów [Root.GetAdjective] Kompanii Wschodnioindyjskiej i centrum naszych operacji na całym świecie. Kupcy przywożą na nasze targowiska egzotyczne towary z najodleglejszych zakątków globu, przyciągani tętniącym życiem pięknego miasta — nowej perły naszych dostatnich czasów!"
 flavor_hol.204.a: "Podstawa naszej złotej ery!"
 flavor_hol.205.t: "Rembrandt van Rijn i sztuka [Root.GetAdjective]"
 flavor_hol.205.d: "Jak to zwykle bywa, bogactwu i złotej epoce morskich odkryć szybko towarzyszy wzrost piśmienności, poziomu edukacji i rozkwit sztuki. Rembrandt, jeden z najbardziej wpływowych ludzi złotej epoki [Root.GetAdjective], jest nowatorskim i niezwykle płodnym mistrzem malarstwa, grafiki i wielu innych dziedzin. Powszechnie uważa się go za jednego z najwybitniejszych artystów wizualnych w historii sztuki oraz najważniejszego twórcę w dziejach malarstwa [Root.GetAdjective]. W przeciwieństwie do większości [Root.GetAdjective] mistrzów XVII wieku Rembrandt tworzy dzieła o bardzo zróżnicowanej stylistyce i tematyce: portrety i autoportrety, pejzaże, sceny rodzajowe, alegoryczne i historyczne, motywy biblijne i mitologiczne, a także studia zwierząt. Jego twórczość przypada na okres wielkiego bogactwa i osiągnięć kulturowych, który trafnie nazwaliśmy złotą epoką [Root.GetAdjective]. Sztuka [Root.GetAdjective], zwłaszcza malarstwo [Root.GetAdjective], choć pod wieloma względami przeciwstawna dominującemu w Europie barokowi, stała się niezwykle płodna i innowacyjna, dając początek ważnym nowym gatunkom."
 flavor_hol.205.a: "Malarstwo jest wnuczką natury..."
 flavor_hol.206.t: "Potęga na rynku książki"
 flavor_hol.206.d: "Nasze ośrodki miejskie dominują na rynkach, przyciągając gości i podróżnych z całego świata, którzy kupują nasze towary. Jednym z nieoczekiwanych skutków tego zjawiska jest wzrost produkcji i konsumpcji książek w całym naszym wspaniałym kraju! Wielkie tomy, kieszonkowe wydania, książki kucharskie i rozprawy naukowe — przez nasz naród przetacza się fala nowych idei i intelektualnego rozwoju!"
 flavor_hol.206.a: "Pokój bez książek jest jak ciało bez duszy."
 flavor_hol.207.t: "Ojciec nowoczesnej edukacji"
 flavor_hol.207.d: "Jan Amos Komeński, czeski filozof, pedagog i teolog, pełni obecnie funkcję biskupa Jednoty Braci Czeskich. Jego droga od uchodźcy religijnego do pioniera powszechnej edukacji jest dobrze znana. W swoim słynnym dziele „Wielka dydaktyka” formalnie przedstawił tę koncepcję. Jako pedagog i teolog kieruje obecnie szkołami oraz doradza rządom w całej niekatolickiej Europie, umacniając swoją pozycję w połowie XVII wieku."
 flavor_hol.207.a: "Cóż za błyskotliwy umysł!"
 flavor_hol.208.t: "Antonie van Leeuwenhoek"
 flavor_hol.208.d: "Antonie Philips van Leeuwenhoek, niderlandzki przedsiębiorca i uczony działający w złotej epoce niderlandzkiej nauki i techniki, stał się wybitną postacią swoich czasów. Mimo że w dużej mierze był samoukiem, zyskał miano „ojca mikrobiologii” i znalazł się wśród pierwszych mikroskopistów oraz mikrobiologów. Obecnie prowadzi przełomowe badania nad mikroskopią i kładzie podwaliny pod mikrobiologię jako uznaną dziedzinę nauki."
 flavor_hol.208.a: "Czy życie naprawdę może być aż tak małe?"
 flavor_hol.209.t: "Jan Leeghwater"
 flavor_hol.209.d: "W roku [GetYear] Jan Leeghwater zyskał sławę jako niderlandzki architekt, budowniczy wiatraków i inżynier hydrotechnik. Jego przełomowe projekty zmieniają miasta i młyny na niderlandzkiej prowincji. Wizjoner Leeghwater stoi na czele inicjatywy osuszenia jeziora Haarlemmermeer. Ten niebezpieczny akwen, którego wody nieustannie przybierają, zagraża okolicznym miastom i stopniowo pochłania wsie. Niebezpieczeństwo dotyczy również Amsterdamu i Lejdy, co podkreśla pilną potrzebę realizacji przełomowych przedsięwzięć Leeghwatera."
 flavor_hol.209.a: "Utalentowany budowniczy i architekt!"
 flavor_hol.210.t: "Dramat epoki"
 flavor_hol.210.d: "Niewiele spośród największych narodów naszego kontynentu może poszczycić się najwybitniejszym dramaturgiem swoich czasów. Jednym z takich twórców jest Joost van den Vondel, którego dzieła przyciągają uwagę całej Europy. Jego sztuki niezmiennie zachwycają publiczność i należą do najczęściej wystawianych przedstawień. Epopeja „Joannes de Boetgezant”, poświęcona życiu Jana Chrzciciela, jest szczytowym osiągnięciem niderlandzkiej epiki. Arcydzieła teatralne Vondela, w tym ponadczasowy „Gijsbrecht van Aemstel”, regularnie goszczą na scenie, zwłaszcza podczas corocznego przedstawienia w Nowy Rok. Pragnąc tworzyć nawet w podeszłym wieku, Vondel zdaje się nie mieć granic dla swojej wyobraźni."
 flavor_hol.210.a: "Co za przedstawienie!"
 flavor_hol.211.t: "Pożarcie [Root.Monarch.GetName]"
 flavor_hol.211.d: "Wojna i bieda rozdarły nasz naród, a konflikt z rywalami przybiera coraz gorszy obrót. Nędza i nieszczęście trzymają ludność w żelaznym uścisku, podczas gdy rozwścieczone tłumy przemierzają ulice, domagając się ukarania nieudolnego [Root.Monarch.GetName]. Mimo naszych najlepszych starań i zabezpieczeń pałacu rozgniewani chłopi wdarli się do ogrodów. Wkrótce potem nasz drogi władca próbował wygłosić ostatnią, pełną pustych słów i pozbawioną skuteczności przemowę o jedności i miłości. Wtedy kochanka [Root.Monarch.GetHerHis] została stratowana przez rozwścieczony tłum.\n\nGdy masakra dobiegła końca, rozjuszony motłoch zwrócił się przeciwko [Root.Monarch.GetName] i rzucił się na niego niczym wściekłe zwierzę. Ciało władcy zostało później poćwiartowane, jego szczątki sprzedawano na targowiskach, a niektórzy radykalni uczestnicy zamieszek zatopili zęby w nagim, soczystym ciele [Root.Monarch.GetHerHis]. Oto niebezpieczeństwa nieudolnych rządów w czasach wojny..."
 flavor_hol.211.a: "Pożerają ją, a potem pożrą mnie! O mój Boże!"
 hun_old_alliances_title: "Dawne sojusze"
 hun_old_alliances_desc: "Węgry i Polska były niegdyś rządzone jako jedno państwo przez takich władców jak andegaweński król Ludwik Wielki, a w ostatnim czasie także Władysław III Jagiellończyk. Niektórzy członkowie naszego dworu chcieliby jednak zdystansować nas od Polaków. Powinniśmy zająć w tej sprawie stanowisko."
 hun_deal_with_the_impaler_title: "Rozprawić się z Drakulą"
 hun_deal_with_the_impaler_desc: "Pomoc Włada II podczas naszych wcześniejszych wojen z Osmanami była co najmniej wątpliwa. Nie możemy pozwolić, by nadal lawirował między nami a nimi, ryzykując wpadnięcie Wołoszczyzny w turecką strefę wpływów. Najwyższy czas interweniować i raz na zawsze rozprawić się z Drakulą."
 hun_the_despotate_of_serbia_title: "Podporządkować Serbię"
 hun_the_despotate_of_serbia_desc: "Państwo serbskie poprosiło kiedyś o ochronę, gdy Imperium Osmańskie zagroziło jego granicom. Uważamy, że prośba ta pozostaje nadal aktualna. Przyjmiemy ich do grona."
 hun_fekete_sereg_title: "Fekete Sereg"
 hun_fekete_sereg_desc: "Otoczona licznymi wrogami armia węgierska ma bogate doświadczenie w obronie niepodległości naszego państwa. Nie możemy jednak spocząć na laurach — musimy nieustannie doskonalić nasze umiejętności, aby nie utracić przewagi, jaką daje nam znakomite wojsko."
 hun_the_black_legion_title: "Czarny Legion"
 hun_the_black_legion_desc: "Nasza Czarna Armia stała się już powszechnie znaną siłą, siejącą spustoszenie na polu bitwy i napełniającą serca wrogów strachem. Uczyńmy z niej trwałą instytucję, dumę naszego narodu i niezrównaną siłę militarną."
 hun_integrate_croatia_title: "Zintegrować Chorwację"
 hun_integrate_croatia_desc: "Od zawarcia układu Pacta Conventa w 1102 roku Królestwo Chorwacji pozostaje z nami w unii personalnej. Aby zapewnić trwałą kontrolę nad ziemiami chorwackiej korony, powinniśmy dążyć do ściślejszej integracji lub zacieśnienia naszych stosunków."
 hun_recover_dalmatia_title: "Odzyskać Dalmację"
 hun_recover_dalmatia_desc: "W wyniku wewnętrznych konfliktów dalmatyńskie prowincje korony węgierskiej zostały sprzedane Wenecji w 1409 roku. Nie możemy pozwolić, by te bogate miasta, kluczowe dla naszej dominacji nad Adriatykiem, pozostały w rękach wrogów. Odzyskaliśmy już siły i umocniliśmy władzę nad Chorwacją — nadszedł czas, by odzyskać Dalmację."
 hun_legacy_of_louis_the_great_title: "Dziedzictwo Ludwika Wielkiego"
 hun_legacy_of_louis_the_great_desc: "Podczas chwalebnych rządów andegaweńskich królów Węgier Święta Korona objęła również Neapol. Teraz, gdy Adriatyk znajduje się pod naszą kontrolą, możemy wysunąć roszczenia do korony neapolitańskiej i odzyskać dziedzictwo Ludwika Wielkiego."
 hun_control_moldavia_new_title: "Kontroluj Mołdawię"
 hun_control_moldavia_new_desc: "Mołdawia przechodziła z rąk do rąk więcej razy, niż możemy liczyć. Najwyraźniej jednak mamy najbardziej uzasadnione roszczenia do ich ziemi."
 hun_bosnian_subjugation_title: "Bezpieczeństwo Bośni"
 hun_bosnian_subjugation_desc: "Bośnia, podobnie jak Serbia, powinna postrzegać nas jako swoich prawowitych władców. Nie można oczekiwać, że tak żałosny naród zdoła stłumić wewnętrzne bunty, nie mówiąc już o najazdach Turków."
 hun_the_anatolian_threat_title: "Zaraza Europy"
 hun_the_anatolian_threat_desc: "Nadszedł czas, abyśmy zaczęli bronić się przed falą anatolijskich niewiernych okupujących europejskie ziemie. Musimy zabezpieczyć naszą granicę i ufortyfikować nasze terytorium. Nie poddamy się łatwo."
 hun_liberate_bulgaria_title: "Wyzwolić Bułgarię"
 hun_liberate_bulgaria_desc: "Bułgarzy od wielu lat znajdują się pod obcą okupacją. Najpierw samozwańczego Cesarstwa Rzymskiego, potem Turków, którzy z pewnością byli okrutnymi panami. Wyzwolimy ich."
 hun_secure_macedonia_title: "Zabezpiecz Macedonię"
 hun_secure_macedonia_desc: "Grabieżcy zbyt długo niszczyli Bałkany. Czas wyrzucić ich z naszej ziemi i przyłączyć Macedonię do naszego królestwa!"
 hun_push_on_to_constantinople_title: "Marsz na Konstantynopol"
 hun_push_on_to_constantinople_desc: "Wspaniałe miasto Konstantynopol leży zrujnowane i zbezczeszczone przez nikczemne tureckie hordy. My, obrońcy Chrystusa i przedmurze chrześcijaństwa, pomaszerujemy na miasto Konstantyna i wyzwolimy je spod jarzma niewiernych."
 hun_bulwark_of_christianity_title: "Przedmurze chrześcijaństwa"
 hun_bulwark_of_christianity_desc: "Jako główni obrońcy chrześcijaństwa przed osmańskim zagrożeniem zyskaliśmy miano przedmurza chrześcijaństwa. Udowadniając, że potrafimy stawić czoła wszystkiemu, co niewierni mogą rzucić przeciwko nam, pokażemy, że w pełni zasługujemy na ten tytuł."
 hun_dismantle_la_serenissima_title: "Rozbić La Serenissimę"
 hun_dismantle_la_serenissima_desc: "Wenecja od zbyt dawna jest cierniem w naszym boku. Po odzyskaniu Dalmacji powinniśmy zniszczyć republikę i ustanowić własną hegemonię nad Adriatykiem."
 hun_fund_the_monasteries_title: "Wesprzeć klasztory"
 hun_fund_the_monasteries_desc: "Zakon paulinów odgrywa ważną rolę na Węgrzech od czasu założenia go przez błogosławionego Euzebiusza z Ostrzyhomia w 1250 roku. Rozprzestrzenił się nawet na sąsiednie kraje. Przeznaczenie środków na zapewnienie jego przychylności wobec państwa będzie dobrą inwestycją."
 hun_unity_in_belief_title: "Jedność w wierze"
 hun_unity_in_belief_desc: "Terytoria Węgier są domem dla ludzi o różnych wyznaniach. Tak czy inaczej musimy zadbać o to, by różnice religijne nie dzieliły naszego państwa."
 hun_weaken_poland_title: "Osłab Polskę"
 hun_weaken_poland_desc: "[POL.GovernmentName] Polski to potężny kraj, kontrolujący ziemie za naszą północną granicą. Stanowiliby poważne zagrożenie dla naszej niezależności, gdyby stali się wrogo nastawieni. Powinniśmy dokonać ataku wyprzedzającego, aby przesunąć polską granicę jak najdalej od naszego centrum."
 hun_jagiellonian_union_title: "Unia Jagiellońska"
 hun_jagiellonian_union_desc: "Aż do jego śmierci w bitwie pod Warną w 1444 r. Węgrami wraz z Polską i Litwą rządził Władysław III Jagiellończyk. Powinniśmy przywrócić unię między naszymi tronami, która istniała za jego czasów – i sprawić, że wynik będzie bardziej pomyślny niż ostatnim razem."
 hun_teutonic_advance_title: "Ekspansja na ziemie zakonu krzyżackiego"
 hun_teutonic_advance_desc: "Dzięki pełnej kontroli nad polską koroną uzyskaliśmy dostęp do Bałtyku. Ten pradawny region obfituje w bogactwa i możliwości, a aby je zdobyć, musimy rozszerzyć tam nasze wpływy."
 hun_strengthen_the_vegvar_title: "Wzmocnić Végvár"
 hun_strengthen_the_vegvar_desc: "Straszliwy wróg powoli rozszerza swoje wpływy w Europie. Nasze południowe granice nie mają istotnych naturalnych przeszkód, które mogłyby zapewnić nam przewagę obronną. Dalsze umacnianie pogranicza wojskowego musi stać się najwyższym priorytetem."
 hun_bohemian_borderlands_title: "Czeskie pogranicze"
 hun_bohemian_borderlands_desc: "Elektorat Czech jest właścicielem obszarów granicznych na naszym północnym zachodzie. Ponieważ jest silnym i dobrze prosperującym królestwem znanym z paskudnych herezji, powinniśmy podjąć działania przeciwko nim, aby zapobiec rozprzestrzenianiu się ich na nasze ziemie."
 hun_crown_of_wenceslas_title: "Korona św. Wacława"
 hun_crown_of_wenceslas_desc: "Zjednoczenie korony czeskiej z naszą własną znacznie zwiększyłoby siłę naszego państwa - szczególnie, jeśli możemy dopilnować, aby jej elektorat został nam przekazany."
 hun_a_strong_economy_title: "Silna gospodarka"
 hun_a_strong_economy_desc: "Nasza zdolność do rywalizacji jako wielkie mocarstwo, otoczone licznymi potencjalnymi zagrożeniami, zależy od tego, czy zdołamy wydobyć z naszych ziem każde możliwe bogactwo."
 hun_bibliotheca_corviniana_title: "Bibliotheca Corviniana"
 hun_bibliotheca_corviniana_desc: "Odrodzenie wiedzy klasycznej pobudziło naszych uczonych i filozofów. Powinniśmy założyć bibliotekę, w której zgromadzimy dorobek intelektualny całej Europy."
 hun_universitas_istropolitana_title: "Universitas Istropolitana"
 hun_universitas_istropolitana_desc: "Uczelnie wyższe są kluczem do wielkiego postępu. W przeszłości na Węgrzech działały uniwersytety, lecz obecnie żaden z nich nie funkcjonuje. Skoncentrujmy zasoby na otwarciu nowej uczelni w [1772.GetCapitalName], aby stała się filarem wiedzy i rozwoju Węgier."
 hun_the_renaissance_king_title: "Król renesansu"
 hun_the_renaissance_king_desc: "Udało nam się zapoczątkować prawdziwą rewolucję wiedzy i edukacji na Węgrzech. Aby utrzymać tę pozycję, musimy zadbać o wszechstronne wykształcenie przyszłych władców, tak by ich rozległa wiedza poprowadziła kraj ku wielkości."
 hun_found_budapest_title: "Założyć Budapeszt"
 hun_found_budapest_desc: "Potężny naród potrzebuje potężnej stolicy, która odzwierciedli jego siłę, przepych i chwałę. Połączymy miasta Buda, Óbuda i Peszt w Budapeszt — godną stolicę, która przyćmi nawet metropolie zachodnich mocarstw."
 hun_the_hungarian_succession_title: "Węgierska sukcesja"
 hun_the_hungarian_succession_desc: "Klęska krucjaty warneńskiej sprawiła, że nasz kraj ostał się pozbawiony przywódcy i bezbronny. Musimy uporać się z tym kryzysem, nie tracąc naszej niezależności na rzecz któregokolwiek z naszych oportunistycznych sąsiadów."
 hun_the_imperial_ambition_title: "Cesarskie ambicje"
 hun_the_imperial_ambition_desc: "Habsburgowie zostali zdetronizowani, a Cesarstwo rzucone na kolana. To od nas zależy, czy zadamy mu łagodzący cierpienia cios ostateczny, czy też sami wstąpimy na tron cesarski i poprowadzimy je ku nowemu złotemu wiekowi."
 hun_expand_the_mint_title: "Rozbudować mennicę"
 hun_expand_the_mint_desc: "Górnicze miasta Górnych Węgier od dawna zapewniają naszemu państwu stabilne dochody. Udoskonalmy proces wybijania monet w mennicy królewskiej, aby nasze dukaty osiągnęły najwyższą jakość i zalały europejskie rynki."
 hun_develop_free_royal_towns_title: "Rozwijać wolne miasta królewskie"
 hun_develop_free_royal_towns_desc: "Przyznawanie przywilejów miastom w celu pobudzania ich rozwoju jest na Węgrzech długą tradycją. Wzmocnijmy prawa wolnych miast królewskich, by zachęcić kolejnych zagranicznych kupców i rzemieślników do osiedlania się w naszym kraju."
 hun_the_great_city_of_buda_title: "Wielkie miasto Buda"
 hun_the_great_city_of_buda_desc: "Państwo węgierskie przetrwało stulecia, a nasza stolica stała się ważnym miastem. Wciąż jednak ustępuje rozmiarami i przepychem Pradze oraz Wiedniowi, stolicom naszych zachodnich rywali. Nadejdzie wspaniały dzień, gdy [Root.Capital.GetCapitalName] przewyższy oba te miasta i stanie się najważniejszym ośrodkiem Europy Środkowej."
 hun_fertile_lands_of_pannonia_title: "Żyzne ziemie Panonii"
 hun_fertile_lands_of_pannonia_desc: "Rozległa Nizina Panońska doskonale nadaje się pod uprawę roli i hodowlę zwierząt. Aby stać się prawdziwym europejskim mocarstwem, potrzebujemy rolnictwa zdolnego wyżywić rosnącą populację i zaopatrywać nasze armie."
 hun_a_strong_government_title: "Silny rząd"
 hun_a_strong_government_desc: "Musimy zreformować państwo, aby było gotowe stawić czoła każdej przeszkodzie bez szwanku."
 hun_address_the_ethnic_situation_title: "Narody Węgier"
 hun_address_the_ethnic_situation_desc: "Od chwili powstania Węgry są państwem wielokulturowym. Różnorodność etniczna nie sprawiała dotąd większych problemów, lecz nowe, oświeceniowe koncepcje państw narodowych stopniowo zmieniają rozumienie narodu. Tak liczna społeczność różnych ludów w naszych granicach może stać się poważnym zagrożeniem. Musimy natychmiast zająć się tą kwestią."
 hun_weaken_the_habsburgs_title: "Osłab Austrię"
 hun_weaken_the_habsburgs_desc: "Pokój z Austrią nie może trwać wiecznie — nasze ziemie są zbyt kuszącym łupem, by arcyksiążę nie snuł wobec nich planów. Powinniśmy osłabić Austrię, aby zabezpieczyć się przed atakiem zachodnich sąsiadów."
 hun_overshadow_austria_title: "Zajmij Wiedeń"
 hun_overshadow_austria_desc: "Wiedeń byłby wspaniałym nabytkiem dla naszego państwa. Powinniśmy go zdobyć. Upadek miasta tak bardzo osłabi Cesarstwo, że będziemy mogli swobodnie rozporządzać tym, co z niego pozostanie."
 hun_heirs_of_ruthenia_title: "Dziedzice Rusi"
 hun_heirs_of_ruthenia_desc: "Jagiellonowie rościli sobie prawa do rozległych ziem Rusi. Teraz, gdy kontrolujemy korony ich państw, powinniśmy wykorzystać te roszczenia i zająć Ruś, zanim region przejmą Moskale."
 hun_the_order_of_the_dragon_title: "Order Smoka"
 hun_the_order_of_the_dragon_desc: "Założony przez Zygmunta Luksemburskiego Zakon Smoka stał się ważnym elementem naszej obrony przed turecką ekspansją. Należy go znacznie rozbudować, aby jego członkowie mogli wystawić znaczące siły do naszych kampanii przeciwko niewiernym."
 hun_a_multicultural_empire_title: "Cesarstwo wielokulturowe"
 hun_a_multicultural_empire_desc: "Nasze podboje objęły rozległe ziemie zamieszkane przez liczne narody, co przyniosło również ogromne zagrożenie dla trwałości naszych rządów. Aby zachować jedność imperium, musimy przeprowadzić reformy modernizujące struktury państwowe oraz zapewniające reprezentację i dobrobyt wszystkim narodom żyjącym pod naszą władzą."
 hun_religious_tolerance: "Tolerancja religijna"
 desc_hun_religious_tolerance: "Uszanujemy przejście Sasów siedmiogrodzkich na protestantyzm i zagwarantujemy im wolność wyznania."
 hun_convert_the_saxons: "Nawrócić Sasów"
 desc_hun_convert_the_saxons: "Musimy wykorzenić herezję, którą Johannes Honterus sprowadził na Węgry i którą przyjęli Sasi siedmiogrodzcy."
 hun_buda_fortified: "Umocniono fortyfikacje"
 desc_hun_buda_fortified: "Dodatkowo ufortyfikowaliśmy naszą stolicę, aby mogła wytrzymać ewentualne oblężenie osmańskie."
 hun_peasants_compensated: "Zrekompensowano straty chłopom"
 desc_hun_peasants_compensated: "Wypłaciliśmy odszkodowania chłopom chorwackim, których krzywdziła miejscowa szlachta."
 hun_tripartitum: "Tripartitum"
 desc_hun_tripartitum: "Tripartitum zostało oficjalnie uznane za kodeks prawny Węgier i jest obecnie egzekwowane w całym królestwie."
 hun_beatrice_aragon: "Beatrycze Aragońska"
 desc_hun_beatrice_aragon: "Obecność Beatrycze Aragońskiej na dworze królewskim pomoże Węgrom przyswoić idee renesansu z Zachodu."
 hun_imperial_crown_bid: "Starania o koronę cesarską"
 desc_hun_imperial_crown_bid: "Elektorzy dostrzegli słabość Habsburgów. Ponieważ dowiedliśmy, że jesteśmy znacznie sprawniejszymi władcami, z pewnością wybiorą nas zamiast nich podczas kolejnej elekcji cesarskiej."
 estate_nobles_vegvar_system_modifier: "System végvárów"
 desc_estate_nobles_vegvar_system_modifier: "System végvárów stanowi najważniejszy element naszej obrony przed Osmanami. Musimy zadbać, by nasze zamki były w doskonałym stanie, miały pełne załogi i wystarczające zapasy."
 estate_nobles_vegvar_system_desc: "Serce naszego królestwa stanowią płaskie, trudne do obrony tereny. Choć znaczną część granicy osłaniają Karpaty, południowe ziemie królestwa są całkowicie odsłonięte na ataki. Musimy ufortyfikować granice rozbudowanym łańcuchem zamków, który stanie się naszą główną linią obrony."
 hun_first_hungarian_emperor: "Pierwszy węgierski cesarz"
 desc_hun_first_hungarian_emperor: "Po odsunięciu Habsburgów elektorzy Świętego Cesarstwa Rzymskiego wybrali nas na prawowitego cesarza."
 hun_bane_of_the_empire: "Zmora Cesarstwa"
 desc_hun_bane_of_the_empire: "Habsburgowie upadli, a wraz z nimi ich imperium. Staliśmy się jego zgubą — niszczycielami imperiów."
 hun_polish_alliance: "Polski sojusz"
 desc_hun_polish_alliance: "Polacy i Węgrzy są naturalnymi sojusznikami, a odnowienie naszego przymierza może ostatecznie doprowadzić do odbudowy potężnej unii jagiellońskiej."
 hun_wallachian_military_frontier: "Wołoskie pogranicze wojskowe"
 desc_hun_wallachian_military_frontier: "Osmanowie od dawna pragnęli zagarnąć ziemie wołoskie. Teraz, gdy znalazły się pod naszą kontrolą, musimy zadbać o ich ochronę przed ewentualnym najazdem osmańskim."
 hun_securing_the_balkans: "Zabezpieczenie Bałkanów"
 desc_hun_securing_the_balkans: "To na nas spoczywa obowiązek zapewnienia bezpieczeństwa Bałkanom poprzez ochronę miejscowych, słabych księstw przed osmańską nawałą."
 hun_polish_brotherhood: "Polak, Węgier, dwa bratanki"
 desc_hun_polish_brotherhood: "Polacy to nasi historyczni przyjaciele, którzy wielokrotnie nam pomagali. Dopóki będziemy traktować siebie nawzajem jak bracia, żadna siła na tym świecie nas nie pokona."
 hun_promote_hungarian_culture: "Promuj kulturę węgierską"
 desc_hun_promote_hungarian_culture: "Węgry zawsze były wielokulturowym królestwem. Jeśli chcemy zachować jego jedność, musimy promować własną kulturę i zadbać o nauczanie naszego języka w całym kraju."
 hun_guarantee_minority_rights: "Zagwarantowanie praw mniejszości"
 desc_hun_guarantee_minority_rights: "Węgry zawsze były wielokulturowym królestwem. Jeśli chcemy zachować jego jedność, musimy zagwarantować wszystkim narodom żyjącym pod naszym panowaniem równe prawa."
 hun_fertile_lands: "Żyzne ziemie Panonii"
 desc_hun_fertile_lands: "Żyzne ziemie Panonii doskonale nadają się pod uprawę i hodowlę. Inwestycje w ich dobrobyt i produktywność przyniosą długofalowe korzyści."
 hun_strengthen_the_government: "Wzmocnienie rządu"
 desc_hun_strengthen_the_government: "Aby oprzeć się wszelkim naciskom zewnętrznym, musimy zadbać o wewnętrzną siłę państwa. Zapewni ją silny rząd, sprawujący skuteczną kontrolę nad sprawami całego kraju."
 hun_tighten_croatian_union: "Zacieśnienie unii z Chorwacją"
 desc_hun_tighten_croatian_union: "Chorwacja od stuleci pozostaje z nami w unii personalnej, lecz nadszedł czas, by pogłębić integrację i uczynić ją nieodłączną częścią ziem Świętej Korony."
 hun_pearl_on_the_danube: "Siedziba węgierskiej korony"
 desc_hun_pearl_on_the_danube: "Dzięki naszym staraniom Budapeszt stał się nie tylko wspaniałą siedzibą węgierskiej korony, lecz także metropolią o znaczeniu kontynentalnym, dorównującą wielkim miastom Zachodu."
 hun_adriatic_hegemony: "Hegemonia na Adriatyku"
 hun_legacy_of_angevins: "Dziedzictwo Andegawenów"
 desc_hun_legacy_of_angevins: "Za panowania Andegawenów Węgry były jednym z najpotężniejszych państw Europy. Odzyskaliśmy Neapol i jesteśmy w najlepszym położeniu, by przywrócić sobie dawny status."
 hun_vengeance_for_varna: "Pomszczono Warnę"
 desc_hun_vengeance_for_varna: "Warna była najbardziej katastrofalną klęską w dziejach naszego narodu. Teraz, gdy pomściliśmy tę porażkę, nasze wojska są zainspirowane do dalszej walki i wyzwolenia Europy spod panowania niewiernych."
 hun_avenge_varna: "Pomścić Warnę"
 desc_hun_avenge_varna: "Nadszedł czas, by pomścić katastrofę pod Warną. Nasze wojska będą walczyć dzielnie i odzyskają ziemie utracone na rzecz Turków!"
 hun_expanding_the_order: "Rozbudowa zakonu"
 desc_hun_expanding_the_order: "Zakon Smoka stanowi ważny element naszej obrony przed Osmanami. Musimy rozszerzyć jego wpływy na całe królestwo."
 hun_black_legion: "Czarny Legion"
 desc_hun_black_legion: "Nasza Czarna Armia stała się elitarną formacją, której nie dorównuje żadna inna armia w Europie."
 estate_burghers_hungarian_royal_city_modifier: "Wolne miasta królewskie"
 desc_estate_burghers_hungarian_royal_city_modifier: "Wolne miasta królewskie to ośrodki kontrolowane przez stany węgierskie, a nie koronę. Uzyskane przez nie swobody znacząco przyczyniają się do ich rozwoju i dobrobytu."
 hun_patrons_of_art: "Mecenasi sztuki i nauki"
 desc_hun_patrons_of_art: "Jako mecenasowie europejskiej sztuki i nauki musimy zadbać o powszechny dostęp do edukacji na Węgrzech oraz szybkie rozpowszechnianie najnowszych odkryć i idei w całym królestwie."
 hun_expand_mining_rights: "Rozszerzyć przywileje górnicze"
 desc_hun_expand_mining_rights: "Górnictwo jest jednym z filarów naszej gospodarki. Powinniśmy znacznie rozszerzyć prawa miast górniczych, aby skarbiec królewski zawsze był pełen."
 hun_support_of_bohemian_estates: "Poparcie stanów czeskich"
 desc_hun_support_of_bohemian_estates: "Katolickie stany czeskie, pragnące zdetronizować husyckiego króla, jednogłośnie poparły nasze roszczenia do Korony świętego Wacława."
 hun_integrate_the_cossacks: "Zintegrować Kozaków"
 desc_hun_integrate_the_cossacks: "Kozacy są najpotężniejszą siłą wojskową przemierzającą rozległe równiny i stepy Europy Wschodniej. Włączmy ich do naszych armii."
 hun_great_city_buda: "Wielkie miasto Buda"
 desc_hun_great_city_buda: "Miasto wspaniale prosperuje, wyprzedzając Wiedeń i Pragę pod względem dobrobytu."
 hun_mol_romans_invasion_tt: "§YMoldawia§! wybrała status naszego poddanego w wydarzeniu „§YNajazd Rzymian§!”."
 hun_most_developed_province_tt: "Nasza §Ynajbardziej rozwinięta§! prowincja otrzyma:"
 hun_naples_bonus_moh_yes: "£yes£ Jeśli ukończymy tę misję, gdy @NAP §YNeapol§! będzie naszym poddanym w §Yunii personalnej§!, integracja §Ypoddanego§! nie będzie już powodować §R-3§! reputacji dyplomatycznej, a integracja §Yunii personalnej§! będzie dodatkowo zapewniać §G100§! splendoru."
 hun_naples_bonus_yes: "£yes£ Jeśli ukończymy tę misję, gdy @NAP §YNeapol§! będzie naszym poddanym w §Yunii personalnej§!, integracja §Ypoddanego§! nie będzie już powodować §R-3§! reputacji dyplomatycznej, a integracja §Yunii personalnej§! będzie dodatkowo zapewniać §G100§! punktów władzy dyplomatycznej."
 hun_naples_bonus_moh_no: "£no£ Jeśli ukończymy tę misję, gdy @NAP §YNeapol§! będzie naszym poddanym w §Yunii personalnej§!, integracja §Ypoddanego§! nie będzie już powodować §R-3§! reputacji dyplomatycznej, a integracja §Yunii personalnej§! będzie dodatkowo zapewniać §G100§! splendoru."
 hun_naples_bonus_no: "£no£ Jeśli ukończymy tę misję, gdy @NAP §YNeapol§! będzie naszym poddanym w §Yunii personalnej§!, integracja §Ypoddanego§! nie będzie już powodować §R-3§! reputacji dyplomatycznej, a integracja §Yunii personalnej§! będzie dodatkowo zapewniać §G100§! punktów władzy dyplomatycznej."
 hun_reelection_bonus_tt: "Udane ponowne wybory cesarza w §YŚwiętym Cesarstwie Rzymskim§! będą teraz dodatkowo zapewniać nam §G10§! prestiżu i §G5§! autorytetu cesarskiego."
 hun_permanent_power_projection: "Zmora Imperium"
 hun_restoring_amber_road: "Przywrócenie Bursztynowego Szlaku"
 hun_upgrade_cossack_priv_tt: "Ulepsza przywilej stanu [Root.GetCossacksOrFallbackName] „§YCossack Exploration Expeditions§!”, usuwając karę §R-5§! do maksymalnego absolutyzmu.\\n"
 hun_religious_unity_yes: "£yes£ Jeśli ukończymy tę misję, osiągając §Tjedność religijną§!, otrzymamy:"
 hun_religious_unity_no: "£no£ Jeśli ukończymy tę misję, osiągając §Tjedność religijną§!, otrzymamy:"
 hun_orthodox_unrest_yes: "\\n£yes£ §TAlternatywnie§! otrzymamy:"
 hun_orthodox_unrest_no: "\\n£no£ §TAlternatywnie§! otrzymamy:"
 hun_unlock_orthodox_privilege_tt: "Ulepsza przywilej stanu [Root.GetBurghersOrFallbackName] „§YGrant Orthodox Autonomy§!”, usuwając karę §R-10,0%§! do równowagi lojalności duchowieństwa oraz §R-5§! do maksymalnego absolutyzmu."
 hun_empower_religious_diplomats_tt: "Ulepsza przywilej stanu [Root.GetChurchOrFallbackName] „§YReligious Diplomats§!”, zapewniając dodatkowe §G+10§! do opinii państw tego samego wyznania oraz §G+10§! do opinii państw o tym samym wyznaniu."
