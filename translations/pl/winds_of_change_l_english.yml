 MUG_ibadat_khana: "Dom Modlitwy"
 desc_MUG_ibadat_khana: "Dysputy religijne prowadzone w „Ibadat Chana” będą źródłem wielu nowych idei, dopóki będą się odbywać."
 MUG_syncretism_1_2: "Zmodyfikuj „§YSynkretyzm indyjski§!” w następujący sposób:\\n  Maksymalna tolerancja pogan: §G+1.00§!\\n  Tolerancja pogan: §G+1.00§!"
 MUG_syncretism_2_3: "Zmodyfikuj „§YSynkretyzm indyjski§!” w następujący sposób:\\n  Maksymalna tolerancja pogan: §G+1.00§!\\n  Jedność religijna: §G+10.0%§!"
 MUG_jizya_eased: "Złagodzenie dżizji"
 desc_MUG_jizya_eased: "Obniżyliśmy wysokość podatku dżizja, który muszą nam płacić wyznawcy innych religii."
 MUG_din_ilahi_promotion: "Szerzenie boskiej wiary"
 desc_MUG_din_ilahi_promotion: "Propagowanie Din-i Ilahi oznacza również umacnianie naszej dynastii."
 MUG_cavalry_tactics: "Taktyka manewrowa"
 desc_MUG_cavalry_tactics: "Mobilna armia jest kluczem do zwycięstwa strategicznego."
 MUG_focus_on_elephants: "Nacisk na słonie"
 desc_MUG_focus_on_elephants: "Wykorzystamy nasz największy atut, by zwyciężyć: strach."
 house_of_worship_upgrade: "Ibadat Chana"
 desc_house_of_worship_upgrade: "Utworzono „Dom Modlitwy”, w którym filozofowie, przywódcy i inni znawcy religii mogą dyskutować o kwestiach związanych zarówno z hinduizmem, jak i islamem."
 MUG_decision_viceroyalty_of_the_deccan: "Wicekrólestwo Dekanu"
 desc_MUG_decision_viceroyalty_of_the_deccan: "Aby sprawniej zarządzać naszym rozległym państwem, powierzyliśmy rządy w południowych Indiach odrębnemu wicekrólestwu. Dzięki temu nasza administracja może skuteczniej zajmować się ekspansją w innych regionach."
 estate_jains_MUG_gujarati_trade: "Rozległe przywileje gudźarackie"
 estate_jains_MUG_gujarati_trade_desc: "Dalsze nadanie przywilejów kupcom z Gudźaratu umocni naszą pozycję nad Zatoką Kambajską jako następców utraconego sułtanatu."
 estate_jains_MUG_support_malaccan_viceroyalty: "Wsparcie wicekrólestwa Malakki"
 estate_jains_MUG_support_malaccan_viceroyalty_desc: "Nasze wicekrólestwo w Malakce jest bardzo odległe, a rządzenie nim z samego [Root.Capital.GetName] jest niemal niemożliwe. Możemy jedynie przyznać mu dalsze nadania."
 estate_rajputs_MUG_rajput_mansabdars: "Radźpuckie mansabdari"
 estate_rajputs_MUG_rajput_mansabdars_desc: "Wyświadczając przysługi Radźputom, zyskamy ich lojalność i będziemy mogli znacznie lepiej wykorzystać ich wojenne talenty."
 estate_nobles_MUG_development_of_the_subah: "Rozwój subah"
 estate_nobles_MUG_development_of_the_subah_desc: "Dotychczas skupialiśmy się przede wszystkim na ekspansji, a nie konsolidacji. Powinniśmy dać stanowi [Root.GetNobilityName] większą swobodę, aby prowincje mogły się ustabilizować, a zarządzanie nimi stało się łatwiejsze."
 estate_jains_MUG_debase_the_ruppee: "Dewaluacja rupii"
 estate_jains_MUG_debase_the_ruppee_desc: "Aby uwolnić więcej środków na rozwój gospodarczy, moglibyśmy szybko obniżyć wartość naszej waluty, lecz zaszkodziłoby to naszej reputacji wśród kupców."
 estate_church_MUG_promote_divine_religion: "Propagowanie boskiej religii"
 estate_church_MUG_promote_divine_religion_desc: "Propagowanie religii Din-i Ilahi poważnie zaszkodzi naszym stosunkom ze stanem [Root.GetClergyName], lecz z czasem zwiększy autorytet naszego [Root.Monarch.GetTitle]."
 MUG_commission_the_peacock_throne_title: "Zamówienie Pawiego Tronu"
 MUG_commission_the_peacock_throne_desc: "Na znak naszego wspaniałego panowania nad bogatym subkontynentem indyjskim zamówmy okazały tron, który będzie symbolem naszych łaskawych rządów. Powinien zostać wykonany z najwyższej jakości złota i najpiękniejszych klejnotów."
 MUG_viceroyalty_of_deccan_title: "Wicekrólestwo Dekanu"
 MUG_viceroyalty_of_deccan_desc: "Południowe Indie to rozległy region oddzielony od północy górami i dżunglami, co utrudnia sprawowanie nad nim skutecznej władzy. Musimy opracować rozwiązanie administracyjne, które pozwoli zarządzać tak rozległym terytorium bezpośrednio z centrum."
 flavor_mug.5.t: "Kasta Marathów"
 flavor_mug.5.d: "Jedna z niedawno podporządkowanych nam krain należała niegdyś do Marathów – ludu o wyjątkowych talentach wojskowych, którego mieszkańcy są walecznymi wojownikami. Pozyskanie ich przychylności i wcielenie ich do naszej armii mogłoby przynieść znaczne korzyści, lecz z pewnością wzbudziłoby nieufność Radźputów."
 flavor_mug.5.a: "Wzmocnijmy Marathów."
 flavor_mug.5.b: "Musimy dać pierwszeństwo naszym pułkom radźpuckim."
 flavor_mug.6.t: "Upadek imperium Gajapati"
 flavor_mug.6.d: "Suryavamsa, dynastia Słoneczna z Orisy, wreszcie uległa naszym wojskom. Wraz z jej kapitulacją otrzymaliśmy przysięgi garhjatów – trybutariuszy zamieszkujących wyżyny. Zdecydujmy, co zrobić z pozostałościami niegdyś potężnego i hegemonicznego państwa."
 flavor_mug.6.a: "Skupmy się na integracji tych ziem."
 flavor_mug.6.b: "Utrzymajmy kontrolę nad poddanymi plemiennymi."
 flavor_mug.6.c: "Zwerbujmy żołnierzy spośród Garhjatów."
 flavor_mug.7.t: "Upadek Birmy"
 flavor_mug.7.d: "Ziemie Birmy są odizolowane od wrogów pasmami górskimi, co sprzyjało powstawaniu na ich obszarze wielu potężnych państw. Po upadku imperium Pagan i osłabieniu królestwa Ava tylko kwestią czasu było pojawienie się nowej potęgi. Na szczęście zjednoczenie Birmy nie powiodło się, dzięki czemu mogliśmy wkroczyć i podporządkować sobie tamtejsze państwa, zanim zdołały stawić opór."
 flavor_mug.7.a: "Birma należy teraz do nas!"
 flavor_mug.8.t: "Zmiana taktyki"
 flavor_mug.8.d: "Nasza armia składa się z wielu różnych rodzajów wojsk i formacji, dzięki czemu słyniemy z potęgi militarnej, zwłaszcza siły ognia. Oprócz słynnej artylerii budzi jednak postrach również nasza kawaleria. Jesteśmy ponadto indyjskim imperium, co pozwala nam wykorzystywać w wojsku słonie – siłę, której niewiele okolicznych państw może dorównać."
 flavor_mug.8.a: "Powinniśmy skupić się na kawalerii."
 flavor_mug.8.b: "Niech nasze słonie strat urują wrogów."
 flavor_mug.9.t: "Ukryte"
 flavor_mug.9.d: "To ukryte wydarzenie."
 flavor_mug.9.a: "Ukryte."
 flavor_mug.10.t: "Nowa stolica?"
 flavor_mug.10.d: "Niedawna rozbudowa [mug_proposed_capital.GetName] stworzyła przed [Root.Monarch.GetName] możliwość przeniesienia stolicy i rozpoczęcia nowej epoki w dziejach państwa. Tak wielka zmiana umocniłaby władzę [Root.Monarch.GetTitle] i umożliwiła powstanie nowej elity."
 flavor_mug.10.a: "Tak, przystąpmy do działania."
 flavor_mug.10.b: "Pozostańmy przy obecnym dworze."
 flavor_mug.11.t: "Din-i Ilahi"
 flavor_mug.11.d: "[Root.Monarch.GetTitle] [Root.Monarch.GetName], zafascynowany dysputami prowadzonymi w Ibadat Chanie, postanowił dokonać radykalnego czynu – [Root.Monarch.GetSheHe] zdecydował się stworzyć nową religię opartą na synkretyzmie, który rozwijał się w Indiach za naszych rządów. Sekta ma wiele nazw, lecz znana jest przede wszystkim jako „Din-i Ilahi”, czyli „Religia Boga”. Wielu dworzan postanowiło przyłączyć się do [Root.Monarch.GetHerHim], nie wiadomo jednak, czy nowa wiara zyska szerokie poparcie. Pewne jest natomiast, że jej przyjęcie umocni pozycję [Root.Monarch.GetTitle]."
 flavor_mug.11.a: "Zaiste, interesujący rozwój wydarzeń."
