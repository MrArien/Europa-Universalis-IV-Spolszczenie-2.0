 GER_unlock_the_hanseatic_doctrine: "Odblokowuje doktrynę morską §YDoktryna hanzeatycka§!, która zapewnia:\\nSiła handlowa okrętów: §G+25,0%§!\\nTradycja morska za ochronę handlu: §G+100,0%§!"
 GER_unlock_cb_on_european_colonists: "Odblokowuje casus belli „§YWyrwij sobie kawałek§!” przeciwko państwom z §Yzachodniej§! lub §Ywschodniej§! grupy technologicznej posiadającym prowincje w §YAfryce§!. Pozwala zajmować ich afrykańskie prowincje za §G75,0%§! normalnego kosztu i agresywnej ekspansji."
 GER_unlock_cb_on_african_natives: "Odblokowuje casus belli „§YWyścig o Afrykę§!” przeciwko afrykańskim ludom tubylczym, pozwalając zajmować ich prowincje za §G90,0%§! normalnego kosztu i agresywnej ekspansji."
 cb_ger_claim_a_piece: "Zagarnijmy część łupów"
 cb_ger_claim_a_piece_desc: "W Afryce pozostało wiele pozostałości po europejskich imperiach. Zajmijmy część z nich, niezależnie od tego, czy będą duże, czy małe."
 cb_ger_scramble_for_africa: "Wyścig o Afrykę"
 cb_ger_scramble_for_africa_desc: "W Afryce wciąż pozostały ziemie, które można zagarnąć. Wykroimy dla siebie kawałek tego tortu."
