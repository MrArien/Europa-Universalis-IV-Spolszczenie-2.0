 estate_church_religious_tolerance: ""
 estate_church_religious_tolerance_desc: "Zamiast rządzić za pomocą praw religijnych, powinniśmy promować bardziej tolerancyjne społeczeństwo, aby nie musieć narzucać naszej wiary na każdym podbitym terytorium."
 estate_nomadic_tribes_nomadic_caravans: "Karawany koczownicze"
 estate_nomadic_tribes_nomadic_caravans_desc: "Utrzymując lojalność naszych plemion i wysoką jedność ordy, możemy zapewnić bezpieczeństwo karawanom przemierzającym nasze państwo."
 estate_nomadic_tribes_tribal_absolutism: "Absolutyzm plemienny"
 estate_nomadic_tribes_tribal_absolutism_desc: "Wprowadzając bardziej absolutystyczny sposób rządzenia, możemy skuteczniej kontrolować zasoby państwa oraz łupy zdobywane podczas zwycięstw."
 HORDES_TRIBAL_ABSOLUTISM_TT: "Począwszy od §Y60§! maksymalnego absolutyzmu, za każde §Y10§! maksymalnego absolutyzmu otrzymamy §G+5.00%§! dostępnych łupów, maksymalnie §G20.0%§! przy §Y90§! maksymalnego absolutyzmu."
 reaver_personality: "Łupieżca"
 desc_reaver_personality: "Przywódca poszukujący skarbów obcych miast. Nasz władca pragnie zdobywać złoto wyłącznie poprzez plądrowanie licznych wrogów naszego kraju."
 reaver_personality_die_desc: "Dążenie [Root.Monarch.GetHerHisCap] do zdobywania złota wszelkimi sposobami napełniło nasze skarbce."
 unlocked_reaver_personality_flag: "Odblokowano osobowość Łupieżca"
 mongol_brother_realm: "Bratnie państwo mongolskie"
 mongol_brother_realm_long_desc: "Bratnie państwo mongolskie stanowi rozszerzenie naszego państwa. Choć cieszy się większą autonomią niż inne terytoria, wciąż podlega naszej władzy. Ten poddany nie zajmuje miejsca w relacjach dyplomatycznych."
