 incorporate_vassal_desc: "Czy na pewno chcesz włączyć państwo [From.GetName] do naszej administracji? Zmieni to §Y[From.GetName]§! w §Yzintegrowanego wasala§! — typ poddanego, którego §Yaneksja dyplomatyczna§! jest o §G25,0%§! tańsza niż w przypadku zwykłego §Ywasala§!, ale który zmniejsza naszą zdolność administracyjną o §R-100,00§!. Integracja §Y[From.GetName]§! oznacza również, że przed jego §Yaneksją dyplomatyczną§! będziemy musieli odczekać §Y10§! lat.

Integracji §Y[From.GetName]§! nie można cofnąć."
 GER_unlock_diploma_andreanum: "Odblokowuje przywilej stanowy „§YOdnowienie Dyplomu Andreanum§!” dla stanu §Y[Root.GetNobilityName]§!, zapewniający §G-5,0%§! kosztu utrzymania terytoriów oraz — jeśli nasza §Yśrednia autonomia§! wynosi mniej niż §Y25,0%§! — §G+10,0%§! zasobów ludzkich w prowincjach o akceptowanej kulturze."
 GER_low_average_autonomy_buff: "Jeśli nasza §Yśrednia autonomia§! wynosi mniej niż §Y25,0%§!, otrzymamy:
  §G+15,0%§! zasobów ludzkich w prowincjach o akceptowanej kulturze."
 GER_distribute_10_base_tax_5_base_production: "Rozdziel §G10§! podatku bazowego i §G5§! produkcji bazowej pomiędzy nasze prowincje spoza §Ygermańskiej§! grupy kulturowej."
 GER_begin_integrating: "Rozpoczniemy integrację wybranej kultury. Proces zakończy się, gdy §Yjedność kulturowa§! osiągnie poziom §Y100,0§!."
 german_cultural_disunity_reform: "Rozdrobnienie kulturowe"
 german_cultural_disunity_reform_desc: "Stulecia rozdrobnienia pod rządami Świętego Cesarstwa Rzymskiego doprowadziły do głębokiego podziału narodu niemieckiego. Musimy to zmienić."
 GER_unlocked_via_kaiserreich: "Ta reforma została odblokowana dzięki misji „§YKaiserreich§!”."
 german_franconian_reform: "Druk norymberski"
 german_franconian_reform_desc: "Nacisk na upowszechnianie wiedzy wysunął nas na czoło postępu intelektualnego."
 german_westphalian_reform: "Westfalska pobożność"
 german_westphalian_reform_desc: "Westfalia przez długi czas znajdowała się pod rządami biskupstwa Münster. To właśnie w Münster anabaptyści chcieli założyć swoją „Nową Jerozolimę”."
 german_rhenish_reform: "Dyplomacja nadreńska"
 german_rhenish_reform_desc: "Nadrenia, gdzie znajdują się Akwizgran i Frankfurt — dwa ważne miasta cesarskie — oraz czterech elektorów, nauczyła nas prowadzić dyplomację z najwyższą skutecznością."
 german_lower_saxon_reform: "Tradycje morskie"
 german_lower_saxon_reform_desc: "Dolna Saksonia, Pomorze i inflanckie wybrzeże Bałtyku są od powstania Hanzy silnie związane z handlem i morzem. Dlatego jesteśmy panami fal."
 german_prussian_reform: "Armia państwem"
 german_prussian_reform_desc: "Od dziesięcioleci możemy poszczycić się wspaniałymi tradycjami wojskowymi. Rozwijajmy je, by nasza armia budziła strach u każdego, kto odważy się nam przeciwstawić."
 german_austrian_reform: "Cesarskie pochodzenie"
 german_austrian_reform_desc: "Bliskość cesarskiego centrum nauczyła nas wielu rzeczy o dyplomacji."
 german_saxon_reform: "Saksońskie górnictwo"
 german_saxon_reform_desc: "Na przestrzeni stuleci górnikom przyznano liczne przywileje i przywileje prawne, dzięki którym Saksonia znalazła się w czołówce wczesnej industrializacji."
 german_bavarian_reform: "Bawarska duma"
 german_bavarian_reform_desc: "Bawaria, będąca ojczyzną wielu regionalnych tradycji i odrębnej kultury, jest znana daleko poza granicami Niemiec."
 german_swiss_reform: "Szwajcarscy landsknechci"
 german_swiss_reform_desc: "Szwajcaria jest regionem niezwykle trudnym do zdobycia, a jednym z jej największych towarów eksportowych są — ku zaskoczeniu wielu — najemnicy. Papież nieustannie korzysta ze szwajcarskich oddziałów, podobnie jak wiele państw Europy. Będziemy nadal świadczyć takie usługi innym i sobie samym."
 german_swabian_reform: "Bankowość Fuggerów"
 german_swabian_reform_desc: "Augsburg jest siedzibą słynnej rodziny Fuggerów, bankierów Świętych Cesarzy Rzymskich i papieży. Kontynuujemy tę tradycję jako bankierzy Europy. Nie obawiajcie się — z pewnością nie zaoferujemy wam pożyczek, które doprowadzą waszą gospodarkę do ruiny."
 german_other_reform: "Cesarstwo Niemieckie"
 german_other_reform_desc: "Władamy potężnym imperium w sercu Europy. Żadne państwo nie może nam się przeciwstawić."
 GER_pick_culture_to_integrate_title: "Wybierz kulturę do integracji"
 GER_pick_culture_to_integrate_desc: "Obecnie nie integrujemy żadnej kultury. Najwyższy czas to zmienić."
 GER_economic_influence: "Wpływy gospodarcze"
 desc_GER_economic_influence: "Potężna gospodarka, powiązana z gospodarkami naszych sąsiadów, pozwala nam wywierać na nich presję ekonomiczną."
 GER_destruction_of_france: "Traktat frankfurcki"
 desc_GER_destruction_of_france: "Francja była jednym z największych przeciwników zjednoczenia Niemiec. Jej klęska pozwoliła nam wreszcie podpisać traktat uznający powstanie nowego wielkiego mocarstwa."
 GER_blut_and_eisen: "Krew i żelazo"
 desc_GER_blut_and_eisen: "Trzeba powiedzieć jasno: o wielkich problemach naszych czasów nie zdecyduje dyplomacja, lecz krew i żelazo."
 GER_shadow_kingdom: "Królestwo wyłaniające się z cienia"
 desc_GER_shadow_kingdom: "Przywróciliśmy Italię do Świętego Cesarstwa Rzymskiego."
 GER_enemies_remain_divided: "Podzielone Włochy są bezpieczniejsze"
 desc_GER_enemies_remain_divided: "Aby zabezpieczyć naszą nowo zdobytą pozycję na arenie międzynarodowej, powinniśmy utrzymać podział Italii."
 GER_hanseatic_doctrine_upgrade: "Ulepszenie doktryny hanzeatyckiej"
 desc_GER_hanseatic_doctrine_upgrade: "Przez lata udoskonalaliśmy naszą doktrynę morską."
 GER_doctrine_of_the_navy: "Flota kupiecka"
 desc_GER_doctrine_of_the_navy: "Naszym ostatecznym celem na morzach jest zbudowanie globalnego imperium połączonego siecią szlaków handlowych."
 GER_wilhelmshaven_modifier: "Port floty Morza Północnego"
 desc_GER_wilhelmshaven_modifier: "Port w tej prowincji został specjalnie rozbudowany z myślą o obsłudze naszej floty na Morzu Północnym."
 GER_resolved_the_border_dispute: "Rozwiązano spór graniczny"
 desc_GER_resolved_the_border_dispute: "Między Królestwem Danii a niemieckim Świętym Cesarstwem Rzymskim od dawna trwał spór graniczny. Odziedziczyliśmy go i ostatecznie rozwiązaliśmy."
 GER_passage_through_the_sound: "Nowe porty na Bałtyku"
 GER_ostsee: "Kontrola nad Bałtykiem"
 GER_max_abso: "Żelazna pięść"
 desc_GER_max_abso: "Nasz kanclerz rządzi żelazną ręką, wzmacniając autorytet cesarza."
 GER_industrialization_rhineland: "Industrializacja Nadrenii"
 desc_GER_industrialization_rhineland: "Rozbudowa przemysłu w Nadrenii wysunęła nas na czoło europejskiej produkcji."
 GER_industrialization_silesia: "Industrializacja Śląska"
 desc_GER_industrialization_silesia: "Górny Śląsk jest naszym drugim najważniejszym ośrodkiem przemysłowym."
 GER_industrialization: "Niemiecka industrializacja"
 desc_GER_industrialization: "Staliśmy się przemysłowym gigantem."
 GER_one_province_gets_converted: "Jeśli to możliwe, jedna losowa §Ypolska§! prowincja zmieni kulturę na §Ypruską§! lub §Ysaską§!."
 GER_merge_industrial_modifier_into_one: "Połącz modyfikatory „§YIndustrializacja Nadrenii§!” i „§YIndustrializacja Śląska§!” w jeden — „§YNiemiecka industrializacja§!” — i zmodyfikuj go następująco:\n  Wydajność produkcji: §G+5,0%§!\n  Koszt rozwoju: §G-5,0%§!"
 GER_guard_upgrade: "Walka o rewolucję"
 desc_GER_guard_upgrade: "Nasza gwardia jest gotowa walczyć do upadłego, by podtrzymać płomień rewolucji."
 GER_revolutionary: "Płomienie rewolucji"
 desc_GER_revolutionary: "Szlachta wystarczająco długo nas uciskała. Czas zrzucić jej kajdany!"
 GER_rapid_industrialization: "Gwałtowna industrializacja"
 desc_GER_rapid_industrialization: "Wkraczamy w okres szybkiego rozwoju. Miasteczka przekształcają się w miasta, które wyrastają w każdym zakątku kraju."
 GER_mining_provinces_saxon: "Przywileje górnicze"
 desc_GER_mining_provinces_saxon: "Od stuleci przyznajemy górnikom specjalne przywileje, zwiększające wydobycie w kopalniach."
 GER_paper_provinces_franconian: "Frankoński druk"
 desc_GER_paper_provinces_franconian: "Ta prowincja wspiera upowszechnianie wiedzy za pośrednictwem druku."
 GER_refused_to_renew_diploma_andreanum: "Odmówiono odnowienia Dyplomu Andreanum"
 desc_GER_refused_to_renew_diploma_andreanum: "Odmowa odnowienia przywileju wysłała jasny sygnał: zamierzamy integrować nowe terytoria z najwyższą tolerancją."
 GER_transylvanian_saxon_minority: "Mniejszość siedmiogrodzkich Sasów"
 desc_GER_transylvanian_saxon_minority: "W prowincji żyje mniejszość „siedmiogrodzkich Sasów” — potomków germańskich osadników, którzy przybyli tu w XIII wieku."
 GER_defeated_habsburgs: "Pokonano Habsburgów"
 desc_GER_defeated_habsburgs: "Klęska Habsburgów, od dawna dzierżących godność cesarzy Świętego Cesarstwa Rzymskiego, wyprowadza południowych Niemców poza obręb cesarstwa, umożliwiając ich szybszą integrację."
 GER_major_city: "Ważne miasto"
 desc_GER_major_city: "W tej prowincji znajduje się ważne miasto, które przeżywa rozkwit dzięki postępującej urbanizacji."
 GER_a_turn_inwards: "Zwrot ku własnej gospodarce"
 desc_GER_a_turn_inwards: "Elity państwowe pokładają nadzieję na przyszłość gospodarki w rodzimych zasobach, a nie w zagranicznych partnerach."
 GER_fight_against_the_catholic_church: "Walka z Kościołem katolickim"
 desc_GER_fight_against_the_catholic_church: "Polski Kościół katolicki i jego rozległe wpływy stanowią zagrożenie dla państwa."
 GER_stopping_polish_independence_drive: "Powstrzymanie polskich dążeń niepodległościowych"
 desc_GER_stopping_polish_independence_drive: "Mimo wspólnej religii Polacy pozostają odrębnym narodem, silnie dążącym do niepodległości."
 GER_marienburg_castle_seized: "Zdobycie zamku w Malborku"
 desc_GER_marienburg_castle_seized: "Zamek w Malborku, symbol zakonu krzyżackiego aż do jego nieszczęsnego upadku, został zdobyty i góruje teraz nad Prusami Wschodnimi."
 GER_privilege_slot: "Poparcie junkrów"
 desc_GER_privilege_slot: "Pozyskaliśmy poparcie szlachty."
 GER_extra_prov_trade_power: "Część niemieckiej unii celnej"
 GER_early_coal_mining: "Wczesne wydobycie węgla"
 desc_GER_early_coal_mining: "W tej prowincji znajduje się kopalnia węgla, choć jej wydobycie nie służy jeszcze celom przemysłowym."
 GER_treaty_port: "Port traktatowy"
 desc_GER_treaty_port: "Ta prowincja jest niemieckim portem traktatowym, zapewniającym znaczne korzyści handlowe mimo niewielkich rozmiarów."
 GER_diplomatic_revolution: "Rewolucja dyplomatyczna"
 desc_GER_diplomatic_revolution: "Musimy wytyczyć nowy kierunek naszej polityki."
 GER_the_reform_is_unlocked: "Powyższa §Yreforma§! została odblokowana, ale nie została przyjęta."
 GER_staying_in_lubeck: "Pozostanie w Lubece"
 desc_GER_staying_in_lubeck: "Postanowiliśmy przedkładać własne porty ponad wszystkie inne."
 GER_accepted_cultures: "\\nLiczba kultur zintegrowanych z §Yjednością kulturową§!"
 cultural_unity_gain_modifier: "Modyfikator przyrostu jedności kulturowej"
 monthly_cultural_unity: "Miesięczna jedność kulturowa"
 cultural_unity_desc: "§YJedność kulturowa§! określa stopień integracji danej kultury z naszym państwem. Aby uznać kulturę za zintegrowaną, jej §Yjedność kulturowa§! musi osiągnąć 100. Po integracji kultura nie zajmuje już miejsca w limicie §Ykultur akceptowanych§!, a przy odpowiednim poziomie §Yintegracji§! możemy utworzyć §Yunię kulturową§!. Z czasem misja „§YZaufaj sąsiadowi§!” pozwoli nam usunąć brak §Yunii kulturowej§!. Aby rozpocząć §Yintegrację§! kultury, należy skorzystać z decyzji „§YWybierz kulturę do integracji§!”.\n\nPrzyrost jedności kulturowej:\nPodstawa: §G+0,83§! miesięcznie.\nKultura docelowa jest akceptowana: §G+0,33§! miesięcznie.\nStabilność: od §R-0,3§! do §G+0,3§! miesięcznie.\nRozwój prowincji kultury docelowej: §G+1,50§! za każdy punkt rozwoju.\nBrak przynależności do germańskiej grupy kulturowej: §R-1,00§!\nBrak integracji kultury: §R-1,00§!\nPokój: §G+0,1§!\nWyczerpanie wojenne: §R-0,05§! za każdy punkt wyczerpania wojennego.\nJedność religijna: §G+0,1§! przy 100,0%.\nPrawowitość: od §R-0,1§! do §G+0,1§!.\nUkończone idee dworskie: §G+0,5§!\n\n"
 ability_cultural_unity_mechanic: "Mechanika jedności kulturowej"
 GET_can_integrate_a_culture: "Istnieje §yniemiecka§! kultura, która może być §Yzintegrowana§!."
 GER_not_integrating_a_culture: "Obecnie nie trwa §Yintegracja§! żadnej kultury."
 GER_until_demotion: "do momentu zdegradowania tej §Ykultury§!"
 GER_prussian_modifier: "Zintegrowana kultura: Pruska"
 desc_GER_prussian_modifier: "Zintegrowana kultura: pruska"
 GER_lower_saxon_modifier: "Zintegrowana kultura: dolnosaksońska"
 desc_GER_lower_saxon_modifier: "Zintegrowana kultura: dolnosaksońska"
 GER_hannoverian_modifier: "Zintegrowana kultura: westfalska"
 desc_GER_hannoverian_modifier: "Zintegrowana kultura: westfalska"
 GER_hessian_modifier: "Zintegrowana kultura: nadreńska"
 desc_GER_hessian_modifier: "Zintegrowana kultura: nadreńska"
 GER_saxon_modifier: "Zintegrowana kultura: Saksońska"
 desc_GER_saxon_modifier: "Zintegrowana kultura: saska"
 GER_franconian_modifier: "Zintegrowana kultura: frankońska"
 desc_GER_franconian_modifier: "Zintegrowana kultura: frankońska"
 GER_swabian_modifier: "Zintegrowana kultura: szwabska"
 desc_GER_swabian_modifier: "Zintegrowana kultura: szwabska"
 GER_swiss_modifier: "Zintegrowana kultura: Szwajcarska"
 desc_GER_swiss_modifier: "Zintegrowana kultura: szwajcarska"
 GER_bavarian_modifier: "Zintegrowana kultura: Bawarska"
 desc_GER_bavarian_modifier: "Zintegrowana kultura: bawarska"
 GER_austrian_modifier: "Zintegrowana kultura: Austriacka"
 desc_GER_austrian_modifier: "Zintegrowana kultura: austriacka"
 GER_pommeranian_modifier: "Zintegrowana kultura: Pomorska"
 desc_GER_pommeranian_modifier: "Zintegrowana kultura: pomorska"
 GER_intervene_in_war_pp: "Interweniowano w wojne"
 GER_crushed_revolution: "Zgnieciona rewolucja"
 GER_upgrade_marienburg: "Jeśli pomnik „§YZamek w Malborku§!” nie osiągnął co najmniej §Yznaczącego§! poziomu, zostanie ulepszony do tego poziomu."
 GER_upgrade_traders: "Doradcy typu „§YKupiec§!” będą teraz dodatkowo zapewniać §G+5,0%§! krajowej siły handlowej na każdy poziom doradcy."
 flavor_ger.1.t: "Wybór naszych portów handlowych"
 flavor_ger.1.d: "Podbój portów handlowych w Niderlandach zapewnił nam terytorium doskonale nadające się do zdobycia światowej dominacji na morzu. Holendrzy odcisnęli swoje piętno na światowych finansach, a ich dawne porty przyciągają wielu kupców i cieszą się większym powodzeniem niż choćby Lubeka czy Hamburg."
 flavor_ger.1.a: "Umocnijmy naszą obecność na holenderskim wybrzeżu."
 flavor_ger.1.b: "Zajmijmy się naszymi północnymi portami."
 flavor_ger.2.t: "Triumfalny przemarsz przez Paryż"
 flavor_ger.2.d: "Francuzi od dawna zaciekle sprzeciwiali się zjednoczeniu narodu niemieckiego. Dziś, po ich druzgocącej klęsce, wojska niemieckie maszerują w chwale ulicami Paryża i wzdłuż Sekwany, a wieść o podpisaniu traktatu obiega kraj. Na mocy tego porozumienia pozostałe rozdrobnione państwa niemieckie zostaną włączone do naszego państwa, przybliżając nas o kolejny krok do zjednoczenia ojczyzny."
 flavor_ger.2.a: "Dziś ucztujemy w Wersalu!"
 flavor_ger.4.t: "Rozbiory Polski"
 flavor_ger.4.d: "Polacy zawsze chętnie sprzymierzali się z naszymi wrogami, dlatego odpłaciliśmy im pięknym za nadobne, odrywając wraz z naszymi sojusznikami znaczne połacie ich państwa. W granicach naszego kraju pozostała teraz silnie odrębna, lecz zjednoczona mniejszość, która pragnie wyzwolić się spod naszego panowania."
 flavor_ger.4.a: "Ich katolickie obyczaje zagrażają naszej stabilności."
 flavor_ger.4.b: "Powściągniemy ich separatyzm dzięki tolerancji."
 flavor_ger.5.t: "Dyplom Andreanum"
 flavor_ger.5.d: "W 1224 roku król Węgier nadał siedmiogrodzkim Sasom przywilej osadniczy, zezwalający im na swobodne osiedlanie się w Siedmiogrodzie w okresie szczytowego rozwoju niemieckiego osadnictwa na wschodzie, znanego jako Ostsiedlung. Moglibyśmy odnowić ten dokument i przyznać [Root.GetNobilityName] nowy zestaw przywilejów, ułatwiających zarządzanie podbitymi terytoriami oraz ich zasiedlanie."
 flavor_ger.5.a: "Odnowimy przywilej."
 flavor_ger.5.b: "To nie XIII wiek."
 flavor_ger.6.t: "Królestwo cieni"
 flavor_ger.6.d: "W XV wieku znaczna część Włoch odłączyła się od Cesarstwa, ponieważ cesarze z dynastii Habsburgów byli zbyt oderwani od potrzeb włoskich książąt. Dziś królestwo przestaje pozostawać w cieniu, a północne Włochy ponownie zostają włączone do Świętego Cesarstwa Rzymskiego."
 flavor_ger.6.a: "Królestwo dostąpiło oświecenia."
 flavor_ger.7.t: "Wyścig o Afrykę"
 flavor_ger.7.d: "Znaczna część Afryki została już zajęta lub podbita przez obce mocarstwa. Musimy pospieszyć się z udziałem w wyścigu kolonialnym, zanim zabraknie ziem, które można jeszcze podzielić. Na tym bogatym w zasoby kontynencie istnieje wiele dogodnych miejsc do rozpoczęcia ekspansji, w tym pozostałości imperiów kolonialnych, które nie przetrwały próby czasu."
 flavor_ger.7.a: "Powinniśmy wykorzystać słabość jednego z podupadłych imperiów."
 flavor_ger.7.b: "Znajdziemy dla siebie niezasiedlone terytorium."
 flavor_ger.8.t: "Wybitni mężowie stanu"
 flavor_ger.8.d: "Epoka wielkich monarchów powoli dobiega końca. W dzisiejszych czasach każdemu potężnemu cesarzowi towarzyszą wpływowi i charyzmatyczni mężowie stanu, których kariery kształtują politykę oraz historię narodu. W obecnych okolicznościach [Root.Monarch.GetName] powinien wybrać osobę, która będzie wspierać [Root.Monarch.GetHerHim] w sprawowaniu [Root.Monarch.GetHerHis] rządów."
 flavor_ger.8.a: "Nasz mąż stanu powinien rządzić żelazną ręką."
 flavor_ger.8.b: "Potrzebujemy ich płomiennych przemówień!"
 flavor_ger.8.c: "Przede wszystkim potrzebujemy sprawnego administratora."
 flavor_ger.9.t: "Zjednoczenie Niemiec"
 flavor_ger.9.d: "Wieki rozdrobnienia i decentralizacji doprowadziły do powstania głębokich różnic regionalnych w obrębie Niemiec. Lokalne animozje wciąż trwają, a mieszkaniec północy rzadko zgadza się z mieszkańcem południa. Nadszedł czas, by ujednolicić język niemiecki i pogodzić zwaśnione społeczności. Czas zakończyć epokę podziałów."
 flavor_ger.9.pommeranian: "Zintegrujmy §YPomorzan§!."
 flavor_ger.9.austrian: "Zintegrujmy §YAustriaków§!."
 flavor_ger.9.bavarian: "Zintegrujmy §YBawarczyków§!."
 flavor_ger.9.swiss: "Zintegrujmy §YSzwajcarów§!."
 flavor_ger.9.swabian: "Zintegrujmy §YSzwabów§!."
 flavor_ger.9.franconian: "Zintegrujmy §YFrankończyków§!."
 flavor_ger.9.saxon: "Zintegrujmy §YSasów§!."
 flavor_ger.9.prussian: "Zintegrujmy §YPrusaków§!."
 flavor_ger.9.hessian: "Zintegrujmy §YNadreńczyków§!."
 flavor_ger.9.hannoverian: "Zintegrujmy §YWestfalczyków§!."
 flavor_ger.9.lower_saxon: "Zintegrujmy §YDolnych Sasów§!."
 flavor_ger.10.t: "Integracja kultury"
 flavor_ger.10.d: "Podobno każdego dnia jakaś niemiecka rodzina rozwiązuje swoje spory. Podobno pod naszymi rządami Niemcy zaczęli ufać swoim sąsiadom. Dziś możemy z dumą powiedzieć, że kolejna rodzina, a nawet cała kultura, została wreszcie włączona do naszej wielkiej wspólnoty."
 flavor_ger.10.a: "Doskonałe wieści."
 flavor_ger.11.t: "Cesarstwo Niemieckie"
 flavor_ger.11.d: "Z niepozornych początków wyrasta imperium. Jeszcze kilka stuleci temu było całkowicie rozdrobnione i podzielone, dziś zaś stoi zjednoczone i silniejsze niż kiedykolwiek. Zachwiało całym układem sił w Europie i stało się potęgą, z którą należy się liczyć. Warto przyjrzeć się tradycjom, które doprowadziły nas do tej zaszczytnej pozycji."
 flavor_ger.11.a: "Pielęgnujmy nasze korzenie!"
 flavor_ger.11.b: "Zaczekamy."
 flavor_ger.11.c: "Mamy inne plany."
 JHC_GER_lowlands_title: "Zabezpiecz Niderlandy"
 JHC_GER_lowlands_desc: "Dążenia niepodległościowe Niderlandów muszą zostać stłumione. Nie wystarczy podporządkować sobie Kraje Niskie — musimy również bezpośrednio je okupować i objąć je naszymi silnymi rządami."
 JHC_GER_rhineland_title: "Uprzemysłowienie Nadrenii"
 JHC_GER_rhineland_desc: "Nadrenia ma potencjał, by stać się wielkim ośrodkiem przemysłowym. Nie możemy go zmarnować. Powinniśmy dokonać znacznych inwestycji w zakłady produkcyjne tego regionu."
 JHC_GER_education_title: "Kształcenie obowiązkowe"
 JHC_GER_education_desc: "Każde dziecko w naszym państwie powinno mieć obowiązek uczęszczania do niemieckiej szkoły. Zapewni to nie tylko wykształconą siłę roboczą, lecz także zaszczepi młodzieży właściwe niemieckie wartości i język."
 JHC_GER_blood_and_iron_title: "Krew i żelazo"
 JHC_GER_blood_and_iron_desc: "Książęta, którzy dotąd opierali się naszym rządom, muszą zostać włączeni w struktury państwa. Zjednoczenie Niemiec wymaga czegoś więcej niż łagodnej perswazji — potrzebujemy polityki siły i użycia potęgi militarnej."
 JHC_GER_urbanization_title: "Promuj urbanizację"
 JHC_GER_urbanization_desc: "Liczne małe miasteczka rozsiane po niemieckich ziemiach muszą przekształcić się we wspaniałe miasta, z których każde będzie ośrodkiem kultury i handlu."
 JHC_GER_dominant_economy_title: "Dominująca gospodarka"
 JHC_GER_dominant_economy_desc: "Gospodarka [Root.GetAdjective] musi stać się największą w całej Europie. Jeśli w pełni wykorzystamy potencjał naszego państwa, inne narody nie będą w stanie dorównać naszemu bogactwu."
 JHC_GER_chancellorship_title: "Ustanowienie urzędu kanclerza"
 JHC_GER_chancellorship_desc: "[Root.GetName] nie może polegać wyłącznie na umiejętnościach [Root.Monarch.GetTitle]. Nasze państwo potrzebuje sprawnego gabinetu ministrów, któremu można właściwie delegować zarządzanie krajem. Ministrowie muszą mieć silnego przywódcę koordynującego ich działania. Powinniśmy ustanowić urząd kanclerza, który zapewni takie przywództwo."
 JHC_GER_junkers_title: "Kontroluj junkerów"
 JHC_GER_junkers_desc: "Ziemiańska szlachta, czyli junkrzy, ma ogromny wpływ na państwo [Root.GetAdjective]. Musimy poskromić tych możnych i zmusić ich do służby narodowi, zamiast pozwalać im czerpać z niego przywileje."
 JHC_GER_kaiserreich_title: "Kaiserreich"
 JHC_GER_kaiserreich_desc: "Cesarstwo Niemieckie przyćmi wszystkie pozostałe. Los świata będzie spoczywał wyłącznie w naszych rękach."
 JHC_GER_italy_title: "Inwazja na Włochy"
 JHC_GER_italy_desc: "Od czasów Karolingów losy Niemiec i Włoch są ze sobą splecione. Nadszedł czas, by przywrócić niemiecką hegemonię nad Italią."
 JHC_GER_protected_markets_title: "Chronione rynki"
 JHC_GER_protected_markets_desc: "Zyski z handlu niemieckimi towarami powinny przypadać Niemcom i niemieckim państwom. Musimy podjąć działania, by chronić niemieckie rynki przed zagraniczną ingerencją."
 JHC_GER_imperial_navy_title: "Cesarska flota"
 JHC_GER_imperial_navy_desc: "Żadne niemieckie państwo nie odniosło dotąd większych sukcesów w walce na morzu. Powinniśmy zbudować flotę ciężkich okrętów wojennych, aby to zmienić."
 JHC_GER_overseas_empire_title: "Imperium zamorskie"
 JHC_GER_overseas_empire_desc: "Powinniśmy wykorzystać nasze faktorie handlowe w Afryce jako przyczółek do rozszerzenia wpływów na Daleki Wschód. Bogactwa Chin czekają na nas!"
 JHC_GER_poland_title: "Anektuj Polskę"
 JHC_GER_poland_desc: "Żyzne ziemie uprawne Polski mogłyby przynosić ogromne zyski i wyżywić wielu mieszkańców naszego państwa, gdybyśmy wyrwali je spod nieudolnych rządów naszych wrogów. Powinniśmy najechać Polskę i zdobyć jak najwięcej tych urodzajnych ziem."
 JHC_GER_holy_state_title: "Państwo Kościelne"
 JHC_GER_holy_state_desc: "Nowo zjednoczone Cesarstwo musi dowieść swojego przywiązania do Wiary. Musimy ogłosić światu, że będziemy bronić religii [Root.Religion.GetName] za wszelką cenę."
 JHC_GER_roman_politics_title: "Rezolucja rzymska"
 JHC_GER_roman_politics_desc: "Kościół rzymski wywiera wpływ na Cesarstwo od samego początku jego istnienia, a napięcia między papieżem i cesarzem nigdy nie zostały naprawdę rozwiązane. Musimy wymusić rozstrzygnięcie tej kwestii, nawet jeśli będziemy musieli wkroczyć z armią do samego Rzymu."
 JHC_GER_centralized_empire_title: "Centralizacja cesarstwa"
 JHC_GER_centralized_empire_desc: "Skoro kwestie wiary zostały rozwiązane zgodnie z naszymi oczekiwaniami, musimy zadbać o przyszłość Świętego Cesarstwa Rzymskiego. Książęta zbyt długo cieszyli się autonomią, lecz teraz, gdy Cesarstwo jest zjednoczone, musimy całkowicie podporządkować sobie każde miasto i każdą wieś. Niech nikt nie ośmieli się twierdzić, że nie jesteśmy Świętym, Rzymskim Cesarstwem!"
 JHC_GER_crush_the_revolution_title: "Zgnieć rewolucję"
 JHC_GER_crush_the_revolution_desc: "Armie politycznych radykałów roją się na ulicach miast Europy. Nie możemy znieść tego zakłócenia naturalnego porządku, dlatego musimy wkroczyć w samo serce tej rewolucji i całkowicie ją zdławić."
 JHC_GER_france_title: "Zaatakuj Francję"
 JHC_GER_france_desc: "Francja od stuleci ma ambicje ekspansjonistyczne w Niemczech. Nie możemy pozwolić tak potężnemu narodowi zagrozić jedności naszego narodu. Zajmijmy się nimi i rozpocznijmy inwazję na Francję!"
 JHC_GER_baltic_title: "Podbój Bałtyku "
 JHC_GER_baltic_desc: "Musimy przejąć bogate porty handlowe Bałtyku i ustanowić w regionie obecność wojskową."
 JHC_GER_scramble_for_africa_title: "Wyścig o Afrykę"
 JHC_GER_scramble_for_africa_desc: "Europejskie mocarstwa ścigają się w zdobywaniu przyczółków w Afryce, głównie po to, by rozszerzyć swoje wpływy na Wschód. [Root.GetName] nie może pozostać bez własnych posiadłości afrykańskich, dlatego musimy zorganizować wyprawę!"
 JHC_GER_concert_of_europe_title: "Jednomyślność Europy"
 JHC_GER_concert_of_europe_desc: "Dyplomację europejską zdominowała troska o równowagę sił. Coraz mniej wielkich państw decyduje o sprawach całego kontynentu. Niemcy muszą znaleźć się wśród tych mocarstw i wywalczyć sobie miejsce na światowej scenie."
 JHC_GER_caprathian_conquest_title: "Podbój Karpat"
 JHC_GER_caprathian_conquest_desc: "Królestwo Węgier stało się polem bitwy w rywalizacji wielkich mocarstw. Musimy poprowadzić nasze armie nad Dunaj i w Karpaty, by wysunąć własne roszczenia do tego regionu, zanim przejmą go nasi oportunistyczni rywale."
 JHC_GER_burn_the_wooden_wall_title: "Spal drewniany mur"
 JHC_GER_burn_the_wooden_wall_desc: "Królewska Marynarka Wojenna Wysp Brytyjskich pozwala Anglikom projektować siłę na całym świecie, a przede wszystkim w Niemczech. Musimy położyć kres ich ingerencji i spalić ich drewniany mur na popiół, który opadnie na dno oceanu!"
 ven_embrace_neoplatonism_title: "Przyjmij neoplatonizm"
 ven_embrace_neoplatonism_desc: "Fala renesansu, złotej ery artystycznego i intelektualnego rozkwitu naszego półwyspu, daje nam doskonałą sposobność, by zapisać się na kartach historii złotymi zgłoskami. Powinniśmy dążyć do tego, by stać się ośrodkiem wiedzy, sztuki i najwyższych form twórczości."
 ven_scales_of_power_title: "Układ sił"
 ven_scales_of_power_desc: "W drugiej połowie XV wieku władza doży Wenecji jest stosunkowo ograniczona. Ustrój Republiki Weneckiej ewoluował w kierunku bardziej zdecentralizowanego systemu, w którym znaczące wpływy posiadają Rada Dziesięciu oraz rozmaite rody szlacheckie. Doża pełni przede wszystkim funkcję reprezentacyjną, występując w imieniu Wenecji podczas oficjalnych uroczystości i wykonując obowiązki ceremonialne. Jeśli chcemy przejąć kontrolę nad sprawami wewnętrznymi, ten stan rzeczy musi się zmienić."
 ven_standing_army_mission_1_title: "[ROOT.GetPreviewColorVEN]System Cernidy[ROOT.GetPreviewColorVEN_end]"
 ven_standing_army_mission_1_desc: "Aby chronić naszych obywateli przed zagrożeniami z zewnątrz, nie możemy całkowicie polegać na wojskach wystawianych przez wpływowych lokalnych możnych. Powinniśmy zamiast tego rozwinąć i udoskonalić system milicji złożonej z doświadczonych żołnierzy."
 ven_standing_army_mission_2_title: "[ROOT.GetPreviewColorVEN]Taktyka nowoczesnej wojny[ROOT.GetPreviewColorVEN_end]"
 ven_standing_army_mission_2_desc: "Pola bitew i taktyka zmieniają się z upływem lat. Epoka łuku ustąpiła miejsca muszkietowi, a epoka konnicy powoli ustępuje prochowi. Musimy nadążać za tymi przemianami i zadbać, by nasza armia była jak najlepiej wyszkolona i zdyscyplinowana, inaczej padniemy ofiarą rywali."
 ven_mercenary_army_mission_1_title: "[ROOT.GetPreviewColorVEN]Udoskonalenie kondotierów[ROOT.GetPreviewColorVEN_end]"
 ven_mercenary_army_mission_1_desc: "Wojny są niewątpliwie wielką tragedią dla ludności. Prowadzą jednak również do zmian ustrojowych i przetasowań geopolitycznych w naszym otoczeniu. Wykorzystajmy tę sytuację i czerpmy korzyści z utworzenia podstawowego systemu opłacanych najemników, którzy będą chronić naszych obywateli."
 ven_mercenary_army_mission_2_title: "[ROOT.GetPreviewColorVEN]Zawodowi wojacy[ROOT.GetPreviewColorVEN_end]"
 ven_mercenary_army_mission_2_desc: "Nasze siły zbrojne tworzą zahartowani żołnierze, którzy przeszli przez najcięższe próby podczas najbardziej brutalnych wojen. Niezłomni i wytrwali, najemnicy ci dniem i nocą strzegą naszej wolności oraz suwerenności."
 ven_navy_mission_1_title: "[ROOT.GetPreviewColorVEN]Władcy mórz[ROOT.GetPreviewColorVEN_end]"
 ven_navy_mission_1_desc: "Marynarze służący w naszej flocie marzą o przemierzaniu siedmiu mórz i odkrywaniu ich tajemnic. Musimy zatem odpowiednio zadbać o nasze siły morskie i rozbudowywać je tam, gdzie uznamy to za stosowne."
 ven_navy_mission_2_title: "[ROOT.GetPreviewColorVEN]Flota pod państwową banderą[ROOT.GetPreviewColorVEN_end]"
 ven_navy_mission_2_desc: "Aby sprostać rosnącym potrzebom na morzu — od patrolowania szlaków żeglugowych po rozprawianie się z bezbronnymi wrogami — potrzebujemy rozbudowanej sieci doków i stoczni, a także silnego komponentu piechoty morskiej w naszych siłach zbrojnych."
 ven_dummy_mission_1_title: "[Root.GetSelectableMissionTitle]"
 ven_dummy_mission_1_desc: "[Root.GetSelectableMissionDescription]"
 ven_dummy_mission_2_title: "[Root.GetSelectableMissionTitle]"
 ven_dummy_mission_2_desc: "[Root.GetSelectableMissionDescription]"
 ven_savoy_title: "Podbój Sabaudii"
 ven_savoy_desc: "Na zachodzie leży niewielkie królestwo strzegące bram do naszego regionu. Jego władza jest słaba, a siły słabną w obliczu potężnego przeciwnika z zewnątrz. Musimy czym prędzej przejąć jego ziemie!"
 ven_aden_trade_title: "Rynki Adenu"
 ven_aden_trade_desc: "Słynące z centralnego położenia na szlakach handlu przyprawami i kawą targowiska Adenu oferują jedne z najbardziej poszukiwanych towarów na świecie."
 ven_zanzibar_title: "Ziemie Zanzibaru"
 ven_zanzibar_desc: "Pas wysp i wybrzeży w południowo-wschodniej Afryce obfituje w złoto i kosztowności. Jeśli chcemy rozszerzyć nasze bogactwo i wpływy za granicą, musimy przejąć te ziemie."
 ven_mamluk_suez_title: "Ku Morzu Czerwonemu"
 ven_mamluk_suez_desc: "Niezbadane wody na południe od [2315.GetName] kryją opowieści o chwale, bogactwie i zaszczytnej śmierci. Dążąc do zdobycia majątku i zapisania się na kartach historii, musimy odważyć się wypłynąć na nieznane morza poza granicami naszego władztwa!"
 ven_capital_of_europe_title: "Stolica Europy"
 ven_capital_of_europe_desc: "Nasz kontynent był świadkiem narodzin wielkich wydarzeń historycznych. Powinniśmy zatem zadbać o to, by znalazło się na nim najwspanialsze miasto, i zapisać nasze imię na kartach historii złotymi zgłoskami."
 ven_conquer_italy_title: "Zjednocz Włochy"
 ven_conquer_italy_desc: "Nasz region może poszczycić się wspaniałą historią i niezłomnymi mieszkańcami. Przetrwał niezliczone próby i przeciwności. Powstania tyranów, republik, obcych zdobywców i wielkich uczonych to zaledwie epizody w naszych dziejach. Nadszedł czas, by zjednoczyć ten wspaniały półwysep!"
 ven_exploration_missions_title: "Wyprawy na dalekie morza"
 ven_exploration_missions_desc: "Mówi się, że morza za naszymi wybrzeżami kryją ogromne bogactwa i wiedzę. Musimy je jak najdokładniej zbadać i sporządzić ich mapy."
 ven_triangle_trade_title: "Wyznaczanie nowych szlaków"
 ven_triangle_trade_desc: "Musimy zdobyć pozycję tych, którzy decydują o napływie egzotycznych towarów na europejskie rynki. Dzięki temu w naszych skarbcach z pewnością zgromadzi się ogromne bogactwo."
 ven_global_trade_title: "Globalny handel"
 ven_global_trade_desc: "W miarę jak handel obejmuje cały świat i spaja nasze rynki, musimy przejąć inicjatywę, by znaleźć się w awangardzie produkcji i innowacji."
 ven_san_zanipolo_title: "San Zanipolo"
 ven_san_zanipolo_desc: "Żadne miasto we Włoszech nie może poszczycić się równie wspaniałymi i zachwycającymi cudami architektury co nasza stolica. Powinniśmy wznieść monumentalne budowle ku chwale naszej wiary i pobożności, świadczące o naszej potędze i bogactwie."
 ven_of_wealth_and_power_title: "Bogactwo i potęga"
 ven_of_wealth_and_power_desc: "Niewiele państw w dziejach naszego władztwa osiągnęło porównywalny poziom bogactwa, przepychu i potęgi. Z dumą zajmiemy najwyższe miejsce wśród mocarstw i zdobędziemy siłę pozwalającą decydować o losach całego kontynentu."
 ven_army_republic_title: "Armia republiki"
 ven_army_republic_desc: "Ostatnie dwa stulecia przyniosły naszemu półwyspowi najazdy licznych zdobywców i tyranów. Musimy chronić nasze ideały i naszych obywateli!"
 ven_genoa_title: "Dawne waśnie"
 ven_genoa_desc: "Genueńczycy od dawna są cierniem w naszym boku, zagarniając nasze bogactwa i handel, by samemu się wzbogacać. Musimy położyć temu kres!"
 ven_reach_malacca_title: "Dotrzeć do Malakki"
 ven_reach_malacca_desc: "Odległe porty Malakki podobno kryją nieprzebrane bogactwa i niezliczone możliwości dalszego wzbogacenia naszych kupców."
 ven_spice_islands_title: "W poszukiwaniu przypraw"
 ven_spice_islands_desc: "Legendarne przyprawy z Dalekiego Wschodu od pokoleń wzbogacają kupców i wodzów. Musimy dotrzeć do ich źródeł, a dzięki temu zdobędziemy kontrolę nad światem."
 ven_sempiterni_compagnie_title: "Sempiterni Compagnie"
 ven_sempiterni_compagnie_desc: "Compagnie della Calza, działające w urzekającej atmosferze Wenecji, zawdzięczają nazwę charakterystycznym pończochom noszonym przez członków. Założone w połowie XV wieku stowarzyszenia organizują wystawne uczty, widowiskowe gry i słynne spektakle dla weneckiej szlachty. Ich nazwy nawiązują do cnót lub cechów, a poszczególne grupy wyróżniają się barwą pończoch i haftowanymi inicjałami. Wspaniałe uroczystości, w tym maskarady, wyścigi łodzi i przedstawienia teatralne, odbywają się pośród przepychu Wenecji. Szczególne miejsce zajmuje Festa della Sensa, świętująca związek miasta z morzem poprzez złożone rytuały odprawiane w obecności zagranicznych ambasadorów i dostojników."
 ven_modern_banking_system_title: "Nowoczesny system bankowy"
 ven_modern_banking_system_desc: "Obrót pożyczkami, rzetelna rachunkowość naszych finansów i przepływ pieniądza na rynkach muszą zostać uregulowane dla dobra i pomyślności naszych obywateli oraz kupców, zarówno w kraju, jak i za granicą!"
 ven_academy_of_the_unknowns_title: "Sale wiedzy"
 ven_academy_of_the_unknowns_desc: "Musimy niestrudzenie zgłębiać wiedzę i poszerzać nasze rozumienie otaczającego świata, wznosząc ośrodki nauki będące świadectwem nieustannego rozwoju naszego państwa."
 ven_flagship_title: "Rozwój galei sottile"
 ven_flagship_desc: "Choć nasza pozycja na Adriatyku i całym Morzu Śródziemnym wydaje się dominująca, nie możemy spocząć na laurach. Nieustanne udoskonalanie naszych jednostek morskich ma kluczowe znaczenie dla zachowania stabilności państwa."
 ven_med_power_title: "Morze między lądami"
 ven_med_power_desc: "Morze otaczające nasze władztwo i chroniące ludność przed wrogimi zagrożeniami wymaga mistrzostwa i siły, by je poskromić. Nasza wytrwałość w doskonaleniu nawigacji i handlu zamorskiego zapewni nam niezrównaną wiedzę oraz doświadczenie."
 ven_discover_north_america_title: "Zachodni horyzont"
 ven_discover_north_america_desc: "Na zachodzie rozciąga się ogromny ocean, oddzielający nas od nieprzebranych bogactw. Musimy go przemierzyć i sporządzić mapy dalekich mórz, by lepiej poznać otaczający nas świat."
 ven_china_title: "Porty Kantonu"
 ven_china_desc: "Nasze raporty jasno wskazują na bogactwa zgromadzone w domenie chińskiego cesarza. Porozumienie z nim i dostęp do majątku jego poddanych z pewnością zapewnią nam przewagę na rynkach ojczystych."
 ven_patronize_the_scuole_grandi_title: "Wspieranie Scuole Grandi"
 ven_patronize_the_scuole_grandi_desc: "Podstawy edukacji, służące zachowaniu bezcennej wiedzy, stanowią jedną z cech definiujących nasze społeczeństwo. Kształcenie kolejnego pokolenia to gwarancja naszej przyszłości."
 ven_movable_printing_title: "Druk ruchomą czcionką"
 ven_movable_printing_desc: "Przyszłość wiedzy i jej upowszechniania należy do druku ruchomą czcionką. Powinniśmy finansować naukowe przedsięwzięcia ludzi takich jak Johannes Speyer, tworząc nowy rodzaj drukarstwa. Nasze strategiczne położenie jako ośrodka kultury, handlu i nauki z pewnością pomoże nam zrewolucjonizować rozpowszechnianie drukowanych dzieł."
 ven_circumnavigate_the_globe_title: "Dookoła świata"
 ven_circumnavigate_the_globe_desc: "Nasze władztwo jest rozległe, lecz nie może równać się z ogromem całego świata. Pełnego cudów i legend czekających na odkrycie. Musimy wyruszyć w drogę i zbadać niezwykłe miejsca kryjące się za horyzontem."
 ven_coromandel_title: "Cholamandalam"
 ven_coromandel_desc: "Wybrzeże dawnego, potężnego morskiego imperium Ćolów obfituje w egzotyczne towary i bogate plony najróżniejszych dóbr. Te bogactwa z pewnością wyniosą nasz przepych na nowy poziom."
 wof_ven_promote_the_carnevale_title: "Wypromuj karnawał"
 wof_ven_promote_the_carnevale_desc: "Nasz słynny karnawał sięga 1162 roku i wspaniałego zwycięstwa nad patriarchą Akwilei. Od tamtej pory uroczystości stają się coraz okazalsze, kostiumy coraz bardziej wyszukane, a zabawy coraz bardziej wystawne. Prawdę mówiąc, ich przepych dawno przerósł znaczenie wydarzenia, które upamiętniają, ale możemy to wykorzystać. Im więcej zagranicznych dyplomatów zetknie się z wielkością Carnevale, tym szybciej świat usłyszy o naszym bogactwie."
 wof_ven_this_mythical_realm_title: "Ta mityczna kraina"
 wof_ven_this_mythical_realm_desc: "Handel z Lewantem od dawna przynosi nam bogactwo, lecz odkrycia ujawniły przed nami jeszcze zasobniejszą krainę: Indie. Jeśli uda nam się zdobyć przyczółek na tych bogatych ziemiach na wschodzie, nasi kupcy mogą zgromadzić niewyobrażalne fortuny."
 wof_ven_expand_the_doges_palace_title: "Rozbuduj Pałac Dożów"
 wof_ven_expand_the_doges_palace_desc: "Pałac Dożów był przez stulecia wielokrotnie budowany, odnawiany i przebudowywany. Kolejna rozbudowa, bardziej okazała niż wszystkie wcześniejsze, znacznie podniosłaby prestiż urzędu doży i całej naszej republiki."
 wof_ven_expand_the_terraferma_title: "Poszerz Terrafermę"
 wof_ven_expand_the_terraferma_desc: "Nasza flota chroni spokojną republikę przed atakami od strony morza, lecz nasze lądowe umocnienia pozostawiają wiele do życzenia. Najlepszym rozwiązaniem będzie utworzenie kolejnych terytoriów buforowych, które zmuszą wrogów do pokonania dodatkowych przeszkód, zanim dotrą do stolicy."
 wof_ven_north_italian_rivals_title: "Rywalizacja w północnych Włoszech"
 wof_ven_north_italian_rivals_desc: "Nasze państwo nigdy nie będzie bezpieczne, dopóki zawistni rywale zachowają siłę i możliwość zaatakowania nas w dowolnej chwili. Musimy działać zawczasu i rozgromić naszych wrogów we Włoszech, zanim oni uderzą na nas!"
 wof_ven_challenge_papal_supremacy_title: "Rzuć wyzwanie władzy papieskiej"
 wof_ven_challenge_papal_supremacy_desc: "Od dawna łączy nas z papiestwem pewne porozumienie: papież nie ingerował w sprawy naszych duchownych, a my nie mieszaliśmy się w jego sprawy. Obecnie jednak papiestwo staje się coraz bardziej stanowcze, mimo rosnącej potęgi naszej republiki, i zaczyna ingerować w sprawy Kościoła w całej Europie. Nadszedł czas, by przypomnieć papieżowi o dawnych ustaleniach i powstrzymać jego zakusy na władzę."
 wof_ven_nuova_promissione_ducale_title: "Nowa Promissione Ducale"
 wof_ven_nuova_promissione_ducale_desc: "Promissione Ducale to przysięga urzędowa, którą musi złożyć każdy kandydat na nowego dożę Wenecji. Określa obowiązki doży i granice jego władzy. Z biegiem lat niektóre ograniczenia nieco osłabły. Opracowanie nowej Promissione Ducale, która wyraźniej określi nasze wartości i rolę doży, nie tylko wzmocniłoby nasz ustrój, lecz także zachęciłoby do objęcia urzędu bardziej prawych kandydatów."
 wof_ven_standardize_relazioni_title: "Ujednolić relazioni"
 wof_ven_standardize_relazioni_desc: "Relazioni to raporty, które nasi ambasadorzy przesyłają rządowi, opisując sytuację polityczną, finansową i społeczną państw, w których przebywają. Dokumenty te mają kluczowe znaczenie zarówno dla naszej dyplomacji, jak i utrzymania przewagi naszych kupców za granicą. Coraz częściej jednak ich kopie są publikowane i udostępniane każdemu, kto gotów jest zapłacić wysoką cenę. Zagraża to naszej dyplomacji i bezpieczeństwu. Musimy ukrócić ten proceder i ustanowić jednolity, bezpieczny system sporządzania oraz rozpowszechniania relazioni."
 wof_ven_destroy_austria_title: "Zniszcz Austrię"
 wof_ven_destroy_austria_desc: "Austria od stuleci jest dla nas nieustannym problemem. Jej władcy wielokrotnie nam grozili, próbowali nas przekupić i narzucać nam swoje warunki. Austriackie zagrożenie zniknie dopiero wraz z całkowitą klęską tego państwa. Gdy Austria przestanie być problemem, zniknie jedna z przeszkód na drodze do naszej politycznej i dyplomatycznej dominacji w Europie."
 wof_ven_new_pilings_title: "Nowe pale fundamentowe"
 wof_ven_new_pilings_desc: "Wenecja została wzniesiona na niezliczonych drewnianych palach, z których część liczy sobie już setki lat. Najwyższy czas przeprowadzić niezbędne prace renowacyjne."
 wof_ven_the_francocracy_title: "Frankokracja"
 wof_ven_the_francocracy_desc: "Po czwartej krucjacie ustanowiliśmy kilka państewek na dawnych ziemiach bizantyjskich i przez pewien czas pomagaliśmy utrzymać ich pozycję w regionie. Grecy pogardliwie nazywali te władztwa Frankokracją, czyli rządami Franków, lecz dla nas były użytecznym narzędziem rozszerzania wpływów. To były wspaniałe czasy dla Wenecji. Nadszedł moment, by ponownie zaznaczyć naszą obecność w Konstantynopolu, prawdziwym ośrodku władzy w tej części świata, tym razem odgrywając jednak aktywniejszą rolę w zarządzaniu regionem."
 wof_ven_contest_genoese_trade_title: "Podejmij rywalizację z handlem Genui"
 wof_ven_contest_genoese_trade_desc: "Genua od dawna jest cierniem w naszym boku, a rosnące znaczenie handlu w zachodniej części Morza Śródziemnego tylko wzmacnia jej pozycję i czyni ją jeszcze groźniejszym rywalem. Musimy uderzyć w źródła jej bogactwa — jeśli ograniczymy jej dochody, nie będzie już na tyle zamożna, by poważnie rzucać nam wyzwanie, a my zyskamy sposobność, by jeszcze bardziej ją upokorzyć."
 wof_ven_plague_doctor_training_title: "Szkolenie lekarzy morowych"
 wof_ven_plague_doctor_training_desc: "Lekarze morowi są przeważnie amatorami. Wykwalifikowani lekarze i chirurdzy zajmują się najzamożniejszymi, podczas gdy gorzej przygotowani medycy wędrują po kraju, lecząc tych, których nie stać na najlepszą opiekę. Poziom ich umiejętności jest bardzo zróżnicowany, lecz ustanowienie programu szkoleniowego, który zapewniłby lekarzom morowym podstawowy, jednolity zasób wiedzy, mogłoby znacząco poprawić stan zdrowia mieszkańców prowincji."
 wof_ven_expand_the_arsenal_title: "Rozbuduj Arsenał"
 wof_ven_expand_the_arsenal_desc: "Wenecki Arsenał to czcigodna i niezwykle ważna instytucja, odpowiedzialna za budowę i utrzymanie floty naszej spokojnej republiki. W obecnych niespokojnych czasach musimy zadbać, by Arsenał sprostał stojącym przed nim zadaniom. Zamówmy nową serię okrętów, które wzmocnią naszą marynarkę i zapewnią nam panowanie na morzu na długie lata."
 wof_ven_monopolize_adriatic_trade_title: "Zmonopolizuj handel na Adriatyku"
 wof_ven_monopolize_adriatic_trade_desc: "Wenecja powinna kontrolować handel na całym Adriatyku, co nieuchronnie prowadzi do konfliktu z ambitnym miastem Raguzą."
 wof_ven_reclaim_the_aegean_title: "Odzyskaj Morze Egejskie"
 wof_ven_reclaim_the_aegean_desc: "Od dawna prowadzimy handel we wschodniej części Morza Śródziemnego, lecz zmiana układu sił w Grecji i Azji Mniejszej odbiła się na fortunach naszych kupców. Przywrócenie naszej pozycji na Morzu Egejskim będzie wymagało użycia siły, ale sukces przyniesie nam dobrobyt."
 wof_ven_annex_cyprus_title: "Anektuj Cypr"
 wof_ven_annex_cyprus_desc: "Cypr jest perłą w koronie wschodniej części Morza Śródziemnego. Z tej wyspy moglibyśmy sprawować znakomitą kontrolę nad handlem morskim Lewantu, Anatolii, a nawet Egiptu! Najpierw musimy jednak zdobyć tę wyspę."
 wof_ven_control_the_means_of_transaction_title: "Kontrola nad środkami wymiany"
 wof_ven_control_the_means_of_transaction_desc: "Rozkwit naszego handlu hamują arbitralne decyzje miejscowych władców, którzy nie potrafią docenić pełnych korzyści płynących z naszych wzajemnych układów i upierają się przy tak błahych przeszkodach jak podatki, dopłaty czy nadrzędność własnego prawa nad naszymi przedstawicielami. Jest jasne, że jedynym sposobem rozwiązania tego impasu jest ustanowienie naszej administracji na tych dochodowych ziemiach."
 flavor_ven.40.t: "Mistrz renesansu weneckiego"
 flavor_ven.40.d: "Tycjan, a właściwie Tiziano Vecellio, był wybitnym malarzem włoskiego renesansu, urodzonym w Pieve di Cadore niedaleko Wenecji. Zasłynął mistrzowskim operowaniem barwą i nowatorską techniką pociągnięć pędzla. Jego kariera artystyczna trwała ponad siedem dekad, podczas których stworzył niezliczone dzieła: portrety, sceny mitologiczne i kompozycje religijne. Szczególnym uznaniem cieszą się jego portrety, takie jak „Portret Karola V” i „Wenus z Urbino”, słynące z głębi psychologicznej i bogatej kolorystyki. Wpływ Tycjana na rozwój sztuki weneckiej i europejskiej jest ogromny, a jego trwałe dziedzictwo czyni go jednym z najwybitniejszych malarzy renesansu."
 flavor_ven.40.a: "Cóż za wybitny człowiek!"
 flavor_ven.40.b: "Co jeszcze możesz mi powiedzieć na ten temat?"
 tell_me_more_tt: "
§GOtrzymamy nagrodę za to wydarzenie i poznamy więcej szczegółów na ten temat historyczny§!
"
 flavor_ven.41.t: "Wenecja w okresie renesansu"
 flavor_ven.41.d: "W okresie renesansu sztuka i architektura Wenecji osiągnęły niezwykły poziom wyrafinowania i splendoru. Sztuka wenecka, charakteryzująca się świetlistą kolorystyką i głębią emocjonalną, znalazła wyraz w dziełach słynnych malarzy, takich jak Tycjan, Tintoretto i Veronese. Artyści ci doskonale oddawali istotę przedstawianych postaci dzięki żywej palecie barw i wyrazistemu światłocieniowi, nadając swoim dziełom niezrównany realizm. Ważnym tematem było malarstwo portretowe, w którym twórcy osiągali niezwykłą głębię charakterystyki postaci. Popularność zdobyły również alegorie i motywy mitologiczne, ukazujące różnorodność oraz emocjonalną siłę sztuki weneckiej.\n\nWyjątkowe położenie Wenecji jako ośrodka handlu między Wschodem a Zachodem odcisnęło trwałe piętno na renesansowej architekturze miasta. Wenecki gotyk łączył misterną kamieniarkę i ostrołukowe arkady z wpływami bizantyjskimi i orientalnymi. Doskonale widać to w tak charakterystycznych budowlach jak Pałac Dożów i Bazylika św. Marka. Wraz z rozwojem renesansu styl palladiański, propagowany przez architekta Andreę Palladia, wprowadził do miejskiej architektury klasyczną symetrię, kolumny i frontony. Weneckie pałace wzdłuż malowniczych kanałów, ozdobione bogatymi fasadami i dziedzińcami, stały się symbolem przepychu miasta. Sztuka i architektura renesansowej Wenecji odzwierciedlają wyjątkową syntezę kulturową miasta i do dziś zachwycają miłośników sztuki na całym świecie."
 flavor_ven.41.a: "Fascynujące!"
 flavor_ven.42.t: "Uroczystości na placu św. Marka"
 flavor_ven.42.d: "W XV wieku karnawał w Wenecji był barwnym i wystawnym wydarzeniem, słynącym z bogato zdobionych masek i kostiumów. Trwał przez kilka tygodni poprzedzających Wielki Post, zapewniając tymczasową ucieczkę od codziennych norm społecznych. Uczestnicy oddawali się wystawnym ucztom, balom maskowym i rozrywkom, ukrywając swoją tożsamość za misternie wykonanymi maskami. Święto to stało się symbolem bogactwa i dekadencji Wenecji w tej epoce."
 flavor_ven.42.a: "Święto, które przejdzie do historii!"
 flavor_ven.43.t: "Karnawał w Wenecji"
 flavor_ven.43.d: "Historia karnawału w Wenecji sięga XI wieku, kiedy rozpoczął się jako święto upamiętniające zwycięstwo Republiki Weneckiej nad jej wrogami. Z czasem przekształcił się w wielkie i wyjątkowe wydarzenie, zyskując popularność w XV wieku. W tym okresie status Wenecji jako jednego z najważniejszych ośrodków handlowych Europy pozwolił jej zgromadzić ogromne bogactwa, które napędzały coraz większy przepych karnawału. Stał się on symbolem zamożności i dekadencji miasta, przyciągając gości z całej Europy pragnących uczestniczyć w maskowych zabawach. Maski zapewniały anonimowość, ale służyły również zacieraniu różnic społecznych, pozwalając ludziom z różnych środowisk swobodnie mieszać się podczas uroczystości.\n\nW XVIII wieku karnawał wenecki osiągnął szczyt swojej świetności. Wyróżniały go wyszukane kostiumy, przedstawienia teatralne i misternie zdobione maski. W 1797 roku został jednak zakazany przez francuskie wojska okupacyjne i zamarł na niemal dwa stulecia. Dopiero pod koniec XX wieku tradycja odżyła, a karnawał stał się wydarzeniem o międzynarodowej sławie. Współczesny karnawał wenecki zachowuje dawne zwyczaje, oferując wspaniałe maski i kostiumy, występy uliczne oraz niezwykłą atmosferę, która pozwala zanurzyć się w bogatej historii miasta."
 flavor_ven.43.a: "Fascynujące!"
 adm_advisors_will_generate_1_splendor_per_level: "Każdy poziom naszych doradców £adm£ będzie generować §G1§! splendoru do końca gry"
 flavor_ven.44.t: "Władza doży"
 flavor_ven.44.d: "Rządy Francesca Foscariego jako doży Wenecji w latach 1423–1457 były okresem zarówno sukcesów, jak i wyzwań. Za jego panowania Wenecja rozszerzyła swoje terytorium we Włoszech i we wschodniej części Morza Śródziemnego, wzmacniając wpływy morskie i handlowe. Jednocześnie narastały konflikty wewnętrzne i niezgoda wśród miejskich elit. Uporczywe dążenie Foscariego do wojny z Republiką Mediolanu nadwyrężyło zasoby Wenecji, a wpływowa Rada Dziesięciu coraz bardziej ograniczała jego władzę, doprowadzając do wygnania własnego syna doży za korupcję. W 1457 roku Foscari ustąpił z urzędu, a następnie zmarł na wygnaniu. Ten przejmujący epizod zainspirował liczne dzieła literackie i artystyczne, przede wszystkim dramat Lorda Byrona „Dwaj Foscari”.\n\nNa przestrzeni wieków władza dożów weneckich ulegała znaczącym przemianom. We wczesnym okresie Republiki Weneckiej przywódcy ci dysponowali rozległymi uprawnieniami politycznymi i wojskowymi. W XV wieku ich rola stała się jednak głównie symboliczna i ceremonialna, ponieważ wpływowa Rada Dziesięciu, odpowiedzialna za bezpieczeństwo państwa, coraz silniej ograniczała swobodę podejmowania decyzji przez dożę. Do jego obowiązków należało reprezentowanie Wenecji podczas oficjalnych uroczystości, przyjmowanie zagranicznych posłów i przewodniczenie ceremoniom. Rzeczywista władza polityczna była rozproszona między różne rady, rody szlacheckie i instytucje, takie jak Wielka Rada. Ten charakterystyczny system kontroli i równowagi sprawiał, że żadna pojedyncza osoba, nawet doża, nie mogła sprawować władzy absolutnej, co sprzyjało stabilności i zapobiegało autorytaryzmowi."
 flavor_ven.44.a: "Musimy ograniczyć ich władzę."
 ven_enable_council_of_ten_and_doge_authority_tt: "Odblokowuje mechanikę rządową §YRady Dziesięciu§!"
 flavor_ven.45.t: "Pałac Dożów"
 flavor_ven.45.d: "Budowę Pałacu Dożów w Wenecji rozpoczęto w IX wieku i kontynuowano przez kolejne stulecia. Pierwotnie zaprojektowany jako budowla przypominająca twierdzę, z czasem przekształcił się we wspaniały przykład weneckiego gotyku. Pałac pełnił podwójną funkcję: był rezydencją doży, najważniejszego przywódcy politycznego Republiki Weneckiej, a zarazem siedzibą licznych urzędów państwowych i sądów.\n\nW XVI wieku pałac przeszedł gruntowną renowację i rozbudowę, które znacznie zwiększyły jego okazałość. Jednym z najważniejszych przedsięwzięć było ukończenie charakterystycznej fasady zwróconej ku Canal Grande, prezentującej architektoniczny splendor budowli wszystkim przybywającym drogą wodną. Prace te umocniły pozycję pałacu jako trwałego symbolu weneckiej potęgi i autorytetu. Jego sale i komnaty, pełne misternych zdobień i kosztownych dekoracji, były świadkami stuleci życia politycznego, a zarazem pozostają świadectwem bogatej historii miasta i jego nieprzemijającego znaczenia na arenie międzynarodowej."
 flavor_ven.45.a: "Fascynujący symbol władzy doży!"
 flavor_ven.46.t: "Znaczenie teatru w nowożytnej Wenecji"
 flavor_ven.46.d: "W XV i XVI wieku teatr w Wenecji był prężnie rozwijającym się i wpływowym zjawiskiem kulturowym. W mieście powstały jedne z pierwszych stałych teatrów w Europie, między innymi Teatro di San Cassiano, otwarty w 1637 roku, oraz Teatro Olimpico, zaprojektowany przez Andreę Palladia w 1580 roku. Na ich scenach wystawiano różnorodne przedstawienia: sztuki teatralne, opery i komedie, które przyciągały zarówno mieszkańców, jak i turystów. Wyjątkowa pozycja Wenecji jako ważnego ośrodka handlu morskiego sprzyjała wymianie idei i wpływów artystycznych z całej Europy. Przyczyniło się to do rozwoju bogatej i różnorodnej tradycji teatralnej, która odegrała istotną rolę w historii europejskiego dramatu i sztuk scenicznych."
 flavor_ven.46.a: "Cóż za elegancja..."
 flavor_ven.47.t: "Akademia Loredan"
 flavor_ven.47.d: "W roku [GetYear] akademia znana jako „Incogniti” przyciąga wpływowych ludzi pióra z Wenecji i spoza jej granic. Jej członkowie reprezentują libertynizm oraz opowiadają się za polityczną i kulturową niezależnością miasta. Z tajnym stowarzyszeniem związani są między innymi Girolamo Brusoni i Ferrante Pallavicino. Grupa posługuje się podstępem, paradoksem i alegorią, by uniknąć krytyki. Jej członkowie działają dyskretnie, używają tajnego języka i publikują anonimowo, a ich filozofia czerpie z myśli Trajana Boccaliniego oraz arystotelesowskiego naturalizmu rozwijanego na Uniwersytecie w Padwie.\nTa tajna akademia, mimo cenzury i umieszczania jej dzieł w Indeksie ksiąg zakazanych, odważnie podważa normy społeczne za pomocą satyry i gatunków hybrydowych. Pod wpływem idei Machiavellego, Paola Sarpiego i innych autorów jej członkowie krytykują tyranię w tekstach historycznych. Co zaskakujące, Accademia degli Incogniti staje się również jedną z głównych sił napędowych rozwoju teatru muzycznego w Wenecji i przyczynia się do powstania Teatro Novissimo."
 flavor_ven.47.a: "Niech rozkwitają kultura i światło!"
 flavor_ven.48.t: "Złota Republika"
 flavor_ven.48.d: "Nasze sukcesy w polityce, handlu i nauce sprawiły, że wielu nazywa obecną epokę „Złotą Republiką”. Określenie to nawiązuje do szczytu naszego bogactwa, będącego zwieńczeniem wspólnych wysiłków całego narodu, a także do rozkwitu naszej kultury i sztuki. Chcemy w ten sposób utrwalić nasze dziedzictwo na kartach historii."
 flavor_ven.48.a: "Nasze wysiłki były tego warte!"
 flavor_ven.48.b: "Przyjmijmy jedynie nowe barwy."
 flavor_ven.48.c: "Wystarczy nowy tytuł."
 flavor_ven.48.e: "Zaakceptujmy napływ nowych idei i tradycji."
 flavor_ven.48.f: "Nasz lud jest zadowolony z obecnego stanu rzeczy!"
 flavor_ven.49.t: "Pałac w Venarii"
 flavor_ven.49.d: "Ten okazały pałac królewski, otoczony rozległymi ogrodami, jest świadectwem wielkości i historycznego znaczenia dynastii. Łączy w sobie misternie zaprojektowane elementy barokowe i renesansowe. Dworzanie mogą podziwiać bogato zdobione komnaty, z których każda opowiada historię królewskiej przeszłości i zapowiada chwalebną przyszłość.\nRozległe ogrody, ozdobione imponującymi fontannami i rzeźbami, zapewniają spokojne wytchnienie. Pałac w Venarii jest nie tylko skarbem kultury, lecz także miejscem licznych wydarzeń i wystaw, podczas których zagraniczni dygnitarze mogą poznać nasze bogate dziedzictwo. Pod naszym czujnym i wyrobionym okiem pozostaje wspaniałym przykładem architektonicznego i kulturowego dziedzictwa Wenecji."
 flavor_ven.49.a: "Symbol naszej potęgi."
 flavor_ven.50.t: "Arsenał Wenecki"
 flavor_ven.50.d: "Nasze przedsięwzięcia morskie i legendarne umiejętności szkutnicze przyniosły naszym rzemieślnikom światową sławę. Sercem działalności związanej z budową i naprawą okrętów jest Arsenał w Wenecji. Ten kompleks morski, położony w strategicznym miejscu, odgrywa kluczową rolę w utrzymaniu potęgi miasta na morzu. Od prężnie działających stoczni po innowacje w dziedzinie uzbrojenia okrętowego — Arsenał stanowi fundament naszej dominacji na wodach."
 flavor_ven.50.a: "Ceniony element naszego morskiego dziedzictwa!"
 flavor_ven.51.t: "Bazylika Świętych Jana i Pawła"
 flavor_ven.51.d: "Nasze miasto zdobią liczne cuda architektury. Freski, posągi i dzieła coraz liczniejszych artystów, którzy pragną stanąć na ramionach olbrzymów i zdobyć własną sławę, nadają mu wyjątkowy charakter. Najnowszym klejnotem naszej stolicy jest bazylika mniejsza San Zanipolo.\n\nJej potężna ceglana bryła została zaprojektowana w stylu włoskiego gotyku, a świątynia pełni funkcję głównego kościoła dominikanów w naszym wielkim mieście. Budowla jest poświęcona Janowi i Pawłowi, dwóm legendarnym męczennikom, których kult odnotowano już około IV wieku."
 flavor_ven.51.a: "Cud architektury i świadectwo siły wiary!"
 flavor_ven.52.t: "[Root.GetName] a walka o władzę we Włoszech"
 flavor_ven.52.d: "Wielu ambitnych monarchów i wpływowych osobistości próbowało zadecydować o losie naszego półwyspu. Niekończące się wojny, konflikty, głód i zniszczenie miały ujarzmić nasz lud i podporządkować go obcym władcom. Teraz dysponujemy siłą, by samodzielnie kształtować własny los, a nawet decydować o przyszłości sąsiadów. To nasza epoka — nie możemy pozwolić, by obce wpływy osłabiły naszą wspólną siłę!"
 flavor_ven.52.a: "[Root.Monarch.GetName] zjednoczy Włochy!"
 flavor_ven.53.t: "Marynarka wojenna Wenecji"
 flavor_ven.53.d: "Niewiele państw może dorównać naszej wiedzy i doświadczeniu w sprawach morskich. Zamiłowanie do handlu i żeglugi uczyniło z nas jedną z największych potęg dominujących na Morzu Śródziemnym. Nasza tradycja wyrasta z miłości i szacunku do morza, które jest zarówno drogą do wielkości, jak i główną linią obrony naszej wspaniałej stolicy, [Root.Capital.GetCapitalName]."
 flavor_ven.53.a: "Czcimy cię, morze, jako symbol prawdziwego i wiecznego panowania."
 flavor_ven.54.t: "Wspólne przedsięwzięcie inżynieryjne"
 flavor_ven.54.d: "Niedawno weneccy dygnitarze przedstawili nam niezwykle korzystną propozycję. Zgodnie z ich planami inżynieryjnymi i pomiarami terenów między Morzem Czerwonym a Morzem Śródziemnym możliwe jest wykopanie kanału o długości i szerokości wystarczającej do umożliwienia żeglugi między tymi akwenami. W zamian za poniesione wysiłki mielibyśmy przekazać im suwerenność nad ziemiami otaczającymi nowy kanał, jako wyraz przyjaźni, współpracy i wspólnego dążenia do dobrobytu."
 flavor_ven.54.a: "Umowa stoi!"
 flavor_ven.54.b: "Nie interesują nas takie przedsięwzięcia."
