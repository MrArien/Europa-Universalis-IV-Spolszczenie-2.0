 ven_united_italy_modifier: "Zjednoczenie Włoch"
 desc_ven_united_italy_modifier: "Zbyt długo nasza piękna ojczyzna, Italia, była pustoszona przez zdobywców i obce wpływy. Nadszedł czas zjednoczenia!"
 ven_office_of_foreign_commercial_affairs: "Urząd ds. zagranicznego handlu"
 desc_ven_office_of_foreign_commercial_affairs: "Urząd odpowiedzialny za sprawy handlowe za granicą dba o wysokie standardy naszych zagranicznych inwestycji."
 ven_meditteranean_patrols_modifier: "Patrole na Morzu Śródziemnym"
 desc_ven_meditteranean_patrols_modifier: "Nasze załogi składają się z weteranów, dla których galery stały się drugim domem."
 ven_colonial_outpost_modifier: "Wenecki urząd kolonialny"
 desc_ven_colonial_outpost_modifier: "Ta prowincja zarządza przywilejem handlowym naszej republiki za granicą."
 ven_venetian_new_world_charters: "Weneckie przywileje kolonialne w Nowym Świecie"
 desc_ven_venetian_new_world_charters: "Musimy skupić wysiłki na zagranicznych przedsięwzięciach — czeka na nas świat pełen bogactw i złota..."
 ven_wealth_of_the_new_world_modifier: "Bogactwa Nowego Świata"
 desc_ven_wealth_of_the_new_world_modifier: "Towary i wiedza zdobyte podczas naszych wypraw przyniosły wielkie korzyści mieszkańcom ojczyzny."
 ven_venetian_sugar_modifier: "Wenecka plantacja cukru"
 desc_ven_venetian_sugar_modifier: "W tej prowincji znajduje się wielka plantacja cukru, której wydajnością i efektywnością zarządza lokalny komitet administracyjny."
 ven_global_presence_modifier: "Globalna obecność"
 desc_ven_global_presence_modifier: "Nasza obecność na morzach całego świata zapewniła nam ogromne wpływy i doświadczenie w sprawach morskich."
 ven_venetian_era_of_high_commerce_modifier: "Era rozkwitu handlu"
 desc_ven_venetian_era_of_high_commerce_modifier: "Nasze wielkie państwo przeżywa złoty wiek!"
 ven_conquest_of_constantinople_modifier: "Podbój Konstantynopola"
 desc_ven_conquest_of_constantinople_modifier: "Podbój tak cennej perły jest godny tych, którzy dysponują potęgą i splendorem niezbędnymi do jej utrzymania."
 ven_foreign_merchant_missions_modifier: "Misje zagranicznych kupców"
 desc_ven_foreign_merchant_missions_modifier: "Bogactwo Orientu musimy wykorzystać, wysyłając śmiałe misje kupieckie, których uczestnicy będą przemierzać obce wody w poszukiwaniu bogactwa i sławy!"
 ven_source_of_spice_modifier: "Główne źródło przypraw"
 desc_ven_source_of_spice_modifier: "Ta wyspa jest jednym z największych źródeł goździków na całym świecie."
 ven_wealth_of_india_modifier: "Bogactwa Indii"
 desc_ven_wealth_of_india_modifier: "Ziemie na wschód od Adenu są ojczyzną jednych z najbogatszych i najpotężniejszych imperiów w dziejach ludzkości. Możliwość czerpania z ich bogactw jest wielkim przywilejem."
 scuola_grande: "Scuola Grande"
 scuola_grande_desc: "Te ośrodki nauki były ważnymi bractwami lub cechami, które odgrywały istotną rolę w życiu społecznym, religijnym i kulturalnym Republiki Weneckiej. Organizacje te cieszyły się znaczeniem w epoce renesansu i później, kształtując naszą wspaniałą przyszłość i torując drogę kolejnym pokoleniom."
 scuole_grandi_loc: "Scuole Grandi"
 scuole_grandi_loc_short: "Scuola"
 scuole_grandi_loc_full: "Scuola Grande"
 san_zanipolo: "San Zanipolo"
 ven_promissione_ducale_reform: "Promissione Ducale"
 ven_promissione_ducale_reform_desc: "Promissione ducale, wywodząca się z włoskich miast-państw, takich jak Wenecja, była przysięgą urzędową składaną przez dożów, obejmującą zobowiązania prawne i polityczne. Doża zobowiązywał się w niej do bezstronnego wymierzania sprawiedliwości, strzeżenia tajemnic państwowych i wykonywania uchwał Wielkiej Rady. Przysięga ograniczała również jego władzę, między innymi zakazując bezpośredniej korespondencji z zagranicznymi władcami oraz ingerowania w wybór patriarchy Wenecji. Z czasem dokument stawał się coraz bardziej szczegółowy i ostatecznie zaczęto go drukować; kolejne wersje dla poszczególnych dożów liczyły od 108 do 301 stron. Aby urząd nie stał się dziedziczny, ograniczenia objęły także krewnych doży, którym zakazano zasiadania w niektórych radach i obejmowania określonych stanowisk. Choć w późniejszych latach Republiki Weneckiej część restrykcji złagodzono, istotne ograniczenia nadal obowiązywały, również członków rodziny doży. Przysięga regulowała ponadto kwestie dotyczące dogaressy, w tym jej stroju i obowiązków ceremonialnych."
 unlock_ven_promissione_ducale_reform_tt: "
Odblokowuje dostęp do reformy rządu poziomu 3: §YPromissione Ducale§!"
 merchant_representation_reform: "Komitety Kupieckie"
 merchant_representation_reform_desc: "Reprezentując i wzmacniając kupców z całego naszego państwa, zapewnimy im większą widoczność oraz pomożemy zwiększyć skuteczność ich flot zarówno na wodach ojczystych, jak i za granicą."
 VEN_ideas_2: "Idee weneckie"
 VEN_ideas_2_start: "Tradycje weneckie"
 VEN_ideas_2_bonus: "Ambicje weneckie"
 LNS: "La Serenissima"
 LNS_ADJ: "Najjaśniejsza"
 LNS_ideas: "Idee Najjaśniejszej Republiki"
 LNS_ideas_start: "Tradycje Najjaśniejszej Republiki"
 LNS_ideas_bonus: "Ambicje Najjaśniejszej Republiki"
 lns_renaissance_art: "Włoski renesans"
 lns_renaissance_art_desc: "Wpływ renesansu na nasz naród jest nie do przecenienia. Nowe prądy myślowe, kultura i sztuka, które właśnie się rozwijają, na zawsze ukształtują otaczający nas świat."
 lns_maritime_dominance: "Dominacja morska"
 lns_maritime_dominance_desc: "Niewiele państw może tak otwarcie jak my głosić swoją dominację na morzu. Naprawdę stoimy u steru wielkiej potęgi i zamożnego państwa."
 lns_a_gunpowder_republic: "Republika prochu"
 lns_a_gunpowder_republic_desc: "Wojna i obrona naszych ideałów stanowią fundament naszych przekonań. Dlatego doskonaliliśmy zdolności wojskowe, traktując je jako narzędzie utrzymania pokoju."
 backing_of_the_ducat: "Oparcie dla dukata"
 backing_of_the_ducat_desc: "Nasz dukat nie ma pokrycia w żadnym fizycznym zasobie. Jego stabilność i powszechne uznanie wynikają z nieustannego zaufania do naszej gospodarki, nieprzerwanego dobrobytu oraz rosnącej potęgi na świecie!"
 reform_the_uscocchi: "Reformy uskockie"
 reform_the_uscocchi_desc: "Ludy zamieszkujące naszą granicę z ziemiami niemieckimi od dawna uprzykrzają życie naszym kupcom. Napadają na wybrzeża i wszczynają potyczki. Musimy wykorzystać ich nieustanną ingerencję i przekształcić ją w atut naszego rządu."
 maggior_consiglio: "Maggior Consiglio"
 maggior_consiglio_desc: "Wielka Rada to organ władzy określający zakres uprawnień głowy państwa. Dzięki umiejętnemu poruszaniu się na scenie politycznej i pozyskaniu odpowiednich stronników zapewnimy naszemu władcy jej przychylność."
 event_insight_flavor_ven.40: "
§GInformacja o wydarzeniu§!:
Wydarzenie przedstawi historię §YTycjana§!, najsłynniejszego weneckiego artysty renesansu."
 event_insight_flavor_ven.42: "
§GInformacja o wydarzeniu§!:
Wydarzenie zwiększy naszą §Ytradycję republikańską§! i pozwoli doradcom administracyjnym generować §Ysplendor§!."
 event_insight_flavor_ven.44: "
§GInformacja o wydarzeniu§!:
Wydarzenie ograniczy wpływ §YRady Dziesięciu§! na naszą władzę."
 event_insight_flavor_ven.45: "
§GInformacja o wydarzeniu§!:
Wydarzenie pomoże nam zarządzać §YRadą Dziesięciu§! i odzyskać nasze §Yziemie koronne§!."
 event_insight_flavor_ven.46: "
§GInformacja o wydarzeniu§!:
Wydarzenie przybliży historię znaczenia teatru i zapewni nam wybitnego artystę."
 event_insight_flavor_ven.47: "
§GInformacja o wydarzeniu§!:
Wydarzenie opowie historię wielkiej akademii, a także zapewni dodatkowe nagrody po przyjęciu nowej technologii."
 event_insight_flavor_ven.48: "
§GInformacja o wydarzeniu§!:
Wydarzenie pozwoli nam ogłosić §YZłotą Republikę§! i potencjalnie uzyskać nowy kolor, zestaw idei lub nazwę."
 event_insight_flavor_ven.49: "
§GInformacja o wydarzeniu§!:
Wydarzenie zapewni prowincji [103.GetName] nowy ratusz oraz wzmocni nasz rząd, a także sprowadzi Amedea di Castellamonta na nasz dwór."
 event_insight_flavor_ven.50: "
§GInformacja o wydarzeniu§!:
Wydarzenie rozbuduje §Ystocznie§! w prowincji [112.GetName] i zapewni nam dostęp do licznych rezerw marynarzy."
 event_insight_flavor_ven.51: "
§GInformacja o wydarzeniu§!:
Wydarzenie rozbuduje §Ykościół§! w prowincji [112.GetName] i przyzna dodatkową nagrodę zależną od naszego stanowiska dyplomatycznego wobec §YPaństwa Kościelnego§!."
 event_insight_flavor_ven.52: "
§GInformacja o wydarzeniu§!:
Wydarzenie zapewni nam stałe roszczenia w regionie §YItalii§! i wzmocni wojskowe zdolności naszego władcy."
 event_insight_flavor_ven.53: "
§GInformacja o wydarzeniu§!:
Wydarzenie zwiększy naszą §Ytradycję morską§!, §Ymerkantylizm§! oraz podstawową produkcję w prowincji [Root.Capital.GetCapitalName]."
 event_insight_flavor_ven.54: "
§GInformacja o wydarzeniu§!:
Wydarzenie "
 replenish_mercenary_ranks_title: "Uzupełnij szeregi najemników"
 replenish_mercenary_ranks_desc: "Właściwe zarządzanie żołnierzami kontraktowymi pozostającymi na naszym żołdzie oraz uzupełnianie ich szeregów ma najwyższy priorytet!"
 NED_flanders_title: "Na polach Flandrii"
 NED_flanders_desc: "Siła, solidarność i wspólny cel to tylko niektóre z cech, które jednoczą nasz naród. W naszej walce o rozszerzenie terytorium kolejnym celem nie może być nic innego jak Flandria."
 NED_luxembourg_fortress_title: "Skała Bock w Luksemburgu"
 NED_luxembourg_fortress_desc: "Choć teren naszego regionu jest w większości płaski i podmokły, potrzebujemy umocnień, które można skutecznie bronić. Najlepszym miejscem będzie potężna twierdza w prowincji [94.GetName]."
 NED_dutch_polders_title: "Osuszanie i odzyskiwanie ziemi"
 NED_dutch_polders_desc: "Morze zapewnia nam dochody dzięki handlowi i cłom, jednak aby zagwarantować naszym mieszkańcom więcej przestrzeni do życia, musimy odebrać mu część lądu."
 NED_low_countries_urbanization_title: "Miasta Krajów Niskich"
 NED_low_countries_urbanization_desc: "Postępu ludzkości nie mogą hamować architektoniczne ograniczenia pozostawione przez naszych przodków. W tym celu rozbudujmy ośrodki miejskie, aby sprostać rosnącemu zapotrzebowaniu na towary i mieszkania."
 NED_fluyts_title: "Fleuty transportowe"
 NED_fluyts_desc: "Jako naród żyjący nad morzem i z morza musimy nieustannie doskonalić umiejętność żeglowania po prądach, przypływach i odpływach otaczających nasze wybrzeże."
 NED_sea_beggars_title: "Morskie Żebraki"
 NED_sea_beggars_desc: "W czasie wojny, zwłaszcza w starciu z silniejszym przeciwnikiem, musimy wykorzystać każdego dostępnego człowieka, niezależnie od jego moralności, aby zwyciężyć. Rozmaite załogi korsarskie, które zwykle sprawiały nam kłopoty, są teraz gotowe do nękania naszych wrogów."
 NED_organizing_the_church_title: "Reorganizacja duchowieństwa"
 NED_organizing_the_church_desc: "Obecność duchownych i ludzi wiary zaangażowanych w sprawy dworu stanowi niezwykle niebezpieczny precedens. Musimy wykorzenić ich skorumpowane elementy i zagwarantować sobie ich lojalność."
 NED_religious_immigrants_title: "Napływ imigrantów"
 NED_religious_immigrants_desc: "Reformacja skłoniła wiele wspólnot religijnych do opuszczenia ojczyzn w poszukiwaniu nowego domu. Staniemy się latarnią wolności, aby wszyscy zmuszeni do ucieczki mogli znaleźć lepsze życie na naszych ziemiach."
 NED_carribean_colonies_title: "Kolonie na Karaibach"
 NED_carribean_colonies_desc: "Karaiby są pełne bogatych plantacji trzciny cukrowej, które tylko czekają, by je przejąć. Wypłyńmy i skolonizujmy te ziemie w imieniu państwa."
 NED_guyana_title: "Przyczółek w Gujanie"
 NED_guyana_desc: "Nasze floty i osadnicy nie mają jeszcze dostępu do Ameryki Południowej. Umacniając naszą pozycję w Gujanie, stworzymy sobie możliwość przyszłej ekspansji w Brazylii, niezależnie od jej skali."
 NED_raise_the_militia_title: "Powołanie milicji"
 NED_raise_the_militia_desc: "Zbyt długo żyliśmy pod burgundzkim sztandarem. Nadszedł czas, by nasz lud powstał i sam przejął kontrolę nad własnym losem."
 NED_holland_title: "Zjednoczenie Holandii"
 NED_holland_desc: "Serce Krajów Niskich obfituje w handel i bogactwo. Włączenie tych ziem do naszego państwa jeszcze bardziej zwiększy nasze wpływy i znaczenie w regionie."
 NED_unification_of_low_countries_title: "Je Maintiendrai"
 NED_unification_of_low_countries_desc: "Nadszedł czas, by zaatakować wszystkich, którzy chcą skrzywdzić nasz lud i przejąć nasze ziemie. Nie będziemy już niczyimi poddanymi!"
 NED_cloth_trading_title: "Handel suknem"
 NED_cloth_trading_desc: "Warsztaty w naszych prowincjach słyną z wysokiej jakości sukna i przędzy. Różnorodne techniki oraz wiedza miejscowych rzemieślników pozwalają tworzyć jedne z najwspanialszych tkanin w Europie."
 NED_dutch_canal_works_title: "Budowa wałów przeciwpowodziowych"
 NED_dutch_canal_works_desc: "Solidna inżynieria i połączenie wytrzymałych materiałów pozwolą nam wznosić potężne wały i zapanować nad żywiołem wody."
 NED_rise_of_dutch_navy_title: "Utworzenie floty państwowej"
 NED_rise_of_dutch_navy_desc: "Jako państwo posiadające jedno z najbardziej dochodowych wybrzeży Europy powinniśmy uczynić nasze porty bazą potężnej floty wojennej."
 NED_dutch_admiralities_title: "Pięć admiralicji holenderskich"
 NED_dutch_admiralities_desc: "Zarządzanie sprawami morskimi i zapewnienie, by nasze wspólnoty żeglarskie skupiały najzdolniejszych ludzi, należą do najważniejszych zadań naszego rządu."
 NED_amsterdam_stock_exchange_title: "Giełda amsterdamska"
 NED_amsterdam_stock_exchange_desc: "Przepływ pieniędzy, kredytów i zamorskich interesów jest w naszych salach codziennością. Aby usprawnić zarządzanie finansami i dalszą ekspansję, musimy zapewnić odpowiednią infrastrukturę."
 NED_dutch_naval_supremacy_title: "Holenderska dominacja na morzu"
 NED_dutch_naval_supremacy_desc: "Przez lata mierzyliśmy się z wieloma godnymi przeciwnikami. Jednak żaden z nich nie oprze się lwu, który poskromił nawet najsłynniejszych morskich rywali."
 NED_humanism_title: "Holenderski humanizm"
 NED_humanism_desc: "Wiele europejskich narodów próbuje narzucać swoją wolę w imię Boga. My nie jesteśmy tacy jak oni. Pragniemy rozszerzać nasze ziemie, kierując się nowymi naukami humanizmu — ideą szacunku dla bliźnich, o ile służą państwu. Rozwijajmy tę ideologię w imię naszej ojczyzny!"
 NED_erasmus_title: "Nauki Erazma"
 NED_erasmus_desc: "Nauki Erazma z Rotterdamu dotyczące humanizmu zrewolucjonizowały Kraje Niskie, propagując powrót do wiedzy klasycznej, krytycznego myślenia i indywidualnej autonomii. Jego wpływ zapoczątkował odrodzenie nauki i przyczynił się do przemian społecznych w kierunku oświecenia, tolerancji oraz większego nacisku na edukację. Dziedzictwo Erazma wciąż oddziałuje na rozwój intelektualny i kulturowy tego regionu."
 NED_west_indies_company_title: "Kompania Zachodnioindyjska"
 NED_west_indies_company_desc: "Wielu odważnych osadników zadomowiło się w Amerykach. Choć działają bez większej koordynacji, wszyscy podlegają państwu holenderskiemu. Utworzenie Kompanii Zachodnioindyjskiej pozwoli nam skuteczniej nimi zarządzać."
 NED_new_amsterdam_title: "Nowy Amsterdam"
 NED_new_amsterdam_desc: "Na wschodnim wybrzeżu Ameryki znajduje się ujście rzeki Hudson, gdzie możemy założyć nową kolonię dla naszych osadników. Nazwiemy ją „Nieuw-Amsterdam”, a jej powstanie zapewni nam dostęp do pozostałej części wschodniego wybrzeża Ameryki."
 NED_grand_design_title: "Groot Desseyn"
 NED_grand_design_desc: "Aby wygrać wojnę mimo przewagi liczebnej przeciwnika, musimy odciąć go od źródeł bogactwa — szlaków handlowych. Zajmując Brazylię i Wybrzeże Kości Słoniowej, będziemy mogli kontrolować dochody napływające do Europy."
 NED_dutch_slavery_title: "Kwestia niewolnictwa"
 NED_dutch_slavery_desc: "Niewolnictwo występuje w różnych formach od wielu stuleci. Wraz z rozwojem praw człowieka coraz więcej osób opowiada się jednak za jego zniesieniem. Musimy ostatecznie rozstrzygnąć tę kwestię."
 NED_japan_title: "Handel z Japonią"
 NED_japan_desc: "Japonia odizolowała się od reszty świata. Z jednym wyjątkiem — Holendrów. Musimy zatem zadbać o umocnienie naszej wymiany handlowej na tej wyspie."
 NED_friesland_title: "Wolność Fryzji"
 NED_friesland_desc: "Fryzowie od dawna domagają się niezależności od obcych wpływów i walczą o autonomię. W ramach kompromisu pozwólmy im cieszyć się wolnością pod naszym sztandarem."
 NED_english_channel_dominance_title: "Dominacja w Kanale"
 NED_english_channel_dominance_desc: "Wody między nami a angielskim królem są pełne możliwości handlowych i zysków. Musimy zapewnić sobie niekwestionowany monopol i czerpać z niego korzyści."
 NED_glorious_revolution_title: "Chwalebna rewolucja"
 NED_glorious_revolution_desc: "Wewnętrzne spory naszych przeciwników po drugiej stronie kanału nie umknęły naszej uwadze. Musimy interweniować i raz na zawsze podporządkować ich naszej woli."
 NED_black_devils_title: "Regiment de Marine"
 NED_black_devils_desc: "Dążąc do doskonałości w sprawach morskich, musimy zaszczepić dumę i dyscyplinę wśród marines służących na pokładach naszych najsłynniejszych okrętów."
 NED_free_trade_title: "Idea wolnego handlu"
 NED_free_trade_desc: "Ułatwienie swobodnego handlu i dopuszczenie zagranicznych kupców na nasze rynki to doskonały sposób na czerpanie korzyści ze stale zmieniającego się świata."
 NED_universities_title: "Uniwersytety Niderlandów"
 NED_universities_desc: "Jeśli jest coś, co nasz lud pragnie wspierać, są to wolność i edukacja. Rozwijając miasta Niderlandów, będziemy mogli jeszcze bardziej podnieść poziom kształcenia i wznieść nowe uniwersytety."
 NED_leiden_university_title: "Uniwersytet w Lejdzie"
 NED_leiden_university_desc: "Założony w 1575 roku Uniwersytet w Lejdzie jest jedną z najstarszych uczelni w Niderlandach. Powstał w przełomowym okresie ożywienia intelektualnego i wstrząsów religijnych. Uczelnia zrodziła się z wizji Wilhelma Orańskiego, który pragnął stworzyć ośrodek nauki wspierający tolerancję religijną i wolność akademicką. Szybko zdobyła uznanie dzięki dążeniu do doskonałości naukowej i innowacyjności. Wśród jej pierwszych wykładowców znaleźli się wybitni uczeni, tacy jak Justus Lipsius i Joseph Scaliger, a na studia przybywali młodzi ludzie z całej Europy."
 NED_unified_confession_title: "Jedno wyznanie"
 NED_unified_confession_desc: "Reformacja rozdarła zachodni Kościół na dwie części, w wyniku czego wiele państw zmaga się z niepokojami religijnymi. Zamiast walczyć ze sobą z tak błahych powodów, odłóżmy na bok dzielące nas różnice."
 NED_ADD_100_FERVOR: "Zyskujemy §G100,00§! punktów zapału."
 NED_start_exploration_title: "Opowieści o złocie i przyprawach"
 NED_start_exploration_desc: "Zagraniczni odkrywcy opowiadają o ziemiach leżących poza granicami naszych map. Mówią o złocie i przyprawach, kusząc wielu osadników do wyruszenia w morze. Niech pogłoski o bogactwach przestaną nas jedynie kusić — sami wypłyńmy ku nieznanym lądom."
 NED_ivory_trade_title: "Handel na Wybrzeżu Kości Słoniowej"
 NED_ivory_trade_desc: "Wybrzeże Kości Słoniowej ma kluczowe znaczenie dla kupców sprowadzających bogactwa z Azji. Zabezpieczając tamtejsze ziemie, możemy jeszcze bardziej zwiększyć przepływ towarów między Azją a Europą."
 NED_malacca_trade_title: "Podbić Malakkę"
 NED_malacca_trade_desc: "Malakka jest ważnym ośrodkiem w Indiach Wschodnich i nie możemy dopuścić, by wpadła w ręce naszych konkurentów. Musimy ją zdobyć!"
 NED_taiwan_title: "Zdobyć Formozę"
 NED_taiwan_desc: "Aby skuteczniej przechwytywać handel naszych konkurentów na Dalekim Wschodzie i ułatwić własnym kupcom wymianę z Chinami oraz Japonią, powinniśmy założyć bazę na wyspie Formoza."
 NED_east_indies_domination_title: "Holenderskie Indie Wschodnie"
 NED_east_indies_domination_desc: "Nasz handel w Indiach Wschodnich kwitnie, lecz bezpieczeństwo kupców i wymiany handlowej pozostanie zagrożone, dopóki naszej kontroli gospodarczej nad regionem nie będzie towarzyszyć władza polityczna. Dla dalszego dobrobytu tych ziem i ochrony interesów państwa musimy podporządkować sobie jak największą część Indii Wschodnich."
 NED_end_sound_toll_title: "Znieść opłatę sundzką"
 NED_end_sound_toll_desc: "Towary przepływające przez obszar państwa [12.GetName] podlegają cłom i opłatom. Znacznie uszczupla to nasze zyski i musimy coś z tym zrobić."
 NED_baltic_supremacy_title: "Dominacja handlowa na Bałtyku"
 NED_baltic_supremacy_desc: "Północne szlaki morskie i statki przewożące towary ze wschodnich mórz są pełne ryb, dóbr i zapasów. Musimy utrzymać silną obecność na całym Bałtyku."
 NED_english_relations_title: "Stosunki z Brytanią"
 NED_english_relations_desc: "Nasi sąsiedzi zza kanału La Manche od dawna dysponują wielką siłą i potężną flotą. Musimy zadbać o ich spokój — drogą dyplomacji lub mieczem."
 NED_military_reforms_title: "Utworzyć Armię Stanów Generalnych"
 NED_military_reforms_desc: "Jako młode państwo, które musi zadbać o własną obronę, powinniśmy stworzyć mobilną, dobrze wyposażoną armię, gotową bronić naszych prowincji macierzystych."
 NED_marician_reforms_title: "Reformy Maurycego Orańskiego"
 NED_marician_reforms_desc: "Rozwój profesjonalizacji armii w Europie stopniowo zmienia sposób prowadzenia wojen. Zamiast króla prowadzącego do bitwy szlachtę i jej milicję, armia staje się samodzielną instytucją. Mimo niewielkiej liczby ludności możemy wykorzystać najemników, aby chronić nasze państwo."
 NED_army_of_the_state_title: "Armia państwowa"
 NED_army_of_the_state_desc: "Armia ma jedno najważniejsze zadanie — chronić państwo przed obcymi najeźdźcami i buntownikami. Musimy więc wzmocnić nasze wojsko, aby stało się najwspanialszą armią Europy i zapewniło nam bezpieczeństwo."
 NED_statists_and_oragnists_title: "Statyści i oranżyści"
 NED_statists_and_oragnists_desc: "Spór między zwolennikami państwa, zwanymi statystami, a stronnikami monarchii, czyli oranżystami, nęka nasz naród od chwili jego powstania. Jeśli chcemy raz na zawsze zakończyć ten konflikt, musimy opowiedzieć się po jednej ze stron."
 NED_managing_stadholders_title: "Uregulować urząd stadhoudera"
 NED_managing_stadholders_desc: "Każda prowincja ma prawo mianować własnego stadhoudera, pełniącego funkcję przywódcy politycznego i wojskowego. Wraz z rozwojem państwa i jednoczeniem prowincji wielość stadhouderów zaczyna jednak sprawiać problemy, zwłaszcza w sprawach wojskowych. Potrzebujemy jednego naczelnego dowódcy kierującego całością działań zbrojnych. Najprostszym rozwiązaniem będzie powierzenie urzędu stadhoudera jednej osobie w kilku prowincjach jednocześnie."
 NED_question_of_the_confederation_title: "Los konfederacji"
 NED_question_of_the_confederation_desc: "Konfederacja, na której oparto naszą republikę, została już w pełni ukształtowana. Spór między oranżystami a statystami dobiegł końca i jedna ze stron odniosła zwycięstwo. Nadszedł czas, by nadać konfederacji kształt, jaki od samego początku zamierzali jej nadać nasi władcy."
 NED_patronage_of_arts_title: "Wspierać zagranicznych artystów"
 NED_patronage_of_arts_desc: "Filip Dobry Burgundzki pozostawił na dworze w Niderlandach wielu wybitnych artystów. Musimy kontynuować jego dziedzictwo i wynieść dwór niderlandzki na jeszcze wyższy poziom."
 NED_golden_age_title: "Gouden Eeuw"
 NED_golden_age_desc: "Liczne sukcesy w handlu, żegludze i gospodarce skłoniły historyków do ogłoszenia naszych czasów „Złotym Wiekiem [Root.GetName]”. Rozkwit handlu, zadowolona ludność i sprawny system podatkowy zdziałały cuda dla naszej gospodarki, pozwalając nam nawet rywalizować z Anglikami w kanale La Manche."
 NED_founding_the_voc_title: "Założyć VOC"
 NED_founding_the_voc_desc: "Konsorcja kupieckie, takie jak Heeren XVII, pragną poszerzać swoje portfele inwestycyjne i angażować się w handel zamorski. Jeśli wesprzemy utworzenie kompanii wschodnioindyjskiej, zyski mogą być ogromne!"
 NED_access_to_india_title: "Uzyskać dostęp do Oceanu Indyjskiego"
 NED_access_to_india_desc: "Zakładając nowe placówki na Oceanie Indyjskim, będziemy mogli skuteczniej zabezpieczyć nasze pozycje w regionie i rozwinąć handel z miejscową ludnością."
 NED_ceylon_bases_title: "Baza na Cejlonie"
 NED_ceylon_bases_desc: "Bogata wyspa Cejlon jest nie tylko dochodowym źródłem zysków, lecz także ważnym przystankiem dla statków płynących dalej na wschód. Jeśli jej nie zdobędziemy, z pewnością zrobią to nasi wrogowie."
 NED_city_of_batavia_title: "Założyć Batavię"
 NED_city_of_batavia_desc: "Nasza rosnąca obecność w Indiach Wschodnich wymaga pobliskiego ośrodka administracyjnego, w którym nasi kupcy będą chronieni przez nasze działa, a okręty znajdą bezpieczną przystań."
 NED_hansa_relations_title: "Stosunki z Hanzą"
 NED_hansa_relations_desc: "Począwszy od 1441 roku, nasza flota wielokrotnie ścierała się z Hanzą — potężnym związkiem miast kontrolujących dochodowy handel na Bałtyku. Po pokonaniu i upokorzeniu Hanzy podpisaliśmy traktat kopenhaski, który zapewnił nam nieograniczony dostęp do jej portów i znaczącą obecność w nich. Nadszedł czas zażądać przywrócenia traktatu, jeśli Hanza nie chce ryzykować wojny."
 NED_sail_towards_lubeck_title: "Wspierać handel towarami masowymi"
 NED_sail_towards_lubeck_desc: "Zboże z Bałtyku od dawna jest przewożone na zachód przez naszych kupców, lecz wciąż istnieje wiele niewykorzystanych możliwości. Rozszerzając naszą obecność na bałtyckich rynkach, możemy zarobić dość pieniędzy, by rozpocząć przygotowania do wyprawy odkrywającej kolejne miejsca prowadzenia interesów."
 NED_securing_baltic_grain_title: "Zabezpieczyć dostawy bałtyckiego zboża"
 NED_securing_baltic_grain_desc: "Niderlandy od zawsze zaopatrywano w zboże z importu, zwłaszcza z regionu Bałtyku. Jeśli uda nam się zabezpieczyć te dostawy na własny użytek, nie będziemy już musieli za nie płacić."
 NED_garrision_system_title: "Stałe garnizony"
 NED_garrision_system_desc: "Nasza ojczyzna nie jest rozległa, dlatego tym ważniejsza jest obrona tego, co już posiadamy. Musimy stworzyć silny system garnizonów, który ochroni nasz ukochany kraj."
 NED_dutch_engineering_title: "Niderlandzka sztuka inżynieryjna"
 NED_dutch_engineering_desc: "Jednym z najważniejszych elementów kampanii wojennej jest prowadzenie oblężeń. Źle dowodzona bitwa może być kosztowna, lecz oblężenie jest równie niszczycielskie, jeśli nie zostanie odpowiednio zaplanowane. Wielu teoretyków wojskowości w naszym kraju zaproponowało nowe rozwiązania dotyczące prowadzenia oblężeń."
 NED_organizing_the_seven_provinces_title: "Ziemie Generalności"
 NED_organizing_the_seven_provinces_desc: "Sprawne zarządzanie państwem jest niezwykle ważne, zwłaszcza że nasz kraj charakteryzuje się dużymi różnicami regionalnymi. Dlatego rząd centralny musi niekiedy bezpośrednio administrować niektórymi ziemiami, aby żadna frakcja regionalna nie zdobyła nadmiernych wpływów w sprawach państwowych."
 NED_northern_renaissance_title: "Renesans północny"
 NED_northern_renaissance_desc: "Renesans flamandzki, rozkwitający w XV i XVI wieku, był okresem żywego odrodzenia kultury i sztuki we Flandrii, obejmującej dzisiejszą Belgię i Niderlandy. Łączył mistrzostwo artystyczne, dobrobyt handlowy i innowacje intelektualne. Twórcy tacy jak Jan van Eyck i Pieter Bruegel Starszy stali się symbolami tej epoki, rozwijając techniki malarstwa olejnego i ukazując najdrobniejsze szczegóły codziennego życia z niespotykanym realizmem."
 NED_dutch_architecture_title: "Niderlandzka architektura barokowa"
 NED_dutch_architecture_desc: "Niderlandzka architektura barokowa, popularna w XVII wieku, wyróżniała się rozmachem, precyzją i praktycznością. Pod wpływem dobrobytu gospodarczego kraju i jego dominacji w handlu światowym architekci stawiali na czyste linie, bogate zdobienia i funkcjonalność."
 NED_cape_of_good_hope_title: "Nowa nadzieja"
 NED_cape_of_good_hope_desc: "Nasze lądowe szlaki handlowe do Indii zostały odcięte, dlatego wielu kupców poszukuje nowych dróg, zwłaszcza przez Afrykę. Wypatrują źródła nowej nadziei, które pozwoli im ponownie handlować z ziemiami Indii Wschodnich. Nie wiedzą jednak, że ta nadzieja leży nieco dalej na południe, niż im się wydaje..."
 NED_crossroad_between_two_worlds_title: "Między dwoma światami"
 NED_crossroad_between_two_worlds_desc: "Przylądek Dobrej Nadziei jest ważnym przystankiem na szlaku do Indii Wschodnich. Rozsądnym posunięciem będzie założenie tam placówki i zapewnienie bezpiecznej przystani naszym statkom podczas długiej podróży na wschód."
 NED_CHALLENGE_HANSA: "Rzucić wyzwanie Hanzie"
 ned_seven_provinces_organization_positive_modifier: "Organizacja Siedmiu Prowincji"
 ned_seven_provinces_organization_negative_modifier: "Organizacja Siedmiu Prowincji"
 desc_ned_seven_provinces_organization_positive_modifier: ""
 desc_ned_seven_provinces_organization_negative_modifier: ""
 ned_protection_of_frisian_freedom: "Obrona fryzyjskiej wolności"
 desc_ned_protection_of_frisian_freedom: "Wartości Fryzów znajdują się teraz pod naszą ochroną."
 ned_hollander_settlers: "Osadnicy holenderscy"
 desc_ned_hollander_settlers: "Do tej prowincji przybywają nowi osadnicy z północnych Niderlandów."
 ned_je_maintiedrai: "Je Maintiendrai"
 desc_ned_je_maintiedrai: "Nasza hegemonia w Niderlandach wywarła trwały wpływ na nasze państwo."
 ned_devise_glorious_crossing: "Przygotować wspaniałą przeprawę"
 desc_ned_devise_glorious_crossing: "Przygotujmy się do przeprawy przez kanał La Manche i zdobycia tronu Anglii."
 ned_preparation_of_british_conquest: "Przygotowania do podboju Brytanii"
 desc_ned_preparation_of_british_conquest: "Wypłyniemy, by podbić całą Brytanię w imię naszego państwa."
 ned_conquest_of_england: "Podbój Anglii"
 desc_ned_conquest_of_england: "Anglia znajduje się teraz pod naszym panowaniem."
 ned_man_o_war_modifier: "Brytyjski poddany"
 desc_ned_man_o_war_modifier: ""
 ned_the_bock: "Bock"
 desc_ned_the_bock: "Bock w Luksemburgu dodatkowo pomaga nam zabezpieczyć ten obszar."
 ned_baltic_grain_supply: "Dostawy zboża z Bałtyku"
 desc_ned_baltic_grain_supply: "Zapewniliśmy sobie dostawy zboża z Bałtyku, co pozwala nam dalej zwiększać populację."
 ned_connection_to_the_baltic: "Połączenie z Bałtykiem"
 desc_ned_connection_to_the_baltic: "Nasze połączenie z Bałtykiem jest już zabezpieczone, co umożliwia dalszy rozwój handlu w tym regionie."
 ned_found_dutch_states_army: "Utworzyć Armię Stanów Generalnych"
 desc_ned_found_dutch_states_army: "Armia Stanów pozwala nam chronić państwo przed wszelkimi najeźdźcami."
 ned_empowered_staatse_leger: "Armia Stanów Generalnych"
 ned_low_countries_fort_buff: "Budowa fortyfikacji"
 desc_ned_low_countries_fort_buff: ""
 ned_low_countries_fort_buff_buffed: "Budowa fortyfikacji"
 desc_ned_low_countries_fort_buff_buffed: ""
 ned_dutch_cloth_trading: "Handel niderlandzkim suknem"
 desc_ned_dutch_cloth_trading: "Znaczna część handlu suknem w tym regionie znajduje się pod kontrolą holenderskich kupców."
 ned_flemish_cloth_trading: "Handel flamandzkim suknem"
 desc_ned_flemish_cloth_trading: "Flamandzki handel suknem należy do najsłynniejszych gałęzi handlu w Niderlandach."
 ned_dutch_polders_modifier: "Niderlandzkie poldery"
 desc_ned_dutch_polders_modifier: "Holenderskie poldery chronią odzyskane przez nas ziemie przed zniszczeniem przez powodzie."
 ned_reclamation_of_coast: "Osuszanie wybrzeża"
 desc_ned_reclamation_of_coast: "Ta prowincja otrzymuje inwestycje od nowych osadników."
 ned_dutch_urbanization: "Urbanizacja Niderlandów"
 desc_ned_dutch_urbanization: "Na tym obszarze mieszka wiele osób, co zmusza nas do maksymalizacji sprawności administracji."
 ned_flemish_urbanization: "Urbanizacja Flandrii"
 desc_ned_flemish_urbanization: "Flamandzka większość mieszkańców tego obszaru ułatwia nam sprawniejsze zarządzanie nim."
 ned_staatse_vloot: "Flota Stanów Generalnych"
 desc_ned_staatse_vloot: "Flota Stanów będzie chronić wszelkie morskie interesy naszego państwa."
 ned_elite_naval_infantry: "Elitarna piechota morska"
 desc_ned_elite_naval_infantry: "Liczne operacje zamorskie pozwoliły nam jeszcze bardziej wzmocnić piechotę morską."
 ned_black_devils_modifier: "Czarne Diabły"
 desc_ned_black_devils_modifier: "Czarne Diabły to najsłynniejszy korpus piechoty morskiej w Niderlandach."
 ned_maximize_cargo_space: "Maksymalizacja przestrzeni ładunkowej"
 desc_ned_maximize_cargo_space: "Zamiast wyposażać nasze statki handlowe w działa i żołnierzy, zwiększmy maksymalnie przestrzeń przeznaczoną na ładunek."
 ned_diversify_fluyts: "Zróżnicowana flota fluit"
 desc_ned_diversify_fluyts: "Nasze statki handlowe nie powinny służyć wyłącznie do przewozu towarów. Powinny pełnić bardziej wszechstronną funkcję, transportując żołnierzy i zwalczając piratów."
 ned_letter_of_marques: "Listy kaperskie"
 desc_ned_letter_of_marques: "Pozwalając Morskim Żebrakom swobodnie łupić naszych wrogów, będziemy mogli odkupywać zdobyte przez nich okręty po obniżonej cenie."
 ned_one_world: "Jeden świat"
 desc_ned_one_world: "Nasze statki dotarły do każdego zakątka świata, łącząc nas ze wszystkimi portami."
 ned_prelude_true_freedom: "Wstęp do prawdziwej wolności"
 desc_ned_prelude_true_freedom: "Nasze państwo przybiera kształt ustroju, który stawia na wolność obywateli."
 ned_true_freedom: "Prawdziwa wolność"
 desc_ned_true_freedom: "Swobody, z których korzysta nasze społeczeństwo, pozwalają mieszkańcom podejmować naprawdę niezwykłe działania. Szczególnie wiele zawdzięczają im kupcy, których sukcesy wynikają po części z naszego podejścia do działalności gospodarczej i praw obywateli."
 ned_orangist_triumph: "Triumf oranżystów"
 desc_ned_orangist_triumph: "Oraniści przejęli kontrolę nad rządem, umożliwiając ustanowienie bardziej absolutnej władzy."
 ned_seat_of_many_artists: "Siedziba wielu artystów"
 desc_ned_seat_of_many_artists: "Na nasz dwór przybywa wielu nowych artystów."
 ned_dutch_golden_age: "Złoty wiek Niderlandów"
 desc_ned_dutch_golden_age: "Naród holenderski osiągnął złoty wiek."
 ned_set_sail_to_unknown: "Wypłynąć ku nieznanemu"
 desc_ned_set_sail_to_unknown: "Nasi odkrywcy wypłynęli poza znane szlaki, by znaleźć nowe drogi handlowe."
 ned_carribean_colony: "Kolonia na Karaibach"
 desc_ned_carribean_colony: "Karaiby mogą być doskonałym miejscem do zakładania kolonii — najpierw musimy jednak zbadać ten obszar."
 ned_grand_designs_effects: "Efekty wielkiego planu"
 desc_ned_grand_designs_effects: "Zabezpieczyliśmy już handel na Wybrzeżu Kości Słoniowej i w Brazylii, zyskując większą kontrolę nad handlem zamorskim."
 ned_a_stop_before_india: "Przystanek przed Indiami"
 desc_ned_a_stop_before_india: "Kolonia Przylądkowa stanowi doskonałą bazę wypadową przed dotarciem do Indii."
 ned_formossa_fort: "Placówka na Formozie"
 desc_ned_formossa_fort: "Na Formozie powstanie fort, który będzie chronił nasze szlaki handlowe w Chinach."
 ned_fort_of_batavia: "Fort w Batavii"
 desc_ned_fort_of_batavia: "Batavia pełni funkcję ważnego portu w Indiach Wschodnich."
 ned_land_of_many_values: "Kraina wielu bogactw"
 desc_ned_land_of_many_values: "Zamiast narzucać jedną wiarę, kulturę i prawo, nasze ziemie wspierają różnorodny styl życia."
 ned_dutch_admirality: "Admiralicje niderlandzkie"
 desc_ned_dutch_admirality: "Holenderskie admiralicje służą naszemu państwu, choć kierują się również własnymi interesami."
 ned_cape_city: "Miasto Przylądka"
 ned_dutch_traders: "Kupcy niderlandzcy"
 NED_INFLUENCE_IN_IVORY_COAST: "Wpływy na Wybrzeżu Kości Słoniowej"
 CAPE_CITY: "Miasto Przylądkowe"
 DUTCH_TRADERS: "Wpływy holenderskich kupców"
 NED_IF_SUBJECT: "Jeśli ukończymy tę misję, będąc §Mpoddanym§!:"
 NED_IF_FREE: "Jeśli ukończymy tę misję, będąc §Mniepodległym§!:"
 NED_WE_WONT_LOSE_STABILITY_UPON_DECLARING_WAR_ON_OVERLORD: "Wypowiadając wojnę o niepodległość naszemu §Yzwierzchnikowi§!, nie stracimy §Ystabilności§!."
