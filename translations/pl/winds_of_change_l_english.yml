 mongol_brother_realm_modifier: "Bratnie państwo"
 desc_mongol_brother_realm_modifier: "To państwo jest naszym państwem braterskim. Choć podlega naszemu zwierzchnictwu, posłusznie wykonuje nasze rozkazy — jak na dobre państwo braterskie przystało."
 hordes_brother_realm_cavalry_buff: "Bratnie państwo"
 desc_hordes_brother_realm_cavalry_buff: "To nasze państwo braterskie. Dostarczy nam konie na nadchodzące wojny."
 oir_execution_of_the_emperor: "Prawowite roszczenia do Chin"
 desc_oir_execution_of_the_emperor: "Zaprzyjaźniając się z pojmanym cesarzem Chin, zdołaliśmy wpłynąć na bieg wydarzeń i wkroczyć do Chin nie jako zdobywcy, lecz jako odnowiciele."
 horde_mission_events.1.t: "Plądrowanie Węgier"
 horde_mission_events.1.d: "Wraz z powrotem plemion mongolskich do Kotliny Karpackiej i ich zwycięstwami nad zamieszkującymi ją Madziarami nasza armia zaczęła robić to, co zawsze robi po zwycięstwie — plądrować. Wioski i miasta są łupione w imię [Root.Monarch.GetTitle], a zdobyte góry złota pozwolą nam opłacić żołnierzy za to wielkie zwycięstwo."
 horde_mission_events.1.a: "Tym razem zostajemy tu na stałe."
 horde_mission_events.2.t: "Stolica Złotej Ordy"
 horde_mission_events.2.d: "Wraz z upadkiem [466.GetName], dawnej stolicy Złotej Ordy, stajemy przed interesującym wyborem. Możemy przenieść nasz dwór do tego niegdyś ważnego miasta albo zachować obecną siedzibę w [Root.Capital.GetName], co zapewni nam stabilność zamiast chwały."
 horde_mission_events.2.a: "[466.GetName] będzie naszą nową stolicą."
 horde_mission_events.2.b: "[Root.Capital.GetName] jest odpowiednim miastem."
 horde_mission_events.3.t: "Wielkie Państwo"
 horde_mission_events.3.d: "Po odrodzeniu Złotej Ordy możemy zachować tę nazwę lub przemianować nasze państwo na „Ulug Ulus” — inną nazwę Złotej Ordy, oznaczającą „Wielkie Państwo”."
 horde_mission_events.3.a: "Nową nazwą będzie Ulug Ulus."
 horde_mission_events.3.b: "Na razie [Root.GetName] nam wystarczy."
 horde_mission_events.4.t: "Ojczyzna Kazachów"
 horde_mission_events.4.d: "Umocniwszy naszą pozycję w Azji Środkowej, nawiązaliśmy kontakt z Kazachami. Ich ziemie zostały podbite przez inne plemiona koczownicze, a oni sami pozostają jedynie poddanymi w Azji Środkowej. Być może możemy wykorzystać tę sytuację, by usprawiedliwić część naszych podbojów…"
 horde_mission_events.4.a: "Niech zostaną naszymi poddanymi w zamian za autonomię."
 horde_mission_events.4.b: "Jesteśmy zdobywcami, nie wyzwolicielami."
 horde_mission_events.5.t: "Perski chanat"
 horde_mission_events.5.d: "Po rozpadzie imperium mongolskiego Ilchanat umocnił swoją pozycję w Persji, lecz z czasem osłabł i ostatecznie padł ofiarą obcych najeźdźców. Teraz, gdy powróciliśmy do Persji, możemy przejąć jego dziedzictwo albo po prostu je zignorować i kontynuować podboje."
 horde_mission_events.5.a: "Będą z nich znakomici poddani."
 horde_mission_events.5.b: "Nie obchodzą nas dawno utracone zaszczyty."
 horde_mission_events.5.c: "Zostańmy Ilchanatem!"
 horde_mission_events.7.t: "Pokój mongolski"
 horde_mission_events.7.d: "Po latach podbojów wreszcie osiągnęliśmy coś, co uważano za niemożliwe. Dzięki odrodzeniu imperium mongolskiego nie musimy już jedynie udawać spadkobierców dawnej chwały – możemy rządzić jako najgroźniejszy lud, jaki kiedykolwiek istniał. Nasze imperium przewyższa rozmiarami nawet państwo Czyngis-chana, a my możemy zaprowadzić w nim wewnętrzny pokój, który nazwiemy „Pax Mongolica”."
 horde_mission_events.7.a: "Jesteśmy prawdziwymi następcami Temudżina."
 horde_mission_events.8.t: "Za Smoczą Bramą"
 horde_mission_events.8.d: "Po wielu próbach szturmu i zdobycia Wielkiego Muru Chińskiego wreszcie odnieśliśmy sukces. Niegdyś potężny mur, który miał powstrzymać koczowników takich jak my przed wkroczeniem do Chin, znajduje się teraz w naszych rękach. Możemy dzięki temu najeżdżać samo serce Chin."
 horde_mission_events.8.a: "Wreszcie się udało. Smocza Brama należy do nas."
 horde_mission_events.9.t: "Los chińskiego [EmperorOfChina.Monarch.GetTitle]"
 horde_mission_events.9.d: "Pojmanie [EmperorOfChina.Monarch.GetTitle] dynastii Ming podczas kryzysu w Tumu oraz chaos panujący w [EmperorOfChina.Capital.GetCapitalName] otworzyły przed nami nowe możliwości działania w Chinach. [EmperorOfChina.Monarch.GetTitle] okazał się dość przyjazny, nawet jak na naszego jeńca. Możemy wykorzystać tę okazję, by osiągnąć dalsze korzyści."
 horde_mission_events.9.a: "[EmperorOfChina.Monarch.GetSheHeCap] zostanie naszym nowym przyjacielem."
 horde_mission_events.9.b: "Niech [EmperorOfChina.Monarch.GetHerHim] pozostanie naszym jeńcem."
