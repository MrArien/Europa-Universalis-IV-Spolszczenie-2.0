 estate_nobles_reformatio_sigismundi_desc: "Od stuleci Czechy stanowią integralną część Świętego Cesarstwa Rzymskiego. Nadszedł czas, by ostatecznie umocnić w nim naszą pozycję poprzez zacieśnienie więzi kulturowych z naszymi niemieckimi poddanymi."
