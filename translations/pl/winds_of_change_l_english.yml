 hab_milan_desc: "[MLO.GovernmentName] Mediolanu sprawia problemy, aczkolwiek jest ważną częścią Cesarstwa. Musimy się upewnić, że jej bogactwa nie zostaną wykorzystane przeciwko nam poprzez zwiększenie naszej kontroli nad nimi."
 hab_croatia_title: "Zabezpieczenie Chorwacji"
 hab_croatia_desc: "Stwórzmy granicę wojskową w starym królestwie Chorwacji. W ten sposób możemy odeprzeć każdego, kto wkroczy na chrześcijańskie ziemie południowo-wschodniej Europy."
 hab_beat_up_ottomans_title: "Zaraza Europy"
 hab_beat_up_ottomans_desc: "Chrześcijaństwo nigdy nie będzie bezpieczne przed niewiernymi, dopóki nie wypędzimy osmańskiego zagrożenia z Europy."
 hab_austria_prospers_title: "Austria w rozkwicie"
 hab_austria_prospers_desc: "Od winnic na północy po kopalnie i kuźnie na południu, cała Austria będzie prosperować, gdy nasz naród będzie wzrastał w siłę."
 hab_vienna_waltz_title: "Walc wiedeński"
 hab_vienna_waltz_desc: "Nasza stolica Wiedeń musi rozkwitnąć i stać się miastem muzyki i wysokiej kultury, godnym władcy naszej rangi i prawdziwą stolicą Świętego Cesarstwa Rzymskiego."
 hab_secure_electors_title: "Zabezpieczenie elektorów"
 hab_secure_electors_desc: "Odkąd Rudolf, hrabia Habsburg, został koronowany na Świętego Cesarza Rzymskiego i wprowadził swoją rodziną do Księstwa Austrii, celem wszystkich kolejnych książąt było zostać cesarzem. Musimy zrobić wszystko co w naszej mocy, aby zapewnić Imperium stabilność, której potrzebuje Cesarz austriacki."
 hab_branching1_title: "Misja z rozgałęzieniem"
 hab_branching1_desc: "Jest to misja z rozgałęzieniem. Jej warunki i efekty będą oparte na naszym wyborze w misji §Yzabezpieczenia elektorów§!"
 hab_branching6_title: "Misja z rozgałęzieniem"
 hab_branching6_desc: "Jest to misja z rozgałęzieniem. Jej warunki i efekty będą oparte na naszym wyborze w misji §Yzabezpieczenia elektorów§!"
 hab_italian_ambition_title: "Włoska ambicja"
 hab_italian_ambition_desc: "Bogate ziemie północnych Włoch od dawna ignorują imperialne dekrety. Nie wolno nam tolerować tych miast, położonych tak blisko serca Austrii."
 hab_kingdom_of_italy_title: "Jedyny prawdziwy król Włoch"
 hab_kingdom_of_italy_desc: "Nasz podbój Włoch został sfinalizowany. Od Lombardii po Neapol, korona, którą teraz nosimy, ma władzę nad wszystkim."
 hab_decline_of_hungary_title: "Upadek Węgier"
 hab_decline_of_hungary_desc: "Niepokojący jest regres Węgier względem Księstwa Austrii. Musimy zacieśnić nasze stosunki z Węgrami, aby ich ziemie nie wpadły we wrogie ręce."
 hab_crusade_ottomans_title: "Osmańskie zagrożenie"
 hab_crusade_ottomans_desc: "Rosnące w siłę Imperium Osmańskie było zagrożeniem nie tylko dla Europy Wschodniej, ale także dla wielu krajów Europy Środkowej i Południowej. Musimy poprowadzić kampanię mającą na celu powstrzymanie ich ekspansji."
 hab_liberate_balkans_title: "Wyzwolenie Bałkanów"
 hab_liberate_balkans_desc: "Jeśli mamy kiedykolwiek mieć nadzieję na pokonanie Osmanów, musimy uderzyć na ich ziemie w Europie. Są to Bałkany, więc musimy przygotować kampanię przeciwko nim."
 hab_eastern_roman_empire_title: "Cesarze Wschodu"
 hab_eastern_roman_empire_desc: "Wraz z końcem Imperium Osmańskiego pojawiło się nowe pytanie: co z dziedzictwem Cesarstwa Wschodniorzymskiego? Powinniśmy rościć sobie do niego prawo, aby jeszcze bardziej legitymizować nasz tytuł cesarza."
 hab_balance_estates_title: "Równowaga klas"
 hab_balance_estates_desc: "Zbyt często niezgoda i podziały nękały nasz kraj. Szlachta, duchowieństwo i mieszczanie muszą działać jako jedność, aby osiągnąć cel, jakim jest większa chwała i dobrobyt Austrii."
 hab_vienna_university_title: "Uniwersytet Wiedeński"
 hab_vienna_university_desc: "Uniwersytet Wiedeński, założony w 1365 roku przez księcia Rudolfa IV Austriackiego, stał się ważnym ośrodkiem nauki od XV do XVIII wieku. Oferując szerokie spektrum przedmiotów, w tym teologię, filozofię, prawo, medycynę i sztukę, przyciągał uczonych i studentów z całej Europy."
 hab_von_raab_title: "Reformy Von Raaba"
 hab_von_raab_desc: "Franz Anton von Raab był wpływową postacią pod koniec XVIII i na początku XIX wieku, szczególnie znaną ze swoich reform w Cesarstwie Austriackim. Służąc jako minister finansów pod rządami cesarza Józefa II w latach 1784-1792, von Raab wdrożył znaczące reformy fiskalne i administracyjne mające na celu modernizację systemu finansowego imperium. Jego reformy obejmowały wysiłki na rzecz centralizacji poboru podatków, usprawnienia biurokracji rządowej i racjonalizacji wydatków państwowych. Obecnie dąży on do zniszczenia wpływów szlachty, która przez wieki nękała austriackie królestwo."
 hab_branching2_title: "Misja z rozgałęzieniem"
 hab_branching2_desc: "Jest to misja z rozgałęzieniem. Jej warunki i efekty będą oparte na naszym wyborze w misji §Yzabezpieczenia elektorów§!"
 hab_branching5_title: "Misja z rozgałęzieniem"
 hab_branching5_desc: "Jest to misja z rozgałęzieniem. Jej warunki i efekty będą oparte na naszym wyborze w misji §Yzabezpieczenia elektorów§!"
 hab_naples_title: "Król Neapolu"
 hab_naples_desc: "Dodając Królestwo Neapolu do naszej kolekcji tytułów, możemy umocnić naszą kontrolę nad Włochami i zbliżyć się o krok do poddania całego półwyspu pod nasze panowanie."
 hab_hungary_title: "Królewskie Węgry"
 hab_hungary_desc: "Królestwu Węgier zagrażają niebezpieczni wrogowie ze wszystkich stron. Musimy wkroczyć i sami ochronić naród węgierski, jednocząc ich ziemie pod jednym władcą."
 hab_multicultural_empire_title: "Cesarstwo wielokulturowe"
 hab_multicultural_empire_desc: "Prowadzona przez nas ekspansja na wschód i południe sprawia, że do naszego Imperium napływa coraz więcej nieniemieckojęzycznych obcokrajowców. Nasza długoterminowa stabilność zależy od naszej zdolności do efektywnego zintegrowania tych poddanych narodów."
 hab_the_last_knights_title: "Ostatni rycerze Europy"
 hab_the_last_knights_desc: "Chociaż Austria nie posiada kwitnącego kwiatu rycerstwa w porównaniu z innymi krajami, słynie z tego, że jest ostatnim bastionem tych tradycji w Europie."
 hab_aeiou_title: "A.E.I.O.U."
 hab_aeiou_desc: "Musimy przekuć Święte Cesarstwo Rzymskie w duże państwo z silną, scentralizowaną władzą centralną mogącą zdominować wszystkich pozostałych członków Cesarstwa. Dopiero wtedy, i tylko wtedy, prawdziwe stanie się motto Fryderyka III: Austriae est imperare orbi universo (cały świat należy do Austrii)."
 hab_weaken_france_title: "Osłabienie Francji"
 hab_weaken_france_desc: "Francuzi są naszymi głównymi rywalami w walce o hegemonię nad Niemcami i całą Europą. Musimy ich osłabić do tego stopnia, aby już nigdy nie mogli stanowić zagrożenia dla naszych imperialnych ambicji."
 hab_western_europe_title: "Hegemon Europy"
 hab_western_europe_desc: "Po upadku Francji i Iberii nie ma już dla nas konkurencji na Zachodzie. Ogłośmy się hegemonami Europy."
 hab_crown_of_bohemia_title: "Korona Czech"
 hab_crown_of_bohemia_desc: "Losy Królestwa Czech należały od dawna do interesów książąt Austrii. Musimy działać bardziej aktywnie i głębiej wciągnąć Królestwo w naszą orbitę."
 hab_surpass_poland_title: "Prześcignięcie Polaków"
 hab_surpass_poland_desc: "Święte Cesarstwo Rzymskie wdało się w kilka konfliktów z polską koroną. Być może teraz nadszedł czas, aby ich prześcignąć i podbić ich ziemie."
 hab_king_of_poland_title: "Król Polski"
 hab_king_of_poland_desc: "Nasza północno-wschodnia granica nigdy nie będzie naprawdę bezpieczna, dopóki cała Polska nie będzie własnością [Root.GetStateForm_gen]."
 hab_ostend_company_title: "Kompania Ostendzka"
 hab_ostend_company_desc: " Inne europejskie mocarstwa stały się bajecznie bogate dzięki swoim kompaniom handlowym w koloniach. Teraz, gdy kontrolujemy Holandię, powinniśmy starać się im dorównać."
 hab_indian_trading_title: "Posiadłości w Indiach"
 hab_indian_trading_desc: "Nasze cesarstwo kolonialne nie będzie pełne, dopóki nie będzie posiadać znaczących posiadłości w Indiach oraz Indonezji."
 hab_austrian_australia_title: "Osadnictwo w Australii"
 hab_austrian_australia_desc: "Ziemie na dalekim południowym wschodzie znanego świata otrzymały nazwę dziwnie podobną do nazwy naszego narodu. Jest jasne, że miały być nasze."
 hab_balance_of_power_title: "Równowaga sił"
 hab_balance_of_power_desc: "Musimy ustanowić równowagę sił w Europie, w której zagwarantowana będzie nasza stała dominacja."
 hab_spread_dynasty_title: "Wszechobecność von Habsburgów"
 hab_spread_dynasty_desc: "Naturalnym miejscem rodziny Habsburgów jest tron. Musimy zdobyć trony Europy dla naszej rodziny."
 hab_burgundy_title: "Odzyskanie Burgundii"
 hab_burgundy_desc: "Terytoria Burgundii przestały należeć do Świętego Cesarstwa Rzymskiego. Musimy zadbać o to, by w ten czy inny sposób ponownie znalazły się pod naszą panowaniem."
 hab_austrian_netherlands_title: "Austriackie Niderlandy"
 hab_austrian_netherlands_desc: "Na ziemiach holenderskich znajduje się wiele dobrze prosperujących miast. Jeśli uda nam się uczynić je naszymi, będziemy w stanie znacznie wzmocnić nasz skarbiec i tym samym sprawić, że zaspokoimy ambicje zamorskiego imperium."
 hab_defeat_west_franks_title: "Pokonanie Francuzów"
 hab_defeat_west_franks_desc: "Po osłabieniu Francuzów ich królestwo pogrążyło się w chaosie. Nadszedł czas, aby dokonać zamachu stanu i położyć im kres raz na zawsze."
 hab_silesia_title: "Odzyskanie Śląska"
 hab_silesia_desc: "Prowincja Śląsk jest prawowitą częścią dziedzictwa habsburskiego, lecz została utracona. Musimy ją odzyskać przez wzgląd na majestat dynastii Habsburgów."
 hab_galicia_title: "Podbicie Galicji"
 hab_galicia_desc: "Polska jest słabym państwem kierowanym przez słabych władców. Wiodące narody świata, a zwłaszcza nasz własny, powinny podzielić ją przy pierwszej okazji."
 hab_china_title: "Bogactwa Chin"
 hab_china_desc: "Kupcy opowiadają o krainie bajecznych bogactw na dalekim wschodzie. Musimy wysłać nasze okręty wojenne i negocjatorów, aby upewnić się, że to bogactwo wpłynie wprost do naszych kieszeni."
 hab_shift_in_balance_title: "Zmiana równowagi"
 hab_shift_in_balance_desc: "Równowaga sił jest bardzo dobra, ale jeśli uda nam się ją przesunąć na naszą korzyść. Będziemy wtedy na dobrej drodze do zajęcia należnej nam pozycji dominującego państwa w całej Europie."
 hab_imperial_borders_title: "[Root.GetPreviewColorHAB]Cesarska granica[Root.GetPreviewColorHAB_end]"
 hab_imperial_borders_desc: "Niektóre terytoria Cesarstwa odrzucił nasze zwierzchnictwo i są rządzone przez tych, którzy nie uznają władzy Cesarza. Ta sytuacja musi zostać naprawiona."
 hab_imperial_capitals_title: "[Root.GetPreviewColorHAB]Cesarskie bogactwo[Root.GetPreviewColorHAB_end]"
 hab_imperial_capitals_desc: "Musimy zadbać o to, aby stolice naszych prowincji odzwierciedlały naszą pozycję jako filaru siły, na którym opiera się Święte Cesarstwo Rzymskie."
 hab_switzerland_title: "[Root.GetPreviewColorHAB]Zemsta Gesslera[Root.GetPreviewColorHAB_end]"
 hab_switzerland_desc: "Już wcześniej próbowaliśmy zaanektować Szwajcarię, ale za każdym razem nam się to nie udawało - w jednym przypadku przez prostego rolnika z łukiem i strzałami. Musimy przezwyciężyć pokolenia upokorzeń, których doświadczyliśmy i sprowadzić tych zbuntowanych rolników pod nasze rządy."
 hab_develop_southern_germany_title: "[Root.GetPreviewColorHAB]Miasta południowych Niemiec[Root.GetPreviewColorHAB_end]"
 hab_develop_southern_germany_desc: "Południowe Niemcy są domem dla wielu wielkich niemieckich rodzin. Rozwijając ich ziemie, możemy zyskać ich przychylność."
 hab_tirol_silver_mine_title: "Austriackie srebro"
 hab_tirol_silver_mine_desc: "W Tyrolu znajduje się jedna z najbardziej dochodowych kopalni srebra w Europie. Rozbudowując ją, możemy dalej wykorzystywać to bogactwo dla siebie."
 hab_a_holy_empire_title: "[Root.GetPreviewColorHAB]Święte Cesarstwo[Root.GetPreviewColorHAB_end]"
 hab_a_holy_empire_desc: "Napięcia między państwami członkowskimi zostały spotęgowane przez różnice religijne. Musimy przywrócić jedność religijną, jeśli chcemy odzyskać autorytet moralny, do którego pretendujemy jako 'Święte' Cesarstwo Rzymskie."
 hab_true_holy_roman_emperor_title: "[Root.GetPreviewColorHAB]Cesarze Rzymu[Root.GetPreviewColorHAB_end]"
 hab_true_holy_roman_emperor_desc: "Po uchwaleniu reform cesarskich liczni książęta postrzegają nas jako prawdziwych następców Rzymu. Zamiast być zwykłymi spadkobiercami dziedzictwa Cesarstwa Zachodniego, możemy wreszcie rościć sobie prawa do niegdyś wielkiego i starożytnego Cesarstwa."
 hab_bavaria_title: "[Root.GetPreviewColorHAB]Księstwo Bawarii[Root.GetPreviewColorHAB_end]"
 hab_bavaria_desc: "Bawarczycy od dawna są problemem na naszej północno-zachodniej granicy. Ich bogate księstwo ma potencjał, by być wielkim cierniem w naszym boku. Powinniśmy zabezpieczyć nasze granice i naszą dominację, przejmując je dla siebie."
 hab_unify_germany_title: "[Root.GetPreviewColorHAB]Zjednoczenie Niemiec[Root.GetPreviewColorHAB_end]"
 hab_unify_germany_desc: "Brak jedności w Niemczech trwał zbyt długo. Święte Cesarstwo Rzymskie tylko podzieliło kraj, zamiast go zjednoczyć. Siłą zjednoczymy liczne państwa niemieckie pod naszym sztandarem."
 hab_venetian_ports_title: "Weneckie porty"
 hab_venetian_ports_desc: "Wenecja jest znana ze swoich flot handlowych, bogactwa i tradycji morskich. Podbijając ich porty we Włoszech, możemy zacząć tworzyć flotę, która zdominuje Morze Śródziemne."
