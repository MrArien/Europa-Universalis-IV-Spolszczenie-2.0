 apostolic_kingdom: "Królestwo apostolskie"
 apostolic_kingdom_desc: "Gdy papież Sylwester II przekazał świętą koronę Węgier świętemu Stefanowi, uznał nas za oficjalnych legatów apostolskich, powołanych do ochrony narodów chrześcijaństwa. Jako prawowici następcy Stefana dumnie stoimy na straży Chrystusa i jesteśmy bastionem wiary chrześcijańskiej."
 cuman_lancers_reform: "Zatrudnij kumańskich lansjerów"
 cuman_lancers_reform_desc: "Kumanowie od stuleci zamieszkują okolice Kotliny Karpackiej, a niedawno uczynili rozległe stepy między Dunajem a Cisą swoim stałym domem. Choć wielokrotnie pomagali nam w konfliktach, warto nadać ich oddziałom stałe miejsce w strukturze naszych armii."
 mechanic_order_of_the_dragon_unlocked_yes: "Ma dostęp do lokalnej organizacji §YZakon Smoka§!."
