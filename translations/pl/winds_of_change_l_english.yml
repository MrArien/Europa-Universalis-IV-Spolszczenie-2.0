 feo_russian_aristocracy_idea_buff: "Powiązania z rosyjską arystokracją"
 desc_feo_russian_aristocracy_idea_buff: "Mimo że władają nami ziemie tatarskie i greckie, znaczna część naszej arystokracji utrzymuje powiązania z rosyjskimi rodami. Wykorzystując te kontakty, możemy wzmocnić nasz prestiż i wpływy dyplomatyczne."
 feo_heart_of_steppes: "Serce stepów"
 merchant_aristocracy_reform: "Arystokracja kupiecka"
 merchant_aristocracy_reform_desc: "Państwa dążące do realizacji celów kupieckich często przyjmują bardziej republikańską formę rządów. Władcy Gotii byli jednak kupcami wywodzącymi się z czasów panowania Komnenów, którzy przejęli krymskie posiadłości i sprawowali władzę w sposób bliższy monarchii."
 gothic_monarchy_reform: "Monarchia gocka"
 gothic_monarchy_reform_desc: "Odrzucając bardziej kupiecki charakter państwa, monarchia gocka stawia na militaryzm i rekrutowanie najemników z całego świata, aby narzucać innym swoje cele geopolityczne."
 russian_mercenary_guard_reform: "Rosyjska gwardia najemna"
 russian_mercenary_guard_reform_desc: "Rosjanie od dawna są naszymi bliskimi sojusznikami i postanowili wesprzeć nas w rozbudowie armii. Żołnierze ci służą teraz jako gwardia naszego państwa."
 flavor_feo.1.t: "Oferta rodu Gawrasów"
 flavor_feo.1.d: "Gawrasowie z Teodoro zaoferowali nam ochronę, jeśli zgodzimy się zostać ich poddanymi."
 flavor_feo.1.a: "Przyjmujemy ofertę."
 flavor_feo.1.b: "Nigdy!"
 flavor_feo.2.t: "Następcy Rzymu?"
 flavor_feo.2.d: "Przed nami panowało wielu cesarzy. Niektórzy wiedli chwalebne życie, odzyskując ziemie niegdyś należące do Rzymu, inni zaś przyczynili się do jego upadku. Teraz, gdy stoimy w samej Hagii Sophii, musimy podjąć decyzję. Czy będziemy kontynuować rzymskie dziedzictwo, czy może wybierzemy inną drogę?"
 flavor_feo.2.a: "Jesteśmy prawdziwymi następcami Cesarstwa Bizantyjskiego!"
 flavor_feo.2.b: "Nie jesteśmy następcami Rzymu, lecz pozostałością po Gotach."
 flavor_feo.3.t: "Zerwane więzi z Włochami"
 flavor_feo.3.d: "Nasi sojusznicy we Włoszech zostali pokonani. Pozostaliśmy więc bez wsparcia na Półwyspie Apenińskim."
 flavor_feo.3.a: "Trudno..."
 flavor_feo.4.t: "Pozostałości po Genueńczykach"
 flavor_feo.4.d: "Upadek Azowa jest naszym wielkim zwycięstwem. Nie tylko pozwolił nam całkowicie wyeliminować przyszłe włoskie wyprawy w tym regionie, lecz także dał nam dostęp do licznych bogactw, które pozostawili po sobie Włosi. Możemy wykorzystać je wedle uznania, ale powinniśmy zadbać, by nic się nie zmarnowało."
 flavor_feo.4.a: "Wykorzystajmy pozostawione bogactwa, by napełnić nasze skarbce."
 flavor_feo.4.b: "Inwestycja w naszą armię przyniesie korzyści."
 flavor_feo.4.c: "Nasza stolica rozpaczliwie potrzebuje remontu."
 flavor_feo.5.t: "Zaufani sojusznicy na Krymie"
 flavor_feo.5.d: "Kupiecka rodzina z Teodoro przysłała nam list z prośbą o przekazanie jej naszych krymskich posiadłości. W zamian nasi kupcy nie będą przez nich niepokojeni, co pozwoli nam utrzymać dominację handlową w regionie bez konieczności stacjonowania tam wojsk."
 flavor_feo.5.a: "Mogą otrzymać te ziemie, o ile dostaniemy swoją część zysków."
 flavor_feo.5.b: "Nie oddamy naszych posiadłości na Krymie."
 flavor_feo.7.t: "Pastwiska na Rusi"
 flavor_feo.7.d: "Ruś należy do najżyźniejszych ziem Europy Wschodniej. Odkąd znalazła się w naszych rękach, wielu Kozaków zaczęło się tam osiedlać. Jeśli im na to pozwolimy, zyskamy ich wdzięczność i dodatkowe korzyści. Korona nie będzie jednak mogła tak skutecznie wykorzystywać tych ziem."
 flavor_feo.7.a: "Kozacy mogą swobodnie osiedlać się na Rusi."
 flavor_feo.7.b: "Ziemie ruskie są zbyt cenne, by pozwolić Kozakom się na nich osiedlać."
 flavor_feo.6.t: "Jedność z Tatarami"
 flavor_feo.6.d: "Lata współżycia z ludnością tatarską sprawiły, że wielu naszych oficerów chce włączyć Tatarów w szeregi armii i uczynić z nich część naszych sił kawalerii. To jedni z najznakomitszych jeźdźców, jakich kiedykolwiek spotkaliśmy. Choć mogą mieć rację, takie rozwiązanie sprawiłoby również, że wielu Tatarów porzuciłoby życie na stepach i przestało zarządzać swoimi ziemiami na rzecz państwa."
 flavor_feo.6.a: "Choć jesteśmy Gotami, Tatarzy będą cennymi wojownikami."
 flavor_feo.6.b: "Tatarzy powinni pozostać na stepach, a nie w naszych szeregach."
 flavor_feo.9.t: "Na Kremlu"
 flavor_feo.9.d: "Po przejęciu pełnej kontroli nad Rusią znaczna część naszej arystokracji nazywa nas już carami, władcami Rosji. Kreml jest w pełni zabezpieczony, co dodatkowo umacnia nasze zdobycze i rozwiewa wszelkie wątpliwości co do naszych roszczeń. Pozostało nam zdecydować, jak będziemy rządzić. Czy zachowamy status władców państwa [Root.GetName], czy też ustanowimy monarchię dualistyczną?"
 flavor_feo.9.a: "Ruś stanie się częścią państwa [Root.GetName]."
 flavor_feo.9.b: "Będziemy zarówno Gawrasami, jak i Chowrasami."
 flavor_feo.9.c: "Wykorzystajmy siłę i wytrwałość miejscowej ludności."
