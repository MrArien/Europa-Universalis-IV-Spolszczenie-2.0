l_english:
 feo_black_sea_fleet_title: "Flota Morza Czarnego"
 feo_black_sea_fleet_desc: "Morze Czarne od przybycia Włochów na wybrzeża Krymu stało się areną zaciętej rywalizacji kupieckiej. Nasze księstwo stopniowo traci znaczenie na morzu, spychane na margines przez Osmanów, Włochów, ordy, a także innych Greków. Utworzenie nowej floty, która pozwoli stawić czoła tym zagrożeniom, przyniesie nam znaczne korzyści."
 feo_black_sea_domination_title: "Dominacja Morza Czarnego"
 feo_black_sea_domination_desc: "Handel od zawsze był głównym źródłem dochodów Greków. W Gotii jego znaczenie zmalało, odkąd osłabły rządy dynastii Komnenów, a pojawiło się włoskie jarzmo. Odzyskanie naszej pozycji nad Morzem Czarnym położy kres temu upadkowi."
 feo_komnenos_relations_title: "Więzi z Komnenami"
 feo_komnenos_relations_desc: "Komnenowie z Trapezuntu byli przed dziesięcioleciami naszymi dawnymi sojusznikami. Niegdyś władali Gotią, lecz nasza kupiecka rodzina stopniowo zdobywała znaczenie w polityce nad Morzem Czarnym. Teraz, gdy ich państwo chyli się ku upadkowi, być może nadszedł czas, by role się odwróciły."
 feo_constantinople_title: "Rodzinny dom kupców"
 feo_constantinople_desc: "Konstantynopol — miasto, w którym przed nami panowało wielu cesarzy. Dawne centrum kultury, bogactwa i prestiżu każdego Greka, a zarazem miejsce, z którego wywodzi się wiele rodzin podobnych do naszej. Czas powrócić tam raz jeszcze i urządzić triumf na ulicach, by wszyscy wiedzieli, że pokonaliśmy naszych wrogów."
 feo_balkan_conquest_title: "Bazyleus Bałkanów"
 feo_balkan_conquest_desc: "Bałkany były jednym z najważniejszych regionów dawnego Cesarstwa Bizantyjskiego. Choć jest to obszar górzysty, nie wolno lekceważyć jego bogactw. Przygotujmy wyprawę, by odzyskać te utracone ziemie Bizancjum."
 feo_rival_genoa_title: "Stosunki genueńskie"
 feo_rival_genoa_desc: "Przybycie Genueńczyków na zawsze zachwiało naszą pozycją w Gotii. Wielu zagranicznych kupców wykupuje od nas ziemie, ograniczając nasze wpływy na wybrzeżu do zaledwie jednego portu. Być może nadszedł czas, by stawić czoła temu zagrożeniu — mieczem lub piórem."
 feo_break_italian_control_title: "Rozprawa z Włochami"
 feo_break_italian_control_desc: "Wpływy Gotii na wybrzeżu od zbyt dawna leżą w ruinie. Jeśli kiedykolwiek mamy odzyskać dawną pozycję nad Morzem Czarnym, musimy poskromić Włochów albo całkowicie ich zniszczyć."
 feo_gothia_title: "Odrodzenie Gotii"
 feo_gothia_desc: "Ordy i Włosi zostali pokonani. Nasze księstwo, które niegdyś obejmowało jedynie miasto Mangup, stało się czymś znacznie większym. Możemy wreszcie przejść do kolejnego etapu narodowych ambicji: odbudowy Gotii."
 feo_gothia_ascendant_pp: "Potęga Gotii"
 feo_aegean_supremacy_title: "Dominacja na Morzu Egejskim"
 feo_aegean_supremacy_desc: "Czymże są kupcy, jeśli nie samolubnymi oportunistami? A czego mogliby pragnąć samolubni oportuniści na Morzu Egejskim, jeśli nie pełnej kontroli? Zabezpieczenie wysp Morza Egejskiego lub ufortyfikowanie jego wybrzeży pozwoli nam zdobyć przewagę nad rywalami i wrogami zamieszkującymi te ziemie."
 feo_azov_sea_title: "Kwestia Azowa"
 feo_azov_sea_desc: "Prowincja Azow na Krymie jest jednym z najważniejszych portów Morza Czarnego. Włosi rozbudowali ją, czyniąc z niej główną bazę swojego handlu, co zagraża naszym planom zdominowania tego akwenu. Być może nadszedł więc czas na rozmowę kupca z kupcem...."
 feo_conflits_in_lithuania_title: "Równiny Ruskie"
 feo_conflits_in_lithuania_desc: "Nasz podbój stepów sprowadził do nas wielu zagranicznych jeźdźców, być może zbyt wielu, abyśmy mogli sobie z nimi poradzić. Podbijając Ruś, być może uda nam się osiedlić tam część z nich."
 feo_gavras_triumphant_title: "Triumf Gawrasów"
 feo_gavras_triumphant_desc: "Jeszcze przed laty byliśmy jedynie skromną rodziną kupiecką. Dziś zasiadamy na złotym tronie, triumfując nad naszymi greckimi rywalami. Wkrótce cały świat pozna ten wyczyn."
 feo_gothic_invasion_title: "Inwazja gotycka"
 feo_gothic_invasion_desc: "Gotia odrodziła się, lecz dawne gockie obyczaje jeszcze nie powróciły. Niemcy wciąż nie zostały podbite, a tamtejsi królowie i królowe nie ugięli przed nami kolan. Zmusimy ich do tego siłą miecza."
 feo_crimea_title: "Krymscy ciemiężyciele"
 feo_crimea_desc: "Mieszkańcy Krymu od wielu dziesięcioleci są cierniem w naszym boku. Nieustannie najeżdżają nasze pogranicze, a czasem sprowadzają na nasze ziemie najeźdźców pokroju Tamerlana, by obrócili je w ruinę. Jedyną daniną, jaką otrzymają, będzie krew i popiół."
 feo_beyond_crimea_title: "W głąb stepów"
 feo_beyond_crimea_desc: "Nasza kampania krymska zakończyła się wielkim sukcesem — jednym posunięciem rozprawiliśmy się z dwoma problemami. Teraz musimy wkroczyć jeszcze głębiej na ziemie stepowe i wykorzystać doświadczenie naszych wojowników, by odnieść kolejne zwycięstwa."
 feo_integrate_cossacks_title: "Awangarda $MONARCHTITLE$"
 feo_integrate_cossacks_desc: "Tatarzy mogli niegdyś być naszymi wrogami, lecz nikt nie zaprzeczy ich kunsztowi wojennemu. Zamiast ich wyniszczać, być może powinniśmy włączyć ich do naszego społeczeństwa lub szeregów armii."
 feo_caucasia_title: "Brama na Bliski Wschód"
 feo_caucasia_desc: "Kaukaz jest obszarem górzystym, który możemy doskonale wykorzystać przeciw każdemu, kto spróbuje najechać nas od strony Bliskiego Wschodu. Dopilnujemy, by nasi żołnierze zabezpieczyli tamtejsze górskie przełęcze."
 feo_russian_aristocracy_title: "Rosyjska arystokracja"
 feo_russian_aristocracy_desc: "Możemy wywodzić się z Grecji, lecz znaczna część naszej arystokracji utrzymuje bliskie więzi z rodami rosyjskimi. Warto wykorzystać te powiązania, by pozyskać nowych sojuszników, a być może także wysunąć własne roszczenia do ich ziem."
 feo_branching1_title: "Misja z rozgałęzieniem"
 feo_branching1_desc: ""
 feo_branching2_title: "Misja z rozgałęzieniem"
 feo_branching2_desc: ""
 feo_subdue_the_hordes_title: "Poskromienie ord"
 feo_subdue_the_hordes_desc: "Choć step pontyjski wyzwolił się spod tatarskiego jarzma, na Uralu wciąż żyją koczownicy stanowiący dla nas zagrożenie. Podporządkowując ich sobie, przypomnimy każdemu jeźdźcowi, który zechce złupić nasze ziemie, by dobrze przemyślał swoją decyzję."
 feo_steppe_development_title: "Osadnictwo Gotów"
 feo_steppe_development_desc: "Stepy są pełne obcych ludów, na których trudno polegać, jeśli chodzi o pomnażanie bogactwa naszego państwa. Osiedlenie tam części naszego ludu i założenie miast pomoże rozwiązać ten problem."
 feo_russian_aid_title: "Rosyjska pomoc"
 feo_russian_aid_desc: "Nasi nowi sojusznicy z północy bardzo nam dotąd pomogli. Jednak wciąż brakuje nam miejscowych rekrutów, a nasi oficerowie nie są godni zaufania. Być może poproszenie ich o przysłanie kilku oficerów pozwoli nam rozwiązać jeden z tych problemów."
 feo_russian_guard_title: "Straż [Root.GovernmentName]"
 feo_russian_guard_desc: "Ludność gocka jest nieliczna, dlatego dotąd polegaliśmy na zagranicznych rekrutach, którzy nie dorównują dyscypliną naszym rosyjskim braciom. Poproszenie ich o przysłanie niewielkiego oddziału elitarnej straży pomogłoby rozwiązać ten problem."
 feo_russian_claims_title: "Nasze rosyjskie roszczenia"
 feo_russian_claims_desc: "Dzięki umocnieniu naszych powiązań w Rosji możemy teraz domagać się tronu. Chociaż nasza arystokracja może nam w tym pomóc, nadal musimy udobruchać ludzi..."
 feo_palace_of_tsars_title: "Pałac Carów"
 feo_palace_of_tsars_desc: "Powiązania dynastii Gawrasów z ziemiami ruskimi okazały się dla nas niezwykle korzystne. Nasi władcy zasiadają teraz na tronie moskiewskiego Kremla, władając ziemiami Rusi. Pozostało już tylko koronować się na carów..."
 mechanic_enables_recruit_foreign_generals_yes: "Odblokowuje dyplomatyczną akcję §YRekrutuj zagranicznego generała§!"
 estate_burghers_italian_coastal_influence: "Włoskie wpływy na wybrzeżu"
 estate_burghers_italian_coastal_influence_desc: "Odkąd nasi władcy zaprosili Włochów nad Morze Czarne, nasze porty zapełniły się zagranicznymi kupcami, którzy przybyli tu, by zbić fortunę."
