 SUN_every_iberian_province_lose_separatism_and_autonomy: "Każda prowincja w regionie §YIberia§!, należąca do nas lub naszych niesuwerennych poddanych, otrzyma §G-20,0%§! autonomii lokalnej i §G-10§! lat separatyzmu."
 SUN_draft_ships_for_war: "Wzmacnia przywilej „§YPobór [Root.GetBurghersName] do floty§!” stanu §Y[Root.GetBurghersName]§!, dzięki czemu decyzja „§Y[Root.GetBurghersName]: Pobór statków na wojnę§!” będzie umożliwiać budowę dwukrotnie większej liczby §Yciężkich okrętów§!."
 SUN_unlock_new_doctrine: "Odblokowuje doktrynę morską „§YŻegluga po Pacyfiku§!”, zapewniającą następujące modyfikatory:\nUtrata zaopatrzenia podczas transportu na statkach: §G-100,0%§!, szybkość ruchu floty: §G+0,50§! oraz modyfikator globalnej skuteczności walk morskich: §G+10,0%§!."
 SUN_unlock_sunrise_invasion_cb: "Odblokowuje casus belli „§YInwazja Wschodzącego Słońca§!” przeciwko państwom z subkontynentów §YDalekiego Wschodu§! i §YChin§!, pozwalający przejmować tamtejsze prowincje za §G90,0%§! kosztu i §G150,0%§! prestiżu."
