 hun_old_alliances_title: "Dawne sojusze"
 hun_old_alliances_desc: "Węgry i Polska były niegdyś rządzone jako jedno państwo przez takich władców jak andegaweński król Ludwik Wielki, a w ostatnim czasie także Władysław III Jagiellończyk. Niektórzy członkowie naszego dworu chcieliby jednak zdystansować nas od Polaków. Powinniśmy zająć w tej sprawie stanowisko."
 hun_deal_with_the_impaler_title: "Rozprawić się z Drakulą"
 hun_deal_with_the_impaler_desc: "Pomoc Włada II podczas naszych wcześniejszych wojen z Osmanami była co najmniej wątpliwa. Nie możemy pozwolić, by nadal lawirował między nami a nimi, ryzykując wpadnięcie Wołoszczyzny w turecką strefę wpływów. Najwyższy czas interweniować i raz na zawsze rozprawić się z Drakulą."
 hun_the_despotate_of_serbia_title: "Podporządkować Serbię"
 hun_the_despotate_of_serbia_desc: "Państwo serbskie poprosiło kiedyś o ochronę, gdy Imperium Osmańskie zagroziło jego granicom. Uważamy, że prośba ta pozostaje nadal aktualna. Przyjmiemy ich do grona."
 hun_fekete_sereg_title: "Fekete Sereg"
 hun_fekete_sereg_desc: "Otoczona licznymi wrogami armia węgierska ma bogate doświadczenie w obronie niepodległości naszego państwa. Nie możemy jednak spocząć na laurach — musimy nieustannie doskonalić nasze umiejętności, aby nie utracić przewagi, jaką daje nam znakomite wojsko."
 hun_the_black_legion_title: "Czarny Legion"
 hun_the_black_legion_desc: "Nasza Czarna Armia stała się już powszechnie znaną siłą, siejącą spustoszenie na polu bitwy i napełniającą serca wrogów strachem. Uczyńmy z niej trwałą instytucję, dumę naszego narodu i niezrównaną siłę militarną."
 hun_integrate_croatia_title: "Zintegrować Chorwację"
 hun_integrate_croatia_desc: "Od zawarcia układu Pacta Conventa w 1102 roku Królestwo Chorwacji pozostaje z nami w unii personalnej. Aby zapewnić trwałą kontrolę nad ziemiami chorwackiej korony, powinniśmy dążyć do ściślejszej integracji lub zacieśnienia naszych stosunków."
 hun_recover_dalmatia_title: "Odzyskać Dalmację"
 hun_recover_dalmatia_desc: "W wyniku wewnętrznych konfliktów dalmatyńskie prowincje korony węgierskiej zostały sprzedane Wenecji w 1409 roku. Nie możemy pozwolić, by te bogate miasta, kluczowe dla naszej dominacji nad Adriatykiem, pozostały w rękach wrogów. Odzyskaliśmy już siły i umocniliśmy władzę nad Chorwacją — nadszedł czas, by odzyskać Dalmację."
 hun_legacy_of_louis_the_great_title: "Dziedzictwo Ludwika Wielkiego"
 hun_legacy_of_louis_the_great_desc: "Podczas chwalebnych rządów andegaweńskich królów Węgier Święta Korona objęła również Neapol. Teraz, gdy Adriatyk znajduje się pod naszą kontrolą, możemy wysunąć roszczenia do korony neapolitańskiej i odzyskać dziedzictwo Ludwika Wielkiego."
 hun_control_moldavia_new_title: "Kontroluj Mołdawię"
 hun_control_moldavia_new_desc: "Mołdawia przechodziła z rąk do rąk więcej razy, niż możemy liczyć. Najwyraźniej jednak mamy najbardziej uzasadnione roszczenia do ich ziemi."
 hun_bosnian_subjugation_title: "Bezpieczeństwo Bośni"
 hun_bosnian_subjugation_desc: "Bośnia, podobnie jak Serbia, powinna postrzegać nas jako swoich prawowitych władców. Nie można oczekiwać, że tak żałosny naród zdoła stłumić wewnętrzne bunty, nie mówiąc już o najazdach Turków."
 hun_the_anatolian_threat_title: "Zaraza Europy"
 hun_the_anatolian_threat_desc: "Nadszedł czas, abyśmy zaczęli bronić się przed falą anatolijskich niewiernych okupujących europejskie ziemie. Musimy zabezpieczyć naszą granicę i ufortyfikować nasze terytorium. Nie poddamy się łatwo."
 hun_liberate_bulgaria_title: "Wyzwolić Bułgarię"
 hun_liberate_bulgaria_desc: "Bułgarzy od wielu lat znajdują się pod obcą okupacją. Najpierw samozwańczego Cesarstwa Rzymskiego, potem Turków, którzy z pewnością byli okrutnymi panami. Wyzwolimy ich."
 hun_secure_macedonia_title: "Zabezpiecz Macedonię"
 hun_secure_macedonia_desc: "Grabieżcy zbyt długo niszczyli Bałkany. Czas wyrzucić ich z naszej ziemi i przyłączyć Macedonię do naszego królestwa!"
 hun_push_on_to_constantinople_title: "Marsz na Konstantynopol"
 hun_push_on_to_constantinople_desc: "Wspaniałe miasto Konstantynopol leży zrujnowane i zbezczeszczone przez nikczemne tureckie hordy. My, obrońcy Chrystusa i przedmurze chrześcijaństwa, pomaszerujemy na miasto Konstantyna i wyzwolimy je spod jarzma niewiernych."
 hun_bulwark_of_christianity_title: "Przedmurze chrześcijaństwa"
 hun_bulwark_of_christianity_desc: "Jako główni obrońcy chrześcijaństwa przed osmańskim zagrożeniem zyskaliśmy miano przedmurza chrześcijaństwa. Udowadniając, że potrafimy stawić czoła wszystkiemu, co niewierni mogą rzucić przeciwko nam, pokażemy, że w pełni zasługujemy na ten tytuł."
 hun_dismantle_la_serenissima_title: "Rozbić La Serenissimę"
 hun_dismantle_la_serenissima_desc: "Wenecja od zbyt dawna jest cierniem w naszym boku. Po odzyskaniu Dalmacji powinniśmy zniszczyć republikę i ustanowić własną hegemonię nad Adriatykiem."
 hun_fund_the_monasteries_title: "Wesprzeć klasztory"
 hun_fund_the_monasteries_desc: "Zakon paulinów odgrywa ważną rolę na Węgrzech od czasu założenia go przez błogosławionego Euzebiusza z Ostrzyhomia w 1250 roku. Rozprzestrzenił się nawet na sąsiednie kraje. Przeznaczenie środków na zapewnienie jego przychylności wobec państwa będzie dobrą inwestycją."
 hun_unity_in_belief_title: "Jedność w wierze"
 hun_unity_in_belief_desc: "Terytoria Węgier są domem dla ludzi o różnych wyznaniach. Tak czy inaczej musimy zadbać o to, by różnice religijne nie dzieliły naszego państwa."
 hun_weaken_poland_title: "Osłab Polskę"
 hun_weaken_poland_desc: "[POL.GovernmentName] Polski to potężny kraj, kontrolujący ziemie za naszą północną granicą. Stanowiliby poważne zagrożenie dla naszej niezależności, gdyby stali się wrogo nastawieni. Powinniśmy dokonać ataku wyprzedzającego, aby przesunąć polską granicę jak najdalej od naszego centrum."
 hun_jagiellonian_union_title: "Unia Jagiellońska"
 hun_jagiellonian_union_desc: "Aż do jego śmierci w bitwie pod Warną w 1444 r. Węgrami wraz z Polską i Litwą rządził Władysław III Jagiellończyk. Powinniśmy przywrócić unię między naszymi tronami, która istniała za jego czasów – i sprawić, że wynik będzie bardziej pomyślny niż ostatnim razem."
 hun_teutonic_advance_title: "Ekspansja na ziemie zakonu krzyżackiego"
 hun_teutonic_advance_desc: "Dzięki pełnej kontroli nad polską koroną uzyskaliśmy dostęp do Bałtyku. Ten pradawny region obfituje w bogactwa i możliwości, a aby je zdobyć, musimy rozszerzyć tam nasze wpływy."
 hun_strengthen_the_vegvar_title: "Wzmocnić Végvár"
 hun_strengthen_the_vegvar_desc: "Straszliwy wróg powoli rozszerza swoje wpływy w Europie. Nasze południowe granice nie mają istotnych naturalnych przeszkód, które mogłyby zapewnić nam przewagę obronną. Dalsze umacnianie pogranicza wojskowego musi stać się najwyższym priorytetem."
 hun_bohemian_borderlands_title: "Czeskie pogranicze"
 hun_bohemian_borderlands_desc: "Elektorat Czech jest właścicielem obszarów granicznych na naszym północnym zachodzie. Ponieważ jest silnym i dobrze prosperującym królestwem znanym z paskudnych herezji, powinniśmy podjąć działania przeciwko nim, aby zapobiec rozprzestrzenianiu się ich na nasze ziemie."
 hun_crown_of_wenceslas_title: "Korona św. Wacława"
 hun_crown_of_wenceslas_desc: "Zjednoczenie korony czeskiej z naszą własną znacznie zwiększyłoby siłę naszego państwa - szczególnie, jeśli możemy dopilnować, aby jej elektorat został nam przekazany."
 hun_a_strong_economy_title: "Silna gospodarka"
 hun_a_strong_economy_desc: "Nasza zdolność do rywalizacji jako wielkie mocarstwo, otoczone licznymi potencjalnymi zagrożeniami, zależy od tego, czy zdołamy wydobyć z naszych ziem każde możliwe bogactwo."
 hun_bibliotheca_corviniana_title: "Bibliotheca Corviniana"
 hun_bibliotheca_corviniana_desc: "Odrodzenie wiedzy klasycznej pobudziło naszych uczonych i filozofów. Powinniśmy założyć bibliotekę, w której zgromadzimy dorobek intelektualny całej Europy."
 hun_universitas_istropolitana_title: "Universitas Istropolitana"
 hun_universitas_istropolitana_desc: "Uczelnie wyższe są kluczem do wielkiego postępu. W przeszłości na Węgrzech działały uniwersytety, lecz obecnie żaden z nich nie funkcjonuje. Skoncentrujmy zasoby na otwarciu nowej uczelni w [1772.GetCapitalName], aby stała się filarem wiedzy i rozwoju Węgier."
 hun_the_renaissance_king_title: "Król renesansu"
 hun_the_renaissance_king_desc: "Udało nam się zapoczątkować prawdziwą rewolucję wiedzy i edukacji na Węgrzech. Aby utrzymać tę pozycję, musimy zadbać o wszechstronne wykształcenie przyszłych władców, tak by ich rozległa wiedza poprowadziła kraj ku wielkości."
 hun_found_budapest_title: "Założyć Budapeszt"
 hun_found_budapest_desc: "Potężny naród potrzebuje potężnej stolicy, która odzwierciedli jego siłę, przepych i chwałę. Połączymy miasta Buda, Óbuda i Peszt w Budapeszt — godną stolicę, która przyćmi nawet metropolie zachodnich mocarstw."
 hun_the_hungarian_succession_title: "Węgierska sukcesja"
 hun_the_hungarian_succession_desc: "Klęska krucjaty warneńskiej sprawiła, że nasz kraj ostał się pozbawiony przywódcy i bezbronny. Musimy uporać się z tym kryzysem, nie tracąc naszej niezależności na rzecz któregokolwiek z naszych oportunistycznych sąsiadów."
 hun_the_imperial_ambition_title: "Cesarskie ambicje"
 hun_the_imperial_ambition_desc: "Habsburgowie zostali zdetronizowani, a Cesarstwo rzucone na kolana. To od nas zależy, czy zadamy mu łagodzący cierpienia cios ostateczny, czy też sami wstąpimy na tron cesarski i poprowadzimy je ku nowemu złotemu wiekowi."
 hun_expand_the_mint_title: "Rozbudować mennicę"
 hun_expand_the_mint_desc: "Górnicze miasta Górnych Węgier od dawna zapewniają naszemu państwu stabilne dochody. Udoskonalmy proces wybijania monet w mennicy królewskiej, aby nasze dukaty osiągnęły najwyższą jakość i zalały europejskie rynki."
 hun_develop_free_royal_towns_title: "Rozwijać wolne miasta królewskie"
 hun_develop_free_royal_towns_desc: "Przyznawanie przywilejów miastom w celu pobudzania ich rozwoju jest na Węgrzech długą tradycją. Wzmocnijmy prawa wolnych miast królewskich, by zachęcić kolejnych zagranicznych kupców i rzemieślników do osiedlania się w naszym kraju."
 hun_the_great_city_of_buda_title: "Wielkie miasto Buda"
 hun_the_great_city_of_buda_desc: "Państwo węgierskie przetrwało stulecia, a nasza stolica stała się ważnym miastem. Wciąż jednak ustępuje rozmiarami i przepychem Pradze oraz Wiedniowi, stolicom naszych zachodnich rywali. Nadejdzie wspaniały dzień, gdy [Root.Capital.GetCapitalName] przewyższy oba te miasta i stanie się najważniejszym ośrodkiem Europy Środkowej."
 hun_fertile_lands_of_pannonia_title: "Żyzne ziemie Panonii"
 hun_fertile_lands_of_pannonia_desc: "Rozległa Nizina Panońska doskonale nadaje się pod uprawę roli i hodowlę zwierząt. Aby stać się prawdziwym europejskim mocarstwem, potrzebujemy rolnictwa zdolnego wyżywić rosnącą populację i zaopatrywać nasze armie."
 hun_a_strong_government_title: "Silny rząd"
 hun_a_strong_government_desc: "Musimy zreformować państwo, aby było gotowe stawić czoła każdej przeszkodzie bez szwanku."
 hun_address_the_ethnic_situation_title: "Narody Węgier"
 hun_address_the_ethnic_situation_desc: "Od chwili powstania Węgry są państwem wielokulturowym. Różnorodność etniczna nie sprawiała dotąd większych problemów, lecz nowe, oświeceniowe koncepcje państw narodowych stopniowo zmieniają rozumienie narodu. Tak liczna społeczność różnych ludów w naszych granicach może stać się poważnym zagrożeniem. Musimy natychmiast zająć się tą kwestią."
 hun_weaken_the_habsburgs_title: "Osłab Austrię"
 hun_weaken_the_habsburgs_desc: "Pokój z Austrią nie może trwać wiecznie — nasze ziemie są zbyt kuszącym łupem, by arcyksiążę nie snuł wobec nich planów. Powinniśmy osłabić Austrię, aby zabezpieczyć się przed atakiem zachodnich sąsiadów."
 hun_overshadow_austria_title: "Zajmij Wiedeń"
 hun_overshadow_austria_desc: "Wiedeń byłby wspaniałym nabytkiem dla naszego państwa. Powinniśmy go zdobyć. Upadek miasta tak bardzo osłabi Cesarstwo, że będziemy mogli swobodnie rozporządzać tym, co z niego pozostanie."
 hun_heirs_of_ruthenia_title: "Dziedzice Rusi"
 hun_heirs_of_ruthenia_desc: "Jagiellonowie rościli sobie prawa do rozległych ziem Rusi. Teraz, gdy kontrolujemy korony ich państw, powinniśmy wykorzystać te roszczenia i zająć Ruś, zanim region przejmą Moskale."
 hun_the_order_of_the_dragon_title: "Order Smoka"
 hun_the_order_of_the_dragon_desc: "Założony przez Zygmunta Luksemburskiego Zakon Smoka stał się ważnym elementem naszej obrony przed turecką ekspansją. Należy go znacznie rozbudować, aby jego członkowie mogli wystawić znaczące siły do naszych kampanii przeciwko niewiernym."
 hun_a_multicultural_empire_title: "Cesarstwo wielokulturowe"
 hun_a_multicultural_empire_desc: "Nasze podboje objęły rozległe ziemie zamieszkane przez liczne narody, co przyniosło również ogromne zagrożenie dla trwałości naszych rządów. Aby zachować jedność imperium, musimy przeprowadzić reformy modernizujące struktury państwowe oraz zapewniające reprezentację i dobrobyt wszystkim narodom żyjącym pod naszą władzą."
