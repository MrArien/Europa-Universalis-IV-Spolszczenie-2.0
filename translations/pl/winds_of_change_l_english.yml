 heathen_royal_marriage_title: "Małżeństwo dynastyczne z poganami"
 heathen_royal_marriage_desc: "Czy chcesz zaproponować państwu [From.GetName] małżeństwo dynastyczne z poganami? Zbliży to do siebie nasze państwa."
 heathen_royal_marriage_tooltip: "„Małżeństwo dynastyczne z poganami” oznacza nietypowy związek małżeński między rodzinami panującymi dwóch państw wyznających zupełnie różne religie. Znacznie poprawi to nasze stosunki. Wypowiedzenie wojny państwu, z którym łączy nas jakakolwiek forma małżeństwa dynastycznego, będzie miało dla nas poważne konsekwencje."
 heathen_royal_marriage_dialog: "Władca państwa [From.GetName] pragnie zawrzeć małżeństwo dynastyczne z poganami z jednym z poddanych waszego suwerena. Zbliży to do siebie nasze państwa."
 heathen_royal_marriage_alert_tooltip: "„Małżeństwo dynastyczne z poganami” oznacza nietypowy związek małżeński między rodzinami panującymi dwóch państw wyznających zupełnie różne religie. Znacznie poprawi to nasze stosunki. Wypowiedzenie wojny państwu, z którym łączy nas jakakolwiek forma małżeństwa dynastycznego, będzie miało dla nas poważne konsekwencje."
