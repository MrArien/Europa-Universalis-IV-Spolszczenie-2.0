 boh_hungarian_succession_desc: ""
 boh_claim_the_holy_crown_title: "Zdobądź Świętą Koronę"
 boh_claim_the_holy_crown_desc: "Węgry i Czechy były wcześniej zjednoczone pod jednym królem, a rozdzielone zostały dopiero w 1439 r. wraz ze śmiercią Alberta II Habsburga. Powinniśmy przywrócić ten słuszny stan rzeczy."
 boh_protect_against_the_turk_title: "Ochrona przed Turkiem"
 boh_protect_against_the_turk_desc: "Turcy osmańscy są zaangażowani w niebezpieczny podbój terytorialny, który grozi pochłonięciem chrześcijaństwa. Musimy dopilnować, by granice zostały ufortyfikowane przed nieuchronnym tureckim atakiem."
 boh_revenge_for_nicopolis_title: "Zemsta za Nikopolis"
 boh_revenge_for_nicopolis_desc: "W 1396 roku korona czeska wyruszyła na sprawiedliwą krucjatę przeciwko Turkom w Bułgarii, ale została pokonana przez pogan. Musimy ponownie zebrać nasze siły, odbić Bułgarię i przepędzić Turków z powrotem za morze!"
 boh_liberate_the_balkans_title: "Wyzwolenie Bałkanów"
 boh_liberate_the_balkans_desc: ""
 boh_hussite_regency_title: "Zakończenie regencji"
 boh_hussite_regency_desc: ""
 boh_hussite_resurgence_title: ""
 boh_hussite_resurgence_desc: "Pomimo, a może właśnie z powodu śmierci Jana Husa w 1415 roku, zwolennicy ruchu husyckiego przez wiele lat żywili do nas gorzką urazę. Konflikty ponownie stanęły na ostrzu noża i jest tylko kwestią czasu, kiedy będziemy musieli dokonać wyboru w imieniu naszego ludu."
 boh_defenestrate_the_heretics_title: ""
 boh_defenestrate_the_heretics_desc: "Reformacja przetacza się przez Europę, a nasza historia nieortodoksji stawia nas na czele teologicznego i politycznego konfliktu. Musimy stanąć w obronie prawdziwej wiary i wyrzucić naszych heretyckich wrogów przez okno!"
 boh_recover_nitrava_title: ""
 boh_recover_nitrava_desc: "Państwo wielkomorawskie, poprzednik Czech, rozciągało się niegdyś daleko poza tereny Czech. Powinniśmy dążyć do ponownego rozszerzenia naszych granic, poczynając od aneksji starego Księstwa Nitry."
 boh_electorate_of_saxony_title: "Elektorat Saksonii"
 boh_electorate_of_saxony_desc: "Potrzebujemy wsparcia dodatkowych elektorów. W następnej kolejności powinniśmy skupić się na elektorze Saksonii, ponieważ od dawna szukaliśmy okazji do przejęcia kontroli nad Dreznem."
 boh_bohemian_crystal_title: "Czeski kryształ"
 boh_bohemian_crystal_desc: "Produkcja szczególnie pięknych wyrobów ze szkła stała się popularna w naszym królestwie. Powinniśmy promować ten przemysł i zapewnić, że nasze dzieła będą cenione na europejskich dworach."
 boh_bozi_bojovnici_title: ""
 boh_bozi_bojovnici_desc: ""
 boh_humiliate_austria_title: "Upokórz Austrię"
 boh_humiliate_austria_desc: "Austria nadużywa cesarskiego tronu i nie ukrywa swoich planów podporządkowania sobie naszego narodu. Musimy pokazać książętom Niemiec i całemu światu, że Austria nie jest tak potężnym potworem, za jakiego się podaje."
 boh_otakars_legacy_title: ""
 boh_otakars_legacy_desc: ""
 boh_reforge_great_moravia_title: ""
 boh_reforge_great_moravia_desc: ""
 boh_lion_of_the_empire_title: "Lew cesarstwa"
 boh_lion_of_the_empire_desc: ""
 boh_bohemian_commonwealth_title: "Rzeczpospolita Czeska"
 boh_bohemian_commonwealth_desc: "Musimy spojrzeć poza to, co tradycyjnie uważano za Czechy, aby ustanowić większą wspólnotę. Nasze imperium obejmie Europę Środkową i zajmiemy miejsce wśród wielkich mocarstw świata."
 boh_the_golden_city_title: "Złote miasto"
 boh_the_golden_city_desc: ""
 boh_reform_the_bergordnung_title: ""
 boh_reform_the_bergordnung_desc: ""
 boh_czech_heavy_industry_title: "Czeski przemysł ciężki"
 boh_czech_heavy_industry_desc: ""
 boh_vistula_land_title: ""
 boh_vistula_land_desc: ""
 boh_electorate_of_brandenburg_title: "Elektorat Brandenburgii"
 boh_electorate_of_brandenburg_desc: "Jeśli chcemy zapewnić sobie tron Świętego Cesarstwa Rzymskiego, będziemy potrzebować poparcia elektorów. A czy jest lepszy sposób na zdobycie głosów niż podporządkowanie Brandenburgii naszym politycznym zachciankom?"
 boh_municipal_works_title: "Przemysł czeski"
 boh_municipal_works_desc: ""
 boh_univerzita_karlova_title: ""
 boh_univerzita_karlova_desc: ""
 boh_consolidate_silesia_title: "Zjednocz Śląsk"
 boh_consolidate_silesia_desc: "Teraz, gdy nasza własny domena jest uporządkowana, powinniśmy spojrzeć na naszą królewszczyznę. Śląsk zawsze był częścią naszego królestwa i najwyższy czas, by cieszył się pełnym statusem w naszym społeczeństwie."
 boh_polish_diplomacy_title: "Polska dyplomacja"
 boh_polish_diplomacy_desc: "Charakter monarchii elekcyjnej w Polsce jest okazją dla naszych dyplomatów do promowania czeskiego następcy polskiego tronu.  Powinniśmy upewnić się, że w Polsce rządzi czeska dynastia."
 boh_premyslid_heritage_title: "Dziedzictwo Przemyślidów"
 boh_premyslid_heritage_desc: "Czechy znów mają władzę. Jednak jeden z margrabiów na naszym dworze chytrze zauważył, że mamy uzasadnione roszczenia do ziem naszych przodków, Przemyślidów. Czasy poszły do przodu, granice się przesunęły, ale wierzymy, że niektóre z tych roszczeń nadal mają znaczenie."
 boh_pomerelian_reconquest_title: "Odzyskaj Pomorze Gdańskie"
 boh_pomerelian_reconquest_desc: "Sukces naszego podboju wciąż brzmi w naszych uszach. Ziemie pomorskie na północy również znajdowały się pod kontrolą Wacława II, a zatem muszą należeć do nas."
 boh_restore_kralovec_title: ""
 boh_restore_kralovec_desc: ""
 boh_karels_claims_title: ""
 boh_karels_claims_desc: ""
 boh_reformatio_sigismundi_title: "Reformacja Zygmuntowska"
 boh_reformatio_sigismundi_desc: "Cesarz Zygmunt, były król Czech, zaplanował wielką reformę Świętego Cesarstwa Rzymskiego. Powinniśmy kontynuować jego dziedzictwo i skierować Cesarstwo na nową, chwalebną ścieżkę."
 boh_peace_in_europe_title: "Pokój w Europie"
 boh_peace_in_europe_desc: "Od pokoleń Europę nękają wojny między wielkimi mocarstwami i pomniejszymi książętami. Nadszedł czas, by położyć kres konfliktom. Pod naszymi życzliwymi rządami znacznie powiększymy Cesarstwo, aby zapoczątkować złoty wiek pokoju i dobrobytu."
 boh_hussite_empire_title: ""
 boh_hussite_empire_desc: ""
 boh_vladislav_hall_title: "Sala Władysławowska"
 boh_vladislav_hall_desc: ""
 boh_control_the_electors_title: "Kontroluj Elektorów"
 boh_control_the_electors_desc: ""
 boh_recover_from_hussite_wars_title: "Odzyskiwanie sił po wojnach husyckich"
 boh_recover_from_hussite_wars_desc: "Wojny husyckie zdewastowały ziemie Korony Czeskiej. Zanim po raz kolejny skoncentrujemy się na sprawach zewnętrznych, musimy dostrzec przywrócenie porządku wewnętrznego."
 boh_purge_hussite_heresy_title: ""
 boh_purge_hussite_heresy_desc: ""
 boh_branching1_title: "Misja z rozgałęzieniem"
 boh_branching1_desc: "Skutki tej misji zależą od sposobu którym ukończymy misję '§YZakończ regencje§!'."
 boh_branching2_title: "Misja z rozgałęzieniem"
 boh_branching2_desc: "Skutki tej misji zależą od sposobu którym ukończymy misję '§YZakończ regencje§!'."
 boh_branching3_title: "Misja z rozgałęzieniem "
 boh_branching3_desc: "Skutki tej misji zależą od sposobu którym ukończymy misję '§YZakończ regencje§!'."
