 hussite_protest.1.name: "Protest husycki"
 hussite_protest.1.desc: "Książęta wyznający husytyzm są oburzeni, że ich wysiłki na rzecz powstrzymania katolików umożliwiły nowemu cesarzowi ogłoszenie protestantyzmu oficjalną religią Cesarstwa, mimo że husyci stanowią w nim większość. Pod wodzą [hussite_leader_country.Monarch.GetTitle] [hussite_leader_country.Monarch.GetName] z państwa [hussite_leader_country.GetName] zwrócili się do cesarza [Emperor.Monarch.GetName], domagając się, by husytyzm otrzymał w Cesarstwie status równy, a nawet wyższy od protestantyzmu."
 hussite_protest.1.a: "Cesarstwo jest i pozostanie protestanckie!"
 hussite_protest.1.b: "Przyznajmy im równe prawa."
 hussite_protest.1.c: "Musimy spełnić wszystkie ich żądania."
 hussite_protest.2.name: "[Emperor.GetName] odrzuca żądania husytów!"
 hussite_protest.2.desc: "Cesarz [Emperor.Monarch.GetName] z państwa [Emperor.GetName] odrzucił żądania husytów dotyczące równouprawnienia w Cesarstwie. Ogłosił protestantyzm jedyną prawdziwą wiarą i oznajmił, że wyznawcy innych religii muszą się podporządkować albo ponieść konsekwencje. Pozostaje nam jedynie zdumiewać się arogancją [Emperor.Monarch.GetHerHis] i rozważyć odpowiedź."
 hussite_protest.2.a: "Nasza przyszłość wciąż wiąże się z Cesarstwem."
 hussite_protest.2.b: "Lepiej będzie nam poza jego granicami."
 incident_hussite_protest_can_happen_tt: "§YKsiążęta husyccy, posiadający większość prowincji Cesarstwa, kwestionują ten wynik.§!"
 incident_hussite_protest: "Protest husycki"
 incident_hussite_protest_emperor_alert: "Książęta wyznający husytyzm są oburzeni, że ich wysiłki na rzecz powstrzymania katolików umożliwiły nowemu cesarzowi ogłoszenie protestantyzmu oficjalną religią Cesarstwa, mimo że husyci stanowią w nim większość. Pod wodzą [hussite_leader_country.Monarch.GetTitle] [hussite_leader_country.Monarch.GetName] z państwa [hussite_leader_country.GetName] zwrócili się do cesarza [Emperor.Monarch.GetName], domagając się, by husytyzm otrzymał w Cesarstwie status równy, a nawet wyższy od protestantyzmu."
 incident_hussite_protest_member_alert: "Książęta wyznający husytyzm są oburzeni, że ich wysiłki na rzecz powstrzymania katolików umożliwiły nowemu cesarzowi ogłoszenie protestantyzmu oficjalną religią Cesarstwa, mimo że husyci stanowią w nim większość. Pod wodzą [hussite_leader_country.Monarch.GetTitle] [hussite_leader_country.Monarch.GetName] z państwa [hussite_leader_country.GetName] zwrócili się do cesarza [Emperor.Monarch.GetName], domagając się, by husytyzm otrzymał w Cesarstwie status równy, a nawet wyższy od protestantyzmu."
 hussite_protest.1.a.leave_empire_tt: "§YKsiążęta husyccy będą oburzeni i mogą zdecydować się opuścić Cesarstwo.§!"
 hussite_protest.1.c.emperor_pick_conditions_tt: "\nCesarz, który utracił wszystkie prowincje poza §Y1§! i ma wynik wojenny niższy niż §Y-50§! przeciwko §Yhusyckiemu§! przeciwnikowi, wybierze tę opcję."
