 hsn_anatolian_alliance_tt_historical_friend: "Dodaje naszego §Yanatolijskiego sojusznika§! jako historycznego przyjaciela."
 hsn_upgrade_nizwa_tt: "Odblokowuje warunkowy modyfikator wielkiego projektu „§YFort Nizwa§!”, zapewniający za każdy poziom §G+10,0%§! redukcji kary handlowej poza głównym węzłem handlowym."
 hsn_saladins_legacy_event_insight_tt: "\\n§GInformacja o wydarzeniu:§!\\nTo wydarzenie pozwala uczcić dziedzictwo Saladyna poprzez trwałe ulepszenie naszych władców, doradców i generałów albo jednorazowe otrzymanie punktów władzy militarnej i tradycji armii."
 hsn_prevent_leader_trait: "Na stałe zapobiega otrzymywaniu przez naszych władców i następców cech osobowości §YOkrutny§! (§R+2§! niepokojów narodowych) oraz §YTchórzliwy§! (§R-5%§! morale armii)."
 unlock_ayyubid_high_command_tt: "Odblokowuje reformę rządową poziomu 5 „§YNaczelne dowództwo Ajjubidów§!”, zapewniającą:\\n§G-10,0%§! kosztu generałów\\n§G+2,00§! dowódców lądowych bez utrzymania\\n§G+2,00§! maksymalnego szoku generała\\n\\nReforma obejmuje również następującą mechanikę rządową:\\nRekrutacja §Ygenerałów§! zapewnia §G+0,5§! tradycji armii."
 hsn_scaling_advisors_tt: "Wszyscy §Ydoradcy wojskowi§! zyskują skalującą się premię §G-0,3%§! rocznego spadku tradycji armii za każdy poziom. Otrzymamy również następujący modyfikator:"
