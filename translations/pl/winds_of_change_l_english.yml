 tre_kingdoms_of_the_caucasus_title: ""
 tre_kingdoms_of_the_caucasus_desc: "Królestwa Kaukazu obfitują w surowce i zajmują strategiczne położenie. Musimy zawrzeć z nimi sojusze albo podporządkować je naszej władzy, aby zabezpieczyć naszą pozycję w regionie."
 tre_kingdoms_of_the_caucasus_tt: "§YSojusznicy§! mają stolicę w regionie §YKaukazu§!."
 tre_emperor_of_the_iberians_title: "Cesarz Iberów"
 tre_emperor_of_the_iberians_desc: "Nasi władcy oficjalnie roszczą sobie tytuł cesarzy i autokratów całego Wschodu, Iberów oraz Peratei. Nadszedł czas, by dochodzić tych praw i ustanowić trwałe panowanie nad Kaukazem – drogą dyplomacji lub siłą."
 tre_chastise_the_hordes_title: "Poskromienie ord"
 tre_chastise_the_hordes_desc: "Ordy na północ od Kaukazu stanowią śmiertelne zagrożenie dla naszego państwa. Widzieliśmy spustoszenie, jakie przynieśli Mongołowie, dlatego musimy spacyfikować koczowników stepowych i zabezpieczyć nasze północne granice."
 tre_seek_religious_support_title: "Pozyskanie poparcia religijnego"
 tre_seek_religious_support_desc: "W tych trudnych czasach musimy zabiegać o poparcie wspólnoty religijnej. Jej wpływy i przewodnictwo pomogą nam stawić czoła wyzwaniom."
 tre_metropolitan_of_trebizond_title: "Metropolita Trebizondy"
 tre_metropolitan_of_trebizond_desc: "Metropolita Trebizondy odgrywa kluczową rolę w naszym życiu religijnym i politycznym. Musimy zadbać, by urząd ten objęła osoba wielkiej mądrości i pobożności, która poprowadzi nasz lud ku wierze i stanie się ostoją prawosławia."
 tre_chaldian_deposits_title: "Złoża Chaldii"
 tre_chaldian_deposits_desc: "Od około VI wieku n.e. Góry Pontyjskie w Chaldii słyną z bogatych złóż ołowiu, srebra i złota. Przez stulecia niewielu podejmowało próby ich wydobycia, ponieważ góry są trudno dostępne. Powinniśmy jednak otworzyć w nich nowe kopalnie i pozyskać te cenne surowce."
