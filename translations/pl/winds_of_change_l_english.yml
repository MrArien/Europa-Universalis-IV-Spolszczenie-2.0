 mechanic_GER_upgrade_religious_state_yes: "Wzmocnienie przywileju stanowego „§YPaństwo wyznaniowe§!” sprawi, że będzie on zapewniać §G+1,00§! tolerancji prawdziwej wiary i §G+15,0%§! jedności religijnej."
