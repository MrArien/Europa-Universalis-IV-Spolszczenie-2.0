 azt_conflicts_with_purepecha_empire: "Konflikt z Purepecha"
 desc_azt_conflicts_with_purepecha_empire: "Nasze konflikty z Purepecha przybierają na sile."
 azt_securing_the_highlands: "Zabezpieczenie wyżyn"
 desc_azt_securing_the_highlands: "Wyżyny Majów znajdują się teraz pod naszym panowaniem."
 azt_hot_xocolatl: "Gorące xocolatl"
 desc_azt_hot_xocolatl: "Xocolatl to jeden z najcenniejszych towarów luksusowych, jakie Mezoameryka może dostarczać reszcie świata."
 azt_etzalcualiztli_festival: "Etzalcualiztli – spożywanie świeżej kukurydzy"
 desc_azt_etzalcualiztli_festival: "Etzalcualiztli to święto poświęcone bogom Tlalocowi i Quetzalcoatlowi, którzy obdarzają tę ziemię urodzajem i światłem."
 azt_atlcahualo_festival: "Atlcahualo – rozsiewanie kukurydzy"
 desc_azt_atlcahualo_festiva: "Atlcahualo to święto poświęcone wyłącznie Tlalokom."
 azt_panquetzaliztli_festival: "Panquetzaliztli – wznoszenie sztandarów"
 desc_azt_panquetzaliztli_festival: "Wznoszenie sztandarów, Panquetzaliztli, to święto poświęcone wielkiemu bogu Huitzilopochtliemu, któremu składa się ofiary."
 azt_bloodletting_practise: "Rytuały upuszczania krwi"
 desc_azt_bloodletting_practise: "Zamiast przelewać krew naszych wrogów, postanawiamy również upuścić nieco własnej, aby wzmocnić bogów."
 the_fifth_sun: "Piąte Słońce"
 desc_the_fifth_sun: "W piątym stworzeniu ludzkości musimy stać dumni i postępować zgodnie ze słowami teopixqui."
 azt_capital_of_the_alliance: "Stolica Potrójnego Sojuszu"
 desc_azt_capital_of_the_alliance: "Ta prowincja jest stolicą Sojuszu Trzech Miast."
 azt_alliance_province: "Miasto Potrójnego Sojuszu"
 desc_azt_alliance_province: "Ta prowincja jest częścią Sojuszu Trzech Miast."
 azt_nahuatl_tributary_buff: "Danina krwi"
 desc_azt_nahuatl_tributary_buff: ""
 azt_class_seperation: "Rozdział stanów"
 desc_azt_class_seperation: "W naszym społeczeństwie wprowadzono reformy społeczne, które ustanawiają podział na pospólstwo i szlachtę."
 azt_religious_classes: "Edukacja religijna"
 desc_azt_religious_classes: ""
 azt_techchitlan_1: "Miasto Tenochtitlan"
 desc_azt_techchitlan_1: "Miasto Tenochtitlan leży pośrodku jeziora Texcoco i jest perłą Meksyku."
 azt_techchitlan_2: "Miasto Tenochtitlan"
 desc_azt_techchitlan_2: "Miasto Tenochtitlan leży pośrodku jeziora Texcoco i jest perłą Meksyku."
 azt_techchitlan_3: "Miasto Tenochtitlan"
 desc_azt_techchitlan_3: "Miasto Tenochtitlan leży pośrodku jeziora Texcoco i jest perłą Meksyku."
 azt_techchitlan_4: "Miasto Tenochtitlan"
 desc_azt_techchitlan_4: "Miasto Tenochtitlan leży pośrodku jeziora Texcoco i jest prawdziwą perłą Meksyku."
 azt_military_culture_modifier: "Kultura wojowników"
 azt_barracks_households: "Koszary"
 azt_conscription_households: "Ośrodek poboru"
 azt_pleasing_the_gods: "Zjednywanie sobie bogów"
 desc_azt_pleasing_the_gods: "Ilość krwi, którą złożyliśmy bogom w ofierze, zadowoliła ich... przynajmniej na razie."
 chinampa_farms_modifier: "Uprawy chinampowe"
 desc_chinampa_farms_modifier: ""
 azt_gold_mines_of_mexico: "Kopalnie złota Meksyku"
 desc_azt_gold_mines_of_mexico: "Ta prowincja jest niezwykle ważnym ośrodkiem wydobycia złota w Meksyku."
 azt_mexican_goldmine: "Meksykańska kopalnia złota"
 desc_azt_mexican_goldmine: "Z jednej strony złoto! Z drugiej – bolesna, wyniszczająca porażka."
 azt_recent_reform: "Niedawna reforma nahuatlańska"
 desc_azt_recent_reform: "Niedawna reforma naszej religii wywołała niepokoje w całym państwie."
 estate_nobles_AZT_triple_alliance: "Potrójny Sojusz"
 estate_nobles_AZT_triple_alliance_desc: "Potrójny Sojusz może znajdować się pod kontrolą Tenochtitlan, lecz nadal istnieje w granicach imperium Azteków, czyniąc z niego zbiór miast-państw posłusznych [Root.Monarch.GetName]."
 AZT_revokable_via_mission: "Ten przywilej można odebrać wyłącznie po ukończeniu misji §YLos Sojuszu§!."
 estate_nobles_AZT_warrior_culture: "Kultura wojskowa"
 estate_nobles_AZT_warrior_culture_desc: "Nasze społeczeństwo uważa sprawność wojenną za jedną z najważniejszych cech obywatela. Dalsze wzmacnianie tej tradycji pozwoli nam jeszcze bardziej zmilitaryzować państwo."
 azt_military_culture_modifier_buffed: "Kultura wojowników"
 desc_azt_military_culture_modifier: "Ta prowincja została silnie zmilitaryzowana dzięki wojowniczym tradycjom państwa [ROOT.Owner.GetName]."
 desc_azt_military_culture_modifier_buffed: "Ta prowincja została silnie zmilitaryzowana dzięki wojowniczym tradycjom państwa [ROOT.Owner.GetName]."
 estate_burghers_AZT_sponsor_artisans: "Wsparcie rzemieślników"
 estate_burghers_AZT_sponsor_artisans_desc: "Gwałtowna urbanizacja naszego państwa sprawiła, że wielu mieszkańców porzuciło uprawę roli i zajęło się rzemiosłem oraz sztuką. Udzielenie im wsparcia może pomóc w dalszym przekształcaniu gospodarki."
 estate_burghers_AZT_mexican_gold_mines: "Meksykańskie kopalnie złota"
 estate_burghers_AZT_mexican_gold_mines_desc: "Meksykańskie kopalnie złota należą do najcenniejszych w Ameryce. Dalsze wspieranie wydobycia przyniesie naszemu państwu jeszcze większe zyski."
 AZT_SPONSOR_ARTISANS_SCALING_MODIFIER_TT: "§YSkaluje się wraz z lojalnością§!\nPrzy lojalności §Y100%§! przywilej zapewnia:\n   Wydajność produkcji: §G+15,0%§!"
 AZT_FINAL_REFORM_BREAKS_AWAY_SUBJECTS: "Po przeprowadzeniu wszystkich §Yreform§! wszyscy nasi §Ypoddani§! uzyskają niepodległość."
 aztlan: "Aztlan"
 aztlan_ADJ: "Nahua"
 adopt_aztec_traditions_title: "Przyjmij tradycje azteckie"
 adopt_aztec_traditions_desc: "Podbijając stolicę Azteków, możemy stopniowo przejmować ich obyczaje, co pomoże nam umocnić naszą pozycję w Mezoameryce."
 aztec_empire_reform: "Imperium Azteków"
 aztec_empire_reform_desc: "Pozostałości Potrójnego Sojuszu Tenochtitlan, Tetzcoco i Tlacopan. Zamiast rządów trzech miast, Tenochtitlan zdobył pozycję dominującą i faktycznie sprawuje władzę nad mezoamerykańskim imperium."
 nahuatl_monarchy_reform: "Monarchia nahuatl"
 nahuatl_monarchy_reform_desc: "Forma rządów podkreślająca religijny charakter wiary nahuatl, a jednocześnie zachowująca autokratyczny charakter monarchii. Jej głównym celem jest zgromadzenie wystarczającej liczby ofiar i ziem, aby pomóc bogom w walce z Zagładą."
 city_alliance_reform: "Sojusz miast"
 city_alliance_reform_desc: "Sojusz miast nahua, które jednoczą się, tworząc konfederację mającą stawić czoła każdemu najeźdźcy próbującemu je podbić."
 chinampa_farms_reform: "Uprawy chinampowe"
 chinampa_farms_reform_desc: "Uprawy chinampowe, czyli pływające ogrody, pozwalają nam zwiększyć produkcję rolną i skierować naszą gospodarkę ku innym dziedzinom, takim jak rzemiosło i handel."
 blood_theocracy_reform: "Teokracja krwi"
 blood_theocracy_reform_desc: "Forma rządów sprawowana przez religijne elity Mezoameryki i kapłaństwo nahuatl. Rząd ten koncentruje się na realizacji obrzędów upuszczania krwi i składania ofiar, aby zadowolić bogów."
 telpochcalli_academy: "Akademia telpochcalli"
 telpochcalli_academy_desc: "Telpochcalli były azteckimi placówkami edukacyjnymi przeznaczonymi do kształcenia młodych chłopców z rodzin pospólstwa. Ośrodki te zapewniały praktyczne umiejętności, w tym szkolenie wojskowe, rzemiosło i edukację kulturową, przygotowując uczniów do przyszłych ról w społeczeństwie Azteków."
