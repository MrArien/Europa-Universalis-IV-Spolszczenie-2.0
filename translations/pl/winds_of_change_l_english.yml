 GER_can_have_radical_reforms_twice: "Jeśli otrzymaliśmy już wydarzenie „§YRadykalne reformy§!”, będziemy mogli otrzymać je ponownie. Jeśli jeszcze go nie otrzymaliśmy, będziemy mogli otrzymać je §Ydwukrotnie§!."
 GER_give_5_mil_power_for_every_5_loyalty_at_75: "Otrzymujemy §G+5§!£mil£ punktów władzy militarnej za każde §G5§! lojalności stanu §Y[Root.GetNobilityName]§!, maksymalnie §G+75§! przy lojalności wynoszącej 75."
 GER_upgrade_the_junker_primacy: "Wzmocnienie przywileju stanowego „§YSupremacja junkrów§!” dla stanu §Y[Root.GetNobilityName]§! podwoi zapewniane przez niego modyfikatory."
