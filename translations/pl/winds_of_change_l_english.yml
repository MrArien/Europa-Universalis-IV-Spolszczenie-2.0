 MAY_trade: "Handel mezoamerykański"
 MAY_coastal_networks: "Sieci nadbrzeżne"
 MAY_resistance: "Potyczki w górskich dolinach"
 desc_MAY_resistance: "Możliwość wycofania się na wyżyny zapewnia więcej sposobności do obrony."
 MAY_visiting_ancient_temples: "Odwiedzanie starożytnych miejsc"
 desc_MAY_visiting_ancient_temples: "Pomimo upadku miast położonych w głębi lądu wielu ludzi nadal odwiedza te miejsca, oddając hołd zapomnianym bogom i świątyniom."
 MAY_supply_of_obsidian_weapons: "Obfite zasoby broni obsydianowej"
 desc_MAY_supply_of_obsidian_weapons: "Odpowiednia polityka pozwoliła nam zgromadzić obfite zapasy obsydianowych ostrzy, dzięki czemu możemy uzbrajać nawet ludzi spoza szlachty."
 MAY_active_obsidian_source: "Eksploatowane źródło obsydianu"
 desc_MAY_active_obsidian_source: "W prowincji znajduje się aktywnie eksploatowane złoże obsydianu, zarządzane przez mezoamerykańskie państwo rozpaczliwie potrzebujące tego surowca."
 MAY_obsidian_source: "Źródło obsydianu"
 desc_MAY_obsidian_source: "W prowincji znajdują się bogate złoża obsydianu, gotowe do eksploatacji przez państwo mezoamerykańskie."
 MAY_cocoa_barter: "Wymiana ziaren kakao"
 desc_MAY_cocoa_barter: "W kulturze Majów ziarna kakaowca bywają powszechnie akceptowanym środkiem wymiany, używanym równolegle z handlem wymiennym."
 MAY_man_is_out_of_maize: "Brak ciasta kukurydzianego"
 desc_MAY_man_is_out_of_maize: "Mówi się, że bogowie ulepili ludzi z ciasta kukurydzianego. Powinniśmy być im za to wdzięczni."
 MAY_mayan_canoes: "Wielkie canoe Majów"
 desc_MAY_mayan_canoes: "Budujemy znakomite czółna, które pozwalają nam wykorzystywać je nie tylko do prowadzenia wojen."
 MAY_zapotec_and_mixtec_modifier: "Podbój Zapoteków i Misteków"
 desc_MAY_zapotec_and_mixtec_modifier: "Zapotekowie i Mikstekowie rywalizowali między sobą o zasoby w dolinie Oaxaca. Nasz podbój położył kres ich sporom."
 MAY_conquest_of_mesoamerica_1: "Podporządkowanie świata"
 desc_MAY_conquest_of_mesoamerica_1: "Cały znany świat ugina kolana przed chwalebną Konfederacją."
 MAY_conquest_of_mesoamerica_2: "Podporządkowanie świata"
 desc_MAY_conquest_of_mesoamerica_2: "Cały znany świat ugina kolana przed chwalebną Konfederacją."
 MAY_conquest_of_mesoamerica_3: "Podporządkowanie świata"
 desc_MAY_conquest_of_mesoamerica_3: "Cały znany świat ugina kolana przed chwalebną Konfederacją."
 MAY_conquest_of_mesoamerica_1_2: "Zmodyfikuj „§YPodporządkowanie świata§!” w następujący sposób:\\n  Efektywność handlu: §G+5.0%§!\\n  Zdolność rządzenia: §G+100§!\\n  Koszt technologii wojskowej: §G-5.0%§!"
 MAY_conquest_of_mesoamerica_2_3: "Zmodyfikuj „§YPodporządkowanie świata§!” w następujący sposób:\\n  Zdolność rządzenia: §G+100§!\\n  Koszt technologii wojskowej: §G-5.0%§!\\n  Modyfikator skutków nadmiernej ekspansji: §G-10.0%§!"
 estate_church_MAY_cocoa_monopoly_mod: "Monopol na kakao"
 desc_estate_church_MAY_cocoa_monopoly_mod: "Dochód z produkcji w tej prowincji trafia do podmiotu innego niż rząd."
 MAY_plastering_temples_dlc: "Tynkowanie świątyń"
 desc_MAY_plastering_temples_dlc: "Nasze świątynie stopniowo rosną dzięki nakładaniu nowych warstw tynku na istniejące budowle."
 MAY_plastering_temples_no_dlc: "Tynkowanie świątyń"
 desc_MAY_plastering_temples_no_dlc: "Nasze świątynie stopniowo rosną dzięki nakładaniu nowych warstw tynku na istniejące budowle."
 MAY_priest_influence: "Rosnące wpływy kapłanów"
 desc_MAY_priest_influence: "Od końca okresu klasycznego wspaniałe zabytki religijne popadały w ruinę. Dzięki wysiłkom na rzecz ich odbudowy znów odzyskują dawną świetność."
 MAY_american_frontiers: "Wpływy na pograniczu"
 desc_MAY_american_frontiers: "Wyruszmy w nieznane, słabo zaludnione krainy i podbijajmy nowe ziemie po drodze."
 MAY_marriage_and_intimidation: "Małżeństwa i zastraszanie"
 desc_MAY_marriage_and_intimidation: "Stworzymy sieć podporządkowanych miast i sojuszy, korzystając z najstarszych znanych ludzkości metod."
 MAY_building_up_hegemon_network: "Budowa sieci hegemonicznej"
 desc_MAY_building_up_hegemon_network: "Wojna podbojowa jest najprostszym sposobem na zbudowanie sieci hegemonii."
 MAY_expansion_of_the_realm: "Rozszerzanie państwa"
 desc_MAY_expansion_of_the_realm: "Rozszerzanie granic państwa zwiększa nasze wpływy w regionie i zmusza wszystkich, by traktowali nas z najwyższym szacunkiem."
 MAY_mayan_reform: "Niedawna reforma"
 desc_MAY_mayan_reform: "Nasze społeczeństwo przechodzi gwałtowne przemiany. Musimy odważnie stawić czoła niepewnym czasom."
 MAY_reform_evolving_modifier_1: "Reformy religijne"
 desc_MAY_reform_evolving_modifier_1: "Nasze państwo wkracza w epokę wielkich przemian społecznych, gdy reformujemy naszą religię."
 MAY_reform_evolving_modifier_2: "Reformy religijne"
 desc_MAY_reform_evolving_modifier_2: "Nasze państwo wkracza w epokę wielkich przemian społecznych, gdy reformujemy naszą religię."
 MAY_reform_evolving_modifier_3: "Reformy religijne"
 desc_MAY_reform_evolving_modifier_3: "Nasze państwo wkracza w epokę wielkich przemian społecznych, gdy reformujemy naszą religię."
 MAY_reform_evolving_modifier_4: "Reformy religijne"
 desc_MAY_reform_evolving_modifier_4: "Nasze państwo wkracza w epokę wielkich przemian społecznych, gdy reformujemy naszą religię."
 MAY_reform_evolving_modifier_5: "Reformy religijne"
 desc_MAY_reform_evolving_modifier_5: "Epoka niepewności dobiegła końca. Reformy społeczeństwa religijnego zostały przeprowadzone."
 MAY_reform_evolving_modifier_evolution: "Zmodyfikuj „§YReformy religijne§!” w następujący sposób:\\n  Modyfikator kosztu stabilności: §G-3.0%§!\\n  Równowaga lojalności wszystkich stanów: §G+1.0%§!\\n"
 MAY_unifying_maya_people: "Zjednoczenie ludów Majów"
 desc_MAY_unifying_maya_people: "W minionych stuleciach wiele grup Majów odłączyło się od pozostałych. Dziś władzę nad nimi wszystkimi sprawuje Konfederacja Majów."
 MAY_religion_reformed: "Rewolucja rewolucja"
 desc_MAY_religion_reformed: "Nikt nie mógł przewidzieć, jak bardzo nasze wierzenia zmienią się w ciągu ostatniego stulecia."
 MAY_restoration: "Odnowa zabytków"
 desc_MAY_restoration: "W tej prowincji znajduje się odbudowane starożytne miasto Majów."
 MAY_restoring_maya_golden_age: "Przywrócenie złotego wieku miast Majów"
 desc_MAY_restoring_maya_golden_age: "Powróciła złota era monumentalnego kultu religijnego, a bogom oddaje się cześć w wielu wspaniałych świątyniach Konfederacji."
 MAY_jungle_reduction: "Przystosowanie do tropikalnych dżungli"
 desc_MAY_jungle_reduction: "Mieszkańcy tej prowincji przywykli do surowego klimatu tropikalnego."
 MAY_jungle_reduction_upgrade: "Przystosowanie do tropikalnych dżungli"
 desc_MAY_jungle_reduction_upgrade: "Dzięki pomysłowości wielu pokoleń mieszkańcy tej prowincji doskonale przystosowali się do surowego klimatu tropikalnego."
 MAY_taming_the_jungle: "Poskromienie dżungli"
 desc_MAY_taming_the_jungle: "Oswajamy niegościnne dżungle i przekształcamy je w miejsca, w których możemy się rozwijać."
 MAY_to_war: "Na wojnę!"
 desc_MAY_to_war: "Największa konfederacja, jaką widział Jukatan, wreszcie upadła. Czas zebrać pozostałości!"
 MAY_building_up_the_city: "Rozbudowa miasta"
 desc_MAY_building_up_the_city: "Inne kuchkabale będą działać pospiesznie, a my staniemy się schronieniem dla tych, których wyniszczyła wojna."
 MAY_communities: "Społeczności Ppolomo'ob"
 desc_MAY_communities: "Społeczności Ppolomo'ob w innych krajach przyczyniają się do poprawy naszej reputacji."
 MAY_production_efficiency: "Rozwój portów handlowych"
 desc_MAY_production_efficiency: "Rozwój naszych portów zwiększył wymianę handlową z obcymi państwami, a tym samym naszą produkcję."
 MAY_manufactory_buff: "Wzrost popytu"
 desc_MAY_manufactory_buff: "Rozwój handlu krajowego zwiększył popyt na wiele naszych towarów, podnosząc produktywność manufaktur."
 MAY_merchant_travels: "Handel dalekosiężny"
 desc_MAY_merchant_travels: "Nasi kupcy kierują bogactwa tego świata prosto na Jukatan."
 MAY_ashes_of_mayapan: "Na zgliszczach Mayapan"
 desc_MAY_ashes_of_mayapan: "Na zgliszczach Mayapan powstanie nowa konfederacja — mniej zdradziecka i odporna na rozpad od wewnątrz."
 MAY_restoring_cities: "Postępująca urbanizacja"
 desc_MAY_restoring_cities: "Nasze miasta rozwijają się w niespotykanym dotąd tempie."
 MAY_has_killed_20k_troops: "Od ukończenia misji „§YReforma naszego społeczeństwa§!” zabito na polu bitwy co najmniej §Y20000§! wrogów. ([Root.GetAmountofMayanCasualties]/§Y20000§!)"
 MAY_decays_1_yearly: "Spada o §R-1.00§! rocznie."
 MAY_turn_off_missions: "Misje „§YZnak Chac Ek§!”, „§YSezon wypraw wojennych§!” i „§YReforma naszego społeczeństwa§!” ponownie będą możliwe do ukończenia."
 MAY_reform_passed: "Reforma przyjęta"
 estate_nobles_MAY_arm_nobles_with_obsidian_blades: "Uzbrój niższą [Root.GetNobilityName] w macuahuitl"
 estate_nobles_MAY_arm_nobles_with_obsidian_blades_desc: "Obecnie tylko najbogatsi szlachcice mogą pozwolić sobie na używanie w walce ostrzy z obsydianu, co daje nam niewielką przewagę nad wrogami lub nie daje jej wcale. Gdybyśmy zdobyli więcej macuahuitl, moglibyśmy uzbroić w nie większą część naszych sił."
 estate_church_MAY_cocoa_monopoly: "Monopol na kakao"
 estate_church_MAY_cocoa_monopoly_desc: "Kakao ma ogromne znaczenie dla społeczeństwa Majów. Kontrolę nad tym niezbędnym surowcem można powierzyć tym, którym ufamy najbardziej — [Root.GetClergyName]."
 estate_nobles_MAY_spread_dynastic_influence: "Rozszerz wpływy dynastyczne"
 estate_nobles_MAY_spread_dynastic_influence_desc: "Aby zagwarantować, że nasi poddani pozostaną częścią konfederacji, możemy nawiązywać więzi dynastyczne lub wręcz narzucić im naszą dynastię."
 estate_burghers_MAY_tropical_adaptation: "Przystosowanie do tropików"
 estate_burghers_MAY_tropical_adaptation_desc: "Znamy wiele sposobów przystosowania się do warunków panujących w dżungli. Nie szczędzimy wysiłków, by wykorzystać tę wiedzę."
 estate_burghers_MAY_support_of_chontal_maya: "Wsparcie Majów Chontal"
 estate_burghers_MAY_support_of_chontal_maya_desc: "Majowie Chontal prowadzą handel na terenie całego naszego kraju. Dzięki ich pomocy możemy stworzyć rozległą sieć handlową."
 maya_reforms_passed_tt_1: "Przeprowadzono co najmniej §Y1§! reformę religijną Majów."
 maya_reforms_passed_tt_2: "Przeprowadzono co najmniej §Y2§! reformy religijne Majów."
 maya_reforms_passed_tt_3: "Przeprowadzono co najmniej §Y3§! reformy religijne Majów."
 maya_reforms_passed_tt_4: "Przeprowadzono co najmniej §Y4§! reformy religijne Majów."
 maya_reforms_passed_tt_5: "Przeprowadzono co najmniej §Y5§! reform religijnych Majów."
 MAY_has_5_tolerance_own: "Posiada co najmniej §G+5.00§! tolerancji prawdziwej wiary"
 MAY_upgrading_monuments_to_level_3_gives_splendor: "Wydarzenie „§YMonumentalna duma§!”, pojawiające się po rozbudowaniu §Ywielkiego projektu§! do poziomu §Ywspaniałego§!, zapewni również §G+400§! splendoru."
 MAY_distribute_10_manpower: "Rozdziel §G10§! punktów podstawowej siły ludzkiej pomiędzy nasze prowincje."
 developed_provinces_at_least_30_times: "§YRozwinął§! prowincje co najmniej §Y30§! razy. (Obecnie: §Y[Root.GetNumDevelopedProvinces]§!.)"
 developed_provinces_at_least_100_times: "§YRozwinął§! prowincje co najmniej §Y100§! razy. (Obecnie: §Y[Root.GetNumDevelopedProvinces]§!.)"
