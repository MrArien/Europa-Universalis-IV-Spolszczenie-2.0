 flavor_hab.25.t: ""
 flavor_hab.25.d: "W ostatnich latach Burgundia rozszerzyła swoje posiadłości na ziemie cesarskie, zwłaszcza Niderlandy i zachodnią granicę naszego imperium, zgłaszając roszczenia do Lotaryngii. Teraz, gdy [Root.Monarch.GetName] został koronowany na księcia Burgundii, możemy zdecydować o dalszym losie tego państwa."
 flavor_hab.25.a: "Zachowajmy suwerenność Burgundii."
 flavor_hab.25.b: "Jej ziemie należą do nas."
 flavor_hab.26.t: "Ostatni rycerz"
 flavor_hab.26.d: "W epoce konfliktów i pożogi Europa ponownie pogrążyła się w wojnie. Ziemie państwa [Root.GetName] znalazły się w samym środku wydarzeń, otoczone przez wrogów ze wszystkich stron. W tych czasach rozbłysła pierwsza iskra wielkości [Root.GetName].\\n\\nMaksymilian I z państwa [Root.GetName] jest prawdopodobnie najsłynniejszym cesarzem Świętego Cesarstwa Rzymskiego. Dzięki ambicjom podporządkował znaczną część Europy Zachodniej dynastii Habsburgów, a jego reformy wojskowe ukształtowały sztukę wojenną na kolejne stulecia i doprowadziły do powstania szyku pikinierów i strzelców."
 flavor_hab.26.a: "Poprowadzi Habsburgów ku chwale."
 flavor_hab.26.b: "Epoka rycerstwa dobiegła końca."
 flavor_hab.27.t: "Koniec Osmanów"
 flavor_hab.27.d: "Osmańskie zagrożenie ze wschodu przestanie już nękać Europę. Wyzwolenie Bałkanów i wyparcie tureckich armii do Azji wielu ludzi uważa za świt nowej epoki – czasów, w których muzułmańscy najeźdźcy już nigdy nie zagrożą ziemiom chrześcijaństwa."
 flavor_hab.27.a: "Europa wreszcie uwolniła się od osmańskiego zagrożenia."
 flavor_hab.28.t: "Reformy Raaba"
 flavor_hab.28.d: "Po przeprowadzeniu licznych reform rolnych i przejęciu przez Koronę znacznej części dóbr kościelnych Franz Anton von Raab zwraca uwagę na drugi największy problem austriackiego dobrobytu – szlachtę. Zamierza wprowadzić reformy, które mogą ją rozgniewać, lecz całkowicie zniosą pańszczyznę w naszym kraju i pozwolą znacznej części ludności pracować w bardziej dochodowych gałęziach gospodarki bezpośrednio na rzecz państwa, zamiast służyć szlachcie."
 flavor_hab.28.a: "Rozszerzmy te reformy na szlachtę!"
 flavor_hab.28.b: "Pozwólmy szlachcie zachować wpływy."
 flavor_hab.29.t: "Podbój Francji"
 flavor_hab.29.d: "Ziemie Francji należały niegdyś do Germanów i wchodziły w skład państwa Franków. Podział imperium karolińskiego na mocy traktatu z Verdun rozdzielił Francję Wschodnią i Zachodnią pod względem terytorium, prawa oraz kultury. Teraz, gdy Francuzi również znaleźli się pod naszym panowaniem, być może zdołamy ponownie zjednoczyć ich z prawowitymi następcami Karola Wielkiego."
 flavor_hab.29.a: "Staną się częścią Świętego Cesarstwa Rzymskiego."
 flavor_hab.29.b: "Uczcijmy to zwycięstwo."
 flavor_hab.30.t: "Założenie nowego imperium"
 flavor_hab.30.d: "Nasze podboje doprowadziły do zjednoczenia pod berłem Korony wielu różnych kultur. Wielu z tych ludów nie podziela obyczajów naszej kultury [Root.Culture.GetName], lecz okazało się niezwykle przydatnych dla państwa [Root.GetName]."
 flavor_hab.30.a: "Oto Cesarstwo Austriackie!"
 flavor_hab.30.b: "Więcej korzyści przyniesie nam skupienie się na różnorodnych kulturach naszego państwa."
 flavor_hab.31.t: "Miasta Polski"
 flavor_hab.31.d: "Chociaż Polska obfituje w liczne miasta, żadne z nich nie wyróżnia się tak jak Kraków i Warszawa. Oba uważane są za szczyt polskiego budownictwa miejskiego, ale musimy zdecydować, na którym z nich powinniśmy się skupić."
 flavor_hab.31.a: "Kraków będzie naszym miastem przemysłowym."
 flavor_hab.31.b: "Ludzie będą gromadzić się w Warszawie na czas wojny."
 flavor_hab.32.t: "Rozświetlanie cieni"
 flavor_hab.32.d: "Królestwo cieni było cierniem w naszym boku. Ryzykując nasze roszczenia we Włoszech i pokazując, że możemy być zwykłymi pretendentami próbującymi przejąć dziedzictwo Rzymu. Nadszedł czas, abyśmy zwołali elektorów i książąt, aby zobaczyć, jak powinniśmy podejść do tej kwestii."
 flavor_hab.32.a: "Najlepsze byłoby pokojowe podejście."
 flavor_hab.32.b: "Przypomnijmy im, dlaczego posiadamy cesarską koronę."
 flavor_hab.33.t: "Australio-Węgry?"
 flavor_hab.33.d: "Po założeniu kolonii w Australii, wielu rdzennych mieszkańców zaczęło nazywać siebie poddanymi Australii-Węgier. Uważamy to imię za dziwne, ponieważ nasz naród austriacki nie ma nic wspólnego z tymi osadnikami w Australii. Mimo to brzmi to jak interesujące imię..."
 flavor_hab.33.a: "Zaakceptujemy tę nową nazwę."
 flavor_hab.33.b: "Co? Nie."
 flavor_hab.34.t: "Koniec rządów cesarskich"
 flavor_hab.34.d: "Po rozwiązaniu Świętego Cesarstwa Rzymskiego nasi doradcy sugerują, byśmy porzucili próby odtworzenia dziedzictwa Karola Wielkiego i zamiast tego zjednoczyli Niemcy mieczem."
 flavor_hab.34.a: "Nadszedł koniec pewnej epoki."
 flavor_hab.35.t: "Unia iberyjska"
 flavor_hab.35.d: "W obliczu licznych zagrożeń, które pojawiły się wokół nas, nasi bracia z dynastii [union_target.Monarch.Dynasty.GetName], władający państwem [union_target.GetName], zaproponowali unię naszych państw. Choć oznaczałoby to koniec suwerenności naszego kraju, pozwoliłoby nam połączyć siły i pokonać wspólnych wrogów."
 flavor_hab.35.a: "Oddałbym wszystko, by ochronić mój lud…"
 flavor_hab.35.b: "Nasza niepodległość jest ważniejsza."
 flavor_hab.36.t: "Sytuacja w Austrii"
 flavor_hab.36.d: "Wraz z rosnącymi wpływami w południowych Niemczech i Austrii, pozostało nam tylko kilka małych państw do podporządkowania, zanim będziemy mogli zacząć walczyć z innymi narodami wokół nas."
 flavor_hab.36.a: "Idźmy naprzód i podbijmy Celje i Trydent."
 universal_empire.2.t: "Uniwersalne imperium"
 universal_empire.2.d: "Wzrost potęgi monarchii dynastii [Emperor.Monarch.Dynasty.GetName] zaniepokoił wiele państw Świętego Cesarstwa Rzymskiego. Zaczęły postrzegać ją jako zagrożenie dla swojej suwerenności, a nie obrońcę. Dwór cesarski musi rozstrzygnąć, jaki będzie los tego uniwersalnego imperium."
 universal_empire.2.a: "Zobaczymy, co reszta Europy sądzi o tym imperium."
 universal_empire.1.t: "Los uniwersalnego imperium"
 universal_empire.1.d: "Znaczna część Cesarstwa zwróciła się przeciwko nam, a nasze imperium jest nadmiernie rozciągnięte. Nadszedł czas, by znaleźć rozwiązanie."
 universal_empire.1.a: "Rozdzielmy nasze państwa."
 universal_empire.1.b: "Nie będziemy słuchać obcych, którzy chcą decydować o rozmiarach naszego państwa!"
 integrated_personal_union: "Inkorporowana unia personalna"
 integrated_personal_union_long_desc: "Inkorporowane unie personalne są łatwiejsze do zaanektowania i nie wymagają utrzymywania stosunków dyplomatycznych."
 integrated_personal_union_is_our: "$NAME|Y$ jest zintegrowaną unią personalną z nami."
