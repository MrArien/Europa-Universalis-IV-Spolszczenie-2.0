 moravia_nitra_reforge_great_moravia_title: "Przywróć Wielkie Morawy"
 moravia_nitra_reforge_great_moravia_desc: "Po odbiciu ziem, które kiedyś należały do ​​Wielkich Moraw, najwyższy czas, abyśmy oficjalnie ogłosili ich pełne przywrócenie!"
