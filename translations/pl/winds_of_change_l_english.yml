 ITA_scramble_for_america_wargoal: "Zdobądź prowincję"
 ITA_scramble_for_america_wargoal_desc: "Celem wojny jest okupowanie konkretną prowincję."
 ITA_SCRAMBLE_FOR_AMERICA_WARNAME: "$ORDER$Wyścig o $PROVINCE$"
 ITA_dismantle_hre_wargoal: "Zdobądź stolicę"
 ITA_dismantle_hre_wargoal_desc: "Celem wojny jest okupowanie stolicy. "
 ITA_HRE_DISMANTLEMENT_WARNAME: "$ORDER$Wojna o rozwiązanie Cesarstwa"
 ITA_higher_likelihood_of_entrepeneur_no_longer: "§Y[Root.Owner.GetName]§! nie będzie już mieć zwiększonej szansy na władcę o osobowości §YPrzedsiębiorczy§!."
 ITA_higher_likelihood_of_entrepeneur: "§Y[Root.Owner.GetName]§! będzie mieć zwiększoną szansę na władcę o osobowości §YPrzedsiębiorczy§!."
 ITA_superior_trade_center: "Port światowy"
 desc_ITA_superior_trade_center: ""
 ITA_every_colonial_nation_will_get_goods_produced: "Każde §Ypaństwo kolonialne§! otrzyma §G+10,0%§! produkcji towarów."
 ITA_unification_of_navies: "Zjednoczenie flot regionalnych"
 desc_ITA_unification_of_navies: "W wyniku szybkiego zjednoczenia Włoch przejęliśmy i zintegrowaliśmy wiele okrętów zbudowanych według różnych standardów. Muszą one zostać dostosowane do nowych warunków."
 ITA_best_form_of_defense_is_attack: "Obrona wybrzeża"
 desc_ITA_best_form_of_defense_is_attack: "Podstawowym zadaniem naszej floty będzie ochrona wybrzeża. Gdy ustaną nieustanne najazdy Berberów, będziemy mogli naprawdę rozkwitnąć."
 ITA_latin_tiara: "Łacińska tiara triumfuje nad turbanem"
 desc_ITA_latin_tiara: "Bizantyjczycy woleli turban od tiary. Nie ma to już jednak znaczenia, ponieważ nie mają teraz wyboru."
 ITA_no_more_holy_romans: "Zniszczenie Świętego Cesarstwa Rzymskiego"
 desc_ITA_no_more_holy_romans: "Bezbożne germańskie urojenie zostało pokonane."
 ITA_littoral: "Wybrzeże Adriatyku"
 ITA_enhanced_emperorship: "Dyplomatyczne przejęcie"
 desc_ITA_enhanced_emperorship: "Zamiast rozwiązywać Święte Cesarstwo Rzymskie w wyniku wojny podbojowej, postanowiliśmy przejąć je od środka. To sprytne i podstępne rozwiązanie."
 ITA_integration_with_southern_france: "Integracja z Oksytańczykami"
 desc_ITA_integration_with_southern_france: "Oksytańczycy są kulturowo bliscy łacińskim mieszkańcom Italii. Włączenie ich do naszego państwa nie powinno sprawić większych trudności."
 ITA_conquest_of_britain: "Podbój Brytanii"
 desc_ITA_conquest_of_britain: "Potężny angielski Drewniany Mur nie stanowi dla nas przeszkody. Albion znajduje się teraz pod naszą kontrolą."
 ITA_crusader_kings: "Królowie krzyżowców"
 desc_ITA_crusader_kings: "Święte miasto Jerozolima jest w naszym zasięgu. Musimy zadbać, by pielgrzymi poświęcali mu należytą uwagę."
 ITA_blatant_roman_larp: "Oczywiści pretendenci do rzymskiego dziedzictwa"
 desc_ITA_blatant_roman_larp: "Wszyscy nasi partnerzy dyplomatyczni doskonale wiedzą, jakie mamy plany. Nasze imperialistyczne zapędy budzą ich niezadowolenie."
 ITA_all_roads_lead_to_rome: "Wszystkie drogi prowadzą do Rzymu"
 desc_ITA_all_roads_lead_to_rome: "To stare powiedzenie nigdy nie było prawdziwsze niż dzisiaj."
 ITA_true_roman_empire: "Prawowici dziedzice Rzymu"
 ITA_until_roman_empire_is_formed: "do czasu utworzenia @ROM §YCesarstwa Rzymskiego§!"
 ITA_unity: "Zjednoczenie zakończone"
 desc_ITA_unity: "Ta prowincja jest częścią Półwyspu Apenińskiego — ziemi niegdyś podzielonej, lecz teraz zjednoczonej dzięki risorgimentu."
 ITA_center_of_silk_weaving: "Ośrodek tkactwa jedwabiu"
 desc_ITA_center_of_silk_weaving: "Ta prowincja jako jedna z pierwszych przyjęła metody tkania jedwabiu po sprowadzeniu jedwabników do Włoch w X wieku."
 ITA_center_of_silk_production: "Ośrodek uprawy morwy"
 desc_ITA_center_of_silk_production: "Dzięki idealnemu klimatowi prowincja ta jest niekwestionowanym liderem uprawy morwy."
 ITA_murano_glass: "Szkło z Murano"
 desc_ITA_murano_glass: "Szkło wytwarzane na wyspie Murano słynie w całej Europie. Aby wykorzystać tę renomę, znacznie zwiększyliśmy produkcję."
 ITA_protectionism: "Promowanie protekcjonizmu"
 desc_ITA_protectionism: "Promujemy merkantylizm, ograniczając import do minimum i maksymalizując eksport."
 ITA_permanent_absolutism_buff: "Nowa era Włoch"
 desc_ITA_permanent_absolutism_buff: "Włochy wkraczają w nową erę, w której nie będą już przyćmiewane przez inne mocarstwa. Staną się wielką potęgą."
 ITA_constantinople_taken: "Zdobycie Konstantynopola"
 desc_ITA_constantinople_taken: "Wschodniorzymski Konstantynopol został zdobyty i będzie teraz rozkwitać pod rzymskimi rządami."
 ITA_stylize: "Przyjmiemy §Yrzymskie§! nazewnictwo ustroju."
 estate_nobles_ITA_military_governors: "Nadanie gubernatorstw wojskowych"
 estate_nobles_ITA_military_governors_desc: "Dzięki szybkiemu odzyskiwaniu rzymskich terytoriów możemy powierzyć ich administrację niektórym generałom, ryzykując jednak, że staną się zbyt potężni i wpływowi."
 ITA_specify_the_conditional_effects: "Podczas wojny otrzymamy §G-0,05§! miesięcznej zmiany autonomii."
 ITA_upgrade_military_governorship_with_abso: "Wzmocnij przywilej stanowy „§YNadanie gubernatorstw wojskowych§!”, zapewniając §G+5,00§! maksymalnego absolutyzmu."
 ITA_upgrade_military_governorship_with_autonomy_in_terr: "Wzmocnij przywilej stanowy „§YNadanie gubernatorstw wojskowych§!”, zapewniając §G-5,0%§! minimalnej autonomii na terytoriach."
 ITA_upgrade_military_governorship_with_army_quality: "Wzmocnij przywilej stanowy „§YNadanie gubernatorstw wojskowych§!”, zapewniając §G+1,00§! rocznej tradycji armii i §G+1,00§! siły uderzenia dowódców lądowych."
 ITA_all_provinces_lose_10_autonomy: "Wszystkie posiadane prowincje stracą §G10,0%§! autonomii."
 ITA_upgrade_city_expansion_privileges: "Wzmocnij przywilej stanowy „§YPrzywileje rozbudowy miast§!”, usuwając koszt w postaci §Ymaksymalnego absolutyzmu§!. Ponadto, gdy przywilej będzie aktywny, realizacja zadań stanu §Y[Root.GetBurghersName]§! będzie rozdzielać §G3§! losowe punkty rozwoju w prowincji §Y[Root.GetName]§!."
 ITA_3_random_dev_distribution: "Rozdziel §G3§! losowe punkty rozwoju między nasze prowincje."
 ITA_doing_estate_burghers_agendas: "Realizacja zadań stanu §Y[Root.GetBurghersName]§! będzie rozdzielać §G3§! losowe punkty rozwoju w prowincji §Y[Root.GetName]§!."
 ITA_unlock_roman_ambition: "Odblokowuje casus belli „§YRzymskie ambicje§!” przeciwko państwom posiadającym prowincje, do których mamy §Yroszczenia§! i które są wymagane do utworzenia @ROM §Y[ROM.GetName]§!. Prowincje spełniające te warunki kosztują o §G10,0%§! mniej punktów agresywnej ekspansji i §G10,0%§! mniej punktów warscore przy aneksji."
 ITA_triumph_for_hispaniae: "Triumf w Hiszpanii"
 desc_ITA_triumph_for_hispaniae: "Rozjuszony hiszpański byk został poskromiony. Sprawujemy kontrolę nad Hispanią."
 ITA_conquest_of_west_1: "Podporządkowanie Galów"
 desc_ITA_conquest_of_west_1: "Spadkobiercy Galów ugną się przed rzymskim panowaniem. Podboje Cezara zostaną utrzymane."
 ITA_conquest_of_west_2: "Podporządkowanie Galów"
 desc_ITA_conquest_of_west_2: "Spadkobiercy Galów ugną się przed rzymskim panowaniem. Podboje Cezara zostaną utrzymane."
 ITA_conquest_of_east_1: "Odzyskanie łacińskiego dziedzictwa"
 desc_ITA_conquest_of_east_1: "Zachodnie krańce Grecji i Anatolii od dawna pozostają pod wpływem łacińskim. Te więzi nie mogą zostać zerwane!"
 ITA_conquest_of_east_2: "Odzyskanie łacińskiego dziedzictwa"
 desc_ITA_conquest_of_east_2: "Zachodnie krańce Grecji i Anatolii od dawna pozostają pod wpływem łacińskim. Te więzi nie mogą zostać zerwane!"
 ITA_conquest_of_africa_1: "Odzyskanie Afryki"
 desc_ITA_conquest_of_africa_1: "Kartagińczycy ośmielili się rzucić nam wyzwanie. Ich mierni następcy nie odważą się zrobić tego ponownie."
 ITA_conquest_of_africa_2: "Odzyskanie Afryki"
 desc_ITA_conquest_of_africa_2: "Kartagińczycy ośmielili się rzucić nam wyzwanie. Ich mierni następcy nie odważą się zrobić tego ponownie."
 ITA_humiliation_of_holy_roman_empire_1: "Podporządkowanie Świętego Cesarstwa"
 desc_ITA_humiliation_of_holy_roman_empire_1: "Germańscy uzurpatorzy powoli pojmują, że dzięki naszym podbojom ich fałszywe imperium przestało istnieć."
 ITA_humiliation_of_holy_roman_empire_2: "Podporządkowanie Świętego Cesarstwa"
 desc_ITA_humiliation_of_holy_roman_empire_2: "Germańscy uzurpatorzy powoli pojmują, że dzięki naszym podbojom ich fałszywe imperium przestało istnieć."
 ITA_final_modifier: "Odrodzony Rzym"
 desc_ITA_final_modifier: "Rzym upadł raz, lecz nigdy więcej się to nie stanie. Roma Invicta!"
 ITA_while_cavour_is_active: "Dopóki §YCamillo Benso di Cavour§! żyje i pozostaje na stanowisku, otrzymujemy również:\\nKoszt rozwoju: §G-3,0%§!\\nPrzyrost postępu reform: §G+10,0%§!\\nModyfikator produkcji towarów: §G+3,0%§!\\n\\nWartości tych modyfikatorów zależą od §Ypoziomu doradcy§!."
 ITA_conquest_of_east_1_2: "Zmodyfikuj „§YOdzyskanie łacińskiego dziedzictwa§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Tolerancja prawdziwej wiary: §G+1,00§!"
 ITA_conquest_of_west_1_2: "Zmodyfikuj „§YPodporządkowanie Galów§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Miesięczne wyczerpanie wojną: §G-0,05§!"
 ITA_conquest_of_africa_1_2: "Zmodyfikuj „§YOdzyskanie Afryki§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Zdolność bojowa galer: §G+10,0%§!"
 ITA_humiliation_of_holy_roman_empire_1_2: "Zmodyfikuj „§YPodporządkowanie Świętego Cesarstwa§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Miesięczna zmiana autonomii: §G-0,05§!"
 ITA_final_modifier_tt: "Połącz „§YOdzyskanie Afryki§!”, „§YOdzyskanie łacińskiego dziedzictwa§!”, „§YPodporządkowanie Galów§!” i „§YPodporządkowanie Świętego Cesarstwa§!” w modyfikator „§YOdrodzony Rzym§!” i zmodyfikuj go o:\\n  Koszt tworzenia rdzeni: §G-5,0%§!\\n  Roczny absolutyzm: §G+1,00§!"
 ITA_warriors_do_not_read_books_will_no_longer_happen: "Wojownicy zaczną teraz zdobywać wykształcenie.\\nWydarzenie „§YWojownicy nie czytają ksiąg§!” nie będzie już występować."
 ITA_enable_privilege_for_military_governors: "Odblokowuje przywilej stanowy „§YNadanie gubernatorstw wojskowych§!” dla §Y[Root.GetNobilityName]§!, zapewniający §G-5,0%§! kosztu zarządzania terytoriami oraz dodatkowe §G-0,05§! miesięcznej zmiany autonomii podczas §Ywojny§!."
 ITA_lost_legions_merc_company: "Odblokowuje kompanię najemników „§JZaginione legiony§!”, której zaciąg nie kosztuje §Yprofesjonalizmu armii§!. Kompania zapewnia następujące modyfikatory:\\n  Zdolność bojowa piechoty: §G+10,0%§!\\n  Otrzymywane obrażenia morale: §G-15,0%§!\\n  Otrzymywane obrażenia od wstrząsu: §G-15,0%§!\\n  Otrzymywane obrażenia od ostrzału: §R+5,0%§!"
 ITA_galleass_amount: "Armada galeasów"
 desc_ITA_galleass_amount: "Uznaliśmy galeasy za doskonałe okręty, dlatego postanowiliśmy po prostu zbudować ich więcej."
 ITA_galleass_transport: "Przystosowanie do desantów"
 desc_ITA_galleass_transport: "Dawne galeasy służyły przede wszystkim do walki, lecz nasze modyfikacje mają uczynić je bardziej wszechstronnymi."
 ITA_galleass_durability: "Modyfikacje kadłuba"
 desc_ITA_galleass_durability: "Kadłuby naszych galeasów zostały zmodyfikowane, aby były bardziej wytrzymałe w walce."
 ITA_allow_galleasses: "Nowe oblicze galery"
 desc_ITA_allow_galleasses: "Czas rozpocząć nową erę walki na Morzu Śródziemnym."
 ITA_galleass_galleys: "Nowe oblicze galery"
 desc_ITA_galleass_galleys: "Czas rozpocząć nową erę walki na Morzu Śródziemnym."
 ITA_new_renaissance: "Odrodzenie Włoch"
 desc_ITA_new_renaissance: "W XV wieku Włochy przyjęły renesans — epokę intelektualnego odrodzenia."
 ITA_flowering_of_renaissance: "Rozkwit renesansu"
 desc_ITA_flowering_of_renaissance: "Dzięki naszej polityce i mecenatowi renesans może trwać nieprzerwanie, dostarczając państwu nowych idei i wynalazków."
 ITA_renaissance: "Kontynuacja renesansu"
 desc_ITA_renaissance: "Dzięki naszym staraniom udało się podtrzymać renesans."
 ITA_adapt_the_condotierri: "Nowocześni kondotierzy"
 desc_ITA_adapt_the_condotierri: "Postanowiliśmy przekształcić naszą armię w siłę, która zarówno dostarcza najemników, jak i sama z nich korzysta. Kluczem jest elastyczność."
 ITA_modern_military: "Modernizacja armii"
 desc_ITA_modern_military: "Postanowiliśmy udoskonalić taktykę ogniową naszej armii."
 ITA_diplomatic_revolution_weaker: "Rewolucja dyplomatyczna"
 desc_ITA_diplomatic_revolution_weaker: "Wejście Włoch do grona wielkich mocarstw znacząco zachwiało równowagą sił."
 ITA_diplomatic_revolution: "Rewolucja dyplomatyczna"
 desc_ITA_diplomatic_revolution: "Wejście Włoch do grona wielkich mocarstw znacząco zachwiało równowagą sił."
 merc_ita_lost_legions: "§JZaginione legiony§!"
 ITA_sources_of_galleasses: "Przy §G100§! tradycji morskiej możesz uzyskać do §G+50,0%§! limitu sił galeasów."
 ITA_distribute_dev_across_the_empire: "Rozdziel §G12§! losowych punktów rozwoju między nasze prowincje."
 ITA_distribute_additional_dev_across_the_empire: "Rozdziel dodatkowe §G8§! losowych punktów rozwoju między nasze prowincje."
 ITA_cruelty_of_mercenaries_event_will_no_longer_happen: "Wydarzenie „§YOkrucieństwo najemników§!” nie będzie już występować."
