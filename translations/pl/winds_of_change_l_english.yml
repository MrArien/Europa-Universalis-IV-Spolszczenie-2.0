 mechanic_army_tradition_on_stackwipe_no: ""
 continue_the_renaissance_reform: "Kontynuuj renesans"
 continue_the_renaissance_reform_desc: "Oświecone rządy króla Macieja przyniosły wielki rozwój nauki, sztuki i kultury. Dzięki niemu staliśmy się pierwszym państwem poza Italią, które przyjęło renesans. Musimy kontynuować ten wysiłek i uczynić Węgry centrum europejskiej sztuki i nauki."
 extend_the_unio_trium_nationum_reform: "Rozszerz Unię Trzech Narodów"
 extend_the_unio_trium_nationum_reform_desc: "W 1438 roku szlachta Siedmiogrodu podpisała pakt wzajemnej pomocy znany jako Unio Trium Nationum. Sygnatariusze zobowiązali się wspierać nawzajem w walce z buntami chłopskimi i najazdami osmańskimi. Układ znacznie wzmocnił miejscową szlachtę, a niektórzy sugerują, że warto rozszerzyć go na całe Węgry."
 imperial_hungarian_government: "Cesarska monarchia węgierska"
 imperial_hungarian_government_desc: "Rozległość naszego imperium wymaga reform, które zapewnią mu spójność i stabilność poprzez zagwarantowanie wszystkim zamieszkującym je narodom równych praw i reprezentacji politycznej."
 form_austria_hungary_title: "Utwórz Austro-Węgry"
 form_austria_hungary_desc: "Choć unia między Austriakami a Węgrami jest silna, wspólny monarcha może nie wystarczyć. Aby przetrwać i utrzymać się na mapie Europy, otoczeni przez inne wielkie mocarstwa, musimy sformalizować tę unię jeszcze bardziej, łącząc nasze narody nie tylko wspólną koroną, lecz także wspólnym rządem."
 estate_nobles_vegvar_system: "System végvárów"
 unlock_privilege_estate_nobles_vegvar_system_tt: "Odblokowuje przywilej stanu [Root.GetNobilityOrFallbackName] „§YSystem végvárów§!”, zapewniający §G+25,00%§! obrony fortów i §G-50,00%§! kosztów utrzymania fortów we wszystkich §Yprzygranicznych prowincjach§! posiadających §Yfort§!."
 estate_nobles_vegvar_system_tt: "Każda przygraniczna prowincja posiadająca §Yfort§! zyskuje następujący modyfikator:"
 estate_nobles_vegvar_system_rt: "Każda przygraniczna prowincja posiadająca §Yfort§! traci §G+25,00%§! obrony fortów i §G-50,00%§! kosztów utrzymania fortów."
 hun_vegvar_province_desc: "dopóki ten przywilej pozostaje aktywny"
 estate_burghers_hungarian_royal_cities: "Rozbuduj wolne miasta królewskie"
 estate_burghers_hungarian_royal_cities_desc: "Węgierskie miasta królewskie od stuleci są ośrodkami handlu i wymiany, przynoszącymi ogromne bogactwo całemu krajowi. Rozszerzmy ich przywileje, by przyciągnąć jeszcze więcej zagranicznych kupców i inwestorów oraz przekształcić je w prawdziwe metropolie, przyćmiewające nawet największe miasta Zachodu."
