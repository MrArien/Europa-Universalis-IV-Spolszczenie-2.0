 bohemia_abolished: "Zniesiono czeską monarchię elekcyjną."
 CSU_ground_shaker_title: "Wstrząsacz Ziemi"
 CSU_ground_shaker_desc: "Historia Cusiego Yupankiego, zwanego Pachacutim, czyli Wstrząsaczem Ziemi lub Reformatorom, jest dobrze znana. Był jednym z synów Inków z Cuzco. Gdy jego ojciec opuścił miasto w obawie przed armią Chanków, Pachacuti pozostał na miejscu i mężnie pokonał najeźdźców dzięki przychylności bogów. A przynajmniej tak głosi opowieść — szczegóły tych wydarzeń zmieniały się z czasem, by odpowiadać potrzebom jego następców."
 CSU_cajamarca_title: "Podbij Cajamarcę"
 CSU_cajamarca_desc: "Cajamarca to duży ośrodek miejski na północy i powinna być głównym celem naszej wyprawy podbojowej w tym kierunku."
 CSU_quito_title: "Zajmij Quito"
 CSU_quito_desc: "W miarę jak posuwamy się na północ, surowy klimat wysokogórski staje się łagodniejszy. Zmienia się również skład etniczny ludności — miasto Quito jest stolicą ludu Caran."
 CSU_qolla_title: "Staw czoła Qollom"
 CSU_qolla_desc: "Colla są bez wątpienia naszymi najpotężniejszymi rywalami i władają północną częścią kotliny Titicaca. Ich pokonanie zapoczątkuje nową erę w Andach — erę, w której Inkowie będą panować nad wszystkimi."
 CSU_southern_fringes_title: "Zajmij południowe rubieże"
 CSU_southern_fringes_desc: "Altiplano to rozległa równina położona na południe od jeziora Titicaca. Brak stromych wzniesień jest być może największym atutem tej krainy. Podbijmy ją i stwórzmy tam podstawę naszej potęgi."
 CSU_chanka_title: "Zwerbuj Chanków"
 CSU_chanka_desc: "Nasze niedawne zwycięstwo nad Chankami uczyniło z nich bezsilnych poddanych [Root.Monarch.GetTitle]. Jako nasi słudzy muszą zacząć płacić daninę pracy, obejmującą również służbę wojskową."
 CSU_chincha_title: "Zajmij ziemie Chincha"
 CSU_chincha_desc: "Dolina Chincha i jej okolice to miejsce najbliżej oceanu spośród ziem dostępnych z Cuzco. Zejdźmy z gór i narzućmy naszą wolę ludom wybrzeża."
 CSU_altiplano_title: "W dół Altiplano"
 CSU_altiplano_desc: "Na południowy zachód od Altiplano znajdują się nadmorskie doliny, które pozostają słabe i słabo zaludnione. Pokonajmy je, póki są osłabione i rozdrobnione."
 CSU_wanka_title: "Pokonaj Wanków"
 CSU_wanka_desc: "Andyjskie państewka, skłócone i podzielone, nie są w stanie przeciwstawić się naszej potężnej armii. Wyruszmy więc na północ. Najpierw pokonajmy Wanków."
 CSU_defeat_chimu_title: "Nasi rywale z Chimu"
 CSU_defeat_chimu_desc: "Chimu, zamieszkujący tereny częściowo nadmorskie, stworzyli dość zaawansowane społeczeństwo na północnym zachodzie. Podbijmy ich i usuńmy jedyną liczącą się siłę oporu w najbliższej okolicy."
 CSU_oracle_title: "Skontaktuj się z wyrocznią"
 CSU_oracle_desc: "Ichmowie uważają Pachacamaca za swojego stwórcę, który żyje i pomaga ludziom w postaci posągu pełniącego funkcję wyroczni. Być może powinniśmy się z nim skontaktować."
 CSU_authority_title: "Władza Słońca"
 CSU_authority_desc: "Władza [Root.Monarch.GetName], potomka starożytnego rodu, nie podlega dyskusji. Niektórzy jednak ośmielają się ją kwestionować i należy położyć temu kres."
 INC_runasimi_title: "Promowanie runasimi"
 INC_runasimi_desc: "Runasimi, czyli w języku keczua „mowa człowieka”, to nazwa języka Inków. Uważa się, że Inkowie przyjęli go jako imperialną lingua franca, ponieważ był rozpowszechniony jeszcze przed ich ekspansją. Wcześniej mieli podobno posługiwać się językiem ajmara lub innym miejscowym językiem."
 INC_mitma_title: "Rozwój systemu mitma"
 INC_mitma_desc: "Mitma to inkaska polityka przesiedlania różnych rdzennych grup ludności na terenie imperium. Stosowano ją zwykle wobec ludów niedawno podbitych lub zbuntowanych: część ich mieszkańców przenoszono do innych prowincji imperium, przede wszystkim ze względów gospodarczych i dla zapewnienia lojalności."
 INC_awka_kamayuq_title: "Awka Kamayuq"
 INC_awka_kamayuq_desc: "Większość armii Inków stanowili wojownicy powoływani do służby z różnych części imperium. Niektórzy musieli po prostu odpracować podatek w postaci służby wojskowej."
 INC_big_ears_title: "Wielkie Uszy"
 INC_big_ears_desc: "Najbardziej doświadczeni i zaprawieni w boju wojownicy armii Inków służyli jednak w oddziałach straży złożonych z arystokratów. Nazywano ich „Wielkimi Uszami” od zatyczek do uszu, które nosili na znak swojego statusu."
 INC_zeqe_title: "System zeq'e"
 INC_zeqe_desc: "Inkowie stworzyli rozbudowaną sieć świątyń poświęconych bogom, rozchodzącą się promieniście liniami z Cuzco. Sieć sanktuariów huaca zyskała nazwę systemu zeq'e."
 INC_pacha_kamaq_title: "Wyrocznia Pachacamaca"
 INC_pacha_kamaq_desc: "Ichmowie czczą własne bóstwo – Pachacamaca, Stwórcę Świata. Przedstawiający go posąg jest często wykorzystywany jako wyrocznia. Być może powinniśmy włączyć to bóstwo do naszego panteonu."
 INC_four_quarters_together_title: "Cztery Krainy Zjednoczone"
 INC_four_quarters_together_desc: "Inkowie nazywali swoje imperium „Tawantinsuyu”, co można w przybliżeniu przetłumaczyć jako „Cztery Zjednoczone Części”. Składało się ono z czterech prowincji: Qullasuyu, Antisuyu, Chinchaysuyu i Kuntisuyu, których centrum stanowiło samo Cuzco."
 INC_qollqas_title: "Qollqas"
 INC_qollqas_desc: "Inkaskie qollqa to magazyn położony przy jednej z dróg imperium. Przechowuje się w nim lokalne towary, zapasy i prowiant. Budynki te służą do składowania żywności na trudne czasy, narzędzi dla rzemieślników oraz wielu innych potrzebnych sprzętów."
 INC_kallanka_title: "Budowa nowych kallank"
 INC_kallanka_desc: "Kallanki to wielkie koszary wznoszone w pobliżu qollqas na potrzeby wojska. Pomimo ich rozmiarów i znaczenia armia Inków nadal musiała rozbijać wiele namiotów, aby pomieścić tysiące żołnierzy."
 INC_solar_cult_title: "Kult Słońca"
 INC_solar_cult_desc: "Inkowie czczą Intiego, boga Słońca, jako stwórcę i przodka dynastii królewskiej, od której wywodzą się cesarze. Z tego względu więź ze Słońcem zajmuje niezwykle ważne miejsce w religii Inków."
 INC_reform_religion_title: "Reforma religijna"
 INC_reform_religion_desc: "W naszej religii istnieje wiele osobliwych i niejasnych praktyk, które wymagają zmian. Powinniśmy wykorzystać boski autorytet, by je zreformować."
 INC_wiraqocha_title: "Świątynie Wirakoczy"
 INC_wiraqocha_desc: "Mimo znaczenia Intiego Wirakocza pozostaje najważniejszym bóstwem Inków. Wzniesiono wiele świątyń, w których oddaje mu się cześć."
 INC_imperial_infrastructure_title: "Infrastruktura imperialna"
 INC_imperial_infrastructure_desc: "Jeśli Inkowie w czymś celowali, była to infrastruktura imperialna. Rozległe drogi biegnące przez Andy w połączeniu ze sprawną administracją uczyniły to imperium bogatym i dobrze prosperującym."
 INC_qhapaq_nam_title: "Qhapaq Ñan"
 INC_qhapaq_nam_desc: "Qhapaq Ñan to Droga Królewska, która biegnie przez Andy od jednego krańca do drugiego. Wyposażona w magazyny i obsługiwana przez posłańców, tworzy niezwykle sprawną i dobrze utrzymaną sieć komunikacyjną."
 INC_imperial_frontiers_title: "Granice imperium"
 INC_imperial_frontiers_desc: "Nasze imperium rozciąga się na tysiące górskich szczytów i rozległe wyżyny. Góry zapewniają nam znaczne bezpieczeństwo, lecz nasza władza rzadko sięga na niziny, gdzie prowincje są trudne do obrony. Musimy umocnić nasze granice."
 INC_terracing_title: "Inkaskie tarasy uprawne"
 INC_terracing_desc: "Andy są z natury niegościnnym terenem. Strome zbocza utrudniają deszczowi nawadnianie upraw. Dlatego społeczności andyjskie od stuleci stosują metody zatrzymywania wody deszczowej i przekształcania stoków w żyzne pola."
 INC_idols_title: "Idole naszych poddanych"
 INC_idols_desc: "Społeczności andyjskie miały własne bóstwa regionalne, którym oddawały cześć w postaci posągów. Inkowie przejmowali te idole i sprowadzali je do Cuzco, zmuszając poddanych do podróży aż do stolicy, by mogli zasięgnąć rady swoich bogów. W razie niepokojów w prowincji lub oznak buntu publicznie chłostano posąg, aby wymusić posłuszeństwo."
 INC_mountaintops_title: "Wśród górskich szczytów"
 INC_mountaintops_desc: "Mimo jednego z najtrudniejszych klimatów znanych człowiekowi i wysokości, na których osoby nieprzyzwyczajone do takich warunków mogą mdleć, społeczności andyjskie zdołały przekuć te przeszkody w atut, wznosząc wspaniałe miasta pośród górskich szczytów Andów."
 INC_navel_of_the_universe_title: "Pępek świata"
 INC_navel_of_the_universe_desc: "[808.GetCapitalName] zyskało tak wielką sławę, że przylgnął do niego przydomek „Pępek świata”. Trudno nam nie zgodzić się z tym powszechnym przekonaniem."
 INC_awkaypata_title: "Haucaypata"
 INC_awkaypata_desc: "Haucaypata to nazwa głównego placu w Cuzco, gdzie skupiają się bogactwa i ważne budowle. Jest to wspólna przestrzeń mieszkańców miasta, w której odbywają się rozmaite święta i uroczystości religijne."
 INC_economy_title: "Zbierz mitę"
 INC_economy_desc: "Gospodarka Inków różniła się od gospodarek państw Starego Świata. Nie znano tam pojęcia monety — obywatele płacili podatki pracą, wytwarzając na rzecz państwa różne przedmioty lub służąc w armii."
 INC_sweat_of_the_sun_title: "Pot Słońca"
 INC_sweat_of_the_sun_desc: "Złoto było w Imperium Inków stosunkowo powszechne w porównaniu z europejskimi imperiami. Ponieważ Inkowie nie znali bicia monet, przetapiano je na złote posągi i biżuterię. Mimo to złoto pozostawało cenne — uważano je za dar bogów i nazywano „Potem Słońca”."
 INC_mountain_of_gold_title: "Łzy Księżyca"
 INC_mountain_of_gold_desc: "Srebro miało status zbliżony do złota, lecz uważano je za „Łzy Księżyca”. Było równie obfite, a Hiszpanie wydobyli jego ogromne ilości w Cerro Rico de Potosí."
 INC_renovate_cusco_title: "Przebuduj Cuzco"
 INC_renovate_cusco_desc: "Pachacuti przekształcił zagrożone niegdyś miasto Cuzco w potężną stolicę imperium. Miasto i jego okolice należy zatem przebudować tak, by odzwierciedlały jego nową pozycję."
 INC_secondary_capital_title: "Druga stolica"
 INC_secondary_capital_desc: "Skoro możliwości podbojów na południu zostały wyczerpane, a znaczna część tamtejszych ziem należy do naszych zmumifikowanych przodków, być może najlepiej będzie założyć drugą stolicę na północy."
 INC_weaving_title: "Tkactwo Inków"
 INC_weaving_desc: "Tradycyjne stroje andyjskie składają się z wełnianych tkanin wyrabianych przez najlepszych tkaczy. Najzdolniejsi rzemieślnicy muszą tkać dla szlachty w ramach podatku od pracy."
 INC_jungle_expansion_title: "Ekspansja w dżungli"
 INC_jungle_expansion_desc: "Tawantinsuyu wielokrotnie próbowało rozszerzyć swoje granice na zalesione i wilgotne ziemie wschodu, lecz z ograniczonym powodzeniem. Po podboju Inkowie najczęściej wymieniali się z miejscową ludnością egzotycznymi piórami i miodem."
 INC_bowmen_title: "Rekrutacja łuczników"
 INC_bowmen_desc: "Na wschodnich rubieżach dżungli Inkowie rekrutowali do swoich wojsk utalentowanych łuczników. Byli szczególnie skuteczni, ponieważ używali strzał z zatrutymi grotami, które okazywały się śmiertelnie niebezpieczne w bitwie."
 INC_lake_conquest: "Zabezpieczono północne Altiplano"
 CSU_adm_focus_buff: "Skupienie na integracji terytorialnej"
 desc_CSU_adm_focus_buff: "Postanowiliśmy skupić się na szybkim włączaniu nowych ziem do naszego imperium."
 CSU_dip_focus_buff: "Podbój przez zastraszenie"
 desc_CSU_dip_focus_buff: "Najlepszym sposobem na wygranie starcia zbrojnego jest uniknięcie walki. Wszystkie wojny należy wygrywać samym zastraszeniem i lukratywnymi ofertami."
 CSU_mil_focus_buff: "Zjednoczenie Czterech Krain"
 desc_CSU_mil_focus_buff: "Najlepszym sposobem na podbicie wszystkiego jest posiadanie armii, której nikt nie zdoła się przeciwstawić."
 INC_lingua_franca: "Imperialna lingua franca"
 desc_INC_lingua_franca: "Promowanie jednego języka – keczua – w całym imperium pomoże zachować jedność i umożliwi ludziom współpracę."
 INC_the_andean_empire: "Imperium Andyjskie"
 desc_INC_the_andean_empire: "Żadne inne państwo na Ziemi nie osiągnęło tego, co my: stworzyliśmy ogromne i potężne imperium rozciągające się przez jedno z najbardziej niegościnnych środowisk na świecie – szczyty Andów."
 INC_qumpi: "Inkaskie tkaniny qumpi"
 desc_INC_qumpi: "Tkaniny z wełny lam, wytwarzane przez naszych tkaczy, są naprawdę niezwykłe."
 INC_regional_shrine_worship: "Kult sanktuariów huaca"
 desc_INC_regional_shrine_worship: "Wokół naszych miast rozsianych jest wiele sanktuariów huaca, w których czci się najróżniejsze bóstwa."
 INC_the_mitma_for_control: "Lojalność dzięki mitma"
 desc_INC_the_mitma_for_control: "Polityka przesiedlania i mieszania społeczności pomaga utrzymać lojalność nowych prowincji, lecz dodatkowe koszty spowalniają ich pełną integrację."
 INC_mitma_settlers: "Osadnicy mitma"
 desc_INC_mitma_settlers: "Do lokalnej prowincji napłynęli osadnicy sprowadzeni tu w ramach mitma."
 INC_kallanka_construction: "Budowa kallanki"
 desc_INC_kallanka_construction: "Budowa kallanek w całym imperium zwiększa nasze rezerwy zasobów ludzkich."
 estate_burghers_mountain_expansion_upgrade_mountains: "Ekspansja w góry"
 desc_estate_burghers_mountain_expansion_upgrade_mountains: "Mieszczanie i chłopi tego kraju otrzymali od rządu środki, które pozwalają im zagospodarowywać trudne górskie tereny."
 estate_burghers_mountain_expansion_upgrade_highlands: "Ekspansja na wyżyny"
 desc_estate_burghers_mountain_expansion_upgrade_highlands: "Mieszczanie i chłopi tego kraju otrzymali od rządu środki, które pozwalają im zagospodarowywać trudne tereny wyżynne."
 estate_burghers_mountain_expansion_upgrade_hills: "Ekspansja na wzgórza"
 desc_estate_burghers_mountain_expansion_upgrade_hills: "Mieszczanie i chłopi tego kraju otrzymali od rządu środki, które pozwalają im zagospodarowywać trudne tereny pagórkowate."
 INC_inca_idol_making_alternative: "Wytwarzanie idoli"
 desc_INC_inca_idol_making_alternative: "Złoto ma dla nas wartość wyłącznie jako materiał na bogato zdobione posągi wykorzystywane w kulcie religijnym. Wymiana odbywa się poprzez handel wymienny i daninę pracy."
 INC_development_cost_penalty: "Przejście na niziny"
 desc_INC_development_cost_penalty: "W miarę jak rozszerzamy nasze państwo poza tereny górskie, musimy dostosować do tego nasz aparat administracyjny."
 INC_royal_roads: "Drogi królewskie"
 desc_INC_royal_roads: "Drogi królewskie przecinały cały kraj, zamieniając niedostępne górskie szlaki w prawdziwe trakty."
 INC_imperial_capital_1: "Stolica imperium"
 desc_INC_imperial_capital_1: "W tej prowincji znajduje się stolica prawdziwie wspaniałego imperium."
 INC_imperial_capital_2: "Stolica imperium"
 desc_INC_imperial_capital_2: "W tej prowincji znajduje się stolica prawdziwie wspaniałego imperium."
 INC_imperial_capital_1_2: "Zmodyfikuj „§YStolicę imperium§!” w następujący sposób:\n  Lokalny modyfikator zasobów ludzkich: §G+25.0%§!\n  Roczny dochód z podatków: §G+6.00§!\n  Lokalny modyfikator produkcji dóbr: §G+25.0%§!\n  Koszt zarządzania prowincją: §G-25.0%§!\n  Koszt zwiększenia limitu zarządzania prowincją: §G-35§!"
 INC_integrating_the_borderlands: "Integracja pogranicza"
 desc_INC_integrating_the_borderlands: "Nie jesteśmy przyzwyczajeni do surowego terenu dżungli, dlatego możemy jedynie mieć nadzieję na zintegrowanie pogranicza i nawiązanie wymiany z miejscową ludnością."
 INC_bowmen_from_the_jungle: "Pobór łuczników"
 desc_INC_bowmen_from_the_jungle: "W dżunglach żyje wiele społeczności wojowników, które bronią się za pomocą strzał z zatrutymi grotami. Możemy ich zwerbować."
 INC_secondary_capital_modifier: "Druga stolica"
 desc_INC_secondary_capital_modifier: "Aby umożliwić sobie ekspansję na północ, ustanówmy tam drugą stolicę."
 INC_conscripting_warriors: "Pobór wojowników"
 desc_INC_conscripting_warriors: "Potrzebujemy więcej ludzi, by wzmocnić naszą armię. Niech płacą podatek własną krwią!"
 INC_qumpicamayocs: "Tkacze qumpi"
 desc_INC_qumpicamayocs: "Zyskaliśmy wsparcie tkaczy wytwarzających doskonałe tkaniny, tradycyjnie zwane qumpi."
 INC_integrating_local_dieties: "Włączanie lokalnych bóstw"
 desc_INC_integrating_local_dieties: "Włączenie lokalnych bóstw pomoże zbudować spójne imperium, które nie ulegnie rozpadowi."
 INC_not_integrating_foreign_dieties: "Ograniczenie obcych wpływów"
 desc_INC_not_integrating_foreign_dieties: "Odmowa włączania obcych bóstw do naszego panteonu zapewni, że czcią będą otaczani wyłącznie ci, którzy na nią zasługują."
 INC_granaries: "Spichlerze"
 desc_INC_granaries: "W równych odstępach wzdłuż naszych dróg znajdują się magazyny ze spichlerzami, w których przechowujemy zapasy na trudne czasy, gdyby bogowie zesłali na nas nieszczęście."
 INC_incan_infrastructure_1: "Infrastruktura Inków"
 desc_INC_incan_infrastructure_1: "Naprawdę opanowaliśmy sztukę życia i budowania w górach, jednym z najbardziej niegościnnych terenów na Ziemi."
 INC_incan_infrastructure_2: "Infrastruktura Inków"
 desc_INC_incan_infrastructure_2: "Naprawdę opanowaliśmy sztukę życia i budowania w górach, jednym z najbardziej niegościnnych terenów na Ziemi."
 INC_incan_infrastructure_1_2: "Zmodyfikuj „§YInkańską infrastrukturę§!” w następujący sposób:\n  Można wznosić składy zaopatrzenia\n  Koszt budowy: §G-5.0%§!\n  Krajowy modyfikator limitu zaopatrzenia: §G+25.0%§!"
 INC_imperial_frontiers_modifier: "Umocnienia pograniczne"
 desc_INC_imperial_frontiers_modifier: "Ta prowincja leży na pograniczu i posiada kilka inkaskich fortyfikacji."
 INC_increased_productivity: "Zwiększona produktywność"
 desc_INC_increased_productivity: "Dobrobyt naszych tarasów uprawnych zapewnia urodzaj we wszystkich prowincjach."
 INC_central_plaza: "Rozbudowa głównego placu"
 desc_INC_central_plaza: "Główny plac Cuzco jest tętniącym życiem centrum miasta, gdzie odbywają się święta religijne i wznoszone są ogromne, monumentalne budowle rządowe."
 INC_central_plaza_no_dlc: "Rozbudowa głównego placu"
 desc_INC_central_plaza_no_dlc: "Główny plac Cuzco jest tętniącym życiem centrum miasta, gdzie odbywają się święta religijne i wznoszone są ogromne, monumentalne budowle rządowe."
 INC_authority: "Chwała Cuzco"
 desc_INC_authority: "Inkowie mają zdominować Andy. Taka jest wola bogów!"
 INC_hostage_idols: "Przetrzymywanie rodowych idoli jako zakładników"
 desc_INC_hostage_idols: "Pozostałe ludy lepiej niech będą nam posłuszne, bo ich bogowie zostaną wychłostani."
 CSU_solidifying_authority: "Umacnianie władzy"
 desc_CSU_solidifying_authority: "Musimy zadbać o to, by wszyscy byli posłuszni [Root.Monarch.GetTitle]. To Król Słońca!"
 INC_settling_the_south: "Zasiedlanie południa"
 desc_INC_settling_the_south: "Słabo zaludnione południe jest niemal puste i doskonale nadaje się pod nowe osady."
 INC_religious_reform: "Reformy rytualne"
 desc_INC_religious_reform: "Niektóre rytuały wymagają zmian, aby odpowiadały nowym potrzebom."
 INC_mountain_adaptations: "Przystosowanie do dużych wysokości"
 desc_INC_mountain_adaptations: "Przywykliśmy już do trudów życia na dużych wysokościach."
 INC_non_inca_modifier: "Przyjmowanie inkaskich obyczajów"
 desc_INC_non_inca_modifier: "Kształtujemy nową tożsamość jako wielkie imperium na andyjskich wyżynach."
 INC_gold_debuff: "Przetapianie złota na idole"
 desc_INC_gold_debuff: "Część dochodów ze złota z tej prowincji przeznaczono na wytwarzanie idoli religijnych."
 estate_burghers_INC_mountain_development: "Przystosowanie do życia na dużych wysokościach"
 estate_burghers_INC_mountain_development_desc: "Jesteśmy ludem nierozerwalnie związanym z Andami. Urodziliśmy się i dorastaliśmy pośród tych pięknych gór, dlatego naturalne jest, że dostosowujemy do nich politykę naszego państwa."
 estate_church_INC_idol_making: "Wytwarzanie idoli"
 estate_church_INC_idol_making_desc: "Złoto nie ma dla nas większej wartości. Zamiast tego poświęćmy je w całości na tworzenie posągów ku czci bogów."
 andean_empire_reform: "Imperium Andyjskie"
 andean_empire_reform_desc: "Władza Sapa Inki jest nierozerwalnie związana z wierzeniami religijnymi naszych poddanych. Autorytet monarchy stanowi podstawową zasadę ustroju państwa."
 INC_colonize_surroundings_title: "Wyprawa na ziemie plemienne"
 INC_colonize_surroundings_desc: "Za granicami naszego państwa rozciągają się słabo zaludnione ziemie, zamieszkane przez nieuporządkowane społeczności. Podporządkowanie ich powinno być łatwym i dochodowym przedsięwzięciem."
 INC_pachakuti: "Wstrząsający Ziemią"
 desc_INC_pachakuti: ""
 INC_tawantinsuyu: "Tawantinsuyu"
 merc_inc_big_ears: "§JStraż Pakoyoq§!"
 merc_inc_chanka: "Posiłki Czanków"
 estate_pakoyoq: "Pakoyoq"
 alter_the_records: "Zmiana kronik"
 alter_the_records_desc: "Inkowie mieli zupełnie inne podejście do historii niż to, do którego jesteśmy przyzwyczajeni. W społeczeństwie Inków przekaz ustny i inne zapisy były narzędziem – środkiem pozwalającym zmieniać przeszłość tak, by służyła ich celom. Wiele wydarzeń, które znamy z dziejów Inków, mogło nigdy nie mieć miejsca lub zostać znacznie wyolbrzymionych."
 reform_religion_button: "Reforma obrzędów"
 reform_religion_button_desc: "Inka jest nie tylko głową naszego państwa, lecz także boskim zwierzchnikiem naszej religii. Obrzędy religijne muszą być zatem nieustannie dostosowywane, aby zapewnić władcy pozycję i legitymizację, choć same reformy również napotykają sprzeciw."
 destroy_the_history: "Nowy początek historii"
 destroy_the_history_desc: "Przeinaczenie niektórych wydarzeń z przeszłości to jedno, lecz wymordowanie wszystkich kronikarzy znających dawne zapisy i zniszczenie samych kronik to zupełnie co innego. [Root.Monarch.GetName] zniszczy przeszłość i przedstawi się jako nowy Wstrząsający Ziemią – sam Pachacuti."
 flavor_inc.22.t: "Triumf nad Kollami"
 flavor_inc.22.d: "Pokonaliśmy naszych rywali z ludu Kolla, otwierając sobie drogę do Kotliny Titicaca. Miejscowi władcy są na naszej łasce. Ścięcie ich głów, obdarcie ze skóry i obwożenie ich ciał po ulicach [Root.Capital.GetCapitalName] mogłoby być dobitnym świadectwem potęgi [Root.Monarch.GetName] oraz ostrzeżeniem dla wszystkich potencjalnych wrogów, którzy odważyliby się stanąć nam na drodze."
 flavor_inc.22.a: "Zorganizujmy paradę w [Root.Capital.GetCapitalName]!"
 flavor_inc.22.b: "Skupmy się na integracji miejscowej ludności."
 flavor_inc.23.t: "Ewolucja systemu mitma"
 flavor_inc.23.d: "Jednym ze sposobów zapobiegania buntom jest przymusowe przesiedlanie rodzin naszego ludu z ich pierwotnych ziem na nowo podbite terytoria. Pozwoli nam to nie tylko zabezpieczyć lojalność nowych ziem, lecz także rozszerzyć na nie naszą kulturę, język i tradycje. Dzięki temu nowe prowincje przestaną być zarzewiem buntów, a my będziemy mogli utrzymać całą ludność pod kontrolą."
 flavor_inc.23.a: "Tak, wprowadźmy ten system."
 flavor_inc.23.b: "Nie jest nam potrzebny."
 flavor_inc.24.t: "Pachacamac i włączenie bóstw do panteonu"
 flavor_inc.24.d: "Podbiliśmy wyrocznię Pachacamac, otaczaną wielką czcią i kontrolowaną przez lud Ichma. Stoimy teraz przed przełomową decyzją, która ukształtuje naszą politykę na kolejne stulecia. Aby zintegrować miejscową ludność, możemy włączyć Pachacamaca, lokalne bóstwo-stwórcę, do naszego panteonu, a także przyjmować kolejne bóstwa, zmieniając przeszłość tak, by służyła teraźniejszości."
 flavor_inc.24.a: "Pachacamac istnieje i należy go czcić!"
 flavor_inc.24.b: "Pacha-co?"
 flavor_inc.25.t: "Los boskiej monarchii"
 flavor_inc.25.d: "[Root.Monarch.GetTitle] jest potomkiem Słońca i przedstawicielem rodu wywodzącego się od bogów. Przy tak wielkim autorytecie władzy [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] panowanie mogłyby zyskać nowe cele i znaczenie. Nadszedł czas, by zmienić dotychczasowy porządek na kolejne lata."
 flavor_inc.25.a: "Musimy szerzyć wiedzę o bogach."
 flavor_inc.25.b: "[Root.Monarch.GetTitle] oczyści ten świat z korupcji."
 flavor_inc.25.c: "Niech [Root.Monarch.GetName] rządzi żelazną ręką."
 flavor_inc.26.t: "Danina pracy"
 flavor_inc.26.d: "Inkowie nie posługują się pojęciem pieniądza ani mennicą, dlatego podatki na rzecz państwa są płacone w postaci określonej pracy. W zależności od lokalnej specjalizacji danina może przyjąć formę służby wojskowej, pracy na roli, tworzenia posągów wystawianych w Cuzco lub tkania tkanin dla możnowładców."
 flavor_inc.26.a: "Potrzebujemy więcej żołnierzy."
 flavor_inc.26.b: "Wspierajmy produkcję."
 flavor_inc.26.c: "Dla [Root.Monarch.GetTitle] potrzebujemy najlepszych tkanin."
 flavor_inc.27.t: "Mumifikacja zmarłych"
 flavor_inc.27.d: "Śmierć władcy oznacza, że nadszedł czas na jego mumifikację. Lodowaty uścisk śmierci ma go zamrozić i ukształtować na nowo. Jako mumia będzie nadal prowadził dotychczasowe życie w swoich posiadłościach, a słudzy będą wykonywać za niego wiele codziennych obowiązków. Będą za niego jeść, pić i podróżować. Zmarły Sapa Inka zachowuje również prawo do swoich dawnych posiadłości — chyba że ktoś postanowi wymazać go z historii."
 flavor_inc.27.a: "Śmierć jest jedynie przejściem."
 flavor_inc.28.t: "Reforma rytuałów"
 flavor_inc.28.d: "Mimo przeprowadzenia wielu reform mających wzmocnić władzę [Root.Monarch.GetTitle], zarówno rząd, jak i religia nieustannie się zmieniają, co wymaga kolejnych dostosowań. [Root.Monarch.GetName] uznał zatem za konieczne zreformowanie obrzędów religijnych, aby jeszcze bardziej umocnić [Root.Monarch.GetHerHis] autorytet. Zmiany te mogą jednak wywołać niepokoje i dać pretendentom okazję do obalenia [Root.Monarch.GetTitle]."
 flavor_inc.28.a: "Miejmy nadzieję, że będzie warto."
 flavor_inc.29.t: "Koniec historii"
 flavor_inc.29.d: "Tego dnia [Root.Monarch.GetTitle] [Root.Monarch.GetName] podjął najbardziej bezwzględne działania. Zgodnie z tradycją Inków [Root.Monarch.GetTitle] nakazał zniszczenie wielu zapisów kipu oraz zgładzenie nielicznych osób, które znały te zapisy i potrafiły je odczytać. W ten sposób wymazano znaczną część historii. Teraz [Root.Monarch.GetName] jest postrzegany jako Pachacuti — Ten, który wstrząsa ziemią — władca [Root.GetName], który dokonał przełomowej zmiany świata."
 flavor_inc.29.a: "Rzeczywistość może być taka, jaką zechcę."
