 flavor_boh.15.t: "Następstwa wojen husyckich"
 flavor_boh.15.d: "Choć wojny husyckie zakończyły się przed laty, ich dziedzictwo wciąż jest żywe w sercu naszego narodu. Niegdyś żyzne ziemie Korony Czeskiej noszą dziś blizny pożogi i zniszczenia, będące ponurym świadectwem zaciekłości tego konfliktu. Głód, który dawniej nie nawiedzał naszego dostatniego państwa, stał się częstym gościem i wyniszcza siły naszego ludu. Liczba mieszkańców, niegdyś tak wielka, drastycznie spadła, pozostawiając rozległe obszary ziem opuszczonych i jałowych.\n\nOd zakończenia wojny minęły lata, lecz jej dotkliwe skutki wciąż odczuwamy w każdym zakątku naszego kraju. Odbudowa postępuje powoli i boleśnie, nieustannie przypominając o spustoszeniu, jakie nas dotknęło. Pełne podniesienie się ze zniszczeń spowodowanych wojnami husyckimi zajmie dziesięciolecia, a być może nawet pokolenia."
 flavor_boh.15.a: "Powstaniemy z popiołów!"
 flavor_boh.16.t: "Dziedzictwo Wielkich Moraw"
 flavor_boh.16.d: "Dziedzictwo Wielkich Moraw, państwa Mojmíra, Rościsława i Świętopełka, nie zostało zapomniane. Wielkie Morawy, kolebka słowiańskiego chrześcijaństwa i miejsce narodzin naszego pierwszego pisma, odcisnęły niezatarte piętno na naszej historii. Ich spuścizna jest źródłem nadziei i inspiracją dla naszego ludu. Nadszedł czas, by ogłosić się ich prawowitymi dziedzicami — ponownie stworzyć rozległe państwo dorównujące chwałą Wielkim Morawom i poprowadzić ich dziedzictwo ku wspaniałej przyszłości. Upomnijmy się o to, co nam się należy: jesteśmy dziedzicami Wielkich Moraw, a ich duch wciąż w nas żyje."
 flavor_boh.16.a: "Niech żyją Wielkie Morawy!"
 flavor_boh.17.t: "Reformatio Sigismundi"
 flavor_boh.17.d: "Cesarz Zygmunt, niegdyś król Czech, planował przeprowadzenie wielkiej reformy Świętego Cesarstwa Rzymskiego. Choć poniósł porażkę, marzenie o zreformowanym Cesarstwie wciąż płonie w naszych sercach. Droga do realizacji tego wielkiego zamysłu pozostaje jednak niejasna, ponieważ nikt nie potrafi uzgodnić, jak dokładnie należy zreformować Cesarstwo. Nasza decyzja ukształtuje przyszłość nie tylko naszego państwa, lecz całego Cesarstwa."
 flavor_boh.17.a: "Musimy dążyć do zdominowania instytucji cesarskich."
 flavor_boh.17.b: "Naszym celem powinno być ściślejsze zjednoczenie kulturowe."
 flavor_boh.17.c: "Pozwólmy [Root.Monarch.GetName] czerpać korzyści z tych reform."
 flavor_boh.18.t: "Jan Rokycana"
 flavor_boh.18.d: "Jan Rokycana, jedna z najważniejszych postaci ruchu husyckiego, pełnił funkcję husyckiego arcybiskupa Pragi w okresie wielkich wstrząsów religijnych. Jego niezłomne oddanie sprawie husyckiej oraz wysiłki na rzecz pojednania umiarkowanych i radykalnych odłamów pozostawiły trwały ślad w historii Czech. Głęboka znajomość teologii i umiejętność prowadzenia sporów religijnych mogą okazać się nieocenione w szerzeniu naszej wiary. Wraz ze wzrostem jego wpływów możemy wykorzystać jego wiedzę dla dobra naszego królestwa. Czy powinniśmy powierzyć mu zadanie rozwijania teologii husyckiej, czy wykorzystać jego wpływy do wzmocnienia naszych działań misjonarskich?"
 flavor_boh.18.a: "Wesprzyjmy jego wysiłki teologiczne."
 flavor_boh.18.b: "Możemy wykorzystać go do wzmocnienia naszych działań misyjnych."
 flavor_boh.18.c: "Jest potrzebny gdzie indziej."
 flavor_boh.19.t: "Kilian Ignaz Dientzenhofer"
 flavor_boh.19.d: "Kilian Ignaz Dientzenhofer był jednym z najwybitniejszych architektów epoki baroku w Czechach. Jego arcydzieła na trwałe odmieniły krajobraz naszego królestwa. Wraz ze wzrostem jego sławy zyskaliśmy możliwość skorzystania z jego wiedzy dla dobra państwa. Czy powinniśmy zatrzymać go na dworze, czy wykorzystać jego wpływy, by wesprzeć nasze przedsięwzięcia architektoniczne?"
 flavor_boh.19.a: "Wykorzystajmy jego umiejętności!"
 flavor_boh.19.b: "Nie jesteśmy zainteresowani."
 flavor_boh.20.t: "Jan Amos Komenský"
 flavor_boh.20.d: "Jan Amos Komenský, biskup utrakwistyczny i orędownik powszechnej edukacji, znany jest jako „Nauczyciel Narodów”. Jego nowatorskie metody nauczania i wysiłki na rzecz reformy oświaty wywarły ogromny wpływ na nasze społeczeństwo. Wraz ze wzrostem uznania dla jego teorii edukacyjnych możemy wykorzystać jego wiedzę dla rozwoju królestwa. Czy powinniśmy powierzyć mu rolę doradcy, czy wykorzystać jego wpływy do ulepszenia naszego systemu oświaty?"
 flavor_boh.20.a: "Na dworze przydałby się jego talent."
 flavor_boh.20.b: "Niech pomoże zreformować naszą oświatę!"
 flavor_boh.21.t: "Jiří Melantrich z Aventina"
 flavor_boh.21.d: "Jiří Melantrich z Aventina odegrał ważną rolę w rozwoju czeskiej literatury. W epoce renesansu był wydawcą, drukarzem i tłumaczem. Jego wkład w rozwój języka czeskiego oraz starania o upowszechnienie literatury wywarły trwały wpływ na naszą kulturę. Wraz ze wzrostem jego znaczenia możemy wykorzystać jego wiedzę dla dobra królestwa. Czy zaoferować mu stanowisko doradcy, czy wykorzystać jego wpływy do wsparcia naszych działań na rzecz kultury?"
 flavor_boh.21.a: "Zaproponujmy mu stanowisko na dworze."
 flavor_boh.21.b: "Jego umiejętności przydadzą się gdzie indziej."
 capital_scuola_grande_tt: "Utworzono lokalną organizację §YScuola Grande§! w stolicy [Root.Capital.GetCapitalName]."
 112_gets_trade_upgrade_tt: "W [112.GetName] zostanie ulepszony budynek §Yhandlowy§!."
 complete_army_republic_to_preview_this_mission_tt: "Ukończ misję §YArmia Republiki§!, aby odblokować §Opodgląd gałęzi§! tych misji."
 ven_highest_dev_capital_tt: "Żadna prowincja w Europie Zachodniej nie ma większego rozwoju niż §Y[112.GetName]§!."
 mongols_manchuria_title: "Podbój Mandżurii"
 mongols_manchuria_desc: "Hordy Mandżurii są podzielone. Niegdyś przysięgały nam wierność, lecz postanowiły nas opuścić. Podbijmy je i przywróćmy pod władzę Imperium Mongolskiego."
 mongols_korea_title: "Koniec królestwa pustelników"
 mongols_korea_desc: "Möngke-chan zmusił Koreańczyków do podporządkowania się władzy Mongołów. Od tamtej pory przestali się nam kłaniać i trzeba im przypomnieć, kto jest ich prawdziwym panem."
 mongols_japan_title: "Położenie kresu Boskiemu Wiatrowi"
 mongols_japan_desc: "Jedną z najbardziej znanych klęsk w naszej historii wojskowości jest porażka zadana nam przez Boski Wiatr Japonii. Cała flota i całe armie zostały unicestwione, choć Japończycy nie musieli nawet kiwnąć palcem — burze niszczyły każdy okręt, który ośmielił się dokonać inwazji. Lecz choć wiatr ten jest boski, my jesteśmy Mongołami i podbijemy nawet najpotężniejsze burze."
 mongols_heart_of_persia_title: "Serce Persji"
 mongols_heart_of_persia_desc: "Gdy Mongołowie wkroczyli do Persji, niszczyli wszystko na swojej drodze, pogrążając region w chaosie. Teraz, gdy powracamy jako prawowici władcy Persji, możemy zjednoczyć ziemie, które sami niegdyś rozbiliśmy."
 mongols_into_egypt_title: "Do Egiptu"
 mongols_into_egypt_desc: "Gdy ostatnim razem próbowaliśmy najechać Egipt, nowo powstały sułtanat Mameluków zdołał odeprzeć nasze ataki. Nie zapomnieliśmy tej porażki. Musimy ponownie najechać ten region."
 mongols_tumu_crisis_title: "Kryzys pod Tumu"
 mongols_tumu_crisis_desc: "Dynastia Ming jest słaba i stanowi łatwy cel inwazji. Musimy zgromadzić nasze armie i pokonać ją na polu bitwy, zanim zdąży odpowiednio przygotować swoje siły."
 mongols_dragons_gate_title: "Otwarcie Smoczej Bramy"
 mongols_dragons_gate_desc: "Wielki Mur Chiński strzeże Smoka zasiadającego na tronie w [EmperorOfChina.Capital.GetCapitalName]. Gdy doprowadzimy do jego upadku, będziemy mogli wkroczyć do Chin i sprowadzić zagładę na imperium, które nam się przeciwstawiło."
 mongols_northern_china_title: "Oblężenie Pekinu"
 mongols_northern_china_desc: "Choć Wielki Mur upadł, Chińczycy wciąż stawiają nam opór. Przygotujmy się do szturmu na Pekin, zdobywając dla naszej ordy ich północne terytoria."
 mongols_dragon_throne_title: "Na Smoczym Tronie"
 mongols_dragon_throne_desc: "Wraz z upadkiem Pekinu i południowych Chin Smoczy Tron należy teraz do nas. Wreszcie możemy ogłosić się nowymi cesarzami Chin."
 mongols_into_iran_title: "Do Iranu"
 mongols_into_iran_desc: "W sercu Bliskiego Wschodu leży Iran — górzysta kraina pełna cywilizacji. Cywilizacji, którą zamierzamy podbić. Ponownie ruszmy konno na Bliski Wschód i dokonajmy podboju."
 mongols_restoration_of_ilkhanate_title: "Przywrócenie Ilchanatu"
 mongols_restoration_of_ilkhanate_desc: "Nadszedł czas podbić Persję, tak jak uczynił to niegdyś nasz wielki przodek. Kto jednak będzie nią rządził po zwycięstwie?"
 mongols_anatolia_conquest_title: "Sułtanat Rum"
 mongols_anatolia_conquest_desc: "Musimy kontynuować kampanię na zachód, wyprawiając się do Syrii i Anatolii. Nie możemy pozwolić, by Turcy sprzeciwiali się naszej władzy!"
 mongols_ruthenia_title: "Najazd na Ruś"
 mongols_ruthenia_desc: "Kiedyś armie Czyngis-chana zniszczyły Ruś. Kijów został złupiony i spalony, zamieniając wielkie miasto w popiół w przeciągu jednej nocy. Nadszedł czas, aby Tatarzy powrócili na żyzne ziemie Dniepru."
 mongols_southern_china_title: "Kres Czerwonym Turbanom"
 mongols_southern_china_desc: "Zostaliśmy wypędzeni z Chin przez zbuntowanych Mingów i straciliśmy Mandat Niebios. Musimy odrodzić imperium Kubilaj-chana i odzyskać mandat!"
 mongols_revenge_against_timur_title: "Zemsta na Timurze"
 mongols_revenge_against_timur_desc: "Timur spustoszył w przeszłości znaczne obszary ziem mongolskich i tatarskich. Teraz jego imperium stoi na krawędzi rozpadu. Wykorzystajmy tę okazję i zniszczmy państwo, które stworzył."
 mongols_invasion_of_india_title: "Upadek Hindustanu"
 mongols_invasion_of_india_desc: "Przeprawa przez pasmo Sulejmana stanowi dla naszych ord ogromne wyzwanie. Ponadto bogactwo Indii nie interesowało w przeszłości Wielkiego Chana, który skupiał się bardziej na potędze niż na złocie. Zrobimy to, czego on nie uczynił – najeziemy Indie."
 mongols_caucasia_title: "Przekrocz Kaukaz"
 mongols_caucasia_desc: "Góry Kaukazu stanowiły naturalną granicę dla wielu wielkich imperiów, jednakże nie zaakceptujemy żadnych ograniczeń naszej ekspansji. Podbijemy mieszkańców gór i udamy się do bogatych ziem położonych za nimi."
 mongols_fall_of_ryazan_title: "Upadek Riazania"
 mongols_fall_of_ryazan_desc: "Księstwo Riazania nie postrzega już spadkobierców Czyngis-chana jako swoich władców. Należy odświeżyć im pamięć nie tylko przez ogień i miecz, ale także przez szybką ekspansję naszego narodu."
 mongols_pax_mongolica_mission_title: "Pax Mongolica"
 mongols_pax_mongolica_mission_desc: "Mówi się, że za panowania dawnych wielkich chanów kobieta mogła przejść z jednego krańca imperium na drugi ze sztabką złota na głowie i nie obawiać się żadnego niebezpieczeństwa. Przywrócimy ten pokój na wszystkich naszych ziemiach."
 mongols_one_true_khan_title: "Jeden prawdziwy chan"
 mongols_one_true_khan_desc: "Musimy odtworzyć chanat mongolski w dawnej stolicy, Karakorum. Stamtąd zwołamy kurułtaj i zażądamy, by wszystkie plemiona uznały naszą władzę."
 mongols_nizhy_novgorod_title: "Zdobycie [306.GetName]"
 mongols_nizhy_novgorod_desc: "Twierdza [306.GetName] jest prawdopodobnie największą przeszkodą na drodze do łupieżczych wypraw w pozostałe części Rosji. Zdobądźmy ją siłą."
 mongols_carpathia_title: "Powrót do Karpat"
 mongols_carpathia_desc: "Najdalszy zasięg podbojów Wielkiego Chana zatrzymał się na Węgrzech. Choć ich władca zginął, a kraj został spustoszony, nasze siły były nadmiernie rozciągnięte, co zmusiło nas do odwrotu na Ruś. Teraz powróciliśmy i zamierzamy pozostać."
 mongols_unification_of_mongol_land_title: "Zjednoczenie Mongolii"
 mongols_unification_of_mongol_land_desc: "Za czasów Czyngis-chana lud mongolski został zjednoczony pod władzą jednej ordy i jednego władcy. Musimy zgromadzić zwolenników ze wszystkich plemion i przywrócić wspólną mongolską tożsamość."
 mongols_march_into_central_asia_title: "Marsz do Azji Środkowej"
 mongols_march_into_central_asia_desc: "W Środkowej Azji nie może pozostać żaden chan, który może kwestionować naszą władzę. Nasza dominacja nad regionem musi być absolutna."
 mongols_russian_yoke_title: "Zaciśnij jarzmo"
 mongols_russian_yoke_desc: "Naiwni rosyjscy książęta wierzą, że jesteśmy reliktem przeszłości i już dawno przestali składać nam hołd. Zburzymy ich miasta, weźmiemy ich żony oraz spalimy ich pola, aby przypomnieć im, kto rządzi stepami."
 moghulistan_kazakhs_title: "Lud Kazachów"
 moghulistan_kazakhs_desc: "Musimy przeć coraz bardziej ku stepom. Kazachowie muszą dołączyć do naszej ordy, podczas naszego marszu na wschód."
 moghulistan_persia_title: "Serce Persji"
 moghulistan_persia_desc: "Gdy Mongołowie wkroczyli do Persji, niszczyli wszystko na swojej drodze, pogrążając region w chaosie. Teraz, gdy powracamy jako prawowici władcy Persji, możemy zjednoczyć ziemie, które sami niegdyś rozbiliśmy."
 moghulistan_into_egypt_title: "Do Egiptu"
 moghulistan_into_egypt_desc: "Gdy ostatnim razem próbowaliśmy najechać Egipt, nowo powstały sułtanat Mameluków zdołał odeprzeć nasze ataki. Nie zapomnieliśmy tej porażki. Musimy ponownie najechać ten region."
 moghulistan_tatars_conquest_title: "Dziedzictwo Złotej Ordy"
 moghulistan_tatars_conquest_desc: "Ulug Ulus, czyli „Wielkie Państwo”, to nazwa nadana Złotej Ordzie. Państwo to jednak upadło i rozpadło się na wiele plemion tatarskich, które pragną przejąć jego dziedzictwo. To my przywrócimy tę złotą spuściznę."
 moghulistan_golden_horde_title: "Zjednocz Ulug Ulus"
 moghulistan_golden_horde_desc: "Zamiast pozwolić Tatarom zjednoczyć państwo, które sami rozbili, powinniśmy dokonać tego sami. Być może później powierzymy Tatarom zarządzanie tymi ziemiami."
 moghulistan_ryazan_title: "Upadek Riazania"
 moghulistan_ryazan_desc: "Księstwo Riazania nie postrzega już spadkobierców Czyngis-chana jako swoich władców. Należy odświeżyć im pamięć nie tylko przez ogień i miecz, ale także przez szybką ekspansję naszego narodu."
 moghulistan_at_the_centre_of_asia_title: "W centrum Azji"
 moghulistan_at_the_centre_of_asia_desc: "W Azji Środkowej nie może pozostać żaden chan, który mógłby rzucić wyzwanie naszej władzy. Nasza dominacja nad tym regionem musi być absolutna."
 moghulistan_revenge_against_timur_title: "Zemsta na Timurze"
 moghulistan_revenge_against_timur_desc: "Timur w przeszłości spustoszył znaczną część ziem mongolskich i tatarskich. Teraz jego imperium stoi na skraju rozpadu. Wykorzystajmy nadarzającą się okazję i zniszczmy stworzone przez niego państwo."
 moghulistan_into_iran_title: "Do Iranu"
 moghulistan_into_iran_desc: "W sercu Bliskiego Wschodu leży Iran — górzysta kraina pełna cywilizacji. Cywilizacji, którą zamierzamy podbić. Ponownie ruszmy konno na Bliski Wschód i dokonajmy podboju."
 moghulistan_ilkhanate_title: "Przywrócenie Ilchanatu"
 moghulistan_ilkhanate_desc: "Nadszedł czas, aby podbić Persję, tak jak dawno temu zrobił to nasz wielki przodek. Ale kto będzie nią rządził, gdy bitwa zostanie wygrana?"
 moghulistan_anatolia_title: "Sułtanat Rum"
 moghulistan_anatolia_desc: "Musimy kontynuować kampanię na zachód, wyprawiając się do Syrii i Anatolii. Nie możemy pozwolić, by Turcy sprzeciwiali się naszej władzy!"
 moghulistan_nizhny_novgorod_title: "Zdobycie [306.GetName]"
 moghulistan_nizhny_novgorod_desc: "Twierdza [306.GetName] jest prawdopodobnie największą przeszkodą na drodze do łupieżczych wypraw w pozostałe części Rosji. Zdobądźmy ją siłą."
 moghulistan_russia_title: "Przywrócenie jarzma"
 moghulistan_russia_desc: "Ruś sprzeciwiła się nam, gdy po raz pierwszy zażądaliśmy jej posłuszeństwa. Miejmy nadzieję, że zrozumiała nauczkę po spustoszeniu, jakie sprowadziliśmy na jej ziemie. W przeciwnym razie będziemy zmuszeni ponownie użyć przemocy, jaką pamiętamy z przeszłości."
 moghulistan_unification_of_chagatai_title: "Zjednoczenie Czaghataju"
 moghulistan_unification_of_chagatai_desc: "Czaghataj został podzielony między państwa Moghulistanu. Nie możemy pozwolić, by ten podział trwał. Zjednoczmy te ziemie i oddajmy cześć państwu chana Czaghataja."
 moghulistan_india_title: "Upadek Hindustanu"
 moghulistan_india_desc: "Przeprawa przez pasmo Sulejmana stanowi dla naszych ord ogromne wyzwanie. Ponadto bogactwo Indii nie interesowało w przeszłości Wielkiego Chana, który skupiał się bardziej na potędze niż na złocie. Zrobimy to, czego on nie uczynił – najeziemy Indie."
 moghulistan_southern_china_title: "Kres Czerwonym Turbanom"
 moghulistan_southern_china_desc: "Zostaliśmy wyparci z Chin przez zbuntowaną dynastię Ming i utraciliśmy Mandat Niebios. Musimy odbudować imperium Kubilaj-chana i odzyskać Mandat!"
 moghulistan_tatar_yoke_title: "Zacieśnienie jarzma"
 moghulistan_tatar_yoke_desc: "Naiwni rosyjscy książęta wierzą, że jesteśmy reliktem przeszłości i już dawno przestali składać nam hołd. Zburzymy ich miasta, weźmiemy ich żony oraz spalimy ich pola, aby przypomnieć im, kto rządzi stepami."
 moghulistan_raid_ruthenia_title: "Najazd na Ruś"
 moghulistan_raid_ruthenia_desc: "Jakiś czas temu armie Czyngis-chana spustoszyły Ruś. Kijów został złupiony i spalony, a wielka potęga w ciągu jednej nocy obróciła się w popiół. Nadszedł czas, by Tatarzy powrócili na żyzne ziemie nad Dnieprem."
 moghulistan_pax_mongolica_title: "Pax Mongolica"
 moghulistan_pax_mongolica_desc: "Mówi się, że za panowania dawnych wielkich chanów kobieta mogła przejść z jednego krańca imperium na drugi ze sztabką złota na głowie i nie obawiać się żadnego niebezpieczeństwa. Przywrócimy ten pokój na wszystkich naszych ziemiach."
 moghulistan_secure_trade_posts_title: "Zabezpiecz miasta handlowe"
 moghulistan_secure_trade_posts_desc: "Azję Środkową można nazwać skrzyżowaniem szlaków między Chinami, Europą Wschodnią i Persją. Z tego powodu wielu kupców założyło na tych ziemiach ośrodki handlowe. Zajmijmy je i przejmijmy zgromadzone w nich bogactwa."
 moghulistan_control_over_northern_yuan_title: "Przejmij kontrolę nad północnym Yuanem"
 moghulistan_control_over_northern_yuan_desc: "Pozostałości dynastii Yuan znalazły się pod naszą kontrolą. Musimy teraz zabezpieczyć ziemie Mongolii — krainę, w której dynastia Yuan przetrwała po rebelii Czerwonych Turbanów."
 moghulistan_dragons_gate_title: "Otwarcie Smoczej Bramy"
 moghulistan_dragons_gate_desc: "Wielki Mur Chiński strzeże Smoka zasiadającego na tronie w Pekinie. Gdy doprowadzimy do jego upadku, będziemy mogli wkroczyć do Chin i sprowadzić zagładę na imperium, które nam się przeciwstawiło."
 moghulistan_northern_china_title: "Przejmij kontrolę nad Pekinem"
 moghulistan_northern_china_desc: "Choć Wielki Mur upadł, Chińczycy wciąż stawiają nam opór. Zdobądźmy Pekin i pozostałe północne terytoria dla naszej ordy."
 moghulistan_dragon_throne_title: "Na Smoczym Tronie"
 moghulistan_dragon_throne_desc: "Wraz z upadkiem Pekinu i południowych Chin Smoczy Tron należy teraz do nas. Wreszcie możemy ogłosić się nowymi cesarzami Chin."
 moghulistan_carpathia_title: "Powrót do Kotliny Karpackiej"
 moghulistan_carpathia_desc: "Najdalszy zasięg podbojów Wielkiego Chana zatrzymał się na Węgrzech. Choć tamtejszy władca zginął, a kraj został spustoszony, nadmierne rozciągnięcie naszych sił zmusiło nas do odwrotu na Ruś. Teraz powróciliśmy i zamierzamy pozostać na tych ziemiach."
 moghulistan_contact_with_mongols_title: "Pozostałości dynastii Yuan"
 moghulistan_contact_with_mongols_desc: "Dynastia Yuan upadła, a jej pozostałości znajdują się na ziemiach Mongołów. Musimy zabezpieczyć wszystko, co z niej zostało, jeśli mamy zostać koronowani na prawowitych władców Chin."
 moghulistan_manchuria_title: "Podbój Mandżurii"
 moghulistan_manchuria_desc: "Hordy Mandżurii są podzielone. Niegdyś przysięgały nam wierność, lecz postanowiły nas opuścić. Podbijmy je i przywróćmy pod władzę Imperium Mongolskiego."
 moghulistan_korea_title: "Koniec królestwa pustelników"
 moghulistan_korea_desc: "Möngke-chan zmusił Koreańczyków do podporządkowania się władzy Mongołów. Od tamtej pory przestali się nam kłaniać i trzeba im przypomnieć, kto jest ich prawdziwym panem."
 moghulistan_japan_title: "Położenie kresu Boskiemu Wiatrowi"
 moghulistan_japan_desc: "Jedną z najbardziej znanych klęsk w naszej historii wojskowości jest porażka zadana nam przez Boski Wiatr Japonii. Cała flota i całe armie zostały unicestwione, choć Japończycy nie musieli nawet kiwnąć palcem — burze niszczyły każdy okręt, który ośmielił się dokonać inwazji. Lecz choć wiatr ten jest boski, my jesteśmy Mongołami i podbijemy nawet najpotężniejsze burze."
 moghulistan_land_raids_title: "Zintensyfikuj najazdy lądowe"
 moghulistan_land_raids_desc: "Liczne plemiona koczownicze w naszym państwie od zawsze wyruszały na łupieżcze wyprawy i podboje w pogoni za bogactwem. Pomóżmy im w tych działaniach."
 mongols_kazakhs_title: "Lud Kazachów"
 mongols_kazakhs_desc: "Musimy nieustannie posuwać się w głąb stepu. Kazachowie muszą dołączyć do naszej ordy, gdy będziemy maszerować na zachód."
 mongols_tatars_conquest_title: "Złote dziedzictwo"
 mongols_tatars_conquest_desc: "Ulug Ulus, czyli „Wielkie Państwo”, to nazwa nadana Złotej Ordzie. Państwo to jednak upadło i rozpadło się na liczne plemiona tatarskie, które pragną przejąć jego dziedzictwo. To my przywrócimy tę złotą spuściznę."
 mongols_unify_golden_horde_title: "Zjednoczenie Ulug Ulus"
 mongols_unify_golden_horde_desc: "Zamiast pozostawiać Tatarom zjednoczenie państwa, które sami rozbili, powinniśmy przejąć inicjatywę i zjednoczyć te ziemie. Być może nawet powierzymy Tatarom zarządzanie nimi."
 mongols_restoration_of_the_yoke_title: "Przywrócenie jarzma"
 mongols_restoration_of_the_yoke_desc: "Ruś sprzeciwiła się nam, gdy po raz pierwszy zażądaliśmy jej posłuszeństwa. Miejmy nadzieję, że zrozumiała nauczkę po spustoszeniu, jakie sprowadziliśmy na jej ziemie. W przeciwnym razie będziemy zmuszeni ponownie użyć przemocy, jaką pamiętamy z przeszłości."
 MOGHULISTAN_MODIFY_RETURN_OF_THE_MONGOLS_1: "Modyfikuje efekt „§YPowrót Mongołów§!” o:\n   Roczna jedność ordy: §G+0,50§!\n   Szybkość ruchu: §G+10,0%§!"
 MOGHULISTAN_MODIFY_RETURN_OF_THE_MONGOLS_2: "Modyfikuje efekt „§YPowrót Mongołów§!” o:\n   Czas podróży posłów: §G-10,0%§!"
 HORDES_CREATE_PAX_MONGOLICA_MODIFIER_MOGHULISTAN: "Łączy modyfikatory „§YJak Smok§!” i „§YPowrót Mongołów§!” w modyfikator „§YPax Mongolica§!”, a następnie dodatkowo go ulepsza:\n   Czas podróży posłów: §G-10,0%§!\n   Limit administracyjny: §G+100§!"
 MOGHULISTAN_MODIFY_GUARANTEED_LEADERSHIP_OF_HOST: "Przywilej plemion §YZagwarantowane przywództwo w ordzie§! nie będzie już wymagał §Ytradycji wojskowej§!."
 MOGHULISTAN_OF_GOLD_PROVINCE_OWNED: "Jeśli prowincja §Y[2121.GetName]§! należy do nas lub naszego poddanego:"
 MOGHULISTAN_ORGANIZER_GRANTS_RAZE_GAIN: "Doradca §YOrganizator armii§! będzie teraz zapewniać §G+5,00%§! dostępnych łupów za każdy poziom."
 HORDES_RELEASE_GOLDEN_HORDE: "Uwolnimy państwo §Y[GLH.GetName]§! jako nasze §Ymongolskie państwo braterskie§! w regionach §YR osji§!, §YStepów Pontyjskich§! i §YUralu§!."
 MONGOLS_CAPTURED_EMPEROR: "Pojmano w bitwie §Ycesarza Chin§!."
 MONGOLS_IF_CAPTURED_EMPEROR: "Jeśli pojmaliśmy w bitwie §Ycesarza Chin§!:"
 MONGOLS_EXECUTE_EMPEROR: "Zaprzyjaźnimy się z §Ycesarzem Chin§!, zastępując modyfikator §YPojmany cesarz§! modyfikatorem §YPrawowite roszczenia do Chin§!. Zmiana efektów:\n   Morale armii: §R-20,0%§!\n   Zdolność oblężnicza: §R-10,0%§!\n   Koszt tworzenia rdzeni: §G-10,0%§!\n   Koszt prowincji w punktach zwycięstwa: §G-10,0%§!"
 MONGOLS_MODIFY_RETURN_OF_THE_MONGOLS_1: "Modyfikuje efekt „§YPowrót Mongołów§!” o:\n   Limit administracyjny: §G+100§!"
 MONGOLS_MODIFY_RETURN_OF_THE_MONGOLS_2: "Modyfikuje efekt „§YPowrót Mongołów§!” o:\n   Koszt prowincji w punktach zwycięstwa: §G-10,0%§!\n   Szybkość łupienia: §G+30,0%§!\n   Dostępne łupy: §G+30,0%§!"
 HORDES_CREATE_PAX_MONGOLICA_MODIFIER_MONGOLS: "Łączy modyfikatory „§YKhan nad chanami§!” i „§YPowrót Mongołów§!” w modyfikator „§YPax Mongolica§!”, a następnie dodatkowo go ulepsza:\n   Czas podróży posłów: §G-10,0%§!\n   Limit administracyjny: §G+100§!"
 MOGHULISTAN_OWNS_ALL_KAZAKH_PROVINCES: "My lub którykolwiek z naszych nieskładających trybutu poddanych posiadamy wszystkie prowincje kultury §Ykazachskiej§! w regionie §YAzji Środkowej§!."
 CHAGATAI: "Czagataj"
 CHAGATAI_ADJ: "Czagatajski"
 tatars_fall_of_ryazan_title: "Upadek Riazania"
 tatars_fall_of_ryazan_desc: "Księstwo Riazańskie przestało uznawać potomków Czyngis-chana za swoich zwierzchników. Musimy przypomnieć im o naszej potędze nie tylko ogniem i mieczem, lecz także poprzez szybki rozwój naszego państwa."
 tatars_strengthen_raids_title: "Zintensyfikuj najazdy lądowe"
 tatars_strengthen_raids_desc: "Liczne plemiona koczownicze w naszym państwie od zawsze wyruszały na łupieżcze wyprawy i podboje w pogoni za bogactwem. Pomóżmy im w tych działaniach."
 tatars_caucasia_title: "Przekrocz Kaukaz"
 tatars_caucasia_desc: "Góry Kaukazu wyznaczały naturalne granice wielu wielkim imperiom, lecz my nie uznajemy żadnych ograniczeń naszej ekspansji. Podporządkujemy sobie mieszkańców gór i ruszymy ku bogatym ziemiom po drugiej stronie."
 tatars_heart_of_persia_title: "Serce Persji"
 tatars_heart_of_persia_desc: "Gdy Mongołowie wkroczyli do Persji, niszczyli wszystko na swojej drodze, pogrążając region w chaosie. Teraz, gdy powracamy jako prawowici władcy Persji, możemy zjednoczyć ziemie, które sami niegdyś rozbiliśmy."
 tatars_into_egypt_title: "Do Egiptu"
 tatars_into_egypt_desc: "Gdy ostatnim razem próbowaliśmy najechać Egipt, nowo powstały sułtanat Mameluków zdołał odeprzeć nasze ataki. Nie zapomnieliśmy tej porażki. Musimy ponownie najechać ten region."
 tatars_strengthen_tribal_wargames_title: "Promuj plemienne gry wojenne"
 tatars_strengthen_tribal_wargames_desc: "Aby utrzymać nasze armie w dobrej kondycji, musimy podtrzymywać w nich ducha walki. Gdy nie prowadzimy wojny, sami musimy ją wywołać — na zewnątrz lub wewnątrz państwa. W tym celu powinniśmy szerzej zachęcać nasze społeczeństwo do udziału w organizowanych przez nas grach wojennych."
 tatars_religious_question_title: "Kwestie religijne"
 tatars_religious_question_desc: "Możemy być ordą, lecz nawet orda ma oficjalną religię. Jeśli nie chcemy pogrążyć się w zgubie, musimy zająć się sprawami wiary."
 tatars_branching1_title: "Misja z rozgałęzieniem"
 tatars_branching1_desc: "To misja rozgałęziająca się. Jej warunki i efekty zależą od naszego wyboru w misji „Kwestie religijne”."
 tatars_branching2_title: "Misja z rozgałęzieniem"
 tatars_branching2_desc: "To misja rozgałęziająca się. Jej warunki i efekty zależą od naszego wyboru w misji „Kwestie religijne”."
 tatars_russian_yoke_title: "Zaciśnij tatarskie jarzmo"
 tatars_russian_yoke_desc: "Rosyjscy książęta głupio uznali, że jesteśmy reliktem przeszłości, i od dawna przestali płacić nam daninę. Spustoszymy ich miasta, zabierzemy ich żony i spalimy pola, aby przypomnieć im, kto włada Stepem."
 tatars_meddling_in_muscovite_civil_war_title: "Mieszanie się w wojnę domową w Moskwie"
 tatars_meddling_in_muscovite_civil_war_desc: "Wraz z trwaniem wojny domowej w państwie moskiewskim pojawiło się wiele okazji. Jeśli zdołamy wpłynąć na jej przebieg zgodnie z naszymi zamiarami, będziemy mogli jeszcze skuteczniej pociągać za sznurki na moskiewskim dworze."
 tatars_restoration_of_the_yoke_title: "Koniec rosyjskiej suwerenności"
 tatars_restoration_of_the_yoke_desc: "Ruś sprzeciwiła się nam, gdy po raz pierwszy zażądaliśmy jej posłuszeństwa. Miejmy nadzieję, że zrozumiała nauczkę po spustoszeniu, jakie sprowadziliśmy na jej ziemie. W przeciwnym razie będziemy zmuszeni ponownie użyć przemocy, jaką pamiętamy z przeszłości."
 tatars_return_in_carpathia_title: "Powrót do Karpat"
 tatars_return_in_carpathia_desc: "Najdalszy zasięg podbojów Wielkiego Chana zatrzymał się na Węgrzech. Choć ich władca zginął, a kraj został spustoszony, nasze siły były nadmiernie rozciągnięte, co zmusiło nas do odwrotu na Ruś. Teraz powróciliśmy i zamierzamy pozostać."
 tatars_into_iran_title: "W głąb Iranu"
 tatars_into_iran_desc: "W sercu Bliskiego Wschodu leży Iran – górzysta kraina pełna cywilizacji. Cywilizacji, którą zamierzamy podbić. Ponownie ruszmy konno na Bliski Wschód i podporządkujmy go sobie."
 tatars_restoration_of_ilkhanate_title: "Przywrócenie Ilchanatu"
 tatars_restoration_of_ilkhanate_desc: "Nadszedł czas podbić Persję, tak jak uczynił to niegdyś nasz wielki przodek. Kto jednak będzie nią rządził po zwycięstwie?"
 tatars_anatolia_title: "Sułtanat Rum"
 tatars_anatolia_desc: "Musimy kontynuować kampanię na zachód, wyprawiając się do Syrii i Anatolii. Nie możemy pozwolić, by Turcy sprzeciwiali się naszej władzy!"
 tatars_japan_title: "Koniec Boskiego Wiatru"
 tatars_japan_desc: "Jedną z najbardziej znanych klęsk w naszej historii wojskowości jest porażka zadana nam przez Boski Wiatr Japonii. Cała flota i całe armie zostały unicestwione, choć Japończycy nie musieli nawet kiwnąć palcem – burze niszczyły wszystkie okręty, które ośmieliły się najechać ich wyspy. Ten wiatr może być boski, lecz jesteśmy Mongołami i podbijemy nawet najpotężniejszą z burz."
 tatars_tribal_allegiance_title: "Zażądaj wierności"
 tatars_tribal_allegiance_desc: "Możemy być związkiem wielu plemion, lecz często nie przestrzegają one naszych praw i szukają chwały wyłącznie dla siebie. Przypomnienie im, kim jest [Root.Monarch.GetTitle], uświadomi zbuntowanym poddanym konsekwencje nieposłuszeństwa."
 tatars_managing_tribes_title: "Zarządzanie plemionami"
 tatars_managing_tribes_desc: "[Root.Monarch.GetTitle] powinien sprawować władzę absolutną. Żaden przywódca plemienny nie może podważać naszego autorytetu, gdyż dążenie do zostania największym z chanów wymaga zdobycia najsilniejszej pozycji w państwie."
 tatars_religious_unity_title: "Jedność wiary"
 tatars_religious_unity_desc: "Niezależnie od tego, czy przyjmiemy nową wiarę, czy umocnimy nasze pradawne tradycje, lud mongolski musi osiągnąć jedność religijną."
 tatars_seizing_nizhny_novgorod_title: "Zdobądź [306.GetName]"
 tatars_seizing_nizhny_novgorod_desc: "Twierdza [306.GetName] jest prawdopodobnie największą przeszkodą na drodze do najazdów na pozostałe ziemie Rusi. Zdobądźmy ją siłą."
 tatars_raid_ruthenia_title: "Najazd na Ruś"
 tatars_raid_ruthenia_desc: "Niegdyś armie Czyngis-chana spustoszyły Ruś. Kijów został złupiony i spalony, a wielka potęga w ciągu jednej nocy obróciła się w popiół. Nadszedł czas, by Tatarzy powrócili na żyzne ziemie Dniepru."
 tatars_revenge_against_timur_title: "Zemsta na Timurze"
 tatars_revenge_against_timur_desc: "Timur w przeszłości spustoszył znaczną część ziem mongolskich i tatarskich. Teraz jego imperium stoi na skraju rozpadu. Wykorzystajmy nadarzającą się okazję i zniszczmy stworzone przez niego państwo."
 tatars_invasion_of_india_title: "Upadek Hindustanu"
 tatars_invasion_of_india_desc: "Przeprawa przez pasmo Sulejmana jest trudnym zadaniem dla naszych hord. Ponadto bogactwa Indii nie interesowały niegdyś Wielkiego Chana, który bardziej niż złoto cenił potęgę. Zrobimy to, czego on nie uczynił — najeździemy Indie."
 tatars_korea_title: "Koniec królestwa pustelników"
 tatars_korea_desc: "Möngke-chan zmusił Koreańczyków do podporządkowania się władzy Mongołów. Od tamtej pory przestali się nam kłaniać i trzeba im przypomnieć, kto jest ich prawdziwym panem."
 tatars_pax_mongolica_title: "Pax Mongolica"
 tatars_pax_mongolica_desc: "Mówi się, że za panowania wielkich chanów kobieta mogła przejść z jednego krańca imperium na drugi, niosąc na głowie bryłkę złota, i nie obawiać się żadnego niebezpieczeństwa. Przywrócimy ten pokój na wszystkich naszych ziemiach."
 tatars_enable_nobility_title: "Plemienna szlachta"
 tatars_enable_nobility_desc: "Słuchanie głosów przywódców plemiennych nie przyniosło nam wielu korzyści. Być może, jeśli zorganizujemy wpływowe osoby w naszym państwie w stan szlachecki, tak jak czynią to inne kraje, będziemy mogli skuteczniej zaspokajać potrzeby narodu."
 tatars_any_child_can_be_khan_title: "Każde dziecko może zostać chanem!"
 tatars_any_child_can_be_khan_desc: "Dlaczego władzę mieliby dziedziczyć wyłącznie dorośli? Jeśli dziecko okaże się wielkim wojownikiem lub przywódcą, powinno móc ogłosić się chanem. Zamiast dopuszczać do władzy skorumpowanych lub niekompetentnych watażków, powinniśmy dążyć do tego, by każdy mógł zostać chanem, niezależnie od wieku."
 tatars_raiding_hosts_title: "Oddziały łupieżcze"
 tatars_raiding_hosts_desc: "Nasz naród musi najeżdżać bardziej cywilizowane państwa, aby gromadzić bogactwa i zachować jedność. Zorganizujmy więcej takich wypraw i sprowadźmy więcej łupów naszym plemionom."
 tatars_great_khan_title: "Dziedzictwo Wielkiego Chana"
 tatars_great_khan_desc: "Temudżin od dawna nie żyje, lecz jego następcy wciąż trwają. To na nas spoczywa obowiązek podjęcia dziedzictwa i stworzenia największego imperium, jakie widział świat."
 tatars_southern_steppes_title: "Stepy południa"
 tatars_southern_steppes_desc: "Ziemie Krymu są podzielone między kilka państw, lecz prawowicie należą do dziedziców Czyngis-chana."
 tatars_unify_golden_horde_title: "Zjednoczenie wielkiego państwa"
 tatars_unify_golden_horde_desc: "Od upadku Złotej Ordy lud tatarski pozostaje podzielony. Jeśli potęga Tatarów ma kiedykolwiek odrodzić się na nowo, musimy zjednoczyć wszystkich chanów pod naszym panowaniem."
 tatars_march_into_central_asia_title: "Marsz do Azji Środkowej"
 tatars_march_into_central_asia_desc: "W Azji Środkowej nie może pozostać żaden chan, który mógłby rzucić wyzwanie naszej władzy. Nasza dominacja nad tym regionem musi być całkowita."
 tatars_control_over_northern_yuan_title: "Opanowanie północnego Yuan"
 tatars_control_over_northern_yuan_desc: "Zabezpieczyliśmy pozostałości dynastii Yuan. Teraz musimy opanować Mongolię – ziemię, w której dynastia Yuan przetrwała po powstaniu Czerwonych Turbanów."
 tatars_dragons_gate_title: "Otwarcie Smoczej Bramy"
 tatars_dragons_gate_desc: "Wielki Mur Chiński strzeże Smoka zasiadającego na tronie w Pekinie. Gdy doprowadzimy do jego upadku, będziemy mogli wkroczyć do Chin i sprowadzić zagładę na imperium, które ośmieliło się nam przeciwstawić."
 tatars_control_over_the_north_title: "Opanowanie Pekinu"
 tatars_control_over_the_north_desc: "Choć Wielki Mur upadł, Chińczycy wciąż stawiają nam opór. Szturmujmy Pekin i pozostałe północne ziemie, by zdobyć je dla ordy."
 tatars_the_dragon_throne_title: "Na Smoczym Tronie"
 tatars_the_dragon_throne_desc: "Wraz z upadkiem Pekinu i południowych Chin Smoczy Tron należy już do nas. Wreszcie możemy ogłosić się nowymi cesarzami Chin."
 tatars_strengthen_basqaq_governors_title: "Wzmocnienie basqaków"
 tatars_strengthen_basqaq_governors_desc: "Basqakowie byli urzędnikami wykonawczymi imperium mongolskiego, odpowiedzialnymi za utrzymywanie porządku i pobór podatków. Działali w zdecentralizowanym systemie administracji, pełniąc również funkcje wojskowe i dbając o przestrzeganie mongolskiej władzy na rozległych terytoriach."
 tatars_buff_tributaries_title: "Schylone głowy, ugięte kolana"
 tatars_buff_tributaries_desc: "Wiele państw zostało naszymi wasalami lub płaci trybut, by uniknąć najazdu. Dowodzi to, że Mongołowie byli przeznaczeni do panowania nad światem."
 tatars_expansion_of_silk_road_title: "Rozbudowa Jedwabnego Szlaku"
 tatars_expansion_of_silk_road_desc: "Dzięki naszej władzy w Chinach i Persji możemy przywrócić Jedwabnemu Szlakowi dawny dobrobyt. Zakładając wzdłuż niego kolejne ośrodki handlowe i chroniąc go przed rabusiami, którzy mogliby zakłócić wymianę, zapewnimy sobie znaczne zyski."
 tatars_successors_of_the_golden_horde_title: "Następcy Ulug Ulus"
 tatars_successors_of_the_golden_horde_desc: "Ulug Ulus, czyli „Wielkie Państwo”, to nazwa nadana Złotej Ordzie. Państwo to jednak upadło i rozpadło się na liczne plemiona tatarskie, które pragną przejąć jego dziedzictwo. To my przywrócimy tę złotą spuściznę."
 tatars_consolidate_urals_title: "Konsolidacja Uralu"
 tatars_consolidate_urals_desc: "Ziemie Uralu nie nadają się zbytnio do życia dla ordy, lecz zamieszkuje je wielu Tatarów, a region ten stanowił niegdyś integralną część Złotej Ordy. Podbijmy tę krainę lasów i śniegu."
 tatars_kazakhs_title: "Lud Kazachów"
 tatars_kazakhs_desc: "Musimy nieustannie posuwać się w głąb stepu. Kazachowie muszą dołączyć do naszej ordy, gdy będziemy maszerować na wschód."
 tatars_contact_with_oirat_title: "Pozostałości dynastii Yuan"
 tatars_contact_with_oirat_desc: "Dynastia Yuan już nie istnieje. Jej pozostałości znajdują się na ziemiach Mongołów. Musimy zabezpieczyć wszystko, co z niej zostało, jeśli chcemy zostać koronowani na prawowitych władców Chin."
 tatars_manchuria_title: "Podbój Mandżurii"
 tatars_manchuria_desc: "Ordy Mandżurii są podzielone. Niegdyś przysięgały nam wierność, lecz postanowiły nas opuścić. Podbijmy je i przywróćmy do imperium mongolskiego."
 tatars_southern_china_title: "Kres Czerwonym Turbanom"
 tatars_southern_china_desc: "Zostaliśmy wyparci z Chin przez zbuntowaną dynastię Ming i utraciliśmy Mandat Niebios. Musimy odbudować imperium Kubilaj-chana i odzyskać Mandat!"
 tatars_gathering_the_tribute_title: "Zbieranie trybutu"
 tatars_gathering_the_tribute_desc: "Zamiast bezpośrednio opodatkowywać ludność, powinniśmy skupić się na tym, co od zawsze robiliśmy z tymi, którzy przed nami klękali — pobieraniu daniny."
 tatars_new_trade_routes_title: "Utwórz nowe szlaki handlowe"
 tatars_new_trade_routes_desc: "Ordy nie słyną z handlu, lecz Mongołowie od dawna dbali o dobrobyt kupców działających w granicach ich imperium. W połączeniu z zyskami, jakie może nam to przynieść, zachęca to wielu pomniejszych przywódców plemiennych do ochrony karawan."
 tatars_intercontinental_trade_title: "Handel międzykontynentalny"
 tatars_intercontinental_trade_desc: "Zamiast wysyłać statki z jednego kontynentu na drugi lub pobierać liczne opłaty, zanim karawana dotrze do celu, wprowadzimy system pozwalający karawanom swobodnie przemieszczać się między najdalszymi zakątkami imperium."
 tatars_tolerance1_title: "[Root.GetPreviewColorHORDES]Ludzie zasług[Root.GetPreviewColorHORDES_end]"
 tatars_tolerance1_desc: "Nie oceniamy człowieka na podstawie jego przekonań, lecz jego zdolności do służenia nam. W naszym państwie jest wielu takich ludzi, dlatego powinniśmy przyznawać im stanowiska stosownie do ich zasług."
 tatars_tolerance2_title: "[Root.GetPreviewColorHORDES]Państwo wielu wyznań[Root.GetPreviewColorHORDES_end]"
 tatars_tolerance2_desc: "Zamiast rządzić poprzez religię, powinniśmy oprzeć władzę na wspólnym prawie. Nasze państwo jest tyglem wielu wyznań, więc zamiast je ograniczać, dostosujmy prawa tak, by uwzględniały wartości każdego z nich."
 tatars_devout1_title: "[Root.GetPreviewColorHORDES]Wiara stepów[Root.GetPreviewColorHORDES_end]"
 tatars_devout1_desc: "Jeśli chcemy udowodnić poddanym, że zasługujemy na tytuł Wielkiego Chana, musimy również zdecydować, jaką wiarę wyznajemy. Nie szkodzi, jeśli część plemion początkowo nie pójdzie za nami — podporządkujemy je sobie i zmusimy do posłuszeństwa."
 tatars_devout2_title: "[Root.GetPreviewColorHORDES]Za Ordę![Root.GetPreviewColorHORDES_end]"
 tatars_devout2_desc: "Jako Wielki Chan musimy być wzorem dla naszego ludu nie tylko na polu bitwy, lecz także w sprawach religii. [Root.Monarch.GetName] będzie szerzyć wiarę [Root.Religion.GetName] tak daleko, jak tylko zdoła."
 tatars_confucian1_title: "[Root.GetPreviewColorHORDES]Nauki Konfucjusza[Root.GetPreviewColorHORDES_end]"
 tatars_confucian1_desc: "Zamiast ograniczać jakąkolwiek religię, powinniśmy obrać drogę harmonii. Współistnienie — tego uczą nas nauki Konfucjusza. Pokój i zgoda między wyznawcami różnych religii."
 tatars_confucian2_title: "[Root.GetPreviewColorHORDES]Wieczna harmonia[Root.GetPreviewColorHORDES_end]"
 tatars_confucian2_desc: "W naszym imperium współistnieje wiele religii, dlatego musimy jeszcze bardziej wzmocnić wysiłki na rzecz wewnętrznego pokoju — pokoju, który przyniesie naszemu państwu wieczną harmonię."
 TATARS_IF_WE_HAVE_TATAR_YOKE_PROVINCE: "Jeśli jedna z naszych prowincji posiada modyfikator prowincji §YJarzmo tatarskie§!:"
 TATARS_GRANT_UPGRADED_TATAR_YOKE: "Modyfikator prowincji §YJarzmo tatarskie§! będzie teraz zapewniać §G+1§! punkt mocy monarszej z trybutu."
 TATARS_UNLOCK_RUS_MONUMENTS: "Wszystkie rosyjskie §YWielkie Projekty§! będą dla nas dostępne."
 TATARS_CREATE_RUSSIAN_TRIBUTARIES: "Przywrócimy §YJarzmo tatarskie§!, uwalniając w Rosji liczne wyjątkowe §Yrosyjskie państwa trybutarne§!."
 TATARS_RAIZED_20_PROVINCES: "Złupiono co najmniej §Y20§! prowincji (§Y[Root.HordeProvincesRazed.GetValue]/20§!)."
