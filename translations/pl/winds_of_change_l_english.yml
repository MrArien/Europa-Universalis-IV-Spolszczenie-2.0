 TIM_pearl_of_khorasan_no_dlc: "Perła Chorosanu"
 desc_TIM_pearl_of_khorasan_no_dlc: "Położenie Heratu, wielkiego miasta w samym sercu surowego Chor asanu, przyniosło mu przydomek, który doskonale oddaje jego znaczenie."
 TIM_a_pious_ruler: "Pobożny władca"
 desc_TIM_a_pious_ruler: "Sułtani imperium Timurydów ostatecznie porzucą dawne prawa Jasy."
 TIM_approval_of_governors: "Poparcie namiestników"
 desc_TIM_approval_of_governors: "Sułtan darzy gubernatorów większym zaufaniem niż podległych im ulemów."
 TIM_centralization_reforms: "Reformy centralizacyjne"
 desc_TIM_centralization_reforms: "Próby centralizacji położyły kres władzy mongolskiego prawa Jasy."
 TIM_army_reorganization: "Reorganizacja armii"
 desc_TIM_army_reorganization: "Zmodernizowaliśmy naszą armię, odchodząc od przestarzałej organizacji ustanowionej za panowania Timura."
 TIM_fresh_recruits: "Świeży rekruci"
 desc_TIM_fresh_recruits: "Aby wesprzeć nasze dalsze kampanie, postanowiliśmy zwerbować więcej ludzi spośród poddanych i wzmocnić nasze armie."
 TIM_gunpowder_empire: "Imperium prochowe"
 desc_TIM_gunpowder_empire: "Opanowaliśmy sztukę używania artylerii i osiągnęliśmy wielką biegłość w posługiwaniu się różnorodną bronią palną, dzięki czemu możemy stawić czoła naszym wrogom."
 TIM_horsemen_of_apocalypse_modifier: "Jeźdźcy Apokalipsy"
 desc_TIM_horsemen_of_apocalypse_modifier: "Niewielu potrafi wytrzymać szarżę naszej jazdy – większość łamie szyki i ucieka. Ci, którzy nie zdołają umknąć, szybko giną."
 TIM_western_markets: "Rynki zachodnie"
 desc_TIM_western_markets: "Z powodu rywalizacji niewiele dzieje się na zachodzie, lecz nadal staramy się utrzymać dominację na tamtejszych rynkach."
 TIM_external_benefits: "Korzyści zewnętrzne"
 desc_TIM_external_benefits: "Priorytetem jest dla nas ekspansja wzdłuż Jedwabnego Szlaku, aby dzięki dotychczasowym wpływom utrzymać jak największą dominację."
 TIM_internal_benefits: "Korzyści wewnętrzne"
 desc_TIM_internal_benefits: "Wykorzystamy zgromadzone bogactwo, by stale wzmacniać nasze państwo."
 TIM_plunder_economy: "Gospodarka łupieżcza"
 TIM_plunder_economy_desc: "Nasi możni otrzymują część łupów zdobytych podczas wypraw wojennych, w których uczestniczą. Choć jesteśmy bardziej scentralizowani niż większość plemion, możemy utrzymać władzę dzięki tej nietypowej arystokracji, gotowej podążać za potężnym władcą w zamian za udział w zdobyczach."
 timurid_diwan_reform: "Timurydzki Diwan"
 timurid_diwan_reform_desc: "Nasza administracja, Diwan, dzieli się na dwie izby: Diwan-i Mal, kontrolowaną głównie przez miejscowych irańskich dostojników, oraz Diwan-i Lashgar, czyli gałąź wojskową, pozostającą przede wszystkim w rękach tureckich generałów."
 TIM_will_be_necessary_to_form_persia: "Aby utworzyć @PER §Y[PER.GetName]§!, konieczna jest zmiana kultury na grupę kultur §Yirańskich§!."
 TIM_until_persia: "do czasu utworzenia §YPersji§!"
 TIM_gulf_toll: "Cło zatokowe"
 TIM_eastern_frontier_protection: "Ochrona wschodniej granicy"
 TIM_hegemony_over_the_crescent: "Hegemonia nad Żyznym Półksiężycem"
 estate_burghers_TIM_gulf_toll: "Wprowadzenie opłat w Zatoce"
 estate_burghers_TIM_gulf_toll_desc: "Aby mocniej kontrolować handel w Zatoce Perskiej, należy wprowadzić opłaty. Choć stoi to w sprzeczności z wolnym handlem, którego tak usilnie pragnie stan [Root.GetBurghersName], przyniesie naszej gospodarce znaczne korzyści."
 estate_nobles_TIM_appease_the_elites: "Udobruchanie elit"
 estate_nobles_TIM_appease_the_elites_desc: "Nadanie rozległych przywilejów tureckim elitom pozwoli nam jeszcze bardziej sprofesjonalizować armię, lecz może się to wiązać z przekazaniem im zbyt wielkiej władzy."
 estate_church_TIM_yasa_supremacy: "Zwierzchnictwo Jasy"
 estate_church_TIM_yasa_supremacy_desc: "Wiele tradycji i zasad społecznych w naszym państwie nie podlega szariatowi, lecz mongolskiemu prawu Jasy, odziedziczonemu po założycielach imperium."
 estate_nobles_TIM_soyurghal_grants: "Nadania sojurgalowe"
 estate_nobles_TIM_soyurghal_grants_desc: "Liczne nadania ziemskie, zwane sojurgalami, znacznie ograniczyły niezależność fiskalną państwa i wyniosły tureckie elity wojskowe do ogromnej potęgi."
 estate_nobles_TIM_chagatai_warriors: "Wojownicy czagatajscy"
 estate_nobles_TIM_chagatai_warriors_desc: "Dalsze wzmacnianie pozycji tureckich wojowników w naszej armii z pewnością utrwali obecny porządek, a zarazem zwiększy naszą siłę militarną."
 estate_church_TIM_promote_ijazah: "Wspieranie idżazy"
 estate_church_TIM_promote_ijazah_desc: "Gwarantując, że nie będziemy utrudniać dalszego rozwoju stanów duchownych, możemy zapewnić nieprzerwane szerzenie wiedzy."
 TIM_tomb_of_ansari: "Grobowiec Ansariego"
 desc_TIM_tomb_of_ansari: "W tej prowincji znajduje się grobowiec Abdullaha Ansariego z Heratu, wybitnego sufiego z XI wieku, otaczanego wielką czcią."
 TIM_ulugh_beg_observatory_modifier: "Obserwatorium Uług Bega"
 desc_TIM_ulugh_beg_observatory_modifier: "W tej prowincji znajduje się obserwatorium ufundowane przez namiestnika Transoksanii, Ulugh Bega. Przyczyni się ono do poszerzenia naszej wiedzy o niebie."
 soyurghal_subject_type: "Sojurgal"
 soyurghal_subject_type_long_desc: "Sojurgal to długoterminowe nadanie ziemskie przyznawane generałowi. Sojurgale podążają za swoim suwerenem na wojnę i mają obowiązek wspierać jego wysiłek wojenny."
 soyurghal_subject_type_is_our: "$NAME|Y$ jest naszym sojurgalem."
