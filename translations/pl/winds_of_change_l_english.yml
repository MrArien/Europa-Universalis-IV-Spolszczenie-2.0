 flavor_ormoma.1.t: "Nasze posiadłości w Farsie"
 flavor_ormoma.1.d: "Gdy ludność Farsu została wreszcie podporządkowana, nadszedł czas, by zrobić to, co zawsze wychodziło nam najlepiej — przygotować się do pokoju. Dalsza rozbudowa portów w Zatoce Perskiej może pomóc nam całkowicie zabezpieczyć ten akwen, lecz prowincje w głębi lądu kryją wiele zasobów naturalnych, które możemy wykorzystać."
 flavor_ormoma.1.a: "Skupmy się na rozwoju obszarów nadbrzeżnych."
 flavor_ormoma.1.b: "Skupmy się na rozwoju terenów w głębi lądu."
 flavor_ormoma.2.t: "Wzmocnienie naszych kupców"
 flavor_ormoma.2.d: "Kupcy w naszym państwie od zawsze byli podzieleni pod względem interesów i ideologii. Niektórzy chcą podążać tradycyjną drogą i zabezpieczać handel poprzez zakup ziem oraz aktywów za granicą. Inni wolą budować floty kupieckie i masowo kupować oraz sprzedawać towary. Pozostali są zadowoleni z obecnego sposobu prowadzenia handlu i pragną jedynie wykorzystywać swoje wpływy do wspierania naszych działań dyplomatycznych."
 flavor_ormoma.2.a: "Bezpośrednie wsparcie naszych zamorskich kupców będzie najlepszym rozwiązaniem."
 flavor_ormoma.2.b: "Większa flota kupiecka pomoże nam zdominować handel zamorski."
 flavor_ormoma.2.c: "Handel jest jedynie przedłużeniem dyplomacji."
 flavor_ormoma.3.t: "Sułtani Zanzibaru"
 flavor_ormoma.3.d: "Po upadku miasta Kilwa [Root.GetName] przejęło kontrolę nad regionem Zanzibaru. Miejscowa ludność podporządkowała się naszym rządom. Pozostało nam już tylko ogłosić się sułtanami Zanzibaru."
 flavor_ormoma.3.a: "Odtąd będziemy władcami zarówno Omanu, jak i Zanzibaru."
 flavor_ormoma.4.t: "Miasto Maskat"
 flavor_ormoma.4.d: "Maskat jest prawdopodobnie najważniejszym portem Omanu. Od zawsze rywalizował z Ormuzem i w przeszłości cieszył się wielkim dobrobytem. Z czasem jego znaczenie jednak niemal całkowicie zanikło. Możemy odbudować ten niegdyś wspaniały arabski port albo skupić się na samym Ormuzie."
 flavor_ormoma.4.a: "Ormuz jest lepszym portem."
 flavor_ormoma.4.b: "Przywrócimy Maskatowi jeszcze większą świetność."
 flavor_ormoma.5.t: "Kompania Dalekiego Wschodu"
 flavor_ormoma.5.d: "Wielu arabskich kupców opuściło swoje domy, by sprzedawać towary w obcych krajach. Ziemie Chin, pełne egzotycznych bogactw, są teraz usiane naszymi kupcami, którzy pragną kupować i sprzedawać towary w tym rozległym państwie. Nazwali siebie „Kompanią Dalekiego Wschodu” i zdobyli już wpływy w Chinach."
 flavor_ormoma.5.a: "Nasi kupcy dotrą do nowych portów!"
 orm_protected_trading_outposts: "Umocnienia placówek handlowych"
 desc_orm_protected_trading_outposts: "Nowe porty i nadbrzeżne fortyfikacje znacznie zwiększyły znaczenie tej placówki w regionie."
 orm_protected_trading_outposts_buffed: "Rozbudowa umocnień placówek handlowych"
 desc_orm_protected_trading_outposts_buffed: "Nowe porty i nadbrzeżne fortyfikacje znacznie zwiększyły znaczenie tej placówki w regionie."
 orm_strengthened_merchant_influence: "Wzmocnienie wpływów zamorskich kupców"
 desc_orm_strengthened_merchant_influence: "Nasi kupcy otrzymali niezbędne wsparcie, by skuteczniej konkurować z zagranicznymi handlarzami."
 orm_omani_threat_pacified: "Ograniczenie wpływów Omanu"
 desc_orm_omani_threat_pacified: "Mieszkańcy Omanu nie stanowią już zagrożenia dla naszego państwa."
 orm_subduing_arabian_tribes: "Wierność plemion"
 desc_orm_subduing_arabian_tribes: "Plemiona Arabii przysięgły nam wierność."
 orm_exploiting_the_gems_of_arabia: "Eksploatacja arabskich klejnotów"
 desc_orm_exploiting_the_gems_of_arabia: "Klejnoty z [Root.GetName] są doskonałym towarem handlowym, który możemy wymieniać z innymi państwami. Wykorzystamy więc ten potencjał."
 orm_permanent_power_projection: "Dominacja regionalna"
 orm_conquest_of_yemen: "Podbój Jemenu"
 desc_orm_conquest_of_yemen: "Jemen znalazł się już w naszych rękach. Świętujmy to zwycięstwo."
 orm_reclamantion_of_persian_lands: "Odzyskanie ziem perskich"
 desc_orm_reclamantion_of_persian_lands: "Nadbrzeżne obszary Persji zostały wreszcie odzyskane."
 orm_bam_citadel: "Cytadela Bam"
 desc_orm_bam_citadel: "Twierdza Bam została silnie ufortyfikowana, aby zabezpieczyć nasze nowe podboje w Persji."
 orm_end_of_the_timurids: "Koniec panowania Timurydów"
 desc_orm_end_of_the_timurids: "Imperium timurydzkie wreszcie upadło, pokonane przez nas. Pokażmy światu, że to my doprowadziliśmy do jego końca."
 orm_beyond_arabic_ports: "Poza arabskimi portami"
 desc_orm_beyond_arabic_ports: "Aby zabezpieczyć zamorskie szlaki handlowe, musimy najpierw uzyskać odpowiedni zasięg."
 orm_propogation_of_the_islamic_faith: "Szerzenie wiary islamskiej"
 desc_orm_propogation_of_the_islamic_faith: "Będziemy szerzyć wiarę islamską w każdym porcie, do którego dotrzemy."
 orm_far_east_company: "Kompania Dalekiego Wschodu"
 desc_orm_far_east_company: "Wielu naszych kupców połączyło siły, tworząc Kompanię Dalekiego Wschodu, której celem jest wykorzystanie szlaków handlowych Azji Wschodniej."
 orm_arabian_indian_ocean_supremacy: "Kompania Dalekiego Wschodu"
 desc_orm_arabian_indian_ocean_supremacy: "Wielu naszych kupców połączyło siły, tworząc Kompanię Dalekiego Wschodu, której celem jest wykorzystanie szlaków handlowych Azji Wschodniej."
 orm_arabian_indian_ocean_supremacy_no_dlc: "Kompania Dalekiego Wschodu"
 desc_orm_arabian_indian_ocean_supremacy_no_dlc: "Wielu naszych kupców połączyło siły, tworząc Kompanię Dalekiego Wschodu, której celem jest wykorzystanie szlaków handlowych Azji Wschodniej."
 orm_wiped_out_ibadi_sect: "Wytępienie odłamu ibadyckiego"
 desc_orm_wiped_out_ibadi_sect: "Wiara ibadycka została wreszcie zdławiona na naszych ziemiach. Możemy teraz skierować wzrok na dalszą ekspansję."
 orm_ibadi_convert: "Szerzenie odłamu ibadyckiego"
 desc_orm_ibadi_convert: "Nasze niedawne przejście na ibadyzm sprawiło, że wielu religijnych wygnańców napłynęło do naszego państwa, pragnąc szerzyć swoje nauki wśród naszego ludu."
 orm_hormuz_merchants_influence: "Wpływy arabskich kupców"
 desc_orm_hormuz_merchants_influence: "Prowincja została nawrócona przez arabskich kupców, co dodatkowo zwiększyło jej zdolność do przynoszenia zysków."
 orm_religious_culture_buff: "Kultura religijna"
 oma_constructing_omani_fleet: "Budowa floty omańskiej"
 desc_oma_constructing_omani_fleet: "Jeśli chcemy dotrzeć do nowych wybrzeży, przede wszystkim musimy przygotować potężną flotę."
 oma_zanzibar_ivory_trade: "Handel kością słoniową na Zanzibarze"
 desc_oma_zanzibar_ivory_trade: "Handel kością słoniową na Zanzibarze okazał się niezwykle korzystny dla naszego skarbca."
 oma_development_of_masqat_port: "Rozbudowa portu w Maskacie"
 desc_oma_development_of_masqat_port: "Maskat został wyznaczony na nasz główny port w Arabii. Dopilnujemy więc, by rozwijał się i osiągnął nowy poziom świetności."
 oma_nizwa_fort_modifier: "Fort Nizwa"
 desc_oma_nizwa_fort_modifier: "Fort Nizwa ochroni nasze omańskie ziemie w głębi lądu przed każdym potencjalnym najeźdźcą."
 oma_omani_marines: "Omańska piechota morska"
 desc_oma_omani_marines: "Nasi marynarze należą do najbardziej doświadczonych w Arabii. Zamiast przeznaczać wszystkich do obsługi okrętów, możemy część z nich wykorzystać do utworzenia piechoty morskiej, która pomoże nam przeprowadzać liczne desanty."
 oma_strengthen_omani_marines: "Wzmocnienie omańskiej piechoty morskiej"
 desc_oma_strengthen_omani_marines: "Dzięki wzmocnieniu piechoty morskiej nasi marynarze zdobyli większe doświadczenie w walce desantowej."
 orm_forts_buff: "Budowa fortyfikacji"
 orm_hormuz_sound_tool: "Cło w cieśninie Ormuz"
 desc_orm_hormuz_sound_tool: "Cło w cieśninie Ormuz zapewnia nam zyski z opłat pobieranych od wszystkich zagranicznych statków handlowych przepływających przez naszą cieśninę."
 estate_burghers_arabian_traders: "Arabscy kupcy"
 estate_burghers_arabian_traders_desc: "Nasi kupcy należą do najsłynniejszych na świecie. Dopuszczenie ich do głosu na naszym dworze pozwoli nam jeszcze lepiej wykorzystywać ich potęgę dla własnych korzyści."
 estate_burghers_omani_marines: "Wzmocnienie omańskiej piechoty morskiej"
 estate_burghers_omani_marines_desc: "Nasza piechota morska może być przydatna podczas desantów, lecz nie jest odpowiednio wyszkolona do regularnej walki. Powinniśmy pozwolić kupcom finansować i zatwierdzać jej szkolenie, aby była gotowa stawić czoła każdemu zagrożeniu."
 OMA_mahra_title: "Podporządkowanie Mahryjczyków"
 OMA_mahra_desc: "Południowa Arabia jest ojczyzną Mahryjczyków, ludu o kulturze odmiennej od pozostałych plemion arabskich. Podobnie jak my słyną oni z żeglarskich umiejętności, co czyni ich jednak naszymi konkurentami. Wkroczymy na ich ziemie i zmusimy ich do uznania naszego panowania."
 OMA_holy_cities_title: "Opiekun Świętych Miast"
 OMA_holy_cities_desc: "Świętymi Miastami świata islamu władają słabeusze. My, kupcy z [Root.GetName], dysponujący złotem i stalą, znacznie lepiej nadajemy się do pełnienia funkcji opiekuna. Mekka i Medyna wkrótce znajdą się w naszych rękach."
 OMA_india_title: "Powiązania w Indiach"
 OMA_india_desc: "Nasi kupcy mają placówki nawet na ziemiach Indii. Wielu z nich jest jednak uciskanych przez władców licznych indyjskich królestw. Wyruszmy więc w morze i pomóżmy im odzyskać należne wpływy w Indiach."
 OMA_malay_title: "Wybrzeża Malajów"
 OMA_malay_desc: "Choć wpływy naszych kupców kończą się na indyjskich portach, ziemie Azji Południowo-Wschodniej od dawna znajdują się pod wpływem muzułmańskich handlarzy. Jeśli popłyniemy tam i przejmiemy tamtejsze szlaki handlowe, jeszcze bardziej rozszerzymy nasze wpływy w Azji."
 OMA_spice_trade_title: "Korzenie muszą płynąć"
 OMA_spice_trade_desc: "Przyprawy mogą nie przynosić naszemu państwu bezpośrednich korzyści, lecz sam handel nimi okazał się dla nas bardzo dochodowy. Musimy zabezpieczyć dostęp do przypraw i odpędzić konkurentów, jeśli chcemy zmonopolizować ten cenny towar."
 OMA_hormuz_title: "Pokonanie Ormuzu"
 OMA_hormuz_desc: "Mieszkańcy Ormuzu uciskali nas przez dziesięciolecia, walcząc z nami i ograniczając nasze wpływy do omańskich ziem w głębi lądu. Nie możemy pozwolić, by stali się przyczyną naszego upadku. Ruszymy naprzód i raz na zawsze ich zmiażdżymy."
 OMA_central_arabia_title: "Konsolidacja Arabii Środkowej"
 OMA_central_arabia_desc: "Arabię Środkową zamieszkuje wiele wrogich plemion, znacznie lepiej od nas obeznanych z walką na pustyni. Brakuje im jednak bogactwa, by stawić nam opór. Nasze złoto pozwoli zwerbować tysiąc wojowników, a z ich pomocą podporządkujemy sobie te plemiona."
 OMA_Baghdad_title: "Upadek Bagdadu"
 OMA_Baghdad_desc: "Dom Mądrości jest prawdopodobnie najsłynniejszą biblioteką świata islamu. Założony w Bagdadzie, przyczynił się do rozkwitu islamskiego złotego wieku. Od czasu najazdu Mongołów utracił jednak dawną świetność. Pomożemy mu odzyskać jeszcze większą chwałę, zaczynając od zdobycia Bagdadu."
 OMA_unify_arabia_title: "Nasz półwysep"
 OMA_unify_arabia_desc: "Wreszcie ziemie Arabii zostały zjednoczone. Od upadku kalifatu, gdy kalif stał się jedynie marionetką, świat islamu pozostawał podzielony. Teraz, gdy zjednoczyliśmy ziemie proroka, możemy ogłosić się nowym kalifem."
 OMA_trading_outposts_title: "Poszerzenie naszych wpływów"
 OMA_trading_outposts_desc: "Jeśli kiedykolwiek mamy stworzyć sieć handlową poza Arabią, musimy przygotować się do zdobywania i umacniania zamorskich placówek. Aby je założyć, potrzebujemy floty, która wesprze naszych kupców w działalności handlowej poza ojczyzną."
 OMA_china_title: "Chińskie bogactwa"
 OMA_china_desc: "Chiny są prawdopodobnie najbogatszym regionem, jaki kiedykolwiek napotkali nasi kupcy. Od herbaty i porcelany po wszelkie towary, których brakuje w świecie islamu. Zdobywając wpływy w chińskich portach, możemy utworzyć nową kompanię, która przyniesie nam niewyobrażalne zyski."
 OMA_thalassocracy_title: "Arabska talassokracja"
 OMA_thalassocracy_desc: "Nasze marzenia o dominacji kupieckiej i morskiej nad Oceanem Indyjskim oraz resztą Azji wreszcie się spełniły. Nasi kupcy mogą swobodnie kupować i sprzedawać swoje towary w każdym zakątku zamorskiego imperium. Niech rozpocznie się nowa era dla przedsiębiorczych kupców islamu."
 OMA_haasa_title: "Ziemia Bahrajnu"
 OMA_haasa_desc: "Bahrajn jest ojczyzną jednych z najcenniejszych klejnotów Arabii. Kontrolują je jednak obcy, którzy nie wykorzystują ich pełnego potencjału. Być może nadszedł czas, by przejąć te ziemie i handlować klejnotami na własny rachunek."
 OMA_yemen_title: "Podbój Jemenu"
 OMA_yemen_desc: "Jemen leży na skrzyżowaniu szlaków między Arabią a Afryką. Jest również producentem jednej z najsłynniejszych kaw na świecie. Jemeńczycy są jednak naszymi wrogami i musimy się z nimi rozprawić. Podbijemy ich tak jak resztę Arabii."
 OMA_buffing_outposts_title: "Zamorskie placówki"
 OMA_buffing_outposts_desc: "Aby nasi kupcy mieli szansę na sukces z dala od Arabii, musimy zapewnić im wsparcie. Zakładając nowe placówki i rozbudowując je w celu zabezpieczenia szlaków handlowych, pozwolimy im jeszcze bardziej umocnić wpływy na obcych ziemiach."
 OMA_finest_arabic_seafarers_title: "Najlepsi arabscy żeglarze"
 OMA_finest_arabic_seafarers_desc: "Mieszkańcy [Root.GetName] są najsłynniejszymi kupcami Arabii. Ich wpływy sięgają wielu portów Oceanu Indyjskiego, a my czerpiemy z tego znaczne korzyści. Być może jeśli przyznamy niektórym kupcom większą władzę w naszym państwie, będą skłonni jeszcze bardziej nam pomóc."
 OMA_indian_ocean_supremacy_title: "Dominacja na Oceanie Indyjskim"
 OMA_indian_ocean_supremacy_desc: "Ocean Indyjski jest rozległy, lecz nie powstrzyma nas to przed zdobyciem nad nim panowania. Zabezpieczymy szlaki handlowe, a nasze okręty zapanują nad jego falami — wszystko w imię zysku."
 OMA_exaploiting_the_secret_title: "Wykorzystanie sekretu kawy"
 OMA_exaploiting_the_secret_desc: "Kawa z Jemenu jest jednym z najbardziej dochodowych towarów Arabii. Jako kupcy powinniśmy wykorzystać tę okazję i podjąć próbę zwiększenia jej produkcji."
 OMA_arabian_naval_bases_title: "Porty Arabii"
 OMA_arabian_naval_bases_desc: "Możemy nazywać się mistrzami budowy okrętów, lecz cóż nam po nich, jeśli nie mamy portów, z których moglibyśmy korzystać? Odzyskajmy część utraconych arabskich portów lub podbijmy nowe, aby ponownie panować na morzach."
 OMA_shipbuilding_masters_title: "Mistrzowie budowy okrętów"
 OMA_shipbuilding_masters_desc: "Nasi ludzie słyną z budowy okrętów i żeglugi. Nie ma morza, na które nie wyprawilibyśmy się w celu podboju lub handlu. Zbudowanie nowej floty pozwoli nam urzeczywistnić te ambicje."
 OMA_madagascar_title: "Wyspa Madagaskar"
 OMA_madagascar_desc: "Madagaskar nie obfituje w bogactwa naturalne, lecz stanowi ważny ośrodek handlu, a jego mieszkańcy są podzieleni i walczą między sobą. Być może opanowanie wyspy pozwoli nam jeszcze bardziej umocnić naszą pozycję na Zanzibarze."
 OMA_zanzibar_trade_dominance_title: "Ekspansja na wybrzeżu suahili"
 OMA_zanzibar_trade_dominance_desc: "Większość Zanzibaru mogła już znaleźć się pod naszym panowaniem, lecz pozostałe ludy suahili wciąż stawiają nam opór — zarówno zbrojny, jak i gospodarczy. Jeśli je wszystkie podporządkujemy, zostaniemy jedynym hegemonem handlu na Zanzibarze."
 OMA_end_hormuz_toll_title: "Koniec ceł Ormuz"
 OMA_end_hormuz_toll_desc: "Ormuz i jego miasto od zawsze blokują handel zagranicznych statków, dzięki czemu mogą decydować o zwycięzcach i przegranych w handlu morskim. Dopilnujmy, by ich wyspa obróciła się w pustkowie, a my znów mogli swobodnie handlować."
 OMA_forts_of_oman_title: "Forty Omanu"
 OMA_forts_of_oman_desc: "Nasi ludzie od zawsze musieli się bronić, odpierając zagrożenia zewnętrzne dzięki umocnieniom, które zapewniają nam przewagę w starciu z silniejszym przeciwnikiem. Rozbudujmy te fortyfikacje i zadbajmy o ich należyte utrzymanie."
 OMA_religious_propogation_title: "Drogi Proroka"
 OMA_religious_propogation_desc: "Jeśli kupcy świata islamu czegoś dokonali, to z pewnością rozpowszechnili swoją wiarę w Azji dzięki handlowi. Przedstawiają nasze nauki na nowych wybrzeżach, do których docierają, a następnie pozwalają miejscowej ludności stopniowo przyjmować islam. Pójdźmy w ich ślady i szerzmy naszą wiarę w każdym zakątku świata."
 OMA_omani_marines_title: "Omańska piechota morska"
 OMA_omani_marines_desc: "W naszym państwie żyje wielu żeglarzy. Wielu z nich nieustannie podróżuje między portami, prowadząc handel lub szerząc kulturę naszego narodu. Musimy jednak również przygotować oddziały wyszkolone specjalnie do prowadzenia desantów i działań wojskowych za morzem."
 OMA_zanzibar_title: "Sułtani Zanzibaru"
 OMA_zanzibar_desc: "Sułtanaty Zanzibaru w ostatnim czasie podupadły. Ich zamorskie wpływy słabną, a same państwa pogrążone są w nieustannych niepokojach. Być może przyjęcie tytułu sułtanów tej krainy pozwoli nam umocnić nasze roszczenia."
 OMA_spreading_the_ibadi_faith_title: "Szerzenie wiary ibadyckiej"
 OMA_spreading_the_ibadi_faith_desc: "Nasi ludzie należą do najwierniejszych wyznawców odłamu ibadyckiego. Od zawsze jednak pozostajemy w konflikcie z sunnitami i szyitami, co utrudnia nam szerzenie wiary w odległych krainach. Rozprawmy się z każdym, kto pragnie nas zniszczyć, abyśmy mogli szerzyć nasze nauki wśród innych narodów."
 OMA_DISTRIBUTE_ONLY_IN_REQUIRED_PROVINCES: "Rozwój zostanie rozdzielony wyłącznie między §Yprowincje§!, które spełniają §Ywymagania§!."
 OMA_BUFF_PRIVATE_TRADING_FLEETS: "Przywilej mieszczaństwa „§YPrywatne floty handlowe§!” zapewni teraz dodatkowo §G+15,0%§! modyfikatora limitu sił morskich."
 OMA_GAIN_MERCANTILISM_PER_SLAVE_PROVINCE_IN_MADAGASCAR: "Za każdą §Yprowincję§! na §YMadagaskarze§!, w której produkuje się §Yniewolników§!, otrzymamy §G+1§! merkantylizmu."
 OMA_UPGRADE_KILWA_MONUMENT: "Wielki projekt §YMiasto Kilwa§! na poziomie 3 zapewni teraz §G-15,0%§! kosztu lekkich okrętów."
 OMA_COMPLETED_ZANZIBAR_MISSION: "Ukończono misję §YSułtani Zanzibaru§!"
 OMA_GRANT_FOLLOWING_BONUS_TO_ALL_IVORY_PROVINCES: "Każda prowincja wytwarzająca §Ykość słoniową§! w regionie §YWschodniej Afryki§! otrzyma następujące premie:"
 OMA_TRADER_GRANTS_EXTRA_ARABIC_TRADE_INFLUENCE: "Doradca §Ykupiec§! będzie teraz zapewniał §G+0,02§! arabskiego merkantylizmu za każdy poziom."
 OMA_GRANT_NIZWA_FORT_UPGRADE: "Wielki projekt §YFort Nizwa§! na poziomie 3 zapewni teraz §G-15,0%§! kosztów utrzymania fortów."
 OMA_COMPLETED_OMANI_FORTS_MISSION: "Ukończono misję §YForty Omanu§!."
 OMA_UNLOCK_MERCHANT_PRIVILEGE_OF_OMANI_MARINES: "Odblokowuje przywilej mieszczaństwa §YWzmocnienie omańskiej piechoty morskiej§!, który zwiększy możliwości naszych §Yoddziałów piechoty morskiej§!."
 OMA_BUFF_CHURCH_ADMIN_PRIVILEGES: "Przywilej ulemów §YWewnętrzne skupienie duchowieństwa§! zapewni teraz dodatkowo §G10,0%§! modyfikatora zdolności zarządzania oraz §Y+0,1§! miesięcznego przyspieszenia pobożności."
 OMAN_ZANZIBAR: "Zanzibar"
 OMAN_ZANZIBAR_ADJ: "zanzibarski"
 ITA_lose_10_separatism: "Wszystkie prowincje na §Ywymaganych obszarach§! stracą §G10§! lat separatyzmu."
 ITA_if_we_have_morale: "Jeśli nasza flota ma co najmniej §G+15,0%§! morale:"
 ITA_if_we_have_majority_of_trade_power: "Jeśli mamy największą §Ysiłę handlową prowincji§! w węźle handlowym §YAleksandria§!:"
 ITA_religious_diplomats: "Wzmocnij przywilej stanowy „§YReligijni dyplomaci§!”, usuwając koszt w postaci §Ymaksymalnego absolutyzmu§! i zapewniając §G+2,00§! tolerancji heretyków, gdy jesteśmy sprzymierzeni z państwem §Ykoptyjskim§!."
 ITA_having_a_coptic_ally: "Sojusz z państwem §Ykoptyjskim§! zapewni nam §G+2,00§! tolerancji heretyków."
 ITA_spread_base_tax_and_base_production: "Rozdziel §G10§! podatku bazowego i §G10§! produkcji bazowej między nasze posiadane prowincje."
 ITA_rightful_heirs_title: "Prawowici dziedzice"
 ITA_rightful_heirs_desc: "Dziedzictwo Rzymu jest wspólne dla wielu narodów. Każdy potężny europejski monarcha próbuje przedstawić się jako prawowity następca Cezara, Oktawiana i innych wielkich Rzymian. Wszyscy cesarze Świętego Cesarstwa Rzymskiego oraz władcy Rum zdają się zapominać, że największe imperium nie wywodzi się z Wiednia ani Konstantynopola, lecz z Rzymu."
 ITA_holy_roman_delusions_title: "Urojenia Świętego Cesarstwa"
 ITA_holy_roman_delusions_desc: "Germańskie Święte Cesarstwo Rzymskie splamiło dobre imię Rzymian. Od wieków jego władcy roszczą sobie bezczelne prawo do dziedzictwa Rzymu. Ukarzmy ich za te przewinienia i połóżmy kres temu germańskiemu urojeniu."
 ITA_african_coastline_title: "Wzdłuż wybrzeża"
 ITA_african_coastline_desc: "Niegdyś spokojna rzymska Kartagina została zredukowana do kilku skłóconych państewek parających się piractwem. Nasza cierpliwość wobec tych nikczemnych praktyk dobiegła końca."
 ITA_britain_title: "Podbój Albionu"
 ITA_britain_desc: "Podobnie jak Klaudiusz przed setkami lat, zbierzmy niezwłocznie nową flotę i ponownie położmy kres samodzielnym rządom Brytów. Słynny drewniany mur nie oprze się siłom, które wystawimy w imię Rzymu."
 ITA_to_the_rhine_title: "Nad Ren"
 ITA_to_the_rhine_desc: "Ren niegdyś stanowił naturalną granicę między Rzymem a plemionami germańskimi. Przywróćmy tę granicę i zabezpieczmy limes, dopóki nie będziemy gotowi podporządkować sobie ziem po drugiej stronie."
 ITA_to_the_rhine_tt: "Prowincja graniczy z rzeką §YRen§! lub leży w jej pobliżu"
 ITA_galleasses_title: "Udoskonalenie galeasów"
 ITA_galleasses_desc: "Galeas to przystosowanie ciężkich galeonów do standardów walki charakterystycznych dla śródziemnomorskich galer. Udoskonalmy tę konstrukcję, aby nasze floty mogły zapewnić nam panowanie nad Morzem Śródziemnym — naszym morzem!"
 ITA_reform_the_military_title: "Reforma armii"
 ITA_reform_the_military_desc: "Obecny stan naszej armii jest wynikiem wielowiekowego rozwoju. W wyniku procesu zjednoczenia standardy rekrutacji i tradycje wojskowe różnią się w poszczególnych regionach. Musimy poświęcić czas na zreformowanie tych struktur i dostosowanie ich do naszych potrzeb."
 ITA_economic_liberalism_title: "Liberalizm gospodarczy"
 ITA_economic_liberalism_desc: "Od początku epoki wielkich odkryć geograficznych dobrobyt Włoch ustępuje miejsca gospodarkom napędzanym przez kolonializm. W odpowiedzi na trudności różne włoskie dynastie zaczęły eksperymentować, poszukując filozofii gospodarczej, która pozwoliłaby im je przezwyciężyć. Nadszedł czas, byśmy znaleźli własną drogę."
 ITA_glass_title: "Włoski kryształ"
 ITA_glass_desc: "Włoski kryształ, a zwłaszcza wenecki, słynie w całej Europie z najwyższej jakości. Wytwarza się go głównie na wyspie Murano. Musimy zwiększyć produkcję i rozpowszechnić wiedzę o jego wytwarzaniu, aby nasze wyroby szklane stały się symbolem statusu."
 ITA_unify_regional_economies_title: "Zjednoczenie gospodarek regionalnych"
 ITA_unify_regional_economies_desc: "Różnice gospodarcze między regionami są ogromne. Sposób opodatkowania i prowadzenia rolnictwa zależy od tego, kto władał danymi ziemiami. Musimy ujednolicić działalność gospodarczą w całym państwie."
 ITA_wine_title: "Włoskie wino"
 ITA_wine_desc: "Inne kraje mogą poszczycić się słynnymi regionami winiarskimi, lecz można powiedzieć, że same Włochy są jednym wielkim regionem winiarskim. Wino przyczynia się do ich sławy, dlatego powinniśmy nadal pielęgnować tę tradycję."
 ITA_industrial_triangle_title: "Trójkąt przemysłowy"
 ITA_industrial_triangle_desc: "Wraz z rozwojem przemysłu dominującą pozycję zdobyła północno-zachodnia część kraju. Turyn, Mediolan i Genua stały się wierzchołkami nowo powstałego trójkąta przemysłowego."
 ITA_silk_title: "Rozwój jedwabnictwa"
 ITA_silk_desc: "Jedwabnik przed wiekami wydostał się z Chin i dotarł do Europy szlakami handlowymi, a sztuka jedwabnictwa głęboko zakorzeniła się we Włoszech. Musimy wspierać produkcję tej luksusowej tkaniny."
 ITA_train_of_thought_title: "Tok myślenia"
 ITA_train_of_thought_desc: "Renesans uczynił Włochy centrum Europy, podczas gdy pozostałe narody podążały ich śladem, przeżywając własne odrodzenie. Niech włoska sztuka ponownie rozkwitnie i zapoczątkuje nową epokę oświecenia ludzkiego umysłu."
 ITA_the_trades_to_come_title: "Handel przyszłości"
 ITA_the_trades_to_come_desc: "Pozycja handlowa Włoch nie wydaje się już tak niezachwiana. Reformując nasze podejście i przygotowując się na nadchodzące wyzwania, staniemy się jeszcze potężniejszą siłą handlową."
 ITA_at_least_300_trade_income: "Co najmniej §Y300§! dochodu z handlu"
 ITA_branch_1_12_title: "Misja z rozgałęzieniem"
 ITA_branch_1_12_desc: "To §Ymisja z rozgałęzieniem§!. Jej warunki i efekty będą zależeć od naszego wyboru w misji „Handel przyszłości”."
 ITA_branch_1_13_title: "Misja z rozgałęzieniem"
 ITA_branch_1_13_desc: "To §Ymisja z rozgałęzieniem§!. Jej warunki i efekty będą zależeć od naszego wyboru w misji „Handel przyszłości”."
 ITA_branch_2_12_title: "Misja z rozgałęzieniem"
 ITA_branch_2_12_desc: "To §Ymisja z rozgałęzieniem§!. Jej warunki i efekty będą zależeć od naszego wyboru w misji „Handel przyszłości”."
 ITA_genoa_node_title: "[Root.GetPreviewColorITA_TRADE]Przewaga Zachodu[Root.GetPreviewColorITA_TRADE_end]"
 ITA_genoa_node_desc: "Genua od stuleci jest zachodnim centrum handlowym. Jednak w trwającej epoce wielkich odkryć geograficznych może prześcignąć swojego weneckiego odpowiednika na wschodzie zarówno pod względem bogactwa, jak i sławy. Wykorzystajmy tę szansę."
 ITA_italian_discovery_title: "[Root.GetPreviewColorITA_TRADE]Włoskie odkrycie[Root.GetPreviewColorITA_TRADE_end]"
 ITA_italian_discovery_desc: "Amerykę odkrył przede wszystkim włoski żeglarz. Wyprawa odbyła się wprawdzie na służbie innego państwa, lecz nie ma to znaczenia. Zajmijmy Ameryki dla siebie."
 ITA_venice_node_title: "[Root.GetPreviewColorITA_TRADE]Wenecka supremacja[Root.GetPreviewColorITA_TRADE_end]"
 ITA_venice_node_desc: "Najjaśniejsza Republika Wenecka jest najbardziej znanym i prestiżowym spośród włoskich miast kupieckich. Choć wkroczyła w okres stagnacji, możemy przywrócić jej dawną świetność i uczynić z niej nasz główny port handlowy."
 ITA_journey_to_the_east_title: "[Root.GetPreviewColorITA_TRADE]Wyprawa na Wschód[Root.GetPreviewColorITA_TRADE_end]"
 ITA_journey_to_the_east_desc: "Gdy Osmanowie zaczęli dominować na Wschodzie, rynki przypraw zostały zamknięte dla kupców z Europy Zachodniej. Odwróciliśmy ten stan rzeczy i jeszcze bardziej umocniliśmy wenecki monopol na handel przyprawami."
 ITA_plus_ultra_title: "[Root.GetPreviewColorITA_TRADE]Plus Ultra[Root.GetPreviewColorITA_TRADE_end]"
 ITA_plus_ultra_desc: "Nasze dążenie do dominacji rynkowej powinniśmy rozpocząć od zdobycia przywilejów i renomy na rynkach zachodnich, a zwłaszcza za Słupami Herkulesa — bramą do Nowego Świata."
 ITA_explore_eastern_markets_title: "[Root.GetPreviewColorITA_TRADE]Rynki Wschodu[Root.GetPreviewColorITA_TRADE_end]"
 ITA_explore_eastern_markets_desc: "Nadszedł czas, by kupcy ze wschodniej części Morza Śródziemnego przywykli do naszych nowych ambicji. Zdobywając przywileje i zwolnienia podatkowe lub po prostu zwyciężając przewagą liczebną, sprawimy, że Wschód przyjmie włoski jako język powszechnego handlu."
 ITA_venice_missions: "Wenecka ścieżka handlowa"
 ITA_genoa_missions: "Genuńska ścieżka handlowa"
 ITA_preview_venice: "Podgląd drzewa misji „§OWenecka ścieżka handlowa§!”."
 ITA_preview_genoa: "Podgląd drzewa misji „§OGenuńska ścieżka handlowa§!”."
 ITA_this_is_a_branching_mission: "To §Ymisja z rozgałęzieniem§!. Ukończ misję „§YHandel przyszłości§!”, aby zobaczyć dostępne ścieżki."
 estate_burghers_ITA_permit_merchant_colonists: "Zezwolenie kupcom na zakładanie kolonii"
 estate_burghers_ITA_permit_merchant_colonists_desc: "Nasi kupcy wykazują duże zainteresowanie zakładaniem kolonii. Możemy na tym skorzystać, lecz takie przedsięwzięcie może również narazić nas na straty."
 estate_burghers_ITA_promote_latin_merchants: "Wsparcie kupców łacińskich"
 estate_burghers_ITA_promote_latin_merchants_desc: "Włochy od dawna są handlowym centrum Europy. Niestety, możemy utracić tę pozycję, jeśli nie wesprzemy naszych kupców w rywalizacji z rosnącą potęgą handlu na północy."
 ITA_unlock_new_estate_privileges_that_will_be_decided: "Odblokowuje przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!. Przyznawane przez niego modyfikatory zależą od wybranego przez nas §Ydrzewa misji§!. Ulepszenie będzie widoczne po zatwierdzeniu wyboru drzewa misji."
 ITA_upgrade_privilege_venice_version: "Wzmocnij przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!, usuwając karę do §Ymaksymalnego absolutyzmu§! i zapewniając efekt: [Root.GetVeniceUpgradeTooltip]."
 ITA_venice_upgrade_dharma: "§G-15,0%§! kosztu inwestycji w kompanie handlowe"
 ITA_venice_upgrade_no_dharma: "§G-5,0%§! kosztu budowy"
 ITA_permanent_claim_on_india: "Zyskaj §Ytrwałe roszczenia§! do wszystkich nadbrzeżnych prowincji z §Ycentrum handlu§! w węzłach handlowych §YZatoka Adeńska§!, §YGudźarat§! i §YKormandel§!."
 ITA_early_suez_canal: "Będziemy mogli zbudować §YKanał Sueski§! niezależnie od poziomu naszej §Ytechnologii administracyjnej§!."
 ITA_enable_free_trade_policies_in_eastern_med: "Będziemy mogli stosować §Ypolityki handlowe§! w węzłach §YWenecja§!, §YKonstantynopol§!, §YAleksandria§!, §YRagusa§! i §YAleppo§! bez obecności §Ykupca§!."
 ITA_enable_free_trade_policies_in_western_med: "Będziemy mogli stosować §Ypolityki handlowe§! w węzłach §YGenua§!, §YWalencja§!, §YSewilla§!, §YTunis§! i §YSafi§! bez obecności §Ykupca§!."
 ITA_upgrade_privilege_with_spices: "Wzmocnij przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!, zapewniając §G+1,0%§! sterowania handlem za każde §Y4,0%§! udziału w rynku §Yprzypraw§!."
 ITA_priv_upgrade_venice: "Wzmocnij przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!, zapewniając §G+5,0%§! sterowania handlem i §G+10,0%§! siły handlowej za granicą."
 ITA_priv_upgrade_genoa: "Wzmocnij przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!, zapewniając §G+5,0%§! efektywności handlu."
 ITA_upgrade_suez: "Wielki projekt „§YKanał Sueski§!” na poziomie §YWspaniałym§! będzie teraz zapewniał §G+1,00§! kupca."
 ITA_upgrade_privilege_genoa_version: "Wzmocnij przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!, usuwając karę do §Ymaksymalnego absolutyzmu§! i zapewniając §G+5,0%§! szansy na osadników oraz §G+25,0%§! zasięgu kolonialnego."
 ITA_extra_goods_produced_for_colonies: "Zwierzchnik: ukończono misję „§YWłoskie odkrycie§!”."
 desc_ITA_extra_goods_produced_for_colonies: "Dzięki zaangażowaniu naszego zwierzchnika możemy zwiększyć produkcję."
 ITA_double_certain_trade_goods_trading_in_bonus: "Wzmocnij przywilej stanowy „§YWsparcie kupców łacińskich§!” dla §Y[Root.GetBurghersName]§!, zapewniając dodatkowe modyfikatory zależne od handlu następującymi §Ytowarami§!:\\n§MK bawełna§!: §G+10,00§! globalnego przyrostu osadników\\n§Mcukier§!: §G-15,0%§! kosztu zmniejszania wyczerpania wojną\\n§Mtytoń§!: §G+1,00§! reputacji dyplomatycznej\\n§Mkakao§!: §G-10,0%§! kosztu doradców"
 ITA_scaling_spices: "Ten przywilej może zapewniać dodatkowe efekty, jeśli handlujemy następującymi §Ytowarami§!:\\n§Mbawełna§!: §G+10,00§! globalnego przyrostu osadników\\n§Mcukier§!: §G-15,0%§! kosztu zmniejszania wyczerpania wojną\\n§Mtytoń§!: §G+1,00§! reputacji dyplomatycznej\\n§Mkakao§!: §G-10,0%§! kosztu doradców"
 ITA_trade_good_benefits: "Otrzymujemy §G+1,0%§! sterowania handlem za każde §Y4,0%§! udziału w rynku §Yprzypraw§!."
 ITA_estate_privilege_for_colonization: "Odblokowuje przywilej stanowy „§YZezwolenie kupcom na zakładanie kolonii§!” dla §Y[Root.GetBurghersName]§!, który zapewnia różne modyfikatory zależnie od tego, czy posiadamy ideę §Ykolonialną§!.\\n\\nJeśli posiadamy ideę §Ykolonistów§!, otrzymamy §G+25,00§! globalnego przyrostu osadników i §G+5,0%§! sterowania handlem.\\n\\nJeśli nie posiadamy idei §Ykolonialnej§!, otrzymamy §G+1,00§! kolonistę oraz karę §R-5,0%§! szansy na osadników."
 ITA_cb_for_america: "Odblokowuje casus belli „§YWyścig o Amerykę§!” przeciwko państwom posiadającym prowincje w §YAmeryce Północnej§!, §YAmeryce Południowej§! i §YNowym Świecie§!. Zajmowanie terytorium w ramach tego casus belli nie kosztuje §Ypunktów dyplomatycznych§!, lecz zwiększa agresywną ekspansję o §R+25,0%§!."
 cb_ita_scramble_for_america: "Wyścig o Amerykę"
 cb_ita_scramble_for_america_desc: "Choć spóźniliśmy się z zajęciem pierwszych ziem w Ameryce, możemy po prostu zagarnąć terytoria należące do innych państw."
 cb_roman_ambition: "Rzymska ambicja"
 cb_roman_ambition_desc: "Jesteśmy prawdziwymi spadkobiercami Rzymu i musimy odzyskać rzymskie terytoria."
 cb_ita_dismantle_hre: "Rozwiąż Cesarstwo"
 cb_ita_dismantle_hre_desc: "Święte Cesarstwo Rzymskie nie jest ani święte, ani cesarstwem, a już z pewnością nie jest rzymskie."
 ITA_roman_ambition_wargoal: "Zdobądź prowincję"
 ITA_roman_ambition_wargoal_desc: "Celem wojny jest okupowanie konkretną prowincję."
 ITA_ROMAN_AMBITION_WARNAME: "$ORDER$Odzyskanie rzymskiej prowincji $PROVINCE$"
 ITA_scramble_for_america_wargoal: "Zdobądź prowincję"
 ITA_scramble_for_america_wargoal_desc: "Celem wojny jest okupowanie konkretną prowincję."
 ITA_SCRAMBLE_FOR_AMERICA_WARNAME: "$ORDER$Wyścig o $PROVINCE$"
 ITA_dismantle_hre_wargoal: "Zdobądź stolicę"
 ITA_dismantle_hre_wargoal_desc: "Celem wojny jest okupowanie stolicy. "
 ITA_HRE_DISMANTLEMENT_WARNAME: "$ORDER$Wojna o rozwiązanie Cesarstwa"
 ITA_higher_likelihood_of_entrepeneur_no_longer: "§Y[Root.Owner.GetName]§! nie będzie już mieć zwiększonej szansy na władcę o osobowości §YPrzedsiębiorczy§!."
 ITA_higher_likelihood_of_entrepeneur: "§Y[Root.Owner.GetName]§! będzie mieć zwiększoną szansę na władcę o osobowości §YPrzedsiębiorczy§!."
 ITA_superior_trade_center: "Port światowy"
 desc_ITA_superior_trade_center: ""
 ITA_every_colonial_nation_will_get_goods_produced: "Każde §Ypaństwo kolonialne§! otrzyma §G+10,0%§! produkcji towarów."
 ITA_unification_of_navies: "Zjednoczenie flot regionalnych"
 desc_ITA_unification_of_navies: "W wyniku szybkiego zjednoczenia Włoch przejęliśmy i zintegrowaliśmy wiele okrętów zbudowanych według różnych standardów. Muszą one zostać dostosowane do nowych warunków."
 ITA_best_form_of_defense_is_attack: "Obrona wybrzeża"
 desc_ITA_best_form_of_defense_is_attack: "Podstawowym zadaniem naszej floty będzie ochrona wybrzeża. Gdy ustaną nieustanne najazdy Berberów, będziemy mogli naprawdę rozkwitnąć."
 ITA_latin_tiara: "Łacińska tiara triumfuje nad turbanem"
 desc_ITA_latin_tiara: "Bizantyjczycy woleli turban od tiary. Nie ma to już jednak znaczenia, ponieważ nie mają teraz wyboru."
 ITA_no_more_holy_romans: "Zniszczenie Świętego Cesarstwa Rzymskiego"
 desc_ITA_no_more_holy_romans: "Bezbożne germańskie urojenie zostało pokonane."
 ITA_littoral: "Wybrzeże Adriatyku"
 ITA_enhanced_emperorship: "Dyplomatyczne przejęcie"
 desc_ITA_enhanced_emperorship: "Zamiast rozwiązywać Święte Cesarstwo Rzymskie w wyniku wojny podbojowej, postanowiliśmy przejąć je od środka. To sprytne i podstępne rozwiązanie."
 ITA_integration_with_southern_france: "Integracja z Oksytańczykami"
 desc_ITA_integration_with_southern_france: "Oksytańczycy są kulturowo bliscy łacińskim mieszkańcom Italii. Włączenie ich do naszego państwa nie powinno sprawić większych trudności."
 ITA_conquest_of_britain: "Podbój Brytanii"
 desc_ITA_conquest_of_britain: "Potężny angielski Drewniany Mur nie stanowi dla nas przeszkody. Albion znajduje się teraz pod naszą kontrolą."
 ITA_crusader_kings: "Królowie krzyżowców"
 desc_ITA_crusader_kings: "Święte miasto Jerozolima jest w naszym zasięgu. Musimy zadbać, by pielgrzymi poświęcali mu należytą uwagę."
 ITA_blatant_roman_larp: "Oczywiści pretendenci do rzymskiego dziedzictwa"
 desc_ITA_blatant_roman_larp: "Wszyscy nasi partnerzy dyplomatyczni doskonale wiedzą, jakie mamy plany. Nasze imperialistyczne zapędy budzą ich niezadowolenie."
 ITA_all_roads_lead_to_rome: "Wszystkie drogi prowadzą do Rzymu"
 desc_ITA_all_roads_lead_to_rome: "To stare powiedzenie nigdy nie było prawdziwsze niż dzisiaj."
 ITA_true_roman_empire: "Prawowici dziedzice Rzymu"
 ITA_until_roman_empire_is_formed: "do czasu utworzenia @ROM §YCesarstwa Rzymskiego§!"
 ITA_unity: "Zjednoczenie zakończone"
 desc_ITA_unity: "Ta prowincja jest częścią Półwyspu Apenińskiego — ziemi niegdyś podzielonej, lecz teraz zjednoczonej dzięki risorgimentu."
 ITA_center_of_silk_weaving: "Ośrodek tkactwa jedwabiu"
 desc_ITA_center_of_silk_weaving: "Ta prowincja jako jedna z pierwszych przyjęła metody tkania jedwabiu po sprowadzeniu jedwabników do Włoch w X wieku."
 ITA_center_of_silk_production: "Ośrodek uprawy morwy"
 desc_ITA_center_of_silk_production: "Dzięki idealnemu klimatowi prowincja ta jest niekwestionowanym liderem uprawy morwy."
 ITA_murano_glass: "Szkło z Murano"
 desc_ITA_murano_glass: "Szkło wytwarzane na wyspie Murano słynie w całej Europie. Aby wykorzystać tę renomę, znacznie zwiększyliśmy produkcję."
 ITA_protectionism: "Promowanie protekcjonizmu"
 desc_ITA_protectionism: "Promujemy merkantylizm, ograniczając import do minimum i maksymalizując eksport."
 ITA_permanent_absolutism_buff: "Nowa era Włoch"
 desc_ITA_permanent_absolutism_buff: "Włochy wkraczają w nową erę, w której nie będą już przyćmiewane przez inne mocarstwa. Staną się wielką potęgą."
 ITA_constantinople_taken: "Zdobycie Konstantynopola"
 desc_ITA_constantinople_taken: "Wschodniorzymski Konstantynopol został zdobyty i będzie teraz rozkwitać pod rzymskimi rządami."
 ITA_stylize: "Przyjmiemy §Yrzymskie§! nazewnictwo ustroju."
 estate_nobles_ITA_military_governors: "Nadanie gubernatorstw wojskowych"
 estate_nobles_ITA_military_governors_desc: "Dzięki szybkiemu odzyskiwaniu rzymskich terytoriów możemy powierzyć ich administrację niektórym generałom, ryzykując jednak, że staną się zbyt potężni i wpływowi."
 ITA_specify_the_conditional_effects: "Podczas wojny otrzymamy §G-0,05§! miesięcznej zmiany autonomii."
 ITA_upgrade_military_governorship_with_abso: "Wzmocnij przywilej stanowy „§YNadanie gubernatorstw wojskowych§!”, zapewniając §G+5,00§! maksymalnego absolutyzmu."
 ITA_upgrade_military_governorship_with_autonomy_in_terr: "Wzmocnij przywilej stanowy „§YNadanie gubernatorstw wojskowych§!”, zapewniając §G-5,0%§! minimalnej autonomii na terytoriach."
 ITA_upgrade_military_governorship_with_army_quality: "Wzmocnij przywilej stanowy „§YNadanie gubernatorstw wojskowych§!”, zapewniając §G+1,00§! rocznej tradycji armii i §G+1,00§! siły uderzenia dowódców lądowych."
 ITA_all_provinces_lose_10_autonomy: "Wszystkie posiadane prowincje stracą §G10,0%§! autonomii."
 ITA_upgrade_city_expansion_privileges: "Wzmocnij przywilej stanowy „§YPrzywileje rozbudowy miast§!”, usuwając koszt w postaci §Ymaksymalnego absolutyzmu§!. Ponadto, gdy przywilej będzie aktywny, realizacja zadań stanu §Y[Root.GetBurghersName]§! będzie rozdzielać §G3§! losowe punkty rozwoju w prowincji §Y[Root.GetName]§!."
 ITA_3_random_dev_distribution: "Rozdziel §G3§! losowe punkty rozwoju między nasze prowincje."
 ITA_doing_estate_burghers_agendas: "Realizacja zadań stanu §Y[Root.GetBurghersName]§! będzie rozdzielać §G3§! losowe punkty rozwoju w prowincji §Y[Root.GetName]§!."
 ITA_unlock_roman_ambition: "Odblokowuje casus belli „§YRzymskie ambicje§!” przeciwko państwom posiadającym prowincje, do których mamy §Yroszczenia§! i które są wymagane do utworzenia @ROM §Y[ROM.GetName]§!. Prowincje spełniające te warunki kosztują o §G10,0%§! mniej punktów agresywnej ekspansji i §G10,0%§! mniej punktów warscore przy aneksji."
 ITA_triumph_for_hispaniae: "Triumf w Hiszpanii"
 desc_ITA_triumph_for_hispaniae: "Rozjuszony hiszpański byk został poskromiony. Sprawujemy kontrolę nad Hispanią."
 ITA_conquest_of_west_1: "Podporządkowanie Galów"
 desc_ITA_conquest_of_west_1: "Spadkobiercy Galów ugną się przed rzymskim panowaniem. Podboje Cezara zostaną utrzymane."
 ITA_conquest_of_west_2: "Podporządkowanie Galów"
 desc_ITA_conquest_of_west_2: "Spadkobiercy Galów ugną się przed rzymskim panowaniem. Podboje Cezara zostaną utrzymane."
 ITA_conquest_of_east_1: "Odzyskanie łacińskiego dziedzictwa"
 desc_ITA_conquest_of_east_1: "Zachodnie krańce Grecji i Anatolii od dawna pozostają pod wpływem łacińskim. Te więzi nie mogą zostać zerwane!"
 ITA_conquest_of_east_2: "Odzyskanie łacińskiego dziedzictwa"
 desc_ITA_conquest_of_east_2: "Zachodnie krańce Grecji i Anatolii od dawna pozostają pod wpływem łacińskim. Te więzi nie mogą zostać zerwane!"
 ITA_conquest_of_africa_1: "Odzyskanie Afryki"
 desc_ITA_conquest_of_africa_1: "Kartagińczycy ośmielili się rzucić nam wyzwanie. Ich mierni następcy nie odważą się zrobić tego ponownie."
 ITA_conquest_of_africa_2: "Odzyskanie Afryki"
 desc_ITA_conquest_of_africa_2: "Kartagińczycy ośmielili się rzucić nam wyzwanie. Ich mierni następcy nie odważą się zrobić tego ponownie."
 ITA_humiliation_of_holy_roman_empire_1: "Podporządkowanie Świętego Cesarstwa"
 desc_ITA_humiliation_of_holy_roman_empire_1: "Germańscy uzurpatorzy powoli pojmują, że dzięki naszym podbojom ich fałszywe imperium przestało istnieć."
 ITA_humiliation_of_holy_roman_empire_2: "Podporządkowanie Świętego Cesarstwa"
 desc_ITA_humiliation_of_holy_roman_empire_2: "Germańscy uzurpatorzy powoli pojmują, że dzięki naszym podbojom ich fałszywe imperium przestało istnieć."
 ITA_final_modifier: "Odrodzony Rzym"
 desc_ITA_final_modifier: "Rzym upadł raz, lecz nigdy więcej się to nie stanie. Roma Invicta!"
 ITA_while_cavour_is_active: "Dopóki §YCamillo Benso di Cavour§! żyje i pozostaje na stanowisku, otrzymujemy również:\\nKoszt rozwoju: §G-3,0%§!\\nPrzyrost postępu reform: §G+10,0%§!\\nModyfikator produkcji towarów: §G+3,0%§!\\n\\nWartości tych modyfikatorów zależą od §Ypoziomu doradcy§!."
 ITA_conquest_of_east_1_2: "Zmodyfikuj „§YOdzyskanie łacińskiego dziedzictwa§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Tolerancja prawdziwej wiary: §G+1,00§!"
 ITA_conquest_of_west_1_2: "Zmodyfikuj „§YPodporządkowanie Galów§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Miesięczne wyczerpanie wojną: §G-0,05§!"
 ITA_conquest_of_africa_1_2: "Zmodyfikuj „§YOdzyskanie Afryki§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Zdolność bojowa galer: §G+10,0%§!"
 ITA_humiliation_of_holy_roman_empire_1_2: "Zmodyfikuj „§YPodporządkowanie Świętego Cesarstwa§!” o:\\n  Zdolność zarządzania: §G+50,00§!\\n  Miesięczna zmiana autonomii: §G-0,05§!"
 ITA_final_modifier_tt: "Połącz „§YOdzyskanie Afryki§!”, „§YOdzyskanie łacińskiego dziedzictwa§!”, „§YPodporządkowanie Galów§!” i „§YPodporządkowanie Świętego Cesarstwa§!” w modyfikator „§YOdrodzony Rzym§!” i zmodyfikuj go o:\\n  Koszt tworzenia rdzeni: §G-5,0%§!\\n  Roczny absolutyzm: §G+1,00§!"
 ITA_warriors_do_not_read_books_will_no_longer_happen: "Wojownicy zaczną teraz zdobywać wykształcenie.\\nWydarzenie „§YWojownicy nie czytają ksiąg§!” nie będzie już występować."
 ITA_enable_privilege_for_military_governors: "Odblokowuje przywilej stanowy „§YNadanie gubernatorstw wojskowych§!” dla §Y[Root.GetNobilityName]§!, zapewniający §G-5,0%§! kosztu zarządzania terytoriami oraz dodatkowe §G-0,05§! miesięcznej zmiany autonomii podczas §Ywojny§!."
 ITA_lost_legions_merc_company: "Odblokowuje kompanię najemników „§JZaginione legiony§!”, której zaciąg nie kosztuje §Yprofesjonalizmu armii§!. Kompania zapewnia następujące modyfikatory:\\n  Zdolność bojowa piechoty: §G+10,0%§!\\n  Otrzymywane obrażenia morale: §G-15,0%§!\\n  Otrzymywane obrażenia od wstrząsu: §G-15,0%§!\\n  Otrzymywane obrażenia od ostrzału: §R+5,0%§!"
