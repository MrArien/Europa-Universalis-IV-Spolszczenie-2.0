 MUG_sindh_title: "Kampania w Sindh"
 MUG_sindh_desc: "Umocnienie naszej władzy nad górnym biegiem Indusu zapewniło nam dogodną bazę do dalszej ekspansji na południe. Podążmy wzdłuż rzeki aż do jej ujścia i przyłączmy ziemie Sindh do naszego państwa."
 MUG_gujarat_title: "Zabezpieczenie portów pielgrzymkowych"
 MUG_gujarat_desc: "Wielkie porty Gudźaratu należą nie tylko do najbardziej ruchliwych ośrodków handlowych świata, lecz są również miejscem, z którego tysiące indyjskich muzułmanów wyruszają do świętych miast Arabii. Naszym obowiązkiem jest podbić Gudźarat, aby zapewnić poddanym bezpieczeństwo podczas najważniejszej podróży ich życia."
 MUG_trade_title: "Rozbudowa portów handlowych"
 MUG_trade_desc: "Sułtanat Gudźaratu jeszcze do niedawna był hojnym patronem rozległej sieci handlowej skupionej wokół zatoki Khambhat. Kontynuujmy tę tradycję, ochraniając kupców i przywracając dawną świetność tamtejszym targowiskom."
 MUG_religion_title: "Synkretyzm religijny w Indiach"
 MUG_religion_desc: "Wraz z umacnianiem naszych rządów w Indiach elementy naszej religii, zwłaszcza tradycje sufickie, coraz częściej przenikają się z miejscowymi wierzeniami hinduistycznymi. Coraz więcej miejscowych wyznawców hinduizmu zaczyna uznawać Allaha za jedno ze swoich bóstw i próbuje włączyć Koran do własnego obrazu świata."
 MUG_sufi_shrines_title: "Indyjskie sanktuaria sufickie"
 MUG_sufi_shrines_desc: "Sufizm od stuleci odgrywa istotną rolę w szerzeniu islamu w Indiach, a subkontynent był domem wielu wielkich szejków sufickich. Jako obrońcy wiernych musimy objąć opieką wszystkie najważniejsze sanktuaria Indii."
 MUG_ibadat_khana_title: "Ibadat Khana"
 MUG_ibadat_khana_desc: "Ibadat Khana, czyli „Dom Modlitwy”, to miejsce stworzone z myślą o dyskusjach przedstawicieli wszystkich religii naszego państwa na temat wiary. Zgromadzeni w jednej sali teologowie różnych wyznań rozważają filozoficzne aspekty ludzkiego życia."
 MUG_din_i_ilahi_title: "Din-i Ilahi"
 MUG_din_i_ilahi_desc: "Nadszedł czas, by odrzucić ograniczenia dawnych religii. Zamiast tego powinniśmy wynieść naszego [Root.Monarch.GetTitle] do rangi istoty boskiej, a najwyższych możnych uczynić jego bezpośrednimi uczniami. Ta boska wiara pozwoli nam stworzyć więź między wszystkimi sługami państwa — silniejszą niż pokrewieństwo czy wspólnota religijna."
 MUG_taj_mahal_title: "Tadź Mahal"
 MUG_taj_mahal_desc: "Aby upamiętnić wspaniałe panowanie naszej dynastii, wznieśmy okazałe mauzoleum, w którym spocznie [Root.Monarch.GetName] oraz wszyscy ci, którzy po [Root.Monarch.GetHerHim] obejmą tron. Wykonane z najwspanialszego marmuru, powinno dorównywać przepychem życiu cesarza Mogołów."
 MUG_red_fort_title: "Czerwony Fort"
 MUG_red_fort_desc: "W miarę jak umacniamy Agrę i jej okolice jako centrum naszej władzy, rośnie ryzyko skoncentrowanego ataku na te równiny. Wznieśmy w pobliskim Delhi nową, wspaniałą twierdzę, która osłoni nasze skrzydło i będzie świadectwem potęgi naszych rządów."
 MUG_land_assessment_title: "Powszechny pomiar ziem"
 MUG_land_assessment_desc: "Sprawne zarządzanie rozległym terytorium od zawsze stanowiło największe wyzwanie dla wielkich indyjskich imperiów. Czerpanie dochodów z bogactw Hindustanu wymaga nie tylko siły militarnej i odpowiedniej władzy. W ogromnej mierze zależy również od pomiarów, wyceny i sporządzenia map wszystkich źródeł dochodu znajdujących się w granicach państwa.\\nPowszechny pomiar ziem pod naszą kontrolą przyniósłby nam ogromne korzyści, choć byłoby to przedsięwzięcie na wielką skalę."
 MUG_subahs_title: "Utworzenie sub"
 MUG_subahs_desc: "Rozwój naszego imperium nie ma precedensu. Aby sprawnie zarządzać wszystkimi nowymi poddanymi, musimy zreformować administrację i wprowadzić suby, w których nasi namiestnicy, subadarowie, pomogą utrzymać porządek i władzę cesarską."
 MUG_forcelimit_title: "Przeznaczenie Indii"
 MUG_forcelimit_desc: "Odbudowa imperium Timura jest daremnym przedsięwzięciem. Gdy staniemy się silniejsi, powrócimy do Persji. Na razie niech nasza dynastia zdobywców podbija dalej, tworząc nowe imperium nie w surowym Chorasan, lecz w bogatych Indiach. Przesądźmy o losie Hindustanu."
 MUG_rajputana_title: "Podporządkowanie Radźputany"
 MUG_rajputana_desc: "Radźputana nie jest bogatą krainą, a liczni drobni książęta nie stanowiliby samodzielnie zagrożenia. Dynastie radźpuckie władały jednak niegdyś północnymi Indiami, a ich krewni wciąż często rządzą niewielkimi państwami w całym regionie.\\n\\nAby zbudować trwałe imperium, musimy nauczyć radźpuckich królów i książąt, że powinni albo ugiąć kolana przed [Root.Monarch.GetTitle], albo stawić czoła całej potędze armii Mogołów."
 MUG_berar_title: "Za Windhje"
 MUG_berar_desc: "Wyżyna Malwa stanowi doskonałą bazę wypadową do ekspansji na południe Indii oraz do rozległego regionu Dekanu, oddzielającego nas od ziem Tamilów. Obszar ten pod wieloma względami różni się od ziem, które znamy. Wielu marzy o legendarnych diamentach Golkondy lub bogatych miastach handlowych Wybrzeża Koromandelskiego, lecz aby tam dotrzeć, musimy pokonać góry i dżungle, zwyciężyć miejscowe królestwa, a ostatecznie przygotować się do rządzenia ziemiami, których sułtani Delhi nigdy nie zdołali podporządkować.\\n\\nCzas przekroczyć Windhje."
 MUG_tolerant_society_title: "Tolerancyjne społeczeństwo"
 MUG_tolerant_society_desc: "Nasze imperium składa się z wyznawców wielu religii i przedstawicieli jeszcze większej liczby kultur. Dlatego Mogołowie muszą zachować tolerancję wobec wszystkich swoich poddanych. Pobłażliwość wobec innych obrządków może nie przypaść do gustu ulemom, lecz sprzyja rozwojowi i przetrwaniu naszego państwa."
 MUG_jizya_title: "Zniesienie dżizji"
 MUG_jizya_desc: "Podatek dżizja jest uciążliwy i niesprawiedliwy wobec ludności hinduistycznej. Zmniejszmy go lub całkowicie znieśmy, aby zyskać przychylność miejscowej ludności. Ubytek dochodów możemy zrekompensować w inny sposób."
 MUG_fatehpur_sikri_title: "Fatehpur Sikri"
 MUG_fatehpur_sikri_desc: "Nasze państwo od samego początku skupia wyznawców wielu religii. Nigdy nie mogliśmy więc polegać wyłącznie na lojalności współwyznawców. Zamiast tego powinniśmy wspierać dialog i debaty religijne, aby różnice można było rozwiązywać pokojowo.\\n\\nZbudujmy nową stolicę w pobliżu wielkiej Agry — cud architektury mogołskiej, który ukaże pełną chwałę naszej dynastii, a zarazem pomieści wyznawców wszystkich religii imperium. Specjalnie zaprojektowany dom modlitwy, w którym dżiniści, hinduiści, chrześcijanie, zaratusztrianie i przedstawiciele innych wyznań będą mogli debatować o wierze, pozwoli nam zgłębić duchowy świat."
 MUG_agra_title: "Klejnoty Agry"
 MUG_agra_desc: "Gdy Agra dostała się pod nasze panowanie, postanowiliśmy oszczędzić ją przed całkowitym złupieniem i zniszczeniem. W dowód wdzięczności miejscowi przywódcy podarowali nam cenne klejnoty. Po latach miasto, symbolizujące te skarby, stało się kandydatem na naszą stolicę. Uczyńmy z Agry wielki ośrodek sztuki i przepychu."
 MUG_mughal_architecture_title: "Architektura synkretyczna"
 MUG_mughal_architecture_desc: "Nasza architektura nie ma sobie równych. Wywodzimy się z sunnickiego Iranu, lecz budowle wznoszone przez nas w Indiach łączą tradycyjne miejscowe style z wpływami Zachodu, tworząc niezwykle wystawne połączenie."
 MUG_dahsala_title: "System dahsala"
 MUG_dahsala_desc: "Gwałtowna ekspansja imperium pozostawiła nas z wieloma różnymi formularzami i standardami zarządzania ziemią oraz podatkami. Stwórzmy zatem jednolity system, który przewyższy dotychczasowe rozwiązania i uczyni dzierżawę podatków zbędną."
 MUG_hindusthan_title: "Cesarz Hindustanu"
 MUG_hindusthan_desc: "Nizina Gangesu jest jednym z najbardziej urodzajnych miejsc na ziemi i zawsze była sercem każdego północnoindyjskiego imperium. Pod tym względem nie różnimy się od naszych poprzedników. Musimy podbić cały region równin, zanim będziemy mogli rozszerzyć nasze hindustańskie imperium."
 MUG_malwa_title: "Podbij Malwę"
 MUG_malwa_desc: "Z upadkiem fortec w zachodniej Radżputanie bogaty płaskowyż Malwa leży teraz przed nami. Podbój tego regionu zarówno powiększyłby skarbiec cesarski, jak i otworzyłby drogę do przyszłych kampanii przeciwko Gujaratowi i prowincjom Dekanu.\n\nNa nasze szczęście, Sułtan Malwy jest słaby i dał lokalnym grupom interesów zbyt wiele swobody. To pozostawiło ten obszar podzielony i łatwy do zintegrowania dla bardziej wydajnego państwa, takiego jak nasze."
 MUG_maidan_title: "Kontroluj Desh"
 MUG_maidan_desc: "W Ghatach Zachodnich znajduje się wiele małych fortów, które mogą być wykorzystane przez kawalerię Marathów jako bazy wypadowe przeciwko naszym poddanym i wojskom. Te wysokie i często gęsto zalesione wzgórza nie mogą pozostać wolne od naszych wpływów!"
 MUG_riches_title: "Bogactwa Indii"
 MUG_riches_desc: "Indie są regionem niezrealizowanego potencjału. Będziemy pierwszymi, którzy naprawdę przyniosą sprytne wykorzystanie bogactwa. Uczynimy Indie największą gospodarką na Ziemi"
 MUG_urbanize_the_subahs_title: "Urbanizacja sub"
 MUG_urbanize_the_subahs_desc: "W miarę jak Indie dostają się pod naszą kontrolę, na całym subkontynencie zapanowuje coraz większy pokój. Brak konfliktów pozwala nam rozwijać się jak nigdy dotąd i produkować coraz więcej żywności. Wraz ze wzrostem liczby ludności coraz więcej osób z niższych warstw społecznych przenosi się do miast, gdzie czekają na nie nowe możliwości."
 MUG_indian_entrepot_title: "Indyjskie centrum przeładunkowe"
 MUG_indian_entrepot_desc: "Towary indyjskie cieszą się popytem na całym świecie. Nasz subkontynent obfituje w metale szlachetne, przyprawy i tkaniny warte swojej wagi w złocie. Nie możemy pozwolić, by te bogactwa pozostały niewykorzystane."
 MUG_outward_title: "Zwrócenie się ku morzu"
 MUG_outward_desc: "Jako wielkie, ekspansjonistyczne imperium lądowe nie poświęcaliśmy dotąd wiele uwagi rozwojowi floty. Jeśli jednak chcemy prowadzić handel z innymi królestwami i utrzymać konkurencyjność, potrzebujemy odpowiednio silnej marynarki."
 MUG_western_allies_title: "Zachodni sojusznicy"
 MUG_western_allies_desc: "Wejście zachodnich potęg w politykę Indii zaczęło zmieniać sposób, w jaki postrzegamy działania wojenne, handel i marynarkę. Nadszedł czas, abyśmy nawiązali formalne stosunki z jedną z tych zachodnich potęg i wysłali własnych emisariuszy, aby z bliska zbadać ich społeczeństwo."
 MUG_nepal_title: "Oświeć Nepal"
 MUG_nepal_desc: "Podróżujący mnisi ciężko pracowali, próbując pokazać Nepalowi drogę Buddy. Musimy wspomóc ich wysiłki poprzez włączenie Nepalczyków do naszego państwa."
 MUG_bengal_title: "Bengalski port przeładunkowy"
 MUG_bengal_desc: "Delta Gangesu jest od tysięcy lat centralnym punktem dla przemysłu i handlu. Tutaj wschodni kupcy sprzedają swoje towary indyjskiej społeczności, podczas gdy towary z całych północnych Indii mogą płynąć w drugą stronę.\n\n Niedawne przybycie zachodnich kupców jeszcze bardziej uwydatniło tę dynamikę, a w całej delcie zaczęły powstawać miasta handlowe. Musimy dalej zachęcać do tego rozwoju i wspierać rozwój głównej przystani tutaj w Bengalu, pod naszym nadzorem."
 MUG_orissa_title: "Podbój Orisy"
 MUG_orissa_desc: "Wschodnie wybrzeże Orisy, położone między Ghatami a Zatoką Bengalską, nie jest tak bogate jak położone dalej na południe Wybrzeże Koromandelskie. Lokalni władcy udzielają więc schronienia właścicielom ziemskim i bengalskim bogaczom uciekającym przed sprawiedliwością Mogołów. \n\nNie możemy pozwolić na taką bezczelność, musimy przywrócić porządek w Orisie."
 MUG_andhra_title: "Bogactwa Golkondy"
 MUG_andhra_desc: "Słynąca z największego rynku diamentów na świecie twierdza Golkonda stała się w wielu językach synonimem bogactwa. Zarówno Golconda, jak i słynne kopalnie w Kollur leżą teraz przed nami otworem, zgodnie z powszechnym przekonaniem czekają na nas niewyobrażalne bogactwa..."
 MUG_coromandel_title: "Upadek Koromandelu"
 MUG_coromandel_desc: "Przed nami leży teraz Wybrzeże Koromandelu. Od setek, jeśli nie tysięcy lat, było ono głównym ośrodkiem indyjskiego handlu. Tutaj cudzoziemcy ze wschodu i zachodu zakładają placówki handlowe i fabryki, przywożąc wielkie ilości srebra, którego potrzebuje nasza gospodarka. Drogie tkaniny, przyprawy, kamienie szlachetne, perły i towary przemysłowe, które starają się przywieźć do swoich ojczyzn, są również łatwe do znalezienia w tym regionie, który jest domem dla wielkich miast Tamilów i Telugów z silnym doświadczeniem w przemyśle i handlu."
 MUG_malaya_both_title: "Wicekrólestwo Malakki"
 MUG_malaya_both_desc: "Archipelag Malajski jest kwitnącym centrum handlu. Teraz, gdy nawiązaliśmy bardziej bezpośredni kontakt z tą siecią handlową poprzez przejęcie portów Azji Południowo-Wschodniej, jest rzeczą naturalną, iż poszukujemy także lokalnej siedziby, z której moglibyśmy kontrolować i opodatkować lokalny ruch.\n\nMalakka jest dla nas pod wieloma względami idealną bazą operacyjną. Przedstawmy ten pomysł samym Malakkańczykom."
 MUG_malaya_coromandel_title: "Wicekrólestwo Malakki"
 MUG_malaya_coromandel_desc: "Archipelag Malajski jest kwitnącym centrum handlu. Teraz, gdy nawiązaliśmy bardziej bezpośredni kontakt z tą siecią handlową poprzez przejęcie portów Azji Południowo-Wschodniej, jest rzeczą naturalną, iż poszukujemy także lokalnej siedziby, z której moglibyśmy kontrolować i opodatkować lokalny ruch.\n\nMalakka jest dla nas pod wieloma względami idealną bazą operacyjną. Przedstawmy ten pomysł samym Malakkańczykom"
 MUG_malaya_ayutthaya_title: "Wicekrólestwo Malakki"
 MUG_malaya_ayutthaya_desc: "Archipelag Malajski jest kwitnącym centrum handlu. Teraz, gdy nawiązaliśmy bardziej bezpośredni kontakt z tą siecią handlową poprzez przejęcie portów Azji Południowo-Wschodniej, jest rzeczą naturalną, iż poszukujemy także lokalnej siedziby, z której moglibyśmy kontrolować i opodatkować lokalny ruch.\n\nMalakka jest dla nas pod wieloma względami idealną bazą operacyjną. Przedstawmy ten pomysł samym Malakkańczykom"
 MUG_weaving_title: "Bengalskie tkactwo"
 MUG_weaving_desc: "Bengal zasłynął z produkcji najdelikatniejszego jedwabiu. Jako jeden z ośrodków naszej protoindustrializacji musi nadal rozwijać zakłady produkcyjne w delcie Gangesu, aby utrzymać tę renomę."
 MUG_grand_trunk_road_title: "Grand Trunk Road"
 MUG_grand_trunk_road_desc: "Od niepamiętnych czasów Grand Trunk Road służy kupcom i armiom w północnych Indiach. Ta wielka droga łączy ważne miasta Hindustanu, od Bengalu po Kabul.\n\nMusimy odnowić Grand Trunk Road i nie szczędzić wydatków na jej utrzymanie. Istnieje również duże zapotrzebowanie na noclegi wzdłuż całego szlaku handlowego, które musimy zaspokoić poprzez wdrożenie systemów serais, gdzie kupcy mogą odpocząć i spędzić noc."
 MUG_hegemon_title: "Magazyn Wschodu"
 MUG_hegemon_desc: "Mogołowie wytwarzają już jedną czwartą wszystkich dóbr na świecie. Wykorzystajmy naszą nowo zdobytą potęgę gospodarczą, by wywierać wpływ na sąsiadów. Dzięki wzajemnej zależności ekonomicznej wszyscy będą musieli uwzględniać nasze interesy."
 MUG_rajputs_title: "Radźputowie w armii"
 MUG_rajputs_desc: "Pozyskanie lojalności radźpuckiej szlachty po podboju jej ziem przodków będzie zapewne wymagało ustępstw. Jeśli nadamy te ziemie radźpuckim dynastiom pod warunkiem służby na naszą rzecz, powinniśmy zapewnić sobie ich lojalność przynajmniej na pewien czas."
 MUG_recruitment_title: "Pułki hinduistyczne"
 MUG_recruitment_desc: "Nieustanne wojny podbojowe wyczerpały nasze siły zbrojne. Potrzebujemy nowych żołnierzy, którzy zastąpią poległych weteranów. W tym celu sięgnijmy po niemal nieograniczone zasoby ludzkie wśród ludności, która dzięki naszej tolerancyjnej polityce darzy nas przychylnością."
 MUG_punjab_title: "Spacyfikuj Pendżab"
 MUG_punjab_desc: "Kraina pięciu rzek jest domem dla potężnych afgańskich właścicieli ziemskich od czasu pierwszego podboju przez Mahmuda z Ghazni, setki lat temu. Ci lokalni władcy są pod wieloma względami przeszkodą dla naszego nowo narodzonego imperium i jeśli mamy przetrwać, musimy użyć twardej ręki, aby pokazać, że teraz oczekuje się od nich przestrzegania naszego prawa."
 MUG_afghan_frontier_title: "Granica afgańska"
 MUG_afghan_frontier_desc: "Kabulistan i Sistan od dawna były miejscami stacjonowania tych, którzy chcieliby najechać Indie. Region ten znajduje się zarówno w pobliżu ważnych przejść prowadzących na subkontynent, jak i jest domem dla wielu klanów, które specjalizują się w napadach i grabieży równiny pendżabskiej.\n\nMusimy podporządkować sobie ten region raz na zawsze i umieścić tu silne garnizony, które będą chronić nas przed obcymi najeźdźcami."
 MUG_abu_saids_dream_title: "Marzenie Abu Sa’ida"
 MUG_abu_saids_dream_desc: "Nawet wiele lat po upadku Timura jego imperium pozostało celem i marzeniem jego potomków. Abu Said zbliżył się do realizacji ponownego zjednoczenia tego imperium, ale ostatecznie poległ w tym, co nasi przodkowie nazywają wielką katastrofą Irako-Ajemiską.\n\nPodnieśmy tę upadłą pałeczkę i sięgnijmy dalej niż ci, którzy przyszli przed nami. Jesteśmy Gurkani, spadkobiercami wielkich zdobywców i nie boimy się żadnego żyjącego człowieka."
 MUG_tripura_title: "Wzdłuż Brahmaputry"
 MUG_tripura_desc: "Ze swoich źródeł w odległym Ngarim rzeka Brahmaputra przepływa przez cały Tybet, Arunaczal, po czym schodzi do Indii w Asamie, zanim połączy się z Gangesem w Bengalu. Mówi się, że ta dolina to bogata kraina, gdzie mieszkańcy potrafią sprawić, że ryż rośnie nawet w warunkach, w których powinno to być niemożliwe.\n\nPokonajmy dżungle doliny Brahmaputry i rozpocznijmy inwazję na Asam, ostatnią część północnych Indii, która nie jest jeszcze pod naszym panowaniem."
 MUG_burma_title: "Kampania płn-birmańska"
 MUG_burma_desc: "Za górami Arakan leży kraina bogata w minerały i kamienie szlachetne. Górna Birma to również nieprzyjazny region, będący domem dla wojowniczego ludu Shan, o który od wieków toczą się spory.\n\nNiemniej takiemu źródłu rubinów, większemu niż jakiekolwiek inne na ziemi, nie sposób się oprzeć."
 MUG_ayutthaya_title: "Subah Ajutthaji"
 MUG_ayutthaya_desc: "Miasto Ayutthaja - lub Ayuddhaja - jest być może największym z miast Azji Południowo-Wschodniej, ale nie jest to kres naszych ambicji w regionie. Rozszerzmy nasz wpływ na całe Królestwa Tajlandii i Khmerów i dodajmy tę krainę tysiąca słoni do Imperium Mogołów"
 MUG_china_title: "Otwarcie Chin"
 MUG_china_desc: "Nasza ostatnia ekspansja zaprowadziła nas pod granice Cesarstwa Chin. Państwo Środka zawsze było odległym gigantem. Kraj o bogactwie i liczbie ludności dorównującej całemu subkontynentowi indyjskiemu, lecz nie tak podzielony jak Indie. Chiny były stabilne i scentralizowane.\n\nChińczycy wydają się niechętni do współpracy na naszych warunkach, ale nie możemy pozwolić, aby [Root.Monarch.GetTitle] władca potężnego imperium Mogołów im uległ. Nauczmy to stare imperium, co nasz nowo ukształtowany stan może osiągnąć..."
 MUG_industry_title: "Podstawa potęgi przemysłowej"
 MUG_industry_desc: "Bogactwa Indii przynoszą nam znaczne dochody z handlu. Gdyby tylko istniał sposób, by pozyskiwać jeszcze więcej tych dóbr... Oczywiście taki sposób istnieje — musimy go jedynie odkryć. To powinno być teraz naszym najważniejszym zadaniem."
 MUG_economic_power_title: "Potęga gospodarcza"
 MUG_economic_power_desc: "Wraz z postępem industrializacji nie możemy porzucić ambicji stania się hegemonem gospodarczym. Pewnego dnia będziemy wytwarzać jedną czwartą światowych dóbr. Przy naszych zasobach cel ten jest całkiem realny."
 MUG_mansabdars_title: "Ustanowienie mansabdarów"
 MUG_mansabdars_desc: "Zarządzanie ogromną populacją i wielką armią jest zadaniem wymagającym niezwykłego wysiłku. Ustanówmy nową rangę wojskową, której przedstawiciele będą odpowiadać za rekrutację i pułki."
 MUG_cavalry_title: "Wojna manewrowa"
 MUG_cavalry_desc: "Szarżę naszej kawalerii można opisać na wiele sposobów, ale przede wszystkim jest ona gwałtowna i niezwykle mobilna. Nasi jeźdźcy, sowarowie, słyną z niezłomnego ducha na polu bitwy. Wykorzystajmy ich atuty lub postawmy na jeszcze potężniejsze oddziały uderzeniowe."
 MUG_gunpowder_empire_title: "Imperium prochu"
 MUG_gunpowder_empire_desc: "Nasze mistrzostwo w posługiwaniu się prochem pozwoliło nam rozgromić wrogów i utrzymać tak rozległe imperium. Do dziś dysponujemy licznymi pułkami artylerii, gotowymi zasypać przeciwnika ogniem dział."
