 nahuatl_tributary: "Mezoamerykańskie państwo trybutarne"
 nahuatl_tributary_long_desc: "Mezoamerykańskie państwa trybutarne działają tak samo jak zwykli trybutariusze, z tą różnicą, że można składać w ofierze ich władców i następców tronu w zamian za zmniejszenie Zagłady."
