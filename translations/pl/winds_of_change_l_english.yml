 TIM_unlock_timurid_diwan_reform: "Odblokuj reformę rządową §YDiwan Timurydów§!, zapewniającą następujące korzyści:\\nZmiana okresu odnowienia priorytetu narodowego: §G-5§! lat\\nZdolność rządzenia: §G+150.00§!\\n\\n§YMechanika rządowa§!:\\nOtrzymamy dodatkowe modyfikatory zależne od aktualnego §Ypriorytetu narodowego§!:\\n §YAdministracyjny§!: Roczna korupcja: §G-0.15§!\\n §YDyplomatyczny§!: Niepokoje narodowe: §G-1.00§!\\n §YWojskowy§!: Koszt utrzymania wojsk lądowych: §G-10.0%§!"
