 GMA: "Wielkie Morawy"
 GMA_ADJ: "Wielkomorawski"
 GMA_ideas: "Idee wielkomorawskie"
 GMA_ideas_start: "Tradycje wielkomorawskie"
 GMA_ideas_bonus: "Ambicje wielkomorawskie"
 gma_reforge_moravias_hegemony: "Odbudowa hegemonii Moraw"
 gma_reforge_moravias_hegemony_desc: "Na długo przed powstaniem obecnych mocarstw Europy nasi przodkowie stworzyli potężne państwo rozciągające się od Łużyc po równiny Panonii. Jako ich prawowici następcy mamy przyrodzone prawo przywrócić hegemonię Moraw w Europie Środkowej."
 gma_apostles_to_the_slavs: "Apostołowie Słowian"
 gma_apostles_to_the_slavs_desc: "Aby szerzyć chrześcijaństwo wśród swoich poddanych, Rościsław morawski wysłał list do Bizantyńczyków, którzy przysłali nauczycieli mających krzewić nową wiarę. Dzięki tej świętej misji Morawy stały się pierwszym słowiańskim państwem, które oficjalnie przyjęło chrześcijaństwo. Doprowadziło to do powstania pierwszego pisma słowiańskiego, a nawet uznania języka słowiańskiego przez Stolicę Apostolską za czwarty język liturgiczny."
 gma_princes_of_nitra_kings_of_moravia: "Książęta Nitry, królowie Moraw"
 gma_princes_of_nitra_kings_of_moravia_desc: "Według dawnej tradycji władcy Moraw przed objęciem tronu w Welehradzie rządzili księstwem nitrzańskim. Dzięki temu, gdy przejmowali władzę nad krajem, mieli już odpowiednie doświadczenie w sztuce rządzenia i administracji."
 gma_rebuild_veligrad: "Odbudowa Welehradu"
 gma_rebuild_veligrad_desc: "Welehrad był potężną stolicą Wielkich Moraw, lecz po upadku władzy centralnej padł ofiarą najazdów Madziarów. Jeśli naprawdę chcemy odzyskać dziedzictwo Moraw, musimy ponownie odbudować Welehrad i uczynić go naszą stolicą."
 gma_rex_sclavorum: "Rex Sclavorum"
 gma_rex_sclavorum_desc: "W 885 roku papież Stefan V wysłał list do Świętopełka I morawskiego, zwracając się do niego tytułem Rex Sclavorum – Król Słowian. Uznanie tytułu królewskiego zapewniło mu nie tylko legitymizację, lecz także prawo do rozszerzania państwa i nawracania innych ludów słowiańskich na chrześcijaństwo."
 gma_canonize_cyril_methodius: "Kanonizacja Cyryla i Metodego"
 gma_canonize_cyril_methodius_desc: "Konstantyn, później znany jako Cyryl, oraz Metody byli dwoma bizantyńskimi uczniami wysłanymi na Morawy przez Michała III. Dzięki ich wysiłkom Morawy stały się pierwszym schrystianizowanym państwem słowiańskim, a dziedzictwo ich misji przetrwało na Bałkanach i Rusi. Aby uczcić ich spuściznę, powinniśmy dążyć do ich kanonizacji."
 gma_svatopluks_legacy: "Dziedzictwo Świętopełka"
 gma_svatopluks_legacy_desc: "Świętopełk był królem Moraw, za którego panowania Wielkie Morawy osiągnęły największy zasięg terytorialny. Rządził żelazną ręką, a dzięki talentom dyplomatycznym zdołał odeprzeć potężne armie Franków Wschodnich oraz pogańskie hordy Madziarów. Jego dziedzictwo będzie inspiracją dla naszego państwa, abyśmy mogli ponownie przeżyć chwalebne dni jego panowania."
 boh_shield_of_the_true_faith_title: "[Root.GetPreviewColorBOH_RELIGION]Tarcza prawdziwej wiary[Root.GetPreviewColorBOH_RELIGION_end]"
 boh_shield_of_the_true_faith_desc: "Udowodniliśmy już, że potrafimy walczyć z herezjami zagrażającymi chrześcijaństwu. Przyjmijmy oficjalnie tytuł obrońców naszej wiary, by z dumą stanąć jako czempioni krzyża."
 boh_catholic_empire_title: "[Root.GetPreviewColorBOH_RELIGION]Katolickie imperium[Root.GetPreviewColorBOH_RELIGION_end]"
 boh_catholic_empire_desc: "Jako tarcza naszej wiary mamy święty obowiązek chronić prawdziwą naukę przed tymi, którzy pragną ją wypaczyć. Musimy zdecydowanie przeciwstawić się herezjom szerzącym się w całym Cesarstwie i ponownie uczynić Święte Cesarstwo Rzymskie świętym!"
 boh_hungarian_succession_title: "Węgierska sukcesja"
 boh_hungarian_succession_desc: "Jeszcze niedawno Święta Korona Węgier znajdowała się pod naszą kontrolą. Druzgocąca klęska w bitwie pod Warną pozostawiła tron w Budzie pusty, dając nam doskonałą okazję, by wysunąć nasze roszczenia i ponownie go odzyskać."
 boh_claim_the_holy_crown_title: "Zdobądź Świętą Koronę"
 boh_claim_the_holy_crown_desc: "Węgry i Czechy były wcześniej zjednoczone pod jednym królem, a rozdzielone zostały dopiero w 1439 r. wraz ze śmiercią Alberta II Habsburga. Powinniśmy przywrócić ten słuszny stan rzeczy."
 boh_protect_against_the_turk_title: "Ochrona przed Turkiem"
 boh_protect_against_the_turk_desc: "Turcy osmańscy są zaangażowani w niebezpieczny podbój terytorialny, który grozi pochłonięciem chrześcijaństwa. Musimy dopilnować, by granice zostały ufortyfikowane przed nieuchronnym tureckim atakiem."
 boh_revenge_for_nicopolis_title: "Zemsta za Nikopolis"
 boh_revenge_for_nicopolis_desc: "W 1396 roku korona czeska wyruszyła na sprawiedliwą krucjatę przeciwko Turkom w Bułgarii, ale została pokonana przez pogan. Musimy ponownie zebrać nasze siły, odbić Bułgarię i przepędzić Turków z powrotem za morze!"
 boh_liberate_the_balkans_title: "Wyzwolenie Bałkanów"
 boh_liberate_the_balkans_desc: "Obcy ciemiężyciele zbyt długo gnębili Bałkany. Silna obecność Czech przyniesie im wyzwolenie. Pod naszym sprawiedliwym panowaniem mieszkańcy Bałkanów zaznają wolności i dobrobytu."
 boh_hussite_regency_title: "Zakończenie regencji"
 boh_hussite_regency_desc: "Konflikt między różnymi odłamami husytów a zwolennikami Kościoła rzymskiego zakończył się kruchym porozumieniem. Niepewność związana z sukcesją ponownie wywołuje napięcia między stronnictwami religijnymi. Musimy rozstrzygnąć kwestię następstwa tronu i zdecydowanie określić nasze stanowisko wobec ortodoksji religijnej."
 boh_hussite_resurgence_title: "[Root.GetPreviewColorBOH_RELIGION]Odrodzenie husytyzmu[Root.GetPreviewColorBOH_RELIGION_end]"
 boh_hussite_resurgence_desc: "Pomimo, a może właśnie z powodu śmierci Jana Husa w 1415 roku, zwolennicy ruchu husyckiego przez wiele lat żywili do nas gorzką urazę. Konflikty ponownie stanęły na ostrzu noża i jest tylko kwestią czasu, kiedy będziemy musieli dokonać wyboru w imieniu naszego ludu."
 boh_defenestrate_the_heretics_title: "[Root.GetPreviewColorBOH_RELIGION]Wyrzucić heretyków przez okno[Root.GetPreviewColorBOH_RELIGION_end]"
 boh_defenestrate_the_heretics_desc: "Reformacja przetacza się przez Europę, a nasza historia nieortodoksji stawia nas na czele teologicznego i politycznego konfliktu. Musimy stanąć w obronie prawdziwej wiary i wyrzucić naszych heretyckich wrogów przez okno!"
 boh_recover_nitrava_title: "Odzyskać Nitravę"
 boh_recover_nitrava_desc: "Państwo wielkomorawskie, poprzednik Czech, rozciągało się niegdyś daleko poza tereny Czech. Powinniśmy dążyć do ponownego rozszerzenia naszych granic, poczynając od aneksji starego Księstwa Nitry."
 boh_electorate_of_saxony_title: "Elektorat Saksonii"
 boh_electorate_of_saxony_desc: "Potrzebujemy wsparcia dodatkowych elektorów. W następnej kolejności powinniśmy skupić się na elektorze Saksonii, ponieważ od dawna szukaliśmy okazji do przejęcia kontroli nad Dreznem."
 boh_bohemian_crystal_title: "Czeski kryształ"
 boh_bohemian_crystal_desc: "Produkcja szczególnie pięknych wyrobów ze szkła stała się popularna w naszym królestwie. Powinniśmy promować ten przemysł i zapewnić, że nasze dzieła będą cenione na europejskich dworach."
 boh_bozi_bojovnici_title: "Boží bojovníci"
 boh_bozi_bojovnici_desc: "Podczas wojen husyckich husyci zrewolucjonizowali wykorzystanie opancerzonych wozów na polu bitwy, co pozwoliło im zwyciężać mimo przytłaczającej przewagi przeciwnika. Niezależnie od naszego stosunku do husytów, nierozsądnie byłoby porzucić tę skuteczną taktykę."
 boh_humiliate_austria_title: "Upokórz Austrię"
 boh_humiliate_austria_desc: "Austria nadużywa cesarskiego tronu i nie ukrywa swoich planów podporządkowania sobie naszego narodu. Musimy pokazać książętom Niemiec i całemu światu, że Austria nie jest tak potężnym potworem, za jakiego się podaje."
 boh_otakars_legacy_title: "Dziedzictwo Przemysła Ottokara"
 boh_otakars_legacy_desc: "Upokorzywszy Habsburgów, musimy teraz rozszerzyć nasze wpływy na ich ziemie, aby umocnić naszą pozycję w Cesarstwie — tak jak przed wiekami uczynił Przemysł Ottokar."
 boh_reforge_great_moravia_title: "Odbudować Wielkie Morawy"
 boh_reforge_great_moravia_desc: "Niegdyś Wielkie Morawy, latarnia słowiańskiej jedności, jaśniały pełnym blaskiem. Nadszedł czas, by ponownie rozpalić ich płomień i zjednoczyć wszystkich Słowian, stając się jedynymi prawowitymi spadkobiercami Rościsława i Świętopełka."
 boh_lion_of_the_empire_title: "Lew cesarstwa"
 boh_lion_of_the_empire_desc: "Jako jedyne prawdziwie scentralizowane państwo i królestwo w obrębie Świętego Cesarstwa Rzymskiego mamy doskonałą pozycję, by wysuwać roszczenia i wykorzystywać słabość struktur Cesarstwa dla własnej korzyści. Jesteśmy lwem Cesarstwa i sięgniemy po przeznaczoną nam przyszłość!"
 boh_bohemian_commonwealth_title: "Rzeczpospolita Czeska"
 boh_bohemian_commonwealth_desc: "Musimy spojrzeć poza to, co tradycyjnie uważano za Czechy, aby ustanowić większą wspólnotę. Nasze imperium obejmie Europę Środkową i zajmiemy miejsce wśród wielkich mocarstw świata."
 boh_the_golden_city_title: "Złote miasto"
 boh_the_golden_city_desc: "Praga, nazywana niekiedy Złotym Miastem, jest dumą naszego królestwa i jednym z najważniejszych miast całej Europy. Powinniśmy zadbać, by zasłużyła na swój przydomek i przyćmiła wszystkie stolice naszych rywali."
 boh_reform_the_bergordnung_title: "Zreformować Bergordnung"
 boh_reform_the_bergordnung_desc: "Odkrywane są nowe zastosowania węgla, które mogą zrewolucjonizować przemysł na całym świecie. Powinniśmy zreformować prawo górnicze, aby rozpocząć wydobycie węgla z maksymalną wydajnością."
 boh_czech_heavy_industry_title: "Czeski przemysł ciężki"
 boh_czech_heavy_industry_desc: "Kontrolowane przez nas ziemie obfitują w surowce napędzające trwającą rewolucję przemysłową. Wykorzystajmy je właściwie i ożywmy gospodarkę dzięki ogromnym inwestycjom w produkcję i przetwórstwo."
 boh_vistula_land_title: "Zabezpieczyć ziemie nad Wisłą"
 boh_vistula_land_desc: "Strategiczne położenie i potencjał handlowy ziem nadwiślańskich są zbyt istotne, by je zlekceważyć. Ich zabezpieczenie zwiększy wpływy naszego państwa i ograniczy polskie wpływy oraz zdolność Polski do zagrożenia nam."
 boh_electorate_of_brandenburg_title: "Elektorat Brandenburgii"
 boh_electorate_of_brandenburg_desc: "Jeśli chcemy zapewnić sobie tron Świętego Cesarstwa Rzymskiego, będziemy potrzebować poparcia elektorów. A czy jest lepszy sposób na zdobycie głosów niż podporządkowanie Brandenburgii naszym politycznym zachciankom?"
 boh_municipal_works_title: "Przemysł czeski"
 boh_municipal_works_desc: "Królestwo Czech nie może pozostawać w tyle za sąsiadami pod względem industrializacji. Warto zainwestować w rozwój naszej pozycji w tej dziedzinie, wspierając tym samym rozbudowę przemysłu."
 boh_univerzita_karlova_title: "Uniwersytet Karola"
 boh_univerzita_karlova_desc: "Uniwersytet Karola jest jedną z najstarszych uczelni na świecie. Musimy zadbać, by nadal pozostawał ostoją nauki i kultury naszego państwa."
 boh_consolidate_silesia_title: "Zjednocz Śląsk"
 boh_consolidate_silesia_desc: "Teraz, gdy nasza własny domena jest uporządkowana, powinniśmy spojrzeć na naszą królewszczyznę. Śląsk zawsze był częścią naszego królestwa i najwyższy czas, by cieszył się pełnym statusem w naszym społeczeństwie."
 boh_polish_diplomacy_title: "Polska dyplomacja"
 boh_polish_diplomacy_desc: "Charakter monarchii elekcyjnej w Polsce jest okazją dla naszych dyplomatów do promowania czeskiego następcy polskiego tronu.  Powinniśmy upewnić się, że w Polsce rządzi czeska dynastia."
 boh_premyslid_heritage_title: "Dziedzictwo Przemyślidów"
 boh_premyslid_heritage_desc: "Czechy znów mają władzę. Jednak jeden z margrabiów na naszym dworze chytrze zauważył, że mamy uzasadnione roszczenia do ziem naszych przodków, Przemyślidów. Czasy poszły do przodu, granice się przesunęły, ale wierzymy, że niektóre z tych roszczeń nadal mają znaczenie."
 boh_pomerelian_reconquest_title: "Odzyskaj Pomorze Gdańskie"
 boh_pomerelian_reconquest_desc: "Sukces naszego podboju wciąż brzmi w naszych uszach. Ziemie pomorskie na północy również znajdowały się pod kontrolą Wacława II, a zatem muszą należeć do nas."
 boh_restore_kralovec_title: "Przywrócić Królewiec"
 boh_restore_kralovec_desc: "Miasto Königsberg zostało założone ku czci naszego króla Przemysła Ottokara II. Pod panowaniem zakonu krzyżackiego stało się jednak jedynie cieniem dawnej świetności i znaczenia. Najwyższy czas, by Królewiec powrócił pod berło Czech i odzyskał dawny splendor."
 boh_karels_claims_title: "Roszczenia Karola IV"
 boh_karels_claims_desc: "Za panowania Karola IV Czechy przeżywały złoty wiek, dzierżąc koronę cesarską i będąc niekwestionowanym władcą całego Cesarstwa. Uhonorowanie dziedzictwa Karola IV wymaga realizacji jego roszczeń i odzyskania przez nas korony cesarskiej."
 boh_reformatio_sigismundi_title: "Reformacja Zygmuntowska"
 boh_reformatio_sigismundi_desc: "Cesarz Zygmunt, były król Czech, zaplanował wielką reformę Świętego Cesarstwa Rzymskiego. Powinniśmy kontynuować jego dziedzictwo i skierować Cesarstwo na nową, chwalebną ścieżkę."
 boh_peace_in_europe_title: "Pokój w Europie"
 boh_peace_in_europe_desc: "Od pokoleń Europę nękają wojny między wielkimi mocarstwami i pomniejszymi książętami. Nadszedł czas, by położyć kres konfliktom. Pod naszymi życzliwymi rządami znacznie powiększymy Cesarstwo, aby zapoczątkować złoty wiek pokoju i dobrobytu."
 boh_hussite_empire_title: "[Root.GetPreviewColorBOH_RELIGION]Imperium husyckie[Root.GetPreviewColorBOH_RELIGION_end]"
 boh_hussite_empire_desc: "Katolickie próby powstrzymania nas przed głoszeniem prawdziwej nauki ludowi spełzły na niczym. Wiara husycka zatriumfowała, nadszedł więc czas, by oficjalnie sięgnąć po godność cesarską i przekształcić Święte Cesarstwo Rzymskie w prawdziwe Imperium Husyckie!"
 boh_vladislav_hall_title: "Sala Władysławowska"
 boh_vladislav_hall_desc: "Sala Władysławowska jest największą salą Zamku Praskiego. Służyła do organizacji rozmaitych uroczystości publicznych, przyjęć, koronacji, a nawet turniejów rycerskich. Utrzymanie jej wspaniałości będzie świadectwem chwały naszego państwa."
 boh_control_the_electors_title: "Kontroluj Elektorów"
 boh_control_the_electors_desc: "Jako jedno z najpotężniejszych państw Cesarstwa nie kryjemy zainteresowania tronem cesarskim. Zaledwie kilka dekad temu Cesarstwem władał czeski król, dlatego odzyskanie korony byłoby dla nas niezwykle korzystne."
 boh_recover_from_hussite_wars_title: "Odzyskiwanie sił po wojnach husyckich"
 boh_recover_from_hussite_wars_desc: "Wojny husyckie zdewastowały ziemie Korony Czeskiej. Zanim po raz kolejny skoncentrujemy się na sprawach zewnętrznych, musimy dostrzec przywrócenie porządku wewnętrznego."
 boh_purge_hussite_heresy_title: "[Root.GetPreviewColorBOH_RELIGION]Wykorzenić herezję husycką[Root.GetPreviewColorBOH_RELIGION_end]"
 boh_purge_hussite_heresy_desc: "Choć radykalni husyci zostali pokonani podczas wojen husyckich, na ziemiach Korony Czeskiej wciąż działają liczne ogniska oporu. Musimy stanowczo się z nimi rozprawić i wykorzenić ich heretyckie nauki, w przeciwnym razie ryzykujemy kolejnym rozlewem krwi."
 boh_branching1_title: "Misja z rozgałęzieniem"
 boh_branching1_desc: "Skutki tej misji zależą od sposobu którym ukończymy misję '§YZakończ regencje§!'."
 boh_branching2_title: "Misja z rozgałęzieniem"
 boh_branching2_desc: "Skutki tej misji zależą od sposobu którym ukończymy misję '§YZakończ regencje§!'."
 boh_branching3_title: "Misja z rozgałęzieniem "
 boh_branching3_desc: "Skutki tej misji zależą od sposobu którym ukończymy misję '§YZakończ regencje§!'."
 moravia_nitra_gain_independence_title: "Odzyskaj niepodległość"
 moravia_nitra_gain_independence_desc: "Od stuleci nasze państwo pozostaje poddanym obcych mocarstw. Jeśli chcemy przywrócić potęgę Wielkich Moraw, musimy zerwać kajdany ciemiężycieli i odzyskać niepodległość."
 moravia_nitra_unite_the_principalities_title: "Zjednoczenie księstw"
 moravia_nitra_unite_the_principalities_desc: "Ziemie serca Wielkich Moraw obejmowały dwa księstwa — Morawy i Nitry. Musimy przywrócić władzę nad oboma, aby móc ogłosić się prawowitymi dziedzicami wielkomorawskiego dziedzictwa."
 moravia_nitra_reforge_great_moravia_title: "Przywróć Wielkie Morawy"
 moravia_nitra_reforge_great_moravia_desc: "Po odbiciu ziem, które kiedyś należały do ​​Wielkich Moraw, najwyższy czas, abyśmy oficjalnie ogłosili ich pełne przywrócenie!"
 moravia_nitra_svatopluks_city_title: "Miasto Świętopełka"
 moravia_nitra_svatopluks_city_desc: "Zanim zostało zniszczone przez hordy Madziarów, potężne miasto Welehrad było siedzibą władców Moraw, skąd rządzili rozległym państwem rozciągającym się od wzgórz Łużyc po równiny Panonii. Odbudowa miasta powinna być naszym najwyższym priorytetem."
 moravia_nitra_rex_sclavorum_title: "Rex Sclavorum"
 moravia_nitra_rex_sclavorum_desc: "W liście papieża Stefana V Świętopełk Morawski został nazwany królem Słowian — tytułem, który pragniemy odzyskać. Przywrócenie dawnej chwały nie powinno być jednak naszym jedynym celem. Musimy wyjść poza historyczne osiągnięcia naszych przodków i stworzyć prawdziwe Wielkie Imperium Morawskie!"
 rekindle_the_hussite_wars_aspect: "Roznieć na nowo wojny husyckie"
 desc_rekindle_the_hussite_wars_aspect: "Umocniliśmy już naszą pozycję, nadszedł więc czas, by szerzyć nauki Husa i przeciwstawić się fałszywym naukom Rzymu."
 restore_veligrad_title: "Odbuduj Welehrad"
 restore_veligrad_desc: "Zanim został spustoszony przez hordy Madziarów, Welehrad był największym miastem całej Europy Środkowej. To tutaj Konstantyn i Metody prowadzili swoją misję apostolską, a Rościsław i Świętopełk rządzili rozległym państwem żelazną ręką. Przywróciliśmy już miastu dawną świetność i wielu sugeruje, że dla dalszego umocnienia naszej legitymacji powinniśmy ponownie uczynić Welehrad stolicą."
 boh_release_prussia_title: "Uwolnić Prusy"
 boh_release_prussia_desc: "Nasze związki z Prusami sięgają panowania Przemysła Ottokara II, gdy Korona Czeska miała znaczne wpływy na ziemiach Świętego Cesarstwa Rzymskiego. Ponownie kontrolujemy te tereny, dlatego zaproponowano utworzenie księstwa pruskiego. Odciążyłoby to naszą administrację, a zarazem stworzyło państwo buforowe chroniące przed najazdami znad Bałtyku."
 boh_transfer_nitra_title: "Przekazać zwierzchnictwo nad Nitrą"
 boh_transfer_nitra_desc: "Księstwo Nitry dostało się pod panowanie węgierskie po rozpadzie Wielkich Moraw. Choć przez pewien czas zachowało autonomię, król Koloman zniósł prawa książęce Nitry. Od tego czasu Nitra i Słowacy nie mieli na Węgrzech żadnej szczególnej pozycji. Skoro teraz władają nami Węgry, nadszedł czas na reorganizację naszych ziem i ponowne zjednoczenie Księstwa Nitry z naszą koroną."
 boh_abolish_the_elective_monarchy_title: "Zniesienie monarchii elekcyjnej"
 boh_abolish_the_elective_monarchy_desc: "Zbyt długo stany czeskie miały wpływ na wybór króla. Wraz z rozprzestrzenianiem się idei oświeconego absolutyzmu w Europie nadszedł czas, by przejąć Koronę św. Wacława i na zawsze zabezpieczyć ją dla naszej dynastii."
 great_moravia_title: "Przywróć Wielkie Morawy"
 great_moravia_desc: "Jako dumny naród [Root.GetName] mamy bogatą historię sięgającą czasów Imperium Wielkomorawskiego. Nasi przodkowie władali niegdyś rozległym państwem w sercu Europy, dowodząc naszego potencjału. Nadszedł czas, by odzyskać chwalebną przeszłość i odbudować Wielkie Morawy."
 boh_hussite_destruction: "Husycka destrukcja "
 desc_boh_hussite_destruction: "Wojny husytowe wywarły niszczycielski wpływ na nasz kraj i nadal nie doszliśmy do siebie."
 boh_great_city_of_svatopluk: "Wielkie miasto Rościsława i Świętopełka"
 desc_boh_great_city_of_svatopluk: "Welehrad — wielkie miasto Rościsława i Świętopełka — jest świadectwem ich dziedzictwa. Miasto powstało z popiołów i stanowi kolejny element naszych starań o odrodzenie ducha Wielkich Moraw."
 boh_czechoslovak_brotherhood: "Bractwo Czesko-Słowackie"
 desc_boh_czechoslovak_brotherhood: "Dzielimy ze Słowakami wiele podobieństw i wspólnych kart historii. Uczyńmy ich równymi sobie, aby braterstwo czesko-słowackie stało się świadectwem jedności naszego narodu."
 boh_carpathian_intervention: "Karpacka interwencja"
 desc_boh_carpathian_intervention: "Zainterweniujmy w walce o koronę węgierską i zabierzmy ją dla siebie."
 boh_lion_of_the_empire: "Lew cesarstwa"
 desc_boh_lion_of_the_empire: "Jako Lew Imperium nasz naród budzi szacunek i strach. Wykorzystajmy naszą dominującą pozycję, by umocnić w nim nasze wpływy."
 boh_humiliated_habsburgs: "Upokorzyć Habsburgów"
 desc_boh_humiliated_habsburgs: "Nasze zwycięstwo nad Habsburgami upokorzyło ich i osłabiło. Daje nam to doskonałą okazję, by usunąć ich wpływy ze Świętego Cesarstwa Rzymskiego i odzyskać je dla siebie."
 boh_otakars_legacy: "Dziedzictwo Przemysła Ottokara"
 desc_boh_otakars_legacy: "Odzyskaliśmy zwierzchnictwo nad Austrią i udowodniliśmy, że zasługujemy na miano dziedziców trwałego dziedzictwa Przemysła Ottokara."
 boh_spread_word_of_hus: "Szerzyć nauki Husa"
 desc_boh_spread_word_of_hus: "Nauki Husa rozprzestrzeniły się daleko, wpływając na naszą kulturę i społeczeństwo. Szerzmy je również poza granicami naszego państwa."
 boh_purge_hussites: "Czystka husytów"
 desc_boh_purge_hussites: "Husyci zostali poddani czystce, co przywróciło stabilność i porządek na naszych ziemiach."
 boh_early_industrialization: "Wczesna industrializacja"
 desc_boh_early_industrialization: "Nasze mądre inwestycje w przemysł i produkcję napędziły naszą gospodarkę."
 boh_recovered_from_hussite_wars: "Odbudowa po wojnach husyckich"
 desc_boh_recovered_from_hussite_wars: "Po dziesięcioleciach trudów wreszcie podnieśliśmy się ze zniszczeń spowodowanych wojnami husyckimi."
 boh_pravda_vitezi: "Prawda zwycięża"
 desc_boh_pravda_vitezi: "„Pravda vítězí” — prawda zwycięża — to naczelna zasada naszego narodu. Dopóki będziemy jej wierni, nic na świecie nas nie pokona!"
 boh_workshop_of_the_world: "Warsztat świata"
 desc_boh_workshop_of_the_world: "Dzięki inwestycjom w rozwój produkcji nasz kraj stał się światowym centrum innowacji i wytwórczości."
 boh_workshop_of_the_world2: "Warsztat świata"
 desc_boh_workshop_of_the_world2: "Dzięki inwestycjom w rozwój produkcji nasz kraj stał się światowym centrum innowacji i wytwórczości."
 boh_luxembourg_legacy: "Dziedzictwo Luksemburgów"
 desc_boh_luxembourg_legacy: "Dziedzictwo Luksemburgów na trwałe zapisało się w historii naszego państwa. Teraz, gdy ponownie kontrolujemy cesarską koronę, zdołaliśmy odzyskać to, co nam się należy!"
 boh_svatopluks_heir: "Spadkobierca Świętopełka"
 desc_boh_svatopluks_heir: "Jako następca Świętopełka nasz władca kontynuuje jego wizję i ambicje. Osiągnijmy jeszcze więcej niż nasi poprzednicy z Moraw!"
 boh_centralized_power: "Scentralizowana władza"
 desc_boh_centralized_power: "Po stuleciach wreszcie uwolniliśmy Koronę spod wpływów stanów. Scentralizowana struktura władzy zapewnia sprawność i stabilność."
 boh_hegemon: "Czeska hegemonia"
 desc_boh_hegemon: "Nasz naród jest europejski hegemonem - latarnią władzy i wpływów."
 boh_premyslid_heritage_1: "Dziedzictwo Przemyślidów"
 desc_boh_premyslid_heritage_1: "Bogate dziedzictwo Przemyślidów jest źródłem naszej dumy i tożsamości. Musimy nadal je szanować i pielęgnować!"
 boh_premyslid_heritage_2: "Dziedzictwo Przemyślidów"
 desc_boh_premyslid_heritage_2: "Bogate dziedzictwo Przemyślidów jest źródłem naszej dumy i tożsamości. Musimy nadal je szanować i pielęgnować!"
 boh_premyslid_heritage_3: "Rzeczpospolita Czeska"
 desc_boh_premyslid_heritage_3: "Czeska Wspólnota rozkwita! Pokonaliśmy wrogów i staliśmy się niekwestionowanym hegemonem Europy."
 boh_pearl_of_the_baltics: "Perła Bałtyku"
 desc_boh_pearl_of_the_baltics: "Królewiec lśni niczym Perła Bałtyku, zachwycając pięknem i dobrobytem."
 boh_reformatio_sigismundi_hre: "Reformatio Sigismundi"
 desc_boh_reformatio_sigismundi_hre: "Reformatio Sigismundi odmieniła Święte Cesarstwo Rzymskie, a nasze państwo znalazło się w samym centrum tych przemian."
 boh_cultural_integration: "Integracja kulturowa"
 desc_boh_cultural_integration: "Będziemy dążyć do zacieśnienia więzi kulturowych z naszymi germańskimi poddanymi w Świętym Cesarstwie Rzymskim, aby umocnić jedność i zgodę."
 boh_balkan_subjugation: "Wyzwolenie Bałkanów"
 desc_boh_balkan_subjugation: "Nasz udany podbój Bałkanów rozszerzył nasze terytorium i wpływy. Narody bałkańskie są wreszcie wolne od osmańskich rządów i mogą cieszyć się pokojem pod naszymi sprawiedliwym rządami."
 boh_golden_city: "Złote miasto"
 desc_boh_golden_city: "Praga, złote miasto, olśniewa swoim bogactwem i blaskiem. Wkrótce nasza stolica będzie budzić zazdrość całego znanego świata."
 boh_shield_of_true_faith: "Tarcza prawdziwej wiary"
 desc_boh_shield_of_true_faith: "Nasze państwo jest Tarczą Prawdziwej Wiary, która broni jej przed herezją i fałszem."
