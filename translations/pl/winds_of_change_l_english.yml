 flavor_azt.19.t: "Władcy jeziora"
 flavor_azt.19.d: "Nad jeziorem Texcoco, w sercu naszego imperium, pewien człowiek zasiadający na tronie miał sen. Ujrzał coś poza klatką, w której żyjemy. Zobaczył krainę bez granic, którą zapragnął podbić. Tym człowiekiem był Montezuma I, drugi cesarz Imperium Azteków. Choć dawniej tytuł cesarza miał wyłącznie ceremonialne znaczenie, on uczynił z niego prawdziwy urząd, podporządkowując sobie sąsiadów i siłą zaprowadzając posłuch wśród pozostałych członków sojuszu.\n\nDzięki tej niedawnej zmianie układu sił może teraz zacząć realizować swoje marzenie. Otacza go wiele zagrożeń: Imperium Purepecha, Senat Tlaxcali, pozostałości państwa Zapoteków, a nawet podzielone ziemie Majów. Wielu wrogów spróbuje pokrzyżować te plany, lecz zdobędziemy dla niego nawet Mictlan."
 flavor_azt.19.a: "Panowanie Montezumy właśnie się rozpoczęło."
 flavor_azt.20.t: "Koniec konfliktu"
 flavor_azt.20.d: "Ognie wojen kwietnych płonęły jasno, pochłaniając życie wielu żołnierzy i mieszkańców. Wielu poległych oznacza obfitą ofiarę krwi dla bogów, lecz kosztowne zwycięstwa mogą opóźnić realizację naszego marzenia o Aztlanie. Wraz z upadkiem Tlaxcali zniknął nasz największy rywal w Meksyku. [Root.Monarch.GetName] jest teraz jedynym władcą miast wokół jeziora Texcoco.\n\nWraz z nastaniem pokoju na naszych ziemiach ponownie powoli podnoszą się sztandary. W przeszłości zakończyliśmy konflikt w środkowym Meksyku. Teraz przygotowujemy się do podziału i podboju ziem Zapoteków."
 flavor_azt.20.a: "Nasz konflikt z Tlaxcalą dobiegł końca."
 flavor_azt.21.t: "Rozdzielić i podbić"
 flavor_azt.21.d: "Sam podbój nie wystarczy, by podporządkować sobie ludność. Represje wojskowe jedynie na krótko złamią ducha pokonanych. Aby skutecznie rządzić i sprawować władzę, trzeba najpierw podzielić poddanych. Sprawić, by poczuli się osamotnieni i odizolowani, rozbić ich jedność, a następnie nimi rządzić.\n\n[Root.Monarch.GetName] zastosował tę strategię wobec Zapoteków, ludu zamieszkującego krainę chmur. Ponieważ byli już podzieleni, wystarczyło zadać im ostateczny cios. Pozostałości ich cywilizacji znajdują się teraz pod naszym panowaniem."
 flavor_azt.21.a: "Podzieliliśmy ich. Teraz czas nimi rządzić."
 flavor_azt.22.t: "Rozlewca krwi"
 flavor_azt.22.d: "Krew jest nektarem bogów. Majowie wiedzą o tym równie dobrze jak my i dlatego przed laty przyjęli nasze obyczaje. Nie pojmują jednak, jak wiele trzeba uczynić, by zdobyć krew. Same ofiary nie wystarczą. Bitwy muszą być krwawe, a taktyka bezlitosna – wszystko w imię zwycięstwa. Jak naucza bóg Tezcatlipoca, źródłem krwi jest konflikt.\n\nTo wciąż za mało. [Root.Monarch.GetName] wie, że nawet zwycięstwo należy uczcić kolejnym rozlewem krwi. Dlatego złożymy wielką ofiarę na ziemiach Majów."
 flavor_azt.22.a: "Niech krew naszych wrogów pomnoży potęgę bogów."
 flavor_azt.23.t: "Skrzydła światłości"
 flavor_azt.23.d: "Odkąd lud Azteków wydostał się z więzienia, jakim było jezioro Texcoco, marzył o lataniu, panowaniu nad otaczającymi go ziemiami i zmuszeniu wszystkich do ugięcia kolan. [Root.Monarch.GetName] miał jednak własne marzenie: zostać jedynym władcą Mezoameryki i odtworzyć Aztlan.\n\nWyruszył na podbój miast wokół Tenochtitlan, aby zostać pierwszym prawdziwym cesarzem Azteków. Przeprowadził liczne reformy i zakończył konflikty z sojuszem Tlaxcali. Rozdzielając chmury, stworzył administrację zdolną zarządzać licznymi miastami-państwami Meksyku. Podboje ziem Majów umocniły religijny charakter całego państwa i zwiększyły ilość krwi składanej bogom w ofierze. Pozostaje już tylko ponownie zasiąść na tronie jako legenda, która przyniosła światło i jedność tej krainie, od dawna nękanej konfliktami i mrokiem."
 flavor_azt.23.a: "Jesteśmy teraz jedynymi władcami Meksyku."
 flavor_azt.24.t: "Bóstwa Nahua"
 flavor_azt.24.d: "Nasze państwo ma już swojego opiekuńczego boga, lecz nadszedł czas, by wybrać nowe bóstwo, któremu oddamy szczególną cześć."
 flavor_azt.24.a: "Bóg wojny poprowadzi nas do zwycięstwa!"
 flavor_azt.24.b: "Czarny Jaguar rozpęta konflikt, z którego wyjdziemy zwycięsko!"
 flavor_azt.24.c: "Bóg Deszczu obdarzy nas żyzną ziemią."
 flavor_azt.24.dd: "Pierzasty Wąż stworzy społeczeństwo, w którym będziemy mogli rozkwitać."
 flavor_azt.25.t: "Los sojuszu"
 flavor_azt.25.d: "Przez lata i mimo licznych prób centralizacji sojusz miast, który niegdyś dał początek imperium Azteków, stał się pustą skorupą. Dawne wpływy ustąpiły miejsca samemu tytułowi. Być może powinniśmy oficjalnie rozwiązać ten sojusz?"
 flavor_azt.25.a: "Tenochtitlan będzie panować niepodzielnie!"
 flavor_azt.25.b: "Utrzymanie tego sojuszu przyniesie nam korzyści."
 azt_toxcatl_festival: "Toxcatl – Tezcatlipoca pośród nas"
 desc_azt_toxcatl_festival: "Toxcatl to święto poświęcone bogu Tezcatlipoca. Symbolizuje przemianę, a w szczególności śmierć i odrodzenie. Przez cały rok młody mężczyzna odgrywał rolę Tezcatlipoki, aż w końcu składano go w ofierze, a jego miejsce zajmował kolejny wybraniec."
