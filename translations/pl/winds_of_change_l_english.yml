 MUG_kingmaker_in_the_indian_ocean: "Rozgrywający na Oceanie Indyjskim"
 MUG_east_1_2: "Zmodyfikuj „§YWyprawa na wschód§!” w następujący sposób:\\n  Zdolność rządzenia: §G+100.00§!\\n  Roczna tradycja armii: §G+0.25§!\\n  Maksymalna tolerancja pogan: §G+1.00§!"
 MUG_merge_west_center_east: "Połącz „§YHegemon Zachodu§!” i „§YWyprawa na wschód§!” w „§YCesarza Hindustanu§!”, wprowadzając następujące zmiany:\\n  Zdolność rządzenia: §G+100.00§!\\n  Maksymalna tolerancja pogan: §G+1.00§!\\n  Siła ludzka w prowincjach akceptowanej kultury: §G+10.0%§!"
 MUG_merge_west_center: "Połącz „§YWzdłuż Indusu§!” i „§YZa Windhje§!” w „§YHegemona Zachodu§!”, wprowadzając następujące zmiany:\\n  Zdolność rządzenia: §G+50.00§!\\n  Jedność religijna: §G+10.0%§!"
 MUG_gujarat_privilege: "Odblokuj przywilej stanu „§YSzerokie przywileje gudźarackie§!” dla §Y[Root.GetJainsName]§!, zapewniający §G+15.0%§! efektywności handlu zależnie od wpływów §Y[Root.GetJainsName]§!, kosztem §R+0.1§! miesięcznej autonomii."
 MUG_upgrade_the_gujarati_privilege: "Wzmocnij przywilej stanu „§YSzerokie przywileje gudźarackie§!” dla §Y[Root.GetJainsName]§!, zmniejszając miesięczny przyrost autonomii do §R+0.05§! i obniżając modyfikator wpływów §Y[Root.GetJainsName]§! do §Y+5.0%§!."
 MUG_upgrade_rajputs: "Ulepsz przywilej stanu „§YUtworzenie pułków radźpuckich§!” dla §Y[Root.GetRajputsName]§!, zwiększając udział Radźputów w limicie sił zbrojnych o dodatkowe §G+15.0%§! i usuwając karę do §Ymaksymalnego absolutyzmu§!."
 MUG_enable_comission_peacock_throne_decision: "Odblokuj decyzję „§YZamówienie Pawiego Tronu§!”, dzięki której po podbiciu znacznej części §YIndii§! otrzymamy potężny modyfikator."
 MUG_unlock_gurkhas: "Odblokuj kompanię najemniczą „§JElitarni Gurkhowie§!”, której rekrutacja nie będzie kosztować §Yprofesjonalizmu armii§!. Zapewni ona następujące modyfikatory:\\n  Zdolności bojowe piechoty: §G+15.0%§!\\n  Otrzymywane obrażenia od wstrząsu: §G-10.0%§!\\n  Otrzymywane obrażenia od ostrzału: §G-10.0%§!"
 MUG_unlock_malaccan_viceroyalty_mission: "Odblokuj misję „§YWicekrólestwo Malakki§!”. Będzie to jedyna misja wymagana do jej ukończenia."
 MUG_distribute_10_base_prod: "Rozdziel §G10§! punktów podstawowej produkcji pomiędzy nasze prowincje."
 MUG_upgrade_grant_jains_liberties: "Wzmocnij przywilej stanu „§YPrzyznanie swobód dżinistom§!” dla §Y[Root.GetJainsName]§!, zapewniając §G+25§! siły handlowej w węźle handlowym §YKormandel§! podczas jego aktywności oraz §G+10.0%§! prowincjonalnego modyfikatora siły handlowej."
 MUG_unlock_trade_company_support_priv: "Odblokuj przywilej stanu „§YWsparcie wicekrólestwa Malakki§!” dla §Y[Root.GetJainsName]§!, zapewniający korzyści dla naszych §Ykompanii handlowych§!."
 MUG_has_diplomat: "Jeśli zatrudniamy doradcę typu §YDyplomata§!:"
 MUG_decays_05_yearly: "Spada o §R-0.25§! rocznie."
 MUG_more_chance_for_elephants: "Nasze jednostki będą częściej korzystać z modelu §Ysłoni bojowych§!."
 MUG_unlock_rajput_mansabdar_privilege: "Odblokuj przywilej stanu „§YMansabdarowie radźpuccy§!” dla §Y[Root.GetRajputsName]§!, zapewniający §G+1.00§! dowódcę lądowego bez kosztów utrzymania oraz do §G+15.0%§! szybkości odzyskiwania siły ludzkiej zależnie od lojalności stanu, kosztem §R-5.0%§! wpływów [Root.GetNobilityName]."
 MUG_distribute_10_base_manpower: "Rozdziel §G10§! punktów podstawowej siły ludzkiej pomiędzy nasze prowincje kultury §Yradźastańskiej§!."
 MUG_the_3_most_developed_provinces: "§G3§! najbardziej rozwinięte prowincje z budynkiem zwiększającym §Ysiłę ludzką§! i religią §Yhinduistyczną§!:"
 MUG_unlock_privilege_subahs: "Odblokuj przywilej stanu „§YRozwój suby§!” dla §Y[Root.GetNobilityName]§!, zapewniający §G-15.0%§! kosztu zarządzania stanami, kosztem §R+5.0%§! kosztu prowincji w punktach warscore."
 MUG_treasurer_upgrade: "Doradca typu §YSkarbnik§! będzie teraz dodatkowo zapewniał §G-0.05§! rocznej korupcji za każdy poziom doradcy."
 MUG_every_state_gains_20_prosperity: "Wszystkie nasze §Ystany§! otrzymają §G+20.0%§! postępu w kierunku §Ydobrobytu§!."
 MUG_seizing_land_will_give_absolutism: "Interakcja stanowa §YPrzejęcie ziemi§! będzie teraz zapewniać nam §G+2§! absolutyzmu."
 MUG_lose_10_autonomy: "Każda posiadana prowincja otrzyma §G-5.0%§! autonomii lokalnej.\\nJeśli nasza stabilność wynosi §Y3§!, wartość ta wzrośnie do §G-10.0%§! autonomii lokalnej."
 MUG_5_years_of_silk_cloth_cotton: "z §G5§! lat produkcji §Yjedwabiu§!, §Ytkanin§! i §Ybawełny§!."
 MUG_trunk_road: "Każda §Ywyróżniona§! prowincja:\\n  Została ulepszona co najmniej §Y3§! razy.\\n  Musi być spełniony jeden z poniższych warunków:\\n      Posiada budynek §Ytargowiska§!, §Yskładu handlowego§! lub §Ygiełdy§!.\\n      §YProwincja§! posiada co najmniej §Y2§! budynki."
 MUG_every_highlighted_province: "Każda §Ywyróżniona§! prowincja:"
 MUG_upgrade_expanding_infrastructure_tt: "§YRozbudowa infrastruktury§! w prowincji zapewni obszarowi następujący modyfikator:"
 MUG_upgrade_monopoly: "Jednorazowy dochód z przywileju stanu „§YMonopol na tekstylia§!” wzrośnie o §G50.0%§!, a zysk z §Ymerkantylizmu§! zwiększy się do §G+2.00§!."
 MUG_increase_chance_of_industrious: "Podwój szansę na uzyskanie cechy §YPracowity§!."
 MUG_unlock_industrial_privilege: "Odblokuj przywilej stanu „§YZdewaluowanie rupii§!” dla §Y[Root.GetJainsName]§!, zapewniający §G+25.0%§! krajowego modyfikatora podatkowego, §G+25.0%§! efektywności produkcji i §G-5.0%§! kosztu budowy. Nie będziemy jednak mogli zmniejszać §Yinflacji§!, która zacznie pasywnie rosnąć o §R+0.30%§! rocznie."
