 TIM_distribute_10_random_dev: "Rozdziel §G10§! punktów rozwoju pomiędzy nasze prowincje."
 TIM_soyurghals_unlocked: "Odblokuj typ poddanego §Ysojurgal§!. §YSojurgale§! to nadania ziemskie przekazywane generałom i możnym, którzy zarządzają tymi ziemiami i pobierają z nich podatki.\n§YSojurgale§! nie płacą seniorowi podatków, ale wnoszą znaczny wkład w postaci limitu sił zbrojnych i siły ludzkiej. §YSojurgale§! są anektowane dyplomatycznie, a ich aneksja kosztuje dwukrotnie więcej §Ypunktów dyplomatycznych§! niż aneksja zwykłych wasali. Nie zajmują §Ymiejsca dyplomatycznego§!, lecz ich liczba jest ograniczona i zależy od naszej §Yreputacji dyplomatycznej§!. Na każde §Y2§! punkty reputacji dyplomatycznej możemy mieć jednego sojurgala."
 TIM_gain_1_yearly_manpower_per_soyurghal_we_have: "Zyskaj §G+1§! rok zasobów siły ludzkiej za każdego posiadanego §Ysojurgala§!."
 TIM_distribute_15_dev_amongst_trade_centers: "Rozdziel §G15§! punktów rozwoju losowo pomiędzy nasze posiadane prowincje z §Yośrodkiem handlu§!."
 TIM_unlock_privilege_about_chagatai: "Odblokuj przywilej stanu „§YWojownicy czagatajscy§!” dla §Y[Root.GetNobilityName]§!, zapewniający §G+25.0%§! stosunku kawalerii do piechoty i §G+5.0%§! zdolności bojowych kawalerii, a także §G+0.50§! rocznej tradycji armii zależnie od §Ywpływów§!."
 TIM_lock_mughal_formable: "Nie będziemy już mogli stworzyć państwa @MUG §Y[MUG.GetName]§!."
 TIM_cb_to_get_china: "Odblokuj casus belli „§YPonowny podbój Yuan§!”, pozwalający zajmować prowincje w nadregionie §YChin§! za §G75.0%§! kosztu i §G150.0%§! prestiżu."
 TIM_3_most_developed_manpower_upgrade: "§G3§! najbardziej rozwinięte prowincje z budynkami zwiększającymi §Yzasoby ludzkie§!:"
 create_soyurghal: "Nadanie sojurgalu"
 create_soyurghal_title: "Nadanie sojurgalu"
 create_soyurghal_desc: "Czy na pewno chcesz przyznać sojurghal generałowi w §Y[From.GetName]§!?\n\n§YSojurghale§! to ziemie nadane różnym generałom i szlachcicom, którzy rządzą nimi i pobierają od nich podatki.\n§YSojurghale§! nie płacą daniny swojemu suwerenowi, ale wnoszą duży wkład w limit sił i zasoby ludzkie. §YSojurghale§! są anektowane dyplomatycznie, zużywając podwójną liczbę §Ypunktów dyplomatycznych§! potrzebną do aneksji dyplomatycznej zwykłych wasali. Nie zużywają §Ymiejsc na stosunki dyplomatyczne§!, ale może być ich tylko ograniczona liczba, zależna od twojej §Yreputacji dyplomatycznej§!. Na każde §Y2§! reputacji dyplomatycznej, możemy mieć jeden sojurghal.\n\nKażdy sojurghal przyznaje państwu §Y[Root.GetName]§! §G+1.00§! do limitu sił lądowych i §G+5.0%§! modyfikatora limitu sił lądowych. §Y[From.GetName]§! uzyska §G+25.0%§! modyfikatora zasobów ludzkich, §G+5000§! zasobów ludzkich i §G-25.0%§! kosztu pułku."
 create_soyurghal_tooltip: "Przekażemy władzę nad poddanym sojurgalowi.\\nSojurgale są poddanymi, którzy nie zajmują miejsca w limicie §Ystosunków dyplomatycznych§! i zasilają pulę zasobów ludzkich oraz marynarzy swojego suwerena."
 soyurghal_amount_check: "Ukryty modyfikator"
 flavor_tim.5.t: "Zniszczenie Muszaszów"
 flavor_tim.5.d: "W 1436 roku urodzony w Iraku teolog Muhammad ibn Falah rozpoczął drogę ku władzy. Podając się za ziemskiego przedstawiciela Alego i Mahdiego, zgromadził licznych zwolenników wśród miejscowych plemion, aż w końcu wykorzystał okazję i zdobył miasto Howejze. Od tamtej pory ruch Muszaszów był dla nas nieustannym cierniem w boku, próbując zagarnąć coraz większą część naszych ziem i głosząc swoje milenarystyczne urojenia. Na szczęście zdołaliśmy obalić tę nędzną organizację i rzucić jej przywódców na kolana."
 flavor_tim.5.a: "Dosyć tego!"
 flavor_tim.6.t: "Wykorzystanie systemu iqta"
 flavor_tim.6.d: "Mając tak wielu poddanych i poborców podatkowych, nie powinniśmy stronić od wykorzystywania tego dość wydajnego systemu dla własnych korzyści. Zbadamy sprawę dokładniej, aby ustalić, czy można wprowadzić usprawnienia pozwalające jeszcze lepiej z niego korzystać."
 flavor_tim.6.a: "Zażądajmy większych fawazil."
 flavor_tim.6.b: "Potrzebujemy więcej ludzi w naszej armii."
 flavor_tim.6.c: "Musimy zadbać o lojalność muqti."
 flavor_tim.7.t: "Koniec waśni"
 flavor_tim.7.d: "Dżahan Szah i Kara Kojunlu byli formalnie naszymi poddanymi. Jednak w świecie lojalności plemiennych wierność ta była co najwyżej chwiejna. Najlepiej było to widać w nieustannej walce o przygraniczne miasta Kazwin i Soltanije, które bez przerwy przechodziły z rąk do rąk. Teraz jednak, gdy Imperium Timurydów ponownie rośnie w siłę, los konfederacji plemiennej Czarnej Owcy został przesądzony. Od dziś Kara Kojunlu leży pokonane przez potężne armie [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 flavor_tim.7.a: "Znajcie swoje miejsce!"
 flavor_tim.8.t: "Ukaranie Delhi"
 flavor_tim.8.d: "Ostatnie dziesięciolecia przyniosły wyjątkowo niepokojący trend. Był to nieszczęśliwy okres, w którym wiele państw podbitych niegdyś przez Timura wykorzystało nasze wewnętrzne zamieszanie. Jednym z nich jest Delhi — sułtanat, który niegdyś dysponował ogromną potęgą. Na szczęście zdołaliśmy ukarać tych nikczemników i ponownie podporządkować sobie ich terytoria. Pojawia się jednak nowe pytanie: Indie są rozległe i ludne, a ich zarządzanie może okazać się trudne. Skupienie naszej uwagi i infrastruktury administracyjnej na Indiach pozwoliłoby nam sprawniej nimi rządzić."
 flavor_tim.8.a: "Indie będą nam podległe."
 flavor_tim.8.b: "Mamy tu plany stworzenia nowego imperium."
 flavor_tim.9.t: "Sufi ze szkoły hanbalickiej"
 flavor_tim.9.d: "Abdullah Ansari był XI-wiecznym sufickim teologiem i pisarzem ze szkoły hanbalickiej, działającym w Heracie. Był człowiekiem wielu talentów — oprócz gorliwego studiowania Koranu i zgłębiania mistycyzmu zajmował się również poezją. Jego osiągnięcia przyniosły mu sławę i uznanie, a także przydomek „Mędrzec z Heratu”. Szczególnym szacunkiem darzą go timurydzcy władcy, którzy przekształcili jego grobowiec w popularne miejsce pielgrzymek w stolicy. Wielu czerpie inspirację z jego dzieł, a niektórzy posuwają się nawet do pogłębiania wiedzy o madhhabie hanbalickim."
 flavor_tim.9.a: "Fascynujące..."
 flavor_tim.9.b: "Będzie czczony po wsze czasy."
 flavor_tim.10.t: "Powrót do szariatu"
 flavor_tim.10.d: "[Root.Monarch.GetTitle] zobowiązał się ograniczyć wpływ dawnych praw mongolskich i przywrócić szariat. Choć deklaracja ta wydaje się wyznaczać nową epokę, większość stanu [Root.GetNobilityName] uważa ją jedynie za puste słowa skierowane do ulemów. Wkrótce okaże się, czy obietnica jest szczera. Do [Root.Monarch.GetName] dotarły bowiem wieści, że po niedawnym posiedzeniu dworu wielu gubernatorów zebrało się w miejscowej winiarni, by spędzić wieczór na hulankach — zachowaniu potępianym przez ulemów."
 flavor_tim.10.a: "Wejdźmy do winiarni i wylejmy całe wino!"
 flavor_tim.10.b: "Nie możemy ryzykować gniewu elit czagatajskich."
 flavor_tim.11.t: "Polityka timurydzkiego dywanu"
 flavor_tim.11.d: "Podobnie jak każdy inny organ administracji, timurydzki dywan był areną walki o władzę i narzędziem umacniania własnej pozycji. Dzielił się na dwie izby: Diwan-i Mal, zajmującą się podatkami, oraz Diwan-i Lashgar, odpowiedzialną za sprawy wojskowe. Nie ulega wątpliwości, że obie administracje nieustannie rywalizują o wpływy. Jeden z najbliższych doradców [Root.Monarch.GetTitle] zaproponował zatem reformę administracji."
 flavor_tim.11.a: "Ależ oczywiście, znakomita inicjatywa!"
 flavor_tim.11.b: "Jeszcze się nad tym zastanowimy."
 flavor_tim.12.t: "Ukryte"
 flavor_tim.12.d: "To ukryte wydarzenie."
 flavor_tim.12.a: "Ukryte."
 flavor_tim.13.t: "Wydarzenie AI"
 flavor_tim.13.d: "Wydarzenie AI"
 flavor_tim.13.a: "Wydarzenie AI"
 flavor_tim.14.t: "Kampania przeciw Yuan"
 flavor_tim.14.d: "Pewnego nieszczęsnego zimowego dnia 1405 roku Timur zmarł w drodze ku granicom dynastii Ming, gdzie planował rozpocząć kampanię podbojów. Kierowany ambicją i wieloletnią pogardą ze strony posłów Mingów, nigdy nie zrealizował swoich marzeń. Może jednak dokonać tego [Root.Monarch.GetName], ponieważ imperium Timura przetrwało próbę czasu i jest wystarczająco potężne, by ponownie rzucić wyzwanie chińskim cesarzom."
 flavor_tim.14.a: "Pójdziemy w jego ślady."
 flavor_tim.14.b: "Nie działajmy pochopnie."
 flavor_tim.15.t: "Przemiany kulturowe [Root.GetName]"
 flavor_tim.15.d: "Jako rozległe państwo władające społeczeństwem zdominowanym przez Persów stopniowo przekształcamy się w imperium perskie. Te naturalne z biegiem czasu zmiany napotykają jednak zdecydowany opór ze strony tureckiego stanu [Root.GetNobilityName]. Niewielu jego członków chce porzucenia Yasy i przywilejów, jakie im zapewnia. Woleliby, aby nasza uwaga skupiła się na rozwoju terytoriów ich plemion."
 flavor_tim.15.a: "Powstrzymajmy ich zapędy."
 flavor_tim.15.b: "Kontynuujmy dotychczasową politykę."
 flavor_tim.16.t: "Jedwabny Szlak"
 flavor_tim.16.d: "Od upadku imperialnego porządku mongolskiego szlaki Jedwabnego Szlaku nieustannie podupadały. Dzięki wpływom naszego imperium i ciągłym inwestycjom udało nam się jednak doprowadzić do ich pełnego odrodzenia. Teraz znajdujemy się na skrzyżowaniu Wschodu i Zachodu i czerpiemy z tego ogromne korzyści."
 flavor_tim.16.a: "Skupmy się na korzyściach wewnętrznych."
 flavor_tim.16.b: "Wykorzystajmy to dla naszej dyplomacji."
 flavor_tim.17.t: "[Root.Monarch.GetName] nadużywa władzy"
 flavor_tim.17.d: "Wyszło na jaw, że [Root.Monarch.GetName] nadużywał władzy, co postawiło [Root.Monarch.GetHerHim] w konflikcie z [Root.Monarch.GetHerHis] zwierzchnikami w Heracie. Dwór w Szirazie oczekuje obecnie [Root.Monarch.GetHerHis] następcy. Miejmy nadzieję, że okaże się bardziej kompetentny niż poprzedni regent."
 flavor_tim.17.a: "Zdarza się."
 flavor_tim.18.t: "Nadużycie władzy"
 flavor_tim.18.d: "Wyszło na jaw, że [From.Monarch.GetName] nadużywał władzy podczas [From.Monarch.GetHerHis] kadencji jako regenta. [From.Monarch.GetSheHeCap] został następnie uwięziony w Heracie. Musimy teraz wybrać nowego regenta spośród licznych dworzan i ministrów, z których każdy ma własne specjalizacje. Musimy dokonać mądrego wyboru, ponieważ będzie on miał wpływ na wiele spraw."
 flavor_tim.18.a: "Najlepszy będzie kandydat o zdolnościach administracyjnych."
 flavor_tim.18.b: "Gubernator o talencie dyplomatycznym utrzyma lojalność ich emirów."
 flavor_tim.18.c: "Potrzebujemy zdolnego generała, który obroni ich granice."
 flavor_tim.18.e: "Osadźmy na tronie dworzanina."
 flavor_tim.18.f: "Uwolnijmy go z więzienia."
 flavor_tim.18.g: "Niech krajem rządzi stary i mądry doradca."
 flavor_tim.19.t: "Śmierć Muhammada Jukiego"
 flavor_tim.19.d: "Muhammad Juki, jeden z najwybitniejszych pretendentów do timurydzkiego tronu, zmarł, pozostawiając rządzone przez siebie terytoria młodym i niedoświadczonym synom. Niektórzy twierdzą, że przyczyną śmierci była choroba, lecz przeciwnicy Gawhar Szad oskarżają ją o zlecenie zabójstwa, motywowane chęcią zapewnienia sukcesji jej ulubionemu wnukowi, Ala al-Dawli. Niezależnie od prawdziwej przyczyny, możemy wykorzystać tę tragedię dla własnych korzyści."
 flavor_tim.19.a: "Wykorzystajmy tę sytuację."
 flavor_tim.19.b: "To prawdziwie niefortunne."
 flavor_tim.20.t: "Muhammad Juki przejmuje inicjatywę"
 flavor_tim.20.d: "Na wieść o tragicznej śmierci Szahrucha jeden z pretendentów do tronu, Muhammad Juki, zdecydował się sięgnąć po władzę nad imperium Timurydów i rozpoczął marsz na Herat. Jeśli [Root.Monarch.GetName] ma utrzymać się na tronie, [Root.Monarch.GetSheHe] musi szybko zareagować na to bezpośrednie zagrożenie."
 flavor_tim.20.a: "Musimy go powstrzymać!"
 flavor_tim.20.b: "To on jest prawowitym władcą."
 flavor_tim.21.t: "Ruch w Isfahanie"
 flavor_tim.21.d: "Nie jest zaskoczeniem, że Muhammad ibn Bajsunkur, zdrajca z Komu, w końcu zdecydował się wykonać kolejny ruch na szachownicy. Na niedorzeczne żądanie miejscowej szlachty ten niepokorny gubernator przejął kontrolę nad miastem i objął zbuntowanych możnowładców swoją ochroną. Trudno o bardziej bezczelny akt nielojalności."
 flavor_tim.21.a: "Musi zostać ukarany!"
 flavor_tim.21.b: "Musimy uzbroić się w cierpliwość."
 HLR_renovation_imperii_title: "Renovatio Imperii"
 HLR_renovation_imperii_desc: "Święte Cesarstwo Rzymskie, wcześniej uznawane za jedno z najbardziej zdecentralizowanych państw Europy, a być może nawet za najbardziej zdecentralizowane z nich wszystkich, zostało wreszcie zjednoczone w spójną całość. Pozostaje jedynie wykorzystać jego pełny potencjał."
 HLR_among_the_powers_title: "Pośród mocarstw"
 HLR_among_the_powers_desc: "Cesarstwo obejmuje rozległe ziemie w samym sercu Europy. To zjednoczone państwo musi zostać uznane za wielkie imperium i potęgę, z którą należy się liczyć."
 HLR_centralized_empire_mod: "Państwo cesarskie"
 desc_HLR_centralized_empire_mod: "Imperium, które nie potrafi rozwinąć skrzydeł, nie jest prawdziwym imperium."
 HLR_roman_politics_mod: "Rezolucja rzymska"
 desc_HLR_roman_politics_mod: "Rozwialiśmy wszelkie wątpliwości dotyczące naszego rzymskiego dziedzictwa. Przynajmniej w naszych oczach."
 HLR_holy_state_mod: "Święte państwo"
 desc_HLR_holy_state_mod: "Dzięki poparciu duchowieństwa i naszemu oddaniu jedności religijnej nikt nie może podważyć naszej świętości."
 HLR_holy_roman_imperial: "Święte, Rzymskie i Cesarskie"
 desc_HLR_holy_roman_imperial: "Udowodniliśmy, że jesteśmy święci, rzymscy i stanowimy prawdziwe imperium, a nie tylko państwo noszące taki tytuł."
