 seven_provinces_reform: "Siedem Prowincji"
 seven_provinces_reform_desc: "Siedem Prowincji Holenderskich, zjednoczonych w 1579 roku unią utrechcką, stworzyło potężną wspólnotę, która położyła podwaliny pod współczesną Holandię. Każda prowincja, w tym Holandia, Zelandia i Utrecht, zachowała własną tożsamość, współpracując jednak na rzecz wspólnej obrony i dobrobytu gospodarczego."
 modern_economics_reform: "Nowoczesna ekonomia"
 modern_economics_reform_desc: "Wiele państw stawia na tradycyjny model gospodarki, opierając się na własnych ziemiach zamiast na kupcach. Promując bardziej merkantylny charakter naszej gospodarki, będziemy mogli pozyskiwać więcej towarów handlowych z zamorskich posiadłości."
 support_state_reform: "Wspieraj państwo"
 support_state_reform_desc: "Państwo i jego wola są nadrzędne. Wzmacniając etatystyczny charakter naszego rządu, możemy jeszcze bardziej ugruntować pozycję państwa."
 orangist_stadholders_reform: "Oranżyści namiestnicy"
 orangist_stadholders_reform_desc: "Oraniści udowodnili, że potrafią być znakomitymi władcami. Dlatego powinniśmy zadbać o zwiększenie władzy namiestników wywodzących się z tego stronnictwa."
 mechanic_seven_provinces_organization_yes: "Odblokowuje mechanikę §YOrganizacji Siedmiu Prowincji§!, która zapewnia następujące efekty:
Prowincje grupy naszej głównej kultury w Niderlandach zyskują:
   §G-10,0%§! kosztu rozwoju
   §G+10,0%§! modyfikatora produkcji dóbr
   §G-25,0%§! kosztu zarządzania prowincją
   §G-10%§! kosztu i czasu budowy

Prowincje w §YEuropie§! poza Niderlandami zyskują:
   §R+25,0%§! kosztu zarządzania prowincją
   §R+33%§! minimalnej autonomii"
 mechanic_economic_golden_age_yes: "Przywilej mieszczaństwa §YWolna przedsiębiorczość§! zapewnia teraz:
   §G+10,0%§! modyfikatora limitu sił morskich
   §G-15,0%§! kosztu lekkich okrętów"
 mechanic_republican_virtues_yes: "Kandydaci §Yetatystyczni§! otrzymają §G+1§! do wszystkich kategorii władcy."
 mechanic_orangist_cause_yes: "Gdy władca §Yoranżystowski§! wygra co najmniej §Y25§! bitew jako generał, otrzyma cechę władcy §YOranżystowski namiestnik§!."
 estate_burghers_black_devils: "Czarne diabły"
 estate_burghers_black_devils_desc: "Nasze oddziały piechoty morskiej są rozproszone między wiele różnych formacji. Pozwala to utrzymać ich liczebność, lecz musimy połączyć je w jeden korpus, aby nie dopuścić do spadku jakości naszych operacji desantowych."
 estate_burghers_maximize_cargo_space: "Maksymalizuj przestrzeń ładunkową"
 estate_burghers_maximize_cargo_space_desc: "Zamiast wyposażać nasze statki handlowe w działa i żołnierzy, zwiększmy maksymalnie przestrzeń przeznaczoną na ładunek."
 estate_burghers_diversify_fluyts: "Zróżnicuj zastosowanie fluit"
 estate_burghers_diversify_fluyts_desc: "Nasze statki handlowe nie powinny służyć wyłącznie do handlu. Powinny pełnić bardziej wszechstronną funkcję, transportując żołnierzy i zwalczając piratów."
 estate_nobles_orangist_privileges: "Przywileje oranżystów"
 estate_nobles_orangist_privileges_desc: "Stronnictwo oranżystowskie udowodniło, że skutecznie zapewnia kontrolę nad państwem. Nadając tym książętom przywileje, możemy zagwarantować im utrzymanie władzy."
 estate_burghers_voc_privilege: "Vereenigde Oostindische Compagnie"
 estate_burghers_voc_privilege_desc: "Konsorcja kupieckie, takie jak Heeren XVII, pragną poszerzać swoje portfele inwestycyjne i rozwijać handel zamorski. Jeśli wesprzemy utworzenie Kompanii Wschodnioindyjskiej, zyski mogą być ogromne!"
