 TIM_what_is_integrated_vassal: "§YPrzyłączani wasale§! są o §G-25.0%§! tańsi do §Ydyplomatycznego anektowania§!."
 TIM_legendary_conqueror: "§YWładcy§!, §Ymałżonkowie§! i §Ynastępcy§! mogą od teraz otrzymać osobowość §YLegendarny zdobywca§!, która daje następujące modyfikatory:\n  Obrażenia od natarcia: §G+10.0%§!\n  Okres separatyzmu: §G-5§!"
 TIM_legendary_architect: "§YWładcy§!, §Ymałżonkowie§! i §Ynastępcy tronu§! mogą teraz otrzymać cechę §YWielki inżynier§!, która zapewnia następujące modyfikatory:\\n  Koszt budowy: §G-15.0%§!\\n  Czas budowy: §G-50.0%§!"
 TIM_unlock_razing_gov_reform: "Odblokuj reformę rządową „§YGospodarka łupieżcza§!” na poziomie monarchii §YPrzywileje szlacheckie§!, umożliwiającą §Yspustoszenie§! prowincji, ale kosztem §R-50.0%§! zdobywanej siły spustoszenia."
 TIM_nobility_loyalty_with_forts: "Posiadanie dużej liczby nowoczesnych §Yfortów§! zapewni nam do §G+10.0%§! równowagi lojalności [Root.GetNobilityName]."
 TIM_upgrade_expand_the_fortifications: "Wzmocnij przywilej stanu „§YRozbudowa fortyfikacji§!”, aby zapewniał §G+5.0%§! obrony fortu i §G-5.0%§! kosztu utrzymania fortów."
 TIM_do_persian_mission_easier: "Misja @PER§Y[PER.GetAdjective]§! „§YPerski dywan§!” będzie możliwa do automatycznego ukończenia."
