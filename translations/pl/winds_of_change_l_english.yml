 TIM_unlock_institute_gulf_toll: "Odblokuj przywilej stanu „§YWprowadzenie cła zatokowego§!” dla §Y[Root.GetBurghersName]§!, który zapewni §G+5.0%§! efektywności handlu i §G+35§! siły handlowej w węźle handlowym §YOrmuz§!, kosztem §R-10.0%§! siły handlowej za granicą."
 TIM_unlock_appease_the_elites_privilege: "Odblokuj przywilej stanu „§YUdobruchanie elit§!” dla §Y[Root.GetNobilityName]§!, który zapewni modyfikator [Root.GetTIMAppeaseTheElitesModifier] zależny od §Ywpływów§!, kosztem §R-10.0%§! limitu sił lądowych."
 TIM_cradle_of_civ_mod: "§G+1.0%§! rocznego profesjonalizmu armii"
 TIM_non_cradle_of_civ_mod: "§G+1.00§! rocznej tradycji wojskowej"
