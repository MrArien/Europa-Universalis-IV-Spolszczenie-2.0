 AZOV_AGREEMENT: "Porozumienie azowskie"
 estate_burghers_livestock_regulations: "Regulacje dotyczące hodowli"
 estate_burghers_livestock_regulations_desc: "Ziemie Krymu pełne są zagród hodowlanych. Regulując działalność ich właścicieli, możemy lepiej kontrolować przemieszczanie się stad i zapobiec ich migracji poza nasze granice."
