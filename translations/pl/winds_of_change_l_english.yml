 ability_blood_gathering_mechanic: "Gromadzenie tonalli"
 blood: "Tonalli"
 monthly_blood: "Miesięczny przyrost tonalli"
 blood_gain_modifier: "Modyfikator przyrostu tonalli"
 blood_desc: "§YTonalli§! to siła życiowa tkwiąca w każdym człowieku. Niegdyś ludzie oddawali swoją krew, by nas chronić; teraz musimy zwrócić im tę moc, aby wzmocnić ich przed nadejściem §YZagłady§!.\nNaszym obecnym bóstwem opiekuńczym jest §Y[Root.GetAztecPatronDeityName]§!\n\nTonalli zyskujemy w następujący sposób:\n   §G+0.3§! podczas §Ywojny§!\n   §G+0.1§! za każde §Y1000§! ofiar w §Ybitwie§!, maksymalnie §G+[GetMaxBloodBattles]§!\n   Z różnych nagród za §Ymisje§! i §Ywydarzenia§!\n   §G+0.5§! za każdą wzniesioną §Yświątynię§!\n   §G+1§! za §Ywykorzystanie rozwoju§!\n   Z oferty pokojowej §YZażądaj ofiar§!\n\nTonalli tracimy w następujący sposób:\n   §R-0.05§! podczas §Ypokoju§!\n   §R-0.5§! za posiadanie władcy będącego §Ygrzesznikiem§!\n   §R-1§! za każdą zniszczoną §Yświątynię§!\n\n"
 GetMaxBloodBattles40: ""
 GetMaxBloodBattles20: ""
 praise_patron_deity: "Bóstwa nahuatl"
 praise_patron_deity_desc: "W mitologii nahuatl istnieją cztery główne bóstwa, znane jako Cztery Tezcatlipoki. Reprezentują one północ, południe, wschód i zachód, a także czerń, błękit, czerwień i biel. Wybierając jedno z nich na nasze główne bóstwo, możemy przywołać jego błogosławieństwo dla własnej korzyści — przynajmniej tak przedstawiamy to naszemu ludowi.\n\n"
 hold_religious_festival: "Zorganizuj święto religijne"
 hold_religious_festival_desc: "Zgodnie z tradycją nahuatl lud obchodzi różne wydarzenia związane z mitologią Azteków: narodziny boga, dary przekazane ludzkości czy ofiarę złożoną przez bóstwo. Zorganizujemy święto upamiętniające jedno z tych wydarzeń.\n\n"
 blood_letting: "Rytuały upuszczania krwi"
 blood_letting_desc: "Nie powinniśmy składać w ofierze wyłącznie krwi naszych wrogów — czasami musimy ofiarować również własną. Osiągniemy to poprzez praktykowanie rytuałów samopoświęcenia i upuszczania krwi.\n\n"
 AZT_MODIFY_MECHANIC_HUITZILOPOCHTLI: "Uczyń §YHuitzilopochtliego§! głównym bóstwem opiekuńczym naszego państwa. Dzięki temu §YGromadzenie tonalli§! przy maksymalnej sile zapewni następujące efekty:\n   Morale armii: §G+10.0%§!\n   Zasoby ludzkie w prowincjach z tej samej grupy kulturowej: §G+20.0%§!"
 AZT_MODIFY_MECHANIC_TEZCATLIPOCA: "Uczyń §YTezcatlipokę§! głównym bóstwem opiekuńczym naszego państwa. Dzięki temu §YGromadzenie tonalli§! przy maksymalnej sile zapewni następujące efekty:\n   Koszt tworzenia rdzenia: §G-15.0%§!\n   Wpływ ekspansji agresywnej: §G-10.0%§!"
 AZT_MODIFY_MECHANIC_TLALOC: "Uczyń §YTlaloka§! głównym bóstwem opiekuńczym naszego państwa. Dzięki temu §YGromadzenie tonalli§! przy maksymalnej sile zapewni następujące efekty:\n   Koszt budowy: §G-20.0%§!\n   Koszt rozwoju w prowincjach kultur podstawowych: §G-10.0%§!"
 AZT_MODIFY_MECHANIC_QUETZACOATL: "Uczyń §YQuetzalcoatla§! głównym bóstwem opiekuńczym naszego państwa. Dzięki temu §YGromadzenie tonalli§! przy maksymalnej sile zapewni następujące efekty:\n   Niepokoje narodowe: §G-3.00§!\n   Siła misjonarzy: §G+3.0%§!"
 AZT_FESTIVAL_REWARD_CHANGES_WITH_PATRON_DEITY: "Nagrody za §Yorganizację święta§! będą się różnić w zależności od tego, kto jest naszym §Ybóstwem opiekuńczym§!"
