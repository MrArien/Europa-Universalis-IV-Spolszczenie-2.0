 TIM_upgrade_iqta_manpower: "Ulepsz interakcję z iqta „§YPozyskanie ziemi§!”, aby zapewniała dwukrotnie więcej §Ysiły ludzkiej§!."
 TIM_upgrade_iqta_tax: "Ulepsz interakcję z iqta „§YWydajne pobieranie podatków§!”, aby zapewniała dwukrotnie więcej §Ydukatów§! i przejmowała §G1.0%§! ziem Korony."
