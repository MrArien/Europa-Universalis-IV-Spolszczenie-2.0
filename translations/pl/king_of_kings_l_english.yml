 promote_art_title: "Wspieraj sztukę"
 promote_art_desc: "Nasze państwo słynie z kultury i sztuki. To naturalne, że powinniśmy wspierać te dziedziny i sprzyjać rozwojowi kultury w naszym kraju."
 promote_art_tt: "Będziemy wspierać tworzenie dzieł sztuki [Root.Culture.GetName] w naszym kraju. Po ukończeniu otrzymamy §G+20,00§! §Ywpływów perskich§!.\nW zależności od §Yjakości dzieła§!, poszczególne rodzaje sztuki zapewnią po ukończeniu następujące dodatkowe efekty:\n§YArchitektura§!: §G+1§! do podstawowego podatku w losowej posiadanej prowincji\nWzniesienie lub ulepszenie §G1§! darmowej [Root.GetTempleName] w losowej posiadanej prowincji (niezależnie od jakości dzieła)\n§YTkaniny§!: zyskujemy §G+1§! merkantylizmu\n§YMalarstwo§!: zyskujemy §G+10§! prestiżu lub punktów siły monarchy\n\nW tym czasie będą pojawiać się wydarzenia wpływające na postępy prac nad dziełem."
 stop_promoting_art_title: "Zaprzestań wspierania sztuki"
 stop_promoting_art_desc: "Choć jest to szlachetny cel, wspieranie sztuki jest kosztownym przedsięwzięciem, na które nie możemy sobie pozwolić."
 stop_promoting_art_tt: "§RPrzestaniemy§! wspierać kulturę i sztukę. Wszystkie rozpoczęte dzieła pozostaną w prywatnych rękach."
 promoting_art: "Wspieranie sztuki"
 desc_promoting_art: "Obecnie przeznaczamy część zasobów rządowych na wspieranie sztuki w naszym państwie.\n\nPo ukończeniu dzieła otrzymamy §G+20,00§! §Ywpływów perskich§! oraz dodatkową jednorazową premię.\n§YW tym czasie będą pojawiać się wydarzenia wpływające na postępy prac nad dziełem.§!"
