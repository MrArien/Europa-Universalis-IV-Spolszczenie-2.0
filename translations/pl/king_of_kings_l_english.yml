 BYZ_unite_all_modifiers_into_one: "Połącz efekty §YOdzyskiwanie zachodniej flanki§!, §YOdzyskiwanie południowych prowincji§! i §YWschodnie rubieże§! w jeden efekt §YPrawdziwe Cesarstwo Rzymskie§!, łącząc modyfikatory §Ysiły misjonarzy§! i dodatkowo zmieniając go o:\n  Modyfikator kosztu stabilności: §G-10.0%§!\n  Roczny prestiż: §G+0.25§!\n  Limit administracyjny: §G+50.00§!"
 BYZ_united_modifier: "Prawdziwe Cesarstwo Rzymskie"
 desc_BYZ_united_modifier: "Odzyskaliśmy chwałę Cesarstwa Rzymskiego, największego imperium, jakie widział świat."
 EPI_epirote_forces: "Wojska Epiru"
 desc_EPI_epirote_forces: "Zamiast podporządkować sobie Epirotów, postanowiliśmy bezpośrednio wcielić ich do naszej armii."
 BYZ_africa_proconsularis: "Afryka Prokonsularna"
 desc_BYZ_africa_proconsularis: "Służba naszych afrykańskich poddanych, biegłych w żegludze, z pewnością zwiększy nasze umiejętności w bitwach z udziałem galer."
 BYZ_roman_vigour: "Rzymski zapał"
 desc_BYZ_roman_vigour: "Perspektywa odbudowy Cesarstwa Rzymskiego dodała sił naszym wojskom i nowej energii osobom podejmującym decyzje."
 BYZ_ceasarean_conquests: "Podboje na wzór Cezara"
 desc_BYZ_ceasarean_conquests: "Wielu porównuje nasze ostatnie podboje do kampanii Juliusza Cezara."
 BYZ_dreams_of_restoration: "Marzenia o odrodzeniu"
 desc_BYZ_dreams_of_restoration: "Mimo beznadziejnej sytuacji ostatni Rzymianie marzą o bohaterskiej walce do samego końca i wciąż żywią nadzieję na odrodzenie imperium."
 BYZ_no_slot_bulgarian: "Akceptacja kultury bułgarskiej"
 desc_BYZ_no_slot_bulgarian: "Nasza bliskość i tolerancja wobec Bułgarów zyskały nam ich zaufanie."
 BYZ_annona_shipments: "Transporty zboża"
 BYZ_grain_shipments: "Dostawy zboża do stolicy"
 desc_BYZ_grain_shipments: "Dostawy zboża z Egiptu pozwalają miastu rozrastać się daleko poza jego dotychczasowe granice."
 byz_permanent_power_projection: "Bizantyjska dominacja"
 BYZ_champions_of_the_east: "Potęga Wschodu"
 desc_BYZ_champions_of_the_east: "Nasza niedawna wojna z Persami ostatecznie dowiodła, że Cesarstwo Rzymskie góruje nad wszystkimi państwami tych ziem."
 BYZ_fertile_valleys: "Żyzne doliny Mezopotamii"
 desc_BYZ_fertile_valleys: "Lokalne ziemie uprawne są niezwykle żyzne dzięki sieci rzek i rozbudowanym systemom irygacyjnym."
 BYZ_new_constantinople: "Nowy Konstantynopol"
 desc_BYZ_new_constantinople: "W czasach Drugiego Cesarstwa Bułgarskiego Tyrnowo było niegdyś nazywane «Nowym Konstantynopolem»."
 BYZ_heart_of_the_empire: "Stolica wojskowa"
 desc_BYZ_heart_of_the_empire: "W prowincji tej mieści się siedziba administracji wojskowej, złożonej z wpływowych generałów i strategów."
 BYZ_illustrious_court: "Wspaniały dwór"
 desc_BYZ_illustrious_court: "Miejscowe miasto służy monarsze, zapewniając mu zaplecze osobiste i majątkowe, a także goszcząc licznych dworzan gotowych wspierać administrację."
 BYZ_secondary_capital: "Druga stolica"
 desc_BYZ_secondary_capital: "[Root.GetCapitalName] pełni funkcję drugiej siedziby rządu, dzięki czemu zarządzanie tym obszarem jest znacznie łatwiejsze."
 BYZ_reversal_of_downfall: "Odwrócenie upadku"
 desc_BYZ_reversal_of_downfall: "Choć było to nieoczekiwane, udało nam się odwrócić niekorzystny bieg wydarzeń."
 BYZ_janissary_recruitment: "Przyjęcie systemu dewszirme"
 desc_BYZ_janissary_recruitment: "Przyjęliśmy system dewszirme, kierując go przeciwko miejscowej tureckiej ludności muzułmańskiej."
 BYZ_masjid_local_pilgrimages: "Lokalne pielgrzymki muzułmanów"
 desc_BYZ_masjid_local_pilgrimages: "Dzięki pokojowemu traktowaniu miejscowych muzułmanów wielu z nich wciąż może odbywać hadżdż, mimo że miasto znajduje się w rękach chrześcijan."
 BYZ_spared_masjid: "Uszanowane muzułmańskie miejsce święte"
 BYZ_offshoots_defeated: "Pokonanie odłamów Komnenów"
 desc_BYZ_offshoots_defeated: "Pokonaliśmy dynastię Komnenów, która rościła sobie prawo do tytułu prawowitych cesarzy rzymskich."
 MEE_strong_example_against_the_serbian_aristocrats: "Surowy przykład"
 desc_MEE_strong_example_against_the_serbian_aristocrats: "Surowo ukaraliśmy wielu serbskich arystokratów, skutecznie zmuszając pozostałych do współpracy."
 MEE_amiable_treatment: "Życzliwe traktowanie"
 desc_MEE_amiable_treatment: "Pomimo działań Serbów przeciwko nam w przeszłości postanowiliśmy potraktować ich życzliwie."
 BYZ_arsenal: "Przejęty arsenał"
 desc_BYZ_arsenal: "Zamiast zniszczyć Wenecję, po prostu oddaliśmy miasto pod nowe zarządzanie, przejmując również jego arsenał."
 BYZ_may_construct_galleass: "Przejęty arsenał"
 desc_BYZ_may_construct_galleass: "Przejęliśmy wenecką technologię budowy nowoczesnych galeasów."
 BYZ_local_galleass: "Przejęty arsenał"
 desc_BYZ_local_galleass: "Lokalny arsenał pozwala nam budować najlepsze galeasy, gotowe do zdominowania Morza Śródziemnego."
 BYZ_chastening_of_venice: "Poskromienie Wenecji"
 desc_BYZ_chastening_of_venice: "Najjaśniejsza Republika została zniszczona, jej miasto legło w gruzach, a okoliczne wsie zostały splądrowane."
 BYZ_hexamilion_wall_1: "Mur Heksamilionu"
 desc_BYZ_hexamilion_wall_1: "Mur Heksamilionu znajduje się na Przesmyku Korynckim i chroni półwysep w miejscu jego jedynego połączenia z resztą Grecji."
 BYZ_hexamilion_wall_2: "Mur Heksamilionu"
 desc_BYZ_hexamilion_wall_2: "Mur Heksamilionu znajduje się na Przesmyku Korynckim i chroni półwysep w miejscu jego jedynego połączenia z resztą Grecji."
 BYZ_theodosian_wall_1: "Mury Teodozjusza"
 desc_BYZ_theodosian_wall_1: "Mury Teodozjusza są jednym z symboli Konstantynopola. Ten nieprzerwany pas umocnień chroni miasto przed wszelkimi najazdami."
