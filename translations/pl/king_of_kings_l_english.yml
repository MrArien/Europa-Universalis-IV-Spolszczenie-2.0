 turkoman_enlisted_the_safavids_shia: "Safawidzi zaciągnięci do służby"
 turkoman_upgrade_tribal_interaction_safavids: "Interakcja rządowa §YZaciąg z plemion§! będzie teraz zapewniać nam również rekrutów w liczbie odpowiadającej §G1§! rocznemu zasobowi siły ludzkiej."
 turkoman_mausoleum: "Mauzoleum turkmeńskich emirów"
 turkoman_new_capital: "Nowa stolica"
 desc_turkoman_maragheh: "Obserwatorium w Maraghe było ośrodkiem wiedzy za panowania Hulagu-chana. Przywrócimy mu dawną świetność!"
 desc_turkoman_expanding_industry: "Słynne perskie sukno i jedwab są cenione na całym świecie. Zainwestujmy w ich produkcję, aby zwiększyć nasze wpływy handlowe i zasilić skarbiec."
 desc_turkoman_advance: "Plemiona turkmeńskie zebrały się pod naszymi sztandarami. Czas ruszyć naprzód i rozszerzyć granice naszego państwa."
 desc_turkoman_exploiting_the_crisis: "Państwo Timurydów pogrążyło się w głębokim chaosie. Śmierć Szahrucha zdaje się być gwoździem do jego trumny. Musimy wykorzystać ten kryzys dla własnych korzyści."
 desc_turkoman_plotting_timurid_donwfall: "Z pomocą nielojalnych poddanych rozwiążemy imperium Timurydów i przejmiemy jego ziemie."
 desc_turkoman_triumphant_conquest: "Nasze wojska odniosły na polu bitwy wielkie zwycięstwa. Zdobywając doświadczenie, stają się potężną siłą, która budzi strach w sercach naszych wrogów."
 desc_turkoman_bane_timurids: "Hegemonia potomków Timura dobiegła końca. Jesteśmy teraz jedynymi władcami Eranszahru!"
 desc_turkoman_tamerlane_bloodline: "Potomkowie Timura odeszli w niepamięć, a my zyskaliśmy miano tych, którzy położyli kres jego dynastii!"
 desc_turkoman_restore_irans_glory: "Ziemie Iranu bardzo ucierpiały wskutek brutalnych podbojów Mongołów i Timura. Nadszedł czas, by przywrócić im pokój i dawną świetność."
 desc_turkoman_heal_internal_divisions: "Problemy religijne nie mogą stanąć nam na drodze. Naszym priorytetem musi być załagodzenie wewnętrznych podziałów religijnych."
 desc_turkoman_sons_of_conquerors: "Krew Oguzów wciąż płynie w naszych żyłach. Jesteśmy synami zdobywców, którzy rzucili na kolana potężne imperia."
 desc_turkoman_state_modernization: "Jeśli chcemy przetrwać w szybko zmieniającym się świecie, musimy zadbać o reformy i modernizację naszego państwa."
 desc_turkoman_caucasian_ghazis: "Ghazi z Kaukazu zapewnią naszym armiom niezawodnych wojowników, zawsze gotowych walczyć w imię Allaha!"
 desc_turkoman_consolidation_of_caucasia: "Plemiona Kaukazu różnią się kulturą i wyznaniem. Musimy skonsolidować ten region, aby nie stał się zarzewiem niepokojów."
 desc_turkoman_architectural_revival: "Wielkie dzieła Iranu zostały zbezczeszczone podczas stuleci wojen. Pod naszym panowaniem Iran przeżyje architektoniczne odrodzenie."
 desc_turkoman_privilege_mountains: "Surowe górskie tereny Wielkiego Iranu nie staną nam na drodze ani nie zniechęcą nas do wznoszenia wspaniałych budowli."
 desc_turkoman_privilege_highlands: "Surowe wyżynne tereny Wielkiego Iranu nie staną nam na drodze ani nie zniechęcą nas do wznoszenia wspaniałych budowli."
 desc_turkoman_privilege_desert: "Surowe pustynne tereny Wielkiego Iranu nie staną nam na drodze ani nie zniechęcą nas do wznoszenia wspaniałych budowli."
 desc_turkoman_privilege_drylands: "Suche tereny Wielkiego Iranu nie staną nam na drodze ani nie zniechęcą nas do wznoszenia wspaniałych budowli."
 desc_turkoman_repopulate_persia: "Ludność Iranu została zdziesiątkowana przez stulecia wojen. Musimy ponownie zaludnić ten region i ożywić serce naszego nowego imperium."
 desc_turkoman_gunpowder: "Nastała epoka prochu strzelniczego. Jeśli chcemy mieć szansę w starciu z naszymi wrogami, musimy dostosować się do nowych metod prowadzenia wojny."
 desc_turkoman_control_of_hormuz: "Ormuz jest strategicznie ważną bramą do Zatoki Perskiej. Kto kontroluje Ormuz, ten kontroluje całą zatokę."
 desc_turkoman_splendid_court: "Nasz wspaniały dwór stanie się ośrodkiem wiedzy i innowacji. Znajdą tu miejsce uczeni z całego imperium i z zagranicy."
 desc_turkoman_entrepot_of_persia: "Porty Basry są perskim entrepôt, przez który towary sprowadzane przez naszych kupców z odległych krain trafiają na nasze rynki."
 desc_turkoman_naval_routes: "Nasze nowo utworzone floty kupieckie będą chronić morskie szlaki handlowe i zabezpieczać nasze bogactwa przed zakusami wrogów."
 desc_turkoman_gulf_fleet: "Aby przejąć kontrolę nad handlem w Zatoce Perskiej, musimy dysponować flotą zdolną docierać na zagraniczne rynki."
 desc_turkoman_naval_hegemony: "Jesteśmy niekwestionowaną potęgą morską Zatoki Perskiej. Czas ugruntować naszą hegemonię, aby żaden wróg nie ośmielił się rzucić nam wyzwania na morzu."
 desc_turkoman_army_traditions: "Nasza taktyka wojskowa opiera się na wielowiekowych tradycjach Turkmenów. Niech nasi wrogowie zadrżą przed potęgą naszej kawalerii!"
 desc_turkoman_army_traditions2: "Nasza taktyka wojskowa opiera się na wielowiekowych tradycjach Turkmenów. Niech nasi wrogowie zadrżą przed potęgą naszej kawalerii!"
 desc_turkoman_emirs_of_baghdad: "Emirowie Bagdadu cieszą się szeroką autonomią. Musimy zachować ostrożność, ponieważ Mezopotamia może szybko stać się ośrodkiem rebelii."
 desc_turkoman_the_city_of_peace: "Bagdad, zwany również Miastem Pokoju, jedno z największych miast świata islamskiego, odzyskał wreszcie świetność, jaką cieszył się za panowania Abbasydów."
 desc_turkoman_house_of_wisdom: "Przed zniszczeniem dokonanym przez Mongołów Dom Mądrości był ośrodkiem nauk islamskich. Odbudowana instytucja ponownie będzie pełnić tę funkcję i przyciągać uczonych od Maghrebu po Indie!"
 desc_turkmen_turkic_union: ""
 desc_turkoman_era_of_black_sheep: "Nasza dynastia stała się w regionie ostoją nauki, stabilności i prestiżu. Niech ten złoty wiek zapisze się w historii jako Epoka Czarnej Owcy!"
 desc_turkoman_era_of_white_sheep: "Nasza dynastia stała się w regionie ostoją nauki, stabilności i prestiżu. Niech ten złoty wiek zapisze się w historii jako Epoka Białej Owcy!"
 desc_turkoman_overpower_mamluks: "Choć byli potężnym przeciwnikiem, udało nam się pokonać ich na polu bitwy. Droga do Ziemi Świętej i Egiptu stoi teraz otworem."
