 desc_per_muslim_empire: "Stworzyliśmy muzułmańskie imperium, które zjednoczyło islam pod jednym sztandarem. Jest to państwo, przy którego potędze bledną legendarne imperia naszych przodków, takie jak Imperium Achemenidów."
 the_avestan_dogma_reform: "Dogmaty awestyjskie"
 the_avestan_dogma_reform_desc: "Dla naszego duchowego dobra i w imię prawości musimy poznać i przyjąć dogmaty awestyjskie zawarte w zbiorze świętych pism."
 flavor_per.18.t: "Kierunek religijny państwa [Root.GetName]"
 flavor_per.18.desc: "Choć dominującą religią na ziemiach perskich jest sunnizm, silny ruch na rzecz szyizmu i imamizmu dwunastkowego również ma tu licznych zwolenników. Szczególnie zainteresowany szerzeniem szyizmu i nawracaniem sunnickich heretyków na swoją wiarę jest zakon safawidzki.\n\nPośród tych dwóch odłamów walczących o dominację pozostało także kilku zaratusztrian. Wyznają oni starożytną religię, która dominowała w dziejach Persji przed muzułmańskim podbojem Bliskiego Wschodu, lecz dziś jest jedynie cieniem dawnej potęgi i stanowi mniejszość w naszym państwie.\n\nNiezależnie od tego, którą drogę religijną obierze nasze państwo, na stulecia ukształtujemy historię i wierzenia tego regionu."
 flavor_per.18.a: "Obraliśmy już naszą drogę."
 flavor_per.18.c: "Wiara muzułmańska jest jedyną prawdziwą."
 flavor_per.18.d: "Powinniśmy dorównać hartem ducha naszym przodkom i ponownie rozpalić dawny płomień."
 flavor_per.18.e: "Potrzebujemy więcej czasu do namysłu."
 flavor_per.19.t: "Dywany Persji"
 flavor_per.19.desc: "Dzięki zwiększonej produkcji dywanów i monopolowi na wyroby tekstylne kontrolujemy podaż i popyt na jedwab, tkaniny oraz barwniki. Możemy na wiele sposobów wykorzystać naszą potęgę gospodarczą. Wykorzystajmy ją jak najlepiej."
 flavor_per.19.a: "Ograniczmy produkcję, aby zwiększyć popyt."
 PERSIA_SILK_MONOPOLIZATION: "Popyt na perskie dywany"
 PERSIA_CLOTH_MONOPOLIZATION: "Popyt na perskie dywany"
 PERSIA_DYES_MONOPOLIZATION: "Popyt na perskie dywany"
 flavor_per.19.b: "Zwiększmy produkcję i zalejmy rynek towarami."
