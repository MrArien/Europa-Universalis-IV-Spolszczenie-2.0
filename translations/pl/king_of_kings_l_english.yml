 IMPERATRITSA: "Imperatrica"
 DEDOPALI: "Dedopali"
 PRINTSI: "Princi"
 PRINTSESA: "Princesa"
 estate_nobles_highland_fortifications: "Górskie fortyfikacje"
 estate_nobles_highland_fortifications_desc: "Nasze królestwo zostało niegdyś podbite przez Mongołów, Turków i Tatarów. Musimy wyciągnąć wnioski z błędów przeszłości i zainwestować we wzmocnienie naszych linii obronnych, aby żaden wróg nie zagroził już Gruzji!"
