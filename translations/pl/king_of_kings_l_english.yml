 mam_had_administration_syria_event_tt: "Wystąpiło wydarzenie „§YZarządzanie północnymi terytoriami§!”"
 geo_a_house_divided_title: "Rozdarty kraj"
 geo_a_house_divided_desc: "Władza centralna w Gruzji od dłuższego czasu słabnie. Aby zapobiec nadciągającemu kryzysowi, musimy zadbać o to, by wszystkie podległe nam ziemie znajdowały się pod pełną kontrolą dworu królewskiego w Tbilisi."
 geo_vakhtangs_succession_title: "Sukcesja Wachtanga"
 geo_vakhtangs_succession_desc: "Los Gruzji jest ściśle związany z królem Wachtangiem i kwestią jego następstwa. Dopóki nie doczekamy się prawowitego dziedzica, możnowładcy oraz członkowie dynastii Bagrationich będą rywalizować o tron."
 geo_preventing_collapse_title: "Zapobiec upadkowi"
 geo_preventing_collapse_desc: "Udało nam się zażegnać kryzys. Królestwo potrzebuje jeszcze czasu, by w pełni otrząsnąć się z zawirowań, lecz mamy nadzieję, że okres odbudowy przyniesie odnowę naszych sił, ożywienie gospodarki i handlu oraz zapoczątkuje nową erę dobrobytu."
 geo_cross_the_caucasus_title: "Wrota Aleksandra"
 geo_cross_the_caucasus_desc: "Zdołaliśmy umocnić naszą władzę w Gruzji, lecz teraz nadszedł czas, by rozszerzyć wpływy na ziemie, które niegdyś do nas należały. Przekroczmy zatem tak zwane Wrota Aleksandra i podporządkujmy sobie plemiona zamieszkujące tereny na północ od Kaukazu."
 geo_sack_sarai_title: "Zguba kagana"
 geo_sack_sarai_desc: "Stepy na północ od Kaukazu zamieszkują koczownicze plemiona, spadkobiercy Czyngis-chana, którzy stali się plagą świata prawosławnego. Nadszedł czas, by położyć kres ich rządom i raz na zawsze usunąć to zagrożenie."
 geo_envoy_to_the_tsar_title: "Poselstwo do cara"
 geo_envoy_to_the_tsar_desc: "Carowie moskiewscy bez wątpienia wyrośli na dominującą potęgę całej Rusi. Rozsądnie byłoby wysłać misję dyplomatyczną i nawiązać z nimi stosunki. W Moskwie możemy znaleźć zarówno cennego sojusznika, jak i groźnego przeciwnika."
 geo_revive_native_literature_title: "Odrodzenie rodzimej literatury"
 geo_revive_native_literature_desc: "Na przestrzeni wieków nasza cywilizacja wykształciła trzy odrębne pisma: asomtawruli, nuschuri i mchedruli, z których każde odzwierciedla bogactwo naszego dziedzictwa. Mchedruli jest pismem naszej ziemi, niezwiązanym bezpośrednio ze sferą sakralną Kościoła. Powinniśmy z dumą je promować, rozwijać i upowszechniać wśród wykształconych elit. Dążymy do tego, by nasz język i pismo rozpowszechniły się w całym regionie Kaukazu."
 geo_cathedral_living_pillar_title: "Katedra Sweti Cchoweli"
 geo_cathedral_living_pillar_desc: "Katedra Sweti Cchoweli, znana jako Katedra Żywego Słupa, jest otaczana ogromną czcią jako jedno z najświętszych miejsc na Kaukazie i stanowi centrum Gruzińskiego Kościoła Apostolskiego. Niestety upływ czasu odcisnął piętno na tej świątyni, której los splótł się z upadkiem naszego narodu. Nadszedł odpowiedni moment, by rozpocząć gruntowną odbudowę katedry i przywrócić jej dawny blask, tak aby znów świadczyła o potędze, wytrwałości i prestiżu Gruzji."
 geo_catholicos_patriarch_title: "Patriarchat całej Gruzji"
 geo_catholicos_patriarch_desc: "Nasza religia i Kościół stanowią fundamenty naszej tożsamości. Gruziński Kościół ma długą historię i cieszy się wielkim szacunkiem na całym świecie. Wraz ze wzrostem wpływów naszego państwa coraz liczniej podnoszą się głosy, by podnieść rangę naszego autokefalicznego Kościoła do godności patriarchatu."
 geo_reclaim_shirvanshah_title: "Odzyskać Szyrwan"
 geo_reclaim_shirvanshah_desc: "Niegdyś region Szyrwanu znajdował się pod zwierzchnictwem Gruzji, zapewniając nam cenny dostęp do bogactw Morza Kaspijskiego. Odzyskanie kontroli nad tą strategicznie ważną prowincją i ponowne włączenie jej do naszego państwa ma dla nas najwyższe znaczenie."
 geo_seize_crimea_title: "Zdobyć Krym"
 geo_seize_crimea_desc: "Półwysep Krymski jest ostatnim schronieniem tatarskich najeźdźców zagrażających naszemu królestwu. Musimy stawić im czoła i przejąć kontrolę nad półwyspem, umacniając tym samym nasze panowanie nad Morzem Czarnym i otwierając nowe szlaki handlowe na Ruś."
 geo_monopolize_the_black_sea_title: "Zmonopolizować Morze Czarne"
 geo_monopolize_the_black_sea_desc: "Dzięki naszym zwycięskim kampaniom przeciwko Tatarom większość wybrzeża Morza Czarnego znalazła się pod naszym panowaniem. Kolejnym krokiem będzie umocnienie kontroli nad tym akwenem i wykorzystanie jej do rozwoju handlu z Grekami, Turkami oraz państwami Bałkanów."
 geo_rebuild_tbilisi_title: "Odbudować Tbilisi"
 geo_rebuild_tbilisi_desc: "Od wielu lat nasza stolica cierpi z powodu zniszczeń i upadku spowodowanych najazdami nieprzyjaciół. Niegdyś wspaniałe miasto, perła Kaukazu, stało się dziś zaledwie podupadłym ośrodkiem miejskim. To na nas spoczywa odpowiedzialność za przywrócenie mu dawnej świetności."
 geo_georgian_wineyards_title: "Gruzińskie winnice"
 geo_georgian_wineyards_desc: "Tradycja winiarska Gruzji ma głębokie korzenie i liczy sobie stulecia, jeśli nie tysiąclecia. Wino jest jednym z naszych najważniejszych towarów, dlatego powinniśmy zadbać o to, by zyskało uznanie i sławę na całym świecie."
 geo_legacy_of_the_builder_title: "Dziedzictwo Budowniczego"
 geo_legacy_of_the_builder_desc: "Za panowania króla Dawida, zwanego Budowniczym, Gruzja przeżywała złoty wiek. Czerpmy inspirację z jego niezwykłego dziedzictwa i zadbajmy, by nasze miasta zyskały sławę, bogactwo oraz znaczenie."
 geo_recover_strength_title: "Odzyskać siły"
 geo_recover_strength_desc: "Minione stulecie było dla Gruzji okresem pełnym niepokojów, naznaczonym ogromnym cierpieniem i stopniowym upadkiem. Staliśmy się słabym państwem, odizolowanym politycznie i otoczonym ze wszystkich stron przez wrogów. Jeśli chcemy przetrwać i rozwijać się w nieustannie zmieniającym się świecie, musimy odzyskać siły i zawrzeć sojusze. Odbudowując nasze wpływy i nawiązując strategiczne partnerstwa, zdołamy sprostać nadchodzącym wyzwaniom i zapewnić pomyślną przyszłość naszej ukochanej ojczyźnie."
 geo_liberate_armenia_title: "Ambicje królowej Tamar"
 geo_liberate_armenia_desc: "Za panowania królowej Tamar nasze władztwo objęło rozległe ziemie, w tym również Armenię. Z bólem patrzymy jednak, jak nasi chrześcijańscy bracia i siostry pozostają pod jarzmem Turkomanów. Musimy nadać pierwszeństwo ich wyzwoleniu i odzyskać te terytoria, przywracając nad nimi władzę Tbilisi."
 geo_turkoman_title: "Dziedzice Seldżuków"
 geo_turkoman_desc: "Potężni niegdyś Seldżucy przeszli już do historii, lecz ich potomkowie nadal władają rozległymi ziemiami i kontrolują Bliski Wschód. Nadszedł najwyższy czas, by położyć kres dziedzictwu Seldżuków i odzyskać te ziemie, przywracając na nich władzę chrześcijańską. Krzyż zatriumfuje nad półksiężycem!"
 geo_anatolian_incursion_title: "Wyprawa do Anatolii"
 geo_anatolian_incursion_desc: "Bitwa pod Manzikertem stanowi punkt zwrotny w historii Anatolii. Po klęsce Cesarstwa Bizantyjskiego wojska tureckie szybko rozszerzyły swoje wpływy i umocniły panowanie nad tym regionem. Musimy dokonać tego, czego nie udało się osiągnąć naszym poprzednikom, pomścić Manzikert i stać się nową potęgą Anatolii."
 geo_break_the_crescent_title: "Upadek imperium"
 geo_break_the_crescent_desc: "Imperium Osmańskie wyrosło na dominującą potęgę na Bałkanach i Bliskim Wschodzie, stanowiąc poważne zagrożenie dla całego świata chrześcijańskiego. Musimy obalić to imperium niewiernych i skazać je na zapomnienie."
 geo_throne_of_the_romans_title: "Tron Rzymian"
 geo_throne_of_the_romans_desc: "Wielki Konstantynopol został zdobyty przez pogańskie wojska, co okryło hańbą wspaniałe dziedzictwo Rzymian. Naszym świętym obowiązkiem jest podjęcie krucjaty, by wyzwolić ten bezcenny klejnot chrześcijańskiego świata spod jarzma najeźdźców i przywrócić mu dawną świetność. Gdy gruziński cesarz zasiądzie na rzymskim tronie, Konstantynopol odzyska należne mu miejsce pełne chwały i splendoru."
 geo_deal_with_the_komnenids_title: "Rozwiązać kwestię Komnenów"
 geo_deal_with_the_komnenids_desc: "Cesarstwo Trapezuntu od dawna pozostaje naszym przyjacielem i naturalnym sojusznikiem w walce o przetrwanie. Powinniśmy zacieśnić łączące nas więzi, a być może nawet rozważyć podporządkowanie go jako wasala. Nie zapominajmy, że powstanie tego cesarstwa było częściowo możliwe dzięki pomocy naszej królowej Tamar. Warto przypomnieć im o wspólnej historii i znaczeniu naszej dawnej współpracy."
 geo_slay_the_white_sheep_title: "Zgładzić Białą Owcę"
 geo_slay_the_white_sheep_desc: "Turkomani od dawna zagrażają bezpieczeństwu i suwerenności naszego królestwa. Widmo ich zwycięstwa i późniejszego podboju naszych ziem nie pozostawia nam wyboru — musimy działać szybko i zdecydowanie. Nadszedł czas, by uprzedzić ich ruchy, rozpocząć ofensywę i zneutralizować niebezpieczeństwo, które nad nami wisi. Biała Owca musi zostać zgładzona!"
 geo_claim_the_holy_city_title: "Zająć Święte Miasto"
 geo_claim_the_holy_city_desc: "Dopóki Jerozolima pozostaje we władaniu Saracenów, nad chrześcijaństwem będzie wisiał mroczny cień. Odzyskanie ziem, po których stąpał Chrystus, będzie najwyższym aktem zbawienia, a nasze dążenie do tego celu stanie się wiecznym świadectwem niezłomnej wiary. Święte Miasto musi należeć do nas."
 geo_beacon_of_christendom_title: "Latarnia chrześcijaństwa"
 geo_beacon_of_christendom_desc: "Nasza święta misja przywrócenia potęgi chrześcijaństwa zakończyła się powodzeniem. Jako obrońcy prawdziwej wiary musimy teraz dowieść światu naszej pobożności i sprawiedliwości, którą obdarzył nas Bóg, i uczynić z naszego państwa zjednoczoną ostoję chrześcijaństwa!"
 geo_fortify_caucasia_title: "Ufortyfikować Kaukaz"
 geo_fortify_caucasia_desc: "Nasze ziemie wielokrotnie padały ofiarą ekspansji niewiernych, barbarzyńskiego okrucieństwa i bezprawnych podbojów obcych najeźdźców. Teraz bardziej niż kiedykolwiek musimy przekształcić górskie siedziby naszych potulnych chłopów w ośrodki poboru i systemy zamków. Kości każdego zuchwałego zdobywcy zostaną starte na proch u stóp naszych świętych szczytów."
 geo_encroach_mamluks_title: "Zagroź mamelukom"
 geo_encroach_mamluks_desc: "Słabość sił katolickich doprowadziła do utraty Ziemi Świętej na rzecz Saracenów. Jesteśmy jednak zdecydowani wyciągnąć wnioski z ich błędów i zwyciężyć w dążeniu do przywrócenia Lewantu pod sprawiedliwe rządy niegdyś dumnego symbolu religijnego. Z niezachwianą determinacją naprawimy dawne porażki, odzyskamy święte miejsca i przywrócimy dominację naszej wiary w regionie. Nasze zdecydowane działania staną się źródłem nadziei i natchnienia, dzięki czemu światło Świętego Krzyża ponownie rozbłyśnie nad ziemiami Lewantu."
 geo_conquer_cyprus_title: "Podbić Cypr"
 geo_conquer_cyprus_desc: "Cypr zajmuje niezwykle ważną pozycję strategiczną we wschodniej części Morza Śródziemnego. Musimy dostrzec znaczenie tej wyspy i zawrzeć sojusze z miejscowymi krzyżowcami, tworząc wspólny front, który umocni i rozszerzy nasze wpływy w regionie. Dzięki temu skonsolidujemy nasze panowanie i zapewnimy sobie przewagę w tej kluczowej części świata."
 geo_eastern_patriarchates_title: "Światło Wschodu"
 geo_eastern_patriarchates_desc: "Od upadku wschodnich patriarchatów pod panowanie muzułmanów minęły stulecia, a chrześcijanie wciąż żyją pod ich okrutnym jarzmem. Nasze święte legiony wyzwolą te miasta i przywrócą im dawny status. Przypomnijmy światu, że światło Wschodu jeszcze nie zgasło!"
 geo_crade_of_civilization_title: "Kolebka cywilizacji"
 geo_crade_of_civilization_desc: "Od niepamiętnych czasów Mezopotamia była kolebką wielu potężnych cywilizacji. Nadszedł czas, by wyzwolić ją spod muzułmańskiego panowania i wykorzystać jej bogactwa dla własnej korzyści."
 SAMTAVRO: "Samtawro"
