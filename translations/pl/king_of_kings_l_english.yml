 arm_converting_culture_tt: "Zmiana kultury prowincji na §Y[Root.Culture.GetName]§! zapewnia teraz §G1§! lokalny punkt rozwoju podatków, produkcji i zasobów ludzkich."
 arm_resettle_ancestral: "Ponownie zasiedlić ziemie przodków"
 desc_arm_caspian_riches: "Dzięki podbojowi Szyrwanu uzyskaliśmy dostęp do Morza Kaspijskiego. Powinniśmy wykorzystać tę możliwość do rozwoju handlu i pomnażania bogactwa państwa."
 desc_arm_resurgence: "Po latach poddaństwa wreszcie jesteśmy wolni! Nadszedł czas, by przywrócić Armenii dawną chwałę!"
 desc_arm_liberator: "Nasz chwalebny przywódca poprowadził nas do wielu zwycięstw. Niech zostanie zapamiętany jako Wyzwoliciel Armenii!"
 desc_arm_resurgent_armenia: "Odzyskaliśmy ziemie, które niegdyś należały do naszych przodków. Stąd stworzymy wspaniałą przyszłość wielkiego narodu ormiańskiego."
 desc_arm_georgian_union: "Gruzinów łączą z nami więzy braterstwa i dopóki pozostaniemy zjednoczeni, nikt nie zdoła nam się przeciwstawić."
 desc_arm_caucasian_union: "Narody Kaukazu od dawna pozostają pod jarzmem obcych potęg. Pod naszym panowaniem będą cieszyć się wolnością i równymi prawami."
 desc_arm_church_east: "Nasz sojusz z Kościołem Wschodu przywróci panowanie Krzyża na Bliskim Wschodzie."
 desc_arm_dethrone_turkomans: "Turkomani przestali być cierniem w naszym boku. Rozbiliśmy ich armie, a ich ziemie stoją przed nami otworem."
 desc_arm_artaxiad_legacy: "Chwała dynastii Artaksydów wciąż żyje. Naszym zadaniem jest odzyskać ziemie, którymi niegdyś władali, i rozszerzyć nasze panowanie jeszcze dalej."
 desc_arm_national_awakening: "Nasz naród wreszcie budzi się z długiego snu. Ormianie blisko i daleko od ojczyzny mogą być dumni z odrodzonej świadomości narodowej."
 desc_arm_booming_wool_industry: "Przemysł wełniany stanowi podstawę naszej gospodarki. Inwestycje w jego rozwój przyniosą nam ogromne korzyści."
 desc_arm_resettle_ancestral: "Nadszedł czas, by ponownie zasiedlić Ormianami ziemie, które niegdyś należały do nas — mamy do nich niezbywalne prawo!"
 desc_arm_reunite_diaspora: "Naród ormiański jest rozproszony po rozległych ziemiach. Musimy zrobić wszystko, by sprowadzić rodaków do domu i osiedlić ich w naszych ziemiach macierzystych."
 desc_arm_renew_crusades: "Świat chrześcijański bardzo ucierpiał z powodu zagrożenia ze strony półksiężyca. Nadszedł czas, by rozpocząć nową krucjatę i odwrócić losy tej odwiecznej wojny."
 desc_arm_new_anatolian_hegemon: "Hegemonia Osmanów należy już do przeszłości. Ich rozdział historii dobiega końca, a nasz dopiero się rozpoczyna!"
 desc_arm_great_city_tigranes: "Wielkie miasto Tigranakert zostało wreszcie odbudowane. Dumnie świadczy o bogactwie i potędze naszego narodu."
 desc_arm_ecclesiastical_revival: "Ormiański Kościół Apostolski bardzo ucierpiał w minionych stuleciach. Odnówmy naszą religię, ponieważ jest jednym z filarów naszej państwowości."
 desc_arm_cathedral: "Najświętsza katedra w Erywaniu odzyskała dawną świetność. Radujcie się, wierni Armenii!"
 desc_arm_holy_sites_protector: "Odzyskaliśmy zbezczeszczone święte miejsca naszego Kościoła i przywróciliśmy im dawną chwałę. Na zawsze będziemy ich strażnikami."
 desc_arm_sword_of_true_faith: "Jesteśmy mieczem prawdziwej wiary, a każdego, kto odważy się nam przeciwstawić, spotka straszliwy los!"
 desc_arm_coptic_restoration: "Starożytne ziemie Egiptu rozkwitną pod przywróconym panowaniem chrześcijan koptyjskich."
 desc_arm_new_capital: "Musimy zainwestować w nowo wybraną stolicę, aby odzwierciedlała bogactwo i potęgę naszego państwa."
 desc_geo_restoring_order: "Udało nam się przezwyciężyć kryzys zagrażający naszemu państwu i przywrócić porządek w Gruzji."
 desc_geo_rus_alliance: "Carowie Rosji są naszymi naturalnymi sojusznikami i braćmi w wierze. Razem dokonamy wielkich rzeczy!"
 desc_geo_powerful_nobles: "Gruzińska szlachta otrzymała zbyt wiele swobody, a niemal nic nie ogranicza jej samowoli. Stanowi ona poważne zagrożenie dla naszego państwa."
 desc_geo_house_reunited: "Rozwiązaliśmy problemy dynastyczne, a ziemie dynastii Bagrationich ponownie zostały zjednoczone."
 desc_geo_succession_secured: "Zażegnaliśmy groźbę kryzysu sukcesyjnego. Niech żyje król i jego prawowity dziedzic!"
 geo_privilege_mountains: "Rozwój infrastruktury górskiej"
 desc_geo_privilege_mountains: "Górzyste ukształtowanie naszego kraju nie może powstrzymać nas przed wznoszeniem wspaniałych budowli i rozbudową miast."
 desc_geo_bane_khagan: "Chanaty stepowe zostały rzucone na kolana. Staliśmy się pogromcami chanów!"
 desc_geo_caucasian_campaign: "Ziemie Kaukazu są podzielone między liczne rywalizujące plemiona. Zjednoczmy je pod naszym panowaniem i uczyńmy ich ziemie wolnymi od obcej opresji."
 desc_geo_consolidate_caucasia: "Jeśli naprawdę chcemy w pełni kontrolować Kaukaz, musimy zadbać o to, by cały region znalazł się pod naszym bezpośrednim panowaniem."
 desc_geo_rein_in_azeris: "Azerowie wyznają inną wiarę i należą do odmiennej kultury. W przyszłości mogą sprawiać problemy, dlatego lepiej zawczasu temu zapobiec."
 desc_geo_armenian_union: "Ormianie są naszymi braćmi i dopóki pozostaniemy zjednoczeni, nikt nie zdoła nam się przeciwstawić."
 desc_geo_break_legacy_seljuk: "Dziedzice Seldżuków dogorywają. Pomściliśmy zniszczenia, których dokonali w Gruzji."
 desc_geo_resurgent_georgia: "Po rozwiązaniu problemów wewnętrznych nadszedł czas, by rozszerzyć nasze wpływy na zewnątrz."
 desc_geo_centers_of_trade: "Rozbudowa miast handlowych wzdłuż wybrzeża Morza Czarnego pozwoli nam skuteczniej kontrolować miejscowe sieci handlowe."
 desc_geo_counter_turkomans: "Turkomani słyną z umiejętnego wykorzystywania kawalerii, lecz opracowaliśmy taktykę, która pozwoli nam skutecznie przeciwstawić się ich sposobom walki."
 desc_geo_wrath_christendom: "Gniew całego chrześcijaństwa spadnie na naszych wrogów, którzy zapłacą za cierpienia, jakie nam zadali."
 desc_geo_east_mediterranean: "Kto kontroluje wschodnią część Morza Śródziemnego, ten kontroluje handel z Egiptem i Maszrikiem. To my musimy dzierżyć tę władzę!"
 desc_geo_light_of_the_east: "Mroczne wieki chrześcijaństwa na Bliskim Wschodzie dobiegły końca. Jesteśmy Światłem Wschodu i przywrócimy panowanie Krzyża!"
 desc_geo_narikala_leviathan: "Twierdza Narikala w Tbilisi najlepsze lata ma już za sobą. Odnówmy ją, by zapewnić bezpieczeństwo naszej stolicy."
 desc_geo_narikala_no_leviathan: "Twierdza Narikala w Tbilisi najlepsze lata ma już za sobą. Odnówmy ją, by zapewnić bezpieczeństwo naszej stolicy."
 desc_geo_wineyards: "Produkcja wina jest ważną częścią naszej gospodarki i dziedzictwa narodowego. Zadbajmy o to, by nasze winnice dostarczały najlepszego wina na świecie!"
 desc_geo_tbilisi: "Nasza stolica powinna odzwierciedlać chwałę narodu. Uczyńmy z niej miasto, którego będą nam zazdrościć nawet nasi wrogowie."
 desc_geo_second_golden_age: "Zapoczątkujmy nową złotą epokę, przywracając dziedzictwo Tamar Wielkiej i Dawida Budowniczego!"
 desc_geo_michael_bonus: "Dostąpiliśmy błogosławieństwa świętego Michała Archanioła. Niech otoczy Gruzję swoją opieką!"
 desc_geo_eleusa_bonus: "Dostąpiliśmy błogosławieństwa Najświętszej Maryi Panny. Niech Matka Boża otoczy Gruzję swoją opieką!"
 desc_geo_christ_bonus: "Dostąpiliśmy błogosławieństwa Mesjasza. Niech wszechmogący Chrystus otoczy Gruzję swoją opieką!"
 desc_geo_nicholas_bonus: "Dostąpiliśmy błogosławieństwa świętego Mikołaja Cudotwórcy. Niech otoczy Gruzję swoją opieką!"
 desc_geo_john_bonus: "Dostąpiliśmy błogosławieństwa świętego Jana Klimaka. Niech otoczy Gruzję swoją opieką!"
 desc_geo_legacy_builder: "Nadszedł czas, by wskrzesić dziedzictwo Dawida Budowniczego i odnowić architektoniczne cuda naszego kraju."
 desc_geo_trade_hegemony: "Morze Czarne znajduje się pod naszą niepodzielną kontrolą. Wykorzystajmy tę przewagę, by rozwinąć szlaki handlowe i sprowadzić do Gruzji ogromne bogactwa."
 desc_geo_religious_mission: "Naszym świętym obowiązkiem jest szerzenie słowa Bożego. Nawrócimy pogan na jedyną prawdziwą wiarę."
 desc_geo_consecrated_ground: "Pod naszym przewodnictwem uświęcone ziemie staną się miejscem oddawania czci Bogu."
 desc_geo_beacon1: "Mroczne wieki chrześcijaństwa na Bliskim Wschodzie dobiegły końca. Jesteśmy Latarnią chrześcijaństwa i przywrócimy panowanie Krzyża!"
 desc_geo_beacon2: "Mroczne wieki chrześcijaństwa na Bliskim Wschodzie dobiegły końca. Jesteśmy Latarnią chrześcijaństwa i przywrócimy panowanie Krzyża!"
 desc_geo_beacon1_empowered: "Mroczne wieki chrześcijaństwa na Bliskim Wschodzie dobiegły końca. Jesteśmy Latarnią chrześcijaństwa i przywrócimy panowanie Krzyża!"
 desc_geo_beacon2_empowered: "Mroczne wieki chrześcijaństwa na Bliskim Wschodzie dobiegły końca. Jesteśmy Latarnią chrześcijaństwa i przywrócimy panowanie Krzyża!"
 desc_geo_realm_reborn: "Kryzys został zażegnany. Zapoczątkujmy nową epokę dobrobytu i pokoju!"
 desc_geo_heirs_of_romans: "Rzymski tron należy do nas. Odzyskaliśmy wspaniałe dziedzictwo Rzymu i godnie będziemy je kontynuować."
 desc_geo_fertile_crescent: "Żyzne ziemie Mezopotamii pozwoliły rozkwitnąć wielu cywilizacjom. Nasza nie będzie wyjątkiem."
 desc_geo_embassies: "Wykorzystajmy zdolności dyplomatyczne naszych ambasadorów, by rozbudować siatkę szpiegowską w obcych państwach."
 desc_geo_broke_tatar_yoke: "Niezliczone chrześcijańskie narody przez wiele lat żyły pod jarzmem tatarskim. Wreszcie odzyskały wolność, a jarzmo to należy już do przeszłości."
 desc_geo_righteous_conquest: "Okazaliśmy miłosierdzie mieszkańcom Saraju, dając do zrozumienia ludom żyjącym pod tatarskim jarzmem, że nie muszą obawiać się naszych podbojów."
 desc_geo_avenging_manzikert: "Wspomnienie Manzikertu wciąż prześladuje wielu chrześcijan, ponieważ bitwa ta była punktem zwrotnym w historii Azji Mniejszej i chrześcijaństwa. Wreszcie pomściliśmy tę druzgocącą klęskę."
 desc_geo_turning_the_tide: "Gruzja podniosła się z ruin i odwraca teraz losy wojny o panowanie nad Anatolią."
 desc_geo_restore_holy_city: "Najświętsze miasto chrześcijaństwa bardzo ucierpiało pod muzułmańskim panowaniem. Przywrócimy mu dawną świetność."
 desc_geo_restore_holy_city2: "Najświętsze miasto chrześcijaństwa bardzo ucierpiało pod muzułmańskim panowaniem. Przywrócimy mu dawną świetność."
 desc_geo_strengthen_the_true_faith: "Nasz Kościół jako jedyny podąża za prawdziwą nauką, dlatego musi pozostać silny i stanowić wzór dla innych!"
 desc_geo_city_world_desire: "Miasto pożądane przez cały świat znajduje się pod naszą kontrolą. Przywrócimy mu globalne znaczenie, jakie miało przed wiekami."
 desc_geo_conceded_demands: "Ustąpiliśmy żądaniom szlachty, by zachować pokój i stabilność w Gruzji."
 qara_qoyunlu_emirs_mesopotamia_title: "Emirowie Mezopotamii"
 qara_qoyunlu_emirs_mesopotamia_desc: "W 1431 roku Ispend ibn Jusuf, brat naszego władcy Dżahana Szaha, zdobył Bagdad i położył kres sułtanatowi Dżalajirydów, który kontrolował ten region od upadku Ilchanatu. Ogłosił się emirem Bagdadu i choć formalnie nadal jest poddanym Dżahana Szaha, członek naszej dynastii z tak potężną bazą wpływów może okazać się niebezpieczny. Musimy ograniczyć jego wpływy i zacieśnić kontrolę nad Mezopotamią, najlepiej nie zrażając przy tym miejscowych elit."
 qara_qoyunlu_custodian_of_baghdad_title: "Opiekunowie Bagdadu"
 qara_qoyunlu_custodian_of_baghdad_desc: "Bagdad, niegdyś latarnia wiedzy i kultury, wciąż nosi blizny po niszczycielskim mongolskim najeździe. Echa dawnych tętniących życiem targowisk i debat uczonych zdają się należeć do zamierzchłej przeszłości. Jako nowi opiekunowie Bagdadu odbudujemy jego infrastrukturę, zapewnimy bezpieczeństwo mieszkańcom i ponownie zapełnimy biblioteki uczonymi, przywracając miastu status klejnotu świata islamu."
 qara_qoyunlu_house_of_wisdom_title: "Dom Mądrości"
 qara_qoyunlu_house_of_wisdom_desc: "Dom Mądrości, symbol wiedzy i oświecenia w Bagdadzie, odradza się pod naszym światłym przywództwem. Niegdyś stanowił schronienie dla uczonych, a dzięki starannej odbudowie odzyska dawną świetność. Zgromadzą się w nim wybitni myśliciele, sprzyjając wymianie intelektualnej i innowacjom. Biblioteki Domu Mądrości ponownie wypełnią się starożytnymi tekstami, które zainspirują nowe odkrycia. Jako mecenasi wiedzy zapiszemy się w pamięci potomnych i zapoczątkujemy nową erę oświecenia."
 qara_qoyunlu_a_gunpowder_empire_title: "Imperium prochu"
 qara_qoyunlu_a_gunpowder_empire_desc: "Choć od stuleci nasza tradycja wojskowa opiera się na kawalerii, zmieniający się charakter wojny zmusza nas do przyjęcia nowych technologii i dostosowania strategii walki. Imperia na całym świecie zaczynają dostrzegać niszczycielską siłę prochu strzelniczego. Jeśli chcemy zwyciężać, nie możemy pozostawać w tyle."
 qara_qoyunlu_reform_the_army_title: "Zreorganizować państwo"
 qara_qoyunlu_reform_the_army_desc: "U szczytu potęgi Osmanowie stworzyli niezwykle zaawansowany system administracji państwowej i organizacji wojska. Pod tym względem nasze państwo, oparte na strukturach na wpół plemiennych, wyraźnie pozostaje w tyle. Niektórzy doradzają nam przyjęcie różnych osmańskich instytucji, co mogłoby przynieść korzyści całemu państwu."
 qara_qoyunlu_anatolian_turnabout_title: "Odwrócić losy Anatolii"
 qara_qoyunlu_anatolian_turnabout_desc: "Osmanowie zwyciężyli w kampaniach przeciwko Rzymianom i bejlikom, ustanawiając swoją hegemonię w Anatolii. Teraz, gdy wreszcie dysponujemy siłą niezbędną, by stawić im czoła, nadszedł czas odwrócić bieg historii na naszą korzyść."
 qara_qoyunlu_dismantle_ak_qoyunlu_title: "Rozbić Aq Kojunlu"
 qara_qoyunlu_dismantle_ak_qoyunlu_desc: "Nasi turkmeńscy bracia z Aq Kojunlu znaleźli się w trudnym położeniu, otoczeni przez wielkie potęgi pragnące ich sobie podporządkować. Interweniujmy, a łącząc nasze państwa, uchronimy ich przed najgorszym losem."
 qara_qoyunlu_control_hormuz_title: "Przejąć kontrolę nad Ormuz"
 qara_qoyunlu_control_hormuz_desc: "Ormuz, położony u wejścia do Zatoki Perskiej, jest kluczem do rozległej sieci handlowej łączącej Bliski Wschód z zamorskimi regionami. Jego strategiczne położenie czyni go ważnym ogniwem szlaku dostaw między Persją a Arabią. Kontrolując Ormuz, zyskamy znaczną przewagę w kształtowaniu handlu i zapewnimy dobrobyt gospodarczy naszemu państwu."
 qara_qoyunlu_dominate_the_gulf_title: "Zdominować Zatokę Perską"
 qara_qoyunlu_dominate_the_gulf_desc: "Dominacja nad Zatoką Perską ma kluczowe znaczenie gospodarcze dla naszego państwa. Jeśli przejmiemy kontrolę nad przepływem towarów, będziemy mogli zgromadzić ogromne bogactwa."
 qara_qoyunlu_secure_basra_title: "Zdobyć Basrę"
 qara_qoyunlu_secure_basra_desc: "Skoro Mezopotamia znajduje się już pod naszą silną kontrolą, powinniśmy rozszerzyć granice aż do wybrzeży Zatoki Perskiej. Dzięki handlowi morskiemu przyniesie to naszemu państwu znaczne bogactwa."
 qara_qoyunlu_merchant_fleet_title: "Zbudować flotę handlową"
 qara_qoyunlu_merchant_fleet_desc: "Bogactwo narodów przewozi się nie tylko lądem, lecz także przez bezkresne morza. Skoro bogactwa Zatoki Perskiej są w naszym zasięgu, nadszedł czas zbudować flotę handlową, która będzie przemierzać błękitne wody i łączyć nasze imperium z odległymi rynkami."
 qara_qoyunlu_stabilize_interior_title: "Ustabilizować sytuację wewnętrzną"
 qara_qoyunlu_stabilize_interior_desc: "Niedawny konflikt z Gruzją odcisnął piętno na naszym imperium. Nasze dzielne wojska poniosły straty, poddani są niespokojni, a skutki wojny dają się odczuć w całym państwie. Teraz musimy przywrócić stabilność wewnętrzną. Należy uzupełnić zasoby ludzkie, uspokoić poddanych i naprawić tkankę społeczną nadwyrężoną przez wojnę. Dopiero gdy uporządkujemy sprawy wewnętrzne i ponownie staniemy się silnym, niewzruszonym monolitem, będziemy mogli skierować wzrok ku kolejnym podbojom."
 qara_qoyunlu_caucasian_consolidation_title: "Skonsolidować Kaukaz"
 qara_qoyunlu_caucasian_consolidation_desc: "Podbój Armenii otworzył nam drogę do podporządkowania Kaukazu, zamieszkanego przez słabe plemiona i rozpadające się królestwa. Choć przeciwnicy są słabi, podporządkowanie Ormian i ich bunty pokazały, że kontrolowanie regionu nie będzie łatwe. Musimy zatem ustabilizować nasze rządy, albo uznając miejscową ludność za równą nam, albo wskazując jej światło Allaha."
 qara_qoyunlu_overpower_the_mamluks_title: "Pokonaj mameluków"
 qara_qoyunlu_overpower_the_mamluks_desc: "Sułtanat mameluków, państwo stworzone rękami dawnych niewolników, wyrósł na groźnego przeciwnika. Ich dominacja w Egipcie i Lewancie stanowi coraz większe zagrożenie dla naszych ambicji w regionie. Każde imperium ma jednak słabe punkty i mamelucy nie są wyjątkiem. Nadszedł czas, by opracować strategię, rozsądnie wykorzystać nasze zasoby i zadać dotkliwy cios strukturze ich władzy."
 qara_qoyunlu_mounted_dread_title: "Postrach na koniach"
 qara_qoyunlu_mounted_dread_desc: "Nasze stepowe dziedzictwo daje nam niezrównane zrozumienie sztuki walki konnej. Nadszedł czas, by sięgnąć do tradycji przodków i stworzyć elitarną formację kawalerii, która stanie się postrachem przeciwników. Wykorzystamy spuściznę stepowych wojowników, by uczynić z naszej jazdy potężną broń i wzbudzić trwogę we wszystkich, którzy odważą się stanąć przeciwko Kara Kojunlu."
 qara_qoyunlu_princes_of_persia_title: "Książęta Persji"
 qara_qoyunlu_princes_of_persia_desc: "Potężne imperium Timurydów chyli się ku upadkowi. Życie Szaha Rucha nieuchronnie dobiega końca, a zdradzieccy książęta Persji stoją za jego plecami z dobytymi sztyletami, żądni krwawej zemsty. Ten chaos stwarza wyjątkową okazję, by uderzyć na osłabionych Timurydów i otworzyć sobie drogę do podporządkowania Persji."
 qara_qoyunlu_dethrone_the_timurids_title: "Złamać ród Timura"
 qara_qoyunlu_dethrone_the_timurids_desc: "Pozostałości niegdyś potężnego imperium Timurydów są jedynie cieniem dawnej chwały. Ich władza nad terytoriami słabnie pod naporem wewnętrznych konfliktów i zewnętrznej presji. Musimy zdobyć ich stolicę, Herat, zniszczyć dziedzictwo rodu Timura i ostatecznie położyć kres jego panowaniu."
 qara_qoyunlu_legacy_of_seljuk_title: "Dziedzictwo Seldżuka"
 qara_qoyunlu_legacy_of_seljuk_desc: "Przed wiekami wielkie imperium Seldżuków wytyczyło szlak chwały przez rozległe ziemie Persji i Chorasan. Jego dziedzictwo wciąż rozbrzmiewa w wiatrach przemierzających te starożytne krainy. Jako Kara Kojunlu jesteśmy potomkami tych potężnych wojowników i mądrych władców. Nadszedł czas, by uczcić przodków i dokonać tego, co oni — całkowicie podporządkować sobie Persję i Chorasan."
 qara_qoyunlu_the_oghuz_homeland_title: "Ojczyzna Oguzów"
 qara_qoyunlu_the_oghuz_homeland_desc: "Wichry stepów Azji Środkowej niosą opowieści o naszych przodkach, potężnych Turkach Oguzach, którzy niegdyś przemierzali te ziemie. Jako ich spadkobiercy nosimy w żyłach krew niezłomnych koczowników. Ich dziedzictwo trwa nie tylko w naszych sercach, lecz także na suchych równinach Azji Środkowej. Nadszedł czas, by odnowić więzi z ojczyzną przodków i objąć te ziemie naszym panowaniem."
 qara_qoyunlu_era_title: "Epoka Czarnej Owcy"
 qara_qoyunlu_era_desc: "W całym naszym państwie na wietrze powiewa godło Czarnej Owcy, nasz czcigodny symbol. Nasze rządy przyniosły nie tylko stabilność i dobrobyt — pod naszym przewodnictwem rozkwitł również złoty wiek kultury. Poezja i proza, muzyka i taniec, architektura i nauka — wszystkie dziedziny kultury rozwinęły się, przywołując chwałę przeszłości i otwierając nowe obszary twórczości oraz wiedzy. Rozpoczęła się „Epoka Czarnej Owcy”, czas bezprecedensowego rozkwitu intelektualnego i artystycznego pod sztandarem Kara Kojunlu. Musimy pielęgnować tę epokę i głosić wszem wobec, że Czarna Owca panuje w czasach oświecenia i dobrobytu."
 qara_qoyunlu_architecture_title: "Architektura turko-perska"
 qara_qoyunlu_architecture_desc: "Nasze panowanie nad Persją nie kończy się na podbojach terytorialnych — obejmuje również kulturę i estetykę. Wspaniałość perskiej architektury jest powszechnie znana, lecz wciąż czeka ona na nową falę innowacji. Jako spadkobiercy chlubnych tradycji tureckich mamy wyjątkową okazję zapoczątkować nową erę architektonicznego splendoru, łącząc majestat Persji z żywotnością Turków."
 qara_qoyunlu_repopulate_iran_title: "Ponownie zaludnić Iran"
 qara_qoyunlu_repopulate_iran_desc: "Widmo zniszczeń po najazdach mongolskich i timurydzkich wciąż ciąży nad naszymi ziemiami. Niegdyś tętniące życiem miasta stoją opustoszałe, żyzne pola leżą odłogiem, a serce Persji woła o odrodzenie. Naszym zadaniem jest przywrócić życie miastom, obsiać pola pracowitymi rolnikami i sprawić, by na ulicach znów rozbrzmiał śmiech dzieci. Nie poprzestaniemy na odbudowie — odnowimy kraj i stworzymy przyszłość, w której pamięć o najazdach stanie się odległym wspomnieniem."
 qara_qoyunlu_splendid_court_title: "Wspaniały dwór"
 qara_qoyunlu_splendid_court_desc: "Dwór władcy to coś więcej niż symbol suwerenności — jest kuźnią mądrości i miejscem podejmowania decyzji kształtujących losy imperium. Powinniśmy zgromadzić na nim najmądrzejszych ludzi w państwie. Ich roztropne rady, wiedza uczonych i kunszt dyplomatyczny będą wspierać nasze rządy oraz sprawią, że decyzje będą odzwierciedlać potrzeby i aspiracje poddanych."
 qara_qoyunlu_kitab_title: "Kitab-i Dijarbakrijja"
 qara_qoyunlu_kitab_desc: "Nasza historia jest historią Turków — opowieścią o ludzie niezłomnym i dalekowzrocznym. Kroniki dynastii turkmeńskich, od czasów plemion Oguzów po powstanie Kara Kojunlu, pełne są opowieści o męstwie, mądrości, triumfach, a niekiedy także o bolesnych lekcjach porażki. Nadszedł czas, by utrwalić te dzieje na kartach historii nie jako rozproszone opowieści, lecz jako spójną kronikę obejmującą nasze wspólne dziedzictwo."
 qara_qoyunlu_shahanshahs_of_eranshahr_title: "Szachinszachowie Eranszahru"
 qara_qoyunlu_shahanshahs_of_eranshahr_desc: "Eranszahr, ziemia Ariów i serce starożytnych imperiów perskich, wzywa nas do działania. Na bogatym gobelinie jego historii wielkie imperia powstawały i upadały, odciskając swoje piętno na ruchomych piaskach dziejów. Ciężko pracowaliśmy, by przywrócić tej krainie dawną chwałę, i stoimy teraz u progu wielkiego przeznaczenia. Nasz lud, kultura i gospodarka ponownie rozkwitają, przywołując wspaniałość przeszłości. Naszym obowiązkiem jest sięgnąć po tytuł szachinszachów — królów królów i prawowitych władców odrodzonego Iranu. W ten sposób nie tylko potwierdzimy prawowitość naszych rządów, lecz także przywrócimy tradycję władzy głęboko zakorzenioną w historii Eranszahru."
 qara_qoyunlu_maragheh_observatory_title: "Obserwatorium w Maraghe"
 qara_qoyunlu_maragheh_observatory_desc: "Niegdyś będące ostoją badań astronomicznych obserwatorium w Maraghe popada dziś w ruinę i jest jedynie cieniem dawnej świetności. Za panowania ilchanidzkiego władcy Hulagu-chana ośrodek ten był centrum nauki i odkryć, przyciągającym uczonych z najdalszych stron. Musimy przywrócić temu symbolowi dążeń intelektualnych należną mu rangę."
 qara_qoyunlu_patronize_arts_title: "Wspierać sztukę i literaturę"
 qara_qoyunlu_patronize_arts_desc: "Sztuka i literatura są siłą napędową cywilizacji — odzwierciedlają jej ducha, zachowują historię i pobudzają wyobraźnię. To na ich płótnie maluje się dusza naszego imperium. Tworząc tętniące życiem środowisko artystów, poetów i pisarzy oraz wspierając ich twórczość, pozwolimy rozkwitnąć sztuce i literaturze."
 qara_qoyunlu_blue_mosque_title: "Wznieść Błękitny Meczet"
 qara_qoyunlu_blue_mosque_desc: "Gdy nasze imperium rozkwita pod rządami Kara Kojunlu, nie możemy zapominać o czci dla wiary, która stanowi fundament naszych zasad moralnych i etycznych. W sercu naszego państwa, w Tabrizie, powinna powstać budowla będąca symbolem duchowego oddania i architektonicznego kunsztu. Naszym zadaniem jest wzniesienie majestatycznego Błękitnego Meczetu, który będzie nie tylko domem modlitwy, lecz także świadectwem osiągnięć kultury i sztuki."
 qara_qoyunlu_pearl_of_the_empire_title: "Perła imperium"
 qara_qoyunlu_pearl_of_the_empire_desc: "Tabriz, wspaniałe miasto, jest sercem naszego państwa, tętniącym życiem, kulturą i handlem. Nadszedł czas, by wynieść je jeszcze wyżej i uczynić „Perłą imperium” — miastem niezrównanego prestiżu i bogactwa. Tabriz musi stać się prawdziwym cudem, miastem pożądanym przez cały świat, przyciągającym uczonych, kupców i rzemieślników ze wszystkich zakątków ziemi."
 qara_qoyunlu_imperial_fabrics_title: "Tkaniny cesarskie"
 qara_qoyunlu_imperial_fabrics_desc: "Wraz z rozwojem imperium musi rozwijać się również nasza gospodarka. Kwitnący przemysł sukienniczy i jedwabniczy może przynieść bogactwo, stworzyć miejsca pracy i podnieść nasz międzynarodowy prestiż. Nasze ziemie sprzyjają uprawie jedwabiu i bawełny, a nasi ludzie są gotowi opanować sztukę tkania i barwienia."
 qara_qoyunlu_heart_of_iran_title: "Uderzyć w serce Iranu"
 qara_qoyunlu_heart_of_iran_desc: "Przez lata timurydzcy uzurpatorzy kurczowo trzymali się władzy nad północną częścią Iranu, lecz teraz nadszedł odpowiedni moment, by nasze armie ruszyły do boju. Uderzmy w serce Iranu, zajmijmy region Irak-e Adżam i wznieśmy nasze sztandary nad tą starożytną krainą. Nasze ambicje sięgają dalej — to zaledwie pierwszy krok ku kolejnym triumfom."
 aq_qoyunlu_last_romans_title: "Ostatni Rzymianie"
 aq_qoyunlu_last_romans_desc: "Miasto Trebizont jest ostatnią pozostałością niegdyś wielkiego Cesarstwa Bizantyjskiego w Anatolii i przejmującym przypomnieniem dawnej chwały Rzymian. Podbój Trebizontu to nie tylko rozszerzenie naszego terytorium, lecz także symboliczny czyn oznaczający ostateczny koniec rzymskiego dziedzictwa w Anatolii i początek nowej epoki pod naszym sztandarem. Nadszedł czas przewrócić kartę historii i zapisać na jej kartach własne dziedzictwo."
 aq_qoyunlu_tame_the_eagle_title: "Poskromić orła"
 aq_qoyunlu_tame_the_eagle_desc: "Hisn Kajfa, ostatnia twierdza niegdyś potężnego sułtanatu Ajjubidów, wciąż trwa jako symbol minionej epoki i stawia nam opór. Musimy włączyć tę ostatnią ostoję Ajjubidów do państwa Aq Kojunlu, kładąc kres ich epoce i przypieczętowując niekwestionowany wzrost naszej potęgi."
 aq_qoyunlu_rally_the_turkmen_title: "Wezwać Turkomanów pod broń"
 aq_qoyunlu_rally_the_turkmen_desc: "Aq Kojunlu, Turkomani Białej Owcy, od zawsze czerpali siłę z jedności. Skoro zamierzamy rozszerzać granice i stawić czoła nadchodzącym wyzwaniom, nadszedł czas ponownie zjednoczyć Turkomanów. Musimy odbudować armię, odwołując się do odwagi i wytrwałości naszego ludu. Wezwanie do walki rozbrzmiewa w całym kraju — niech Turkomani powstaną zjednoczeni i gotowi wykuć własne przeznaczenie."
 aq_qoyunlu_caucasian_consolidation_title: "Skonsolidować Kaukaz"
 aq_qoyunlu_caucasian_consolidation_desc: "Podbój Armenii otworzył nam drogę do podporządkowania Kaukazu, zamieszkanego przez słabe plemiona i rozpadające się królestwa. Choć przeciwnicy są słabi, podporządkowanie Ormian i ich bunty pokazały, że kontrolowanie regionu nie będzie łatwe. Musimy zatem ustabilizować nasze rządy, albo uznając miejscową ludność za równą nam, albo wskazując jej światło Allaha."
 aq_qoyunlu_anatolian_turnabout_title: "Odwrócić losy Anatolii"
 aq_qoyunlu_anatolian_turnabout_desc: "Osmanowie zwyciężyli w kampaniach przeciwko Rzymianom i bejlikom, ustanawiając swoją hegemonię w Anatolii. Teraz, gdy wreszcie dysponujemy siłą niezbędną, by stawić im czoła, nadszedł czas odwrócić bieg historii na naszą korzyść."
 aq_qoyunlu_overpower_the_mamluks_title: "Pokonaj mameluków"
 aq_qoyunlu_overpower_the_mamluks_desc: "Sułtanat mameluków, państwo stworzone rękami dawnych niewolników, wyrósł na groźnego przeciwnika. Ich dominacja w Egipcie i Lewancie stanowi coraz większe zagrożenie dla naszych ambicji w regionie. Każde imperium ma jednak słabe punkty i mamelucy nie są wyjątkiem. Nadszedł czas, by opracować strategię, rozsądnie wykorzystać nasze zasoby i zadać dotkliwy cios strukturze ich władzy."
 aq_qoyunlu_a_gunpowder_empire_title: "Imperium prochu"
 aq_qoyunlu_a_gunpowder_empire_desc: "Choć od stuleci nasza tradycja wojskowa opiera się na kawalerii, zmieniający się charakter wojny zmusza nas do przyjęcia nowych technologii i dostosowania strategii walki. Imperia na całym świecie zaczynają dostrzegać niszczycielską siłę prochu strzelniczego. Jeśli chcemy zwyciężać, nie możemy pozostawać w tyle."
 aq_qoyunlu_reform_the_army_title: "Zreorganizować państwo"
 aq_qoyunlu_reform_the_army_desc: "U szczytu potęgi Osmanowie stworzyli niezwykle zaawansowany system administracji państwowej i organizacji wojska. Pod tym względem nasze państwo, oparte na strukturach na wpół plemiennych, wyraźnie pozostaje w tyle. Niektórzy doradzają nam przyjęcie różnych osmańskich instytucji, co mogłoby przynieść korzyści całemu państwu."
 aq_qoyunlu_mounted_dread_title: "Postrach na koniach"
 aq_qoyunlu_mounted_dread_desc: "Nasze stepowe dziedzictwo daje nam niezrównane zrozumienie sztuki walki konnej. Nadszedł czas, by sięgnąć do tradycji przodków i stworzyć elitarną formację kawalerii, która stanie się postrachem przeciwników. Wykorzystamy spuściznę stepowych wojowników, by uczynić z naszej jazdy potężną broń i wzbudzić trwogę we wszystkich, którzy odważą się stanąć przeciwko Aq Kojunlu."
 aq_qoyunlu_dismantle_qara_qoyunlu_title: "Rozbić Kara Kojunlu"
 aq_qoyunlu_dismantle_qara_qoyunlu_desc: "Nasi turkmeńscy bracia z Kara Kojunlu stworzyli potężne państwo, lecz doskonale wiemy, jak kruche są jego fundamenty. Uderzmy na ziemie naszych pobratymców, a ci spośród nich, którzy wykażą się rozsądkiem, z pewnością przyłączą się do naszych szeregów. Tak rozpocznie się nasza dominacja w regionie."
 aq_qoyunlu_secure_basra_title: "Zdobyć Basrę"
 aq_qoyunlu_secure_basra_desc: "Skoro Mezopotamia znajduje się już pod naszą silną kontrolą, powinniśmy rozszerzyć granice aż do wybrzeży Zatoki Perskiej. Dzięki handlowi morskiemu przyniesie to naszemu państwu znaczne bogactwa."
 aq_qoyunlu_merchant_fleet_title: "Zbudować flotę handlową"
 aq_qoyunlu_merchant_fleet_desc: "Bogactwo narodów przewozi się nie tylko lądem, lecz także przez bezkresne morza. Skoro bogactwa Zatoki Perskiej są w naszym zasięgu, nadszedł czas zbudować flotę handlową, która będzie przemierzać błękitne wody i łączyć nasze imperium z odległymi rynkami."
 aq_qoyunlu_dominate_the_gulf_title: "Zdominować Zatokę Perską"
 aq_qoyunlu_dominate_the_gulf_desc: "Dominacja nad Zatoką Perską ma kluczowe znaczenie gospodarcze dla naszego państwa. Jeśli przejmiemy kontrolę nad przepływem towarów, będziemy mogli zgromadzić ogromne bogactwa."
 aq_qoyunlu_control_hormuz_title: "Przejąć kontrolę nad Ormuz"
 aq_qoyunlu_control_hormuz_desc: "Ormuz, położony u wejścia do Zatoki Perskiej, jest kluczem do rozległej sieci handlowej łączącej Bliski Wschód z zamorskimi regionami. Jego strategiczne położenie czyni go ważnym ogniwem szlaku dostaw między Persją a Arabią. Kontrolując Ormuz, zyskamy znaczną przewagę w kształtowaniu handlu i zapewnimy dobrobyt gospodarczy naszemu państwu."
 aq_qoyunlu_custodian_of_baghdad_title: "Opiekunowie Bagdadu"
 aq_qoyunlu_custodian_of_baghdad_desc: "Bagdad, niegdyś latarnia wiedzy i kultury, wciąż nosi blizny po niszczycielskim mongolskim najeździe. Echa dawnych tętniących życiem targowisk i debat uczonych zdają się należeć do zamierzchłej przeszłości. Jako nowi opiekunowie Bagdadu odbudujemy jego infrastrukturę, zapewnimy bezpieczeństwo mieszkańcom i ponownie zapełnimy biblioteki uczonymi, przywracając miastu status klejnotu świata islamu."
 aq_qoyunlu_house_of_wisdom_title: "Dom Mądrości"
 aq_qoyunlu_house_of_wisdom_desc: "Dom Mądrości, symbol wiedzy i oświecenia w Bagdadzie, odradza się pod naszym światłym przywództwem. Niegdyś stanowił schronienie dla uczonych, a dzięki starannej odbudowie odzyska dawną świetność. Zgromadzą się w nim wybitni myśliciele, sprzyjając wymianie intelektualnej i innowacjom. Biblioteki Domu Mądrości ponownie wypełnią się starożytnymi tekstami, które zainspirują nowe odkrycia. Jako mecenasi wiedzy zapiszemy się w pamięci potomnych i zapoczątkujemy nową erę oświecenia."
 aq_qoyunlu_era_title: "Epoka Białej Owcy"
 aq_qoyunlu_era_desc: "W całym naszym państwie na wietrze powiewa godło Białej Owcy, nasz czcigodny symbol. Nasze rządy przyniosły nie tylko stabilność i dobrobyt — pod naszym przewodnictwem rozkwitł również złoty wiek kultury. Poezja i proza, muzyka i taniec, architektura i nauka — wszystkie dziedziny kultury rozwinęły się, przywołując chwałę przeszłości i otwierając nowe obszary twórczości oraz wiedzy. Rozpoczęła się „Epoka Białej Owcy”, czas bezprecedensowego rozkwitu intelektualnego i artystycznego pod sztandarem Aq Kojunlu. Musimy pielęgnować tę epokę i głosić wszem wobec, że Biała Owca panuje w czasach oświecenia i dobrobytu."
 aq_qoyunlu_heart_of_iran_title: "Uderzyć w serce Iranu"
 aq_qoyunlu_heart_of_iran_desc: "Przez lata timurydzcy uzurpatorzy kurczowo trzymali się władzy nad północną częścią Iranu, lecz teraz nadszedł odpowiedni moment, by nasze armie ruszyły do boju. Uderzmy w serce Iranu, zajmijmy region Irak-e Adżam i wznieśmy nasze sztandary nad tą starożytną krainą. Nasze ambicje sięgają dalej — to zaledwie pierwszy krok ku kolejnym triumfom."
 aq_qoyunlu_dethrone_the_timurids_title: "Złamać ród Timura"
 aq_qoyunlu_dethrone_the_timurids_desc: "Pozostałości niegdyś potężnego imperium Timurydów są jedynie cieniem dawnej chwały. Ich władza nad terytoriami słabnie pod naporem wewnętrznych konfliktów i zewnętrznej presji. Musimy zdobyć ich stolicę, Herat, zniszczyć dziedzictwo rodu Timura i ostatecznie położyć kres jego panowaniu."
 aq_qoyunlu_legacy_of_seljuk_title: "Dziedzictwo Seldżuka"
 aq_qoyunlu_legacy_of_seljuk_desc: "Przed wiekami wielkie imperium Seldżuków wytyczyło szlak chwały przez rozległe ziemie Persji i Chorasan. Jego dziedzictwo wciąż rozbrzmiewa w wiatrach przemierzających te starożytne krainy. Jako Aq Kojunlu jesteśmy potomkami tych potężnych wojowników i mądrych władców. Nadszedł czas, by uczcić przodków i dokonać tego, co oni — całkowicie podporządkować sobie Persję i Chorasan."
 aq_qoyunlu_architecture_title: "Architektura turko-perska"
 aq_qoyunlu_architecture_desc: "Nasze panowanie nad Persją nie kończy się na podbojach terytorialnych — obejmuje również kulturę i estetykę. Wspaniałość perskiej architektury jest powszechnie znana, lecz wciąż czeka ona na nową falę innowacji. Jako spadkobiercy chlubnych tradycji tureckich mamy, jako Aq Kojunlu, wyjątkową okazję zapoczątkować nową erę architektonicznego splendoru, łącząc majestat Persji z żywotnością Turków."
 aq_qoyunlu_repopulate_iran_title: "Ponownie zaludnić Iran"
 aq_qoyunlu_repopulate_iran_desc: "Widmo zniszczeń po najazdach mongolskich i timurydzkich wciąż ciąży nad naszymi ziemiami. Niegdyś tętniące życiem miasta stoją opustoszałe, żyzne pola leżą odłogiem, a serce Persji woła o odrodzenie. Naszym zadaniem jest przywrócić życie miastom, obsiać pola pracowitymi rolnikami i sprawić, by na ulicach znów rozbrzmiał śmiech dzieci. Nie poprzestaniemy na odbudowie — odnowimy kraj i stworzymy przyszłość, w której pamięć o najazdach stanie się odległym wspomnieniem."
 aq_qoyunlu_the_oghuz_homeland_title: "Ojczyzna Oguzów"
 aq_qoyunlu_the_oghuz_homeland_desc: "Wichry stepów Azji Środkowej niosą opowieści o naszych przodkach, potężnych Turkach Oguzach, którzy niegdyś przemierzali te ziemie. Jako ich spadkobiercy nosimy w żyłach krew niezłomnych koczowników. Ich dziedzictwo trwa nie tylko w naszych sercach, lecz także na suchych równinach Azji Środkowej. Nadszedł czas, by odnowić więzi z ojczyzną przodków i objąć te ziemie naszym panowaniem."
 aq_qoyunlu_patronize_arts_title: "Wspierać sztukę i literaturę"
 aq_qoyunlu_patronize_arts_desc: "Sztuka i literatura są siłą napędową cywilizacji — odzwierciedlają jej ducha, zachowują historię i pobudzają wyobraźnię. To na ich płótnie maluje się dusza naszego imperium. Tworząc tętniące życiem środowisko artystów, poetów i pisarzy oraz wspierając ich twórczość, pozwolimy rozkwitnąć sztuce i literaturze."
 aq_qoyunlu_blue_mosque_title: "Wznieść Błękitny Meczet"
 aq_qoyunlu_blue_mosque_desc: "Gdy nasze imperium rozkwita pod rządami Aq Kojunlu, nie możemy zapominać o czci dla wiary, która stanowi fundament naszych zasad moralnych i etycznych. W sercu naszego państwa, w Tabrizie, powinna powstać budowla będąca symbolem duchowego oddania i architektonicznego kunsztu. Naszym zadaniem jest wzniesienie majestatycznego Błękitnego Meczetu, który będzie nie tylko domem modlitwy, lecz także świadectwem osiągnięć kultury i sztuki."
 aq_qoyunlu_pearl_of_the_empire_title: "Perła imperium"
 aq_qoyunlu_pearl_of_the_empire_desc: "Tabriz, wspaniałe miasto, jest sercem naszego państwa, tętniącym życiem, kulturą i handlem. Nadszedł czas, by wynieść je jeszcze wyżej i uczynić „Perłą imperium” — miastem niezrównanego prestiżu i bogactwa. Tabriz musi stać się prawdziwym cudem, miastem pożądanym przez cały świat, przyciągającym uczonych, kupców i rzemieślników ze wszystkich zakątków ziemi."
 aq_qoyunlu_imperial_fabrics_title: "Tkaniny cesarskie"
 aq_qoyunlu_imperial_fabrics_desc: "Wraz z rozwojem imperium musi rozwijać się również nasza gospodarka. Kwitnący przemysł sukienniczy i jedwabniczy może przynieść bogactwo, stworzyć miejsca pracy i podnieść nasz międzynarodowy prestiż. Nasze ziemie sprzyjają uprawie jedwabiu i bawełny, a nasi ludzie są gotowi opanować sztukę tkania i barwienia."
 aq_qoyunlu_splendid_court_title: "Wspaniały dwór"
 aq_qoyunlu_splendid_court_desc: "Dwór władcy to coś więcej niż symbol suwerenności — jest kuźnią mądrości i miejscem podejmowania decyzji kształtujących losy imperium. Powinniśmy zgromadzić na nim najmądrzejszych ludzi w państwie. Ich roztropne rady, wiedza uczonych i kunszt dyplomatyczny będą wspierać nasze rządy oraz sprawią, że decyzje będą odzwierciedlać potrzeby i aspiracje poddanych."
 aq_qoyunlu_kitab_title: "Kitab-i Dijarbakrijja"
 aq_qoyunlu_kitab_desc: "Nasza historia jest historią Turków — opowieścią o ludzie niezłomnym i dalekowzrocznym. Kroniki dynastii turkmeńskich, od czasów plemion Oguzów po powstanie Aq Kojunlu, pełne są opowieści o męstwie, mądrości, triumfach, a niekiedy także o bolesnych lekcjach porażki. Nadszedł czas, by utrwalić te dzieje na kartach historii nie jako rozproszone opowieści, lecz jako spójną kronikę obejmującą nasze wspólne dziedzictwo."
 aq_qoyunlu_maragheh_observatory_title: "Obserwatorium w Maraghe"
 aq_qoyunlu_maragheh_observatory_desc: "Niegdyś będące ostoją badań astronomicznych obserwatorium w Maraghe popada dziś w ruinę i jest jedynie cieniem dawnej świetności. Za panowania ilchanidzkiego władcy Hulagu-chana ośrodek ten był centrum nauki i odkryć, przyciągającym uczonych z najdalszych stron. Musimy przywrócić temu symbolowi dążeń intelektualnych należną mu rangę."
 aq_qoyunlu_shahanshahs_of_eranshahr_title: "Szachinszachowie Eranszahru"
 aq_qoyunlu_shahanshahs_of_eranshahr_desc: "Eranszahr, ziemia Ariów i serce starożytnych imperiów perskich, wzywa nas do działania. Na bogatym gobelinie jego historii wielkie imperia powstawały i upadały, odciskając swoje piętno na ruchomych piaskach dziejów. Ciężko pracowaliśmy, by przywrócić tej krainie dawną chwałę, i stoimy teraz u progu wielkiego przeznaczenia. Nasz lud, kultura i gospodarka ponownie rozkwitają, przywołując wspaniałość przeszłości. Naszym obowiązkiem jest sięgnąć po tytuł szachinszachów — królów królów i prawowitych władców odrodzonego Iranu. W ten sposób nie tylko potwierdzimy prawowitość naszych rządów, lecz także przywrócimy tradycję władzy głęboko zakorzenioną w historii Eranszahru."
 estate_nobles_emirs_of_baghdad_tt_revoked: "Modyfikator prowincji §YEmirowie Bagdadu§! zostanie usunięty ze wszystkich prowincji w §YMezopotamii§!."
 estate_nobles_emirs_of_baghdad: "Emirowie Bagdadu"
 estate_nobles_emirs_of_baghdad_desc: "Choć prowincje Mezopotamii i miasto Bagdad oficjalnie uznają naszą zwierzchność, rządzi nimi emir Isfahan, brat Dżahana Szaha, który cieszy się w regionie znaczną autonomią."
 estate_nobles_emirs_of_baghdad_tt_granted: "Nasze prowincje mezopotamskie znajdują się pod kontrolą wysoce autonomicznych emirów Bagdadu. Dotknięte prowincje otrzymują §R+10,00§! lokalnej autonomii oraz §R+0,2§! miesięcznej lokalnej autonomii."
 estate_burghers_great_works_of_iran: "Wielkie dzieła Iranu"
 estate_burghers_great_works_of_iran_desc: "Ziemie Eranszahru cierpiały pod jarzmem Mongołów i Timurydów. Teraz, gdy ustanowiliśmy hegemonię nad Persją, nadszedł czas, by przywrócić architektoniczny splendor jej chwalebnej przeszłości."
 estate_burghers_great_works_of_iran_tt: "Kara do kosztu rozwoju we wszystkich posiadanych prowincjach w §YPersji§! i §YChorasan§! zostanie zmniejszona w zależności od rodzaju terenu."
