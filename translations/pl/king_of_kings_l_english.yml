 estate_ghulams: "Ghulamowie"
 country_estate_ghulams_name: "[This.GetGhilmanName]"
 estate_ghulams_desc: "Ghulamowie to formacja żołnierzy-niewolników pochodzących z Kaukazu. Zazwyczaj są to dawni chrześcijanie, którzy przechodzą rygorystyczne szkolenie wojskowe i doskonale posługują się bronią palną, dzięki czemu stanowią niezbędną część armii państwa. Są przeciwwagą dla wpływowych kizylbaszy."
