 estate_aswaran: "Aswaranowie"
 country_estate_qizilbash_name: "[This.GetQizilbashName]"
 estate_qizilbash_desc: "Kyzyłbaszowie to szyiccy wojownicy pochodzenia turkmeńskiego z azerbejdżańskojęzycznych plemion. Założeni przez suficki zakon Safaviyya, są elitarną piechotą i kawalerią państwa, której znaczenie polityczne znacznie wzrosłom, przez co stała się bezpośrednim rywalem szlachty. Jako szyickie siły bojowe, kyzyłbaszowie wyznają doktryny szyickie i sprzeciwiają się wszelkim antyszyickim nastrojom ze strony państwa."
 estate_aswaran_desc: "Odrodzeni z popiołów przeszłości i połączeni z niegdyś potężną frakcją szyickich kizylbaszy, Aswaranowie ponownie stali się kawalerią i trzonem naszej armii. Choć przysięgają wierność prawdziwej wierze zaratusztrianizmu, wpływy islamu i kultury turkmeńskiej oraz ich pozycja polityczna sprawiają, że ta niegdyś czysto wojskowa grupa stała się istotną siłą w naszym państwie."
