 estate_nobles_tupchi_artillery_corps_desc: "Stan [Root.GetNobilityOrFallbackName] odpowiada za dowodzenie korpusem artylerii tupczi państwa [Root.GetName]. Dzięki swoim umiejętnościom wojskowym oraz pomocy zagranicznych specjalistów biegłych w obsłudze artylerii tupczi zasypią wrogie linie ogniem armatnim."
