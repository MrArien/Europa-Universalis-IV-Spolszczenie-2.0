 BYZ_restoring_faith_in_the_monarchs: "Przywrócenie wiary w monarchów"
 desc_BYZ_restoring_faith_in_the_monarchs: "Pomimo dawnych grzechów dynastii lud i Kościół ponownie obdarzyli ją zaufaniem."
 BYZ_seat_of_a_patriarch: "Siedziba patriarchy"
 desc_BYZ_seat_of_a_patriarch: "W miejscowym mieście rezyduje jeden z pięciu patriarchów ekumenicznych, który przewodzi lokalnej wspólnocie kościelnej i prowadzi wiernych."
 BYZ_powerful_merchant_families: "Potężne rodziny kupieckie"
 desc_BYZ_powerful_merchant_families: "Monemwasia jest siedzibą wielu rodzin kupieckich, które wywierają znaczny wpływ na handel na Morzu Egejskim."
 BYZ_origins_of_renaissance: "Początki renesansu"
 desc_BYZ_origins_of_renaissance: "Podczas gdy mieszkańców Konstantynopola ogarnia strach przed nieuchronnym oblężeniem, ziemie Morei przeżywają odrodzenie. Wielu miejscowych uczonych wyemigruje później do Italii, przyczyniając się do rozwoju renesansu."
 BYZ_trade_in_thessaloniki: "Salonicki ośrodek handlowy"
 BYZ_secondary_trade_capital: "Druga stolica handlowa"
