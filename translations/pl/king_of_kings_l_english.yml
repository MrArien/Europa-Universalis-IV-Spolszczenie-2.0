 flavor_turkoman.1.t: "Dziedzictwo Seldżuków"
 flavor_turkoman.1.d: "Na kartach historii ziemie Iranu były świadkami powstawania i upadku wielu potężnych imperiów. Wśród nich dynastia Seldżuków jaśniała blaskiem wielkości, rządząc mądrze i odważnie. Po upływie stuleci los dał nam szansę odzyskać dziedzictwo naszych szacownych poprzedników i zjednoczyć pod naszym panowaniem rozdrobnione ziemie Iranu. Zbyt długo uzurpatorzy z dynastii Timurydów nękali te ziemie, siejąc niezgodę i chaos. Lecz my, prawowici następcy seldżuckiego rodu, podjęliśmy wyzwanie i zrzuciliśmy tych uzurpatorów z tronu. Teraz, gdy Iran znajduje się pod naszą władzą, spoczywa na nas odpowiedzialność za odrodzenie krainy spustoszonej najazdami Mongołów i Timurydów, które doprowadziły do wyludnienia i wewnętrznych podziałów. Jeśli mamy stać się prawowitymi władcami Persji, musimy uleczyć te rany, by móc kształtować historię i pozostawić trwały ślad na tych ziemiach, tak jak uczynili to nasi poprzednicy."
 flavor_turkoman.1.a: "Najpierw odbudujemy osadnictwo"
 flavor_turkoman.1.b: "Uleczenie wewnętrznych podziałów ma najwyższy priorytet!"
 flavor_turkoman.3.t: "Obserwatorium w Maraghe"
 flavor_turkoman.3.d: "Historia obserwatorium w Maraghe sięga XIII wieku, okresu największej potęgi Ilchanatu. Jego budowę zlecił znakomity mongolski władca Hulagu-chan, pragnąc w ten sposób wyrazić swoje zaangażowanie w rozwój nauki i odkrywanie tajemnic kosmosu. Pod kierunkiem geniusza Nasira ad-Dina Tusiego, wybitnego uczonego i astronoma, obserwatorium stało się ostoją wiedzy dla badaczy z najdalszych stron. Jednak upływ czasu i zmienne koleje losu imperiów rzuciły cień na tę skarbnicę wiedzy. Zaniedbanie i konflikty zniszczyły niegdyś majestatyczne sale, pozostawiając jedynie cień dawnej świetności. Nie traćmy jednak nadziei — nasze światłe rządy zapoczątkują odrodzenie obserwatorium w Maraghe. Pod naszym patronatem zostanie ono pieczołowicie przywrócone do dawnej świetności. Naprawimy mury niszczejące przez stulecia zaniedbań, a instrumenty astronomiczne, które niegdyś pozwalały uczonym badać niebo, znów zostaną wykorzystane. Zaprosimy z całego państwa wybitnych astronomów, matematyków i kartografów, by przywrócić ducha dociekań naukowych, który niegdyś ożywiał to miejsce. Odbudowane obserwatorium stanie się ośrodkiem badań astronomicznych i debat intelektualnych, przyciągającym najtęższe umysły z dalekich krain. Nasze królestwo będzie czerpać chwałę z ich odkryć, gdy będą zgłębiać tajemnice kosmosu i rozjaśniać najciemniejsze zakątki nocnego nieba. Wiedza zdobyta w tych murach wzbogaci nie tylko naukę w naszym państwie, lecz także umocni naszą pozycję mecenasów nauki i oświecenia."
 flavor_turkoman.3.a: "Wspaniale!"
 flavor_turkoman.4.t: "Abu Bakr Tihrani"
 flavor_turkoman.4.d: "Abu Bakr Tihrani odegrał kluczową rolę w życiu intelektualnym i kulturalnym państw Ak Kojunlu oraz Kara Kojunlu. Zgłębiając zbiory bibliotek i akademii, zdobył rozległą wiedzę z wielu dziedzin — od historii i geografii po językoznawstwo i literaturę. Jego umiejętności zwróciły uwagę elit rządzących, dzięki czemu został doradcą i nadwornym historykiem obu dynastii. W służbie Ak Kojunlu i Kara Kojunlu Tihrani stworzył swoje najważniejsze dzieło, Kitab-i Diyarbakriyya. Ten literacki pomnik dokumentuje bogatą historię, geografię i obyczaje dynastii turkmeńskich. Do dziś jest uznawany za dzieło przełomowe i otaczany szacunkiem uczonych oraz historyków. Skrupulatne badania, głębokie spostrzeżenia i kunsztowny styl zapewniły Tihraniemu miejsce wśród najwybitniejszych postaci historii intelektualnej. Dzięki temu monumentalnemu dziełu uwiecznił dynastie turkmeńskie, zapewniając trwałość ich dziedzictwa, a zarazem poszerzył horyzonty wiedzy przyszłych pokoleń. Pod wrażeniem osiągnięć i przenikliwości Abu Bakra Tihraniego zapraszamy go na nasz dwór, oferując mu stanowisko doradcy."
 flavor_turkoman.4.a: "Zaproponujmy mu stanowisko nadwornego kronikarza"
 flavor_turkoman.4.b: "Jego talent artystyczny byłby dla nas wielką korzyścią"
 flavor_turkoman.4.c: "Moglibyśmy skorzystać z jego talentu dyplomatycznego"
 flavor_turkoman.5.t: "Persjanizacja Turkomanów"
 flavor_turkoman.5.d: "Nasze plemiona turkmeńskie, choć początkowo odrębne kulturowo, stopniowo przyjęły bogactwo i głębię perskiej cywilizacji. Sztuka, nauka, filozofia i przepych, które niegdyś stanowiły o potędze Iranu, znalazły nowy dom wśród naszego ludu. Nie tylko przyswoiliśmy perską kulturę — tchnęliśmy w nią nowe życie. Połączenie turkmeńskiego wigoru z perskim wyrafinowaniem stworzyło żywą i potężną cywilizację, która zapisze się na kartach historii. Razem jesteśmy prawdziwymi szachinszachami Eranszahru. Od żyznych równin nad Morzem Kaspijskim po spalone słońcem piaski Chorosanu nasze zjednoczone ludy zapiszą kolejny wspaniały rozdział w dziejach Iranu. Uszanowaliśmy dziedzictwo przodków, a zarazem mierzymy jeszcze wyżej."
 flavor_turkoman.5.a: "To są narodziny nowego Iranu!"
 flavor_turkoman.6.t: "Śmierć Ispenda Mirzy"
 flavor_turkoman.6.d: "Z serca Mezopotamii dotarły do nas ponure wieści. Ispend Mirza, brat naszego władcy Dżahana Szaha i emir Bagdadu, odszedł z tego świata. Bogaty i strategicznie ważny region ma teraz, zgodnie z miejscowymi zwyczajami i tradycją, przypaść jego synowi, Fuladowi Mirzy. Nasz suweren, Dżahan Szah, snuje jednak wielkie plany stworzenia scentralizowanego państwa — jednego, potężnego organizmu zjednoczonego pod jego władzą. Istnienie na wpół autonomicznego emiratu w samym sercu jego domen, zwłaszcza tak wpływowego jak Bagdad, może stać się solą w oku i przeszkodą na drodze do realizacji tych ambicji.\n\nMusimy zatem podjąć ważną decyzję w tej delikatnej sprawie. Możemy siłą zdusić lokalne rządy, zlikwidować emirat Bagdadu i bezpośrednio włączyć go do naszego państwa. Niewątpliwie wzmocniłoby to władzę centralną, lecz mogłoby również wzbudzić gniew innych lokalnych możnowładców i doprowadzić do niepokojów. Możemy też obrać pokojową drogę i za pomocą dyplomacji lub więzów rodzinnych stopniowo zbliżyć emirat do naszych domen, unikając otwartego konfliktu. Takie rozwiązanie pozwoli nam zyskać na czasie i zapobiec natychmiastowym zamieszkom, lecz pozostawi pytanie, czy bez demonstracji siły zdołamy stworzyć stabilne i lojalne państwo. Ta decyzja bez wątpienia ukształtuje przyszłość naszego kraju. Piasek czasu już przesypuje się przez klepsydrę — musimy szybko wybrać drogę."
 flavor_turkoman.6.a: "Bagdad musi bezpośrednio podlegać naszej władzy!"
 flavor_turkoman.6.b: "Znajdziemy inne rozwiązanie"
 flavor_turkoman.7.t: "Los Trapezuntu"
 flavor_turkoman.7.d: "Po długim oblężeniu i zaciekłym oporze mieszkańców miasto Trapezunt, ostatnia twierdza greckiego Cesarstwa Trapezuntu, wreszcie znalazło się pod naszą kontrolą. To starożytne miasto, wzniesione na skalistych wzgórzach górujących nad Morzem Czarnym, jest klejnotem kultury, bogactwa i historii. Jego mieszkańcy to jednak w większości Grecy pontyjscy, gorliwi wyznawcy prawosławia, co może zagrozić jedności naszego muzułmańskiego państwa.\n\nJako nowi władcy Trapezuntu musimy podjąć ważną decyzję. Możemy przyznać miejscowej ludności autonomię i zagwarantować jej dotychczasowe prawa, zapewniając sobie współpracę mieszkańców oraz zachowanie kultury i dobrobytu miasta. Takie podejście może jednak stworzyć niebezpieczną, zamkniętą enklawę, w której będą kiełkować niezadowolenie i bunt.\n\nMożemy też zachęcić naszych muzułmańskich turkmeńskich współbraci do osiedlenia się w mieście. Ograniczyłoby to wpływy chrześcijańskie i zapewniło nam lojalną ludność, lecz prawdopodobnie doprowadziłoby do konfliktów kulturowych oraz zachwiało dotychczasową równowagą społeczną i gospodarczą."
 flavor_turkoman.7.a: "Uszanujmy prawa miejscowej ludności"
 flavor_turkoman.7.b: "Osiedlmy w mieście Turkmeńczyków"
 flavor_turkoman.8.t: "Los Trapezuntu"
 flavor_turkoman.8.d: "Po długim oblężeniu i zaciekłym oporze mieszkańców miasto Trapezunt, ostatnia twierdza greckiego Cesarstwa Trapezuntu, wreszcie znalazło się pod naszą kontrolą. To starożytne miasto, wzniesione na skalistych wzgórzach górujących nad Morzem Czarnym, jest klejnotem kultury, bogactwa i historii. Jego mieszkańcy to jednak w większości Grecy pontyjscy, gorliwi wyznawcy prawosławia, co może zagrozić jedności naszego muzułmańskiego państwa.\n\nJako nowi władcy Trapezuntu musimy podjąć ważną decyzję. Możemy przyznać miejscowej ludności autonomię i zagwarantować jej dotychczasowe prawa, zapewniając sobie współpracę mieszkańców oraz zachowanie kultury i dobrobytu miasta. Takie podejście może jednak stworzyć niebezpieczną, zamkniętą enklawę, w której będą kiełkować niezadowolenie i bunt.\n\nMożemy też zachęcić naszych muzułmańskich turkmeńskich współbraci do osiedlenia się w mieście. Ograniczyłoby to wpływy chrześcijańskie i zapewniło nam lojalną ludność, lecz prawdopodobnie doprowadziłoby do konfliktów kulturowych oraz zachwiało dotychczasową równowagą społeczną i gospodarczą."
 flavor_turkoman.8.a: "Uszanujmy prawa miejscowej ludności"
 flavor_turkoman.8.b: "Osiedlmy w mieście Turkmeńczyków"
 flavor_turkoman.9.t: "Zakon Safawidów"
 flavor_turkoman.9.d: "Zakon ten narodził się pośród burzliwych zmagań mistycznego sufizmu. Założył go szejk Safi ad-Din Ardabili z Ardabilu, a jego żarliwa odmiana szyickiego islamu odegrała kluczową rolę w kształtowaniu religijnego i politycznego krajobrazu Persji oraz sąsiednich krain. Safawidzi początkowo byli ruchem religijnym, który przyciągał wiernych charyzmatycznym przywództwem duchowym. Wraz ze wzrostem wpływów stali się jednak liczącą się siłą polityczną i wojskową, która zdominowała znaczną część północno-zachodniego Iranu. Być może nadszedł czas, by wykorzystać wpływy i potęgę militarną tego zakonu do realizacji naszych ambicji. Czy zdecydujemy się zwerbować Safawidów do naszej służby?"
 flavor_turkoman.9.a: "Zakon Safawidów dobrze nam posłuży"
 flavor_turkoman.9.b: "Nie potrzebujemy ich usług"
 flavor_turkoman.10.t: "Mauzoleum emirów turkmeńskich"
 flavor_turkoman.10.d: "W cichej miejscowości Argavand wznosi się, nadgryzione zębem czasu, świadectwo naszej chwalebnej przeszłości — mauzoleum emirów turkmeńskich. Spoczywają w nim doczesne szczątki dawnych władców, a jego mury opowiadają historię naszego bogatego dziedzictwa i niezłomnego ducha ludu. Lata konfliktów i zaniedbań doprowadziły jednak niegdyś wspaniałe mauzoleum do ruiny. Odrodzenie dumy kulturowej i pragnienie upamiętnienia przeszłości sprawiły, że coraz głośniej mówi się o jego odbudowie. Tak monumentalne przedsięwzięcie mogłoby podnieść ducha naszego ludu i pokazać, że szanujemy przeszłość oraz chronimy nasze dziedzictwo. Wymagałoby jednak znacznych nakładów środków. Czy przeznaczymy fundusze i siłę roboczą na przywrócenie zabytkowi dawnej świetności, czy skupimy się na pilniejszych sprawach?"
 flavor_turkoman.10.a: "Musimy zachować nasze dziedzictwo!"
 flavor_turkoman.10.b: "Nasze zasoby są potrzebne gdzie indziej"
 flavor_turkoman.11.t: "Podbój Tebrizu"
 flavor_turkoman.11.d: "Gdy opadł bitewny kurz i ucichły odgłosy walk, wspaniałe miasto Tebriz znalazło się pod dumnym sztandarem Ak Kojunlu. Ten klejnot, wcześniej należący do naszych rywali z Kara Kojunlu, jest nie tylko bogaty w zasoby, lecz także zajmuje dominującą pozycję na skrzyżowaniu ważnych szlaków handlowych. Tebriz słynie z prężnej gospodarki i znaczenia kulturowego, a jego położenie daje przewagę strategiczną nad naszą obecną stolicą. Rozwinięta infrastruktura, tętniące życiem targowiska i umocnienia czynią z niego idealną siedzibę władzy dla rozrastającego się imperium. Stojąc w sercu tego tętniącego życiem miasta, musimy rozważyć, czy przenieść tu stolicę i skorzystać z obiecujących możliwości oraz bogactw, czy też nadal rządzić z naszej historycznej siedziby. Tak doniosłej zmiany nie wolno lekceważyć — może ona zadecydować o naszej przyszłości."
 flavor_turkoman.11.a: "Przenieśmy stolicę do Tebrizu!"
 flavor_turkoman.11.b: "Nasza obecna stolica dobrze nam służy"
 flavor_turkoman.12.t: "Emirowie Bagdadu"
 flavor_turkoman.12.d: "Emir Bagdadu, Ispend bin Jusuf, brat naszego szanownego władcy Dżahana Szaha, utworzył tę enklawę w 1431 roku po zniszczeniu sułtanatu Dżalajirydów. Od tamtej pory Mezopotamia rozwijała się pod jego autonomicznymi rządami, stając się bastionem potęgi i wpływów. Nadszedł jednak czas, by ponownie ocenić tę sytuację, ponieważ nieograniczona autonomia może prowadzić do nieprzewidzianych zagrożeń dla tronu. Gdy do królewskiego dworu docierają wieści o rosnących wpływach i potędze emira, narasta niepokój. Rozkwit Mezopotamii świadczy wprawdzie o jego zdolnościach, lecz pozwolenie mu na dalsze umacnianie pozycji może rozbudzić ambicje wykraczające poza granice regionu. Nie możemy ignorować perspektywy pojawienia się potężnego rywala tuż u naszych granic."
 flavor_turkoman.12.a: "Musimy zająć się tą pilną sprawą."
 qara_qoyunlu_starting_event_tt: "Region §YMezopotamii§! znajduje się pod autonomicznymi rządami miejscowego emira, a jego autonomia została zwiększona przez modyfikatory §R+10§! minimalnej autonomii lokalnej i §R+0,20§! miesięcznej zmiany autonomii.\n\nMożemy znieść przywilej stanowy §YEmirowie Bagdadu§! i pozbyć się tych kar, wykonując misję „§YEmirowie Mezopotamii§!” lub odbierając przywilej w wydarzeniu „§YŚmierć Ispenda Mirzy§!”."
