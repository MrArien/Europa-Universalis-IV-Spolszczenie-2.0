l_english:
 byz_hagia_sophia: "Hagia Sophia"
 byz_hagia_sophia_desc: "Hagia Sophia jest szczytowym osiągnięciem rzymskiego mecenatu. Ukończona w 537 roku, może być uznana za jeden z symboli panowania Justyniana i całego cesarstwa."
 byz_roman_empire: "Cesarstwo Rzymskie"
 byz_roman_empire_desc: "Jesteśmy prawdziwym Cesarstwem Rzymskim, powstałym w wyniku podziału na część zachodnią i wschodnią, a zarazem jedyną ocalałą pozostałością dawnego imperium. Tak zwani «cesarze Świętego Cesarstwa Rzymskiego» wcale nimi nie są, a pretendenci do naszego tronu w Konstantynopolu to jedynie głupi uzurpatorzy."
 byz_protect_the_frontiers: "Ochroń granice"
 byz_protect_the_frontiers_desc: "Odrodzeniu naszego imperium musi towarzyszyć odnowa jego granic. Weźmy przykład z przeszłości i należycie ufortyfikujmy pogranicze, wykorzystując w tym celu system temów."
 byz_strategikon: "Strategikon"
 byz_strategikon_desc: "Na przestrzeni wieków powstało wiele podręczników wojskowości, których celem było podnoszenie umiejętności wojskowych bizantyjskich władców i generałów oraz przekazywanie wiedzy kolejnym pokoleniom."
 byz_corpus_iuris_civilis: "Zmodernizuj Corpus Iuris Civilis"
 byz_corpus_iuris_civilis_desc: "Corpus Iuris Civilis był zbiorem praw wydanym z inicjatywy Justyniana. Z czasem zastąpiły go nowsze kodeksy, lecz jego nazwa może posłużyć jako prestiżowy tytuł zupełnie nowego zbioru praw."
 BYZ_false_despots_title: "Fałszywi despoci"
 BYZ_false_despots_desc: "Despotat Epiru powstał jako jedno z państw sukcesyjnych Cesarstwa Bizantyjskiego po katastrofie 1204 roku. Z czasem dostał się jednak pod kontrolę Neapolitańczyków, co jeszcze bardziej umocniło wpływy łacińskie w Grecji. Musimy zniszczyć tę twierdzę!"
 BYZ_magna_graecia_title: "Odzyskaj Wielką Grecję"
 BYZ_magna_graecia_desc: "Magna Graecia, ziemie zasiedlone w starożytności przez greckich kolonistów, od dawna pozostają utracone wskutek upadku naszego imperium. Dzięki kompetentnemu przywództwu i potężnej flocie nadszedł czas, by odzyskać te terytoria i przywrócić rzymskie rządy na południowym krańcu Italii."
 BYZ_carthage_title: "Egzarchat Afryki"
 BYZ_carthage_desc: "Rzymska prowincja Afryka od dawna stanowiła kluczowe terytorium Cesarstwa Rzymskiego. Po podziale imperium, niespełna sto lat później, dostała się pod panowanie Wandalów. Justynianowi udało się ponownie przywrócić ją pod rzymskie panowanie. W VII wieku region przeszedł jednak pod władzę kalifatu."
 BYZ_impending_doom_title: "Nadchodąca zagłada"
 BYZ_impending_doom_desc: "Imperium stoi na krawędzi zagłady. Każdy obywatel rzymski w głębi duszy wie, że koniec jest bliski, a dni chwały Rzymu są już policzone. Czy jednak dla chylącego się ku upadkowi imperium naprawdę nie ma nadziei? Cesarze próbują zawierać sojusze na Zachodzie i szukają wsparcia — być może wciąż istnieje szansa na odrodzenie."
 BYZ_bar_title: "Odwet pod Barem"
 BYZ_bar_desc: "Katastrofalna bitwa pod Barem sprawiła, że państwo serbskie przez wiele lat zachowało niezależność od Cesarstwa Bizantyjskiego. Choć później udało nam się odpowiedzieć Serbom uderzeniem, zdołali oni wcześniej zająć znaczną część naszych ziem i utworzyć własne imperium. Z czasem również ono zaczęło chylić się ku upadkowi. Uderzmy, póki nasi wrogowie są osłabieni!"
 BYZ_illyria_title: "Wkrocz do Ilirii"
 BYZ_illyria_desc: "Obecna sytuacja w Ilirii budzi niepokój. W ostatnim czasie coraz większe zainteresowanie tym obszarem wykazują Habsburgowie, którzy próbują wykorzystać powstałą tam próżnię polityczną i przejąć kontrolę nad regionem."
 BYZ_belisarius_foe_title: "Wróg Belizariusza"
 BYZ_belisarius_foe_desc: "Wojna z Królestwem Ostrogotów w Italii była jednym z największych osiągnięć panowania Justyniana i dowodem wojskowego kunsztu jego wodza, Belizariusza. Zmagania z Ostrogotami były długie i wyczerpujące, lecz ostatecznie zakończyły się zwycięstwem."
 BYZ_justinians_ambition_title: "Ambicje Justyniana"
 BYZ_justinians_ambition_desc: "Panowanie Justyniana, jednego z najbardziej szanowanych cesarzy wschodniorzymskich, było okresem chwały i sukcesów. To właśnie za jego rządów podjęto najskuteczniejszą próbę przywrócenia Cesarstwa Rzymskiego do dawnej potęgi."
 BYZ_iberia_title: "Non Plus Ultra"
 BYZ_iberia_desc: "Na zachodzie znajduje się Cieśnina Gibraltarska, strzeżona przez dwa Słupy Herkulesa. Starożytni Rzymianie wierzyli, że za Iberią nie ma już nic. Dawni żeglarze przestrzegali przed wyprawą dalej, głosząc hasło «non plus ultra» — nic ponad to. Dziś wiemy, że na zachód od Iberii rozciągają się rozległe ziemie podbite przez Hiszpanów. Niech nasze wojska wkroczą tam i zajmą Hispanię wraz z jej koloniami jako prawowite rzymskie terytorium."
 BYZ_greece_title: "Odwróć upadek"
 BYZ_greece_desc: "Cesarstwo Rzymskie chyli się ku upadkowi już od niemal tysiąca lat. Krótkie okresy odrodzenia nie zdołały odwrócić tego procesu i dziś możemy stać u kresu naszej drogi. Osmanowie zbliżają się, pożądając miasta będącego obiektem pragnień całego świata, a koniec wydaje się nieunikniony. Wykorzystajmy jednak fakt, że Osmanowie są zajęci innymi sprawami, i umocnijmy nasze panowanie w Grecji — najważniejszej części naszego imperium."
 BYZ_bulgaria_title: "Odbij Bułgarię"
 BYZ_bulgaria_desc: "Choć udało nam się odzyskać Grecję spod osmańskiego panowania, kolejna próba może okazać się równie trudna. Miejmy nadzieję, że bułgarscy możnowładcy bardziej sprzeciwią się swoim muzułmańskim władcom niż naszemu panowaniu i ponownie znajdą się pod naszymi wpływami."
 BYZ_aegean_islands_title: "Wypędź republiki"
 BYZ_aegean_islands_desc: "Wraz z rozwojem naszego państwa i umacnianiem jego pozycji obecność łacińskich republik w naszym sąsiedztwie staje się bardziej przeszkodą niż wsparciem. Czas skończyć z pustymi deklaracjami przyjaźni wobec kupców. Wyspy Morza Egejskiego należą do nas i do naszych [Root.GetBurghersName]."
 BYZ_venetian_avarice_title: "Wenecka chciwość"
 BYZ_venetian_avarice_desc: "W 1204 roku Konstantynopol padł ofiarą oblężenia katolików. Krzyżowcy, którzy początkowo zamierzali walczyć z muzułmanami na Wschodzie, splądrowali miasto, zdradzili swoje ideały i zwrócili się przeciwko nam. Przy wsparciu zdradzieckich Wenecjan zdobyli metropolię w kwietniu tego przeklętego roku. Następnie miasto przez długi czas plądrowano, a niezliczone bogactwa i bezcenne ikony wywieziono z Królowej Miast. Upadek Konstantynopola doprowadził do powstania Cesarstwa Łacińskiego, którego rządy określano mianem frankokracji. Ten krótki okres przyspieszył upadek i jeszcze bardziej osłabił imperium."
 BYZ_france_title: "Poza Alpami"
 BYZ_france_desc: "Za północnymi górami Italii leżą ziemie Galii, znane dziś jako Francja. Rządzą nimi potomkowie Galów i najeźdźczych plemion germańskich, tworzący potężne królestwo. Zbierzmy siły w Italii i podbijmy to królestwo, którego władcy ulegli złudzeniom o własnych imperialnych ambicjach."
 BYZ_france_ct: "§Y[Root.GetName]§! zyskuje stałe roszczenia do wszystkich prowincji w §YWielkiej Brytanii§!, §YNiderlandach§! i §YZachodnich Niemczech§!, wymaganych do podjęcia decyzji §YPrzywróć Cesarstwo Rzymskie§!."
 BYZ_roman_empire_title: "Basileia Rhomaion"
 BYZ_roman_empire_desc: "Od czasu, gdy oba Cesarstwa Rzymskie pozostawały zjednoczone, minęło już ponad tysiąc lat. Podział nastąpił w 395 roku; liczono, że pomoże on powstrzymać upadek imperium i jego systemu politycznego. Stało się jednak inaczej: zachodnia część upadła w 476 roku, a wschodnia omal nie została zdobyta przez Osmanów w XV wieku. Nikt wówczas nie przypuszczał, że spadkobiercy wschodnich cesarzy ponownie będą władać zjednoczonym imperium. Proklamacja odrodzonego Cesarstwa Rzymskiego zasługuje na wielki triumf w samym Rzymie."
 BYZ_coast_title: "Azja Mniejsza"
 BYZ_coast_desc: "Choć zachodnie krańce Anatolii zostały już dawno podbite i zasiedlone przez Turków osmańskich, wciąż stanowią dla nas ważne ziemie. Liczna ludność grecka zamieszkująca miasta i nadmorskie osady sprawia, że odzyskanie tych terytoriów może wzmocnić nasz handel morski i potęgę państwa."
 BYZ_avenge_1071_title: "Pomsta za 1071 rok"
 BYZ_avenge_1071_desc: "Na 130 lat przed upadkiem Konstantynopola w ręce krzyżowców Cesarstwo Rzymskie poniosło tragiczną klęskę na polach Manzikert, przypieczętowując los rzymskiej Anatolii. Po tej porażce Anatolia została na stałe zasiedlona przez Turków — zaciekłych przeciwników i rywali naszego państwa. Skoro wypędziliśmy ich już z Grecji i wschodniej części Azji Mniejszej, powinniśmy położyć kres ich panowaniu w całej Anatolii."
 BYZ_syria_title: "Antiochia i Jerozolima"
 BYZ_syria_desc: "Na terenie Syrii znajdują się dwie stolice pentarchii. To ziemia zamieszkana od starożytności, ojczyzna samego Jezusa Chrystusa. Musimy przejąć pełną kontrolę nad tą prowincją i przywrócić ten ważny region Cesarstwu Rzymskiemu."
 BYZ_egypt_title: "Wkraczamy do Egiptu"
 BYZ_egypt_desc: "Kontrola nad biskupstwem Aleksandrii i deltą Nilu czyni Egipt niezwykle ważnym dla [Root.GetName]. Pełne opanowanie tej prowincji musi stać się naszym najwyższym priorytetem, a jej posiadanie powinno przynieść nam niewyobrażalne bogactwo i potęgę. Wydobędziemy z niej pełnię możliwości, pokazując, że wszyscy nasi poprzednicy nie potrafili wykorzystać prawdziwego potencjału tego regionu."
 BYZ_breadbasket_title: "Spichlerz"
 BYZ_breadbasket_desc: "Nil jest życiodajną rzeką egipskiej cywilizacji. Dzięki rozbudowanemu systemowi nawadniania zapewnia obfite plony i żywność, pozwalając każdej cywilizacji rozwijać się liczebnie. Skoro odzyskaliśmy ten obszar, wykorzystajmy potencjał Nilu do maksimum."
 BYZ_pontic_empire_title: "Książęta Lazów"
 BYZ_pontic_empire_desc: "Po katastrofalnym upadku Konstantynopola w ręce krzyżowców w 1204 roku powstało kilka pomniejszych państw wyrosłych z rozpadu imperium. Jednym z nich było państwo Komnenów w Poncie. Jego władcy uważają się za prawowitych spadkobierców cesarstwa, lecz są jedynie uzurpatorami skazanymi na zagładę. Ich panowanie obejmuje głównie ziemie ludu Lazów. Nie są cesarzami, lecz zwykłymi książętami!"
 BYZ_persians_title: "Upokórz Persów"
 BYZ_persians_desc: "Cesarstwo Rzymskie od stuleci toczyło z Persami spory o dominację w Mezopotamii i na Kaukazie. Musimy wkroczyć do akcji i zadać ich ambicjom oraz dumie decydujący cios, raz na zawsze udaremniając plany zdobycia ziem na zachód od Gór Zagros. Trzeba ich upokorzyć!"
 BYZ_mesopotamia_title: "Podążaj wzdłuż rzek"
 BYZ_mesopotamia_desc: "Mezopotamia, jedna z kolebek cywilizacji, jest otoczona przez potężnych wrogów i pozbawiona naturalnych barier obronnych. Musimy zadbać o to, by nie stała się polem rozgrywek innych wielkich mocarstw, lecz naszym własnym terytorium. Persowie nie będą mieli tu nic do powiedzenia!"
 BYZ_mecca_title: "Serce islamu"
 BYZ_mecca_desc: "Mekka jest centrum świata muzułmańskiego. To właśnie stąd wywodzi się pierwszy kalifat, który odebrał naszemu chylącemu się ku upadkowi imperium rozległe terytoria. Byłoby więc niezwykle ironiczne, gdybyśmy zdobyli najświętsze z muzułmańskich miast. Jeszcze większą ironią byłoby przekształcenie go w miasto chrześcijańskie."
 BYZ_economic_independence_title: "Niezależność gospodarcza"
 BYZ_economic_independence_desc: "Po 1204 roku kolejni cesarze próbowali uczynić z bizantyjskich rynków bezcenny atut łacińskich kupców. Przyznawali im liczne przywileje i zwalniali z kommerkion — dziesięcioprocentowego cła nakładanego na towary przywożone do Konstantynopola. Doprowadziło to do katastrofalnego spadku zaufania naszych kupców i utraty przez nich konkurencyjności. Musimy odzyskać te rynki."
 BYZ_return_to_gold_title: "Powrót do złota"
 BYZ_return_to_gold_desc: "Dawniej Cesarstwo Wschodniorzymskie dbało o wybijanie złotych monet dla swoich poddanych. Utrata kopalń złota i srebra sprawiła jednak, że ich produkcja stawała się coraz trudniejsza. Ostatnią wybitą złotą monetą był hyperperon, który ostatecznie również podzielił los innych walut i został zdewaluowany, by sfinansować kampanie wojenne."
 BYZ_support_weavers_title: "Wesprzyj tkaczy"
 BYZ_support_weavers_desc: "Tkactwo jedwabiu ma w Bizancjum długą tradycję. Od czasu przemycenia jedwabników w VI wieku sztuka ich hodowli przetrwała całe tysiąclecie, a w większych miastach powstały liczne cechy tkaczy. Wesprzyjmy ich i zapewnijmy im rynki zbytu dla ich wyrobów."
 BYZ_tarnished_state_title: "Wyniszczone państwo"
 BYZ_tarnished_state_desc: "Nasze państwo zostało wyniszczone przez wojny i wyludnienie. Nieustanne wojny domowe i konflikty uszczupliły nasz najcenniejszy zasób — ludność. Nie pozwólmy, by nasze ziemie nadal pustoszały, i zadbajmy o to, by opustoszałe domy znów się zaludniły."
 BYZ_book_of_the_eparch_title: "Księga eparcha"
 BYZ_book_of_the_eparch_desc: "Wraz ze wzrostem liczby kupców w Królowej Miast powinniśmy stworzyć nowe podręczniki i rejestry, które pozwolą nadzorować miejscowych mieszczan. Przy tak wielu cechach i wyjątkach przyszli eparchowie muszą zdobyć odpowiednią wiedzę i doświadczenie, by skutecznie nimi zarządzać."
 BYZ_at_least_10_production_income: "Co najmniej §Y10.0§!¤ miesięcznego dochodu z §Yprodukcji§!."
 BYZ_glass_ware_title: "Szklane wyroby Bizancjum"
 BYZ_glass_ware_desc: "Sztuka wytwarzania szkła we wschodnim Cesarstwie Rzymskim stała na niezwykle wysokim poziomie. Wyroby te słynęły w całej Europie, podobnie jak cesarskie jedwabie, a ich kunszt wpłynął na rozwój szkła weneckiego i wielu innych stylów. Odkąd jednak łacińscy kupcy przejęli nasze rynki, ta sztuka zdaje się odchodzić w zapomnienie i przetrwała jedynie w Konstantynopolu. Musimy to zmienić."
 BYZ_city_of_worlds_desire_title: "Miasto, którego pragnie cały świat"
 BYZ_city_of_worlds_desire_desc: "Konstantynopol, stolica Cesarstwa Wschodniorzymskiego, nosi wiele nazw i przydomków. Od Bizancjum, przez Nowy Rzym, aż po «Królową Miast» — jednak najlepiej oddaje jego znaczenie miano «Miasta, którego pragnie cały świat», doskonale ukazujące zazdrość i pożądanie, jakie budzi w sąsiednich państwach."
 BYZ_megalopolis_title: "Wielka metropolia"
 BYZ_megalopolis_desc: "Ludność Bizancjum należała do najbardziej skoncentrowanych w ówczesnym świecie. W obrębie murów Konstantynopola tętniło życie, a miasto osiągnęło ogromne rozmiary. Obecność dworu cesarskiego sprawiała, że osiedlanie się w stolicy było korzystne zarówno pod względem gospodarczym, jak i politycznym. Wraz z odbudową imperium ta koncentracja bogactwa z pewnością powróci."
 BYZ_royal_purple_title: "Cesarska purpura"
 BYZ_royal_purple_desc: "Najbardziej rozpoznawalnym symbolem Bizancjum pozostaje jednak cesarska purpura. Szaty barwione purpurą tyryjską były oznaką królewskiego majestatu, a potomstwo cesarskie przychodziło na świat w komnacie wyłożonej purpurowym kamieniem, niezwykle rzadkim w tamtych czasach. Barwnik wytwarzano w kilku miejscach imperium, lecz uzyskiwane ilości nigdy nie były duże, a jego dostępność pozostawała ograniczona. Przywróćmy tę barwę rzymskim władcom."
 BYZ_promote_the_merchants_title: "Wzmocnij [Root.GetBurghersName]"
 BYZ_promote_the_merchants_desc: "Zdrada, której dopuściliśmy się wobec [Root.GetBurghersName], poważnie nadszarpnęła zaufanie między nimi a państwem. Naprawmy dawne błędy i przywróćmy im wiarę w nasze rządy."
 BYZ_collect_our_profits_title: "Zbierz nasze zyski"
 BYZ_collect_our_profits_desc: "Wsparliśmy kupców i udzieliliśmy pożyczek wytwórcom, nadszedł więc czas, by odebrać należne odsetki. Zbieramy to, co zasialiśmy, i już wkrótce będziemy cieszyć się owocami naszej pracy."
 BYZ_warehouse_of_the_east_title: "Centrum handlu Wschodu"
 BYZ_warehouse_of_the_east_desc: "Dzięki wsparciu dla wytwórców oraz gwałtownemu rozwojowi miast i cechów staliśmy się ważnym ośrodkiem produkcji i handlu. Wiele cenionych towarów powstaje właśnie tutaj. Rzymianie słyną już nie tylko z długiej i bogatej historii, lecz także z pięknych tkanin, które pozostają dostępne dla każdego."
 BYZ_peloponesian_renaissance_title: "Renesans Peloponezu"
 BYZ_peloponesian_renaissance_desc: "Gdy Konstantynopolowi groziła nieuchronna inwazja, część bizantyjskich uczonych znalazła schronienie w Morei, dając półwyspowi prawdziwe odrodzenie. Z Peloponezu pochodził Gemistos Plethon, filozof zgłębiający dzieła Platona i silnie związany z dawnymi wierzeniami."
 BYZ_monemvasian_merchants_title: "Kupcy z Monemwazji"
 BYZ_monemvasian_merchants_desc: "Monemwasia to miasto położone u wschodnich wybrzeży Peloponezu. Dzięki wyjątkowemu położeniu stała się lokalnym ośrodkiem handlu, w którym rozwinęło się kilka wpływowych rodzin kupieckich, między innymi Notarasowie."
 BYZ_thessaly_title: "Handel w Salonikach"
 BYZ_thessaly_desc: "Saloniki przez długi czas pozostawały drugą stolicą imperium, pełniąc zarówno funkcje polityczne, jak i morskie. Przywróćmy temu miastu dawną świetność!"
 BYZ_wealth_from_the_east_title: "Bogactwa Wschodu"
 BYZ_wealth_from_the_east_desc: "Wraz z ekspansją imperium na dawne ziemie ożywają stare szlaki handlowe. Skupiliśmy się na przywróceniu świetności naszym ziemiom macierzystym, lecz powinniśmy zrobić to samo z pozostałymi obszarami dawnego imperium. Niech bogactwa Wschodu znów na zawsze popłyną do Konstantynopola!"
 BYZ_church_in_distress_title: "Kościół w potrzebie"
 BYZ_church_in_distress_desc: "Prawdziwy Kościół przeżywa kryzys. Duchowieństwo jest głęboko zaniepokojone decyzją monarchy o zawarciu unii z Rzymem, a wielu kapłanów otwarcie sprzeciwia się cesarzowi. Musimy odbudować zaufanie do dynastii [Root.Monarch.Dynasty.GetName]."
 BYZ_muscovite_autocephaly_title: "Ogranicz rosyjską autokefalię"
 BYZ_muscovite_autocephaly_desc: "Po ogłoszeniu unii Kościołów wielu biskupów w innych państwach zerwało z nami więzi, ogłaszając autokefalię i niezależność od patriarchy Konstantynopola. Wśród nich znaleźli się niekwestionowani przywódcy tego ruchu w Rosji. Musimy skłonić ich do powrotu na łono Kościoła."
 BYZ_mend_the_schism_title: "Zakończ schizmę"
 BYZ_mend_the_schism_desc: "Spory o prymat Rzymu oraz naszą słuszną wiarę w równość doprowadziły do zerwania więzi przez zwolenników Rzymu i rozłamu w Kościele w 1054 roku. Obie strony wzajemnie się ekskomunikowały, a ich Kościoły pozostają rozdzielone do dziś. Tylko nasza siła może to naprawić."
 BYZ_church_authority_title: "Odzyskaj autorytet"
 BYZ_church_authority_desc: "Choć udało nam się uspokoić duchownych, wiara zwykłych obywateli w monarchę i Kościół znacznie osłabła. Musimy przypomnieć ludowi, kto został wybrany do przewodzenia mu z woli Boga, i powstrzymać falę bezbożności."
 BYZ_new_synods_title: "Nowe synody"
 BYZ_new_synods_desc: "W pierwszych stuleciach po życiu Jezusa wspólnota biskupów wielokrotnie zbierała się na synodach, by szczegółowo omawiać kwestie wiary. Wraz z przemianami świata, kultury i warunków społeczno-gospodarczych warto rozważyć kontynuowanie tej tradycji."
 BYZ_pentarchy_title: "Przywróć pentarchię"
 BYZ_pentarchy_desc: "Przed upadkiem naszego imperium pięciu patriarchów — Antiochii, Jerozolimy, Aleksandrii, Rzymu i Konstantynopola — żyło we względnej zgodzie i jedności. W razie potrzeby zbierali się, by rozstrzygać ważne sprawy i służyć wspólnocie wiernych. Przywróćmy ten złoty wiek."
 BYZ_reinforce_constantinople_title: "Umocnij Konstantynopol"
 BYZ_reinforce_constantinople_desc: "Potężne Mury Teodozjusza popadają w ruinę, a zagrożenie osmańskie wciąż rośnie. Musimy działać, zanim nasze umocnienia rozsypią się niczym kruche szkło."
 BYZ_defence_in_depth_title: "Obrona w głębi"
 BYZ_defence_in_depth_desc: "Jeśli chcemy stworzyć nieprzeniknioną obronę, nie możemy polegać tylko na jednym rozwiązaniu. Potrzebujemy kolejnych linii umocnień i wielu planów działania, by być przygotowanymi na każdy podstęp, jaki mogą szykować nasi wrogowie."
 BYZ_hexamilion_title: "Mur Heksamilionu"
 BYZ_hexamilion_desc: "Mur Heksamilionu chronił niegdyś przesmyk w czasach starożytnych. Niedawno odbudowano go, by zabezpieczyć nas przed Osmanami, lecz przedsięwzięcie zakończyło się niepowodzeniem. Musimy zdecydować, czy zaangażować się w jego odbudowę na dobre, czy całkowicie z niej zrezygnować."
 BYZ_theme_system_title: "System temów"
 BYZ_theme_system_desc: "System temów stanowił niegdyś podstawę naszego cywilnego i wojskowego systemu zarządzania. Gwałtowna utrata terytoriów sprawiła jednak, że przestał być potrzebny. Przywróćmy go na stałe."
 BYZ_restore_navy_title: "Odbuduj flotę bizantyjską"
 BYZ_restore_navy_desc: "Utrata znaczenia dromonów, dominacja łacińskich galer oraz uzależnienie od republik łacińskich w kwestii wsparcia morskiego sprawiły, że nasza flota praktycznie przestała istnieć. Zrzućmy te kajdany i ponownie uzbrójmy się na morzu."
 BYZ_greek_fire_title: "Ogień grecki"
 BYZ_greek_fire_desc: "Ogień grecki, znany Grekom pod wieloma nazwami, był jedną z najważniejszych innowacji wspierających Cesarstwo Wschodniorzymskie. Była to substancja miotana w kierunku wrogich okrętów i podpalana, działająca niczym prymitywny miotacz ognia. Dzięki niej flota bizantyjska zyskiwała znaczną przewagę nad morskimi rywalami, aż do czasu, gdy utracono dostęp do składników potrzebnych do jej wytwarzania i zarzucono tę praktykę."
 BYZ_branching_bottom_title: "Misja z rozgałęzieniem"
 BYZ_branching_bottom_desc: "To misja z rozgałęzieniem. Jej warunki i efekty będą zależeć od wyboru dokonanego podczas misji «System temów»."
 BYZ_branching_top_left_title: "Misja z rozgałęzieniem"
 BYZ_branching_top_left_desc: "To misja z rozgałęzieniem. Jej warunki i efekty będą zależeć od wyboru dokonanego podczas misji «System temów»."
 BYZ_branching_top_right_title: "Misja z rozgałęzieniem"
 BYZ_branching_top_right_desc: "To misja z rozgałęzieniem. Jej warunki i efekty będą zależeć od wyboru dokonanego podczas misji «System temów»."
 BYZ_foreign_officers_title: "[Root.GetPreviewColorBYZ]Zagraniczni oficerowie[Root.GetPreviewColorBYZ_end]"
 BYZ_foreign_officers_desc: "Dotkliwy brak żołnierzy i wykwalifikowanych generałów jest oczywisty. Choć nie poprawi to ogólnej kondycji armii, zatrudnienie zagranicznych oficerów wraz z ich oddziałami może wzmocnić nasze rezerwy i kadrę dowódczą."
 BYZ_decentralized_pronoia_title: "[Root.GetPreviewColorBYZ]Prawa pronoiarów[Root.GetPreviewColorBYZ_end]"
 BYZ_decentralized_pronoia_desc: "Pronoiarowie to w większości dziedziczni posiadacze ziemscy, nagradzani za wierną służbę wojskową. Być może warto zmodyfikować ten system, aby zwiększyć ich możliwości, na przykład wzorując się na osmańskich timarach."
 BYZ_strategoi_realms_title: "[Root.GetPreviewColorBYZ]Włości strategów[Root.GetPreviewColorBYZ_end]"
 BYZ_strategoi_realms_desc: "W wyniku naszych decyzji armia przekształciła się w zdecentralizowaną wspólnotę rodzimych i zagranicznych dowódców. Większość z nich posiada dziedziczne ziemie, na których rekrutuje miejscową ludność i nadaje majątki swoim najwierniejszym żołnierzom."
 BYZ_centralized_pronoia_title: "[Root.GetPreviewColorBYZ]Kontrola nad pronoiarami[Root.GetPreviewColorBYZ_end]"
 BYZ_centralized_pronoia_desc: "Pronoiarowie to przede wszystkim właściciele ziemscy, którym nadano ziemię w zamian za służbę wojskową. Początkowo urzędy te nie były dziedziczne, lecz z czasem stały się takimi, gdyż pełnienie funkcji pronoiara przestało być czymś wyjątkowym. Instytucja ta jest niezwykle przydatna naszej armii, wymaga jednak pilnej reformy."
 BYZ_reform_the_themata_title: "[Root.GetPreviewColorBYZ]Zreformuj system temów[Root.GetPreviewColorBYZ_end]"
 BYZ_reform_the_themata_desc: "System temów nadal funkcjonuje, lecz jest rażąco przestarzały i nie odpowiada współczesnym potrzebom. Musimy go zreformować, aby sprostał wyzwaniom przyszłości — epoce prochu i stałych armii."
 BYZ_varangian_guard_title: "[Root.GetPreviewColorBYZ]Gwardia wareska[Root.GetPreviewColorBYZ_end]"
 BYZ_varangian_guard_desc: "Gwardia wareska była elitarną formacją naszej armii. Początkowo składała się z wikińskich najemników, a później dołączyli do niej Anglosasi. Z czasem jej członkowie zintegrowali się z resztą społeczeństwa, a formacja przestała istnieć jako odrębny regiment. W XV wieku wielu ludzi podawało się za Waregów. Nadszedł czas, by odtworzyć tę słynną jednostkę i ją zmodernizować."
