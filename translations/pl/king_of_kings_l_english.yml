 flavor_per.79_tt: "§GInformacja o wydarzeniu§!: \nWydarzenie ustanowi legendę §YIsmaila I§! i opowie o jego działalności na dworze w [Root.Capital.GetCapitalName]."
 flavor_per.79.t: "Wzrost potęgi Ismaila I"
 flavor_per.79.d: "Niewielu ludzi zapisało się w historii zarówno na dworze, jak i na polu bitwy tak wyraźnie jak Ismail. Jego elokwencja, widoczna zwłaszcza w twórczości poetyckiej, dorównuje geniuszowi wojskowemu oraz nowatorskim pomysłom na reformę administracji i sprowadzanie nowych artystów oraz stylów architektonicznych. Z pewnością ten utalentowany młodzieniec zapisze się w historii jako jedna z kluczowych postaci naszego wzrostu potęgi!"
 flavor_per.79.a: "Tron będzie jego!"
 flavor_per.79.b: "Będzie służył dworowi."
 flavor_per.79.c: "Nasi wrogowie zadrżą na jego widok."
