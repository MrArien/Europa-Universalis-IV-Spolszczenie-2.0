 estate_burghers_YEM_coffee_monopoly: "Monopol na kawę"
 estate_burghers_YEM_coffee_monopoly_desc: "Kawa należy do zwykłych ludzi, którzy trudzą się jej uprawą. Należy przyznać im prawo do swobodnego dysponowania jej zbiorami. Ich zaangażowanie i tak przyniesie nam korzyści."
 flavor_YEM.1.t: "Jemen umacnia swoją kontrolę"
 flavor_YEM.1.d: "Od dziesięcioleci jemeńscy kupcy konkurują z interesami bogatych oligarchów z Ormuzu na północy. Dzięki niedawnej kampanii podbojów i odpowiedniej polityce udało nam się wypchnąć ich z rynków, umacniając naszą pozycję najważniejszych kupców w południowo-wschodniej Arabii. Odtąd bogactwo nie będzie już odpływać z Adenu na północ, lecz pozostanie w skarbcach naszego państwa i naszych handlarzy."
 flavor_YEM.1.a: "Nie było dla nich miejsca w naszych planach!"
 flavor_YEM.2.t: "Podbój wybrzeża Somalii"
 flavor_YEM.2.d: "Wybrzeże Somalii padło pod naporem naszych wojsk. Nad zdobytymi miastami powiewają już nasze sztandary, a my stopniowo zdobywamy zaufanie miejscowej ludności i rozwijamy handel w regionie. Jeśli jednak zechcemy, możemy nałożyć podatek na miejscową produkcję kadzidła, szybko zasilając skarbiec kosztem zaufania Somalijczyków."
 flavor_YEM.2.a: "Skupmy się na eksploatacji handlu kadzidłem."
 flavor_YEM.2.b: "Zadbajmy o pełną integrację Somalijczyków."
 flavor_YEM.3.t: "Sekret jemeńskiej kawy"
 flavor_YEM.3.d: "Coffea arabica zdobywa światową sławę dzięki swoim wyjątkowym właściwościom i dostępności. Uważa się, że zawiera szczególny składnik, który nadaje jej niezwykłe cechy. Znacznie zwiększyło to światowy popyt na kawę, zwłaszcza na tę uprawianą w naszej części świata."
 flavor_YEM.3.a: "Wspaniała wiadomość!"
 flavor_YEM.4.t: "Przedłużenie monopolu na kawę"
 flavor_YEM.4.d: "Zezwolenie [Root.Monarch.GetTitle] na prowadzenie plantacji kawy właśnie wygasło. Wielu przedstawicieli stanu [Root.GetBurghersName] zastanawia się, czy zostanie ono przedłużone, czy też ta korzystna polityka dobiegnie końca na kolejne lata."
 flavor_YEM.5.t: "Święta doktryna"
 flavor_YEM.5.d: "Nie ulega wątpliwości, że nasz [Root.GovernmentName] pozostaje pod wpływem doktryny ekspansji religijnej. Niektórzy twierdzą, że powinniśmy przyjąć bardziej agresywną postawę i oskarżać kolejnych sąsiadów o zdradę. Inni uważają, że lepiej skupić się na utrwaleniu nauk, które przetrwają całe stulecia."
 flavor_YEM.5.a: "Potrzebujemy bardziej agresywnego podejścia."
 flavor_YEM.5.b: "Musimy zwrócić uwagę na prześladowania muzułmanów poza naszymi granicami."
 flavor_YEM.6.t: "Schronienie dla prześladowanych"
 flavor_YEM.6.d: "Dzięki możliwości przyjmowania mniejszości religijnych i uchodźców państwo [Root.GetName] stało się bezpieczną przystanią dla wielu szyitów, z których część nie należy nawet do szkoły zajdyckiej. Wielu uczonych uważa, że powinniśmy zaprosić zwolenników dżafaryzmu lub ismailizmu, aby przekonać do naszej wiary ich przywódców. Inni twierdzą, że lepiej umożliwić jeszcze większej liczbie ludzi przybycie do naszego państwa w poszukiwaniu lepszego życia."
 flavor_YEM.6.a: "Przyjmijmy wszystkich szyitów!"
 flavor_YEM.6.b: "Przekonajmy do siebie uczonych."
 flavor_YEM.7.t: "Dobra duchowne"
 flavor_YEM.7.d: "Wiele ziem w naszym państwie należy do stanu [Root.GetClergyName]. Znaczna część tych dóbr nie jest nawet w pełni wykorzystywana — służą głównie umacnianiu osobistej pozycji ich właścicieli i wywieraniu wpływu na politykę. Mamy pełne prawo przejąć te terytoria."
 flavor_YEM.7.a: "Przejmijmy niewykorzystywane dobra w miastach!"
 flavor_YEM.7.b: "Skupmy się na innych ziemiach."
 estate_qizilbash_hire_advisor: "Zatrudnij doradcę wojskowego"
 estate_qizilbash_hire_advisor_desc: "[Root.GetQizilbashName] domagają się, aby [Root.Monarch.GetTitle] zatrudnił nowego doradcę wojskowego."
 estate_qizilbash_fire_advisor: "Zwolnij naszego doradcę wojskowego"
 estate_qizilbash_fire_advisor_desc: "[Root.Mil_Advisor.GetTitle] [Root.Mil_Advisor.GetName] obraził [Root.GetQizilbashName]. Żądają, abyśmy go zwolnili!"
 estate_qizilbash_three_privileges: "Rozszerz przywileje [Root.GetQizilbashName]"
 estate_qizilbash_three_privileges_desc: "Jako elitarna formacja państwa [Root.GetName] [Root.GetQizilbashName] czują się pokrzywdzeni w wielu aspektach życia. Domagają się potwierdzenia swojego statusu poprzez przyznanie im kolejnych przywilejów."
 estate_qizilbash_increase_monthly_military_power: "Skup się na potencjale militarnym"
 estate_qizilbash_increase_monthly_military_power_desc: "Wojsko jest siłą napędową naszego państwa. Nic dziwnego, że [Root.GetQizilbashName] szczególnie zależy na tym, abyśmy skupiali się na potrzebach armii."
 estate_qizilbash_retake_core: "Odzyskaj [agenda_province.GetName]"
 estate_qizilbash_retake_core_desc: "[Root.GetQizilbashName] ubolewają nad faktem, że [agenda_province.GetName], integralna część naszego państwa, nie znajduje się pod naszą kontrolą. Żądają odzyskania ziem, które słusznie do nas należą!"
 estate_qizilbash_recruit_more_qizilbash: "Zwerbuj więcej oddziałów kizylbaszy"
 estate_qizilbash_recruit_more_qizilbash_desc: "Szeregi [Root.GetQizilbashName] potrzebują nowych żołnierzy. Należy zwiększyć liczebność regimentów kizylbaszy."
 estate_qizilbash_humiliate_rival: "Upokórz państwo [agenda_country.GetName]"
 estate_qizilbash_humiliate_rival_desc: "Państwo [agenda_country.GetAdjective] od lat jest cierniem w naszym boku. [Root.GetQizilbashName] doskonale o tym wiedzą i domagają się zdecydowanych działań przeciwko naszemu odwiecznemu rywalowi."
 estate_qizilbash_build_army_building_in_y: "Rozbuduj infrastrukturę wojskową w prowincji [agenda_province.GetName]"
 estate_qizilbash_build_army_building_in_y_desc: "[Root.GetQizilbashName] z prowincji [agenda_province.GetName] wzywają nas do budowy nowych ośrodków szkolenia i rekrutacji, aby zapewnić stały dopływ wysokiej jakości rekrutów do armii."
 estate_qizilbash_build_soldier_household: "Zbuduj dom żołnierza w prowincji [agenda_province.GetName]"
 estate_qizilbash_build_soldier_household_desc: "[Root.GetQizilbashName] domagają się utworzenia domu żołnierza w prowincji [agenda_province.GetName], aby przyspieszyć i usprawnić rekrutację swoich oddziałów."
 estate_qizilbash_crush_revolts: "Stłum bunty"
 estate_qizilbash_crush_revolts_desc: "[Root.GetQizilbashName] żądają, abyśmy wykorzystali ich siłę do stłumienia buntów ogarniających nasze państwo."
 estate_qizilbash_expand_into_x: "Rozszerz granice na obszar [agenda_province.GetAreaName]"
 estate_qizilbash_expand_into_x_desc: "[Root.GetQizilbashName] pragną zwiększyć obszar, na którym mogą rekrutować swoje siły. Z zazdrością spoglądają na [agenda_province.GetAreaName], który ich zdaniem byłby doskonałym nabytkiem dla naszego państwa. Wzywają do przeprowadzenia kampanii wojskowej i zdobycia części tych ziem."
 estate_qizilbash_bigger_army_than_rival: "Zabezpiecz się przed państwem [agenda_country.GetUsableName]"
 estate_qizilbash_bigger_army_than_rival_desc: "[Root.GetQizilbashName] obawiają się, że nasza armia nie poradzi sobie w wojnie z państwem [agenda_country.GetAdjective]. Nalegają, aby zwiększyć rekrutację i zadbać o to, by nasze siły zbrojne nie ustępowały już rywalom."
 estate_qizilbash_protect_our_culture: "Chroń ludność [Root.GetAdjective] w prowincji [agenda_province.GetName]"
 estate_qizilbash_protect_our_culture_desc: "[Root.GetQizilbashName] twierdzą, że nasi [Root.Culture.GetName] pobratymcy w prowincji [agenda_province.GetName] są poważnie uciskani przez swoich [agenda_country.GetAdjective] władców. Żądają, abyśmy zdobyli tę prowincję i włączyli ją do naszego państwa!"
 estate_qizilbash_despoil_x: "Złup obszar [agenda_province.GetAreaName]"
 estate_qizilbash_despoil_x_desc: "[Root.GetQizilbashName] domagają się odpowiedniej zapłaty za swoje usługi. Żądają zgody na złupienie obszaru [agenda_province.GetAreaName] i przejęcie jego bogactw."
 estate_qizilbash_develop_x: "Rozwiń prowincję [agenda_province.GetName]"
 estate_qizilbash_develop_x_desc: "Prowincja [agenda_province.GetName], zamieszkana przez ludność kultury [agenda_province.Culture.GetName], jest ojczyzną wielu rodzin i rodów związanych z [Root.GetQizilbashName]. Chcą oni, abyśmy zyskali ich lojalność, rozwijając ziemię ich przodków."
 estate_qizilbash_convert_province_x: "Szerz wiarę [Root.Religion.GetName]"
 estate_qizilbash_convert_province_x_desc: "Jako gorliwi wyznawcy religii [Root.Religion.GetName] [Root.GetQizilbashName] domagają się, aby prowincja [agenda_province.GetName] przyjęła tę samą wiarę."
 estate_qizilbash_establish_safavid_order: "Ustanów zakony safawidzkie"
 estate_qizilbash_establish_safavid_order_desc: "[Root.GetQizilbashName] pragną rozbudować swój zakon, aby do ich szeregów mogło dołączyć więcej członków."
 FROM_AGENDA_PROVINCE_AREA: "z posiadanych prowincji na obszarze §Y[agenda_province.GetAreaName]§!"
 estate_qizilbash_defeat_large_army: "Odnieś chwalebne zwycięstwo"
 estate_qizilbash_defeat_large_army_desc: "Jako elitarne siły państwa [Root.GetName] [Root.GetQizilbashName] pragną ponownie usłyszeć szczęk oręża. Chcą, abyśmy udowodnili światu naszą militarną wyższość, wygrywając wielką bitwę."
 estate_qizilbash_build_fort_building_in_y: "Ufortyfikuj prowincję [agenda_province.GetName]"
 estate_qizilbash_build_fort_building_in_y_desc: "[Root.GetQizilbashName] wzywają nas do wzmocnienia fortyfikacji w prowincji [agenda_province.GetName]. Uważają, że musimy chronić tę kluczową pozycję strategiczną przed atakiem."
 local_qizilbash_displeased: "Niezadowolenie miejscowych kizylbaszy"
 estate_qizilbash_build_cavalry: "Rozbuduj naszą kawalerię"
 estate_qizilbash_build_cavalry_desc: "[Root.GetQizilbashName] są zaniepokojeni stanem naszej kawalerii. Uważają, że jest zbyt słaba i należy ją rozbudować, jeśli chcemy zwyciężać w nadchodzących bitwach."
 qizilbash_cavalry_modifier: "Rozbudowana kawaleria kizylbaszy"
 desc_qizilbash_cavalry_modifier: "Rozbudowa naszych sił kawaleryjskich pozwoliła pozyskać dodatkowe konie, które wzmocnią nasze wojska lądowe."
 estate_ghulams_hire_advisor: "Zatrudnij doradcę wojskowego"
 estate_ghulams_hire_advisor_desc: "[Root.GetGhilmanName] domagają się, aby [Root.Monarch.GetTitle] zatrudnił nowego doradcę wojskowego."
 estate_ghulams_fire_advisor: "Zwolnij naszego doradcę wojskowego"
 estate_ghulams_fire_advisor_desc: "[Root.Mil_Advisor.GetTitle] [Root.Mil_Advisor.GetName] obraził [Root.GetGhilmanName]. Żądają, abyśmy go zwolnili!"
 estate_ghulams_three_privileges: "Rozszerz przywileje [Root.GetGhilmanName]"
 estate_ghulams_three_privileges_desc: "Jako elitarna formacja państwa [Root.GetName] [Root.GetGhilmanName] czują się pokrzywdzeni w wielu aspektach życia. Domagają się potwierdzenia swojego statusu poprzez przyznanie im kolejnych przywilejów."
 estate_ghulams_reduce_war_exhaustion: "Odbuduj siły po wyniszczających wojnach"
 estate_ghulams_reduce_war_exhaustion_desc: "[Root.GetGhilmanName] ciężko walczyli podczas naszych ostatnich kampanii. Wielu ich żołnierzy poległo w bitwach. Proszą, abyśmy pozwolili państwu odzyskać siły przed podjęciem kolejnych podbojów."
 estate_ghulams_increase_monthly_military_power: "Skup się na potencjale militarnym"
 estate_ghulams_increase_monthly_military_power_desc: "Wojsko jest siłą napędową naszego państwa. Nic dziwnego, że [Root.GetGhilmanName] szczególnie zależy na tym, abyśmy skupiali się na potrzebach armii."
 estate_ghulams_retake_core: "Odzyskaj [agenda_province.GetName]"
 estate_ghulams_retake_core_desc: "[Root.GetGhilmanName] ubolewają nad faktem, że [agenda_province.GetName], integralna część naszego państwa, nie znajduje się pod naszą kontrolą. Żądają odzyskania ziem, które słusznie do nas należą!"
 estate_ghulams_support_independence: "Wesprzyj niepodległość [agenda_country.GetAdjective]"
 estate_ghulams_support_independence_desc: "[Root.GetGhilmanName_CL_Cap] zwracają uwagę na trudną sytuację [agenda_country.GetGovNameGen] [agenda_country.GetAdjective], narodu okrutnie podbitego przez naszych rywali [agenda_rival_country.GetGovNameGen] [agenda_rival_country.GetAdjective]. Nakłaniają nas do wspierania niezależności [agenda_country.GetAdjective]."
 estate_ghulams_stop_converting_province_x: "Chroń prawa mniejszości w prowincji [agenda_province.GetName]"
 estate_ghulams_stop_converting_province_x_desc: "[Root.GetGhilmanName_CL_Cap] są zbulwersowani naszym brakiem poszanowania praw religijnych mniejszości. Żądają, abyśmy natychmiast odwołali naszego misjonarza z prowincji [agenda_province.GetName]!"
 estate_ghulams_build_an_army: "Zbuduj armię dla naszego państwa"
 estate_ghulams_build_an_army_desc: "[Root.GetGhilmanName] uważają, że nasza armia przynosi państwu wstyd. Pilnie domagają się jej rozbudowy, aby nasze siły zbrojne mogły skutecznie odstraszać wrogów czyhających na nasze ziemie."
 estate_ghulams_humiliate_rival: "Upokórz państwo [agenda_country.GetName]"
 estate_ghulams_humiliate_rival_desc: "Państwo [agenda_country.GetAdjective] od lat jest cierniem w naszym boku. [Root.GetGhilmanName] doskonale o tym wiedzą i domagają się zdecydowanych działań przeciwko naszemu odwiecznemu rywalowi."
 estate_ghulams_build_army_building_in_y: "Rozbuduj infrastrukturę wojskową w prowincji [agenda_province.GetName]"
 estate_ghulams_build_army_building_in_y_desc: "[Root.GetGhilmanName] z prowincji [agenda_province.GetName] wzywają nas do budowy nowych ośrodków szkolenia i rekrutacji, aby zapewnić stały dopływ wysokiej jakości rekrutów do armii."
 estate_ghulams_build_soldier_household: "Zbuduj dom żołnierza w prowincji [agenda_province.GetName]"
 estate_ghulams_build_soldier_household_desc: "[Root.GetGhilmanName] domagają się utworzenia domu żołnierza w prowincji [agenda_province.GetName], aby przyspieszyć i usprawnić rekrutację swoich oddziałów."
 estate_ghulams_crush_revolts: "Stłum bunty"
 estate_ghulams_crush_revolts_desc: "[Root.GetGhilmanName] żądają, abyśmy wykorzystali ich siłę do stłumienia buntów ogarniających nasze państwo."
 estate_ghulams_expand_into_x: "Rozszerz granice na obszar [agenda_province.GetAreaName]"
 estate_ghulams_expand_into_x_desc: "[Root.GetGhilmanName] pragną zwiększyć obszar, na którym mogą rekrutować swoje siły. Z zazdrością spoglądają na [agenda_province.GetAreaName], który ich zdaniem byłby doskonałym nabytkiem dla naszego państwa. Wzywają do przeprowadzenia kampanii wojskowej i zdobycia części tych ziem."
 estate_ghulams_condottieri_rivals: "Wyślij kondotierów przeciwko państwu [agenda_country.GetUsableName]"
 estate_ghulams_condottieri_rivals_desc: "Nasi rywale z państwa [agenda_country.GetUsableName] próbują zwiększyć swoją potęgę, prowadząc wojnę z państwem [agenda_enemy_country.GetUsableName]. [Root.GetGhilmanName] wzywają nas, abyśmy udaremnili ich plany i wysłali oddziały wspierające państwo [agenda_enemy_country.GetAdjective]."
 estate_ghulams_bigger_army_than_rival: "Zabezpiecz się przed państwem [agenda_country.GetUsableName]"
 estate_ghulams_bigger_army_than_rival_desc: "[Root.GetGhilmanName] obawiają się, że nasza armia nie poradzi sobie w wojnie z państwem [agenda_country.GetAdjective]. Nalegają, aby zwiększyć rekrutację i zadbać o to, by nasze siły zbrojne nie ustępowały już rywalom."
 estate_ghulams_build_up_manpower_reserves: "Odbuduj nasze rezerwy zasobów ludzkich"
 estate_ghulams_build_up_manpower_reserves_desc: "Kurczące się rezerwy zasobów ludzkich niepokoją [Root.GetGhilmanName], którzy ostrzegają, że państwo [Root.GetUsableName] pozostanie bezbronne, jeśli wrogowie spróbują wykorzystać tę sytuację. Zalecają czasowe wstrzymanie ekspansji i odbudowę rezerw."
 estate_ghulams_develop_x: "Rozwiń prowincję [agenda_province.GetName]"
 estate_ghulams_develop_x_desc: "Prowincja [agenda_province.GetName], zamieszkana przez ludność kultury [agenda_province.Culture.GetName], jest ojczyzną wielu rodzin i rodów związanych z [Root.GetGhilmanName]. Chcą oni, abyśmy zyskali ich lojalność, rozwijając ziemię ich przodków."
 estate_ghulams_reduce_other_estate_influence: "Ogranicz wpływy pozostałych stanów"
 estate_ghulams_reduce_other_estate_influence_desc: "Stan [Root.GetNobilityOrFallbackName] oraz [Root.GetQizilbashOrFallbackName] zyskali zbyt duże wpływy na naszym dworze. Jako trzecia siła w rządzie [Root.GetGhilmanName] pragną ograniczyć polityczne znaczenie tych stanów."
 estate_ghulams_build_fort_building_in_y: "Ufortyfikuj prowincję [agenda_province.GetName]"
 estate_ghulams_build_fort_building_in_y_desc: "[Root.GetGhilmanName] wzywają nas do wzmocnienia fortyfikacji w prowincji [agenda_province.GetName]. Uważają, że musimy chronić tę kluczową pozycję strategiczną przed atakiem."
 local_ghulams_displeased: "Niezadowolenie miejscowych ghulamów"
 estate_qizilbash_land_rights: "Prawa ziemskie [Root.GetQizilbashName]"
 estate_qizilbash_land_rights_desc: "[Root.GetQizilbashName] są zaufanymi poddanymi państwa [Root.GovernmentName]. Dlatego powinni mieć prawo do samodzielnego zarządzania częścią własnych ziem."
 estate_qizilbash_military: "Pierwszeństwo [Root.GetQizilbashName]"
 estate_qizilbash_military_desc: "Przyznanie [Root.GetQizilbashName] większej swobody w sprawach wojskowych znacznie wzmocni nasze możliwości, choć odpowiednie wynagrodzenie ich wkładu może nas sporo kosztować."
 estate_qizilbash_loyalty_privilege: "Zapewnij [Root.GetQizilbashName] wpływy polityczne"
 estate_qizilbash_loyalty_privilege_desc: "[Root.GetQizilbashName] zdobyli znaczną potęgę i doskonale znają swoje znaczenie dla naszej armii. Przyznanie im wpływów politycznych w państwie uzna ich pozycję i zwiększy ich lojalność wobec [Root.Monarch.GetTitle]."
 estate_qizilbash_establish_the_qizilbash_regiments: "Utwórz regimenty [Root.GetQizilbashName]"
 estate_qizilbash_establish_the_qizilbash_regiments_desc: "Choć [Root.GetQizilbashName] już teraz stanowią siłę zbrojną naszego państwa, musimy najpierw właściwie włączyć ich do struktur armii, zanim wykorzystamy ich dyscyplinę na polu bitwy."
 estate_qizilbash_expand_the_qizilbash_regiments: "Rozbuduj regimenty [Root.GetQizilbashName]"
 estate_qizilbash_expand_the_qizilbash_regiments_desc: "[Root.GetQizilbashName] dowiedli swojej wartości w ogniu walki. Nadszedł czas, aby jeszcze bardziej powiększyć ich szeregi i zwerbować kolejnych nieustraszonych wojowników."
 estate_qizilbash_protected_communities: "Chronione wspólnoty"
 estate_qizilbash_protected_communities_desc: "[Root.GetQizilbashName] to turkmeńscy szyici. Część z nich ma pochodzenie tureckie lub turkmeńskie, a nie azerskie, lecz ostatecznie łączy ich ta sama grupa etniczna i religia. Jeśli chcemy okazać kizylbaszom dobrą wolę, musimy zapewnić ochronę ich wspólnotom w naszym państwie."
 estate_qizilbash_protected_communities_mod: "Chroniona wspólnota"
 desc_estate_qizilbash_protected_communities_mod: "Prowincja ta jest częścią elit wojskowych jej suwerena. Z tego względu jej mieszkańcy i ich miejscowa kultura podlegają szczególnej ochronie."
 estate_qizilbash_protected_communities_gt: "Każda prowincja z kulturą §Yazerską§!, §Yturkmeńską§!, §Yturkoirańską§! lub §Yturecką§! otrzymuje następujące efekty:"
 estate_qizilbash_protected_communities_rt: "Usuń modyfikator §YChroniona wspólnota§! ze wszystkich prowincji."
 estate_qizilbash_military_leadership: "Dowództwo [Root.GetQizilbashName]"
 estate_qizilbash_military_leadership_desc: "[Root.GetQizilbashName] to zahartowani w boju żołnierze, których doświadczenie będzie bezcenne w nadchodzących wojnach.\nJeśli zaczniemy polegać na generałach wywodzących się z [Root.GetQizilbashName], będziemy jednak musieli zmierzyć się ze sprzeciwem stanu [Root.GetNobilityOrFallbackName] oraz [Root.GetGhulamsOrFallbackName]."
 estate_qizilbash_supremacy_over_the_aristocracy: "[Root.GetQizilbashSupremacyOverAristoPrivilegeName]"
 estate_qizilbash_supremacy_over_the_aristocracy_qizilbash_name: "Przewaga nad arystokracją"
 estate_qizilbash_supremacy_over_the_aristocracy_aswaran_name: "Przywileje [Root.GetQizilbashOrFallbackName]"
 estate_qizilbash_supremacy_over_the_aristocracy_desc: "[Root.GetQizilbashSupremacyOverAristoPrivilegeDesc]"
 estate_qizilbash_supremacy_over_the_aristocracy_desc_qizilbash: "[Root.GetQizilbashOrFallbackName], [Root.GetNobilityOrFallbackName] i [Root.GetGhulamsOrFallbackName] rywalizują ze sobą, ponieważ reprezentują siłę militarną naszego państwa. Tylko jeden stan może zdobyć dominującą pozycję i przychylność rządu [Root.GovernmentName]."
 estate_qizilbash_supremacy_over_the_aristocracy_desc_aswaran: "[Root.GetQizilbashOrFallbackName] mogą należeć do stanu [Root.GetNobilityOrFallbackName], lecz nie każdy szlachcic jest prawdziwym wojownikiem [Root.GetQizilbashOrFallbackName]. Odtąd każdy szlachcic powinien poświęcić się sprawie [Root.GetQizilbashOrFallbackName] albo zapłacić im grzywnę w zamian za zwolnienie ze służby wojskowej."
 horse_breeding_decision_at: "Decyzja pozwala wyhodować nową rasę koni dla §Y[Root.GetQizilbashOrFallbackName]§! i pozostałej części armii.\n§YMożna ją podjąć tylko raz.§!"
 estate_qizilbash_horse_responsibilities: "Przyznaj prawa do hodowli koni"
 estate_qizilbash_horse_responsibilities_desc: "[Root.GetQizilbashName] dorastali wśród swoich wierzchowców. Są najlepszymi kawalerzystami, jakich może wystawić państwo [Root.GetName]. Naturalne jest więc przyznanie im prawa do nadzorowania hodowli, szkolenia i wyposażania koni [Root.GetAdjective]."
 4_QIZILBASH_CAVALRY_FOR_ROOT: "Utwórz §G4§! regimenty §Ykawalerii kizylbaszy§! dla państwa §Y[Root.GetName]§!."
 estate_ghulams_land_rights: "Prawa ziemskie [Root.GetGhilmanName]"
 estate_ghulams_land_rights_desc: "[Root.GetGhilmanName] są zaufanymi poddanymi państwa [Root.GovernmentName]. Dlatego powinni mieć prawo do samodzielnego zarządzania częścią własnych ziem."
 estate_ghulams_military: "Pierwszeństwo [Root.GetGhilmanName]"
 estate_ghulams_military_desc: "Przyznanie [Root.GetGhilmanName] większej swobody w sprawach wojskowych znacznie wzmocni nasze możliwości, choć odpowiednie wynagrodzenie ich wkładu może nas sporo kosztować."
 estate_ghulams_advisor: "Zwerbuj utalentowanych [Root.GetGhilmanName]"
 estate_ghulams_advisor_desc: "[Root.GetGhilmanName] to dobrze wyszkoleni żołnierze. Możemy zawrzeć porozumienie zapewniające nam uprzywilejowany dostęp do ich najzdolniejszych taktyków."
 estate_ghulams_loyalty_privilege: "Większa autonomia [Root.GetGhilmanName]"
 estate_ghulams_loyalty_privilege_desc: "Jeśli pozwolimy im samodzielnie decydować o własnych sprawach, [Root.GetGhilmanName] z pewnością chętniej poprą pozostałe działania naszego rządu."
 estate_ghulams_levies: "Zwiększona rekrutacja [Root.GetGhilmanName]"
 estate_ghulams_levies_desc: "[Root.GetGhilmanName] to żołnierze-niewolnicy rekrutowani z naszych chrześcijańskich prowincji. W naszym interesie leży zatem stworzenie systemu zapewniającego stały napływ nowych ghulamów do armii."
 estate_ghulams_levies_non_muslims: "Zwiększona rekrutacja [Root.GetGhilmanName]"
 estate_ghulams_levies_non_muslims_desc: "Dawniej [Root.GetGhilmanName] byli żołnierzami-niewolnikami, a dziś określenie to oznacza główną formację naszych wojsk. Ponieważ nie jesteśmy już państwem muzułmańskim, wykorzystywanie niewolników jest niewłaściwe. Zamiast tego skupimy się na bardziej tradycyjnych metodach rekrutacji nowych [Root.GetGhilmanName]."
 estate_ghulams_levies_effect_tooltip: "Każda posiadana prowincja wyznająca §Ychrześcijaństwo§! lub §Yzaratusztrianizm§! otrzyma modyfikator §YZwiększona rekrutacja [Root.GetGhilmanName]§!, zapewniający:\nLokalny modyfikator zasobów ludzkich: §G+30,0%§!"
 estate_ghulams_levies_revoke_tooltip: "Modyfikator §YZwiększona rekrutacja [Root.GetGhilmanName]§! zostanie usunięty ze wszystkich posiadanych prowincji §Ychrześcijańskich§! i §Yzaratusztriańskich§!."
 estate_ghulams_levies_mod: "Zwiększona rekrutacja ghulamów"
 desc_estate_ghulams_levies_mod: "Państwo znacznie zwiększyło rekrutację ghulamów w tej prowincji. Chrześcijanie są przymusowo wcielani do armii."
 estate_ghulams_special_privilege: "Kontyngent [Root.GetGhilmanName]"
 estate_ghulams_special_privilege_desc: "Wielu naszych obecnych żołnierzy nadal preferuje walkę konno i z łukiem. [Root.GetGhilmanName] biegle posługują się natomiast bronią prochową. Dzięki lepszemu włączeniu ich do armii będziemy mogli wykorzystać ich taktykę do pokonania wrogów."
 estate_ghulams_government: "Rządy [Root.GetGhilmanName]"
 estate_ghulams_government_desc: "[Root.GetGhilmanName] dowiedli swojej niezawodności. Są bardziej lojalni wobec korony niż kizylbasze, dlatego zasłużyli na wysokie stanowiska w rządzie [Root.GovernmentName]."
 estate_ghulams_government_loyal: "Rząd ghulamów"
 estate_ghulams_government_neutral: "Rząd ghulamów"
 estate_ghulams_government_disloyal: "Rząd ghulamów"
 desc_estate_ghulams_government_loyal: ""
 desc_estate_ghulams_government_neutral: ""
 desc_estate_ghulams_government_disloyal: ""
 estate_ghulams_ensure_caucasian_sovereignty: "Zagwarantuj suwerenność Kaukazu"
 estate_ghulams_ensure_caucasian_sovereignty_desc: "[Root.GetGhilmanName] rekrutowani są głównie spośród dumnych ludów gór Kaukazu. Dlatego szczególnie troszczą się o swoje ojczyste ziemie, nawet jeśli obecnie służą nam przede wszystkim jako żołnierze."
 estate_ghulams_ensure_caucasian_sovereignty_mod: "Zagwarantowana suwerenność Kaukazu"
 desc_estate_ghulams_ensure_caucasian_sovereignty_mod: "Prowincji tej zagwarantowano bezpieczeństwo i suwerenność w zamian za gotowość miejscowej ludności do wspierania zaopatrzenia naszych wojsk."
 estate_ghulams_ensure_caucasian_sovereignty_gt: "Każda posiadana prowincja §YKaukazu§! otrzymuje §R-500,0%§! czasu zmiany kultury i §R+500,0%§! kosztu zmiany kultury, ale zapewnia §G-25,0%§! lokalnego czasu rekrutacji."
 estate_ghulams_ensure_caucasian_sovereignty_rt: "Modyfikator prowincji §YZagwarantowana suwerenność Kaukazu§! zostaje usunięty ze wszystkich naszych prowincji."
 ghulams_rebels_title: "Bunt ghulamów"
 ghulams_rebels_name: "Ghulamowie państwa $COUNTRY$"
 ghulams_rebels_desc: "Ghulamowie, rozbestwieni obecną sytuacją, domagają się utworzenia własnego państwa. Będą walczyć z niespotykaną zaciekłością."
 ghulams_rebels_army: "Armia buntowników ghulamów"
 ghulams_rebels_demands: "Zwiększenie wpływów ghulamów"
 ghulams_rebels_demands_desc: "Buntownicy ghulamowie pragną bronić swoich przywilejów i domagają się zwiększenia swoich wpływów."
 qizilbash_rebels_title: "Bunt kizylbaszy"
 qizilbash_rebels_name: "Kizylbasze państwa $COUNTRY$"
 qizilbash_rebels_desc: "Kizylbasze mają dość podporządkowywania się swojemu suwerenowi. Chwycili za broń i walczą z niezwykłą dyscypliną w obronie swoich praw."
 qizilbash_rebels_army: "Armia buntowników kizylbaszy"
 qizilbash_rebels_demands: "Zwiększenie wpływów kizylbaszy"
 qizilbash_rebels_demands_desc: "Buntownicy kizylbasze pragną bronić swoich przywilejów i domagają się zwiększenia swoich wpływów."
 estate_ghulams_disaster: "Niepodległość ghulamów"
 estate_ghulams_disaster_desc: "Ghulamowie zyskali tak wielką siłę, że oderwali się od naszego państwa, by poza jego granicami stworzyć swój własny kraj."
 estate_ghulams_disaster_tooltip_cossacks: "Jeśli tak się stanie, prowincja §Yghulamów§! uwolni się i stworzy własny kraj! Możesz grać tym krajem."
 estate_ghulams_disaster_tooltip: "Jeśli tak się stanie, prowincja §Yghulamów§! uwolni się i stworzy własny kraj!"
 estate_qizilbash_disaster: "Przejęcie władzy przez kizylbaszy"
 estate_qizilbash_disaster_desc: "Kizylbasze mają dość naszych rządów i uznają, że muszą przejąć kontrolę nad państwem, aby zabezpieczyć swoją pozycję polityczną."
 EST_CRUSHED_QIZILBASH: "Wpływy kizylbaszy zostały ograniczone"
 estate_disasters.22.t: "Ghulamowie wyrywają się spod kontroli"
 estate_disasters.22.d: "Ghulamowie stanowią trzon naszej armii, ponieważ posługują się zaawansowaną bronią prochową, podczas gdy reszta wojsk polega na łucznikach walczących konno. Niestety, zdali sobie sprawę, jak bardzo jesteśmy zależni od ich usług, i nadmiernie umocnili swoją pozycję w odległych regionach państwa [Root.GetUsableName]. Choć formalnie prowincje te podlegają władzy [Root.Monarch.GetName], obszary rządzone przez ghulamów w praktyce przestały być częścią naszego [Root.GovernmentName]."
 estate_disasters.23.t: "Kizylbasze przejmują władzę"
 estate_disasters.23.d: "Kizylbasze stanowią trzon naszych sił zbrojnych i od lat służą państwu [Root.GetName] z lojalnością i dumą. Ich wpływy polityczne w państwie znacznie jednak wzrosły, podczas gdy poparcie dla rządu stale malało. Zbuntowani żołnierze chwycili za broń, zdobyli pałac w prowincji [Root.Capital.GetName] i ogłosili się nowymi władcami państwa [Root.GovernmentName]."
 estate_disasters.23.a.tt: "Państwo [Root.GetName] będzie teraz kontrolowane przez §Ykizylbaszy§!, dopóki nie zostanie podjęta decyzja §Y«Ogranicz wpływy kizylbaszy»§!."
 estate_disasters.24.t: "Ograniczenie wpływów kizylbaszy"
 estate_disasters.24.d: "Dzięki zastosowaniu wielu środków [Root.Monarch.GetTitle] zdołał pozbawić kizylbaszy licznych urzędów i kontrolowanych przez nich majątków. Władza nad państwem ponownie znalazła się w rękach [Root.Monarch.GetName]."
 ghulams_in_the_military_reform: "Ghulamowie w armii"
 ghulams_in_the_military_reform_desc: "Ghulamowie to żołnierze-niewolnicy rekrutowani spośród chrześcijańskich poddanych z Kaukazu. Walczą w służbie imperium przy użyciu broni prochowej, podczas gdy reszta armii polega na bardziej tradycyjnych metodach. Podobnie jak janczarzy ghulamowie mają wpływy nie tylko w wojsku, lecz także w administracji państwa, tworząc odrębną warstwę społeczną."
 mechanic_enables_estate_ghulams_yes: "Włącza klasę §Yghulamów§!."
 mechanic_disables_estate_ghulams_yes: "Wyłącza klasę §Yghulamów§!."
 mechanic_enables_estate_qizilbash_yes: "Włącza klasę §Ykyzyłbaszów§!."
 mechanic_disables_estate_qizilbash_yes: "Wyłącza klasę §Ykyzyłbaszów§!."
 superiority_of_the_state_reform: "Wyższość państwa"
 superiority_of_the_state_reform_desc: "Żadna klasa, niezależnie od tego, jak stara jest jej pozycja w naszym społeczeństwie, nie powinna mieć prawa do wyłączenia spod bezpośredniej władzy rządu. Podobnie jak chłopi, włościanie muszą ugiąć kolana przed państwem."
 divided_aristocracy_reform: "Podzielona arystokracja"
 divided_aristocracy_reform_desc: "Rządzące klasy wojskowe naszego państwa są ze sobą skłócone. Tam, gdzie kiedyś próbowali naciskać na władcę, teraz toczy się nieustanna walka o przychylność monarchy."
 unlock_divided_aristocracy_reform_tt: "Odblokuje reformę rządową '§YPodzielona arystokracja§!'"
 court_of_art_and_culture_reform: "Dwór sztuki i kultury"
 court_of_art_and_culture_reform_desc: "Cały dwór i znaczna część biurokracji są zaangażowane w rozwój kultury imperium. Podczas gdy inne państwa polegają na armiach, nasze społeczeństwo rozszerza wpływy dzięki warsztatom tkackim i mecenatowi nad sztuką."
 unlock_court_of_art_and_culture_reform_tt: "Odblokowuje reformę rządową «§YDwór sztuki i kultury§!»."
 mechanic_can_enforce_primary_culture_yes: "Można użyć traktatu pokojowego «§YNarzucenie kultury głównej§!»."
 zoroastrian_persian_government_reform: "Monarchia Asha"
 zoroastrian_persian_government_reform_desc: "Król Królów sprawuje władzę za pośrednictwem dobrze zorganizowanej biurokracji, która utrzymuje równowagę między stanami a monarchą. Wszystkie działania podejmowane są zgodnie z zasadami Zaratustry."
 cb_spread_the_true_faith: "Szerzenie prawdziwej wiary"
 cb_spread_the_true_faith_desc: "To błądzący niewierni, którzy nie dostrzegają grzechów swojego postępowania!"
 superiority_spread_the_true_faith: "Udowodnij wyższość religijną na polu bitwy"
 superiority_spread_the_true_faith_desc: "Celem wojny jest udowodnienie im naszej wyższości poprzez zwycięstwa w bitwach."
 WAR_OF_RELIGIOUS_SUPERIORITY_WAR_NAME: "$ORDER$ Wojna religijna między państwami $FIRST$ i $SECOND_NAME$"
 po_change_culture: "Narzucenie kultury głównej"
 po_change_culture_desc: "Kultura główna państwa [From.GetName] oraz jego stolicy zostanie zmieniona na §Y[Root.Culture.GetName]§!."
