 YEM_competition_less: "Koniec z konkurencją"
 YEM_seizure_of_aden: "Zdobycie Adenu"
 YEM_tahirid_magnates: "Zwycięstwo nad możnowładcami Tahirydów"
 YEM_caravans_to_mecca: "Karawany do Mekki"
 yem_permanent_power_projection: "Misje jemeńskie"
 YEM_rise_of_yemen: "Powstanie Jemenu"
 YEM_coffee_price_boost: "Sekret jemeńskiej kawy"
 estate_burghers_YEM_coffee_monopoly_mod: "Monopol na kawę"
 YEM_gates_of_lamentation: "Bramy Łez"
 YEM_destined_for_spice_trade: "Przeznaczeni do handlu przyprawami"
 YEM_guardians_of_the_gates: "Strażnicy Bramy"
 ARB_arabian_sea_trade: "Handel na Morzu Arabskim"
 YEM_developing_sanaa: "Rozwój Sany"
 YEM_reunited_yemen: "Ponownie zjednoczony Jemen"
 YEM_superiority_of_zaid_and_ali: "Wyższość Zajda i Alego"
 YEM_global_tax_modifier_upgrade: "Opodatkowanie meczetów"
 YEM_extra_buff_to_churches: "Przejęcie niewykorzystywanych dóbr kościelnych"
 YEM_rise_of_the_zaidi: "Szerzenie nauk Zajda"
 YEM_fervent_zaidism: "Żarliwy zajdyzm"
 YEM_center_of_zaidi_islam: "Ośrodek zajdyzmu"
 desc_YEM_exploit_the_chaos: "Państwo Rasulidów rozpada się pod wpływem wewnętrznych napięć. Nadszedł czas, aby wykorzystać ten chaos dla własnych korzyści."
 desc_YEM_triumph_of_the_tahirids: "Zdobyliśmy najwyższe stanowiska w rządzie Rasulidów, dzięki czemu możemy stać się prawdziwymi władcami Jemenu."
 desc_YEM_fight_for_survival: "Jesteśmy upadającym imperium, które próbuje przetrwać nieuchronny rozpad."
 desc_YEM_to_play_the_cards_right: "Jeśli podejmiemy właściwe decyzje, do końca dekady Jemen może stać się częścią domeny Raszydów."
 desc_YEM_capture_of_taiz: "Kontrola nad stolicą Rasulidów daje innym powód, by szanować nasze panowanie."
 desc_YEM_the_dawah: "Nasza szyicka ludność usłyszała wezwanie i dołącza teraz do naszej świętej wojny."
 desc_YEM_defeated_the_zindiqs: "Podbój heretyków kieruje nasze państwo ku jedności."
 desc_YEM_ashrafiya_mosque: "Nasze inwestycje w meczet Aszrafijja sprawiły, że odwiedza go coraz więcej pielgrzymów."
 desc_YEM_peaceful_investments: "Nasze inwestycje w państwo rozbudziły wśród możnowładców Umera coraz większy entuzjazm dla mecenatu nad sztuką i architekturą."
 desc_YEM_city_of_prosperity: "Aden jest handlową stolicą Jemenu. Dzięki położeniu na wybrzeżu często odwiedzają go kupcy z Indii."
 desc_YEM_seizure_of_aden: "Zdobyliśmy Aden, handlową stolicę Jemenu. Kontrola nad tym miastem z pewnością przyniesie nam znaczne korzyści."
 desc_YEM_tahirid_magnates: "Udało nam się odzyskać wschodnie ziemie, przywracając lojalność Tahirydów i miejscowych rodów kupieckich."
 desc_YEM_caravans_to_mecca: "Wraz ze wzrostem ruchu pielgrzymkowego na pustynnych szlakach coraz częściej pojawiają się również karawany kupieckie."
 desc_YEM_rise_of_yemen: "Ponowne zjednoczenie Jemenu otwiera przed nami nową przyszłość i zapoczątkowuje nową erę Arabii."
 desc_estate_burghers_YEM_coffee_monopoly_mod: "Lokalną produkcję kawy przekazano stanowi [Root.GetBurghersOrFallbackName], przyznając mu monopol na ten surowiec."
 desc_YEM_gates_of_lamentation: "Miejscowy port i fortyfikacje chronią cieśninę Bab al-Mandab."
 desc_YEM_destined_for_spice_trade: "Nasze położenie stwarza doskonałe warunki do wykorzystania handlu przyprawami między Wschodem a Zachodem. Zdobędziemy dzięki temu ogromne bogactwo."
 desc_YEM_guardians_of_the_gates: "Rozbudowa naszej floty pozwoli nam chronić wejście do Morza Czerwonego i zapewnić sobie pełny monopol."
 desc_ARB_arabian_sea_trade: "Jako pośrednicy w handlu na Morzu Arabskim możemy kierować przez nasze porty wiele cennych towarów."
 desc_YEM_developing_sanaa: "Nasze wysiłki na rzecz rozwoju Sany pozwoliły nam pozyskać grupę wykwalifikowanych budowniczych gotowych służyć państwu."
 desc_YEM_reunited_yemen: "Dokonaliśmy niezwykłego wyczynu, jednocząc region Jemenu, który przez długi czas pozostawał podzielony."
 desc_YEM_superiority_of_zaid_and_ali: "Dzięki bezwzględnym kampaniom podbojów zapewniliśmy najwyższą pozycję potomkom Alego i autorytetowi Zajda."
 desc_YEM_global_tax_modifier_upgrade: "Aby sfinansować naszą działalność dobroczynną, zaczęliśmy nakładać większe podatki na instytucje duchowne."
 desc_YEM_extra_buff_to_churches: "Przejęliśmy niewykorzystywane dobra kościelne w prowincji, rozgniewując miejscowe duchowieństwo, lecz umożliwiając bardziej efektywny rozwój tych ziem."
 desc_YEM_rise_of_the_zaidi: "Rozwój naszego państwa okazuje się nie do powstrzymania i napędza kolejne podboje przeciwko wyznawcom innych religii."
 desc_YEM_fervent_zaidism: "Nasi wojownicy z żarliwością szerzą naszą wiarę mieczem."
 desc_YEM_center_of_zaidi_islam: "Sana zyskała szczególny status w zajdyzmie, przyciągając nielicznych zajdytów spoza Jemenu, którzy osiedlają się w mieście."
