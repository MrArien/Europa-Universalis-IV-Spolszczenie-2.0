 MEE_Byzantine_Events.31.t: "Twierdza Rumeli Hisarı"
 MEE_Byzantine_Events.31.d: "Nasze ambicje są jasne — Konstantynopol musi zostać zdobyty! Aby zapewnić powodzenie tego przedsięwzięcia, zbudujmy twierdzę po europejskiej stronie Bosforu, na północ od Konstantynopola i naprzeciwko położonej po drugiej stronie cieśniny twierdzy Anadolu Hisarı. Dzięki obu tym zamkom będziemy mogli kontrolować ruch okrętów w wąskiej cieśninie, znacznie ograniczając bizantyjskie wsparcie morskie, a zarazem pobierać opłaty za przepływ. Twierdza otrzyma nazwę Rumeli Hisarı. Nazywana jest również «Boğazkesen», czyli «Podcinająca gardło cieśninie»."
 MEE_Byzantine_Events.31.a: "Zbudujmy twierdzę!"
 MEE_Byzantine_Events.31.b: "Nie potrzebujemy jej."
 MEE_Byzantine_Events.32.t: "Ukończono budowę twierdzy Rumeli Hisarı"
 MEE_Byzantine_Events.32.d: "Budowa twierdzy Rumeli Hisarı dobiegła końca. Opłaty za przepływ przez Bosfor są już pobierane, a władcy Konstantynopola otrzymali jasny sygnał."
 MEE_Byzantine_Events.32.a: "Strzeżcie się, Rzymianie! Wasz koniec jest bliski."
 MEE_Byzantine_Events.33.t: "Twierdza Rumeli Hisarı"
 MEE_Byzantine_Events.33.d: "Do [Root.Monarch.GetName] dotarła wiadomość, że państwo [From.GetAdjective] rozpoczęło budowę nowej twierdzy po naszej stronie Bosforu, niedaleko Konstantynopola. [Root.Monarch.GetName] wysłał już do [From.Monarch.GetName] list protestacyjny, lecz bezskutecznie. Dziś informacja dotarła do opinii publicznej i wywołała powszechną panikę, ponieważ stało się oczywiste, że Osmanowie zamierzają zdobyć miasto."
 MEE_Byzantine_Events.33.a: "Czy to kara boska?"
 MEE_Byzantine_Events.34.t: "Osmanowie przestają płacić trybut"
 MEE_Byzantine_Events.34.d: "Orhan Çelebi jest krewnym osmańskiego monarchy i obecnie przebywa w prowincji [151.GetName]. Zgodnie z wcześniejszym porozumieniem sułtan płacił trybut w zamian za bezpieczne przetrzymywanie pretendenta do tronu w tej prowincji. Ostatnio jednak wpłaty ustały, co wywołało niepokojącą dyskusję: czy zażądać zaległej zapłaty, czy też nie zaostrzać sytuacji."
 MEE_Byzantine_Events.34.a: "Przypomnijmy im o ich zobowiązaniach."
 MEE_Byzantine_Events.34.b: "Nie możemy ryzykować zaostrzenia napięć."
 MEE_Byzantine_Events.35.t: "Bizantyjczycy żądają trybutu za Orhana Çelebiego"
 MEE_Byzantine_Events.35.d: "Bizantyjczycy zauważyli, że nie chcemy już płacić trybutu za Orhana Çelebiego, osmańskiego pretendenta do tronu przetrzymywanego w prowincji [151.GetName]. Nie damy się zastraszyć! Wojna domowa w niewłaściwym momencie mogłaby jednak przynieść katastrofalne skutki."
 MEE_Byzantine_Events.35.a: "Niech spróbują."
 MEE_Byzantine_Events.35.b: "Dobrze, zapłaćmy im."
 MEE_Byzantine_Events.36.t: "Odmowa Osmanów"
 MEE_Byzantine_Events.36.d: "Nikczemny sułtan osmański odrzucił nasze żądania, wywołując gniew i panikę na dworze [Root.Monarch.GetTitle]. Wielu opowiada się za wsparciem Orhana jako pretendenta do osmańskiego tronu — taktyką, którą Osmanowie i Bizantyjczycy stosowali przeciwko sobie w przeszłości, doprowadzając do gwałtownych wojen domowych w Bizancjum."
 MEE_Byzantine_Events.36.a: "Niech zakosztują własnej trucizny!"
 MEE_Byzantine_Events.36.b: "Być może popełniliśmy błąd."
 MEE_Byzantine_Events.37.t: "Świta Orhana"
 MEE_Byzantine_Events.37.d: "Orhan Çelebi wraz ze swoją świtą, złożoną z wielu tureckich dezerterów, chwycił za broń i jest gotów walczyć przeciwko [TUR.Monarch.GetName]."
 MEE_Byzantine_Events.37.a: "Wzmocnią naszą obronę."
 MEE_Byzantine_Events.37.b: "Potrzebujemy ich w naszej armii!"
 MEE_Byzantine_Events.38.t: "Konstantynopol wyrasta poza mury"
 MEE_Byzantine_Events.38.d: "Wielowiekowe wyczerpanie, wyludnienie i liczne katastrofy doprowadziły do tak znacznego zmniejszenia Konstantynopola, że wewnątrz murów znalazło się wiele gruntów rolnych. Na szczęście trend ten został odwrócony i miasto ponownie rozrosło się poza dawne umocnienia, zwiększając liczbę mieszkańców."
 MEE_Byzantine_Events.38.a: "Wspaniała wiadomość!"
 MEE_Byzantine_Events.39.t: "Wyprawa do Tesalii"
 MEE_Byzantine_Events.39.d: "Konstantyn, jeden z despotów Morei, postanowił połączyć siły ze wsparciem Zachodu i wystąpić przeciwko Osmanom w Tesalii. Wyprawa ostatecznie zakończyła się niepowodzeniem, lecz zapewniła Konstantynowi bezcenne doświadczenie wojenne i podniosła morale jego wojsk."
 MEE_Byzantine_Events.39.a: "Wesprzyjmy tę wyprawę!"
 MEE_Byzantine_Events.39.b: "Niech sam poprowadzi kampanię."
 MEE_Byzantine_Events.40.t: "Wyprawa karna"
 MEE_Byzantine_Events.40.d: "W 1444 roku Konstantyn, jeden z despotów Morei, przeprowadził przeciwko nam wyprawę do Tesalii. Choć udało nam się już powstrzymać jego natarcie, ta agresja jest niedopuszczalna. Wielu domaga się zdecydowanej reakcji i wysłania pełnowymiarowej wyprawy karnej."
 MEE_Byzantine_Events.40.a: "Wyślijmy wyprawę karną."
 MEE_Byzantine_Events.40.b: "Ich marna armia nie stanowi zagrożenia."
 MEE_Byzantine_Events.41.t: "Bizantyjscy kupcy unikają podatków"
 MEE_Byzantine_Events.41.d: "Sfrustrowani koniecznością płacenia pełnego kommerkionu, czyli dziesięcioprocentowego cła pobieranego w Konstantynopolu, liczni bizantyjscy kupcy zastosowali sprytny wybieg: korzystają z pomocy kupców łacińskich, którzy są zwolnieni z tego podatku. W ten sposób unikają opłat i poważnie uszczuplają nasze dochody. Bizantyjscy handlarze regularnie skarżą się na niesprawiedliwe traktowanie i brak ochrony rodzimego handlu."
 MEE_Byzantine_Events.41.a: "Połóżmy kres tej praktyce!"
 MEE_Byzantine_Events.41.b: "Przyznajmy im takie same zwolnienia podatkowe."
 MEE_Byzantine_Events.41.c: "Nałóżmy kommerkion również na zagranicznych kupców."
 MEE_Byzantine_Events.42.t: "Demetriusz wysuwa pretensje do tronu"
 MEE_Byzantine_Events.42.d: "Demetriusz, brat i pretendent do rzymskiego tronu, próbował przejąć władzę dla siebie. Na szczęście udało się uniknąć wojny domowej dzięki interwencji wdowy po zmarłym cesarzu. Mimo to ambicje Demetriusza nadal będą rzucać cień na panowanie [Root.Monarch.GetName]."
 MEE_Byzantine_Events.42.a: "Kryzys został zażegnany w ostatniej chwili."
 MEE_Byzantine_Events.43.t: "Osmańskie wojska przeciągają okręty lądem"
 MEE_Byzantine_Events.43.d: "Aby ominąć łańcuch blokujący wejście do Złotego Rogu, wojska osmańskie postanowiły przeciągnąć swoje okręty przez ląd. Wykorzystując natłuszczone bale, przetransportowały statki w sposób podobny do tego, jaki Rusini stosowali kilka stuleci wcześniej. Znacznie osłabi to morskie możliwości obronne Konstantynopola."
 MEE_Byzantine_Events.43.a: "Złoty Róg jest odsłonięty!"
 MEE_Byzantine_Events.44.t: "Mury Konstantynopola"
 MEE_Byzantine_Events.44.d: "Powszechnie uważa się, że potężne Mury Teodozjusza są w stanie odeprzeć każdy atak. Być może to prawda, lecz nie wytrzymają ogromnych kul armatnich wystrzeliwanych z dział zbudowanych przy pomocy Urbana."
 MEE_Byzantine_Events.44.a: "Nikt nie oprze się naszym działom!"
 MEE_Byzantine_Events.45.t: "Upadek Konstantynopola"
 MEE_Byzantine_Events.45.d: "Miasto, którego pragnie cały świat, wreszcie upadło i znalazło się pod naszą pełną kontrolą. Mimo to Paleologowie nadal stawiają opór w Morei, swoim drugim władztwie. Ponieważ rządzą nim chciwi i zazdrośni bracia, możemy spróbować złamać ich wolę za pomocą obietnic i zwykłego zastraszenia."
 MEE_Byzantine_Events.45.a: "Zniszczymy wszystkie pozostałości Bizancjum."
 MEE_Byzantine_Events.45.b: "Zażądajmy kapitulacji despotów!"
 MEE_Byzantine_Events.46.t: "Osmanowie ruszają na Moreę"
 MEE_Byzantine_Events.46.d: "Sułtan osmański [From.Monarch.GetName] złożył braciom Paleologom propozycję. Jeśli zaprzestaną oporu, będą mogli zachować władzę, choć jako wasale."
 MEE_Byzantine_Events.46.a: "Wywieśmy białą flagę."
 MEE_Byzantine_Events.46.b: "Będziemy walczyć!"
 MEE_Byzantine_Events.47.t: "Bunt przeciwników unii"
 MEE_Byzantine_Events.47.d: "Ludność prowincji [byz_revolt.GetName] chwyciła za broń. Od ogłoszenia unii Kościołów w prowincji nieustannie narastały niepokoje. Mieszkańcy są głęboko oburzeni i sprzeciwią się każdej próbie uznania zwierzchnictwa papieża. Wielu zaczęło głosić, że woleliby ujrzeć turecki turban powiewający nad Konstantynopolem, niż podporządkować się Łacinnikom."
 MEE_Byzantine_Events.47.a: "Nie mają przecież wyboru!"
 MEE_Byzantine_Events.48.t: "Zakończenie schizmy"
 MEE_Byzantine_Events.48.d: "Od rozłamu Kościołów wschodniego i zachodniego w 1054 roku wydawało się, że jedność jest niemożliwa i nie nastąpi przez kolejne stulecia. W XV wieku doszło niemal do ponownego zjednoczenia obu Kościołów, do czego przyczyniła się rozpaczliwa sytuacja Cesarstwa Rzymskiego. Imperium zdołało jednak odzyskać dawną pozycję i zrzucić jarzmo wpływów papieskich. Dziś stoi triumfalnie, odbudowawszy pentarchię i skutecznie jednocząc oba Kościoły dzięki przekonaniu opinii publicznej do tego rozwiązania."
 MEE_Byzantine_Events.48.a: "Wspaniale."
 MEE_Byzantine_Events.49.t: "Nadciągająca katastrofa"
 MEE_Byzantine_Events.49.d: "Do [Root.Monarch.GetName] i mieszkańców Konstantynopola dotarła wiadomość, że [TUR.GetAdjective] [TUR.Monarch.GetTitle] [TUR.Monarch.GetName] rozpoczął marsz na miasto na czele armii wspieranej przez janczarów. Mieszkańcy metropolii byli już przygotowani na taki obrót spraw. Wielu z nich, nawet najubożsi, zaczęło żarliwie modlić się do Boga o ocalenie miasta. Ze wszystkich kościołów wyruszają procesje błagające o boską interwencję."
 MEE_Byzantine_Events.49.a: "Odprawmy mszę w Hagia Sophia."
 MEE_Byzantine_Events.49.b: "Wezwijmy obrońców na mury!"
 MEE_Byzantine_Events.49.c: "Stawmy czoła wrogowi w otwartym polu."
 MEE_Byzantine_Events.50.t: "Giovanni Giustiniani"
 MEE_Byzantine_Events.50.d: "Giovanni Giustiniani dowodził genueńskim garnizonem, który w 1453 roku przyszedł z pomocą Bizantyjczykom w ich najczarniejszej godzinie. Jego umiejętności wojskowe oraz wsparcie setek żołnierzy, którzy przybyli wraz z nim, będą miały kluczowe znaczenie dla obrony miasta."
 MEE_Byzantine_Events.50.a: "Bogu niech będą dzięki!"
 MEE_Byzantine_Events.51.t: "Potwierdzenie unii florenckiej"
 MEE_Byzantine_Events.51.d: "W 1439 roku Ioannes udał się do Florencji wraz z licznymi prawosławnymi uczonymi duchownymi, aby omówić z papieżem kwestie zakończenia schizmy. Pod rosnącą presją monarchy, zdecydowanego zdobyć poparcie papieża i jego poddanych, Bizantyjczycy zgodzili się formalnie zjednoczyć oba Kościoły i uznać zwierzchnictwo papieża. Ten krok, choć pozornie konieczny, doprowadził do wzrostu znaczenia frakcji przeciwników unii w Konstantynopolu i wywołał poważne niepokoje w ostatnich dniach istnienia miasta."
 MEE_Byzantine_Events.51.a: "Pozostańmy wierni naszym decyzjom."
 MEE_Byzantine_Events.51.b: "Odrzućmy unię!"
 MEE_Byzantine_Events.52.t: "Papież zaostrza stanowisko"
 MEE_Byzantine_Events.52.d: "W obliczu zbliżającej się katastrofy nadeszło pismo od papieża [PAP.Monarch.GetName], który oskarża [Root.Monarch.GetName] o nieszczerość złożonych obietnic i niewystarczające działania. Żąda, aby [Root.Monarch.GetTitle] z państwa [Root.GetAdjective] przyjął bardziej zdecydowane stanowisko w sprawie unii Kościołów. Dopiero wtedy wezwie wspólnotę katolicką do wsparcia nas w wojnie."
 MEE_Byzantine_Events.52.a: "Złóżmy puste deklaracje, by go udobruchać."
 MEE_Byzantine_Events.52.b: "Taka jest cena, którą musimy zapłacić."
 MEE_Byzantine_Events.53.t: "Jedność z patriarchatem"
 MEE_Byzantine_Events.53.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.GetName] w końcu ustąpił, w pełni uznając zwierzchnictwo papieża i obiecując szybką konwersję swojej ludności. Gwarancją porozumienia stało się powołanie kilku katolickich ministrów do administracji oraz mianowanie kardynała Izydora patriarchą Konstantynopola."
 MEE_Byzantine_Events.53.a: "Nareszcie!"
 MEE_Byzantine_Events.54.t: "Wezwanie do krucjaty!"
 MEE_Byzantine_Events.54.d: "Ponieważ obiecano Rzymianom wsparcie w potrzebie, wielu oczekuje, że Ojciec Święty ogłosi nową krucjatę przeciwko Osmanom. Choć poparcie może wydawać się powszechne, nie brakuje przeciwników takiego wezwania, którzy wskazują na niedawną klęskę pod Warną, podkopującą morale znacznej części chrześcijańskiego świata."
 MEE_Byzantine_Events.54.a: "Nie przejmujmy się klęską pod Warną!"
 MEE_Byzantine_Events.54.b: "Nie możemy pomóc Rzymianom."
 MEE_Byzantine_Events.55.t: "W obronie Konstantynopola"
 MEE_Byzantine_Events.55.d: "Ojciec Święty wezwał nas do krucjaty przeciwko Osmanom, pragnąc ocalić ostatnią pozostałość Cesarstwa Rzymskiego przed zagładą. Choć klęska pod Warną poważnie osłabiła nasze siły, jeśli nie odpowiemy na wezwanie, Osmanowie mogą urosnąć w potęgę, której nie zdołamy już powstrzymać."
 MEE_Byzantine_Events.55.a: "Odpowiemy na papieskie wezwanie."
 MEE_Byzantine_Events.55.b: "Osmanowie są obecnie zbyt potężni."
 MEE_Byzantine_Events.56.t: "Nadanie pronoii"
 MEE_Byzantine_Events.56.d: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] postanowił nadać jednemu ze swoich generałów ziemię w ramach pronoii. Nadania pronoii przyznawane są przede wszystkim jako wyraz wdzięczności za służbę wojskową, a pronoiar ma obowiązek uczestniczyć w kampaniach prowadzonych przez [Root.Monarch.GetTitle]."
 MEE_Byzantine_Events.56.a: "Rozumiem."
 MEE_Byzantine_Events.57.t: "Wsparcie Zachodu"
 MEE_Byzantine_Events.57.d: "Kilka okrętów naszych sojuszników zdołało przemknąć przez blokadę [TUR.GetAdjective], przewożąc broń, żołnierzy i pomoc finansową dla naszego wyniszczonego wojną imperium. Miejmy nadzieję, że ich wsparcie nie pójdzie na marne."
 MEE_Byzantine_Events.57.a: "Unia przynosi korzyści!"
 flavor_byz.1.b: "Oszczędź miasto. Zamiast tego przejmij arsenał!"
 griko: "Griko"
 BYZ_justinians_empire_decision_title: "Cesarstwo Justyniana"
 BYZ_justinians_empire_decision_desc: "Przywrócenie granic imperium do zasięgu osiągniętego za Justyniana przyniosłoby nam ogromny prestiż i zapowiadałoby wspaniałą przyszłość. Dążmy do tego celu."
 BYZ_build_hexamilion_wall_decision_title: "Odbuduj mur Heksamilionu"
 BYZ_build_hexamilion_wall_decision_desc: "Mury chroniące Moreę zostały zniszczone przez Osmanów. Naprawmy to."
 BYZ_build_theodosian_wall_decision_title: "Napraw Mury Teodozjusza"
 BYZ_build_theodosian_wall_decision_desc: "Potężne Mury Teodozjusza popadły w ruinę. Jeśli Konstantynopol ma przetrwać, nie możemy na to pozwolić. Musimy je naprawić."
 BYZ_bosphorus_toll_decision_title: "Rozszerz system ceł na Bosforze"
 BYZ_bosphorus_toll_decision_desc: "Usprawnijmy pobór opłat na Bosforze. Możemy ulepszyć zarówno zasady pobierania ceł, jak i sposób ich egzekwowania."
 preview_missions_decision_title: "Podgląd misji rozgałęziających się"
 preview_missions_decision_desc: "Możemy wybrać jedną z kilku ścieżek pobocznych drzewa misji. Dokonajmy rozważnego wyboru."
 preview_missions_decision_ct: "Posiada co najmniej jedną §Ymisję rozgałęziającą się§!, której można użyć do podglądu."
 BYZ_revoke_deteriorating_army_title: "Napraw armię"
 BYZ_revoke_deteriorating_army_desc: "Armia bizantyjska podupada nieprzerwanie od stuleci. Dysponujemy niewielkimi zasobami ludzkimi, a musimy stawić opór osmańskiej inwazji i przywrócić wojsku dawną chwałę."
 BYZ_revoke_exkousseiai_title: "Zakończ faworyzowanie Łacinników"
 BYZ_revoke_exkousseiai_desc: "Dzięki sprytnym praktykom kupcy łacińscy zapewnili sobie liczne przywileje kosztem naszych rodzimych handlarzy. Połóżmy temu kres."
 BYZ_at_least_7_trade_income_tt: "Co najmniej §Y7,0§!¤ miesięcznego dochodu z §Yhandlu§!."
 BYZ_revoke_union_of_the_churches_title: "Zakończ unię Kościołów"
 BYZ_revoke_union_of_the_churches_desc: "Po soborze we Florencji formalnie zawarliśmy unię z Kościołem katolickim. Decyzja ta, podjęta wyłącznie w celu zdobycia poparcia, wywołała ogromne niezadowolenie mieszkańców Konstantynopola."
 BYZ_integrate_galata_title: "Zintegruj Galatę"
 BYZ_integrate_galata_desc: "Galata to genueńska kolonia założona na północ od Złotego Rogu. Powstała na mocy traktatu w Nimfajon w 1261 roku, lecz dawno straciła rację bytu. Genueńczyków należy stamtąd wypędzić."
 BYZ_mosaicists_decision_title: "Eksportuj bizantyjskich mozaikarzy"
 BYZ_mosaicists_decision_desc: "Dysponujemy utalentowanymi rzemieślnikami, których sława wykracza daleko poza granice naszego państwa. Ich umiejętności są cennym zasobem, który możemy wykorzystać."
 BYZ_ecumenical_decision_title: "Zwołaj sobór ekumeniczny"
 BYZ_ecumenical_decision_desc: "Aby wzmocnić jedność chrześcijaństwa wschodniego, powinniśmy wezwać patriarchów i wszystkich biskupów do wspólnego omówienia spraw wiary."
 BYZ_become_orthodox_again_title: "Powrót do prawosławia"
 BYZ_become_orthodox_again_desc: "Zdradziliśmy wschodni obrządek chrześcijaństwa, szukając poparcia Zachodu. Choć wielu popiera nasze decyzje, nie brakuje głosów wzywających do powrotu do dawnej wiary i przeciwstawienia się papieżowi."
 merc_byz_turkish_janissaries: "§JTureccy janczarzy§!"
 merc_byz_varangian_guard: "§JGwardia wareska§!"
 merc_byz_palace_guard: "Gwardia pałacowa"
 FREE_OF_FORCELIMIT_COST: "Utrzymanie tej kompanii najemniczej nie wymaga wolnego limitu sił zbrojnych."
 BYZ_eastern_roman_empire: "Cesarstwo Wschodniorzymskie"
 BYZ_eastern_roman_empire_ADJ: "Rzymski"
 estate_emporoi: "Emporoi"
 estate_klirikoi: "Klirikoi"
 estate_eugeneis: "Eugeneis"
 estate_nobles_deteriorating_army: "Rozprzężenie armii"
 estate_nobles_deteriorating_army_desc: "Wyludnienie, korupcja, decentralizacja i nieustanne intrygi dworskie doprowadziły do głębokiego upadku urzędu stratega, a wraz z nim całej armii. Nasze wojsko, jeśli w ogóle można je tak nazwać, jest zdolne jedynie do obrony stolicy i nie ma możliwości prowadzenia działań ofensywnych."
 estate_church_union_of_the_churches: "Unia Kościołów"
 estate_church_union_of_the_churches_desc: "Działania Ioannesa VIII podjęte na soborze we Florencji wyznaczyły nową przyszłość Kościoła prawosławnego. Jeśli sytuacja będzie się rozwijać w tym kierunku, schizma może wkrótce zostać zakończona, ku niezadowoleniu prawosławnych wiernych."
 estate_burghers_reliance_on_republics: "Uzależnienie od republik"
 estate_burghers_reliance_on_republics_desc: "Po utracie naszych portów i pokładaniu coraz większych nadziei we wsparciu republik kupieckich zadanie pozyskiwania okrętów powierzono zagranicznym handlarzom. Jeśli odwrócą się od nas, nasza flota pozostanie bezbronna."
 estate_burghers_exkousseiai_for_latins: "Zwolnienia podatkowe dla kupców łacińskich"
 estate_burghers_exkousseiai_for_latins_desc: "Dzięki odpowiednim zabiegom kupcy łacińscy uzyskali zwolnienie z podatku kommerkion. Musimy je znieść, ponieważ uszczupla ono skarbiec i podważa zaufanie naszych rodzimych handlarzy."
 estate_church_BYZ_legitimization_of_dynasty: "Legitymizacja dynastii"
 estate_church_BYZ_legitimization_of_dynasty_desc: "Wprowadźmy politykę wzajemnego wspierania się patriarchy i monarchy, wzmacniając w ten sposób obie strony."
 estate_burghers_BYZ_single_market: "Promowanie wspólnego rynku"
 estate_burghers_BYZ_single_market_desc: "Czas prowadzić politykę protekcjonizmu, dobrze znaną dawnym bizantyjskim kupcom. Dzięki centralizacji handlu w Konstantynopolu uczynimy ze stolicy wielki port przeładunkowy, w którym każdy będzie mógł kupić wszystko."
 reform_the_pronoiars_reform: "Zreformuj system pronoii"
 reform_the_pronoiars_reform_desc: "System pronoii stopniowo przekształcił się w system stałych, dziedzicznych nadań ziemskich. W połączeniu z utratą ziem w stuleciach poprzedzających krucjatę pod Warną sprawiło to, że zasób ziem możliwych do nadania w ramach pronoii stale się kurczy. Musimy zreformować ten system."
 pronoiar_monarchy_reform: "Monarchia pronoiarska"
 pronoiar_monarchy_reform_desc: "Autokratyczna forma rządów, w której monarcha jest zależny od poparcia pronoiarów — osób otrzymujących tymczasowe lub dziedziczne nadania ziemskie, najczęściej w zamian za służbę wojskową."
 restoration_of_the_senate_reform: "Przywróć senat"
 restoration_of_the_senate_reform_desc: "Instytucja senatu rzymskiego przetrwała podział imperium i funkcjonowała jeszcze przez wiele dziesięcioleci. Jednak wskutek polityki centralizacji i prób odebrania senatowi władzy przestała istnieć jako pełnoprawna instytucja. W epoce rozkwitu myśli politycznej jej przywrócenie może być postrzegane jako krok naprzód."
 laesio_enormis_reform: "Laesio Enormis"
 laesio_enormis_reform_desc: "Laesio enormis to zasada, zgodnie z którą strona poszkodowana może odstąpić od umowy, jeśli zostanie ona prawnie uznana za nieuczciwą. Idea sprawiedliwości naprawczej zyskała szczególną popularność w Cesarstwie Bizantyjskim na przełomie tysiącleci, gdy ubodzy sprzedawali możnowładcom ziemię za rażąco niską cenę."
 restore_the_master_of_offices_reform: "Przywróć urząd magistra officiorum"
 restore_the_master_of_offices_reform_desc: "Magister officiorum był niegdyś jednym z najważniejszych urzędów administracji cywilnej Cesarstwa Bizantyjskiego. Zakres jego obowiązków zmieniał się na przestrzeni wieków, lecz zazwyczaj obejmował szeroki wachlarz zadań. Podobnie jak wiele dawnych urzędów, z czasem stracił na znaczeniu i został przekształcony w prostszy, choć nadal istotny urząd magistra."
 mechanic_enables_statesman_autonomy_reduction_yes: "Doradca typu §YMąż stanu§! będzie teraz zapewniał dodatkowo §G-0,01§! miesięcznej redukcji autonomii za każdy poziom."
 theme_system_reform: "System temów"
 theme_system_reform_desc: "Temy były bizantyjskim systemem podziału prowincjonalnego opartym na strukturach wojskowych. Ścisłe powiązanie administracji cywilnej z wojskiem zapewniało właściwą obronę obszarom przygranicznym i zwiększało możliwości militarne państwa."
 mechanic_BYZ_buff_dynatoi_land_grants_yes: "Wzmocnij przywilej stanowy «§YPrawa ziemskie eugenów§!», znosząc koszt w postaci §Ymaksymalnego absolutyzmu§! i zapewniając §G+10,0%§! modyfikatora limitu sił lądowych."
 mechanic_enables_pronoias_yes: "Można ustanowić §Yparanoię wasali§!"
 num_of_pronoiars: "Liczba pronoiarów"
 pronoia_base_modifiers: "Państwo zależne typu pronoia"
 pronoia_base_overlord_modifiers: "Państwo zależne typu pronoia"
 BYZ_not_enough_free_pronoia_slots: "§R- Brak wystarczającej liczby §Ymiejsc dla pronoiarów§!.§!"
 BYZ_too_much_liberty_desire: "§R- Dążenie do wolności państwa §Y[From.GetName]§! przekracza §Y15§!.§!"
 hereditary_pronoia_subject_type: "Dziedziczny pronoiar"
 hereditary_pronoia_subject_type_long_desc: "Pronoiar reprezentuje relację pronoia między strategiem a cesarzem. Ziemia jest nadawana strategowi dziedzicznie, a w zamian oczekuje się od niego wystawiania wojsk wspierających cesarza podczas wojen. Dziedzicznego pronoiara można przekształcić w zwykłego pronoiara, który zostanie zaanektowany po śmierci swojego władcy."
 hereditary_pronoia_subject_type_is_our: "$NAME|Y$ jest naszym dziedzicznym pronoiarem."
 hereditary_pronoia_subject_type_title: "Dziedziczny pronoiar"
 hereditary_pronoia_subject_type_title_plural: "Dziedziczni pronoiarowie"
 is_hereditary_pronoia_subject_type: "Jest dziedzicznym pronoiarem"
 pronoia_subject_type: "Pronoiar"
 pronoia_subject_type_long_desc: "Pronoiar reprezentuje relację pronoia między strategiem a cesarzem. Ziemia jest nadawana strategowi dziedzicznie, a w zamian oczekuje się od niego wystawiania wojsk wspierających cesarza podczas wojen. Dziedzicznego pronoiara można przekształcić w zwykłego pronoiara, który zostanie zaanektowany po śmierci swojego władcy."
 pronoia_subject_type_is_our: "$NAME|Y$ jest naszym pronoiarzem."
 pronoia_subject_type_title: "Pronoiar"
 pronoia_subject_type_title_plural: "Pronoiarowie"
 is_pronoia_subject_type: "Jest pronoiarzem"
 create_pronoia: "Nadaj pronoię"
 create_pronoia_title: "Nadaj pronoię"
 create_pronoia_desc: "Czy na pewno chcesz nadać pronoię w prowincji §Y[From.GetName]§!?[Root.GetPronoiaInheritanceLaw]\n\n§YPronoiarowie§! to unikalny typ państwa zależnego dostępny dla państw §Y[BYZ.GetName]§! i §Y[ROM.GetName]§!.\n\nPaństwo może posiadać tylko ograniczoną liczbę §Ypronoiarów§!, określaną przez modyfikator §YLiczba pronoiarów§!. Można ją zwiększać za pomocą §Ygrup idei§!, §Yreform rządowych§! oraz za każde §Y100§! punktów limitu sił lądowych. Oznacza to również, że §Ypronoiarowie§! nie zajmują §Ystosunków dyplomatycznych§!.\nPronoiarowie to typ państw zależnych wspierających wysiłek wojenny suwerena. Domyślnie każdy pronoiar zmniejsza limit sił lądowych suwerena o §R-5§!, zapewniając mu jednocześnie §G+10,0%§! limitu sił zbrojnych oraz §G+20,0%§! zasobów ludzkich i marynarzy. Ponadto pronoiarowie otrzymują następujące modyfikatory:\n§G-50,0%§! kosztu regimentów\n§G+5000§! przyrostu zasobów ludzkich\n§G+50,0%§! krajowego modyfikatora zasobów ludzkich\n§R+50,0%§! kosztu tworzenia rdzeni\n§R-20,0%§! efektywności administracyjnej\n\n[Root.GetProniaAdvancedTooltip]"
 extra_text_hereditary_proniar: "Aby zaanektować §Ydziedzicznego pronoiara§!, należy najpierw przekształcić go w zwykłego §Ypronoiara§! za pomocą działania dyplomatycznego «§YCofnij prawo do dziedziczenia§!». Zwykły §Ypronoiar§! zostanie włączony do państwa suwerena po śmierci swojego monarchy."
 extra_text_proniar: "Pronoiar zostanie włączony do naszego państwa po śmierci swojego monarchy."
 create_pronoia_non_inherently: "Nie będziesz mógł odziedziczyć tego terytorium, dopóki nie użyjesz działania dyplomatycznego «§YCofnij prawo do dziedziczenia§!»."
 create_pronoia_tooltip: "Przekażemy władzę nad państwem zależnym pronoiarowi, który odtąd będzie zarządzał tym terytorium dziedzicznie.\nPronoiarowie to państwa zależne, które nie zajmują §Ystosunku dyplomatycznego§! i zasilają pulę zasobów ludzkich oraz marynarzy swojego suwerena. Pronoiarowie są dziedziczeni, zamiast być anektowani."
 release_pronia: "Uwolnij pronoiara"
 release_pronia_title: "Uwolnij pronoiara"
 release_pronia_desc: "Czy chcesz uwolnić pronoiara z prowincji §Y[From.GetName]§!?\nBędzie nas to kosztować §R25,00§! prestiżu.\n[From.GetLoyaltyHitTooltip]Utracimy również wszystkie rdzenie i roszczenia do jego prowincji."
 loyalty_opinion_hit: "Ponieważ są lojalni, ich opinia o nas spadnie o §R200§!.\n"
 release_pronia_tooltip: "Zakończ nasze relacje z pronoiarzem i zwolnij jego ziemie z wszelkich zobowiązań wobec nas."
 make_pronoia_inheritable: "Cofnij prawo do dziedziczenia"
 make_pronoia_inheritable_title: "Cofnij prawo do dziedziczenia"
 make_pronoia_inheritable_desc: "Czy na pewno chcesz ograniczyć prawa dziedziczenia w państwie [From.GetName]? Znacznie rozgniewa to danego pronoiara, ale pozwoli ci odziedziczyć jego państwo."
 make_pronoia_inheritable_tooltip: "Pronoiar w państwie [From.GetName] nie będzie już mógł przekazywać swoich ziem spadkobiercom. Spowoduje to gwałtowny wzrost dążenia do wolności, ale po śmierci władcy ziemie te powrócą do nas."
 BYZ_megalopolis_updater: ""
 desc_BYZ_megalopolis_updater: ""
 ARB_restore_cradle_of_gold_title: "Wznów pracę Kolebki Złota"
 ARB_restore_cradle_of_gold_desc: "Nie tak daleko od miasta Medyna znajduje się starożytna kopalnia złota, zwana Kolebką Złota. Chociaż w większości wyczerpana, możemy spróbować wznowić jej pracę w nadziei na znalezienie większej ilości złota."
 ARB_close_the_cradle_of_gold_title: "Zamknij Kolebkę Złota"
 ARB_close_the_cradle_of_gold_desc: "Kopalnia złota przestała być dla nas użyteczna. Nadszedł czas, aby ponownie skupić się na produkcji tkanin w tej prowincji."
 ARB_close_the_cradle_of_gold_tt: "§RNie będziemy w stanie ponownie produkować  §Yzłota§! w tej prowincji.§!"
 ARB_assemble_a_shura_title: "Powołaj szurę"
 ARB_assemble_a_shura_desc: "Żaden monarcha nie rządzi samotnie. Weźmy przykład z Koranu i zasięgnijmy rady, pytając mieszkańców oraz członków naszego dworu, co należy uczynić w sprawie państwa [Root.Country.GetName]."
 ARB_jerusalem_title: "Bajt al-Makdis"
 ARB_jerusalem_desc: "Podbój Ursalim jest niezbędnym krokiem na drodze do odrodzenia kalifatu. Miasto zostało zdobyte przez wojska kalifatu prawowiernych w 637 roku i od tamtej pory ma burzliwą historię, stając się celem licznych krucjat niewiernych. Dziś ponownie znajduje się w rękach muzułmanów, lecz władają nim Mamelucy, którzy często zawierają układy z chrześcijańskimi kupcami."
 ARB_mamluks_title: "Obal Mameluków"
 ARB_mamluks_desc: "Zdradzieckie państwo Mameluków, potężne egipskie królestwo rządzone przez mameluków czerkieskich, nieustannie wkracza na nasze arabskie ziemie, próbując utrzymać kontrolę nad Świętymi Miastami. Zadajmy ich armiom decydujący cios i wypędźmy ich również z Egiptu."
 ARB_custodians_of_the_holy_cities_title: "Opiekunowie Świętych Miast"
 ARB_custodians_of_the_holy_cities_desc: "Jako władcy świętych miast Mekki i Medyny mamy święty obowiązek wyznaczyć właściwych zarządców i zrobić wszystko, co w naszej mocy, aby ulice tych miast tętniły życiem, a miejsca święte były bezpieczne. Żaden muzułmanin przybywający tu z pielgrzymką nie powinien mieć powodów do obaw."
 ARB_safeguard_pilgrim_routes_title: "Zabezpiecz szlaki pielgrzymkowe"
 ARB_safeguard_pilgrim_routes_desc: "Każdego roku tysiące muzułmanów wyruszają do Mekki, aby wypełnić obowiązek hadżdżu. Naszym zadaniem jest chronić ich przed wszelkim niebezpieczeństwem. Niech spotka nas kara, jeśli nie wywiążemy się z tego obowiązku."
 ARB_spirit_of_hajj_title: "Duch hadżdżu"
 ARB_spirit_of_hajj_desc: "Nasza pozycja jako opiekunów Świętych Miast i odważnych obrońców pielgrzymów zapewniła nam dobrą reputację w dar al-Islam. Kontynuujmy rozwój miejsc świętych i zagwarantujmy pokój w naszej części świata."
 ARB_traditional_interpretation_title: "Tradycyjna interpretacja"
 ARB_traditional_interpretation_desc: "W państwach położonych w samym sercu islamu wielu uczonych pielęgnuje bardziej tradycyjne podejście do religii. Koncentrują się na Koranie i hadisach, odrzucają praktyki bractw sufickich i w niewielkim stopniu uwzględniają orzeczenia islamskich prawników."
 ARB_protectors_of_the_holy_cities_title: "Obrońcy Świętych Miast"
 ARB_protectors_of_the_holy_cities_desc: "Święte miasta islamu znajdują się pod władzą słabych i zdegenerowanych dynastii. Musimy wysunąć do nich roszczenia i przejąć nad nimi kontrolę."
 ARB_conquer_al_sham_title: "Podbij al-Szam"
 ARB_conquer_al_sham_desc: "Syria jest ojczyzną jednych z najważniejszych i najzamożniejszych miast świata muzułmańskiego. To tutaj znajdowała się stolica potężnego kalifatu Umajjadów, a liczne porty w regionie z pewnością przyniosą nam bogactwo."
 ARB_expand_jeddah_title: "Rozbuduj port w Dżuddzie"
 ARB_expand_jeddah_desc: "Dżudda jest głównym portem Mekki i niezbędnym przystankiem dla każdego, kto udaje się na hadżdż drogą morską. Rozbudowa miasta ułatwi dostęp do Świętego Miasta i wesprze gospodarkę naszego skromnego państwa."
 ARB_request_new_bayah_title: "Zażądaj nowej baj'y"
 ARB_request_new_bayah_desc: "Przysięga wierności, czyli baj'a, ma szczególne znaczenie w naszych wspólnotach, ukształtowanych przez surowe i jałowe środowisko. Lojalność poszczególnych szejków ma kluczowe znaczenie dla zachowania niezależności i władzy dynastii [Root.Monarch.Dynasty.GetName]."
 ARB_tribal_feuds_title: "Plemienne waśnie"
 ARB_tribal_feuds_desc: "Życie w tej części Arabii jest ciężkie i bezlitosne. Co więcej, poszczególne plemiona nieustannie toczą ze sobą spory, często z błahych powodów. W tej nieustannej walce o zasoby i przetrwanie musimy zwyciężyć, aby zjednoczyć skłócone plemiona."
 ARB_yemen_title: "Szczęśliwa Arabia"
 ARB_yemen_desc: "Poprowadźmy nasze armie na południe, aby podbić i zjednoczyć skłócone plemiona jemeńskie. Jemen, stosunkowo żyzny i ludny region Arabii, jest nieustannie targany konfliktami. Dzięki temu plemiona te stanowią łatwy cel na naszej drodze do ostatecznego zjednoczenia półwyspu."
 ARB_unite_arabia_title: "Zjednocz ojczyznę"
 ARB_unite_arabia_desc: "Od czasów pierwszych kalifatów plemiona Arabii nie przysięgały wierności jednemu władcy, a nawet wtedy często wybuchały bunty prowadzące do wojen domowych znanych jako fitna. Pod naszym panowaniem nic takiego się nie wydarzy — przywrócimy czasy zjednoczonego islamu."
 ARB_the_harsh_desert_title: "Surowa pustynia"
 ARB_the_harsh_desert_desc: "Ludzie z zewnątrz mogliby zastanawiać się, jak nasze plemiona potrafią przetrwać w tak ekstremalnych warunkach, jak jałowy Nadżd. Nasza zdolność przystosowania się do tego środowiska jest niezwykła i pozwala nam rozwijać się na tych ziemiach lepiej niż komukolwiek innemu."
 ARB_rulers_of_the_highlands_title: "Władcy Nadżdu"
 ARB_rulers_of_the_highlands_desc: "Nadżd nie jest wprawdzie najzamożniejszą krainą Arabii, lecz leży w centrum półwyspu. Wiele obcych imperiów walczyło z miejscowymi plemionami o dominację w tym regionie. Nie pozwolimy, aby te spory trwały nadal."
 ARB_wealth_and_power_title: "Bogactwo i potęga"
 ARB_wealth_and_power_desc: "Sułtani Ormuzu władają niezwykle strategicznym i bogatym obszarem. Pośredniczą w lukratywnym handlu przyprawami i kontrolują ważne szlaki, dzięki czemu zdołali zbudować ogromną potęgę gospodarczą. Wyeliminujmy ich i przejmijmy ich bogactwa."
 ARB_protect_caravans_title: "Chroń karawany"
 ARB_protect_caravans_desc: "Przez nasze jałowe ziemie przemierzają liczne karawany zmierzające na zachód i południe, przewożące cenne towary oraz pielgrzymów. Nie brakuje jednak rabusiów próbujących je napadać, dlatego musimy zapewnić im ochronę."
 ARB_befriend_local_amirs_title: "Zjednaj sobie miejscowych emirów"
 ARB_befriend_local_amirs_desc: "Poza większymi miastami i skupiskami ludności nasze ziemie są usiane posiadłościami wielu emirów i szejków, których lojalność może budzić wątpliwości. Zadbajmy o ich przychylność różnymi sposobami, aby zapewnić sobie ich wierność."
 ARB_al_haasa_title: "Wypędź Dżabrydów"
 ARB_al_haasa_desc: "Znaczna część wschodniego wybrzeża znajduje się pod kontrolą dynastii Dżabrydów, szyickiego rodu, którego ambicje sięgają daleko na południe i zachód. Ograniczmy ich potęgę, zanim sami staniemy się celem ich ekspansji."
 ARB_abbasid_legacy_title: "Dziedzictwo Abbasydów"
 ARB_abbasid_legacy_desc: "Irak zdobył sławę w świecie muzułmańskim dzięki rozwojowi nauki, jaki nastąpił za panowania dynastii Abbasydów. Najważniejszym symbolem tego rozkwitu jest Dom Mądrości — najwspanialsza biblioteka i ośrodek intelektualny, jaki dotąd widział dar al-Islam."
 ARB_city_among_the_dunes_title: "Miasto pośród wydm"
 ARB_city_among_the_dunes_desc: "Według przekazów Dirijja została założona w XV wieku przez jednego z najstarszych znanych przedstawicieli dynastii Saudów. Powstała na trudnym terenie, lecz kilka stuleci później stała się podstawą potężnego emiratu, który miał zjednoczyć Arabię."
 ARB_madrassa_title: "Załóż medresę"
 ARB_madrassa_desc: "Medresy są podstawowymi instytucjami edukacyjnymi świata muzułmańskiego. Zazwyczaj wznoszone przy meczetach, są niezbędne do rozwoju zamożnej i wpływowej warstwy ulemów. Finansowanie takich placówek jest jednym z wyznaczników potęgi i pobożności muzułmańskiego władcy."
 ARB_riyadh_title: "Załóż Rijad"
 ARB_riyadh_desc: "Załóżmy nowe miasto, które stanie się stolicą naszego państwa. Pomimo surowego terenu będzie ono ważnym przystankiem dla pielgrzymów podróżujących z Iraku do Mekki na hadżdż."
 ARB_across_the_strait_title: "Za cieśninę"
 ARB_across_the_strait_desc: "Al-Andalus był niegdyś ważną częścią świata muzułmańskiego, ojczyzną wielu uczonych i filozofów. Niestety, wskutek nikczemnej rekonkwisty wszelkie pozostałości tego państwa zostały zniszczone, a na jego miejscu powstały potężne królestwa chrześcijańskie. Przeprawmy się przez Cieśninę Gibraltarską i wymierzmy im surową karę."
 ARB_tours_title: "Pomścij Tours"
 ARB_tours_desc: "Ekspansja islamu na zachód Europy została ostatecznie powstrzymana w 732 roku podczas bitwy pod Tours. Dziś kalifat ponownie stoi u bram Francji, lecz tym razem zwycięstwo przypadnie wojskom Allaha."
 ARB_maghreb_title: "Podbij Maghreb"
 ARB_maghreb_desc: "Nazwa «Maghreb» pochodzi z języka arabskiego i oznacza dosłownie «zachód». Tradycyjnie określa się nią znaczną część Afryki Północnej i północno-zachodniej, pozostającą pod kontrolą lokalnych sułtanatów trudniących się piractwem i atakami na chrześcijańską żeglugę. Włączmy te ziemie do kalifatu i ruszajmy dalej, ku Al-Andalus."
 ARB_sicily_title: "Emirat Sycylii"
 ARB_sicily_desc: "Śródziemnomorska wyspa Sycylia należała niegdyś do Arabów i pozostawała pod ich panowaniem przez kilka stuleci. Od tego czasu została ponownie zdobyta przez chrześcijan, lecz nadal stanowi doskonały punkt wypadowy do podboju Italii. Z Sycylii możemy przeprowadzać najazdy morskie na włoskie wybrzeże, a ostatecznie zagrozić Rzymowi — sercu zachodniego chrześcijaństwa."
 ARB_caliphal_ambitions_title: "Ambicje kalifackie"
 ARB_caliphal_ambitions_desc: "Naszym ostatecznym celem jest odrodzenie kalifatu pod rządami potomków tych samych plemion, które wspierały Mahometa podczas jego pierwszych podbojów. Żadna obca siła nie zdoła powstrzymać nas przed osiągnięciem tego szlachetnego celu."
 ARB_zanzibari_trade_title: "Handel Zanzibaru"
 ARB_zanzibari_trade_desc: "Dzięki działalności muzułmańskich kupców słowo Allaha dotarło do najdalszych południowo-wschodnich zakątków Afryki. Fundamenty islamu w tym regionie są jednak słabe i opierają się głównie na kupieckiej oligarchii. Miejscowi sułtani i wodzowie nie wykazują chęci szerzenia religii, dlatego musimy wziąć sprawy w swoje ręce."
 ARB_rightly_guided_title: "Prawowierni"
 ARB_rightly_guided_desc: "Od śmierci proroka Mahometa islam przeżywał kilka złotych wieków, lecz to czterej kalifowie prawowierni, którzy objęli władzę po proroku, są znani we wszystkich społecznościach muzułmańskich, bliskich i dalekich. Od dawna żadne państwo islamskie nie zbliżyło się do poziomu pobożności i prestiżu, jakim cieszyli się kalifowie prawowierni, zanim kolejne pokolenia doprowadziły do rozłamu świata muzułmańskiego. Czy dzięki naszym dotychczasowym dokonaniom możemy ogłosić się prawowiernymi w oczach wszystkich muzułmanów?"
 ARB_north_title: "Marsz na północ"
 ARB_north_desc: "Nasze ziemie w Maszriku są chronione jedynie przez kilka lokalnych twierdz. Leżą na otwartych równinach poprzecinanych rzekami, dlatego musimy poszerzyć strefę buforową, aby nie pozostawić wrogom swobody manewru."
 ARB_ottomans_title: "Pokonaj pretendentów"
 ARB_ottomans_desc: "Osmanowie są bez wątpienia drugim imperium, które zabiega o uznanie za kalifat. Całym islamem może jednak rządzić tylko jeden prawowity monarcha — i nie należy on do dynastii Osmanów. Udowodnijmy to na polu bitwy."
 ARB_persia_title: "Podporządkuj Persję"
 ARB_persia_desc: "Iran wywiera znaczny wpływ kulturowy na sąsiednie państwa. Tym bardziej godne ubolewania jest to, że ziemia ta została rozdarta przez konflikty religijne. Ponownie podporządkujmy sobie Persję i połóżmy kres wszystkim wewnętrznym sporom."
 ARB_beyond_solomons_title: "Góry Salomona"
 ARB_beyond_solomons_desc: "Choć pierwotne wojska kalifatu zatrzymały się na paśmie górskim Sulejmana, słowo Allaha dotarło znacznie dalej — rozprzestrzeniło się na Nusantarze, w Indiach i wzdłuż Jedwabnego Szlaku. W wielu z tych regionów islam łączy się jednak z lokalnymi wierzeniami, co prowadzi do szerzenia fałszywego bałwochwalstwa. Musimy dotrzeć do tych społeczności."
 ARB_mahd_adh_dhahab: "Mahd adh-Dhahab"
