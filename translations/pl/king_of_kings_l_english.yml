 desc_per_persian_merchants_active: "Nasze państwo odwiedzają kupcy z Persji. Choć zdominowali nasze ośrodki handlowe, złoto, które wprowadzają na nasze rynki, znacznie przyspiesza rozwój rodzimej produkcji."
 per_chinese_embassy: "Ambasada chińsko-perska"
 desc_per_chinese_embassy: "W tej prowincji mieści się ambasada chińsko-perska. Dyplomaci, uczeni i kupcy obu imperiów regularnie ją odwiedzają, wymieniając idee i towary pochodzące z dwóch zupełnie odmiennych światów."
 per_persian_embassy: "Ambasada persko-chińska"
 desc_per_persian_embassy: "W tej prowincji mieści się ambasada persko-chińska. Dyplomaci, uczeni i kupcy obu imperiów regularnie ją odwiedzają, wymieniając idee i towary pochodzące z dwóch zupełnie odmiennych światów."
 per_chinese_embassy_tooltip: "Aktywny sojusz §YPersko-Chiński§!"
 per_sunni_conversion_policy: "Nastroje antyszyickie"
 desc_per_sunni_conversion_policy: "Silne państwo jest państwem opartym na silnej wierze. Aktywnie eliminujemy ostatnie pozostałości szyizmu w Persji."
 per_center_of_culture: "Ośrodek kultury"
 desc_per_center_of_culture: "Ta prowincja jest centrum sztuki, architektury, rzemiosła i wszelkich innych dóbr kultury."
 per_converted_persia_modifier: "Zjednoczenie wiary"
 desc_per_converted_persia_modifier: "Mieszkańcy naszego państwa porzucili heretyckie poglądy i dołączyli do wspólnoty naszej prawdziwej wiary."
 per_protector_of_the_shia_faith: "Obrońca wiary szyickiej"
 desc_per_protector_of_the_shia_faith: "Zagwarantowaliśmy wolność naszym braciom w wierze. Ten bezinteresowny czyn znacząco poprawia naszą reputację na świecie."
 per_sponsorship_of_christian_armenians_modifier: "Wsparcie dla chrześcijańskich Ormian"
 desc_per_sponsorship_of_christian_armenians_modifier: "Chrześcijańscy Ormianie są przyjmowani w naszym kraju z dość otwartymi ramionami. W przeciwieństwie do heretyków, wyznawcy innych religii chrześcijańskich spotykają się z tolerancją, ponieważ liczymy, że zasilą szeregi naszej wspaniałej armii."
 per_elitist_caste_modifier: "Kasta elit"
 desc_per_elitist_caste_modifier: "Zapewniliśmy [Root.GetQizilbashOrFallbackName], że Ormianie nie obejmą żadnych ważnych stanowisk w naszym państwie. W ten sposób umacniamy ich lojalność wobec [Root.Monarch.GetTitle]."
 per_master_of_india_modifier: "Władca Indii"
 desc_per_master_of_india_modifier: "Subkontynent indyjski jest najnowszym klejnotem w koronie [Root.Monarch.GetTitle]. To dziedzictwo ukształtuje Indie na kolejne stulecia."
 per_increased_conversion_efforts: "Zintensyfikowane nawracanie"
 desc_per_increased_conversion_efforts: "Debaty teologiczne dobiegły końca. Musimy skupić się na ocaleniu wyznawców innych religii od ich błędnej wiary i nawróceniu ich na prawdziwą wiarę [Root.Religion.GetName]."
 per_increased_tolerance_efforts: "Zwiększona tolerancja"
 desc_per_increased_tolerance_efforts: "Debaty teologiczne dobiegły końca. Musimy skupić się na integrowaniu wyznawców innych religii z naszym krajem i poznawaniu ich poglądów teologicznych."
 per_persian_defender_of_faith: "Perski obrońca wiary"
 desc_per_persian_defender_of_faith: "Integralność i bezpieczeństwo naszej religii spoczywają na naszych barkach. Dzięki temu nasze znaczenie dyplomatyczne i kulturowe w obrębie grupy religijnej [Root.Religion.GetGroupName] znacznie wzrasta.\n\n§YTrwa do chwili utraty tytułu Obrońcy Wiary.§!"
 per_culture_of_art: "Kultura sztuki"
 desc_per_culture_of_art: "Kultura [Root.Culture.GetName] wyznacza światowe standardy w dziedzinie sztuki, poezji, architektury i piękna. Ludzie z całego świata przybywają do [Root.GetName], by poznać [Root.Culture.GetName] gust i sposób postrzegania sztuki życia."
 per_triumph_in_cairo_modifier: "Triumf w Kairze"
 desc_per_triumph_in_cairo_modifier: "Sztandary [Root.GetAdjective] powiewają na wietrze nad Kairem. Nasze zwycięstwo nad państwami Lewantu jest bezsporne."
 per_continental_trading_modifier: "Handel w głębi Indii"
 desc_per_continental_trading_modifier: "Dzięki naszym podbojom karawany uzyskały bezpośredni dostęp do bogatego handlu bengalskiego. Znacząco zwiększy to nasze dochody z handlu."
 per_naval_command_modifier: "Dowództwo perskiej floty"
 desc_per_naval_command_modifier: "Dysponujemy potęgą perskiej floty. Niech piraci poczują gniew Lwiego Pazura!"
 per_kingdom_of_hormuz_province_modifier: "Skuteczne perskie patrole"
 desc_per_kingdom_of_hormuz_province_modifier: "Nasza flota zabezpieczyła wybrzeże i chroni tę prowincję przed podstępnymi piratami."
 per_royal_porcelain_collection_modifier: "Królewska kolekcja porcelany"
 desc_per_royal_porcelain_collection_modifier: "Kupcy powrócili z najwspanialszą porcelaną, jaką widziano w naszym kraju. Te prestiżowe wyroby są teraz zawsze wykorzystywane podczas wizyt zagranicznych ambasadorów na naszym dworze."
 per_porcelain_exports_to_the_west_modifier: "Eksport porcelany na Zachód"
 desc_per_porcelain_exports_to_the_west_modifier: "Perskie państwo importuje nasze wyroby w ogromnych ilościach. Persowie zdają się wierzyć, że porcelana ta jest niezwykle przydatna w dyplomacji.\nMoże lepiej nie wspominać im, że otrzymują talerze używane przez naszych chłopów, a nie prawdziwą, szlachetną porcelanę królewską."
 zoroastrian_interests: "Zainteresowanie zaratusztrianizmem"
 desc_zoroastrian_interests: "Na dworze i w państwie obserwujemy odrodzenie zainteresowania wiarą zaratusztriańską. Otwiera to umysły wielu mieszkańców na inne religie, lecz jednocześnie znacząco osłabia pobożność wobec [Root.Religion.GetName]."
 zoroastrian_prophet_inspiration: "Natchnienie proroka"
 desc_zoroastrian_prophet_inspiration: "Słowa proroka rozbrzmiewają w umysłach naszych wojowników. Są dla nich źródłem natchnienia i powodem, by walczyć z bezgranicznym oddaniem. Armie [Root.GetName] stawią czoła każdemu buntowi i zdławią go."
 zoroastrian_prophet_in_the_court: "Neozaratusztriański prorok"
 desc_zoroastrian_prophet_in_the_court: "Prorok, który niegdyś przemawiał przed tłumami, licząc na zarobek, jest teraz szanowanym i wpływowym członkiem dworu [Root.GetAdjective]. Jego nauki i mądrość inspirują wielu wyznawców innych religii do przyłączenia się do wspólnoty zaratusztriańskiej."
 per_shahnameh_modifier: "Szahname"
 desc_per_shahnameh_modifier: "To wielkie dzieło, liczące 759 stron i 258 ilustracji wykonanych przez najwybitniejszych mistrzów biblioteki szacha, powstawało przez kolejne dwie dekady. Jego karty ukazują rozwój malarstwa we wczesnym okresie panowania [Root.Monarch.GetName]. Rękopis tak obszerny jak Szahname wymagał talentu licznych malarzy, kaligrafów i kierowników artystycznych."
 per_persian_arquebusiers_modifier: "Perska taktyka uderzeniowa arkebuzerów"
 desc_per_persian_arquebusiers_modifier: "W trakcie licznych kampanii zasady prowadzenia wojny wielokrotnie się zmieniały. Nasi przodkowie walczyli konno, używając mieczy i łuków. Pojawienie się prochu odmieniło jednak sposób, w jaki rozprawiamy się z wrogami. Nasze oddziały nie tylko przyjęły arkebuzy, nową odmianę długiej broni palnej, lecz także włączyły je do tradycji i codziennego życia. Dzięki temu nasza piechota i jazda zyskały sławę na polu bitwy."
 per_shirley_reforms_the_army1_modifier: "Reformy armii braci Shirley"
 desc_per_shirley_reforms_the_army1_modifier: "Reformy wprowadzone przez braci Shirley zostały wdrożone. Wiele pozostaje jeszcze do zrobienia, ale jakość naszych wojsk znacząco wzrośnie."
 per_shirley_reforms_the_army2_modifier: "Reformy armii braci Shirley"
 desc_per_shirley_reforms_the_army2_modifier: "Reformy wprowadzone przez braci Shirley zostały wdrożone. Wiele pozostaje jeszcze do zrobienia, ale jakość naszych wojsk znacząco wzrośnie."
 per_powerful_religious_doctrine_modifier: "Potężna doktryna religijna"
 desc_per_powerful_religious_doctrine_modifier: "Podbój prowincji [371.GetName] zapewnił [Root.Monarch.GetName] legitymację niezbędną do wprowadzenia doktryn religijnych służących nawracaniu heretyków i wyznawców innych religii."
 per_persian_reign_modifier: "Perskie panowanie"
 desc_per_persian_reign_modifier: "Tymurydzi, prawdziwa plaga Persji, zostali wyparci i pokonani. Persja ponownie znalazła się w perskich rękach! Ta prowincja odczuwa dobroczynne skutki rządów nowej perskiej dynastii."
 per_muzaffarid_centre_of_admin_modifier: "Muzaffarydzkie centrum administracyjne"
 desc_per_muzaffarid_centre_of_admin_modifier: "Ta prowincja jest perskim centrum administracyjnym na indyjskich terytoriach państwa. Dzięki temu pobór podatków jest tu znacznie sprawniejszy."
 per_turkmen_recruits_modifier: "Rekruci turkmeńscy"
 desc_per_turkmen_recruits_modifier: "Ta prowincja dostarcza naszym kizylbaszom nowych rekrutów spośród Turkmenów, którzy desperacko poszukują nowego celu w życiu."
 per_urban_planning_of_shah_abbas_modifier: "Planowanie urbanistyczne szacha Abbasa"
 desc_per_urban_planning_of_shah_abbas_modifier: "Ta prowincja jest obecnie przedmiotem licznych planów i pomysłów architektonicznych Abbasa."
 per_swift_horses_modifier: "Szybkie konie arabskie"
 desc_per_swift_horses_modifier: "Zwinność i szybkość naszych koni znacznie wzrosły."
 per_swift_horses2_modifier: "Zwinne konie arabskie"
 desc_per_swift_horses2_modifier: "Zwinność i szybkość naszych koni wyraźnie wzrosły."
 per_swift_horses3_modifier: "Szybsze konie"
 desc_per_swift_horses3_modifier: "Zwinność i szybkość naszych koni wzrosły."
 per_mount_discipline_modifier: "Żelazna dyscyplina jazdy"
 desc_per_mount_discipline_modifier: "Dyscyplina naszych jeźdźców i ich koni wyraźnie się poprawiła."
 per_mount_discipline2_modifier: "Dyscyplina jazdy"
 desc_per_mount_discipline2_modifier: "Dyscyplina naszych jeźdźców i ich koni uległa poprawie."
 per_horse_population_boom_modifier: "Gwałtowny wzrost pogłowia koni"
 desc_per_horse_population_boom_modifier: "Nasza dostępność koni znacznie wzrosła."
 per_horse_population_boom2_modifier: "Obfitość koni"
 desc_per_horse_population_boom2_modifier: "Nasza dostępność koni wzrosła."
 per_horse_population_boom4_modifier: "Stopniowy wzrost pogłowia koni"
 desc_per_horse_population_boom4_modifier: "Dostępność koni jest wystarczająca."
 per_firearm_charge_modifier: "Powszechne użycie muszkietów"
 desc_per_firearm_charge_modifier: "Znacznie wzrosło wykorzystanie broni palnej w połączeniu z jazdą konną."
 per_firearm_charge2_modifier: "Częściowe użycie muszkietów"
 desc_per_firearm_charge2_modifier: "Nieznacznie wzrosło wykorzystanie broni palnej w połączeniu z jazdą konną."
 per_restored_avesta: "Odtworzona Awesta"
 desc_per_restored_avesta: "Wreszcie Awesta — święty zbiór opisanych obrzędów i nauk teologicznych — odzyskała dawną świetność!"
