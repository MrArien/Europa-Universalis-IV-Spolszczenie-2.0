 mam_no_more_than_4_hajj_tt: "Nie możemy sponsorować więcej niż 4 wielkich hadżdżów jednocześnie"
 performed_hajj_modifier: ""
 mam_sponsor_hajj_tooltip: "Zapraszając władców państwa [From.GetName] na §Ywielki hadżdż§!, poprawimy stosunki i zaufanie między naszymi państwami, a także umocnimy ich prawowitość"
 estate_nobles_mam_three_privileges: "Rozszerz przywileje [Root.GetNobilityName]"
 estate_nobles_mam_three_privileges_desc: "Na znak przyjaźni i współpracy [Root.GetNobilityName] poprosili nas o dalsze rozszerzenie ich przywilejów na naszym dworze."
 estate_nobles_mam_recruit_mamluks: "Rekrutuj §Ymameluków§!"
 estate_nobles_mam_recruit_mamluks_desc: "Potężne wojsko jest podstawą potężnego i zamożnego państwa. Aby realizować nasze cele i chronić lud, musimy zgromadzić silną armię."
 estate_nobles_mam_develop_military_infrastructure: "Rozbuduj infrastrukturę wojskową"
 estate_nobles_mam_develop_military_infrastructure_desc: "Ośrodki rekrutacyjne i koszary w całym państwie to cenne obiekty, które pomagają wystawiać i utrzymywać odpowiednią armię."
 estate_nobles_mam_increase_army_tradition: "Zwiększ tradycję armii"
 estate_nobles_mam_increase_army_tradition_desc: "Naszą potęgę militarną mierzy się umiejętnościami dowódców i tradycją. Musimy zatem nie tylko ją zachować, lecz także dalej rozwijać."
 estate_nobles_mam_increase_army_professionalism: "Zwiększ profesjonalizm armii"
 estate_nobles_mam_increase_army_professionalism_desc: "Naszą potęgę militarną mierzy się umiejętnościami dowódców i profesjonalizmem. Musimy zatem nie tylko je zachować, lecz także dalej rozwijać."
 estate_nobles_mam_focus_on_military_matters: "Skup się na sprawach wojskowych"
 estate_nobles_mam_focus_on_military_matters_desc: "Zdaniem [Root.GetNobilityName] państwo powinno skupić się na sprawach wojskowych, ponieważ armia jest podstawowym narzędziem utrzymywania porządku i suwerenności granic."
