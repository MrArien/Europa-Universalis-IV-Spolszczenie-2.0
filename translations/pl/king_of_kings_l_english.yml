 estate_burghers_ARB_oasis_development: "Rozwój oaz"
 estate_burghers_ARB_oasis_development_desc: "Bliskość surowego, suchego klimatu i rozległych gorących pustyń sprawiła, że szczególnie dobrze radzimy sobie z rozwojem takich terenów."
 flavor_ARB.1.t: "Wsparcie szejków"
 flavor_ARB.1.d: "Dzięki naszej polityce wewnętrznej [Root.Monarch.GetName] zdołał zdobyć lojalność tych, których wierność wydawała się najbardziej wątpliwa — miejscowych szejków. Ponowili oni przysięgi i zobowiązali się wspierać [Root.Monarch.GetHerHis] sprawę, dzięki czemu możemy liczyć na ich podwładnych w naszej armii."
 flavor_ARB.1.a: "Niech dowodzą naszymi skrzydłami!"
 flavor_ARB.1.b: "Chcemy ich najlepszych jeźdźców."
 flavor_ARB.1.c: "Niech dostarczą wszystkich regularnych żołnierzy, jakich zdołają wystawić."
 flavor_ARB.2.t: "Dom Mądrości"
 flavor_ARB.2.d: "Jeszcze nie tak dawno burzliwymi ziemiami Mezopotamii władał kalifat Abbasydów, za którego panowania nastąpił wielki rozkwit nauki i kultury. Symbolem tej epoki był Dom Mądrości, wspaniała biblioteka w Bagdadzie. Niestety, została ona zniszczona przez hordy Mongołów. Dziś wielu dworzan proponuje odbudowę biblioteki, a przede wszystkim przywrócenie jej jako instytucji. Swoje usługi zaoferowało już wielu wybitnych uczonych i naukowców."
 flavor_ARB.2.a: "Spójrzmy ku niebiosom!"
 flavor_ARB.2.b: "Zgłębiajmy tajemnice życia Mahometa."
 flavor_ARB.2.c: "Zastanówmy się nad filozofią naszych czasów."
 flavor_ARB.3.t: "Zdobycie Ursalim"
 flavor_ARB.3.d: "Zdobyliśmy Ursalim, miasto święte dla muzułmanów, chrześcijan i żydów. Ta wspaniała metropolia, będąca bramą do podboju Syrii i Egiptu, zamieszkana jest przez liczną ludność Ludu Księgi, czyli dhimmich. Niestety, wielu z nich wspierało obrońców, obawiając się utraty swoich przywilejów."
 flavor_ARB.3.a: "Uspokójmy dhimmich i rozwiejmy ich obawy."
 flavor_ARB.3.b: "Nałóżmy na nich jednorazowy dodatkowy podatek za stawiany opór."
 flavor_ARB.4.t: "Przyszłość Uniwersytetu Al-Azhar"
 flavor_ARB.4.d: "Uniwersytet Al-Azhar, założony jeszcze za rządów szyickich Fatymidów, został przekształcony w sunnicką instytucję i zyskał jeszcze większy prestiż oraz rozgłos. Po podboju Egiptu i Kairu znalazł się pod naszą kontrolą, dlatego to my zdecydujemy o jego przyszłości."
 flavor_ARB.4.a: "Sfinansujmy wydziały!"
 flavor_ARB.4.b: "Obsadźmy najważniejsze stanowiska uczonymi hanbalickimi."
 flavor_ARB.4.c: "Nie możemy pozwolić sobie na taki wydatek!"
 flavor_ARB.5.t: "Nowy kalifat"
 flavor_ARB.5.d: "Kalifowie, niegdyś cieszący się ogromnym autorytetem w dar al-Islam, stali się dziś niewiele znaczącymi figurantami sułtanatu egipskiego. Osmanowie również próbują zdobyć tytuł kalifa, lecz nasze roszczenia z pewnością zostaną potraktowane poważniej. Jako opiekunowie i obrońcy świętych miast oraz niekwestionowani władcy Półwyspu Arabskiego powinniśmy wreszcie wypełnić nasze przeznaczenie i stanąć na czele całego islamu."
 flavor_ARB.5.a: "Podążamy śladami Mahometa!"
 flavor_ARB.5.b: "To jeszcze nie czas."
 flavor_ARB.6.t: "Drugi złoty wiek islamu"
 flavor_ARB.6.d: "Za panowania Abbasydów wpływy kultury islamskiej osiągnęły szczyt. W Bagdadzie działał wówczas Dom Mądrości, a arabskie osiągnięcia naukowe i kulturowe przyczyniły się do rozwoju całej ludzkości. Sztuka i innowacje przekraczały granice państw i rozprzestrzeniały się po świecie. Podobne zjawiska obserwujemy dziś, gdy rządy dynastii [Root.Monarch.Dynasty.GetName] zapoczątkowały nową erę dobrobytu i złoty wiek."
 flavor_ARB.6.a: "Niewiarygodne!"
 flavor_ARB.7.t: "Pomsta za Tours"
 flavor_ARB.7.d: "Wreszcie odnieśliśmy ostateczne zwycięstwo nad Francuzami. Zachodnie bramy Europy stoją otworem, a nasze zwycięskie armie mogą wreszcie wkroczyć daleko w głąb kontynentu. To dzień świętowania dla wszystkich uczonych i stronników dynastii [Root.Monarch.Dynasty.GetName]. Wielu uważa to wydarzenie za ostateczną zemstę za bitwę pod Tours sprzed stuleci, która zatrzymała arabski marsz na Europę."
 flavor_ARB.7.a: "Bramy Francji stoją przed nami otworem!"
 flavor_ARB.8.t: "Południowe rubieże"
 flavor_ARB.8.d: "W przeciwieństwie do wielu innych części dar al-Islam nawrócenie ludności Afryki Wschodniej dokonało się za sprawą arabskich kupców, którzy podczas częstych podróży morskich szerzyli islam w całym basenie Oceanu Indyjskiego. Niestety, islam na tych odległych ziemiach przybrał formę silnie synkretyczną, łącząc się z miejscowymi wierzeniami i prowadząc do praktyk, które uczeni z Arabii uznaliby za bluźniercze. Co więcej, miejscowi sułtani nie wykazują chęci dalszego szerzenia islamu."
 flavor_ARB.8.a: "Przekierujmy bogactwa na północ!"
 flavor_ARB.8.b: "Skupmy się na szerzeniu wiary."
 flavor_ARB.10.t: "Kwestia stolicy"
 flavor_ARB.10.d: "Wraz z ustanowieniem państwa [Root.GovernmentName] pod nazwą [Root.GetName] sztandar [Root.GetAdjective] dumnie powiewa nad światem muzułmańskim. W czasie tak wielkiego święta pojawia się pytanie, czy stolicę naszego nowego państwa należy przenieść do miasta lepiej odpowiadającego randze naszego [Root.GovernmentName]."
 flavor_ARB.10.a: "Naszą siedzibą będzie [361.GetName]."
 flavor_ARB.10.b: "Miasto [382.GetName] stanie się siedzibą państwa [Root.GetName]."
 flavor_ARB.10.c: "Miasto [410.GetName] będzie idealną stolicą."
 flavor_ARB.10.e: "[385.GetName] musi zostać naszą świętą stolicą."
 flavor_ARB.10.f: "W [384.GetName] powinna mieścić się nasza siedziba."
 flavor_ARB.10.zzz: "Nasza obecna stolica jest wystarczająco dobra."
 ARB_ideas: "Idee zjednoczonej Arabii"
 ARB_ideas_start: "Arabskie tradycje"
 ARB_ideas_bonus: "Arabskie ambicje"
 ARB_arabian_pincers: "Arabskie taktyki jazdy"
 ARB_arabian_pincers_desc: "Podczas powstawania kalifatu wiele naszych bitew wygrywaliśmy dzięki taktyce wykorzystującej jazdę konną. Pozorowany odwrót i starannie zaplanowane oskrzydlenia to tylko niektóre z dostępnych nam manewrów, dodatkowo wzmacnianych przez umiejętności naszych jeźdźców."
 ARB_pact_of_umar: "Pakt Umara"
 ARB_pact_of_umar_desc: "Pakt Umara został zawarty między kalifem Umarem a dhimmimi zamieszkującymi kalifat. Z czasem zyskał szczególne znaczenie w islamskim prawoznawstwie i stał się podstawą zasad traktowania dhimmich."
 ARB_engage_in_indian_ocean_trade: "Zaangażuj się w handel na Oceanie Indyjskim"
 ARB_engage_in_indian_ocean_trade_desc: "Wielu arabskich kupców już aktywnie uczestniczy w handlu na Oceanie Indyjskim. To dzięki ich wyprawom islam pokojowo rozprzestrzenił się we wszystkich zakątkach tego akwenu. Pod naszym zarządem te podróże handlowe będą kontynuowane."
 ARB_conversion: "Głoś słowo wiary"
 ARB_conversion_desc: "Historia i życie Mahometa oraz jego objawienia pozostają nieznane wielu ludziom na całym świecie. Rozpowszechniajmy wiedzę o jego życiu i zbawieniu, które czeka tych, którzy pójdą za jego naukami."
 ARB_jihad: "Dżihad"
 ARB_jihad_desc: "Podstawą naszej doktryny ekspansjonistycznej jest dżihad — święta wojna przeciwko niewiernym. Islam musi się rozszerzać, nawet jeśli będzie to wymagało przelewu krwi."
 ARB_new_caliphate_rising: "Odrodzenie kalifatu"
 ARB_new_caliphate_rising_desc: "Ciągłość prawowitych kalifatów wydaje się przerwana wskutek podporządkowania Abbasydów, którzy stali się marionetkami sułtanatu mameluków. Nadszedł czas, by przywrócić linię kalifów."
 ARB_mubarizun: "Mubarizun"
 ARB_mubarizun_desc: "Mubarizun byli elitarnymi i najlepiej wyszkolonymi żołnierzami armii arabskiej. Ich zadaniem było stawianie czoła najdzielniejszym wojownikom przeciwnika."
 cb_spread_islam: "Szerzenie islamu"
 cb_spread_islam_desc: "Wciąż pozostają nieświadomi nauk Mahometa. Oświećmy ich, w razie potrzeby również mieczem."
 ARB_spread_islam_wargoal: "Udowodnij wyższość"
 ARB_spread_islam_wargoal_desc: "Celem wojny jest udowodnienie im naszej wyższości poprzez zwycięstwa w bitwach."
 YEM_rassids_title: "Królestwa szyickie"
 YEM_rassids_desc: "Podział religijny w Jemenie sięga samych początków sporów o sukcesję po Mahomecie. Na przestrzeni kolejnych stuleci zmieniła się jednak struktura wyznaniowa regionu. Szczególne znaczenie zdobyło państwo Raszydów, głoszące rzadką, lecz ambitną odmianę zajdyzmu."
 YEM_islamic_ambitions_title: "Ambicje islamskie"
 YEM_islamic_ambitions_desc: "Leżąc u bram Mekki i Medyny, możemy wykorzystać rosnący religijny zapał, zdobyć oba miasta i spróbować ustanowić nowy kalifat pod rządami dynastii, która rzeczywiście potrafi zatroszczyć się o wspólnotę muzułmańską."
 YEM_arabian_ambitions_title: "Zjednocz Arabię"
 YEM_arabian_ambitions_desc: "Szczęśliwa Arabia jest przeznaczona do panowania nad całym półwyspem. Ojczyzna Mahometa i kolebka jednego z największych imperiów w historii świata powinna znaleźć się pod naszą pełną kontrolą."
 YEM_an_imminent_collapse_title: "Nieuchronny upadek"
 YEM_an_imminent_collapse_desc: "Jemeńskie państwo Rasulidów wkrótce ostatecznie ulegnie swojemu tragicznemu losowi. Możnowładcy Tahirydów rosną w siłę w Adenie, a Raszydzi nacierają z północy — cały region wkrótce stanie w płomieniach."
 YEM_rasulids_title: "Serce Jemenu"
 YEM_rasulids_desc: "Rdzenne ziemie Jemenu znajdują się w rękach Rasulidów. Każdy, kto zdobędzie Taiz, podporządkuje sobie Aden i przejmie Sanę, będzie w stanie ponownie zjednoczyć tę rozdartą wojną krainę."
 YEM_unite_yemen_title: "Zjednocz Jemen"
 YEM_unite_yemen_desc: "Od dziesięcioleci Jemen nie ma silnego i scentralizowanego rządu. Niech nasza dynastia raz na zawsze wypełni tę szlachetną misję. Przemaszerujemy ulicami Taiz i ogłosimy wszystkim wiernym nasz triumf."
 YEM_across_the_strait_title: "Za Bramę"
 YEM_across_the_strait_desc: "Za cieśniną Bab al-Mandab leży kraina odmienna kulturowo, lecz zamożna i bliska naszym interesom religijnym. Przekroczmy Bramę Morza Czerwonego i załóżmy przyczółki na wybrzeżu Somalii."
 YEM_tahirids_title: "Powstrzymaj Tahirydów"
 YEM_tahirids_desc: "Tahirydzi byli zamożnymi dostojnikami i możnowładcami dynastii Rasulidów, skupionymi głównie na wschodnich ziemiach. Wykorzystując niedawną próżnię władzy, utworzyli własne państwo skupione wokół Adenu, zagrażając miastu Taiz."
 YEM_defeat_hormuz_title: "Pokonaj Ormuz"
 YEM_defeat_hormuz_desc: "Kupcy z Ormuzu są naszymi głównymi rywalami na konkurencyjnych rynkach Indii. Zlikwidujmy ich zaplecze we własnej ojczyźnie, kończąc ich niezależność i zmuszając do współpracy. Z pewnością żadna inna potęga nie przybędzie do Indii, by zagrozić naszemu monopolowi."
 YEM_taiz_title: "Miasto monarchów"
 YEM_taiz_desc: "Taiz pozostawało mało znaczącym miastem w historii Jemenu aż do wzrostu potęgi dynastii Rasulidów, która przeniosła tam swoją stolicę. Z czasem stało się najważniejszym ośrodkiem regionu, doskonałym do sprawowania władzy dzięki strategicznemu położeniu i bliskości innych ziem."
 YEM_aden_title: "Rozbuduj port w Adenie"
 YEM_aden_desc: "Choć Taiz jest polityczną stolicą Jemenu, Aden pełni funkcję jego stolicy gospodarczej. Tradycyjnie był ważnym portem przeładunkowym i ośrodkiem handlu. Zakończmy wojnę w Jemenie i przywróćmy zaufanie kupców do miejscowych rynków, a wkrótce ponownie zbierzemy owoce bogactwa tego miasta."
 YEM_masters_of_arabian_sea_title: "Władcy Morza Arabskiego"
 YEM_masters_of_arabian_sea_desc: "Po wyeliminowaniu konkurencji i zdobyciu pozycji jedynego pośrednika w handlu między Maszrikiem a Indiami zbijemy ogromną fortunę na naszym monopolu."
 YEM_eastern_hub_title: "Wschodni ośrodek handlu"
 YEM_eastern_hub_desc: "Dzięki naszej całkowitej dominacji handlowej jemeński język arabski stał się lingua franca we wszystkich portach Morza Arabskiego — zarówno na wybrzeżach Indii i Persji, jak i Somalii. Każdy, kto chce pozyskiwać towary z tego regionu, musi liczyć się z kupieckimi rodami Adenu."
 YEM_build_a_navy_title: "Chroń Bramę"
 YEM_build_a_navy_desc: "Niezbędnym warunkiem realizacji naszych ambicji morskiej dominacji jest potężna flota handlowa. Skoro nie musimy już martwić się konfliktami wewnętrznymi, uporządkujmy sprawy morskie."
 YEM_secure_indian_trade_title: "Zabezpiecz handel z Indiami"
 YEM_secure_indian_trade_desc: "Jemeńscy kupcy są dobrze znani na zachodnim wybrzeżu Indii, lecz głównie w największych portach. Dzięki potężnej flocie handlowej i sprzyjającym wiatrom sezonowym nadszedł czas, by nawiązać szersze kontakty z Indiami."
 YEM_mukha_title: "Port w Al-Muchy"
 YEM_mukha_desc: "Al-Mucha słynie jako miasto portowe, do którego licznie przybywają plantatorzy kawy, aby sprzedawać swoje zbiory na szeroką skalę. Dlatego koniecznie musimy rozbudować ten najważniejszy port."
 YEM_coffee_title: "Monopol na qahwę"
 YEM_coffee_desc: "Wraz ze wzrostem dostępności ziaren kawy napój ten zyskał światową sławę, a wielu przypisuje mu pozytywny wpływ na ciało i umysł. Powinniśmy wykorzystać nasz monopol na ten niezwykle poszukiwany surowiec."
 YEM_religious_battlegrounds_title: "Pole bitwy religijnej"
 YEM_religious_battlegrounds_desc: "Poza Iranem Jemen jest najbardziej zróżnicowanym religijnie regionem świata muzułmańskiego, co prowadzi do licznych konfliktów na tle wyznaniowym. Musimy rozwiązać ten problem."
 YEM_unite_yemen_religiously_title: "Zakończ konflikty religijne"
 YEM_unite_yemen_religiously_desc: "Koran i hadisy można interpretować tylko w jeden właściwy sposób — nasz. Zadbajmy o to, by wszyscy Jemeńczycy przyjęli nasze nauki."
 YEM_city_of_sanaa_non_ras_title: "Miasto Sana"
 YEM_city_of_sanaa_non_ras_desc: "Sana ma ogromne znaczenie w naszej historii. Obecnie znajduje się w rękach Raszydów. Wypędźmy ich z miasta i rozbudujmy je tak, aby stało się drugą, a być może nawet główną stolicą państwa."
 YEM_expel_sunnites_title: "Wypędź sunnitów"
 YEM_expel_sunnites_desc: "Muzułmanie sunniccy stanowią zdecydowaną większość naszych sąsiadów i całego świata islamu. Jeśli chcemy szerzyć zajdyzm, musimy obalić ich rządy i zmusić ich do uznania naszej wyższości."
 YEM_dawah_title: "Da'wa"
 YEM_dawah_desc: "Pod przywództwem [Root.Monarch.GetName] z dynastii [Root.Monarch.Dynasty.GetName] wyruszmy do walki, odpowiadając na [Root.Monarch.GetHerHis] wezwanie do dżihadu. Nasi sąsiedzi muszą uznać [Root.Monarch.GetHerHim] za prawowitego imama!"
 YEM_convert_sunni_mosques_title: "Przekształć sunnickie meczety"
 YEM_convert_sunni_mosques_desc: "Najskuteczniejszym sposobem nawrócenia ludności sunnickiej będzie przekształcenie meczetów i odprawianych w nich praktyk zgodnie z naszymi przekonaniami."
 YEM_spread_zaidi_zealotry_title: "Szerz zajdycki żar religijny"
 YEM_spread_zaidi_zealotry_desc: "Zadziwiająco niewielu uznaje Alego za następcę Mahometa, a jeszcze mniej osób dostrzega znaczenie Zajda. Połóżmy kres tej niewiedzy."
 YEM_zaidi_caliphate_title: "Kalifat zajdycki"
 YEM_zaidi_caliphate_desc: "Podobnie jak sunnici zajdyci uznają znaczenie duchowego przywódcy — kalifa. Nie uznają jednak kalifów sunnickich. Przywódcy społeczności zajdyckiej sami przyjęli ten tytuł, w tym imamowie Raszydów w Jemenie."
 YEM_city_of_sanaa_ras_title: "Miasto Sana"
 YEM_city_of_sanaa_ras_desc: "W samym sercu naszego państwa Raszydów leży Sana, jedno z najstarszych miast Jemenu i stolica imamatu. Rozbudujmy je, aby stało się symbolem naszej wytrwałości i wiary, górującym nad dolinami Jemenu."
 YEM_city_of_sanaa_ras_tt: "Monument §YMiasto Sana§! ma co najmniej poziom §YZnaczący§!."
 YEM_zaidi_dominance_title: "Dominacja zajdycka"
 YEM_zaidi_dominance_desc: "Choć już teraz krzewimy wiarę wśród własnej ludności, zdobądźmy Święte Miasta i obwieśćmy wszystkim naszą potęgę. Dzięki takiemu pokazowi siły wielu wiernych spoza naszych granic przybędzie do nas, zapełniając miasta ludźmi gotowymi służyć państwu."
