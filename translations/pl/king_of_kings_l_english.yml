 estate_nobles_tofangchi_regiment_desc: "Tofangczi to [Root.GetAdjective] muszkieterzy rekrutowani ze wszystkich zakątków państwa. Pod nadzorem stanu [Root.GetNobilityOrFallbackName] żołnierze ci szkolą się w posługiwaniu muszkietami, odróżniając się tym samym od pozostałych oddziałów [Root.GovernmentName]."
