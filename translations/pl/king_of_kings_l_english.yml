 flavor_per.20.t: "Dziedzictwo Timura"
 flavor_per.20.desc: "Nasze państwo jest nie tylko centrum rozkwitu kultury, lecz także rozległym imperium, które pragnie kontynuować dzieło rozpoczęte przez Timura przed wieloma laty. Biurokracja została przystosowana do integracji nowych ziem, a system dziedziczenia zapewnia stabilność imperium w okresach zmiany władzy."
 flavor_per.20.a: "Gdyby Timur mógł nas dziś zobaczyć!"
 flavor_per.20.b: "Możemy być jego potomkami, ale sami wytyczamy własną drogę."
 flavor_per.21.t: "Dziedzictwo Safawidów"
 flavor_per.21.desc: "Nasze państwo jest czymś więcej niż tylko podmiotem politycznym na arenie światowej. Stanowi centrum religijnego oświecenia — zakon safawijja przekształcił się w imperium, któremu nie ma równych. W przeciwieństwie do wielu innych imperiów sprawy religijne państwa pozostają bezpośrednio w rękach panującej dynastii, której członkowie stoją na czele zakonu."
 flavor_per.21.a: "Niech poprowadzą nas ku świetlanej przyszłości!"
 flavor_per.21.b: "Sprawy dynastii powinny pozostać domeną dworu."
 flavor_per.22.t: "Dziedzictwo Eranszahr"
 flavor_per.22.desc.a: "Eranszahr, znane również jako Imperium Sasanidów, było ostatnim irańskim państwem przed muzułmańskim podbojem Bliskiego Wschodu. Pragnąc przywrócić chwałę Imperium Achemenidów, władcy Eranszahr prowadzili kampanie przeciw przeklętym Rzymianom i wspierali wysoką kulturę starożytnego Iranu.\nNasze państwo jest odrodzeniem Eranszahr. Odrodziliśmy się, lecz nie daliśmy się ujarzmić — jesteśmy błogosławionymi spadkobiercami Imperium Sasanidów i kontynuatorami jego dziedzictwa!"
 flavor_per.22.desc.b: "Eranszahr, znane również jako Imperium Sasanidów, było ostatnim irańskim państwem przed muzułmańskim podbojem Bliskiego Wschodu. Pragnąc przywrócić chwałę Imperium Achemenidów, władcy Eranszahr prowadzili kampanie przeciw przeklętym Rzymianom i wspierali wysoką kulturę starożytnego Iranu.\nPrzewyższyliśmy chwałę tego starożytnego imperium dzięki boskiej pomocy Allaha! Niech nasze rządy będą wspanialsze niż panowanie dawnego Eranszahr!"
 flavor_per.22.a: "Przywdziejemy płaszcz dziedzictwa Eranszahr."
 flavor_per.22.b: "Wreszcie Dobro zatriumfowało nad Złem!"
 flavor_per.22.c: "Powróciła chwała dawno upadłego imperium!"
 flavor_per.22.d: "Allah jest wielki!"
 flavor_per.23.t: "Dziedzictwo Seldżuków"
 flavor_per.23.desc: "Wielkie Imperium Seldżuków było potęgą turko-perską wywodzącą się z Azji Środkowej. Jesteśmy jego spadkobiercami i wykorzystamy jego wiedzę oraz taktykę, by zdominować te ziemie z grzbietów naszych koni!"
 flavor_per.23.a: "Naszym przeznaczeniem jest panowanie!"
 flavor_per.23.b: "Imperium stworzone dla konia."
 flavor_per.25.t: "Ghulamowie z [Root.GetName]"
 flavor_per.25.desc: "Wobec rosnącej potęgi politycznej [Root.GetQizilbashOrFallbackName] i narastających konfliktów między Turkmenami a [Root.GetNobilityOrFallbackName], [Root.Monarch.GetTitle] [Root.Monarch.GetName] utworzył nową formację wojskową w ramach [Root.GetDynastyOrFallback] [Root.GetName]: ghulamów. Rekrutowani spośród ludności Kaukazu jako żołnierze-niewolnicy, ghulamowie stanowią «trzecią siłę» wśród rządzącej arystokracji i są całkowicie lojalni wobec [Root.Monarch.GetTitle]."
 flavor_per.25.a: "Osłabi to [Root.GetQizilbashOrFallbackName], nie wywołując przy tym zbyt wielu problemów."
 flavor_per.27.t: "Lew i smok"
 flavor_per.27.desc: "Od starożytności Jedwabny Szlak łączy Europę z Azją, a imperia perskie zawsze sprawowały nad nim kontrolę. Szlak ten jest nie tylko siecią handlową, lecz także łącznikiem między Persami a Chińczykami, umożliwiającym wymianę wiedzy i kultury.\nNiektórzy dyplomaci [Root.GetAdjective] zamierzają udać się do [chinese_friend.GetName], aby ustanowić tam ambasadę w naszym imieniu i umocnić więzi między oboma imperiami."
 flavor_per.27.a: "Niech przyniesie to owocny sojusz."
 flavor_per.28.t: "Perska ambasada"
 flavor_per.28.desc: "Ambasadorowie z państwa [From.GetName] przebyli długą drogę do [Root.GetName] i dotarli na dwór [Root.Monarch.GetHerHis] wysokości. Pragną ustanowić stałą ambasadę, aby umocnić więzi między naszymi państwami."
 flavor_per.28.a: "Przyjmijmy tę propozycję z otwartymi ramionami!"
 flavor_per.28.b: "Phi! Łączy nas jedynie sojusz z konieczności. Nic więcej."
 flavor_per.29.t: "Ustanowiono ambasadę"
 flavor_per.29.desc: "Ambasadorowie powrócili do [Root.GetName]. [From.Monarch.GetTitle] państwa [From.GetName] przyjął naszą propozycję ustanowienia wzajemnych ambasad. Więzi między państwami [Root.GetAdjective] i [From.GetAdjective] staną się niezniszczalne!"
 flavor_per.29.a: "Doskonale!"
 flavor_per.30.t: "Odrzucono propozycję ambasady"
 flavor_per.30.desc: "Ambasadorowie powrócili do [Root.GetName]. Niemądry [From.Monarch.GetTitle] nie ma dość dalekowzroczności, by być wartościowym sojusznikiem lub dobrym władcą, i odesłał naszych przedstawicieli z kwitkiem. Stosunki między państwami [Root.GetAdjective] i [From.GetAdjective] pozostają jedynie sojuszem z konieczności."
 flavor_per.30.a: "To ich strata."
 flavor_per.31.t: "Koniec stosunków między [persian_embassy_holder.GetAdjective] a [chinese_embassy_holder.GetAdjective]"
 flavor_per.31.desc: "W wyniku różnych wydarzeń i okoliczności stosunki między państwami [persian_embassy_holder.GetName] i [chinese_embassy_holder.GetName] uległy znacznemu pogorszeniu, co doprowadziło do negatywnego nastawienia wobec sojuszu. Porażki wojenne, poczucie jednostronnych korzyści lub zwykłe narastanie obojętności sprawiły, że relacje między [persian_embassy_holder.GetAdjective] a [chinese_embassy_holder.GetAdjective] stały się coraz gorsze, a ambasady [persian_embassy_scope.GetName] i [chinese_embassy_scope.GetName] zakończyły działalność."
 flavor_per.31.a: "Stało się."
 flavor_per.33.a.tt: "§Y[This.GetName]§! stanie się §Yszyickim centrum nawracania§!."
 flavor_per.34.t: "[Root.GetName] a islam"
 flavor_per.34.desc: "Niegdyś pod panowaniem starożytnego zaratusztriańskiego imperium Sasanidów Persja padła ofiarą muzułmańskiego najazdu prowadzonego przez kalifat Raszydun na początku VII wieku. Od tamtej pory nasi ludzie stali się dumnymi muzułmanami, porzucając dawne pogańskie zwyczaje na rzecz boskości Allaha.\n\nChoć w górach wciąż istnieją enklawy heretyków i pogan, którzy odmawiają dołączenia do naszej wspólnoty, większość popiera decyzję [Root.Monarch.GetName], by skupić się na wierze muzułmańskiej."
 flavor_per.34.a: "To była naturalna decyzja."
 flavor_per.35.t: "[Root.GetName] a zaratusztrianizm"
 flavor_per.35.desc: "Niegdyś pod panowaniem starożytnego zaratusztriańskiego imperium Sasanidów Persja padła ofiarą muzułmańskiego najazdu prowadzonego przez kalifat Raszydun na początku VII wieku. Od tamtej pory nasi ludzie porzucili nauki Zaratustry na rzecz wiary swoich zdobywców.\n\nChoć w górach wciąż istnieją enklawy wyznawców dawnej, prawdziwej wiary, większość mieszkańców [Root.GetName] to pobożni muzułmanie sprzeciwiający się decyzji [Root.Monarch.GetName] o odrodzeniu starej religii."
 flavor_per.35.a: "Zapomnieli o swoim dziedzictwie. Musimy je przywrócić."
 flavor_per.35.a.tt: "§Y[Root.GetName]§! otrzyma wydarzenia prowadzące do jego nawrócenia na §Yzaratusztrianizm§!, kosztem §Rbuntów muzułmańskich§!."
 ZOROASTRIAN_FOCUS_INFLUENCE: ""
 flavor_per.36.t: "Rozłam wśród arystokracji"
 flavor_per.36.desc: "Arystokracja [Root.GetName], podobnie jak w innych państwach, składa się z posiadaczy ziemskich zaangażowanych w sprawy wojskowe. Tak jak rody szlacheckie na przestrzeni dziejów, również nasi możnowładcy próbują rozszerzać wpływy kosztem władzy [Root.Monarch.GetTitle], podważając autorytet [Root.Monarch.GetHerHis].\n\nW chwili wielkiej roztropności i dalekowzroczności [Root.Monarch.GetTitle] [Root.Monarch.GetName] ustanowił „Trzecią Siłę” w postaci [Root.GetGhulamsOrFallbackName] i rozbił [Root.GetAdjective] arystokrację, nastawiając jej członków przeciwko sobie. Ani [Root.GetNobilityOrFallbackName], ani [Root.GetQizilbashOrFallbackName] nie mogą liczyć na poparcie pozostałych dowódców wojskowych, by narzucić swoją wolę [Root.Monarch.GetTitle]."
 flavor_per.36.a: "Dziel i rządź."
 flavor_per.36.b: "Na razie możemy jednak potrzebować części ich wpływów."
 flavor_per.37.t: "Lew [Root.GetName]"
 flavor_per.37.desc: "[Root.GetAdjective] [Root.GovernmentName] — imperium rozciągające się od ziem europejskich aż po samo serce Indii. Na naszej drodze stanęło wielu potężnych przeciwników, lecz [Root.GetAdjective] determinacja nie osłabła. Żołnierze [Root.GetGhulamsOrFallbackName] utrzymywali linię, podczas gdy kawaleria [Root.GetQizilbashOrFallbackName] oskrzydlała i rozbijała wrogów. [Root.GetAdjective] urzędnicy zintegrowali rozległe ziemie, a rzemieślnicy i artyści kultury [Root.Culture.GetName] utrwalają osiągnięcia naszego narodu.\nŻadne imperium przed nami ani po nas nie odcisnęło tak wielkiego piętna jak [Root.GetName]."
 flavor_per.37.a: "Chwała państwu [Root.GetName]!"
 flavor_per.38.t: "Miasto pożądane przez cały świat"
 flavor_per.38.desc: "[151.GetName] — stolica tak wielu naszych rywali — znajduje się teraz w rękach [Root.GetName]. Od czasów starożytnego Cesarstwa Rzymskiego po tureckie imperium rządzone przez dynastię Osmanów [151.GetName] zawsze było wielkim miastem o strategicznym i kulturowym znaczeniu zarówno dla Europy, jak i świata islamu. Teraz ta prestiżowa metropolia należy do [Root.GetAdjective].\nNiektórzy na naszym dworze uważają, że [151.GetName] można rozwinąć w naszą „drugą stolicę” na ziemiach europejskich. Inni są zdania, że bogactwa [151.GetName] powinniśmy przenieść do [Root.Capital.GetName]."
 flavor_per.38.a: "Uczyńmy [151.GetName] naszą drugą stolicą."
 flavor_per.38.b: "[151.GetName] będzie po prostu kolejną prowincją naszego [Root.GovernmentName]."
 flavor_per.39.t: "Turecka integracja"
 flavor_per.39.desc: "Turcy nie są rzadkim widokiem w [Root.GetName]. Sami [Root.GetQizilbashOrFallbackName] są Turkomanami, a zatem łączą ich więzy pokrewieństwa z kuzynami z Anatolii.\nWielu Turków z nowo podbitych prowincji dołączyło do różnych plemion [Root.GetQizilbashOrFallbackName] i zostało zintegrowanych z naszym społeczeństwem. Choć ich ziemie nie będą już sprawiać problemów [Root.Monarch.GetTitle], gwałtowny wzrost wpływów [Root.GetQizilbashOrFallbackName] budzi niepokój..."
 flavor_per.39.a: "Z [Root.GetQizilbashOrFallbackName] poradzimy sobie później."
 flavor_per.39.a.tt: "Każda posiadana prowincja §Yturecka§! traci §G20§! lat separatyzmu i §G20§! autonomii lokalnej."
 flavor_per.39.b: "Zakażmy Turkom wstępowania do [Root.GetQizilbashOrFallbackName]."
 TURKS_INTEGRATED_INTO_QIZILBASH: ""
 TURKS_FORBIDDEN_TO_JOIN_QIZILBASH: ""
 flavor_per.40.t: "Gruzińscy niewolnicy w imperium perskim"
 flavor_per.40.desc: "Podboje zawsze przyprowadzają do naszego państwa nowych ludzi. Gruzinom, dzielnym wojownikom Kaukazu, los zgotował klęskę z rąk [Root.Monarch.GetName]. Gdy ostatnie ogniska separatyzmu zostają stłumione różnymi sposobami, szach [Root.Monarch.GetName] i jego doradcy muszą zdecydować, co zrobić z miejscową ludnością. Wielu członków [Root.GetQizilbashOrFallbackName] uważa, że nie potrzebujemy w administracji niesfornych niewiernych. Można jednak dostrzec korzyści i potencjał rozwoju, jeśli pozwolimy im żyć i rozwijać się w harmonii pod naszym sztandarem..."
 flavor_per.40.a: "Niech rozkwitają w naszym wielkim imperium!"
 flavor_per.41.t: "Sarkhej Roza i miasto Ahmadabad"
 flavor_per.41.d: "Budowę miasta Ahmadabad rozpoczął w 1411 roku Ahmed Szah I z dynastii Muzaffarydów, a ukończono ją w 1413 roku. Znajdował się w nim Manek Chowk, pierwszy plac miejski, który wraz z fortecą Bhadra był związany z legendą hinduskiego świętego Maneknatha. Następcy władcy sadzili drzewa wzdłuż ulic, ozdabiali miasto wspaniałymi budowlami oraz hojnie wspierali kupców i rzemieślników.\n\nChoć w 1484 roku stolicę sułtanatu Gudźaratu przeniesiono do Czampaniru, Ahmadabad nadal pozostawał ważniejszy. Chroniły go potężne mury, zaopatrzenie zapewniały sady i ogrody, a ulice, place i domy zaprojektowano z wielką starannością. Sułtani Ahmadabadu tak troszczyli się o dobrobyt miasta, że na wieść o pustym domu lub sklepie nakazywali natychmiast znaleźć dla niego lokatora.\nMiasto słynie nie tylko z niezrównanego piękna, lecz także z rozległego i znanego meczetu Sarkhej Roza.\nUmieszczenie naszego sztandaru na murach miasta i uczynienie z niego ośrodka administracyjnego niewątpliwie pomoże nam utrzymać kontrolę nad regionem."
 flavor_per.41.a: "Miasto, które przyćmi wszystkie inne!"
 flavor_per.42.t: "Wpływy hinduistyczne na perskim dworze"
 flavor_per.42.d: "Po kolejnych wojnach udało nam się osiągnąć to, co wielu uważało za niemożliwe. Znaczna część subkontynentu indyjskiego znajduje się teraz pod naszą kontrolą, a wraz z nią niezliczone społeczności o różnorodnych wyznaniach i kulturach. Mimo naszej skrupulatności i determinacji, by zachować własną tożsamość, stało się jasne, że wiele elementów kultury podbitych ludów Indii przeniknęło do najskrytszych zakątków naszego społeczeństwa. Stoimy zatem na rozdrożu, a podjęta decyzja może zaważyć na przyszłości naszego wielkiego narodu."
 flavor_per.42.a: "Czas zaakceptować naszą nową tożsamość!"
 flavor_per.42.b: "Nigdy nie porzucimy naszych korzeni!"
 flavor_per.43.t: "Wpływ kultury [Root.Culture.GetName]"
 flavor_per.43.desc: "Od wielkich sułtanów Andaluzji aż po Niebiańskich Cesarzy Chin — wspaniała kultura [Root.GetName] odcisnęła piętno na historii świata, inspirując liczne języki i cywilizacje. Wraz z odrodzeniem [Root.GetName] nadszedł czas, by ponownie uczynić nasze państwo centrum sztuki i kultury. Człowiek przyszłości będzie mówił w języku [Root.Culture.GetName]!"
 flavor_per.43.a: "Chwała [Root.GetName] zawsze tkwiła w jego kulturze."
 flavor_per.43.b: "Fascynujące. Nasza biurokracja jest jednak teraz potrzebna do innych zadań."
 flavor_per.43.b.tt: "§RNiektóre nagrody i wymagania misji zależą od mechaniki §YWpływów perskich§!.§!"
 flavor_per.44.t: "Studia nad zaratusztrianizmem"
 flavor_per.44.desc: "W ostatnim czasie teksty i opracowania poświęcone starożytnej religii zaratusztriańskiej zyskały popularność na [Root.GetAdjective] dworze. Choć oficjalnie mają służyć badaniu teologii Zaratustry z perspektywy [Root.Religion.GetName], niektórzy członkowie najbliższego otoczenia [Root.Monarch.GetTitle] najwyraźniej szczerze zgadzają się z zaratusztriańską ideą wolnego wyboru."
 flavor_per.44.a: "Wesprzyjmy ich badania."
 flavor_per.44.a.tt: "To działanie może rozgniewać przedstawicieli stanu §Y[Root.GetChurchOrFallbackName]§!."
 flavor_per.44.b: "Pozwólmy im potajemnie kontynuować badania."
 flavor_per.45.t: "Nauki islamu"
 flavor_per.45.desc: "Islam jest religią złożoną. Wielu spadkobierców Mahometa — pokój z nim — głosi wyższość własnych nauk nad naukami rywali, co z czasem doprowadziło do podziału islamu na różne odłamy. Można obrać tylko jedną drogę i podążyć jedną ścieżką ku duchowemu oświeceniu.\n\nSzyiccy dwunastkowcy, znani również jako imamici, mają silną pozycję w [Root.GetName], choć nie stanowią większości w naszym państwie. Są gotowi walczyć o swoje przekonania i szerzyć je poza naszymi granicami.\n\nZ kolei sunnizm jest już religią większości i nie należy do żadnego zakonu bojowego. W tym odłamie również istnieje jednak powszechne pragnienie zjednoczenia islamu, a naszym zadaniem może być kontynuowanie dziedzictwa kalifatów."
 flavor_per.45.b: "Niech dwunastkowcy przybliżą nas do Allaha."
 flavor_per.45.c: "Tylko sunnizm może przynieść islamowi pokój."
 flavor_per.46.t: "Ormiańscy niewolnicy w [Root.GetAdjective] [Root.GovernmentName]"
 flavor_per.46.d: "Podboje zawsze przyprowadzają do naszego państwa nowych ludzi. Ormianom, dzielnym wojownikom Kaukazu, los zgotował klęskę z rąk [Root.Monarch.GetName]. Gdy ostatnie ogniska separatyzmu zostają stłumione różnymi sposobami, szach [Root.Monarch.GetName] i jego doradcy muszą zdecydować, co zrobić z miejscową ludnością. Wielu członków [Root.GetQizilbashOrFallbackName] uważa, że nie potrzebujemy w administracji niesfornych niewiernych. Można jednak dostrzec korzyści i potencjał rozwoju, jeśli pozwolimy im żyć i rozwijać się w harmonii pod naszym sztandarem..."
 flavor_per.46.a: "Pozwólmy im dołączyć do naszego społeczeństwa!"
 flavor_per.46.b: "Nie możemy osłabiać naszej uprzywilejowanej kasty."
 flavor_per.47.t: "Wzrost potęgi [Root.GetName]"
 flavor_per.47.d: "[Root.GetAdjective] [Root.GovernmentName] — imperium rozciągające się od ziem europejskich aż po samo serce Indii. Dzięki wierze [Root.Religion.GetName] nie jesteśmy już tylko pretendentami do dziedzictwa imperium Achemenidów, lecz jego prawdziwymi spadkobiercami i kontynuatorami! Nieśmiertelni bledną w porównaniu z legionami [Root.GetName], a [Root.GetAdjective] administracja zawstydza urzędników starożytności.\nŻadne imperium przed nami ani po nas nie odcisnęło tak wielkiego piętna jak [Root.GetName]."
 flavor_per.47.a: "Naprawdę prześcignęliśmy wielkie dokonania Cyrusa."
 flavor_per.48.t: "Administracja mamelucka"
 flavor_per.48.d: "Administracja Egiptu wzorowana jest na biurokracji Ajjubidów, mimo że Mamelucy przejęli władzę nad tym krajem już dawno temu. Choć Mamelucy zostali ostatecznie podporządkowani, ich doświadczenie urzędnicze może okazać się przydatne, jeśli włączymy ich do struktur naszej arystokracji."
 flavor_per.48.a: "To powinno umocnić naszą władzę nad Egiptem."
 flavor_per.49.t: "Turkmeńscy rekruci pod naszymi sztandarami"
 flavor_per.49.d: "Po upadku konfederacji Białej Owcy wielu jej wojowników włóczyło się po jałowych ziemiach, grabiąc i nękając podróżnych kupców oraz rolników. Ludzie pozbawieni celu, których serca wciąż przepełniały wiara i lojalność wobec dawnych panów, zagubili się w świecie zmieniającym się szybciej, niż potrafili nadążyć. Musimy wznieść przed nimi nasz sztandar i zaszczepić w ich sercach ziarno naszej wiary. Wezwijmy tych zahartowanych w bojach wojowników równin, by poprowadzili nasze armie ku wielkości!"
 flavor_per.49.a: "Siodłać konie! O świcie ruszamy!"
 flavor_per.50.t: "Al-Kuds asz-Szarif"
 flavor_per.50.d: "Położona między Lewantem a Egiptem, między morzem a pustynią, Jerozolima jest jednym z najbardziej pożądanych miast na świecie. Teraz, gdy nasze wojska maszerują przez jej bramy, Święte Miasto jest gotowe, by znaleźć się pod naszym panowaniem. Wspaniałość i splendor związane z jego długą, naznaczoną krwią historią pozostaną już na zawsze pod perską opieką!"
 flavor_per.50.a: "Miasto jest już w naszych rękach."
 flavor_per.51.t: "Zwycięstwo w Egipcie"
 flavor_per.51.d: "To, co niegdyś było prestiżowym sułtanatem zdolnym rywalizować z Turkami, a nawet ich przewyższać, dziś jest jedynie stertą popiołów i gruzu. W jego miejsce przejmiemy dziedzictwo kalifów Fatymidów. Zwycięstwo nad dawnymi panami Kairu i zdobycie miasta dowiodły, że płomień naszej wiary pali się jaśniej i mocniej niż jakikolwiek inny. Nasi doradcy wojskowi donoszą, że podbój Egiptu przyniósł ogromne ilości złota i prestiżu — fundamenty imperium, które przetrwa wieki..."
 flavor_per.51.a: "Perski Lew zwyciężył!"
 flavor_per.52.t: "Dziedzictwo sułtanatu delhijskiego"
 flavor_per.52.d: "Sułtanat Delhijski był islamskim imperium ze stolicą w Delhi, które przez ponad trzy stulecia władało znaczną częścią subkontynentu indyjskiego. Rozciągał się od północnych ziem Hindustanu po wybrzeża południowo-wschodnich Indii, osiągając niegdyś szczyt potęgi, splendoru i prestiżu. Teraz dokończymy dzieło, którego oni nie zdołali zrealizować, i zjednoczymy Indie pod perskim sztandarem jako prawdziwi spadkobiercy Delhi!"
 flavor_per.52.a: "Jesteśmy ich prawowitymi następcami!"
 flavor_per.53.t: "Bogactwa Bengalu"
 flavor_per.53.d: "Kupcy z Chin, Borneo i wysp Malajskich przewożą swoje towary przez wybrzeża Ajutthai do delty Bengalu, pierwszej bramy prowadzącej na indyjskie rynki. Dzięki temu sułtani Bengalu czerpali ogromne zyski z handlu międzykontynentalnego, budując potężne imperium, które stanowiło poważne wyzwanie dla naszych armii podczas podboju Indii. Teraz cały ich majątek i bogactwa przechodzą w nasze ręce..."
 flavor_per.53.a: "Niech złoto płynie!"
 flavor_per.54.t: "Nowy koń"
 flavor_per.54.d: "Wieloletnie krzyżowanie najlepszych koni z całego świata wreszcie przyniosło rezultaty! Nasi królewscy hodowcy sprowadzili rumaki z Europy, Afryki, Arabii, a nawet odległych Chin, by wyhodować idealnego konia bojowego — wierzchowca, który utoruje naszym armiom drogę do zwycięstwa i zapisze się w historii. Gdy królewscy słudzy wchodzą do pałacu szacha, składają ukłon i z dumą informują [Root.Monarch.GetName], że prace dobiegają końca, a ich rezultat z pewnością przewyższy dotychczasowe wierzchowce używane przez [Root.GetGhulamsOrFallbackName] i [Root.GetQizilbashOrFallbackName]."
 flavor_per.54.a: "Zobaczmy, czego dokonali nasi królewscy hodowcy!"
