 mam_mercantile_relationship_title: "Stosunki handlowe"
 mam_mercantile_relationship_desc: "Morza na północ od naszych ziem są pełne statków i towarów przewożonych do [358.GetName] oraz z powrotem. Jeśli chcemy umocnić naszą pozycję w tym lukratywnym handlu, musimy określić nasze stosunki z republiką kupiecką Wenecji."
 mam_establish_merchant_escorts_title: "Eskorty kupieckie"
 mam_establish_merchant_escorts_desc: "Dążąc do rozwoju naszej działalności morskiej, musimy stworzyć silną flotę handlową, która stanie się fundamentem wymiany towarowej na okolicznych morzach."
 mam_yemen_title: "Państwo Tahirydów"
 mam_yemen_desc: "Jemen jest rozdrobniony i słaby. Nadchodzi czas, by wykorzystać jego słabość i zagarnąć tamtejsze ziemie. Jego bogactwa zasilą nasz dwór."
 mam_ethiopia_title: "Poza Nilem"
 mam_ethiopia_desc: "Negus Etiopii od zbyt dawna jest dla nas uciążliwym cierniem. Musimy szybko skierować uwagę ku Rogowi Afryki i raz na zawsze wyeliminować to zagrożenie."
 mam_recruit_the_mamluks_title: "Zwerbuj mameluków"
 mam_recruit_the_mamluks_desc: "Chwała na polu bitwy i historia naszego państwa opierają się na barkach walecznych żołnierzy-niewolników. Jeśli chcemy odwrócić proces upadku, który ogarnął nasz kraj, musimy przede wszystkim zwiększyć szeregi mameluków..."
 mam_refine_the_furusiyya_title: "Udoskonal furusijję"
 mam_refine_the_furusiyya_desc: "Kluczem do stworzenia doskonałej i zabójczej armii są nieustanne ćwiczenia i musztra. Rewizja podręczników oraz programów szkoleniowych pozwoli nam osiągnąć mistrzostwo w prowadzeniu wojny lądowej."
 mam_colonize_spice_islands_title: "Dotrzyj do Wysp Korzennych"
 mam_colonize_spice_islands_desc: "Daleko na wschodzie leżą wyspy obfitujące w przyprawy, o których opowieści krążą po targowiskach od Indii po [361.GetName]. Musimy wykorzystać tę okazję i zabezpieczyć te niezwykle dochodowe źródła przychodu."
 mam_naval_enterprise_title: "Przedsięwzięcie morskie"
 mam_naval_enterprise_desc: "Morze jest zdradliwym żywiołem, który nie zna litości dla żeglarzy. Potężna flota pozwoli nam zapanować nad jego wodami, umocni naszą pozycję w basenie Morza Śródziemnego i umożliwi dalszy rozwój sił morskich."
 mam_rhodes_title: "Bastion joannitów"
 mam_rhodes_desc: "Joannici z [320.GetName] zbyt długo opierają się naszym wpływom. Musimy raz na zawsze zlikwidować to zagrożenie, zanim rozszerzymy nasze wpływy dalej na północ."
 mam_pearl_mediterranean_title: "Perła Morza Śródziemnego"
 mam_pearl_mediterranean_desc: "Duma z posiadania najpotężniejszej floty na całym Morzu Śródziemnym jest naturalnym następstwem naszego sprawnego zarządzania i zasobnych skarbców, a zarazem świadectwem naszej wiedzy o morzu."
 mam_arabia_title: "Zjednocz Arabię"
 mam_arabia_desc: "Liczne plemiona i pomniejsze państewka Arabii od stuleci walczą o skrawki ziemi. To na nas spoczywa obowiązek interwencji i zjednoczenia regionu — w razie potrzeby siłą."
 mam_hormuz_straits_title: "Cieśnina Ormuz"
 mam_hormuz_straits_desc: "[2999.GetName], położone w idealnym miejscu u wejścia do Zatoki Perskiej, ma ogromne znaczenie dla realizacji naszych planów handlowych i zwiększenia udziału w lokalnym rynku."
 mam_highway_empire_title: "Szlak imperium"
 mam_highway_empire_desc: "Wąski pas lądu oddzielający Morze Czerwone od Śródziemnego podsunął naszym doradcom pomysł wielkiego przedsięwzięcia inżynieryjnego. Połączenie obu mórz z pewnością usprawniłoby przemieszczanie się naszej floty."
 mam_karimi_merchants_title: "Kupcy karimi"
 mam_karimi_merchants_desc: "Potężni kupcy zajmujący się przewozem przypraw i innych towarów będą cennymi sojusznikami w naszych staraniach o rozwój handlu i zwiększenie zysków z zamorskich przedsięwzięć."
 mam_harness_spice_trade_title: "Przejmij kontrolę nad handlem przyprawami"
 mam_harness_spice_trade_desc: "Przyprawy należą do najcenniejszych towarów przewożonych przez nasze targowiska, morza i rzeki. Ochrona tych dóbr musi stać się naszym najważniejszym priorytetem."
 mam_cyprus_title: "Zdobądź Nikozję"
 mam_cyprus_desc: "To bastion krzyżowców, oddalony od czujnego wzroku papieża, stanowi ostatni przyczółek świata katolickiego, który chyli się ku upadkowi po nieudanych krucjatach. [321.GetName] padnie pod naporem naszych potężnych armii."
 mam_great_power_title: "Imperialna rozgrywka"
 mam_great_power_desc: "Nasza pozycja wśród wielkich mocarstw stanowi silną przeciwwagę dla wpływów państw, które próbują umniejszać znaczenie naszego ludu. Tylko nasza potęga i wytrwałość pozwolą nam wspiąć się na szczyt i stać się najsilniejszym państwem."
 mam_baghdad_title: "Marsz na [410.GetName]"
 mam_baghdad_desc: "Jedno z najbardziej prestiżowych i sławnych miast świata islamu, [410.GetName], byłoby niezwykle cennym celem naszych kampanii wojskowych."
 mam_basrah_title: "Handel w Basrze"
 mam_basrah_desc: "Wielki napływ towarów na targowiska Basry z pewnością byłby cennym zastrzykiem dla naszego skarbca!"
 mam_alexandrian_trade_title: "Aleksandryjski handel"
 mam_alexandrian_trade_desc: "Nie możemy pozwolić, by zagraniczni kupcy zmonopolizowali handel w naszych własnych portach nad Morzem Śródziemnym. Powinniśmy zatem sfinansować budowę nowych targowisk, wspierając w ten sposób rodzimych handlarzy."
 mam_father_african_rivers_title: "Ojciec afrykańskich rzek"
 mam_father_african_rivers_desc: "Nil jest bez wątpienia źródłem życia naszego ludu. Wykorzystujemy go do transportu towarów, uprawy roli i dostarczania życiodajnej wody. Warto zainwestować w zagospodarowanie jego brzegów."
 mam_dar_al_hadith_turba_title: "Dar al-Hadith Turba"
 mam_dar_al_hadith_turba_desc: "Edukacja jest niezwykle ważna dla naszego oświeconego ludu. Obowiązkiem państwa jest zapewnienie najwyższego poziomu nauczania wszystkim, którzy pragną zdobywać wiedzę!"
 mam_reincorporate_northern_territories_title: "Terytoria północne"
 mam_reincorporate_northern_territories_desc: "Syria niemal całkowicie wymknęła się spod naszej kontroli. Północne terytoria dostrzegły słabość władzy centralnej i w zamian coraz śmielej domagają się większej autonomii..."
 mam_anatolia_title: "Zmiażdż Anatolię"
 mam_anatolia_desc: "Zagrożenie ze strony Osmanów i ich posiadłości w Anatolii musi zostać raz na zawsze zażegnane."
 mam_constantinople_title: "Bramy [151.GetName]"
 mam_constantinople_desc: "Przed nami leży stolica niegdyś potężnego imperium. Podbój [151.GetName] zapisze się w historii jako chwila naszego triumfu!"
 mam_tabriz_title: "Wyprawa na [416.GetName]"
 mam_tabriz_desc: "Ojczyzna dumnego ludu koczowniczego, szachów Iranu i wschodnich jeźdźców, będzie cennym łupem naszych wspaniałych i zwycięskich kampanii wojennych."
 mam_persia_title: "Lew i półksiężyc"
 mam_persia_desc: "Nie możemy dopuścić do powstania potężnego wroga na naszej wschodniej granicy. Aby temu zapobiec, musimy szybko uderzyć i zabezpieczyć jego ziemie."
 mam_unify_islam_title: "Zjednocz islam"
 mam_unify_islam_desc: "Od stuleci świat islamu pozostaje rozbity i podzielony. Naszą słabość wykorzystują obce mocarstwa, a podzieleni skazani jesteśmy na upadek. To na naszych wielkich armiach spoczywa zadanie zjednoczenia świata islamu!"
 mam_cultivate_the_delta_title: "Zagospodaruj deltę"
 mam_cultivate_the_delta_desc: "Sieć rzeczna łącząca Nil z naszym wybrzeżem Morza Śródziemnego obejmuje niezwykle cenne i żyzne ziemie. Musimy inwestować w ich dalszy rozwój!"
 mam_aden_trade_title: "Obecność w Adenie"
 mam_aden_trade_desc: "Zachodni kraniec Arabii wraz z Rogiem Afryki oferuje naturalne kotwicowiska, przystanie i targowiska położone w strategicznym miejscu dla cennego handlu przychodzącego i wychodzącego. Rozszerzenie naszych wpływów w tym regionie z pewnością przyniesie znaczne zyski."
 mam_kashifs_egypt_title: "Kaszyfowie Egiptu"
 mam_kashifs_egypt_desc: "Zarządzanie Egiptem nie jest łatwe ze względu na rozległość naszych domen i liczbę ich mieszkańców. Aby sprawnie administrować tym krajem, potrzebujemy odpowiednio zorganizowanych lokalnych zarządów."
 mam_center_arab_islamic_world_title: "Centrum świata arabsko-islamskiego"
 mam_center_arab_islamic_world_desc: "Nasz prestiż, potęga, pomysłowość i złoty przepych w oczach świata sprawią, że nasz wielki naród zostanie uznany za dominującą siłę epoki i najwspanialsze z wielkich mocarstw."
 mam_tunis_title: "Miasto karawan"
 mam_tunis_desc: "Naszą zachodnią granicę w Maghrebie zajmuje szereg słabych sułtanatów, takich jak Tunis. Mimo położenia między kilkoma ważnymi miastami władcy Tunisu nie zdołali zapewnić bezpieczeństwa swoim poddanym."
 mam_morocco_title: "Zmierzch Maroka"
 mam_morocco_desc: "Rządzące w Maroku dynastie przyniosły swoim poddanym jedynie głód i upadek. Powinniśmy wkroczyć i uwolnić ich od nieudolnych władców."
 mam_city_thousand_minarets_title: "Tysiąc minaretów"
 mam_city_thousand_minarets_desc: "[361.GetName] jest klejnotem w naszej wspaniałej koronie. Musimy zadbać, by został oszlifowany, a jego piękno dorównywało naszej prawowitości i potędze!"
 mam_khass_al_sultan_title: "Khass al-Sultan"
 mam_khass_al_sultan_desc: "Handel zbożem to doskonały sposób na rozwijanie stosunków dyplomatycznych z sąsiadami i pomnażanie naszego bogactwa. Usprawnienie produkcji pozwoli nam zrealizować wszystkie plany eksportowe i zapewnić odpowiednie dostawy na rynek krajowy."
 mam_assign_waqf_title: "Ustanów wakf"
 mam_assign_waqf_desc: "Przeznaczając środki i majątek na pomoc potrzebującym, a zwłaszcza na utrzymanie placówek edukacyjnych, możemy wesprzeć dobroczynność. Jest ona podstawą i oznaką pobożnego, dostatniego społeczeństwa!"
