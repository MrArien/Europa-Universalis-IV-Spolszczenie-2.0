 FROM_HAS_OUR_PRIMARY_CULTURE_TT: "§R- Państwo §Y[From.GetName]§! posiada kulturę główną §Y[Root.Culture.GetName]§!.§!"
 ROOT_IS_NOT_FROM_RELIGION_TT: "§R- Państwo §Y[Root.GetName]§! NIE wyznaje religii §Y[From.Religion.GetName]§!.§!"
