 BYZ_economic_intimidation: "Presja gospodarcza"
 desc_BYZ_economic_intimidation: "Wraz z powolnym wzrostem potęgi gospodarczej Cesarstwa Rzymskiego wszelkie działania wymierzone przeciwko nam narażają inne państwa na wykluczenie z naszej strefy gospodarczej."
 BYZ_reversing_the_decline: "Odwrócenie upadku"
