 turkoman_turcoiranian_culture: "§YTurkoirańska§! staje się nową kulturą główną. Kultura wszystkich posiadanych prowincji §Yazerbejdżańskich§!, §Ytureckich§! i §Yturkmeńskich§! zostaje zmieniona na §Yturkoirańską§!."
