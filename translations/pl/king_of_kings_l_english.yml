 MEE_Byzantine_Events.1.t: "Odzyskanie Serbii"
 MEE_Byzantine_Events.1.d: "Ziemie, które niegdyś stanowiły trzon państwa serbskiego, należały wcześniej do Rzymian. Serbskie dążenia do niezależności zmusiły nas do prowadzenia wielu wojen, by utrzymać te ziemie pod kontrolą. Serbowie musieli zaś stoczyć liczne walki, zanim ostatecznie oderwali się od imperium. Wraz z powstaniem Cesarstwa Serbskiego kraj ten stał się istotnym graczem politycznym, lecz również jego dosięgła zimna ręka upadku. Dziś, odzyskawszy siły, stoimy zwycięsko nad możnowładcami, których przodkowie tak zdradziecko nas opuścili."
 MEE_Byzantine_Events.1.a: "Ich zdrada nie może pozostać bez odpowiedzi. Należy ich odpowiednio ukarać!"
 MEE_Byzantine_Events.1.b: "Pozwólmy im zachować ich majątki."
 MEE_Byzantine_Events.2.t: "Grikowie Italii"
 MEE_Byzantine_Events.2.d: "Od starożytności południowe ziemie Italii zamieszkiwali Grecy, których przodkowie przybyli ze wschodu jako osadnicy. Na krótko, podczas bizantyjskiego panowania, ludność ta ponownie zjednoczyła się z resztą greckiego świata, lecz wraz z osłabieniem Cesarstwa Wschodniorzymskiego więź ta ponownie została zerwana. Dziś ziemie te znów znajdują się pod rządami państwa helleńskiego, co daje miejscowej ludności pewność, że jej tożsamość i bogata historia zostaną zachowane. Wsparcie dla Grików z pewnością umocni naszą władzę w tym regionie."
 MEE_Byzantine_Events.2.a: "Ponownie połączeni z naszą metropolią!"
 MEE_Byzantine_Events.3.t: "Następca Belizariusza"
 MEE_Byzantine_Events.3.d: "Podczas podboju ziem Longobardów wielu wybitnych żołnierzy awansowało w naszych szeregach. Niektórzy z nich zdobyli już status strategów i sławę dzięki odwadze na polu bitwy. Następcą Belizariusza, głównego wodza cesarza Justyniana, może być jednak tylko jeden człowiek. Dzięki swoim zdolnościom dowódczym Belizariusz zdołał na pewien czas przywrócić Rzymowi jego dawną pozycję i zjednoczyć rozbity świat rzymski. Mamy czterech głównych kandydatów na to stanowisko: uczonego znawcę Strategikonu, odważnego i inspirującego przywódcę, wybitnego specjalistę od oblężeń oraz człowieka słynącego z błyskotliwego zmysłu strategicznego."
 MEE_Byzantine_Events.3.a: "Jego następca będzie zgłębiał sztukę wojenną."
 MEE_Byzantine_Events.3.b: "Niech jego spadkobierca poprowadzi szarżę!"
 MEE_Byzantine_Events.3.c: "Niech obala zamki niczym drzewa."
 MEE_Byzantine_Events.3.e: "Jego następcą zostanie genialny strateg."
 MEE_Byzantine_Events.4.t: "Rzym w rzymskich rękach"
 MEE_Byzantine_Events.4.d: "Ostatni raz Cesarstwo Rzymskie władało Wiecznym Miastem w 751 roku, ponad siedem stuleci temu. Od tamtej pory aż do dziś Rzym pozostawał w rękach Państwa Kościelnego, którego władcy sprawowali duchową pieczę nad całym katolicyzmem. Nie można powiedzieć, że miasto było zaniedbane, lecz z pewnością nie rozwijało się tak, jak tego oczekiwano. Dziś ponownie znalazło się w rzymskich rękach, choć jego mieszkańcy nie uważają się za Rzymian. Jednak po tak imponującym wkroczeniu naszej armii do Rzymu decyzja zapadła: prędzej poniesiemy porażkę, niż pozwolimy Italii ponownie wymknąć się z naszych rąk."
 MEE_Byzantine_Events.4.a: "Alea iacta est. (Kości zostały rzucone)."
 MEE_Byzantine_Events.5.t: "Powrót do przeszłości"
 MEE_Byzantine_Events.5.d: "Odzyskanie Rzymu na nowo rozbudziło wyobraźnię naszych artystów, których zachwyciło piękno miasta. To właśnie tutaj znajdowało się niegdyś centrum największego imperium, jakie widział świat. Przeniesienie stolicy z powrotem do Rzymu byłoby hołdem dla naszych przodków, a zarazem jasnym sygnałem, że zamierzamy pozostać tu na zawsze i wkrótce rozpoczniemy odbudowę imperium."
 MEE_Byzantine_Events.5.a: "Niech [Root.Monarch.GetTitle] sprawuje rządy w Rzymie."
 MEE_Byzantine_Events.5.b: "Pozostańmy w prowincji [Root.Capital.GetName]."
 MEE_Byzantine_Events.6.t: "Odzyskanie Grecji"
 MEE_Byzantine_Events.6.d: "Wbrew wszelkim przeciwnościom i oczekiwaniom nasze państwo zdołało powstrzymać osmańską ekspansję, a następnie przejąć inicjatywę i przeprowadzić kontratak. Ziemie Grecji, stanowiące niegdyś trzon Cesarstwa Rzymskiego, które stopniowo utraciliśmy wskutek jego upadku, ponownie należą do nas."
 MEE_Byzantine_Events.6.a: "Powstajemy niczym feniks z popiołów."
 MEE_Byzantine_Events.7.t: "Skutki polityki pronoii w prowincji [Root.GetName]"
 MEE_Byzantine_Events.7.d: "System pronoii był zbiorem zasad, na mocy których wojskowi otrzymywali ziemie na obszarze imperium w zamian za wierną służbę. Politykę tę zastosowano w prowincji [Root.GetName], co doprowadziło do powolnej i dość nieoczekiwanej zmiany jej kultury na grecką."
 MEE_Byzantine_Events.7.a: "Rozumiem."
 MEE_Byzantine_Events.8.t: "Wspomnienie Manzikertu"
 MEE_Byzantine_Events.8.d: "Wreszcie znaczna część Anatolii ponownie znalazła się pod naszym panowaniem. Na wielu z tych ziem pozostawiono tradycyjny osmański system timarów, aby zapewnić stabilność i ułatwić administrację. Ponieważ państwo osmańskie zostało już właściwie unicestwione, możemy teraz zająć się timariami i zdecydować o losie ich ziem oraz o tym, jak potraktować ich dotychczasową służbę sułtanom."
 MEE_Byzantine_Events.8.a: "Pozwólmy posiadaczom timarów zachować ziemie."
 MEE_Byzantine_Events.8.b: "Przekażmy te ziemie greckim pronoiarom."
 MEE_Byzantine_Events.8.c: "Odwróćmy wobec nich system dewszirme."
 MEE_Byzantine_Events.9.t: "Los Masdżid al-Haram"
 MEE_Byzantine_Events.9.d: "Najświętsze miasta islamu są zdane na naszą łaskę. Niegdyś stanowiły centrum działalności naszych najgroźniejszych rywali, dziś są jedynie pionkami w naszych rękach. Oprócz samych miast w naszym zasięgu znajdują się również najświętsze miejsca islamu. Wielu wysokich rangą dowódców proponuje przekształcenie najświętszego meczetu, Masdżid al-Haram, w kościół. Gdyby muzułmanie zdobyli Hagia Sophia, jesteśmy pewni, że postąpiliby tak samo z naszą ukochaną świątynią."
 MEE_Byzantine_Events.9.a: "Zamieńmy meczet w kościół!"
 MEE_Byzantine_Events.9.b: "Pozwólmy muzułmanom nadal odbywać pielgrzymki."
 MEE_Byzantine_Events.10.t: "Cesarstwo Pontyjskie"
 MEE_Byzantine_Events.10.d: "Od zjednoczenia Pontu z resztą imperium minęło już kilka stuleci. Państwo rządzone przez następców obalonej dynastii Komnenów rości sobie prawo do tytułu cesarskiego i desperacko walczy o przetrwanie. Obecnie włada głównie ziemiami Lazów, lecz wkrótce położymy kres jego pretensjom do korony."
 MEE_Byzantine_Events.10.a: "Istnieje tylko jedno Cesarstwo Rzymskie!"
 MEE_Byzantine_Events.11.t: "Mur Heksamilionu"
 MEE_Byzantine_Events.11.d: "Nasi inżynierowie nieprzerwanie dbają od stuleci o sześciomilowy mur na Przesmyku Korynckim. Niestety, wskutek regularnych najazdów osmańskich został on wielokrotnie przełamany, między innymi w 1423 i 1431 roku. Osmanowie żądają zaprzestania odbudowy tych umocnień, lecz takie żądania są nie do przyjęcia."
 MEE_Byzantine_Events.11.a: "Nie ulegniemy Osmanom! Odbudujmy mur."
 MEE_Byzantine_Events.11.b: "Skupmy się na obronie stolicy."
 MEE_Byzantine_Events.12.t: "Nastawienie obronne"
 MEE_Byzantine_Events.12.d: "Można uznać, że Konstantynopol znajduje się w stanie nieustannego oblężenia. Choć obecnie panuje pokój, osmańskie ambicje prędzej czy później doprowadzą do wysłania na miasto hord janczarów. Aby stolica mogła odeprzeć taki atak, musimy naprawić i wzmocnić Mury Teodozjusza."
 MEE_Byzantine_Events.12.a: "Poprośmy Serbów o pomoc."
 MEE_Byzantine_Events.12.b: "Nałóżmy podatki na obywateli — potrzebujemy ich wsparcia."
 MEE_Byzantine_Events.12.c: "Mury nie wymagają naprawy."
 MEE_Byzantine_Events.13.t: "Ukończono ulepszanie muru Heksamilionu"
 MEE_Byzantine_Events.13.d: "Dzięki naszym wysiłkom i znacznemu wsparciu finansowemu udało nam się wzmocnić umocnienia na Przesmyku Korynckim i poprawić ich zdolności obronne."
 MEE_Byzantine_Events.13.a: "Wspaniała wiadomość."
 MEE_Byzantine_Events.14.t: "Ukończono ulepszanie Murów Teodozjusza"
 MEE_Byzantine_Events.14.d: "Ulepszanie potężnych Murów Teodozjusza, chroniących nasze ukochane miasto, dobiegło końca. Nie ma siły, która mogłaby je przełamać — ani trebusz, ani machina oblężnicza. Szkody mogłaby wyrządzić jedynie potężna artyleria, lecz takie działa są rzadkie i kosztowne, a Osmanowie z pewnością nie są w stanie zgromadzić ich w odpowiedniej liczbie."
 MEE_Byzantine_Events.14.a: "Niech Turcy nadchodzą!"
 MEE_Byzantine_Events.15.t: "Bizantyjska prośba"
 MEE_Byzantine_Events.15.d: "Bizantyjczycy wysłali do nas delegację, by wynegocjować wsparcie finansowe na naprawę Murów Teodozjusza. Jako wróg ich wroga powinniśmy poważnie rozważyć tę propozycję, ponieważ po upadku Konstantynopola z pewnością przyjdzie kolej na nas. Wsparcie Rzymian może również zaowocować sojuszem, dzięki któremu otrzymamy pomoc, jeśli Osmanowie zdecydują się na wyprzedzający atak."
 MEE_Byzantine_Events.15.a: "Przekażemy wszystko, co posiadamy."
 MEE_Byzantine_Events.15.b: "Wyślijmy umiarkowaną sumę."
 MEE_Byzantine_Events.15.c: "Możemy przekazać jedynie skromną kwotę."
 MEE_Byzantine_Events.15.e: "Nie zasługują nawet na jednego dukata."
 MEE_Byzantine_Events.16.t: "Patriarcha ekumeniczny Konstantynopola umacnia swój autorytet"
 MEE_Byzantine_Events.16.d: "Po ogłoszeniu autokefalii przez Kościół rosyjski wydawało się, że Kościół wschodni nieuchronnie się rozpadnie i na zawsze pozostanie podzielony między niezależnych biskupów. Stało się jednak inaczej: udało nam się przywrócić patriarsze ekumenicznemu Konstantynopola dawny autorytet i skutecznie skłonić najpotężniejszych hierarchów prawosławnych do podporządkowania się jego woli."
 MEE_Byzantine_Events.16.a: "Uszanujcie jego autorytet albo spotka was kara niebios!"
 MEE_Byzantine_Events.17.t: "Przywrócenie pentarchii"
 MEE_Byzantine_Events.17.d: "Wschodni Kościół prawosławny od stuleci nieustannie podupadał. Zniszczony przez najazdy arabskie i schizmę z 1054 roku, zdawał się już na zawsze utracić pentarchię. Na szczęście ambicja dynastii [Root.Monarch.Dynasty.GetName] pozwoliła ją odbudować, dzięki czemu pięciu patriarchów może ponownie się spotkać i zjednoczyć chrześcijan."
 MEE_Byzantine_Events.17.a: "Wschód znów jest jednością."
 MEE_Byzantine_Events.18.t: "Sobór ekumeniczny"
 MEE_Byzantine_Events.18.d: "Na prośbę [Root.Monarch.GetTitle] wszyscy patriarchowie zebrali się w prowincji [byz_council_prov.GetName], aby omówić sprawy wiary i jedności. Wśród poruszanych tematów znalazły się debata na temat drukowania Biblii, niedawny spór dotyczący doktryny religijnej oraz próba umocnienia władzy patriarchy Konstantynopola."
 MEE_Byzantine_Events.18.a: "Musimy ściśle kontrolować drukowanie ksiąg."
 MEE_Byzantine_Events.18.b: "Musimy rozstrzygnąć spór dotyczący doktryny religijnej."
 MEE_Byzantine_Events.18.c: "Wesprzyjmy patriarchę Konstantynopola."
 MEE_Byzantine_Events.19.t: "Rodzina Notarasów"
 MEE_Byzantine_Events.19.d: "Rodzina Notarasów to znany ród kupiecki wywodzący się z Monemwazji. Jej członkowie dali światu wielu wpływowych kupców podróżujących po odległych zakątkach, lecz najsłynniejszym z nich jest Łukasz Notaras, mianowany megaduksem — głównodowodzącym floty bizantyjskiej."
 MEE_Byzantine_Events.19.a: "Zwerbujmy Łukasza."
 MEE_Byzantine_Events.19.b: "Zwerbujmy wpływowego kupca."
 MEE_Byzantine_Events.21.t: "Bizantyjscy kupcy odzyskują znaczenie"
 MEE_Byzantine_Events.21.d: "Odkąd państwo zaczęło ulegać żądaniom kupców łacińskich, pozycja bizantyjskich handlarzy stawała się coraz słabsza w porównaniu z ich zagranicznymi konkurentami. Na szczęście dzięki polityce państwa udało się odwrócić ten trend, a nasi kupcy stopniowo odzyskują kontrolę nad rynkami krajowymi i zagranicznymi."
 MEE_Byzantine_Events.21.a: "Zainwestujmy w okręty."
 MEE_Byzantine_Events.21.b: "Wynegocjujmy korzystne pożyczki."
 MEE_Byzantine_Events.21.c: "Przyznajmy im więcej swobody!"
 MEE_Byzantine_Events.22.t: "Królewska purpura"
 MEE_Byzantine_Events.22.d: "Purpura tyryjska stała się symbolem Cesarstwa Wschodniorzymskiego. Wraz z poprawą kondycji gospodarczej państwa i rosnącym bogactwem osiągnęliśmy taki poziom zamożności, że nawet nasze granice na królewskich mapach są oznaczane purpurą."
 MEE_Byzantine_Events.22.a: "Zachowajmy nasz kolor!"
 MEE_Byzantine_Events.22.b: "Rozkoszujmy się chwałą."
 MEE_Byzantine_Events.23.t: "Zmiana dobra handlowego"
 MEE_Byzantine_Events.23.d: "Coraz więcej przedstawicieli stanu [Root.GetBurghersName] w prowincji [Root.GetName] zaczyna interesować się nową gałęzią przemysłu. Wielu z nich już rozpoczęło działalność, zakładając nowe cechy i poznając możliwości związane z nowymi produktami. Ta sytuacja może okazać się niezwykle obiecującą szansą."
 MEE_Byzantine_Events.23.a: "Wykorzystajmy tę szansę i rozwijajmy nowe przedsięwzięcia!"
 MEE_Byzantine_Events.23.b: "Obecna gałąź przemysłu jest zbyt cenna."
 MEE_Byzantine_Events.24.t: "Bizantyjscy mozaikarze"
 MEE_Byzantine_Events.24.d: "W czasach złotego wieku nasze miasta roiły się od utalentowanych mozaikarzy. Było ich tak wielu, że wyjeżdżali za granicę, zabierając ze sobą swoje umiejętności. Teraz zjawisko to powraca, a my możemy ułatwić niektórym z nich podróż, otrzymując w zamian korzyści finansowe."
 MEE_Byzantine_Events.24.a: "Wyślijmy ich do naszych przyjaciół w państwie [byz_mosaicists_ally.GetName]."
 MEE_Byzantine_Events.24.b: "Zaoferujmy ich usługi potężnemu państwu [byz_mosaicists_powerful.GetName]."
 MEE_Byzantine_Events.24.c: "Niech skorzysta z ich usług państwo [byz_mosaicists_wealthy.GetName]."
 MEE_Byzantine_Events.24.e: "Potrzebujemy ich usług!"
 MEE_Byzantine_Events.25.t: "Oferta od państwa [From.GetName]"
 MEE_Byzantine_Events.25.d: "Wysłannik z państwa [From.GetName] przybył na dwór [Root.Monarch.GetTitle], oferując usługi tamtejszych mozaikarzy, wysoko cenionych i słynących ze swoich umiejętności. Jeśli przyjmiemy ofertę, ich praca przez wiele lat będzie upiększać najwspanialsze zabytki naszego państwa."
 MEE_Byzantine_Events.25.a: "Przyjmijmy tę propozycję!"
 MEE_Byzantine_Events.25.b: "Nie mamy ani środków, ani woli, by się zgodzić."
 MEE_Byzantine_Events.26.t: "Rosnący zagraniczny popyt na jedwab"
 MEE_Byzantine_Events.26.d: "Sława rzymskich jedwabi w całej Europie Zachodniej jest zjawiskiem powszechnie znanym. Niestety, wraz z upadkiem imperium osłabła również jego zdolność do wyznaczania trendów w zagranicznej modzie. Co gorsza, w dziesięcioleciach poprzedzających XV wiek prestiż zagranicznych tkanin i jedwabi przewyższył prestiż naszych wyrobów. Na szczęście udało nam się odwrócić ten trend i nasze jedwabie ponownie wyznaczają standardy. Doprowadziło to do gwałtownego wzrostu popytu, a w konsekwencji także cen."
 MEE_Byzantine_Events.26.a: "Oczywiście!"
 MEE_Byzantine_Events.27.t: "Temy"
 MEE_Byzantine_Events.27.d: "System temów służy nam od VII wieku i przetrwał do dziś, choć wskutek terytorialnego upadku imperium funkcjonuje w ograniczonej skali. Ponieważ odzyskiwanie ziem Cesarstwa Wschodniorzymskiego jest już w toku, warto ponownie wyznaczyć granice temów i dostosować je do nowych warunków."
 MEE_Byzantine_Events.27.a: "Zreformujmy go!"
 MEE_Byzantine_Events.27.b: "To jeszcze nie czas."
 MEE_Byzantine_Events.28.t: "Wybór ścieżki misji rozgałęziających się"
 MEE_Byzantine_Events.28.d: "Nasza armia znalazła się na rozdrożu. W przeszłości podejmowaliśmy wiele decyzji dotyczących zarządzania wojskiem, dlatego mamy już wzorce, którymi możemy się kierować, jeśli zdecydujemy się na model scentralizowany lub zdecentralizowany."
 MEE_Byzantine_Events.28.a: "Dokonaliśmy wyboru."
 MEE_Byzantine_Events.28.b: "Być może lepiej będzie postawić na bogactwo."
 MEE_Byzantine_Events.28.c: "Uzależnienie od najemników okazało się katastrofalne!"
 MEE_Byzantine_Events.28.e: "Muszę skonsultować się ze Strategikonem."
 MEE_Byzantine_Events.29.t: "Przyszłość systemu pronoii"
 MEE_Byzantine_Events.29.d: "System pronoii polega na nadawaniu ziem różnym osobom i instytucjom, w tym klasztorom, urzędnikom państwowym, a przede wszystkim wojskowym. To właśnie żołnierze i generałowie zawsze odgrywali w nim najważniejszą rolę. Nadania pronoii przyznawano jako nagrodę za służbę i sposób zapewnienia dalszej lojalności. Początkowo nie były dziedziczne, lecz z czasem stały się dziedziczne. W miarę dalszego istnienia naszego państwa system ten ewoluuje, ostatnio przejmując niektóre rozwiązania z osmańskiego systemu timarów."
 MEE_Byzantine_Events.29.a: "Musimy przygotować się do nadania kolejnych ziem."
 MEE_Byzantine_Events.29.b: "Włączmy wojska pronoiarów do naszych sił zbrojnych."
 MEE_Byzantine_Events.29.c: "Pozwólmy im samodzielnie o siebie zadbać."
 MEE_Byzantine_Events.30.t: "Przyszłość systemu pronoii"
 MEE_Byzantine_Events.30.d: "System pronoii polega na nadawaniu ziem różnym osobom i instytucjom, w tym klasztorom, urzędnikom państwowym, a przede wszystkim wojskowym. To właśnie żołnierze i generałowie zawsze odgrywali w nim najważniejszą rolę. Nadania pronoii przyznawano jako nagrodę za służbę i sposób zapewnienia dalszej lojalności. Początkowo nie były dziedziczne, lecz z czasem stały się dziedziczne. W miarę dalszego istnienia naszego państwa system ten ewoluuje, ostatnio przejmując niektóre rozwiązania z osmańskiego systemu timarów."
 MEE_Byzantine_Events.30.a: "Musimy zakończyć ich dziedziczne przywileje."
 MEE_Byzantine_Events.30.b: "Skupmy się na prawach dziedziczenia."
 MEE_Byzantine_Events.30.c: "Przekażmy te ziemie utalentowanym generałom."
 MEE_Byzantine_Events.30.e: "Nadajmy je zawodowym żołnierzom."
