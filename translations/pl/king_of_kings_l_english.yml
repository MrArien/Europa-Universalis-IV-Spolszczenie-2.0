 estate_burghers_persian_rugs: "Promowanie perskich dywanów"
 estate_burghers_persian_rugs_desc: "Perskie dywany są niezwykle poszukiwane na rynkach. Pozwalając [Root.GetBurghersName] swobodnie zarządzać procesem produkcji, możemy zagwarantować, że nasi tkacze zaspokoją popyt."
 estate_burghers_persian_rugs_tt: "Każda posiadana prowincja produkująca §Ytkaniny§!, §Yjedwab§! lub §Ybarwniki§! otrzymuje następujące efekty:"
 estate_burghers_persian_rugs_modifier: "Promowanie perskich dywanów"
