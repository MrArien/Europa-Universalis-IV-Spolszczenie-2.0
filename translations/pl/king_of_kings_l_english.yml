 mam_sponsor_hajj_title: "Sponsoruj wielki hadżdż"
 mam_sponsor_hajj_desc: "Czy chcemy sfinansować wielki hadżdż dla władcy państwa [From.GetName]? Będzie nas to kosztować §Y50§! £dip£ oraz §Y200§! ¤. Poprawią się stosunki między naszymi §Yszkołami prawa islamskiego§!. Otrzymają oni następujące korzyści:\\nJeśli będzie to możliwe, zyskają §Y25%§! pobożności na obecnej ścieżce.\\nPrawowitość lub pobożność: §G+10§!\\nWzajemne zaufanie: §G+10§! \\n\\nZyskamy §G20§! lojalności naszego stanu [Root.GetClergyName]."
