 arm_church_east_insight_tt: "\n§GInformacja o wydarzeniu:§!\nWydarzenie ustanowi w Bagdadzie koptyjskie centrum nawracania, które przez 30 lat będzie nawracać pobliskie prowincje na koptyzm."
