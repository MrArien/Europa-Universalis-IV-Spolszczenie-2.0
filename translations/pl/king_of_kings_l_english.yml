 send_royal_ambassador_tt: "To działanie dyplomatyczne pozwala wykorzystać §Yperskie wpływy§! (§Ościeżka muzułmańska§!) lub §YAsha Wahišta§! (§Ościeżka zaratusztriańska§!), aby zwiększyć opinię wybranego państwa o nas o §G+50§! na §Y5 lat§!."
