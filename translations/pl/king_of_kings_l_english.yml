 desc_ARB_port_in_jeddah: "Port w Dżuddzie ułatwia rozwój miejscowej prowincji."
 desc_ARB_naval_routes: "Szlaki morskie prowadzące przez główny port miasta usprawniają zaopatrzenie i przepływ towarów."
 desc_ARB_increased_pilgrim_traction: "Miasto odwiedza coraz większa liczba pielgrzymów."
 desc_ARB_well_managed: "Miastem zarządzają kompetentni zarządcy wybrani przez panującą dynastię."
 desc_ARB_stewards_of_the_two_cities: "Zyskaliśmy reputację dobrych opiekunów świętych miast islamu."
 desc_ARB_mahd_adh_dhahab: "Starożytna kopalnia złota położona w pobliżu Medyny."
 desc_ARB_guarantors_of_peace: "Państwo to gwarantuje pokój i bezpieczeństwo mieszkańcom świętych miast islamu."
 desc_ARB_guarantors_of_peace_not_muslim: "Państwo to gwarantuje pokój i bezpieczeństwo mieszkańcom świętych miast islamu."
 desc_ARB_support_of_the_ulema: "Nasz mecenat nad uczonymi uczynił z nas ośrodek wspierający ulemów."
 desc_ARB_welcoming_the_sufis: "Nasz region słynął z powszechnej niechęci do bractw sufickich. Zmiana tego nastawienia jest szczerym i pozytywnym zaskoczeniem."
 desc_ARB_following_teachings_of_old: "Przywiązanie do tradycji zyskało nam przychylność wielu konserwatywnych uczonych."
 desc_ARB_support_of_local_sheikhs: "Udało nam się zyskać przychylność miejscowych szejków, których świty nieustannie wzmacniają nasze maszerujące wojska."
 desc_ABR_train_horsemanship_modifier_upgraded: "Niewielu jeźdźców dorównuje naszym umiejętnościom, a niewiele ras koni jest równie niezawodnych i przydatnych na wojnie. Musimy nieustannie doskonalić sztukę jazdy konnej poprzez zawody, szkolenia, drobne wyprawy łupieżcze, a nawet sam udział w wojnach."
 desc_ARB_muslim_enforced_religion_buff: "Nie możemy tolerować heretyków w naszym państwie. Surowy zbiór praw wymierzonych we wszystkich wyznawców tradycji fałszywych imamów i kapłanów pozwolił nam zmarginalizować wpływy herezji w naszym społeczeństwie."
 desc_ARB_estate_burghers_arid_climate_development: "Klimat tej prowincji przypomina warunki, do których przywykło wielu budowniczych miast w naszej ojczyźnie."
 desc_ARB_estate_burghers_desert: "Surowy, pustynny teren tej prowincji nie jest nam obcy."
 desc_ARB_oasis_city_on_stop_to_mecca: "Pomimo surowego terenu w prowincji znajduje się duże miasto pośród wydm, często odwiedzane przez pielgrzymów udających się na hadżdż."
 desc_ARB_oasis_city_on_stop_to_mecca_2: "Pomimo surowego terenu w prowincji znajduje się duże miasto pośród wydm, często odwiedzane przez pielgrzymów udających się na hadżdż."
 desc_ARB_local_madrasa: "W prowincji znajduje się medresa, która wspiera rozwój wiedzy w całym świecie muzułmańskim."
 desc_ABR_safety_for_the_caravans: "Nasza polityka ochrony karawan zachęciła znacznie więcej kupców i podróżnych do przemierzania naszych ziem."
 desc_ARB_social_cohesion: "Plemienne waśnie, choć krwawe, okazują się najskuteczniejszym sposobem rozwiązywania sporów."
 desc_ARB_holders_of_the_two_cities: "Nasza pozycja opiekunów Świętych Miast zapewniła nam szczególną popularność wśród muzułmanów."
 desc_ARB_allegiance_of_the_oases: "Pomimo słabej kontroli nad regionem poszczególne miasta-oazy pozostają lojalne, choć są od siebie odizolowane."
 desc_ARB_felicitous_arabia: "Prowincja jest pełna dolin i wzgórz, dzięki czemu panuje tu łagodniejszy klimat niż w pozostałych częściach Arabii."
 desc_ARB_northern_citadel: "W miejscowym mieście znajduje się potężna twierdza obronna, której zdobycie byłoby nie lada wyzwaniem."
 desc_ARB_dhimmi_self_government: "Przyznaliśmy Ludowi Księgi prawo do samodzielnego zarządzania się w naszym imieniu."
 desc_ARB_claiming_title_of_caliph: "Choć może się to wydawać zuchwałe, ogłosiliśmy się kalifem — duchowym i świeckim przywódcą całego islamu."
 desc_ARB_united_islam_upgraded: "Islam został zjednoczony pod rządami naszego prawowitego kalifatu."
 desc_ARB_reconquest_of_sicily: "Odzyskaliśmy Sycylię — ziemię niegdyś muzułmańską, którą przed wiekami odebrali nam chrześcijanie."
 desc_ARB_mosque_of_kairouan: "Meczet i święte miasto Kairuan są bezpośrednim dziedzictwem podboju Maghrebu przez wojska kalifów prawowiernych przed wiekami. Jako jeden z miast-twierdz, które z czasem zyskały na znaczeniu, Kairuan wymaga odpowiedniej opieki."
 desc_ARB_second_islamic_golden_age_modifier: "Nasze państwo ponownie przeżywa drugi złoty wiek islamu. Jest domem dla wielu uczonych i erudytów, którzy poszerzają wiedzę we wszystkich znanych ludzkości dziedzinach."
 desc_ARB_alhambra_diplo_annex_cost: "Alhambra jest jednym z symboli muzułmańskiego panowania w Hiszpanii."
 desc_ARB_rekindling_the_flames: "Przywracamy tolerancję Umajjadów i rozkwit nauki, które charakteryzowały ich złoty wiek."
 desc_ARB_highway_of_the_martyrs: "Upamiętniamy bitwę pod Tours, w której pierwotny dżihad przeciwko Europie zakończył się katastrofalną klęską. Tym razem będzie inaczej."
 desc_ARB_reroute_the_trade_north: "Przekierowujemy kupców z Indii ku Morzu Czerwonemu i Zatoce Perskiej."
 desc_ARB_the_caliphate_rises: "Pomimo wszelkich przeciwności nasze państwo rośnie w siłę, a roszczenia do tytułu kalifa spotykają się z coraz większym szacunkiem."
 desc_ARB_only_rightful_caliphs: "Pokonaliśmy najpotężniejszego przeciwnika i udowodniliśmy całemu dar al-Islam, że to my jesteśmy prawowitymi kalifami."
 desc_ARB_reconnected_with_shiite_stronghold: "Ponownie nawiązaliśmy więzi z Persją, gdzie żyje liczna społeczność szyicka."
 desc_ARB_conquered_the_shiite_stronghold: "Podbiliśmy Persję, szyicką twierdzę, którą Safawidzi próbowali uczynić swoją główną siedzibą."
 desc_ARB_eastern_flank: "Zabezpieczyliśmy góry Zagros, chroniąc się przed atakiem na tyły i umożliwiając skupienie sił na obronie pozostałych granic."
 desc_ARB_supporting_islam_in_indian_realm: "Islam na Wschodzie, choć silnie synkretyczny i mistyczny, nadal zasługuje na nasze pełne wsparcie."
 desc_ARB_hanbali_scholars: "Zastąpiliśmy uczonych Al-Azharu przedstawicielami szkoły hanbalickiej."
