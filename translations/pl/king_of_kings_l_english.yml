 BYZ_pronoia_subject_explanation: "§YPronoiarowie§! to unikalny typ państwa zależnego dostępny dla państw §Y[BYZ.GetName]§! i §Y[ROM.GetName]§!.\n\nPaństwo może posiadać tylko ograniczoną liczbę §Ypronoiarów§!, określaną przez modyfikator §YLiczba pronoiarów§!. Można ją zwiększać za pomocą §Ygrup idei§!, §Yreform rządowych§! oraz za każde 100 punktów §Ylimitu sił lądowych§!. Oznacza to również, że §Ypronoiarowie§! nie zajmują §Ystosunków dyplomatycznych§!.\n\nPronoiarowie to typ państw zależnych stworzony z myślą o wspieraniu wysiłku wojennego suwerena. Domyślnie każdy pronoiar zmniejsza limit sił lądowych suwerena o §R-5§!, zapewniając mu jednocześnie §G+10,0%§! limitu sił zbrojnych oraz §G+20,0%§! zasobów ludzkich i marynarzy. Ponadto pronoiarowie otrzymują znaczne premie do kosztu regimentów i globalnych zasobów ludzkich, ale także dotkliwe kary do kosztu tworzenia rdzeni i wpływu nadmiernej ekspansji.\n\nAby zaanektować §Ydziedzicznego pronoiara§!, należy najpierw przekształcić go w zwykłego §Ypronoiara§! za pomocą działania dyplomatycznego «§YCofnij prawo do dziedziczenia§!». Zwykły §Ypronoiar§! zostanie włączony do państwa suwerena po śmierci swojego monarchy."
