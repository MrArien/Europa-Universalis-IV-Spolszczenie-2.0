 georgian_crisis: "Kryzys gruziński"
 georgian_crisis.1.t: "Kryzys Gruziński"
 georgian_crisis.1.d: "W słabo oświetlonych salach naszego królewskiego pałacu wciąż rozbrzmiewają ponure echa nieudanych prób przywrócenia porządku przez króla, przypominając nam o trudnym położeniu Gruzji. Z każdym dniem władza korony słabnie, a jej blask przyćmiewają polityczne porażki i narastający chaos. Z zachodu docierają wieści, że Demetriusz gromadzi wokół siebie możnowładców, których słowa kipią niezadowoleniem i ambicją. Jego pretensje do tronu stają się coraz głośniejsze i śmielsze, podsycając widmo nieuchronnego konfliktu. Inni możnowładcy, niegdyś wierni zwolennicy korony, również po cichu spiskują, a ich lojalność chwieje się w obliczu niepewności. Wygląda na to, że obawiany kryzys właśnie nadszedł. Nasze królestwo jest podzielone i stoi na krawędzi wojny domowej, dlatego rozpaczliwie potrzebujemy zdecydowanego działania. Czy odzyskamy kontrolę, czy pozwolimy, by korona wymknęła nam się z rąk?"
 georgian_crisis.1.a: "Będziemy walczyć o należną nam władzę!"
 georgian_crisis.2.t: "Przywrócenie porządku"
 georgian_crisis.2.d: "Gorzkie echa buntu wreszcie ucichły. Po pokonaniu Demetriusza i jego ambitnych możnowładców w Gruzji zapanował spokój. Władza króla, niegdyś chwiejąca się na krawędzi upadku, ponownie jest niezachwiana. Nad zamkiem dumnie powiewa królewski sztandar, symbol naszego ciężko wywalczonego zwycięstwa i odzyskanej kontroli. Możnowładcy, którzy próbowali wykorzystać słabość korony, teraz ze spuszczonymi głowami uznają porażkę, a ich marzenia o autonomii zostały zdławione siłą naszych zjednoczonych wojsk. Ogień rebelii wygasł, a autorytet naszego króla nie podlega już kwestionowaniu."
 georgian_crisis.2.a: "Zwyciężyliśmy!"
 georgian_crisis.3.t: "Atabegowie ogłaszają secesję"
 georgian_crisis.3.d: "W samym środku gruzińskiego kryzysu do naszego dworu przybywa posłaniec z południowo-zachodnich rubieży królestwa. Przynosi wiadomość od atabegów Samcche, a jego ponura mina nie wróży niczego dobrego. Atabegowie ogłosili niepodległość, nie chcąc dłużej podlegać słabnącym rządom dynastii Bagrationich. Ten zuchwały krok dobitnie pokazuje, jak wielkie szkody wyrządziły nasze wewnętrzne konflikty. Separatyści dostrzegli w osłabieniu królestwa okazję do ustanowienia własnej władzy, wolnej od ograniczeń narzucanych przez władzę centralną. To dotkliwy cios dla naszej suwerenności, który dodatkowo komplikuje sytuację w obliczu kryzysu. Nasza odpowiedź na tę zniewagę będzie miała dalekosiężne konsekwencje dla przyszłości królestwa."
 georgian_crisis.3.a: "Przeklęci zdrajcy!"
 georgian_crisis.3.b: "Nic nie możemy zrobić..."
 georgian_crisis.4.t: "Imeretia ogłasza niepodległość"
 georgian_crisis.4.d: "Wśród odgłosów walk pojawia się nowy, niepokojący sygnał: proklamacja niepodległego Królestwa Imeretii. Demetriusz Bagrationi, rodzony brat naszego króla, najwyraźniej postanowił przekuć swoje ambicje w czyn. Jako władca zachodniej Gruzji jego decyzja stanowi poważne i bezpośrednie wyzwanie dla naszej chwiejącej się władzy. Jego wezwanie do niepodległości rozbrzmiewa w całym królestwie, szerząc niezgodę i zachęcając kolejnych separatystów. Więzi, które niegdyś spajały nasze królestwo, rozpadają się w alarmującym tempie, a lojalność zostaje przecięta ostrzem ambicji. W obliczu grożącego nam rozbicia państwa musimy podjąć niezwykle trudną decyzję."
 georgian_crisis.4.a: "Zbierzmy wojska! Demetriusz zapłaci za zdradę!"
 georgian_crisis.4.b: "Sprawa jest przegrana..."
 georgia_constantinople_title: "Przenieść stolicę do Konstantynopola"
 georgia_constantinople_desc: "W przełomowym zwrocie wydarzeń dzielny naród gruziński zwyciężył w kampanii mającej na celu odzyskanie Konstantynopola, przywracając starożytny tron Cesarstwa Rzymskiego. Jako nowi opiekunowie tego historycznego miasta musimy podjąć ważną decyzję: czy przypieczętujemy nasze wspaniałe zwycięstwo, przenosząc stolicę do Konstantynopola i umacniając panowanie Gruzji nad symbolicznym sercem imperium?"
 flavor_geo.1.t: "Niespokojne królestwo"
 flavor_geo.1.d: "Gruzja, niegdyś potężne państwo i niekwestionowany hegemon Kaukazu, na przestrzeni wieków znacznie podupadła i utraciła dawną pozycję. Okres prosperity gwałtownie zakończyły najazdy Mongołów, Turków i Timura, rozpoczynając nieustanną walkę o przetrwanie. Osłabieniu państwa towarzyszył kryzys gospodarczy, a zdesperowana szlachta zaczęła domagać się coraz liczniejszych przywilejów.\n\nPróbując rozwiązać ten problem, król Aleksander I, wzorem dawnej tradycji bizantyjskiej, ustanowił swoich trzech synów współwładcami. W ten sposób powstał wyjątkowy system zwany triarchią, w którym synowie wspólnie sprawowali władzę nad królestwem. Układ ten nie przetrwał jednak długo: w 1442 roku Aleksander zrzekł się tronu i zamknął się w klasztorze.\n\nJego najstarszy syn Wachtang objął tron, lecz nie doczekał się następcy. Możnowładcy i jego bracia cierpliwie czekają więc na okazję, by samemu sięgnąć po koronę. Przyszłość naszego królestwa pozostaje zatem niepewna."
 flavor_geo.1.a: "Zwyciężymy!"
 flavor_geo.2.t: "Dziedzice Rzymian"
 flavor_geo.2.d: "Przez stulecia Cesarstwo Bizantyjskie dzielnie broniło Konstantynopola, lecz dziś płomień bizantyjskiej chwały przygasa. Nadszedł czas, by Gruzja przejęła tę spuściznę, dokonała tego, czemu inni nie sprostali, i stworzyła nowe dziedzictwo na fundamencie dawnego Rzymu. Gruzińska rekonkwista ma doprowadzić do triumfalnego powrotu do Konstantynopola i narodzin nowej epoki rzymskiej, w której na tronie zasiądzie gruziński władca kierujący się sprawiedliwością, siłą i niezachwianą wiarą. Dzięki niezłomnemu duchowi i potędze militarnej Gruzja stanie się ostoją świata prawosławnego. Nowe rzymskie dziedzictwo, ukształtowane rękami Gruzinów, na nowo rozpali płomień bizantyjskiej chwały i tchnie życie w wiarę prawosławną. Mury Konstantynopola, znajdujące się teraz pod gruzińską opieką, oprą się każdemu atakowi i staną się niezdobytą twierdzą, która przez pokolenia będzie budzić nadzieję i strzec prawosławnego dziedzictwa. Cały świat z zapartym tchem obserwuje rozwój tych historycznych wydarzeń."
 flavor_geo.2.a: "Feniks powstaje z popiołów!"
 flavor_geo.3.t: "Upadek Saraju"
 flavor_geo.3.d: "Dotarliśmy do samego serca Wielkiej Ordy. Wielkie miasto chana padło, kładąc kres jarzmu tatarskiemu i panowaniu ordy nad stepem. Plaga, która przez wiele lat zagrażała światu chrześcijańskiemu i zmuszała niezliczone narody do uległości, należy już do przeszłości. Nasi dzielni żołnierze, spragnieni zemsty, czekają jedynie na rozkaz, by podpalić miasto i zamienić je w tlące się ruiny, które ponownie pochłonie step."
 flavor_geo.3.a: "Spalić je doszczętnie!"
 flavor_geo.3.b: "Zabrać łupy do [Root.Capital.GetName]"
 flavor_geo.3.c: "Oszczędzić miasto"
 flavor_geo.4.t: "Giorgi Saakadze"
 flavor_geo.4.d: "Gdy nad gruzińskimi ziemiami wieją wiatry zmian, na kartach historii rozbrzmiewa pewne nazwisko: Giorgi Saakadze. Urodzony około 1570 roku, Saakadze piął się po szczeblach kariery, aż został wybitnym dowódcą wojskowym i mężem stanu. Znany z niezłomnego ducha i niezwykłych zdolności przywódczych, odniósł szereg zwycięstw nad potężnymi przeciwnikami, broniąc Gruzji przed nieustannymi najazdami Persów i Osmanów. Jego służba u Safawidów i Osmanów budziła kontrowersje, krytykę i podziały wśród współczesnych mu ludzi, lecz doświadczenia zdobyte na dworach obcych potęg dały mu wyjątkową perspektywę i ogromną wiedzę. Nadszedł czas, by oddać hołd tej niezwykłej postaci. Jak powinniśmy uczcić dziedzictwo Giorgiego Saakadze? Mamy dwie możliwości:"
 flavor_geo.4.a: "Mianować go generałem"
 flavor_geo.4.b: "Zatrudnić go jako doradcę"
 flavor_geo.5.t: "Sulkhan-Saba Orbeliani"
 flavor_geo.5.d: "Wśród gruzińskich intelektualistów i ludzi kultury szczególne miejsce zajmuje Sulkhan-Saba Orbeliani, uosabiający ducha oświecenia, literacki talent i głęboką pasję zachowania dziedzictwa dumnego narodu. Uważany za jednego z najwybitniejszych umysłów swojej epoki, pozostawił trwały ślad w historii Gruzji. Jego dzieła, pełne elokwencji i głębi, oddawały istotę gruzińskiego folkloru, tradycji i samej duszy narodu. Jego wybitny wkład w etnografię i badania nad folklorem nie tylko świadczy o bogactwie gruzińskiego dziedzictwa, lecz także odegrał kluczową rolę w zachowaniu i odrodzeniu tożsamości kulturowej w czasach obcych wpływów. Jak powinniśmy uhonorować tego człowieka?"
 flavor_geo.5.a: "Zaprosić go na dwór królewski"
 flavor_geo.5.b: "Wykorzystamy jego talenty gdzie indziej"
 flavor_geo.6.t: "Niepokoje w Samcche"
 flavor_geo.6.d: "Z rozległych obszarów Gruzji docierają do nas wieści o nieładzie i chaosie. Kryzys polityczny nękający władzę centralną nie umknął uwadze atabegów Samcche. Spoglądają na nasze osłabienie z nową śmiałością i wyzywającym błyskiem w oczach. Szepty niezadowolenia przeradzają się w głośne protesty, a atabegowie potępiają niestabilne rządy i swoje podporządkowanie. Ich lojalność, niegdyś niepodważalna, chwieje się teraz na ostrzu miecza, a pragnienie autonomii grozi wymknięciem się spod kontroli."
 flavor_geo.6.a: "Musimy ponownie umocnić naszą władzę!"
 flavor_geo.6.b: "Niech spróbują..."
 flavor_geo.7.t: "Ambicje Demetriusza"
 flavor_geo.7.d: "Do naszego dworu przybywa posłaniec, zdyszany i zlany potem, niosąc list opatrzony pieczęcią zachodniej Gruzji. Nadawcą jest sam Demetriusz, brat naszego króla Wachtanga. W liście prosi — a właściwie żąda — znacznego zwiększenia autonomii swoich ziem oraz długiej listy przywilejów dla miejscowych możnowładców. Nie ulega wątpliwości, że Demetriusz i jego stronnicy wykorzystują słabość władzy centralnej oraz niepewną przyszłość sukcesji po królu Wachtangu. Ich zuchwałe żądania świadczą o wielkich ambicjach i ledwie skrywanej chęci wyrwania się spod władzy korony. Jak powinniśmy odpowiedzieć na to jawne podważenie naszego autorytetu?"
 flavor_geo.7.a: "Dla zachowania pokoju spełnijmy ich żądania"
 flavor_geo.7.b: "Odrzućmy ich żądania"
 arm_egypt_title: "Odrodzenie Kościoła koptyjskiego"
 arm_egypt_desc: "W czasach dawnej potęgi i chwały Kościół koptyjski stanowił fundament wiary i kultury Egiptu. Jednak stulecia obcego panowania doprowadziły do marginalizacji wspólnoty koptyjskiej, a wpływy niegdyś potężnego Kościoła znacznie osłabły. Nasza ormiańska krucjata ma na celu nie tylko wyzwolenie, lecz także odnowienie duchowego serca wspólnoty koptyjskiej. Przywróćmy Kościołowi koptyjskiemu dawną chwałę i zapewnijmy Koptom ponowne zajęcie należnego im miejsca w Egipcie."
 arm_jerusalem_title: "Opanować Ziemię Świętą"
 arm_jerusalem_desc: "Ziemia Święta od zawsze stanowiła centrum świata chrześcijańskiego. Obecnie znajduje się jednak pod kontrolą sił, które nie podzielają naszej wiary ani czci dla tych świętych ziem. Jerozolima, symboliczne serce chrześcijaństwa, musi powrócić w ręce chrześcijan."
 arm_mamluks_title: "Wyprawa do Lewantu"
 arm_mamluks_desc: "Mamelucy, którzy obecnie władają Lewantem, są potężną siłą w regionie. Stanowią poważną przeszkodę na drodze do realizacji naszego świętego celu, jakim jest szerzenie wiary chrześcijańskiej. Ich rządy nie tylko utrudniają naszą misję religijną, lecz także zagrażają równowadze sił w regionie. Krucjata przeciwko nim, choć trudna, jest jedyną drogą naprzód."
 arm_proclaim_great_armenia_title: "Proklamować Wielką Armenię"
 arm_proclaim_great_armenia_desc: "Nasze wielkie państwo przebyło długą drogę: stawiło czoła potężnym wrogom, odzyskało ziemie ważne dla naszej wiary i przywróciło należne miejsce naszej religii. Pozostało jednak zadanie, które przybliży nas do korzeni i zapoczątkuje nową erę dobrobytu — odzyskanie ziem naszych przodków. Prowincje utracone przed wiekami to nie tylko terytoria, lecz także serce i dusza ormiańskiej tożsamości. Dopiero gdy zjednoczymy je pod naszym panowaniem, będziemy mogli powiedzieć, że Armenia odzyskała dawną chwałę. Droga do tego celu będzie pełna wyzwań, lecz po jej przebyciu będziemy mogli z dumą ogłosić narodziny Wielkiej Armenii i początek nowego złotego wieku."
 arm_liberation_of_the_homeland_title: "Wyzwolenie ojczyzny"
 arm_liberation_of_the_homeland_desc: "Turkmeńskie plemię Kara Kojunlu, zwane również Turkomanami Czarnej Owcy, od dawna najeżdża nasze ziemie przodków i obecnie kontroluje znaczną część historycznej Armenii. Wyzwolenie tych ziem i uwolnienie naszych braci spod ich panowania jest kwestią narodowej dumy i obowiązku. Odzyskanie ojczyzny to klucz do spełnienia marzenia o zjednoczonej Wielkiej Armenii."
 arm_restore_armenian_cilicia_title: "Odrodzenie Cylicji"
 arm_restore_armenian_cilicia_desc: "W południowo-wschodniej części Anatolii, gdzie potężne góry Taurus spotykają się z lazurowymi wodami Morza Śródziemnego, leży starożytna kraina Cylicji. Niegdyś znajdowało się tu kwitnące ormiańskie królestwo, będące ostoją ormiańskiej kultury i potęgi. Nadszedł czas, by wskrzesić ducha Królestwa Cylicji i ponownie zasiedlić ten region naszym ludem."
 arm_break_osmans_legacy_title: "Zburzyć dziedzictwo Osmana"
 arm_break_osmans_legacy_desc: "Powstanie Imperium Osmańskiego radykalnie zmieniło układ sił w Anatolii. Osmanowie rozszerzyli swoje panowanie na rozległe obszary i ustanowili hegemonię, która zahamowała rozwój oraz niezależność wielu narodów, w tym naszego. Każde imperium ma jednak swój zmierzch. Nadszedł czas, by rzucić wyzwanie Osmanom i położyć kres dziedzictwu Osmana."
 arm_bagrationi_union_title: "Unia Bagrationich"
 arm_bagrationi_union_desc: "Gruzja, nasz północny sąsiad i wieloletni sojusznik, stoi na krawędzi wojny domowej. Rywalizujące stronnictwa walczą o władzę, zagrażając jedności i stabilności niegdyś kwitnącego państwa. Nie możemy bezczynnie przyglądać się, jak nasi bracia w wierze pogrążają się w chaosie."
 arm_office_of_sparapet_title: "Urząd sparapeta"
 arm_office_of_sparapet_desc: "Urząd sparapeta, naczelnego dowódcy naszych sił zbrojnych, jest symbolem tradycji wojskowej i wytrwałości naszego narodu. Stojąc u progu nowej epoki, musimy przywrócić tę zaszczytną godność, by poprowadziła nasze wojska i całe państwo ku nowej chwale."
 arm_refine_the_nakharar_title: "Zreformować system nakhararów"
 arm_refine_the_nakharar_desc: "System nakhararów, odwieczna instytucja stanowiąca fundament naszego społeczeństwa, wymaga reform, by sprostać zmieniającym się potrzebom rozwijającego się państwa. Nasi nakhararowie, czyli możnowładcy, muszą być kimś więcej niż tylko właścicielami ziemskimi. Powinni stać się filarami silnego, scentralizowanego państwa, wspierającymi dobro wspólne obok realizacji własnych interesów."
 arm_holy_sites_title: "Opanować święte miejsca"
 arm_holy_sites_desc: "Chrześcijaństwo wschodnie od zbyt dawna znosi konflikty i obce panowanie. Nasze święte miejsca — od Aleksandrii, centrum koptyjskiego prawosławia, po Aleppo, miasto o głębokim chrześcijańskim dziedzictwie — wciąż pozostają pod obcą kontrolą. Naszym obowiązkiem jest odzyskać i ochronić te uświęcone ziemie."
 arm_etchmiadzin_cathedral_title: "Katedra w Eczmiadzynie"
 arm_etchmiadzin_cathedral_desc: "Katedra w Eczmiadzynie, będąca symbolem naszej wiary i historii, przetrwała liczne próby, świadcząc o niezłomności narodu ormiańskiego. Czas i konflikty odcisnęły jednak piętno na tej świętej budowli. Podobnie jak nasz naród, katedra potrzebuje odbudowy i odnowy."
 arm_ecclesiastical_revival_title: "Odrodzenie kościelne"
 arm_ecclesiastical_revival_desc: "Przez stulecia Ormiański Kościół Apostolski pozostawał symbolem niezłomnej wiary i ducha naszego narodu, mimo że podlegał obcym władcom. Teraz, gdy nasze państwo odradza się, nadszedł czas na odnowę życia kościelnego. Kościół powinien ponownie stać się filarem siły i przewodnikiem naszego ludu."
 arm_caspian_riches_title: "Bogactwa Morza Kaspijskiego"
 arm_caspian_riches_desc: "Morze Kaspijskie od tysiącleci stanowi węzeł handlu i wymiany kulturowej, łącząc wschód z zachodem oraz północ z południem. Zbyt długo odmawiano nam dostępu do jego bogactw i możliwości, jakie oferuje. Nadszedł czas, by zająć należne nam miejsce na jego wybrzeżach i czerpać z obfitych zasobów tego akwenu."
 arm_breaking_the_chains_title: "Zerwać kajdany"
 arm_breaking_the_chains_desc: "Przez zdecydowanie zbyt długi czas nasz wielki naród pozostawał pod jarzmem turkmeńskiego Kara Kojunlu. Nasi ludzie cierpieli pod ich rządami, a kajdany poddaństwa ciążyły na duchu narodowym. Dość tego. Nadszedł czas, by powstać, walczyć o niepodległość i skruszyć więzy, które nas krępują."
 arm_rebuild_tigranakert_title: "Odbudować Tigranakert"
 arm_rebuild_tigranakert_desc: "Tigranakert, nazwany na cześć naszego słynnego króla Tigranesa Wielkiego, był niegdyś perłą ormiańskiej kultury i potęgi, uosobieniem naszego złotego wieku. Upływ czasu i konflikty obróciły jednak to kwitnące miasto w ruinę. Dziedzictwo naszych przodków przemawia do nas z tych kamieni i wzywa, by przywrócić Tigranakert dawną świetność."
 arm_artaxiad_legacy_title: "Dziedzictwo Artaksydów"
 arm_artaxiad_legacy_desc: "Artaksydzi, jedna z najwspanialszych dynastii w historii Armenii, władali rozległym imperium sięgającym daleko poza nasze obecne granice, aż po samą Persję. Uosabiali potęgę i splendor naszego narodu w jego najlepszych czasach. Naszym obowiązkiem jest uczcić ich dziedzictwo i odzyskać terytoria niegdyś należące do Armenii. Persja, bogata w kulturę i zasoby, od wieków stanowi pole walki wielkich imperiów. Nadszedł czas, by zaznaczyć tam naszą obecność. Musimy przygotować się do wyprawy na Persję, kierując się ambicją rozszerzenia granic, umocnienia wpływów i odzyskania chwały epoki Artaksydów."
 arm_resettle_ancestral_homeland_title: "Ponownie zasiedlić ziemie przodków"
 arm_resettle_ancestral_homeland_desc: "Przez stulecia Ormianie rozpraszali się po całym świecie, tworząc bogatą i prężną diasporę. Jednak tęsknota za ojczyzną rozbrzmiewa w sercu każdego Ormianina, niezależnie od tego, jak daleko od niej przebywa. Nadszedł czas, by nasza diaspora zjednoczyła się i ponownie zasiedliła ziemie przodków. Odzyskanie i ponowne zaludnienie tych regionów to coś więcej niż strategia geopolityczna — to droga do odrodzenia kultury, źródło nadziei dla wszystkich Ormian oraz świadectwo naszej jedności i wytrwałości."
 arm_wool_industry_title: "Rozwinąć przemysł wełniany"
 arm_wool_industry_desc: "Nasze żyzne doliny, ukryte między górami, są domem dla licznych stad owiec, których wełna może stać się prawdziwą żyłą złota. Najwyższy czas zainwestować w rozwój prężnego przemysłu wełnianego i uczynić z tych stad źródło dobrobytu naszego narodu."
 arm_national_awakening_title: "Przebudzenie narodowe"
 arm_national_awakening_desc: "Świt niepodległości zapowiada okres narodowego przebudzenia — czas odrodzenia kultury i ponownego odkrywania naszej tożsamości jako dumnego, niezłomnego narodu. Nadszedł moment, by rozbudzić twórczego i intelektualnego ducha Armenii, wspierając sztukę, literaturę, naukę i wiarę, które składają się na nasze dziedzictwo kulturowe. Musimy stworzyć warunki sprzyjające ekspresji kulturowej, ciekawości intelektualnej i rozwojowi duchowemu."
 arm_church_of_the_east_title: "Kościół Wschodu"
 arm_church_of_the_east_desc: "Mezopotamia, kolebka cywilizacji, pozostaje pod obcym panowaniem, a jej chrześcijańska ludność pragnie wyzwolenia. Ziemie Tygrysu i Eufratu wołają o ratunek, a naszym obowiązkiem jest odpowiedzieć na to wezwanie. Wyruszmy na wschód, by wyzwolić naszych braci i przywrócić dawny splendor chrześcijaństwa na tych starożytnych ziemiach."
 arm_avenge_seljuk_conquest_title: "Obalić Turkomanów"
 arm_avenge_seljuk_conquest_desc: "Turkomani z Kara Kojunlu od zbyt dawna są cierniem w naszym boku. Ich opresyjne rządy, jawna pogarda dla naszej wiary i dziedzictwa oraz nieustanne zagrożenie dla naszej suwerenności przyniosły nam ogrom cierpienia. Nadszedł czas, by położyć kres ich tyranii. Obalając Turkomanów, zabezpieczymy naszą przyszłość i pokażemy światu, że nigdy nie ugnie się przed tyranią niezłomny duch Armenii."
 arm_secure_caucasia_title: "Zabezpieczyć Kaukaz"
 arm_secure_caucasia_desc: "Ziemie Kaukazu doświadczyły już wystarczająco wielu konfliktów i podziałów. Nadszedł czas, by zaprowadzić na nich jedność i stabilność pod naszym sprawiedliwym panowaniem. Nie chodzi o dominację, lecz o jedność i współpracę między bratnimi narodami. Nasze wojska zapewnią tym ziemiom bezpieczeństwo, a odpowiednia polityka — dobrobyt. W ten sposób stworzymy bezpieczny i kwitnący Kaukaz, ostoję jedności w podzielonym świecie."
 ARM1_ideas: "Wielkie idee Armenii"
 ARM1_ideas_start: "Wielkie tradycje Armenii"
 ARM1_ideas_bonus: "Wielkie ambicje Armenii"
 apostolic_church1: "Kościół Apostolski"
 apostolic_church1_desc: "Armenia była pierwszym państwem, które w 301 roku ustanowiło chrześcijaństwo religią państwową. Świadomość, że posiadamy pierwszy narodowy Kościół na świecie, napawa nas ogromną dumą. Wiara pomogła nam zachować tożsamość i nadzieję, w czym wielką zasługę miał święty Mesrop Masztoc i stworzony przez niego alfabet ormiański, który odmienił los naszego narodu. Był to fundamentalny krok na drodze do umocnienia ormiańskiej państwowości i tożsamości."
 land_reclamation1: "Zagospodarowanie odzyskanych ziem"
 land_reclamation1_desc: "Armenia przez stulecia była pustoszona przez wojny i rozdzierana przez sąsiadów. Odzyskując utracone ziemie, przystosowując je do zamieszkania oraz odbudowując zrujnowane kościoły i twierdze, możemy umocnić kontrolę nad naszym terytorium i poprawić warunki życia mieszkańców."
 melikdom_organization1: "Organizacja melikdomów"
 melikdom_organization1_desc: "Jako jedna z nielicznych ostoi niezależnej państwowości ormiańskiej Armenia była rządzona przez feudalnych zwierzchników zwanych melikami, po upadku dawnego systemu nakhararów. Relacja między melikami a ich podwładnymi przypominała stosunek dowódcy wojskowego do niższego rangą oficera, a nie pana feudalnego do chłopa pańszczyźnianego. Chłopi często mogli posiadać ziemię, byli wolni i dysponowali własnym majątkiem."
 nakharar_titles1: "Tytuły nakhararów"
 nakharar_titles1_desc: "Osłabiona licznymi najazdami i reformami prawnymi królów struktura nakhararów przez wiele stuleci pozostawała niemal niezmieniona, aż ostatecznie została zlikwidowana podczas najazdów mongolskich w XIII wieku. Przywrócenie feudalnego despotyzmu nie wchodzi w grę, lecz odnowienie dawnych tytułów naszej szlachty wzmocniłoby dumę narodową."
 end_of_armenian_diaspora1: "Koniec ormiańskiej diaspory"
 end_of_armenian_diaspora1_desc: "Nasz lud został rozproszony po całym świecie i nie ma dokąd wracać. Odrodzenie narodu ormiańskiego powinno zachęcić wielu rodaków żyjących za granicą do powrotu do ojczyzny!"
 flavor_arm.1.t: "Odrodzenie Wielkiej Armenii"
 flavor_arm.1.d: "W dolinach wciąż rozbrzmiewają echa zwycięskich okrzyków, a ormiańska wojna o niepodległość dobiegła szczęśliwego końca. Potężna turkmeńska konfederacja Kara Kojunlu została odparta, a chwalebne serce ojczyzny naszych przodków ponownie znalazło się pod ormiańskim panowaniem. Zwycięstwo to zapisze się w historii naszego narodu jako przełomowy moment i symbol odrodzenia Wielkiej Armenii. Triumfalne wojska maszerują przez starożytne miasta i świeżo wyzwolone ziemie, śpiewając o wolności i braterstwie. Dzięki odwadze i wytrwałości żołnierzy odmieniliśmy los Armenii i rozpaliliśmy na nowo ducha Tigranesa Wielkiego, jednego z najsławniejszych władców naszego narodu. Niegdyś rozproszony i uciskany lud stoi teraz u progu nowego złotego wieku.\n\nPonowne zjednoczenie ziem przodków pod jednym sztandarem zapowiada początek wspaniałej epoki, pełnej postępu, dobrobytu i trwałego pokoju. Teraz naszym obowiązkiem jest poprowadzić lud i dobrze wykorzystać ciężko wywalczoną wolność, by ofiara poniesiona w tej świętej walce o niepodległość nie poszła na marne. Stoimy na ramionach olbrzymów, którzy budowali fundamenty tej ziemi własną krwią, potem i łzami. Dorównajmy dokonaniom bohaterów przeszłości i stwórzmy przyszłość godną ich dziedzictwa. Wielka Armenia odrodziła się, a jej przyszłość spoczywa w naszych rękach!"
 flavor_arm.1.a: "Chwała Armenii!"
 flavor_arm.1.b: "Nasze zwycięstwo nie wymaże naszych korzeni!"
 flavor_arm.2.t: "Kościół Wschodu"
 flavor_arm.2.d: "Ziemie, które niegdyś rozkwitały pod opieką Kościoła Wschodu, zostały odzyskane przez nasze potężne armie. Gdy wojska triumfalnie przechodzą przez starożytne bramy Bagdadu, na suchych równinach rozbrzmiewają okrzyki radości, zapowiadając nową erę odrodzenia chrześcijaństwa. Ormiańscy wyzwoliciele, mimo różnic dzielących ich od Kościoła Wschodu od czasu soboru chalcedońskiego, dowodzą, że jedność w obliczu wspólnego zagrożenia jest ważniejsza niż rozbieżności teologiczne.\n\nMusimy odłożyć na bok różnice między naszymi Kościołami, ponieważ egzystencjalne zagrożenie ze strony islamskich sułtanatów wymaga zjednoczonego frontu chrześcijańskiego. Nawet jeśli nadal różnimy się w interpretacji natury Chrystusa, wspólnym symbolem pozostaje Krzyż. Nasz marsz ku zwycięstwu niesie głębsze przesłanie: potęga Krzyża nie zna granic, a determinacja wiernych może doprowadzić do najbardziej nieoczekiwanych triumfów. Niech Kościół Wschodu odrodzi się, a Bóg poprowadzi nas wspólną drogą!"
 flavor_arm.2.a: "Chwalmy Pana za to wspaniałe zwycięstwo!"
 flavor_arm.4.t: "Odrodzenie Kościoła koptyjskiego"
 flavor_arm.4.d: "Ormiańskie podboje dotarły do starożytnych ziem Egiptu, kolebki cywilizacji. Gdy nasze dzielne wojska zwycięsko przemierzają skąpane w słońcu równiny i okolice monumentalnych piramid, dla zapomnianej wspólnoty Koptów nastaje nowy świt. Niegdyś stanowili oni dominującą grupę chrześcijańską w Egipcie, lecz przez długi czas byli marginalizowani, a ich wolność religijna ograniczana przez muzułmańskich władców. Teraz, gdy wojska ormiańskie obejmują te ziemie we władanie, dzwony Koptyjskiego Kościoła Ortodoksyjnego ponownie rozbrzmiewają nad Nilem, zwiastując początek jego odrodzenia.\n\nPrzyszliśmy Koptom z pomocą i dodaliśmy im odwagi, by odzyskali należną im pozycję. Nasze zwycięstwo nad dawnymi władcami Egiptu oznacza nie tylko rozszerzenie terytorium, lecz także początek nowej epoki wolności religijnej i tolerancji dla chrześcijan koptyjskich. Świętujmy tę doniosłą chwilę, która zwiastuje zarówno rozwój naszego imperium, jak i odrodzenie wspólnoty wiary, przetrwałej stulecia prób i cierpień. Patrząc w przyszłość, musimy pamiętać o zasadach różnorodności i otwartości, które umożliwiły to historyczne odrodzenie Kościoła koptyjskiego."
 flavor_arm.4.a: "W jedności siła!"
 armenia_tigranakert_title: "Przenieść stolicę do Tigranakertu"
 armenia_tigranakert_desc: "Za czasów Tigranesa Wielkiego Tigranakert był świadectwem chwały naszego narodu i symbolem niezłomnego ducha Ormian. Dziś, gdy obserwujemy odrodzenie Wielkiej Armenii, powinniśmy uczcić naszą historię i ponownie ustanowić Tigranakert stolicą państwa."
 nakharar_title: "Tytuł nakharara"
 nakharar_title_desc: "Zreformowanie systemu nakhararów i trwałe włączenie go do struktur naszego rządu pozwoli harmonijnie połączyć dawne zwyczaje z potrzebami rozrastającego się państwa. Tytuł nakharara, nadawany możnowładcom, zapewni równowagę sił, uznając ich lokalną władzę, a zarazem wspierając dobro całego narodu."
 sparapet_office: "Urząd sparapeta"
 sparapet_office_desc: "Przywrócenie urzędu sparapeta będzie ważnym krokiem w zachowaniu i rozwijaniu naszej dawnej tradycji wojskowej. Sparapet, jako naczelny dowódca sił zbrojnych, zadba o gotowość i sprawność naszej armii w obliczu wszelkich zagrożeń dla państwa."
