 BYZ_reliance_on_mercenaries: "Poleganie na najemnikach"
 desc_BYZ_reliance_on_mercenaries: "Choć wielu uważa to za błąd, postanowiliśmy polegać na najemnikach zamiast na wyludnionych chłopach."
 BYZ_paroikoi_recruimtnet: "Rekrutacja paroików"
 desc_BYZ_paroikoi_recruimtnet: "Ponieważ lojalność kompanii najemniczych nieustannie się zmienia, basileus uznał, że bezpieczniej będzie rekrutować chłopów."
 BYZ_spirit_of_resistance: "Duch oporu"
 desc_BYZ_spirit_of_resistance: "Zamiast zachęcać do kontrofensyw, postanowiliśmy skupić się na stawianiu oporu osmańskiej inwazji."
 BYZ_icon_michael: "Podwójny bonus za ikonę św. Michała"
