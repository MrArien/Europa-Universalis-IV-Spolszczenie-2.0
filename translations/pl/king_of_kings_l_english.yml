 arm_unlock_cawa_regiments_tt: "Pojawia się §Y20§! regimentów §TCzawa§! w prowincji §Y[Root.Capital.GetName]§!, a my uzyskujemy dostęp do reformy rządowej poziomu 5 §YNadawanie przywilejów Czawa§!."
 arm_all_coptic_tt: "Wszystkie państwa §Ykoptyjskie§! otrzymują modyfikator „§YObrońcy świętych miejsc§!” na §Y25 lat§!, zapewniający następujące efekty:\nSiła misjonarzy: §G+1,5%§!\nSzybkość odzyskiwania zasobów ludzkich: §G+10,0%§!\nDyscyplina: §G+2,5%§!\nRoczna legitymizacja: §G+0,50§!\nKoszt tworzenia roszczeń narodowych: §G-10,0%§!."
