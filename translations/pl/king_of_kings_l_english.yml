 estate_qizilbash_mamlukian_administration: "Administracja mamelucka"
 estate_ghulams_mamlukian_administration: "Administracja mamelucka"
 estate_nobles_mamlukian_administration_desc: "Administracja mamelucka w Egipcie miała swoje wady, lecz niektóre odziedziczone po dynastii Ajjubidów rozwiązania są bardzo przydatne w zarządzaniu naszym wciąż rozrastającym się państwem [Root.GovernmentName]. Powinniśmy powierzyć ten rodzaj administracji stanowi [Root.GetNobilityOrFallbackName], który utrzymuje kontakty z dawnymi mameluckimi urzędnikami."
 estate_qizilbash_mamlukian_administration_desc: "Administracja mamelucka w Egipcie miała swoje wady, lecz niektóre rozwiązania odziedziczone po dynastii Ajjubidów są bardzo przydatne w zarządzaniu naszym wciąż rozrastającym się państwem [Root.GovernmentName]. Powinniśmy powierzyć ten rodzaj administracji stanowi [Root.GetQizilbashOrFallbackName], który utrzymuje kontakty z dawnymi mameluckimi urzędnikami."
 estate_ghulams_mamlukian_administration_desc: "Administracja mamelucka w Egipcie miała swoje wady, lecz niektóre rozwiązania odziedziczone po dynastii Ajjubidów są bardzo przydatne w zarządzaniu naszym wciąż rozrastającym się państwem [Root.GovernmentName]. Powinniśmy powierzyć ten rodzaj administracji stanowi [Root.GetGhulamsOrFallbackName], który utrzymuje kontakty z dawnymi mameluckimi urzędnikami."
