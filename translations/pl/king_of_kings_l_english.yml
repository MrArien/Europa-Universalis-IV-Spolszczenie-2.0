 modernized_furusiyya_reform: "Zmodernizowana furusijja"
 modernized_furusiyya_reform_desc: "Zmodernizowany zestaw ćwiczeń wojskowych, którego celem jest poprawa dyscypliny, marszu i szyków potężnych wojsk mameluckich."
 karimi_stations_reform: "Stacje karimi"
 karimi_stations_reform_desc: "Placówki zapewniające schronienie i miejsce wystawiania towarów. Te strategiczne obiekty zwiększą nasze wpływy handlowe za granicą."
 diwan_al_khass_reform: "Diwan al-Khass"
 diwan_al_khass_reform_desc: "Wykorzystując prywatny skarbiec naszego władcy, będziemy mogli realizować więcej przedsięwzięć rozwojowych, bez konieczności finansowania ich przez potężne stany."
 state_madrasas_reform: "Państwowe medresy"
 state_madrasas_reform_desc: "Finansowanie publicznych instytucji pobożności i nauki jest kluczowe dla budowania wizerunku naszego państwa jako pionierskiego i innowacyjnego."
 mechanic_advisors_generate_innovativeness_yes: ""
 egyptian_government_reform: "Rząd egipski"
 egyptian_government_reform_desc: "Potrzeba modernizacji naszego państwa i stworzenia sprawnego rządu centralnego zapoczątkuje wielką falę innowacji we wszystkich dziedzinach naszego kraju."
 mam_adm_advisors_generate_idea_cost_tt: "\\nWszyscy nasi doradcy §Yadministratywni§! będą zmniejszać koszt idei o §G1%§! za każdy poziom"
 mam_mosque_great_mosque_generates_crown_land_tt: "\\nBudowa §Ymeczetów§! i §Ywielkich meczetów§! zapewni nam §G+0,25%§! ziemi koronnej, a także następującą nagrodę:\\n"
 integrated_ottoman_officials: "Zintegrowani urzędnicy osmańscy"
 integrated_ottoman_officials_desc: "Niegdyś potężne Imperium Osmańskie legło w gruzach. Warto zatem przejąć jego metody administracyjne i udoskonalić je dla dobra naszego społeczeństwa."
 mechanic_reveal_ruler_skills_for_mamluks_yes: "Wydarzenie „§YMamelucka sukcesja§!” nie będzie już ukrywać umiejętności władcy"
 enable_westernization_mechanic_tt: ""
 cawa_auxiliary_forces: "Pomocnicza gwardia cawa"
 cawa_auxiliary_forces_desc: "Elitarni rekruci cawa z podbitych ziem etiopskich będą z dumą nieść nasze sztandary w boju i zagrzewać pozostałe oddziały do walki."
 estate_burghers_fund_karimi: "Finansuj kupców karimi"
 estate_burghers_fund_karimi_desc: "Warto zapewnić kupcom karimi odpowiednie fundusze i ziemię w naszym państwie, aby mogli swobodnie i bez przeszkód prowadzić działalność."
 estate_burghers_foreign_expeditions: "Zamorskie wyprawy mameluków"
 estate_burghers_foreign_expeditions_desc: "Opowieści o odległych wybrzeżach przyciągają wielu najbardziej wpływowych członków naszych gildii kupieckich. Sfinansowanie ich wypraw i umożliwienie im osiedlania się za granicą przyniesie nam korzyści w dłuższej perspektywie."
 estate_burghers_nile_goods_transport: "Transport towarów Nilem"
 estate_burghers_nile_goods_transport_desc: "Sprawny transport towarów wzdłuż Nilu jest niezwykle opłacalnym przedsięwzięciem dla gildii kupieckich działających w naszym państwie."
 estate_church_fund_dar_al_hadith: "Finansowanie Dar al-Hadith"
 estate_church_fund_dar_al_hadith_desc: "Wspieranie instytucji naukowych i faworyzowanie rodzimych doradców to doskonały sposób na zachowanie naszych tradycji oraz rozwój wiedzy i dobrobytu w społeczeństwie."
 estate_church_fund_madrasas: "Państwowe medresy"
 estate_church_fund_madrasas_desc: "Finansowane przez państwo instytucje służące świeckiemu i religijnemu oświeceniu naszego ludu. Ich absolwenci staną się kolejnym pokoleniem naszych administratorów, polityków i imamów!"
 estate_church_sponsor_waqf_payments: "Płatności wakf"
 estate_church_sponsor_waqf_payments_desc: "Wspieranie dobroczynności w naszym państwie jest jednym z najważniejszych obowiązków powierzonych najwybitniejszym przedstawicielom duchowieństwa."
 estate_burghers_monopoly_of_coffee: "Monopol na kawę"
 estate_burghers_monopoly_of_coffee_desc: "Przyznając naszym kupcom monopol na ten płynny przysmak, z pewnością zyskamy ich przychylność i napełnimy skarbiec monetami."
 estate_burghers_monopoly_of_coffee_effect_tooltip: "Każda posiadana prowincja produkująca kawę zyskuje §G1§! rozwoju podstawowego podatku \\n§RBrak dochodu z produkcji §Ykawy§!§!"
 estate_burghers_monopoly_of_coffee_revoke_tooltip: "Każda posiadana prowincja produkująca kawę traci §R1§! rozwój podstawowego podatku \\nDochód z produkcji §Ykawy§! zostaje przywrócony"
 estate_burghers_monopoly_of_coffee_mod: "Kupiecki monopol na kawę"
 desc_estate_burghers_monopoly_of_coffee_mod: ""
 mamluk_galley_doctrine: "Mameluckie galery"
 mamluk_galley_doctrine_desc: "Nasze potężne galery i doświadczone załogi zapanują nad morzami i przyniosą wielką chwałę naszemu imieniu oraz herbom."
 mamluk_light_doctrine: "Mameluckie statki handlowe"
 mamluk_light_doctrine_desc: "Nasze cenne statki handlowe i doświadczone załogi zapanują nad morzami i przyniosą naszemu państwu wielki dobrobyt."
 mamluk_warships_doctrine: "Mameluckie okręty wojenne"
 mamluk_warships_doctrine_desc: "Nasze potężne okręty wojenne i doświadczone załogi zapanują nad morzami i przyniosą wielką chwałę naszemu imieniu oraz herbom."
 mamluk_transports_doctrine: "Mameluckie transportowce"
 mamluk_transports_doctrine_desc: "Nasze transportowce i doświadczone załogi zapanują nad morzami i przyniosą wielką chwałę naszemu imieniu oraz herbom."
