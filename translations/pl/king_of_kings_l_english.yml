 flavor_per.55.t: "Umocnienie wpływów sunnickich"
 flavor_per.55.desc: "Wielki podział religijny naszych ziem wreszcie dobiegnie końca. Szyizm pozostaje wpływową siłą w [Root.GetName], której nie możemy ignorować, lecz [Root.Monarch.GetName] zdaje sobie sprawę z izolacji dyplomatycznej, jaka mogłaby nastąpić po przyjęciu dwunastkowców jako wyznania państwowego. Jedność naszego ludu powinna oznaczać jedność ze światem muzułmańskim poprzez sunnizm. Aby jasno przedstawić nasze stanowisko całej wspólnocie, musimy oczywiście wykorzenić herezje w [Root.GetName] i przywrócić prawdziwą wiarę."
 flavor_per.55.a: "Jesteśmy częścią większej wspólnoty."
 flavor_per.56.t: "Koniec dynastii Timurydów"
 flavor_per.56.d: "Stulecia podbojów, mecenatu nad najwspanialszymi dziełami sztuki i żelaznych rządów samego Tamerlana nie wystarczyły, by zapewnić przetrwanie jego marnej dynastii. Mimo geniuszu tego człowieka w każdej dziedzinie rządzenia — od podbojów, podczas których poprowadził armie aż po ziemie Rusi, przez administrację rozległym imperium, po hojny mecenat nad artystami, poetami i architektami — żaden z jego następców nie odziedziczył choćby iskry jego wielkości. W rezultacie dynastia wygasła, a ostatnie pozostałości jej ojczyzny rozpadły się pod naporem naszych potężnych armii. Dla Chorasan i ludów niegdyś podległych Timurydom nastał nowy dzień!"
 flavor_per.56.a: "Niech żyje [Root.GetDynastyOrFallback] [Root.GovernmentName]!"
 flavor_per.56.a.tt: "§Y5§! prowincji w regionie §YChorasanu§! otrzyma §G+1§! losowy punkt rozwoju."
 flavor_per.57.t: "Prorok z prowincji [target_province.GetName]"
 flavor_per.57.desc: "Pośród wielkiego tłumu stoi samotny mężczyzna na prowizorycznym podwyższeniu. Przemawia do zgromadzonych łagodnym, lecz stanowczym i pełnym pasji głosem, twierdząc, że ujrzał wizje przyszłości oraz objawienia od [Root.GetReligiousMainDeityName]. „Nauki [Root.Religion.GetName] są błędne! Przez stulecia od naszego nawrócenia były niewłaściwie interpretowane! Prawdziwe imię i prawdziwe oblicze Boga to Ahura Mazda!”\nOczywiście człowiek ten głosi heretyckie poglądy, wzbudzając wielki gniew stanu [Root.GetChurchOrFallbackName]. Duchowni domagają się jego natychmiastowej egzekucji!"
 flavor_per.57.a: "Nonsens. Najpierw sprowadźmy tego człowieka na nasz dwór!"
 flavor_per.57.b: "Nie stanowi zagrożenia. Zostawmy go w spokoju."
 flavor_per.57.c: "Niech zapłaci głową za swoją herezję!"
 flavor_per.57.a.tt: "§YZaratusztriański prorok§! zostanie zaproszony na dwór [Root.Monarch.GetTitle]. W podróży będzie go chronić [Root.GetAdjective] straż."
 flavor_per.57.b.tt: "§YZaratusztriańskiemu prorokowi§! pozwolimy kontynuować przemowy na ulicach."
 flavor_per.57.c.at: "§YZaratusztriański prorok§! zostaje schwytany i stracony."
 flavor_per.57.c.bt: "§YZaratusztriańskiemu prorokowi§! udaje się uciec."
 flavor_per.58.t: "Zaratusztriański prorok"
 flavor_per.58.desc: "Wreszcie zaratusztriański prorok przybył na dwór [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Choć wyczerpany podróżą, z entuzjazmem wita [Root.Monarch.GetTitle]. „Nie spodziewałem się, że [Root.Monarch.GetTitle] zechce wysłuchać moich nauk. Pańska mądrość potwierdziła jednak prawdziwość moich wizji”.\n\nProrok dzieli się otrzymanymi objawieniami. Niegdyś wyznawca religii [Root.Religion.GetName] i szanowany członek stanu [Root.GetChurchOrFallbackName], twierdzi, że [Root.GetReligiousMainDeityName] „przemówił do tego pokornego sługi”, by przekazać mu boską wiedzę. Utrzymuje, że jedyną drogą do raju po śmierci jest przyjęcie nauk starożytnego reformatora religijnego, Zaratustry.\n\nTakie twierdzenia są oczywiście oburzające dla wspólnoty [Root.Religion.GetGroupName]. Mimo to [Root.Monarch.GetTitle] nie może oprzeć się wrażeniu, że w słowach proroka kryje się ziarno prawdy, choć podobne myśli z pewnością doprowadzą do buntów. Królewska obietnica ochrony jego życia nie pozwala [Root.Monarch.GetName] szybko zgładzić proroka. Pozostają zatem dwie możliwości: zatrzymać go na dworze i dalej czerpać z jego mądrości albo wygnać go z pałacu."
 flavor_per.58.a: "Prorok pozostanie na królewskim dworze."
 flavor_per.58.a.tt: "§YProrok§! pozostaje na królewskim dworze."
 flavor_per.58.b: "Dość tego szaleństwa. Wyrzućcie tego obłąkańca z dworu!"
 flavor_per.58.b.tt: "§YProrok§! zostaje usunięty z królewskiego dworu."
 flavor_per.58.b.at: "§YProrok§! ponownie zacznie głosić nauki w jednej z naszych prowincji."
 flavor_per.58.b.bt: "§YProrok§! „znika” w drodze powrotnej do domu."
 flavor_per.59.t: "Dwie rzeki Żyznego Półksiężyca"
 flavor_per.59.d: "Miejsce narodzin niektórych z najznakomitszych imperiów w historii, tak zwana Kolebka Cywilizacji, jest teraz częścią naszego wielkiego imperium. Dzięki niemu zyskaliśmy dostęp do lukratywnych szlaków handlowych przecinających wybrzeża Faristanu i drogi wodne poza Wybrzeżem Piratów i Zatoką Perską. Z wielkim zyskiem wiąże się jednak wielka odpowiedzialność, a nasi skarbnicy ostrzegają przed nadmiernym rozkoszowaniem się naszym nowo odkrytym bogactwem.\n\nHandel, podobnie jak związek z małżonkiem lub wzrost pięknego drzewa, musi być kultywowany i pielęgnowany, aby mógł się rozwijać i pomagać nam w prosperowaniu przez resztę naszego ziemskiego życia."
 flavor_per.59.a: "Przywróćmy temu regionowi dawną świetność pod rządami naszego stanu kupieckiego!"
 per_persian_basra_modifier: ""
 flavor_per.60.t: "Strażnicy cieśniny"
 flavor_per.60.d: "Od stuleci przez cieśninę Ormuz przepływają dochodowe towary, egzotyczne dobra i cenne przyprawy. Kupcy często padają jednak ofiarą kapitanów statków niewolniczych i morskich rabusiów, którzy ograbiają zwykłych ludzi z ich towarów. Musimy zdecydować, jak rozprawić się z tymi przestępcami, zwłaszcza że obecna sytuacja w cieśninie jest wyjątkowo delikatna."
 flavor_per.60.a: "Musimy wytropić i zgładzić tych piratów!"
 flavor_per.60.b: "Sami się nimi zajmiemy."
 flavor_per.61.t: "Chińska porcelana biało-niebieska"
 flavor_per.61.d: "Sukces przynosi bogactwo, a bogactwu często towarzyszą prestiż, prawowitość i władza. Dlatego wielu naszych przedsiębiorczych kupców podróżowało do legendarnych pałaców Wielkich Mingów, wracając na nasze dwory i targowiska z niezwykłymi, obcymi, lecz zapierającymi dech w piersiach tkaninami i wyrobami. Wśród nich znalazła się biało-niebieska porcelana, którą sam cesarz Chin podarował Królowi Królów. Z pewnością ozdobi nasze grobowce i pałace, dodając nam splendoru, prawowitości i nowego prestiżu!"
 flavor_per.61.a: "Materiał godny Króla Królów"
 flavor_per.62.t: "Arystokratyczne zainteresowanie zaratusztrianizmem"
 flavor_per.62.desc: "W wyniku ostatnich wydarzeń na [Root.GetAdjective] dworze członkowie stanu [Root.GetNobilityOrFallbackName] zaczęli interesować się naukami Zaratustry i sprawami religijnymi [Root.Monarch.GetTitle]. Oficjalnie [Root.GetNobilityOrFallbackName] ma obowiązek przestrzegać dogmatów religii [Root.Religion.GetName], lecz idee wolnej woli, walki sił Dobra i Zła oraz pozornie mniej surowe zasady zaratusztrianizmu zyskały ogromną popularność wśród młodszych możnowładców..."
 flavor_per.62.a: "Poprzyjmy postawę stanu [Root.GetNobilityOrFallbackName]."
 flavor_per.62.a.tt: "§Y[Root.GetNobilityOrFallbackName]§! poprze ideę §Yzaratusztriańskiego państwa [Root.GetName]§!."
 flavor_per.62.b: "Połóżmy kres herezji wśród stanu [Root.GetNobilityOrFallbackName]!"
 flavor_per.63.t: "Bunt stanu [Root.GetChurchOrFallbackName]!"
 flavor_per.63.desc: "Niewierne działania dworu zbyt długo prowokowały stan [Root.GetChurchOrFallbackName]. Duchowni twierdzą, że obecny [Root.Monarch.GetTitle] i [Root.GetNobilityOrFallbackName] postradali rozum i zbyt daleko odeszli od nauk [Root.GetReligiousMainDeityName]. W rezultacie [Root.GetChurchOrFallbackName] zgromadził pobożnych żołnierzy wyznających religię [Root.Religion.GetName] i wystosował ultimatum do [Root.Monarch.GetTitle]: albo porzucimy próby odrodzenia wiary zaratusztriańskiej i uznamy ją za herezję państwową, albo stawimy czoła gniewowi zjednoczonych wojsk duchowieństwa."
 flavor_per.63.a: "Do broni! Zmiażdżymy ten bunt!"
 flavor_per.63.a.tt: "§RStracimy wszelką możliwość przejścia na §Yzaratusztrianizm§!, jeśli rebelianci doprowadzą do rozpadu państwa.§!"
 flavor_per.63.a.at: "Dzięki poparciu stanu §Y[Root.GetNobilityOrFallbackName]§! wystąpią następujące efekty:"
 flavor_per.63.a.bt: "Dzięki poparciu §Yzaratusztriańskiego proroka§! wystąpią następujące efekty:"
 flavor_per.63.b: "Jest ich zbyt wielu. Musimy spełnić ich żądania."
 flavor_per.63.b.at: "§RStracimy wszelką możliwość przejścia na §Yzaratusztrianizm§!.§!"
 flavor_per.63.b.bt: "Zastąpimy nasze misje zaratusztriańskie ścieżką misji §Omuzułmańskich§!."
 flavor_per.64.t: "Koniec [Root.GetDynastyOrFallback] [Root.GovernmentName]"
 flavor_per.64.desc: "Mimo że [Root.GetAdjective] wojska walczyły wszelkimi dostępnymi siłami, bunty okazały się zbyt wielkim wyzwaniem nawet dla naszych zdolnych żołnierzy. Szczególnie dotkliwe zniszczenia spowodowali zbuntowani wojownicy, którzy opowiedzieli się po stronie stanu [Root.GetChurchOrFallbackName], niszcząc niegdyś wspaniały pałac [Root.GetName].\n[Root.GovernmentName] zostało obalone, a członkowie dynastii straceni za herezję i znieważenie imienia [Root.GetReligiousMainDeityName]. Zaratusztrianie zostali siłą nawróceni lub wypędzeni z [Root.GetName].\n\nOto koniec [Root.GetDynastyOrFallback] [Root.GovernmentName] i początek nowej teokracji wyznającej religię [Root.Religion.GetName]."
 flavor_per.64.a: "To nowy rozdział w historii [Root.GetName]."
 flavor_per.65.t: "Następstwa buntu stanu [Root.GetChurchOrFallbackName]"
 flavor_per.65.desc: "Minęły miesiące krwawych walk i wreszcie ostatni przedstawiciele stanu [Root.GetChurchOrFallbackName] ulegli potędze militarnej [Root.Monarch.GetTitle]. Spośród wszystkich grup, które musiały znosić trudy wojny, najbardziej ucierpiało [Root.GetAdjective] chłopstwo. Rozczarowani naukami religii [Root.Religion.GetName] i przerażeni widoczną żądzą władzy oraz kontroli ze strony [Root.GetChurchOrFallbackName], niegdyś pobożni ludzie odwrócili się od jej dogmatów.\n\nPodobne nastroje panują na dworze. Wyczerpane i rozgoryczone elity przestały skrywać swoje zainteresowanie zaratusztrianizmem i coraz głośniej domagają się opuszczenia wspólnoty [Root.Religion.GetGroupName] oraz przyjęcia zaratusztrianizmu jako religii państwowej."
 flavor_per.65.a: "Wiara [Root.Religion.GetName] nie daje nam już pocieszenia. Niech mądrość Zaratustry wskaże nam drogę."
 AFTERMATH_OF_CLERICAL_CIVIL_WAR: ""
 flavor_per.66.t: "Tożsamość [Root.Religion.GetName]"
 flavor_per.66.desc: "Od czasu muzułmańskiego podboju Zagrosu lud [Root.GetAdjective] kojarzono z przywiązaniem do islamskiej sztuki, architektury i — rzecz jasna — tożsamości. Jednak wraz ze zmianą religii na [Root.Religion.GetName] podążamy ścieżką naszych przodków, ku dziedzictwu imperium Sasanidów. Nasi ludzie są dumni zarówno ze swoich korzeni, jak i obecnej tożsamości, dlatego żadna z tych możliwości nie spotka się z powszechnym sprzeciwem."
 flavor_per.66.a: "Eranszahr to prawdziwa nazwa naszego kraju. Czas ponownie ją przyjąć."
 flavor_per.66.b: "Jesteśmy [Root.GetAdjective] i tak powinniśmy zostać zapamiętani!"
 flavor_per.67.t: "Abbas I — największy cesarz Persji"
 flavor_per.67.d: "Abbas I, jeden z najwybitniejszych monarchów naszego narodu, zyskał rozgłos po objęciu perskiego tronu w roku [GetYear]. Nie zamierzał tracić czasu ani pozostawiać spraw państwowych w rękach wezyrów i doradców. Jego plany wielkich reform oraz ograniczenia wpływów stanów na dworze były zaledwie początkiem jednego z najbardziej oświeconych panowań naszych czasów."
 flavor_per.67.a: "Tron należy do niego!"
 flavor_per.67.b: "Nigdy nie porzucimy dotychczasowego porządku."
 flavor_per.68.t: "Rozbudowa Isfahanu za Abbasa I"
 flavor_per.68.d: "Aby ocenić Abbasa Szaha jako mecenasa architektury, należy przyjrzeć się Isfahanowi. Objęcie tronu przez Abbasa całkowicie odmieniło opłakany stan irańskiej architektury, który utrzymywał się niemal przez całe stulecie. Energia, z jaką nowy szach wspierał rozbudowę Isfahanu, zainspirowała architektów do odzyskania natchnienia utraconego podczas długiego okresu stagnacji za poprzednich władców. Co znamienne, punktem wyjścia dla nowych osiągnięć stała się architektura timurydzka, a nie wczesna architektura dynastii $DYNASTY$. Wśród tych dokonań szczególne miejsce zajmują zabytki Isfahanu."
 flavor_per.68.a: "Wspaniały cud architektury i urbanistyki!"
 flavor_per.69.t: "Zaratusztriański prorok"
 flavor_per.69.desc: "Wraz ze zmianą religii [Root.GetName] na [Root.Religion.GetName] wizje dawnego proroka wreszcie się spełniły. Nie jest już postrzegany jako szaleniec głoszący swoje nauki za grosze, lecz jako szanowany teolog i reformator religijny. Prorok pokonał zło niewłaściwej wiary i przekonał naszych ludzi do znaczenia wolnej woli. Teraz należy do [Root.GetAdjective] dworu i jest ważnym członkiem najbliższego otoczenia [Root.Monarch.GetTitle]."
 flavor_per.69.a: "Niech jego rady poprowadzą nas ku nowemu świtowi."
 flavor_per.69.a.tt: "§RTen ośrodek nawracania zostanie usunięty po §Y50 latach§!.§!"
 flavor_per.70.t: "Zaratusztriański prorok"
 flavor_per.70.desc.a: "Choć jego metody budzą niechęć, ponieważ stoją w jawnej sprzeczności z ideą wolnej woli, zaratusztriański prorok z prowincji [zoroastrian_center_of_conversion.GetName] jest tolerowany przez stan [Root.GetChurchOrFallbackName]. Być może głosi swoje nauki jedynie po to, by przetrwać, lecz jego idee i przekonania są zgodne z naszymi, więc nie ma większego powodu, by go powstrzymywać."
 flavor_per.70.desc.b: "Zaratusztriański prorok ponownie rozpoczął działalność. Tym razem jego kazania zgromadziły tak liczne tłumy, że wywołały chaos religijny w naszym państwie. Coraz więcej ludzi porzuca wiarę [Root.Religion.GetName] i przyjmuje zaratusztriańskie wizje proroka."
 flavor_per.70.a: "Przynajmniej jego kazania bywają zabawne."
 flavor_per.71.t: "Mściwy prorok"
 flavor_per.71.desc.a: "Przejście na religię [Root.Religion.GetName] było krwawym procesem. Wielu ludzi, zarówno muzułmanów, jak i wyznawców [Root.Religion.GetName], straciło życie, a państwo musi się odbudować. Jedną z pierwszych ofiar był prorok głoszący nauki Zaratustry w jednej z naszych prowincji.\nA przynajmniej tak nam się wydawało. Prorok nie zginął, jak zakładaliśmy, i powrócił na czele armii swoich zwolenników. Choć religia [Root.GetName] stała się tym, czego pragnął, zamach na jego życie odebrał mu dawną łagodność. Teraz domaga się końca rządów [Root.GetDynastyOrFallback] [Root.GovernmentName] i ustanowienia teokracji [Root.Religion.GetName] pod własnym przywództwem."
 flavor_per.71.desc.b: "Podczas gdy konflikt teologiczny między dworem a stanem [Root.GetChurchOrFallbackName] coraz bardziej niszczy nasze społeczeństwo, w prowincji [revolt_province.GetName] pojawiło się zupełnie nowe zagrożenie!\n\nProrok, którego uznaliśmy za zmarłego, przeżył zamach. Próba zabicia go pozostawiła blizny na jego ciele i duszy, lecz jego determinacja przyciągnęła wielu zwolenników, którzy opowiedzieli się po jego stronie..."
 flavor_per.71.a: "To nie są ani dobre słowa, ani dobre myśli, ani dobre uczynki."
 flavor_per.71.b: "Straż! ...Straż?!"
 flavor_per.72.t: "Dołączenie do wspólnoty zaratusztriańskiej"
 flavor_per.72.desc: "Skoro [Root.Religion.GetName] stał się oficjalną religią [Root.GetName], dołączyliśmy do odrodzonej wspólnoty zaratusztriańskiej. Choć część tradycjonalistów ubolewa nad tą zmianą, znacznie liczniejsi zaratusztriańscy poddani radują się sprawiedliwymi rządami [Root.Monarch.GetName]."
 flavor_per.72.a: "Niech żyje [Root.Monarch.GetTitle]!"
 flavor_per.72.a.tt: "Nasze relacje ze wszystkimi znanymi państwami §Yzaratusztriańskimi§! poprawią się o §G50§!."
 converted_to_zoroastrian: ""
 flavor_per.76.t: "Szahname $MONARCH$"
 flavor_per.76.d: "Wkrótce po swoim chwalebnym wstąpieniu na tron [Root.Monarch.GetName] zarządził stworzenie królewskiego Szahname. Prace nad tym wielkim dziełem, liczącym 759 stron i 258 malowideł wykonanych przez najwybitniejszych mistrzów biblioteki [Root.Monarch.GetTitle], miały trwać przez kolejne dwie dekady. Karty księgi odzwierciedlają rozwój malarstwa w pierwszych latach panowania [Root.Monarch.GetName]. Rękopis tak ogromnych rozmiarów wymagał talentu wielu malarzy, kaligrafów i dyrektorów artystycznych. Szczególną sławę zdobyły ilustracje cenionego malarza Sultana Muhammada, którego dzieła ukazują wyważone połączenie rozumu szkoły Behzada z turkmeńską energią. Słynne przedstawienie Dworu Kajumarsa autorstwa Sultana Muhammada, pełne drobiazgowych szczegółów, niezrównanego rysunku, dynamicznej kompozycji i olśniewających barw, spotkało się z wyjątkowym uznaniem. Uznano je za szczytowe osiągnięcie malarstwa dynastii $DYNASTY$, przed którym nawet najśmielsi malarze spuszczali głowy ze wstydu."
 flavor_per.76.a: "Szczyt perskiej kultury i sztuk pięknych!"
 flavor_per.77.t: "Rozwój perskiego arkebuza"
 flavor_per.77.d: "Podczas licznych kampanii zasady prowadzenia wojny wielokrotnie ulegały zmianom. Nasi przodkowie walczyli konno, uzbrojeni w miecze i łuki. Pojawienie się prochu strzelniczego całkowicie odmieniło jednak sposób, w jaki pokonujemy wrogów. Nasi żołnierze nie tylko przyjęli arkebuz, nową broń palną o długiej lufie, lecz także włączyli go do tradycji kulturowych i codziennego życia. Dzięki temu nasza piechota i kawaleria zdobyły sławę na polach bitew."
 flavor_per.77.a: "Nikt nie dorównuje nam w posługiwaniu się arkebuzem!"
 flavor_per.78.t: "Przybycie braci Shirleyów"
 flavor_per.78.d: "Wojna potrafi połączyć najbardziej nieoczekiwanych ludzi. Los sprawił, że do naszego dworu dotarł sam sir Robert Shirley wraz ze swoim bratem Anthonym, przemierzając wcześniej cały świat. Ich misją jest przekazanie nam wiedzy wojskowej najgroźniejszych armii Europy i zbliżenie naszych państw w obliczu wspólnych wrogów.\n\nRobert Shirley był trzecim synem sir Thomasa Shirleya z Wiston w hrabstwie Sussex i Anne Kempe, córki sir Thomasa Kempe z Olantigh w Wye w hrabstwie Kent. Jego wiedza wojskowa przyczyniła się do reformy i ponownego szkolenia perskiej artylerii. Sir Shirley i jego brat odegrają kluczową rolę w modernizacji naszych sił zbrojnych, które muszą stawić czoła wszystkim pragnącym naszego zniszczenia."
 flavor_per.78.a: "Ich doświadczenie jest niezwykle cenne!"
