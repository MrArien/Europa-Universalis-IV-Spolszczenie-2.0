 HAS_SPREAD_THE_TRUE_FAITH_CB_ALREADY_TT: "§R- Państwo §Y[Root.GetName]§! ma już casus belli «§YSzerzenie prawdziwej wiary§!» przeciwko państwu §Y[From.GetName]§!.§!"
 unlock_fabricate_spread_the_true_faith_cb_tt: "Odblokowuje działanie dyplomatyczne «§YSfabrykuj konflikt religijny§!»."
 fabricate_spread_the_true_faith_cb: "Sfabrykuj konflikt religijny"
 fabricate_spread_the_true_faith_cb_title: "Sfabrykuj konflikt religijny"
 fabricate_spread_the_true_faith_cb_tooltip: "Ci niewierni nie zdają sobie sprawy z grzechu, jakim jest ich istnienie. Możemy sfabrykować powód, aby natychmiast przywrócić ich na łono prawdziwej wiary."
 fabricate_spread_the_true_faith_cb_desc: "Sfabrykowanie konfliktu religijnego zmniejszy rozmiar naszej siatki szpiegowskiej w państwie §Y[From.GetAdjective]§! o §R[Root.GetFabricateReligiousConflictCost]§! i zapewni nam casus belli «§YSzerzenie prawdziwej wiary§!» przeciwko państwu §Y[From.GetName]§!, pozwalający narzucić mu religię §Y[Root.Religion.GetName]§! przy znacznie niższym koszcie punktów wojennych.\n\nTen casus belli będzie ważny przez §Y5 lat§!.\n\n§YTen casus belli nie pozwala nam na zajęcie żadnych prowincji państwa [From.GetName].§!"
 fabricate_spread_the_true_faith_cb_tt: "To działanie dyplomatyczne pozwala wykorzystać naszą siatkę szpiegowską w państwach §Yheretyckich§! i §Ypogańskich§!, aby sfabrykować casus belli «§YSzerzenie prawdziwej wiary§!». Nie pozwala ono na podbój prowincji przeciwnika, ale znacznie obniża koszt narzucenia mu religii.\nPaństwa docelowe muszą znajdować się w §Yzasięgu handlowym§!."
