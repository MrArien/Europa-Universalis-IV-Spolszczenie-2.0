 promote_primary_culture_tooltip: "Wydaj §Yperskie wpływy§!, aby zmienić ich kulturę główną na naszą."
 promote_primary_culture_desc: "Czy chcesz wydać §R10,00§! §Yperskich wpływów§!, aby zmienić kulturę główną państwa §Y[From.GetName]§! na §Y[Root.Culture.GetName]§!?\n\nPaństwa, których kulturą główną jest §Y[Root.Culture.GetName]§!, nie ponoszą kosztu utrzymania w postaci §Yperskich wpływów§!, jeśli należą do naszej sfery wpływów kulturowych."
