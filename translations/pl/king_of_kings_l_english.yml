 PERSIA_CLOTH_FLOOD: "Nadmiar perskich dywanów"
 PERSIA_DYES_FLOOD: "Nadmiar perskich dywanów"
 flavor_per.19.c: "Obecny poziom sprzedaży dywanów jest wystarczający."
