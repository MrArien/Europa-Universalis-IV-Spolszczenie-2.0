 persian_influence_mechanic: "Perskie wpływy"
 ability_persian_influence_mechanic: "Perskie wpływy"
 persian_influence: "Perskie wpływy"
 persian_influence_desc: "Perskie wpływy to zasób odzwierciedlający rozwój i znaczenie kultury [Root.Culture.GetName] na świecie oraz uznanie, jakim darzą ją obce ludy. Można je wykorzystać do ustanowienia §Ysfery wpływów kulturowych§!, która umożliwia ekspansję państwa bez konieczności prowadzenia wojen.\nPerskie wpływy zyskujemy w następujący sposób:\n - §G+0,03§! miesięcznych perskich wpływów za każdy poziom §Ydoradcy administracyjnego§!\n - Dodatkowe §G+0,07§! miesięcznych perskich wpływów za każdy poziom doradcy typu §YArtysta§! lub §YFilozof§!\n - Wydarzenia związane z decyzją §YWspieraj sztukę§!\n\nPerskie wpływy tracimy w następujący sposób:\n - §R-0,01§! miesięcznych perskich wpływów za każdą prowincję, która nie należy do grupy kulturowej §Y[Root.Culture.GetGroupName]§!"
 monthly_persian_influence: "Miesięczne perskie wpływy"
 persian_influence_gain_modifier: "Modyfikator przyrostu perskich wpływów"
 influence_to_vassal_elevation_cost: "Koszt podniesienia rangi wasala"
 culturally_influencing_countries: "Państwa pod wpływem kulturowym"
 culturally_influencing_countries_same_culture: "Państwa pod wpływem kulturowym"
 culturally_influenced_country: "Państwo pod wpływem kulturowym"
 persian_influence_events.1000.t: "Koniec wpływów państwa [overlord_scope.GetAdjective]"
 persian_influence_events.1000.desc: "W wyniku wydarzeń i decyzji, które mogły być lub nie być zamierzone, religia państwowa naszego wielkiego kraju [Root.GetName] zmieniła się z [overlord_scope.Religion.GetName] na [Root.Religion.GetName]. W związku z tym nie możemy już liczyć na przychylność sfery wpływów kulturowych państwa [overlord_scope.GetAdjective]."
 persian_influence_events.1000.a: "Czas ruszyć dalej."
 persian_influence_events.1001.t: "Państwo [From.GetName] opuszcza sferę wpływów"
 persian_influence_events.1001.desc: "Na dwór dotarły straszne wieści! Państwo [From.GovernmentName], niegdyś będące poza naszymi granicami ostoją kultury [Root.Culture.GetName], opuściło naszą sferę wpływów kulturowych. Ci nikczemnicy przysięgli wierność ideom niewiernych i nie są już mile widziani w naszym gronie."
 persian_influence_events.1001.a: "To naprawdę złe wieści."
 persian_influence_events.2000.t: "Koniec wpływów państwa [Root.GetAdjective]"
 persian_influence_events.2000.desc: "W wyniku wydarzeń i decyzji, które mogły być lub nie być zamierzone, religia państwowa uległa radykalnej zmianie. Wskutek tego niegdyś wspaniała sfera wpływów kulturowych państwa [Root.GetAdjective] rozpadła się w chaosie, ponieważ nasze wyznania nie są już zgodne."
 persian_influence_events.2000.a: "Powinniśmy byli się tego spodziewać..."
 persian_influence_events.2000.a.tt: "§RKażde §Ypaństwo pod wpływem kulturowym§! uzyskuje niepodległość.§!"
 persian_influence_events.2001.t: "Koniec wpływów państwa [From.GetAdjective]"
 persian_influence_events.2001.desc: "Z dworu państwa [From.GetName] dotarły do nas wieści! W wyniku zamętu religijnego w tym kraju zmieniła się religia państwowa, a biurokracja odpowiedzialna za jego sferę wpływów kulturowych została sparaliżowana. Jego wpływy nad nami należą już do przeszłości."
 persian_influence_events.2001.a: "Czas ruszyć dalej."
 persian_influence_events.3000.t: "Koniec wpływów państwa [Root.GetAdjective]"
 persian_influence_events.3000.desc: "Sytuacja polityczna w państwie [Root.GetName] uległa ogromnym zmianom. Biurokrację ogarnął chaos, a administracja skupia się wyłącznie na przywróceniu porządku w państwie [Root.GovernmentName]. Nasza niegdyś wspaniała sfera wpływów kulturowych stała się jedynie odległym wspomnieniem."
 persian_influence_events.3000.a: "Kolejne mapy nadają się już tylko do wyrzucenia..."
 persian_influence_events.3001.t: "Koniec wpływów państwa [From.GetAdjective]"
 persian_influence_events.3001.desc: "Z dworu [From.Monarch.Getname] dotarły do nas wieści! W wyniku katastrof politycznych i wewnętrznego chaosu administracja tego państwa całkowicie utraciła zdolność zarządzania państwami zależnymi. Ich niegdyś opiekuńcza sfera wpływów kulturowych stała się jedynie odległym wspomnieniem."
 persian_influence_events.3001.a: "Czas ruszyć dalej."
 promoting_art_events.1.t: "Mecenat nad sztuką"
 promoting_art_events.1.desc: "Dwór [Root.GetAdjective] od zawsze interesował się pięknem sztuk świeckich, takich jak malarstwo, architektura i tkactwo. Nic więc dziwnego, że [Root.Monarch.GetTitle] [Root.Monarch.GetName] zaprosił na swój dwór najlepszych artystów, rzemieślników i krawców, aby mogli zaprezentować kunszt swojego fachu."
 promoting_art_events.1.a: "Architekt wzniesie w moim imieniu wspaniałą [Root.GetTempleName]."
 promoting_art_events.1.b: "Krawiec przygotuje najwspanialsze dywany dla mojego dworu."
 promoting_art_events.1.c: "Artysta namaluje najwspanialszy portret mojej skromnej osoby."
 UNTIL_ART_COMPLETION_TT: "do czasu ukończenia dzieła"
 promoting_art_events.2.t: "Ukończenie dzieła sztuki"
 promoting_art_events.2.desc: "Wielki artysta powrócił na nasz dwór! Jest pełen entuzjazmu z powodu swojego dzieła i zaprasza [Root.Monarch.GetTitle] do jego obejrzenia.\n[Root.GetWorkOfArtDescription]"
 MAGNIFICENT_BUILDING_STRING: "Na widok wspaniałej [Root.GetTempleName] [Root.Monarch.GetTitle] z trudem powstrzymuje łzy wzruszenia. Ani [Root.Monarch.GetSheHe], ani żaden z członków dworu nigdy wcześniej nie widział tak majestatycznej budowli.\nZewnętrzne ściany zdobią złożone, a zarazem pełne finezji wzory. Same drzwi przypominają wejście do miejsca, które niektórzy mogliby uznać za bramę do zaświatów. A sama bryła...\nTo prawdziwe dzieło sztuki, które zasługuje na miano monumentu państwa [Root.GetName]."
 SIGNIFICANT_BUILDING_STRING: "Oczy [Root.Monarch.GetTitle] podziwiają imponujący przykład [Root.GetAdjective] rzemiosła. Tak wspaniała budowla jest rzadkością, nawet w państwie [Root.GetName], które tak wiele uwagi poświęca sztuce i kulturze.\nKształt [Root.GetTempleName] symbolizuje boskość niebios, a jej barwy odzwierciedlają dobro tkwiące w ludzie [Root.GetAdjective]. Świątynia ta służy nie tylko praktycznym celom, lecz także dowodzi, że sztuka świecka i mistyczna mogą współistnieć w harmonii."
 NOTEWORTHY_BUILDING_STRING: "Choć interesująca i piękna sama w sobie, [Root.GetTempleName] zaprojektowana przez architekta nie robi większego wrażenia na [Root.Monarch.GetTitle] ani jego dworze. Mimo to z pewnością stanie się obiektem zazdrości naszych rywali.\nJej formy nie dorównują wspaniałości wielkich monumentów, lecz nadają budowli dostojny charakter. Kolorystyka również cieszy oko, zachowując przy tym umiar. Jest to bez wątpienia budowla godna uwagi."
 GREAT_BUILDING_STRING: "Architekt wyraźnie przesadził, opisując jakość i prestiż, jakie miała przynieść nam jego budowla. Jego dzieło ma pewien potencjał, a [Root.Monarch.GetTitle] potrafi dostrzec w nim ślady kunsztu artystycznego. Nie jest to jednak dzieło, które warto przekazywać potomnym.\n[Root.GetTempleName] została wzniesiona przede wszystkim z myślą o funkcjonalności, a nie pięknie. Jej formy są proste, a barwy niemal całkowicie nieobecne. Budowla spełnia swoje zadanie, lecz wyraźnie brakuje jej duszy."
 PATHETIC_BUILDING_STRING: "[Root.Monarch.GetTitle] musi na chwilę przystanąć, spoglądając na koszmarną konstrukcję przedstawioną [Root.Monarch.GetHerHim]. Słowa nie są w stanie opisać odrazy, jaką [Root.Monarch.GetHerHis] budzi dzieło stworzone przez architekta.\nPrzypomina [Root.GetTempleName] jedynie z grubsza swoim kształtem. Użyte materiały z pewnością widziały niejedno pole bitwy, a funkcjonalność budowli jest co najmniej wątpliwa. Jeden z doradców [Root.Monarch.GetHerHis] wysokości odważył się wejść do tej nędznej chaty i ledwo uszedł z życiem, gdy ominęła go o włos jedna z belek podporowych."
 MAGNIFICENT_CARPETS_STRING: "Na widok wspaniałych dywanów [Root.Monarch.GetTitle] z trudem powstrzymuje łzy wzruszenia. Ani [Root.Monarch.GetSheHe], ani żaden z członków dworu nigdy wcześniej nie widział tak niezwykłego dzieła sztuki tkackiej.\nPowierzchnia jest niezwykle miękka, a zarazem wytrzymała. Wzory cieszą oko i nadają dywanowi wyjątkowo szlachetny wygląd. Krawiec naprawdę przeszedł samego siebie!"
 SIGNIFICANT_CARPETS_STRING: "Oczy [Root.Monarch.GetTitle] podziwiają imponujący przykład [Root.GetAdjective] rzemiosła. Taki dywan jest rzadkością nawet w państwie [Root.GetName], które tak wiele uwagi poświęca sztuce i kulturze.\nTkanina jest delikatna, a mimo to zachowuje swój kształt i barwy nawet po długim użytkowaniu. Wzory są złożone, a czasem wręcz trudne do odczytania, lecz nadają dywanowi niepowtarzalne piękno. To bez wątpienia dzieło najwyższej jakości."
 NOTEWORTHY_CARPETS_STRING: "Choć interesujący i piękny sam w sobie, dywan przedstawiony przez tkacza nie robi większego wrażenia na [Root.Monarch.GetTitle] ani jego dworze. Mimo to z pewnością stanie się obiektem zazdrości naszych rywali.\nTkanina jest delikatna i tak cienka, że dywan nie nadaje się do położenia na podłodze. Jego wzornictwo i dobór materiału sprawiają jednak, że będzie godną uwagi ozdobą ściany."
 GREAT_CARPETS_STRING: "Krawiec wyraźnie przesadził, opisując jakość i prestiż, jakie miał przynieść nam jego dywan. Jego dzieło ma pewien potencjał, a [Root.Monarch.GetTitle] potrafi dostrzec w nim ślady kunsztu artystycznego. Nie jest to jednak dzieło, które warto przekazywać potomnym.\nWzór dywanu jest prosty, a jego powierzchnia szorstka w dotyku, choć świetnie sprawdzi się jako wycieraczka. Przedmiot jest funkcjonalny, lecz wyraźnie nie został stworzony po to, by cieszyć oko."
 PATHETIC_CARPETS_STRING: "[Root.Monarch.GetTitle] musi na chwilę przystanąć, spoglądając na kawałek materiału przedstawiony [Root.Monarch.GetHerHim]. Słowa nie są w stanie opisać odrazy, jaką [Root.Monarch.GetHerHis] budzi dzieło stworzone przez rzemieślnika.\n[Root.Monarch.GetTitle] nie jest nawet pewien, czy użyty materiał to rzeczywiście jedwab. Dotknięcie rzekomego dywanu sprawia, że [Root.Monarch.GetName] odruchowo się cofa. Na tkaninie znajduje się coś wyjątkowo odrażającego, a [Root.Monarch.GetTitle] woli nie wiedzieć, z czego wykonano te wzory..."
 MAGNIFICENT_PAINTING_STRING: "Na widok wspaniałego portretu [Root.Monarch.GetTitle] z trudem powstrzymuje łzy wzruszenia. Ani [Root.Monarch.GetSheHe], ani żaden z członków dworu nigdy wcześniej nie widział tak niezwykłego dzieła sztuki.\nPortret przedstawia z profilu samego [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Linie doskonale oddają kształt [Root.Monarch.GetHerHis] twarzy, a kolorystyka nadaje wizerunkowi niemal realistyczny wygląd. Jeden z doradców zażartował, że artysta może być szarlatanem, skoro portret bardziej przypomina lustro niż obraz."
 SIGNIFICANT_PAINTING_STRING: "Oczy [Root.Monarch.GetTitle] podziwiają imponujący przykład [Root.GetAdjective] rzemiosła. Taki obraz jest rzadkością nawet w państwie [Root.GetName], które tak wiele uwagi poświęca sztuce i kulturze.\nPortret przedstawia [Root.Monarch.GetTitle] [Root.Monarch.GetName] we własnej osobie. Linie oddające sylwetkę [Root.Monarch.GetHerHis] majestatu doskonale ukazują aurę władcy, a kolorystyka łączy artystyczną wizję z realistycznym przedstawieniem [Root.Monarch.GetHerHis] wyglądu."
 NOTEWORTHY_PAINTING_STRING: "Choć interesujący i piękny sam w sobie, portret przedstawiony przez artystę nie robi większego wrażenia na [Root.Monarch.GetTitle] ani jego dworze. Mimo to z pewnością stanie się obiektem zazdrości naszych rywali.\nPrzedstawia [Root.Monarch.GetName] stojącego w sali tronowej. Wyraźnie jednak widać, że malarz bardziej skupił się na samym dworze, przez co liczne postacie odwracają uwagę od głównego tematu. Obraz i tak doskonale nadaje się do ozdobienia pałacu."
 GREAT_PAINTING_STRING: "Malarz wyraźnie przesadził, opisując jakość i prestiż, jakie miało przynieść nam jego dzieło. Jego praca ma pewien potencjał, a [Root.Monarch.GetTitle] potrafi dostrzec w niej ślady kunsztu artystycznego. Nie jest to jednak dzieło, które warto przekazywać potomnym.\nObraz przedstawia miskę wypełnioną jabłkami. Autor nazywa to martwą naturą. Choć nie można odmówić mu pewnej jakości, obraz przedstawiający miskę jabłek pozostaje po prostu obrazem miski jabłek."
 PATHETIC_PAINTING_STRING: "[Root.Monarch.GetTitle] musi na chwilę przystanąć, spoglądając na zabrudzony papier przedstawiony [Root.Monarch.GetHerHim]. Słowa nie są w stanie opisać odrazy, jaką [Root.Monarch.GetHerHis] budzi dzieło stworzone przez rzemieślnika.\nObraz rzekomo przedstawia [Root.Monarch.GetName] — przynajmniej tak twierdzi artysta. Sylwetka domniemanego [Root.Monarch.GetTitle] jest całkowicie zniekształcona. Proporcje są nierealistyczne, a miejscami wręcz koszmarne. Po lekach, które przyjmował malarz, widać, że zdecydowanie było ich za mało.\nOburzony artysta twierdzi, że przyszłe pokolenia zrozumieją jego styl, a nasz najbardziej prestiżowy dwór jest zbyt «nieoświecony, by dostrzec finezję sztuki»."
 FALLBACK_ART_STRING: "Kiedy jednak artysta miał zaprezentować swoje dzieło, potrafił jedynie przedstawić serię wymijających wymówek. To zwykły oszust, który uważa [Root.Monarch.GetTitle] za głupca."
 promoting_art_events.2.a: "Dzieło tak doskonałe, że nie mogło powstać ludzką ręką!"
 promoting_art_events.2.b: "Wspaniałe dzieło!"
 promoting_art_events.2.c: "Prawdziwa sztuka!"
 promoting_art_events.2.d: "Przynajmniej spełnia swoje zadanie."
 promoting_art_events.2.e: "Oby nikt spoza państwa [Root.GetName] nie zobaczył tej potworności..."
 promoting_art_events.2.f: "Potrzebuję sztuki. Sztuki przedstawiającej [Root.GetName]!"
 promoting_art_events.3.t: "Artysta prosi o dodatkowe fundusze"
 promoting_art_events.3.desc: "Artysta zatrudniony przez [Root.Monarch.GetTitle] może być zaradny, lecz jego ambicje wyraźnie wykraczają poza możliwości zwykłego rzemieślnika. Skromny twórca zwrócił się więc do nas z prośbą o dodatkowe środki na realizację swojego dzieła."
 promoting_art_events.3.a: "Pozwólmy mu korzystać z naszego skarbca."
 promoting_art_events.3.b: "Podarujmy mu hojną sumę dukatów."
 promoting_art_events.3.c: "Zapewnijmy mu wszystkie potrzebne zasoby."
 promoting_art_events.4.t: "Artysta czyni znaczne postępy"
 promoting_art_events.4.desc: "Na dwór dotarły wieści od zatrudnionego artysty. Najwyraźniej znalazł on ważne źródło inspiracji, które pozwoliło mu szybko posunąć prace naprzód.\nWspomina również, że chciałby poddać swoje dzieło wstępnej ocenie — najlepiej przez kogoś innego niż [Root.Monarch.GetTitle]."
 promoting_art_events.4.a: "Wyślijmy do niego jednego z naszych znawców sztuki."
 promoting_art_events.4.b: "Z pewnością jeden z doradców może wcześniej ocenić dzieło."
 promoting_art_events.4.c: "Zaufajmy jego umiejętnościom. Ocena nie jest potrzebna."
 promoting_art_events.5.t: "Kryzys twórczy"
 promoting_art_events.5.desc: "W życiu artysty niewiele rzeczy jest gorszych od utraty twórczej weny. Nawet najprostszy obraz, najbardziej banalny wzór czy najkrótszy opis stają się wówczas większym wyzwaniem niż podbój obcego imperium.\nNasz zatrudniony artysta przeżywa właśnie taki kryzys, co znacznie spowalnia jego pracę."
 promoting_art_events.5.a: "«Zmotywujmy» artystę do powrotu do pracy."
 promoting_art_events.5.b: "Zapewnijmy mu trochę wolnego czasu na dworze."
 promoting_art_events.5.c: "Na dobre rzeczy trzeba poczekać."
 promoting_art_events.6.t: "Inspiracja kulturą państwa [target_country.Culture.GetName]"
 promoting_art_events.6.desc: "Nasz artysta zafascynował się stylem artystycznym kultury [target_country.Culture.GetName] i prosi o dwuletnią podróż do państwa [target_country.GetName], aby poszerzyć swoje horyzonty twórcze. Takie przedsięwzięcie wymaga oczywiście środków, a artyście mogą być również potrzebni ludzie do ochrony podczas podróży."
 promoting_art_events.6.a: "Przydzielmy mu kompanię do ochrony."
 promoting_art_events.6.a.tt: "Ze względu na dalekosiężną sławę artysty eskortujący go żołnierze nie zostaną uznani za akt militarny przeciwko państwu [target_country.GetName]."
 promoting_art_events.6.b: "Zamiast tego sprowadźmy na nasz dwór dzieła sztuki z państwa [target_country.GetName]."
 promoting_art_events.6.c: "Wyślijmy go samego."
 promoting_art_events.6.d: "Skontaktujmy się z dworem państwa [target_country.GetAdjective] i zapowiedzmy jego przybycie."
 per_traveling_artist: "Podróżujący artysta"
 promoting_art_events.7.t: "Artysta potrzebuje dodatkowych materiałów"
 promoting_art_events.7.desc: "Niektórzy artyści mają bardzo niekonwencjonalne metody pracy. Niestety, zatrudniony przez nas twórca należy właśnie do tej grupy. Wkroczył na nasz dwór, zaprezentował prawdziwe znaczenie ekscentryzmu i przedstawił listę niezwykle nietypowych przedmiotów.\nZazwyczaj takie zachowanie skończyłoby się szybkim uwięzieniem w [Root.GetAdjective] lochach. [Root.Monarch.GetTitle] wykazuje jednak cierpliwość, ponieważ chce zobaczyć dzieło tego artysty."
 promoting_art_events.7.a: "Spełnijmy jego życzenie."
 promoting_art_events.7.b: "Zdobądźmy te towary od stanu [Root.GetBurghersOrFallbackName]."
 promoting_art_events.7.c: "Nie możemy zdobyć dla niego tych przedmiotów."
 invite_into_cultural_sphere_of_influence: "Zaproś do sfery wpływów kulturowych"
 invite_into_cultural_sphere_of_influence_title: "Zaproś do sfery wpływów kulturowych"
 invite_into_cultural_sphere_of_influence_tooltip: "Zaprosimy ich do naszej §Ysfery wpływów kulturowych§!, czyniąc z nich dobrowolne państwo zależne."
 invite_into_cultural_sphere_of_influence_desc: "Czy chcesz zaprosić państwo §Y[From.GetName]§! do swojej §Ysfery wpływów kulturowych§! i uczynić z niego państwo zależne?\nJako suweren otrzymasz wezwanie do wojny, jeśli zostanie ono zaatakowane przez obce mocarstwo. Państwo zależne zachowa możliwość prowadzenia niezależnych stosunków dyplomatycznych z innymi krajami.\nMożesz inwestować §Yperskie wpływy§! w państwo §Y[From.GetName]§!, aby przekształcić je w §Ywasala§!.\n\nKażde §Ypaństwo pod wpływem kulturowym§! zwiększa koszt podniesienia rangi państwa zależnego do wasala o §R+20,00§! i powoduje utrzymanie w wysokości §R-0,20§! perskich wpływów miesięcznie (chyba że posiada ono kulturę główną §Y[Root.Culture.GetName]§!).\n§YPaństwo pod wpływem kulturowym natychmiast opuści sferę, jeśli jego religia przestanie być zgodna z naszą.§!"
 invite_into_cultural_sphere_of_influence_alert_tooltip: "Zaproszenie do ich §Ysfery wpływów kulturowych§!"
 invite_into_cultural_sphere_of_influence_dialog: "Państwo [This.GetName] chce zaprosić nas do swojej sfery wpływów kulturowych, obiecując ochronę przed zagrożeniami zewnętrznymi w zamian za comiesięczną opłatę."
 remove_them_from_cultural_sphere_of_influece: "Usuń ze sfery wpływów kulturowych"
 remove_them_from_cultural_sphere_of_influece_title: "Usuń ze sfery wpływów kulturowych"
 remove_them_from_cultural_sphere_of_influece_tooltip: "Usuń ich z naszej sfery wpływów kulturowych."
 remove_them_from_cultural_sphere_of_influece_desc: "Czy chcesz usunąć państwo §Y[From.GetName]§! z naszej sfery wpływów kulturowych? Pogorszy to nasze stosunki i ustanowi rozejm między nami na kolejne §Y5§! lat."
 remove_them_from_cultural_sphere_of_influece_alert_tooltip: "Przymusowe usunięcie nas z ich §Ysfery wpływów kulturowych§!"
 remove_them_from_cultural_sphere_of_influece_dialog: "Państwo [This.GetName] chce usunąć nas ze swojej sfery wpływów kulturowych, kończąc jednostronny układ zapewniający nam ochronę."
 leave_the_cultural_sphere_of_influece: "Opuść sferę wpływów kulturowych"
 leave_the_cultural_sphere_of_influece_title: "Opuść sferę wpływów kulturowych"
 leave_the_cultural_sphere_of_influece_tooltip: "Opuść ich sferę wpływów kulturowych."
 leave_the_cultural_sphere_of_influece_desc: "Czy chcesz opuścić §Ysferę wpływów kulturowych§! państwa §Y[From.GetName]§!? Nasza [Root.GetStabilityOrPrestigeLoss] spadnie o §R1§!, a stosunki między nami ulegną pogorszeniu."
 leave_the_cultural_sphere_of_influece_alert_tooltip: "Opuszczenie naszej sfery wpływów kulturowych"
 leave_the_cultural_sphere_of_influece_dialog: "Państwo [This.GetName] opuszcza naszą sferę wpływów kulturowych, kończąc układ, w ramach którego zapewnialiśmy mu ochronę w zamian za opłatę."
 join_cultural_sphere_of_influence: "Dołącz do sfery wpływów kulturowych"
 join_cultural_sphere_of_influence_title: "Dołącz do sfery wpływów kulturowych"
 join_cultural_sphere_of_influence_tooltip: "Zapytaj, czy możemy dołączyć do ich §Ysfery wpływów kulturowych§! i stać się państwem zależnym chronionym przed obcymi mocarstwami w zamian za comiesięczną opłatę."
 join_cultural_sphere_of_influence_desc: "Czy chcesz dołączyć do §Ysfery wpływów kulturowych§! państwa §Y[From.GetName]§!?\nJeśli zaakceptują naszą prośbę, będą chronić nas przed obcymi mocarstwami.\nZachowamy możliwość prowadzenia niezależnych stosunków dyplomatycznych z innymi państwami.\nMogą inwestować §Yperskie wpływy§! w państwo §Y[Root.GetName]§!, aby przekształcić nas w §Ywasala§!.\n\nKażde §Ypaństwo pod wpływem kulturowym§! zwiększa koszt podniesienia rangi państwa zależnego do wasala o §R+20,00§! i powoduje utrzymanie w wysokości §R-0,20§! perskich wpływów miesięcznie (chyba że posiadamy kulturę główną §Y[From.Culture.GetName]§!).\nJako państwo zależne otrzymamy §G+10§! opinii od innych państw wyznających tę samą religię.\n§YPaństwo pod wpływem kulturowym natychmiast opuści sferę, jeśli jego religia przestanie być zgodna z naszą.§!"
 join_cultural_sphere_of_influence_alert_tooltip: "Prośba o dołączenie do naszej §Ysfery wpływów kulturowych§!"
 join_cultural_sphere_of_influence_dialog: "Państwo [This.GetName] chce dołączyć do naszej sfery wpływów kulturowych i stać się naszym państwem zależnym."
