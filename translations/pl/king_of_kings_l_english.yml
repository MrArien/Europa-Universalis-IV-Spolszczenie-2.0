 desc_mamlukian_administration_modifier: "Ta prowincja jest zarządzana przez mameluków, którzy podlegają nadzorowi perskiej arystokracji. Choć system ten w pewnym stopniu decentralizuje imperium, pozwala zapewnić stabilność i dobrobyt w Egipcie bez konieczności znacznego zaangażowania władz centralnych."
