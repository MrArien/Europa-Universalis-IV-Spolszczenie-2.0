 kashifs: "Kaszyfowie"
 kashifs_desc: "Kaszyfowie to urzędnicy administracyjni odpowiedzialni między innymi za prowadzenie rejestrów, korespondencję, sprawy finansowe i komunikację w imieniu władzy. Odgrywają kluczową rolę w funkcjonowaniu aparatu państwowego i zapewnianiu sprawnego zarządzania. Są to zazwyczaj wykształcone osoby, które pomagają kierować sprawami państwa i pośredniczą między władcą a różnymi grupami społeczeństwa."
 mam_export_grain_title: "Eksport zboża"
 mam_export_grain_desc: "Czy chcemy eksportować zboże do państwa §Y[From.GetName]§!? Będzie nas to kosztować 50 £adm£, ale zyskamy §G+2§! merkantylizmu. \\n\\nPaństwo [From.GetName] otrzyma modyfikator „§YImport zboża§!” do śmierci swojego władcy lub zerwania stosunków dyplomatycznych z nami, zapewniający następujące efekty:\\nModyfikator limitu zaopatrzenia: §G+10%§!\\nKoszt rozwoju: §G-5%§!\\nNiepokoje narodowe: §G-1§!"
