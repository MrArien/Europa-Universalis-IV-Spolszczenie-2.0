 enforced_religion_different_group: "Narzucona religia"
 enforced_culture: "Narzucona kultura"
 replaced_governor: "Zastąpiony gubernator"
 paid_subject_loan: "Spłacone nasze pożyczki"
 bestowed_gifts: "Obdarzeni prezentami"
 sent_additional_troops: "Wyślij nam dodatkowe oddziały"
 demanded_artifacts: "Wymagane artefakty"
 demanded_additional_tribute: "Wymagany dodatkowy trybut"
 forced_seppuku: "Przymusowe seppuku"
 contributed_to_capital: "Wniesiono wkład do stolicy"
 conscripted_general: "Zwerbowany generał"
 forced_isolation: "Narzucony Izolacjonizm"
 lost_independence_war: "Przegrana wojna o niepodległość"
 enforced_peace: "Narzucony pokój"
 dan_pluralistic_government: "Pluralistyczny rząd"
 desc_dan_pluralistic_government: "Nasz władca odsunął na bok Radę Królewską złożoną ze szlachty i biskupów, a zamiast tego rządzi przy wsparciu stanu kupieckiego. Nie przysparza nam to popularności poza gronem najważniejszych mieszczan, lecz pozwala rozwijać kraj w duchu pluralizmu."
 danish_dutch_burgundian_inspiration: "Proholenderskie polityki w Danii"
 growth_of_the_cattle_trade: "Rozwój handlu bydłem"
 desc_growth_of_the_cattle_trade: "Nagły wzrost popytu na woły i inne produkty rolne, w które obfituje nasz kraj, przyniósł znaczne ożywienie gospodarcze. Wraz ze wzrostem potęgi gospodarczej i politycznej wielkich właścicieli ziemskich drobni rolnicy i wolni chłopi tracą coraz więcej praw i znaczenia."
 dan_ulfeldt_deposed: "Zapewniona Władza nad Radą Królewską"
 desc_dan_ulfeldt_deposed: "Odsunięcie Corfitza Ulfeldta i rozbicie jego wpływów wśród najwyższej szlachty wzmocniło monarchię duńską."
 dan_council_empowered: "Potężna rada królewska"
 desc_dan_council_empowered: "Ulegając próbom ograniczenia władzy monarchii przez Radę Królewską, poważnie osłabiliśmy naszą pozycję do rządzenia królestwem."
 junker_dominance_prussian_monarchy: "Dominacja junkrów"
 desc_junker_dominance_prussian_monarchy: "Nasza niegdyś dumna monarchia została sprowadzona do roli pieczęci, którą wpływowi możni zatwierdzają decyzje rządu. Ci sami arystokraci, którzy sprawują władzę, systematycznie ograbiają skarb państwa."
 umera_dominance_ottoman_government: "Dominacja ümery"
 desc_umera_dominance_ottoman_government: "Choć dynastia Osmanów nadal formalnie włada naszym krajem, Ümera przejęła kontrolę nad majątkiem naszej rodziny i odebrała dworowi sułtańskiemu całą rzeczywistą władzę. Jej przedstawiciele systematycznie bogacą się naszym kosztem i nadużywają powierzonej im władzy."
 bushi_power_japan: "Dominacja bushi"
 desc_bushi_power_japan: "Nasz niegdyś dumny kraj znalazł się pod całkowitą kontrolą rozmaitych pomniejszych stronnictw i klik na dworze. Władza należy do tych bushi, którzy kontrolują dwór, a prawdziwa głowa dynastii została sprowadzona do roli marionetki."
 boyar_dominance: "Dominacja bojarów"
 desc_boyar_dominance: "Nasz niegdyś dumny kraj został całkowicie zdominowany przez bojarów, którzy niemal zupełnie pozbawili władcę autorytetu. Wszystkie decyzje nadal wymagają formalnej zgody suwerena, lecz rada najznamienitszych arystokratów ma swobodny dostęp do odpowiedniej liczby pieczęci, by łatwo obejść tę formalność."
 chi_local_trade_regulations: "Regulacje handlu lokalnego"
 desc_chi_local_trade_regulations: "Lokalny handel kwitnie dzięki miejscowym, nielegalnym inicjatywom urzędników tej prowincji, na które rząd przymyka oko."
 chi_local_trade_down_turn: "Zamknięte biuro handlowe"
 desc_chi_local_trade_down_turn: "Kupcy w tej prowincji tracą źródła utrzymania, odkąd rząd centralny ukrócił lokalne regulacje ułatwiające prowadzenie handlu."
 enraged_ikko_ikki: "Wściekłość Ikko-Ikki"
 desc_enraged_ikko_ikki: "Nasze działania rozgniewały członków Ikko-ikki w tej prowincji, którzy teraz zdecydowanie sprzeciwiają się naszym rządom."
 chinese_millenarianism_area: "Społeczność Millenarystów"
 desc_chinese_millenarianism_area: "Nasza słaba władza doprowadziła do powstania licznych ruchów millenarystycznych, które sieją w tym regionie chaos i zniszczenie."
 chi_upset_local_nobles: "Zdenerwowana szlachta"
 desc_chi_upset_local_nobles: "Miejscowa szlachta jest oburzona, że przerwaliśmy obiecującą karierę wojskową potomka jej najznamienitszej dynastii."
 chi_false_edicts_modifier: "Fałszywe edykty"
 desc_chi_false_edicts_modifier: "Pozwalając na rozpowszechnianie fałszywych edyktów i udając, że pochodzą od nas, przyczyniliśmy się do wzrostu liczby lokalnych inicjatyw osłabiających władzę centralną. Coraz wyraźniej widać, że miejscowi gubernatorzy uważają, iż mogą robić, co im się podoba."
 chi_no_law_and_order: "Brak prawa i porządku"
 desc_chi_no_law_and_order: "Nie potrafimy zapewnić bezpieczeństwa kupcom podróżującym naszymi drogami, przez co zamykają oni interesy lub szukają innych sposobów ochrony. Niektórzy nie są już w stanie płacić podatków, a inni nie chcą tego robić, skoro nie otrzymują niczego w zamian."
 chi_military_protecting_traders: "Wojskowa infrastruktura ochronna"
 desc_chi_military_protecting_traders: "Aby chronić naszą gospodarkę, musieliśmy skierować wojsko do pilnowania porządku. W znacznym stopniu obciąża to budżet wojskowy."
 chi_lowered_taxes_in_state: "Obniżone podatki"
 desc_chi_lowered_taxes_in_state: "Pod wpływem klasycznych ideałów naszych urzędników obniżyliśmy podatki w tym stanie, aby umożliwić mu rozkwit."
 chi_efficient_taxation: "Skuteczne opodatkowanie"
 desc_chi_efficient_taxation: "Czasami sprawowanie rządów wymaga pragmatycznego podejścia. Sprawny aparat państwowy zdołał zwiększyć podatki od nadwyżek produkcji."
 chi_forts_underfunded: "Uszkodzony fort"
 desc_chi_forts_underfunded: "Z powodu korupcji fortyfikacje tej prowincji znajdują się w opłakanym stanie. Przywrócenie im pełnej sprawności jako obiektom obronnym zajmie trochę czasu."
 chi_low_mandate_subjects: "Cesarz bez mandatu"
 chi_order_restored: "Przywrócony porządek"
 desc_chi_order_restored: "Tymczasowo zamknęliśmy biura handlowe tej prowincji dla zagranicznych kupców i wydaliliśmy wszystkich cudzoziemców, aby przywrócić prawo i porządek."
 chi_renewing_the_examination_essay: "Odnowa egzaminów cesarskich"
 desc_chi_renewing_the_examination_essay: "Odpowiedzieliśmy na postulaty zwolenników reformy egzaminów cesarskich. Odnowimy nie tylko sam system, lecz także zadbamy, by nowe pokolenie urzędników cechowało się elastycznością intelektualną."
 chi_unhealthy_political_climate: "Spiski i zabójstwa"
 desc_chi_unhealthy_political_climate: "Atmosfera polityczna w stolicy staje się coraz bardziej toksyczna. Morderstwa i zdrady stanu powszednieją, a zarządzanie odległymi prowincjami na tym cierpi."
 chi_trade_opportunity: "Okazje handlowe"
 chi_separatist_sentiments: "Lokalny separatyzm"
 desc_chi_separatist_sentiments: "Lokalni książęta z wielkim zainteresowaniem obserwują upadek władzy centralnej w tej prowincji, czekając na odpowiedni moment do ataku."
 china_gifted_official: "Obdarowany urzędnik"
 desc_china_gifted_official: "Tym stanem zarządza jeden z naszych najzdolniejszych urzędników, najlepszy w swoim roczniku i chluba całego korpusu administracyjnego."
 japanese_downprioritized_military: "Pozbawione pierwszeństwa wojsko"
 desc_japanese_downprioritized_military: "Osiągnęliśmy znaczny zysk, sprzedając broń przeznaczoną dla naszej armii. Nasi żołnierze nie pozostali obojętni na tę decyzję, a oszczędzanie na ich wyposażeniu poważnie osłabiło ich morale."
 japanese_jokamachi: "Jokamachi"
 desc_japanese_jokamachi: "Jōkamachi, czyli miasta zamkowe, powstawały wokół japońskich zamków, umożliwiając ściślejszą kontrolę nad samurajami i znacznie zwiększając dobrobyt."
 jap_za_monopoly: "Monopolistyczne Za"
 desc_jap_za_monopoly: "Gildie kupieckie, zwane za, choć chronią kupców przed bandytami, samurajami i daimyō, stały się coraz potężniejsze, niezależne i monopolistyczne. Władca kraju nie podjął próby ograniczenia ich wpływów."
 jap_za_monopoly_province: "Prowincja kontrolowana przez Za"
 desc_jap_za_monopoly_province: "Ta prowincja znajduje się pod kontrolą coraz potężniejszych i bardziej niezależnych gildii za."
 jap_gossip_spies: "Wyborni szpiedzy"
 desc_jap_gossip_spies: "Nasi szpiedzy dowiedli swojej wartości, zdobywając niezwykle cenne informacje."
 jap_sword_of_the_daimyo: "Miecz daimyo"
 desc_jap_sword_of_the_daimyo: "Chociaż staliśmy się przerażającą siłą, traktujemy naszych przeciwników z taktem i szacunkiem."
 jap_unruly_samurai: "Buntowniczy samurajowie"
 desc_jap_unruly_samurai: "Panujący ostatnio pokój spowodował, że wielu samurajów szukało „alternatywnego zatrudnienia” poprzez wykorzystywanie i uciskanie miejscowej ludności."
 national_bank_inflation: "Polityka ograniczania inflacji"
 desc_national_bank_inflation: "Polityka pieniężna naszego kraju koncentruje się na ograniczaniu inflacji z korzyścią dla całej gospodarki."
 national_bank_interest: "Rozwój sektora finansowego"
 desc_national_bank_interest: "Polityka pieniężna naszego kraju koncentruje się na pozyskiwaniu jak najkorzystniejszych pożyczek."
 crushed_local_authority: "Zdławiona siła lokalna"
 desc_crushed_local_authority: "Całkowicie pozbawiliśmy dawne instytucje lokalne wpływów, zastępując je biurokracją kontrolowaną przez rząd."
 central_authority_asserted: "Zatwierdzony centralny autorytet"
 desc_central_authority_asserted: "Udało nam się zwiększyć wpływy nad wieloma lokalnymi instytucjami królestwa, które początkowo nie chciały dzielić się władzą. Dzięki temu nasze państwo jest silniejsze i bardziej podporządkowane władzy centralnej niż kiedykolwiek."
 central_authority_subjected: "Pokonana władza centralna"
 desc_central_authority_subjected: "Nie zdołaliśmy umocnić władzy rządu centralnego wobec jawnego oporu i buntów w prowincjach, przez co nasz autorytet został poważnie nadszarpnięty. Przez pewien czas utrudni to dalszą centralizację."
 hardline_court_and_country: "Stanowcze próby centralizacji"
 desc_hardline_court_and_country: "Przyjęliśmy bezkompromisową politykę konfrontacji wobec wszystkich, którzy sprzeciwiają się naszym działaniom na rzecz centralizacji."
 negotiating_court_and_country: "Negocjacje w sprawie wzmocnienia władzy centralnej"
 desc_negotiating_court_and_country: "Podjęliśmy negocjacje z posiadaczami lokalnej władzy, zamierzając wykorzystać przewagę rządu centralnego, by skłonić ich do porzucenia dawnych praw i tradycji."
 cnc_refused_to_pay_taxes: "Odmowa zapłaty podatków"
 desc_cnc_refused_to_pay_taxes: "Ten region aktywnie stara się unikać płacenia podatków, które na niego nałożyliśmy."
 cnc_local_authority_asserted: "Wykonywanie rozporządzeń"
 desc_cnc_local_authority_asserted: "Siłą zmiażdżyliśmy lokalnych posiadaczy władzy, którzy sprzeciwiali się naszym próbom centralizacji w tej prowincji."
 court_and_country_hardline_vs_separatists: "Zwalczanie separatyzmu"
 desc_court_and_country_hardline_vs_separatists: "Wszelkie oznaki buntu w tym regionie spotkają się wyłącznie z żelazną odpowiedzią. Nasi lokalni przedstawiciele otrzymali polecenie, by przykładnie karać każdy przejaw separatyzmu."
 court_and_country_concessions_to_separatists: "Ustępstwa wobec ludności"
 desc_court_and_country_concessions_to_separatists: "Złożyliśmy mieszkańcom tego regionu daleko idące gwarancje, aby nie sprzeciwiali się naszym wysiłkom na rzecz stworzenia silniejszego i bardziej zjednoczonego państwa."
 proclamation_of_year_modifier: "Proklamacja pokoju"
 desc_proclamation_of_year_modifier: "Aby zachować dobre stosunki z sąsiednimi plemionami tubylczymi, nasz suweren wydał proklamację zakazującą nam atakowania tych ludów. Znacznie utrudnia nam to uzasadnianie ekspansji na ziemie tubylców."
 heian_kyo: "Heian-kyo"
 desc_heian_kyo: "To cesarska stolica Japonii. Cesarze i ich dwór rezydują tu od stuleci. Dzięki temu Kioto stało się politycznym centrum Japonii i kluczowym punktem dla każdego, kto pragnie wywierać wpływ na rząd cesarski.\\n\\n§MKraj może przejąć urząd sioguna i zostać suwerenem wszystkich podległych daimyō, zajmując prowincję Kioto.§!"
 ise_grand_shrine: "Jingu"
 desc_ise_grand_shrine: "W tej prowincji znajduje się Wielki Chram Ise. Poświęcony bogini słońca Amaterasu, jest jednym z najświętszych miejsc shintō i ważnym celem pielgrzymek mieszkańców całej Japonii."
 chi_purging_officials: "Usuwanie nieposłusznych urzędników"
 desc_chi_purging_officials: "Usuwamy z administracji wszystkich nielojalnych urzędników, aby stworzyć wierny nam aparat władzy w naszym imperium."
 boh_hussite_king: "Rządy husyckie"
 desc_boh_hussite_king: "Nasz władca popiera husytów, ruch religijny założony przez Jana Husa w opozycji do Kościoła katolickiego. Choć ruch ten cieszy się ogromną popularnością wśród naszych poddanych, pozostali chrześcijańscy władcy Europy są wobec nas co najmniej wrogo nastawieni."
 siberian_investors: "Syberyjskie centrum handlowe"
 desc_siberian_investors: "Miasto przeżywa znaczny rozkwit gospodarczy dzięki wielkim przywilejom przyznanym kupcom działającym na syberyjskim pograniczu."
 stroganov_deal_provinces: "Przywilej kupiecki"
 desc_stroganov_deal_provinces: "Prowincja została oddana na wiele lat jednej z wpływowych rodzin kupieckich naszego kraju. Została skolonizowana bez udziału rządu, lecz do wygaśnięcia przywileju przynosi państwu niewielkie dochody."
 siberian_local_problems: "Bezładne pogranicze"
 desc_siberian_local_problems: "Nadmiernie agresywne działania poszukiwaczy fortuny doprowadziły do spadku dochodów z tego regionu i zaostrzenia napięć między miejscową ludnością a przybyszami."
 hun_banditry_in_upper_hungary: "Bandyci na prowincji"
 desc_hun_banditry_in_upper_hungary: "Okoliczne tereny znajdują się pod kontrolą band byłych najemników, którzy z braku konfliktów zbrojnych, w których mogliby zarobić na życie, zajęli się rozbojem."
 hun_curtailing_banditry_in_upper_hungary: "Zwalczanie rozbójnictwa"
 desc_hun_curtailing_banditry_in_upper_hungary: "Aktywnie zwalczamy falę rozbojów w tym regionie, której przewodzą bezrobotni najemnicy."
 hun_black_army: "Czarna armia"
 desc_hun_black_army: "Zorganizowaliśmy armię tak, by posiadała kosztowną, lecz zawodową stałą formację. Możemy wystawić siły najemne sprawniejsze niż armie jakiegokolwiek innego państwa, jednak utrzymanie ich będzie nieustannie obciążać naszą gospodarkę."
 EST_VAL_ABOLISHED_BLACK_ARMY: "Zlikwidowano Czarną armię: §Y$VAL$%§! "
 EST_VAL_BLACK_ARMY: "Czarna armia: §Y$VAL$%§!"
 mercenary_concessions: "Ustępstwa na rzecz najemników"
 desc_mercenary_concessions: "Przekazaliśmy ziemię w tym regionie jednemu z najemnych dowódców i jego ludziom, aby zapobiec ich buntowi."
 hun_poorly_maintained_fortifications: "Zaniedbana twierdza"
 desc_hun_poorly_maintained_fortifications: "Wielka twierdza w Belgradzie popada obecnie w ruinę, ponieważ korona węgierska nie jest w stanie uzyskać od węgierskich stanów funduszy na jej remont."
 hun_frontier_fortresses: "System végvárów"
 desc_hun_frontier_fortresses: "Korona regularnie przeznacza dodatkowe środki na utrzymanie sieci potężnych umocnień otaczających całe nasze królestwo."
 hun_invited_jesuits: "Zaproszeni jezuici"
 hun_reformed_colleges: "Zreformowane kolegia"
 desc_hun_reformed_colleges: "Region ten niedawno przyjął wiarę reformowaną i korzysta obecnie ze zwiększonego napływu idei oraz nauk z szerokiego kręgu europejskich wspólnot reformowanych."
 hun_counter_reformation: "Węgierska kontrreformacja"
 desc_hun_counter_reformation: "Aktywnie przeciwdziałamy szerzeniu się reformacji w naszym kraju. W tym celu zwróciliśmy się o pomoc do papiestwa i jezuitów."
 hab_royal_hungary: "Królewskie Węgry"
 desc_hab_royal_hungary: "Choć stany węgierskie wybrały naszego władcę na swojego opiekuna, zachowały liczne prawa i gwarancje, przez co ich ziemie są słabiej zintegrowane z naszym państwem, niż byśmy sobie życzyli."
 hun_military_frontier_modifier: "Węgierska Granica Wojskowa"
 desc_hun_military_frontier_modifier: "Dzięki znacznym przywilejom dla osadników przybywających na tereny Granicy Wojskowej sprawiliśmy, że miejscowa ludność jest w pełni nastawiona na obronę przed naszymi wrogami."
 hun_great_balkan_migration: "Wielka migracja bałkańska"
 desc_hun_great_balkan_migration: "Prowincja ta doświadcza wielkiego napływu uchodźców z Imperium Osmańskiego. Ułatwia to rozwój i odbudowę miejscowych miast, lecz samo w sobie powoduje również zniszczenia i napięcia."
 hun_city_league_obligation: "Obrona w zamian za przywileje"
 desc_hun_city_league_obligation: "Wydobycie surowców w tej prowincji przeżywa obecnie rozkwit, a w zamian za możliwość eksploatacji miejscowych zasobów związki miejskie uczestniczą w obronie kraju."
 hun_city_leagues_protected: "Rozkwit górnictwa"
 desc_hun_city_leagues_protected: "Dzięki szerokiemu zakresowi swobód społeczności górnicze tej prowincji szybko się rozwijają, a lokalna gospodarka rozkwita."
 slovak_national_awakening: "Lokalny separatyzm"
 desc_slovak_national_awakening: "Słowacy coraz silniej rozwijają świadomość narodową i zaczynają otwarcie domagać się prawa do samostanowienia."
 slovak_autonomy: "Słowacka świadomość narodowa"
 desc_slovak_autonomy: "Rozwijający się słowacki ruch narodowy skłonił nas do przyznania tym prowincjom większej swobody i autonomii."
 hun_kurucs: "Kurucowie i hajducy"
 desc_hun_kurucs: "Próbujemy włączyć nieregularne oddziały kuruców i hajduków do naszych sił zbrojnych, licząc, że da nam to przewagę nad wrogami. Wymaga to jednak przymykania oka na przewinienia tych ludzi, którzy często są zbiegłymi chłopami pańszczyźnianymi, a nawet rozbójnikami."
 tr_kremlin_improvements: "Odnowiony Kreml"
 desc_tr_kremlin_improvements: "Włożyliśmy wiele wysiłku w modernizację i odnowienie tego Kremla. Dzięki temu stał się on potężną budowlą obronną, zdolną zapewnić schronienie i ochronę naszemu ludowi oraz ukazywać naszą potęgę wszystkim, którzy zechcą ją dostrzec."
 honest_administrators: "Uczciwi administratorzy"
 desc_honest_administrators: "Powszechne zaufanie do naszej administracji i brak łapówek sprawiają, że jej utrzymanie jest znacznie prostsze niż w większości innych państw."
 serf_desertion: "Bunty Kozaków i ucieczki chłopów pańszczyźnianych"
 desc_serf_desertion: "Po całkowitej utracie kontroli nad stanem kozackim nasi chłopi pańszczyźniani coraz liczniej opuszczają kraj, by przyłączyć się do wolnych Kozaków na stepach."
 granary_of_the_mediterranean: "Spichlerz Morza Śródziemnego"
 desc_granary_of_the_mediterranean: "Delta Nilu należy do najżyźniejszych obszarów uprawy zbóż na świecie i od tysiącleci zaopatruje wielkie miasta śródziemnomorskich imperiów."
 coffea_arabica_modifier: "Kawa arabska"
 desc_coffea_arabica_modifier: "Żadne ziarna nie dorównują jakością ani ilością kawie z Mochy, dlatego miasto stało się głównym światowym ośrodkiem jej handlu, a jego nazwa stała się synonimem samego napoju. Aby zachować tę przewagę, kupcy z Mochy z największą troską strzegą krzewów rosnących na tych ziemiach."
 enemies_sacked_city: "Okrucieństwa nieprzyjaciela"
 desc_enemies_sacked_city: "Okrucieństwa popełnione przez wrogie wojska na naszych ziemiach były tak przerażające, że zjednoczyły lud wokół nas."
 soldiers_stimulating_local_economy: "Ożywienie lokalnej gospodarki"
 desc_soldiers_stimulating_local_economy: "W czasie pokoju wielu naszych żołnierzy otrzymujących żołd zajęło się handlem i rzemiosłem, pobudzając lokalną gospodarkę tego obszaru."
 integration_of_local_militias: "Integracja lokalnych milicji"
 desc_integration_of_local_militias: "Realizujemy program profesjonalizacji lokalnych milicji w odległych zakątkach naszego kraju."
 thriving_weapons_industry: "Rozkwit przemysłu zbrojeniowego"
 desc_thriving_weapons_industry: "Rozbudowa naszej zawodowej armii doprowadziła do rozkwitu działalności wielu producentów broni, w tym manufaktury w tej prowincji."
 regimental_town: "Miasto pułkowe"
 desc_regimental_town: "Umieszczenie wojskowych budowli wsparcia w tej prowincji pobudziło rozwój miast i lokalnej gospodarki."
 wargames: "Gry wojenne"
 desc_wargames: "Dzięki rozległym i kosztownym ćwiczeniom wojennym oraz odtwarzaniu historycznych bitew nasi żołnierze i oficerowie zdobywają cenne doświadczenie i przygotowanie do przyszłych kampanii."
 cheated_rolls: "Skorumpowani werbownicy"
 desc_cheated_rolls: "Nasi lokalni werbownicy dla własnych korzyści znacznie wyolbrzymili liczbę żołnierzy, których mogą zebrać."
 reassessement_provinces: "Ponowna kontrola"
 desc_reassessement_provinces: "Przeprowadzamy dokładne dochodzenie w sprawie wartości ziemi i ludzi w tym obszarze po tym, jak dowiedzieliśmy się, że nasi lokalni przedstawiciele znacznie przesadzili z liczbą żołnierzy, których można zwerbować z tego obszaru. Przeszukiwanie życia ludzi i kategoryzowanie wszystkiego, co posiadają, prawdopodobnie nie przysporzy nam wielu przyjaciół wśród miejscowych, ale zwiększy efektywność przyszłej rekrutacji i opodatkowania."
 gunpowder_core: "Elitarne pułki"
 desc_gunpowder_core: "Stworzyliśmy niewielki trzon pułków bezpośrednio podległych państwu, wyposażonych w najlepszy sprzęt i poddawanych najbardziej rygorystycznemu szkoleniu. Odpowiednie wykorzystanie tych oddziałów może dać nam przewagę w walce, a przede wszystkim pozwala ustalić, jak rozwijać nasze siły zbrojne w przyszłości."
 standardized_uniforms_modifier: "Ustandaryzowane mundury"
 desc_standardized_uniforms_modifier: "Rozpoczęliśmy ujednolicanie umundurowania i wyposażenia wszystkich podległych nam wojsk. Ułatwia to odróżnianie swoich od wrogów na polu bitwy, a zarazem sprzyja rozwojowi zawodowej armii."
 spread_of_enlightenment_ideals: "Szerzenie idei oświecenia"
 desc_spread_of_enlightenment_ideals: "Wraz z upowszechnianiem się umiejętności czytania i pisania idee oświecenia oraz słowa wielkich filozofów docierają do coraz większej liczby naszych poddanych."
 bookmarket_of_x: "Wielki targ książek"
 desc_bookmarket_of_x: "Prowincja ta stała się ważnym ośrodkiem handlu książkami. Działa tu prężna lokalna produkcja, a ludzie z całego regionu przybywają, by kupować i sprzedawać książki."
 grand_bank_fisheries: "Rybołówstwo Wielkich Wybrzeży"
 desc_grand_bank_fisheries: "Obszar ten słynie z obfitości ryb i dostarcza ich znacznie więcej niż jakiekolwiek łowiska Starego Świata."
 diamond_district: "Dzielnica diamentów"
 desc_diamond_district: "W prowincji tej rozwinął się prężny przemysł szlifierski, który przyciąga cenne kamienie, rzemieślników zajmujących się ich obróbką oraz kupców z całego świata pragnących je nabywać."
 shahrukhs_empire: "Imperium Szahrucha"
 desc_shahrukhs_empire: "Szahruch udowodnił, że jest prawdziwym synem Timura i zjednoczył ziemie, które podbił jego ojciec. Przez 40 lat żelazną pięścią rządził Iranem, Chorasanem i Transoksanią tłumiąc wszelkie bunty i jednocześnie wspierając sztukę i handel w całym królestwie. Wszystkich timurydzkich książąt uczynił gubernatorami, a siebie niekwestionowanym przywódcą timurydzkiej dynastii.\n\nJednak pod koniec życia zdrowie Szahrucha jest wątłe, a jego możliwości ograniczone. Tylko czas pokaże, czy po jego odejściu ktoś może przyjąć rolę jednego władcy wszystkich timurydzkich prowincji."
 dhimmi_building_restrictions: "Ograniczenia budowlane zimmi "
 desc_dhimmi_building_restrictions: "Egzekwujemy przepisy określające, jak wysokie mogą być budynki należące do dhimmi lub wznoszone przez nich w porównaniu z budowlami wiernych."
 perfume_capital: "Stolica perfum"
 desc_perfume_capital: "[Root.GetName] jest ważnym ośrodkiem produkcji perfum. Miejscowe kwiaty, importowane kadzidła i inne wonne składniki trafiają w ręce najwybitniejszych perfumiarzy świata, którzy tworzą poszukiwane, ekskluzywne zapachy eksportowane na cały kontynent."
 purification_of_tax_laws: "Przejrzystość przepisów podatkowych"
 desc_purification_of_tax_laws: "Jak przystało na sprawiedliwe państwo, usuwamy niesłuszne podatki, aby nasz system fiskalny był bardziej zgodny z szariatem."
 heir_is_our_heir: "Następca jest naszym spadkobiercą"
 desc_heir_is_our_heir: "Mieszkańcy tej prowincji są zadowoleni z działań naszego królewskiego następcy tronu."
 support_for_ruler: "Lokalne poparcie dla władcy"
 desc_support_for_ruler: "Nasz władca, który mówi językiem miejscowej ludności i przestrzega jej zwyczajów, może liczyć na poparcie mieszkańców tej prowincji."
 foreigner_on_throne: "Obcy na Tronie"
 desc_foreigner_on_throne: "Nasz władca wydaje się wielu mieszkańcom tej prowincji obcy i nieprzystępny. Nie ufają mu jeszcze ani jego zamiarom."
 heretic_on_throne: "Heretyk u władzy"
 desc_heretic_on_throne: "Mieszkańcy tej prowincji są niezadowoleni i zaniepokojeni herezją, którą dostrzegają w stolicy."
 support_for_heretic_ruler: "Wsparcie dla władcy"
 desc_support_for_heretic_ruler: "Mieszkańcy tej prowincji są podbudowani poparciem, jakiego ich władca udziela ich religii."
 support_for_heathen_ruler: "Wsparcie dla władcy"
 desc_support_for_heathen_ruler: "Mieszkańcy tej prowincji są podbudowani poparciem, jakiego ich władca udziela ich religii."
 heathen_on_throne: "Rządy innowiercy"
 desc_heathen_on_throne: "Mieszkańcy tej prowincji gwałtownie zareagowali na przejęcie władzy w ich kraju przez innowiercę."
 alien_ruler: "Opozycja wobec obcego władcy"
 desc_alien_ruler: "W prowincji tej doszło do powszechnego sprzeciwu wobec rządów osoby, która nie podziela kultury ani religii warstw rządzących w ich kraju."
 supressed_religious_minority: "Prześladowana mniejszość religijna"
 desc_supressed_religious_minority: "W prowincji tej mieszka wielu niedawnych konwertytów na religię odmienną od wyznania większości. Podjęliśmy działania, aby pozostała ona wierna jedynemu prawdziwemu obrządkowi."
 supressing_personal_faith: "Tłumienie osobistej wiary"
 desc_supressing_personal_faith: "Choć nasz [Root.Monarch.GetTitle] sam [Root.Monarch.GetHerselfHimself] nie jest prawdziwym wyznawcą religii państwowej, tłumi [Root.Monarch.GetHerHis] osobiste przekonania dla dobra państwa."
 increased_tolerance_of_heretics: "Większa tolerancja wobec heretyków"
 desc_increased_tolerance_of_heretics: "Ponieważ nasz [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself] wyznaje herezję, musieliśmy poczynić ustępstwa wobec innych osób, które odeszły od oficjalnej wiary naszego [Root.GovernmentName]."
 heathen_ruler_religious_tensions: "Napięcia religijne"
 desc_heathen_ruler_religious_tensions: "Na obszarze [Root.GetAreaName] gwałtownie wzrosły niepokoje religijne i przemoc, związane z jawnym patronatem nad wiarą pogańską w stolicy kraju."
 learning_from_cultural_brethren: "Nauka od państw bliskich kulturowo"
 desc_learning_from_cultural_brethren: "Nasz władca wykorzystał bliskie więzi z państwami, z którymi [Root.Monarch.GetSheHe] łączy pokrewieństwo kulturowe."
 support_for_advisor: "Wsparcie dla rządu"
 desc_support_for_advisor: "Dzięki szybkiemu awansowi kilku wybitnych przedstawicieli tej społeczności na wysokie stanowiska w rządzie mieszkańcy tego obszaru darzą teraz państwo dużym poparciem."
 influential_power_holder: "Wpływowy lokalny możnowładca"
 desc_influential_power_holder: "Dopisało nam szczęście i zyskaliśmy współpracę wszechstronnego lokalnego możnowładcy z tego regionu. Jako lojalny poddany państwa wykonuje dla nas znakomitą pracę."
 por_conquest_of_hormuz: "Dążenie do opanowania Zatoki Perskiej"
 desc_por_conquest_of_hormuz: "Zdobywając kontrolę nad wyspą Ormuz, zapewniliśmy sobie bazę, z której możemy kontrolować handel w Zatoce Perskiej."
 sultan_of_muscat: "Sułtan Maskatu"
 desc_sultan_of_muscat: "Przejęliśmy kontrolę nad Al-Batiną i omańskim wybrzeżem Zatoki Perskiej. Wreszcie miasta handlowe Omanu znalazły się pod omańskimi rządami, a nasz [Root.GovernmentName] stał się przywódcą wszystkich Omańczyków."
 omani_ambition: "Omańska ambicja"
 desc_omani_ambition: "Przeznaczeniem Omanu jest panowanie nad Morzem Arabskim, kontrolowanie jego handlu i dominacja nad szlakami morskimi."
 new_colony: "Założenie nowej kolonii"
 desc_new_colony: "Założenie przez nas nowej kolonii tchnęło życie w naszą gospodarkę."
 mamluk_amir_dominance: "Dominacja mameluckich emirów"
 desc_mamluk_amir_dominance: "Nasz rząd jest sparaliżowany przez frakcyjne spory i walki między potężnymi rodami mameluckimi."
 amir_dominance: "Dominacja emirów"
 desc_amir_dominance: "Lokalni możnowładcy przejęli kontrolę nad wszystkimi funkcjami rządu i sparaliżowali nasze państwo."
 rise_of_the_ayyubids: "Powrót orła"
 desc_rise_of_the_ayyubids: "Odzyskaliśmy część dziedzictwa Saladyna, przywracając ziemie, które niegdyś utraciła nasza dynastia."
 guru_granth_sahib_military: "Guru Granth Sahib"
 desc_guru_granth_sahib_military: "Wiecznie żyjący Guru inspiruje nas do obrony naszej wiary i naszych rodaków."
 guru_granth_sahib_spread: "Guru Granth Sahib"
 desc_guru_granth_sahib_spread: "Wiecznie żyjący Guru nadal inspiruje kolejne pokolenia i wskazuje im drogę sikhizmu."
 muslim_enforced_religion: "Narzuć jedność religijną"
 desc_muslim_enforced_religion: "Nie możemy tolerować heretyków w naszym państwie. Surowy zbiór praw, wymierzony w wyznawców tradycji fałszywych imamów i kapłanów, pozwolił nam zmarginalizować wszelkie heretyckie wpływy w naszym społeczeństwie."
 jingdezhen_kilns: "Piece w Jingdezhen"
 desc_jingdezhen_kilns: "Historia Jingdezhen jako ważnego ośrodka garncarskiego sięga 1004 roku. W XIV wieku było to największe centrum produkcji porcelany w Chinach i główny ośrodek wytwarzania niemal całej eksportowanej wówczas porcelany cesarskiej."
 nankai_tsunami: "Tsunami Nankai"
 desc_nankai_tsunami: "Prowincja ta powoli podnosi się po skutkach potężnego tsunami, które zmiotło z powierzchni ziemi domy, zamki i drogi."
 restructuring_edo_safer: "Odbudowa"
 desc_restructuring_edo_safer: "Przeznaczamy ogromne środki na budowę nowego, bezpieczniejszego i sprawniej zaplanowanego miasta, które zastąpi osadę doszczętnie zniszczoną przez wielki pożar Meireki."
 restructuring_edo_charitable: "Odbudowa"
 desc_restructuring_edo_charitable: "Przeznaczamy ogromne środki na pomoc wszystkim, którzy stracili domy w wielkim pożarze Meireki, aby mogli odbudować swoje życie w nowym mieście."
 ashes_of_mount_fuji: "Popioły góry Fudżi"
 desc_ashes_of_mount_fuji: "Prowincja ta powoli podnosi się po erupcji góry Fudżi. Choć lawa i odłamki skalne nie wyrządziły znacznych bezpośrednich szkód, pola zostały pokryte popiołem i żużlem, a zamulenie lokalnych rzek doprowadziło do poważnych powodzi."
 chushingura: "Chūshingura"
 desc_chushingura: "Z biegiem czasu opowieść o czterdziestu siedmiu roninach i ich dążeniu do pomszczenia pana stała się popularną legendą, inspirującą kolejne pokolenia wojowników w naszym państwie."
 chushingura_popular_bandits: "Popularni bandyci"
 desc_chushingura_popular_bandits: "Historia czterdziestu siedmiu roninów, którzy za wszelką cenę postanowili pomścić swego pana, inspiruje opór wobec niezbędnych zmian, które wprowadzamy, by przekształcić japońskie społeczeństwo."
 kyoto_of_the_west_modifier: "Nowe Kioto na zachodzie"
 desc_kyoto_of_the_west_modifier: "Przekształciliśmy Yamaguchi w największe miasto zachodniej Japonii. Jest to rozległa stolica nie tylko naszego klanu, lecz także wszystkich wpływowych możnych tego regionu."
 merchant_council_of_sakai: "Rada kupiecka Sakai"
 desc_merchant_council_of_sakai: "Przyznaliśmy kupcom tego miasta prawo do samodzielnych rządów, umożliwiając mu rozwój i zwiększenie wpływów pod naszą ochroną."
 azuchi_castle: "Zamek Azuchi"
 desc_azuchi_castle: "W prowincji tej znajduje się imponujący zamek Azuchi. Został zbudowany jako wzór dla całego państwa, z wysokimi kamiennymi murami i umocnieniami przystosowanymi do użycia broni palnej."
 thriving_arms_industry: "Kwitnący przemysł wojskowy"
 desc_thriving_arms_industry: "Nasze wysiłki na rzecz wzmocnienia armii zaowocowały wzbogaceniem się naszych krajowych producentów broni."
 growth_of_capital: "Rozwój stolicy"
 desc_growth_of_capital: "Nasza ekspansywna polityka i rosnące znaczenie tego obszaru jako stolicy oraz centrum kraju doprowadziły do wielkiego napływu ludności, inwestycji i możliwości biznesowych."
 expansionist_country: "Polityka ekspansji"
 desc_expansionist_country: "Szybka integracja nowych ziem przyniosła nam zarówno szacunek, jak i cenne lekcje w sprawowaniu rządów."
 army_enthusiasm: "Entuzjazm dla armii"
 desc_army_enthusiasm: "Nasza gotowość do inwestowania w tworzenie stałych armii wywołała falę entuzjazmu dla służby wojskowej. Wielu ludzi, zarówno z pospólstwa, jak i z zamożniejszych warstw, szuka kariery w wojsku, a nasi rekruterzy mogą teraz wybierać kandydatów zamiast przyjmować każdego chętnego."
 hegemonic_ambition: "Ambicje hegemoniczne"
 desc_hegemonic_ambition: "Nasza ekspansja terytorialna i niekwestionowane przywództwo w regionie macierzystym przyniosły nam coraz większy szacunek na arenie międzynarodowej i wzmocniły spójność wewnętrzną."
 influential_diplomacy: "Wpływowi dyplomaci"
 desc_influential_diplomacy: "Pielęgnowanie bliskich stosunków z naszymi sojusznikami przyniosło owoce w postaci większego szacunku, jakim cieszymy się na arenie międzynarodowej."
 obedient_subjects: "Posłuszni poddani"
 desc_obedient_subjects: "Z czasem warstwy rządzące wśród naszych poddanych dostrzegły wielkość naszego dworu. Otrzymały zaszczyty i tytuły w naszym systemie szlacheckim, dlatego chętnie godzą się na bardziej bezpośrednie rządy z naszej strony."
 naval_enthusiasm_mission: "Entuzjazm dla mórz"
 desc_naval_enthusiasm_mission: "Nasze wysiłki na rzecz wzmocnienia marynarki zaowocowały powszechnym entuzjazmem dla mórz. Coraz więcej ludzi decyduje się na karierę oficera lub żywot marynarza."
 dominant_trade_hub: "Dominujący ośrodek handlowy"
 desc_dominant_trade_hub: "Prowincja ta stała się dominującym ośrodkiem handlowym dzięki ogromnym wpływom, jakie jej kupcy zdobyli w całym regionie."
 east_india_trade_rush: "Rosnący handel z Indiami Wschodnimi"
 desc_east_india_trade_rush: "Polityka wspierania handlu z Azją poprzez podbijanie ważnych portów otworzyła dla nas tamtejszy rynek na niespotykaną skalę. Pęd ku otwieraniu nowych połączeń handlowych z tym kontynentem doprowadził niektóre gałęzie naszej gospodarki do rozkwitu."
 growing_economy: "Rozwijająca się gospodarka"
 desc_growing_economy: "Nasze starania o zwiększenie dochodów państwa wywołały efekt synergii: dzięki nim możemy uzyskiwać większe korzyści z dokonywanych inwestycji."
 building_spree: "Intensywna rozbudowa"
 desc_building_spree: "Nasze inwestycje w infrastrukturę przynoszą państwu znaczne i natychmiastowe korzyści gospodarcze."
 strong_treasury: "Silny skarb państwa"
 desc_strong_treasury: "Nasza konsekwentna polityka długoterminowego wzmacniania skarbu państwa przyniosła owoce. Nasz bank centralny cieszy się obecnie uznaniem, a prowadzona przez niego polityka gospodarcza staje się coraz skuteczniejsza."
 proto_industrialization: "Wczesna industrializacja"
 desc_proto_industrialization: "Szybki rozwój nowocześniejszych metod produkcji i działalności przedsiębiorczej pobudził ogólny wzrost wydajności oraz dobrobytu gospodarczego w naszym kraju."
 imperial_ambition: "Cesarska ambicja"
 desc_imperial_ambition: "Nasze rosnące państwo jest coraz częściej uznawane za jedno z prawdziwych imperiów tego świata. W pewnym stopniu sprawia to, że podbite ludy chętniej akceptują nasze rządy. Życie pod opieką prawdziwego hegemona, takiego jak my, nie musi być gorsze niż pod władzą znanych im wcześniej lokalnych potęg."
 austrian_silesia: "Śląsk pod panowaniem Austrii"
 desc_austrian_silesia: "Sporne ziemie Śląska często szukały ochrony u naszego sąsiada, Czech. Teraz, gdy Czechy nie stoją już nam na drodze, region ten będzie rozkwitał pod naszymi rządami."
 succesful_bid_for_imperial_crown: "Udane starania o koronę cesarską"
 desc_succesful_bid_for_imperial_crown: "Po ostatecznym zdobyciu tytułu cesarskiego przystąpiliśmy do dalszego umacniania naszych wpływów wśród elektorów."
 habsburg_bohemia: "Królestwo Czech"
 desc_habsburg_bohemia: "Jedna z najbardziej prestiżowych godności w Cesarstwie, korona czeska, weszła właśnie w skład dziedzicznych posiadłości naszej dynastii. Choć stany czeskie trudniej podporządkować niż austriackie, jest to ogromny atut w polityce cesarskiej."
 austrian_empire: "Cesarstwo Austrii"
 desc_austrian_empire: "Ekspansja poza nasze ziemie rodowe i granice Świętego Cesarstwa Rzymskiego ugruntowała naszą pozycję jako wielkiego mocarstwa w oczach świata i imperium na własnych prawach."
 royal_hungary: "Królewskie Węgry"
 desc_royal_hungary: "Zdobyliśmy koronę Węgier, oferując im bezpieczną alternatywę wobec panowania tureckiego. Węgrzy tłumnie zaciągają się teraz pod nasze sztandary, podobnie jak mniejszości, takie jak Wołosi i Niemcy, uciekające przed osmańską ekspansją na Bałkanach."
 austria_reunited: "Zjednoczenie Austrii"
 desc_austria_reunited: "Dzięki naszym wysiłkom niegdyś rozdzielone włości Austrii na powrót stały się jednością."
 at_the_gates_of_europe: "U bram Europy"
 desc_at_the_gates_of_europe: "Po upadku Belgradu droga do Europy stoi otworem. Od Wiednia po Sztokholm kapłani nawołują ludność do zjednoczenia przeciwko nowemu zagrożeniu. Jednocześnie daliśmy światu jasno do zrozumienia, że jesteśmy nową dominującą potęgą na Bałkanach. Ci, którzy pragną obalić dawny porządek, chętnie podejmą teraz służbę u nas."
 ottoman_hungary: "Osmańskie Węgry"
 desc_ottoman_hungary: "Kontrola nad większością biegu Dunaju pozwala nam sprawniej transportować towary i zaopatrzenie do armii działających w całym regionie Karpat."
 principality_of_transylvania: "Księstwo Siedmiogrodu"
 desc_principality_of_transylvania: "Dzięki przejęciu kontroli nad Księstwem Siedmiogrodu staliśmy się panami wschodnich Węgier i Karpat. Siedmiogrodzkiemu księstwu oraz jego stanom pozostawiliśmy jednak szeroką swobodę w zamian za lojalność i dostawy surowców, takich jak sól i złoto."
 ottoman_naval_expansion: "Rozbudowa floty osmańskiej"
 desc_ottoman_naval_expansion: "Dzięki zdobyciu greckich prowincji zyskaliśmy dostęp do licznych doświadczonych żeglarzy i znakomitych portów, co stanowi doskonały początek budowy imperium morskiego."
 ottoman_naval_dominance: "Dominacja morska"
 desc_ottoman_naval_dominance: "Pokonanie joannitów z Rodos zapewniło naszej flocie całkowitą przewagę morską we wschodniej części Morza Śródziemnego."
 anatolia_eyalet: "Konsolidacja ejaletu Anatolii"
 desc_anatolia_eyalet: "Zjednoczenie rozdrobnionych anatolijskich bejlików pod naszym panowaniem stworzyło silną podstawę do przyszłej ekspansji na Kaukaz i Lewant."
 tur_barbary_pirates: "Berberyjscy piraci"
 desc_tur_barbary_pirates: "Nasze bazy morskie w Maghrebie pozwalają nam wspierać liczne korsarskie i pirackie załogi, które nieustannie uprzykrzają życie innym potęgom śródziemnomorskim."
 conquest_of_the_levant: "Podbój Lewantu"
 desc_conquest_of_the_levant: "Podbijając rozległe ziemie Syrii, zabezpieczyliśmy święte miasto Jerozolimę oraz główne szlaki handlowe północnej Syrii. Znacznie pobudza to naszą gospodarkę i pozwala kontrolować napływ perskiego jedwabiu ze wschodu."
 russian_integration: "Rosyjska integracja"
 desc_russian_integration: "Skonsolidowanie wszystkich rosyjskich królestw w jedno imperium to monumentalne zadanie, któremu jednak bardzo pomaga nasza sprawna administracja."
 ruthenian_integration: "Integracja Rusinów"
 desc_ruthenian_integration: "Narody białoruskie i ruskie mają wiele wspólnego z nami, Rosjanami. Integracja ich ziem z naszym imperium okazuje się stosunkowo prosta."
 convert_the_steppes: "Nawracaj stepy"
 desc_convert_the_steppes: "Ludy koczownicze stepów muszą nawrócić się na naszą wiarę. "
 baltic_ambition_new: "Bałtycka ambicja"
 desc_baltic_ambition_new: "Narzuciwszy siłą kontrolę portom wokół Bałtyku, zapewniliśmy naszym handlarzom przewagę nad konkurencją. Przynajmniej na jakiś czas."
 conquest_of_finland: "Podbój Finlandii"
 desc_conquest_of_finland: "Podbój Finlandii był trudny, lecz konflikt ten nauczył nas wiele o wyniszczających skutkach trudnych warunków terenowych i klimatycznych."
 russian_pacific_port: "Rosyjski port nad Pacyfikiem"
 desc_russian_pacific_port: "Mamy port nad Oceanem Spokojnym, który może nam pomóc w budowie nowej floty. "
 siberian_fur_production: "Syberyjska produkcja futra"
 desc_siberian_fur_production: "Nasi traperzy eksploatują nowe źródła futra na całej Syberii"
 integrating_mazovia: "Integracja Mazowsza"
 desc_integrating_mazovia: "Integracja Księstwa Mazowieckiego powinna być dla naszego narodu priorytetem. Nasi dyplomaci pracują, aby ten proces był jak najbardziej efektywny."
 integration_of_lithuania: "Unia polsko-litewska"
 desc_integration_of_lithuania: "Polska i Litwa są wreszcie zjednoczone jako jedno królestwo. W wysiłkach integracyjnych pomagają bliskie stosunki naszych narodów w przeszłości."
 teutons_pacified: "Pacyfikacja Krzyżaków"
 desc_teutons_pacified: "Nareszcie aroganccy Krzyżacy w pełni zaakceptowali polskie panowanie."
 silesia_conquered: "Śląsk zdobyty"
 desc_silesia_conquered: "Śląsk jest teraz nasz. Rządzony niegdyś przez dynastię Piastów ponownie przechodzi pod panowanie polskie. "
 growth_of_the_orthodox_church: "Rozwój Kościoła prawosławnego"
 desc_growth_of_the_orthodox_church: "Wzmocnienie Kościoła prawosławnego na ziemiach odzyskanych od Osmanów doprowadziło wśród prowincji pod naszą kontrolą do dużego zwrotu w kierunku greckiego prawosławia."
 roman_italy: "Rzymska Italia"
 desc_roman_italy: "Odbicie południowej Italii przez wojska rzymskie jest wielkim zwycięstwem Cesarstwa i wzbudziło powszechny entuzjazm dla odrodzenia imperium rzymskiego na Półwyspie Apenińskim. Znużeni licznymi drobnymi wojnami książąt renesansowych Włosi pragną prawdziwego odrodzenia Cesarstwa i przywrócenia rzymskiego pokoju."
 theme_of_sicily: "Tem Sycylii"
 desc_theme_of_sicily: "Sycylię nazywano spichlerzem Cesarstwa, a jej podbój stanowi wielki atut zarówno dla samego Konstantynopola, jak i dla naszych flot na Morzu Śródziemnym."
 healing_the_schism: "Pentarchia"
 desc_healing_the_schism: "Przywrócenie pentarchii sprawiło, że Kościół prawosławny ponownie stał się dominującą siłą w szeroko pojętym świecie chrześcijańskim. W całym Cesarstwie wierni radują się z odbudowy utraconego niegdyś imperium."
 byzantine_kaffa: "Bizantyjska Kaffa"
 conversion_of_rome: "Prawosławie powróciło do Rzymu!"
 desc_conversion_of_rome: "Choć Rzymianie znów wyznają prawosławie, to nieliczni zagorzali papiści nadal pozostają w ukryciu. Nie oznacza to końca Wielkiej Schizmy, może nawet ją pogłębia, jednak z pewnością Kościół prawosławny zyskał w ten sposób przewagę w niekończącej się walce o duchową władzę."
 byzantine_unification_of_italy: "Powstanie feniksa"
 desc_byzantine_unification_of_italy: "Odbijając Italię, przywróciliśmy rdzeń pierwotnego Cesarstwa Rzymskiego i pokazaliśmy światu, że jesteśmy prawdziwymi dziedzicami rzymskiego dziedzictwa.\nBizantyjski feniks powstał z popiołów."
 venetian_revenge: "Upokorzenie Wenecji"
 desc_venetian_revenge: "Rozgromiliśmy Republikę Wenecką i przyłączyliśmy jej ziemie, ostatecznie mszcząc jej haniebną zdradę i odzyskując dobre imię w oczach świata oraz naszych obywateli. To inspirujące zwycięstwo porywa do działania wszystkie warstwy społeczeństwa."
 balkan_empire: "Wyzwolenie Bałkanów"
 desc_balkan_empire: "Stulecia wojen sprawiły, że na Bałkanach żyje wielu niezwykle doświadczonych żołnierzy. Ponownie włączając bałkańskie prowincje do Cesarstwa, możemy wykorzystać ten potencjał i zasilić nasze szeregi zahartowanymi w boju rekrutami."
 chastening_of_venice: "Poskromienie Wenecji"
 desc_chastening_of_venice: "Grabież i zniszczenia, jakich doznała Wenecja po przejęciu jej przez Bizancjum, odcisnęły na mieście trwałe piętno."
 byzantine_treasures_returned: "Odzyskane skarby"
 desc_byzantine_treasures_returned: "Zwrot skarbów niegdyś zrabowanych przez krzyżowców stanowi wielki impuls dla rozwoju naszej cesarskiej stolicy."
 consolidated_sweden: "Zjednoczona Szwecja"
 desc_consolidated_sweden: "Państwo szwedzkie osiągnęło swoje naturalne granice na południu."
 norway_subjugated_swe: "Podporządkowanie Norwegii"
 desc_norway_subjugated_swe: "Norwegia została podbita przez państwo szwedzkie i wyrwana z rąk duńskich królów."
 swe_pommerania_conquered: "Podbój Pomorza"
 desc_swe_pommerania_conquered: "Szwecja zdobyła przyczółek na południowym wybrzeżu Bałtyku. Stąd może rozpocząć dalszą ekspansję w głąb Niemiec."
 denmark_norway_united: "Unia duńsko-norweska"
 desc_denmark_norway_united: "Dania i Norwegia stały się nierozłącznymi państwami, rządzonymi przez jednego króla i zarządzanymi przez jeden rząd."
 united_scandinavia: "Zjednoczona Skandynawia"
 desc_united_scandinavia: "Trzy korony Danii, Norwegii i Szwecji zostały połączone. Cała Skandynawia znajduje się teraz pod naszym panowaniem."
 MODIFIER_OWN_COAST_NAVAL_COMBAT_BONUS: "Premia bojowa na morzu poza twoim wybrzeżem"
 MODIFIER_LOCAL_OWN_COAST_NAVAL_COMBAT_BONUS: "Lokalna premia do walki morskiej u własnego wybrzeża"
 prussian_rhine: "Pruski Nadren"
 desc_prussian_rhine: "Podbój północnej Nadrenii przez Prusy nadaje pewną legitymizację dalszej ekspansji. Nasze roszczenia nie stają się przez to silniejsze, lecz inne państwa zaczną postrzegać nasz dalszy rozwój jako coś naturalnego."
 buffer_zone_commerce: "Gospodarka strefy buforowej"
 desc_buffer_zone_commerce: "Pomimo nieufności miejscowej ludności nowy dostęp do rynków europejskich przynosi wszystkim stronom większy dobrobyt."
 the_unknown_frontier: "Nieznane pogranicze"
 desc_the_unknown_frontier: "Na ulicach [Root.Capital.GetCapitalName] krążą opowieści o żyznych, nieodkrytych ziemiach. Znalezienie kobiet i mężczyzn gotowych postawić tam stopę w imieniu [Root.GetName] nie powinno sprawić żadnego problemu."
 por_col_range: "Wzrok skierowany ku horyzontowi"
 desc_por_col_range: "Ostatnie sukcesy kolonialnych przedsięwzięć [Root.GetName] rozbudziły w społeczeństwie apetyt na to, co nowe i egzotyczne. Musimy go zaspokoić."
 por_ivory_gains: "Przewaga na wybrzeżu"
 desc_por_ivory_gains: "Nasze panowanie na morzu w tym regionie gwarantuje, że większość, jeśli nie całość zysków, trafia bezpośrednio do [Root.Capital.GetCapitalName]."
 por_brazil_colonial: "Doświadczona Admiralicja"
 desc_por_brazil_colonial: "Wielokrotne przeprawy przez Atlantyk, pełne sztormów, piratów i głodu, zahartowały załogi, którym udało się przetrwać. Umiejętności żeglarskie naszej floty nie mają sobie równych."
 por_brazil_tariffs: "Dziedziczne kapitanie"
 desc_por_brazil_tariffs: "Dziedziczne posiadłości ustanowione przez czcigodnych kapitanów przyczyniły się do wzrostu gospodarczego i znaczących odkryć. Nadszedł czas, by poprosić ich o coś w zamian."
 por_spice_trade: "Handel przyprawami"
 desc_por_spice_trade: "Europejskie zapotrzebowanie na przyprawy, konserwowane mięso i egzotyczne tkaniny sprawia, że nasze wpływy w tych regionach są niezwykle silne."
 por_johor_dominance: "Dominacja handlowa"
 desc_por_johor_dominance: "Nasze wpływy w tym regionie wzrosły tak bardzo, że możemy praktycznie dyktować warunki wszystkim, którzy prowadzą handel w dolnym biegu rzeki."
 por_erudite_explorers: "Poznawanie nieznanego"
 desc_por_erudite_explorers: "Nasi poddani mogą być pewni, że wszyscy są pionierami. Dziedzictwo Żeglarza trwa nadal."
 ivory_coast_ambition: "Kongijskie ambicje"
 desc_ivory_coast_ambition: "Rozszerzyliśmy naszą kontrolę aż po najdalsze krańce Afryki. Teraz zbieramy owoce tych starań."
 horn_africa_ambition: "Ambicje subsaharyjskie"
 desc_horn_africa_ambition: "Nasza dominacja nad przybrzeżnymi wyspami wokół Afryki zapewnia nam znaczną przewagę taktyczną."
 por_makeshift_defenses: "Zachodnia fortyfikacja"
 desc_por_makeshift_defenses: "Okupacja tej prowincji przez zachodnie siły wywarła trwały wpływ na jej geografię."
 eng_irish_revolts: "Irlandzka zapalczywość"
 desc_eng_irish_revolts: "Mieszkańcy Irlandii mogą żywić urazę do swoich angielskich panów, ale z pewnością wiedzą, jak ciężko pracować."
 eng_culture_mission: "Akceptacja kultur"
 desc_eng_culture_mission: "Gaeliccy poganie podważą nasz sposób życia, jeśli im na to pozwolimy. Lepiej dać im odczuć, że mają równy status."
 eng_french_recovery: "Ustępstwa zwycięzcy"
 desc_eng_french_recovery: "Teraz, gdy odnieśliśmy zwycięstwo nad Księstwem Francji, zaoferowaliśmy pokonanym francuskim żołnierzom możliwość walki w naszych szeregach. Każdy żołd jest lepszy niż żaden."
 eng_caribbean_trade: "Użyteczna siła robocza"
 desc_eng_caribbean_trade: "Gwałtowni tubylcy mogą być kłopotliwymi przeciwnikami, ale doskonale nadają się na niewolników."
 eng_chesapeake_dominance: "Kontrola handlu"
 desc_eng_chesapeake_dominance: "Nawet niewielki podatek może przynieść spore zyski."
 eng_australian_colony: "Terra Australis"
 desc_eng_australian_colony: "Choć znaczna część kontynentu jest niegościnna, bujne regiony przybrzeżne zapewniają bezpieczne schronienie śmiałkom. Wieść o naszym przybyciu szybko się rozejdzie."
 eng_channel_dominance: "Marynarka kupiecka"
 desc_eng_channel_dominance: "Statki naszej marynarki handlowej są często lepiej wyposażone niż jednostki naszej floty wojennej. Nie trzeba dodawać, że dobrze strzegą swoich interesów."
 bordeaux_ambition: "Bretońskie sztuczki"
 desc_bordeaux_ambition: "Wybrzeże Bretanii jest pełne niewielkich naturalnych jaskiń, zatoczek i kryjówek dla statków oraz ich ładunków. Nie ma lepszego miejsca, by uniknąć ceł!"
 eng_rb_trade_value_mod: "Wiatry handlu"
 desc_eng_rb_trade_value_mod: "Nasi kapitanowie doskonale znają wartość wiedzy. Zestawienia wartości, inflacji, cen i czasu podróży stanowią podstawę ich fachu; niewielkie oszczędności mogą przynieść fortunę, jeśli bezwzględnie się je wykorzysta."
 eng_rb_gibraltar_mod: "Skała Gibraltarska"
 desc_eng_rb_gibraltar_mod: "Terytorium Gibraltaru stanowi znakomitą bazę zaopatrzeniową dla naszych operacji morskich na Morzu Śródziemnym."
 eng_rb_faro_coast: "Od wyspy do wyspy"
 desc_eng_rb_faro_coast: "Dobrze rozmieszczone porty znacznie zmniejszają niebezpieczeństwa związane z przemierzaniem wód Kanału Północnego."
 eng_rb_thirteen_colonies_mod: "Zjednoczona administracja"
 desc_eng_rb_thirteen_colonies_mod: "Dzięki objęciu mieszkańców kolonii jednolitą administracją możemy mieć pewność, że nadal będą nas wspierać."
 eng_rb_state_religion_mod: "Ostateczny dekret"
 desc_eng_rb_state_religion_mod: "Niech będzie wiadome, że zdecydowanie wystąpiliśmy przeciwko herezji."
 eng_rb_colony_chance: "Surowe zimy"
 desc_eng_rb_colony_chance: "Nie spodziewaliśmy się, że Nowy Świat będzie aż tak... zimny. Niemniej, jeśli zdołamy tu przetrwać, poradzimy sobie wszędzie."
 eng_rb_established_shipping: "Ugruntowane szlaki żeglugowe"
 desc_eng_rb_established_shipping: "Żmudna i skrupulatna analiza tras, pływów oraz pogody pozwoliła naszym kapitanom handlowym znacznie skrócić podróże do Nowego Świata i z powrotem."
 eng_rb_roses_legit: "Królewska linia dynastyczna"
 desc_eng_rb_roses_legit: "Udowodniliśmy, że naszej królewskiej linii dynastycznej nie można już nigdy podważyć."
 eng_rb_angers_summer_court: "Dwór letni"
 desc_eng_rb_angers_summer_court: "Szlachcice i ich żony wypoczywają pod ozdobnymi parasolami, delektując się wybornymi winami, podczas gdy omawiane są sprawy państwowe. Ten gospodarczy zastrzyk tchnął nowe życie w Angers."
 eng_rb_hre_relations: "Elokwentny"
 desc_eng_rb_hre_relations: "Niezależnie od tego, czy nasi dyplomaci przywożą wypowiedzi wojny, propozycje pokoju, czy zwykłe uprzejmości, ludzie zawsze cieszą się na ich widok."
 eng_rb_liberty: "Kij i marchewka"
 desc_eng_rb_liberty: "Najważniejsze jest, by wiedzieć, kiedy należy coś dać, a kiedy odebrać."
 eng_rb_university_institution: "Tradycja akademicka"
 desc_eng_rb_university_institution: "Uniwersytety w Oksfordzie i Cambridge istnieją od stuleci. Odnowiona infrastruktura dała im szansę na szerzenie wiedzy."
 eng_rb_colonial_war_mod: "Ustępstwa kolonialne"
 desc_eng_rb_colonial_war_mod: "Nasze umiejętności zarządzania odległymi terytoriami przyniosły oczekiwane rezultaty."
 eng_rb_local_conv: "Królewskie powitanie"
 desc_eng_rb_local_conv: "Wielu mieszkańców tych ziem jest zachwyconych możliwością poznania wyższości obyczajów [Root.Owner.GetAdjective]."
 gbr_rb_indian_integration: "Integracja Indii"
 desc_gbr_rb_indian_integration: "Nie twierdzimy, że rozumiemy ich pogańską religię, ale indyjscy żołnierze z pewnością potrafią walczyć."
 alexandria_ambition: "Aleksandryjska ambicja"
 desc_alexandria_ambition: "Cały handel ze Wschodu przepływa przez deltę Nilu. Kto kontroluje deltę, ten zbiera zyski."
 eng_rb_coal_produced_mod: "Silnik parowy Watta"
 desc_eng_rb_coal_produced_mod: "Silnik parowy wynaleziony przez panów Boultona i Watta zrewolucjonizował wydobycie surowców. Napędzany węglem przyniósł znakomite rezultaty naszemu przemysłowi górniczemu."
 eng_rb_imperial_ban_mod: "Łaski cesarskie"
 desc_eng_rb_imperial_ban_mod: "Nie wystarczy być po prostu Cesarzem, trzeba władać samym jego autorytetem."
 gbr_inland_trade: "Brytyjska Kompania Wschodnioindyjska"
 desc_gbr_inland_trade: "Przekazanie Brytyjskiej Kompanii Wschodnioindyjskiej codziennego zarządzania tymi obszarami pozwoli wykorzystać jej doskonałą znajomość miejscowych zwyczajów i zasobów, które można eksploatować. Dzięki temu wszystko będzie działać bez zakłóceń."
 college_of_justice: "Kolegium Sądownicze"
 desc_college_of_justice: "Zcentralizowany system sądownictwa zapewnia stosowanie prawa wobec wszystkich Szkotów."
 sco_the_education_acts: "Ustawy o edukacji"
 desc_sco_the_education_acts: "W każdej parafii powstają szkoły, a właściciele ziemscy mają obowiązek zapewnić sobie podstawowe wykształcenie."
 sco_reformation: "Przetrwanie reformacji"
 desc_sco_reformation: "Wyszliśmy z okresu reformacji jako naród zgodny pod względem religijnym."
 bank_of_scotland: "Bank Szkocji"
 desc_bank_of_scotland: "Bank Szkocji inwestuje w lokalne przedsięwzięcia gospodarcze."
 central_belt_coal: "Węgiel z Pasa Środkowego"
 desc_central_belt_coal: "Nasze złoża węgla w tym regionie są eksploatowane z pełnym wykorzystaniem ich potencjału."
 rule_britannia: "Władaj, Brytanio!"
 desc_rule_britannia: "Panujemy nad wszystkimi Wyspami Brytyjskimi. [Root.GetName] zajęło należne mu miejsce na światowej scenie."
 conquest_of_ireland: "Podbój Irlandii"
 desc_conquest_of_ireland: "Irlandia należy do nas. Jej podbój był krwawy, lecz nasze armie są pełne zapału."
 north_sea_ambition: "Ambicja Morza Północnego"
 desc_north_sea_ambition: "Zdominowaliśmy handel na Morzu Północnym i czerpiemy z tego korzyści."
 the_darien_scheme: "Projekt Darién"
 desc_the_darien_scheme: "Co może pójść nie tak?"
 nova_scotia_modifier: "Nowa Szkocja"
 desc_nova_scotia_modifier: "W Nowym Świecie rozkwita Nowa Szkocja."
 cod_boom: "Rozkwit połowów dorsza"
 desc_cod_boom: "Przemysł rybny na wyspach północnego Atlantyku przeżywa rozkwit pod naszym panowaniem."
 highlands_consolidated: "Poskromienie klanów"
 desc_highlands_consolidated: "Klany góralskie są teraz całkowicie posłuszne koronie. Wystawią armie, by walczyć w obronie naszego narodu."
 edinburgh_london_modifier: "Z Londynu do Edynburga"
 desc_edinburgh_london_modifier: "Wiele dawnych londyńskich instytucji jest przenoszonych do Edynburga. Nasza stolica szybko się rozwija i wkrótce znajdzie się wśród największych miast świata."
 spa_hispaniola_discovered: "Haiti czeka"
 desc_spa_hispaniola_discovered: "Być może opowieść o tym, że Indie są w naszym zasięgu, zawiera ziarno prawdy. Odkryta przez nas ziemia jest jednak naprawdę wspaniała. Być może znajdą się wśród naszych poddanych ludzie gotowi uczynić ją swoim nowym domem?"
 spa_rb_morale: "Gotowość do wojny"
 desc_spa_rb_morale: "Nasze plany ponownego podboju Półwyspu Iberyjskiego nie są tajemnicą dla naszych żołnierzy."
 spa_rb_culture_shift: "Erozja kulturowa"
 desc_spa_rb_culture_shift: "Po egzekucji przywódców Inków, zrabowaniu ich świątyń i rozproszeniu ich ludu nie musimy już łagodnie integrować tej społeczności."
 spa_rb_gold_rush: "Gorączka złota"
 desc_spa_rb_gold_rush: "Inkowie nie potrafili wydobywać złota tak skutecznie, jak pozwala nam nasza zaawansowana technologia. W ziemi wciąż kryją się ogromne zasoby, a setki ochotników są gotowe je wydobywać."
 spa_rb_christian_iberia: "Oczyszczona chrześcijańska Iberia"
 desc_spa_rb_christian_iberia: "Porządek powrócił na Półwysep Iberyjski, a chrześcijanie na całym świecie radują się!"
 spa_rb_italian_ambition_mod: "Dominacja na Morzu Śródziemnym"
 desc_spa_rb_italian_ambition_mod: "Dysponujemy teraz licznymi portami, w których możemy bazować naszą stale rosnącą flotę śródziemnomorską. Możemy również korzystać z umiejętności neapolitańskich mistrzów szkutnictwa, którzy teraz pracują dla nas."
 spa_rb_overseas_trade: "System intendentów"
 desc_spa_rb_overseas_trade: "System intendentów zapewnia znakomite dochody z kolonii."
 ned_brazil_mod: "Mistrzostwo kolonialne"
 desc_ned_brazil_mod: "Utworzenie Kompanii Wschodnioindyjskiej i Zachodnioindyjskiej ożywiło holenderską strefę wpływów. Poparcie dla kolonii nigdy nie było silniejsze."
 ned_ceylon_mod: "Holenderskie wyspy na szlakach morskich"
 desc_ned_ceylon_mod: "Im więcej portów posiadamy na szlakach handlu przyprawami, tym lepiej."
 malacca_conquest: "Dominacja handlowa"
 desc_malacca_conquest: "Kontrolujemy ważne miasto handlowe Malakka oraz otaczające je ziemie."
 ned_zeelandia_mod: "Fort Zeelandia"
 desc_ned_zeelandia_mod: "Złowroga twierdza z ciosanego kamienia, wzniesiona w holenderskim stylu, dumnie góruje nad wyspą Formoza."
 ned_lowlands_victory: "Naprzód ku zwycięstwu"
 desc_ned_lowlands_victory: "Powrót naszych rodaków do ojczyzny znacznie podniósł morale naszych armii."
 trinity_college: "Trinity College w Dublinie"
 desc_trinity_college: "Założenie pierwszego irlandzkiego uniwersytetu otwiera nowe możliwości rozwoju nauki i edukacji."
 irish_new_world: "Irlandczycy w Nowym Świecie"
 desc_irish_new_world: "Irlandczycy tłumnie przybywają do Nowego Świata, szukając nowych możliwości i zysków."
 high_king_of_ireland: "Wielki Król Irlandii"
 desc_high_king_of_ireland: "Po raz pierwszy od pokoleń Irlandia ma Wielkiego Króla godnego tego tytułu."
 beyond_the_pale_modifier: "Poza Pale"
 desc_beyond_the_pale_modifier: "Irlandzkie armie wyruszają poza granice Pale, gotowe stawić czoła naszym angielskim ciemiężycielom."
 ire_recruiting_from_clans: "Zaciąg górali"
 desc_ire_recruiting_from_clans: "Wiele klanów z Highlands i Hebrydów Zewnętrznych wywodzi swoje korzenie z Irlandii. Są do nas przyłączani."
 irish_potatoes: "Import ziemniaków"
 desc_irish_potatoes: "Import ziemniaków stanowi wielkie dobrodziejstwo dla Irlandii. Te bulwy są łatwe w uprawie, a rodzina może dzięki nim zapewnić sobie pożywienie przez cały rok."
 fra_to_india: "Do Indii!"
 desc_fra_to_india: "Odkryliśmy morską drogę do Indii. Powinniśmy jak najszybciej dotrzeć do tamtejszych wybrzeży i założyć kolonię."
 french_callais: "Kalais ponownie w rękach Francji"
 desc_french_callais: "Kalais ponownie należy do Francji. To kwitnący port handlowy, z którego znów możemy czerpać korzyści."
 french_tariffs: "Francuskie cła kolonialne"
 desc_french_tariffs: "Założyliśmy kolonie w Nowym Świecie i musimy dopilnować, by odprowadzały należne daniny do Francji."
 fra_into_germany: "Marsz na Niemcy"
 desc_fra_into_germany: "Książęta niemieccy słusznie obawiają się francuskich najazdów na swoje ziemie. Z czasem zaakceptują nas jako swoich prawowitych zwierzchników."
 oma_buildforces_mod: "Gotowość bojowa"
 desc_oma_buildforces_mod: "Nasze siły są gotowe. Nadszedł czas, by uderzyć!"
 oma_maritime_mod: "Żeglarskie ambicje"
 desc_oma_maritime_mod: "Teraz, gdy odzyskaliśmy wybrzeże, możemy skupić się na zdobywaniu bogactwa. "
 three_koreas_mod: "Ponowne zjednoczenie Trzech Korei"
 desc_three_koreas_mod: "Starożytna epoka Trzech Królestw już dawno minęła, ale my zjednoczyliśmy ich terytorium i przywróciliśmy Korei jej dawną chwałę."
 ori_coastal_trade: "Monopol na handel przybrzeżny"
 desc_ori_coastal_trade: "Kontrolujemy teraz wiele ważnych portów żeglugowych na indyjskim wybrzeżu. Niewielu śmiałków może podważyć nasze prawo do nakładania lukratywnych ceł na odwiedzających je kupców."
 ori_diamonds_golconda: "Handel diamentami"
 desc_ori_diamonds_golconda: "Posiadamy teraz słynne kopalnie diamentów w Golkondzie. Zadziwiające, jak bardzo zagraniczni dyplomaci stają się skłonni do współpracy w obliczu takiego przepychu."
 per_pearl_of_khorasan: "Perła Chorasanu"
 desc_per_pearl_of_khorasan: "Herat, jedno z ważniejszych miast perskiego Chorosanu, jest siedzibą gubernatora regionu i centrum naszych działań na Wschodzie."
 per_tribal_warriors: "Plemienny pobór"
 desc_per_tribal_warriors: "Po zabezpieczeniu dawnego centrum państwa Ilchanidów uzyskaliśmy łatwy dostęp do wojowników plemiennych, którzy niegdyś służyli temu państwu i jego następcom."
 per_pashtun_warriors: "Zaciąg Pasztunów"
 desc_per_pashtun_warriors: "Podbój Afganistanu otworzył nam możliwość wcielania do naszych szeregów wojowników z klanów pasztuńskich. Wielu z nich chętnie przyłączy się do naszej sprawy w nadziei na łupy na równinach Indii."
 solanki_fortress: "Odnowienie twierdzy Solankich"
 desc_solanki_fortress: "Twierdza w Champaner, zbudowana przez dawnych władców z dynastii Solankich i rozbudowywana przez kolejnych zwierzchników, uchodzi za niezdobytą. Udowodniliśmy, że ta legenda jest fałszywa, dlatego musimy odnowić i wzmocnić jej mury."
 tim_mountain_reconquest: "Podbój gór"
 desc_tim_mountain_reconquest: "Nasze wojska wyciągnęły cenne wnioski z walk w zdradliwym, górskim terenie."
 tim_heartland_reconquest: "Podbój ziem centralnych"
 desc_tim_heartland_reconquest: "Scentralizowana administracja przyniesie korzyści nam wszystkim."
 tim_steppe_reconquest: "Podbój stepu"
 desc_tim_steppe_reconquest: "Szarża kawalerii to żywioł naszych jeźdźców."
 conquest_of_beijing: "Podbój Pekinu"
 desc_conquest_of_beijing: "Stolica dynastii Ming znalazła się w naszych rękach. Musimy kontynuować marsz w głąb Chin!"
 improved_han: "Odrodzenie Han"
 desc_improved_han: "Rolnicy i kupcy ponownie zaufali naszej walucie."
 supported_kabuki: "Wspieranie przedstawień kabuki"
 desc_supported_kabuki: "Nasza rodzina jest mecenasem sztuki kabuki."
 cherry_blossoms: "Kwitnące wiśnie"
 desc_cherry_blossoms: "Nasze kwitnące wiśnie budzą podziw w całej Japonii."
 strengthened_shinobi: "Wzmocnienie shinobi"
 desc_strengthened_shinobi: "Tworząc własną, dobrze finansowaną siatkę shinobi, chronimy naszą rodzinę, klan i lud Han."
 strengthened_bushido: "Umocnienie bushidō"
 desc_strengthened_bushido: "Postępowaniem naszych wojowników nieustannie kieruje solidna filozofia cnót i właściwego zachowania."
 mug_hindustan_mod: "Wzrost populacji"
 desc_mug_hindustan_mod: "Gęsto zaludniony Hindustan zapewnia naszym armiom liczne rzesze rekrutów i doświadczonych żołnierzy."
 mug_gujarat_mod: "Handel przybrzeżny"
 desc_mug_gujarat_mod: "Kontrola nad rzeką Indus zapewnia nam znaczny wpływ na handel w tym regionie."
 mug_malwa_mod: "Powstanie z popiołów"
 desc_mug_malwa_mod: "Na obszarze dotkniętym stosunkowo niewielkimi zniszczeniami wskutek erupcji wulkanu rozwinęły się zaskakująco żyzne ziemie."
 mug_south_bengal_mod: "Mogolska Okupacja"
 desc_mug_south_bengal_mod: "Te żyzne ziemie doskonale nadają się do zaopatrywania stałej armii w żywność."
 africa_slave_trade_mission: "Monopol na handel niewolnikami"
 desc_africa_slave_trade_mission: "Nasi kupcy dominują w afrykańskim handlu niewolnikami, dzięki czemu zyski trafiają do naszego państwa, a nie do innych."
 african_abolitionists: "Abolicjonizm"
 desc_african_abolitionists: "Nie tylko znieśliśmy okrutny handel niewolnikami we własnym państwie, lecz także doprowadziliśmy do jego zniesienia we wszystkich sąsiednich krajach."
 wealth_of_africa_modifier: "Wealth of Africa"
 desc_wealth_of_africa_modifier: "W pełni wykorzystujemy bogactwa Afryki."
 gen_eur_trade_node_mod: "Sława na całym świecie"
 desc_gen_eur_trade_node_mod: "Dzięki umiejętnościom, szczęściu i bezwzględnemu wykorzystywaniu okazji rozwijaliśmy nasze inwestycje, aż przyćmiły wszystkie pozostałe przedsięwzięcia."
 gen_eur_defender: "Zbroja prawości"
 desc_gen_eur_defender: "Dostąpiliśmy łaski poznania prawdy, że wykonujemy dzieło Boże."
 gen_asia_holding_mod: "Wiatry handlowe"
 desc_gen_asia_holding_mod: "Nasza obecność na Dalekim Wschodzie daje nam niezrównany wpływ na światowy handel."
 gen_america_holding_mod: "Gorączka dalekich wypraw"
 desc_gen_america_holding_mod: "Dzięki ugruntowaniu naszej obecności w Nowym Świecie tysiące ludzi chętnie uczestniczą w naszym przedsięwzięciu kolonialnym."
 gen_indian_holding_mod: "Klippery herbaciane"
 desc_gen_indian_holding_mod: "Wysokie żaglowce budzą podziw, przewożąc herbatę i inne luksusowe towary z niezwykłą prędkością, by nie dopuścić do ich zepsucia. Nasza flota handlowa musi należeć do najlepszych na świecie!"
 gen_hre_diplomacy_mod: "Cesarskie względy"
 desc_gen_hre_diplomacy_mod: "Choć nie zasiadamy jeszcze na świętym tronie, wszyscy widzą, że mamy majestat godny cesarza."
 gen_hre_emperor_mod: "Imperator Romanorum"
 desc_gen_hre_emperor_mod: "W naszej prawicy spoczywają Sprawiedliwość, Prawda i Słuszność."
 gen_hre_imperial_ban_mod: "Jedność Imperium"
 desc_gen_hre_imperial_ban_mod: "Wszystkie ziemie należące do naszych książąt zostały odzyskane. Cóż za wspaniały dzień dla Cesarstwa!"
 spice_trade_controlled: "Kontrola nad handlem przyprawami"
 desc_spice_trade_controlled: "Kontrolujemy handel przyprawami, kierując płynące z niego bogactwa do naszych portów."
 silk_road_modifier: "Kontrola nad Jedwabnym Szlakiem"
 desc_silk_road_modifier: "Przejęliśmy kontrolę nad znaczną częścią Jedwabnego Szlaku."
 bur_diplo_mod: "Głos rozsądku"
 desc_bur_diplo_mod: "Biskup Liège przemawia teraz w naszym imieniu. W przeciwnym razie straciłby język."
 bur_arles_mod: "Przywrócenie królestwa Arles"
 knowledge_sharing: "Udostępnianie wiedzy"
 desc_bur_arles_mod: "Wreszcie Królestwo Arles wyrwało się spod władzy karolińskiego państwa sukcesyjnego. Chwała Burgundii!"
 bur_channel_ambition: "Zamorskie posiadłości"
 desc_bur_channel_ambition: "Teraz, gdy posiadamy wybrzeże Fryzji, nasza flota handlowa może zaznaczyć swoją obecność na kanale La Manche."
 ara_gen_goods_mod: "Podwójne tempo"
 desc_ara_gen_goods_mod: "Powiadają, że sukces rodzi kolejny sukces!"
 yemeni_trade_modifier: "Jemeński handel"
 desc_yemeni_trade_modifier: "Kontrolujemy handel w Zatoce Adeńskiej, gdzie produkuje się kawę i kadzidło."
 bedouins_pacified: "Pacyfikacja Beduinów"
 desc_bedouins_pacified: "Beduińscy najeźdźcy zostali podporządkowani. To wielka ulga dla naszego ludu."
 beyliks_subjugated: "Podporządkowanie tureckich bejlików"
 desc_beyliks_subjugated: "Bejlikowie Anatolii ponownie klękają przed sułtanem."
 boh_hussite_revolt: "Odrodzenie utrakwizmu"
 desc_boh_hussite_revolt: "Nasze działania wobec rebelii husyckiej doprowadziły, w taki czy inny sposób, do wielkiego odrodzenia duchowieństwa utrakwistycznego."
 boh_premysl_mod: "Ziemie naszych przodków"
 desc_boh_premysl_mod: "Nasz dwór z wielkim zadowoleniem przyjmuje odzyskanie naszych szlachetnych ziem. Nie bez znaczenia jest również to, że daje mu to więcej okazji do zdobywania wpływów..."
 white_sheep_ascendant: "Triumf Białej Owcy"
 desc_white_sheep_ascendant: "Turkmeni Czarnej Owcy zostali pokonani. Biała Owca bierze górę."
 akk_caucasus: "Podbój Kaukazu"
 desc_akk_caucasus: "Liczne plemiona Kaukazu uznają teraz naszą władzę. Uczymy się włączać je w struktury naszego państwa."
 akk_persia: "Podbój Persji"
 desc_akk_persia: "Podbiliśmy Persję! Teraz w oczach wszystkich jesteśmy prawdziwym wielkim imperium."
 akk_iraq: "Podbój Bagdadu"
 desc_akk_iraq: "Bagdad nie jest już takim ośrodkiem nauki religijnej jak niegdyś, lecz pod naszym panowaniem uczeni powracają do miasta."
 hun_moldavia_mod: "Przygotowania na linii frontu"
 desc_hun_moldavia_mod: "Zbliżająca się fala Turków wymaga szczególnej staranności przy przygotowywaniu twierdz, pułapek i zasadzek."
 hun_constantinople: "Podbój Bałkanów"
 desc_hun_constantinople: "Zabezpieczyliśmy Bałkany przed obcą inwazją."
 divine_wind_modifier: "Boski wiatr"
 desc_divine_wind_modifier: "Boski wiatr niesie nasze okręty ku obcym wybrzeżom, wzywając nas do podbojów."
 japanese_cot_dominated: "Japoński handel"
 desc_japanese_cot_dominated: "Zdominowaliśmy handel na morzach otaczających nasze rodzime wyspy."
 integrating_ainu: "Ujarzmienie Ajnów"
 desc_integrating_ainu: "Hokkaido ma ogromny potencjał dla Japończyków, a rdzenni Ajnusi nie stanowią już przeszkody dla naszej ekspansji."
 jap_three_mountains: "Trzy góry Dewy"
 desc_jap_three_mountains: "Podbój Okinawy ugruntował pozycję Japonii jako prawdziwego rywala na Morzu Południowochińskim."
 rb_eng_passage_spheres: "Droga do poznania sfer"
 desc_rb_eng_passage_spheres: "Nasi astronomowie zdobyli cenną wiedzę o naszym miejscu we wszechświecie. Ich odkrycia znacznie upowszechniły astronomię i astrologię wśród ludności!"
 rb_eng_theory_warfare: "Teoria wojny"
 desc_rb_eng_theory_warfare: "Najnowszy traktat wojskowy o sztuce wojennej, zaprezentowany podczas sympozjum w Oksfordzie i Cambridge, nie był pasjonującą lekturą. Dał jednak naszym dowódcom temat do rozmów przy kolacji."
 rb_eng_philosophy_royalty: "Filozofia królewskości"
 desc_rb_eng_philosophy_royalty: "To intrygujące badanie europejskich rodowodów jedynie umacnia nasze roszczenia do tronu [Root.GetAdjective]iego Imperium."
 rb_eng_divine_common: "O boskości..."
 desc_rb_eng_divine_common: "Poddani w całym kraju z radością słuchają lub czytają o znaczeniu swojego miejsca w Królestwie Bożym."
 rb_eng_national_economy: "Studia ekonomiczne"
 desc_rb_eng_national_economy: "Zawiłości tego dzieła zrozumieją jedynie osoby posiadające wiedzę finansową. Mimo to jego skutki są już widoczne w naszym skarbcu."
 vij_maratha_modifier: "Kawaleria maracka"
 desc_vij_maratha_modifier: "Podbój Maharasztry pozwala nam wykorzystać w naszych szeregach umiejętności jeździeckie ludu marackiego."
 east_africa_conquest: "Dominacja handlowa w Afryce Wschodniej"
 vij_lanka_modifier: "Podbój Lanki"
 desc_vij_lanka_modifier: "Po podboju Lanki powinniśmy podjąć próbę nawrócenia miejscowych buddystów na hinduizm."
 vij_oman_modifier: "Omańska dominacja handlowa"
 vij_hormuz_modifier: "Adeńska dominacja handlowa"
 desc_vij_hormuz_modifier: "Nasza dominacja nad handlem w Zatoce Adeńskiej wzmacnia pozycję kupców w całym imperium."
 vij_malabar_modifier: "Malabarski handel przyprawami"
 desc_vij_malabar_modifier: "W pełni wykorzystujemy możliwości handlu przyprawami wzdłuż Wybrzeża Malabarskiego."
 vij_plunder_modifier: "Łupy wojenne"
 desc_vij_plunder_modifier: "Wykorzystujemy łupy wojenne, by inwestować w rozwój naszych miast."
 vij_andhra_modifier: "Podbój Andhry"
 desc_vij_andhra_modifier: "Podbój Andhry był inspirującym zwycięstwem, które podniosło morale naszych armii."
 vij_local_gods_modifier: "Patronat nad lokalnymi bóstwami"
 desc_vij_local_gods_modifier: "Opieka nad lokalnymi bóstwami umacnia lojalność wszystkich hinduistów na naszych ziemiach."
 rajendra_modifier: "Ambicja Rajendry"
 vij_building: "Architekci w Mieście Zwycięstwa"
 desc_vij_building: "Nasi architekci pracują nad ulepszeniami stolicy."
 city_of_victory_modifier: "Miasto zwycięstwa "
 desc_city_of_victory_modifier: "Nasza stolica jest centrum wielkiego indyjskiego imperium i wspaniałym pomnikiem naszych zwycięstw."
 vij_africa_trade_modifier: "Indyjski handel oceaniczny"
 desc_vij_africa_trade_modifier: "Teraz, gdy kontrolujemy handel we wschodniej Afryce, cały Ocean Indyjski stoi przed nami otworem!"
 dlh_textile_modifier: "Rozwój przemysłu włókienniczego"
 desc_dlh_textile_modifier: "Nasze inwestycje w manufaktury tekstylne zwiększyły produkcję w całym imperium."
 dlh_bengal_modifier: "Podbój Bengalu"
 desc_dlh_bengal_modifier: "Podbój Bengalu inspiruje nasze armie do dokonywania wielkich czynów i wykazywania się odwagą."
 dlh_grand_trunk_road_modifier: "The Grand Trunk Road"
 desc_dlh_grand_trunk_road_modifier: "Szlak Grand Trunk Road zapewnia naszym armiom dotarcie do celu oraz umożliwia swobodny i sprawny przepływ handlu."
 dlh_orissa_conquest_modifier: "Podbój Orisy"
 desc_dlh_orissa_conquest_modifier: "Po pokonaniu Orisy zreorganizujemy nasze armie przygotowując się do kampanii w dżunglach Garhdźatu."
 dlh_afghan_conquest_modifier: "Podbój Kabulu"
 desc_dlh_afghan_conquest_modifier: "Teraz, gdy Kabul znajduje się pod naszą kontrolą, afgańscy możnowładcy w północnych Indiach dwa razy się zastanowią, zanim zakwestionują nasze panowanie."
 dlh_sind_conquest_modifier: "Podbój Sindu"
 desc_dlh_sind_conquest_modifier: "Wierność sindyjskich muzułmanów upewnia wyznawców w całym naszym imperium, że nasza wiara jest prawdziwa."
 dlh_rajput_conquest_modifier: "Podbój Radźputany"
 desc_dlh_rajput_conquest_modifier: "Radźputowie zostali wreszcie włączeni do naszego państwa, a wraz z nimi zyskaliśmy ich doświadczenie wojskowe."
 dlh_deccan_conquest_modifier: "Podbój Dekanu"
 desc_dlh_deccan_conquest_modifier: "Cały Dekan znajduje się teraz pod naszym panowaniem. Możemy korzystać z arabskich koni sprowadzanych przez zachodnie wybrzeże."
 ori_jagannath_cult_dh: "Dźagannath"
 desc_ori_jagannath_cult_dh: "Żadne inne bóstwo nie jest tak związane z ludem Orisy jak Dźagannath, a ten największy awatar Wisznu jest szczególnie bliski naszej dynastii. Każdy król z dynastii Gajapati cieszy się poparciem Dźagannatha i jego kapłanów, a świątynia w Puri z każdym rokiem bogaci się dzięki królewskiemu patronatowi."
 ori_bahmanis_modifier: "Podbój Dekanu"
 desc_ori_bahmanis_modifier: "Nasze niedawne podboje zapewniły nam dostęp do wielu doświadczonych dekańskich kawalerzystów, którzy mogą służyć w naszych armiach."
 ori_coromandel_modifier: "Koromandelski handel"
 desc_ori_coromandel_modifier: "Nasza dominacja nad Wybrzeżem Koromandelskim zapoczątkowuje nową erę dobrobytu kupieckiego w naszym państwie."
 ori_vedic_education: "Edukacja wedyjska"
 desc_ori_vedic_education: "Nasze religijne ośrodki nauki sprzyjają rozwojowi nowych, bardziej zniuansowanych idei teologicznych i politycznych."
 ori_bengal_inland_modifier: "Podbój Bengalu"
 desc_ori_bengal_inland_modifier: "Podbój śródlądowych obszarów Bengalu inspiruje nasze armie do jeszcze większych czynów i odwagi."
 rus_partition_poland_modifier: "Rozbiór Polski"
 desc_rus_partition_poland_modifier: "Rozbiór Polski pokazuje, jak łatwo możemy włączać nowe prowincje do naszej administracji, jeśli tylko nadamy temu odpowiedni bieg."
 loyal_streltsy: "Lojalność strzelców"
 desc_loyal_streltsy: "Lojalność naszych pułków strzelców zapewnia stabilną przyszłość państwu, przynajmniej na razie."
 russian_autocracy: "Rosyjska autokracja"
 desc_russian_autocracy: "Ustanowienie rządów autokratycznych ogranicza władzę lokalnych urzędników w całym kraju, skupiając ją w rękach państwa, a przede wszystkim cara."
 prikazy_modifier: "Prikazy"
 desc_prikazy_modifier: "Utworzono szereg urzędów ministerialnych, aby zapewnić sprawne zarządzanie naszym państwem."
 rus_alaska_modifier: "Rosyjska Ameryka"
 desc_rus_alaska_modifier: "Przekierowujemy zasoby państwowe, aby futra z Alaski były bezpiecznie i sprawnie eksportowane do Europy."
 third_rome_modifier: "Trzeci Rzym"
 desc_third_rome_modifier: "To miasto jest Trzecim Rzymem, najwspanialszym ze wszystkich miast świata."
 rus_reactionary_zeal: "Zapał reakcyjny"
 desc_rus_reactionary_zeal: "Rewolucjoniści zostali rozgromieni! Nic nie jest w stanie zagrozić władzy cara."
 nov_defeated_muscovy: "Moskwa pokonana"
 desc_nov_defeated_muscovy: "Pokonaliśmy naszych moskiewskich wrogów. Nasze armie są wyczerpane, lecz uzupełnienie szeregów i zdobyte doświadczenie uczynią je silniejszymi."
 nov_tver_conquest: "Podbój Tweru"
 desc_nov_tver_conquest: "Twer podlega teraz Nowogrodowi. Robimy wszystko, by zapewnić jego sprawną integrację z naszym państwem."
 nov_ruriks_eliminated: "Koniec rodu Ruryka"
 desc_nov_ruriks_eliminated: "Ród Rurykowiczów został zlikwidowany lub podporządkowany naszej władzy. Republika Nowogrodzka jest bezpieczna."
 neva_fleet: "Stocznia marynarki wojennej w Newie"
 desc_neva_fleet: "Stocznia nad Newą może dostarczyć naszemu państwu liczne okręty i marynarzy."
 nov_the_great: "Nowogród Wielki"
 desc_nov_the_great: "Nowogród stał się najważniejszym miastem handlowym na świecie."
 arkhangelsk_modifier: "Archangielsk"
 desc_arkhangelsk_modifier: "Archangielsk, położony nad Morzem Białym, przyciąga kupców z najdalszych stron, którzy przybywają na miejscowy targ po futra."
 nov_grand_duchy_finland: "Wielkie Księstwo Finlandii"
 desc_nov_grand_duchy_finland: "Podbój Finlandii wysunął kwestię państw buforowych na pierwszy plan debaty politycznej."
 nov_archbishop: "Administracja arcybiskupa"
 desc_nov_archbishop: "Arcybiskup Nowogrodu odgrywa istotną rolę w naszych sprawach politycznych. Uzyskawszy pewien zakres niezależności kościelnej, może poświęcić się działaniom na rzecz dobra państwa."
 nov_cathedrals_modifier: "Kraj bazylik"
 desc_nov_cathedrals_modifier: "Wspaniałość naszego Kościoła inspiruje wszystkich poddanych do oddania się jedynej prawdziwej wierze."
 nov_north_sea_trade: "Rozwój handlu na Morzu Północnym"
 desc_nov_north_sea_trade: "Kontrola nad portowymi miastami północnej Norwegii pozwala nam kierować handel z Nowego Świata i czerpać z niego ogromne zyski."
 baltic_ambition_key: "Bałtycka ambicja"
 nov_lubeck_conquest: "Podbój Hanzy"
 desc_nov_lubeck_conquest: "Przejęliśmy serce hanzeatyckiej sieci handlowej. Bogactwo płynie teraz do naszego państwa."
 tr_united_russia: "Zjednoczona Rosja"
 desc_tr_united_russia: "Rosja została zjednoczona pod naszym panowaniem! Nieustannie dążymy do dalszego poszerzania naszych granic."
 tr_ended_tatar_yoke: "Koniec jarzma tatarskiego"
 desc_tr_ended_tatar_yoke: "Tatarzy nie stanowią już dla nas zagrożenia. Powinniśmy teraz skupić wysiłki na nawracaniu ludów stepu na jedyną prawdziwą wiarę."
 tr_conquered_nov: "Nowogrodzki handel"
 desc_tr_conquered_nov: "Republika wiecowa upadła, a jej kupcy zostali zmuszeni do handlu na naszych rynkach. Korzystamy z gwałtownego ożywienia wymiany handlowej."
 growing_importance_of_golconda: "Rosnące znaczenie Golkondy"
 desc_growing_importance_of_golconda: "Niedawne podboje wojskowe umocniły pozycję tej prowincji jako ważnego lokalnego centrum przeładunkowego."
 coromandel_exports: "Eksport z Dekanu"
 desc_coromandel_exports: "Rozwój ważnego centrum przeładunkowego we wschodnim Dekanie umocnił naszą kontrolę nad handlem, dzięki czemu gospodarka przeżywa rozkwit."
 master_of_southern_india: "Władcy południowych Indii"
 desc_master_of_southern_india: "Dzięki przejęciu pełnej kontroli nad bogatymi ziemiami południowych Indii zyskaliśmy trwały wpływ na gospodarkę Oceanu Indyjskiego. Od Afryki Wschodniej po Malaje słychać język dakhni, a towary wypływające z naszych portów trafiają do wielkich miast Zachodu oraz na dwory cesarskie Wschodu."
 coromandel_trade: "Koromandelski handel"
 desc_coromandel_trade: "Przejęcie kontroli nad wszystkimi ważnymi portami Wybrzeża Koromandelskiego znacznie zwiększyło rentowność wszystkich naszych przedsięwzięć handlowych."
 fall_of_vijayanagar: "Utrata władzy"
 desc_fall_of_vijayanagar: "Utrata naszej rodowej stolicy dobitnie wykazała, że zawiedliśmy jako władcy. Dopóki nie odbudujemy utraconego zaufania, trudno będzie nam kontrolować ziemie i ludność, których lojalności niegdyś byliśmy pewni."
 spoils_of_vijayanagar: "Podbój Widźajanagaru"
 desc_spoils_of_vijayanagar: "Podbijając Miasto Zwycięstwa, dowiedliśmy, że jesteśmy prawowitymi władcami Dekanu i okolicznych ziem."
 bijapur_karnatak_modifier: "Karnatak pod władzą Bidźapuru"
 desc_bijapur_karnatak_modifier: "Podporządkowując sobie Karnatak na południe od Bidźapuru, aż po Przylądek Komoryński, przejęliśmy zdecydowaną kontrolę nad handlem na zachodzie oraz jednym z najbardziej zahartowanych w boju regionów Dekanu. Nowi rekruci tłumnie zasilają nasze szeregi, zarówno w lokalnych punktach werbunkowych, jak i zza mórz."
 bah_conquest_of_gujarat: "Podbój Gudżaratu"
 desc_bah_conquest_of_gujarat: "Zabezpieczyliśmy porty handlowe Gudźaratu, dzięki czemu kontrolujemy znaczną część handlu północnych Indii, a także porty wykorzystywane przez większość pielgrzymów podróżujących do Mekki i Medyny."
 direct_link_with_iran: "Bezpośrednie kontakty ze światem perskim"
 desc_direct_link_with_iran: "Przejmując bezpośrednią kontrolę nad kilkoma ważnymi portami wzdłuż Morza Arabskiego, zapewniliśmy sobie połączenie z Iranem i Arabią. Umożliwia nam ono niezawodny dostęp do koni bojowych, których nie jesteśmy w stanie hodować w naszym klimacie, a także do perskich uczonych i administratorów potrzebnych do wzmocnienia młodego państwa."
 monuments_of_delhi: "Zabytki Delhi"
 desc_monuments_of_delhi: "Upadek Delhi doprowadził do zrabowania wielu skarbów i przymusowego zburzenia licznych zabytków. Z czasem w [Root.GetCapitalName] wzniesiono nowe pomniki, aby upamiętnić to zwycięstwo dla przyszłych pokoleń."
 bah_conquest_of_malwa: "Zdobycie Malwy"
 desc_bah_conquest_of_malwa: "Zabezpieczenie płaskowyżu Malwa zapewniło nam bezpośredni dostęp zarówno do północnych szlaków handlowych, którymi możemy sprzedawać nasze towary, jak i do cennych ośrodków produkcji."
 bah_persianate_empire: "Imperium Perskie"
 desc_bah_persianate_empire: "Dowiedliśmy, że jesteśmy obrońcami elitarnej kultury perskiej, która rozkwita w całych Indiach."
 bah_access_to_the_sea: "Porty Dabhol i Ćaul"
 desc_bah_access_to_the_sea: "Ponowne zapewnienie naszemu sułtanatowi dostępu do morza gwarantuje nam stałe dostawy wysokiej jakości koni bojowych, niezbędnych do utrzymania skutecznej kawalerii."
 mahmud_gawans_madrassah_modifier: "Madrasa Mahmuda Gawana"
 desc_mahmud_gawans_madrassah_modifier: "Zbudowaliśmy w tym mieście wspaniałą medresę, by przyciągnąć na nasze ziemie uczonych z całego świata perskiej kultury."
 marathi_fiefs_modifier: "Lenna marackie"
 desc_marathi_fiefs_modifier: "Rozpoczęliśmy budowę sojuszu z miejscowymi możnowładcami marackimi, którzy wywodzą się z tych ziem. Znacznie zwiększy to nasze możliwości wojskowe."
 metropolis_of_the_deccan_modifier: "Metropolie Dekanu"
 desc_metropolis_of_the_deccan_modifier: "Zbudowaliśmy stolicę, która przetrwa pokolenia. Jest prawdziwym świadectwem państwa, które stworzyliśmy na obcej ziemi."
 brahmin_administrators_modifier: "Bramińscy administratorzy"
 desc_brahmin_administrators_modifier: "Zatrudniamy miejscowych braminów w administracji, zamiast rezerwować te stanowiska wyłącznie dla ulemów."
 persian_gulf_domination: "Dominacja w Zatoce Perskiej"
 MODIFIER_ADM_ADVISOR_COST: "Koszt doradcy adm."
 MODIFIER_DIP_ADVISOR_COST: "Koszt doradcy dyplomatycznego"
 MODIFIER_MIL_ADVISOR_COST: "Koszt doradcy wojskowego"
 MODIFIER_POSSIBLE_POLICY: "Możliwe polityki"
 MODIFIER_FREE_POLICY: "Darmowe polityki"
 MODIFIER_POSSIBLE_ADM_POLICY: "Możliwe polityki administracyjne"
 MODIFIER_POSSIBLE_DIP_POLICY: "Możliwe polityki dyplomatyczne"
 MODIFIER_POSSIBLE_MIL_POLICY: "Możliwe polityki militarne"
 MODIFIER_FREE_ADM_POLICY: "Darmowe polityki administracyjne"
 MODIFIER_FREE_DIP_POLICY: "Darmowe polityki dyplomatyczne"
 MODIFIER_FREE_MIL_POLICY: "Darmowe polityki militarne"
 bng_arabian_sea_trade: "Handel na Morzu Arabskim"
 desc_bng_arabian_sea_trade: "Przebiliśmy się przez północne Indie aż do Morza Arabskiego. Nawiązujemy kontakty handlowe, aby ten podbój przyniósł korzyści naszej gospodarce."
 bng_defied_china: "Wbrew Smokowi"
 desc_bng_defied_china: "Chiński cesarz nie ma żadnej władzy nad naszym imperium. Upokorzenie Smoka jest dowodem naszej pełnej suwerenności."
 converted_bengal: "Jedna wiara w Bengalu"
 desc_converted_bengal: "Czerpiemy korzyści z jedności religijnej w delcie Bengalu. Teraz, gdy większość ludności wyznaje religię państwową, możemy dążyć do stworzenia prawdziwie pobożnego społeczeństwa."
 mint_towns_bng: "Miasta mennicze"
 desc_mint_towns_bng: "Wiele naszych osad bije teraz ogromne ilości monet z wizerunkiem naszego oświeconego władcy. Regulując produkcję, możemy napełniać skarbiec bez obniżania wartości pieniądza."
 bng_textiles: "Zmodernizowany przemysł tekstylny"
 desc_bng_textiles: "Przemysł tekstylny Bengalu należy obecnie do najbardziej wydajnych i innowacyjnych na świecie."
 bng_sufi_mystic_settlers: "Suficcy osadnicy"
 desc_bng_sufi_mystic_settlers: "Charyzmatyczni mistycy suficcy osiedlają się na pogranicznych obszarach delty Bengalu. Powinniśmy wykorzystać ich obecność, otaczając opieką sanktuaria i zakładając targi ryżu."
 bng_proto_industrial_shipyards: "Przedindustrialne stocznie"
 desc_bng_proto_industrial_shipyards: "Stocznie Bengalu robią prawdziwe wrażenie. Ogrom przedsięwzięcia, wymagane zasoby ludzkie i wiedza inżynieryjna wprawiają świat w zdumienie."
 garjat_fealty: "Wierność Garhjat"
 desc_garjat_fealty: "Garhjatowie zaakceptowali swój tradycyjny status poddanych władców wybrzeża."
 bng_orissa_conquest: "Podżeganie do walki"
 desc_bng_orissa_conquest: "Podbój Orissy sprawia, że nasi generałowie pragną kontynuować nasze kampanie dla zdobycia większej chwały."
 bng_conquest_burma: "Bengalskie rządy w Birmie"
 desc_bng_conquest_burma: "Rozszerzamy zasięg naszej administracji na Birmę, likwidując lokalne tradycje zdecentralizowanych rządów."
 tiger_triumphant: "Triumf tygrysa"
 desc_tiger_triumphant: "Tygrysie, tygrysie, płoniesz jasno,\\n\\nWśród nocnych lasów lśnisz;\\n\\nJaka nieśmiertelna dłoń lub oko\\n\\nMogły stworzyć twą straszną symetrię?"
 mlw_gujarat_modifier: "Gudźarackie szkutnictwo"
 desc_mlw_gujarat_modifier: "Przejęliśmy usługi gudźarackich szkutników, aby budować własne floty handlowe."
 mlw_conquest_delhi: "Podbój Doabu"
 desc_mlw_conquest_delhi: "Najbogatsze ziemie Indii należą teraz do nas. Samo Delhi, siedziba licznych zdobywców, weszło w skład naszego imperium."
 mlw_vassals_integrated: "Centralizacja Malwy"
 desc_mlw_vassals_integrated: "Integracja państw wasalnych sprzyja dalszej centralizacji Malwy."
 mlw_well_fed: "Dobrze nakarmieni"
 desc_mlw_well_fed: "Podczas podboju ziem Baghelów nasi żołnierze dobrze się posilili. Z pełnymi brzuchami pomaszerują ku kolejnemu celowi."
 mlw_interfaith_marriage: "Małżeństwa międzywyznaniowe"
 desc_mlw_interfaith_marriage: "Hindusi i muzułmanie nie muszą być wrogami, co udowodniliśmy, zawierając małżeństwa między naszymi rodami królewskimi."
 mlw_coalition: "Malwańskie sojusze"
 desc_mlw_coalition: "Wraz z potężnymi sojusznikami podbijemy rozległe obszary ziem."
 mlw_fortified: "Umocnienie Mandu"
 desc_mlw_fortified: "Po odnowieniu fortyfikacji Mandu możemy skierować uwagę poza stolicę i ulepszyć obronę całego państwa."
 mlw_education: "Wykształcony dwór"
 desc_mlw_education: "Wszyscy dworzanie, zarówno mężczyźni, jak i kobiety, muszą otrzymać wykształcenie."
 gujarati_naval_dominance_modifier: "Gudźaracka dominacja handlowa"
 desc_gujarati_naval_dominance_modifier: "Nasza dominacja morska pozwala nam kontrolować cały handel w zachodnich Indiach."
 united_saurashtra: "Zjednoczenie Saurasztry"
 desc_united_saurashtra: "Podporządkowaliśmy sobie całą Saurasztrę, znacznie powiększając nasze władztwo i zyskując obszar, który zapewni rekrutów dla przyszłych armii."
 guj_conquest_of_malwa: "Zdobycie Malwy"
 desc_guj_conquest_of_malwa: "Przyłączenie płaskowyżu Malwa, którego gleby wulkaniczne są niezwykle żyzne, zapewniło przemysłowi Gudźaratu znacznie większe i pewniejsze dostawy bawełny oraz innych roślin dochodowych."
 guj_rajput_governor: "Radźpucki gubernator"
 desc_guj_rajput_governor: "Nasz gubernator w Radźputanie nadzoruje wszystkie nasze posiadłości w regionie i dąży do jego stopniowej integracji z państwem."
 guj_rajputana_mewar: "Upadek Mewaru"
 desc_guj_rajputana_mewar: "Upadek Mewaru umocnił naszą władzę w regionie i dowiódł wielu, że nasza obecność tutaj jest trwała."
 ahmadabad_paper: "Papiernie Ahmadabadu"
 desc_ahmadabad_paper: "Pod naszym nadzorem papiernie Ahmadabadu szybko stały się najbardziej wydajnymi w całych Indiach, znacząco przyczyniając się do rozwoju miasta."
 guj_textile_industry: "Rozkwit przemysłu tekstylnego"
 desc_guj_textile_industry: "Gudźarackie tkaniny słyną na całym świecie z wysokiej jakości, a popyt na nie stale rośnie. Dla mieszkańców ziem od Europy po Chiny nazwa Kambej stała się synonimem drogich tkanin."
 gujarati_south_africa: "Południowoafrykańskie porty"
 desc_gujarati_south_africa: "Przejmując kontrolę nad Przylądkiem, zyskaliśmy cenny port na szlaku prowadzącym dalej na zachód, a także bazę do kontrolowania zachodniego handlu na Oceanie Indyjskim."
 new_cambay: "Nowy Kambej"
 desc_new_cambay: "Założyliśmy stały port w południowej Afryce, aby rozwijać nasze interesy związane z handlem na zachodzie."
 gujarati_shipyards: "Stocznie Gudźaratu"
 desc_gujarati_shipyards: "Dzięki skoordynowanym wysiłkom sprawiliśmy, że gudźarackie stocznie budzą zazdrość całego świata."
 port_of_surat: "Port w Suracie"
 desc_port_of_surat: "Surat stał się największym portem handlowym Indii, a według niektórych także całego świata. Regularnie trafiają tu towary z Ameryk, Europy, Afryki i wszystkich zakątków Azji, które są sprzedawane lub odsprzedawane. Jeśli w jakimś kraju można powiedzieć, że złoto i srebro płyną strumieniami, to właśnie tutaj."
 capital_of_rajputana: "Stolica Radźputany"
 desc_capital_of_rajputana: "Odnowiliśmy starożytne i święte miasto Udźdźajn, czyniąc je nową stolicą wszystkich radźpuckich książąt. To mocny sygnał dla najeźdźców, którzy chcieliby uznać ten subkontynent za swój dom."
 mer_marwari_cavalry: "Kawaleria Marwari"
 desc_mer_marwari_cavalry: "Radźputowie od zawsze słynęli ze znakomitego jeździectwa, lecz dzięki wytrwałym wysiłkom udało nam się stworzyć rodzimą rasę koni bojowych przewyższającą wszystkie inne na subkontynencie."
 mer_purbias: "Integracja Purbiów"
 desc_mer_purbias: "Dzięki wspólnym wysiłkom przekształciliśmy licznych najemników Purbiów z północnych Indii w potężną siłę wojskową pod naszym dowództwem."
 mer_rajput_army: "Nowa armia"
 desc_mer_rajput_army: "Tradycje wojenne naszych przodków oraz wysiłki na rzecz stworzenia nowoczesnej armii doprowadziły łącznie do osiągnięcia przez nasze wojska najwyższej sprawności bojowej."
 empower_rajput_trade_guilds: "Radźpuckie gildie handlowe"
 desc_empower_rajput_trade_guilds: "Nasza nagła ekspansja w północnych Indiach wzmocniła radźpuckie gildie kupieckie, które stały się nieodłączną częścią przepływu towarów i kapitału."
 kannauj_restored_modifier: "Przywrócenie cesarskiego Kannauju"
 desc_kannauj_restored_modifier: "Wyzwoliliśmy cesarskie miasto Kannauj i odbudowaliśmy je w całej dawnej chwale jako stolicę północnych Indii zjednoczonych pod rządami Radźputów."
 masters_of_malwa: "Władcy Malwy"
 desc_masters_of_malwa: "Odbiliśmy Malwę i uczyniliśmy ją domeną naszego rodu. To wyraźny dowód, że wszyscy Radźputowie powinni podążać za naszym przywództwem!"
 mer_united_rajputana: "Zjednoczona Radźputana"
 desc_mer_united_rajputana: "Zjednoczyliśmy Radźputanę, a wszystkie wielkie radźpuckie rody są teraz naszymi lennikami."
 mer_tribal_recruitment: "Plemienny pobór"
 desc_mer_tribal_recruitment: "Podbój Gondwany otworzył nam możliwość werbowania żołnierzy doświadczonych w walce w dżungli i stosowaniu taktyki partyzanckiej."
 magadha_conquered: "Upadek Magadhy"
 desc_magadha_conquered: "Podbój Magadhy wzmocnił nasze państwo zarówno gospodarczo, jak i politycznie. Ugruntowaliśmy pozycję obrońców tradycyjnych wartości i odnowicieli dawno porzuconych imperialnych ambicji."
 forts_of_rajputana: "Forty Radźputany"
 desc_forts_of_rajputana: "Nasze wysiłki na rzecz ufortyfikowania wzgórz Radźputany przyniosły owoce w postaci szeregu potężnych umocnień, które powstrzymają każdego najeźdźcę. Forty te niemal równie skutecznie służą jako punkty kontroli naszego własnego państwa, a niektórzy twierdzą nawet, że właśnie w tym celu je zbudowano..."
 city_of_lakes: "Miasto jezior"
 desc_city_of_lakes: "Udźdźajn jest nową, dostojną stolicą naszej dynastii, wzniesioną pośród jezior w dawnej kolebce naszego królestwa. Pozostanie potężna tak długo, jak długo nasze państwo zachowa niepodległość."
 mer_plains_of_punjab: "Równiny Pendżabu"
 desc_mer_plains_of_punjab: "Podbój Pendżabu przyłączył do naszego państwa górny bieg Indusu. W przeciwieństwie do naszej ojczyzny Pendżab, choć gorący, pozostaje żyzny. Jego pola wyżywią nasze armie, a Bhilowie, Dźatowie i oczywiście Radźputowie zasilą ich szeregi."
 mer_sindh_conquest: "Podbój Sindhu"
 hin_riches_modifier: "Bogactwa Indii"
 desc_hin_riches_modifier: "Niemal monopolistyczna kontrola nad handlem diamentami, przyprawami i tkaninami przynosi naszemu państwu ogromne bogactwo."
 industrialized_bengal: "Industrializacja w Bengalu"
 desc_industrialized_bengal: "Nasze ogromne inwestycje w przemysł bengalski stawiają nas w czołówce innowacji technologicznych."
 dharma_modifier: "Dharma"
 desc_dharma_modifier: "Jesteśmy jednym ludem, prawdziwie harmonijnym narodem."
 united_bengal: "Zjednoczony Bengal"
 desc_united_bengal: "Po zjednoczeniu Bengalu możemy skupić wysiłki na karczowaniu gęstych dżungli i przygotowaniu ziem pod uprawę."
 hin_rajput_integration: "Integracja radźputów"
 desc_hin_rajput_integration: "Radźpucka szlachta musi pogodzić się z integracją z naszym państwem bez przyznawania jej szczególnych przywilejów."
 peacock_throne: "Pawi tron"
 desc_peacock_throne: "Nasz monarcha zasiada na majestatycznym Pawim Tronie, ozdobionym rubinami, granatami, diamentami, perłami i szmaragdami."
 hindu_ganges: "Kąpiel w Gangesie"
 desc_hindu_ganges: "Święta rzeka Ganges przynosi duchową czystość naszemu państwu."
 exaggerated_military_statistics: "Wyolbrzymione statystyki wojskowe"
 desc_exaggerated_military_statistics: "Być może podczas podboju ziem Lao nie zdobyliśmy aż miliona słoni, lecz rozpowszechnianie takich statystyk ułatwia rekrutację."
 million_rice_fields: "Milion pól ryżowych"
 desc_million_rice_fields: "Obfite dostawy ryżu z nowo podbitych ziem Lan Na sprawiają, że nasze armie maszerują z pełnymi brzuchami."
 chakravarti: "Ćakrawarti"
 desc_chakravarti: "Nasz monarcha przyjął tytuł Ćakrawartina, oznaczający Władcę Wszechświata. Wszystkie ludy Azji Południowo-Wschodniej uznają nasze panowanie."
 tau_arakan_trade: "Arakański handel"
 desc_tau_arakan_trade: "Podbój Arakanu, w tym miasta handlowego Ćittagong, otwiera nowe możliwości skierowania handlu ku naszym wybrzeżom."
 tau_elephant_battle: "Wojna o białe słonie"
 desc_tau_elephant_battle: "Wojny z Syjamem były zacięte. Słoń ścierał się ze słoniem w bitwach, o których będzie się opowiadać do końca czasów. Wiele nauczyliśmy się dzięki tym doświadczeniom."
 tau_expansionism: "Birmański ekspansjonizm"
 desc_tau_expansionism: "Po podporządkowaniu sobie Bengalu konieczne stało się rozszerzenie naszej administracji. Nie możemy polegać na luźnych układach wasalnych, jeśli chcemy skutecznie kontrolować nasze władztwo."
 tau_buddhist_defender: "Obrońca buddyzmu lankijskiego"
 desc_tau_buddhist_defender: "Obroniliśmy świątynie i relikwie Lanki, a tym samym odnowiliśmy nasze własne święte tradycje buddyjskie."
 tau_mandala: "Wielka mandala"
 desc_tau_mandala: "Monarcha jest centrum wszechświata. Wszyscy pozostali władcy krążą wokół niego, oddając mu cześć."
 shan_relocation: "Przymusowe przesiedlenia"
 desc_shan_relocation: "Uciążliwe społeczności należy przesiedlać do stolicy, aby ograniczyć ryzyko zbrojnych buntów."
 tau_new_capital: "Pałac Kanbawzathadi"
 desc_tau_new_capital: "Wzniesiono pałac Kanbawzathadi, aby głosił chwałę naszej nowej stolicy."
 mug_formation_hope: "Bogactwa Indii"
 desc_mug_formation_hope: "Wielu awanturników najróżniejszego pochodzenia dołączyło do naszych szeregów, by łupić bogactwa subkontynentu indyjskiego."
 mug_looting: "Plądrowanie Pendżabu"
 desc_mug_looting: "Wyprawa w głąb Indii przyniosła naszym stronnikom obfite łupy. Teraz walczą z nową energią o rozszerzenie naszej władzy nad tymi ziemiami."
 mug_fall_of_delhi: "Upadek Delhi"
 desc_mug_fall_of_delhi: "Upadek Delhi oznacza nasze narodziny jako nowej potęgi na subkontynencie indyjskim, której służyć mogą jedynie najdzielniejsi żołnierze."
 lahore_subah: "Suba Lahauru"
 desc_lahore_subah: "To stolica suby Lahauru, jednej z prowincji administracyjnych naszego imperium i naturalne centrum Pendżabu."
 mughal_stronghold: "Ufortyfikowana twierdza"
 desc_mughal_stronghold: "Włożyliśmy wiele wysiłku w budowę potężnej twierdzy z silnym garnizonem w tej prowincji, aby powstrzymywać obcych najeźdźców i kontrolować miejscowe klany górskie."
 pacified_kabulistan: "Pacyfikacja Kabulistanu"
 heirs_of_timur: "Dziedzice Timura"
 desc_heirs_of_timur: "Odbudowaliśmy imperium utracone po śmierci Timura Chromego i zrealizowaliśmy ambicje Szahrucha i Abu Saida."
 mug_burmese_ruby_trade: "Birmański handel rubinami"
 desc_mug_burmese_ruby_trade: "Podbój Górnej Birmy zapewnił naszemu imperium dostęp do największego znanego źródła rubinów."
 mughal_china: "Mogolskie Chiny"
 desc_mughal_china: "Siłą oręża zmusiliśmy Chińczyków do prowadzenia z nami handlu i dyplomacji na naszych warunkach."
 mug_general_land_assessement_modifier: "Powszechna wycena ziemi"
 desc_mug_general_land_assessement_modifier: "Dzięki szeroko zakrojonemu pomiarowi gruntów uzyskaliśmy wystarczająco dokładny obraz naszych posiadłości, by sprawnie i w pełni nimi zarządzać."
 mug_conquest_of_sindh: "Podbój Sindhu"
 mug_malaccan_viceroyalty_established: "Wicekrólestwo Malakki"
 mug_malay_seamanship: "Malajskie umiejętności żeglarskie"
 desc_mug_malay_seamanship: "Podbój Półwyspu Malajskiego zapewnił nam dostęp do utalentowanych żeglarzy z archipelagu."
 subah_of_ayuddhya_modifier: "Subah Ajutthaji"
 desc_subah_of_ayuddhya_modifier: "To stolica naszej południowo-wschodniej suby, a tym samym pod wieloma względami centrum całego regionu."
 mug_lower_burma: "Podporządkowanie Dolnej Birmy"
 mug_garjat_recruitment: "Werbunek w Garhdźacie"
 desc_mug_garjat_recruitment: "Podbijając Orisę uzyskaliśmy dostęp do wielu wojowników królestw Garhdźatu, którzy szukają szczęścia w stolicy swojego dawnego władcy Delty rzeki Mahanadi."
 mug_conquest_of_bengal: "Podbój Bengalu"
 desc_mug_conquest_of_bengal: "Podbój delty Bengalu znacznie zwiększył wydajność naszego handlu oraz produkcję towarów przeznaczonych na eksport."
 conquest_of_bihar_and_bengal: "Podbój Bengalu i Biharu"
 desc_conquest_of_bihar_and_bengal: "Podbój Bengalu i Biharu uczynił nas panami całego biegu Gangesu oraz wszystkich bogatych ziem, które się z nim wiążą."
 fortified_the_doab: "Ufortyfikowanie równin Hindustanu"
 desc_fortified_the_doab: "Chronimy bogate miasta Hindustanu siecią dobrze obsadzonych garnizonami fortyfikacji. Skutecznie zabezpieczają je zarówno przed wrogami, jak i rozbójnikami."
 renovated_grand_trunk_road: "Odnowiona Grand Trunk Road"
 maratha_recruitment: "Zaciąg Marathów"
 desc_maratha_recruitment: "Spacyfikowanie regionu Desz umożliwiło nam najem marackich wojowników. To doświadczeni lekkozbrojni kawalerzyści, biegli w taktyce partyzanckiej i napadach."
 western_trade_relations: "Stosunki handlowe z Zachodem"
 desc_western_trade_relations: "Nawiązaliśmy bliskie stosunki z zachodnim mocarstwem, aby lepiej poznać jego obyczaje i uzyskać korzystne umowy handlowe z tamtejszymi kupcami."
 mug_control_of_sufi_shrines: "Kontrola sufickich świątyń"
 desc_mug_control_of_sufi_shrines: "Objęliśmy bezpośrednią opieką wszystkie wielkie sanktuaria sufickie na subkontynencie, ściśle wiążąc nasze rządy z autorytetem świętych indyjskich mistrzów."
 ajmer_subah: "Suba Adźmeru"
 desc_ajmer_subah: "Starożytne miasto Adźmer, położone w samym sercu Radźputany i pozwalające wywierać wpływ po obu stronach pasma Aravalli, jest idealną stolicą naszej radźpuckiej suby. Stanowi centrum poboru podatków oraz działalności religijnej i wojskowej w regionie."
 mug_watan_jagirs_rajputs: "Radźpucki mansabdari"
 desc_mug_watan_jagirs_rajputs: "Przywracając dawnym radźpuckim dynastiom ich rodowe ziemie w postaci wspólnie zarządzanych dźagirów, zyskaliśmy ich lojalność i służbę."
 mughal_imperial_capital: "Miasto zwycięstwa "
 desc_mughal_imperial_capital: "Zbudowaliśmy tu nowe miasto, które będzie stolicą imperium wszystkich wyznań i ludów. To prawdziwy dowód wielkości naszej dynastii."
 mug_divine_faith: "Boska wiara"
 desc_mug_divine_faith: "Najbliżsi słudzy naszego władcy są nie tylko możnymi, lecz także jego uczniami. Wiara boska pozostaje zbiorem przekonań wyznawanych przez wąski krąg rządzących, ale zapewnia lojalność, jakiej nie mogłoby zagwarantować tradycyjne imperium oparte na więzach pokrewieństwa."
 city_of_aurangabad: "Aurangabad"
 desc_city_of_aurangabad: "Aurangabad został zbudowany jako nowa stolica naszej dynastii na Dekanie, siedziba władzy, z której możemy rządzić całymi Indiami."
 opinion_viceroyalty_of_deccan: "Wicekrólestwo Dekanu"
 viceroyalty_of_the_deccan: "Wicekról Dekanu"
 desc_viceroyalty_of_the_deccan: "Jako Wicekról Mogołów powinniśmy rządzić Dekanem z korzyścią dla naszych pryncypałów."
 mug_viceroyalty_of_the_deccan: "Wicekrólestwo Dekanu"
 desc_mug_viceroyalty_of_the_deccan: "Aby sprawniej zarządzać naszym rozległym państwem, powierzyliśmy rządy nad południowymi Indiami odrębnemu wicekrólestwu. Dzięki temu nasza administracja może skuteczniej zajmować się ekspansją w innych kierunkach."
 mug_southern_markets: "Południowe rynki i zaciąg poligarów"
 desc_mug_southern_markets: "Podbiliśmy centralne wyżyny płaskowyżu Dekanu i zapewniliśmy bezpieczeństwo szlakom handlu lądowego prowadzącym aż na równiny północnych Indii."
 mughal_strongholds: "Mogolska twierdza"
 desc_mughal_strongholds: "Twierdze Gwalior i Ranthambore niegdyś stały nam na drodze ku zachodowi, lecz teraz strzegą naszych ziem przed najazdami. Zdobycie tych fortec dowiodło światu naszych zdolności wojskowych."
 mug_conquest_of_rajputana: "Podbój Radźputany"
 desc_mug_conquest_of_rajputana: "Pokonanie dawnych dynastii Radźputany dowiodło potęgi militarnej naszego rodu i wzbudziło podziw w całej Azji Południowej."
 hajj_ports: "Porty Gudźaratu"
 desc_hajj_ports: "Podbój Gudźaratu zapewnił nam dostęp do jednych z najbardziej ruchliwych portów świata. Ożywiło to naszą gospodarkę i dało nam zasięg, jakiego wcześniej nie mieliśmy."
 mug_riches_of_golconda_modifier: "Podbój Golkondy"
 desc_mug_riches_of_golconda_modifier: "Podporządkowanie Telingany i wybrzeża Andhry zapewniło nam dostęp do północnej części strefy handlowej Wybrzeża Koromandelskiego oraz kwitnącego rynku diamentów wokół kopalń w Kollur."
 mug_coromandel_dominance: "Dominacja na Wybrzeżu Koromandelskim"
 coromandel_traders: "Koromandelscy handlarze"
 desc_coromandel_traders: "Podbój Wybrzeża Koromandelskiego dał nam kontrolę nad jedną z największych stref handlu i produkcji na subkontynencie."
 noble_power_monarchy: "Arystokracja u władzy"
 desc_noble_power_monarchy: "Szlachta przejęła pełną kontrolę nad naszym rządem i utrzyma ją, dopóki nie ograniczymy jej wpływów."
 bargi_giri: "Bargi-giri"
 desc_bargi_giri: "Przyjmujemy maracką taktykę opartą na dużej mobilności, skuteczną przeciw armiom obciążonym artylerią."
 marathi_expensive_horses: "Niedobór koni"
 desc_marathi_expensive_horses: "Niedobór dekańskich koni zmusza państwo do sprowadzania ich z innych regionów."
 maratha_stopped_militarizing: "Powrót na pola"
 desc_maratha_stopped_militarizing: "Ograniczono militaryzację społeczeństwa marackiego, ponieważ doprowadziła ona do niedoboru rąk do pracy w rolnictwie."
 popular_palkhis: "Ludowe procesje z palankinem"
 desc_popular_palkhis: "Kult Witthoby rozkwita dzięki masowym pielgrzymkom i uroczystościom."
 organized_palkhis: "Zorganizowane procesje z palankinem"
 desc_organized_palkhis: "Pod przewodnictwem braminów kult Witthoby stał się ortodoksyjną sektą hinduistyczną."
 organized_palkhis_nonhindu: "Zorganizowane procesje z palankinem"
 desc_organized_palkhis_nonhindu: "Pod przewodnictwem braminów kult Witthoby stał się ortodoksyjną sektą hinduistyczną."
 brahmin_peshwa: "Bramiński peśwa"
 desc_brahmin_peshwa: "Urząd peszwy, premiera naszego państwa, sprawuje zdolny bramin."
 brahmin_peshwa_nonhindu: "Bramiński peśwa"
 desc_brahmin_peshwa_nonhindu: "Urząd peszwy, premiera naszego państwa, sprawuje zdolny bramin."
 brahmins_alienating_merchants: "Bramini zrażają kupców"
 desc_brahmins_alienating_merchants: "Polityka i postawy społeczne braminów skłaniają muzułmańskich kupców do opuszczania tej prowincji."
 brahmins_stopped_alienating_merchants: "Przyciąganie muzułmańskich kupców"
 desc_brahmins_stopped_alienating_merchants: "Wajśjowie przejęli kontrolę nad tą prowincją i prowadzą politykę mającą przyciągnąć muzułmańskich kupców."
 brahmin_orthodoxy_enforced: "Narzucona ortodoksja bramińska"
 desc_brahmin_orthodoxy_enforced: "Niebrahmińskie ruchy religijne są podporządkowywane ortodoksji bramińskiej."
 nonbrahmin_movements: "Ruchy religijne inne niż bramini"
 desc_nonbrahmin_movements: "Prosty lud uczestniczy w hinduskich ruchach religijnych, które pomniejszają autorytet braminów."
 brahmin_fort: "Bramińska kontrola nad fortem"
 desc_brahmin_fort: "Choć bramini nie dorównują kastom wojskowym w sztuce oblężniczej, lojalni przedstawiciele tej kasty utrzymują kontrolę nad fortem w tej prowincji."
 nobles_retain_fort: "Utrzymanie fortu przez możnowładców"
 desc_nobles_retain_fort: "Kontrowersyjnemu generałowi pozwolono zachować kontrolę nad fortem w tej prowincji, kosztem cieszących się lokalnym poparciem braminów."
 social_banditry_modiifer: "Społeczni bandyci"
 desc_social_banditry_modiifer: "Miejscowa ludność skupia się wokół grupy rozbójników, których uważa za ludowych bohaterów stawiających opór tyranii naszego rządu."
 addressing_social_banditry: "Przeciwdziałanie rozbójnictwu"
 desc_addressing_social_banditry: "Podejmujemy działania mające zaradzić społecznym przyczynom rozbójnictwa w naszym państwie."
 vaisya_manufactories: "Rozwój produkcji tekstyliów"
 desc_vaisya_manufactories: "Postępy w produkcji tkanin zwiększają wydajność tej prowincji i stwarzają możliwości rozwoju przemysłu."
 vaisya_gem_production: "Wspieranie produkcji klejnotów"
 desc_vaisya_gem_production: "Postanowiliśmy wspierać gildie zajmujące się handlem klejnotami w tej prowincji."
 vaisya_spices_trade: "Wspieranie kupców przypraw"
 desc_vaisya_spices_trade: "Postanowiliśmy wspierać gildie zajmujące się handlem przyprawami w tej prowincji."
 vaisya_silk_goods: "Wspieranie tkactwa jedwabiu"
 desc_vaisya_silk_goods: "Postanowiliśmy wspierać gildie zajmujące się produkcją i handlem jedwabiem w tej prowincji."
 vaisya_caste_system_enforced: "Egzekwowanie systemu kastowego"
 desc_vaisya_caste_system_enforced: "Rygorystyczne egzekwowanie systemu kastowego sprawia, że wszyscy hinduiści znają swoje miejsce."
 drylands_frontier_development: "Rozwój pogranicza"
 desc_drylands_frontier_development: "Budujemy w tej prowincji zbiorniki wodne i kanały, aby zakończyć okres stagnacji gospodarczej."
 drylands_stagnation: "Stagnacja na suchych ziemiach"
 desc_drylands_stagnation: "Zaniedbanie suchych obszarów doprowadziło do stagnacji gospodarczej."
 jain_resistance: "Opór dźinistów"
 desc_jain_resistance: "Dźiniści w całym naszym państwie odmawiają podporządkowania się władzom, powodując liczne problemy finansowe i administracyjne."
 passive_resistance: "Bierny opór"
 desc_passive_resistance: "Dźiniści w tej prowincji odmawiają podporządkowania się władzom, powodując liczne problemy finansowe i administracyjne."
 preferred_jain_bankers: "Preferowanie dźinijskich bankierów"
 desc_preferred_jain_bankers: "Nasze preferencje wobec dźinijskich rodzin bankierskich przynoszą korzyści w postaci niższych stóp procentowych."
 preferred_brahmin_bankers: "Preferowanie bankierów bramińskich"
 desc_preferred_brahmin_bankers: "Nasi poddani mają pewność, że finanse państwa znajdują się w odpowiedzialnych rękach braminów."
 jain_administration: "Dźiniści w administracji"
 desc_jain_administration: "Dźinijscy finansiści, ministrowie i administratorzy sprawnie zajmują się sprawami państwa."
 paryushana: "Paryushana"
 desc_paryushana: "Dźiniści z tej prowincji obchodzą Paryuszanę, święty okres poświęcony medytacji i przebaczeniu."
 suppressed_jain_festivals: "Tłumienie świąt dźinijskich"
 desc_suppressed_jain_festivals: "Dźiniści w tej prowincji są niezadowoleni z naszej polityki tłumienia ich praktyk religijnych."
 vaisya_merchant_debt: "Zadłużenie gildii"
 desc_vaisya_merchant_debt: "Kilka ważnych gildii wajśjów znalazło się w trudnej sytuacji finansowej, co ogranicza ich zdolność do wytwarzania towarów, od których zależy nasza gospodarka."
 jain_debt_forgiven: "Umorzenie długów dźinistów"
 desc_jain_debt_forgiven: "Dźinijskie rodziny bankierskie są oburzone, że zmusiliśmy je do umorzenia należnych im długów."
 jain_theological_debates: "Obrona teizmu dźinijskiego"
 desc_jain_theological_debates: "Dwór uznał dźinijskie argumenty na rzecz teizmu, gwarantując wyznawcom tej religii prawa i swobody."
 jains_denounced_as_khafirs: "Potępienie dźinistów jako niewiernych"
 desc_jains_denounced_as_khafirs: "Dźinizm został potępiony jako religia ateistyczna, ku wielkiemu zadowoleniu ulemów."
 jain_religious_concessions: "Ustępstwa religijne wobec dźinistów"
 desc_jain_religious_concessions: "Wprowadzono niepopularne przepisy wymuszające przestrzeganie dźinijskich zakazów religijnych."
 jain_peshwa: "Dżinijski Peśwa"
 desc_jain_peshwa: "Wybraliśmy wpływowego dźinijskiego administratora i dowódcę wojskowego na premiera naszego państwa. Jego zasługi dla państwa są nieocenione."
 rajput_marriage_alliances: "Małżeństwa sojusznicze z Radźputami"
 desc_rajput_marriage_alliances: "Małżeństwa z radźpucką szlachtą tworzą wymagającą, lecz korzystną więź między Radźputami a panującą dynastią."
 rajput_scion_province_modifier: "Założenie osady radźpuckiej"
 desc_rajput_scion_province_modifier: "Pozwoliliśmy przedstawicielowi radźpuckiego rodu założyć tu osadę, z której będzie zarządzał prowincją w naszym imieniu. Przywozi ze sobą część majątku swojego klanu, dzięki czemu nowe miasto stwarza doskonałe możliwości inwestycyjne."
 rajput_dharma: "Radźpucka Dharma"
 desc_rajput_dharma: "Służba państwu i radźpuckie wartości wojowników współistnieją w naszym kraju w harmonii."
 rajput_connections: "Radźpuckie powiązania"
 desc_rajput_connections: "Klany radźpuckie są rozproszone po całych północnych Indiach, a wiele z nich łączą więzy pokrewieństwa, które możemy wykorzystać do poprawy naszej pozycji dyplomatycznej."
 rajput_claims_modifier: "Radźpuckie waśnie"
 desc_rajput_claims_modifier: "Klany radźpuckie północnych Indii łączą więzy pokrewieństwa, lecz takie więzi często stają się źródłem waśni trwających całe pokolenia. Wykorzystujemy te spory jako pretekst do zgłaszania roszczeń terytorialnych."
 rajputs_curtailed_modifier: "Uszczupleni radżputowie"
 desc_rajputs_curtailed_modifier: "Pozbawiliśmy kilku wpływowych radźpuckich możnowładców ich godności. Nie wzbudziło to zaufania naszych radźpuckich żołnierzy."
 sepoys_modifier: "Zaciąg sipajów"
 desc_sepoys_modifier: "Rekrutujemy miejscową ludność indyjską do pułków sipajów służących w armii Kompanii."
 fair_land_negotiations: "Uczciwe zakupy ziemi"
 desc_fair_land_negotiations: "Nasze uczciwe postępowanie wobec zamorskich władców poprawia naszą pozycję dyplomatyczną na arenie międzynarodowej."
 fair_land_purchase: "Uczciwy zakup ziemi"
 opium_trade: "Handel opium"
 opium_modifier: "Produkcja opium"
 desc_opium_modifier: "Pola maku w tej prowincji dostarczają opium na ogromny, wciąż niewykorzystany rynek chiński."
 trade_company_rule: "Władza kompani"
 desc_trade_company_rule: "Nasze kompanie handlowe rządzą niemal równie bezpośrednio i sprawnie jak administracja państwowa. To siła, z którą trzeba się liczyć."
 restricted_company_missionaries: "Zakaz działalności misyjnej"
 desc_restricted_company_missionaries: "Misjonarzom przyznano jedynie ograniczone prawo do nawracania innowierców na terenach podległych naszym kompaniom handlowym."
 approprioated_currency: "Odpowiednia waluta"
 desc_approprioated_currency: "Zamiast bić własną monetę od podstaw, Kompania po prostu oznacza lokalne monety własnym znakiem."
 company_and_personal_interests: "Faktorzy realizują prywatne interesy"
 desc_company_and_personal_interests: "Oczekujemy, że faktorzy naszych zamorskich kompanii handlowych będą dbać zarówno o własne interesy, jak i o interesy Kompanii. Nie jest to może najskuteczniejszy sposób zarządzania, ale ma swoje zalety."
 honorable_company: "Uczciwa Kompania"
 desc_honorable_company: "Dzięki ścisłemu nadzorowi dbamy o to, by faktorzy kompanii handlowych służyli Kompanii, a nie własnym interesom."
 company_missionary_activity: "Zezwolenie na działalność misyjną"
 desc_company_missionary_activity: "Pozwoliliśmy kaznodziejom szerzyć prawdziwą wiarę w tej prowincji, stosując wątpliwe metody. Miejscowa ludność nie przyjęła tych działań przychylnie."
 company_mint: "Mennica Kompanii"
 desc_company_mint: "W tej prowincji bije się monetę Kompanii, zapewniając jednolity środek płatniczy we wszystkich jej przedsięwzięciach."
 developing_company_settlement: "Rozkwitająca osada"
 desc_developing_company_settlement: "Migranci z naszej ojczyzny pomyślnie osiedlili się w tej prowincji, zakładając szkoły, szpitale i miejsca kultu."
 monopoly_enforced: "Wymuszony monopol"
 desc_monopoly_enforced: "Dopilnowaliśmy, by miejscowi władcy uznali monopole Kompanii na towary produkowane w tej prowincji."
 rogue_traders_prosecuted: "Ściganie nielegalnych kupców"
 desc_rogue_traders_prosecuted: "Prywatni kupcy łamiący monopol Kompanii zostali osądzeni z całą surowością prawa."
 province_rogue_traders_prosecuted: "Ściganie nielegalnych kupców"
 desc_province_rogue_traders_prosecuted: "Prywatni kupcy łamiący monopol Kompanii zostali osądzeni z całą surowością prawa."
 company_interference: "Ingerencja kompanii w lokalne konflikty"
 desc_company_interference: "Nasze kompanie handlowe angażują się w wojny między miejscowymi władcami, licząc na wykorzystanie konfliktów dla własnych korzyści handlowych."
 failed_monsoon: "Nieudany monsun"
 desc_failed_monsoon: "Oczekiwana pora deszczowa nie nadeszła. Prowincję dotknęła dotkliwa susza."
 company_drought: "Ciężki głód"
 desc_company_drought: "Polityka Kompanii pogłębiła suszę w tej prowincji, prowadząc do powszechnego głodu."
 plum_rains: "Plum Rain"
 desc_plum_rains: "Tegoroczna pora deszczowa wyjątkowo sprzyja naszym uprawom, zwiększając lokalne plony."
 good_monsoon_modifier: "Urodzajny sezon deszczowy"
 desc_good_monsoon_modifier: "Tegoroczna pora deszczowa nie była ani zbyt gwałtowna, ani zbyt łagodna."
 gen_delhi_conquest: "Podbój Delhi "
 desc_gen_delhi_conquest: "Najbogatsze ziemie Indii należą teraz do nas. Samo Delhi, siedziba licznych zdobywców, weszło w skład naszego imperium."
 warrior_castes_promoted: "Awans kast wojowników"
 desc_warrior_castes_promoted: "Wspieranie tożsamości kast wojowników stworzyło zdyscyplinowaną kulturę wojenną."
 indian_empire: "Imperium Indyjskie"
 desc_indian_empire: "Wyrośliśmy na jedno z największych imperiów w historii Indii. Przygotowujemy się na jeszcze większą chwałę."
 south_india_construction: "Rozkwit architektury"
 desc_south_india_construction: "Nasi architekci z zapałem wznoszą nowe świątynie, pałace, stocznie i warsztaty."
 south_india_forts: "Ufortyfikowane państwo"
 desc_south_india_forts: "Nasz lud jest dobrze chroniony przez solidne forty górujące nad okolicą."
 deccan_conquest: "Dekańska dominacja"
 desc_deccan_conquest: "Dzięki armiom marackim pod naszym dowództwem podbiliśmy Dekan."
 india_gunpowder_empire: "Imperium prochu czarnego"
 desc_india_gunpowder_empire: "Armaty i broń palna zrewolucjonizowały sztukę wojenną. Przyjęliśmy nowe taktyki, aby maksymalnie wykorzystać skuteczność tej broni."
 india_powerful_subject: "Cieszący się szacunkiem zwierzchnik"
 desc_india_powerful_subject: "Świat postrzega nas jako łaskawych władców, hojnie powierzających władzę szlachetnym i godnym zaufania poddanym."
 india_guj_bng_trade: "Indyjski handel przybrzeżny"
 desc_india_guj_bng_trade: "Przejęliśmy kontrolę nad jedną z najzamożniejszych sieci handlowych Indii. Polityka państwa koncentruje się teraz na czerpaniu z niej zysków."
 india_jains_promoted: "Patronat nad rodzinami dźinijskimi"
 desc_india_jains_promoted: "Objęliśmy patronatem kilka wpływowych rodzin dźinijskich, które odwdzięczają się za naszą hojność, wspierając administrację."
 india_production: "Zwiększona produkcja"
 desc_india_production: "Nasze nowe warsztaty zapewniają dodatkowe miejsca pracy rzemieślnikom i robotnikom, zwiększając zdolności produkcyjne."
 india_light_ships: "Flota handlowa"
 desc_india_light_ships: "Liczne statki handlowe chronią i rozwijają naszą sieć wymiany, zapewniając napływ bogactw do naszych portów."
 india_goods_produced: "Rozwój przemysłu"
 desc_india_goods_produced: "Nowo wzniesione manufaktury wykorzystują najnowocześniejsze metody produkcji. Obserwujemy bezprecedensowy rozkwit całego przemysłu."
 india_expanded_harem: "Powiększono harem"
 desc_india_expanded_harem: "Nasz harem gości małżonki i konkubiny z wielu znamienitych rodów szlacheckich. Te więzi dyplomatyczne pomagają łagodzić napięcia, gdy nasze działania wywołują oburzenie."
 sikh_golden_temple: "Złota świątynia"
 desc_sikh_golden_temple: "Złota Świątynia w Amritsarze jest najświętszym miejscem sikhizmu i uznawana jest za siedzibę duchowego autorytetu."
 hazur_sahib: "Hazur Sahib"
 desc_hazur_sahib: "Jako jedna z pięciu sikhijskich takht, gurudwara Hazur Sahib przyciąga licznych pielgrzymów."
 harmandar_sahib: "Harmandir Sahib"
 desc_harmandar_sahib: "Jako jedna z pięciu sikhijskich takht, gurudwara Harmandir Sahib przyciąga licznych pielgrzymów."
 sikh_empire: "Imperium Sikhów"
 desc_sikh_empire: "Nasze państwo stało się synonimem doczesnej potęgi sikhów, a wielu nazywa je po prostu „Imperium Sikhów”."
 hindu_education: "Reforma edukacji hinduistycznej"
 desc_hindu_education: "W naszym państwie wdrażany jest zreformowany system edukacji, koncentrujący się na nauczaniu teologii hinduistycznej i administracji państwowej."
 sapta_puri_modifier: "Sapta Puri"
 desc_sapta_puri_modifier: "Kontrolujemy siedem najświętszych miejsc pielgrzymkowych hinduizmu. Wierni czerpią inspirację z naszego oddania religii."
 ulemma_appeased: "Udobruchanie ulemów"
 desc_ulemma_appeased: "Obawom ulemów nadano większy priorytet niż postulatom hinduskich braminów. Dzięki temu zyskaliśmy przychylność naszych muzułmańskich poddanych."
 gen_brahmin_loyalty: "Lojalność braminów"
 desc_gen_brahmin_loyalty: "Postulaty hinduskich braminów zyskały pierwszeństwo przed żądaniami muzułmańskich ulemów. Dzięki temu zyskaliśmy przychylność naszych hinduistycznych poddanych."
 gen_sufi_shrines: "Kontrola sufickich świątyń"
 desc_gen_sufi_shrines: "Kontrolujemy teraz najważniejsze sanktuaria sufickie w Indiach i hojnie je wspieramy. Sufi napływają do naszego państwa, a podróżując po kraju, szerzą wiarę islamską."
 sikh_conversion: "Podbój Pendżabu"
 desc_sikh_conversion: "Podbój Pendżabu ośmielił tamtejszą społeczność sikhijską. W miarę jak idee i instytucje sikhijskie zyskują dominującą pozycję, coraz więcej ludzi przyjmuje nową wiarę."
 revoked_estate_modifier: "Próżnia władzy lokalnej"
 desc_revoked_estate_modifier: "Po zdławieniu miejscowych elit władzy w tej prowincji porządek publiczny stale się pogarsza. Mieszkańcy sprzeciwiają się zmianom i przynajmniej na razie obwiniają za nie władze centralne."
 maratha_benign_neglect: "Przychylna autonomia Marathów"
 desc_maratha_benign_neglect: "Pozwoliliśmy Marathom rządzić tą prowincją z dużą dozą autonomii. W zamian wspierają nasze armie, dostarczając rekrutów spośród chłopstwa."
 EST_VAL_NOBLE_ELITE: "Elita szlachecka: §Y$VAL$%§!"
 tibet_restored_pala: "Przywrócenie królestwa Pala"
 desc_tibet_restored_pala: "Odtworzenie królestwa Pala jako naszego państwa poddanego sprawia, że odbudowa Imperium Tybetańskiego wydaje się pewna."
 tibet_china_defeated: "Pokonanie Chin"
 desc_tibet_china_defeated: "Zwycięstwo Tybetu nad Chinami ośmiela nasze armie. Długa kampania zapewniła nam cenne doświadczenie wojskowe, które wykorzystamy do zdławienia pozostałego chińskiego oporu."
 varna_avenged: "Pomszczenie Warny"
 desc_varna_avenged: "Wypędziliśmy Turków z Europy, mszcząc naszego poległego króla."
 greater_commonwealth: "Wielka Rzeczpospolita"
 desc_greater_commonwealth: "Polska Rzeczpospolita Obojga Narodów rozszerzyła swoje granice, włączając do swego władztwa Litwę, Węgry i Czechy."
 broke_the_rus: "Złamanie potęgi Rusi"
 desc_broke_the_rus: "Książęta ruscy zostali całkowicie pokonani, ich kremliny spalone, a ambicje zniweczone."
 polish_renaissance: "Polski renesans"
 desc_polish_renaissance: "Polskie społeczeństwo przyjmuje idee renesansu, co prowadzi do nowych osiągnięć technologicznych i teoretycznych."
 pol_thriving_jewish_community: "Rozkwit społeczności żydowskich"
 desc_pol_thriving_jewish_community: "Zapewniliśmy polskim Żydom, że nasze państwo jest dla nich bezpieczną przystanią."
 kazimierz_modifier: "Kazimierz"
 desc_kazimierz_modifier: "Kazimierz jest siedzibą krakowskiej społeczności żydowskiej. Przyznane jej prawa i przywileje sprzyjają rozwojowi gospodarczemu miasta."
 dealt_with_the_sejm: "Uporanie się z sejmem"
 desc_dealt_with_the_sejm: "Po złamaniu potęgi sejmu nasza kontrola nad polskim rządem jest niemal absolutna."
 invested_in_eastern_poland: "Inwestycje we wschodniej Polsce"
 desc_invested_in_eastern_poland: "Nasze inwestycje we wschodniej Polsce zapewnią temu regionowi dobrobyt na całe stulecia."
 order_of_the_dragon_restored: "Przywrócenie Zakonu Smoka"
 desc_order_of_the_dragon_restored: "Zakon Smoka ponownie stanowi bastion powstrzymujący osmańską ekspansję w Europie. Odnowiona wiara w krucjatę może jeszcze skłonić innych do przyłączenia się do naszej sprawy."
 roman_romania: "Rzymska Rumunia"
 desc_roman_romania: "Podbiliśmy dawne ziemie Cesarstwa Bizantyjskiego i przyjęliśmy dziedzictwo Rzymu."
 united_voivodes: "Zjednoczeni wojewodowie"
 desc_united_voivodes: "Wojewodowie rumuńscy zjednoczyli się pod władzą jednego księcia."
 bucharest_summer_capital: "Letnia stolica"
 desc_bucharest_summer_capital: "Bukareszt został ustanowiony naszą nową stolicą. Wraz z rozwojem infrastruktury pojawiają się nowe możliwości handlu i wymiany."
 rmn_consolidating_transylvania: "Konsolidacja Siedmiogrodu"
 desc_rmn_consolidating_transylvania: "Siedmiogród jest stopniowo, lecz nieustannie integrowany z naszym państwem."
 rmn_bulwark: "Przedmurze chrześcijaństwa"
 desc_rmn_bulwark: "Nasze wysiłki na rzecz ufortyfikowania ziem rumuńskich przyniosły efekty. Nasze państwo jest prawdziwym przedmurzem chrześcijaństwa."
 dregatori_modifier: "Dregatori"
 desc_dregatori_modifier: "Dziedziczną szlachtę zastąpili lojalni i kompetentni namiestnicy."
 restored_ruthenia: "Odnowienie Rusi"
 desc_restored_ruthenia: "Wyludnione, lecz żyzne ziemie nad Dnieprem wreszcie ponownie się zaludniają."
 pol_swedish_deluge: "Potop szwedzki"
 desc_pol_swedish_deluge: "Szwedzi zostali doszczętnie pokonani, ich stolica nosi nasze barwy, a ich rzekoma „kultura” została upokorzona na oczach całego świata."
 silk_road_controlled: "Bezpieczny Jedwabny Szlak"
 desc_silk_road_controlled: "Nasza kontrola nad centrum Jedwabnego Szlaku została ustanowiona. Kupcy mogą podróżować z Samarkandy do Tebriz bez obaw."
 fall_of_china: "Upadek Chin"
 desc_fall_of_china: "Pekin upadł! Całe Chiny stoją teraz przed nami otworem."
 integrating_the_steppe_peoples: "Integracja ludów stepu"
 desc_integrating_the_steppe_peoples: "Po stepach wędruje wiele plemion, z których każde ma własne obyczaje i tradycje. Musimy poznać ich zwyczaje, aby chętniej dostarczały żołnierzy naszej rosnącej ordzie."
 integrated_polish_nobility: "Integracja polskiej szlachty"
 desc_integrated_polish_nobility: "Integracja polskiej szlachty pozwala nam włączyć Polskę do naszego państwa bez większych trudności administracyjnych."
 sluck_sashes: "Słuckie pasy"
 desc_sluck_sashes: "Wspaniałe pasy z tkaniny stały się niezwykle popularne wśród szlachty Europy Wschodniej, a pasy produkowane w Słucku cieszą się szczególnie dużym popytem."
 lit_conferedation_on_religion: "Konfederacja religijna"
 desc_lit_conferedation_on_religion: "Zawarto i zatwierdzono przez państwo porozumienie gwarantujące ochronę oraz tolerancję religijnym dysydentom."
 lithuanian_counter_reformation: "Litewska kontrreformacja"
 desc_lithuanian_counter_reformation: "Państwo postanowiło nie tolerować religijnych dysydentów i skutecznie zaprowadziło jedność wyznaniową w całym kraju."
 restoration_of_kiev: "Odbudowa Kijowa"
 desc_restoration_of_kiev: "Kijów odzyskuje dawną świetność. Nasze inwestycje w miasto pozwalają jeszcze bardziej rozwinąć jego infrastrukturę."
 renovated_jag_uni: "Odnowienie Uniwersytetu Jagiellońskiego"
 desc_renovated_jag_uni: "Ponowne objęcie Uniwersytetu Jagiellońskiego patronatem przyciąga do naszego państwa wybitnych uczonych."
 crimean_trade: "Dominacja w handlu czarnomorskim"
 lit_lord_of_the_rus: "Władca Rusi"
 desc_lit_lord_of_the_rus: "Podporządkowaliśmy sobie najpotężniejszych spośród książąt ruskich, stając się niekwestionowanymi panami Rusi."
 lit_conquered_rus: "Podbój Rusi"
 desc_lit_conquered_rus: "Postanowiliśmy zgładzić książąt ruskich, zamiast uczynić ich naszymi poddanymi. Nasze państwo przystosowuje się teraz do sprawnej integracji rozległych ziem bez wywoływania międzynarodowych incydentów."
 MODIFIER_MONTHLY_SUPPORT_HEIR_GAIN: "Wzrost miesięcznego wsparcia dla następcy"
 pru_confederation_curtailed_modifier: "Ograniczenie wpływów Związku Pruskiego"
 desc_pru_confederation_curtailed_modifier: "Położyliśmy kres wpływom Związku Pruskiego, który zagrażał rozpadowi naszego państwa."
 MODIFIER_POWER_PROJECTION_FROM_INSULTS: "Prognozowana potęga od zniewag "
 MODIFIER_LOCAL_RELIGIOUS_UNITY_CONTRIBUTION: "Lokalny wkład w jedność religijną"
 MODIFIER_MAY_CONVERT_TERRITORIES: "Możliwość zmiany religii na terytoriach."
 territory_core: "Terytorium narodowe"
 territory_non_core: "Terytorium"
 territory: "Terytorium"
 mor_saharan_trade: "Handel transsaharyjski"
 desc_mor_saharan_trade: "Ustanowiliśmy stały szlak handlowy przez Saharę."
 conquest_of_benin_mor: "Podbój Beninu"
 desc_conquest_of_benin_mor: "Kontrola nad miastami handlu niewolnikami w Beninie umocniła nasze rządy i nauczyła nas, jak ważna jest stanowcza władza."
 mor_privateering: "Marokańscy korsarze"
 desc_mor_privateering: "Nasi korsarze nabrali wprawy w zdobywaniu nieprzyjacielskich okrętów podczas bitew morskich."
 mor_el_badi_palace: "Pałac El Badi"
 desc_mor_el_badi_palace: "Zbudowaliśmy wspaniały pałac, opłacony portugalskimi monetami zdobytymi podczas łupieżczych wypraw."
 mor_black_guard: "Czarna Gwardia"
 desc_mor_black_guard: "Utworzyliśmy armię afrykańskich niewolników-żołnierzy, całkowicie lojalnych wobec państwa."
 mor_conquest_of_kanem: "Podbój Kanem"
 desc_mor_conquest_of_kanem: "Imperium Kanem znalazło się pod naszym panowaniem. Poznajemy jego długą historię wojen i wykorzystujemy płynące z niej nauki w naszej taktyce wojskowej."
 mor_barbary_pirate_coast: "Wybrzeże Berberyjskie"
 desc_mor_barbary_pirate_coast: "Nasza kontrola nad Wybrzeżem Berberyjskim przyciąga setki piratów gotowych służyć naszej sprawie."
 mor_north_sea_corsairs: "Korsarze z Morza Północnego"
 desc_mor_north_sea_corsairs: "Aby bezpiecznie łupić statki na Morzu Północnym, musimy używać znacznie większych okrętów, zdolnych stawić czoła potężnym galeonom pływającym po wodach brytyjskich."
 mor_andalucia: "Re-rekonkwista"
 desc_mor_andalucia: "Odzyskaliśmy Al-Andalus z rąk chrześcijan, przywracając panowanie muzułmanów na Półwyspie Iberyjskim."
 mor_tunis_conquest: "Podbój Tunisu"
 desc_mor_tunis_conquest: "Po zakończeniu podboju Tunisu włączyliśmy ich statki i kapitanów do naszej służby."
 mor_beyond_the_canaries: "Za Wyspami Kanaryjskimi"
 desc_mor_beyond_the_canaries: "Rozległy ocean za zachodnimi wyspami kryje wielkie niebezpieczeństwa, ale i ogromne możliwości dla tych, którzy odważą się przemierzyć jego bezkres."
 mor_colonized_brazil: "Zachodnia kolonia"
 desc_mor_colonized_brazil: "Maroko założyło kolonię w południowej części Nowego Świata. Jej bogactwa zachęcają wielu poszukiwaczy fortuny z naszej ojczyzny do wyprawy na zachód."
 mor_new_world_power: "Nowa światowa potęga"
 desc_mor_new_world_power: "Staliśmy się dominującą potęgą w Nowym Świecie, zaludniając jego ziemie naszymi poddanymi i szerząc wiarę wśród tamtejszych pogan."
 spa_plus_ultra: "Plus Ultra"
 desc_spa_plus_ultra: "Co kryje się za Słupami Heraklesa? Nasi dzielni odkrywcy wkrótce się dowiedzą..."
 cuba_plantations: "Kubańskie plantacje"
 desc_cuba_plantations: "Plantacje na Kubie, uprawiane głównie przez niewolników pochodzących z miejscowej ludności, przeżywają rozkwit produkcji dzięki naszym intensywnym wysiłkom na rzecz eksploatacji zasobów wyspy."
 fortified_navarra: "Ufortyfikowana Nawarra"
 desc_fortified_navarra: "Ufortyfikowaliśmy zamki Nawarry, przygotowując je do obrony przed naszymi wrogami."
 viceroyalty_of_new_spain: "Nowa Hiszpania"
 desc_viceroyalty_of_new_spain: "Czyż niebo, litując się nad biednymi,\\n\\nNie zostawiło pustkowi nieprzebytych,\\n\\nNieodkrytych brzegów, wysp na bezkresnym morzu,\\n\\nNi spokojnej pustyni, której Hiszpania jeszcze nie zagarnęła?"
 spa_native_reductions: "Ograniczenie tubylców"
 desc_spa_native_reductions: "Zamiast mordować lub zniewalać rdzenną ludność Ameryk, powinniśmy zapewnić jej opiekę. A przy okazji pozbawić ją ostatnich śladów własnej kultury."
 spa_prepared_armada: "Przygotowana Armada"
 desc_spa_prepared_armada: "Przygotowaliśmy potężną flotę wojenną do naszej inwazji na Anglię."
 spa_milan: "Podbój Mediolanu"
 desc_spa_milan: "Odzyskaliśmy Żelazną Koronę Longobardów i dodaliśmy ją do listy naszych tytułów."
 spa_new_granada: "Nowe Królestwo Grenady"
 desc_spa_new_granada: "Nowe Królestwo Grenady umacnia nasze rządy na hiszpańskim wybrzeżu Morza Karaibskiego, zapewniając nam zarówno władzę ustawodawczą, jak i wykonawczą."
 fortified_florida_modifier: "Ufortyfikowana Floryda"
 desc_fortified_florida_modifier: "Wzniesione przez nas fortyfikacje w strategicznym regionie Florydy będą bastionem przeciw każdej potędze próbującej najechać Nową Hiszpanię od północy."
 spanish_imperial_ambition: "Cesarska ambicja"
 desc_spanish_imperial_ambition: "Hiszpania będzie cesarzem!"
 tun_restoration_of_alexandra: "Odbudowa Aleksandrii"
 desc_tun_restoration_of_alexandra: "Miasto Aleksandria odzyskało dawną świetność jako ważny ośrodek handlowy."
 tun_berbers_pacified: "Pacyfikacja Berberów"
 desc_tun_berbers_pacified: "Spacyfikowaliśmy Berberów Maghrebu, łagodząc napięcia w całym naszym państwie."
 conquest_of_air: "Podbój Airu"
 desc_conquest_of_air: "Nasi żołnierze są pełni zapału po podboju królestwa Air. Ich wysokie morale pozwala im maszerować w rekordowym tempie."
 tun_conquest_of_kanem: "Podbój Kanem Bornu"
 desc_tun_conquest_of_kanem: "Podbój Kanem podniósł morale naszych armii, a długa historia wojskowa tego państwa zaczęła kształtować naszą taktykę."
 tun_med_conquest: "Podbój Morza Śródziemnego"
 desc_tun_med_conquest: "Podbój wysp Morza Śródziemnego prawdopodobnie rozgniewał wiele wielkich mocarstw. Podejmujemy działania na rzecz ulepszenia naszych galer wojennych, aby przygotować się na kontratak."
 tun_med_conquest_east: "Dominacja na Morzu Śródziemnym"
 desc_tun_med_conquest_east: "Nasze nowe bazy morskie na wschodnich wyspach doskonale nadają się na bazy pirackie."
 tun_barbary_pirates: "Berberyjscy Korsarze"
 desc_tun_barbary_pirates: "Teraz, gdy zebraliśmy pod naszym sztandarem setki nowych piratów, nasze wysiłki korsarskie zostały znacznie wzmocnione."
 tun_morocco: "Podbój Maroka"
 desc_tun_morocco: "Podbiliśmy Maroko, musimy więc przygotować się do obrony przed Hiszpanią."
 llotja_de_la_seda: "Llotja de la Seda"
 desc_llotja_de_la_seda: "Giełda Jedwabiu jest jednym z nielicznych miejsc w Europie, gdzie można kupować i sprzedawać duże ilości jedwabiu."
 industria_sedera: "Industria Sedera"
 desc_industria_sedera: "Nasza gospodarka przemysłowa rozkwita dzięki inwestycjom w produkcję."
 ara_golden_age: "Złoty wiek"
 desc_ara_golden_age: "Nasze państwo przeżywa złoty wiek."
 barcelona_guilds: "Guilds of Barcelona"
 desc_barcelona_guilds: "Zdobyliśmy lojalność gildii kupieckich Barcelony."
 taula_de_canvi: "Taula de Canvi"
 desc_taula_de_canvi: "Bankierzy gromadzą się przy Stole Wymiany, gdzie zawierane są umowy i zmieniają właścicieli pieniądze."
 ara_toulon_dockyard: "Stocznia w Tulon"
 desc_ara_toulon_dockyard: "Założyliśmy w Tulonie wielką stocznię."
 refoming_barbary_pirates: "Reforma piratów berberyjskich"
 desc_refoming_barbary_pirates: "Wielu pojmanych piratów berberyjskich wstąpiło do naszej służby, powiększając grono doświadczonych marynarzy."
 ara_ship_trade_modifier: "Bezpieczne konwoje handlowe"
 desc_ara_ship_trade_modifier: "Nasza dominacja morska zapewnia bezpieczeństwo wodom, po których pływają nasze statki handlowe."
 ara_envoy_to_ethiopia: "Poselstwo do Abisynii"
 desc_ara_envoy_to_ethiopia: "Staliśmy się obrońcami wiary chrześcijańskiej w Etiopii."
 por_padroado: "Padroado"
 desc_por_padroado: "Zawarto porozumienie z papieżem, na mocy którego korona Portugalii sprawuje jurysdykcję nad majątkiem i działalnością Kościoła w Nowym Świecie oraz w Indiach."
 por_minas_gerais: "Minas Gerais"
 desc_por_minas_gerais: "Kopalnie złota w Minas Gerais wydają się niewyczerpane."
 por_wine_monopolies: "Monopol na wino"
 desc_por_wine_monopolies: "Zapewniliśmy sobie monopole na handel winem w wielu zagranicznych portach."
 por_houses_of_trade: "Domy handlowe"
 desc_por_houses_of_trade: "Domy Handlowe koordynują nasze globalne przedsięwzięcia handlowe."
 por_arts_and_letters: "Literatura i sztuka"
 desc_por_arts_and_letters: "Nasze uniwersytety goszczą wielu uczonych, którzy z zapałem kształcą kolejne pokolenie akademików."
 por_triangle_trade_modifier: "Handel trójkątny"
 desc_por_triangle_trade_modifier: "Nasza dominacja nad handlem trójkątnym sprawia, że afrykańscy handlarze niewolnikami mają niewielki wybór i sprzedają ludzi nam, a nie naszym pokonanym konkurentom."
 por_african_gold_modifier: "Afrykańska gorączka złota"
 desc_por_african_gold_modifier: "Portugalscy awanturnicy tłumnie przybywają do Afryki Wschodniej, by eksploatować tamtejsze kopalnie złota."
 portuguese_carib_modifier: "Rozkwitająca kolonia karaibska"
 desc_portuguese_carib_modifier: "Nasze kolonie na Karaibach rozwijają się pomyślnie pod czujnym okiem naszych władz."
 persian_gulf_trade_por: "Handel w Zatoce Perskiej"
 desc_persian_gulf_trade_por: "Zdominowaliśmy handel w Zatoce Perskiej."
 portuguese_malacca: "Portugalska Malakka"
 desc_portuguese_malacca: "Zdobyliśmy miasto Malakka. Jego położenie jest jednak niepewne, dlatego rozpoczęliśmy budowę umocnień, które ochronią je przed atakami i buntami."
 displaced_moriscos: "Wysiedlenie morysków"
 desc_displaced_moriscos: "Wypędzenie morysków uwolniło znaczne obszary ziemi, które mogą zostać zasiedlone przez bardziej godnych zaufania poddanych."
 berber_fleet: "Flota berberyjska"
 desc_berber_fleet: "Zbudowaliśmy flotę, która będzie postrachem Morza Śródziemnego."
 berber_piracy: "Piractwo berberyjskie"
 desc_berber_piracy: "Nasi piraci berberyjscy ciężko pracują, siejąc postrach na morzach. Oczywiście nie wszystkie statki poddają się bez walki, a te starcia zahartowały naszych korsarzy."
 berber_turkish_diplomacy: "Turecka dyplomacja"
 desc_berber_turkish_diplomacy: "Nasza stanowczość w stosunkach dyplomatycznych z sułtanem osmańskim dowiodła światu, że nasze państwo nadal ma znaczenie."
 berber_new_world_pirates: "Najeźdźcy Nowego Świata"
 desc_berber_new_world_pirates: "Nasi wrogowie nie zdołają przed nami uciec, nawet jeśli przepłyną ocean!"
 portuguese_surat_modifier: "Boom inwestycyjny w Indiach"
 desc_portuguese_surat_modifier: "Zamożni kupcy chętnie inwestują w rozwijające się faktorie handlowe w Indiach."
 thorough_careening: "Staranna konserwacja kadłubów"
 desc_thorough_careening: "Nasi kapitanowie dbają o to, by czyszczenie i konserwacja kadłubów przebiegały dokładnie i starannie."
 relaxed_careening: "Niespieszna konserwacja kadłubów"
 desc_relaxed_careening: "Nasze załogi nie spieszą się z czyszczeniem kadłubów i nie przemęczają się podczas wykonywania niezbędnych prac konserwacyjnych."
 blacklisted_crew: "Załoga na czarnej liście"
 desc_blacklisted_crew: "Popularna, lecz sprawiająca kłopoty załoga została umieszczona na czarnej liście syndykatu przemytniczego."
 basque_fisheries_modifier: "Basque Fisheries"
 desc_basque_fisheries_modifier: "Nasze inwestycje w rybołówstwo przyniosły oczekiwane rezultaty i teraz czerpiemy z nich korzyści finansowe."
 basque_exploration: "Baskijscy odkrywcy"
 desc_basque_exploration: "Nasi odważni żeglarze zapuszczają się coraz dalej przez ocean w poszukiwaniu bogatszych łowisk wielorybów."
 nav_newfoundland: "Handel Granbaia"
 desc_nav_newfoundland: "Zdominowaliśmy handel w Granbaii, ustanawiając monopol na zasoby tego regionu."
 nav_reclaimed_coast: "Odzyskano wybrzeże"
 desc_nav_reclaimed_coast: "Wreszcie odzyskaliśmy utracone wybrzeże!"
 conquest_of_espainiako: "Podbój Espainii"
 desc_conquest_of_espainiako: "Cała Iberia należy do nas! Nasza potęga militarna nie zna granic."
 renovated_palace_of_alhambra: "Lśniący klejnot Zachodu"
 desc_renovated_palace_of_alhambra: "Wspaniały pałac Alhambra ponownie budzi podziw wszystkich, którzy go oglądają. Uczeni i budowniczowie z odległych krajów przybywają z daleka, by podziwiać naszą chwałę!"
 gra_bolstered_morale: "Zwycięstwo jest pewne"
 desc_gra_bolstered_morale: "Nasze niedawne działania dyplomatyczne przekonały wszystkich walczących w naszym imieniu, że rzeczywiście cieszymy się boską przychylnością."
 gra_rebuilding_mosques: "Odbudowa meczetów"
 desc_gra_rebuilding_mosques: "W tej prowincji trwa szeroko zakrojony program rozwoju infrastruktury, w którym szczególny nacisk położono na architekturę islamską."
 gra_seperation_of_power: "Podział władzy"
 desc_gra_seperation_of_power: "Dawne kalifaty dzieliły niegdyś między siebie ziemie w sposób odpowiedzialny i przyjazny. Dążąc do podobnego porozumienia z naszymi przyjaciółmi w Maroku, pokazujemy światu, że nie jesteśmy państwem owładniętym wyłącznie żądzą podbojów."
 gra_mouth_of_mediterranean: "Port strategiczny"
 desc_gra_mouth_of_mediterranean: "Port w Ceucie jest idealnie położony, by kontrolować ruch statków wpływających na Morze Śródziemne i je opuszczających. Dlatego zainwestowaliśmy znaczne środki w modernizację jego możliwości i potencjału obronnego."
 gra_reconvert_giralda: "Wielki Meczet w Isbilii"
 desc_gra_reconvert_giralda: "Mimo trzęsień ziemi, wojen i zniszczeń Wielki Meczet w Isbilii nadal stoi. Chrześcijańscy zdobywcy przekształcili niegdyś budowlę w katedrę, lecz teraz, gdy ponownie bezpiecznie znajduje się w naszych rękach, przywróciliśmy jej pierwotną funkcję."
 gra_merchants_inspired: "Spokój kupców"
 desc_gra_merchants_inspired: "Niebezpieczne wody wokół Zatoki Almeríjskiej często powstrzymywały naszych kupców przed podejmowaniem handlu morskiego. Nasza liczna stała flota zaczyna jednak rozwiewać ich obawy."
 gra_eagerness_to_serve: "Sytuacja ustabilizowana"
 desc_gra_eagerness_to_serve: "Krwawa wojna domowa dobiegła końca, a nasi obywatele mogą znów żyć spokojnie, wiedząc, że linia sukcesji została jasno określona. Znacząco zwiększyło to ich gotowość do powrotu do codziennych zajęć."
 adu_new_world_discoveries: "Nowy Świat?"
 desc_adu_new_world_discoveries: "Portugalczycy dokonali, jak się zdaje, zdumiewających odkryć. Za morskimi mgłami istnieją całe kontynenty! Ta wieść rozpala w naszych obywatelach ducha przygody."
 adu_trade_hub: "Port o strategicznym znaczeniu"
 desc_adu_trade_hub: "To port położony w idealnym miejscu, by przejmować cenne dochody od naszych mniej ustępliwych sąsiadów."
 adu_native_concord: "Porozumienie z ludnością rdzenną"
 desc_adu_native_concord: "Przemoc, jakiej dopuszczali się pierwsi portugalscy i kastylijscy odkrywcy przybywający do Nowego Świata, nie uszła uwadze jego rdzennych mieszkańców. Dostrzegliśmy w tym szansę na przyjęcie innego podejścia — takiego, które pozwoli nam wspólnie prosperować, zamiast podsycać wojny i niezgodę."
 sicily_in_safe_hands: "Inwestycje administracyjne"
 desc_sicily_in_safe_hands: "Sycylia przynosi nam większe korzyści, gdy znajduje się pod bezpośrednią kontrolą. Dzięki temu możemy przeznaczyć więcej zasobów na zapewnienie wyspie dobrobytu."
 adu_popular_appeal: "Napływ wiernych"
 desc_adu_popular_appeal: "Nasze niedawne przyjęcie ich wiary skłoniło wiele prześladowanych mniejszości do szukania schronienia w naszych granicach. Okażmy im należny szacunek."
 adu_conservative_backlash: "Poparcie konserwatystów"
 desc_adu_conservative_backlash: "Nasi poddani doceniają wysiłki, by stać po ich stronie, mimo fali ponownego odkrywania dawnych idei, która przetacza się przez nasze państwo."
 adu_righteous_conquest: "Miecz Islamu"
 desc_adu_righteous_conquest: "Wbrew wszelkim przeciwnościom poszliśmy śladami naszych przodków. Spójrzmy teraz ku horyzontowi i pokażmy ciemiężycielom, że ich dni są policzone."
 adu_white_phoenix: "Powstanie Białego Feniksa"
 desc_adu_white_phoenix: "Wreszcie przewyższyliśmy osiągnięcia naszych przodków. Wieki upadku odeszły w zapomnienie, a nasze państwo dumnie rozciąga się u podnóża Pirenejów. Pozostał nam jednak jeszcze ostatni krok."
 adu_summer_capital: "Wielki meczet w Damaszku"
 desc_adu_summer_capital: "Ten architektoniczny cud przetrwał niemal tysiąc lat wojen. Przez stulecia był rozbudowywany i uważamy, że naszym obowiązkiem jest zachować go, utrzymywać i kontynuować to wielkie dzieło."
 adu_tolerance_heretics_mod: "Szahada, salah, zakat"
 desc_adu_tolerance_heretics_mod: "Posiadanie Świętego Miasta wymaga pewnej tolerancji wobec wiernych, niezależnie od ich osobistych przekonań. Spoczywa na nas wielka odpowiedzialność za opiekę nad Mekką, dlatego musimy z równą troską traktować naszych bliźnich."
 adu_greater_than_alexander: "Administracja imperialna "
 desc_adu_greater_than_alexander: "Odzyskaliśmy znaczną część tego, co niegdyś utraciliśmy, lecz wciąż wiele pozostaje do odzyskania. Umajjadzi ustanowili system zróżnicowanych gubernatorstw, by zarządzać rozległymi obszarami imperium. Powinniśmy uczynić podobnie."
 adu_trade_company_founded: "Polityka inwestycji morskich"
 desc_adu_trade_company_founded: "Aby chronić rozwijające się szlaki żeglugowe, musimy poświęcić szczególną uwagę naszej flocie."
 smugglers_struggling: "Problemy przemytników"
 desc_smugglers_struggling: "Nasi przemytnicy mają trudności ze sprzedażą swoich towarów na legalnych rynkach."
 pirate_trade_practices: "Udany piracki „handel”"
 pirate_trade_ports: "Piracki monopol"
 pirate_trade_in_gold: "Pirackie złoto"
 pirate_triangle_trade: "„Wyzwoleni” niewolnicy"
 pirate_a_pirate_fleet: "Wilki morskie"
 pirate_a_scourge_on_the_seven_seas: "Inspirujący kapitan"
 pirate_the_pirate_code: "Kodeks piratów"
 pirate_diplomacy: "Reputacja"
 pirate_the_pirate_threat: "Brak królów"
 pirate_a_second_madagascar: "Piracki port"
 pirate_all_of_the_gold: "Złoto musi płynąć"
 pirate_hoard: "Kolejny złoty skarb"
 pirate_federation: "Wzajemna wymiana"
 pirate_a_famous_pirate: "Potężny pirat (™)"
 desc_pirate_trade_practices: "Niektórzy zwą to piractwem, my nazywamy to zarobkiem."
 desc_pirate_trade_ports: "Strach utrzyma miejscowych kupców w ryzach."
 desc_pirate_trade_in_gold: "Złoto ułatwia prowadzenie interesów, ale większości piratów nie można powierzyć takiego bogactwa."
 desc_pirate_triangle_trade: "Życie jednych piratów jest bardziej wolne niż innych."
 desc_pirate_a_pirate_fleet: "Nasze okręty może nie są największe ani najlepiej wyposażone, ale mają najlepsze nazwy."
 desc_pirate_a_scourge_on_the_seven_seas: "O kapitanie, mój kapitanie!"
 desc_pirate_the_pirate_code: "Piraci nie są zgodni co do dokładnej liczby artykułów Kodeksu Piratów, ale pamiętają te najważniejsze."
 desc_pirate_diplomacy: "Niektórzy uważają nas za wyzwolicieli, lecz większość ma odmienne zdanie."
 desc_pirate_the_pirate_threat: "Nic tak nie jednoczy piratów jak potężny wróg zagrażający ich wolności."
 desc_pirate_a_second_madagascar: "Bezpieczna przystań dla wszystkich wolnych mężczyzn i kobiet. Radzę jednak nie zakładać czerwonego płaszcza."
 desc_pirate_all_of_the_gold: "Złoto to życie, złoto to życie!"
 desc_pirate_hoard: "Co masz na myśli, mówiąc, że to nie taki rodzaj skarbu?"
 desc_pirate_federation: "Nie nazwałbym tego swobodną wymianą poglądów, ale przynajmniej każdy może poruszać się, dokąd zechce."
 desc_pirate_a_famous_pirate: "Awanturnik. Łotr. Wędrowiec. Ktoś, kto potrafi wstrzymać oddech na dziesięć minut."
 sublimis_deus: "Sublimis Deus"
 desc_sublimis_deus: "Papież ogłosił, że katoliccy władcy nie powinni zezwalać na zniewalanie rdzennych mieszkańców."
 sublimis_deus_not_enforced: "Potajemne zniewalanie"
 desc_sublimis_deus_not_enforced: "Choć papież ogłosił, że zniewalanie rdzennych ludów jest grzechem, to czego nie wie, nie może mu zaszkodzić."
 merino_wool: "Wełna Merino"
 desc_merino_wool: "Beeee!"
 mesta_privileged_revoked: "Odebranie przywilejów Mesty"
 desc_mesta_privileged_revoked: "Przywileje Mesty w tej prowincji zostały odebrane, otwierając drogę do nowych przedsięwzięć rozwojowych."
 mor_looks_outward: "Maroko zwraca się ku światu"
 desc_mor_looks_outward: "Maroko nie chce izolować się w Fezie i od teraz dąży do integracji narodu."
 mor_looks_inward: "Izolacja w Fezie"
 desc_mor_looks_inward: "Dwór marokański postanowił skupić się niemal wyłącznie na sprawach stolicy."
 oe_jesuit_unrest: "Niepokoje wśród jezuitów"
 desc_oe_jesuit_unrest: "Jezuici w tym regionie są niezadowoleni z ingerencji naszego rządu w spór teologiczny."
