 conquerors_presence: "Obecność zdobywcy"
 desc_conquerors_presence: "Nasz władca wyrobił sobie nawyk odwiedzania od czasu do czasu naszych obozów wojskowych, zaszczepiając wielką odwagę w sercach naszych żołnierzy."
 the_beating_of_the_drums: "Bicie bębnów"
 desc_the_beating_of_the_drums: "Nasz władca jest inspirującym zdobywcą i napisano wiele pieśni marszowych na jego cześć."
 trade_company_factory: "Faktoria kompani handlowej"
 desc_trade_company_factory: "Europejskiej kompanii handlowej przyznano rozległe prawa do organizowania obecności w tej prowincji. "
 pushing_back_the_tatars: "Odepchnięcie Tatarów"
 desc_pushing_back_the_tatars: "Nieustannie atakując i niszcząc przygraniczne siedziby tatarskich najeźdźców, zachęcamy naszych rosyjskich poddanych do ponownego osiedlania się na stepach."
 conquest_of_siberia: "Podbój Syberii"
 desc_conquest_of_siberia: "Wykorzystując naszą potęgę militarną do zabezpieczenia naszych osad na Syberii, udało nam się zachęcić naszych poddanych do osadnictwa w tym regionie."
 blissful_ignorance: "Błoga ignorancja"
 desc_blissful_ignorance: "Zniechęcając do poszukiwań intelektualnych, spowolniliśmy rozprzestrzenianie się nowych idei w naszym społeczeństwie."
 power_to_advisors: "Uprawniona rada"
 desc_power_to_advisors: "Utalentowani mężczyźni i kobiety, którymi nasi władcy lubią się otaczać, otrzymali w tym trudnym czasie szersze uprawnienia do sprawowania rządów. W przeciwieństwie do szlachty czy elit prowincjonalnych doradcy ci są lojalni wyłącznie wobec państwa. Dzięki temu administracja działa bez zakłóceń, co robi wrażenie na niektórych naszych sąsiadach."
 bra_new_chancellery: "Nowa kancelaria"
 desc_bra_new_chancellery: "Aby skuteczniej umocnić naszą władzę, utworzyliśmy nową kancelarię. Zaczęliśmy zastępować urzędników związanych z duchowieństwem świeckimi oficjałami lojalnymi wobec korony."
 pru_berlin_renovations: "Renowacja Berlina"
 desc_pru_berlin_renovations: "Armia architektów i budowniczych zaczęła przekształcać Berlin i Cölln ze skromnej niemieckiej stolicy w wielkie miasto świata. Budujemy pałace, fortyfikacje, drogi, ogrody i kościoły, a także wycinamy lasy i osuszamy liczne bagna, które utrudniają urbanizację w tej prowincji."
 pru_unification_of_berlin: "Zjednoczenie Berlina"
 desc_pru_unification_of_berlin: "Dzięki szeroko zakrojonym staraniom, by stworzyć warunki do rozwoju wielkiego miasta wokół naszej królewskiej stolicy, udało nam się połączyć dawne miasta Berlin i Cölln oraz przygotować teren pod dalszy rozwój. Przebudowa sprawiła również, że niegdyś skromne miasto stało się imponującą, barokową stolicą naszej dynastii."
 bra_dispositio_achillea: "Dispositio Achillea"
 desc_bra_dispositio_achillea: "Aby uchronić Brandenburgię przed podziałem, młodsi synowie naszej dynastii nigdy nie będą dziedziczyć części brandenburskich ziem. Całość majątku przypadnie najstarszemu synowi."
 pru_unified_legal_system: "Zunifikowany system prawny"
 desc_pru_unified_legal_system: "Dołożyliśmy wszelkich starań, by ujednolicić wewnętrzny system prawny, wykorzeniając nadużycia i nieprawidłowości oraz profesjonalizując wymiar sprawiedliwości."
 redmans_burden: "Oświecenie"
 desc_redmans_burden: "Miejscowa ludność pozna cuda cywilizacji."
 pru_sanssouci_palace: "Sanssouci"
 desc_pru_sanssouci_palace: "Znajduje się tu wspaniały pałac ogrodowy Sanssouci, będący symbolem europejskiego oświecenia."
 bra_nobles_unhappy: "Niezadowolenie Junkierów"
 desc_bra_nobles_unhappy: "Postanowiliśmy rozszerzyć władzę centralną kosztem szlachty ziemiańskiej. Nie spotkało się to z jej zadowoleniem."
 bra_burghers_unhappy: "Podeptane prawa mieszczan"
 desc_bra_burghers_unhappy: "Postanowiliśmy rozszerzyć władzę centralną kosztem mieszczaństwa i oprzeć się zamiast tego na poparciu junkrów. Mieszczanie nie są z tego zadowoleni."
 brandenburg_recess: "Ostatnie zgromadzenie"
 desc_brandenburg_recess: "Uzyskaliśmy prawo do samodzielnego zarządzania finansami, całkowicie wyłączając stany ziemskie z tego procesu. Choć zachowały one pewne przywileje pozwalające im unikać opodatkowania, możemy dzięki temu znacznie rozbudować naszą armię."
 pru_building_sanssouci: "Budowa Sanssouci"
 desc_pru_building_sanssouci: "Najlepsi architekci królestwa pracują obecnie nad ukończeniem pałacu Sanssouci, starając się jak najwierniej zrealizować precyzyjną wizję naszego władcy."
 bra_crushing_the_robber_barons: "Rycerze rozbójnicy zmiażdżeni"
 desc_bra_crushing_the_robber_barons: "Stanowczo daliśmy do zrozumienia wszystkim rodom parającym się rozbojem, że nie będziemy tolerować takiej przestępczej działalności. Każdy rozbójnik feudalny zostanie stracony."
 bra_robber_baron_resurgence: "Odrodzenie się rycerzy rozbójników"
 desc_bra_robber_baron_resurgence: "W obawie przed rozgniewaniem szlachty nie zdecydowaliśmy się na zdecydowane działania przeciwko odradzającym się rozbójnikom feudalnym na naszych ziemiach. W rezultacie handel podupada, a bezprawie staje się coraz poważniejszym problemem w całym królestwie."
 bra_kreditwerk: "Kreditwerk"
 desc_bra_kreditwerk: "Rozszerzyliśmy przywileje i uprawnienia zarządzanej przez stany instytucji Kreditwerk, jednej z najważniejszych instytucji finansowych naszego państwa."
 accepted_culture_demoted: "Ostatnio zdegradowana kultura"
 MODIFIER_LOCAL_CORE_CREATION: "Lokalny koszt unarodowienia"
 bergen_riots: "Utrata wpływów w Bergen"
 nor_hollendertiden: "Hollendertiden"
 desc_nor_hollendertiden: "Holenderscy kupcy dominują w naszej gospodarce, przez co nasz kraj coraz bardziej koncentruje się na potędze morskiej."
 nor_prospecting_the_skands: "Skandynawscy poszukiwacze "
 desc_nor_prospecting_the_skands: "Opłacamy grupę górników i poszukiwaczy, aby przeszukali każdy zakątek w poszukiwaniu metali, które pozwolą nam rozwinąć rodzimy przemysł zbrojeniowy."
 nor_kongsberg_mine: "Kopalnia srebra Kongsberg"
 desc_nor_kongsberg_mine: "Kongsberg, niegdyś niewielka osada górnicza, wyrósł na prawdziwą kolonię niemieckojęzycznych górników i przedsiębiorców w Norwegii. Lokalne prawa przypominają te obowiązujące w niemieckich miastach górniczych Saksonii, a język niemiecki słychać tu zarówno podczas kazań, jak i w codziennych rozmowach.\\nMimo to mennica w Kongsbergu stanowi mile widziane i stałe źródło dochodów skarbu państwa."
 nor_rebuilding_oslo: "Przebudowa Oslo"
 desc_nor_rebuilding_oslo: "Wielki pożar Oslo doszczętnie zniszczył miasto, dlatego wznosimy nową stolicę po drugiej stronie zatoki, bliżej twierdzy Akershus. Nowe miasto ma być odporne zarówno na pożary, jak i obce najazdy, a zarazem odzwierciedlać wyszukany barokowy gust naszej elity rządzącej."
 nor_global_integration: "Holendersko-norweskie powiązania"
 desc_nor_global_integration: "Nasze silne więzi z morskimi miastami Niderlandów przyspieszają rozprzestrzenianie się idei, kontaktów i instytucji na naszych ziemiach."
 dan_crown_lands_recovered: "Odzyskana króleszczyzna"
 desc_dan_crown_lands_recovered: "Wdrożyliśmy politykę ograniczania oddawania w zastaw zamków koronnych szlachcie, odzyskując te, które już zastawiono. To uczyniło nas dość niepopularnymi wśród szlachty królestwa, ale dochody państwa wzrosły."
 dan_crown_lands_lost: "Utracona królewszczyzna"
 desc_dan_crown_lands_lost: "Nasi poprzednicy od dawna rozwiązywali przejściowe, choć poważne problemy finansowe, zastawiając ważne zamki królewskie u miejscowej szlachty. Znacznie ograniczyło to nasze dochody z jednych z najbogatszych części królestwa."
 dan_bavarian_holdings: "Bawarskie gospodarstwa"
 desc_dan_bavarian_holdings: "Oprócz korony Danii Krzysztof III, znany również jako Krzysztof Bawarski, odziedziczył po ojcu posiadłości w Górnym Palatynacie. W razie potrzeby mogą one zasilić dochody państwa."
 skanemarket: "Targ Skåne"
 desc_skanemarket: "Jeden z najważniejszych jarmarków handlowych nad Bałtykiem, Targ Skański, przyciąga kupców z całej Europy Zachodniej, którzy nabywają śledzie z obfitujących w nie wód cieśniny Sund oraz okolic Falsterbo i Skanör. Z czasem targ stał się również głównym punktem przeładunkowym dla zachodnioeuropejskich towarów przeznaczonych do wschodniej Skandynawii. Jest jednak powód do niepokoju: połowy śledzi zdają się z roku na rok maleć..."
 icelanding_fisher_sea: "Łowiska u wybrzeży Islandii"
 desc_icelanding_fisher_sea: "Wody u wybrzeży Islandii obfitują w dorsze, na które jest duży popyt w Anglii i Niemczech. Z tego powodu wyspa przyciąga wielu zagranicznych rybaków."
 dansborg_factory: "Faktoria Dansborg"
 desc_dansborg_factory: "Ta prowincja jest domem dla fabryki Dansborg, duńskiej kolonii handlowej."
 scutage_disable: "Podatek tarczowy wyłączony"
 developed_subject: "Rozwinięte prowincje"
 placated_ruler: "Udobruchany władca"
 placed_relative_on_throne: "Osadzony krewny na tronie"
 place_relative_on_throne_not_regency: "Osadzony krewny na tronie"
