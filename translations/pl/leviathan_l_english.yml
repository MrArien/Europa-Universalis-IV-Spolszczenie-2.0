l_english:
 nw_native_ideas: "Idee północnowschodnich tubylców"
 nw_native_ideas_start: "Północnowschodnia Ameryka"
 nw_native_ideas_bonus: "Ambicje północnowschodnich tubylców"
 raid_warfare_nw: "Sztuka napadania"
 raid_warfare_nw_desc: "Nasz lud jest w ciągłym stanie wojny albo przygotowuje się do niej. Często napadamy na naszych sąsiadów, zbierając jeńców do niewoli, choć zdarza się, że idziemy w górę lub w dół wybrzeża, dopóki nie dostaniemy tego, czego chcemy, nawet jeśli oznacza to wyprawę do odległych krain. Musimy być przygotowani w każdej chwili, więc jesteśmy przyzwyczajeni do zmieniających się sytuacji."
 brother_salmon: "Brat Łosoś"
 brother_salmon_desc: "Łososie są nie tylko obfitym źródłem pożywienia wokół nas, ale są również naszym duchowym symbolem. Nawet jeśli nie jedynym, to najbardziej kluczowym i najważniejszym. Łosoś nas karmi, łosoś nas prowadzi i łosoś nas chroni. Bez łososia nasi ludzie byliby zagubieni, ponieważ jest on naszym łącznikiem z innym światem."
 potlatch: "Potlacz"
 potlatch_desc: "Potlacz to najważniejsze wydarzenie w życiu społecznym naszych społeczności. Potlacz jest bardzo złożonym wydarzeniem, podczas którego upamiętnia się określone wydarzenie, gromadząc się razem; zazwyczaj wódz plemienia udowadnia swoje bogactwo, hojnie obdarowując odwiedzających go ludzi wyszukanymi i drogimi prezentami. Podczas tych ceremonii odbywają się wielkie uczty i popisy pokaźnej konsumpcji, a bycie zaproszonym na nie jest uważane za wysoki honor."
 mother_and_father: "Matka i ojciec"
 mother_and_father_desc: "Nawet jeśli nie wszystkie plemiona wywodzą swój rodowód od matki, jak np. Chinookowie, kobiety mają ogromne znaczenie w naszym życiu społecznym i biorą w nim udział tak samo jak każdy mężczyzna."
 totem_poles_nw: "Słupy totemowe"
 totem_poles_nw_desc: "Słupy totemowe to monumentalne rzeźby, które reprezentują symbole i postaci w naszej kulturze. Wyrzeźbione z dużych drzew, słupy te zazwyczaj symbolizują lub upamiętniają naszych przodków, wierzenia kulturowe, nasze linie rodowe lub znaczące wydarzenia; ale mogą być również używane do wyśmiewania lub zawstydzania ludzi lub plemion z haniebnych zachowań lub służyć jako naczynia pogrzebowe dla szczątków zmarłych przodków."
 canoe_people: "Ludzie kanu"
 canoe_people_desc: "Nasze plemiona żyją na wybrzeżach lub w pobliżu wielkich rzek. Nasza dieta w dużej mierze opiera się na łososiach, węgorzach, innych rybach, owocach morza, fokach, a nawet wielorybach. Woda służy nam za drogę, którą możemy najeżdżać wrogów lub odwiedzać przyjaciół... Z tych wszystkich powodów kanu jest ważną częścią naszej kultury, czymś znacznie więcej niż zwykłym narzędziem. Dzięki niemu poruszamy się równie swobodnie jak woda."
 division_as_a_strength_nw: "Jedność w różnorodności"
 division_as_a_strength_nw_desc: "Na tych ziemiach żyje wiele plemion i nie wszystkie posługują się tym samym językiem. Łączy nas jednak tak wiele cech, że zrodziło się między nami poczucie braterstwa. Współistniejemy, choć nasz sposób życia w dużej mierze opiera się na nieustannych najazdach na wrogów, podczas których pojmujemy niewolników do naszej służby."
 plains_native_ideas: "Idee plemienne Wielkich Równin"
 plains_native_ideas_start: "Wielkie Równiny"
 plains_native_ideas_bonus: "Ambicja plemienna Wielkich Równin"
 bison_hunters: "Łowcy bizonów"
 bison_hunters_desc: "Bizony są dla naszego ludu źródłem życia. Wykorzystujemy każdą część zwierzęcia, oddając hołd jego ofierze. Żywimy się jego mięsem, z kości wytwarzamy narzędzia, futro chroni nas przed mrozem podczas długich zim, a ze skór szyjemy odzienie i pokrywamy nasze tipi. Jego dusza jest naszym zwierzęcym symbolem. Bizony są tak ważne dla naszej kultury, że bez nich czulibyśmy się zagubieni."
 bow_archery: "Łucznictwo"
 bow_archery_desc: "Spośród licznych narzędzi, którymi się posługujemy, łuk jest jednym z najważniejszych. Potrzebujemy go do polowań, by zdobywać pożywienie, a gdy nadejdzie odpowiednia chwila, także do walki z wrogami. Nasze łuki są solidne, mocne, a zarazem elastyczne niczym nasz lud. Kiedy pojawili się Bladzi Ludzie, przystosowaliśmy je do strzelania z konia, ale to już inna historia..."
 dwellers_of_tipis: "Mieszkańcy tipi"
 dwellers_of_tipis_desc: "Tipi to nasze tradycyjne namioty, zwykle wykonywane ze skór bizonów i podtrzymywane przez solidne drewniane żerdzie. Służą nam za domy. U szczytu mają otwór dymny, dzięki któremu możemy rozpalać wewnątrz ogień i chronić się przed zimowym chłodem. Namioty te są wytrzymałe, zimą zapewniają ciepło i wygodę, latem zaś przyjemny chłód, a podczas ulewnych deszczów pozostają suche. Co najważniejsze, można je szybko rozebrać i spakować, dlatego doskonale nadają się do częstych przeprowadzek."
 peaceful_people: "Lud pokojowy"
 peaceful_people_desc: "Równiny są na tyle rozległe i bogate, że poszczególne plemiona nie muszą rywalizować o zasoby. Dzięki temu między naszymi społecznościami panuje pokój. Mimo różnic i nielicznych wojen wszyscy wiedzą, że dotrzymujemy słowa. Tylko zagrożenie z zewnątrz może zakłócić tę równowagę."
 sun_dance: "Taniec Słońca"
 sun_dance_desc: "Taniec Słońca jest jednym z najważniejszych obrzędów naszego ludu. Zwykle uczestniczy w nim cała społeczność, wspólnie modląc się o uzdrowienie, a niektórzy członkowie składają osobiste ofiary w imieniu grupy. Obejmują one przekłuwanie skóry lub próby wytrzymałości fizycznej, zazwyczaj wielodniowy post pod gołym niebem, niezależnie od pogody."
 plains_sign_language: "Język migowy Równin"
 plains_sign_language_desc: "Język migowy Równin, stworzony przez ludy zamieszkujące te tereny, rozprzestrzenił się po całym kontynencie i stał się wspólnym językiem handlu między plemionami, od jednego wybrzeża do drugiego. Jako jego twórcy zyskaliśmy pewien prestiż wśród innych społeczności. Nie zależy nam na sławie, lecz jesteśmy dumni z pomysłowości naszego ludu."
 horse_riders: "Jeźdźcy"
 horse_riders_desc: "Nasz lud tradycyjnie przemierzał równiny pieszo, a do przenoszenia dobytku wykorzystywał silne ramiona lub włóki ciągnięte przez psy. Gdy na naszych ziemiach pojawili się pierwsi Bladzi Ludzie, przywieźli ze sobą konie. Te piękne zwierzęta były darem naszych przodków i zdobyliśmy je wszelkimi sposobami. Wśród plemion przybywa klaczy i ogierów, które stały się częścią nas samych. Na zawsze częścią naszej kultury."
 california_native_ideas: "Kalifornijskie idee plemienne"
 california_native_ideas_start: "Kalifornia"
 california_native_ideas_bonus: "Kalifornijska ambicja plemienna"
 division_as_a_strength_cf: "Jedność w różnorodności"
 division_as_a_strength_cf_desc: "Na tych ziemiach żyje wiele plemion i nie wszystkie posługują się tym samym językiem. Łączy nas jednak tak wiele cech, że zrodziło się między nami poczucie braterstwa. Żyjemy w harmonii, podobnie jak z naturą, ponieważ ta ziemia obfituje w zasoby."
 basketweaving: "Wyplatanie koszy"
 basketweaving_desc: "Kosze należą do najcenniejszych przedmiotów w życiu naszego ludu. Ich wartość wynika z użyteczności i ważnego miejsca, jakie zajmują w codziennym życiu, a nie z tego, że są luksusem. Zazwyczaj wyplatają je nasze kobiety, wykorzystując miejscowe rośliny. Ich rozmiar i sposób wykonania zależą od przeznaczenia."
 tribelets: "Małe plemiona"
 tribelets_desc: "Mimo dużej gęstości zaludnienia naszego regionu, zwłaszcza w porównaniu z innymi częściami kontynentu, nasze plemiona są niewielkie i często składają się z zaledwie kilkudziesięciu osób współpracujących ze sobą. Niektórzy wolą nazywać je małymi wspólnotami plemiennymi. Nie wstydzimy się tej nazwy. Im bliżej siebie żyją ludzie, tym silniejsza jest ich wspólnota. Dzięki temu dobrze sobie radzimy."
 forest_gardening: "Leśne ogrodnictwo"
 forest_gardening_desc: "Nasza ziemia jest tak bogata, że nasi ludzie nigdy nie musieli poświęcać wiele czasu rolnictwu. Potrzebne nam dobra możemy czerpać bezpośrednio z lasów i zadrzewionych terenów. Dbając o rośliny i co kilka lat przeprowadzając kontrolowane wypalanie, nauczyliśmy się żyć w harmonii z naturą."
 kuksu_cult: "Kult Kuksu"
 kuksu_cult_desc: "Mężczyźni, a czasami także kobiety z naszych plemion, tańczą w tajnych stowarzyszeniach, by przebłagać duchy i sprowadzić błogosławieństwo na nasze ziemie. Dzięki nim dęby obdarzają nas obfitością żołędzi, które stanowią podstawę naszej diety i pozwalają naszemu ludowi rosnąć w siłę. Dopóki duchy będą nam przychylne, nigdy więcej nie zaznamy głodu."
 rock_art: "Sztuka naskalna"
 rock_art_desc: "Talent jest darem naszych przodków, którym obdarzyli niektórych członków plemienia. Dzięki tej inspiracji nasze święte miejsca zdobią malowidła przedstawiające duchy, przodków i tradycje. Upiększają one nasze ziemie i napełniają wszystkich radością."
 medicine_men: "Strażnicy obrzędów"
 medicine_men_desc: "Choć kapłani totemistyczni są powszechni na całym kontynencie, dla naszej społeczności mają szczególne znaczenie. Dbają o zdrowie naszego ludu i zazwyczaj przewodzą duchowym tańcom, tak aby przebiegały zgodnie z wolą duchów i naszych przodków."
 potlatch_held: "Urządzono potlacz"
 desc_potlatch_held: "Niedawno urządziliśmy uroczystość potlacz."
 native_americans.25.t: "Potlacz"
 native_americans.25.d: "Zaszczycił nas swoją obecnością ważny gość. [Root.Monarch.GetName] musi zdecydować, czy urządzić potlacz na jego cześć. Z jednej strony będzie to doskonała okazja, by pochwalić się bogactwem przed naszym ludem i przybyszami. Z drugiej jednak jest to kosztowne przedsięwzięcie, które może poważnie uszczuplić nasze zasoby potrzebne w przyszłości."
 native_americans.25.a: "Potlacz musi odbyć się za wszelką cenę!"
 native_americans.25.b: "Tym razem nie urządzimy potlaczu."
 native_americans.26.t: "Serdeczne powitanie"
 native_americans.26.d: "Podczas naszej wizyty u [From.Monarch.GetName] i jego ludu urządzono na naszą cześć potlacz. W trakcie tej uroczystości obdarowano nas wspaniałymi darami, by uczcić naszą wizytę i pokazać, jak zamożny jest [From.Monarch.GetName]. Jak powinniśmy odpowiedzieć?"
 native_americans.26.a: "Potlacz był wspaniały, czujemy się zaszczyceni."
 native_americans.26.b: "Potlacz był udany, dziękujemy."
 potlatch_good: "Potlacz bardzo nam się podobał"
 native_americans.26.c: "Potlacz nie był taki zły."
 potlatch_nice: "Potlacz przypadł nam do gustu"
 native_americans.26.e: "Potlacz był dość nieudany. Jesteśmy rozczarowani."
 potlatch_bad: "Nie spodobał nam się potlacz"
 native_americans.27.t: "Chłodne przyjęcie"
 native_americans.27.d: "Podczas naszej wizyty u [From.Monarch.GetName] i jego ludu powinien odbyć się na naszą cześć potlacz. Podczas tej uroczystości mieliśmy otrzymać wspaniałe dary, które uhonorowałyby naszą wizytę i pokazały, jak zamożny jest [From.Monarch.GetName]. Jak powinniśmy odpowiedzieć?"
 native_americans.27.a: "Rozumiemy, to nie był odpowiedni moment."
 native_americans.27.b: "To właściwie bardzo obraźliwe."
 native_americans.28.t: "Dzień łowów"
 native_americans.28.d: "Nastał dobry dzień na polowanie, a [Root.Monarch.GetName] obudził się z takim właśnie zamiarem. Władca podchodzi do swoich ludzi i oznajmia, że chce wyruszyć na łowy. Jeden z najbardziej doświadczonych myśliwych pyta, na jaką zwierzynę [Root.Monarch.GetName] chce zapolować."
 native_americans.28.a: "Poszukajmy jeleni."
 native_americans.28.b: "Naszą zdobyczą będą łososie."
 native_americans.28.c: "Nie ma to jak polowanie na foki."
 native_americans.28.e: "Widłorogi zawsze stanowią wyzwanie."
 native_americans.28.f: "Tylko bizon jest godną zdobyczą."
 native_americans.29.t: "Wielka zdobycz"
 native_americans.29.d1: "Gdy [Root.Monarch.GetName] polował wraz z wojownikami, próbując otoczyć stado jeleni i zdobyć pożywienie dla plemienia, jeden z ludzi podszedł do niego i oznajmił, że w głębi lasu widział wyjątkowo wielkiego jelenia. [Root.Monarch.GetName] bez wahania ruszył za nim przez zarośla, aż dotarł do swojej zdobyczy. Na środku polany majestatycznie stał jeleń, największy, jakiego władca kiedykolwiek widział. Władca wyszeptał krótkie podziękowanie duchom lasu za tę okazję, której nie zamierzał zmarnować. Rozkazał ludziom zachować ciszę i pozostać na miejscach, po czym zaczął bezszelestnie szukać najlepszej pozycji do oddania strzału. Łuk był gotowy, by wypuścić strzałę, która miała powalić zwierzę. Oddech [Root.Monarch.GetName] pozostawał spokojny. Palce zaczęły zwalniać cięciwę."
 native_americans.29.d2: "Gdy [Root.Monarch.GetName] łowił ryby, jak zwykle robią to członkowie jego plemienia, by zapewnić sobie pożywienie, podeszła do niego jedna z kobiet. Władca podniósł głowę, ich spojrzenia się spotkały i od razu zrozumiał, że dostrzegła coś niezwykłego, a zarazem pomyślnego. Z nabożnością wyszeptała, że widziała największego łososia, jakiego kiedykolwiek spotkała — prawdziwe wcielenie ducha rzeki, który tak głęboko czcimy. [Root.Monarch.GetName] poszedł za nią do wskazanego miejsca i po kilku chwilach wreszcie go zobaczył. Rzeczywiście był ogromny. Władca przygotował narzędzia, by go schwytać."
 native_americans.29.d3: "Gdy [Root.Monarch.GetName] wracał do domu swoim kanu po udanym dniu polowania na foki, niedaleko dostrzegł ogromną fokę wynurzającą się z morskich głębin — prawdziwe błogosławieństwo bogów. Przygotował harpun i po cichu zbliżył się do zwierzęcia. Zostawił wiosło w kanu, wstał i uniósł gotowy do rzutu harpun. Foka wynurzyła się, ich spojrzenia się spotkały, a [Root.Monarch.GetName] wypuścił broń."
 native_americans.29.d4: "Grupa myśliwych wracała do domu, gdy pośród stada widłorogów, które napotkał [Root.Monarch.GetName], pojawiła się największa antylopa, jaką kiedykolwiek widział. Niemal jak bóstwo, otaczała ją niezwykła, jasna aura i władca od razu wiedział, że musi na nią zapolować. Opuścił grupę i bezszelestnie podkradł się do zwierzęcia. Gdy znalazł się na odpowiedniej pozycji, przygotował broń, mając nadzieję, że nie zmarnuje tej okazji."
 native_americans.29.d5: "Ziemia drży, gdy [Root.Monarch.GetName] zbliża się do stada bizonów. Zwierzęta te potrafią z łatwością zabić człowieka szarżą, ale są też źródłem życia naszego ludu. Nagle wśród nich [Root.Monarch.GetName] dostrzega potężnego samca i wie, że to właśnie on musi stać się jego zdobyczą. Władca szybko modli się do przodków i przygotowuje do nierównej walki. Gdy nadarza się okazja, próbuje ją wykorzystać."
 native_americans.29.a: "Niech duchy zdecydują, czy [Root.Monarch.GetName] zasługuje na tę zdobycz."
 unsuccessful_hunt: "[Root.Monarch.GetName] chybi."
 successful_hunt: "[Root.Monarch.GetName] zabije zwierzę."
 native_americans.30.t: "Słup hańby"
 native_americans.30.d: "Posłaniec podchodzi do [Root.Monarch.GetName] i oznajmia, że wzniesiono słup hańby, by wszyscy dowiedzieli się o jego długu. To bardzo upokarzająca sytuacja, która osłabi pozycję władcy. Co powinniśmy zrobić?"
 native_americans.30.a: "Dobrze, [Root.Monarch.GetName] spłaci dług i położy kres plotkom."
 native_americans.30.b: "Nie zapłacimy."
 pay_debt_shame_pole_title: "Dług wobec słupa hańby"
 pay_debt_shame_pole_desc: "Wzniesiono słup hańby, by nas upokorzyć. Jeśli spłacimy dług, słup zostanie usunięty, a my przestaniemy tracić twarz."
 shame_pole: "Słup hańby"
 desc_shame_pole: "Słup hańby przynosi nam ujmę."
 native_americans.31.t: "Słup honoru dla sojusznika"
 native_americans.31.d: "Nasi sojusznicy udowodnili swoją wartość, a nasi ludzie poprosili o wzniesienie słupa honoru, by wyrazić im wdzięczność. Czy powinniśmy go wznieść?"
 native_americans.31.a: "Zasłużyli na to."
 native_americans.31.b: "Tym razem nie."
 erect_honour_pole_ally_title: "Słup honoru dla sojusznika"
 erect_honour_pole_ally_desc: "Mamy okazję wznieść słup honoru ku czci sojusznika. Dzięki temu jeszcze bardziej poprawimy nasze stosunki."
 erect_honour_pole_title: "Słup honoru naszego plemienia"
 erect_honour_pole_desc: "Chcemy upamiętnić ważne wydarzenie, uczcić przodków lub zasłużoną osobę, wznosząc słup honoru."
 native_americans.32.t: "Słup honoru"
 native_americans.32.d: "W ostatnich dniach zastanawialiśmy się nad wzniesieniem słupa honoru w naszej wiosce. Minęło wiele czasu od postawienia poprzedniego, a teraz nadarza się dobra okazja, by poprawić wizerunek naszego plemienia w oczach wszystkich, także naszych własnych ludzi. Musimy zdecydować, czy słup ma uczcić nas samych, kogoś innego, czy też zadowolić naszych przodków."
 native_americans.32.a: "To jest dobry pomysł."
 native_americans.32.b: "Tym razem nie."
 honour_pole: "Słup honoru"
 desc_honour_pole: "Na naszych ziemiach wzniesiono słup honoru, by upamiętnić przodka, wydarzenie lub wieczną przyjaźń między plemionami."
 native_americans.33.t: "Zaginione zwierzęta"
 native_americans.33.d1: "Ktoś nie dopilnował obowiązków i nasze psy zniknęły z obozu. Bez nich nie możemy przemieszczać tipi ani dobytku, więc musimy pozostać w tym miejscu, dopóki ich nie odnajdziemy."
 native_americans.33.d2: "Ktoś nie dopilnował obowiązków i część naszych koni zniknęła z obozu. Bez nich nie możemy przemieszczać tipi ani dobytku, więc musimy pozostać w tym miejscu, dopóki ich nie odnajdziemy."
 native_americans.33.a: "Wyślijmy wszystkich, którzy mogą ich szukać."
 native_americans.33.b: "To zbyt wiele kosztuje. W końcu same wrócą."
 travois_no_dogs: "Brak psów do ciągnięcia włóki"
 desc_travois_no_dogs: "Dopóki nie odzyskamy naszych psów, włóki są bezużyteczne."
 travois_no_horses: "Brak koni do ciągnięcia włóki"
 desc_travois_no_horses: "Dopóki nie odzyskamy naszych koni, włóki są bezużyteczne."
 native_americans.34.t: "Lot orła"
 native_americans.34.d: "Nad obozem przelatuje orzeł. Nikt nie zwraca na niego większej uwagi, dopóki nasz kapłan nie zaczyna się niepokoić. Ludzie otaczają go, a nawet ty zostajesz przyciągnięty bliżej. Jego słowa nie napawają optymizmem. Lot orła jest zbyt nieregularny, a kapłan uważa to za zły omen."
 native_americans.34.a: "Powinniśmy złożyć ofiary, by przebłagać duchy."
 native_americans.34.b: "To tylko orzeł."
 native_americans.35.t: "Bizony się rozmnażają"
 native_americans.35.d: "Ostatnie miesiące były deszczowe, a skutki okazały się znakomite. Trawa wyrosła bujniejsza i bardziej zielona niż kiedykolwiek, pożywienia jest pod dostatkiem, a bizony rozmnożyły się w niewiarygodnej liczbie. Duchy naprawdę nam pobłogosławiły."
 native_americans.35.a: "To będzie dobry rok na polowania."
 native_americans.36.t: "Malowanie skór"
 native_americans.36.d: "Ostatnie polowanie było bardzo udane i udało nam się zgromadzić wiele skór bizonów. Malowane skóry są powszechne wśród innych plemion, lecz zazwyczaj nie mają one dostępu do bizonów, dlatego nasze wielkie skóry można sprzedać za dobrą cenę. Nasi kupcy właśnie wrócili. Przywieźli ze sobą bogactwa."
 native_americans.36.a: "To bogactwo przysłuży się naszemu plemieniu."
 native_americans.37.t: "Pokój na Równinach"
 native_americans.37.d: "Przywódcy kilku plemion przyjęli nasze zaproszenie, by spotkać się i przywrócić pokój na Równinach. Wielu uważa, że to się nie uda, inni jednak sądzą, że warto podjąć ten wysiłek."
 native_americans.37.a: "Kilka podarunków pomoże załagodzić spory."
 native_americans.37.b: "Nie możemy po prostu zapomnieć dawnych krzywd."
 native_americans.38.t: "Brakuje żołędzi"
 native_americans.38.d: "Żołędzie stanowią podstawę naszej diety. Przygotowujemy z nich wiele potraw, lecz z niewiadomego powodu w tym roku jest ich niewiele."
 native_americans.38.a: "Będziemy musieli polegać na innych źródłach pożywienia."
 native_americans.39.t: "Życie musi powrócić"
 native_americans.39.d: "Po ostatnich pożarach, które spustoszyły nasze ziemie, ludzie zaczęli zastanawiać się, jak usunąć tę szpetną bliznę z ziemi tak hojnie nas żywiącej. Nasz przywódca [Root.Monarch.GetName] wykazał się pomysłowością i przypomniał sobie dawną tradycję. Nasi ludzie, najczęściej kobiety, używali specjalnie ukształtowanych koszy zawierających nasiona. Podczas chodzenia nasiona wysypywały się na ziemię i z czasem porastały niegdyś zniszczone tereny, które znów stawały się zielone."
 native_americans.39.a: "Przeznaczymy nasze zasoby na przygotowanie wielu takich koszy dla tego szlachetnego przedsięwzięcia."
 native_americans.39.b: "To nie jest odpowiedni moment."
 native_americans.40.t: "Łaźnia parowa dla społeczności"
 native_americans.40.d: "Od dawna nasza społeczność nie ma łaźni parowej, odkąd poprzednia spłonęła. Ponieważ musieliśmy zajmować się wieloma pilniejszymi sprawami, mieszkańcy radzili sobie bez niej. Teraz jednak plemię przeżywa spokojniejszy okres i ludzie zaczęli tęsknić za odpowiednią łaźnią, w której mężczyźni i dzieci mogliby oczyszczać ciało oraz duszę. Dobrym pomysłem może być skierowanie części ludzi do pracy przy budowie takiego miejsca, aby cała społeczność mogła z niego korzystać."
 native_americans.40.a: "Zbudujemy ją."
 native_americans.40.b: "Wykorzystamy te zasoby na inne potrzeby."
 native_americans.41.t: "Sprzedaż koszy"
 native_americans.41.d: "Kupiec z innego plemienia zainteresował się koszami wyplatanymi przez nasze kobiety i zapytał, czy może kilka kupić. Może to otworzyć przed nami nowe możliwości handlowe."
 native_americans.41.a: "Widzę nowy sposób na przysłużenie się naszemu ludowi."
 be_the_leader_title: "Stań na czele"
 be_the_leader_desc: "Musimy pokazać wszystkim, że jesteśmy tu po to, by przewodzić."
 honour_the_ancestors_title: "Uhonoruj przodków"
 honour_the_ancestors_desc: "Wznosząc słup totemiczny ku pamięci naszych przodków i ich czynów, okazujemy im szacunek."
 smells_like_teen_spirit_title: "Zapach młodości"
 smells_like_teen_spirit_desc: "Pokazywanie siły innym państwom jest ważne, lecz nie osiągniemy tego bez udziału naszego ludu. Musimy obudzić w ludziach ducha ich młodości, gdy byli pełni energii i gotowi zdobywać świat."
 celebrate_a_potlatch_title: "Urządź potlacz"
 celebrate_a_potlatch_desc: "Zaprosimy naszych sojuszników i obdarujemy ich cennymi podarunkami, by poznali nasze bogactwo."
 show_military_strength_title: "Zademonstruj siłę militarną"
 show_military_strength_desc: "Inne plemiona mogą być naszymi sojusznikami, ale pokażemy im naszą potęgę i przypomnimy, kto ustala zasady."
 bond_to_the_land_title: "Więź z ziemią"
 bond_to_the_land_desc: "Nasze tereny łowieckie są bogate, lecz potrzebujemy miejsca, w którym będziemy mogli składować nasze dobra."
 why_cant_we_be_friends_title: "Dlaczego nie możemy się zaprzyjaźnić?"
 why_cant_we_be_friends_desc: "Rdzenni mieszkańcy Równin od zawsze byli pokojowo nastawieni. Pokażmy wszystkim, że chcemy zachować ten stan rzeczy."
 teach_plains_sign_language_title: "Nauczaj języka migowego Równin"
 teach_plains_sign_language_desc: "Nasi przodkowie stworzyli język migowy, który służy jako wspólny język handlu. Musimy nadal uczyć go nasze dzieci."
 plains_power_title: "Potęga Równin"
 plains_power_desc: "Pochwalmy się poziomem naszego rozwoju, a wszyscy będą nas podziwiać."
 horse_culture_title: "Kultura konna"
 horse_culture_desc: "Konie zrewolucjonizowały nasz sposób życia. Musimy się dostosować i zaakceptować nową rzeczywistość."
 such_a_lovely_place_title: "Jakże piękne miejsce"
 such_a_lovely_place_desc: "Nasza ziemia jest bogata i obfituje w zasoby dla naszego ludu. Musimy jedynie je zgromadzić i pozwolić naszej społeczności rosnąć w siłę."
 lovely_place: "Jakże piękne miejsce"
 desc_lovely_place: "Witajcie w Kalifornii\nJakże piękne to miejsce\nJakże piękne twarze\nW Kalifornii jest mnóstwo miejsca\nO każdej porze roku\nZnajdziesz je właśnie tutaj."
 in_harmony_with_nature_title: "W harmonii z naturą"
 in_harmony_with_nature_desc: "Nasi ludzie mogą zdobyć wszystko, czego potrzebują, czerpiąc pożywienie z natury. Co najwyżej musimy rozwinąć leśne ogrodnictwo, by pomóc przyrodzie dostarczać jeszcze więcej dóbr."
 basketweaving_trade_title: "Handel wyrobami koszykarskimi"
 basketweaving_trade_desc: "Nasz lud, a zwłaszcza kobiety, tradycyjnie wyplata kosze, które są powszechnie wykorzystywane w naszych społecznościach. Powinniśmy uczynić z tego ważną część gospodarki i rozważyć wymianę koszy z innymi plemionami na towary, do których nie mamy dostępu."
 commission_some_rock_art: "Zleć wykonanie sztuki naskalnej"
 commission_some_rock_art_desc: "Aby uczcić naszych przodków, zlecimy wykonanie malowideł na skałach."
 rock_art_dec: "Sztuka naskalna"
 desc_rock_art_dec: "Zleciliśmy wykonanie nowego malowidła naskalnego na naszych ziemiach, by uczcić naszych przodków."
 paint_the_land_title: "Ozdób ziemię malowidłami"
 paint_the_land_desc: "Malowanie skał jest bliską naszemu ludowi sztuką. Nasza więź z ziemią jest z nią związana, dlatego powinniśmy ponownie ozdobić ją malowidłami, by tę więź umocnić."
 settle_our_tribe_title: "Osiedl nasze plemię"
 settle_our_tribe_desc: "Przez wiele zim nasi ludzie wędrowali z miejsca na miejsce, ale nadszedł czas, by osiąść na stałe i przynieść chwałę naszemu ludowi."
 colonize_the_continent: "Zasiedl kontynent"
 desc_colonize_the_continent: "Wokół nas znajduje się wiele wolnych ziem, które nasz lud musi zająć, jeśli chcemy przetrwać kolejne fale obcych przybyszów docierających do naszych wybrzeży."
 ne_native_ideas: "Idee Północno-Wschodnich Lasów"
 ne_native_ideas_start: "Północno-wschodnie tradycje"
 ne_native_ideas_bonus: "Północno-wschodnia ambicja"
 ne_turtle_clan: "Klan Żółwia"
 ne_turtle_clan_desc: "Skorupa twarda jak skała. Żółwie należą do najbardziej wytrzymałych i długowiecznych zwierząt. Z pewnością możemy nauczyć się od nich, jak się chronić."
 ne_deer_clan: "Klan Jelenia"
 ne_deer_clan_desc: "Poetów i gawędziarzy należy cenić i szanować. Jelenie są jednymi z najważniejszych zwierząt łownych, a ich dostojeństwo i postawa od dawna inspirują naszych artystów."
 ne_bear_clan: "Klan Niedźwiedzia"
 ne_bear_clan_desc: "Niedźwiedzie są opiekunami. Wiedzą, jak chronić i leczyć. Wielu naszych strażników obrzędów przyjęło słowo „niedźwiedź” jako część swoich imion, a duch tego zwierzęcia wzmocni ich zdolności."
 ne_wolf_clan: "Klan Wilka"
 ne_wolf_clan_desc: "Wilki są mędrcami, inteligentnymi i wytrwałymi przywódcami. Najbardziej podziwiana jest jednak ich lojalność — podobnie jak wierne i nieustraszone psy nigdy nie porzucają swoich rodzin."
 ne_marten_clan: "Klan Kuny"
 ne_marten_clan_desc: "Kuny są myśliwymi i wojownikami, którzy zawsze panują nad przebiegiem walki, przez co stają się groźnymi przeciwnikami. Ich wojowniczy duch inspiruje nasz lud w czasach wojny."
 ne_eagle_clan: "Klan Orła"
 ne_eagle_clan_desc: "Orły są szlachetnymi i szanowanymi zwierzętami. Stały się symbolem więzi rodzinnych i uosabiają równowagę między łagodnością a niebezpieczeństwem. Członkowie innych plemion będą pod wrażeniem ich majestatycznej postawy."
 ne_crane_clan: "Klan Żurawia"
 ne_crane_clan_desc: "Żurawie są naturalnymi przywódcami. Gdy żuraw przekazuje nauki, jego donośny głos słychać z daleka, dzięki czemu nikt nie może go zignorować."
 se_native_ideas: "Idee Południowo-Wschodnich Lasów"
 se_native_ideas_start: "Południowo-wschodnie tradycje"
 se_native_ideas_bonus: "Południowo-wschodnie ambicje"
 se_mississippian_legacy: "Dziedzictwo Missisipów"
 se_mississippian_legacy_desc: "Dziedzictwo tworzą opowieści — o miejscach, które zamieszkiwaliśmy, przedmiotach, których używaliśmy, i życiu, które wiedliśmy. Dawna kultura Missisipów rozciągała się wzdłuż rzeki, tworząc sieć religijną i handlową łączącą różne plemiona."
 se_matrilineal_lineage: "Dziedziczenie w linii matczynej"
 se_matrilineal_lineage_desc: "Dzieci rodzą się w klanach swoich rodziców, wśród których dorastają i pobierają nauki. Większość plemion w naszym regionie kieruje się zasadą matrylinearności, a Matka Klanu odgrywa ważną rolę w naszych rządach."
 se_refined_ceramics: "Dopracowana ceramika"
 se_refined_ceramics_desc: "Przez całe życie towarzyszą nam glina i kamień. Gołymi rękami nadajemy im kształt, dzięki któremu stają się czymś więcej niż tylko gliną czy kamieniem. Przez stulecia doskonaliliśmy techniki ceramiczne i tchnęliśmy w nasze wyroby życie."
 se_cultivation_of_the_earth: "Uprawa ziemi"
 se_cultivation_of_the_earth_desc: "Ziemia jest zarówno początkiem, jak i końcem wszelkiego życia. Żywi nas, skazuje na głód, przemienia nasze ciała w rozkładające się zwłoki, a na końcu nas pochłania. My żywimy się nią, a ona nami. Udoskonaliliśmy nasze rolnictwo, by jak najlepiej korzystać z jej darów, póki możemy."
 se_mound_builders: "Budowniczowie kurhanów"
 se_mound_builders_desc: "Oddawanie czci zmarłym wymaga nie tylko słów, lecz także czynów. Nasi przodkowie słynęli z usypywania kurhanów, które służyły za miejsca pochówku i wyrażały szacunek dla zmarłych."
 se_exogamous_marriages: "Małżeństwa egzogamiczne"
 se_exogamous_marriages_desc: "Zawieranie małżeństw poza własnym klanem pozwoli nam zawierać sojusze, a także ograniczy ryzyko chorób charakterystycznych dla naszych rodzin."
 se_stomp_dancers: "Tancerze tańca Stomp"
 se_stomp_dancers_desc: "Aby wykonać wyjątkowy taniec Stomp, uczestnicy muszą przestrzegać ścisłych zasad gwarantujących prawidłowy przebieg ceremonii. Wymagają one panowania nad ciałem i umysłem, a więc postu, czuwania oraz zażywania środków pomagających sprostać temu ważnemu zadaniu."
 sw_native_ideas: "Idee Południowego Zachodu"
 sw_native_ideas_start: "Południowo-zachodnie tradycje"
 sw_native_ideas_bonus: "Południowo-zachodnie ambicje"
 sw_the_old_tales: "Dawne opowieści"
 sw_the_old_tales_desc: "Słuchając opowieści i historii z naszej przeszłości, możemy poznać przyszłość. Nie wolno nam lekceważyć zawartych w nich nauk."
 sw_four_clans: "Cztery klany"
 sw_four_clans_desc: "W niektórych plemionach naszego regionu każde dziecko rodzi się związane z czterema klanami: matki, ojca, babki i dziadka. Każdy z nich obdarza dziecko siłą i mądrością, dzięki czemu nasi wojownicy są wyjątkowo wytrzymali."
 sw_raiding_nomads: "Nomadzi-najeźdźcy"
 sw_raiding_nomads_desc: "Niektóre plemiona zamieszkujące pustynię są waleczne i budzą grozę. Sama wieść o ich nadejściu wystarczy, by wrogowie ukrywali się ze strachu."
 sw_prosperous_sedentarism: "Dostatnie osiadłe życie"
 sw_prosperous_sedentarism_desc: "Niektóre plemiona wybierają życie w osadach rolniczych i inwestują we własny rozwój."
 sw_the_grand_canyon: "Wielki Kanion"
 sw_the_grand_canyon_desc: "Wielki Kanion to głębokie rozcięcie w ciele Ziemi, szczelina w jej kamiennej skórze. To niebezpieczne miejsce, lecz jego znajomość zawsze zapewni nam przewagę nad wrogami."
 sw_into_the_desert: "W głąb pustyni"
 sw_into_the_desert_desc: "Pustyni nie da się powstrzymać, pokonać ani z nią walczyć. Można ją jedynie zaakceptować i zrozumieć. Nauczyliśmy się w niej żyć, lecz nasi wrogowie nie posiadają tej wiedzy — i całe szczęście."
 sw_far_west: "Daleki Zachód"
 sw_far_west_desc: "Przychodzi chwila, gdy człowiek pojmuje, że nie może już iść dalej. Za ostatnią granicą nie ma nic poza wodą i spokojem. Mimo to jakiś irracjonalny impuls każe nam posuwać się naprzód, aż dotrzemy właśnie tam."
