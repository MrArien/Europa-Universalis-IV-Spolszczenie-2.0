 special_regency_events.1.t: "Choroba [Root.Monarch.GetName]!"
 special_regency_events.1.d: "To dzień, który zaważy na losach naszego państwa. Choroby [Root.Monarch.GetName] nie da się już dłużej ignorować i uniemożliwia ona [Root.Monarch.GetHerHim] wypełnianie obowiązków. [Root.Monarch.GetSheHeCap] wykazywał coraz wyraźniejsze oznaki niestabilności psychicznej, uparcie podejmując decyzje, które jawnie szkodzą naszemu krajowi.\nDziś rano rada siedemnastu lekarzy jednogłośnie podpisała dokument stwierdzający, że [Root.Monarch.GetHerHim] nie jest zdolny do sprawowania rządów, a poprawa [Root.Monarch.GetHerHis] stanu nie rokuje nadziei. Gdy przekazano tę decyzję naszemu następcy tronu, [Root.Heir.GetName], wyraził on sprzeciw wobec sugestii, by sam objął tron. Uważa bowiem, że nadal czuje silną odpowiedzialność wobec swojej matki."
 special_regency_events.1.a: "Niedorzeczność! To jego obowiązek."
 special_regency_events.1.b: "Powinniśmy zaufać jego rozsądkowi."
 special_regency_events.1.tt: "§Y[Root.Heir.GetName]§! wstąpi na tron."
 chateau_de_chenonceau: "Zamek Chenonceau"
 desc_chateau_de_chenonceau: "Odzyskaliśmy wreszcie dobra należące do Korony."
 special_regency_events.2.t: "Zamek Chenonceau"
 special_regency_events.2.d: "Spraw sercowych nigdy nie należy mieszać z polityką, zwłaszcza gdy dotyczą króla i królowej państwa. Wraz ze wzrostem wpływów Katarzyny na francuskim dworze oraz coraz wyraźniejszym zainteresowaniem jej męża Dianą de Poitiers stało się jasne, że trzeba podjąć jakieś działania.\nJednym z pierwszych posunięć na nowym stanowisku Katarzyna zażądała, by Diana zwróciła Koronie okazały zamek Chenonceau, a także klejnoty rodowe, które tak niesłusznie otrzymała w darze."
 special_regency_events.2.a: "Musimy zadbać o honor Katarzyny."
 sten_sture_opinion: "Regencja Stena Sturego"
 special_regency_events.3.t: "Regencja Stena Sturego"
 special_regency_events.3.d: "Dzięki pomocy w pokonaniu duńskiego panowania nad naszym krajem i znaczącemu udziałowi w szwedzkim powstaniu Sten Gustavsson stał się niezastąpioną postacią zarówno w wojsku, jak i w polityce naszego państwa. Jego znaczenie jest tak wielkie, że nawet jego wuj, król Karol VIII, postanowił mianować go regentem podczas swoich licznych nieobecności. Nie minęło wiele czasu, zanim poszczególne stany zaczęły różnić się w ocenie tej niezwykle ważnej decyzji."
 special_regency_events.3.a: "Nie ma nikogo lepiej przygotowanego do tej roli."
 special_regency_events.3.b: "To chyba nieco przesadna reakcja."
 special_regency_events.4.t: "Chwila chwały"
 special_regency_events.4.d: "[Root.Monarch.GetName] objęła władzę nad naszym państwem, a jej trafne decyzje zaprowadziły nas ku epoce dobrobytu i pokoju. Otoczyła się najlepszymi i najlepiej przygotowanymi doradcami spośród mieszkańców [Root.GetName]. W tych okolicznościach wiele osób wyraziło pragnienie, by oficjalnie powierzono jej rządy nad naszym państwem."
 special_regency_events.4.a: "Powinna pozostać doradcą."
 special_regency_events.4.b: "Powinna zostać królową z własnego prawa."
 special_regency_events.4.c: "Będziemy przestrzegać zasad dziedziczenia."
 special_regency_events.5.t: "Edukacja następcy tronu"
 special_regency_events.5.d: "Niewiele rzeczy w życiu jest ważniejszych niż wiedza zdobyta w dzieciństwie. Dlatego [Root.Monarch.GetName] poświęciła wiele wysiłku, by zapewnić [Root.Heir.GetName] najlepszych możliwych nauczycieli, ponieważ już za kilka lat [Root.Heir.GetSheHe] obejmie rządy nad krajem.\nDziś rano na nasz dwór przybył mężczyzna, którego drżące dłonie ledwie utrzymywały ciężar niesionych dokumentów. Zapytał o imię naszego następcy tronu i przedstawił się jako [Root.Heir.GetHerHis] nowy opiekun."
 special_regency_events.5.a: "Zostanie przyjęty z otwartymi ramionami."
 special_regency_events.6.t: "Najgłębsza rzecz"
 special_regency_events.6.d: "Zapytani o najgłębszą rzecz na świecie dworzanie odpowiadali: „jaskinie pod górami”, „dno oceanu”, „gardziel tygrysa”. Królowa Jung Soon, poproszona o własną opinię, odparła jedynie: „Najgłębsze jest ludzkie serce”.\nJej mądrość nie ma sobie równych, podobnie jak bezprecedensowa miłość, którą darzą ją chłopi. Coraz częściej pojawiają się głosy, że to ona lepiej nadawałaby się do noszenia korony, zwłaszcza teraz, gdy §Y[Root.Monarch.GetTitle] [Root.Monarch.GetName]§! jest niebezpiecznie chory…"
 special_regency_events.6.a: "Powinna zostać naszą nową regentką."
 special_regency_events.6.b: "Powinniśmy powierzyć jej rządy nad [Root.GetName]."
 special_regency_events.6.c: "Następca tronu może poradzić sobie z tym [Root.Heir.GetHerselfHimself]."
 special_regency_events.6.tt: "§Y[Root.Consort.GetName]§! zostanie królową-regentką."
 special_regency_events.6.tt2: "§Y[Root.Consort.GetName]§! wstąpi na tron."
 special_regency_events.7.t: "Prześladowania Sinyu"
 special_regency_events.7.d: "Człowiek jest czymś więcej niż tylko jedną cechą, a nie wszystkie z nich są dobre. Pomimo [Root.Monarch.GetHerHis] godnego pochwały usposobienia [Root.Monarch.GetName] postanowił rozpocząć prześladowania chrześcijan mieszkających w [Root.GetName]. Motywy tej decyzji okazały się jednak znacznie bardziej przyziemne: większość politycznych przeciwników [Root.Monarch.GetHerHis] skłania się ku tej obcej wierze. [Root.Monarch.GetSheHeCap] zasugerował, by wszystkich ich stracić dla zapewnienia bezpieczeństwa naszemu państwu."
 special_regency_events.7.a: "Będziemy musieli się ich pozbyć."
 special_regency_events.7.b: "Nie będzie to dobrze o nas świadczyć."
 crown_colony_government: "Kolonia koronna"
 crown_colony_government_desc: "Kolonia koronna to typ kolonii znajdującej się pod bezpośrednią kontrolą metropolii."
 private_enterprise_colony_government: "Kolonia prywatnego przedsiębiorstwa"
 private_enterprise_colony_government_desc: "Kolonia zarządzana jako prywatne przedsiębiorstwo koncentruje się na wydobywaniu surowców i wysyłaniu ich do ojczyzny."
 self_governing_colony_government: "Kolonia samorządna"
 self_governing_colony_government_desc: "Kolonia autonomiczna, która funkcjonuje jak państwo wewnątrz państwa."
 custom_idea_possible_disengagement_chance: "Szansa na wycofanie okrętów"
 custom_idea_possible_disengagement_chance_desc: "Dzięki szkoleniu załóg naszych okrętów będziemy mogli uniknąć niepotrzebnych strat podczas starć z flotami przeciwnika."
 custom_idea_yearly_karma_decay: "Ograniczenie utraty karmy"
 custom_idea_yearly_karma_decay_desc: "Dzięki kilku prostym zmianom w naszym postępowaniu możemy uniknąć utraty karmy."
 flavor_byz.2.t: "Patriarchat Konstantynopola leczy schizmę"
 flavor_byz.2.d: "Patriarcha Konstantynopola ogłosił koniec Wielkiej Schizmy, a deklaracja ta została poparta przez jego uległe nowe kościelne marionetki w Rzymie i Moskwie. Podczas, gdy my moglibyśmy dalej podążać naszymi starymi ścieżkami, zwycięstwa patriarchatu sugerują, że Bóg może być naprawdę po jego stronie."
 flavor_byz.2.a: "Przyjmiemy wiarę prawosławną."
 flavor_byz.2.b: "Dopóki praktykują hezychazm, my pozostaniemy katolikami!"
 millenarian_theocracy_reform: "Millenarystyczna teokracja"
 millenarian_theocracy_reform_desc: "Świat stał się grzesznym miejscem, które można oczyścić jedynie ogniem. Musimy zaufać osądowi naszego władcy, by położył temu kres. Republika powierzy mu władzę absolutną."
 native_federations_event.1.t: "Zasady federacji"
 native_federations_event.1.d: "Przynależność do federacji ma ogromne konsekwencje dla naszego ludu. Nie tylko wiążemy nasz los z losem innych, lecz także stajemy się czymś na kształt nowego, większego plemienia. Nowe zasady rządzenia sprawiły, że niektórzy zaczęli się zastanawiać, czy dawne zwyczaje nie były lepsze dla naszego ludu. Oczywiście pojawiły się dyskusje, a nawet kłótnie między członkami plemion o przyszłość naszego narodu. Niemal wszyscy chcą, by [Root.Monarch.GetName] podjął decyzję."
 native_federations_event.1.a: "Przyjmiemy zasady federacji."
 native_federations_event.1.b: "Stare sposoby działały, działają i będą działać."
 native_federations_event.2.t: "Rządy rady"
 native_federations_event.2.d: "Skoro nie należymy już do federacji, dalsze przestrzeganie jej zasad rządzenia nie ma dla naszego ludu większego sensu. Najstarsi członkowie naszej społeczności dysponują ogromną mądrością, która pomoże plemieniu rozkwitnąć, dlatego powinni służyć nam radą w ramach rady starszych. Jak można się spodziewać, pojawią się głosy sprzeciwu, lecz ostateczna decyzja będzie należeć do [Root.Monarch.GetName]."
 native_federations_event.2.a: "Dalsze przestrzeganie tych zasad nie ma już sensu."
 native_federations_event.2.b: "Pozostaniemy przy dotychczasowym rozwiązaniu."
 native_federations_event.3.t: "Jeden za wszystkich, wszyscy za jednego"
 native_federations_event.3.d: "Wszyscy wiedzą, że wilki są najlepszymi łowcami, ponieważ polują w stadzie, a nie samotnie, jak inne stworzenia. Powinniśmy uczyć się od natury i czerpać z jej mądrości. Dopóki [Root.Monarch.GetName] stoi na czele [Root.Monarch.GetHerHis] plemienia i federacji, ludzie będą pamiętać, że to właśnie [Root.Monarch.GetSheHe] zdołał nas wszystkich zjednoczyć."
 native_federations_event.3.a: "Razem jesteśmy silniejsi."
 leadership_pays_off_mod: "Przywództwo przynosi korzyści."
 desc_leadership_pays_off_mod: "Nasza rola jako lidera Federacji niesie ze sobą nowe możliwości."
 native_federations_event.4.t: "Silniejsi razem"
 native_federations_event.4.d: "Nasza federacja istnieje już od kilku lat i wspólnie przebyliśmy długą drogę. Pomimo licznych problemów, które naturalnie się pojawiały, udało nam się wyjść z nich silniejszymi i bardziej zjednoczonymi niż kiedykolwiek. Wspólne zmagania pozwoliły nam połączyć plemiona w jedną społeczność o nowej, wspólnej tożsamości. Nadszedł czas, by zebrać owoce tych wysiłków."
 native_federations_event.4.a: "Wszyscy powinniśmy odnieść korzyści."
 grow_in_harmony_mod: "Rosnąc w harmonii"
 desc_grow_in_harmony_mod: "Federacja przynosi korzyści nam wszystkim."
 native_federations_event.4.b: "Przywódca otrzyma największą część."
 primus_inter_pares_mod: "Primus inter pares"
 desc_primus_inter_pares_mod: "Jako przywódcy federacji otrzymujemy największe korzyści. To sprawiedliwe."
 guru_teaching: "Nauki guru"
 native_federations_event.5.t: "Problemy federacji"
 native_federations_event.5.d: "Przywódca naszej Federacji zaczął ostatnio wykazywać dziwne zachowanie i wśród plemion rozeszły się niepokojące plotki. Chociaż nikt nie podniósł głosu, przywódcy pozostałych członków Federacji są zaniepokojeni i zebrali się, aby omówić tę kwestię."
 native_federations_event.5.a: "To jest problem."
 lost_respect_mod: "Utracony szacunek"
 desc_lost_respect_mod: "Inni członkowie nie szanują nas już tak bardzo."
 native_federations_event.5.b: "Powinniśmy rozwiązać ten problem."
 native_federations_event.6.t: "Zjednoczeni przeciwko światu"
 native_federations_event.6.d: "Naszymi nowymi sąsiadami są potężne państwa, a potrzeba zjednoczenia rośnie niczym jastrząb szybujący po niebie. [Root.Monarch.GetName] obawia się tych ludów i ich postępu technologicznego, który bez wątpienia da im ogromną przewagę, jeśli wybuchnie konflikt między naszymi narodami. Nadszedł czas, by podjąć trudną decyzję."
 native_federations_event.6.a: "Będziemy żyć razem albo razem zginiemy."
 live_or_die_together_tooltip: "Zapomnimy o dawnych krzywdach wyrządzonych przez pozostałych członków federacji i uznamy ich za prawdziwych przyjaciół."
 native_federations_event.6.b: "Każdy powinien decydować sam za siebie."
 stand_the_ground_mod: "Stawimy opór"
 desc_stand_the_ground_mod: "Będziemy opierać się najeźdźcom, tak jak czyniliśmy to w przeszłości."
 hansa_incident.4.t: "Embargo nałożone przez Cesartwo"
 hansa_incident.4.d: "[Emperor.Monarch.GetName], władc[Emperor.Monarch.GetZyniA] Świętego Cesarstwa Rzymskiego, ogłosił[Emperor.Monarch.GetANoun] embargo przeciwko nam. Nasi kupcy napotkają ograniczenia handlowe na swoich rynkach."
 hansa_incident.4.a: "Niech [Emperor.Monarch.GetHerHim] diabli wezmą."
 flavor_lfa.1.t: "Złoto w prowincji [lfa_gold_province.GetName]!"
 flavor_lfa.1.d: "Podstawą dumy naszego narodu jest ciężka praca związana z wydobyciem złota z bogatych złóż. Tym bardziej sprawiedliwe jest, by teraz, gdy udoskonaliliśmy nasze techniki, surowiec ten pozostawał tutaj, w rękach prawowitych właścicieli, zamiast trafiać w ręce chciwych cudzoziemców.\\nW [lfa_gold_province.GetName] odkryto nową kopalnię złota, a wszystko, co się w niej znajduje, powinno należeć wyłącznie do ludu!"
 flavor_lfa.1.a: "To złoty dzień!"
 colonial_nation.182.t: "Skorumpowany gubernator"
 colonial_nation.182.d: "Problemy [Root.Monarch.GetName] z zarządzaniem naszym państwem nie były dla wielu tajemnicą. Nasi sprawniejsi dyplomaci musieli uciszać pogłoski o [Root.Monarch.GetHerHis] nieudolności, próbując utrzymać spokój w kolonii. Ostatni wzrost korupcji ujawnił jednak nieuniknioną prawdę: jeden z naszych byłych administratorów publicznie oświadczył, że pomoc finansowa otrzymana od Korony trafiała bezpośrednio do kieszeni [Root.Monarch.GetName]. Takie postępowanie w czasach kryzysu doprowadziło do licznych buntów wśród naszego ludu, z którymi musimy się uporać."
 colonial_nation.182.a: "To oburzające!"
 colonial_corrupted_governor: "Skorumpowany gubernator"
 desc_colonial_corrupted_governor: "Nasz gubernator okazał się skorumpowany."
 colonial_nation.183.t: "Nowy gubernator"
 colonial_nation.183.d: "Pogłoski o nieudolnych rządach [Root.Monarch.GetName] nieuchronnie dotarły do Korony, budząc obawy o wpływ tej niefortunnej sytuacji na reputację zarówno metropolii, jak i naszej kolonii. Grożąc podporządkowaniem nas bezpośrednio Koronie, zaproponowano nam rozwiązanie tymczasowe: mianowanie nowego gubernatora, który przejmie stery kolonii, zanim będzie za późno."
 colonial_nation.183.a: "Powinniśmy posłuchać ich rady."
 colonial_nation.183.b: "[Root.Monarch.GetName] wciąż może sprawować rządy."
 colonial_nation.184.t: "[Root.GetName] jest zadłużone!"
 colonial_nation.184.d: "Trudności, z jakimi zmaga się nasza kolonia, zdają się nie mieć końca. Ciążący na nas dług finansowy złamał ducha naszego ludu. Głód dotykający rodziny mieszkańców sprawił, że zażądali oni od [Root.Monarch.GetName] natychmiastowego i skutecznego rozwiązania problemu."
 colonial_nation.184.a: "Wykorzystamy nasze wpływy, by się tym zająć."
 colonial_nation.184.b: "Nie mają powodów do narzekań."
 colonial_nation.185.t: "Unieważniona karta królewska"
 colonial_nation.185.d: "W obliczu trudności, z jakimi ostatnio zmaga się nasz naród, oraz rosnącego niezadowolenia ludności nasza kolonia nieuchronnie zmierza ku bankructwu. Pomimo próśb [Root.Monarch.GetName], by zachować przywilej Kompanii do sprawowania rządów, Korona postanowiła unieważnić nadaną nam kartę królewską i przejąć administrację, zanim — jak sama stwierdziła — będzie za późno."
 colonial_nation.185.a: "To bezprecedensowa decyzja!"
 colonial_nation.186.t: "Zachęty kolonizacyjne"
 colonial_nation.186.d: "Ziemie naszej kolonii są żyzne i doskonałe pod uprawę, mieszkańcy życzliwi i gościnni, administracja działa tak sprawnie, jak to tylko możliwe, a powietrze przesycone jest spokojem i stabilnością, z dala od politycznych zawirowań metropolii. Nasza kolonia jest prawdziwym rajem na ziemi. Przeprowadzka bywa jednak nieprzyjemna, choć czasami konieczna, a liczba mieszkańców nie jest tak duża, jak byśmy sobie życzyli. [Root.Adm_Advisor.GetName] zaproponował wprowadzenie nowej polityki zwiększającej tolerancję wobec różnych wyznań, aby przyciągnąć więcej osadników do naszej dobrze prosperującej krainy."
 colonial_nation.186.a: "Z pewnością przyciągnie to nowych osadników."
 colonist_incentives: "Zachęty dla osadników"
 desc_colonist_incentives: "Przyznano nowy zestaw przywilejów wyznawcom wszystkich religii."
 colonial_nation.187.t: "Ułagodź [Root.GetBurghersOrFallbackName]"
 colonial_nation.187.d: "Wśród [Root.GetBurghersOrFallbackName] pojawiły się obawy dotyczące sposobu rządzenia naszą kolonią. W ostatnich miesiącach dyskretnie rozgłaszano aluzje do ich poglądów, lecz teraz ich niezadowolenie stało się wyraźne i niepokojące. Dziś rano jeden z nich odwiedził [Root.Monarch.GetName], zanim [Root.Monarch.GetSheHe] zdążył udać się na posiedzenie rady, i jasno przedstawił swoje stanowisko: „Głęboko niepokoi nas wpływ szlacheckiej oligarchii na losy [Root.GetName], wraz z jej staroświatowymi wadami i chciwością”."
 colonial_nation.187.a: "Powinniśmy poprzeć [Root.GetBurghersOrFallbackName]."
 colonial_nation.187.b: "Musimy chronić [Root.GetNobilityOrFallbackName]."
 colonial_nation.188.t: "Obawy szlachty"
 colonial_nation.188.d: "[Root.GetNobilityOrFallbackName] nie potrafią dobrze ukrywać swoich poglądów politycznych — i najwyraźniej wcale im na tym nie zależy. Podczas uczt i bankietów głośno oznajmiali, że kolonia jest skazana na porażkę z powodu władzy, którą niesłusznie sprawują [Root.GetBurghersOrFallbackName]. Dziś jednak posunęli się do bezprecedensowego kroku: jeden z nich przybył do komnat [Root.Monarch.GetName] jeszcze przed świtem. „Wybacz, że zakłócam odpoczynek, [Root.Monarch.GetTitle], lecz trzeba natychmiast coś zrobić. Bezczelność i brak cnót [Root.GetBurghersOrFallbackName] zmieniają tę kolonię w raj dla głupców. Musimy położyć temu kres, zanim rozpocznie się dzisiejsze posiedzenie rady”."
 colonial_nation.188.a: "Powinniśmy poprzeć [Root.GetNobilityOrFallbackName]."
 colonial_nation.188.b: "Musimy chronić [Root.GetBurghersOrFallbackName]."
 colonial_nation.189.t: "Nieuczciwa konkurencja"
 colonial_nation.189.d: "Nastały trudne czasy. Zawsze bywają trudne, lecz obecne wydają się szczególnie ciężkie dla przyszłości naszej kolonii. Powołując się na rzekomą niewypłacalność naszej administracji i powszechne niepokoje społeczne, nowa Kompania Handlowa rozpoczęła negocjacje z Koroną, licząc na uzyskanie przywileju własności tych ziem."
 colonial_nation.189.a: "[Root.Adm_Advisor.GetName] się tym zajmie."
 colonial_nation.189.b: "Zawsze możemy poprosić Kościół o mediację."
 colonial_nation.189.c: "Kilka pogłosek o ich reputacji może przechylić szalę…"
 colonial_nation.189.e: "Pojmać tych wichrzycieli!"
 colonial_missionaries: "Misjonarze kolonialni"
 desc_colonial_missionaries: "Wysłano misjonarzy religijnych, aby zaprowadzili pokój w naszej kolonii."
 colonial_nation.190.t: "Nieobecny [Root.GetLowLevelOfficialForCountry]"
 colonial_nation.190.d: "Wśród osób gotowych słuchać mówi się, że [Root.GetLowLevelOfficialForCountry], którego [Root.Monarch.GetTitle] [Root.Monarch.GetName] tak łaskawie mianował do zarządzania naszą kolonią, od dawna nie wykonuje swoich obowiązków. Widziano go na największych ucztach i balach w [Root.GetName], gdzie bawi się… bardzo daleko od ludzi, którymi powinien rządzić. Łatwiej oczywiście wzniecić bunt przeciwko władcy, którego nie ma na miejscu. W końcu na nasz dwór dotarła wiadomość o niebezpiecznym powstaniu w [absent_governor_province.GetName]. Zapytany o te wydarzenia gubernator miał powiedzieć: „Te komary zjadały mnie żywcem!”."
 colonial_nation.190.a: "Z pewnością nie będzie już musiał martwić się komarami…"
 colonial_nation.191.t: "Nie ma tu oczu"
 colonial_nation.191.d: "Nie ma tu oczu. W tej pustej dolinie głosy milkną szybciej niż zapada noc, a od jej ciemności nie sposób uciec, ponieważ nikt nie pragnie ucieczki. Nie sposób zliczyć kolejnych dni: każdy jest zarazem następnym i poprzednim, a ich los splata się ciasno niczym diament w zawieszce.\nPewnego dnia powracają śpiewy ptaków. To zwyczajny dzień, z wyjątkiem ptaków. Ich głosów. I tego, że nie przypomina żadnego innego dnia. A potem pojawia się dziecko. Małe, zwyczajne dziecko. Już wcześniej próbowało uciec ze wsi, lecz zawsze wraca, niezależnie od tego, jak często odchodzi i jak daleko zdoła zajść. Zawsze wraca i bezszelestnie siada na ganku.\nDziś znów odchodzi. I znów wraca. Gdy pojawia się ponownie, wszystkie ptaki we wsi mają kwiaty wyrastające z dziobów, a ich śpiew na zawsze milknie — cisza znów obejmuje wszystko. Mówią, że to cud, ponieważ kwiaty są tak cenne, a spokój wioski tak ważny, że nie możemy pozwolić sobie na jego utratę. Z pewnością nie możemy go utracić."
 colonial_nation.191.a: "Możemy wykorzystać to, by przyciągnąć pielgrzymów…"
 colonial_nation.191.b: "Musimy natychmiast powiadomić Państwo Kościelne!"
 miraculous_colony: "Cudowna kolonia"
 desc_miraculous_colony: "W kolonii wydarzył się cud."
 colonial_nation.191.c: "To jakieś brednie."
 volcano_events.1.t: "Początek ognia"
 volcano_events.1.d: "W czerni, która pochłonęła noc, ogniste strumienie obficie spływały w dół wzgórza niczym otwarta rana, a ich ostrej czerwieni nie sposób było zignorować. Rozżarzona lawina wulkanicznego popiołu podążała za nimi niczym niecierpliwy myśliwy, z otwartą paszczą pragnącą pożreć wszystko na swojej drodze, aż w końcu jej głód zostanie zaspokojony."
 volcano_events.1.d2: "W czerni, która pochłonęła noc, można było usłyszeć grzmiący dźwięk przypominający pierwsze bicie serca góry. Z jej uśpionego krateru uniosła się kolumna popiołu i dymu w obawie przed ożywieniem - ekstatyczna eksplozja narodzin natury. Żarzące się kamienie zostały wyrzucone na pobliskie wioski, po czym nastąpiła rozżarzona lawina wulkanicznego popiołu niczym niecierpliwy myśliwy."
 volcano_events.1.a: "Natura nas ukarała."
 monument_events.1.t: "Monument w prowicji [monument_province.GetName]!"
 monument_events.1.d: "Budowa naszego monumentu w prowincji [monument_province.GetName] została wreszcie ukończona! Ludzie z całego kraju gromadzą się przed jego imponującą sylwetką jak zaciekawione dzieci. Zdumieni tym cudem, cieszą się z przynależności do [Root.GetAdjective]."
 monument_events.1.a: "Dziś jest dzień do świętowania."
 monument_events.2.t: "Pomocna dłoń"
 monument_events.2.d: "Jeden z naszych najbardziej znanych i szanowanych kamieniarzy zwrócił się dziś rano do [Root.Monarch.GetRulerGen], wyrażając swoje zaniepokojenie stanem pomnika w mieście [monument_province_2.GetName]. 'Serce mi pęka, gdy widzę tak piękną konstrukcję beztrosko porzuconą, pozostawioną samą sobie w obliczu niebezpieczeństw czasu i pogody. Błagam cię, pozwól mi pomóc w jej odbudowie'."
 monument_events.2.a: "Powinniśmy go natychmiast zatrudnić."
 monument_events.2.b: "Nie mamy na to czasu."
 monumental_pride: "Monumentalna duma"
 desc_monumental_pride: "Budowa jednego z największych pomników naszego narodu napełnia serca naszych ludzi dumą z bycia częścią naszego królestwa!"
 monument_boost: "Ulepszenia monumentów"
 desc_monument_boost: "Zatrudnianie najlepszych kamieniarzy w naszym kraju pomogło zoptymalizować budowę naszych pomników."
 monument_church_of_the_people: "Kościół ludu"
 desc_monument_church_of_the_people: "Od skromnego chłopa do najwyższego duchownego, każdy z nasz[Root.GetGovGender_nasz] [Root.GetGovNameGen] jest mile widziany w Bazylice Świętego Piotra."
 monument_events.3.t: "Dom Pana"
 monument_events.3.d: "Bóg widzi wszystko, lecz Jego przytłaczająca obecność potrzebuje miejsca, w którym może spocząć. Budowa Bazyliki św. Piotra dobiegła końca i dom Pana jest gotowy, by stać się godnym miejscem Jego odpoczynku. Stamtąd [Root.Monarch.GetTitle] [Root.Monarch.GetName] będzie mógł doglądać wszystkiego tak, jakby sam był częścią Bożego spojrzenia. Najbardziej szanowani członkowie Kościoła doradzili nam odprawienie uroczystej mszy, by uczcić tę radosną chwilę."
 monument_events.3.a: "Powinniśmy zaprosić naszych sojuszników!"
 monument_events.3.b: "To kościół całego ludu."
 opinion_st_peters: "Msza inauguracyjna w Bazylice św. Piotra"
 monument_events.4.t: "Pielgrzymi przybywają do [pagoda_province.GetName]"
 monument_events.4.d: "Pozłacane piękno pagody Szwedagon nie pozostało niezauważone. Po zakończeniu jej budowy pielgrzymi z całego buddyjskiego świata zaczęli przybywać do [pagoda_province.GetName], by ofiarować modlitwy."
 monument_events.4.a: "To doskonały moment, by opodatkować pielgrzymów."
 monument_events.4.b: "Powinniśmy przekazać kwiaty i świece na ofiary."
 shwedagon_pilgrimage: "Pielgrzymka do Szwedagon"
 desc_shwedagon_pilgrimage: "Napływ pielgrzymów przyczynił się do wzrostu zasobów naszego skarbca."
 monument_events.5.t: "Ukończenie Borobudur"
 monument_events.5.d: "Istnieją rzeczy, które ze swej natury są nieskończone. Jedną z nich jest wiara. Po odnowieniu Borobudur potęga naszego państwa stała się widoczna dla wszystkich. Monument ten jest symbolem naszej dumnej przeszłości i świetlanej przyszłości."
 monument_events.5.a: "To pokaże naszą wyższość nad państwem [MAJ.GetName]."
 monument_events.5.b: "To pokaże naszą wyższość nad państwem [SUN.GetName]."
 monument_events.5.c: "Powinniśmy wysłać kogoś z naszej rady, by się tym zajął."
 monument_events.5.e: "To byłaby wspaniała stolica."
 opinion_trent: "Sobór trydencki"
