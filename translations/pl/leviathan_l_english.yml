 pacific_guerrillas: "Partyzanci polinezyjscy"
 pacific_spearmanDESCR: "Wojownicy plemienni uzbrojeni we włócznie i drewniane tarcze."
 pacific_reformed_spearmanDESCR: "Zaawansowane techniki łączące użycie włóczni z inną bronią, pozwalające skuteczniej razić przeciwnika."
 pacific_horsemanDESCR: "Pojawienie się koni wraz z napływem obcych wpływów odmieniło również polinezyjską sztukę wojenną. Wiele plemion i królestw przyjęło konia jako ważny element swojej kultury, stając się znakomitymi jeźdźcami."
 pacific_island_warriorsDESCR: "Przywykli do życia pośród bezkresnych wód wojownicy Pacyfiku wypracowali taktykę uderz i uciekaj, opartą na mobilności zapewnianej przez morze."
 pacific_cavalryDESCR: "Jeźdźcy wyposażeni w łuki i broń palną, znakomici w wojnie podjazdowej."
 pacific_arquebusierDESCR: "Wprowadzanie broni palnej w niektórych częściach Polinezji postępowało dosyć wolno, ale stopniowo łuk ustępował jej miejsca. Arkebuz zapewnił piechocie wyższą prędkość strzelania, ale również mniejszą celność."
 pacific_hussarDESCR: "Lekka kawaleria wyspecjalizowana w najazdach i taktyce podjazdowej."
 pacific_swarm_cavDESCR: "Nieregularna jazda uzbrojona w łuki lub karabiny, wykorzystująca taktykę podjazdową do zdezorganizowania sił przeciwnika, aby następnie wykonać szarżę. Luźne zorganizowanie sprawiało, że była mniej narażona na ogień przeciwnika, ale jeśli nieprzyjaciel zdołał wytrzymać jej zmasowany atak, jeźdźcy szybko stawali się celem ataku."
 pacific_riflemenDESCR: "Armia polinezyjska wykorzystująca nowocześniejszą broń palną, zapewniającą większy zasięg i celność."
 pacific_dragoonDESCR: "Polinezyjscy dragoni byli jeźdźcami wyposażonymi w broń palną i włócznie. Pomimo nazwy 'dragoni', były to oddziały znacznie bardziej zbliżone do szwedzkiej kawalerii dragonów. Odważni wojownicy najpierw ostrzeliwali przeciwnika z karabinków i pistoletów, aby następnie dokonać szarży."
 pacific_guerrillasDESCR: "Połączenie taktyki uderz i uciekaj, charakterystycznej dla tradycyjnej polinezyjskiej sztuki wojennej, z bronią palną pozwala osiągnąć najwyższą formę prowadzenia wojny."
 maori_ideas: "Idee iwi"
 maori_ideas_start: "System iwi"
 maori_ideas_bonus: "Ambicja Maorysów"
 sons_of_kupe: "Potomkowie Kupe"
 sons_of_kupe_desc: "Podróż Kupe, datowana prawdopodobnie na XI wiek, to legendarna opowieść wspólna wszystkim Maorysom. Mówi o bohaterze z Hawaiki, który wraz z żoną Kuramarotini wyruszył w wielkim czółnie Matawhourua. Podczas legendarnej wyprawy napotkali niezliczone morskie potwory, demony i gwałtowne burze, zanim odkryli niezwykłą krainę Aotearoa. Po powrocie do Hawaiki Kupe opowiedział swemu ludowi o cudach, które ujrzał, i o nowym życiu czekającym na odległych wybrzeżach. Pochodzimy od tych, którzy z zachwytem słuchali jego opowieści, a duch podróżnika tkwi w samym sercu naszego ludu."
 kaitiakitanga: "Kaitiakitanga"
 kaitiakitanga_desc: "Kaitiakitanga to święta powinność opieki, jaką wszyscy Maorysi są winni niebu, morzu i ziemi. Osoba praktykująca tę tradycję to kaitiaki, czyli opiekun, strzegący bezbronnych sił many otaczających nas w świecie przyrody. Zbezczeszczenie świętego miejsca jest w maoryskim społeczeństwie uznawane za czyn równy morderstwu. Zanieczyszczanie rzek, wycinanie lasów czy nadmierna eksploatacja zasobów naturalnych są więc niewybaczalnymi grzechami. Tylko żyjąc w harmonii z otoczeniem i ograniczając ingerencję w przyrodę, możemy zadowolić bogów i pomnażać manę."
 kaumatua: "Kaumātua"
 kaumatua_desc: "Choć nie rządzi nami rada starszych, jej członkowie cieszą się ogromnym wpływem w społeczeństwie. Kaumātua jest wybierany przez swoją rodzinę ze względu na niezwykły intelekt, mądrość i sławę, aby dbać o zachowanie świętych tradycji cenionych przez Maorysów — zarówno w rodzinie, jak i całym iwi. Kaumātua nosi w sobie duszę nieśmiertelnego półboga obdarzonego mocą reinkarnacji. Istnieje od niezliczonych wcieleń i może powrócić w każdej chwili, by służyć rodzinie radą."
 kapa_haka: "Kapa haka"
 kapa_haka_desc: "Kapa haka to seria przytupów i śpiewów, przypominająca taniec wojenny. Zazwyczaj wykonują ją wojownicy przed bitwą, aby podnieść morale swoich towarzyszy i zastraszyć wroga. Taniec ukazuje siłę i sprawność wykonawców, jednocześnie umniejszając siłę oraz umiejętności przeciwnika."
 pa_defence: "Obrona pā"
 pa_defence_desc: "Pā to maoryska osada zbudowana w miejscu łatwym do obrony. Podobnie jak europejskie zamki, pā wznosi się po to, by zapewnić miejscowej ludności przetrwanie w czasie wojny. Umocnienia są solidne, a zarazem niedrogie — ich budowa i utrzymanie kosztują niewiele więcej niż w przypadku zwykłej wioski. Gdy nasi wrogowie będą głodować za murami, my nadal będziemy rozwijać się w bezpiecznym wnętrzu potężnej warowni."
 te_moko: "Tā moko"
 te_moko_desc: "Sztuka tatuowania jest szeroko praktykowaną tradycją w całej naszej krainie. Mężczyzna, który nie nosi na skórze śladów tuszu, ledwie zasługuje na to miano. Wzory wycinamy w skórze dłutami, ponieważ jesteśmy twardzi i niezłomni jak kamień, a blizny, które pozostają, przyjmujemy z dumą. Tradycyjne tatuaże są oznaką wielkiej siły i prestiżu, a słabi cudzoziemcy drżą, gdy ruszamy na nich do szarży z twarzami ozdobionymi znakami naszych bogów i przodków."
 maori_king: "Ruch na rzecz króla Maorysów"
 maori_king_desc: "W 1858 roku, na powszechne żądanie, wybrano króla Maorysów, który miał reprezentować wszystkie iwi, lecz nimi nie rządzić. Choć część odrzuciła władzę tak wybranego monarchy, wielu Maorysów poparło jego sprawę, widząc w niej sposób na powstrzymanie brytyjskich kolonistów przed odbieraniem ziem należących do Maorysów. Tak jak Wiktoria panowała nad wszystkimi Brytyjczykami, tak ten król miał reprezentować wszystkich Maorysów i umożliwić im prowadzenie równorzędnych negocjacji z Europejczykami wspólnym głosem."
 fijian_ideas: "Idee Fidżi"
 fijian_ideas_start: "Fidżyjskie czółno"
 fijian_ideas_bonus: "Ambicja Fidżi"
 fijian_crossroad: "Skrzyżowanie kultur"
 fijian_crossroad_desc: "Od stuleci Fidżi jest przystankiem dla niezliczonych wędrowców i żeglarzy przemierzających Pacyfik. Żyjemy pomiędzy wieloma cywilizacjami i wpływamy na nie równie mocno, jak one wpływają na nas. Musimy przyjmować przybyszów i włączać ich do naszej kultury, aby fidżyjski sposób życia mógł ewoluować wraz ze zmieniającymi się czasami."
 fijian_degel: "Lutunasobasoba i Degel"
 fijian_degel_desc: "Kaunitoni był legendarnym statkiem, który przywiózł naszych przodków, Lutunasobasobę i Degela, z odległych zachodnich krain na święte wybrzeża Fidżi. Po dotarciu na wyspy rozdzielili się oni na dwa plemiona: Lutunasobasoba został wodzem zachodu, a Degel — wschodu."
 fijian_conjoined: "Nierozerwalna wspólnota"
 fijian_conjoined_desc: "Mówi się, że fidżyjskie społeczeństwo i religia są ze sobą nierozerwalnie związane, a próba ich rozdzielenia przyniosłaby obu stronom nieodwracalne szkody. Rozdział religii i państwa może brzmieć postępowo w teorii, lecz w praktyce prawa regulujące nasze codzienne życie wywodzą się z mądrości wielkich proroków i bogów. Akceptujemy odmienne kultury, ale jeśli ich przedstawiciele chcą tu mieszkać i nazywać się Fidżyjczykami, muszą poznać naszych bogów i duchy."
 fijian_waqa: "Waqa drua"
 fijian_waqa_desc: "Drua to czółno zaprojektowane przez naszych przodków do przemierzania oceanu i prowadzenia wojny na morzu. Waqa drua jest największym i najwspanialszym pełnomorskim statkiem w całym znanym świecie, a inne królestwa drżą na widok zbliżającej się jednostki. Mistrzostwo w budowie statków i wojnie morskiej chroni Fidżi przed obcymi najeźdźcami. Dopóki nasze potężne siły morskie będą podtrzymywać tę tradycję, Fidżi zachowa suwerenność."
 fijian_warlords: "Fidżyjscy watażkowie"
 fijian_warlords_desc: "Górzyste ukształtowanie naszych wysp utrudnia zjednoczenie poszczególnych klanów. Wskutek tego rozdrobnienia nieustannie dochodzi do walk o terytorium. Część naszego społeczeństwa stale ściera się z innymi grupami, dlatego wojna nie jest jej obca."
 fijian_kai: "Kai Colo"
 fijian_kai_desc: "Jesteśmy zahartowanym ludem, a nasi wojownicy ćwiczą w surowym, górskim klimacie Fidżi. Kai Colo to mieszkańcy górskich obszarów wysp, dający nam najznakomitszych i najwytrzymalszych wojowników. Nie poddajemy się trudnym warunkom i potrafimy dostosować się do każdego terenu. Podczas wojny Kai Colo stawili opór znacznie bardziej zaawansowanemu przeciwnikowi w swoich górskich siedzibach. Była to walka o przetrwanie ludu Kai Colo — i, co nie dziwi, zwyciężyli nasi lepsi wojownicy."
 fijian_confederacy: "Konfederacja królestw"
 fijian_confederacy_desc: "Gdy my, Fidżyjczycy, próbowaliśmy sformalizować ustrój naszych rozproszonych państw, pojawiła się propozycja zjednoczenia wszystkich istniejących królestw Fidżi w konfederację. Każde zachowałoby pewną autonomię, pozostając jednocześnie częścią wspólnego organu rządzącego. Przyznanie lokalnym społecznościom samorządności sprzyja handlowi i tworzy zamożniejsze społeczeństwo."
 hawaiian_ideas: "Hawajskie idee"
 hawaiian_ideas_start: "Zew fal"
 hawaiian_ideas_bonus: "Hawajska ambicja"
 kapu_system: "Ochrona systemu kapu"
 kapu_system_desc: "System kapu to starożytny hawajski zbiór praw regulujących sposób życia, role płciowe, religię i rządy na wyspach. Kapu jest prawem religijnym, które narzuca ludowi wolę bogów. Chroni również święte miejsca Hawajów i zapobiega wycinaniu lasów oraz rabunkowej eksploatacji cennych zasobów dla doraźnych korzyści. Nikt nie jest zwolniony z przestrzegania kapu: ani pospólstwo, ani kupcy, ani zagraniczni goście, ani nawet król."
 alii_nui: "Nowa rola aliʻi nui"
 alii_nui_desc: "Aliʻi to hawajska klasa rządząca, a aliʻi nui jest osobą stojącą na jej czele. Przez długi czas aliʻi nui byli uznawani za najwyższych członków społeczeństwa, ponad którymi nie stały żadne osoby ani instytucje. Po zjednoczeniu Hawajów nie możemy po prostu usunąć dawnych władców poszczególnych regionów. Możemy jednak nadać urzędowi aliʻi nui świecki charakter i powierzyć mianowanie jego piastuna królowi Hawajów, umacniając naszą władzę bez antagonizowania aliʻi."
 hula_idea: "Hula"
 hula_idea_desc: "Hula to tradycyjny taniec, któremu często towarzyszy śpiew oli lub pieśń mele. Nie jest jednak jedynie tańcem czy występem. To sposób zachowywania naszej historii i kultury oraz opowiadania o przodkach i bogach. Oli lub mele opisuje słowami wydarzenia, a hula przekłada je na ruch. Gesty ciała i dłoni odzwierciedlają dosłowne znaczenie wypowiadanych lub śpiewanych słów, ale mogą też przedstawiać wydarzenia z opowieści, takie jak ruch fal czy gwałtowne emocje dawnych legendarnych bohaterów."
 ohana: "ʻOhana"
 ohana_desc: "ʻOhana to hawajska koncepcja rodziny, która od dawna wykracza poza więzy krwi. Rodzina może przybierać różne formy, a krewni adoptowani są równie ważni jak biologiczni. Wielcy władcy często przyjmowali zaufanych przyjaciół i sojuszników do swoich rodzin, traktując ich jak krewnych. Elastyczne rozumienie rodziny sprawia, że hawajskie społeczeństwo może przyjmować cudzoziemców i nieznajomych z otwartymi ramionami."
 kanawai_mamalahoe: "Kanawai Māmalahoe"
 kanawai_mamalahoe_desc: "„Ludu, czcij swego boga; szanuj zarówno możnych, jak i skromnych; niech każdy — starcy, kobiety i dzieci — może swobodnie wyjść na drogę i położyć się na niej bez obawy o krzywdę. Kto złamie to prawo, niech zginie”. Tak brzmi Prawo Rozłupanej Wiosła ustanowione przez króla Kamehamehę, stanowiące fundament naszego społeczeństwa. To rewolucyjne prawo uznaje świętość każdego ludzkiego życia, nawet życia naszych wrogów, i gwarantuje ochronę słabym oraz niewinnym przed zniszczeniem i cierpieniem wojny."
 naha_prophecy: "Przepowiednia Naha"
 naha_prophecy_desc: "Przepowiednia Naha głosi, że mężczyzna lub kobieta zdolni podnieść Kamień Naha są prawowitymi władcami całej Polinezji. Nasz władca wypełnił tę przepowiednię. Niektórzy mogą kwestionować nasze prawo do panowania nad Polinezją, lecz wkrótce przekonają się, że boska krew naszego rodu królewskiego od dawna przeznaczała go do zjednoczenia naszego ludu i zapewnienia Polinezji znaczącej pozycji na świecie."
 legendary_voyagers: "Legendarni żeglarze"
 legendary_voyagers_desc: "Nie sposób zliczyć przodków z całej Polinezji, którzy twierdzą, że pochodzą z Hawajów. Nie da się zaprzeczyć, że żeglowanie, odkrywanie i kolonizacja tkwią we krwi Hawajczyków. Słyszymy zew otwartego oceanu i odpowiadamy na niego. Dzięki starożytnym metodom nawigacji, opartym na obserwacji wędrówek ptaków i położenia gwiazd, możemy dotrzeć na krańce świata i wrócić, przywożąc wiedzę oraz bogactwa na wybrzeża naszej wspaniałej ojczyzny."
 tongan_ideas: "Idee Tongi"
 tongan_ideas_start: "Tongijski system trybutarny"
 tongan_ideas_bonus: "Ambicja Tongi"
 tonga_tangaloa: "Mitologia Tangaloa"
 tonga_tangaloa_desc: "Tangaloa to ród bogów o ogromnym znaczeniu dla naszego ludu. Pierwszym przedstawicielem dynastii Tangaloa był Eiki, kuzyn boga-stwórcy Havei Hikuleʻo i bohatera ludzkości, Maui. Istnieje wiele opowieści o czynach rodu Tangaloa, między innymi o bohaterze Eitumapuʻa, który wspiął się po potężnym drzewie żelaznym aż do niebios, odnalazł miłość swojego życia, Ilahevę, i spoczął u jej boku. Z ich miłości powstały dwie wyspy: Tala-kite i Mata-aho."
 tonga_pulotu: "Stworzenie Pulotu"
 tonga_pulotu_desc: "Na początku Pulotu wyciągnął z bezkresnego oceanu potężną skałę Touiaʻo Futuna. Na nowym lądzie pojawiły się cztery pary bliźniąt różnej płci. Każdy brat związał się ze swoją siostrą, a z ich boskiej krwi narodziły się cztery święte córki. Nasi najdawniejsi przodkowie łączą wszystkich ludzi, a któż lepiej niż Tonga może zachować przy życiu ich potomków? Z pewnością nasi trybutariusze i poddani zrozumieją, że to braterska i siostrzana miłość zbliża nas do dawnych bogów i przodków."
 tonga_maui: "Wyspy Maui"
 tonga_maui_desc: "To na Manuce w Samoa Maui otrzymał swój legendarny haczyk na ryby od samego Tonga Fusifonuy. Gdy wielki bohater wyruszył z nim na połów, nie wyciągnął z oceanu ryby, lecz naszą ojczystą wyspę Tongatapu, wydobytą z morskiego dna! Łowiąc dalej za pomocą magicznego haczyka, stworzył ʻEua i wiele innych mniejszych wysp naszego królestwa, a nawet część wysp Fidżi i Samoa. Jednak to Tongatapu, wyspa stołeczna naszego państwa, była pierwszą z wysp Maui. Boskie pochodzenie naszej ziemi z pewnością przyciągnie na nasze wybrzeża kolejnych kupców, osadników i możnych."
 tonga_polynesian: "Prawowici dziedzice Polinezji"
 tonga_polynesian_desc: "Podczas gdy inni mieszkańcy wysp Pacyfiku przyjmują zmiany, gdy cudzoziemcy przybywają na ich wybrzeża lub gdy sami docierają do obcych ziem, my nie ulegamy obcym zwyczajom. Jako Tongijczycy jesteśmy dumni z naszego dziedzictwa żeglarskiego i pozostajemy nieugięci niczym skała pośród zmiennych przypływów. Dopilnujemy, by nasz lud zachował tongijską tożsamość."
 tonga_tongatapu: "Dzwony Tongatapu"
 tonga_tongatapu_desc: "Możemy pochwalić się najwyższym na świecie stosunkiem liczby świątyń do liczby mieszkańców. Gdy statek zbliża się do wybrzeży Tongatapu, pośród szumu fal słychać dźwięk dzwonów i ciche modlitwy wiernych. Niezależnie od tego, czy praktykujemy dawną religię, czy nowe wierzenia przybyłe zza morza, wiara będzie jednoczyć nas, Tongijczyków, a każdy znajdzie miejsce, w którym będzie mógł właściwie czcić swoich bogów."
 tonga_craftsman: "Starożytne rzemiosło tongijskie"
 tonga_craftsman_desc: "Od niepamiętnych czasów zajmujemy się rzeźbieniem w kości i drewnie oraz wyplataniem koszy. Nasi znakomici rzemieślnicy przekazują swoje umiejętności z pokolenia na pokolenie tak długo, że można by uwierzyć, iż mamy je we krwi."
 tonga_oceanic_empire: "Imperium Oceanii"
 tonga_oceanic_empire_desc: "Tonga obejmuje ponad 170 wysp, a ich mieszkańców łączą dawne tradycje i zwyczaje. Ponadto Imperium Tonga pobiera daniny od Samoa, Fidżi i wielu państw położonych dalej. Dzięki naszej pomysłowości i zdolności jednoczenia ludzi na obszarze bezkresnego oceanu nie ma państwa lepszego od Imperium Tonga do rozszerzania wpływów na całą Oceanię."
 samoan_ideas: "Samoańskie idee"
 samoan_ideas_start: "Wybitne umysły Samoa"
 samoan_ideas_bonus: "Samoańska ambicja"
 samoa_musical: "Samoańska kultura muzyczna"
 samoa_musical_desc: "Muzyka jest nieodłączną częścią samoańskiej tożsamości. Kultywujemy dawne tradycje muzyczne, a nasze wyspy są domem niezliczonych utalentowanych śpiewaków, tancerzy i muzyków. Muzyka jest uniwersalnym językiem zrozumiałym dla wszystkich, a dzięki mistrzostwu w jego używaniu odnajdziemy jedność."
 samoa_faa: "Faʻa Samoa"
 samoa_faa_desc: "Faʻa Samoa to starożytny zbiór zasad wskazujących wszystkim Samoańczykom, jak żyć i rządzić swoim ludem. Trzy filary Faʻa Samoa to matai, czyli szlachta, aiga, czyli rodzina, oraz duchowieństwo. Na naszych wyspach żyje ponad 18 000 szlacheckich rodów, a wszystkie kierują się prostą filozofią Faʻa Samoa. Skodyfikowanie tego, co oznacza bycie Samoańczykiem, pozwala nam utrzymać królestwo rozciągające się na niezliczone wyspy rozdzielone oceanem."
 samoa_mauluulu: "Maʻuluʻulu"
 samoa_mauluulu_desc: "Maʻuluʻulu to dawny tradycyjny taniec wykonywany przede wszystkim przez samoańskie kobiety, choć w wielu wsiach tańczą razem kobiety i mężczyźni. Jest artystycznym przedstawieniem codziennego życia na Samoa: naśladuje ruchy związane z obowiązkami domowymi, uprawą roli, rybołówstwem i tradycyjnymi zwyczajami. W ten sposób nadajemy codziennym czynnościom wymiar kulturowy i czynimy je czymś wyjątkowym."
 samoa_foreign: "Przyjęcie zagranicznych misjonarzy"
 samoa_foreign_desc: "Choć pragniemy zachować naszą kulturę i dziedzictwo, nie sposób zaprzeczyć, że przybywający zza morza misjonarze i prorocy przynoszą wiedzę wykraczającą daleko poza to, co już posiadamy. Być może pozwalając im pozostać i praktykować własne zwyczaje, zdołamy przyswoić część tej mądrości. Nieco zachodnich wpływów nie powinno nam zaszkodzić."
 samoa_tatau: "Tatau"
 samoa_tatau_desc: "Starożytna sztuka tatau jest szeroko praktykowana w całym Trójkącie Polinezyjskim. Mistrzowie tatau posługują się narzędziami wykonanymi z kości, kłów, zębów, muszli i drewna. Proces jest długi, żmudny i bolesny, lecz zdobimy w ten sposób ciała na cześć naszych przodków i bogów, ukazując duchowość mężczyzny oraz jego przywiązanie do samoańskiego sposobu życia."
 samoa_faavae: "Faʻaʻavae i le Atua Samoa"
 samoa_faavae_desc: "Praktyki religijne naszego ludu różnią się doktryną i wyznaniem, lecz wszystkich łączy maksyma „Samoa jest ufundowana na Bogu”. Nie ma znaczenia, jaką religię wyznajemy, gdyż to samo Samoa jest święte pośród wszystkich bogów. Niedziela jest dniem odpoczynku dla wszystkich Samoańczyków — czasem na oddawanie czci wybranym bogom i spędzanie czasu z rodziną. Niezależnie od wyznawanej wiary, w Faʻa Samoa każdy jest akceptowany."
 samoa_trade: "Handel Trójkąta Polinezyjskiego"
 samoa_trade_desc: "Od lat samoańscy kupcy prowadzą handel na obszarze Trójkąta Polinezyjskiego, przede wszystkim z naszymi bliskimi sąsiadami — Fidżi i Tongą. Wiele społeczności zrezygnowałoby z handlu na tak rozległym oceanie, lecz nasi żeglarze i kupcy lepiej niż ktokolwiek inny rozumieją morskie prądy i fale. Niezależnie od wielkości naszego państwa będziemy pamiętać o technikach nawigacyjnych, które przyniosły Samoa bogactwo. Być może pewnego dnia nasza ojczyzna będzie czerpać korzyści z handlu cennymi towarami z całego świata…"
 estate_kahuna: "Kahuna"
 estate_tohunga: "Tohunga"
 estate_bete: "Bete"
 estate_taula_otua: "Taula ʻOtua"
 estate_taula_aitu: "Taula Aitu"
 estate_alii: "Aliʻi"
 estate_rangatira: "Rangatira"
 estate_eiki: "ʻEiki"
 estate_ratu: "Ratu"
 iroquoian_federation_ideas: "Idee Federacji Irokeskiej"
 iroquoian_federation_ideas_start: "Irokeskie tradycje"
 iroquoian_federation_ideas_bonus: "Irokeskie ambicje"
 iro_great_law_of_peace: "Wielkie Prawo Pokoju"
 iro_great_law_of_peace_desc: "Wielkie Prawo Pokoju, zwane również Wielkim Prawem Jedności, należy do naszej tradycji ustnej, a jego pełne wyrecytowanie zajmuje siedem lub osiem dni. Żyjemy w harmonii zgodnie z jego naukami."
 iro_tree_of_peace: "Drzewo Pokoju"
 iro_tree_of_peace_desc: "Wielki Rozjemca, założyciel naszej Konfederacji, zasadził drzewo o długich, zdrowych liściach, pod którego koroną schronienie mają znaleźć wszystkie nasze narody."
 iro_great_white_roots: "Wielkie Białe Korzenie"
 iro_great_white_roots_desc: "Korzenie Wielkiego Drzewa Pokoju łączą narody naszej Konfederacji, rozrastając się na północ, południe, wschód i zachód."
 iro_into_the_grave: "Do grobu"
 iro_into_the_grave_desc: "Każdy z narodów tworzących naszą Ligę miał wodza wojennego, którego tytuł towarzyszył mu aż do grobu. Ich chwała jest tak wielka, że sama ziemia doznaje zaszczytu, przyjmując ich szczątki."
 iro_the_good_word: "Dobre Słowo"
 iro_the_good_word_desc: "Dobra Nauka określa, czym jest prawe postępowanie, i zapewnia sprawiedliwość wszystkim naszym narodom. Nauka jest prawem."
 iro_sachems: "Sachemowie"
 iro_sachems_desc: "Sachemowie są przywódcami naszych plemion i strażnikami pokoju. Zasiadają w Radzie i dbają o zachowanie harmonii między naszymi narodami."
 iro_the_grand_council: "Wielka Rada"
 iro_the_grand_council_desc: "Rada jest wyrazem suwerenności naszego ludu. To tutaj spotykamy się, by realizować nasze ambicje. Rozszerzymy nasze panowanie na kolejne ziemie."
 siouan_federation_ideas: "Idee Federacji Siouańskiej"
 siouan_federation_ideas_start: "Siouańskie tradycje"
 siouan_federation_ideas_bonus: "Siouańskie ambicje"
 sio_great_spirit: "Wielki Duch"
 sio_great_spirit_desc: "Wielki Duch to święta boska siła obecna we wszystkim — potęga świętości, która stwarza, chroni i unicestwia wszelkie rzeczy."
 sio_tioshpayes: "Tioshpaye"
 sio_tioshpayes_desc: "Tioshpaye to rozbudowane rodziny naszego ludu. Przynależność do jednej z nich wzmacnia więzi wewnątrz plemion i zbliża nas do siebie."
 sio_between_the_rivers: "Między rzekami"
 sio_between_the_rivers_desc: "Rzeki Minnesota i Missouri nawadniają nasze ziemie. Ich wody zapewniają żyzność glebie i spokój naszemu narodowi, ponieważ wiemy, że dają nam wszystko, czego potrzebujemy."
 sio_trade_fairs: "Jarmarki handlowe"
 sio_trade_fairs_desc: "Nasi kupcy podróżują daleko, by uczestniczyć w jarmarkach handlowych organizowanych przez inne plemiona i samemu je urządzać. Relacje handlowe pomagają nam zaspokajać nasze potrzeby."
 sio_oyate: "Oyate"
 sio_oyate_desc: "Człowiek nie może żyć samotnie — a gdyby nawet mógł, nie byłoby to prawdziwe życie. Oyate to plemię, wspólnota, do której się należy. Wśród innych oyate znajdujemy ochronę i radę."
 sio_until_death_and_after: "Aż po śmierć i dalej"
 sio_until_death_and_after_desc: "Wśród naszego ludu krąży stare przysłowie: „Dziś jest dobry dzień, by umrzeć”. Oznacza ono, że śmierć może nadejść bez ostrzeżenia, dlatego powinniśmy być gotowi ją przyjąć, broniąc naszych rodzin i domostw."
 sio_across_the_land: "Przez rozległe ziemie"
 sio_across_the_land_desc: "Latem wędrujemy na zachód, a zimą na wschód. Gdy słońce stoi najwyżej, polujemy na bizony, po czym wracamy do lasów, by znaleźć schronienie przed chłodem."
 eastern_algonquian_federation_ideas: "Idee wschodnioalgonkińskie"
 eastern_algonquian_federation_ideas_start: "Tradycje wschodnioalgonkińskie"
 eastern_algonquian_federation_ideas_bonus: "Ambicje wschodnioalgonkińskie"
 ealg_corn_beans_and_squash: "Kukurydza, fasola i dynia"
 ealg_corn_beans_and_squash_desc: "Kukurydza, fasola, dynia. To są trzy główne składniki naszej codziennej diety. Ich uprawa sama w sobie jest świętym błogosławieństwem dla naszego narodu."
 ealg_seasonal_economy: "Gospodarka sezonowa"
 ealg_seasonal_economy_desc: "W trudnych czasach musimy nauczyć się znosić trudy życia. Życie zaś jest nierozerwalnie związane z naturą. Zmiana pór roku oznacza również zmianę naszych zwyczajów. Wioski muszą być równie tymczasowe i ruchome jak pogoda."
 ealg_slash_and_burn: "Rolnictwo żarowe"
 ealg_slash_and_burn_desc: "Istnieje technika uprawy polegająca na wypalaniu roślinności, by uzyskać bogatą w składniki odżywcze warstwę popiołu użyźniającą glebę. Przekonaliśmy się, że dzięki tej metodzie ziemia staje się silniejsza. Być może dlatego, że pamięta, jak to jest zostać złamaną."
 ealg_fishing_habits: "Zwyczaje rybackie"
 ealg_fishing_habits_desc: "Czasami trudno uwierzyć, że niektórzy z naszych ludzi urodzili się na lądzie, a nie w wodzie. Pływają z taką zwinnością, że niemal nie sposób odróżnić ich od nurtu rzeki."
 ealg_whale_hunters: "Łowcy wielorybów"
 ealg_whale_hunters_desc: "Wieloryby, morświny, morsy, foki — polujemy na wszystko, co daje nam morze i co przewyższa nas rozmiarami, siłą głosu oraz naszą nieostrożną dumą. Wszystko, co daje nam morze, staje się naszą zdobyczą."
 ealg_white_tialed_deer: "Jelenie wirginijskie"
 ealg_white_tialed_deer_desc: "Podążamy ich tropem, obserwujemy ich ostrożność i zazdrościmy im gracji. Każda część jelenia ma wartość. Polujemy na nie dla mięsa, a ich skóry suszymy, by okrywać nimi własne ciała."
 ealg_back_before_spring: "Powrót przed wiosną"
 ealg_back_before_spring_desc: "Wiosną podążamy ku wybrzeżu za rozkwitającymi łąkami. Łowimy stynki, jesiotry i łososie. Latem zbieramy jagody w ciepłych promieniach słońca. Jesienią polujemy, a zimą, gdy spada pierwszy śnieg, szukamy schronienia przy przytulnych ogniskach."
 central_algonquian_federation_ideas: "Idee środkowoalgonkińskie"
 central_algonquian_federation_ideas_start: "Tradycje środkowoalgonkińskie"
 central_algonquian_federation_ideas_bonus: "Ambicje środkowoalgonkińskie"
 calg_fur_trade: "Handel skórami"
 calg_fur_trade_desc: "Handel futrami z innymi plemionami i cudzoziemcami stanowi istotną część naszej gospodarki. Jesteśmy dumni z umiejętności łowieckich, dzięki którym możemy dostarczać futra najwyższej jakości."
 calg_midewiwin: "Midewiwin"
 calg_midewiwin_desc: "Właściwa droga prowadzi nas ku wiecznemu spokojowi. Ścieżka serca jest nieprzenikniona i nieprzewidywalna, lecz obowiązkiem najmądrzejszych spośród nas jest pomagać nam ją rozpoznawać."
 calg_medicinal_infusions: "Napary lecznicze"
 calg_medicinal_infusions_desc: "Lecznicze właściwości niektórych roślin od stuleci pomagają naszemu ludowi przezwyciężać rozmaite choroby. Mówi się, że napary z wybranych liści mogą wydłużyć życie naszych ludzi."
 calg_seven_fires_prophecy: "Przepowiednia Siedmiu Ognisk"
 calg_seven_fires_prophecy_desc: "Każde ognisko z przepowiedni symbolizuje ważną naukę duchową i wyznacza epokę, która nadejdzie, a następnie przeminie. Podążając za tymi wskazówkami, uchronimy świat przed zgorzknieniem wywołanym brakiem szacunku."
 calg_teaching_scrolls: "Zwoje nauk"
 calg_teaching_scrolls_desc: "Niewiele rzeczy ma większą moc niż wiedza. Gromadzimy ją i zapisujemy nasze nauki na zwojach z kory brzozowej, które przechowujemy w bezpiecznym miejscu i wykorzystujemy głównie podczas ceremonii."
 calg_copper_weaponry: "Miedziana broń"
 calg_copper_weaponry_desc: "Materiał jest równie ważny jak narzędzie. Nasza broń jest skuteczna nie tylko dzięki dłoniom, które nią władają, lecz także dzięki wysokiej jakości miedzi, z której ją wykuwamy."
 calg_land_of_the_dawn: "Kraina świtu"
 calg_land_of_the_dawn_desc: "Od tysięcy lat nasz lud handluje na całym kontynencie, migruje i podróżuje, znajduje nowe domy, opuszcza je, by w końcu odnaleźć prawdziwą ojczyznę. Przemieszczamy się szlakami kajakowymi na północ, południe, zachód i wschód. I będziemy robić to nadal."
 muskogean_federation_ideas: "Idee Federacji Krików"
 muskogean_federation_ideas_start: "Tradycje Krików"
 muskogean_federation_ideas_bonus: "Ambicje Krików"
 mus_totem_animals: "Zwierzęta totemiczne"
 mus_totem_animals_desc: "Tradycyjna organizacja naszych plemion opiera się na klanach, z których każdy nosi imię swojego zwierzęcia totemicznego. Zwierzęta te są naszymi przewodnikami i mentorami, dzielącymi się mądrością z całym narodem."
 mus_embroidered_skin: "Skóra ozdobiona wzorami"
 mus_embroidered_skin_desc: "Wizerunek stworzenia zawiera cząstkę jego istoty. Ozdabiając ciała tatuażami, przyswajamy naszej skórze cechy świata przyrody."
 mus_green_corn_ceremony: "Ceremonia Zielonej Kukurydzy"
 mus_green_corn_ceremony_desc: "W środku lata, gdy zebrano już pierwsze plony, nasz lud gromadzi się na placu wioski, by świętować nowe początki. W tych dniach odnowa obejmuje nie tylko przyrodę — wybaczamy również wszelkie krzywdy i urazy."
 mus_valiant_in_war: "Męstwo w boju"
 mus_valiant_in_war_desc: "Legenda o naszych wojownikach dociera na pole bitwy, zanim oni sami się na nim pojawią. Ich odwaga idzie w parze z dumą ze służby naszemu znamienitemu narodowi."
 mus_the_great_ball_game: "Wielka gra w piłkę"
 mus_the_great_ball_game_desc: "W czasie wojny troski naszego ludu narastają — obawiamy się śmierci, żałoby i głodu. Naszym obowiązkiem jest jednak świętować czasy pokoju z równie wielkimi emocjami. Muzyka, gry i festiwale pomagają nam podtrzymywać ducha."
 mus_red_and_white_towns: "Czerwone i Białe Miasta"
 mus_red_and_white_towns_desc: "Niektóre z naszych miast mogą poszczycić się przynależnością do jednej z dwóch kategorii: Czerwonych lub Białych Miast. W Czerwonych odbywają się ceremonie wojenne, natomiast Białe służą pokojowym rytuałom."
 mus_meritocratic_leadership: "Przywództwo merytokratyczne"
 mus_meritocratic_leadership_desc: "Osiągnięcie celu przynosi większą satysfakcję niż otrzymanie go w darze. Nasze plemię wierzy, że za prawdziwy wysiłek należy nagradzać większą odpowiedzialnością i władzą."
 generic_federation_ideas: "Federacyjne idee"
 generic_federation_ideas_start: "Federacyjne tradycje"
 generic_federation_ideas_bonus: "Federacyjne ambicje"
 fed_council_of_elders: "Rada Starszych"
 fed_council_of_elders_desc: "Rząd naszej Federacji ma zapewnić wszystkim tworzącym ją narodom głos i udział w podejmowaniu decyzji. Wspólne zarządzanie naszymi ziemiami pozwoli nam uwzględniać nowe perspektywy."
 fed_great_chief: "Wielki Wódz"
 fed_great_chief_desc: "Jako przywódcy naszego związku musimy zadbać o bezpieczeństwo każdego plemienia znajdującego się pod naszym zwierzchnictwem. Możemy spać spokojnie, wiedząc, że Wielki Wódz czuwa nad nami."
 fed_petroglyphs: "Petroglify"
 fed_petroglyphs_desc: "Wyobrażenie staje się namacalne, gdy zostaje utrwalone w materii. Rzeźbienie w kamieniu pozwala przedstawić nasze najgłębsze przekonania w świętej i widocznej formie."
 fed_sign_language: "Rdzenne języki migowe"
 fed_sign_language_desc: "Zamieszkujemy rozległą krainę, tak rozległą jak droga słońca i podążającego za nim księżyca. Słowa nie są w stanie pokonać takich odległości, zwłaszcza między oddalonymi plemionami. Dlatego rozwinęliśmy język migowy, który służy naszym narodom jako wspólny język."
 fed_gender_parity: "Równość płci"
 fed_gender_parity_desc: "Niezależnie od tego, czy nasze plemiona kierują się dziedziczeniem matrylinearnym, czy patrylinearnym, obie płcie w znacznym stopniu uczestniczą w rządzeniu plemieniem i mają wpływ na podejmowane decyzje."
 fed_little_brother_of_war: "Młodszy brat wojny"
 fed_little_brother_of_war_desc: "Przemoc nie zawsze jest rozwiązaniem. Zdrowa rywalizacja sportowa może być innym sposobem sprawdzenia umiejętności naszych plemion."
 fed_sunrise_invasion: "Inwazja o świcie"
 fed_sunrise_invasion_desc: "Słońce rodzi się na wschodzie, a jego świetlista kolebka spoczywa w odległej krainie za oceanem. Pragnienie odnalezienia jej poprowadzi nas ku światłu."
 aotearoa_nation_title: "Utwórz Aotearoa"
 aotearoa_nation_desc: "To my staliśmy się iwi, które zjednoczy je wszystkie pod wspólnym sztandarem. Narodziny Aotearoa zaczynają się dzisiaj!"
 unite_hawaii_title: "Zjednocz Hawaje"
 unite_hawaii_desc: "Wyspy zostały wreszcie zjednoczone pod berłem jednego władcy. Przed nami nowa era dobrobytu."
 unite_fiji_title: "Zjednocz Fidżi"
 unite_fiji_desc: "Klany ponownie stanowią jedność i możemy przyjąć tytuł władców Fidżi."
 polynesian_navy_build_title: "Ludy Oceanii"
 polynesian_navy_build_desc: "Niezależnie od tego, którą wyspę Polinezyjczycy nazywają domem, wszystkich łączy duchowa więź z morzem. Żeglowanie często uznaje się za świętą tradycję, a w niektórych społecznościach czółno żeglarza postrzegane jest jako przedłużenie jego własnego ciała. W skrajniejszych przypadkach przypisuje mu się manę, a nawet własną duszę, uznając je za byt suwerenny i święty."
 polynesian_grand_navy_title: "Trójkąt Polinezyjski"
 polynesian_grand_navy_desc: "Trójkąt Polinezyjski to obszar Oceanu Spokojnego zamieszkany przez Polinezyjczyków. Jego wierzchołki wyznaczają Hawaje, Aotearoa na zachodzie oraz Rapa Nui na wschodzie. Polinezyjscy kupcy i żeglarze wykorzystywali ten obszar do handlu, odkrywania nowych ziem i kolonizacji. Rdzenni mieszkańcy Polinezji nazywali ten region ośmiornicą, nawiązując do licznych niewidzialnych szlaków przemierzanych przez nawigatorów. Ośmiornica ta ma w polinezyjskich kulturach różne nazwy, między innymi Taumata-Feʻe-Faʻatupu-Hau, czyli Wielka Ośmiornica Dobrobytu — symbol bogactw, jakie przynoszą społeczeństwu odkrycia i handel."
 gain_mana_title: "Zdobądź manę"
 gain_mana_desc: "Mana jest w przybliżeniu odpowiednikiem zachodniego pojęcia duszy lub ducha. Oznacza jednak również miarę prestiżu i pobożności człowieka. Człowiek honorowy posiada wiele many, podczas gdy osoba o niższym statusie ma jej niewiele. W niektórych społeczeństwach ktoś oddany modlitwie i gromadzeniu many może zyskać przychylność bogów oraz prosić ich o dokonywanie cudów, takich jak zmiana pogody czy wynurzanie wysp z oceanu. Stąd właśnie bierze się błędne zachodnie utożsamianie many z magią."
 centralize_the_realm_title: "Scentralizuj państwo"
 centralize_the_realm_desc: "Cieszymy się szacunkiem jako władcy, lecz musimy zwiększyć naszą potęgę, skupiając władzę w swoich rękach i modernizując sposób rządzenia poddanymi."
 shipbuilders_title: "Budowniczowie statków"
 shipbuilders_desc: "Życie na wyspach uzależnia nas od statków. Choć nasze tradycje koncentrują się wokół szkutnictwa, musimy stworzyć odpowiednie zaplecze dla dalszej ekspansji."
 expand_trade_routes_title: "Rozbuduj szlaki handlowe"
 expand_trade_routes_desc: "Aby zwiększyć nasze bogactwo, musimy stać się centrum handlu w regionie. Nasi kupcy nie mogą spocząć."
 own_cot_title: "Zdobądź centrum handlu"
 own_cot_desc: "Istnieje kilka miejsc, którym bogowie pobłogosławili, sprawiając, że handel rozwija się w nich niemal samoistnie. Musimy je zdobyć za wszelką cenę, aby zdominować wymianę handlową."
 absolute_rule_title: "Władza absolutna"
 absolute_rule_desc: "Nasza potęga nie będzie niezrównana, dopóki nie obejmiemy skutecznej kontroli nad co najmniej połową kraju."
 loyal_subjects_title: "Lojalni poddani"
 loyal_subjects_desc: "Stany mogą być zarówno użyteczne, jak i niebezpieczne, jeśli pozostawi się je bez kontroli. Dobrze oddaje to powiedzenie: „Trzymaj przyjaciół blisko, a wrogów jeszcze bliżej”."
 island_hopping_title: "Od wyspy do wyspy"
 island_hopping_desc: "Przemieszczając się z jednej wyspy na drugą, nasz lud nieustannie rozszerza swoje wpływy w całym Trójkącie Polinezyjskim."
 fiji_drua_builders_title: "Budowniczowie drua"
 fiji_drua_builders_desc: "Choć drua są powszechnym typem jednostek w Trójkącie Polinezyjskim, wywodzą się z naszych ziem. Jako ich pierwsi konstruktorzy nadal słyniemy z najlepszego rzemiosła. Z naszych wysp eksportujemy wiele drua do innych państw. Być może lepsza infrastruktura pozwoli nam jeszcze bardziej wzbogacić naszą społeczność."
 fiji_vunivalu_title: "Fidżyjski vunivalu"
 fiji_vunivalu_desc: "Zgodnie z naszą tradycją przywódców wojskowych nazywa się vunivalu, czyli watażkami. Gdy mężczyzna udowodni swoją wartość, prowadząc ludzi do bitwy i wracając z niej zwycięsko, plemię nadaje mu tytuł vunivalu. Powinniśmy pokazać wszystkim, że każdy wojownik w naszych szeregach może go zdobyć."
 fiji_island_lords_title: "Władcy wysp"
 fiji_island_lords_desc: "Okazując naszą siłę i wzbudzając w nich strach, możemy przejąć władzę nad tymi wyspami."
 fiji_one_nation_title: "Jeden naród"
 fiji_one_nation_desc: "Wyspy Viti były podzielone między klany przez wiele pokoleń — od chwili, gdy nasi przodkowie po raz pierwszy dotarli do tych wybrzeży. Spełniliśmy marzenia naszych praojców i zjednoczyliśmy lud pod berłem jednego władcy."
 hawaii_ahupuaa_system_title: "System ahupuaʻa"
 hawaii_ahupuaa_system_desc: "System ahupuaʻa został opracowany przez Umiego-a-Liloę jako sposób organizacji hawajskiego społeczeństwa wokół trzech prostych wartości. Pierwszą z nich jest aloha — zasada wzajemnego szacunku, którego przestrzegania wymaga się od każdego Hawajczyka. Szczegółowe reguły aloha zależą od płci i pozycji społecznej. Drugą wartością jest laulima, czyli współpraca. Dosłownie oznacza „wiele rąk” i opisuje wkład każdego Hawajczyka w pomyślność królestwa. Wykonywanie własnych obowiązków i współdziałanie leży w interesie wszystkich. Ostatnią wartością jest mālama, czyli troskliwa opieka. Osoba praktykująca mālama jest uważna, opiekuńcza i dba o swoją społeczność oraz rodzinę. Przestrzegając tych trzech zasad ahupuaʻa, osiągamy pono — życie w doskonałej równowadze."
 hawaii_please_the_kaha_title: "Zyskaj przychylność Ka Ha"
 hawaii_please_the_kaha_desc: "Nasze społeczeństwo wierzy w wielu bogów i boginie, lecz najważniejsi są Kāne, Kū, Lono i Kanaloa. Aby zyskać ich przychylność, musimy powierzyć dowództwo nad naszymi armiami odpowiedniemu generałowi."
 hawaii_lift_naha_title: "Podnieś Kamień Naha"
 hawaii_lift_naha_desc: "Kamień Naha jest świętym symbolem klanu Naha na Wielkiej Wyspie. Wierzy się, że pozwala rozpoznać, czy nowo narodzone dziecko należy do prawowitej linii rodowej klanu. Jego moc sięga jednak znacznie dalej: ten, kto zdoła podnieść kamień, jest przeznaczony do władania całym archipelagiem."
 hawaii_prove_prowess_title: "Udowodnij swoją wartość"
 hawaii_prove_prowess_desc: "Władca, który zjednoczy archipelag w jedno państwo, otrzyma błogosławieństwo bogów. Jako władca [Root.GetName] mam obowiązek doprowadzić do zjednoczenia wszystkich wysp."
 maori_haka_title: "Wykonaj hakę"
 maori_haka_desc: "Haka jest w naszej kulturze tańcem ceremonialnym, często wykorzystywanym do rzucania wyzwania rywalom. Wykonując hakę, pokazujemy wrogom, że zupełnie się ich nie boimy. Niech spróbują nas pokonać — jeśli mają odwagę."
 maori_riri_title: "Wojny riri"
 maori_riri_desc: "Riri oznacza gniew, walkę i wściekłość; to przemoc, agresja i zaciekłość. Właśnie poprzez riri okazujemy naszą potęgę i zdobywamy pozycję władców innych iwi i plemion."
 maori_ka_mate_title: "Ka Mate!"
 maori_ka_mate_desc: "Ka Mate to haka skomponowana jako pochwała życia nad śmiercią. Wyruszyliśmy na wojnę i wielu naszych synów zginęło, lecz ostatecznie nasze iwi podporządkowało sobie inne. Nadszedł czas, by opłakać poległych i uczcić tych, którzy przetrwali."
 maori_colonize_southern_island_title: "Zasiedl Południową Wyspę"
 maori_colonize_southern_island_desc: "Południowa Wyspa jest rozległa, lecz słabo zaludniona. Możemy założyć tam nowe osady, które przyczynią się do jej rozwoju."
 samoa_tonga_title: "Odzyskaj należne nam miejsce"
 samoa_tonga_desc: "Samoa było pierwszym centrum Trójkąta Polinezyjskiego, zanim wzrosła potęga Tonga. Niemal każda wyspa na Oceanie Spokojnym została skolonizowana z naszych pięknych wysp. Musimy odzyskać dawną chwałę."
 samoa_culture_title: "Kultura samoańska"
 samoa_culture_desc: "Niegdyś wszystkie okoliczne narody patrzyły na nas z podziwem, tak wspaniałe były nasza kultura i tradycje. Lata bratobójczych walk sprawiły, że utraciliśmy pozycję kulturalnej latarni Trójkąta Polinezyjskiego. Musimy ją odzyskać!"
 samoa_army_title: "Armia Samoa"
 samoa_army_desc: "Otaczające nas państwa uznają naszą pozycję przywódców kulturalnych Trójkąta Polinezyjskiego. Mamy jednak większe ambicje. Musimy stworzyć wielką armię, aby nasze przywództwo nie ograniczało się do kultury, lecz przerodziło się w prawdziwą hegemonię."
 samoa_empire_title: "Imperium Samoa"
 samoa_empire_desc: "Samo bycie centrum Trójkąta Polinezyjskiego nie wystarcza temu, na co zasługujemy. Zaszliśmy już zbyt daleko, by się wycofać. Musimy bezpośrednio kontrolować te ziemie i sprawować nad nimi władzę."
 tonga_samoa_title: "Samoa pod panowaniem Tonga"
 tonga_samoa_desc: "Tonga jest najpotężniejszym państwem Trójkąta Polinezyjskiego, lecz niektóre wyspy zdają się zapominać o swoim miejscu w hierarchii. Musimy przypomnieć tym narodom, że oczekujemy od nich daniny. Pierwszym celem powinno być Samoa, tradycyjne centrum kultury Pacyfiku."
 tonga_fijian_tributes_title: "Daniny z Fidżi"
 tonga_fijian_tributes_desc: "Skoro Samoa jest już nam posłuszne, kolejnym wielkim państwem, które musimy podporządkować, jest Viti. Wyspy te zazwyczaj są podzielone między kilku wodzów. Nie ma to dla nas znaczenia — zjednoczone czy rozdrobnione, wszystkie muszą nam być posłuszne."
 tonga_tui_tonga_title: "Imperium Tuʻi Tonga"
 tonga_tui_tonga_desc: "Najważniejsze wyspy Trójkąta Polinezyjskiego są już naszymi poddanymi. Nadszedł czas ekspansji i podporządkowania sobie wszystkich pozostałych."
 tonga_supremacy_title: "Dominacja Tonga"
 tonga_supremacy_desc: "Trójkąt Polinezyjski nie zna potęgi większej od naszej. Chwała należy do nas!"
 polynesian_supremacy: "Dominacja Polinezji"
 desc_polynesian_supremacy: "Żelazną ręką rządzimy Trójkątem Polinezyjskim."
 colonization_efforts: "Wysiłki kolonizacyjne"
 desc_colonization_efforts: "Wraz ze wzrostem liczby ludności brak miejsca i ziem uprawnych może stać się okazją do zasiedlania nowych obszarów. Zakładanie nowych osad pozwoli nam zachęcać ludzi do migracji."
 absolute_rule_mod: "Władza absolutna"
 desc_absolute_rule_mod: "Sprawujemy absolutną władzę nad naszym państwem."
 loyal_subjects_mod: "Lojalni poddani"
 desc_loyal_subjects_mod: "Nasi poddani są nam wierni, dzięki czemu możemy skuteczniej egzekwować naszą władzę."
 string_sacred_area_fijian: "Nananga"
 string_sacred_area_hawaiian: "Heiau"
 string_sacred_area_polynesian: "Marae"
 string_dance_fijian: "Meke"
 string_dance_hawaiian: "Hula"
 string_dance_maori: "Haka"
 string_dance_samoan: "Taualuga"
 string_dance_tongan: "Tauʻolunga"
 polynesian.1.t: "Święte miejsce wymaga oczyszczenia"
 polynesian.1.d: "Bogactwo naszej krainy przynosi nam wiele błogosławieństw, lecz tym razem — częściowo z naszej winy — las niemal całkowicie pochłonął nasze [Root.GetPolynesianSacredArea]. Wielu członków społeczności uważa, że miejsce to przestało być tapu, czyli święte, i że [Root.Monarch.GetName] powinien coś z tym zrobić."
 polynesian.1.a: "Wyślemy ludzi, by oczyścili ten teren i przywrócili mu status tapu."
 polynesian.1.b: "Dlaczego mielibyśmy się tym przejmować? To po prostu miejsce, w którym jest mniej drzew."
 polynesian.2.t: "Nieudane tańce"
 polynesian.2.d: "Podczas jednej z licznych uroczystości, gdy tancerze wykonywali tradycyjny taniec [Root.GetPolynesianDance], doszło do kłótni. Dwóch wykonawców zaczęło oskarżać się nawzajem o zazdrość. Sprawa powinna skończyć się na zwykłej anegdocie, lecz szybko przybrała poważny obrót i rodziny tancerzy stanęły przeciwko sobie. Zanim poleje się krew, [Root.Monarch.GetName] podejmuje działanie."
 polynesian.2.a: "Opowiedzmy się po stronie jednego z tancerzy."
 polynesian.2.b: "Spróbujmy rozwiązać spór na drodze dyplomacji."
 polynesian.3.t: "Zaginiona packa z piór"
 polynesian.3.d: "W całym Trójkącie Polinezyjskim wysokiej rangi wodzowie używają packi z piór podczas ceremonii. Dziś nasz władca [Root.Monarch.GetName] ma być główną postacią uroczystości, lecz [Root.Monarch.GetHerHis] packa zaginęła, a służba nie może jej odnaleźć. Nie ma czasu na wykonanie nowej, ponieważ ceremonia zaraz się rozpocznie. Jeśli nie rozwiążemy tego problemu, wywoła on wielkie zamieszanie."
 polynesian.3.a: "Znajdźmy zastępstwo — nikt się nie zorientuje."
 polynesian.3.b: "Stracimy twarz, jeśli potraktujemy naszych poddanych jak głupców."
 polynesian.4.t: "Kultura kavy"
 polynesian.4.d: "Zalanie suszonych korzeni pieprzu metystynowego wodą pozwala uzyskać odurzający napój zwany kava. Kava odgrywa kluczową rolę w większości ceremonii w całym Trójkącie Polinezyjskim, a jej spożywaniu towarzyszy rozbudowany rytuał z rygorystycznymi zasadami i ustaloną kolejnością czynności. Ponieważ sposób przygotowania napoju nie jest ściśle określony, jego jakość i działanie mogą się znacznie różnić. Ostatnia uroczystość, na którą zaprosiliśmy ważnych członków naszych społeczności oraz sąsiednich ludów, okazała się wielkim sukcesem dzięki wysokiej jakości podanej kavy. Nasza sława jako gospodarzy znacznie wzrosła."
 polynesian.4.a: "To doskonała okazja, by zyskać nowych przyjaciół."
 good_kava_mod: "Wielka uroczystość"
 desc_good_kava_mod: "Nasza sława znakomitych gospodarzy poprawiła opinię innych o nas."
 polynesian.5.t: "Tkanina tapa najwyższej jakości"
 polynesian.5.d: "Tapa to tkanina wyrabiana z kory, wytwarzana przez większość ludów zamieszkujących wyspy Pacyfiku. Służy do wielu celów, przede wszystkim do produkcji odzieży, ale także pięknych ozdób, cenionych za jakość wykonania. Tapę można zdobić i barwić; powstaje z kory morwy papierowej. W każdej wiosce i osadzie nieustannie słychać odgłos ubijanej kory, z której powstaje tkanina. Ostatnio nasza tapa cieszy się ogromnym popytem ze względu na wyjątkową jakość."
 polynesian.5.a: "To dobra okazja, by się wzbogacić."
 quality_tapa_mod: "Tkanina tapa najwyższej jakości"
 desc_quality_tapa_mod: "Nasza tapa słynie w całym Trójkącie Polinezyjskim, a popyt na nią gwałtownie wzrósł."
 polynesian.6.t: "Próba zamachu"
 polynesian.6.d: "Sennit to rodzaj sznura wyrabianego z suszonych włókien, najczęściej łupin orzecha kokosowego lub traw. W całym regionie wykorzystuje się go do produkcji różnych tkanin, zwłaszcza kapeluszy, ale także w tradycyjnym budownictwie, szkutnictwie, rybołówstwie i zdobnictwie. Nikt nie uznałby go za narzędzie zbrodni, lecz ludzka pomysłowość nie zna granic: zamachowiec postanowił udusić naszego władcę [Root.Monarch.GetName] właśnie sznurem sennit."
 polynesian.6.a: "Zabij go."
 polynesian.7.t: "Obserwatorzy gwiazd"
 polynesian.7.d1: "Niebo pełne jest gwiazd układających się w kształty przypominające rozmaite przedmioty, które pomagają naszym żeglarzom w nawigacji. Manaiakalani, czyli Żyłka Wędkarska Wodza, przypomina haczyk Maui; Heiheionakeiki służy do wyznaczania kursu na Tahiti; a Ke Ka o Makaliʻi, czyli Czerpak Łodzi Makaliʻi, przypomina misę wylewającą wodę na horyzont… Ludzie znający te układy gwiazd są niezwykle cenni dla społeczności."
 polynesian.7.d2: "Niebo pełne jest gwiazd układających się w kształty przypominające rozmaite przedmioty, które pomagają naszym żeglarzom w nawigacji. Ludzie znający te układy gwiazd są niezwykle cenni dla społeczności."
 polynesian.7.a: "Wiedza jest zawsze mile widziana."
 polynesian.8.t: "Wojny o świnie"
 polynesian.8.d: "Gdy nasi przodkowie kolonizowali te wyspy, przywieźli ze sobą dwa zwierzęta hodowlane: kury i świnie. Świnie są tradycyjnie bardzo cenione — nie tylko ze względu na smaczne mięso, lecz także dlatego, że stanowią jego obfite źródło, a posiadanie licznego stada jest oznaką potęgi. Dwie grupy mieszkańców zwróciły się do [Root.Monarch.GetName], oskarżając się nawzajem o kradzież świń. Sprawa budzi wiele emocji i nasz władca powinien zareagować."
 polynesian.8.a: "Wybierzemy stronę."
 polynesian.8.b: "To tylko świnie."
 pig_sides_mod: "Opowiedzieliśmy się po jednej ze stron wojny o świnie"
 desc_pig_sides_mod: "Nasze poparcie dla jednej ze stron konfliktu wywołało pewne niepokoje."
 pig_neutral_mod: "Zachowaliśmy neutralność w wojnie o świnie"
 desc_pig_neutral_mod: "Nikt nie jest zadowolony z naszej decyzji, ale przynajmniej nikt nie prowadzi wojny."
 polynesian.9.t: "Wspomnienia o Hawaiki"
 polynesian.9.d: "Według naszych legend, zanim dotarliśmy na te wybrzeża, nasz lud zamieszkiwał krainę zwaną Hawaiki, z której wszyscy pochodzimy. Dla niektórych jest ona również zaświatami, do których udają się nasi zmarli. Niezależnie od tego, mieszkańcy Hawaiki byli szczęśliwi, a żywności nigdy tam nie brakowało. Dlatego nasz lud tęskni czasem za miejscem, którego nigdy nie widział. Utracona ojczyzna przyciąga nas w sposób niemal nadprzyrodzony."
 polynesian.9.a: "To miejsce brzmi jak raj."
 polynesian.10.t: "Słodkie zagrożenie"
 polynesian.10.d: "Nasi przodkowie przywieźli trzcinę cukrową na swoich wakach, czyli czółnach, a nasze społeczności od dawna uprawiają ją i szeroko wykorzystują. Przybył z nią jednak również nieproszony gość: szczury. Nasze psy są gotowe z nimi walczyć, lecz tym razem liczba gryzoni wymknęła się spod kontroli i ponieśliśmy ogromne straty na polach trzciny cukrowej. Zaniepokojona społeczność przybyła błagać nas o pomoc. Jako władcy musimy udzielić odpowiedzi."
 polynesian.10.a: "Musimy coś zrobić — spuśćmy psy ze smyczy!"
 polynesian.10.b: "Nie sądzę, byśmy mogli wiele zdziałać."
 sugarcane_lost_mod: "Trzcina cukrowa zniszczona przez szczury"
 desc_sugarcane_lost_mod: "Plaga szczurów zniszczyła nasze pola trzciny cukrowej."
 polynesian.11.t: "Najlepszy przyjaciel"
 polynesian.11.d: "Od czasu zasiedlenia pierwszych wysp psy towarzyszą nam jako wierni przyjaciele, ale także jako źródło pożywienia. Niemal każda wyspiarska społeczność ma własną rasę psów: poi na Hawajach, kuri w Aotearoa czy psy z Tahiti. Gdy potrzebujemy żywności, psy nie zawsze są pierwszym wyborem, lecz karmi się je warzywami lub rybami, aby były gotowe na taką ewentualność."
 polynesian.11.a: "Psy są dobrym źródłem pożywienia."
 polynesian.12.t: "Wyścig wak"
 polynesian.12.d: "Nasz lud wykorzystywał waki, czyli czółna, do zasiedlania tej części świata. Waki są na wiele sposobów centralnym elementem naszej kultury. Zawody stanowią łatwy sposób na zapewnienie rozrywki mieszkańcom, a przy okazji pomagają utrzymać ich w dobrej kondycji. Jedna grupa wioślarzy rzuciła drugiej wyzwanie do wyścigu, a wieść o wydarzeniu szybko rozeszła się po okolicy. Nawet [Root.Monarch.GetName] przybył na brzeg, by obejrzeć zmagania. Naturalnie zaczęto zawierać zakłady."
 polynesian.12.a: "Odrobina hazardu nikomu nie zaszkodzi."
 polynesian.12.b: "Nie będziemy tracić majątku w tak nierozsądny sposób."
 polynesian.13.t: "Brak łuskanych orzechów kukui"
 polynesian.13.d: "Tatuaże są powszechnym sposobem zdobienia naszych ciał, a wykonują je mistrzowie tatuażu, odgrywający ważną rolę w społeczeństwie. Barwnik, nazywany kukui na Hawajach lub tuitui na Samoa, powstaje przez spalenie tłustego jądra wyłuskanego orzecha kukui i zebranie czarnej sadzy. Z niewiadomego powodu łuskane orzechy stały się rzadkością i nie można ich nigdzie znaleźć."
 polynesian.13.a: "Bez nich nasi tatuażyści nie mogą pracować. W razie potrzeby sprowadźmy orzechy z innych wysp."
 polynesian.13.b: "Możemy się bez tego obejść."
 no_tattoo_mod: "Brak łuskanych orzechów kukui"
 desc_no_tattoo_mod: "W tym roku nie powstaną żadne tatuaże."
 polynesian.14.t: "Dar unoszący się na wodzie"
 polynesian.14.d: "Nasz władca otrzymał w prezencie nowy statek. Rzemieślnicy, którzy go zbudowali, nie są bogaci, lecz chcieli podarować [Root.Monarch.GetName] piękny upominek w dowód uznania dla [Root.Monarch.GetHerHis] panowania. Zgodnie z tradycją w zamian zostaną obdarowani prezentami."
 polynesian.14.a: "Nasza flota rośnie w siłę."
 polynesian.15.t: "Młoda armia"
 polynesian.15.d: "W ostatnich dniach wojownicy zgromadzili się w jednej z naszych prowincji i przysięgli wierność [Root.Monarch.GetName], zgłaszając gotowość do służby w armii. Niezależnie od tego, czy zechcemy chronić nasz lud, czy rozszerzać granice państwa, ci ludzie okażą się wielką pomocą."
 polynesian.15.a: "Nowi rekruci zawsze się przydadzą."
 polynesian.16.t: "Ai Lakovi"
 polynesian.16.d: "Ai Lakovi, czyli formalne zaręczyny, to ważny element kultury Fidżi. Tradycyjnie mężczyzna wręcza przyszłej małżonce tabua — ząb wieloryba — choć nie jest to sztywna reguła. [Root.Monarch.GetName] ma wkrótce wziąć ślub i nalega, by podarować [Root.Monarch.GetHerHis] przyszłemu małżonkowi wyjątkowo luksusową tabua. Może to poważnie obciążyć skarbiec państwa."
 polynesian.16.a: "Nasz małżonek zasługuje na to, co najlepsze."
 polynesian.16.b: "Wystarczy, że podarujemy tabua."
 polynesian.17.t: "Watażka"
 polynesian.17.d: "Po krwawej wojnie nasz naród odniósł zwycięstwo. W naszej ojczyźnie przetrzymujemy wielu pojmanych wojowników i nadszedł czas, by zdecydować o ich losie. Ostatnie słowo należy do naszego watażki. Decyzja [Root.Monarch.GetSheHe] zostanie wykonana. Nie będzie to jednak bezkosztowe, a inni mogą zacząć obawiać się, że sami staną się kolejnymi ofiarami."
 polynesian.17.a: "Uszanujemy ich odwagę."
 polynesian.17.b: "Dzielnie walczyliśmy i pragniemy zachować pokój."
 warlord_mod: "Watażka"
 desc_warlord_mod: "Budząc w innych strach, stajemy się silniejsi."
 polynesian.18.t: "Wysłannik Kalou"
 polynesian.18.d: "Społeczeństwo Fidżi jest ściśle związane z religią i kultem Kalou, czyli bogów. Tabu jest tak powszechne, że reguluje, z kim możemy zawierać małżeństwa, co jeść, gdzie spać i niemal każdy aspekt życia — od kołyski aż po grób. Dlatego [Root.Monarch.GetName] postanowił, że u naszego boku powinien stanąć święty mąż."
 polynesian.18.a: "Przyjrzyjmy się kandydatom."
 polynesian.19.t: "Oskarżenia o uprawianie czarów"
 polynesian.19.d: "Czary, zwane przez niektórych draunikau, są powszechnym sposobem porozumiewania się z duchami i uzyskiwania od nich przysług. Praktykuje je wiele osób, nawet wśród betów, czyli kapłanów, lecz większość społeczeństwa patrzy na nie podejrzliwie, dlatego zazwyczaj uprawia się je potajemnie. Po całym państwie rozeszły się plotki, że [Root.Monarch.GetName] para się czarami."
 polynesian.19.a: "Te plotki muszą się skończyć."
 polynesian.19.b: "Wszyscy to robią. Może powinniśmy uznać tę praktykę za normalną."
 polynesian.20.t: "Żywy cel"
 polynesian.20.d: "Nasz następca tronu musi stać się wielkim wojownikiem, jeśli [Root.Heir.GetSheHe] pewnego dnia ma poprowadzić nasz lud. W naszej tradycji umiejętności łucznicze ćwiczy się, strzelając do żywego celu — zazwyczaj ciężko rannego jeńca wojennego. Pozwalając dzieciom celować do żywego celu, upewniamy się, że będą dobrze przygotowane do przyszłych wojen. Tym razem wśród ćwiczących znajduje się również nasz następca tronu. Dzięki temu [Root.Heir.GetHerHim] stanie się prawdziwym wojownikiem."
 polynesian.20.a: "Nasz następca tronu musi ćwiczyć."
 polynesian.21.t: "Lud Menehune"
 polynesian.21.d: "Według naszych legend, zanim nasi przodkowie przybyli na te wybrzeża, wyspy archipelagu należały do ludu karłów zwanego Menehune. Opisuje się ich jako znakomitych rzemieślników i budowniczych wielu naszych stawów rybnych, którzy niestrudzenie pracują nocami. Dostrzec ich mogą jedynie dzieci oraz osoby w jakiś sposób z nimi związane. Dziś do wioski przybył człowiek twierdzący, że ich widział."
 polynesian.21.a: "Być może jednak naprawdę istnieją."
 polynesian.21.b: "Zostawmy te brednie dzieciom i naiwniakom."
 polynesian.22.t: "Kū domaga się ofiary"
 polynesian.22.d: "Nasze państwo przeżywa straszliwy kryzys, a sytuacja pogarsza się z każdym dniem. Kapłani, czyli kahunowie, nie mają wątpliwości: Kū jest na nas rozgniewany i domaga się ofiary. Kapłani boga Kū przygotowują ceremonię w luakini — świątyni heiau poświęconej wojnie, w której składa się ofiary. W uroczystości będą mogli uczestniczyć wyłącznie aliʻi, czyli arystokracja, oraz kahunowie służący Kū."
 polynesian.22.a: "Złożymy ofiary, by udobruchać boga o pierzastym ciele."
 polynesian.22.b: "Ofiary nie są rozwiązaniem. Nie zaspokoimy żądzy krwi Kū."
 polynesian.23.t: "Wyjątkowe święto Makahiki"
 polynesian.23.d: "Kapłani Lono, czyli kahunowie, twierdzą, że sam bóg przemówił do nich i że jeśli poczynimy odpowiednie przygotowania, nasze państwo zostanie objęte bezpośrednim boskim błogosławieństwem. Jako bóg rolnictwa i pokoju Lono może zapewnić nam obfitsze plony oraz dłuższy okres pokoju. Co powinniśmy zrobić?"
 polynesian.23.a: "Złożymy ofiarę w mapele, świątyni poświęconej Lono."
 polynesian.23.b: "Dotąd radziliśmy sobie dobrze i nadal sobie poradzimy."
 lonos_blessing_mod: "Błogosławieństwo Lono"
 desc_lonos_blessing_mod: "Lono zesłał nam deszcz, dzięki któremu nasze rośliny mogą bujnie rosnąć."
 polynesian.24.t: "Erupcja wulkanu"
 polynesian.24.d: "Nasze wyspy są niezwykle żyzne, a rośliny rosną na nich bez trudu. Od czasu do czasu bogowie wystawiają jednak naszą wiarę na próbę: ziemia wpada w gniew, a wulkany, z których powstały nasze wyspy, wyrzucają lawę pokrywającą pola. Zazwyczaj góra wcześniej daje nam ostrzeżenie i ginie niewiele osób, lecz rośliny rosnące w pobliżu nie mają tyle szczęścia. W nadchodzących miesiącach będziemy musieli pogodzić się ze stratami i poczekać, aż roślinność odrodzi się silniejsza."
 polynesian.24.a: "Bogowie tak chcą."
 polynesian.25.t: "Nadchodzi Makahiki"
 polynesian.25.d: "Makahiki to jeden z najważniejszych okresów dla naszego ludu. Gdy na horyzoncie pojawiają się Makaliʻi, czyli Plejady, a następnie ukazuje się kolejny sierp księżyca, rozpoczyna się nowy rok. W tym czasie dziękujemy Lono za jego błogosławieństwa, a Kanaka Maoli, czyli rdzenni Hawajczycy, obchodzą święto. Przez te cztery miesiące zakazane są wojny i praca. Ludzie oddają się grom, uczestniczą w ceremoniach religijnych, podczas których składa się ofiary ze zwierząt, a władcy poddawani są próbom, by dowieść swojej wartości. Każda warstwa społeczna przechodzi własne próby, a ich pomyślne ukończenie przynosi chwałę nie tylko jednostce, lecz także całemu rodowi."
 polynesian.25.a: "Rozpoczyna się nowy rok."
 makahiki_mod: "Makahiki"
 desc_makahiki_mod: "Trwa okres obchodów nowego roku."
 polynesian.26.t: "Królewskie tangihanga"
 polynesian.26.d: "Ciało naszego następcy tronu, czyli tupapaku, będzie opłakiwane przez iwi we wspólnym domu zwanym wharenui. Żałoba potrwa trzy dni w tym świętym miejscu, marae. W tym czasie przybędą ludzie z całej okolicy, by oddać zmarłemu hołd. Ku czci tupapaku zorganizujemy taniec powitalny, a po nocy pożegnania, Po Whakamatunga, pochowamy ciało i wydamy ostatnią ucztę, hakari."
 polynesian.26.a: "Zachowajmy skromność. To nie czas, by chełpić się naszym bogactwem."
 polynesian.26.b: "Powinniśmy urządzić wystawne tangihanga."
 polynesian.27.t: "Kaitiakitanga"
 polynesian.27.d: "Stanowimy jedność z naturą i musimy żyć z nią w harmonii. Obowiązkiem każdego Maorysa jest ochrona wszystkiego, co znajduje się pod niebem, zgodnie z nakazami bogów. Zanieczyszczanie rzek, wycinanie całych lasów czy rabunkowa eksploatacja zasobów danego miejsca są sprzeczne z tą powinnością opieki. Nasi kapłani często uznają pewne obszary za tapu, czyli święte, aby je chronić i zapobiegać ich nadmiernemu wykorzystywaniu. Choć decyzje te niewątpliwie przynoszą długofalowe korzyści, w krótkiej perspektywie mogą sprawiać trudności."
 polynesian.27.a: "Nie możemy powstrzymywać postępu ani dbać o dobrobyt naszego ludu kosztem rozwoju."
 polynesian.27.b: "Wszyscy jesteśmy kaitiaki, czyli opiekunami. Tego wymaga od nas wierność bogom."
 kaitiakitanga_mod: "Kaitiakitanga"
 desc_kaitiakitanga_mod: "Nasi kapłani objęli niektóre obszary państwa zakazem tapu."
 polynesian.28.t: "Whakapapa"
 polynesian.28.d: "Whakapapa określa pochodzenie człowieka i linię rodową, do której należy. Genealogię recytuje się podczas przedstawiania się, czyli mihimihi, zwłaszcza przy ważnych okazjach. Władca sąsiedniego państwa zakwestionował prawdziwość whakapapa naszego monarchy. Wielu spośród naszego ludu uważa, że tej zniewagi nie można zignorować."
 polynesian.28.a: "Zapłacą za to krwią, gdy dosięgnie ich potęga naszych wojowników."
 polynesian.28.b: "Ich słowa nie mają znaczenia dla naszego przywódcy. Nie podejmiemy żadnych działań."
 polynesian.29.t: "Wyjątkowe święto Matariki"
 polynesian.29.d: "Nadszedł nowy rok, Matariki. Na horyzoncie pojawiła się gromada gwiazd zwana Matariki i Puanga, znana Europejczykom jako Plejady i Rigel, rozpoczynając nowy cykl. To pora roku, w której przygotowujemy pola, składamy ofiary bogom — zwłaszcza Rongo — wspominamy bliskich, których już z nami nie ma, i uczymy młodych o naszej ziemi. Kapłani ogłosili, że znaki są wyjątkowo pomyślne i czeka nas znakomity rok."
 polynesian.29.a: "Chwała bogom!"
 matariki_mod: "Wyjątkowe święto Matariki"
 desc_matariki_mod: "Ten rok będzie znakomity dla naszego ludu."
 polynesian.30.t: "Koha"
 polynesian.30.d: "Nasz władca otrzymał od przyjaciela liczne podarunki, czyli koha, w podziękowaniu za kilkudniową gościnę dla niego i jego rodziny. Utu — zasada równowagi i harmonii, która kieruje naszym życiem — nakazuje nam odwzajemnić ten bezinteresowny gest. Wymiana darów zwiąże rodziny naszego władcy i jego przyjaciela, zachęcając je do dalszego obdarowywania się w przyszłości, a zarazem umocni ich relację."
 polynesian.30.a: "Zaskoczył nas ten gest i nie możemy się odwdzięczyć."
 polynesian.30.b: "Tradycja nakazuje, by nasz dar był cenniejszy. Czy jednak naprawdę to zauważą?"
 polynesian.30.c: "Wiąże nas zasada utu. Odwdzięczymy się podwójnie za ich koha."
 polynesian.31.t: "Nieudany występ siva afi"
 polynesian.31.d: "Kilka dni temu przybył do nas wysłannik Tonga. Przez cały ten czas traktowaliśmy go z wielkimi honorami, zgodnie z naszą słynną gościnnością. Ostatniego wieczoru jego pobytu [Root.Monarch.GetName] zaprosił tancerzy, by wykonali taniec ognia, siva afi. Polega on na tym, że tancerze, zazwyczaj wojownicy, owijają ręcznikami tradycyjne maczugi wojenne nifo oti o ząbkowanych krawędziach, a następnie je podpalają. To niezwykle tradycyjny i charakterystyczny element naszej kultury. Ku naszemu zaskoczeniu występowi towarzyszyła inscenizacja opowiadająca o tym, jak nasi przodkowie uwolnili się spod panowania Tonga, atakując tamtejszego gubernatora podczas pokazu siva afi. Wszyscy widzą, jak wysłannik Tonga wpada w gniew. To może przysporzyć nam kłopotów."
 polynesian.31.a: "Tonga nie będzie zadowolone."
 polynesian.32.t: "Tchórzliwy następca tronu"
 polynesian.32.d: "Męski tatuaż peʻa jest centralnym elementem naszej kultury i wiąże się z obrzędami przejścia w dorosłość. [Root.Heir.GetName] osiągnął odpowiedni wiek i ma otrzymać peʻa, by przestać być telefua, czyli nagim. Podczas przygotowań [Root.Heir.GetName] zachowuje pewność siebie, choć wiadomo, że wykonanie peʻa jest bardzo bolesne. Odwaga szybko go opuszcza, gdy zaczyna pracę tufuga ta tatau, mistrz tatuażu. Następca nie wytrzymuje bólu i ucieka. Pozostaje mu jedynie niewielki znak, peʻa mutu — piętno hańby. Nawet jeśli kiedyś dokończy tatuaż, niektórzy nigdy nie uznają go za sogaʻimiti i nie będą szanować jego odwagi."
 polynesian.32.a: "Przyniósł hańbę naszej rodzinie."
 polynesian.33.t: "Historyczna ceremonia ʻava"
 polynesian.33.d: "Ceremonia ʻava jest jednym z najważniejszych zwyczajów naszego ludu. To uroczysty rytuał, podczas którego dzieli się napojem kava, zwanym przez nas ʻava, a całości towarzyszą przemowy i oracje. Tym razem zaproszono kilku wodzów plemiennych oraz innych znamienitych mieszkańców naszego państwa. ʻAva przygotowuje się z suszonych korzeni wymieszanych z wodą i podaje uczestnikom ceremonii. Nasi goście wyraźnie dobrze się bawią, więc być może warto wykorzystać ich dobry nastrój."
 polynesian.33.a: "Nie spodziewaliśmy się aż takiego sukcesu."
 historic_ava_mod: "Historyczna ceremonia ʻava"
 desc_historic_ava_mod: "O tej ceremonii ʻava będzie się pamiętać przez lata."
 polynesian.34.t: "Tufuga na dworze"
 polynesian.34.d: "Tufuga to rzemieślnicy, którzy osiągnęli najwyższy poziom umiejętności i wiedzy w naszym społeczeństwie. Ich pozycja jest niezwykle prestiżowa, dlatego zatrudnienie ich usług może przynieść naszemu państwu wielkie korzyści. Jakiego tufuga powinniśmy zaprosić?"
 polynesian.34.a: "Poszukajmy tufuga fau fale, mistrza budownictwa."
 polynesian.34.b: "Potrzebujemy tufuga fau vaʻa, mistrza nawigacji."
 polynesian.34.c: "Zatrudnijmy znakomitego tufuga ta tatau, mistrza tatuażu."
 polynesian.35.t: "System fa'amatai"
 polynesian.35.d: "System wodzowski, czyli fa'amatai, to tradycyjna dla Samoa zdecentralizowana forma rządów. Pozwala tama-a-aiga, czyli Synom Rodów — czterem najważniejszym posiadaczom tytułów na wyspach — sprawować władzę nad samoańskimi rodami królewskimi. Każdy władca tych wysp posiadał jeden z tych tytułów. System zapewnił nam znaczną stabilność, ale jednocześnie ogranicza możliwość skupienia pełni władzy."
 polynesian.35.a: "Uszanujemy tradycję."
 polynesian.35.b: "Ten system jest przestarzały i działa wbrew naszym interesom."
 respect_faamatai_mod: "Uszanowaliśmy system fa'amatai"
 desc_respect_faamatai_mod: "System fa'amatai stanowi fundament naszego społeczeństwa, dlatego musimy go zachować."
 end_faamatai_mod: "Zniesiono system fa'amatai"
 desc_end_faamatai_mod: "System fa'amatai nie jest nam do niczego potrzebny, więc go zlikwidowaliśmy."
 polynesian.36.t: "Królewski tatuaż"
 polynesian.36.d: "Choć większość tongijskich mężczyzn jest mocno wytatuowana, nasi władcy zazwyczaj nie noszą tatuaży. Wynika to z wysokiej rangi monarchy, która sprawia, że nikt nie może go dotknąć. Aby obejść to ograniczenie, tradycyjnie udaje się na Samoa, gdzie można wykonać tatuaż."
 polynesian.36.a: "Zgodnie ze zwyczajem udamy się na Samoa, by wykonać tatuaż."
 opinion_tattoo_done: "Król Tonga wykonał tatuaż na Samoa"
 polynesian.36.b: "Samoa nie ma nam nic do zaoferowania."
 opinion_tattoo_not_done: "Król Tonga odmówił wykonania tatuażu na Samoa"
 polynesian.37.t: "Druga Haʻamonga ʻa Maui"
 polynesian.37.d: "Kilka pokoleń temu Tuʻitatui, jedenasty Tuʻi Tonga, wzniósł Haʻamonga ʻa Maui, czyli Brzemię Maui — olbrzymią konstrukcję z koralowego wapienia, przypominającą bramę i podtrzymywaną przez dwa równie wielkie kamienne bloki. Uczynił to ku czci swoich dwóch synów. Nasz władca [Root.Monarch.GetName], poruszony tą opowieścią, pragnie wznieść podobną budowlę dla swoich dzieci, mimo oczywistych kosztów. Co powinniśmy zrobić?"
 polynesian.37.a: "Niech żyje [Root.Monarch.GetName]!"
 polynesian.37.b: "Nie stać nas na taki wydatek, nawet jeśli [Root.Monarch.GetName] się rozgniewa."
 polynesian.38.t: "Mistrzowie rzeźbienia w drewnie"
 polynesian.38.d: "Nasi rzemieślnicy są biegli w sztuce rzeźbienia w drewnie. Tworzą nie tylko zwykłe przedmioty, takie jak zagłówki, kali, czyli misy na żywność, wizerunki kultowe czy broń, lecz słyną w całym regionie Pacyfiku również z umiejętności inkrustowania drewna masą perłową i kością słoniową. Fidżyjczycy uwielbiają nasze ozdobne maczugi wojenne. Powinniśmy wykorzystać ich zamiłowanie do naszych wyrobów."
 polynesian.38.a: "Przyniesie nam to wielkie korzyści."
 tongan_fijian_trade_mod: "Handel między Tongą a Fidżi"
 desc_tongan_fijian_trade_mod: "Fidżyjczycy uwielbiają nasze rzeźbione maczugi wojenne."
 polynesian.39.t: "Zbezczeszczony królewski kurhan"
 polynesian.39.d: "Podczas uroczystości najstarszy syn przywódcy wpływowego klanu upił się i nieumyślnie zbezcześcił grobowiec jednego z naszych zmarłych królów. To wielka zniewaga, o czym młodzieniec doskonale wie. Mimo jego błagań i obietnic zadośćuczynienia niektórzy doradzają [Root.Monarch.GetName], by go zabić i zmazać hańbę z dynastii. Inni obawiają się jednak możliwego powstania klanu, jeśli zgładzimy jego przyszłego przywódcę."
 polynesian.39.a: "Mimo skruchy musi zginąć."
 polynesian.39.b: "Nie możemy teraz ryzykować wojny domowej."
 polynesian.40.t: "Fidżyjskie czółna wojenne"
 polynesian.40.d: "Nasza ojczyzna obfituje w wiele surowców, brakuje nam jednak odpowiedniej liczby dużych drzew potrzebnych do budowy wielkich czółen wojennych. Na szczęście niedaleko leżą wyspy Fidżi, których mieszkańcy słyną z legendarnego kunsztu szkutniczego. Powinniśmy zacieśnić z nimi stosunki handlowe, aby utrzymać siłę naszej floty."
 polynesian.40.a: "Cena jest do zaakceptowania."
 polynesian.40.b: "Nie możemy sobie teraz na to pozwolić."
 fijian_canoes_good_mod: "Fidżyjskie czółna wojenne"
 desc_fijian_canoes_good_mod: "Importujemy czółna wojenne z Fidżi."
 fijian_canoes_bad_mod: "Fidżyjskie czółna wojenne"
 desc_fijian_canoes_bad_mod: "Potrzebujemy dużych drzew do budowy czółen wojennych."
 polynesian.41.t: "Dziwne stworzenie"
 polynesian.41.d: "Nasza władczyni Lilo wróciła ze swojego codziennego spaceru po pięknej wyspie. U jej boku kroczy małe, niebieskawe stworzenie, które niezdarnie trzyma ją za rękę. Nikt nigdy nie widział podobnej istoty, lecz nikt nie śmie o niej mówić. Stworzenie nie przestaje mamrotać, jakby coś knuło."
 polynesian.41.a: "Co bogowie chcą nam przez to powiedzieć?"
 polynesian.42.t: "Błogosławieństwo Menehune"
 polynesian.42.d: "Widziano, jak w nocy nasz władca [Root.Monarch.GetName] wchodził do lasu. Kilku strażników próbowało powstrzymać [Root.Monarch.GetHerHim], lecz jednym gestem [Root.Monarch.GetSheHe] kazał im zostawić [Root.Monarch.GetHerHim] w spokoju. Kilka godzin później [Root.Monarch.GetSheHe] wrócił z szerokim uśmiechem na twarzy. „Dziś w nocy rozmawiałem z jednym z Menehune” — oznajmił [Root.Monarch.GetSheHe]. Czy to prawda, czy nie, od tamtego dnia wszystko w państwie zaczęło układać się lepiej."
 polynesian.42.a: "Oni naprawdę istnieją."
 menehune_blessing_mod: "Błogosławieństwo Menehune"
 desc_menehune_blessing_mod: "Menehune pobłogosławili nasze państwo i jego władców."
 polynesian.43.t: "Dziwny doradca"
 polynesian.43.d: "Po długiej podróży nasza królowa Moana powróciła na nasze wybrzeża w towarzystwie wysokiego, muskularnego mężczyzny pokrytego tatuażami. Od tej pory niemal zawsze widuje się ją w jego towarzystwie i najwyraźniej słucha jego rad. Być może nadszedł czas, by zaprosić go na dwór, mimo krążących o nim plotek."
 polynesian.43.a: "Czy to Maui?"
 estate_regency_events.1.t: "Podważone przywództwo stanu"
 estate_regency_events.1.d: "W ostatnich miesiącach jedna z frakcji w naszym państwie znacznie się umocniła i uważa, że to jej członkowie powinni sprawować władzę podczas regencji. Początkowo ich żądania przybierały formę plotek: ktoś szeptał, że ta czy inna osoba nie jest zadowolona z kierunku, w którym zmierza państwo; ktoś inny twierdził, że dominująca frakcja jest słabsza od konkurencyjnej albo że nie ma wystarczającej reprezentacji w radzie regencyjnej. Takie pogłoski krążyły przez wiele tygodni, a dziś obecność frakcji na dworze jest aż nadto widoczna. Stronnictwo kwestionujące władzę regenta otwarcie domaga się jej przejęcia. Regent, co zrozumiałe, jest zaniepokojony i dostrzega, że pozycja [Root.Monarch.GetHerHis] własnej frakcji osłabła na tyle, iż nie ma pewności, czy zdoła się ona obronić. Nadszedł czas decyzji, która odmieni nasze państwo."
 estate_regency_events.1.a: "Nie pozostaje nam nic innego, jak zaakceptować zmianę przywództwa."
 estate_change_tooltip: "Dominujący stan odda władzę stanowi, który rzuca mu wyzwanie."
 estate_regency_events.1.b: "Dla dobra państwa muszą poprzeć regenta."
 estate_displeased_tooltip: "Stan sprawujący przywództwo podczas regencji będzie niezadowolony."
 coup_attempt_starts_tooltip: "Dojdzie do zamachu stanu."
 estate_regency_events.2.t: "Nadużycia władzy podczas regencji"
 estate_regency_events.2.d: "Dla wielu osób sprawowanie władzy jest jedynie okazją do realizowania własnych interesów. Właśnie z takim problemem zmaga się nasze państwo. Niekwestionowana pozycja i upojenie władzą sprawiły, że frakcja stojąca za regentem — a być może także sam [Root.Monarch.GetHerselfHimself] — domaga się przywilejów. Znajdujemy się w słabej pozycji, więc odrzucenie tych żądań może być niebezpieczne i doprowadzić nas do zguby. Z drugiej strony, jeśli frakcja zdoła utrwalić swoją władzę, może być trudno ją usunąć, gdy po objęciu tronu przez prawowitego władcę odmówi ustąpienia."
 estate_regency_events.2.a: "Na razie spełnimy ich żądania."
 estate_regency_events.2.b: "Może możemy ich przekupić i liczyć, że zapomną o sprawie."
 estate_regency_events.2.c: "Nie dostaną niczego. Mają służyć państwu, a nie własnym interesom."
 estate_regency_events.3.t: "Regent-tyran"
 estate_regency_events.3.d: "Krwawa zemsta rodowa potrafi doprowadzić państwo do upadku, lecz jest niemal tak stara jak ludzkość. Nasz regent, [Root.Monarch.GetName], uznał sprawowanie władzy za doskonałą okazję do pozbycia się politycznych wrogów i przeciwników. [Root.Monarch.GetSheHeCap] wykorzystuje uprawnienia regenta, by bezlitośnie atakować każdego, kto wypowiada się przeciwko [Root.Monarch.GetHerHim] lub [Root.Monarch.GetHerHis] frakcji — a nawet tych, którzy tego nie robią, po prostu dlatego, że może. Pozostałe stronnictwa nie są oczywiście zadowolone z takiego obrotu spraw i mogą spróbować odwetu. Stoimy na rozdrożu i musimy zdecydować, czy powinniśmy interweniować."
 estate_regency_events.3.a: "Musimy zaufać [Root.Monarch.GetName] i mieć nadzieję, że wszystko dobrze się skończy."
 estate_regency_events.3.b: "To tyrania. Jeśli na nią pozwolimy, w końcu obróci się przeciwko nam."
 estate_regency_events.4.t: "Regent oferuje koronę"
 estate_regency_events.4.d: "Gdy lojalni poddani przekazali nam tę wiadomość, nie mogliśmy w nią uwierzyć. Regent i [Root.Monarch.GetHerHis] frakcja są bardzo niezadowoleni z następcy tronu oraz [Root.Heir.GetHerHis] stronników i posunęli się do zuchwałego kroku: zaoferowali koronę naszego państwa innemu krajowi! Niewiele możemy zrobić poza czekaniem i modlitwą, by nasi wrogowie nie wykorzystali okazji do napaści i odebrania korony prawowitemu następcy."
 estate_regency_events.4.a: "Zdrada!"
 estate_regency_events.5.t: "Mieszczanie sprawiają problemy"
 estate_regency_events.5.d: "Mówi się, że mieszczan interesują wyłącznie pieniądze. Dopóki mają ich pod dostatkiem, są zadowoleni i nie sprawiają większych kłopotów. Przynajmniej tak nam się wydawało. [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] frakcja wykorzystali swoją władzę, by rozwijać podejrzane interesy. Przemyt nie jest nam obcy i nie po raz pierwszy przymykamy na niego oko. Tym razem jednak nielegalne działania rozdrażniły inne państwo, które może wykorzystać ten incydent jako pretekst do wypowiedzenia nam wojny i zażądania odszkodowania. Niestety, druga strona nie zamierza negocjować."
 estate_regency_events.5.a: "Pozostaje nam tylko czekać."
 estate_regency_events.6.t: "Narastająca nietolerancja"
 estate_regency_events.6.d: "Nikogo nie powinno dziwić, że każda władza religijna, gdy tylko obejmie rządy, próbuje utrwalić swoją pozycję i podporządkować sobie pozostałych. Właśnie z taką sytuacją mierzy się [Root.GetName]. Rządzące duchowieństwo wykorzystuje swoje wpływy, by ograniczyć znaczenie innych religii w naszym państwie, a jego potęga jest zbyt wielka, by można było odrzucić te działania. Jedyne, na co dotąd zdołaliśmy się zdobyć, to nieśmiały protest. Bez wątpienia zmienimy tę politykę w przyszłości, lecz na razie będziemy musieli z nią żyć."
 estate_regency_events.6.a: "Rozwiązujmy problemy po kolei."
 religious_intolerance_mod: "Nietolerancja religijna"
 desc_religious_intolerance_mod: "Rozpoczęła się nowa fala nietolerancji wobec wyznawców religii innych niż państwowa."
 religious_intolerance_tooltip: "Do czasu wstąpienia na tron §Y[Root.Heir.GetName]§! wyznawcy religii innych niż §Y[Root.Religion.GetName]§! będą prześladowani."
 estate_regency_events.7.t: "Nasz regent jest lojalistą"
 estate_regency_events.7.d: "Chociaż zawsze oczekujemy, że osoby odpowiedzialne za regencję będą lojalne wobec korony i narodu, jesteśmy szczęśliwi, jeśli nie nadużywają swojej pozycji lub są bezpośrednio nielojalne i próbują przejąć władzę, gdy tylko znajdą się na stanowisku przywódcy. [Root.Monarch.GetName] jest wyjątkiem od reguły. Lojaln[Root.Monarch.GetAY] i dobrze wychowan[Root.Monarch.GetAY], [Root.Monarch.GetHerHis] zaproponowan[Root.Monarch.GetAY] przez [Root.Monarch.GetHerHis] frakcję był[Root.Monarch.GetANoun] najlepszą wiadomością od miesięcy, ponieważ od ni[Root.Monarch.GetEjEgo] oczekujemy tylko tego, co najlepsze."
 estate_regency_events.7.a: "Chociaż raz dobre wieści!"
 loyalist_leader_mod: "Przywódca rojalistów"
 desc_loyalist_leader_mod: "Regent pozostaje wierny koronie."
 estate_regency_mod_desc_tt: "do czasu wstąpienia na tron naszego §Ynastępcy tronu§!"
 loyalist_leader_tooltip: "Do czasu wstąpienia na tron §Y[Root.Heir.GetName]§! §Y[Root.Monarch.GetTitle] [Root.Monarch.GetName]§! pozostanie wierny koronie."
 estate_regency_events.8.t: "Spiski wychodzą z cienia"
 estate_regency_events.8.d: "Mimo swojej potęgi [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] frakcja nie są zadowoleni z następcy tronu i [Root.Heir.GetHerHis] otoczenia. Pojawiają się głosy, że spiskują oni w jakiejś niebezpiecznej sprawie. Skonfrontowaliśmy z tymi oskarżeniami [Root.Monarch.GetName], lecz [Root.Monarch.GetSheHe] stanowczo im zaprzeczył. Na dworze nigdy nie ma spokoju, a intrygi czają się na każdym kroku."
 estate_regency_events.8.a: "Przeczuwamy, że coś jest nie tak."
 estate_regency_events.9.t: "Dobry wpływ regenta"
 estate_regency_events.9.d: "Gdy dobrzy ludzie bardziej troszczą się o dobro państwa niż o własne interesy, mogą dokonać wielkich rzeczy. Od miesięcy regent poświęca wiele czasu, by dzielić się swoją mądrością z [Root.Heir.GetName], a oboje czerpią z tych chwil ogromną satysfakcję. Przygotowanie do roli władcy nigdy nie jest łatwe, lecz [Root.Monarch.GetName] wykonał znakomitą pracę. Nauki przyrodnicze, etykieta, historia i taktyka wojskowa rozbrzmiewają w pałacowych salach, gdy regent i następca tronu przemierzają je razem."
 estate_regency_events.9.a: "[Root.Heir.GetName] nauczył się tak wiele!"
 estate_regency_events.10.t: "Próba zamachu stanu przeciwko małżonkowi regenta"
 estate_regency_events.10.d: "W całym państwie coraz głośniej mówi się o niezadowoleniu jednej z frakcji. Według krążących pogłosek jej członkowie nie akceptują małżonka sprawującego regencję i planują zamach stanu, by pozbawić [Root.Monarch.GetHerHim] władzy i osadzić na jej miejscu jednego ze swoich. Jeśli odniosą sukces, dynastia królewska może zostać wymordowana. Dopóki nie udaremnimy spisku i nie uwięzimy wszystkich intrygantów, małżonek oraz cała rodzina królewska znajdują się w śmiertelnym niebezpieczeństwie."
 estate_regency_events.10.a: "Nie pozwolimy im zwyciężyć!"
 coup_in_palace_events.1.t: "Pogłoski o zamachu stanu"
 coup_in_palace_events.1.d: "Pałacowe korytarze są bardziej zatłoczone niż kiedykolwiek. Ludzie z całego kraju przybywają tu, by wymieniać informacje, uczestniczyć w spotkaniach, zawierać sojusze lub rozwiązywać dawne spory. Nie byłoby w tym nic dziwnego, gdyby nie to, że za każdym razem, gdy [Root.Monarch.GetName] przechodzi tymi korytarzami, zapada niemal namacalna cisza. Nie jest to zwykłe milczenie wynikające z szacunku, lecz nieprzyjemna cisza, która budzi niepokój. Im bardziej interesuje nas to dziwne zachowanie, tym częściej docierają do nas pogłoski o przygotowywanym zamachu stanu. Kto śmiałby nas zaatakować?"
 coup_in_palace_events.1.a: "Należy wszcząć śledztwo, aby wyjaśnić tę sprawę."
 coup_ended_tooltip: "Spiskowcy zostaną wykryci, a próba zamachu stanu udaremniona."
 nothing_found_tooltip: "Śledztwo nie przyniesie żadnych informacji. Coś się jednak wydarzy."
 coup_in_palace_events.1.b: "To zapewne tylko plotki, ale na wszelki wypadek powinniśmy zachować czujność."
 gossips_end_tooltip: "Plotki ustaną. Ostatecznie nic się nie wydarzyło."
 gossips_continue_tooltip: "Pogłoski o zamachu stanu będą jeszcze częstsze. Coś się wydarzy."
 coup_in_palace_events.2.t: "Wykryto spisek"
 coup_in_palace_events.2.d: "Po wielu dniach śledztwa, przekupywania i zastraszania świadków oraz niezliczonych nieprzespanych nocach udało się wykryć spiskowców i udaremnić próbę zamachu stanu. Winni trafią do lochów, a następnie zostaną straceni, gdyż zdrajcy nie zasługują na nic innego. Jak to często bywa, na czele spisku stoją osoby, po których najmniej byśmy się tego spodziewali, co przynosi gorzkie rozczarowanie. „Tu quoque, Brute, fili mi?” — „I ty, Brutusie, przeciwko mnie?”"
 coup_in_palace_events.2.a: "Czas ukarać zdrajców i położyć temu kres."
 coup_in_palace_events.3.t: "Spisek trwa"
 coup_in_palace_events.3.d: "O ile w ostatnich tygodniach plotki były dość wyraźne, o tyle w ostatnich dniach stały się ogłuszające. Niektórzy przestali już ukrywać, o czym rozmawiają, i swobodnie kontynuują te rozmowy nawet w naszej obecności. Wkrótce wydarzy się coś wielkiego, a my nie wiemy, jaki powinien być nasz następny krok. Kraj żyje w napięciu, a poczucie nadciągającego nieszczęścia rozprzestrzenia się niczym pożar."
 coup_in_palace_events.3.a: "Co się teraz wydarzy?"
 coup_in_palace_events.3.b: "Oczyścić dwór. Wszystkich co do jednego."
 recent_coup_modifier: "Niedawna próba zamachu stanu"
 estate_regent_prevails_tt: "[Root.Monarch.GetName] skutecznie dochodzi swoich praw do naszego tronu"
 coup_fails_tooltip: "Uda nam się udaremnić spisek i wykryć jego uczestników."
 coup_succeeds_tooltip: "Spisek zakończy się sukcesem i poleje się krew."
 coup_in_palace_events.4.t: "Spisek udaremniony"
 coup_in_palace_events.4.d: "Jeśli ten spisek czegoś nas nauczył, to tego, że nigdy nie wolno niczego uważać za pewnik. Gdy noc była najciemniejsza i wszystko zdawało się stracone, nasi agenci w ostatniej chwili schwytali spiskowców na gorącym uczynku. Głupcy świętowali właśnie to, co uważali za pewne zwycięstwo i zmianę na tronie. Ich kac zostanie teraz spotęgowany przez łzy i błagania o wybaczenie."
 coup_in_palace_events.4.a: "Nasze państwo jest bezpieczne!"
 coup_in_palace_events.5.t: "Spisek zakończony sukcesem"
 coup_in_palace_events.5.d: "Wróg jest wśród nas! Wszystko stracone! Nasi agenci byli bliscy schwytania spiskowców, lecz ci zdołali uniknąć nadzoru i zrealizować swoje zdradzieckie plany. Musimy zapewnić naszym ludziom bezpieczeństwo, w przeciwnym razie zostaną zabici, jeśli nowa siła stojąca za tronem uzna ich za zagrożenie. Musimy działać szybko!"
 coup_in_palace_events.5.a: "Nie, nadzieja przepadła. Tron i nasza przyszłość należą do nich."
 coup_in_palace_events.6.t: "Następstwa"
 coup_in_palace_events.6.d: "Spisek wyszedł na jaw, a ostatnie wydarzenia przesądziły o jego wyniku. Niezależnie od tego, czy zakończył się dla nas pomyślnie, nasze państwo wkroczy teraz w nową rzeczywistość. Taka jest natura polityki i zakulisowych rozgrywek…"
 coup_in_palace_events.6.a: "Co teraz?"
