 aboriginal_tech: "Aborygeńska"
 aboriginal_tech_desc: "W ramach aborygeńskiej grupy technologicznej koszt poziomu technologicznego jest wyższy o 250% (350% wartości podstawowej)."
 aboriginal_boomerang: "Aborygeński łowca z bumerangiem"
 aboriginal_boomerangDESCR: "Bumerang to tradycyjna broń używana w Australii zarówno przez myśliwych, jak i wojowników. Choć nie jest tak zabójczy jak włócznia czy strzała, stanowi niezawodne, wielokrotnego użytku narzędzie łowieckie, a w rękach wprawnego wojownika staje się śmiercionośną bronią. Mniejsza śmiertelność bumerangu czyni go idealnym narzędziem w walkach, których celem jest pojmanie jeńców, a nie zadawanie strat."
 aboriginal_warrior: "Aborygeński włócznik"
 aboriginal_warriorDESCR: "Włócznia to śmiercionośna i wszechstronna broń używana na całym kontynencie australijskim. Chłopcy od najmłodszych lat uczą się nią władać, a gdy dorastają, staje się ich najwierniejszym sprzymierzeńcem — równie groźnym z dystansu, jak i w walce wręcz."
 aboriginal_ambusher: "Aborygeński partyzant"
 aboriginal_ambusherDESCR: "Taktyka zasadzek jest niezbędna podczas walki z przeważającym liczebnie przeciwnikiem. Wojownicy, którzy opanowali tę sztukę, nie muszą obawiać się samej przewagi liczebnej wroga. Aborygeńskie zasadzki, często organizowane nocą, okazywały się śmiertelnie skuteczne: przeciwnicy byli rozpraszani i dezorientowani, gdy ich wojowników dosięgały włócznie."
 aboriginal_infantry: "Wojownik rytualny"
 aboriginal_infantryDESCR: "Wojna w Australii rzadko przybiera inną formę niż ceremonialna. Grupy wojowników często wyruszają na rytualne ćwiczenia, a ci odważni wojownicy religijni szokują i przerażają przeciwników śmiercionośną mocą bogów i przodków, która prowadzi ich broń."
 aboriginal_reformed_boomerang: "Zreformowany wojownik z bumerangiem"
 aboriginal_reformed_boomerangDESCR: "Rozwój nowych taktyk wojskowych nadał bumerangowi nowe zastosowanie na polu bitwy. Wykorzystując bumerangi w drugim szeregu, za osłoną włóczników stojących z przodu, możemy razić wrogów, zanim zdążą nas dostrzec."
 aboriginal_outback_warriors: "Wojownicy interioru"
 aboriginal_outback_warriorsDESCR: "Australijski interior oferuje niewiele poza piaskiem i niebezpieczną fauną, lecz tradycja wędrówek walkabout wymagała od Aborygenów opanowania polowania i walki w najtrudniejszych warunkach."
 aboriginal_arquebusier: "Strzelec z zasadzki"
 aboriginal_arquebusierDESCR: "Wojny między kolonistami a Aborygenami toczyły się na nierównych warunkach: koloniści dysponowali nowoczesną bronią palną i przewagą liczebną. Nieliczne zwycięstwa wojowników aborygeńskich miały zwykle charakter obronny i wynikały z zastosowania zaawansowanych taktyk defensywnych."
 aboriginal_tasmanian_arquebusier: "Strzelec ofensywny"
 aboriginal_tasmanian_arquebusierDESCR: "Wojownicy posługujący się bumerangami i włóczniami często stosowali śmiałe taktyki ofensywne, a łowieckie doświadczenie Aborygenów pozwalało im stawiać czoła zachodnim wojownikom uzbrojonym w broń palną. Przyjmując jednak zdobycze epoki prochu, aborygeńscy wojownicy mogą zyskać równe szanse w starciu z obcymi armiami."
 aboriginal_riflemen: "Strzelcy pogranicza"
 aboriginal_riflemenDESCR: "Wojny pogranicza były serią brutalnych i krwawych konfliktów między Aborygenami a napływającymi kolonistami. Mimo logistycznej i taktycznej przewagi przeciwnika, techniki łowieckie i bojowe aborygeńskich wojowników czyniły z nich groźną siłę na polu bitwy, nawet w nierównej walce."
 aboriginal_guerrillas: "Piechota czarnej wojny"
 aboriginal_guerrillasDESCR: "Czarne wojny były serią krwawych konfliktów na Tasmanii między angielskimi kolonistami a rdzennym ludem Palawa. Doświadczenia zdobyte w śmiertelnych starciach z Zachodem bez wątpienia na zawsze odmienią aborygeńską sztukę wojenną."
 aboriginal_horseman: "Aborygeńscy konni"
 aboriginal_horsemanDESCR: "Przybycie konnych wojowników do Australii na zawsze odmieni sposób prowadzenia wojen przez Aborygenów."
 aboriginal_cavalry: "Aborygeńska kawaleria"
 aboriginal_cavalryDESCR: "Przejmując z zagranicy bardziej zaawansowane taktyki walki konnej, aborygeńska kawaleria może skuteczniej wspierać piechotę na polu bitwy."
 aboriginal_hussar: "Aborygeńscy huzarzy"
 aboriginal_hussarDESCR: "Lekka kawaleria wyspecjalizowana w najazdach i taktyce podjazdowej."
 aboriginal_swarm_cav: "Aborygejska kawaleria roju"
 aboriginal_swarm_cavDESCR: "Nieregularna jazda uzbrojona w łuki lub karabiny, wykorzystująca taktykę podjazdową do zdezorganizowania sił przeciwnika, aby następnie wykonać szarżę. Luźne zorganizowanie sprawiało, że była mniej narażona na ogień przeciwnika, ale jeśli nieprzyjaciel zdołał wytrzymać jej zmasowany atak, jeźdźcy szybko stawali się celem ataku."
 aboriginal_dragoon: "Aborygeńscy dragoni"
 aboriginal_dragoonDESCR: "Jeźdźcy uzbrojeni w muszkiety, którzy są w stanie zejść z koni i walczyć jako piechota."
 TIW_ideas: "Idee Tiwi"
 TIW_ideas_start: "Tradycje Tiwi"
 TIW_ideas_bonus: "Ambicja Tiwi"
 TIW_yiminga: "Yiminga"
 TIW_yiminga_desc: "Nasza skóra, czyli „Yiminga”, jest dziedziczona w linii matczynej — przechodzi z matki na jej dzieci. To kobiece dynastie wyznaczają los naszych potomków: ich grupę, życie, ducha, oddech i puls. Kobieta daje dziecku życie i kształt, a mężczyzna odnajduje ducha, który zostanie przekazany nienarodzonemu dziecku. Podczas gdy inne plemiona lekceważą wysiłki kobiet, my wiemy, że to one określają naszą pozycję społeczną i więzi rodzinne. Słusznie więc dzielą się władzą ze swoimi męskimi odpowiednikami."
 TIW_dreaming_totem: "Totem Śnienia"
 TIW_dreaming_totem_desc: "Totem Śnienia Tiwi to święte zwierzę przypisane danej osobie przez jej ojca. Tiwi posiadający totem nie może zabijać ani spożywać mięsa swojego zwierzęcego ducha — byłoby to duchowym kanibalizmem. Totem stanowi nieodłączną część indywidualnej tożsamości Tiwi i służy do jej oznaczania podczas tańców oraz ceremonii."
 TIW_kulama: "Kulama"
 TIW_kulama_desc: "Według opowieści z Czasu Snu mężczyzna-sowa płomykówka i jego żona Pintoma postanowili odprawić pierwszą ceremonię Kulama. Obrzęd obejmował przygotowanie trującego pochrzynu kulama do spożycia oraz złożoną serię tańców i występów. Ceremonię Kulama odprawiają wszyscy — zarówno my, którzy stąpamy po ziemi, jak i otaczający nas bogowie oraz duchy — by uczcić otrzymane życie."
 TIW_purrukapali: "Purrukapali"
 TIW_purrukapali_desc: "Legenda o Purrukapalim opowiada o tragicznej śmierci jego syna, który zmarł z wycieńczenia pod opieką zaniedbującej go matki. Zrozpaczony Purrukapali podniósł wyschnięte ciało chłopca i zaniósł je do mądrego Japary. Ten obiecał z czasem przywrócić dziecko do życia, lecz Purrukapali, targany rozpaczą i niecierpliwością, wszczął z nim wielką bitwę. Następnie zabrał martwego syna i zaniósł go do morza, ogłaszając, że śmierć powinna dotknąć całe stworzenie, aby wszyscy poznali żal, który go trawi. Miejsce, w którym zaniósł syna, stało się potężnym wirem wciągającym każdego, kto się do niego zbliżył. Japara położył kres szaleństwu Purrukapalego, a następnie odrodził się jako Księżyc, uwięziony w cyklu śmierci i odrodzenia co trzy dni."
 TIW_marriage: "Tradycje małżeńskie Tiwi"
 TIW_marriage_desc: "Małżeństwo ma zasadnicze znaczenie dla korzyści gospodarczych, społecznych i politycznych. Jest równie ważne dla naszego utrzymania jak rybołówstwo, rolnictwo i zbieractwo, a niezamężna kobieta Tiwi jest po prostu bezczynna i kłótliwa. Ponowne małżeństwa są wśród nas powszechne. Często mniej wpływowi członkowie społeczeństwa, na przykład myśliwi niskiej rangi, poślubiają wdowy po bardziej zasłużonych mężczyznach. Ponowne małżeństwo powinno nastąpić szybko, ponieważ każdy dzień, w którym kobieta pozostaje niezamężna, przynosi wielki wstyd."
 TIW_isolationism: "Izolacjonizm Tiwi"
 TIW_isolationism_desc: "Nasze społeczeństwo ma długą historię surowego izolacjonizmu. Przybysze z zewnątrz zawsze próbowali grabić i wykorzystywać bogactwo naszych ziem oraz niszczyć naszą kulturę. Nie możemy na to pozwolić. Musimy zachować nasz język, ziemie i kulturę, a jeśli wymaga to poświęcenia więzi z obcymi, właśnie tak postąpimy."
 TIW_one_people: "Jeden lud"
 TIW_one_people_desc: "W naszym języku słowo „Tiwi” oznacza „jeden lud”. Mamy jeden język, jedną religię i stanowimy jeden lud. Istnieją tylko Tiwi, a każdy, kto staje się częścią naszego wielkiego narodu, powinien przyjąć sposób życia Tiwi, ich tożsamość i wszystko, co się z nimi wiąże."
 generic_aboriginal_ideas: "Idee Aborygenów"
 generic_aboriginal_ideas_start: "Tradycje Aborygenów"
 generic_aboriginal_ideas_bonus: "Ambicja Aborygenów"
 aborig_art: "Sztuka aborygeńska"
 aborig_art_desc: "Podczas gdy inni wyrażają siebie za pomocą słowa mówionego, my zachowujemy nasze dziedzictwo i kulturę dzięki niezwykłej sztuce wizualnej. Przetrwanie naszej kultury zależy od tego, czy nadal będziemy doskonalić język barw, kształtów i artystycznych interpretacji świata duchowego."
 aborig_walkabout: "Walkabout"
 aborig_walkabout_desc: "Tradycyjny aborygeński obrzęd walkabout polega na tym, że chłopiec wyrusza w podróż przez surowe australijskie pustkowia do świętego miejsca, takiego jak Uluru. Właśnie podczas tej wędrówki przechodzi przemianę z chłopca w mężczyznę. Podróż może trwać nawet sześć miesięcy, a w tym czasie młodzieniec musi żyć na odludziu bez jakiejkolwiek pomocy z zewnątrz. To trudna próba, która sprawia jednak, że przetrwają tylko najsilniejsi z nas."
 aborig_outback: "Ludzie interioru"
 aborig_outback_desc: "Australijski interior to surowa i bezlitosna kraina. Nawet dziś wiele jego obszarów pozostaje niemal całkowicie bezludnych, a wyprawa w głąb lądu uchodzi za wyrok śmierci. Mimo to Aborygeni potrafili przetrwać w tak trudnych warunkach, a nawet zbudować tam swoje życie."
 aborig_sacred: "Święte ziemie"
 aborig_sacred_desc: "Wierzenia religijne Aborygenów często przypisują boskie znaczenie wszystkim zakątkom Australii. Znane miejsca i formacje geograficzne na całym kontynencie uważa się za miejsca spoczynku bogów lub pozostałości dawnych konfliktów z Czasu Snu. Tęczowy Wąż, często uznawany za boga-stwórcę, ma przynosić deszcz. Gdy na niebie pojawia się tęcza, oznacza to, że Wąż przemieszcza się między wodopojami."
 aborig_dreamtime: "Czas Snu"
 aborig_dreamtime_desc: "Czas Snu odnosi się do epoki sprzed stworzenia wszechświata, gdy istniały jedynie duchy i bogowie. Poszczególne plemiona różnie wyjaśniają, jak z Czasu Snu powstał świat, lecz niemal wszystkie plemiona Australii wierzyły w tę epokę poprzedzającą istnienie materii. Medytację lub oddawanie czci bogom i przodkom często określa się mianem „Śnienia” — sięgania do wiedzy zawartej w świecie Czasu Snu. W tej rzeczywistości całe nasze pochodzenie istnieje jako jedność, a wiedza przodków jest dostępna każdemu, kto potrafi do niej dotrzeć."
 aborig_music: "Tradycja muzyczna"
 aborig_music_desc: "Muzyka aborygeńska wyróżnia się wyjątkowym brzmieniem i kompozycją. Didgeridoo to tradycyjny instrument wykorzystywany w tej muzyce. Przed przybyciem kolonistów tylko w Australii można było usłyszeć jego niezwykłe dźwięki. Niektóre pieśni i kompozycje Aborygenów mają nawet 1500 lat, a mimo to są wykonywane do dziś."
 aborig_fire_stick_farming: "Rolnictwo z użyciem ognia"
 aborig_fire_stick_farming_desc: "Australia jest surową i bezlitosną krainą, lecz nauczyliśmy się wykorzystywać busz do maksimum. Rolnictwo z użyciem ognia to technika opanowana przez rdzennych Australijczyków: wypalamy zarośla, by zrobić miejsce dla jadalnych roślin, takich jak dzikie ziemniaki, oraz przekształcamy obumarłe lasy w doskonałe tereny łowieckie dla kangurów."
 EOR_ideas: "Idee Eora"
 EOR_ideas_start: "Tradycje Eora"
 EOR_ideas_bonus: "Ambicja Eora"
 EOR_lifestyle: "Styl życia Eora"
 EOR_lifestyle_desc: "Jesteśmy ludem wybrzeża, żyjącym głównie w nadmorskich osadach i utrzymującym się z bogactw morza. Nie musimy uprawiać roli ani zakładać plantacji, skoro morze zapewnia nam wszystko, czego potrzebujemy. Doskonale znamy niewielkie zatoki i naturalne porty naszej ojczyzny i nadal będziemy trwać przy tym nadmorskim stylu życia."
 EOR_bands: "Dwadzieścia dziewięć wspólnot"
 EOR_bands_desc: "Lud Eora składa się z 29 odrębnych wspólnot. Łączą je wspólni przodkowie i więzi rodzinne, a małżeństwa między wspólnotami są powszechne i wzmacniają jedność naszego zróżnicowanego ludu. Zarządzanie tymi większymi wspólnotami i jednoczenie narodu w ramach luźnej struktury rządów okaże się przydatne, gdy nasze plemię będzie się rozwijać, a coraz więcej ludzi będzie przyjmować tożsamość Eora."
 EOR_enduring: "Trwała kultura"
 EOR_enduring_desc: "Kultura Eora jest tak stara, że jej początki giną w mrokach dziejów. Przetrwała wojny, podboje i zmieniające się czasy. Sztuka i kultura Eora mogą rozkwitać zarówno w najmniejszych wioskach, jak i w rozległych miastach przyszłości. Czasy się zmieniają, a do naszego narodu dołączają coraz liczniejsi ludzie, lecz jedno pozostanie niezmienne: duch Eora."
 EOR_protect: "Obrona ziem przodków"
 EOR_protect_desc: "Aborygeńscy mieszkańcy Sydney byli niezłomnymi obrońcami swojej ojczyzny i sprzeciwiali się najazdom obcych najeźdźców, nawet gdy działali wbrew własnym interesom. Podczas wielu wojen i konfliktów, które dotarły do wybrzeży Australii, mężczyźni i kobiety Eora chętnie zgłaszali się do walki w obronie swojej ziemi — nawet wtedy, gdy traktowano ich jak obywateli drugiej kategorii. To gotowość do walki w obronie świętej ziemi nieustannie porywa kolejne pokolenia do naszej sprawy."
 EOR_sacred: "Święte wybrzeże"
 EOR_sacred_desc: "Jesteśmy tradycyjnymi strażnikami tej świętej ziemi. Podczas gdy inne plemiona bez wahania porzuciłyby swoje domy dla żyźniejszych terenów, my, lud Eora, byliśmy tu od zawsze i pozostaniemy na tych ziemiach. Nasze 29 wspólnot żyje w harmonii wokół portu w Sydney, a współpraca naszego ludu sprawi, że ziemie Eora będą budzić zazdrość całego świata."
 EOR_pemulwuy: "Pemulwuy"
 EOR_pemulwuy_desc: "Gdy koloniści przybyli do Eora, szybko zaczęli ogołacać nasze wybrzeża z ryb, wyniszczać dziką zwierzynę i zanieczyszczać nasze wody. Nasz sposób życia dobiegał końca. Jednak odważni wojownicy, tacy jak Pemulwuy, przeciwstawili się obcym najeźdźcom i położyli kres ich destrukcyjnym działaniom. Zaciekłość i odwaga Pemulwuya będą wzorem dla wszystkich, a lud Eora będzie walczył nawet wbrew pozornie beznadziejnym przeciwnościom."
 EOR_berewaldal: "Berewaldal"
 EOR_berewaldal_desc: "Istnieją ludzie spoza naszych ziem, a nawet spoza samej Australii. Wiemy, że zazdroszczą nam cennych dóbr, które oferuje Eora, i że prędzej czy później spróbują je nam odebrać. Być może zamiast przemocy powinniśmy użyć zręcznych słów, by negocjować z przybyszami i znaleźć rozwiązanie korzystne dla obu naszych ludów."
 KAU_ideas: "Idee Kaurny"
 KAU_ideas_start: "Tradycje Kaurny"
 KAU_ideas_bonus: "Ambicja Kaurny"
 KAU_totemic_matriarchy: "Totemistyczny matriarchat"
 KAU_totemic_matriarchy_desc: "Lud Kaurna wywodzi swoje pochodzenie od matek, a wszystkie linie rodowe sięgają Czasu Snu. Każdy mężczyzna i każda kobieta noszą w sobie cząstkę boskości, a dzięki naszym matkom zbliżamy się do Śnienia."
 KAU_pangkarra: "System pangkarra"
 KAU_pangkarra_desc: "Nasze społeczeństwo dzieli się na kilka odrębnych wspólnot, z których każda działa samodzielnie, lecz wszystkie łączy tożsamość Kaurna. Zarządzanie naszym ludem jest łatwe, gdy pozwalamy mu swobodnie organizować własne życie."
 KAU_coastal_pangkarra: "Nadmorskie pangkarra"
 KAU_coastal_pangkarra_desc: "Oprócz autonomii i ograniczonego nadzoru każda wspólnota pangkarra musi mieć zagwarantowany od urodzenia dostęp do morza. Rybołówstwo i handel morski są nieodłączną częścią życia Kaurna, a wspólnota bez dostępu do wybrzeża nie jest prawdziwym pangkarra."
 KAU_redgum_shelters: "Schronienia z eukaliptusa"
 KAU_redgum_shelters_desc: "Podczas gdy inne społeczeństwa prowadzą osiadłe i wygodne życie, lud Kaurna przemieszcza się wraz ze zmianą pór roku. Latem ocean obfituje w ryby, lecz zimą nadchodzą deszcze, a utrzymywanie ognia w naszych schronieniach z eukaliptusa staje się niezbędne do przetrwania."
 KAU_communal_ownership: "Własność wspólnotowa"
 KAU_communal_ownership_desc: "Żadna jednostka nie ma prawa rościć sobie własności do tego, co należy do ludu Kaurna. Mienie nie należy do właścicieli ziemskich ani szlachty, lecz do plemienia i zamieszkujących je ludzi. Własność wspólnotowa gwarantuje, że nikt nie zostanie pominięty, a całe plemię wspólnie prosperuje lub cierpi."
 KAU_old_tjilbruke: "Pradawny Tjilbruke"
 KAU_old_tjilbruke_desc: "Nasz lud przekazuje opowieść o Tjilbruke, wielkim bohaterze plemienia Kaurna z czasów Śnienia. Dzięki swoim prawom i rozporządzeniom Tjilbruke zaprowadził pokój i zapewnił bezpieczeństwo naszemu ludowi. Był tak oddany sprawiedliwości, że skazał na śmierć nawet własnego siostrzeńca za złamanie świętych praw Kaurna."
 KAU_south_australia_act: "Ustawa o Australii Południowej"
 KAU_south_australia_act_desc: "W przeciwieństwie do innych ludów aborygeńskich, obce mocarstwa kolonialne uznają naszą niepodległość i prawo do samorządności. Posuwają się nawet do umieszczania naszej nazwy na swoich mapach i zakazywania swoim kompaniom osiedlania się na naszych terytoriach."
 PLW_ideas: "Idee Palawy"
 PLW_ideas_start: "Tradycje Palawy"
 PLW_ideas_bonus: "Ambicja Palawy"
 PLW_oyster: "Zatoka Ostrygowa"
 PLW_oyster_desc: "Wielka Zatoka Ostrygowa na naszej wyspie obfituje w ostrygi, małże, przegrzebki, jeżowce i niezliczone inne łatwo dostępne bogactwa morza. Na wybrzeża Palawy zapuszczają się niekiedy nawet wieloryby i uchatki, dostarczając nam obfitości mięsa, kości i futer. Nasza wyspa jest prawdziwie błogosławioną krainą. Opanowaliśmy sztukę pozyskiwania bogactw takich miejsc jak Zatoka Ostrygowa i wiemy, jak z zyskiem wymieniać je z innymi plemionami."
 PLW_dual_identity: "Podwójna tożsamość"
 PLW_dual_identity_desc: "Tożsamość Palawa opiera się na dwóch poziomach: rodzinnej wspólnocie domowej oraz klanie liczącym od 40 do 50 osób. Obie te formy przynależności funkcjonują w ramach nadrzędnej struktury plemienia."
 PLW_darwin: "Szkło darwinowskie"
 PLW_darwin_desc: "Przed wiekami naszą wyspę nawiedził niezwykły dar bogów, który spadł dokładnie w jej centrum. Choć spowodował wielkie zniszczenia, przyniósł też potężny materiał budowlany, doskonały do wyrobu włóczni i biżuterii. Nasza wyspa może być jedynym miejscem na świecie, gdzie występuje ten cenny surowiec. Musimy wykorzystać go w handlu i podczas wojen."
 PLW_parlevar: "Parlevar"
 PLW_parlevar_desc: "U zarania dziejów stwórcy Moinee i Droemerdene zabrali się za kształtowanie świata. Moinee był jego architektem: uformował ziemie i rzeki naszej wyspy, a na koniec wziął wędrującego ducha Parlevara i obdarzył go ciałem pierwszego człowieka. Wkrótce potem z ziemi wyłonił się kangur stworzony przez Moinee na podobieństwo Parlevara. Droemerdene przybrał postać gwiazdy, stał się przewodnikiem ludzkości i przemienił tych kanguro-ludzi w istoty ludzkie: usunął ich ogony i ukształtował kolana, aby mogli odpoczywać. Pierwszymi ludźmi byli Palawa, a zatem każdy, kto odrzuca tożsamość Palawa, zaprzecza własnym przodkom."
 PLW_writers: "Pierwsi aborygeńscy pisarze"
 PLW_writers_desc: "Choć kultury aborygeńskie często opierały się na tradycji ustnej i sztukach wizualnych, my, Palawa, należeliśmy do pierwszych, którzy przyjęli pismo jako sposób zachowania dziedzictwa przodków i przekazywania wiedzy naszego ludu. Nasze najwcześniejsze dzieła zawierały informacje o samej wyspie, jej historii oraz wspaniałe utwory poetyckie napisane w językach Palawa. Szybkie opanowanie pisma dowodzi, że potrafimy przyjmować nowe idee i dostosowywać dawne tradycje do zmieniających się czasów."
 PLW_survivors: "Ocalali z Czarnej Wojny"
 PLW_survivors_desc: "Gdy koloniści przybyli na naszą wyspę, zamierzali wyniszczyć nasz lud i odebrać nam ziemie. Konflikt był krwawy i niemal doprowadził do zagłady całego życia na wyspie. Walczyliśmy dzielnie z przeważającym przeciwnikiem, nie cofając się nawet wtedy, gdy lufy jego broni były wycelowane w nasze głowy."
 PLW_enduring: "Niezłomny lud"
 PLW_enduring_desc: "Po krwawych starciach z obcymi armiami kolonialnymi przy życiu pozostało zaledwie czterystu Palawa, którzy mogli kontynuować nasze dziedzictwo. Z biegiem lat nasza liczebność ponownie wzrosła, aż odzyskaliśmy dawną populację. Blizny po krzywdach wyrządzonych naszemu ludowi mogą nigdy się nie zagoić, lecz zawsze potrafimy podnieść się nawet po najkrwawszych konfliktach i odbudować straty poniesione w nierównej walce."
 LAR_ideas: "Idee Larrakia"
 LAR_ideas_start: "Tradycje Larrakia"
 LAR_ideas_bonus: "Ambicja Larrakia"
 LAR_makassar_trade: "Handel z Makasarem"
 LAR_makassar_trade_desc: "Przez stulecia Larrakia należeli do nielicznych ludów prowadzących handel z mieszkańcami ziem położonych poza wybrzeżami Australii. Kupcy z Makasaru przybywają po najbardziej pożądane australijskie towary: strzykwy, odzież i tytoń. Podczas gdy inni pozostają zamknięci na świat i handlują jedynie z sąsiadami, towary Larrakia docierają aż do odległych wybrzeży Chin."
 LAR_federation: "Federacja Larrakia"
 LAR_federation_desc: "Ziemie należące wyłącznie do Larrakia nie wystarczą, by przyciągnąć zagranicznych kupców. Dlatego utrzymujemy bliskie i przyjazne stosunki z sąsiadami, do tego stopnia, że nasze kultury przenikają się poprzez małżeństwa, wspólne ceremonie, pieśni i opowieści ze Śnienia."
 LAR_dreaming: "Śnienie Larrakia"
 LAR_dreaming_desc: "Opowieści Larrakia ze Śnienia sprawiają, że nasze ziemie są równie ważną częścią narodu jak jego mieszkańcy. Nasza więź z zamieszkiwaną ziemią i morzami ma wymiar zarówno duchowy, jak i fizyczny. Na całym wybrzeżu północnej Australii opowiadamy historie ze Śnienia, które ukształtowały świat."
 LAR_dowed: "Dowed"
 LAR_dowed_desc: "Pierwszy człowiek Larrakia, Dowed, został wydobyty z ziemi przez Nanganburrę i pouczony, jak płodzić potomstwo, ustanawiać prawa i mówić. Gdy się zestarzał, wielu odmówiło posłuszeństwa jemu i stworzonym przez niego prawom, a jego kary doprowadziły do śmierci wielu ludzi. Dzięki historii Doweda uczymy się delikatnej równowagi między legalizmem a miłosierdziem."
 LAR_ceremonial_scarring: "Blizny rytualne"
 LAR_ceremonial_scarring_desc: "W społeczeństwie Larrakia blizny są dobrowolnym znakiem nanoszonym na własne ciało. Skórę nacina się i bliznuje, by uczcić małżeństwo, narodziny dzieci lub śmierć zasłużonego członka rodziny. Blizny oznaczają życie pełne wspomnień, natomiast gładka skóra świadczy o naiwności i braku doświadczenia. Im mniej blizn, tym mniejsze prawo do udziału w ceremoniach i uroczystościach."
 LAR_hospitality: "Gościnność Larrakia"
 LAR_hospitality_desc: "Gdy obcy pojawiają się u wybrzeży Larrakia, niezależnie od tego, czy są przyjaciółmi, czy wrogami, przyjmujemy ich z gościnnością i szacunkiem, bez względu na pochodzenie i zamiary. Czy są to kupcy z Makasaru, czy europejscy kolonizatorzy, Larrakia zawsze zapewnią bezpieczny brzeg i powitanie godne przyjaciół."
 LAR_kenbi_land_claim: "Roszczenia do ziem Kenbi"
 LAR_kenbi_land_claim_desc: "Gdy kolonizatorzy przybyli na wybrzeża Australii i bezprawnie grabili ziemie Larrakia, odpowiedzieliśmy językiem, który rozumieli najlepiej: językiem prawa. Przygotowaliśmy dokument o długości trzech metrów, w którym dokładnie wyjaśniliśmy, dlaczego kompanie kolonialne łamią prawo międzynarodowe. Nasza biegłość w prawie czyni nas groźnym przeciwnikiem dla każdego potencjalnego kolonizatora."
