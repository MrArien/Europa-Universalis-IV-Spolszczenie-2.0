 indigenous_ideas: "Idee plemienne"
 indigenous_ideas_bonus: "Komplet idei plemiennych"
 indigenous_bountiful_land: "Hojne ziemie"
 indigenous_bountiful_land_desc: "Naszych ludzi otaczają ogromne połacie ziemi, nietknięte przez ludzi od pokoleń, gęste od fauny i flory."
 indigenous_irregular_warfare: "Wojna podjazdowa"
 indigenous_irregular_warfare_desc: "Dzięki wykorzystaniu naturalnego ukształtowania terenu, do którego jesteśmy przystosowani, możemy pokonać silniejszych wrogów poprzez najazdy i zasadzki."
 indigenous_constitution: "Wspólne prawo"
 indigenous_constitution_desc: "Jednocząc naszych ludzi poprzez zbiór wspólnych zasad, konstytucję, możemy dążyć do poprawy sytuacji nas wszystkich."
 indigenous_braves: "Odwaga"
 indigenous_braves_desc: "Nasza kultura ma długą tradycję rytuałów przejścia dla młodych mężczyzn, którzy stają się wojownikami. Jest to akt odwagi, pozwalający zakończyć podróż do dorosłości."
 indigenous_controlled_burns: "Kontrolowane pożary"
 indigenous_controlled_burns_desc: "Wypalając pola w sposób kontrolowany możemy uzyskać większe plony z naszych upraw, co pozwoli nam na znaczny rozrost populacji."
 indigenous_trade_with_foreigners: "Handel z cudzoziemcami"
 indigenous_trade_with_foreigners_desc: "Poprzez handel z ludźmi z innych kultur i odległych miejsc będziemy mogli poznać nowe idee."
 indigenous_treaties: "Przestrzeganie traktatów"
 indigenous_treaties_desc: "Nasze słowo jest naszym zobowiązaniem, nie do pomyślenia byłoby dla nas złamanie jakiegokolwiek zawartego przez nas traktatu. Dlatego po ustaniu działań wojennych obdarzamy się zaufaniem."
