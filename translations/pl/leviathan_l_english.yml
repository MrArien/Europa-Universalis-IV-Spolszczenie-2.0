 desc_tot_ceramics_discovered: "Odnalezienie starożytnej ceramiki pomoże nam udoskonalić własne techniki garncarskie."
 ancestor_just_personality_die_desc: "Nasz lud będzie tęsknić za sprawiedliwymi i bezstronnymi rządami [Root.Monarch.GetHerHis]."
 ancestor_righteous_personality_die_desc: "Nasz lud opłakuje odejście najcnotliwszego [Root.Monarch.GetTitle] naszego pokolenia."
 ancestor_tolerant_personality_die_desc: "Nasze mniejszości religijne będą opłakiwać odejście władcy, który odznaczał się tak wielką tolerancją."
 ancestor_kind_hearted_personality_die_desc: "Nasz lud zapamięta [Root.Monarch.GetHerHim] jako życzliwego i kochającego [Root.Monarch.GetTitle]."
 ancestor_free_thinker_personality_die_desc: "[Root.Monarch.GetSheHeCap] nigdy nie obawiał się łamać dawnych tradycji, by realizować nasze cele."
 ancestor_well_connected_personality_die_desc: "Bez wątpienia [Root.Monarch.GetSheHe] już teraz nawiązuje cenne znajomości w zaświatach."
 ancestor_calm_personality_die_desc: "[Root.Monarch.GetSheHeCap] przyniósł naszemu ludowi pokój i porządek."
 ancestor_careful_personality_die_desc: "Przemyślane decyzje [Root.Monarch.GetHerHis] umocniły naszą pozycję na świecie."
 ancestor_secretive_personality_die_desc: "Bez wątpienia [Root.Monarch.GetSheHe] zabrał wiele swoich tajemnic do grobu."
 ancestor_intricate_web_weaver_personality_die_desc: "[Root.Monarch.GetSheHeCap] jest opłakiwany przez całą armię informatorów."
 ancestor_benevolent_personality_die_desc: "Nasi poddani opłakują odejście tak łaskawego suwerena."
 ancestor_zealot_personality_die_desc: "Energia i niezłomna wiara [Root.Monarch.GetHerHis] nawróciły wielu niewiernych."
 ancestor_pious_personality_die_desc: "Być może nigdy więcej nie poznamy [Root.Monarch.GetTitle] o tak wielkiej cnocie i duchowej randze."
 ancestor_lawgiver_personality_die_desc: "Ostatecznie wszyscy zostaniemy osądzeni."
