 polynesian_tribe: "Polinezyjskie plemię"
 polynesian_tribe_desc: "Plemię polinezyjskie to forma rządów, w której przywódca zdołał zdobyć władzę nad jednym plemieniem lub ich grupą, lecz państwo nie działa jako zjednoczona całość."
 polynesian_kingdom: "Królestwo polinezyjskie"
 polynesian_kingdom_desc: "Królestwo polinezyjskie to forma rządów, w której polinezyjski monarcha jednoczy pod swoim panowaniem zwykle rywalizujące ze sobą plemiona, tworząc zjednoczone państwo."
 polynesian_tech: "Polinezyjska"
 polynesian_tech_desc: "W ramach polinezyjskiej grupy technologicznej koszt poziomu technologicznego jest wyższy o 100% (200% wartości podstawowej)."
