 dreamtime: "Alczeringa"
 dreamtime_religion_desc: "Czas Snu (Dreamtime) to religijny i kulturowy światopogląd rdzennych Australijczyków. Pojęcie to opisuje zarówno epokę sprzed powstania świata materialnego, jak i odrębną płaszczyznę istnienia równoległą do rzeczywistości materialnej. Uważa się, że szamani potrafią nawiązywać kontakt z Czasem Snu, a ślady Śnienia można odnaleźć na całym świecie."
 dreamtime_demand: "Nawróć kraj $COUNTRYNAME$"
 dreamtime_demand_desc: "Ci buntownicy religijni walczą o $RELIGION$. Żądają od nas uznania tej religii za panującą, a przynajmniej zaprzestania prób ich nawrócenia i zezwolenia im na przeżywanie swej wiary w spokoju."
 dreamtime_rebels_title: "Religie"
 dreamtime_rebels_name: "Fanatycy religijni ($RELIGION$)"
 dreamtime_rebels_desc: "Fanatycy religijni wzniecają zazwyczaj bunty w prowincjach rządzonych przez narody o innej wierze. Starają się rozpowszechniać swoją wiarę i tępią niewierzących."
 dreamtime_rebels_army: "Armia ($RELIGION$)"
