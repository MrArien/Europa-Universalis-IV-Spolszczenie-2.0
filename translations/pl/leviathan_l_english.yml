 volcano_events.1.t: "Początek ognia"
 volcano_events.1.d: "W czerni, która pochłonęła noc, ogniste strumienie obficie spływały w dół wzgórza niczym otwarta rana, a ich ostrej czerwieni nie sposób było zignorować. Rozżarzona lawina wulkanicznego popiołu podążała za nimi niczym niecierpliwy myśliwy, z otwartą paszczą pragnącą pożreć wszystko na swojej drodze, aż w końcu jej głód zostanie zaspokojony."
 volcano_events.1.d2: "W czerni, która pochłonęła noc, można było usłyszeć grzmiący dźwięk przypominający pierwsze bicie serca góry. Z jej uśpionego krateru uniosła się kolumna popiołu i dymu w obawie przed ożywieniem - ekstatyczna eksplozja narodzin natury. Żarzące się kamienie zostały wyrzucone na pobliskie wioski, po czym nastąpiła rozżarzona lawina wulkanicznego popiołu niczym niecierpliwy myśliwy."
 volcano_events.1.a: "Natura nas ukarała."
 monument_events.1.t: "Monument w prowicji [monument_province.GetName]!"
 monument_events.1.d: "Budowa naszego monumentu w prowincji [monument_province.GetName] została wreszcie ukończona! Ludzie z całego kraju gromadzą się przed jego imponującą sylwetką jak zaciekawione dzieci. Zdumieni tym cudem, cieszą się z przynależności do [Root.GetAdjective]."
 monument_events.1.a: "Dziś jest dzień do świętowania."
 monument_events.2.t: "Pomocna dłoń"
 monument_events.2.d: "Jeden z naszych najbardziej znanych i szanowanych kamieniarzy zwrócił się dziś rano do [Root.Monarch.GetRulerGen], wyrażając swoje zaniepokojenie stanem pomnika w mieście [monument_province_2.GetName]. 'Serce mi pęka, gdy widzę tak piękną konstrukcję beztrosko porzuconą, pozostawioną samą sobie w obliczu niebezpieczeństw czasu i pogody. Błagam cię, pozwól mi pomóc w jej odbudowie'."
 monument_events.2.a: "Powinniśmy go natychmiast zatrudnić."
 monument_events.2.b: "Nie mamy na to czasu."
 monumental_pride: "Monumentalna duma"
 desc_monumental_pride: "Budowa jednego z największych pomników naszego narodu napełnia serca naszych ludzi dumą z bycia częścią naszego królestwa!"
 monument_boost: "Ulepszenia monumentów"
 desc_monument_boost: "Zatrudnianie najlepszych kamieniarzy w naszym kraju pomogło zoptymalizować budowę naszych pomników."
 monument_church_of_the_people: "Kościół ludu"
 desc_monument_church_of_the_people: "Od skromnego chłopa do najwyższego duchownego, każdy z nasz[Root.GetGovGender_nasz] [Root.GetGovNameGen] jest mile widziany w Bazylice Świętego Piotra."
