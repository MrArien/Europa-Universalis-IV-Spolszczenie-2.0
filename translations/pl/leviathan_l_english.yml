 NATIVE_TRIBE_MIGRATORY_DEVELOPMENT_HEADER_TOOLTIP: "§YRozwój plemienny§!\nCo miesiąc zyskujemy rozwój plemienny dzięki wypasowi na ziemiach, których spustoszenie nie przekracza §Y100%§!. Dodatkowy rozwój plemienny otrzymujemy za wypas na ziemiach plemiennych należących do innego państwa.\nIlość uzyskanego rozwoju plemiennego zostanie podzielona przez aktualny rozwój plemienny, jeśli jest on większy niż 1."
