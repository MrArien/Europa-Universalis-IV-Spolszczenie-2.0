 extended_regency_events.1.t: "Bez urazy"
 extended_regency_events.1.d: "Dobre wykształcenie i naturalny urok [Root.Heir.GetName] sprawiły, że [Root.Heir.GetHerHim] jest bardzo odpowiednim kandydatem do objęcia tronu. Nieudolne rządy [Root.Monarch.GetName] sprawiły jednak, że [Root.GetName] cierpi z powodu braku stabilności. Rządzenie państwem jest równie trudne i delikatne jak zbieranie róż bez ukłucia się choćby jednym kolcem. Nie każdy rodzi się z odpowiednimi umiejętnościami. Być może moglibyśmy wykorzystać jeden z tych kolców…"
 extended_regency_events.1.a: "Musimy za wszelką cenę zapewnić stabilność państwa [Root.GetName]."
 extended_regency_events.2.t: "Nawet jako cień"
 extended_regency_events.2.d: "Po tym, jak [Root.Monarch.GetName] uniknął zamachu na swoje życie, zaczęło ogarniać go coś, co sam nazywa ostrożnością, choć inni określiliby to znacznie mniej pochlebnymi słowami. [Root.Monarch.GetSheHeCap] zaczął unikać spotkań towarzyskich, pozostawiając reszcie rady zarządzanie całym państwem.\n[Root.Monarch.GetHerHisCap] rażący brak odpowiedzialności wzbudził na dworze wiele podejrzeń. Opinię publiczną o [Root.Monarch.GetName] pogarsza jednak przede wszystkim dziwne zachowanie, które [Root.Monarch.GetSheHe] ostatnio przejawia: oczy czerwone i szeroko otwarte w środku nocy, mamrotanie w ciemnościach, że nigdy nie opuści tronu, oraz błaganie, by ktoś przybył do [Root.Monarch.GetHerHim] — choćby jako cień, choćby jako sen."
 extended_regency_events.2.a: "Musimy natychmiast położyć temu kres."
 extended_regency_events.2.b: "Musimy go powstrzymać."
 extended_regency_events.2.c: "Nie jest aż tak źle."
 extended_regency_events.2.e: "Musimy uciec się do… mniej przyziemnych metod."
 extended_regency_events.3.t: "Nawet jako sen"
 extended_regency_events.3.d: "Nieudana próba powstrzymania [Root.Monarch.GetName] przed pogarszaniem losu naszego państwa potwierdziła jedynie obawy związane z jego paranoją, jeszcze bardziej szkodząc [Root.Monarch.GetHerHis] zdrowiu psychicznemu. Po przesłuchaniu najbliższych członków rady [Root.Monarch.GetName] zaczął bez zapowiedzi wchodzić do ich komnat w towarzystwie królewskich strażników. Surowym tonem oznajmia jedynie: \\\"Tak trzeba\\\" — i nakazuje przeszukiwać ich rzeczy."
 extended_regency_events.3.a: "To strata czasu i wysiłku."
 extended_regency_events.3.b: "Powstrzymanie [Root.Monarch.GetHerHim] przyniosłoby nam tylko więcej kłopotów."
 extended_regency_events.4.t: "Nieprawe umysły"
 extended_regency_events.4.d: "Złoto jest niebezpieczne, a jego kuszący blask trudno odeprzeć. Czai się w cieniu, przyciągając nieświadomych głupców zgubnym połyskiem, a jego złocista, okrągła powierzchnia przypomina dwoje demonicznych oczu. [Root.Monarch.GetName] dobrze zna to niebezpieczne uczucie. Z irytacją na twarzy desperacko szuka nowej zabawki, a palcami przeszukuje każdą szufladę i każdą kieszeń, próbując zamienić wszystko, czego dotknie, w złoto niczym Midas.\nTymczasem nasze państwo cierpi, ludność powoli popada w rozpacz, a głodne usta wznoszą modlitwy."
 extended_regency_events.4.a: "Nie możemy pozwolić, by [Root.Monarch.GetName] zrujnował nasz kraj."
 extended_regency_events.4.b: "Wszyscy ulegamy tym samym grzechom."
 extended_regency_events.4.c: "Teraz jest już za późno!"
 extended_regency_events.5.t: "Poszukiwanie skarbu"
 extended_regency_events.5.d: "Wszystko zaczęło się od niewinnych śmiechów, przelotnych uwag i pozornie nieszkodliwych sugestii. Z czasem pojawiły się jednak chytre uśmiechy, złośliwe komentarze i złowrogie rozkazy.\nCały pałac wiedział, że [Root.Monarch.GetName] zbyt mocno przywiązał się do władzy, lecz niewielu przypuszczało, że posunie się tak daleko, by ją zachować. Nasz prawowity następca tronu, [Root.Heir.GetName], został uwięziony po tym, jak zaproszono [Root.Heir.GetHerHim] do „odnalezienia wyjątkowego skarbu” ukrytego w lochach."
 extended_regency_events.5.a: "Po całym kraju rozchodzą się plotki."
 extended_regency_events.6.t: "Dawne dni chwały"
 extended_regency_events.6.d: "Czasami nadzieja pojawia się w najmniej oczekiwanych miejscach. Od początku regencji [Root.Monarch.GetName] okazał się znakomitym władcą, zawsze świadomym potrzeb naszego ludu. Niektórzy posuwają się nawet do stwierdzenia, że nasze państwo rozkwitłoby jeszcze bardziej, gdyby [Root.Monarch.GetSheHe] pozostał u władzy nieco dłużej…\nWkrótce [Root.Heir.GetName] osiągnie pełnoletność, więc teoretycznie nie powinno być to możliwe. Nieudolność następcy tronu zdążyła już jednak rozwścieczyć większość [Root.Heir.GetHerHis] nauczycieli. Wielu z nich opuściło nasz dwór, nie zdoławszy poskromić [Root.Heir.GetHerHim]."
 extended_regency_events.6.a: "Jestem pewien, że da się coś zrobić…"
 extended_regency_events.6.b: "[Root.Heir.GetSheHe] nie jest pierwszym nieudolnym następcą tronu."
