 blessing_manthras: "Mantry"
 blessing_dakhma: "Dachma"
 HOLY_SITE_421_DESC: "Ateszgah w Baku jest jedną z najważniejszych świątyń ognia zaratusztrianizmu. Choć znajduje się właściwie w Surachany, od starożytności jest związany z miastem Baku. Nazywano go również „Ogniami Baguan”, nawiązując do nazwy miasta. Ogień wydobywa się bezpośrednio z powierzchni ziemi, a jego płomienie płoną nieustannie i z niezwykłą siłą. Mówi się, że w okolicy wciąż mieszkają czciciele ognia."
 HOLY_SITE_4336_DESC: "Ateszgah w Baku jest jedną z najważniejszych świątyń ognia zaratusztrianizmu. Choć znajduje się właściwie w Surachany, od starożytności jest związany z miastem Baku. Nazywano go również „Ogniami Baguan”, nawiązując do nazwy miasta. Ogień wydobywa się bezpośrednio z powierzchni ziemi, a jego płomienie płoną nieustannie i z niezwykłą siłą. Mówi się, że w okolicy wciąż mieszkają czciciele ognia."
 HOLY_SITE_441_DESC: "Według przekazów prorok Zaratustra urodził się w Chorezmie, dlatego region ten, a zwłaszcza jego dawna stolica — Chiwa — są uznawane za święte i za kolebkę zaratusztrianizmu. Najazdy muzułmańskie poważnie zaszkodziły naszej religii w tym regionie, lecz niewielkie wspólnoty wyznawców nadal stawiają opór, a nawet wśród miejscowych muzułmanów przetrwało wiele zaratusztriańskich tradycji."
 HOLY_SITE_2223_DESC: "Atasz Bahram, uznawany za ogień stanu kapłańskiego i zwany Adur Farnbag, płonie w regionie Larestanu, niedaleko miasta Karyan. Jest najbardziej czczonym spośród trzech Ogni Zwycięstwa. Pozostałe dwa to Adur Gusznap, poświęcony wojownikom, oraz Adur Burzen-Mihr, poświęcony rolnikom."
 HOLY_SITE_2235_DESC: "Na górze Revand w Chorasanie, niedaleko miasta Kaszmar, płonie Adur Burzen-Mihr — jeden z trzech Atasz Bahram, czyli Ogni Zwycięstwa — związany ze stanem rolniczym. W starożytności było to ważne miejsce pielgrzymek, a jego znaczenie dla zaratusztrian nie osłabło do dziś."
 HOLY_SITE_2212_DESC: "Od czasów Imperium Sasanidów na szczytach gór w pobliżu miasta Zandżan płonął Adur Gusznap, ogień najwyższej rangi. Choć świątynię złupili Bizantyjczycy, wiernym udało się ocalić płomień. Jego blask przygasł jednak podczas późniejszych najazdów muzułmańskich i prześladowań. Teraz ogień znów jasno płonie w swoim świętym miejscu, ponownie związanym ze stanem wojowników, i przyciąga pielgrzymów z najdalszych stron."
 HOLY_SITE_4430_DESC: "Gdy Chorezm dostał się pod panowanie muzułmanów, część wyznawców uciekła do Indii i założyła wspólnotę w Sanjan, zabierając ze sobą święty ogień. Między nową wspólnotą a pierwotną wspólnotą w Persji, od której pochodzi nazwa Sanjan, powstała silsila, czyli tradycyjna więź. Od 1297 roku ogień przenoszono w różne miejsca: najpierw do jaskiń Bahrot, następnie do wioski Bansda, a ostatecznie do Navsari."
