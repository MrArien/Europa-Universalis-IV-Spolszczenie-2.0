 zoroastrian.1.t: "Parsyjskie sanktuarium w Sanjan"
 zoroastrian.1.d: "Od dawna polegamy na naszych parsyjskich poddanych w sprawach państwowych. Od pokoleń służą naszemu [Root.Monarch.GetTitle] jako lojalni doradcy. Ostatnio społeczność z Sanjan zwróciła się do nas z prośbą o ochronę przed prześladowaniami."
 zoroastrian.1.a: "Sanjan na zawsze pozostanie parsyjskie"
 zoroastrian.1.b: "Powinni znać swoje miejsce"
