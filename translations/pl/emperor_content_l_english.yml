 institution_events.80.t: "Rewolucja przemysłowa"
 institution_events.80.d: "Gwałtowne tempo zmian technologicznych zaczyna głęboko wpływać na samą organizację społeczeństwa. Wynalezienie maszyny parowej, wykorzystanie koksu w produkcji żelaza oraz nowe, zmechanizowane urządzenia produkcyjne umożliwiają osiąganie niespotykanych wcześniej korzyści skali, znacznie zwiększając wydajność pracy. Kolejne wynalazki ułatwiają transport dużych ilości towarów. W warunkach bezprecedensowej integracji światowego handlu fabryki mogą pozyskiwać surowce i sprzedawać gotowe wyroby na rynkach całego świata, przynosząc właścicielom niewyobrażalne bogactwa.\n\nRównież rolnictwo korzysta z nowych praktyk, takich jak płodozmian i grodzenie pól, które zwiększają wydajność produkcji. Do uprawy tej samej powierzchni ziemi potrzeba dzięki temu mniej pracowników, co skłania wielu ludzi do opuszczania domów i osiedlania się w rozwijających się miastach przemysłowych. Rodzi się nowy świat, w którym ambitni i bogaci będą dominować nad społeczeństwem bardziej niż kiedykolwiek wcześniej."
 institution_events.80.a: "To wszystko zmienia..."
 institution_events.80.a.tt: "§YPrzyjęcie§! §YUprzemysłowienia§! będzie miało kluczowe znaczenie dla przyszłego postępu §Ytechnologicznego§!."
 institution_events.801.d: "Kupcy donoszą o ogromnym napływie tanich, wytwarzanych za granicą towarów na nasze rynki. Jednocześnie zauważono wielu zagranicznych handlowców, którzy kupują od nas równie duże ilości surowców. Chociaż ich pochodzenie nie jest znane, zmiany te mają już głęboki wpływ na organizację naszego społeczeństwa."
 birthplace_of_industrialization: "Fabryki masowej produkcji"
 desc_birthplace_of_industrialization: "Prowincja ta była miejscem, w którym po raz pierwszy opracowano i wdrożono nowe metody oraz technologie rewolucji przemysłowej. Do dziś pozostaje prężnym miejskim ośrodkiem przemysłowym."
 institution_events.81.t: "Przyjęcie nowych metod produkcji"
 institution_events.81.da: "Hutnicy z prowincji [industrialisation_province.GetName] znacznie zwiększyli produkcję surówki i żelaza kutego, przyjmując metody opracowane za granicą. To ogromna korzyść dla wszystkich producentów potrzebujących trwałego żelaza, ponieważ mogą zwiększyć produkcję przy niższych kosztach. Pojawiła się propozycja, by inne części naszego kraju również przyjęły te metody. Wymagałoby to jednak znacznych inwestycji..."
 institution_events.81.db: "Producenci tekstyliów z prowincji [industrialisation_province.GetName] znacznie zwiększyli produkcję dzięki zastosowaniu metod opracowanych za granicą. Nowe urządzenia radykalnie zwiększyły wydajność pracy, rewolucjonizując produkcję tekstyliów w prowincji i pozwalając właścicielom fabryk zgromadzić znaczne bogactwa. Pojawiła się propozycja, by inne części naszego kraju również przyjęły te metody. Wymagałoby to jednak znacznych inwestycji..."
 institution_events.81.a: "To wszystko zmienia..."
 institution_events.81.b: "Dobrze dla nich."
 institution_events.82.name: "Zmiana lokalnej produkcji"
 institution_events.82.desc: "Nasi sąsiedzi z państwa [institution_country.GetUsableName] znacznie zwiększyli produkcję wyrobów przemysłowych dzięki zastosowaniu nowych metod i technologii, których tajników nasi producenci jeszcze nie poznali. Tańsze towary zalewają teraz nasze rynki, utrudniając lokalnym wytwórcom utrzymanie się na powierzchni. Z drugiej strony nienasycony popyt przemysłu państwa [institution_country.GetAdjective] sprawia, że surowce produkowane w państwie [Root.GetUsableName] cieszą się ogromnym zainteresowaniem. W rezultacie mieszkańcy coraz częściej porzucają miejskie fabryki na rzecz wiejskich plantacji."
 institution_events.82.a: "Musimy temu zapobiec."
 institution_events.82.b: "Niech tak będzie."
