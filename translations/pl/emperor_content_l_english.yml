 flavor_kor.12.t: "Sytuacja chłopstwa"
 flavor_kor.12.d: "Choć Korea przeżywała w ostatnich latach coś na kształt złotego wieku, nie przyniosło to większego dobrobytu chłopom, którzy w większości żyją w skrajnej biedzie. Widać już pierwsze oznaki niezadowolenia, które mogą zagrozić stabilności kraju. Musimy podjąć działania, by poprawić ich los, jeśli chcemy uniknąć poważnych niepokojów."
