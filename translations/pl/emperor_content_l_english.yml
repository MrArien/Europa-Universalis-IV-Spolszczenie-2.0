 war_of_the_roses.200.name: "Ucieczka pretendenta"
 war_of_the_roses.200.desc.york: "Pretendent Ryszard York uciekł w chaosie po swojej porażce w bitwie pod [From.GetCapitalName]! Nie wiadomo, gdzie się ukrywa, możemy jednak przypuszczać, że gromadzi wojska, by ponownie sięgnąć po koronę."
 war_of_the_roses.200.desc.lancaster: "Pretendent Edward Lancaster uciekł w chaosie po swojej porażce w bitwie pod [From.GetCapitalName]! Nie wiadomo, gdzie się ukrywa, możemy jednak przypuszczać, że gromadzi wojska, by ponownie sięgnąć po koronę."
 war_of_the_roses.200.opt: "Odnajdziemy tego pretendenta."
 war_of_the_roses.201.name: "Powrót pretendenta"
 war_of_the_roses.201.desc.york: "Pretendent Ryszard York ponownie pojawił się w prowincji [new_revolt_province.GetName] na czele nowej armii. Musimy zebrać wojska, by stawić czoła temu zagrożeniu!"
 war_of_the_roses.201.desc.lancaster: "Pretendent Edward Lancaster ponownie pojawił się w prowincji [new_revolt_province.GetName] na czele nowej armii. Musimy zebrać wojska, by stawić czoła temu zagrożeniu!"
 war_of_the_roses.201.opt: "Ściąć mu głowę!"
 flavor_eng.lost_to_royalists: "Zwyciężyli rojaliści. Niestety, nasze swobody przepadły!"
 flavor_eng.lost_to_parliament: "Zwyciężył parlament. Niestety, król przegrał!"
 english_civil_war.11.d.heir: "Wojna domowa, która pustoszyła nasz kraj, dobiegła końca i stoimy teraz na rozdrożu. Niektórzy uważają, że to idealny moment na przywrócenie monarchii i ponowne osadzenie na tronie dawnego następcy, pod warunkiem jednak, że rządy w państwie [Root.GetName] będą ograniczone ścisłą konstytucją i prawami, które zapobiegną powtórzeniu się kryzysu prowadzącego do niedawnych niepokojów. Inni twierdzą, że nadszedł czas całkowitego zniesienia monarchii i ustanowienia nowoczesnej republiki opartej na dawnych zasadach angielskiego parlamentaryzmu."
 english_civil_war.12.d.heir: "Po śmierci Lorda Protektora wciąż musimy zdecydować, jak powinien rozwijać się nasz kraj. Niektórzy uważają, że to idealny moment na przywrócenie monarchii i ponowne osadzenie na tronie dawnego następcy, pod warunkiem jednak, że rządy w państwie [Root.GetName] będą ograniczone ścisłą konstytucją i prawami, które zapobiegną powtórzeniu się sytuacji prowadzącej do zakończonej właśnie wojny domowej. Inni twierdzą, że nadszedł czas całkowitego zniesienia monarchii i ustanowienia nowoczesnej republiki opartej na dawnych zasadach angielskiego parlamentaryzmu."
 japan.2.name: "Nowy szogun"
 japan.2.desc: "Państwo [new_shogunate.GetName] przejęło urząd szoguna i domaga się teraz naszej wierności. Czy powinniśmy uznać jego władzę?"
 japan.2.A: "Ugnijmy się przed nowym szogunem."
 japan.2.B: "Piraci nie uznają żadnych panów."
 japan.3.name: "Państwo [From.GetName] rzuca nam wyzwanie"
 japan.3.desc: "Piraci z państwa [From.GetName] odrzucają nasze roszczenia do urzędu szoguna. Odprawili naszego ambasadora i zamierzają rządzić swoimi ziemiami jako niepodległe państwo."
 japan.3.opt: "Z czasem i tak się nam podporządkują."
 opinion_defy_new_shogun: "Sprzeciw wobec naszej władzy jako szoguna"
 PIRATE_DAIMYO: "Piracki Daimyo"
 emperor_reichsstabilitaet_title: "Absolutny Reichsstabilität"
 emperor_reichsstabilitaet_desc: "Zapewnienie stabilności Cesarstwu poprzez zabezpieczenie środków do jego ekspansji."
 emperor_perpetual_diet_title: "Zgromadzenie Nieustające"
 emperor_perpetual_diet_desc: "Ustanowienie stałej sesji Cesarskiego Zgromadzenia, tak aby ważne sprawy mogły być rozpatrywane na bieżąco."
 emperor_landsknechtswesen_title: "Utwórz Landsknechtswesen"
 emperor_landsknechtswesen_desc: "Zorganizuj liczne niemieckie drużyny najemników w oficjalne pułki gotowe do obrony Cesarstwa."
 emperor_reichstag_collegia_title: "Ustanów Reichstag Collegia"
 emperor_reichstag_collegia_desc: "Podzielić Reichstag na osobne kolegia dla cesarza, książąt i miast cesarskich, aby usprawnić jego funkcjonowanie dla wszystkich."
 emperor_geteilte_macht_title: "Geteilte Macht"
 emperor_geteilte_macht_desc: "Zagwarantować władzę książętom, aby ci z kolei mogli wspierać siłę cesarza."
 emperor_rechenschaft_title: "Wprowadź Rechenschaft"
 emperor_rechenschaft_emperor_per_prince: "Rechenschaft"
 emperor_rechenschaft_desc: "Rozszerz system kontroli i równowagi Cesarstwa w celu stworzenia bardziej sprawiedliwego systemu."
 emperor_expand_gemeiner_pfennig_title: "Zwiększ Gemeiner Pfennig"
 emperor_expand_gemeiner_pfennig_desc: "Zwiększ podatek powszechny, aby zwiększyć możliwości Cesarstwa w czasie wojny."
 emperor_reichskrieg_title: "Reichskrieg"
 emperor_reichskrieg_desc: "Mobilizuj siły Cesarstwa przeciwko wszystkim, którzy mogą próbować mu zagrozić!"
 emperor_imperial_estates_title: "Ogranicz klasy społeczne Cesarstwa"
 emperor_imperial_estates_desc: "Ogranicz swobody cesarskich klas społecznych, aby nie były one już w stanie przeciwstawić się cesarzowi."
