 genevan_province_tt: "§YGenewa§! zażąda kontroli nad wszystkimi prowincjami §YSabaudii§! o §Yszwajcarskiej kulturze§!."
 westphalia_peace_trigger_tt: "W Cesarstwie zostanie ustanowiony §Ypokój religijny§! albo dojdzie do §Ywojny lig§!, a oficjalną religią Świętego Cesarstwa Rzymskiego będzie §Y[Root.Religion.GetName]§!."
