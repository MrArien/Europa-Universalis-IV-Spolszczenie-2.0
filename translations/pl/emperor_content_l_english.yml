 incident_hungary_mission_emperor_alert: "Po zjednoczeniu Królestw Węgier i Czech pod berłem jednego monarchy Węgrzy zwrócili się do [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName], występującego w [Emperor.Monarch.GetHerHis] roli cesarza Świętego Cesarstwa Rzymskiego, z prośbą o przyjęcie do Cesarstwa. Ponadto twierdzą, że skoro Czechy są teraz jedynie częścią ich rozleglejszego władztwa, godność elektorska Czech powinna zostać oficjalnie im przekazana."
 incident_hungary_mission_member_alert: "Po zjednoczeniu Królestw Węgier i Czech pod berłem jednego monarchy Węgrzy zwrócili się do [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName], występującego w [Emperor.Monarch.GetHerHis] roli cesarza Świętego Cesarstwa Rzymskiego, z prośbą o przyjęcie do Cesarstwa. Ponadto twierdzą, że skoro Czechy są teraz jedynie częścią ich rozleglejszego władztwa, godność elektorska Czech powinna zostać oficjalnie im przekazana."
