 flavor_hun.201.name: "Śmierć Władysława Pogrobowca"
 flavor_hun.201.d.king_no_heir: "Nasz ukochany król, Władysław Pogrobowiec, zmarł nagle w podejrzanych okolicznościach. Podejrzenia o nieuczciwe działania wydają się tym bardziej uzasadnione, że miał właśnie zjednoczyć Austrię i Węgry pod swoimi rządami, podporządkowując Węgry obcej władzy. Szlachta już zabiega o zastąpienie go swoim faworytem, Maciejem Hunyadym, synem wielkiego wojewody Jana Hunyadiego. Oznaczałoby to zerwanie habsburskiej linii sukcesji do węgierskiego tronu. Inni opowiadają się jednak za utrzymaniem dobrych stosunków z Habsburgami i twierdzą, że [HAB.Monarch.GetTitle] [HAB.Monarch.GetName] z Austrii powinien być prawowitym następcą Władysława."
 flavor_hun.201.d.king: "Nasz ukochany król, Władysław Pogrobowiec, zmarł nagle w podejrzanych okolicznościach. Podejrzenia o nieuczciwe działania wydają się tym bardziej uzasadnione, że miał właśnie zjednoczyć Austrię i Węgry pod swoimi rządami, podporządkowując Węgry obcej władzy. Linia sukcesji została teraz przerwana, a [Root.Heir.GetTitle] [Root.Heir.GetName] obejmie tron Węgier."
 flavor_hun.201.d.heir: "Nasz ukochany następca tronu, Władysław Pogrobowiec, zmarł nagle w podejrzanych okolicznościach. Podejrzenia o nieuczciwe działania wydają się tym bardziej uzasadnione, że po osiągnięciu pełnoletności miał zjednoczyć Austrię i Węgry pod swoimi rządami, podporządkowując Węgry obcej władzy. Szlachta już zabiega o zastąpienie go swoim faworytem, Maciejem Hunyadym, synem wielkiego wojewody Jana Hunyadiego. Oznaczałoby to zerwanie habsburskiej linii sukcesji do węgierskiego tronu."
 flavor_hun.201.a: "Maciej zostanie naszym nowym następcą tronu."
 flavor_hun.201.b: "Stary król nie żyje, niech żyje król!"
 flavor_hun.201.c: "Najlepszy byłby król niemiecki."
 flavor_hun.201.d: "Wybierzmy Macieja na króla."
