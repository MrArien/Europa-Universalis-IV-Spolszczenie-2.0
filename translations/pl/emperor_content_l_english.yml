 french_wars_of_religion.1.desc.catholic: "Wiara [religion_province.Religion.GetName] rozprzestrzenia się wśród ludności niczym pożar, a jej przywódcy stają się coraz śmielsi. Wielu katolików niepokoi sytuacja w państwie [Root.GetName]. Napięcia między obiema grupami osiągnęły punkt kulminacyjny wraz z utworzeniem Ligi [religion_province.Religion.GetName] – organizacji paramilitarnej, która dąży do osadzenia na tronie państwa [Root.GetName] [Root.Monarch.GetTitle] wyznania [religion_province.Religion.GetName]. Jeśli to się nie powiedzie, żąda przyznania znaczących praw i swobód, które zagwarantują jej przyszłość. Przywódcy społeczności katolickiej ostrzegają z kolei przed ustępstwami i sugerują, że jeśli [Root.Monarch.GetTitle] zostanie uznany za tego, kto odwrócił się od [Root.Monarch.GetHerHis] nauk papieża, wybuchnie przemoc. Niezależnie od naszego wyboru czeka nas zamęt.\n\nJak powinniśmy postąpić?"
 french_wars_of_religion.1.desc.not_catholic: "Francuscy katolicy są oburzeni przejściem [Root.Monarch.GetTitle] na wiarę [Root.Religion.GetName]. Nie godząc się na daleko idące zmiany w naszym państwie i obawiając się o swoją przyszłość, utworzyli organizację paramilitarną zwaną Ligą Katolicką. Domagają się, by [Root.Monarch.GetTitle] ponownie podporządkował się papieżowi, a jeśli to się nie powiedzie – by przyznano im znaczące prawa i swobody gwarantujące bezpieczeństwo. Przywódcy społeczności wyznania [Root.Religion.GetName] ostrzegają z kolei przed ustępstwami i sugerują, że jeśli [Root.Monarch.GetTitle] okaże przychylność katolikom, wybuchnie przemoc. Niezależnie od naszego wyboru czeka nas zamęt.\n\nJak powinniśmy postąpić?"
 french_reformed: "Francuscy reformowani"
 desc_french_reformed: "Podczas wojen religijnych opowiedzieliśmy się po stronie wyznawców kalwinizmu."
 bought_indulgence: "Kupiono odpusty"
 desc_bought_indulgence: "Kupiliśmy odpust od papieża."
 dodo.1.name: "Ptaki nieloty w prowincji [Root.GetName]"
 dodo.1.desc: "Nasi koloniści z prowincji [Root.GetName] donoszą, że wyspa jest domem dużego, nielotnego i dość brzydkiego ptaka o niezgrabnym chodzie. Podobno można go niezwykle łatwo upolować, ponieważ nigdy wcześniej nie musiał mierzyć się z dużymi drapieżnikami, a jego mięso ma przyjemny smak. Już teraz liczebność tych ptaków zaczyna spadać. Nasz przyrodnik [Root.Owner.Adm_Advisor.GetName] osobiście zainteresował się tymi doniesieniami i proponuje wyprawę naukową, która schwyta żywe okazy i przewiezie je do miasta [Root.Owner.Capital.GetCapitalName], by można je było zbadać, zanim wyginą – jak to często spotyka gatunki tak wyraźnie nieprzystosowane do współistnienia z ludźmi."
 dodo.1.A: "Wyślijmy ekspedycję."
 dodo.1.A.tt: "Podejmiemy próbę schwytania żywego okazu tego ptaka."
 dodo.1.B: "Te ptaki będą dobrym pożywieniem dla naszych kolonistów."
 edible_dodos: "Jadalne dodo"
 desc_edible_dodos: "Na tej wyspie żyje duży, nielotny gatunek ptaka, którego łatwo upolować, a jego mięso ma przyjemny smak."
 dodo.2.name: "Dodo"
 dodo.2.desc: "Wyprawa do państwa [From.GetName] zakończyła się sukcesem – schwytano kilka żywych okazów ptaka nazwanego dodo. Jest większy od łabędzia i dość krępy, a jego ogromna głowa jest tylko w połowie pokryta skórą, jakby nosił kaptur. Ma duży, zakrzywiony w dół dziób i małe oczy przypominające diamenty. Cała jego sylwetka sprawia wrażenie nieco melancholijnej, jak gdyby ptak ubolewał nad swoją niezdolnością do latania – jego małe, bezużyteczne skrzydła jedynie potwierdzają, że należy do ptaków. Mimo to ma znakomity apetyt, co nie powinno dziwić, biorąc pod uwagę jego sposób poruszania się.\n\nPo dokładnym zbadaniu ptaka [Root.Owner.Adm_Advisor.GetName] zorganizował jego publiczną prezentację w mieście [Root.Owner.Capital.GetCapitalName]."
 dodo.2.A: "Piórko do naszej czapki."
 dodo.3.name: "Wymarły jak dodo"
 dodo.3.desc: "Wyprawa do państwa [From.GetName] nie znalazła żadnego śladu tego ptaka. Jeśli kiedykolwiek istniał, jego populacja była niewielka i nie przetrwała polowań prowadzonych przez ludzi. Mimo to nasi uczeni szczegółowo zbadali przyrodę wyspy, odkrywając kilka nowych gatunków i udzielając kolonistom cennych wskazówek, jak przystosować się do nowego domu."
 dodo.3.A: "Smutna historia."
