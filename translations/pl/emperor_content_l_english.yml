 imperial_diplomacy_reform: "Cesarska dyplomacja"
 imperial_diplomacy_reform_desc: "Miasto nie zdoła utrzymać niepodległości bez wsparcia cesarza i naszych pozostałych sojuszników. Skupimy się na wzmacnianiu więzi dyplomatycznych, aby nasi przyjaciele zawsze stali u naszego boku, gdy będziemy potrzebować ich pomocy w obronie miasta."
 municipal_self_defense_reform: "Samoobrona miejska"
 municipal_self_defense_reform_desc: "Przetrwanie możemy zapewnić sobie wyłącznie dzięki wykorzystaniu potencjału militarnego naszego miasta. Przyznamy większą władzę polityczną kapitanom straży miejskiej i zadbamy o to, by mieli wszystko, czego potrzebują do obrony."
 austrian_archduchy_reform: "Arcyksięstwo Austrii"
 austrian_archduchy_reform_desc: "Choć zorganizowane podobnie do monarchii feudalnej, arcyksięstwo Austrii jest bardziej rozwinięte niż inne księstwa Europy. Dzięki długiemu doświadczeniu w rządzeniu innymi - czy to Tyrolczykami, Styryjczykami, Węgrami czy Czechami - i układaniu spraw dynastycznych na swoją korzyść, arcyksiążęta byli w stanie opracować skuteczny system zarządzania swoimi ziemiami i utrzymania ich jedności."
 austrian_archduchy: "Arcyksięstwo Austrii"
 kor_factional_upheaval: "Wstrząsy frakcyjne"
 desc_kor_factional_upheaval: "Wzrost znaczenia neokonfucjanistów wywołał w kraju falę walk frakcyjnych."
 kor_factional_unity: "Jedność frakcyjna"
 desc_kor_factional_unity: "Wyniszczające kraj walki frakcyjne dobiegły końca, rozpoczynając nową erę jedności Korei."
 flavor_kor.10.tt2: "Ten modyfikator zostanie usunięty dopiero po ukończeniu misji §YWolność od walk frakcyjnych§!.\n"
