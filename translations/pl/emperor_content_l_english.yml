l_english:
 TTS: "Królestwo Obojga Sycylii"
 TTS_ADJ: "Sycylii"
 two_sicilies_nation_title: "Zjednoczenie Obojga Sycylii."
 two_sicilies_nation_desc: "Neapol i Sycylia zbyt długo były podzielone i pokłócone przez wielkie mocarstwa Europy. Musimy ponownie zjednoczyć Sycylię i stać się wielką potęgą we własnym imieniu."
 switzerland_nation_title: "Przywrócenie Konfederacji Szwajcarskiej"
 switzerland_nation_desc: "Nasz naród jest bezbronny, gdy jest samotny. Powinniśmy zjednoczyć naród szwajcarski w ramach konfederacji małych państw, aby zachować wolność każdego z jej członków, jednocześnie przedstawiając zjednoczony front obcym najeźdźcom."
 silesia_nation_title: "Utwórz państwo śląskie"
 silesia_nation_desc: "Rozbity na pomniejsze księstwa Śląsk od wieków był rządzony przez obce stolice. Nastała wiekopomna chwila by Śląsk odrzucił zagraniczne rządy oraz wewnętrzne podziały tworząc suwerenne Państwo Śląskie. "
 military_dictatorship_reform: "Dyktatura wojskowa "
 military_dictatorship_reform_desc: "Wojskowy dyktator przejął władzę w państwie i sprawuje w nim rządy jako autokrata. Nowi władcy są wybierani z wojskowej elity generałów. "
 military_dictatorship: "Dyktatura wojskowa "
 military_dictatorship_desc: "Wojskowy dyktator przejął władzę w państwie i sprawuje w nim rządy jako autokrata. Nowi władcy są wybierani z wojskowej elity generałów. "
 MILITARY_GOVERNMENT: "Republika Militarna"
 ambrosian_republic.1.t: "Stabilny rząd w Mediolanie"
 ambrosian_republic.1.d: "Ustanowienie Złotej Republiki Ambrozjańskiej nie obyło się bez problemów, ale wreszcie zwyciężyła wolność. Nie pogrążyliśmy w mrokach feudalizmu ani nie popadliśmy w tyranię wojskową. Pokój, sprawiedliwość i wolność panują w całym kraju [Root.GetName]."
 ambrosian_republic.1.d2: "Ustanowienie Złotej Republiki Ambrozjańskiej nie obyło się bez problemów. W desperacji porzuciliśmy nasze ideały wolności i przyznaliśmy absolutną władzę naszemu kapitanowi generalnemu. Niech [Root.Monarch.GetName] chroni pokój przez wiele lat."
 ambrosian_republic.1.d3: "Złota Republika Ambrozjańska była eksperymentem skazanym na niepowodzenie. Wzniosłe ideały jej uczonych założycieli okazały się niewykonalne, a ludzie wzywali do powrotu księcia. [Root.Monarch.GetTitle] [Root.Monarch.GetName] przejął tron i przywrócił naturalny porządek w kraju [Root.GetName]."
 ambrosian_republic.1.d4: "Złota Republika Ambrozjańska była eksperymentem skazanym na niepowodzenie. Pod nieobecność księcia sprytni władcy z państwa [Root.Overlord.GetName] wykorzystali okazję, by przejąć wolny tron kraju [Root.GetName] dla siebie. Niech [Root.Monarch.GetName] rządzi nami z mądrością i cierpliwością."
 ambrosian_republic.1.a: "Chwała św. Ambrożemu!"
 ambrosian_republic.2.t: "Sukcesja mediolańska"
 ambrosian_republic.2.d: "Gdy tron [Root.GetName] pozostał nieobsadzony, zarówno francuski monarcha [FRA.Monarch.GetTitle] jak i cesarz otwarcie dyskutują o swoich roszczeniach do księstwa. Francuskie roszczenia opierają się na małżeńskich powiązaniach ze starą dynastią Visconti. Choć roszczenie to nie jest silne, Francja od dłuższego czasu ma plany wobec Włoch i niewielu jest takich, którzy mogliby się oprzeć [FRA.Monarch.GetTitle]. Cesarz tymczasem twierdzi, że wobec braku wyraźnego spadkobiercy, tytuł księcia należy się Cesarzowi na mocy prawa cesarskiego."
 ambrosian_republic.2.a: "Musimy być przygotowani, by obronić naszą wolność."
 ambrosian_republic.3.d: "Mediolan pogrążył się w politycznym chaosie. Tron jest nieobsadzony, a powstająca Republika bezskutecznie próbuje zaprowadzić porządek. Byłby to doskonały moment, aby wzmocnić nasze roszczenia do Księstwa Mediolanu, oparte na naszych małżeńskich powiązaniach z nieistniejącym już rodem Visconti."
 ambrosian_republic.3.a: "Ten tron należy do nas!"
 ambrosian_republic.3.b: "Mediolan nas nie interesuje."
 ambrosian_republic.4.d: "Mediolan pogrążył się w politycznym chaosie. Tron jest nieobsadzony, a powstająca Republika bezskutecznie próbuje zaprowadzić porządek. Zgodnie z prawem cesarskim tytuł księcia powinien przejść na cesarza [Emperor.Monarch.GetHerselfHimself], gdy wyginie linia książąt. Jeśli chcemy narzucić to prawo i zapewnić sobie Mediolan, musimy działać szybko, by obalić tak zwaną Złotą Republikę Ambrozjańską."
 ambrosian_republic.5.t: "Propozycja dla Sforzów"
 ambrosian_republic.5.d: "Francesco Sforza jest jednym z największych generałów wojskowych naszych czasów i wybitnym przywódcą Kondotierów. Nieszczęśliwie się składa, że jesteśmy z nim w konflikcie w naszej wojnie z Wenecją. Sforza jest jednak popularny wśród Mediolańczyków i ma nawet pretensje do tronu.\n\nFrakcja w podzielonym rządzie napisała do Sforzy z hojną ofertą; jeśli porzuci naszych wrogów i przyłączy się do naszej sprawy, Mediolan zaoferuje mu prowincję [sforza_promised_province.GetName], jak również pozycję kapitana i obrońcy. Sforza mógłby być wielkim atutem dla Republiki, ale wielu kwestionuje, czy jego lojalność wobec Mediolanu przeważy nad jego osobistymi ambicjami."
 ambrosian_republic.5.d2: "Francesco Sforza jest jednym z najwybitniejszych dowódców wojskowych naszych czasów i znanym przywódcą kompanii kondotierów. Wielka szkoda, że podczas wojny przeciwko państwu [sforza_origin_country.GetName] znaleźliśmy się po przeciwnych stronach. Sforza cieszy się jednak popularnością wśród mieszkańców Mediolanu, a nawet rości sobie prawa do tronu.\n\nJedna z frakcji podzielonego rządu wystosowała do Sforzy hojną propozycję: jeśli porzuci naszych wrogów i przyłączy się do naszej sprawy, Mediolan zaoferuje mu prowincję [sforza_promised_province.GetName] oraz stanowisko kapitana i obrońcy republiki. Sforza mógłby być dla republiki cennym nabytkiem, lecz wielu zastanawia się, czy jego lojalność wobec Mediolanu przeważy nad osobistymi ambicjami."
 ambrosian_republic.5.d3: "Francesco Sforza jest jednym z najwybitniejszych dowódców wojskowych naszych czasów i znanym przywódcą kompanii kondotierów. Wielka szkoda, że podczas prób stłumienia rebelii znaleźliśmy się po przeciwnych stronach. Sforza cieszy się jednak popularnością wśród mieszkańców Mediolanu, a nawet rości sobie prawa do tronu.\n\nJedna z frakcji podzielonego rządu wystosowała do Sforzy hojną propozycję: jeśli porzuci naszych wrogów i przyłączy się do naszej sprawy, Mediolan zaoferuje mu prowincję [sforza_promised_province.GetName] oraz stanowisko kapitana i obrońcy republiki. Sforza mógłby być dla republiki cennym nabytkiem, lecz wielu zastanawia się, czy jego lojalność wobec Mediolanu przeważy nad osobistymi ambicjami."
 ambrosian_republic.5.a: "Uczynimy go dowódcą naszych armii."
 ambrosian_republic.5.b: "Nie potrzebujemy Sforzów."
 ambrosian_republic.6.t: "Sforza występuje przeciwko republice"
 ambrosian_republic.6.d: "Francesco Sforza ma wielu przeciwników w Złotej Republice Ambrozjańskiej. Bardziej idealistyczni i wykształceni politycy, którzy założyli republikę, podejrzewają go o spisek mający na celu przejęcie tronu, podczas gdy bardziej pragmatyczni politycy nie mogą mu wybaczyć popularności wśród ludu.\n\nSforza dowiedział się niedawno o spisku, którego celem jest pozbawienie go dowództwa wojskowego i usunięcie z rządu. Oburzony wystosował wobec państwa ultimatum: albo zaakceptujemy jego nieograniczoną władzę wojskową, albo ponownie spotkamy się z nim na polu bitwy."
 ambrosian_republic.6.a: "Zaprowadź rządy wojskowe pod przywództwem Sforzy."
 ambrosian_republic.6.b: "Oprzyjmy się tyranii Sforzy. Walczymy o wolność!"
 ambrosian_republic.7.t: "Sforza zagarnia tron"
 ambrosian_republic.7.d: "Sforza, zawsze ambitny i gotowy wykorzystać każdą okazję, zdradził republikę i ogłosił się prawowitym księciem Mediolanu! Jego popularność wśród ludu oraz żelazna kontrola nad armią i aparatem państwowym sprawiają, że opór wobec jego rządów wydaje się skazany na porażkę. Być może musimy zaakceptować powrót monarchii. A może wolność jest warta każdej ceny."
 ambrosian_republic.7.a: "Niech żyje książę Sforza!"
 ambrosian_republic.7.b: "To niedopuszczalne! Musimy wybrać nowego kapitana generalnego."
 ambrosian_republic.7.c: "Nigdy! Powinniśmy odtworzyć republikę, tak jak chcieli tego jej założyciele."
 ambrosian_republic.8.t: "Śmierć Sforzy"
 ambrosian_republic.8.d: "Wielki kapitan Sforza zmarł nagle i niespodziewanie. Jego popularność wśród ludu oraz żelazna kontrola nad mediolańską polityką były jedynymi czynnikami spajającymi młodą republikę. Teraz poszczególne frakcje rządu walczą o realizację własnych wizji przyszłości.\nStronnictwo Giorgia Lampugnana pragnie odnowić ideały, na których ufundowano republikę, przywrócić demokrację i zakończyć rządy wojskowe. Z kolei stronnictwo Jacopa Piccinina twierdzi, że tylko silny kapitan-generał może utrzymać republikę w jedności i stawić czoła licznym wrogom."
 ambrosian_republic.8.a: "Niech żyje nowy kapitan generalny!"
 ambrosian_republic.8.b: "Odtwórzmy republikę, tak jak chcieli tego jej założyciele."
 opinion_swayed_sforza: "Skradł Sforzę"
 ambrosian_republic_disaster: "Złota Republika Ambrozjańska"
 ambrosian_republic_disaster_desc: "Pod nieobecność silnego pretendenta do tronu idealistyczni uczeni zakładają w Mediolanie młodą republikę."
 ambrosian_republic_resolved_tt: "§YNastąpi stabilizacja rządów w Mediolanie§!"
 ambrosian_republic_disaster_resolved_tt: "Nastąpiła stabilizacja rządów w Mediolanie"
 signoria_reform: "Włoska signoria"
 signoria_reform_desc: "Republika funkcjonuje najsprawniej pod faktyczną jurysdykcją najbardziej wpływowego rodu politycznego. Sugestie, jakoby taki ustrój niewiele różnił się od monarchii, są oczywiście niedorzeczne."
 signoria: "Włoska signoria"
 signoria_desc: "Republika funkcjonuje najsprawniej pod faktyczną jurysdykcją najbardziej wpływowego rodu politycznego. Sugestie, jakoby taki ustrój niewiele różnił się od monarchii, są oczywiście niedorzeczne."
 savonarola_dead_tt: "Savonarola nie jest władcą [Root.GetAdjective]"
 had_disaster_for_6_months: "Katastrofa trwa od co najmniej 6 miesięcy."
 bonfire_of_the_vanities_disaster: "Ognisko próżności"
 bonfire_of_the_vanities_disaster_desc: "Radykalny duchowny chce przejąć władzę we Florencji, sprowadzając nasze sprawiedliwe miasto na niebezpieczną ścieżkę polityczną i duchową."
 flavor_tus.17.t: "Porządek przywrócony w państwie [Root.GetName]"
 flavor_tus.17.d: "Ród Medyceuszy przywrócił porządek we Florencji. Szalony mnich, Savonarola, nie żyje! Niech jego imię zostanie potępione, a on sam na zawsze zapamiętany jako wariat, który niemal doprowadził nasze państwo do ruiny."
 flavor_tus.17.d2: "Medici zostali zdecydowanie wygnani z miasta i prawdopodobnie nigdy nie zostaną ponownie przyjęci. Pod sprawiedliwym przewodnictwem Savonaroli nowy porządek w państwie [Root.GetName] charakteryzuje się religijnym fanatyzmem i posłuszeństwem wobec nakazów Boga, interpretowanych przez naszego proroka."
 flavor_tus.17.a: "Mamy stabilny rząd!"
 flavor_tus.18.t: "Savonarola: prorok"
 flavor_tus.18.d: "Nad miastem [Root.Capital.GetCapitalName] unoszą się kłęby dymu, gdy mieszkańcy palą przedmioty uznawane za symbole próżności. Tłumy gromadzą się, by oglądać palenie czarownic i heretyków. Szeregi Płaczków, oddanych wyznawców proroka, rosną, a Savonarola umacnia swoją władzę nad sercami obywateli. Decyzja zapadła: państwo [Root.GetName] porzuci grzeszne obyczaje i poświęci się wyłącznie woli Boga oraz jego nowego proroka."
 flavor_tus.18.a: "Nadchodzi koniec czasów. Modlimy się o zbawienie."
 flavor_tus.19.t: "Papież potępia Savonarolę"
 flavor_tus.19.d: "Wieści o czynach Savonaroli dotarły do samego arcyheretyka – papieża w Rzymie. Zgodnie z oczekiwaniami papież potępił kaznodzieję i zażądał jego natychmiastowego procesu w Watykanie. Savonarola hardo odmówił. W odpowiedzi papież ogłosił ekskomunikę Savonaroli, a wszystkich, którzy udzielą mu schronienia, uznał za heretyków najwyższej kategorii."
 flavor_tus.19.a: "Papież jest heretykiem!"
 flavor_tus.19.b: "Zapewnijmy lud, że papież po prostu się myli."
 add_savanarola_support_tt: "§YSavonarola zyskuje zwolenników, prowadząc nas ku teokracji§!"
 lose_savanarola_support_tt: "§YSavonarola traci zwolenników, przybliżając nas do przywrócenia rządów Medyceuszy§!"
 SAVANAROLA_GOVERNMENT: "Rząd Savonaroli"
 BROTHER: "Brat"
 great_peasant_war.1.t: "Wielka Wojna Chłopska"
 great_peasant_war.1.d: "Chłopi podnoszą bunt przeciwko swoim prawowitym panom, domagając się zniesienia pańszczyzny i formalnej ochrony swoich praw. Nie jest to lokalna rebelia – ziarna niezgody rozsiane są po całym Cesarstwie, a często zasiewają je niebezpieczni heretycy. Wszyscy książęta niemieccy muszą zadbać o obronę i przygotować się do wojny z ludźmi, którymi niegdyś rządzili."
 great_peasant_war.1.a: "Musimy przypomnieć tym chłopom, jakie jest ich miejsce."
 gpw_effects_tt: "§YNiepokoje wzrosną na obszarze całego Świętego Cesarstwa Rzymskiego.§!\nChłopi będą częściej wszczynać rebelie.\nZwycięskie rebelie chłopskie mogą nabrać odwagi, obalić arystokrację i narzucić radykalnie odmienny ustrój."
 great_peasant_war.2.t: "Żądania chłopów [Root.GetAdjective]"
 great_peasant_war.2.d: "Wbrew wszelkim przeciwnościom zbuntowani chłopi z państwa [Root.GetName] pokonali wojska [Root.Monarch.GetTitle] i są teraz w stanie wymusić spełnienie swoich żądań. Niektórzy z bardziej radykalnych przywódców chłopskich domagają się całkowitego zniesienia arystokracji, lecz większość zgodzi się na daleko idące ustępstwa, aby móc wrócić do domów i rodzin bez obawy przed odwetem."
 great_peasant_war.2.a: "Precz z arystokracją!"
 great_peasant_war.2.b: "Nie mamy innego wyboru, jak skapitulować."
 great_peasant_war.3.t: "Wielka Wojna Chłopska"
 great_peasant_war.3.d: "Gwałtowny konflikt między chłopstwem a władzą szaleje od dziesięcioleci w Świętym Cesarstwie Rzymskim. Nadszedł czas, aby cesarz wymusił zdecydowane i ostateczne rozwiązanie: chronić prawa chłopów lub narzucić kontrolę szlachty."
 great_peasant_war.3.a: "Zmiażdżenie agitatorów."
 great_peasant_war.3.b: "Przyznanie ustępstw chłopom."
 great_peasants_war_triggered_modifier: "Wielka wojna chłopska"
 desc_great_peasants_war_triggered_modifier: "Wielka Wojna Chłopska wplątuje Święte Cesarstwo Rzymskie w konflikt. Podczas jej trwania zbuntowani chłopi nabiorą odwagi i mogą nawet obalić rząd."
 great_peasant_war.4.t: "Koniec Wielkiej Wojny Chłopskiej"
 great_peasant_war.4.d: "Chłopi stali się, w większości, mniej niesforni i nauczyli się akceptować swoje miejsce na dole naturalnego porządku."
 great_peasant_war.4.a: "Dzięki Bogu"
 end_gpw_tt: "§YWielka Wojna Chłopska dobiega końca.§!"
 king_in_prussia.1.t: "Korona Prus"
 king_in_prussia.1.d: "Wraz z rosnącą potęgą naszego wielkiego państwa [Root.Monarch.GetTitle] oznajmił, że zamierza podnieść Prusy do rangi królestwa, a siebie samego do godności króla. Jako książę Świętego Cesarstwa Rzymskiego powinniśmy skonsultować tę sprawę z cesarzem, dlatego przygotowaliśmy propozycję, którą powinien starannie rozważyć."
 king_in_prussia.1.a: "Będziemy królami"
 king_in_prussia.2.t: "Król w Prusach"
 king_in_prussia.2.d: "Prusy stają się coraz potężniejszym państwem w Świętym Cesarstwie Rzymskim. Ich wpływ na politykę cesarską stale rośnie, a na arenie międzynarodowej umacniają swoją pozycję. [PRU.Monarch.GetTitle] [PRU.Monarch.GetName] ogłosił [PRU.Monarch.GetHerHis] zamiar utworzenia Królestwa Prus, podnosząc państwo z rangi zwykłego [PRU.GovernmentName]. Jest to niemal bezprecedensowa sytuacja w Cesarstwie, dlatego cesarz musi zdecydować, jak ją rozwiązać."
 king_in_prussia.2.a: "Podnieś Prusy do rangi królestwa cesarskiego"
 king_in_prussia.2.b: "Pozwól [PRU.Monarch.GetHerHim] tytułować [PRU.Monarch.GetHerselfHimself] królem w Prusach"
 king_in_prussia.2.c: "Nie uznamy tego samozwańczego monarchy."
 king_in_prussia.3.t: "Król w Prusach"
 king_in_prussia.3.d: "Nasz bliski przyjaciel i sojusznik, cesarz [emperor.Monarch.GetName], łaskawie zdecydował się podnieść Prusy do rangi królestwa cesarskiego! Takiego przywileju nie przyznano od czasów wzrostu potęgi królów Czech. Królowie Prus będą z dumą nosić koronę, pamiętając zawsze o łasce okazanej im przez cesarza."
 king_in_prussia.3.d2: "Tradycja cesarska stanowi, że jedynymi królami w Cesarstwie powinni być król Rzymian, czyli sam cesarz, oraz król Czech. Udało nam się jednak wypracować z cesarzem interesujący kompromis prawny: nasi monarchowie będą używać tytułu „króla w Prusach”. Ponieważ Prusy leżą poza granicami Świętego Cesarstwa Rzymskiego, możemy nazywać się królami bez konieczności łamania przez cesarza tradycji cesarskich."
 king_in_prussia.3.d3: "Cesarz, ten pozbawiony honoru nikczemnik, odmówił uznania naszego prawa do tytułowania się królami, niezależnie od tego, jakie rozsądne kompromisy proponowaliśmy. Oczywiście nie zamierzamy zwracać na niego uwagi i i tak będziemy używać królewskiego tytułu."
 king_in_prussia.3.a: "Dzięki Bogu i cesarzowi!"
 king_in_prussia.3.b: "To satysfakcjonujący kompromis."
 king_in_prussia.3.c: "Nie potrzebujemy zgody cesarza."
 elevated_prussia: "Podniesienie rangi Prus"
 opinion_king_in_prussia: "Król w Prusach"
 opinion_prussia_not_recognized: "Odmowa uznania praw Prus do korony"
 emp_mission_events.10.t: "Książę Alençon"
 emp_mission_events.10.d: "Podczas wojny stuletniej angielska inwazja wyparła książąt Alençon z ich ziem. Teraz, gdy tradycyjne terytoria księstwa powróciły pod francuskie panowanie, ocalali arystokraci z rodu Walezjuszy-Alençon błagają [Root.Monarch.GetTitle] o przywrócenie utraconych ziem i tytułów."
 emp_mission_events.10.a: "Przywróć księcia."
 emp_mission_events.10.b: "Alençon należy do Korony."
 EST_VAL_DUKE_OF_ALENCON: "Książę Alençon: §Y$VAL$%§!"
 admiralty_reform: "Rada admirałów"
 admiralty_reform_desc: "Nasze państwo żyje i umiera w zależności od zdolności projekcji siły na morzu. Dlatego przekazaliśmy stery rządów Radzie admirałów, której członkowie są doświadczonymi i bezgranicznie oddanymi patriotami.\n\nWyłącza przeprowadzanie wyborów."
 protectorate_parliament_reform: "Parlament Protektoratu"
 protectorate_parliament_reform_desc: "Pod życzliwym przewodnictwem Lorda Protektora naszym państwem zarządza kadłubowy parlament lojalny wobec Wspólnoty.\n\nWyłącza przeprowadzanie wyborów."
 protectorate_parliament_legacy: "Parlament Protektoratu"
 protectorate_parliament_legacy_desc: "Pod życzliwym przewodnictwem Lorda Protektora naszym państwem zarządza kadłubowy parlament lojalny wobec Wspólnoty.\n\nWyłącza przeprowadzanie wyborów."
