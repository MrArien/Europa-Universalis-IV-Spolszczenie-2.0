 opinion_refused_burgundian_membership: ""
 hussite: "Husytyzm"
 hussite_religion_desc: "Husyci są zwolennikami Jana Husa, czeskiego reformatora religijnego, który został oskarżony o herezję i spalony na stosie w 1415 roku. Stanowią oni zróżnicowaną grupę nonkonformistów, obejmującą zarówno umiarkowanych, którzy nie mają zbyt wielu zastrzeżeń teologicznych do katolickiej doktryny, jak i radykałów, którzy uważają Kościół katolicki za nieodwracalnie zepsuty."
 TABORITE: "Taboryci"
 UTRAQUIST: "Utrakwiści"
 ORPHAN: "Sierotki"
 clerical_poverty_aspect: "Ubodzy kapłani"
 desc_clerical_poverty_aspect: "Duchowni nie powinni posiadać bogactw i porzucić swoje dobra materialne. Powinni poświęcać swoją uwagę Bogu, a nie świeckiemu światu."
 bread_and_wine_aspect: "Chleb i wino"
 desc_bread_and_wine_aspect: "Dla utrakwistów podstawową doktrynalną różnicą zdań między nimi a Kościołem katolickim jest koncepcja komunii pod obiema postaciami. Sekty husyckie wierzą, że tylko komunia, która obejmuje zarówno chleb, jak i wino, jest ważna, nawet dla świeckich członków."
 sola_scriptura_aspect: "Sola Scriptura"
 desc_sola_scriptura_aspect: "Biblia, słowo Boże przekazane człowiekowi, jest jedynym autorytetem dla doktryny chrześcijańskiej. Wszystkie praktyki religijne, które nie mogą być poparte odniesieniami biblijnymi, należy potępić jako herezję."
 adamite_services_aspect: "Służba adamitów"
 desc_adamite_services_aspect: "Sekta adamitów nalega na nagość podczas nabożeństw. Bez oznak statusu czy kultury, w oczach Boga jesteśmy równi, co przypomina nam o naszym wspólnym człowieczeństwie i niewinności, jaką cieszyliśmy się przed wygnaniem."
 pacifism_aspect: "Pacyfizm"
 desc_pacifism_aspect: "Błogosławieni pokój czyniący, albowiem oni synami Bożymi nazwani będą."
 punishment_of_sins_aspect: "Kara za grzechy"
 desc_punishment_of_sins_aspect: "Wszyscy, którzy grzeszą, muszą zostać ukarani jednakowo, bez względu na bogactwo czy rangę. Nawet szlachta nie stoi ponad prawem Bożym."
 regular_defenestrations_aspect: "Regularne defenestracje"
 desc_regular_defenestrations_aspect: "Praktyka wyrzucania ludzi z okien jest tradycją wśród czeskich reformatorów religijnych. Powinniśmy uczynić z tego regularny zwyczaj."
 taborite_resurgence_aspect: "Odrodzenie taborytów"
 desc_taborite_resurgence_aspect: "Taboryci byli radykalną i wojowniczą frakcją w wojnach husyckich. Choć po klęsce stracili znaczną władzę, zaczęli powracać do łask teraz, gdy nauczanie Husa powróciło do łask."
 freedom_to_preach_aspect: "Wolność głoszenia"
 desc_freedom_to_preach_aspect: "Wśród naśladowców Husa istnieje wiele sporów, ale każda sekta powinna mieć swobodę głoszenia tak długo, jak długo Bóg jest w ich sercach."
 orphan_hetmans_aspect: "Hetmani sierotek"
 desc_orphan_hetmans_aspect: "Sierotki to frakcja radykałów złożona głównie z mieszczan. Wielokrotnie pokazali swoje umiejętności na polu bitwy, wykorzystując wozy bojowe z doskonałym skutkiem. Powinniśmy dopilnować, by ich hetmani dzielili się swoją wiedzą taktyczną w całym kraju."
 flavor_boh.12.t: "Kompaktaty praskie"
 flavor_boh.12.d: "Wojny husyckie zakończyły się pokojem religijnym między umiarkowaną frakcją utrakwistyczną husytów a Kościołem katolickim. Jak dotąd porozumienia zostały dotrzymane, a do Czech powrócił pokój. Jednak napięcia z husytami nie zniknęły; zwolennicy Husa są liczni zarówno wśród ludu, jak i szlachty. Być może powinniśmy wykorzenić ich herezję, zanim ponownie chwycą za broń."
 flavor_boh.12.a: "Honoruj kompaktaty"
 flavor_boh.12.b: "Z heretykami nie można zawrzeć pokoju."
 flavor_boh.1.c: "Niech [Root.Monarch.GetTitle] podąża za Husem, a naród za Rzymem."
 first_hussite_tt: "§YOpcja ta może prowadzić do pokojowego pojednania z husytami lub odrodzenia ruchu husyckiego.§!"
 hussite_center_of_reformation: "Centrum reformacji"
 religious_peace_hussites: "Kompaktaty praskie"
 desc_religious_peace_hussites: "Honorujemy kompakty z Bazylei poprzez egzekwowanie kruchego pokoju między frakcjami religijnymi w Czechach."
 hussite_persecution: "Prześladowania husytów"
 desc_hussite_persecution: "Porzuciliśmy pokój religijny i ponownie poświęciliśmy się eliminacji herezji husyckiej."
 rejected_reconciliation_tt: "§YKatolickie narody mogą użyć casus beli 'oczyszczenia z herezji' przeciwko tobie, gdy [Root.Monarch.GetName] rządzi państwem [Root.GetName].§!"
 remain_hussite_tt: "§YHusyci dystansują się od protestantyzmu i nie skorzystają, jeśli protestantyzm stanie się dominujący w Imperium.§!"
 hussite_rebels_demand: "Nawróć kraj $COUNTRYNAME$"
 hussite_rebels_demand_desc: "Ci buntownicy religijni walczą o $RELIGION$. Żądają od nas uznania tej religii za panującą, a przynajmniej zaprzestania prób ich nawrócenia i zezwolenia im na przeżywanie swej wiary w spokoju."
