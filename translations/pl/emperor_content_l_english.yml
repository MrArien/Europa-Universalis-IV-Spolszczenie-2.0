 become_hussite_desc: "Nauki Jana Husa rozprzestrzeniły się w naszym kraju, a wielu spośród zwykłych ludzi jest otwartych na jego słowa. Przyjęcie wiary potępionej przez papieża jako herezja postawiłoby nas w sprzeczności z większością chrześcijaństwa. Jednak z prawością w naszych sercach możemy pokonać nawet największego wroga."
 shadow_kingdom_decision_title: "Podporządkuj Włochy"
 shadow_kingdom_decision_desc: "Włoscy książęta muszą zostać podporządkowani poprzez dyplomację lub wojnę. Nie możemy pozwolić, by Włochy stały się królestwem cieni!"
 shadow_kingdom_will_leave_info_decision_tt: "§YNie zostało jeszcze podporządkowane i może opuścić Cesartwo§!"
 has_reined_in_all_italians_early: "Wszystkie §Ywłoskie§! prowincje zostały poskromione.\n\n§YPoskromienie§! oznacza, że kraj §Ycel§! musi spełniać co najmniej jeden z następujących warunków:\n    Opinia §Ycelu§! o państwie §Y[Root.GetName]§! wynosi co najmniej §G150§!.\n    Posiada reformę rządu §YWolne Miasto§!.\n    Jest wasalem §Y[Root.GetAdjective]§!.\n    §YCel§! jest sojusznikiem §Y[Root.GetAdjective]§!.\n    Przegrał wojnę z §YCesarzem§!."
