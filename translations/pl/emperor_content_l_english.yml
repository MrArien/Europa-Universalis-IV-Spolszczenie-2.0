 borgia_pope_tt: "§YKoru pciera się przez Kościół, sprowadzając wiernych na manowce.§!"
 borgia_pope: "Papież z rodu Borgiów"
 desc_borgia_pope: "Rodrigo Borgia został wybrany na papieża. Jego pontyfikat jest naznaczony pogłoskami o korupcji. Nepotyzm szerzy się na każdym kroku, a zaufanie wiernych do Kościoła słabnie."
 scandalized_papacy: "Zhańbiony papiestwo"
 desc_scandalized_papacy: "Domniemane występki rodziny Borgiów rzucają cień na reputację papiestwa."
 borgia_diplomacy: "Dyplomacja Borgiów"
 desc_borgia_diplomacy: "Pomimo pikantnych pogłosek na temat rodziny Borgiów ich umiejętności dyplomatyczne pozostają niezrównane, a oni sami nie pozwalają wrogom splamić swojej reputacji."
 flavor_pap.16.t: "Papież z rodu Borgiów"
 flavor_pap.16.d: "Z dachu Kaplicy Sykstyńskiej unosi się biały dym. Pomimo oskarżeń o symonię konklawe wybrało Rodriga Borgię, arcybiskupa Walencji, na tron św. Piotra. Borgiowie są stosunkowo nowym rodem na rzymskiej scenie politycznej i narazili się bardziej ugruntowanym rodzinom, które same pragnęły zdobyć tę pozycję.\n\nChoć wiele pogłosek na temat papieża z rodu Borgiów jest zapewne przesadzonych i rozpowszechnianych przez jego wrogów, wiadomo, że otwarcie utrzymuje kochankę, a swojego nastoletniego syna Cesarego już wyniósł do godności kardynała. Powszechnie spekuluje się, że jego pontyfikat będzie pełen skandali i korupcji."
 flavor_pap.16.a: "Papiestwo przetrwa."
 flavor_pap.17.t: "Cesare Borgia"
 flavor_pap.17.d: "Cesare Borgia, syn papieża, został pierwszym człowiekiem w historii, który zrezygnował z godności kardynała. Zamiast tego wybrał karierę awanturnika wojskowego i już udowodnił, że jest zdolnym oraz bezwzględnym kondotierem. Ojciec Święty postanowił docenić jego zdolności, powierzając Cesaremu urząd kapitana-generała Kościoła i dowództwo nad wojskami papieskimi."
 flavor_pap.17.a: "Aut Caesar, aut nihil."
 flavor_pap.18.t: "Zhańbione papiestwo"
 flavor_pap.18.d: "Wokół czynów rodziny Borgiów narosła cała masa złośliwych pogłosek. Pojawiają się liczne oskarżenia o morderstwa z użyciem kantarelli – rzekomo śmiertelnej i trudnej do wykrycia trucizny, którą eliminowano politycznych rywali. Sam Ojciec Święty ma regularnie dopuszczać się symonii i korupcji, a o relacjach między jego dziećmi, Cesarem i Lukrecją, krążą jeszcze bardziej pikantne plotki. Choć dowodów na te oskarżenia wydaje się niewiele, katolicy w całej Europie powszechnie w nie wierzą."
 flavor_pap.18.a: "Kłamstwa i oszczerstwa!"
 flavor_pap.18.b: "Możemy obrócić tę sytuację na naszą korzyść."
 flavor_pap.19.t: "Koniec pontyfikatu Borgiów"
 flavor_pap.19.d: "Śmierć papieża z rodu Borgiów została przyjęta z cichą radością przez patrycjuszowskie rodziny Rzymu. Kardynałowie wybrali na jego następcę jednego z najbardziej zagorzałych rywali Borgii. [Root.Monarch.GetName] obiecuje położyć kres korupcji poprzednika i przywrócić zaufanie do świętości Kościoła.\n\nTymczasem władza Cesarego Borgii załamała się z dnia na dzień z powodu utraty papieskiego wsparcia. Obawiając się o życie, uciekł do Nawarry, gdzie ma nadzieję znaleźć schronienie przed wrogami."
 flavor_pap.19.d2: "Śmierć papieża z rodu Borgiów została przyjęta z cichą radością przez patrycjuszowskie rodziny Rzymu. Kardynałowie wybrali na jego następcę jednego z najbardziej zagorzałych rywali Borgii. [Root.Monarch.GetName] obiecuje położyć kres korupcji poprzednika i przywrócić zaufanie do świętości Kościoła."
 flavor_pap.19.a: "Konieczna jest odbudowa reputacji Kościoła."
 flavor_pap.20.t: "Przybycie Cesarego Borgii"
 flavor_pap.20.d: "Cesare Borgia, syn papieża i doświadczony dowódca wojskowy, przybył na dwór Nawarry. Szuka schronienia przed wrogami we Włoszech, ponieważ bez papieskiego wsparcia utracił całą swoją potęgę. W zamian oferuje swoje usługi jako dowódca, gdybyśmy go potrzebowali."
 flavor_pap.20.a: "Cesare Borgia jest tu mile widziany."
 incident_switzerland.1.t: "Szwajcaria i Cesarstwo"
 incident_switzerland.1.d: "Wraz z końcem wielkich wstrząsów religijnych, które ogarnęły nie tylko Cesarstwo, lecz także znaczną część Europy, kantony szwajcarskie ponownie rozważają swoją coraz luźniejszą więź z Cesarstwem. Choć wielu walczyło i ginęło za pokój, warunki zawartego porozumienia nie przypadły do gustu szwajcarskim elitom. Coraz więcej osób domaga się formalnego i całkowitego odłączenia Szwajcarii od Świętego Cesarstwa Rzymskiego."
 incident_switzerland.1.a: "Nie zamierzamy dłużej być członkiem Cesarstwa."
 incident_switzerland.1.b: "Szwajcaria ma pozostać w Cesarstwie."
 swixit_tt: "§YCesarz otrzyma roszczenia terytorialne do wszystkich prowincji ŚCR posiadanych przez Szwajcarię.§!\n§YCesarz może przemocą zareagować na tę decyzję.§!"
 incident_switzerland.2.t: "Szwajcaria i Cesarstwo"
 incident_switzerland.2.d: "Szwajcaria porzuciła Cesarstwo! Powodowani niezadowoleniem z pokoju religijnego, a także słabnącymi więzami z instytucjami cesarskimi, Szwajcarzy zdecydowali, że członkostwo w Świętym Cesarstwie Rzymskim nie służy już ich interesom."
 incident_switzerland.2.a: "Pozwólmy im opuścić Cesarstwo."
 incident_switzerland.2.b: "Członkostwo w Cesarstwie nie jest opcjonalne."
 pope_in_hre_triggered_modifier: "Papiestwo jest członkiem Cesarstwa"
 desc_pope_in_hre_triggered_modifier: "Przynależność papieża do Świętego Cesarstwa Rzymskiego niesie poważne konsekwencje dla katolików spoza jego granic."
 incident_pope.1.t: "Święte Cesarstwo?"
 incident_pope.1.d: "Dzięki nieustannym wysiłkom cesarza Włochy, które przestały być „Królestwem Cieni”, zostały ponownie włączone do Świętego Cesarstwa Rzymskiego. Państwo Kościelne musi teraz zdecydować, czy zaakceptować hegemonię cesarza, czy też pozostać bezbronne u jego progu.\n\nUznanie władzy cesarza miałoby poważne konsekwencje dla świata katolickiego. Katolicy w Cesarstwie mogliby zyskać większą pewność wiary dzięki legitymizacji wynikającej z przynależności papieża do Cesarstwa, jednak wierni spoza jego granic prawdopodobnie nie przyjęliby takiej decyzji przychylnie i mogliby zwrócić się ku herezji."
 incident_pope.1.a: "Zamierzamy dołączyć do Cesarstwa."
 incident_pope.1.b: "Państwo Kościelne musi pozostać niezależne."
 pope_incident_tt: "Święty Cesarz Rzymski podejmie decyzję, czy przyjąć Państwo Kościelne do Świętego Cesarstwa Rzymskiego.\n§YBędzie to miało niekorzystne skutki dla pozostałych państw katolickich.§!"
 pope_incident_tt2: "§YBędzie to miało niekorzystne skutki dla pozostałych państw katolickich.§!\n§YPaństwa katolickie niebędące członkami Cesarstwa otrzymają karę prestiżu.§!"
 incident_pope.2.t: "Święte Cesarstwo?"
 incident_pope.2.d: "Dzięki nieustannym wysiłkom cesarza Włochy, które przestały być „Królestwem Cieni”, zostały ponownie włączone do Świętego Cesarstwa Rzymskiego. Papież Rzymu postanowił zaakceptować hegemonię Cesarstwa, zamiast pozostać bezbronnym u jego progu.\n\nDopuszczenie papieża do grona książąt cesarskich miałoby poważne konsekwencje dla świata katolickiego. Katolicy w Cesarstwie mogliby zyskać większą pewność wiary dzięki legitymizacji wynikającej z przynależności papieża do Cesarstwa, jednak wierni spoza jego granic prawdopodobnie nie przyjęliby takiej decyzji przychylnie i mogliby zwrócić się ku herezji."
 incident_pope.2.a: "Niechaj papiestwo dołączy do Cesarstwa."
 incident_pope.2.b: "Państwo Kościelne powinno pozostać niezależne."
 incident_pope.3.t: "Bezbożne Cesarstwo"
 incident_pope.3.d: "Sejm Rzeszy przyjął straszliwy i niedopuszczalny dekret: Cesarstwo nie będzie już wyznawać katolicyzmu. Wszystkie nasze wysiłki, by przywrócić godność Świętemu Kościołowi Matce, poszły na marne. Musimy zatem poważnie rozważyć opuszczenie tej splamionej instytucji."
 incident_pope.3.a: "Opuśćmy tę jaskinię grzechu."
 incident_pope.3.b: "Dla dobra chrześcijaństwa musimy pozostać."
 pope_left_empire: "Papież opuścił Cesarstwo"
 dutch_unification_tt: "§YPaństwo [dutch_unification_country.GetName] otrzyma wszystkie prowincje należące do naszych poddanych holenderskich, fryzyjskich lub flamandzkich.§!"
 dutch_revolt_modifier: "Bunt w Holandii"
 desc_dutch_revolt_modifier: "Ludność tej prowincji żąda niepodległości Niderlandów."
 dutch_revolt_tt: "Wszystkie posiadane prowincje w regionie §YNiderlandów§! posiadające kulturę §Yholenderską§!, §Yfryzyjską§! lub §Yflamandzką§! otrzymają modyfikator §YBunt w Holandii§!. Modyfikator zwiększy lokalne niepokoje o §R+10§! punktów i będzie ważny do momentu zakończenia katastrofy."
 dutch_revolt_disaster: "Bunt w Holandii"
 dutch_revolt_disaster_desc: "Holendrzy mieszkający w państwie [Root.GetName] stali się niezadowoleni i dążą przemocą do powstania niezależnego państwa."
 dutch_revolt.1.t: "Koniec buntu w Holandii"
 dutch_revolt.1.d: "Udało nam się z sukcesem zdławić powstanie Holendrów, niszcząc wszystkie znaczące źródła holenderskiego separatyzmu. Zwiększona obecność wojskowa [Root.GetAdjective] w regionie zrobiła wiele, by uciszyć nawet tych, którzy domagali się jedynie zwiększenia autonomii."
 dutch_revolt.1.d2: "Bunt w Holandii okazał się być o wiele silniejszy, niż pierwotnie przewidywaliśmy. Buntownicy utworzyli spójne państwo i szukają wsparcia u naszych rywali. Musimy wykorzystać naszą armię i przygotować się do wojny!"
 dutch_revolt.1.a: "To się okazało być czymś o wiele gorszym niż tylko lokalna rebelia."
 dutch_revolt.1.b: "Powstanie Holendrów dobiegło końca."
 dutch_revolt.2.t: "Niepodległość Niderlandów"
 dutch_revolt.2.d: "Powstanie holenderskie przerodziło się z regionalnych niepokojów w międzynarodowy kryzys, gdy kolejne państwa zaczęły wysyłać wojska, by wesprzeć jedną ze stron. Nowo proklamowana Republika Holenderska leży w granicach Cesarstwa, dlatego pojawiły się głosy, że cesarz ma obowiązek objąć to młode państwo ochroną cesarską. Niezależnie od formy, interwencja Cesarstwa z pewnością na zawsze odmieni losy Niderlandów."
 dutch_revolt.2.a: "Będziemy wspierać Holendrów."
 dutch_revolt.2.b: "Nie powinniśmy interweniować w tej sprawie."
 dutch_revolt.2.c: "Oni są prawowitymi poddanymi państwa [dutch_revolt_country.GetName]."
 dutch_will_leave_later: "§YJeżeli Niderlandy zakończą wojnę zwycięstwem, opuszczą Święte Cesarstwo Rzymskie.§!"
 dutch_revolt.3.t: "Niderlandy opuszczają Cesarstwo"
 emperor_helped_dutch: "Wspiera niepodległość Niderlandów"
 emperor_sided_against_dutch: "Potępił niepodległość Holandii"
 flavor_ara.EVTNAME7: "Sukcesja w Neapolu"
 flavor_ara.EVTDESC7: "Nieślubny syn Alfonsa Wspaniałego, Ferdynand, nie może dziedziczyć tronu Aragonii. Przed śmiercią Alfons uzyskał jednak zgodę papieża Eugeniusza IV, by uczynić Ferdynanda prawowitym następcą tronu Neapolu. Zgodnie z testamentem Alfonsa Królestwem Neapolu powinien teraz rządzić Ferdynand, podczas gdy [ARA.Monarch.GetName] zachowa wszystkie pozostałe posiadłości aragońskie."
 flavor_ara.EVTOPTA7: "Spełnimy ostatnią wolę Alfonsa."
 flavor_ara.EVTOPTB7: "Alfons był głupcem! Neapol należy do nas."
 flavor_ara.EVTNAME8: "Sukcesja w Neapolu"
 flavor_ara.EVTDESC8: "Alfons Wspaniały zapisał koronę Neapolu swojemu nieślubnemu synowi Ferdynandowi, a nie [ARA.Monarch.GetName]owi z Aragonii. Wymagało to specjalnej zgody papiestwa oraz podporządkowania Aragonii Kościołowi. Papież oczekuje teraz, że Ferdynand pójdzie w ślady ojca i uiści należne Kościołowi opłaty."
 flavor_ara.EVTOPTA8: "Żądania papiestwa są wygórowane! Nie zapłacimy."
 flavor_ara.EVTOPTB8: "Jego Świątobliwość otrzyma to, co mu się należy."
 flavor_ara.EVTNAME9: "Neapol odmawia podporządkowania się!"
 flavor_ara.EVTDESC9: "Nowy król Neapolu, [NAP.Monarch.GetName], odmówił pójścia w ślady ojca i podporządkowania się Stolicy Apostolskiej. Jest to poważna zniewaga wobec Kościoła i naruszenie porozumienia zawartego z królem Aragonii Alfonsem V. Można zatem uznać, że podważa ona prawa [NAP.Monarch.GetName]a do neapolitańskiej korony. Nie możemy pozwolić, by taka zniewaga pozostała bez odpowiedzi!"
 flavor_ara.EVTOPTA9: "Uznaj dawne andegaweńskie roszczenia Francji do Neapolu."
 flavor_ara.EVTOPTB9: "Zmuś Neapol do podporządkowania się nam siłą militarną."
 flavor_ara.EVTOPTC9: "Nie ma potrzeby zaostrzać sytuacji."
 flavor_ara.EVTNAME10: "Neapol spłaca należności"
 flavor_ara.EVTDESC10: "Nowy król Neapolu, [NAP.Monarch.GetName], dotrzymał warunków porozumienia zawartego przez ojca i uiścił należności wobec Kościoła."
 flavor_ara.EVTOPTA10: "Miło spotkać króla, który zna swoje miejsce!"
 flavor_ara.EVTNAME11: "Spór o sukcesję neapolitańską"
 flavor_ara.EVTDESC11: "Król Aragonii Alfons V podzielił swoje władztwo przed śmiercią, przekazując koronę Neapolu swojemu nieślubnemu synowi Ferdynandowi. Decyzja ta budziła kontrowersje już w chwili jej podjęcia, a od tamtej pory spór tylko przybrał na sile. Nadszedł czas, by ponownie rozważyć legalność sukcesji Ferdynanda."
 flavor_ara.EVTOPTA11: "Neapol należy do nas!"
 flavor_ara.EVTOPTB11: "Będziemy nadal szanować niepodległość Neapolu."
 bavaria_nation_title: "Zjednocz Bawarię"
 bavaria_nation_desc: "Niegdyś dumne księstwo Bawarii jest słabe i podzielone. Musimy zjednoczyć jego dawne ziemie i odzyskać jego dawną chwałę, jeżeli chcemy być czymś więcej niż tylko małą wzmianką na kartach historii."
 pomerania_nation_title: "Zjednocz Pomorze"
 pomerania_nation_desc: "Prawa sukcesji spowodowały, iż Księstwo Pomorskie było często dzielone na kilka mniejszych księstw. Osłabione księstwa stały się narażone na ataki ze strony silniejszych państw, takich jak państwa nadbałtyckie czy rosnąca w siłę Brandenburgia. Aby móc stanąć przeciwko tym zagrożeniom, musimy utworzyć silne państwo pomorskie."
 franconia_nation_title: "Utwórz Frankonię"
 franconia_nation_desc: "Pamięć o dawnym Księstwie Frankonii wciąż żyje wśród ambitnych lokalnych władców. Biskup książęcy Würzburga rości sobie prawo do tego tytułu, lecz w praktyce pozostaje on nieużywany od stuleci, a dawne ziemie księstwa są rozbite i skłócone. Przywrócenie jedności sprawiłoby, że Frankonia ponownie stałaby się siłą, z którą należałoby się liczyć w Niemczech."
 swabia_nation_title: "Utwórz Szwabię"
 swabia_nation_desc: "Dawne Księstwo Szwabii przestało istnieć po egzekucji Konradyna, ostatniego księcia z dynastii Hohenstaufów, w 1268 roku. Od tego czasu próżnię po upadku Hohenstaufów wypełniły liczne hrabstwa, biskupstwa i wolne miasta. Te niewielkie państwa często nie są jednak w stanie obronić swojej niezależności. W rezultacie Habsburgowie austriaccy zgromadzili w Szwabii rozległe posiadłości terytorialne, które nazywają Przednią Austrią. Musimy przywrócić jedność Szwabii, aby położyć kres tej zewnętrznej ekspansji."
 saxony_nation_title: "Zjednocz Saksonię"
 saxony_nation_desc: "Księstwo Saksonii przez wieki zmieniało dynastie i terytorium. Może i my powinniśmy zgłosić roszczenia do tego tytułu?"
 has_adm_advisor_tooltip: "Zatrudnia doradcę §Yadministracyjnego§!."
 has_adm_advisor_2_tooltip: "Zatrudnia doradcę §Yadministracyjnego§! o umiejętnościach co najmniej §Y2§!."
 has_adm_advisor_3_tooltip: "Zatrudnia doradcę §Yadministracyjnego§! o umiejętnościach co najmniej §Y3§!."
 has_dip_advisor_tooltip: "Zatrudnia doradcę §Ydyplomatycznego§!."
 has_dip_advisor_2_tooltip: "Zatrudnia doradcę §Ydyplomatycznego§! o umiejętnościach co najmniej §Y2§!."
 has_dip_advisor_3_tooltip: "Zatrudnia doradcę §Ydyplomatycznego§! o umiejętnościach co najmniej §Y3§!."
