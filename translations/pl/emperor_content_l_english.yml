 hussite.6.t: "Utrakwiści i taboryci"
 hussite.6.d: "Chociaż to umiarkowani utrakwiści zatriumfowali w wojnach husyckich, odrodzenie wiary husyckiej w całym państwie [Root.GetName] doprowadziło do odrodzenia się radykalnych sekt taborytów. Dążą one do zniesienia wszelkich form autorytetu teologicznego poza pismami biblijnymi i odrzucenia wpływów katolickich w największym możliwym stopniu. Przywódcy utrakwistów zaapelowali do państwa o stłumienie ich rosnących wpływów."
