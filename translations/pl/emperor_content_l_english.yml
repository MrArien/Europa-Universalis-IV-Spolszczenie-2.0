 incident_reformer_dissension: "Protest reformatorów"
 incident_reformer_dissension_emperor_alert: "Książęta wyznający kalwinizm są oburzeni, że ich wysiłki mające powstrzymać katolików umożliwiły nowemu cesarzowi ogłoszenie protestantyzmu oficjalną religią Cesarstwa, mimo że reformowani stanowią w nim większość. Pod wodzą [reformed_leader_country.Monarch.GetTitle] [reformed_leader_country.Monarch.GetName]a z państwa [reformed_leader_country.GetName] zwrócili się do cesarza [Emperor.Monarch.GetName], domagając się przyznania kalwinizmowi statusu równego, a nawet wyższego od protestantyzmu w Cesarstwie."
 incident_reformer_dissension_member_alert: "Książęta wyznający kalwinizm są oburzeni, że ich wysiłki mające powstrzymać katolików umożliwiły nowemu cesarzowi ogłoszenie protestantyzmu oficjalną religią Cesarstwa, mimo że reformowani stanowią w nim większość. Pod wodzą [reformed_leader_country.Monarch.GetTitle] [reformed_leader_country.Monarch.GetName]a z państwa [reformed_leader_country.GetName] zwrócili się do cesarza [Emperor.Monarch.GetName], domagając się przyznania kalwinizmowi statusu równego, a nawet wyższego od protestantyzmu w Cesarstwie."
 mary_is_on_the_throne: "Maria Burgundzka na tronie"
 desc_mary_is_on_the_throne: "Oby jej koń nie spowodował wypadku."
 reformer_dissension.1.name: "Protest reformatorów"
 reformer_dissension.1.desc: "Książęta wyznający kalwinizm są oburzeni, że ich wysiłki mające powstrzymać katolików umożliwiły nowemu cesarzowi ogłoszenie protestantyzmu oficjalną religią Cesarstwa, mimo że reformowani stanowią w nim większość. Pod wodzą [reformed_leader_country.Monarch.GetTitle] [reformed_leader_country.Monarch.GetName]a z państwa [reformed_leader_country.GetName] zwrócili się do cesarza [Emperor.Monarch.GetName], domagając się przyznania kalwinizmowi statusu równego, a nawet wyższego od protestantyzmu w Cesarstwie."
 reformer_dissension.1.A: "Cesarstwo jest i pozostanie protestanckie!"
 reformer_dissension.1.A.tt: "§YReformowani książęta będą oburzeni i mogą zdecydować się opuścić Cesarstwo.§!"
 reformer_dissension.1.B: "Przyznajmy im równe prawa."
 reformer_dissension.1.C: "Musimy spełnić wszystkie żądania."
 reformer_dissension.1.C.tt: "\nCesarz, który zostanie zredukowany do §Y1§! prowincji lub będzie miał mniej niż §Y-50§! wyniku wojennego przeciwko §Yreformowanemu§! przeciwnikowi, wybierze tę opcję."
 reformer_dissension.2.name: "[Emperor.GetName] odrzuca żądania reformowanych!"
 reformer_dissension.2.desc: "Cesarz [Emperor.Monarch.GetName] z państwa [Emperor.GetName] odrzucił żądania reformowanych dotyczące równouprawnienia w Cesarstwie. Ogłosił protestantyzm jedyną prawdziwą wiarą i oświadczył, że wyznawcy innych religii muszą się podporządkować albo ponieść konsekwencje. Możemy jedynie podziwiać arogancję [Emperor.Monarch.GetHerHis] i zastanawiać się nad naszą odpowiedzią."
 reformer_dissension.2.A: "Nasza przyszłość wciąż leży w Cesarstwie."
 reformer_dissension.2.B: "Lepiej będzie nam poza nim."
 hre_dominant_reformed: "Zreformowane Cesarstwo"
 desc_hre_dominant_reformed: "Wiara reformowana jest oficjalną religią Świętego Cesarstwa Rzymskiego. Podążanie za tą wiarą udziela naszemu państwu pewnej legitymizacji moralnej. "
 opinion_annoyed_at_hre_protestant: "Narzucony protestantyzm wśród reformowanych sojuszników"
 COLONIAL_BRAZIL_France_Antarctique: "France Antarctique"
 COLONIAL_BRAZIL_France_Antarctique_ADJ: "francuskoantarktyjski"
 event.5017.2: "Na królewskim dworze wybuchł skandal! Wygląda na to, że [Root.Monarch.GetTitle] [Root.Monarch.GetName] został[Root.Monarch.GetANoun] przyłapan[Root.Monarch.GetAY] w kompromitującej sytuacji z żoną znanego szlachcica. W związku z tym, że plotki o rzekomych [Root.Monarch.GetHerHis] \"przygodach\" rozprzestrzeniają się szybciej niż sądzono, trudno jest sprawować faktyczne rządy..."
 event.5017.3: "Na królewskim dworze wybuchł skandal! Wygląda na to, że [Root.Monarch.GetTitle] [Root.Monarch.GetName] został[Root.Monarch.GetANoun] przyłapan[Root.Monarch.GetAY] w kompromitującej sytuacji ze stosunkowo mało znaczącym szlachcicem. W związku z tym, że plotki o rzekomych [Root.Monarch.GetHerHis] \"przygodach\" rozprzestrzeniają się szybciej niż sądzono, trudno jest sprawować faktyczne rządy..."
 event.5017.4: "Na królewskim dworze wybuchł skandal! [Root.Monarch.GetTitle] [Root.Monarch.GetName] ostatnimi czasy zbyt chętnie sięga po butelkę, a przy wielu okazjach widziano [Root.Monarch.GetHerHim] balując[Root.Monarch.GetAEgo] do późnych godzin nocnych. Wygląda na to, że trunek nieco rozluźnił [Root.Monarch.GetHerHis] język, do tego stopnia, że otwarcie wyjawił[Root.Monarch.GetANoun] pewne intymne i zawstydzające szczegóły [Root.Monarch.GetHerHis] małżeństwa..."
 event.5017.5: "Na królewskim dworze wybuchł skandal! [Root.Monarch.GetTitle] [Root.Monarch.GetName] ostatnimi czasy zbyt chętnie sięga po butelkę, a przy wielu okazjach widziano [Root.Monarch.GetHerHim] balując[Root.Monarch.GetAEgo] do późnych godzin nocnych. Wygląda na to, że trunek nieco rozluźnił [Root.Monarch.GetHerHis] język, do tego stopnia, że otwarcie wyjawił[Root.Monarch.GetANoun] pewne intymne i zawstydzające szczegóły [Root.Monarch.GetHerHis] małżeństwa z [Root.Monarch.GetHerHis] małżonką..."
 event.5017.6: "Na królewskim dworze wybuchł skandal! Niedawny gość na dworze publicznie oskarżył [Root.Monarch.GetRulerGen] o wszelkiego rodzaju zniewagi, którym [Root.Monarch.GetSheHe] zaprzecza. Podczas gdy szlachta jest ogólnie zakłopotana sytuacją, szalejące spekulacje na temat tego, czy zarzuty te są prawdziwe, utrudniają załatwienie czegokolwiek..."
 event.5017.A2: "Ród [Root.Monarch.Dynasty.GetName] jest wstrząśnięty!"
 event.5017.B2: "Kilka prezentów pomoże uciszyć plotki."
 event.5073.2: "Nasi urzędnicy w państwie [Root.GetName] zdołali udostępnić nowe ziemie naszym mieszkańcom, osuszając rozległe, cuchnące mokradła, które dotychczas uniemożliwiały osadnictwo na dużym obszarze. Oczyszczone tereny z pewnością doprowadzą do gwałtownego wzrostu liczby ludności."
 flavor_fra.9500.name: "Królewskie dziecko"
 flavor_fra.9500.desc: "[Root.Consort.GetName] urodziła córeczkę. Jest jednak pewien problem... dziecko ma dość ciemną karnację, wyraźnie kontrastującą z wyglądem [Root.Monarch.GetTitle] i jego żony kultury [Root.consort_culture_var.GetCultureName]. Kontrast jest tak uderzający, że biskup zemdlał na widok dziecka, a brat [Root.Monarch.GetTitle] wybuchnął niepohamowanym śmiechem. Podejrzenia szybko padły na pewnego afrykańskiego karła z otoczenia [Root.Consort.GetTitle]..."
 flavor_fra.9500.A: "Te plotki muszą się skończyć! Wyślijcie dziecko do klasztoru."
 flavor_fra.9500.B: "Niewierność? Nie do pomyślenia! To moja córka!"
 flavor_fra.9500.C: "[Root.Consort.GetTitle] musi być poza wszelkimi podejrzeniami! Rozwiodę się z nią!"
 event.5051.desc: "Rzemieślnicy należący do grupy [Root.GetVaishyasOrBurghersName] coraz głośniej protestują przeciwko wysokim podatkom, szkodliwej polityce handlowej i celnej oraz wrogości, jaką okazuje im [Root.Monarch.GetTitle]. Grożą zakłóceniami, które mogą doprowadzić do gwałtownego spadku produkcji przemysłowej, jeśli nie zgodzimy się poprawić ich sytuacji. W prowincji [uppity_artisans_province.GetName] rzemieślnicy są już o krok od otwartego buntu."
 event.5053.desc: "Warstwy kupieckie są coraz bardziej niezadowolone z podatków, monopoli, opłat portowych, rekwizycji na potrzeby floty oraz polityki handlowej i celnej. Grożą przeniesieniem swojego majątku gdzie indziej, jeśli nie stworzymy bardziej przyjaznych warunków dla handlu w państwie [Root.GetUsableName]."
 shortage_of_officers: "Niedobór oficerów"
 desc_shortage_of_officers: "Nasza armia cierpi z powodu braku dobrze wyszkolonych oficerów, którzy potrafiliby wykonywać rozkazy i realizować wolę państwa."
 opinion_heretical_philosopher: "Udzielenie schronienia heretyckiemu filozofowi"
 event.736.desc: "Jeden z najznamienitszych i najbogatszych ludzi w państwie [Root.GetUsableName], [Root.trader_name.GetName], zmarł bezpotomnie. Był szanowanym kupcem, który zbił fortunę na handlu towarem [trade_province.GetFancyTradeGood_LOW], a także znanym mecenasem religii i sztuki. Przed śmiercią zapisał cały swój majątek państwu."
