 desc_colonial_assimilation_of_natives_mod: "Państwo to skutecznie integruje ludność tubylczą ze swoimi koloniami."
 colonial_accommodation_mod: "Integracja ludności tubylczej w koloniach"
 desc_colonial_accommodation_mod: "Ludność tubylcza dołącza do tej kolonii."
 flavor_swi.EVTNAME4: "Konfederacje szwajcarskie"
 flavor_swi.EVTDESC4: "Samo państwo [Root.GetName] nie jest oficjalnie uznawane za państwo, nawet przez siebie samo. Szwajcarskie miasta są wolnymi miastami cesarskimi Świętego Cesarstwa Rzymskiego i podlegają bezpośrednio cesarzowi. Konfederacja [Root.GetAdjective] jest jedynie porozumieniem wojskowym i handlowym zawartym między szwajcarskimi miastami. Podobne układy istnieją również między innymi kantonami, w tym naszym sąsiadem, państwem [TTL.GetName].\n\n[TTL.GetName] jest konfederacją niezależnych kantonów współpracujących ze sobą. Być może, oferując współpracę, rozpoczniemy proces jednoczenia wszystkich szwajcarskich kantonów w jedno państwo."
 flavor_swi.EVTOPTA4: "Rozszerzmy konfederację."
 flavor_swi.EVTOPTB4: "Skupmy się na wzmocnieniu kantonów."
 flavor_swi.EVTNAME5: "Jan Kalwin"
 flavor_swi.EVTDESC5: "Gdy reformacja przetacza się przez Europę, jedność szwajcarskich kantonów zaczyna się rozpadać. Każdy kanton opowiada się po jednej ze stron konfliktu protestantów z katolikami, a wojny religijne nadal plamią naszą ziemię szwajcarską krwią.\n\nKaznodzieja Jan Kalwin głosi nauki na ulicach Genewy. W całej Europie propaguje własną interpretację reformacji, twierdząc, że wszyscy ludzie rodzą się całkowicie zepsuci i tylko łaska Boża może uwolnić ich od występku i grzechu.\n\nOstatnio zdobył w naszym państwie licznych zwolenników – tak wielu, że jego wpływy mogą wkrótce przewyższyć autorytet [Root.Monarch.GetName]."
 flavor_swi.EVTOPTA5: "Mieszkańcy Genewy mogą podążać za tym, kogo zechcą."
 flavor_swi.EVTOPTB5: "Wygnajcie tego fanatyka z naszego państwa!"
 flavor_swi.EVTNAME6: "Powrót Kalwina do Genewy"
 flavor_swi.EVTDESC6: "Pomimo wygnania z miasta Jan Kalwin ponownie pojawił się na ulicach prowincji [4720.GetName], gdzie głosi swoją wiarę. Wielu oczekuje kolejnego szybkiego wygnania, lecz być może [Root.Monarch.GetName] jest bardziej wyrozumiały wobec poglądów religijnych Kalwina."
 flavor_swi.EVTOPTA6: "Nie warto się nim zajmować."
 flavor_swi.EVTOPTB6: "Znowu? Usuńcie tego heretyka!"
 flavor_swi.EVTNAME7: "Kalwin zostaje przywódcą duchowym Genewy"
 flavor_swi.EVTDESC7: "Reformator Jan Kalwin od wielu lat głosi w Genewie swoje wyjątkowe poglądy religijne. W miarę jak nasze państwo coraz bardziej odwraca się od Kościoła katolickiego, rośnie zapotrzebowanie na przywódcę duchowego Genewy. Większość Wielkiej Rady zagłosowała za ustanowieniem takiego urzędu i powołaniem na niego Jana Kalwina. [Root.Monarch.GetName] może interweniować w decyzję rady i odsunąć Kalwina od władzy, lecz wywołałoby to ogromne niezadowolenie reformowanej ludności prowincji [4720.GetName]."
 flavor_swi.EVTOPTA7: "Zaprośmy Kalwina, by został przywódcą duchowym państwa [Root.GetName]!"
 flavor_swi.EVTOPTB7: "Po prostu nie będziemy nic robić."
 flavor_swi.EVTOPTC7: "Musimy usunąć to czarne ziarno, zanim przerodzi się w zamach stanu!"
 flavor_swi.EVTNAME8: "Malejąca władza [Root.Monarch.GetTitle]"
 flavor_swi.EVTDESC8: "Od lat władza w naszym państwie jest dzielona między świeckiego przywódcę [Root.Monarch.GetName]a a przywódcę duchowego, Jana Kalwina. Ponieważ wyznanie reformowane zdobyło w naszym kraju przytłaczającą większość, liczba osób wierzących jeszcze we władzę [Root.Monarch.GetTitle] znacznie zmalała, a coraz więcej ludzi uznaje Kalwina za głowę państwa. Poza naszymi granicami Kalwin zyskał zwolenników w całej Europie, a wielu jego wpływowych wyznawców przybywa do miasta [Root.Capital.GetName], by spotkać się z nim, nie poświęcając nawet przelotnego spojrzenia [Root.Monarch.GetName]owi."
 flavor_swi.EVTOPTA8: "Oto, jak demokracja upada..."
 flavor_swi.EVTOPTB8: "To szaleństwo zaszło za daleko. Państwo [Root.GetName] nie potrzebuje przywódcy duchowego!"
 flavor_swi.EVTNAME9: "Zwycięzcy wojny stuletniej"
 flavor_swi.EVTDESC9: "Podczas gdy Anglia i Francja walczyły ze sobą w bezcelowej wojnie, reputacja szwajcarskich najemników oferujących swoje usługi w tym konflikcie zaczyna rosnąć. W większości państw bycie żołnierzem to jedynie praca na pół etatu, ale nasi doskonale wytrenowani najemnicy walczący na wojnie zaskakiwali zarówno Francuzów, jak i Anglików swoimi mistrzowskimi taktykami i brutalnymi metodami wywalczania kolejnych zwycięstw swoim kontrahentom."
 flavor_swi.EVTOPTA9: "Wkrótce cała Europa będzie drżeć na sam widok szwajcarskich najemników!"
 flavor_swi.EVTNAME10: "Monopol najemniczy"
 flavor_swi.EVTDESC10: "W całej historii Europy najbardziej pożądanymi najemnikami byli ci pochodzący ze Szwajcarii i Szwabii. Teraz, gdy nie istnieją już niezależne państwa szwabskie, od których można wynajmować kondotierów, popyt na szwajcarskich najemników jeszcze wzrósł. Monopol, który posiadamy na rynku najemników, pozwoli nam żądać jeszcze wyższych stawek za nasze armie, a brak Szwabów zdolnych rzucić nam wyzwanie tylko wzmocni budzącą postrach reputację naszych najemników."
 flavor_swi.EVTOPTA10: "Doskonale."
 flavor_swi.EVTNAME11: "Republika Helwecka"
 flavor_swi.EVTDESC11: "Rozprzestrzeniając rewolucję w Szwajcarii, zyskujemy wyjątkową okazję do przekształcenia Federacji Szwajcarskiej w ustrój bardziej zbliżony do naszego. Tworząc Republikę Helwecką na gruzach szwajcarskich kantonów, możemy zakończyć konflikt między naszymi państwami i szerzyć rewolucję w Szwajcarii."
 flavor_swi.EVTOPTA11: "Brzmi dobrze. Zajmijmy się tym!"
 flavor_swi.EVTOPTB11: "Mamy inne plany wobec Szwajcarii..."
 flavor_swi.EVTDESC1101: "Gdy płomienie rewolucji państwa [From.GetAdjective] rozprzestrzeniają się po Szwajcarii, dawne porządki szybko ustępują miejsca nowoczesnemu, scentralizowanemu rządowi. Nie możemy już nazywać się Federacją Szwajcarską, ponieważ nasze kantony nie są już niezależne i wolne. Nieustanna okupacja przez siły rewolucyjne doprowadziła do radykalnej zmiany ustroju i my również musimy teraz przysiąc wierność Rewolucji."
 flavor_swi.EVTOPTA1101: "Odtąd podlegamy nowemu rodzajowi [Root.Monarch.GetTitle]..."
 flavor_swi.EVTOPTB1101: "Rewolucyjni fanatycy nie będą rządzić naszym krajem!"
 flavor_swi.2.t: "Szwajcarskie miasta i Sabaudia"
 flavor_swi.2.d: "Równowaga sił w Genewie zależy częściowo od [SAV.Monarch.GetTitle] państwa [SAV.GetName], a częściowo od Wielkiej Rady Genewy. W każdej chwili [SAV.Monarch.GetTitle] [SAV.Monarch.GetName] może jednak zechcieć wywrzeć większą presję na nasze państwo i zlikwidować demokratyczne uprawnienia Genewy. Pod tym samym panowaniem znajdują się także inne potężne miasta. Być może, zawierając odpowiednie sojusze, zdołamy zwiększyć nasze wpływy w szwajcarskich ziemiach Sabaudii tak bardzo, że przewyższą nawet wpływy [SAV.Monarch.GetTitle] [SAV.Monarch.GetName]a..."
 flavor_swi.2.a: "Wyślijmy posłów do szwajcarskich miast."
 flavor_swi.2.b: "Nie chcemy rozgniewać naszego [SAV.Monarch.GetTitle]."
 flavor_swi.201.t: "Genewa prosi o sojusz ze szwajcarskimi miastami"
 flavor_swi.201.d: "Otrzymaliśmy dziś wiadomość, że Wielka Rada rządząca Genewą nawiązała kontakt z innymi szwajcarskimi miastami formalnie podlegającymi [Root.Monarch.GetTitle] [Root.Monarch.GetName]owi. Jeśli pozwolimy radzie zwiększyć wpływy wśród szwajcarskich miast, prawowita władza państwa [Root.GetName] w regionie zostanie zakwestionowana, a miasta prawdopodobnie zaczną spiskować przeciwko nam. Oczywiście możemy położyć kres wpływom Wielkiej Rady, demonstrując siłę wobec [GNV.Monarch.GetTitle] [GNV.Monarch.GetName]."
 flavor_swi.201.a: "Na razie możemy przymknąć na to oko..."
 flavor_swi.201.b: "Zakazać zawarcia sojuszu i przynieść mi głowę [GNV.Monarch.GetName]!"
 flavor_swi.202.t: "Odpowiedź sabaudzka"
 flavor_swi.202.d: "Odpowiedź [SAV.Monarch.GetTitle] [SAV.Monarch.GetName] na naszą rozsądną prośbę wstrząsnęła urzędnikami naszego państwa. Ku naszemu przerażeniu sabaudzki urzędnik dostarczył do sali obrad Wielkiej Rady głowę [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Taka odpowiedź [SAV.Monarch.GetTitle] z pewnością nie złagodzi napięć między naszymi państwami."
 flavor_swi.202.a: "Pomścimy naszego [Root.Monarch.GetTitle]."
 flavor_swi.203.t: "Losy Genewy"
 flavor_swi.203.d: "Książęta Sabaudii przez całą historię z trudem zaspokajali oczekiwania Wielkiej Rady Genewy. Po raz kolejny jesteśmy wzburzeni sytuacją w [SAV.GovernmentName] państwa [SAV.GetAdjective] i pragniemy się od niego uwolnić. Ostatnia poprawa naszych stosunków ze Szwajcarią daje nam możliwość odłączenia się od Sabaudii i przyłączenia do Konfederacji Szwajcarskiej. Choć rozgniewa to naszego byłego suwerena, Szwajcarzy dysponują siłami zdolnymi chronić nasze interesy."
 flavor_swi.203.a: "Nawiążmy kontakt ze Szwajcarami."
 flavor_swi.203.c: "Nie drażnijmy [SAV.Monarch.GetTitle] państwa [SAV.GetName]."
 flavor_swi.204.d: "Urzędnik Wielkiej Rady Genewy zwrócił się dziś do nas z prośbą o przyjęcie do Konfederacji Szwajcarskiej. Genewa jest państwem podległym [SAV.Monarch.GetTitle] [SAV.Monarch.GetName] z Sabaudii, dlatego zaakceptowanie takiej propozycji poważnie rozgniewałoby urzędników państwa [SAV.GetAdjective] i mogłoby doprowadzić do wojny."
 flavor_swi.204.a: "Witamy w Konfederacji, [From.GetName]."
 incidents_bur_inheritance.0.t: "Maria Burgundzka"
 incidents_bur_inheritance.0.d: "Wygląda na to, że ród [Root.Monarch.Dynasty.GetName] podupadł i wymiera wraz z ostatnim potomkiem [Root.Monarch.GetName]. [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] nie zdołał przez wszystkie lata swego panowania spłodzić dziedzica, będąc ostatnim żyjącym mężczyzną z rodu [Root.Monarch.Dynasty.GetName].\n\n[Root.Monarch.GetTitle] doczekał się jednak utalentowanej i pięknej córki o imieniu Maria. [Root.Monarch.GetHerHisCap] ojciec, Filip [Root.Monarch.Dynasty.GetName], słynął z niechęci do Marii i uważał, że żadna kobieta nie powinna zasiadać na tronie Burgundii. [Root.Monarch.GetName] nie jest jednak swoim ojcem, a sytuacja staje się coraz bardziej rozpaczliwa. Jeśli [Root.Monarch.GetName] umrze bez potomka, Maria i tak zostanie [Root.Monarch.GetHerHis] faktyczną następczynią. Jeśli jednak [Root.Monarch.GetName] zrezygnuje z poszukiwania męskiego dziedzica i uzna Marię za prawowitą dziedziczkę Burgundii, wzmocni to jej roszczenia i może pozwolić nam rozwiązać kryzys sukcesyjny przy minimalnych napięciach.\n\nKobiety-dziedziczki są łakomym kąskiem dla ambitnych mężczyzn, a sukcesja Marii może doprowadzić do unii Burgundii z obcym mocarstwem."
 incidents_bur_inheritance.0.a: "Ród [Root.Monarch.Dynasty.GetName] ma przed sobą świetlaną przyszłość z Marią."
 incidents_bur_inheritance.0.b: "Mój ojciec miał rację. Żadna kobieta nie może rządzić państwem [Root.GetName]."
 incidents_bur_inheritance.1.t: "Sukcesja burgundzka"
 incidents_bur_inheritance.1.desc: "Stało się to, czego zawsze się obawialiśmy: książę państwa [Root.GetName] odszedł z tego świata, nie pozostawiając prawowitego męskiego dziedzica. Po jego przedwczesnej śmierci [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] wstąpiła na tron jako [Root.Monarch.GetTitle] Burgundii. Jej roszczenia są jednak stosunkowo słabe w oczach wielu możnych, a Burgundia wydaje się łatwym łupem dla ambitnego [FRA.Monarch.GetTitle] państwa [FRA.GetName] oraz [Emperor.Monarch.GetTitle] Świętego Cesarstwa Rzymskiego.\n\n[Root.Monarch.GetName] jest odważną i inteligentną młodą kobietą, lecz jeśli Burgundia ma przetrwać ten kryzys bez konfliktu z jednym z wielkich mocarstw, [Root.Monarch.GetName] musi poślubić przedstawiciela znamienitego rodu królewskiego i zyskać jego wsparcie oraz ochronę. Oczywiście [Root.Monarch.GetName] zawrze tradycyjne małżeństwo patrylinearne, przez co Burgundia stanie się w praktyce zależna od obcego państwa. W tych niespokojnych czasach jaki mamy jednak wybór? [Root.Monarch.GetHerHis] decyzja zaważy na przyszłości Burgundii."
 incidents_bur_inheritance.1.a: "Niech się dzieje, co chce – Burgundia pozostanie burgundzka."
 incidents_bur_inheritance.1.b: "Francuzi nie mogą już nas powstrzymać."
 incidents_bur_inheritance.1.c: "Książę z dynastii [Emperor.Monarch.Dynasty.GetName] będzie odpowiedni."
 incidents_bur_inheritance.1.d: "Państwo [bur_strongest_ally.GetName] ponownie nas obroni."
 incidents_bur_inheritance.1.e: "Przywróćmy unię z Francją."
 incidents_bur_inheritance.101.t: "[From.GetName] stawia opór"
 incidents_bur_inheritance.101.d.emp: "Pomimo naszych silnych roszczeń do [BUR.GovernmentName] państwa [BUR.GetName], [Emperor.Monarch.GetName] [Emperor.Monarch.Dynasty.GetName] odmówił jakichkolwiek ustępstw i ogłosił [Emperor.GetHerselfHimself] prawowitym następcą całego państwa [BUR.GetName]. Jest to zupełnie nieoczekiwane, gdyż [BUR.GetName] było zaledwie niewielkim księstwem zbuntowanym przeciwko koronie [FRA.GetAdjective]. Zignorowanie decyzji [Emperor.Monarch.GetTitle] może jednak osłabić naszą pozycję jako dziedziców francuskiej korony."
 incidents_bur_inheritance.101.d.indi: "Pomimo naszych silnych roszczeń do [BUR.GovernmentName] państwa [BUR.GetName], [BUR.Monarch.GetName] [BUR.Monarch.Dynasty.GetName] odmówił jakichkolwiek ustępstw i ogłosił [BUR.Monarch.GetHerselfHimself] niezależnym od wszystkich obcych mocarstw. Jest to zupełnie nieoczekiwane: ród [BUR.Monarch.Dynasty.GetName] nie pozostawił męskiego dziedzica, dlatego spodziewaliśmy się, że [BUR.GovernmentName] ponownie połączy się z [FRA.GetAdjective] [FRA.GovernmentName], a Niderlandy powrócą do Cesarstwa. Ten nieoczekiwany obrót spraw dał nam jednak silne roszczenia do [BUR.GovernmentName] i możemy po prostu siłą zakończyć nieprawowite rządy [BUR.Monarch.GetName] [BUR.Monarch.Dynasty.GetName]."
 incidents_bur_inheritance.101.a: "Nadeszła nasza chwila."
 incidents_bur_inheritance.101.b: "Nie jest to warte wysiłku."
 incidents_bur_inheritance.102.t: "Cesarz żąda Niderlandów"
 incidents_bur_inheritance.102.d: "Śmierć księcia państwa [BUR.GetName] sprawiła, że skutki jego reform, które doprowadziły do ścisłej integracji Niderlandów z resztą [Root.GetAdjective] [Root.GovernmentName], powróciły, by nas prześladować. [Emperor.Monarch.GetTitle] wysłał posłańca z żądaniem oddzielenia Niderlandów od [BUR.GovernmentName] państwa [BUR.GetName] i przywrócenia im statusu księstw w ramach Świętego Cesarstwa Rzymskiego.\n\n[Root.Monarch.GetName] jest jednak przebiegłym i mądrym [Root.Monarch.GetTitle]. Zaproponował cofnięcie reform poprzedniego władcy państwa [BUR.GetName] i wprowadzenie Wielkiego Przywileju. Nakazywałby on wszystkim miastom Niderlandów uznawać [BUR.GetName] za ich prawowitego [BUR.Monarch.GetTitle], a jednocześnie pozostać lojalnymi wobec [Emperor.Monarch.GetTitle] Świętego Cesarstwa Rzymskiego. Nasz plan może oczywiście obrócić się przeciwko nam, jeśli [Emperor.Monarch.GetTitle] potraktuje go jako prowokację do wojny. Istnieje jednak szansa, że [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName] na razie się zadowoli..."
 incidents_bur_inheritance.102.a: "Nie będziemy kłaniać się temu „[Emperor.Monarch.GetTitle]”."
 incidents_bur_inheritance.102.b: "Nadajmy Wielki Przywilej."
 incidents_bur_inheritance.102.c: "Porzućmy Niderlandy."
 incidents_bur_inheritance.102.c.tt: "Wszyscy poddani państwa §Y[BUR.GetName]§!, których stolice znajdują się w §YNiderlandach§!, uzyskają niepodległość i dołączą do Świętego Cesarstwa Rzymskiego."
 incidents_bur_inheritance.103.t: "Odziedziczono Burgundię!"
 incidents_bur_inheritance.103.d.fra: "Książęta Burgundii zawsze byli cierniem w boku rodu [Root.Monarch.Dynasty.GetName] z Francji, ale wraz ze śmiercią ostatniego mężczyzny w linii burgundzkiej, Marie de Bourgogne zaproponowała reintegrację z Francją. Decyzja ta oznacza, że zbuntowane księstwo burgundzkie należy już do przeszłości, a nasze panowanie nad Francją jest bezpieczne, choć [Emperor.Monarch.GetTitle] Świętego Cesarstwa Rzymskiego może być zaniepokojon[Emperor.Monarch.GetAY] naszą kontrolą nad Niderlandami."
 incidents_bur_inheritance.103.d.emp: "Wraz ze śmiercią księcia Burgundii, nasze bliskie więzi królewskie z Cesarstwem stały się bardzo owocne. Wiele burgundzkich terytoriów istnieje w ramach Cesarstwa, a Marie de Bourgogne zdecydowała się w pełni zintegrować z Cesarstwem, oferując ślub z księciem rodu [Root.Monarch.Dynasty.GetName]! Francuzi oczekują, że zwrócimy im burgundzkie ziemie, które niegdyś należały do francuskiego tronu, ale oczywiście możemy zaprzeczyć ich roszczeniom i zachować Burgundię jako integralną część Cesarstwa."
 incidents_bur_inheritance.103.d.oth: "Wraz ze śmiercią księcia Burgundii, nasze bliskie królewskie więzi z Burgundczykami stały się bardzo owocne. Ze wszystkich dostępnych dla niej opcji, Maria 'Sprawiedliwa' z Burgundii zdecydowała się poślubić członka rodu [Root.Monarch.Dynasty.GetName] i chociaż Maria jest nadal księżną Burgundii, wszyscy jej spadkobiercy będą należeć do naszej linii, a my jesteśmy już tak wpływowi w regionie, że równie dobrze można uznać, że Burgundia należy do [Root.GetAdjective]."
 incidents_bur_inheritance.103.a: "Doskonale."
 incidents_bur_inheritance.104.t: "Wielki przywilej"
 incidents_bur_inheritance.104.d: "Odpowiedź [BUR.Monarch.GetTitle] państwa [BUR.GetAdjective] zupełnie nas zaskoczyła. [BUR.Monarch.GetSheHeCap] postanowił nie zwracać ziem zagarniętych Cesarstwu, lecz wprowadzić złożone prawo, zgodnie z którym Niderlandy będą jednocześnie częścią Cesarstwa i podlegać [BUR.Monarch.GetTitle] państwa [BUR.GetName]. Nie możemy interweniować bez ryzyka utraty reputacji cesarza, lecz jeśli nie zrobimy nic, możemy na zawsze utracić Niderlandy."
 incidents_bur_inheritance.104.a: "Chyba nic nie możemy na to poradzić..."
 incidents_bur_inheritance.104.b: "Niech prawo diabli! Chcę usunąć państwo [BUR.GetName] z Cesarstwa!"
 incidents_bur_inheritance.2.t: "Odziedziczono Burgundię!"
 incidents_bur_inheritance.2.d: "Wraz ze śmiercią księcia Burgundii, burgundzkie więzi królewskie z Cesarstwem stały się bardzo owocne. Wiele burgundzkich terytoriów istnieje w ramach Cesarstwa, a Marie de Bourgogne zdecydowała się w pełni zintegrować z Cesarstwem, oferując ślub z księciem rodu [Emperor.Monarch.Dynasty.GetName]! Francuzi oczekują zwrotu burgundzkich ziem, które niegdyś należały do francuskiego tronu, ale [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName] może oczywiście zaprzeczyć ich roszczeniom i zachować Burgundię jako integralną część Cesarstwa."
 incidents_bur_inheritance.2.a: "Utrzymanie naszej unii z Burgundią."
 incidents_bur_inheritance.2.b: "Ustępstwa wobec Francji."
 incidents_bur_inheritance.2.c: "Integracja Burgundii z Cesarstwem."
 incidents_bur_inheritance.3.t: "Niderlandzki kryzys"
 incidents_bur_inheritance.3.d: "Wraz ze śmiercią księcia Burgundii Niderlandy całkowicie wymknęły się z naszej kontroli. Jeśli chcemy wzmocnić Cesarstwo i utrzymać cudzoziemców z dala od spraw Cesarstwa, musimy naciskać na nasze roszczenia do Niderlandów, albo ryzykować ich utratę na zawsze."
 incidents_bur_inheritance.3.a: "Żądanie niezależności Niderlandów."
 incidents_bur_inheritance.3.b: "Nacisk na Burgundię."
 incidents_bur_inheritance.3.b.tt: "Wojna rozpocznie się za §Y10§! dni."
 incidents_bur_inheritance.3.c: "Porzucenie roszczeń."
 incidents_bur_inheritance.301.t: "Cesarz żąda Niderlandów"
 incidents_bur_inheritance.301.d: "Kiedy odziedziczyliśmy Burgundię, staliśmy się również suwerenem terytoriów Burgundii w Niderlandach. Terytoria te są tradycyjnie częścią Świętego Cesarstwa Rzymskiego i nic dziwnego, że nasze dziedzictwo sprowokowało [Emperor.GetRulerGen] do zażądania od nas tych terytoriów. Moglibyśmy oczywiście odmówić, ale [Emperor.Monarch.GetTitle] wyraźnie zaznaczył[Emperor.Monarch.GetANoun], że jest to żądanie, a jego niespełnienie da j[Emperor.Monarch.GetEjEmu] powód do wyciągnięcia miecza Cesarstwa."
 incidents_bur_inheritance.301.a: "Cała Burgundia jest nasza!"
 incidents_bur_inheritance.301.b: "Rozsądne żądanie."
 incidents_bur_inheritance.302.t: "Cesarz żąda Burgundii"
 incidents_bur_inheritance.302.d: "Istnieje wielu pretendentów do [BUR.GetGovNameGen] [BUR.GetAdjective], a kiedy staliśmy się dziedzicami [BUR.GetGovNameGen], spodziewaliśmy się, że [Emperor.Monarch.GetTitle] Świętego Cesarstwa Rzymskiego zażąda swoich tradycyjnych roszczeń w Niderlandach. Nie spodziewaliśmy się jednak, że [Emperor.Monarch.GetName] zażąda całego państwa [BUR.GetAdjective]. [Emperor.Monarch.GetTitle] dał[Emperor.Monarch.GetANoun] nam jasno do zrozumienia, że pokój nie wchodzi w grę, a wojna nadejdzie, chyba że całkowicie oddamy Burgundię Cesarstwu."
 incidents_bur_inheritance.302.a: "Cała Burgundia jest nasza."
 incidents_bur_inheritance.302.b: "Burgundia i tak jest cierniem w naszym boku..."
 incidents_bur_inheritance.4.t: "[From.GetName] stawia opór"
 incidents_bur_inheritance.4.d: "Pomimo naszych silnych roszczeń do [BUR.GovernmentName] państwa [BUR.GetName], [BUR.Monarch.GetName] [BUR.Monarch.Dynasty.GetName] odmówił jakichkolwiek ustępstw i ogłosił [BUR.Monarch.GetHerselfHimself] niezależnym od wszystkich obcych mocarstw. Jest to zupełnie nieoczekiwane: ród [BUR.Monarch.Dynasty.GetName] nie pozostawił męskiego dziedzica, dlatego spodziewaliśmy się, że [BUR.GovernmentName] ponownie połączy się z [FRA.GetAdjective] [FRA.GovernmentName], a Niderlandy powrócą do Cesarstwa. Ten nieoczekiwany obrót spraw dał nam jednak silne roszczenia do [BUR.GovernmentName] i możemy po prostu siłą zakończyć nieprawowite rządy [BUR.Monarch.GetName] [BUR.Monarch.Dynasty.GetName]."
 incidents_bur_inheritance.4.a: "Żądanie Niderlandów."
 incidents_bur_inheritance.5.t: "Księżna Burgundii umiera"
 incidents_bur_inheritance.5.d: "Smutne wieści dotarły do nas dzisiaj, gdy dowiedzieliśmy się, że nasza ukochana Maria, księżna Burgundii, odeszła z tego świata do następnego. Słodka i dobroduszna kobieta, Marii będzie bardzo brakować na dworze [burgundy_senior_partner.GetAdjective], ale teraz, gdy odeszła, wydaje się, że odziedziczy nas państwo [burgundy_senior_partner.GetName]. Wielu szlachciców królestwa już ugięło kolana przed władzą [burgundy_senior_partner.Monarch.GetRulerGen] z [burgundy_senior_partner.GetAdjective], ale wielu innych zaczyna gromadzić się wokół dalekiego kuzyna Marii i jednego z niewielu ocalałych członków burgundzkiej rodziny królewskiej. Jeśli się poddamy, nasz[Root.GetGovGender_nasz] [Root.GovernmentName] przestanie istnieć i zostaniemy przyłączeni do [burgundy_senior_partner.GetGovNameGen][burgundy_senior_partner.GetAdjective]. Jeśli uznamy słabe roszczenia burgundzkiego pretendenta, bez wątpienia wejdziemy w stan wojny z państwem [burgundy_senior_partner.GetName]."
 incidents_bur_inheritance.5.a: "Niestety, nie mamy wyboru."
 incidents_bur_inheritance.5.b: "Wolimy umrzeć niż przyłączyć się do [burgundy_senior_partner.GetAdjective]!"
 incidents_bur_inheritance.501.d: "Smutne wieści dotarły dziś do miasta [Root.Capital.GetName], gdy dowiedzieliśmy się, że nasza ukochana Maria, księżna Burgundii, odeszła z tego świata do następnego. Słodka i dobroduszna kobieta oraz kochająca żona księcia, Marii będzie bardzo brakować na dworze [burgundy_senior_partner.GetAdjective]. Maria była pasjonatką jazdy konnej i towarzyszyła mężowi w jego rutynowych polowaniach, ale jej dobre serce i pasja do jazdy konnej nie mogły jej uratować, gdy jej pięćsetkilogramowy koń spadł na nią i złamał jej kręgosłup.\n\nMałżeństwo księcia z rodu [Root.Monarch.Dynasty.GetName] i księżnej Marii I Burgundzkiej połączyło nasze narody w błogim związku, ale teraz, gdy Maria odeszła z tego świata do następnego, nikt nie jest w stanie zakwestionować naszych roszczeń do Księstwa Burgundii i już teraz szlachta Burgundii zwraca się do [Root.Monarch.GetRulerGen] jako ich prawowitego władcy."
 incidents_bur_inheritance.501.a: "Ale mamy szczęście!"
 incidents_bur_inheritance.502.d: "Smutne wieści dotarły dziś do miasta [Root.Capital.GetName], gdy dowiedzieliśmy się, że nasza ukochana Maria, księżna Burgundii, odeszła z tego świata do następnego. Słodka i dobroduszna kobieta oraz kochająca żona księcia, Marii będzie bardzo brakować na dworze [burgundy_senior_partner.GetAdjective]. Maria była pasjonatką jazdy konnej i towarzyszyła mężowi w jego rutynowych polowaniach, ale jej dobre serce i pasja do jazdy konnej nie mogły jej uratować, gdy jej pięćsetkilogramowy koń spadł na nią i złamał jej kręgosłup.\n\nKu naszemu zaskoczeniu, lordowie i damy Burgundii nie zaczęli natychmiast zginać kolan przed władzą nasz[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen], ale zamiast tego uznali dalekiego kuzyna Marii za prawowitego władcę. To niedorzeczne, prawo jasno stanowi, że [Root.Monarch.Dynasty.GetName] musi przejąć władzę po śmierci Marii. Wygląda na to, że szalona szlachta Burgundii uznaje tylko język przemocy i będziemy musieli egzekwować nasze prawowite roszczenia krwią."
 incidents_bur_inheritance.502.a: "Nie jest to warte zachodu."
 incidents_bur_inheritance.502.b: "Zachowamy unię, choćbyśmy mieli spalić całe miasto [BUR.Capital.GetCapitalName]!"
 incidents_bur_join_empire.1.t: "Przyjęcie do Cesarstwa"
 incidents_bur_join_empire.1.desc: "Nasze państwo zawdzięcza swoje istnienie burgundzkiemu rodowi królewskiemu, który oderwał się od Królestwa Francji, by dochodzić naszych prawowitych roszczeń do tronu wszystkich Franków. Jak dotąd nie zdecydowaliśmy się jednak dochodzić praw do korony francuskiej, przez co nasze roszczenia dawno straciły na znaczeniu. Wielu zagranicznych możnych wyśmiewa pomysł istnienia niezależnej Burgundii przez kolejne stulecia. Rada królewska doradziła więc naszemu [Root.Monarch.GetTitle], by zabiegał o przyjęcie do Świętego Cesarstwa Rzymskiego i złożył hołd [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName]owi z dynastii [Emperor.Monarch.Dynasty.GetName], stając się księciem Rzeszy.\n\nCesarstwo stwarza przed Burgundią ogromne możliwości, a być może pewnego dnia sami sięgniemy nawet po godność cesarską..."
 incidents_bur_join_empire.1.a: "Nigdy szczególnie nie zależało mi na francuskim tronie."
 incidents_bur_join_empire.1.b: "Niech się śmieją. Burgundia pozostanie Burgundią."
 incidents_bur_join_empire.2.t: "Państwo [BUR.GetName] prosi o przyjęcie do Cesarstwa"
 incidents_bur_join_empire.2.desc: "[BUR.Monarch.GetTitle] państwa [BUR.GetName] pragnie przyłączyć się do Świętego Cesarstwa Rzymskiego. Choć decyzja może wydawać się oczywista, książę Burgundii może stanowić dla Cesarstwa poważne zagrożenie. Trudno będzie powstrzymać dalszą ekspansję Burgundii na ziemie cesarskie, a elektorzy mogą uznać Burgundczyków za odpowiednich kandydatów do godności cesarskiej. Z drugiej strony włączenie Burgundii do Cesarstwa całkowicie rozładowałoby napięcia między nimi i stworzyło wyjątkową okazję do rozszerzenia wpływów cesarskich na Francję."
 incidents_bur_join_empire.2.a: "Witamy [BUR.Monarch.GetRulerGen] [BUR.GetAdjective] w Cesarstwie."
 incidents_bur_join_empire.2.b: "Zezwól im na wstąpienie pod warunkiem, że porzucą wszystkie inne tytuły."
 incidents_bur_join_empire.2.c: "Zakazać im wstępu."
 incidents_bur_join_empire.3.t: "Dziwna propozycja"
 incidents_bur_join_empire.3.desc: "[Emperor.Monarch.GetTitle] postanowił zgodzić się na nasze przyjęcie do Cesarstwa pod jednym warunkiem: musimy zrzec się wszystkich tytułów poza księciem i władztwami zamorskimi. Oznacza to, że wszelkie posiadane przez nas ziemie, które nie stanowią prawowitej części Księstwa Burgundii, zostaną uwolnione jako księstwa Rzeszy, a terytorium naszego państwa znacznie się zmniejszy. Niektórzy dworzanie uznają to za jawne znieważenie naszych prawowitych posiadłości królewskich, inni zaś nadal twierdzą, że [Emperor.Monarch.GetTitle] pozostaje najlepszą drogą do uzyskania ochrony."
 incidents_bur_join_empire.3.a: "Choć wiele mnie to kosztuje, zgadzam się."
 incidents_bur_join_empire.3.b: "To zupełnie nieopłacalne."
 incidents_bur_join_empire.4.t: "[Emperor.Monarch.GetTitle] odmawia"
 incidents_bur_join_empire.4.desc: "Powołując się na zagrożenie, jakie stanowimy dla niepodległości innych książąt Rzeszy, [Emperor.Monarch.GetTitle] odmówił nam przyjęcia do Świętego Cesarstwa Rzymskiego. Jest dla nas oczywiste, że [Emperor.Monarch.GetTitle] to jedynie zwiędły wąż owinięty wokół cesarskiej korony, który obawia się, że szlachetne lwy państwa [Root.GetAdjective] odbiorą mu ją siłą. Nic to – będziemy musieli znaleźć bardziej zdecydowany sposób na przyłączenie się do Cesarstwa i odebrać ją [Emperor.Monarch.GetHerHim]..."
 incidents_bur_join_empire.4.a: "[Emperor.Monarch.GetSheHeCap] jest [Emperor.Monarch.GetTitle] tylko z nazwy."
 burgundy_has_resolved_imperial_issue_tt: "Ta misja zostanie ukończona, gdy kwestia naszego członkostwa w Cesarstwie zostanie rozstrzygnięta."
 burgundy_has_secured_succession_tt: "Rozwiąż §Ykryzys sukcesyjny w Burgundii§! lub dotrzyj do roku 1500, nie wywołując go."
 burgundy_asks_to_join_empire_tt: "Poprosimy §Y[Emperor.Monarch.GetTitle]§! o zgodę na przyjęcie do §YŚwiętego Cesarstwa Rzymskiego§!."
 burgundy_may_refuse_tt: "§YBurgundia§! zostanie poproszona o §Yuwolnienie wszystkich państw europejskich posiadających rdzenie na jej prowincjach§! jako §Yksiążąt Rzeszy§!.\n§YBurgundia§! prawdopodobnie odmówi."
 become_balkanised_tt: "§YUwolnimy wszystkie państwa europejskie§! posiadające §Yrdzenie§! na naszych prowincjach jako §Yksiążąt Rzeszy§!."
 incident_burgundian_succ_emp_emperor_alert: "Odziedziczyliśmy Burgundię i musimy zdecydować, jakie będą relacje między Burgundią a Cesarstwem i jak radzić sobie z Francuzami."
 incident_burgundian_succ_emp_member_alert: "Cesarz odziedziczył Burgundię i musi zdecydować o przyszłych relacjach Burgundii z Cesarstwem oraz sposobie rozwiązania kwestii francuskiej."
 incident_burgundian_succ_strong_ally_emperor_alert: "Państwo [BUR.Overlord.GetName] odziedziczyło Burgundię, pozostawiając Niderlandy w obcych rękach."
 incident_burgundian_succ_strong_ally_member_alert: "Państwo [BUR.Overlord.GetName] odziedziczyło Burgundię, pozostawiając Niderlandy w obcych rękach."
 incident_burgundian_succ_alone_emperor_alert: "Burgundia sprzeciwiła się tradycji i posadziła na tronie kobietę. Musimy położyć kres jej rządom i przywrócić Niderlandy Świętemu Cesarstwu Rzymskiemu."
 incident_burgundian_succ_alone_member_alert: "Burgundia sprzeciwiła się tradycji i posadziła na tronie kobietę. [Emperor.Monarch.GetTitle] musi położyć kres jej rządom i przywrócić Niderlandy Świętemu Cesarstwu Rzymskiemu."
 incident_burgundy_wants_to_join_emperor_alert: "[BUR.Monarch.GetTitle] z [BUR.GetAdjective] chce dołączyć do Świętego Cesarstwa Rzymskiego."
 incident_burgundy_wants_to_join_member_alert: "[BUR.Monarch.GetTitle] z [BUR.GetAdjective] chce dołączyć do Świętego Cesarstwa Rzymskiego."
 incident_burgundy_wants_to_join: "Burgundia i Cesarstwo"
 elections.721.dc: "$MONARCH$ niestety umiera, co zmusza nas do przeprowadzenia przedterminowych wyborów. Zarówno militaryści jak i teokraci wysunęli swoich kandydatów."
 elections.721.de: "$MONARCH$ niestety umiera, co zmusza nas do przeprowadzenia przedterminowych wyborów. Rewolucjoniści wysunęli kandydata jakobinów i żyrondystów, a monarchiści kandydata królewskiego."
 elections.720.e: "Kandydat militarystów."
 elections.720.f: "Kandydat teokratów."
 elections.720.g: "Kandydat jakobinów."
 elections.720.h: "Kandydat żyrondystów."
 elections.720.dc: "Wzrost znaczenia władz świeckich w naszym państwie zmusił $MONARCH$ do rozpoczęcia wyboru nowego [Root.Monarch.GetTitle]. Kandydatów wystawili zarówno militaryści, jak i teokraci."
 elections.720.de: "Kadencja $MONARCH$ dobiegła końca i nadszedł czas wyboru nowego [Root.Monarch.GetTitle]. Rewolucjoniści wystawili kandydatów jakobińskiego i żyrondystycznego, a monarchiści – kandydata królewskiego."
 pirates.23.t: "Piraci z Penzance"
 pirates.23.d: "Odkąd uzyskaliśmy autonomię od Królestwa Anglii, korsarstwo stało się ogromnym źródłem dochodów mieszkańców naszego [Root.GovernmentName]. Penzance stało się portem przynoszącym wielkie fortuny zarówno przemytnikom, jak i korsarzom. Nasze wyczyny na Morzu Północnym i w Kanale La Manche przeszły do legendy – nikt nie odważa się żeglować po tych wodach bez eskorty, obawiając się gniewu Kornwalijczyków.\n\nWpływy tych ludzi o podłej reputacji w naszym państwie stają się jednak powodem do niepokoju. Niedawno grupa potężnych kapitanów wraz ze swoimi załogami wkroczyła do [Root.Capital.GetCapitalName] i zagroziła obaleniem [Root.Monarch.GetTitle] oraz przejęciem kontroli nad [Root.GetAdjective] [Root.GovernmentName]."
 pirates.23.a: "Czas opuścić okręt."
 pirates.23.b: "Nie zostaniemy niewolnikami złodziei i rabusiów!"
 pirates.24.t: "Admirał doskonały"
 pirates.24.d: "Niedawno do Penzance przybył obiecujący kapitan, który natychmiast zaczął z dumą opowiadać o swoich wyczynach na całym świecie. Twierdzi, że jest nie tylko wielkim admirałem, lecz także wzorem nowoczesnego generała. Co więcej, podróże zapewniły mu szczegółową wiedzę na każdy temat – od roślinności i hodowli zwierząt po geologię. Spotykał królów i cesarzy, a także osobiście uczestniczył we wszystkich najważniejszych bitwach ostatniego stulecia. Utrzymuje również, że jest ekspertem w dziedzinie matematyki, choć nie wiemy, jakie korzyści może to przynieść korsarzowi. Wielu wątpi w prawdziwość jego opowieści, lecz przedstawił je z takim wdziękiem, że nie potrafimy oprzeć się urokowi tego osobliwego człowieka."
 pirates.24.a: "Mógłby doradzać [Root.Monarch.GetTitle]."
 pirates.24.b: "Powinien zostać [Root.Monarch.GetTitle]!"
 flavor_koi.1.t: "Królestwo Mann"
 flavor_koi.1.d: "Mimo niewielkich rozmiarów w porównaniu z innymi królestwami brytyjskimi Mann od dawna jest uznawane za królestwo samo w sobie. Mamy własny ród królewski, kulturę i język, a sposób życia Manxów jest naprawdę wyjątkowy na całym archipelagu. Teraz, gdy uwolniliśmy się spod obcych wpływów, możemy ponownie przyjąć tytuły królów i królowych Mann!"
 flavor_koi.1.a: "Być może pewnego dnia zostaniemy cesarzami Mann..."
 flavor_nol.1.t: "Król na północy!"
 flavor_nol.1.d: "W dawnych czasach Anglii Północ była domem wielu wielkich i potężnych królestw. Dawni królowie Nortumbrii władali ziemiami rozciągającymi się od Edynburga aż na południe od rzeki Humber. Niedługo później nordyccy najeźdźcy osiedlili się w Yorku i na gruzach naszego upadłego królestwa utworzyli własne północne państwo, które nazwali Jorvik. Wreszcie, po wielu latach panowania Normanów, Nordyków i południowców, Northumberland znów jest wolne i możemy koronować się na królów i królowe Północy!"
 flavor_nol.1.a: "Król na północy!"
 flavor_nol.2.t: "Wybór kandydata z Północy"
 flavor_nol.2.d: "[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] dobrze służył Północy, lecz w miarę jak stajemy się coraz bardziej autonomicznym państwem, rośnie potrzeba znalezienia prawowitego pretendenta do dawnego Królestwa Nortumbrii. Musimy wybrać odpowiedniego następcę, jeśli chcemy umocnić naszą władzę w regionie."
 flavor_nol.2.a: "Potrzebujemy przedstawiciela rodu Percy."
 flavor_nol.2.b: "Północ pamięta ród Yorków."
 flavor_nol.2.c: "Lancasterowie przesyłają pozdrowienia."
 flavor_nol.2.e: "Ten możny twierdzi, że jest potomkiem Halfdana Ragnarssona!"
 flavor_nol.2.f: "[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] pozostanie na tronie."
 flavor_nol.3.t: "Nordyckie roszczenia"
 flavor_nol.3.d: "Posiadłości Ragnara Lodbroka i jego potomków rozciągały się na całych Wyspach Brytyjskich i w Skandynawii. [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] twierdzi, że jest bezpośrednim potomkiem tego wikińskiego najeźdźcy, i z tego tytułu zgłasza roszczenia do Królestwa Norwegii, uznając je za prawowitą część [Root.Monarch.GetHerHis] północnego królestwa. Wielu kwestionuje nordyckie pochodzenie [Root.Monarch.GetName], lecz możni naszego państwa popierają [Root.Monarch.GetHerHis] roszczenia, a ich aprobata wystarczy nam, by dochodzić praw do Norwegii."
 flavor_nol.3.a: "To zaczyna wyglądać znajomo..."
 flavor_nol.3.b: "Rządy [Root.Monarch.GetName] już budzą wątpliwości. Nie zaostrzajmy sytuacji."
 flavor_eng.99.t: "Żołnierki w spódnicach"
 flavor_eng.99.d: "Na kilka lat przed rewolucją dawny rząd uchwalił „Wielką ustawę reformującą”, która przyznawała prawo głosu wyłącznie mężczyznom, jawnie podważając prawa szlachcianek posiadających ziemię. Pod przewodnictwem oburzonych dam z wyższych sfer podczas rewolucji na ulice wyszły kobiety zarówno biedne, jak i bogate. Maszerowały razem w nowo utworzonym Rewolucyjnym Pułku Kobiet państwa [Root.GetAdjective]. Ich bojowy okrzyk „równe prawa wyborcze dla kobiet, równym krokiem naprzód!” rozbrzmiewał triumfalnie na ulicach [Root.Capital.GetCapitalName], gdy nasze siły doszczętnie rozbiły dawny rząd. Nawet najbardziej konserwatywni członkowie Rady Rewolucyjnej nie mogą zaprzeczyć, jak ważną rolę odegrały te kobiety w zapewnieniu nam władzy nad Wyspami ani jak bardzo ich liberalny duch wpłynął na naszą tożsamość narodową.\n\nChoć nie obiecaliśmy wprost rozszerzenia praw wyborczych na kobiety, ich kluczowy wkład w wyzwolenie nas z okowów przeszłości skłania wielu członków Rady Rewolucyjnej do spełnienia żądań tych odważnych dam, a nawet do przyznania kobietom prawa do sprawowania urzędów politycznych na równi z mężczyznami."
 flavor_eng.99.a: "Wprowadźmy reformy! Wnuczki naszych córek będą nas uwielbiać!"
 flavor_eng.99.b: "Katastrofa! Anarchia! Krótko mówiąc, mamy potworny bałagan!"
 sister_suffragettes: "Prawo głosu dla kobiet"
 desc_sister_suffragettes: "Nasze państwo wprowadziło równość głosu dla mężczyzn i kobiet. Brawa dla naszych sufrażystek!"
 colonial_boom: "Boom kolonialny"
 desc_colonial_boom: "Ludzie tłumnie przybywają do tej kolonii w poszukiwaniu lepszego życia."
 baby_boomers: "Wyż demograficzny!"
 desc_baby_boomers: "W tej prowincji nastąpił gwałtowny wzrost liczby urodzeń, przyczyniając się do jej rozwoju."
 enforcing_unity: "Wymuszona jedność"
 desc_enforcing_unity: "Właściciel tej prowincji siłą szerzy wśród jej mieszkańców pokojowe wartości swojej religii!"
 sexist_revolution: "Mizoginiczna administracja"
 desc_sexist_revolution: "Kobiety mieszkające w tym państwie czują się zdradzone przez swój rząd."
 shinto_events.59.t: "Nowa tradycja"
 shinto_events.59.d: "Wielu naszych urzędników wyznaje filozofię konfucjańską, a jej wpływy szybko przenikają do administracji państwowej. Choć shintō nadal jest szeroko praktykowane wśród urzędników, coraz więcej osób uważa, że religia jest sprawą prywatną, o której powinien decydować każdy człowiek, a nie państwo. Jeśli całkowicie porzucimy nasze tradycje i przyjmiemy konfucjanizm jako filozofię państwową, możemy zapewnić pokój i harmonię wyznawcom wszystkich religii zamieszkującym ziemie państwa [Root.GetAdjective]."
 become_kirishitan_daimyo_title: "Kwestia kirishitan"
 become_kirishitan_daimyo_desc: "Od przybycia do naszych portów misjonarzy z Europy i rozpoczęcia przez nich handlu z naszym ludem minęło już trochę czasu. Nie jest tajemnicą, że przywódca naszego klanu darzy kirishitan sympatią. Czy nadszedł jednak czas, by porzucić kami na rzecz Chrystusa i Najświętszej Maryi Panny?"
 become_ikko_ikki_daimyo_title: "Boski wiatr"
 become_ikko_ikki_daimyo_desc: "Nasz władca zawsze darzył sympatią ruch Ikkō-ikki i jego buddyjską wiarę. Choć wielu mieszkańców Japonii wyznaje jednocześnie buddyzm i shintō, być może nadszedł czas, by porzucić dawne obyczaje i przyjąć buddyzm Jōdo Shinshū."
 become_confucian_daimyo_title: "Wprowadź konfucjańską administrację"
 become_confucian_daimyo_desc: "Konfucjanizm ma tak duże wpływy w naszym daimyo, że instytucje religijne zaczynają stawać się zbędne. Może jeżeli w pełni przyjmiemy nauki Konfucjusza, uda nam się stworzyć bardziej pokojowe i harmonijne państwo."
 DAL: "Dalmacja"
 DAL_ADJ: "Dalmacji"
 dalmatian: "dalmatyńska"
 dalmatian_nation_title: "Ponowne zjednoczenie Królestwa Dalmacji"
 dalmatian_nation_desc: "Kiedy inne państwa Federacji Dalmacji zawarły układ z Republiką Wenecką, nasz lud uznał, że nie może podążyć ich śladem i popaść w zależność od obcego państwa. Teraz, kiedy udało nam się odzyskać większość terenów dawnego Królestwa, uważamy, że moglibyśmy wyjść z izolacji oraz ponownie zjednoczyć Federację Dalmacji w jedno państwo, wolne od obcych wpływów."
 incident_hansa: "Schyłek Ligi Hanzeatyckiej"
 incident_hansa_member_alert: "Liga Hanzeatycka niegdyś rządziła światowym handlem od Londynu do Nowogrodu Wielkiego. Los jednak sprawił, że Liga osłabła. Teraz Liga desperacko szuka pomocy ze strony Świętego Cesarza Rzymskiego."
 incident_hansa_emperor_alert: "Liga Hanzeatycka niegdyś rządziła światowym handlem od Londynu do Nowogrodu Wielkiego. Los jednak sprawił, że Liga osłabła. Teraz Liga desperacko szuka pomocy ze strony Świętego Cesarza Rzymskiego."
 incident_pu_subject_joins_empire: "Wniosek o przyjęcie do Cesarstwa"
 incident_pu_subject_joins_empire_member_alert: "Rozszerzanie granic Świętego Cesarstwa Rzymskiego zdarza się niezwykle rzadko, lecz nic w prawie cesarskim nie wydaje się tego zabraniać. Państwo [current_pu_incident_target.Overlord.GetName] zwróciło się do cesarza z wnioskiem o przyjęcie do Cesarstwa państwa [current_pu_incident_target.GetName], nad którym sprawuje władzę w ramach unii personalnej."
 incident_pu_subject_joins_empire_emperor_alert: "Rozszerzanie granic Świętego Cesarstwa Rzymskiego zdarza się niezwykle rzadko, lecz nic w prawie cesarskim nie wydaje się tego zabraniać. Państwo [current_pu_incident_target.Overlord.GetName] zwróciło się do cesarza z wnioskiem o przyjęcie do Cesarstwa państwa [current_pu_incident_target.GetName], nad którym sprawuje władzę w ramach unii personalnej."
 petitioned_for_hre_membership: "Złożono wniosek o przyjęcie do Cesarstwa"
 no_petition_for_hre_membership: "Nie złożono wniosku o przyjęcie do Cesarstwa"
 opinion_added_pu_subject_hre: "Włączenie naszego państwa podległego do Cesarstwa"
 opinion_denied_pu_subject_hre: "Odmowa włączenia naszego państwa podległego do Cesarstwa"
 mercs_not_allowed_to_loot_morale: "Ograniczone plądrowanie"
 desc_mercs_not_allowed_to_loot_morale: "Zatrudnione przez nas kompanie najemników otrzymały zakaz bezmyślnego plądrowania ziem, przez które maszerują."
 cb_change_government_great_peasants_war: "Zmiażdżenie chłopstwa"
 cb_change_government_great_peasants_war_desc: "Zwykli chłopi nie mają prawa kierować państwem. Muszą wrócić na swoje miejsce, zmuszeni do tego siłą."
 gpw_cb_tt: "Członkowie Cesarstwa zyskują casus belli §Yzmiażdzenie chłopstwa§! do końca gry."
 gpw_noble_power_weak: "Klasy szlacheckie w całym Cesarstwie zyskają §G+5%§! lojalności i §Y+5%§! wpływów do końca gry."
 gpw_noble_power_strong: "Klasy szlacheckie w całym Cesarstwie zyskają §G+10%§! lojalności i §Y+10%§! wpływów do końca gry."
 gpw_peasant_power_strong: "Klasy szlacheckie w całym Cesarstwie zyskają §R-10%§! lojalności i §Y-10%§! wpływów do końca gry."
 gpw_peasant_power_weak: "Klasy szlacheckie w całym Cesarstwie zyskają §R-5%§! lojalności i §Y-5%§! wpływów do końca gry."
 great_peasants_war_concessions_triggered_modifier: "Ustępstwa dla chłopstwa"
 desc_great_peasants_war_concessions_triggered_modifier: "Wielka Wojna Chłopska zmusiła Cesarstwo do ponownego rozważenia praw chłopów. Przyznano szereg koncesji i zagwarantowano przywileje, co doprowadziło do zmniejszenia możliwości wyzyskiwania ich pracy."
 gpw_concessions_triggered_modifier_tt: "Modyfikator §Y'ustępstwa dla chłopstwa'§! jest aktywny, co daje modyfikator podatków państwowych §R-5%§! wszystkim członkom Cesarstwa, którzy nie są Republikami Chłopskimi."
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_WIN_MINOR_INFLUENCE: "Ograniczone prawa chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_WIN_MINOR_LOYALTY: "Zniesione prawa chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_WIN_MAJOR_INFLUENCE: "Ograniczone prawa chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_WIN_MAJOR_LOYALTY: "Zniesione prawa chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_LOSE_MINOR_INFLUENCE: "Gwarantowane prawa chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_LOSE_MINOR_LOYALTY: "Gwarantowane prawa chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_LOSE_MAJOR_INFLUENCE: "Przyznane przywileje chłopskie: §Y$VAL$%§!"
 EST_VAL_GREAT_PEASANTS_WAR_NOBLES_LOSE_MAJOR_LOYALTY: "Przyznane przywileje chłopskie: §Y$VAL$%§!"
 incident_great_peasants_war: "Los chłopów"
 incident_great_peasants_war_member_alert: "Gwałtowny konflikt między chłopstwem a władzą szaleje od dziesięcioleci w Świętym Cesarstwie Rzymskim. Nadszedł czas, aby cesarz wymusił zdecydowane i ostateczne rozwiązanie: chronić prawa chłopów lub narzucić kontrolę szlachty."
 incident_great_peasants_war_emperor_alert: "Gwałtowny konflikt między chłopstwem a władzą szaleje od dziesięcioleci w Świętym Cesarstwie Rzymskim. Nadszedł czas, aby cesarz wymusił zdecydowane i ostateczne rozwiązanie: chronić prawa chłopów lub narzucić kontrolę szlachty."
 incident_shadow_kingdom: "Królestwo cieni"
 incident_shadow_kingdom_member_alert: "Pomimo że Królestwo Włoch formalnie wciąż stanowi część Świętego Cesarstwa Rzymskiego, na swój sposób stało się 'Królestwem cieni' z włoskimi państwami działającymi niezależnie od Cesarza. Niepowodzenie przywrócenia zwierzchnictwa w tym regionie przez kolejnych Cesarzy doprowadziło do przejęcia wielu terenów przez państwa wprost sprzeciwiające się autorytetowi Cesarstwa.\nObecnie wiele z włoskich państw zadaje sobie pytanie, dlaczego powinny przyznawać Cesarzowi jakikolwiek autorytet na swoich ziemiach."
 incident_shadow_kingdom_emperor_alert: "Pomimo że Królestwo Włoch formalnie wciąż stanowi część Świętego Cesarstwa Rzymskiego, na swój sposób stało się 'Królestwem cieni' z włoskimi państwami działającymi niezależnie od Cesarza. Niepowodzenie przywrócenia zwierzchnictwa w tym regionie przez kolejnych Cesarzy doprowadziło do przejęcia wielu terenów przez państwa wprost sprzeciwiające się autorytetowi Cesarstwa.\nObecnie wiele z włoskich państw zadaje sobie pytanie, dlaczego powinny przyznawać Cesarzowi jakikolwiek autorytet na swoich ziemiach."
 incident_dutch_revolt: "Powstanie holenderskie"
 incident_dutch_revolt_member_alert: "Powstanie holenderskie przerodziło się w kryzys międzynarodowy, daleko wykraczający poza lokalne niepokoje. Kolejne państwa wysyłają swoje armie, by wesprzeć obie strony konfliktu. Nowo ogłoszona Republika Holenderska leży w granicach Cesarstwa, dlatego niektórzy twierdzą, że cesarz ma obowiązek objąć to młode państwo ochroną. Zaangażowanie Cesarstwa, niezależnie od jego formy, na zawsze odmieni losy Niderlandów."
 incident_dutch_revolt_emperor_alert: "Powstanie holenderskie przerodziło się w kryzys międzynarodowy, daleko wykraczający poza lokalne niepokoje. Kolejne państwa wysyłają swoje armie, by wesprzeć obie strony konfliktu. Nowo ogłoszona Republika Holenderska leży w granicach Cesarstwa, dlatego niektórzy twierdzą, że cesarz ma obowiązek objąć to młode państwo ochroną. Zaangażowanie Cesarstwa, niezależnie od jego formy, na zawsze odmieni losy Niderlandów."
 shadow_kingdom.5.a: "Cesarz musi podjąć decyzję. Przywołać zgromadzenie!"
 shadow_kingdom.3.b: "Włochy powróciły do wspólnoty. Niech żyje Cesarstwo!"
 shadow_kingdom.3.d2: "Zgodnie z obietnicą, Cesarstwo podporządkowało włoskich książąt i zapewniło im miejsce w Świętym Cesarstwie Rzymskim. Dzięki temu wyczynowi geniuszu dyplomatycznego i wojskowego całe chrześcijaństwo wie teraz, jak bezcelowe jest przeciwstawianie się rządom cesarskim."
 province_has_current_tech_fort_trigger_tt: "§YProwincja§! ma najwyższy poziom Fortu możliwy przy obecnym poziomie technologii."
 swi_won_condottiere_war_tt: "Wynajmij §Ykondotierów§! państwu i pomóż mu wygrać wojnę."
 fra_hyw_tt: "Żadna prowincja w regionie §YFrancji§!, z wyjątkiem §Y[87.GetName]§!, nie należy do §YAnglii§! ani §YWielkiej Brytanii§!."
 horde_barbaric_despoilers_reform: "Barbarzyńscy łupieżcy"
 horde_barbaric_despoilers_reform_desc: "Podczas wojny nic nie jest naprawdę święte. Walka oznacza życie, a najsilniejsi powinni zagarniać wszystko, czego zapragną."
 horde_tribal_unity_reform: "Zjednoczona tożsamość ordy"
 horde_tribal_unity_reform_desc: "W imię ordy musimy odłożyć na bok dawne lojalności plemienne. Jesteśmy jednym ludem pod wodzą jednego chana."
 army_professionalism_events.1.d2: "Splądrujmy skarbiec Kurii!"
 army_professionalism_events.3.d2: "Gdy miasto [Root.GetCapitalName] wpadło w ręce wroga, nacierające wojska państwa [From.GetAdjective] przez kilka dni plądrowały jego ulice. W obrębie murów pozostały jedynie tlące się ruiny niegdyś tętniącego życiem miasta, a ocalali szukają schronienia jak najdalej stąd. Co gorsza, bezbożni najeźdźcy splądrowali skarbiec Kurii, grabiąc skarby samego Boga."
 army_professionalism_events.3.b: "Wszystko to za trzydzieści srebrników."
 mercs.7.t: "Wysoki popyt na kompanię [popular_mercs.GetName]"
 mercs.7.d: "W miarę jak konflikty pustoszą naszą część świata, zapotrzebowanie na usługi kompanii najemników gwałtownie rośnie. Kompania [popular_mercs.GetName] odkryła, że jej szczególne umiejętności doskonale odpowiadają obecnej sytuacji, i zawarła kontrakty z kilkoma walczącymi państwami.\n\nGdy żołnierze kompanii [popular_mercs.GetName] wracają do ojczyzny, państwa [popular_mercs_origin.GetName], przywożą łupy wojenne – zarówno żołd otrzymany na mocy kontraktu, jak i bogactwa zdobyte podczas kampanii. Ten napływ pieniędzy pobudza lokalną gospodarkę i zachęca kolejnych ludzi do wstępowania w szeregi kompanii [popular_mercs.GetName]."
 mercs.7.a: "Zachęćmy do zaciągu w państwie [popular_mercs_origin.GetName]."
 mercs.7.b: "Pozwólmy bogactwu swobodnie płynąć."
 popular_mercs_prosperity: "Najemnicy przynoszą dobrobyt"
 desc_popular_mercs_prosperity: "Żołnierze najemni stacjonujący w tej prowincji przywożą łupy wojenne, pobudzając lokalną gospodarkę."
 mercs.8.t: "[long_time_hires.Leader.GetName] z kompanii [long_time_hires.GetName]"
 mercs.8.d: "Kapitan [long_time_hires.Leader.GetName] z kompanii [long_time_hires.GetName], zadowolony z terminowych płatności i uprzejmych relacji z nami, zaoferował swoje usługi. [long_time_hires.Leader.GetSheHeCap] pragnie zostać generałem w służbie armii państwa [Root.GetAdjective], na stałe udostępniając nam [long_time_hires.Leader.GetHerHis] bogate doświadczenie taktyczne."
 mercs.8.a: "Będzie cennym nabytkiem w naszych szeregach."
 mercs.8.b: "Dziękujemy, ale nie skorzystamy."
 mercs.9.t: "Wojna się zmieniła"
 mercs.9.d: "Upowszechnienie broni palnej radykalnie zmieniło oblicze wojny w Europie. Powstało wiele nowych kompanii najemników uzbrojonych w nowoczesną broń i stosujących współczesne taktyki. Inne nie zdołały się przystosować i straciły znaczenie w nowej epoce zaawansowanej sztuki wojennej."
 mercs.9.a: "Stare ustępuje miejsca nowemu."
 new_mercs_europe_tt: "§YHeskie Korpusy Jegrów staną się dostępne do wynajęcia§!\n§YGwardia Szkocka stanie się dostępna do wynajęcia§!\n§YSeimeni staną się dostępni do wynajęcia§!\n§YCzarna Gwardia przestanie być dostępna do wynajęcia§!\n§YBande Nere przestanie być dostępna do wynajęcia§!\n§YGallowglassowie przestaną być dostępni do wynajęcia§!\n§YCzerwone Czupryny przestaną być dostępne do wynajęcia§!"
 mercs.10.t: "Zapał religijny najemników"
 mercs.10.d: "Kompania [pious_mercs.GetName] traktuje swoją wiarę [Root.Religion.GetName] niezwykle poważnie, przynajmniej jak na najemników. Pokrzepieni słusznością naszej sprawy żołnierze kompanii są pełni zapału, przygotowując się do walki z bezbożnym państwem [pious_mercs_enemy.GetName]."
 mercs.10.a: "Nasza sprawa jest słuszna!"
 pious_mercenaries: "Zapał religijny najemników"
 desc_pious_mercenaries: "Zatrudnione przez nas kompanie najemników są pełne religijnego zapału, gdy walczymy z wrogami naszej wiary."
 veteran_mercs_modifier: "Weterani wśród najemników"
 desc_veteran_mercs_modifier: "Nasze honorowe praktyki zachęcają weteranów do wstępowania do służących nam kompanii najemników."
 mercs.11.t: "Opóźnione wypłaty"
 mercs.11.d: "Kompania [unpaid_mercs.GetName] skarży się, że nie otrzymała pełnego żołdu uzgodnionego za swoje usługi. Jej kapitan, [unpaid_mercs.Leader.GetName], oskarża nas o korupcję i niehonorowe postępowanie oraz grozi, że wyprowadzi swoich ludzi, jeśli nie otrzymają zapłaty. Nie zamierza narażać [unpaid_mercs.Leader.GetHerHis] żołnierzy na dalszą służbę bez wynagrodzenia."
 mercs.11.a: "W końcu im zapłacimy."
 mercs.11.b: "To zwykły błąd w dokumentacji, mamy pieniądze."
 mercs.11.c: "Mogą przyjąć to, co im dajemy, albo odejść."
 delayed_payments: "Opóźnione wypłaty"
 desc_delayed_payments: "Zatrudnione przez nas kompanie najemników otrzymują żołd z opóźnieniem, co sprzyja dezercjom w ich szeregach."
 revolutionary_republic_factions.1.a2: "Kult Rozumu poprowadzi nas ku przyszłości."
 revolutionary_republic_factions.1.b2: "Chwała naszemu boskiemu [Root.Monarch.GetTitle]!"
 revolutionary_republic_factions.7.d2: "Obalenie starego porządku przyniosło masom bezprecedensową sprawiedliwość i równość, a także znaczne bogactwa w skarbcu państwa. Oznaczało jednak również utratę doświadczonych administratorów, biurokratów i duchownych. Wielu przedstawicieli niższej szlachty, dawnego kleru i innych uprzywilejowanych warstw wycofało się z życia publicznego i opuszcza kraj w obawie o własne życie.\nPozostaliśmy z państwem, którym trzeba zarządzać na większą skalę, lecz mamy mniej ludzi z odpowiednim doświadczeniem. Zasada merytokracji, którą kierujemy się w rządzeniu, pozwoli nam znaleźć zdolnych obywateli na ich miejsce, ale na razie znaleźliśmy się w trudnej sytuacji."
 revolutionary_republic_factions.9.d2: "Bojąc się wpływu krypto-monarchistów i kontrrewolucjonistów wśród rządzących elit, ludność miasta [Root.Capital.GetCapitalName] wyszła na ulice, by bronić ducha rewolucji. Każdy związany ze starym ładem, od kapłanów rozprzestrzeniających [Root.Owner.Religion.GetName] po członków niższej arystokracji, a nawet uwięzionych za zbrodnie przeciwko państwu stał się celem. Radykałowie, którzy dokładają wszelkich starań, aby rozpalić serca i umysły mas. \nStawia to rząd w dość delikatnej sytuacji. Niektórzy z osób będących celem są członkami naszych własnych szeregów, a to sprawia, że taka niekontrolowana rzeź tylko obrazuje nas jako słabych i szkodzi dobrobytowi naszego niegdyś pięknego miasta. Jeśli jednak przestaniemy, wszystko będzie trafiać w ręce radykałów..."
 napoleon.1.t: "[Root.Monarch.GetTitle] na polu bitwy"
 napoleon.1.d: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] cieszy się ogromną sławą wojskową. Mówi się, że sama [Root.Monarch.GetHerHisCap] obecność jest warta czterdziestu tysięcy żołnierzy, wzbudzając w oficerach i zwykłych szeregowcach niezachwianą wiarę w nadchodzące zwycięstwo. [Root.Monarch.GetTitle] spogląda na pole bitwy i przygotowuje się do wydania rozkazu, który odbije się echem w całym państwie [Root.GetName]..."
 napoleon.1.a: "Ostrzał artyleryjski! Zburzyć mury!"
 napoleon.1.b: "Marsz! Maszerować, aż padniecie!"
 napoleon.1.c: "Do szarży! Nie zostawiać nikogo przy życiu!"
 napoleon.1.da: "Ognia! Zasypać wrogów ołowiem!"
 napoleon_siege: "Ostrzał artyleryjski!"
 desc_napoleon_siege: "Nasz chwalebny cesarz wydał rozkaz: Ognia z artylerii! Zburzyć mury!"
 napoleon_manuever: "Marsz!"
 desc_napoleon_manuever: "Nasz chwalebny cesarz wydał rozkaz: Marsz! Maszerować, aż padniecie!"
