 industrialization: "Uprzemysłowienie"
 desc_industrialization: "Gwałtowne tempo zmian technologicznych zaczyna głęboko wpływać na samą organizację społeczeństwa. Wynalezienie maszyny parowej, wykorzystanie koksu w produkcji żelaza oraz nowe, zmechanizowane urządzenia produkcyjne umożliwiają osiąganie niespotykanych wcześniej korzyści skali, znacznie zwiększając wydajność pracy. Kolejne wynalazki ułatwiają transport dużych ilości towarów. W warunkach bezprecedensowej integracji światowego handlu fabryki mogą pozyskiwać surowce i sprzedawać gotowe wyroby na rynkach całego świata, przynosząc właścicielom niewyobrażalne bogactwa.\n\nRównież rolnictwo korzysta z nowych praktyk, takich jak płodozmian i grodzenie pól, które zwiększają wydajność produkcji. Do uprawy tej samej powierzchni ziemi potrzeba dzięki temu mniej pracowników, co skłania wielu ludzi do opuszczania domów i osiedlania się w rozwijających się miastach przemysłowych. Rodzi się nowy świat, w którym ambitni i bogaci będą dominować nad społeczeństwem bardziej niż kiedykolwiek wcześniej."
 industrialization_date: "1750"
