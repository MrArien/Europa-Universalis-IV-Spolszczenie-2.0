 napoleon.2.t: "Propaganda cesarska"
 napoleon.2.d: "W państwie [Root.GetName] nasz chwalebny [Root.Monarch.GetTitle] sprawuje absolutną władzę, lecz państwo może przetrwać jedynie dzięki poparciu ludu. Musimy zadbać, by lud darzył [Root.Monarch.GetTitle] żarliwym uwielbieniem, niemal graniczącym z kultem, dlatego powinniśmy rozpowszechniać propagandę budującą wizerunek monarchy. Trzeba starannie przemyśleć sposób przedstawiania [Root.Monarch.GetTitle], podkreślając wyłącznie te aspekty [Root.Monarch.GetHerHis] rządów, które lud może dostrzec w praktyce."
 napoleon.2.a: "Przedstawiajmy [Root.Monarch.GetTitle] jako prawodawcę."
 napoleon.2.b: "Przedstawiajmy [Root.Monarch.GetTitle] jako orędownika pokoju."
 napoleon.2.c: "Przedstawiajmy [Root.Monarch.GetTitle] jako bohatera wojennego."
 napoleon.2.da: "Przedstawiajmy [Root.Monarch.GetTitle] jako boskiego proroka."
 napoleon.2.e: "Podkreślajmy [Root.Monarch.GetHerHis]... miłość do małych zwierząt?"
 napoleon_lawbringer: "Propaganda cesarska: prawodawca"
 desc_napoleon_lawbringer: "Publikujemy propagandę przedstawiającą cesarza jako prawodawcę."
 napoleon_peacebringer: "Propaganda cesarska: krzewiciel pokoju"
 desc_napoleon_peacebringer: "Publikujemy propagandę przedstawiającą cesarza jako orędownika pokoju."
 napoleon_inspirational_general: "Propaganda cesarska: bohaterstwo wojenne"
 desc_napoleon_inspirational_general: "Publikujemy propagandę przedstawiającą cesarza jako bohatera wojennego."
 napoleon_prophet: "Propaganda cesarska: prorok"
 desc_napoleon_prophet: "Publikujemy propagandę przedstawiającą cesarza jako boskiego proroka."
 roman_garisson: "Wzmocniony garnizon rzymski"
 desc_roman_garisson: "Po złupieniu Rzymu wzmocniliśmy tamtejszy garnizon, aby zapobiec powtórzeniu się tej tragedii."
 cardinal_nephew_tt: "§YPaństwo [cardinal_nephew_country.GetName] otrzyma wydarzenie.§!"
 adm_vatican_library_tt: "§YWatykańska Biblioteka – wydanie administracyjne§! zostanie utworzona w prowincji §Y[118.GetName]§!, zapewniając następujące efekty:\nKoszt technologii administracyjnej: §G-5%§!\nNiepokoje narodowe: §G-2§!"
 dip_vatican_library_tt: "§YWatykańska Biblioteka – wydanie dyplomatyczne§! zostanie utworzona w prowincji §Y[118.GetName]§!, zapewniając następujące efekty:\nKoszt technologii dyplomatycznej: §G-5%§!\nReputacja dyplomatyczna: §G+1§!"
 mil_vatican_library_tt: "§YWatykańska Biblioteka – wydanie wojskowe§! zostanie utworzona w prowincji §Y[118.GetName]§!, zapewniając następujące efekty:\nKoszt technologii wojskowej: §G-5%§!\nTradycja armii z bitew: §G+50%§!"
 fra_pro_tt: "Co najmniej §Y3§! prowincje na obszarze §YProwansji§! należą do państwa §Y[Root.GetName]§! lub jego poddanych nieposiadających suwerenności."
 center_of_revolution.13.t: "Marzenia o wolności"
 center_of_revolution.13.d: "Wieści o rewolucji w państwie [revolution_target.GetName] dotarły do kolonii Nowego Świata. Płomienna retoryka wolności rozpala serca mieszkańców, którzy zaczynają marzyć o niepodległości swoich kolonii.\n\nTen buntowniczy duch z pewnością osłabłby, gdybyśmy zdołali położyć kres podstępnej rewolucji, która szerzy swoją propagandę ze stolicy [revolution_target.Capital.GetCapitalName]."
 center_of_revolution.13.a: "Musimy zdławić tę rewolucję."
 center_of_revolution.14.t: "Stłumione marzenia o wolności"
 center_of_revolution.14.d: "Duch buntu ogarniający Nowy Świat osłabł po druzgocącej klęsce rewolucji w Starym Świecie. Strumień propagandy ustał, a podżegacze mają trudności z przekonaniem mieszkańców kolonii do podążania za ich skazanymi na porażkę marzeniami o niepodległości."
 center_of_revolution.14.a: "Koloniści powinni znać swoje miejsce."
 colony_inspired_by_revolution: "Marzenia o wolności"
 desc_colony_inspired_by_revolution: "Zainspirowane rewolucją w Starym Świecie ruchy w koloniach dążą do własnej wolności."
