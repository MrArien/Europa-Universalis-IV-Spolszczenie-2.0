 westphalia_peace_reward2_tt: "Jeśli oficjalną religią Świętego Cesarstwa Rzymskiego będzie §Y[Root.Religion.GetName]§!:"
 legislative_sejm: "Sejm ustawodawczy"
 legislative_sejm_desc: "Przyznając Sejmowi większe uprawnienia ustawodawcze, zapewniamy, że do grona kandydatów do tronu będą wybierane wyłącznie najlepsze osoby z naszego państwa."
 integrated_sejmiks: "Włączenie sejmików"
 integrated_sejmiks_desc: "Sejmiki to lokalne zgromadzenia parlamentarne zarządzające poszczególnymi regionami naszego państwa. Włączając je do struktur rządowych, zapewnimy, że mieszkańcy wszystkich kultur będą odpowiednio reprezentowani w Sejmie."
 penal_colonies_reform: "Kolonie karne"
 penal_colonies_reform_desc: "Nowy Świat jest miejscem wielkich możliwości, a dla nas jest to okazja do założenia kolonii karnych i pozbycia się skazańców i mniejszości z naszego narodu. Pozwalając kompaniom kolonialnym ubiegać się o zwierzchnictwo nad naszymi niepożądanymi obywatelami, stworzymy harmonię w Starym Świecie i rozszerzymy nasze wpływy w Nowym Świecie."
 john_calvin_modifier: "Przywódca duchowy"
 desc_john_calvin_modifier: "Jan Kalwin pełni w tym państwie funkcję przywódcy duchowego."
 mercenary_monopoly_modifier: "Monopol najemniczy"
 desc_mercenary_monopoly_modifier: "To państwo osiągnęło całkowity monopol na rynku najemników."
