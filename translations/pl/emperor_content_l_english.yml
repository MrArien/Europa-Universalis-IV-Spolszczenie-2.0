 flavor_tus.EVTNAME22: "Papież z państwa [medici_pope_home.GetAdjective]"
 flavor_tus.EVTDESC22: "Intrygi państwa [medici_pope_home.GetName] doprowadziły do wyboru jednego z jego ludzi na papieża. Choć państwo [medici_pope_home.GetName] z pewnością jest zadowolone, niektórzy potępiają awans [Root.Monarch.GetName]a jako przejaw korupcji i dowód na jeszcze głębsze zepsucie Kościoła. Nasz nowy papież obiecał z kolei rządzić... w sposób wyjątkowy."
 flavor_tus.EVTOPTA22: "Habemus Papam!"
 flavor_tus.EVTNAME23: "Mamy papieża!"
 flavor_tus.EVTDESC23: "Po długim i cierpliwym oczekiwaniu nasze intrygi przyniosły skutek: kandydat, którego od dawna przygotowywaliśmy do tej roli, objął urząd papieski jako [PAP.Monarch.GetTitle] [PAP.Monarch.GetName]. Dopóki będzie zasiadał na tronie papieskim, możemy liczyć na bliskie i korzystne stosunki z Kościołem."
 flavor_tus.EVTOPTA23: "Cieszmy się papiestwem!"
 flavor_tus.EVTNAME24: "Śmierć papieża z państwa [medici_pope_home.GetAdjective]"
 flavor_tus.EVTDESC24: "Zmarły papież był postacią kontrowersyjną, a jego odejście zamyka barwny rozdział w historii papiestwa. Stosunki z państwem [medici_pope_home.GetName] powróciły do dawnego stanu i wszystko znów wygląda tak jak wcześniej. Mniej więcej."
 flavor_tus.EVTOPTA24: "Requiescat in pace."
 flavor_tus.EVTNAME25: "Nasz papież nie żyje"
 flavor_tus.EVTDESC25: "Nasze szczególne stosunki z papiestwem dobiegły końca wraz ze śmiercią papieża. Bliskie więzi z miastem [PAP.Capital.GetCapitalName], niezależnie od tego, jak długo trwały, z pewnością były barwne i – miejmy nadzieję – owocne."
 flavor_tus.EVTOPTA25: "Requiescat in pace, Papa."
 emp_lan_next_pope_medici_tt: "Następny wybrany papież będzie utrzymywał szczególne stosunki z naszym państwem."
 opinion_our_pope_on_throne: "Nasz papież zasiada na tronie"
 opinion_pope_tuscan_homeland: "Ojczyzna papieża"
 WORLD_CRUSADE_WAR_NAME: "$ORDER$$ORDER$Wielka Święta Wojna $FIRST$ z państwem $SECOND$"
 cb_world_crusade: "Wielka Święta Wojna"
 cb_world_crusade_desc: "Świat jest bluźnierczy i zepsuty. Musimy oczyścić go z występku i grzechu!"
 flavor_efr.EVTNAME1: "Roszczenia [Root.Monarch.GetName] do Fryzji Wschodniej"
 flavor_efr.EVTDESC1: "Od 1381 roku niepodległość Fryzji Wschodniej była co najmniej wątpliwa. Ocko II, ostatni oficjalny hrabia Fryzji Wschodniej, przekazał swój tytuł hrabiemu Holandii Wilhelmowi V. Gdy zdradziecki Ocko II został siłą odsunięty od władzy przez naszą chłopską milicję w bitwie na Dzikich Polach, Cesarstwo nie uznało statusu [Root.Monarch.GetName]a jako hrabiego Fryzji Wschodniej.\n\n[dutch_east_frisia_claimant.Monarch.GetName], [dutch_east_frisia_claimant.Monarch.GetTitle] państwa [dutch_east_frisia_claimant.GetName], twierdzi, że [Root.Monarch.GetName] jest jedynie chłopem przewodzącym rebelii przeciwko [Root.Monarch.GetHerHis] seniorowi i nie ma prawa rościć sobie suwerenności nad Fryzją Wschodnią. Uzyskanie poparcia cesarza mogłoby wzmocnić nasze roszczenia i powstrzymać państwo [dutch_east_frisia_claimant.GetName]."
 flavor_efr.EVTOPTA1: "Przedstawmy naszą propozycję cesarzowi."
 flavor_efr.EVTOPTB1: "Nie kłaniam się żadnemu cesarzowi."
 flavor_efr.EVTNAME2: "Wschodnia Fryzja chce dołączyć do Cesarstwa"
 flavor_efr.EVTDESC2: "Przybył wysłannik przywódcy chłopów ze Wschodniej Fryzji, prosząc [Root.Monarch.GetRulerGen] o poparcie roszczeń [EFR.Monarch.GetAdjective] do Hrabstwa Wschodniej Fryzji. W zamian za nasze wsparcie [Root.Monarch.GetSheHe] zaoferował[Root.Monarch.GetANoun], że pokłoni się przed cesarzem jako książę Świętego Cesarstwa Rzymskiego.\n\nOficjalnie hrabstwo Fryzji Wschodniej należy do [dutch_east_frisia_claimant.Monarch.GetRulerGen] z Holandii. Święte Cesarstwo Rzymskie nie zajęło oficjalnego stanowiska w tej sprawie, a jedno słowo cesarza może położyć kres temu konfliktowi."
 flavor_efr.EVTOPTA2: "Witamy w Cesarstwie."
 flavor_efr.EVTOPTB2: "Poprzyjmy roszczenia [dutch_east_frisia_claimant.GetAdjective] do Wschodniej Fryzji."
 flavor_efr.EVTNAME3: "Fryzja Wschodnia i Cesarstwo"
 flavor_efr.EVTDESC3.1: "Dzięki aprobacie [From.Monarch.GetName] [Root.Monarch.GetName] nie jest już bezimiennym przywódcą chłopskim. [Root.Monarch.GetSheHeCap] został uznany za hrabiego cesarskiego [Root.Monarch.GetName]a z Fryzji Wschodniej. Dzięki poparciu i uznaniu cesarza roszczenia państwa [dutch_east_frisia_claimant.GetAdjective] do Fryzji Wschodniej straciły znaczenie."
 flavor_efr.EVTDESC3.2: "Cesarz postanowił poprzeć państwo [dutch_east_frisia_claimant.GetName] i jego roszczenia, odmawiając nam przyjęcia do Świętego Cesarstwa Rzymskiego. Nie wiemy jeszcze, co [dutch_east_frisia_claimant.Monarch.GetName] zrobi ze [dutch_east_frisia_claimant.Monarch.GetHerHis] roszczeniami, ale z pewnością nie wróży to dobrze naszemu państwu."
 flavor_efr.EVTDESC3.3: "Zbyt długo pozwalaliśmy przywódcy chłopskiemu we Fryzji Wschodniej rządzić jego niewielkimi ziemiami bez sprzeciwu. Teraz, dzięki poparciu [From.Monarch.GetTitle] [From.Monarch.GetName], nasze odległe roszczenia do Fryzji Wschodniej zostały wzmocnione, a [From.Monarch.GetTitle] udzielił nam [From.Monarch.GetHerHis] błogosławieństwa na najazd na tę niewielką republikę."
 flavor_efr.EVTOPTA3: "Niech żyje hrabia!"
 flavor_efr.EVTOPTB3: "Cesarz to nadęty głupiec!"
 flavor_efr.EVTOPTC3: "Połóżmy kres rządom [EFR.Monarch.GetName]."
