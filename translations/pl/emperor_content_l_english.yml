 has_mil_advisor_2_tooltip: "Zatrudnia doradcę §Ymilitarnego§! o umiejętnościach co najmniej §Y2§!."
 has_mil_advisor_3_tooltip: "Zatrudnia doradcę §Ymilitarnego§! o umiejętnościach co najmniej §Y3§!."
 has_completed_all_reforms_trigger_tooltip: "Uchwalono wszystkie reformy rządu."
 has_been_insulted_by_root: "Został znieważony przez państwo §Y[Root.GetName]§!"
 new_flavour_bav.12.t: "Ingolstadt: miasto piwa?"
 new_flavour_bav.12.d: "Ingolstadt i jego okolice tradycyjnie słynęły z produkcji wina. Jednak pod wpływem innych części Bawarii, gdzie większą popularnością cieszy się piwo, w mieście powstaje coraz więcej browarów. Jeśli zechcemy, możemy wesprzeć te młode przedsiębiorstwa i pozwolić, by piwo zastąpiło wino jako główny towar eksportowy prowincji."
 new_flavour_bav.12.a: "Piwo to nasza przyszłość."
 new_flavour_bav.12.b: "Wino jest lepszym alkoholem."
 ingolstadt_beer_city: "Browary w Ingolstadt"
 desc_ingolstadt_beer_city: "W Ingolstadt i jego okolicach powstało wiele znanych browarów, dzięki czemu miasto stało się jednym z głównych ośrodków bawarskiego piwowarstwa."
 new_flavour_bav.13.name: "Sukcesja w Bawarii"
 new_flavour_bav.13.desc: "Księstwo bawarskie Wittelsbachów od połowy XIV wieku było podzielone na różne części. Obecnie dzielą je między siebie trzy różne gałęzie rodu: monachijska, landshucka i ingolsztadzka. Różne skomplikowane ustalenia regulują, która gałąź rodu powinna dziedziczyć ziemie po księciu, który umrze bez męskiego potomka. Układy te jednak nie zawsze są bezsporne, a silny książę może próbować powiększyć swój majątek o ziemie swoich krewnych, bez względu na to, czy jego roszczenia są w pełni uzasadnione."
 new_flavour_bav.13.opt: "Chyba powinniśmy odtworzyć jedność Bawarii."
 new_flavour_bav.14.name: "Śmierć Ludwiga VIII Wittelsbacha"
 new_flavour_bav.14.desc: "Ludwig VIII, książę Ingolstadtu z dynastii Wittelsbachów, zmarł bezdzietnie. Zgodnie z ustaleniami w rodzie Wittelsbachów, księstwo Ingolstadtu zostanie przejęte przez naszego [Root.Monarch.GetRulerGen]."
 new_flavour_bav.14.opt: "Doskonale."
 new_flavour_bav.15.name: "Śmierć Ludwiga VIII Wittelsbacha"
 new_flavour_bav.15.desc: "Nasz książę, Ludwig VIII, zmarł, nie pozostawiając po sobie żadnych dziedziców. Zgodnie z ustaleniami w rodzie Wittelsbachów, księstwo Ingolstadtu zostanie przejęte przez monarchę [LBV.Monarch.GetName] księstwa Landshut."
 new_flavour_bav.15.opt: "Niefortunny bieg wydarzeń."
 new_flavour_bav.16.name: "Śmierć Ludwiga VIII Wittelsbacha"
 new_flavour_bav.16.desc: "Ludwig VIII, książę Ingolstadtu z dynastii Wittelsbachów, zmarł bezdzietnie. Zgodnie z ustaleniami w rodzie Wittelsbachów, księstwo Ingolstadtu zostanie przejęte przez monarchę [LBV.Monarch.GetName] księstwa Landshut."
 new_flavour_bav.16.opt: "Chyba nadszedł czas, abyśmy zgłosili roszczenia do księstwa Landshut."
 new_flavour_bav.17.name: "Roszczenia Ludwiga VII"
 new_flavour_bav.17.desc: "Po śmierci Ludwika VIII z Ingolstadt [LBV.Monarch.GetTitle] [LBV.Monarch.GetName] z Landshut zgłosił roszczenia do ziem Ingolstadt. Pomija to jednak prawa Ludwika VII, który przed laty został wypędzony ze swoich ziem przez syna i od tamtej pory pozostaje więźniem [Root.Monarch.GetTitle] [Root.Monarch.GetName]a w Ansbach. Gdy Ludwik VII dowiedział się o śmierci syna, zaczął głośno domagać się odzyskania dawnego księstwa. Możemy wykorzystać tę sytuację, by coś na niej zyskać."
 new_flavour_bav.17.A: "Sprzedaj Ludwika jego bawarskim wrogom."
 new_flavour_bav.17.B: "Poprzyj jego roszczenia."
 new_flavour_bav.17.C: "Odkup od niego prawa do księstwa."
 new_flavour_bav.171.name: "Ansbach nabywa prawa do dziedzictwa Wittelsbachów"
 new_flavour_bav.171.desc: "Nie tylko my mieliśmy prawa do Ingolstadt. Można argumentować, że silniejsze roszczenia przysługiwały Ludwikowi VII, ojcu Ludwika VIII, który został wypędzony z księstwa przez własnego syna. Ludwik od kilku lat przebywa jednak w niewoli u [From.Monarch.GetTitle] [From.Monarch.GetName]a z Ansbach. Teraz [From.GetAdjective] [From.Monarch.GetTitle] wykorzystał [From.Monarch.GetHerHis] niemałe zdolności perswazji – oraz pokaźną sumę pieniędzy – by przekonać Ludwika do sprzedania [From.Monarch.GetHerHim] praw do dziedzictwa Wittelsbachów."
 new_flavour_bav.171.A: "Księstwo jest, i pozostanie, nasze!"
 new_flavour_bav.18.name: "Dekret religijny [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 new_flavour_bav.18.desc: "Gwałtowny rozwój protestantyzmu zaniepokoił wielu zagorzałych katolickich doradców [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Aby zapobiec rozprzestrzenianiu się nowej wiary na naszych ziemiach, opracowali zbiór przepisów zakazujących nauk heretyckich i zwalczających braki w religijności zarówno wśród bawarskich biskupów, jak i naszych poddanych. Powołana zostanie komisja przeprowadzająca wizytacje kościelne, druk będzie dozwolony wyłącznie za zgodą [Root.Monarch.GetTitle], a wszelkie zmiany liturgiczne pochodzące z ziem opanowanych przez herezję zostaną zakazane. Duchowieństwo będzie niezadowolone z tak surowych ograniczeń, lecz powinny one skutecznie powstrzymać szerzenie się herezji."
 new_flavour_bav.18.a: "Wprowadź dekret."
 new_flavour_bav.18.b: "Duchowieństwo musi zachować swobodę działania."
 new_flavour_bav.19.name: "Broda Hannsa Steiningera"
 new_flavour_bav.19.desc: "Miasto Braunau zasłynęło ostatnio w niezwykle osobliwy sposób. Jeden z jego byłych urzędników, niejaki Hanns Steininger, przysłużył się miastu nie tyle przenikliwością, ile swoją brodą. Uważano ją za wyjątkowo okazały przykład męskiego zarostu – sięgała niemal do palców u stóp, choć jej właściciel nie należał do niskich mężczyzn. Los sprawił jednak, że padł ofiarą właśnie tej cechy, która przyniosła mu sławę. Gdy okazywał lojalność przejeżdżającemu przez miasto [Root.Monarch.GetTitle] [Root.Monarch.GetName]owi, potknął się o własną brodę, upadł niefortunnie i zmarł wskutek odniesionych obrażeń – męczennik własnej próżnej urody!"
 new_flavour_bav.19.a: "Ciekawe..."
 new_flavour_bav.20.name: "Kościół teatynów"
 new_flavour_bav.20.desc: "[Root.Consort.GetTitle] [Root.Consort.GetName] namawia [Root.Monarch.GetTitle] [Root.Monarch.GetName], by obiecał sfinansować wspaniały kościół zakonu teatynów w mieście [Root.Capital.GetCapitalName], jeśli na świat przyjdzie następca tronu. Wybrała już bolońskiego architekta Agostina Barelliego, który ma wznieść świątynię w stylu włoskiego baroku. Nasza arystokracja i zamożni mieszczanie są zachwyceni planami, które księżna rozpowszechniła, ponieważ podziwiają modny włoski styl. Czy powinniśmy spełnić jej prośbę?"
 new_flavour_bav.20.a: "Dobrze, spełnij jej życzenie."
 new_flavour_bav.20.b: "Nonsens!"
 bav_religious_mandate_mod: "Dekret religijny"
 desc_bav_religious_mandate_mod: "Wprowadziliśmy surowe przepisy regulujące praktykowanie religii na naszych ziemiach."
 bav_building_wife_church: "Małżeńskie przyjemności"
 desc_bav_building_wife_church: "Nie ma lepszego sposobu, by powiedzieć „kocham cię”, niż wybudować kościół na życzenie żony."
 bav_woman_scorned_mod: "Wzgardzona kobieta"
 desc_bav_woman_scorned_mod: "Nie warto drażnić żony, gdy potrzebuje się następcy tronu."
 new_flavour_bav.27.name: "[bavarian_lesser_union_member.GetName] buntuje się przeciwko Danii"
 new_flavour_bav.27.desc: "Bawarska szlachta w państwie [bavarian_lesser_union_member.GetName] nie godzi się na rządy odległej Danii. Tęskni za czasami, gdy mogła ponownie podlegać jednemu ze swoich.\n\nW ostatnich miesiącach pojawiały się oznaki spisku, lecz naszym władzom nie udało się potwierdzić tych pogłosek. Teraz nie ma już wątpliwości: grupa zbuntowanych możnych skupiła się wokół Maksymiliana, księcia z mało znaczącej linii rodu Wittelsbachów, chwyciła za broń i ogłosiła go swoim księciem."
 new_flavour_bav.27.A: "Musimy zdławić ten bunt!"
 new_flavour_bav.21.name: "Nasze długi wobec cesarza"
 new_flavour_bav.21.desc: "W ciągu ostatnich dziesięcioleci miasto Ratyzbona zgromadziło znaczne zadłużenie wobec cesarza Świętego Cesarstwa Rzymskiego z dynastii [HAB.Monarch.Dynasty.GetName]. Choć [HAB.Monarch.GetSheHe] nie zażądał jeszcze spłaty [HAB.Monarch.GetHerHis] należności, nasza pozycja jest znacznie osłabiona przez fakt, że [HAB.Monarch.GetSheHe] może to zrobić w każdej chwili."
 new_flavour_bav.21.A: "Powinniśmy spłacić dług już teraz."
 new_flavour_bav.21.B: "Poczekajmy, aż zażądają spłaty naszych długów."
 new_flavour_bav.22.name: "Długi Ratyzbony"
 new_flavour_bav.22.desc: "Obecna wojna z państwem [emperors_enemy.GetUsableName] poważnie nadwyrężyła nasze zasoby. Doradcy przypominają, że miasto Ratyzbona jest nam winne znaczną sumę pieniędzy. Są przekonani, że możemy skłonić je do zapłaty, grożąc utratą naszej przychylności. Żądanie tak dużej kwoty prawdopodobnie zdestabilizuje jednak władze miasta, a rodzina Wittelsbachów, silnie z nim związana, może interweniować w jego obronie."
 new_flavour_bav.22.A: "Muszą spłacić swoje należności."
 new_flavour_bav.22.A.tooltip: "Jeśli §YRatyzbona§! będzie w stanie zapłacić, otrzymamy:"
 new_flavour_bav.22.B: "Darujemy im ich przewinienia finansowe."
 new_flavour_bav.23.name: "Długi Ratyzbony"
 new_flavour_bav.23.desc: "W ciągu ostatnich dziesięcioleci miasto Ratyzbona zgromadziło znaczne zadłużenie wobec cesarza Świętego Cesarstwa Rzymskiego z dynastii [HAB.Monarch.Dynasty.GetName]. Teraz cesarz [HAB.Monarch.GetName] domaga się spłaty [HAB.Monarch.GetHerHis] należności, aby sfinansować wojnę z państwem [emperors_enemy.GetUsableName]. Ze względu na nasze silne związki z Ratyzboną – która niegdyś była stolicą Wittelsbachów – możemy jednak interweniować. Jeśli zgromadzimy środki potrzebne do spłaty jej długu, będziemy mogli zaproponować miastu przejęcie jego zobowiązań. W praktyce spłacimy dług w zamian za jego wolność. Austriacy mogą jednak nieprzychylnie spojrzeć na taką transakcję."
 new_flavour_bav.23.A: "Wykupimy miasto w zamian za spłatę jego długu."
 new_flavour_bav.23.A.tooltip: "Jeśli §YRatyzbona§! przyjmie naszą ofertę, nastąpią następujące efekty:"
 new_flavour_bav.23.B: "Niech radzą sobie sami."
 new_flavour_bav.23.B.tooltip: "Inni monarchowie z rodu §YWittelsbachów§! mogą zaoferować §YRatyzbonie§! swoje wsparcie."
 new_flavour_bav.24.name: "Cesarz żąda zapłaty"
 new_flavour_bav.24.desc.default: "Cesarz [HAB.Monarch.GetName] z państwa [HAB.GetAdjective] domaga się spłaty [HAB.Monarch.GetHerHis] należności, aby sfinansować [HAB.Monarch.GetHerHis] wojnę z państwem [emperors_enemy.GetUsableName]. [HAB.Monarch.GetSheHeCap] żąda pełnej i natychmiastowej zapłaty. Musimy albo uregulować dług, albo nie wywiązać się ze zobowiązań jako wolne miasto."
 new_flavour_bav.24.desc.wittelsbach: "Cesarz [HAB.Monarch.GetName] z państwa [HAB.GetAdjective] domaga się spłaty [HAB.Monarch.GetHerHis] należności, aby sfinansować [HAB.Monarch.GetHerHis] wojnę z państwem [emperors_enemy.GetUsableName]. [HAB.Monarch.GetSheHeCap] żąda pełnej i natychmiastowej zapłaty, grożąc sankcjami, jeśli nie wywiążemy się ze zobowiązań jako wolne miasto. Pojawiło się jednak trzecie rozwiązanie: Wittelsbachowski [From.Monarch.GetTitle] z państwa [From.GetName] zaoferował pomoc. [From.Monarch.GetSheHeCap] zgodził się spłacić nasze długi w zamian za uznanie historycznych praw Wittelsbachów do miasta."
 new_flavour_bav.24.A: "Zgoda, zapłacimy."
 new_flavour_bav.24.B: "Nie spłacimy tego długu."
 new_flavour_bav.24.B.tooltip: "§RCesarz cofnie nasz status wolnego miasta, zaś biskupstwo w Ratyzbonie przejmie kontrolę nad miastem.§!"
 new_flavour_bav.24.C: "Przyjmij propozycję państwa [From.GetName]."
 new_flavour_bav.24.C.player_warning_tooltip: "§RPaństwo [From.GetName] dokona pełnej aneksji Ratyzbony.§!"
 new_flavour_bav.25.name: "Darowane długi"
 new_flavour_bav.25.desc: "Od czasu zaciągnięcia przez nas długów wobec cesarza minęło już wiele lat. W tym okresie zmieniali się cesarze i polityka cesarska, przez co podejście władcy do tej sprawy złagodniało. Nasz [Root.Monarch.GetTitle], [Root.Monarch.GetName], przekonał [HAB.Monarch.GetTitle] [HAB.Monarch.GetName] do zmniejszenia naszych zobowiązań do możliwego do udźwignięcia poziomu oraz umorzenia pozostałej części długu."
 new_flavour_bav.25.A: "Świetne wieści."
 new_flavour_bav.26.name: "Darowane długi"
 new_flavour_bav.26.desc: "Cesarz [HAB.Monarch.GetName] z państwa [HAB.GetName], [HAB.Monarch.GetWomanMan] nieskończonej mądrości, wielkodusznie postanowił darować nam nasze długi. Nie będziemy już musieli spłacać należności zaciągniętych w przeszłości."
 new_flavour_bav.26.A: "Niech żyje cesarz!"
 opinion_regensburg_paid: "Spłacono ich długi"
 opinion_regensburg_no_money: "Umorzenie długów"
 opinion_regensburg_defaulted: "Niewywiązanie się ze spłaty długów"
 opinion_stole_free_city: "Anektowano wolne miasto"
 opinion_regensburg_demand_too_much: "Nadmierne żądania"
 flavor_brapru.25.a.tt2: "§RBayreuth nie będzie dłużej we władzy Brandenburgii.§!"
 flavor_sax.4.name: "Bratobójcza wojna saska"
 flavor_sax.4.desc: "Po śmierci wuja [Root.Monarch.GetTitle] [Root.Monarch.GetName], Fryderyka Turyńskiego, ziemie turyńskie dynastii Wettynów znalazły się pod panowaniem państwa [Root.GetName]. Wkrótce jednak wybuchł spór między [Root.Monarch.GetTitle] a jego bratem Wilhelmem o sprawiedliwy podział tych ziem. Zgodnie z podziałem w Altenburgu, wynegocjowanym przy pomocy Brandenburgii i Hesji, bracia mieli wspólnie sprawować rządy: [Root.Monarch.GetName] otrzymał wschodnie ziemie rdzenne Miśni, a Wilhelm miał objąć władzę nad Turyngią.\n\nWilhelm kwestionuje jednak to porozumienie i domaga się większego terytorium – co najmniej panowania nad Wittenbergą – grożąc w przeciwnym razie wojną."
 flavor_sax.4.A: "Zrobimy wszystko dla naszego drogiego brata."
 flavor_sax.4.B: "To oburzające! Niech rozpocznie się wojna!"
 flavor_sax.6.name: "Sascy książęta wzięci jako zakładnicy"
 flavor_sax.6.desc: "Wygląda na to, że po wojnie Fryderyka z Wilhelmem napięcia wśród saskiej i turyńskiej szlachty wciąż są wysokie. Rycerz Kunz von Kauffungen, który walczył po stronie Fryderyka, lecz konflikt doprowadził go do ruiny finansowej, sprzymierzył się z kilkoma niezadowolonymi rycerzami z Turyngii. Wspólnie uknuli plan porwania synów [Root.Monarch.GetTitle], by wymusić okup. Udało im się pojmać książąt, lecz zostali schwytani podczas próby przekroczenia granicy, a książęta bezpiecznie wrócili do miasta [Root.Capital.GetCapitalName]. Jak ukarać zdrajców?"
 flavor_sax.6.A: "Ściąć ich!"
 flavor_sax.6.B: "Przyznać im amnestię."
 flavor_sax.7.name: "Sascy książęta wzięci jako zakładnicy"
 flavor_sax.7.desc: "Wygląda na to, że po wojnie Fryderyka z Wilhelmem napięcia wśród saskiej i turyńskiej szlachty wciąż są wysokie. Rycerz Kunz von Kauffungen, który walczył po stronie Fryderyka, lecz konflikt doprowadził go do ruiny finansowej, sprzymierzył się z kilkoma niezadowolonymi rycerzami z Turyngii. Wspólnie uknuli plan porwania synów [Root.Monarch.GetTitle], by wymusić okup. Tym razem spisek się powiódł: porywacze przekroczyli granicę i dotarli do państwa [neighbour.GetUsableName]. Stamtąd wystosowali żądanie: 200 dukatów albo obaj książęta zginą."
 flavor_sax.7.A: "Zapłaćmy okup."
 flavor_sax.7.B: "Nie płacimy zdrajcom."
 flavor_sax.8.name: "Traktat w Lipsku"
 flavor_sax.8.desc: "Śmierć Fryderyka II ponownie wywołała spór o sukcesję w Saksonii, tym razem między [Root.Monarch.GetName] a jego bratem Ernestem. Zgodnie z ostatnią wolą Fryderyka Ernest powinien otrzymać ziemie Turyngii i rządzić niezależnie od swojego [Root.Monarch.GetSisterBrother]. [Root.Monarch.GetName] może zignorować wolę [Root.Monarch.GetHerHis] ojca, jeśli [Root.Monarch.GetSheHe] jest gotów zaakceptować konsekwencje [Root.Monarch.GetHerHis] decyzji."
 flavor_sax.8.A: "Uszanujmy testament."
 flavor_sax.8.B: "Ziemie Saksonii nie mogą zostać podzielone!"
 flavor_sax.9.name: "Elektorat Saksonii"
 flavor_sax.9.desc: "Nasi bracia w Saksonii nie rządzą już naszymi ziemiami, lecz nadal dzierżą godność elektorską. Teraz, gdy udowodniliśmy nad nimi swoją wyższość, a przychylność cesarza wydaje się zapewniona, nadarza się idealna okazja, by wystąpić o naprawienie historycznej niesprawiedliwości i przyznanie godności elektorskiej naszej linii rodu Wettynów."
 flavor_sax.9.desc.emperor: "Nasi bracia w Saksonii nie rządzą już naszymi ziemiami, lecz nadal dzierżą godność elektorską. Teraz, gdy udowodniliśmy nad nimi swoją wyższość i sami sprawujemy władzę cesarską, możemy naprawić tę historyczną niesprawiedliwość i przyznać godność elektorską naszej linii rodu Wettynów."
 flavor_sax.9.A: "Zwróćmy się z prośbą do cesarza!"
 flavor_sax.9.B: "Niechaj elektorat należy do nas."
 flavor_sax.9.C: "To nie jest tego warte."
 flavor_sax.11.name: "Turyngia domaga się przejęcia tytułu elektorskiego Saksonii"
 flavor_sax.11.desc: "Nasi sojusznicy z Turyngii zwyciężyli w walce między liniami rodu Wettynów i przejęli kontrolę nad Saksonią. Zwracają się do nas z prośbą o naprawienie dawnej niesprawiedliwości i przekazanie im godności elektorskiej, którą dotychczas dzierżyła Saksonia."
 flavor_sax.11.A: "Niech żyje elektor [From.GetAdjective]!"
 flavor_sax.11.B: "Niech elektorat pozostanie w rękach Saksonii."
 sax_grieving_death_of_sons: "W żałobie"
 desc_sax_grieving_death_of_sons: "Choć wie, że czas ucieka i musi spłodzić następcę tronu, Fryderyk po stracie ukochanych synów niechętnie wikła się w kolejne związki."
 sax_really_bad_reputation: "Niehonorowy"
 desc_sax_really_bad_reputation: "Książę, kierując się doraźną korzyścią i ignorując testament ojca, musi teraz zmierzyć się z konsekwencjami swoich czynów."
 hun_ladislaus_postumus_warning_tooltip: "§RPonieważ Władysław Pogrobowiec jest następcą tronu zarówno w Austrii, jak i na Węgrzech, jeżeli osiągnię on dorosłość i zajmie obydwa trony, Węgry zostaną połączone z Austrią unią personalną.§!"
 flavor_hab.21.name: "Arcyksiążę Austrii, król Węgier"
 flavor_hab.21.desc: "Władysław Pogrobowiec, arcyksiążę austriacki, jest teraz prawowitym monarchą zarówno Austrii, jak i Węgier. Podjął on decyzję, by rządzić z Wiednia i używać tytułu arcyksięcia jako głównego tytułu monarszego. Protesty węgierskiej arystokracji okazały się być nieskuteczne, zatem Węgry są od teraz rządzone przez monarchę Austrii w unii personalnej."
 flavor_hab.21.A: "Niech żyje Arcyksiążę Władysław."
 flavor_hab.23.name: "Zebranie arystokracji Węgier i Chorwacji"
 flavor_hab.23.desc: "Chorwacka i węgierska szlachta zebrały się na zaimprowizowanym zebraniu, podczas którego uzgodniono, że oba królestwa, od dziesięcioleci rządzone razem w ramach unii personalnej, powinny odtąd być uważane za jedno, aby mogły zaprezentować zjednoczony front wobec swoich władców z [Root.GetAdjective]. Królestwo Chorwacji zostało zatem przyłączone do Węgier."
 flavor_hab.23.A: "Niech tak będzie."
 flavor_hab.24.name: "Zebranie arystokracji Węgier i Chorwacji"
 flavor_hab.24.desc: "Chorwacka i węgierska szlachta zebrały się na zaimprowizowanym zebraniu, podczas którego uzgodniono, że oba królestwa, od dziesięcioleci rządzone razem w ramach unii personalnej, powinny odtąd być uważane za jedno, aby mogły zaprezentować zjednoczony front wobec swoich suwerenów z [From.GetAdjective]. Królestwo W związku z tym zaanektowaliśmy królestwo Chorwacji."
 flavor_hab.24.A: "Doskonale."
 new_flavour_nap.1.name: "Senatus Populusque Neapolitanus"
 new_flavour_nap.1.desc: "Mieszkańcy Neapolu nie są usatysfakcjonowani skutkami powstania Masaniella. Ponownie chwycili za broń, tym razem domagając się wolności i republikańskiego ustroju. Po przejęciu kontroli nad miastem ich przywódca, Gennaro Annese – niezwykle przebiegły i odważny rusznikarz, który stał za sukcesem Masaniella – ogłosił powstanie „Najjaśniejszej Republiki Królestwa Neapolu”, którą ma rządzić S.P.Q.N., czyli Senat i Lud Neapolu.\n\nSzlachta jest podzielona między lojalność wobec [Root.Monarch.GetTitle] a poparcie dla młodej republiki. Niezależnie od naszej reakcji, czeka nas zamęt!"
 new_flavour_nap.1.A: "Musimy zmiażdżyć tych buntowników!"
 new_flavour_nap.1.B: "Niechaj żyje Najjaśniejsza Republika!"
 new_flavour_nap.1.B.tooltip: "Monarchie ościenne będą zaniepokojone rozwojem silnej republiki w południowych Włoszech."
 new_flavour_nap.2.name: "Senatus Populusque Neapolitanus"
 new_flavour_nap.2.desc: "Zmęczeni surową polityką podatkową [Root.Monarch.GetTitle] [Root.Monarch.GetName] oraz nadużyciami namiestnika z państwa [overlord_country.GetAdjective], mieszkańcy Neapolu powstali, domagając się wolności pod rządami republikańskimi. Pod wodzą Masaniella, niezwykle charyzmatycznego rybaka znanego dotąd głównie z unikania poborców podatkowych, oraz Gennara Annese, rusznikarza stojącego za jego sławą, przejęli kontrolę nad miastem i ogłosili powstanie „Najjaśniejszej Republiki Królestwa Neapolu”, którą ma rządzić S.P.Q.N., czyli Senat i Lud Neapolu.\n\nNiezadowoleni członkowie miejskiej szlachty poparli młodą republikę, a ci spośród nich, którzy utrzymują kontakty z państwem [rival_of_overlord.GetUsableName], zorganizowali poselstwo do [rival_of_overlord.GetRulerAdjAndTitle], prosząc o wsparcie dla swojej sprawy."
 new_flavour_nap.2.A: "Musimy zmiażdżyć tych buntowników!"
 new_flavour_nap.2.A.tooltip: "\nJeśli rebelianci złamią państwo §Y[Root.GetName]§!, unia między państwami §Y[overlord_country.GetName]§! i §Y[Root.GetName]§! zostanie zerwana.\n"
 new_flavour_nap.3.A.tooltip: "\nJeżeli buntownicy z państwa §Y[From.GetName]§! wygrają, unia personalna między państwami §Y[overlord_country.GetName]§! i §Y[From.GetName]§! zostanie zerwana.\n"
 new_flavour_nap.4.name: "Neapolitańscy wysłannicy republikańscy"
 new_flavour_nap.4.desc: "Przybyło do nas poselstwo z Neapolu, gdzie ludowe powstanie doprowadziło do utworzenia młodej republiki zbuntowanej przeciwko naszemu rywalowi, państwu [overlord_country.GetUsableName]. Wysłannicy proszą nas o pomoc przeciwko [overlord_country.GetRulerAdjAndTitle], pod którego tyrańskimi rządami od dawna cierpią. Są nawet gotowi zaoferować jednemu z naszych arystokratów stanowisko „Signore”, czyli władcy republiki, w zamian za nasze wsparcie. Jeśli dysponujemy odpowiednimi środkami, będzie to doskonała okazja, by osłabić państwo [overlord_country.GetAdjective]."
 new_flavour_nap.4.A: "Wesprzemy republikę Neapolu."
 new_flavour_nap.4.A.tooltip: "\nJeżeli buntownicy z §Y[From.GetAdjective]§! wygrają, unia personalna między państwami §Y[overlord_country.GetName]§! i §Y[From.GetName]§! zostanie zerwana.\n"
 new_flavour_nap.4.B: "Nie możemy przeznaczyć na to środków."
 new_flavour_nap.5.name: "Powrót republikańskich wysłanników z państwa [From.GetUsableName]"
 new_flavour_nap.5.desc: "Poselstwo republikanów powróciło od [From.GetRulerAdjAndTitle]. Z radością donosi, że państwo [From.GetAdjective] wyśle [Root.nap_foreign_republican.GetName], członka swojej najwyższej arystokracji, na czele oddziału najemników, by objął urząd władcy republiki."
 new_flavour_nap.5.A: "Musimy zebrać siły przeciwko nowemu zagrożeniu!"
 new_flavour_nap.6.name: "Powrót republikańskich wysłanników z państwa [From.GetUsableName]"
 new_flavour_nap.6.desc: "Poselstwo republikanów powróciło od [From.GetRulerAdjAndTitle]. Na ich twarzach maluje się przygnębienie: tamtejsze władze nie udzielą wsparcia ich sprawie."
 new_flavour_nap.6.A: "[Root.GovernmentName] powstanie!"
 new_flavour_nap.7.name: "Interwencja państwa [From.GetAdjective] w państwie [From.From.GetUsableName]"
 new_flavour_nap.7.desc: "Nikczemne państwo [rival_of_overlord.GetAdjective] postanowiło wesprzeć republikańskie powstanie w Neapolu! Na prośbę Neapolitańczyków wysłano [From.From.nap_foreign_republican.GetName], członka tamtejszej najwyższej arystokracji, na czele oddziału najemników, by objął urząd władcy republiki. Musimy zebrać siły przeciwko nowemu zagrożeniu!"
 new_flavour_nap.7.A: "Zapłacą za to."
 new_flavour_nap.8.name: "Senatus Populusque Neapolitanus"
 new_flavour_nap.8.desc: "Dzięki naszemu wsparciu neapolitańscy republikanie pokonali dotychczasowe władze i ogłosili Najjaśniejszą Republikę Królestwa [From.GetName], a nasz człowiek, [From.Monarch.GetName], został jej [From.Monarch.GetTitle]. Miejmy nadzieję, że zapoczątkuje to nowy okres wpływów państwa [Root.GetAdjective] w państwie [From.GetName]."
 new_flavour_nap.8.A: "Doskonale."
 establish_a_republic: "Wprowadź republikę"
 establish_a_republic_desc: "Republikanie domagają się ustanowienia republikańskiego systemu rządów w państwie $COUNTRYNAME$."
 opinion_against_nap_republic: "Przeciwko republice Neapolu"
 nap_republican_rebels_title: "Republikanie"
 nap_republican_rebels_name: "Republikanie z $COUNTRY$"
 nap_republican_rebels_desc: "Buntownicy republikańscy domagają się obalenia dotychczasowego reżimu i wprowadzenia rządów republikańskich. Prowadzeni są przez mieszczan i arystokratów niezadowolonych z dotychczasowych rządów."
 nap_republican_rebels_army: "Buntownicy republikańscy"
 opinion_supported_republican_uprising: "Wsparto powstanie republikańskie w Neapolu"
 opinion_sponsors_of_republican_uprising: "Państwa wspierające powstanie republikańskie w Neapolu"
 opinion_supported_republican_uprising_overlord: "Wsparto powstanie republikańskie w Neapolu"
 new_flavour_sav.3.name: "Królestwo Cypru"
 new_flavour_sav.3.desc.firstruler: "Saraceni z państwa [infidels_of_cyprus.GetUsableName] podbili Cypr, likwidując jedną z ostatnich chrześcijańskich placówek na Bliskim Wschodzie i kończąc panowanie dynastii de Lusignan, trwające od XII wieku.\n\nRód de Lusignan nie wygasł jednak całkowicie. Dzięki małżeństwu [Root.Monarch.GetTitle] [Root.Monarch.GetName] z cypryjską księżniczką Anną de Lusignan mamy niepodważalne prawa dynastyczne do Królestwa Cypru, ponieważ główna linia rodu wygasła. Jeśli zdołamy wyrwać wyspę z rąk niewiernych, [Root.Heir.GetName] odziedziczy królestwo."
 new_flavour_sav.3.desc.notfirstruler: "Saraceni z państwa [infidels_of_cyprus.GetUsableName] podbili Cypr, likwidując jedną z ostatnich chrześcijańskich placówek na Bliskim Wschodzie i kończąc panowanie dynastii de Lusignan, które trwało od XII wieku.\n\nRód de Lusignan nie wygasł jednak całkowicie. Dzięki małżeństwu naszego przodka, księcia Ludwika I, z cypryjską księżniczką Anną de Lusignan mamy niepodważalne prawa dynastyczne do Królestwa Cypru, ponieważ główna linia rodu wygasła. Jeśli tylko zdołamy wyrwać wyspę z rąk niewiernych, będziemy mogli zgodnie z prawem dochodzić naszych praw do królestwa."
 new_flavour_sav.3.A: "Niech Cypr należy do nas."
 new_flavour_sav.5.name: "Antypapież Feliks V"
 new_flavour_sav.5.desc: "Ojciec Ludwika I, Amadeusz VIII, zrzekł się w 1440 roku tytułu księcia Sabaudii, by jako antypapież Feliks V przeciwstawić się papieżowi Eugeniuszowi IV. Nie odniósł jednak większych sukcesów w tej roli – poparła go jedynie niewielka grupa dysydentów w Kościele katolickim. Ze względu na znikome wpływy dyplomatyczne stronnictwa Feliksa kuszące jest uznanie naszych więzi z papieżem w mieście [PAP.Capital.GetName] za ważniejsze niż więzy rodzinne i odcięcie się od niego. Poparcie antypapieża mogłoby jednak stać się dla naszego ludu symbolem jedności w obliczu zagrożeń z zewnątrz."
 new_flavour_sav.5.A: "Za sprawiedliwość i papieża Feliksa V!"
 new_flavour_sav.5.B: "Jedynym prawdziwym papieżem jest ten rezydujący w prowincji [PAP.Capital.GetName]."
 sav_supports_antipopes_justice: "Sprawiedliwość antypapieża"
 desc_sav_supports_antipopes_justice: "Księstwo Sabaudii jednoczy się wokół antypapieża Feliksa V, który twierdzi, że jest prawdziwym przywódcą katolicyzmu."
 opinion_supporting_antipope: "Wsparcie dla antypapieża"
 pirates.22.name: "Piraci z Rugii"
 pirates.22.desc: "Morze Bałtyckie od niepamiętnych czasów jest siedliskiem piractwa. Wśród żeglarzy i rybaków z Rugii wielu z rozrzewnieniem opowiada historie o dawnych czasach, gdy Klaus Störtebeker i jego Likedeelerowie przemierzali morza, bogacąc się na rabowaniu każdego, kto miał nieszczęście stanąć im na drodze. W porównaniu z monotonią zwykłego życia ekscytacja korsarstwem wydaje się wielu osobom niezwykle kusząca. Nawet świadomość, że Likedeelerowie ostatecznie zapłacili za swoje czyny życiem – i że ich może spotkać podobny los – nie odstrasza śmiałków. Pod wodzą byłego oficera marynarki, który twierdzi, że pochodzi od samego Störtebekera, zebrali kilka okrętów wojennych i są gotowi ponownie podnieść czarną banderę.\n\nCzy staniemy po stronie przyszłych piratów?"
 pirates.22.a: "Życie pirata jest dla mnie!"
 pirates.22.b: "Należy przestrzegać praw naszego państwa."
 HAVE_MORE_OWN_AND_NON_TRIBUTARIES_DEVELOPMENT_THAN_COMP: "Własny i poddanego nie będącego trybutariuszem rozwój jest większy niż rozwój państwa $COUNTRYNAME|Y$ ($VAL|Y$). Obecny rozwój $CURRENT|0Y$."
 HAVE_LESS_OWN_AND_NON_TRIBUTARIES_DEVELOPMENT_THAN_COMP: "Miej mniejszy rozwój własny i poddanych nietrybutarnych niż $COUNTRYNAME|Y$ ($VAL|Y$). Obecnie masz $CURRENT|0Y$."
 new_court_flavour_events.1.name: "Doradca utrzymujący kontakty"
 new_court_flavour_events.1.desc: "[Root.GetEventAdvisorName] zyskał uznanie wielu osób w kraju dzięki [Root.GetEventAdvisorHerHis] inicjatywie i zdolnościom przywódczym, a także [Root.GetEventAdvisorHerHis] staraniom, by odnaleźć się na dworze państwa [Root.GetAdjective]. Wygląda jednak na to, że [Root.GetEventAdvisorSheHe] nie zerwał wszystkich więzi ze [Root.GetEventAdvisorHerHis] rodakami w państwie [advisor_liaisons_target_country.GetUsableName]. [Root.GetEventAdvisorSheHeCap] zabiega o poprawę stosunków z [Root.GetEventAdvisorHerHis] ojczyzną, państwem [advisor_liaisons_target_country.GetUsableName], i zaoferował wykorzystanie [Root.GetEventAdvisorHerHis] kontaktów na dworze [advisor_liaisons_target_country.GetAdjective], by skłonić tamtejszego [advisor_liaisons_target_country.Monarch.GetTitle] do przyjęcia bardziej przyjaznego stanowiska wobec nas."
 new_court_flavour_events.1.A: "Zróbmy to."
 new_court_flavour_events.1.B: "Nie potrzebujemy poprawy stosunków z tym państwem."
 new_court_flavour_events.2.name: "Zbliżenie z państwem [From.GetUsableName]?"
 new_court_flavour_events.2.desc: "[From.GetEventAdvisorName], [From.GetEventAdvisorTitle] kultury [Root.Culture.GetName], zatrudniony na dworze państwa [From.GetAdjective], zwrócił się do [From.GetEventAdvisorHerHis] dawnego znajomego [Root.Dip_Advisor.GetName], naszego [Root.Dip_Advisor.GetTitle], z planem poprawy stosunków między państwami [From.GetUsableName] i [Root.GetUsableName]. [Root.Dip_Advisor.GetName] przedstawił [Root.Monarch.GetTitle] [Root.Monarch.GetName] wiadomość od państwa [From.GetAdjective], wyrażającą pragnienie przyjaźni między naszymi narodami."
 new_court_flavour_events.2.A: "Lepsze stosunki rzeczywiście mogą nam przynieść korzyści."
 new_court_flavour_events.2.B: "Poprawa stosunków nie leży w naszym interesie."
 new_court_flavour_events.2.C: "Przyjaźń? Znikaj mi z oczu!"
 new_court_flavour_events.3.name: "Zbliżenie zakończone sukcesem"
 new_court_flavour_events.3.desc: "Kontakty [Root.GetEventAdvisorName]a w państwie [From.GetUsableName] przedstawiły naszą sprawę [From.Monarch.GetTitle] [From.Monarch.GetName]owi i otrzymały przychylną odpowiedź. [From.Monarch.GetTitle] oznajmił, że [From.Monarch.GetSheHe] z niecierpliwością oczekuje nowej ery przyjaźni między naszymi państwami."
 new_court_flavour_events.3.desc2: "[Root.GetEventAdvisorName] dotrzymał słowa, zgodnie z [Root.GetEventAdvisorHerHis] obietnicą: [Root.GetEventAdvisorHerHisCap] kontakty w państwie [From.GetUsableName] przedstawiły naszą sprawę [From.Monarch.GetTitle] [From.Monarch.GetName]owi i otrzymały przychylną odpowiedź. [From.Monarch.GetSheHeCap] oznajmił, że [From.Monarch.GetSheHe] z niecierpliwością oczekuje nowej ery przyjaźni między naszymi państwami."
 new_court_flavour_events.4.name: "Zbliżenie zakończone niepowodzeniem"
 new_court_flavour_events.4.desc: "Kontakty [Root.GetEventAdvisorName]a najwyraźniej nie zdołały zdobyć większych wpływów na dworze państwa [From.GetAdjective]. [From.Monarch.GetTitle] [From.Monarch.GetName] poinformował ich, że państwo [From.GetUsableName] nie jest zainteresowane poprawą stosunków z państwem [Root.GetUsableName]."
 new_court_flavour_events.4.desc2: "Wygląda na to, że [Root.GetEventAdvisorName] nie zawiódł naszego zaufania, lecz nie osiągnął zamierzonego celu. [Root.GetEventAdvisorSheHe] nie zdołał zdobyć wpływów, na które liczył. [Root.GetEventAdvisorSheHe] i [Root.GetEventAdvisorHerHisCap] kontakty najwyraźniej nie zdołały zdobyć większych wpływów na dworze państwa [From.GetAdjective]. [From.Monarch.GetTitle] [From.Monarch.GetName] poinformował ich, że państwo [From.GetUsableName] nie jest zainteresowane poprawą stosunków z państwem [Root.GetUsableName]."
 new_court_flavour_events.5.name: "Gwałtowne odrzucenie próby zbliżenia"
 new_court_flavour_events.5.desc: "Kontakty [Root.GetEventAdvisorName]a nie zdołały zdobyć wpływów na dworze państwa [From.GetAdjective]. Odpowiedź była wręcz wroga. Nie tylko jednoznacznie poinformowano nas, że państwo [From.GetUsableName] nie jest zainteresowane poprawą stosunków z państwem [Root.GetUsableName], lecz także dano [Root.GetEventAdvisorName]owi do zrozumienia, że [Root.GetEventAdvisorSheHe] odtąd nie jest mile widziany w państwie [From.GetUsableName]. W atmosferze niechęci wobec państwa [Root.GetAdjective] [From.Monarch.GetTitle] [From.Monarch.GetName] posunął się nawet do wygnania kilku współpracowników naszego doradcy ze swojego dworu, z [From.Monarch.GetHerHis] rozkazu."
 new_court_flavour_events.5.option: "Niech tak będzie."
 new_court_flavour_events.5.desc2: "[Root.GetEventAdvisorName] nie zawiódł naszego zaufania, lecz nie osiągnął zamierzonego celu. [Root.GetEventAdvisorSheHe] nie zdołał zdobyć wpływów, na które liczył. [Root.GetEventAdvisorSheHe] i [Root.GetEventAdvisorHerHisCap] kontakty nie zdołały zdobyć wpływów na dworze państwa [From.GetAdjective]. Odpowiedź była wręcz wroga. Nie tylko jednoznacznie poinformowano nas, że państwo [From.GetUsableName] nie jest zainteresowane poprawą stosunków z państwem [Root.GetUsableName], lecz także dano [Root.GetEventAdvisorName]owi do zrozumienia, że [Root.GetEventAdvisorSheHe] odtąd nie jest mile widziany w państwie [From.GetUsableName]. W atmosferze niechęci wobec państwa [Root.GetAdjective] [From.Monarch.GetTitle] [From.Monarch.GetName] posunął się nawet do wygnania kilku współpracowników naszego doradcy ze swojego dworu, z [From.Monarch.GetHerHis] rozkazu."
 opinion_court_events_accept: "Zbliżenie"
 opinion_court_events_rebuke: "Odrzucona próba zbliżenia"
 opinion_court_events_rebuke_1: "Odrzucona próba zbliżenia"
 opinion_court_events_grateful: "Odmówił przyjęcia zdrajcy"
 opinion_court_events_annoyed: "Przyjął zdrajcę"
 new_court_flavour_events.10.name: "Oskarżenia o nielojalność"
 new_court_flavour_events.10.desc.adm: "Nie wszyscy popierają pomysł powierzenia [Root.GetEventAdvisorName] zadania poprawy stosunków z państwem [advisor_liaisons_target_country.GetUsableName]. Wraz z narastającym sprzeciwem na dworze państwa [Root.GetAdjective] [Root.Adm_Advisor.GetName], który wcześniej przyjaźnie rywalizował z [Root.GetEventAdvisorHerHim] o względy [Root.Monarch.GetTitle] [Root.Monarch.GetName], wystąpił z oskarżeniami o nielojalność. [Root.Adm_Advisor.GetSheHeCap] twierdzi, że zbadał działania [Root.GetEventAdvisorName] i odkrył, iż [Root.GetEventAdvisorSheHe] przekazywał [Root.GetEventAdvisorHerHim] tajemnice państwowe państwu [advisor_liaisons_target_country.GetUsableName] pod pretekstem dążenia do zbliżenia.\n\nZ kolei [Root.GetEventAdvisorHerHis] zdaniem dowody przedstawione przeciwko [Root.GetEventAdvisorHerHim] zostały sfabrykowane z zazdrości [Root.Adm_Advisor.GetName] o [Root.GetEventAdvisorHerHis] sukces. [Root.GetEventAdvisorName] protestuje i przysięga, że [Root.GetEventAdvisorSheHeCap] jest lojalny oraz osiągnie pozytywne rezultaty, jeśli [Root.GetEventAdvisorSheHe] otrzyma nasze pełne zaufanie."
 new_court_flavour_events.10.desc.dip: "Nie wszyscy popierają pomysł powierzenia [Root.GetEventAdvisorName] zadania poprawy stosunków z państwem [advisor_liaisons_target_country.GetUsableName]. Wraz z narastającym sprzeciwem na dworze państwa [Root.GetAdjective] [Root.Dip_Advisor.GetName], który wcześniej przyjaźnie rywalizował z [Root.GetEventAdvisorHerHim] o względy [Root.Monarch.GetTitle] [Root.Monarch.GetName], wystąpił z oskarżeniami o nielojalność. [Root.Dip_Advisor.GetSheHeCap] twierdzi, że zbadał działania [Root.GetEventAdvisorName] i odkrył, iż [Root.GetEventAdvisorSheHe] przekazywał [Root.GetEventAdvisorHerHim] tajemnice państwowe państwu [advisor_liaisons_target_country.GetUsableName] pod pretekstem dążenia do zbliżenia.\n\nZ kolei [Root.GetEventAdvisorHerHis] zdaniem dowody przedstawione przeciwko [Root.GetEventAdvisorHerHim] zostały sfabrykowane z zazdrości [Root.Dip_Advisor.GetName] o [Root.GetEventAdvisorHerHis] sukces. [Root.GetEventAdvisorName] protestuje i przysięga, że [Root.GetEventAdvisorSheHeCap] jest lojalny oraz osiągnie pozytywne rezultaty, jeśli [Root.GetEventAdvisorSheHe] otrzyma nasze pełne zaufanie."
 new_court_flavour_events.10.desc.mil: "Nie wszyscy popierają pomysł powierzenia [Root.GetEventAdvisorName] zadania poprawy stosunków z państwem [advisor_liaisons_target_country.GetUsableName]. Wraz z narastającym sprzeciwem na dworze państwa [Root.GetAdjective] [Root.Mil_Advisor.GetName], który wcześniej przyjaźnie rywalizował z [Root.GetEventAdvisorHerHim] o względy [Root.Monarch.GetTitle] [Root.Monarch.GetName], wystąpił z oskarżeniami o nielojalność. [Root.Mil_Advisor.GetSheHeCap] twierdzi, że zbadał działania [Root.GetEventAdvisorName] i odkrył, iż [Root.GetEventAdvisorSheHe] przekazywał [Root.GetEventAdvisorHerHim] tajemnice państwowe państwu [advisor_liaisons_target_country.GetUsableName] pod pretekstem dążenia do zbliżenia.\n\nZ kolei [Root.GetEventAdvisorHerHis] zdaniem dowody przedstawione przeciwko [Root.GetEventAdvisorHerHim] zostały sfabrykowane z zazdrości [Root.Mil_Advisor.GetName] o [Root.GetEventAdvisorHerHis] sukces. [Root.GetEventAdvisorName] protestuje i przysięga, że [Root.GetEventAdvisorSheHeCap] jest lojalny oraz osiągnie pozytywne rezultaty, jeśli [Root.GetEventAdvisorSheHe] otrzyma nasze pełne zaufanie."
 new_court_flavour_events.10.A: "[Root.GetEventAdvisorSheHeCap] cieszy się naszym pełnym zaufaniem."
 new_court_flavour_events.10.A.tt1: "[Root.GetEventAdvisorName] pozostaje lojaln[Root.GetEventAdvisor_AY]."
 new_court_flavour_events.10.A.tt2: "[Root.GetEventAdvisorName] nas zdradza."
 new_court_flavour_events.10.B: "Lepiej nie ryzykować. Aresztować ich!"
 new_court_flavour_events.10.B.tt: "§Y[advisor_liaisons_target_country.GetUsableNameCap]§! może zaprotestować przeciwko takiemu postępowaniu."
 new_court_flavour_events.12.name: "Uciekinier z państwa [From.GetAdjective]!"
 new_court_flavour_events.12.desc: "Pewien człowiek stanął przed [Root.Monarch.GetTitle], nalegając, że musi zostać wysłuchany. Twierdzi, że służył [From.GetRulerAdjAndTitle] i poznał informacje o kluczowym znaczeniu zarówno dla nas, jak i dla państwa [From.GetUsableName]. Podając się za patriotę państwa [Root.GetAdjective], oferuje nam swoje usługi oraz zdobyte wiadomości. Według niego zostały one pozyskane z najwyższych kręgów dworu państwa [From.GetAdjective], a ich przekazanie nam wiązało się z poważnym zagrożeniem dla jego życia."
 new_court_flavour_events.12.A: "Jego usługi zostaną zapamiętane – i wynagrodzone."
 new_court_flavour_events_add_traitor_tooltip_adm: "§Y[Root.advisor_traitor.GetName]§!, doradca administracyjny poziomu [Root.event_advisor_skill_level.GetValue], zostaje dodany do puli doradców."
 new_court_flavour_events_add_traitor_tooltip_dip: "§Y[Root.advisor_traitor.GetName]§!, doradca dyplomatyczny poziomu [Root.event_advisor_skill_level.GetValue], zostaje dodany do puli doradców."
 new_court_flavour_events_add_traitor_tooltip_mil: "§Y[Root.advisor_traitor.GetName]§!, doradca wojskowy poziomu [Root.event_advisor_skill_level.GetValue], zostaje dodany do puli doradców."
 new_court_flavour_events.12.B: "Nie potrzebujemy zdrajców."
 new_court_flavour_events.11.name: "Zdrada"
 new_court_flavour_events.11.desc.adm: "[Root.GetEventAdvisorName] nas zdradził! [Root.Adm_Advisor.GetName] odkrył niepodważalne dowody na to, że [Root.GetEventAdvisorSheHe] przekazywał liczne tajemnice państwowe państwu [advisor_liaisons_target_country.GetUsableName], udając, że reprezentuje nasze interesy. Niestety [Root.GetEventAdvisorSheHe] uciekł za granicę, zanim zdołaliśmy aresztować [Root.GetEventAdvisorHerHim]."
 new_court_flavour_events.11.desc.dip: "[Root.GetEventAdvisorName] nas zdradził! [Root.Dip_Advisor.GetName] odkrył niepodważalne dowody na to, że [Root.GetEventAdvisorSheHe] przekazywał liczne tajemnice państwowe państwu [advisor_liaisons_target_country.GetUsableName], udając, że reprezentuje nasze interesy. Niestety [Root.GetEventAdvisorSheHe] uciekł za granicę, zanim zdołaliśmy aresztować [Root.GetEventAdvisorHerHim]."
 new_court_flavour_events.11.desc.mil: "[Root.GetEventAdvisorName] nas zdradził! [Root.Mil_Advisor.GetName] odkrył niepodważalne dowody na to, że [Root.GetEventAdvisorSheHe] przekazywał liczne tajemnice państwowe państwu [advisor_liaisons_target_country.GetUsableName], udając, że reprezentuje nasze interesy. Niestety [Root.GetEventAdvisorSheHe] uciekł za granicę, zanim zdołaliśmy aresztować [Root.GetEventAdvisorHerHim]."
 new_court_flavour_events.13.name: "Przyłapany na gorącym uczynku"
 new_court_flavour_events.13.desc: "Ambasador państwa [From.GetAdjective] donosi, że władze państwa [From.GetAdjective] aresztowały [Root.GetEventAdvisorName]a, gdy [Root.GetEventAdvisorSheHe] próbował zdradzić nasze zaufanie i zbiec do państwa [From.GetUsableName]. Ambasador zapewnia nas, że nasze tajemnice są bezpieczne, a nasz [Root.GetEventAdvisorTitle] działał bez wiedzy i zgody państwa [From.GetAdjective]."
 new_court_flavour_events.13.option: "Nasza wdzięczność będzie wieczna."
 new_court_flavour_events.15.name: "Uwięziony rodak w państwie [From.GetUsableName]"
 new_court_flavour_events.15.desc: "Dowiedzieliśmy się, że [Root.advisor_traitor.GetName], jeden z naszych rodaków zatrudnionych niegdyś na dworze państwa [From.GetAdjective], jest przetrzymywany w areszcie pod zarzutem planowania wycieku tajemnic państwowych na naszą rzecz. Choć zarzuty wydają się prawdziwe, [Root.Dip_Advisor.GetName] podjął się obrony zatrzymanego i zwrócił się do [Root.Monarch.GetTitle]: „Dlaczego wierny poddany miałby być więziony na obczyźnie?” – pyta [Root.Dip_Advisor.GetSheHe]. „Musimy stanowczo zaprotestować przeciwko temu działaniu i zażądać jego wydania”."
 new_court_flavour_events.15.A: "Nie możemy ich opuścić."
 new_court_flavour_events.15.B: "Nie będziemy się wtrącać."
 new_court_flavour_events.16.name: "Żądania [From.GetAdjective]"
 new_court_flavour_events.16.desc: "[From.GetRulerAdjAndTitle] przysłał nam gniewny list, domagając się wyjaśnień w sprawie aresztowania zdrajcy: „Dowiedzieliśmy się, że przetrzymujecie jednego z naszych rodaków pod zarzutem działania na waszą korzyść z naszego polecenia. Zapewniamy, że to nieprawda. Żądamy natychmiastowego uwolnienia [Root.GetEventAdvisorHerHim]!”"
 new_court_flavour_events.16.A: "Dobrze. Niech tak będzie."
 new_court_flavour_events.16.B: "Nie będziemy działać wbrew sprawiedliwości."
 new_court_flavour_events.17.name: "Odpowiedź [From.GetAdjective]"
 new_court_flavour_events.17.desc: "[From.GetRulerAdjAndTitle] odpowiedział na nasze żądania: „Na znak dobrej woli, pomimo licznych obciążających go dowodów, uwolniliśmy [Root.advisor_traitor.GetName]. Mamy nadzieję, że przychylnie ocenicie ten gest”."
 new_court_flavour_events.17.option: "Tak właśnie należało postąpić."
 new_court_flavour_events.18.name: "Odpowiedź [From.GetAdjective]"
 new_court_flavour_events.18.desc: "[From.GetRulerAdjAndTitle] odpowiedział na nasze żądania: „Nie uwalniamy osób winnych zdrady. [Root.advisor_traitor.GetName] pozostanie w areszcie”."
 new_court_flavour_events.18.option: "Pożałujesz tego."
 opinion_court_events_interfered: "Wtrącanie się w nasze sprawy"
 opinion_court_events_released_compatriot: "Uwolnienie rodaka"
 opinion_court_events_held_compatriot: "Uwięzienie rodaka"
 UNFORTUNATE: "Smutne."
 new_court_flavour_events.20.name: "Wątpliwe praktyki w zakresie wydatków"
 new_court_flavour_events.20.desc: "Wydatki jakie wykazywał[Root.GetEventAdvisor_ANoun] [Root.GetEventAdvisorName] wzbudziły pewne wątpliwości. [Root.GetEventAdvisorSheHeCap] wydawał[Root.GetEventAdvisor_ANoun] duże sumy pieniędzy - znacznie większe, niż do jakich osoba na [Root.GetEventAdvisorHerHis] stanowisku powinna mieć dostęp - rozdając prezenty, które otrzymywała tylko [Root.GetEventAdvisorEstate] w [Root.GetEventAdvisorHerHis] rodzinnym regionie i poprawiając lokalną infrastrukturę. Dochodzenie ujawniło fakty: Zamiast służyć dla [Root.Monarch.GetRulerGen] najlepiej jak potrafi, [Root.GetEventAdvisorName] przelewał[Root.GetEventAdvisor_ANoun] fundusze państwowe do prowincji [corrupt_advisor_province.GetName], aby zwiększyć tam [Root.GetEventAdvisorHerHis] popularność. Chociaż było to dobrodziejstwem dla lokalnej gospodarki, takie praktyki mogą okazać się szkodliwe dla całego państwa, jeśli będą tolerowane."
 new_court_flavour_events.20.A: "Przymknij oko."
 new_court_flavour_events.20.B: "Aresztować [Root.GetEventAdvisorHerHim]!"
 new_court_flavour_events_subsidies: "Lokalne inwestycje"
 desc_new_court_flavour_events_subsidies: "Lokalny dygnitarz inwestuje w infrastrukturę tej prowincji - i we własną popularność wśród mieszkańców."
 new_court_flavour_events.21.name: "Odejście w imię sumienia"
 new_court_flavour_events.21.desc: "Wśród dokumentów [Root.Monarch.GetTitle] odnaleziono list od [Root.GetEventAdvisorName], naszego [Root.GetEventAdvisorTitle].\n\n„Mój [Root.Monarch.GetTitle],\n\nZawsze służyłem wam i państwu [Root.GetUsableName] najlepiej, jak potrafiłem. Z ciężkim sercem muszę jednak ogłosić rezygnację z urzędu [Root.GetEventAdvisorTitle]. Wypowiedzenie wojny państwu [religious_enemy_country.GetUsableName] przekroczyło granicę, której nie mogę zaakceptować. Nie mogę już milczeć w obliczu zbrodni popełnianych przez was przeciwko moim współwyznawcom.\n\nZ poważaniem,\n[Root.GetEventAdvisorName]”\n\nDotychczasowe próby odnalezienia [Root.GetEventAdvisorHerHim] zakończyły się niepowodzeniem. Wygląda na to, że [Root.GetEventAdvisorSheHe] uciekł z kraju."
 new_court_flavour_events.22.name: "Mędrzec z zagranicy"
 new_court_flavour_events.22.desc: "Choć [Root.GetAdjective] szlachta jest nieco zaniepokojona perspektywą zatrudnienia cudzoziemca na dworze [Root.Monarch.GetTitle], nasz [Root.GetEventAdvisorTitle] kultury [Root.advisor_culture.GetCultureName], [Root.GetEventAdvisorName], zdobył powszechne uznanie dzięki wprowadzeniu nowych pomysłów i praktyk na dworze. Wygląda na to, że wciąż możemy się czegoś nauczyć od obcych!"
 new_court_flavour_events.25.name: "Krew jest gęstsza od wody?"
 new_court_flavour_events.25.desc: "Wojna tocząca się pomiędzy nami a państwem [advisor_enemy_country.GetName] wywołała szereg intryg na dworze [Root.GetAdjective]. Z jednej strony, [Root.GetEventAdvisorName], nasz[Root.GetEventAdvisor_ANoun] [Root.advisor_culture.GetCultureName] [Root.GetEventAdvisorTitle], zaoferował[Root.GetEventAdvisor_ANoun] czerpanie informacji z [Root.GetEventAdvisorHerHis] sieci kontaktów w [advisor_enemy_country.GetGovNameIns] [advisor_enemy_country.GetAdjective] - znaczącej sieci, jak [Root.GetEventAdvisorSheHe] twierdzi, w tym kilka bliskich kontaktów [advisor_enemy_country.Monarch.GetTitle] - aby wspomóc wysiłki wojenne.\n\nZ drugiej strony, [Root.GetEventAdvisorHerHis] przeciwnicy polityczni mają wątpliwości co do [Root.GetEventAdvisorHerHis] lojalności. Argumentują, że pomimo wcześniejszej wzorowej służby, po prostu nie możemy [Root.GetHerHim_dat] ufać, że kultura [Root.advisor_culture.GetCultureName] weźmie udział w obradach o znaczeniu krajowym w tym czasie. Dlatego żądają, aby [Root.GetEventAdvisorSheHe] został[Root.GetEventAdvisor_ANoun] wyrzucon[Root.GetEventAdvisor_AY] z dworu."
 new_court_flavour_events.25.A: "Mają rację - wygnaj [Root.GetEventAdvisorHerHim]!"
 new_court_flavour_events.25.B: "Zachowaj [Root.GetEventAdvisorHerHis] informację - [Root.GetEventAdvisorSheHe] będzie przydatn[Root.GetEventAdvisor_AY]."
 tooltip_in_30_days: "W ciągu 30 dni:\n"
 new_court_flavour_events.26.name: "Doniesienia o planach wojennych państwa [advisor_enemy_country.GetAdjective]"
 new_court_flavour_events.26.desc: "Pomimo wątpliwości dotyczących [Root.GetEventAdvisorHerHis] lojalności [Root.GetEventAdvisorName] najwyraźniej dotrzymał [Root.GetEventAdvisorHerHis] słowa. Nadeszły pierwsze raporty z [Root.GetEventAdvisorHerHis] sieci kontaktów, dostarczając nam wielu informacji o planach wojennych państwa [advisor_enemy_country.GetAdjective]."
 new_court_flavour_events.27.name: "Uciekinier z państwa [From.GetAdjective]!"
 new_court_flavour_events.27.desc: "Pewien człowiek stanął przed [Root.Monarch.GetTitle], nalegając, że musi zostać wysłuchany. Twierdzi, że służył [From.GetRulerAdjAndTitle] i poznał szczegóły planów wojennych państwa [From.GetAdjective] przeciwko jego ojczyźnie, państwu [Root.GetUsableName]. Podając się za patriotę państwa [Root.GetAdjective], oferuje nam swoje usługi oraz zdobyte informacje. Według niego zostały one pozyskane z najwyższych kręgów dworu państwa [From.GetAdjective], a ich przekazanie nam wiązało się z poważnym zagrożeniem dla jego życia."
 new_court_flavour_events.27.option: "Jego usługi zostaną zapamiętane – i wynagrodzone."
 new_court_flavour_events.28.name: "Zdrada"
 new_court_flavour_events.28.desc: "[Root.GetEventAdvisorName] nas zdradził! Pomimo czujnego nadzoru ze strony [Root.GetEventAdvisorHerHis] wrogów, [Root.GetEventAdvisorSheHe] zdołał przekroczyć granicę, zabierając ze sobą kopie ważnych dokumentów dotyczących naszych planów wojennych!"
 new_court_flavour_events.30.name: "Zmiana polityki?"
 new_court_flavour_events.30.desc: "[Root.GetEventAdvisorName] zyskał[Root.GetEventAdvisor_ANoun] wielu przyjaciół na dworze [Root.GetAdjective] dzięki oddanej służbie jako [Root.GetEventAdvisorTitle] [Root.Monarch.GetRulerGen]. Wygląda jednak na to, że wśród [Root.GetEventAdvisorHerHis] rodaków w służbie [advisor_antiliaisons_target_country.GetStateForm_gen][advisor_antiliaisons_target_country.GetAdjective] jest równie odwrotnie: Zazdrośni o [Root.GetEventAdvisorHerHis] pozycję, zarzucają [Root.GetEventAdvisor_HerHim_dat] podjęcie pracy u swoich wrogów i zaczęli rozpowszechniać plotki podające w wątpliwość [Root.GetEventAdvisorHerHis] wiarygodność.\n\nMartwiąc się o swoją pozycję w rządzie [Root.GetAdjective], [Root.GetEventAdvisorName] stał[Root.GetEventAdvisor_ANoun] się zdecydowanym przeciwnikiem [advisor_antiliaisons_target_country.GetRulerAdjAndTitle_gen]. [Root.GetEventAdvisorSheHeCap] nawiązał[Root.GetEventAdvisor_ANoun] współpracę z kilkoma podobnie myślącymi [Root.GetNoblemenPoliticians_ins], aby wezwać do ostrzejszego stanowiska wobec [advisor_antiliaisons_target_country.GovernmentName] [advisor_antiliaisons_target_country.GetAdjective]."
 new_court_flavour_events.30.A: "[Root.GetEventAdvisorSheHeCap] ma rację - potrzebna jest zmiana polityki."
 new_court_flavour_events.30.B: "Gorsze relacje nie byłyby w naszym interesie."
 new_court_flavour_events.31.name: "Wścibski doradca"
 new_court_flavour_events.31.desc: "Nasze oczy i uszy w [From.GetGovNameIns] [From.GetAdjective] donoszą, że [From.GetRulerAdjAndTitle] zajmuje ostatnio ostrzejsze stanowisko wobec [Root.GetGovNameGen] [Root.GetAdjective]. Wygląda na to, że ta zmiana polityki została spowodowana w dużej mierze przez nasz[From.GetEventAdvisor_AEgo] [From.GetEventAdvisorTitle_CL], któr[From.GetEventAdvisor_AY] martwiąc się o swoją pozycję w rządzie [From.GetAdjective], wysuwał[From.GetEventAdvisor_ANoun] przeciwko nam różne oskarżenia i agitował[From.GetEventAdvisor_ANoun] za zdecydowaną odpowiedzią na nasze rzekome agresje."
 new_court_flavour_events.31.option: "Mały zdrajca!"
 new_court_flavour_events.32.name: "Wścibski doradca"
 new_court_flavour_events.32.desc: "Pomimo naszego braku wsparcia dla [Root.GetEventAdvisorHerHis] projektu mającego na celu zasianie niezgody w stosunkach [Root.GetGovNameGen] [Root.GetAdjective] z nami to [Root.GetEventAdvisorName] nie zaprzestał[Root.GetEventAdvisor_ANoun] swoich wysiłków. Wygląda na to, że [Root.GetEventAdvisorSheHe] przyciąga wielu wpływowych [Root.GetNoblemenPoliticians_gen], którzy popierają [Root.GetEventAdvisorHerHis] stanowisko i pilnie wzywają do zmiany polityki. Rozpowszechniają swoje przesłanie, które wydaje się silnie rezonować wśród zwykłych ludzi, wszelkimi dostępnymi im środkami. Działanie wbrew ich woli może okazać się ryzykowne."
 new_court_flavour_events.32.A: "Może jednak [Root.GetEventAdvisorSheHe] ma rację."
 new_court_flavour_events.32.B: "Nie oznacza nie."
 advisor_antiliaisons: "Twarde stanowisko"
 advisor_spurious_accusations: "Bezpodstawne oskarżenia"
 new_court_flavour_events.35.name: "Wygnanie z [exile_country.GetAdjective]"
 new_court_flavour_events.35.desc: "[Root.fleeing_advisor.GetName], wygnaniec polityczny z [exile_country.GetGovNameGen] [exile_country.GetAdjective], pojawił się na naszym dworze. Twierdzi, że jest [Root.GetExileAdvisorAAnTitle] i oferuje swoje usługi dla [Root.GetStateForm_gen] [Root.GetAdjective] w zamian za ochronę przed władzą [exile_country.GetRulerAdjAndTitle_gen]. Czy powinniśmy go przyjąć?"
 new_court_flavour_events.35.A: "Jego usługi będą przydatne."
 new_court_flavour_events.35.B: "Nie mamy dla niego miejsca."
 new_court_flavour_events.36.name: "Wygnańcy z państwa [exile_country.GetAdjective]"
 new_court_flavour_events.36.desc: "[Root.fleeing_advisor.GetName] jest wdzięczny za udzielenie mu azylu na dworze państwa [Root.GetAdjective]. Ostatnio zwrócił jednak uwagę, że w podobnej sytuacji znajduje się wielu innych dostojników z państwa [exile_country.GetAdjective] – jak twierdzi, są to „ludzie wielkiej mądrości i wpływów”. Warto rozważyć przyjęcie ich na nasz dwór, jeśli zechcemy zintensyfikować działania przeciwko ambicjom państwa [exile_country.GetAdjective]."
 new_court_flavour_events.36.A: "Przyjmiemy ich."
 new_court_flavour_events.36.B: "Nie mamy miejsca dla kolejnych wygnańców."
 new_court_flavour_events.37.name: "Wygnańcy w państwie [From.GetUsableName]"
 new_court_flavour_events.37.desc: "Nasze oczy i uszy na dworze [From.GetAdjective] donoszą, że [From.GetRulerTitleOrRegency] przyj[From.GetRulerTitleOrRegency_EndPast] wielu wrogów politycznych nasz[Root.Monarch.GetEjEgo], [Root.Monarch.GetRulerGen], którzy wcześniej zostali wygnani z dworu [Root.GetAdjective] lub zdecydowali się szukać możliwości gdzie indziej. Obecnie naciskają oni na podjęcie zdecydowanych działań przeciwko obecnemu 'reżimowi' i zapewniają aktywną pomoc dla [From.GetRulerAdjAndTitle_gen] w osiągnięciu tego celu."
 new_court_flavour_events.37.option: "Jakim prawem!"
 opinion_took_in_exiles: "Przyjęcie wygnańców"
 opinion_turned_away_exiles: "Odmowa przyjęcia wygnańców"
 opinion_hosting_exiles: "Udzielenie schronienia wygnańcom"
 new_court_flavour_events.39.name: "Herezja w państwie [heathen_advisor_country.GetName]"
 new_court_flavour_events.39.desc: "Dotarły do nas wieści, że [heathen_advisor_country.GetRulerAdjAndTitle] udziela schronienia heretykowi na [heathen_advisor_country.Monarch.GetHerHis] dworze. [heathen_advisor_country.Monarch.GetHerHisCap] [heathen_advisor_country.GetEventAdvisorTitle], [heathen_advisor_country.GetEventAdvisorName], odrzucił nauki papieża i otwarcie wyznaje wiarę [heathen_advisor_country.advisor_religion.GetReligionName], szerząc przy tym podłe kłamstwa na temat Jego Świątobliwości."
 new_court_flavour_events.39.A: "Niedopuszczalne! Musimy złożyć protest."
 new_court_flavour_events.39.B: "Przymkniemy na to oko."
 new_court_flavour_events.40.name: "Żądania [PAP.Monarch.GetTitle]"
 new_court_flavour_events.40.desc: "Przybył wysłannik papieski. Z poważną miną przekazał nam wiadomość: „Jego Świątobliwość [PAP.Monarch.GetTitle] [PAP.Monarch.GetName] dowiedział się, że udzielacie schronienia heretykowi na swoim dworze. Żądamy wydania [Root.GetEventAdvisorHerHim] inkwizycji. Jeśli tego nie uczynicie, papież uzna, że porzuciliście Prawdziwą Wiarę, i będzie zmuszony podjąć wszelkie niezbędne działania przeciwko wam”."
 new_court_flavour_events.40.A: "Wydajcie [Root.GetEventAdvisorHerHim]."
 new_court_flavour_events.40.B: "Nie ulegniemy papieskiej presji."
 new_court_flavour_events.41.name: "Państwo [heathen_advisor_country.GetUsableName] spełnia nasze żądania"
 new_court_flavour_events.41.desc: "[heathen_advisor_country.GetRulerAdjAndTitle] przeprasza za zatrudnienie heretyka. Zostanie on dostarczony do nas w kajdanach, a jego kłamstwa na zawsze ucichną!"
 new_court_flavour_events.41.A: "Doskonale."
 new_court_flavour_events.42.name: "Państwo [heathen_advisor_country.GetUsableName] sprzeciwia się naszej władzy"
 new_court_flavour_events.42.desc: "[heathen_advisor_country.GetRulerAdjAndTitle] wyraża oburzenie naszym żądaniem, które [heathen_advisor_country.Monarch.GetSheHe] uważa za przekroczenie naszych uprawnień – jak gdyby papież nie był najwyższym arbitrem we wszystkich sprawach duchowych świata chrześcijańskiego. Zło naprawdę zapanowało w państwie [heathen_advisor_country.GetUsableName]."
 new_court_flavour_events.42.A: "Zostali sprowadzeni na manowce."
 opinion_interfering_pope: "Wtrącanie się papieża"
 opinion_bowed_to_papal_demand_advisor: "Uległość wobec żądań papieża"
 handed_over_heretic: "Wydanie heretyka"
 desc_handed_over_heretic: "Heretycy wiedzą, że powinni obawiać się władcy popierającego papieskie prześladowania ich wyznawców."
 opinion_rejected_papal_demand_advisor: "Udzielanie schronienia heretykowi"
