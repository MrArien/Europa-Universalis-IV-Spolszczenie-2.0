 ans_fayencemanufaktur: "Manufaktura fajansu w Ansbachu"
 ans_fayencemanufaktur_desc: "Dzięki manufakturom możemy się wzbogacić. Nasi rzemieślnicy skopiowali stosowane gdzie indziej techniki produkcji porcelany, a następnie opracowali własny, ansbachski styl wyrobów ceramicznych."
 BYT_ideas: "Idee Bayreuthu"
 BYT_ideas_start: "Tradycje Bayreuthu"
 BYT_ideas_bonus: "Ambicja Bayreuthu"
 byt_land_of_the_hohenzollerns: "Margrabstwo Hohenzollernów"
 byt_land_of_the_hohenzollerns_desc: "Choć nie posiadamy rozległych ziem, nasza dynastia zabezpieczyła posiadłości na obszarze całego Świętego Cesarstwa Rzymskiego, przede wszystkim w elektoracie Brandenburgii. Jeśli zadbamy o bliskie i dobre stosunki z naszymi kuzynami w Brandenburgii, książęta i możnowładcy z odległych zakątków Cesarstwa będą chcieli nawiązać z nami kontakty dyplomatyczne."
 byt_ordre_de_la_sincerite: "Ordre de la Sincérité"
 byt_ordre_de_la_sincerite_desc: "Ustanowienie nowego orderu i odznaczanie nim zasłużonych generałów oraz możnych zwiąże ich z nami silniejszymi więzami i zwiększy ich gotowość do gorliwej walki w naszych wojnach. Z tego powodu nazwiemy go Ordre de la Sincérité – Orderem Szczerości – a medal ozdobimy czerwonym orłem."
 byt_gravenreuther_stift: "Fundacja Gravenreuthera"
 byt_gravenreuther_stift_desc: "Jeden z naszych możnych zapisał w testamencie, że z jego majątku ma zostać ufundowany szpital dla rannych. Jeśli wesprzemy tę dobroczynną inicjatywę, nasi ranni żołnierze będą szybciej wracać do zdrowia po wojnach, co pozwoli nam prowadzić bardziej agresywną politykę."
 byt_margravial_opera_house: "Opera Margrabiów"
 byt_margravial_opera_house_desc: "Wielu uważało, że w prowincjonalnym mieście nie da się wznieść wspaniałej opery. Udowodniliśmy jednak, że jest inaczej, łącząc kwintesencję francuskiego i włoskiego baroku. Gdy wchodzi się do budynku od frontu, przy dźwiękach fanfar, przez wejście wzorowane na klasycznej świątyni, trafia się do nierealnego świata – krainy poezji."
 NUM_ideas: "Norymberskie idee"
 NUM_ideas_start: "Norymberskie tradycje"
 NUM_ideas_bonus: "Norymberska ambicja"
 num_imperial_regalia: "Insygnia cesarskie"
 num_imperial_regalia_desc: "W 1423 roku cesarz Zygmunt powierzył Norymberdze insygnia cesarskie, by przechowywała je na wieczność. Teraz, gdy sprowadziliśmy je do naszego miasta, ukryte w beczkach z rybami, aby zapobiec ich kradzieży, pokażmy światu naszą wielkość i wieczną chwałę!"
 num_nuremberg_castle: "Zamek norymberski"
 num_nuremberg_castle_desc: "W 1427 roku rada naszego miasta kupiła od Hohenzollernów ruiny zamku burgrabiego. Teraz cały zamek należy do miasta, dlatego odnowimy go, a następnie wykorzystamy koszary i stajnię cesarską do zakwaterowania naszych żołnierzy."
 num_nuremberg_chronicle: "Kronika norymberska"
 num_nuremberg_chronicle_desc: "Wśród naszych obywateli są wybitni uczeni, tacy jak Hartmann Schedel, autor ilustrowanej parafrazy Biblii i historii świata. Kronika nazwana na cześć naszego miasta jest poszukiwana w całej Europie. Nasza wiedza o świecie jest naprawdę rozległa!"
 num_rostbratwurst: "Rostbratwurst"
 num_rostbratwurst_desc: "Nasza kiełbasa należy do najlepszych i najsłynniejszych w Cesarstwie, a jej receptura była doskonalona przez stulecia tradycji. Uregulujmy wielkość i cenę naszej kiełbasy Rostbratwurst, aby zwiększyć wydajność produkcji!"
 num_franconian_center_of_reformation: "Frankońskie centrum reformacji"
 num_franconian_center_of_reformation_desc: "Mieszkańcy Norymbergi zawsze byli otwarci na nowe idee i z pewnością wysłuchają mądrości głoszonej przez najbardziej oświeconych kaznodziejów naszych czasów."
 num_christkindlmarkt: "Jarmark Dzieciątka Jezus"
 num_christkindlmarkt_desc: "Wy, panowie i panie, którzy niegdyś byliście dziećmi,\nStańcie się nimi znów dzisiaj i radujcie się jak one.\nDzieciątko Jezus zaprasza na swój jarmark,\nA każdy, kto przybędzie, będzie tu mile widziany."
 num_nuremberg_exchange: "Giełda norymberska"
 num_nuremberg_exchange_desc: "Od stuleci jesteśmy ośrodkiem handlu w sercu Europy, co przyniosło naszym obywatelom bogactwo i dobrobyt. Aby zabezpieczyć naszą pozycję handlową na przyszłość, założymy Giełdę Norymberską na rynku naszej stolicy. Dzięki temu kupcy z Antwerpii, Wenecji, Gdańska i Lyonu będą przybywać do naszego miasta. Publicznie dostępne wagi i kursy wymiany zapobiegną konfliktom między kupcami i pozwolą je rozwiązywać."
 BAM_ideas: "Bamberskie idee"
 BAM_ideas_start: "Bamberskie tradycje"
 BAM_ideas_bonus: "Bamberska ambicja"
 bam_bishop_of_bamberg: "Biskup Bambergu"
 bam_bishop_of_bamberg_desc: "Cesarz Henryk IV ustanowił diecezję bamberską podczas synodu we Frankfurcie w 1007 roku. Ponieważ jesteśmy również dyrektorem okręgu frankońskiego, możemy prowadzić niezależną politykę w sprawach świeckich w naszym regionie."
 bam_cathedral: "Katedra w Bambergu"
 bam_cathedral_desc: "Nasza katedra, której początki sięgają 1004 roku, jest nie tylko miejscem spoczynku cesarza Henryka II i jego małżonki Kunegundy, lecz także jedynym zachowanym grobem papieża w Niemczech. Papież Klemens II, dawny biskup Bambergu, darzył miasto wielkim uczuciem i pozostał jego biskupem także podczas pontyfikatu. Dlatego zażyczył sobie, by pochowano go właśnie tutaj."
 bam_city_of_beer: "Miasto piwa"
 bam_city_of_beer_desc: "Od wprowadzenia przywileju warzenia piwa na własny użytek liczba browarów gwałtownie wzrosła. Niektórzy nadużywają jednak tego przywileju i sprzedają piwo zanieczyszczone. Ogłośmy zatem, że do produkcji naszego piwa wolno używać wyłącznie słodu, chmielu i wody!"
 bam_little_venice: "Mała Wenecja"
 bam_little_venice_desc: "W pobliżu rzeki Regnitz powstało już wiele nowych domów wzniesionych tuż nad wodą. Nasi mieszkańcy używają nawet niewielkich gondoli do transportu i handlu. Powinniśmy zachęcić kolejnych osadników do zamieszkania w tej okolicy, wzorowanej na Wenecji."
 bam_witch_burner: "Pogromca czarownic"
 bam_witch_burner_desc: "„Jeśli ktoś szkodził ludziom za pomocą czarów lub działał na ich niekorzyść, należało ukarać go śmiercią, a karę wykonać przez spalenie na stosie”."
 bam_vierzehnheiligen: "Vierzehnheiligen"
 bam_vierzehnheiligen_desc: "Według miejscowych podań pewien pasterz miał wizje dzieci, które nazywały siebie Czternastoma Świętymi Wspomożycielami i dokonywały licznych cudów, uzdrawiając nawet śmiertelnie chorych. Wzniesiona ku pamięci tych objawień bazylika szybko stała się popularnym celem pielgrzymek z całych Niemiec."
 bam_university: "Universitas Ottoniano Fridericiana"
 bam_university_desc: "Dotychczas Academia Bambergensis obejmowała jedynie wydziały teologii i filozofii. Rozbudujemy nasz uniwersytet, dodając wydziały prawa i medycyny. Odtąd uczelnia będzie nosić imiona swojego założyciela, biskupa księcia Ottona z Salzburga, oraz swojego dobroczyńcy, Fryderyka von Seinsheima."
 GER_ideas: "Idee Cesarstwa Niemieckiego"
 GER_ideas_start: "Tradycje Cesarstwa Niemieckiego"
 GER_ideas_bonus: "Ambicja Cesarstwa Niemieckiego"
 ger_german_confederation: "Związek Niemiecki"
 ger_german_confederation_desc: "Teraz, gdy ziemie niemieckie zostały zjednoczone, odkryliśmy, że więcej nas łączy, niż dzieli. Możemy wykorzystać tę wspólnotę, aby zapewnić pokój i stabilność w naszym państwie."
 ger_german_universities: "Uniwersytety Niemiec"
 ger_german_universities_desc: "Na obszarze naszego państwa działa wiele uniwersytetów, z których każdy może dostarczyć nam wybitnych umysłów z całej Europy Środkowej. Dzięki temu nasze możliwości modernizacji państwa są niezrównane. Ludzie tłumnie zgłaszają się do naszej administracji, by pomóc nam zjednoczyć pozostałe części Niemiec i realizować wspólne cele."
 ger_reichsheer: "Reichsheer"
 ger_reichsheer_desc: "Zjednoczone państwo niemieckie potrzebuje armii narodowej, którą właśnie powołaliśmy pod nazwą Reichsheer. W czasach Świętego Cesarstwa Rzymskiego była to jedynie niewielka siła zbrojna, lecz w nowych Niemczech nasza armia będzie potężna i dobrze wyszkolona, złożona z ludzi ze wszystkich części kraju."
 ger_new_hanseatics: "Nowa Liga Hanzeatycka"
 ger_new_hanseatics_desc: "Zanim Niemcy zostały zjednoczone pod jednym sztandarem, wiele miast północnych Niemiec należało do Hanzy – związku handlowego, w ramach którego miasta pomagały sobie wzajemnie pomnażać bogactwo i zapewniać bezpieczeństwo. Choć koncepcję tę trzeba będzie dostosować do nowych realiów, możemy wykorzystać jej dziedzictwo, by rozwijać handel i więzi między różnymi częściami naszego państwa."
 ger_junkers: "Niemieccy junkrzy"
 ger_junkers_desc: "Położyliśmy kres rozdrobnieniu Niemiec w ramach Świętego Cesarstwa Rzymskiego i wielkiej potędze politycznej tamtejszej szlachty, lecz arystokracja nadal stanowi cenne źródło kompetentnych oficerów dla naszych armii. Możemy wykorzystać ten potencjał, kierując szlachtę ku innym dziedzinom działalności, a jednocześnie tworząc silną elitę wojskową."
 ger_reichstag: "Reichstag"
 ger_reichstag_desc: "Zgodnie z tradycją sięgającą głęboko w średniowiecze, którą dostosowaliśmy do nowych Niemiec, ważni dostojnicy naszego rozległego państwa spotykają się na Sejmie Rzeszy, by wspólnie omawiać problemy i podejmować decyzje u boku cesarza, dla dobra zjednoczonego kraju. Pozwala nam to przekształcić różnorodną mozaikę dawnych państw niemieckich w jedno spójne państwo."
 ger_eisen_und_kohle: "Żelazo i węgiel"
 ger_eisen_und_kohle_desc: "Nasze rozległe złoża żelaza i węgla pozwoliły nam szybko przekształcić kraj w tętniące życiem państwo przemysłowe. Dzięki pracowitości i wiedzy technicznej możemy wytwarzać potrzebne towary szybciej i po niższych cenach."
 HLR_ideas: "Idee Świętego Cesarstwa Rzymskiego"
 HLR_ideas_start: "Tradycje Świętego Cesarstwa Rzymskiego"
 HLR_ideas_bonus: "Ambicja Świętego Cesarstwa Rzymskiego"
 hlr_imperial_throne: "Tron cesarski"
 hlr_imperial_throne_desc: "W 800 roku n.e. papież Leon koronował Karola Wielkiego na „cesarza Rzymian”, zapoczątkowując linię władców, do której również należymy. Przez kolejne stulecia na cesarskim tronie zasiadało wielu mężów odznaczających się odwagą i mądrością."
 hlr_kaiserliche_armee: "Kaiserliche Armee"
 hlr_kaiserliche_armee_desc: "Cesarstwo posiada własną armię od czasu Sejmu Rzeszy z 1422 roku w Norymberdze. Teraz, gdy jesteśmy zjednoczeni nie tylko z nazwy, lecz także w praktyce, rozbudujemy ją w potężną i dobrze wyszkoloną siłę, wierną wyłącznie sztandarowi cesarza."
 hlr_imperial_diplomacy: "Cesarska dyplomacja"
 hlr_imperial_diplomacy_desc: "Umiejętności naszego korpusu dyplomatycznego nie mają sobie równych. Jako cesarze Świętego Cesarstwa Rzymskiego od stuleci przyjmowaliśmy poddanych i traciliśmy ich, dzięki czemu nasi dyplomaci zgromadzili ogromną wiedzę przekazywaną z pokolenia na pokolenie."
 hlr_centralised_empire: "Centralizacja cesarstwa"
 hlr_centralised_empire_desc: "Po zjednoczeniu Cesarstwa nasza władza stała się bardziej scentralizowana. Ograniczyło to wpływy lokalnych władców, pozwalając nam kierować większą część bogactwa państwa do własnego skarbca."
 hlr_roman_heritage: "Dziedzictwo Rzymu"
 hlr_roman_heritage_desc: "Jako Święte Cesarstwo Rzymskie rościmy sobie prawo do dziedzictwa sięgającego czasów Augusta, pierwszego cesarza Rzymu. Teraz, gdy zjednoczyliśmy nasze ziemie w jedno scentralizowane państwo, nadszedł czas, by przywrócić dawną chwałę Rzymu i ponownie zjednoczyć ziemie, które niegdyś do niego należały."
 hlr_adopting_the_goosestep: "Przyjęcie pruskiego kroku"
 hlr_adopting_the_goosestep_desc: "Oficerowie z Brandenburgii zdobyli wpływowe stanowiska w naszej armii. Stopniowo przyjmujemy wiele ich tradycji wojskowych, dążąc do stworzenia armii, której nie dorówna żadna inna."
 hlr_onwards_and_upwards: "Naprzód i wzwyż"
 hlr_onwards_and_upwards_desc: "Nasza administracja cesarska, ukształtowana przez stulecia negocjacji między cesarzem a jego książętami, jest teraz wszechstronną i sprawnie działającą machiną, zdolną do włączania rozległych i zróżnicowanych terytoriów w granice naszego państwa. Wreszcie możemy wypełnić nasze przeznaczenie i stać się siłą zdolną zjednoczyć całą Europę."
 SPI_ideas: "Sardyńsko-piemonckie idee"
 SPI_ideas_start: "Sardyńsko-piemonckie tradycje"
 SPI_ideas_bonus: "Sardyńsko-piemoncka ambicja"
 spi_defensive_prowess: "Mistrzostwo w obronie"
 spi_defensive_prowess_desc: "Od Francuzów w Sabaudii i Piemoncie po Hiszpanów na Sardynii – nasze ziemie od dawna kuszą sąsiadów o ekspansjonistycznych ambicjach. Chroniąc przez lata naszą suwerenność, udoskonaliliśmy techniki fortyfikacyjne i opanowaliśmy sztukę obrony twierdz."
 spi_flexibility: "Dyplomatyczna elastyczność"
 spi_flexibility_desc: "Położeni między silniejszymi mocarstwami i nieustannie zagrożeni popadnięciem pod ich wpływy, musieliśmy prowadzić zręczną dyplomację – niektórzy nazwaliby ją bezwstydnym oportunizmem – aby chronić niepodległość i szukać nowych sposobów rozwoju państwa. Choć tradycjonaliści mogą się tym brzydzić, oportunizm ma swoje zalety."
 spi_royal_sardinian_army: "Królewska Armia Sardyńska"
 spi_royal_sardinian_army_desc: "Złoty wiek najemników przeminął, a nasza armia musi dostosować się do nowych czasów. Dzięki reformom profesjonalizacyjnym możemy stworzyć stałą armię zdolną do projekcji naszej siły za granicą – we Włoszech i w całej Europie."
 spi_centralized_state: "Państwo scentralizowane"
 spi_centralized_state_desc: "Naśladując na własnych ziemiach metody i rozwiązania stosowane przez największe mocarstwa Europy, możemy przekształcić Sardynię-Piemont w potęgę zdolną zdominować Włochy i utrzymać silną pozycję na arenie europejskiej."
 spi_piedmontese_manufacturing: "Piemontskie manufaktury"
 spi_piedmontese_manufacturing_desc: "Położeni na ważnym szlaku handlowym między Wenecją a Francją, mamy dostęp do wielu rynków zbytu dla naszych wyrobów. Przyjmując najnowsze rozwiązania opracowane gdzie indziej, możemy zwiększyć produkcję i sprowadzić na nasze ziemie obfite bogactwo."
 spi_risorgimento: "Risorgimento"
 spi_risorgimento_desc: "Od upadku Rzymu Włochy nie były zjednoczone, lecz idea zjednoczonej Italii nigdy nie umarła. Teraz, gdy marzenie to odżywa, staliśmy się jednym z głównych chorążych nadziei i aspiracji włoskiego narodu."
 EPI_ideas: "Epirskie idee"
 EPI_ideas_start: "Epirskie tradycje"
 EPI_ideas_bonus: "Epirska ambicja"
 epi_pyrrhus: "Dziedzictwo Pyrrusa"
 epi_pyrrhus_desc: "Dzięki swoim zwycięstwom król Pyrrus zapewnił nam miejsce w historii. Budził postrach wśród Rzymian, Sycylijczyków i Greków, a jego wspaniałe dokonania stały się wzorem dla naszych generałów, którzy studiują je i starają się je naśladować. Choć od jego czasów minęły stulecia, marzenia o powrocie dawnej chwały wciąż żyją, a my aktywnie dążymy do ich spełnienia."
 epi_chronicle_of_the_toco: "Kronika rodu Tocco"
 epi_chronicle_of_the_toco_desc: "Kronika rodu Tocco opisuje nasz awans do rangi Despotatu Epiru, sprawiedliwe rządy, więzi z Cesarstwem oraz podboje okolicznych ziem. Powinniśmy ją opublikować w przystępnej odmianie języka greckiego, aby wszyscy mogli ją przeczytać i docenić."
 epi_serbs_and_albanians: "Plemiona albańskie i serbskie"
 epi_serbs_and_albanians_desc: "Choć rdzenne państwo epirockie zostało ponownie zjednoczone, na jego terytoriach wciąż żyje wiele plemion serbskich i albańskich, które niegdyś tworzyły własne niewielkie księstwa. Zamiast je odtrącać, powinniśmy wykorzystać ich potencjał, by wzmocnić nasze siły zbrojne."
 epi_latin_knights: "Rycerze łacińscy"
 epi_latin_knights_desc: "Elitę naszej armii nadal stanowią kawalerzyści uzbrojeni i wyszkoleni na sposób zachodni. Niektórzy są rodowitymi Grekami, inni włoskimi najemnikami, lecz wszyscy doskonale wykonują swoje zadania."
 epi_metropolis_of_knowledge: "Metropolia wiedzy"
 epi_metropolis_of_knowledge_desc: "Janina, znana od czasów bizantyjskich jako Metropolia Wiedzy, staje się ośrodkiem rozwijającego się greckiego oświecenia, do którego przenikają zachodnie idee i myśl filozoficzna. Zawsze byliśmy bramą łączącą Grecję z Zachodem, dlatego powinniśmy przyjąć ten trend z otwartymi ramionami."
 epi_trade_influences: "Węzeł handlowy Adriatyku"
 epi_trade_influences_desc: "Nasze państwo leży na styku wielkich regionów handlowych Wenecji, Raguzy, Konstantynopola i Aleksandrii. Dzięki temu staliśmy się tętniącym życiem ośrodkiem handlu i tyglem wielu kultur. Możemy obrócić tę sytuację na naszą korzyść."
 epi_unity_in_strength: "Jedność daje siłę"
 epi_unity_in_strength_desc: "Nasze greckie dziedzictwo wojskowe stanowi źródło naszej siły. Czerpiąc z doświadczeń Greków, Rzymian, Bizantyjczyków i krzyżowców, stworzyliśmy jedne z najlepiej wyszkolonych armii w Europie."
 LOT_ideas: "Lotaryńskie idee "
 LOT_ideas_start: "Lotaryńskie tradycje"
 LOT_ideas_bonus: "Lotaryńska ambicja"
 lot_legacy_of_the_carolingians: "Dziedzictwo Karolingów"
 lot_legacy_of_the_carolingians_desc: "Jako nowi pretendenci do korony Lotaryngii czerpiemy legitymizację z dziedzictwa Karola Wielkiego i Lotara. Dzięki naszemu patronatowi czyny przodków ponownie stały się powszechnie znane zarówno wśród naszego ludu, jak i na dworach całej Europy."
 lot_glory_of_charlemagne: "Chwała Karola Wielkiego"
 lot_glory_of_charlemagne_desc: "Wspaniałe czyny władców Lotaryngii – od Karola Wielkiego i Lotara po Filipa Dobrego – zapisały się w pamięci naszego ludu i naszych żołnierzy. Pod naszym przywództwem zniosą wszelkie trudy, by pomóc nam przywrócić dawną chwałę."
 lot_dutch_cities: "Bogactwo Niderlandów"
 lot_dutch_cities_desc: "Miasta Niderlandów zgromadziły ogromne bogactwa dzięki handlowi. Jako ich łaskawi władcy powinniśmy wspierać ich rozwój i pomóc im zbudować imperium handlowe, z którego będziemy mogli czerpać korzyści."
 lot_carolingian_renaissance_II: "Nowy renesans karoliński"
 lot_carolingian_renaissance_II_desc: "Przed wiekami jedność zapewniona przez Imperium Karolińskie oraz reformy edukacyjne jego władców doprowadziły do odrodzenia wiedzy utraconej w poprzedzających je wiekach ciemnych. Naśladując ich politykę, możemy również wspierać rozprzestrzenianie się nowych idei i technologii, które przyniosą korzyści naszemu państwu."
 lot_court_of_europe: "Dwór Europy"
 lot_court_of_europe_desc: "Nasz dwór należy do najbardziej znamienitych w całej Europie. Najmądrzejsi, najodważniejsi i najznamienitsi tłumnie przybywają, by dołączyć do naszego wspaniałego otoczenia."
 lot_land_of_abbeys: "Kraina biskupów"
 lot_land_of_abbeys_desc: "Podczas ekspansji mającej na celu odtworzenie Lotaryngii włączyliśmy do naszego państwa wiele biskupstw. Choć ich władza znacznie osłabła, odkąd przestały być samodzielnymi organizmami politycznymi, nadal mają duży wpływ na sprawy Kościoła. Zapewniając sobie ich lojalność, możemy zachować znaczący głos w sprawach duchowieństwa."
 lot_european_empire: "Europa Universalis Imperii"
 lot_european_empire_desc: "Karol Wielki na krótko zjednoczył pod swoim panowaniem znaczną część Europy. Naszym przeznaczeniem jest dokończyć jego dzieło i przywrócić na kontynencie jedność, jaką ostatnio widziano w czasach Rzymu."
 FKN_ideas: "Frankońskie idee"
 FKN_ideas_start: "Frankońskie tradycje"
 FKN_ideas_bonus: "Frankońska ambicja"
 fkn_duchy_restored: "Przywrócone księstwo"
 fkn_duchy_restored_desc: "Po kilku stuleciach przerwy ponownie ustanowiliśmy pod naszym panowaniem Księstwo Frankonii. Nikt nie może już wątpić, że należymy do najpotężniejszych państw Niemiec."
 fkn_main_trading: "Handel nad Menem"
 fkn_main_trading_desc: "Szlak handlowy z Wiednia do Norymbergi, a następnie wzdłuż Menu do Würzburga i Frankfurtu, należy do najbardziej ruchliwych w Niemczech. Podróżujący nim kupcy zapewniają naszym miastom środki do życia, a mieszkańcy potrafią twardo negocjować, by utrzymać się z handlu."
 fkn_rugged_land_of_fortresses: "Surowa kraina twierdz"
 fkn_rugged_land_of_fortresses_desc: "Frankońskie pogranicze to pagórkowaty, wiejski teren, który łatwo obronić – zwłaszcza że wzniesiono tu wiele twierdz strzegących kluczowych punktów, w tym imponujący zamek Plassenburg w Kulmbach. Każdy potencjalny najeźdźca będzie musiał włożyć wiele wysiłku, by odebrać nam nasze ziemie!"
 fkn_free_knights_of_franconia: "Wolni rycerze cesarscy Frankonii"
 fkn_free_knights_of_franconia_desc: "Frankonia jest domem dla licznych wolnych rycerzy cesarskich. Możemy powołać ich, by poprowadzili naszą kawalerię do boju!"
 fkn_baroque: "Księstwo barokowe"
 fkn_baroque_desc: "Wszyscy nasi sąsiedzi prześcigają się w budowie najwspanialszych pałaców, zamawianiu najpiękniejszych dzieł sztuki i tworzeniu najbardziej prestiżowych uniwersytetów. Nie możemy być gorsi. Dzięki zasobom całej Frankonii zadbamy o to, by nasz dwór nie miał sobie równych w Niemczech."
 fkn_franconian_bourgeoisie: "Frankońskie mieszczaństwo"
 fkn_franconian_bourgeoisie_desc: "Nasza ziemia wydała wielu artystów, filozofów, kompozytorów i wynalazców. Dzięki licznym przedstawicielom inteligencji nigdy nie zabraknie nam dobrze poinformowanych doradców i specjalistów do realizacji naszych przedsięwzięć, a bogactwo kraju z pewnością będzie szybko rosło."
 SOR_ideas: "Łużyckie idee"
 SOR_ideas_start: "Łużyckie tradycje"
 SOR_ideas_bonus: "Łużycka ambicja"
 sor_zittau_mountains: "Góry Żytawskie"
 sor_zittau_mountains_desc: "Góry Żytawskie na Łużycach rozciągają się między Saksonią a Czechami. Wielokrotnie służyły agresywnym mocarstwom za punkt wypadowy do najazdów na terytoria innych państw. Nie pozwolimy, by trwało to nadal – być może to nasze ziemie powinny stać się bazą wypadową dla własnej ekspansji terytorialnej?"
 sor_sale_of_land: "Sprzedaż ziemi"
 sor_sale_of_land_desc: "Nasze ziemie były wielokrotnie odbierane, kupowane i sprzedawane przez królów oraz książąt sąsiednich państw. Mieszkańcy nauczyli się przez to wielu języków i lepiej radzą sobie w kontaktach z ludźmi mówiącymi obcą mową."
 sor_lusatian_league: "Liga Łużycka"
 sor_lusatian_league_desc: "Rycerze-rabusie łupili zarówno bogatych, jak i biednych, gromadząc dla siebie bogactwa naszej ziemi. Utworzenie ligi wspólnej obrony naszych miast sprawi, że już nigdy nie będą mogli bezkarnie grabić mieszkańców."
 sor_wittelsbach_history: "Historia Wittelsbachów"
 sor_wittelsbach_history_desc: "W czasach największej potęgi Wittelsbachów nasze ziemie należały do terytoriów tej dynastii. Odbudowane państwo nie musi ograniczać się do obecnych granic – możemy przywrócić dawną wielkość Wittelsbachów, osadzając na tronie przedstawiciela własnej dynastii."
 sor_lusatian_landtag: "Sejm Łużycki"
 sor_lusatian_landtag_desc: "Wszystkie wielkie miasta kraju oraz przedstawiciele wyższej szlachty mają swoich reprezentantów w sejmie krajowym, który dysponuje znacznymi uprawnieniami w zakresie stanowienia prawa. Rozważne korzystanie z tej odpowiedzialności przyniosło mu zaufanie ludu."
 sor_rights_of_all_religions: "Prawa wszystkich wyznań"
 sor_rights_of_all_religions_desc: "Pod panowaniem Czechów i Sasów nasze ziemie stały się tyglem wielu odłamów chrześcijaństwa – od katolików, przez husytów, po nowe ruchy reformacyjne. Przez lata nauczyliśmy się tolerować odmienne wierzenia, wiedząc, że różnice w interpretacji pism kanonicznych nie oznaczają końca znanego nam świata."
 sor_political_influences: "Wpływy kulturowe"
 sor_political_influences_desc: "Położone na styku świata germańskiego i słowiańskiego ziemie nasze zamieszkują ludzie wielu kultur. Stanowimy przykład udanego i pokojowego współistnienia różnych kultur oraz wyznań, który inne państwa powinny naśladować."
 CLI_ideas: "Idee Celje"
 CLI_ideas_start: "Tradycje Celje"
 CLI_ideas_bonus: "Ambicja Celje"
 cli_marry_your_daughters: "Małżeństwa dynastyczne"
 cli_marry_your_daughters_desc: "Nasza dynastia zdołała stać się regionalną potęgą w dużej mierze dzięki zręcznej polityce małżeństw dynastycznych. Kierując się naukami przodków, będziemy mogli zdobyć kolejne ziemie."
 cli_mercenary_captains: "Dowódcy najemników"
 cli_mercenary_captains_desc: "Władcy Słowenii często służyli jako dowódcy najemników w wojnach prowadzonych przez pobliskie mocarstwa. Dzięki temu doświadczeniu poznali sztukę wojenną i stali się zdolnymi generałami, którzy mogą poprowadzić nasze wojska ku chwale."
 cli_political_manoevring: "Manewry polityczne"
 cli_political_manoevring_desc: "Nasz ród nie jest obcy politycznym intrygom. Od początków potęgi hrabiów Cilli po wpływy, jakimi Ulryk cieszył się w potężnych państwach Austrii i Węgier, dzięki zręcznym manewrom politycznym i dyplomatycznym potrafiliśmy znaczyć więcej, niż wskazywałaby na to nasza siła."
 cli_slovenian_reformation: "Reformacja słoweńska"
 cli_slovenian_reformation_desc: "Nasze ziemie stanowią podatny grunt dla nowych sposobów myślenia o Kościele. Jeśli unikniemy gniewu tych, którzy kurczowo trzymają się dawnych obyczajów, możemy stać się ośrodkiem nowatorskiej myśli na północnych Bałkanach."
 cli_border_wars: "Wojny graniczne"
 cli_border_wars_desc: "Położone na styku Austrii, Węgier, Wenecji i Osmanów nasze ziemie często stają się polem bitwy dla rywalizujących mocarstw. Aby chronić się przed nieszczęściami wojny, musieliśmy podjąć dodatkowe środki w obronie naszego ludu."
 cli_italian_baroque: "Włoski barok"
 cli_italian_baroque_desc: "Potrafimy przyciągać na nasz dwór wielu włoskich i niemieckich artystów oraz uczonych, przyczyniając się do rozwoju kultury słoweńskiej i wzrostu splendoru naszego państwa."
 cli_standardised_slovene_language: "Standaryzacja języka słoweńskiego"
 cli_standardised_slovene_language_desc: "Język używany przez chłopów na naszych ziemiach różni się od mowy naszych sąsiadów. Jego standaryzacja pozwoli rozwijać własną kulturę i uczyni z niej czynnik jednoczący nasz lud."
 SIC_ideas: "Sycylijskie idee"
 SIC_ideas_start: "Sycylijskie tradycje"
 SIC_ideas_bonus: "Sycylijska ambicja"
 sic_university_of_catania: "Uniwersytet w Katanii"
 sic_university_of_catania_desc: "Założony w 1434 roku Uniwersytet w Katanii jest najstarszą i najbardziej prestiżową uczelnią na Sycylii. Powinniśmy wspierać jego rozwój, aby przyciągał wybitnych uczonych z całych Włoch i pomagał nam odkrywać talenty, które wzmocnią naszą administrację."
 sic_constitions_of_melfi: "Konstytucje z Melfi"
 sic_constitions_of_melfi_desc: "Cesarz Fryderyk II z dynastii Hohenstaufów, król Sycylii, opracował dla wyspy kodeks prawny znany jako Konstytucje z Melfi lub Liber Augustalis. Obowiązujący jeszcze wiele stuleci później, stanowi solidną podstawę ustroju naszego państwa, regulując prawo publiczne, procedury sądowe oraz prawo lenne, prywatne i karne."
 sic_noble_admirals: "Admirałowie ze szlachty"
 sic_noble_admirals_desc: "W większości państw synowie szlachty wybierają karierę wojskową w armii lądowej. Jednak jako państwo wyspiarskie naturalnie kierujemy uwagę naszych możnych ku morzu. Taka ścieżka kariery może przynieść nam znaczne korzyści i pozwolić zabezpieczyć niepodległość dzięki przewadze morskiej."
 sic_greater_sicily: "Wielka Sycylia"
 sic_greater_sicily_desc: "Losy Sycylii i Neapolu często były ze sobą splecione. Jeśli zdołamy przywrócić jedność Obojgu Sycyliom, kto powiedział, że nasze ambicje terytorialne muszą się na tym zakończyć?"
 sic_trade_fleet: "Sycylijska flota handlowa"
 sic_trade_fleet_desc: "Choć wolumen handlu na Atlantyku przewyższył już obroty na Morzu Śródziemnym, handel nadal może przynosić znaczne bogactwa. Dzięki potężnej flocie handlowej będziemy mogli „przekonywać” kupców do odwiedzania naszych portów i kierować do własnego skarbca bogactwa płynące z Afryki Północnej do Europy."
 sic_grand_navy: "Wielka flota"
 sic_grand_navy_desc: "Największa wyspa Morza Śródziemnego powinna również posiadać największą flotę. Uczynimy z naszej marynarki potężną armadę, budzącą postrach wśród wrogów z najdalszych zakątków świata!"
 sic_sicilian_silk: "Sycylijski jedwab"
 sic_sicilian_silk_desc: "W czasach Fryderyka II jedwab był głównym towarem eksportowym Sycylii. W kolejnych stuleciach nasz przemysł jedwabniczy podupadł, a sycylijskie wyroby ustąpiły miejsca produktom z północnych Włoch. Nie ma jednak powodu, by nie mógł ponownie rozkwitnąć. Inwestując w produkcję jedwabiu, możemy przywrócić dobrobyt naszym tkaczom i rzemieślnikom."
 WES_ideas: "Westfalskie idee"
 WES_ideas_start: "Westfalskie tradycje"
 WES_ideas_bonus: "Westfalska ambicja"
 wes_jewish_rights: "Prawa Żydów"
 wes_jewish_rights_desc: "Przyznając określone prawa Żydom pracującym w naszej administracji, możemy wykorzystać ich wiedzę i otworzyć się na postępowe idee."
 wes_westphalian_decentralisation: "Decentralizacja westfalska"
 wes_westphalian_decentralisation_desc: "Westfalczycy nie są przyzwyczajeni do przynależności do większego państwa. Najwyżej mogą wskazać na przykład Okręgu Dolnoreńsko-Westfalskiego Świętego Cesarstwa Rzymskiego. Choć utrudnia to wzbudzanie lojalności naszego ludu, zdecentralizowana administracja, w której lokalne wspólnoty same się rządzą, ma również pewne zalety."
 wes_increased_conscription: "Powszechny pobór"
 wes_increased_conscription_desc: "Armie Westfalii nigdy nie odgrywały znaczącej roli w sprawach międzynarodowych. Wprowadzając powszechny pobór, możemy zbudować stałą armię na tyle liczną, by to zmienić i uczynić z Westfalii siłę, z którą należy się liczyć w Niemczech."
 wes_administrative_assimilation_of_rheinlanders: "Asymilacja mieszkańców Nadrenii"
 wes_administrative_assimilation_of_rheinlanders_desc: "Choć dialekty i styl życia odróżniają ich od nas, miasta nadreńskie od dawna łączą z nami więzi wynikające z przynależności do Okręgu Dolnoreńsko-Westfalskiego. Musimy uczynić nasze państwo wspólnym domem dla obu społeczności i włączyć Nadreńczyków do naszej administracji."
 wes_taxation: "Reformy podatkowe"
 wes_taxation_desc: "Nikt nie lubi wysokich podatków. Potrzebujemy jednak środków na utrzymanie armii i finansowanie innych przedsięwzięć godnych nowoczesnego państwa. Reformując tradycyjny system podatkowy naszych ziem i zastępując go sprawiedliwymi zasadami zapewniającymi wystarczające dochody, zwiększymy wpływy bez wywoływania niepotrzebnego niezadowolenia."
 wes_enlightenment: "Tolerancja religijna"
 wes_enlightenment_desc: "Nasze ziemie są domem dla wielu wyznań. Niektórzy twierdzą, że wszystkie inne religie są błędne, i dążą do usunięcia tych, których uważają za heretyków. My wybierzemy bardziej oświeconą drogę. Niech każdy wierzy, w co zechce, o ile zgodzi się nam służyć!"
 wes_cities_of_the_rhineland: "Miasta Nadrenii"
 wes_cities_of_the_rhineland_desc: "Włączając Nadrenię do naszego państwa, możemy czerpać korzyści z handlu prowadzonego w miastach nadreńskich oraz z handlowej przenikliwości ich kupców."
 SWA_ideas: "Szwabskie idee"
 SWA_ideas_start: "Szwabskie tradycje"
 SWA_ideas_bonus: "Szwabska ambicja"
 swa_decentralisation: "Decentralizacja szwabska"
 swa_decentralisation_desc: "Po upadku ostatniego Księstwa Szwabii jego terytoria rozpadły się na niespotykaną w Europie liczbę drobnych państewek. Choć przywróciliśmy jedność księstwu, tradycje lokalnej autonomii trudno wykorzenić. Ma to jednak swoje zalety – nie brakuje nam urzędników zdolnych do zarządzania naszymi ziemiami."
 swa_free_cities: "Kraina wolnych miast"
 swa_free_cities_desc: "Szwabia skupia największą liczbę miast cesarskich w całym Cesarstwie. Miasta te utrzymują się zazwyczaj z handlu, ponieważ nie posiadają wystarczającej ilości ziemi uprawnej, by zapewnić sobie samowystarczalność. Możemy wykorzystać zmysł handlowy ich mieszkańców, aby zwiększyć dochodowość naszych ziem."
 swa_swabian_league: "Związek Szwabski"
 swa_swabian_league_desc: "W obliczu potężniejszego zagrożenia miasta i księstwa Szwabii jednoczyły się w związku zapewniającym wzajemną obronę. Choć nasze ziemie są teraz zjednoczone pod jednym sztandarem, nie możemy zapominać o korzyściach płynących z jedności. Rozszerzymy dawną Ligę Szwabską poza granice Szwabii i zbudujemy wspólnotę państw podzielających nasze ideały."
 swa_stinginess: "Skąpy lud"
 swa_stinginess_desc: "„Schaffe, schaffe Häusle baue / Und net nach de Mädle schaue”\n\nSkąpstwo naszego ludu jest przysłowiowe wśród Niemców – nigdy nie będziemy lekkomyślnie trwonić środków na błahe wydatki."
 swa_hohenstaufen_emperors: "Pamięć o cesarzach Hohenstaufach"
 swa_hohenstaufen_emperors_desc: "Przed wiekami książęta Szwabii z dynastii Hohenstaufów byli potężnymi cesarzami Niemiec. Przywołując ich dziedzictwo i starając się ich naśladować, możemy położyć fundament pod własne dążenia do wielkości."
 swa_barbarossas_legacy: "Dziedzictwo Barbarossy"
 swa_barbarossas_legacy_desc: "Cesarz z dynastii Hohenstaufów, Fryderyk Barbarossa, rozpoczął karierę jako książę Szwabii, a następnie został królem Niemiec, Włoch i Burgundii. Zmarł w drodze do Jerozolimy podczas trzeciej krucjaty. Pamięć o jego licznych kampaniach nadal inspiruje naszych żołnierzy do wielkich czynów i budzi zazdrość naszych przywódców, którzy nieustannie starają się dorównać jego dokonaniom."
 incident_generic.1.t: "Wniosek o przyjęcie do Cesarstwa"
 incident_generic.1.d: "Rozszerzanie granic Świętego Cesarstwa Rzymskiego zdarza się niezwykle rzadko, lecz nic w prawie cesarskim nie wydaje się tego zabraniać. Ponieważ od dłuższego czasu sprawujemy władzę nad państwem [pu_hre_country.GetName], możemy rozważyć poparcie jego starań o przyjęcie do Cesarstwa."
 incident_generic.1.a: "Przedstawimy tę sprawę Sejmowi Rzeszy."
 incident_generic.1.b: "Nie ma potrzeby przyjmować państwa [pu_hre_country.GetName]."
 pu_incident_start_tt: "Rozpoczyna incydent cesarski: państwo [pu_hre_country.GetName] a Cesarstwo"
 incident_generic.2.t: "Wniosek o przyjęcie do Cesarstwa"
 incident_generic.2.d: "Rozszerzanie granic Świętego Cesarstwa Rzymskiego zdarza się niezwykle rzadko, lecz nic w prawie cesarskim nie wydaje się tego zabraniać. Państwo [current_pu_incident_target.Overlord.GetName] zwróciło się do cesarza z wnioskiem o przyjęcie do Cesarstwa państwa [current_pu_incident_target.GetName], nad którym sprawuje władzę w ramach unii personalnej."
 incident_generic.2.a: "Państwo [current_pu_incident_target.GetName] dołączy do Cesarstwa."
 incident_generic.2.b: "Odrzucamy ten wniosek."
 holy_state_reform: "Państwo krzyżowców"
 holy_state_reform_desc: "Nasze państwo istnieje w jednym celu: odzyskać i chronić Ziemię Świętą. Uczynimy wszystko, co w naszej mocy, by pokonać niewiernych, którzy ośmielają się bluźnić przeciwko Bogu i Kościołowi. Deus vult!"
 holy_state_legacy: "Państwo krzyżowców"
 holy_state_legacy_desc: "Nasze państwo istnieje w jednym celu: odzyskać i chronić Ziemię Świętą. Uczynimy wszystko, co w naszej mocy, by pokonać niewiernych, którzy ośmielają się bluźnić przeciwko Bogu i Kościołowi. Deus vult!"
 holy_state_theocracy: "Państwo krzyżowców"
 holy_state_theocracy_desc: "Nasze państwo istnieje w jednym celu: odzyskać i chronić Ziemię Świętą. Uczynimy wszystko, co w naszej mocy, by pokonać niewiernych, którzy ośmielają się bluźnić przeciwko Bogu i Kościołowi. Deus vult!"
 salonika.1.t: "Hiszpańscy Żydzi szukają schronienia w Salonikach"
 salonika.1.d: "Wygnanie Żydów z Hiszpanii pozostawiło wielu ludzi bez środków do życia i zmusiło ich do poszukiwania nowego domu. Liczni uchodźcy przybyli do Salonik, mając nadzieję, że opowieści o osmańskiej tolerancji nie są przesadzone. Hiszpańscy Żydzi nie będą jednak obciążeniem dla państwa – wśród nich jest wielu wykwalifikowanych rzemieślników i doświadczonych kupców, którzy z zapałem chcą rozpocząć działalność w kwitnącym mieście portowym."
 salonika.1.a: "Witamy tych dhimmi."
 salonika.1.b: "Nie możemy zaoferować im schronienia."
 salonika.2.t: "Napływ sefardyjskich osadników"
 salonika.2.d: "Wieści o pomyślnym życiu Żydów w Salonikach nadal przyciągają sefardyjskich osadników do wszystkich zakątków naszego państwa. W kilku miastach zaczęli oni dominować w lokalnej gospodarce, do tego stopnia, że w szabat działalność handlowa niemal całkowicie zamiera."
 salonika.2.a: "Pozwólmy osmańskim Żydom rozkwitać."
 salonika.2.b: "Powinniśmy zachować nad tym kontrolę."
 selanik_jews: "Żydzi sefardyjscy w Salonikach"
 desc_selanik_jews: "Salonik stały się schronieniem dla Żydów wygnanych z Półwyspu Iberyjskiego, co przyniosło znaczne korzyści lokalnej gospodarce."
 estate_junkers: "Junkrzy"
 ambrosian_republic.9.t: "Francesco Sforza"
 ambrosian_republic.9.d: "Kondotier Sforza zaoferował swoje usługi młodej Republice Ambrozjańskiej, lecz spotkał się z niegrzeczną odmową. Oburzony postanowił przyłączyć się do wojsk państwa [Root.GetAdjective], które prowadzą wojnę przeciwko Mediolanowi."
 ambrosian_republic.9.a: "To bardzo pomyślny obrót spraw."
 black_army_reform: "Instytucjonalizacja Czarnej Armii"
 black_army_reform_desc: "Niezależnie od sprzeciwu arystokracji Czarna Armia jest bez wątpienia skuteczną siłą zbrojną. Sformalizujemy jej istnienie jako stałej formacji i zadbamy o rezerwę doświadczonych żołnierzy gotowych zasilić jej szeregi.\n\nOdblokowuje kompanie najemników Czarnej Armii i Rezerw Czarnej Armii.\nCzarna Armia nigdy nie zostanie rozwiązana.\nCzarna Armia nigdy się nie zbuntuje."
 flavor_hun.18.b: "Nonsens! Zreformujmy Czarną Armię i nadajmy jej stałe struktury."
 curia.1.t: "Nieprawidłowości w księgach Kurii"
 curia.1.d: "Różnica między skarbcem Państwa Kościelnego a skarbcem Kościoła katolickiego jest subtelna, lecz ma znaczenie daleko wykraczające poza samą terminologię. Odkryliśmy, że ze skarbca Kurii w tajemniczych okolicznościach zniknęła znaczna suma pieniędzy, podczas gdy niemal identyczna kwota pojawiła się w księgach Państwa Kościelnego. Ślady finansowe wskazują na szokujący poziom korupcji instytucjonalnej, w którą może być zamieszany nawet sam papież."
 curia.1.a: "Te pieniądze po prostu odpoczywają na naszym koncie."
 curia.1.b: "Dopilnujmy, by pieniądze wróciły na właściwe miejsce."
 curia.2.t: "Bankierzy papieża"
 curia.2.d: "Banki państwa [papal_banker_country.GetAdjective] zaczęły ostatnio podnosić opłaty i domagać się spłaty wieloletnich pożyczek udzielonych Kościołowi katolickiemu. Podkreślają, że Kuria jest cenionym klientem, lecz nie mogą i nie zamierzają świadczyć usług za darmo."
 curia.2.a: "To koszt prowadzenia interesów."
 curia.2.b: "Te stawki to zwykły rozbój!"
 curia.3.t: "Bankierzy papieża"
 curia.3.d: "Kościół katolicki jest jednym z najbardziej cenionych i dochodowych klientów banków państwa [Root.GetAdjective]. Kuria hojnie płaci za właściwe zarządzanie swoim złotem i prowadzenie ksiąg rachunkowych. Pomimo rosnących opłat i żądań spłaty pożyczek Kościół nadal reguluje należności wobec państwa [Root.GetName]."
 curia.3.d2: "Kościół katolicki jest jednym z najbardziej cenionych i dochodowych klientów banków państwa [Root.GetAdjective]. Kuria hojnie płaci za właściwe zarządzanie swoim złotem i prowadzenie ksiąg rachunkowych. Banki podniosły jednak ostatnio opłaty i zażądały spłaty wieloletnich pożyczek udzielonych Kościołowi, a Kuria odmówiła zapłaty. Wielu starszych bankierów zaczyna wątpić w opłacalność dalszej współpracy z Kościołem."
 curia.3.a: "Bóg jest wyjątkowo wiarygodnym klientem."
 curia.3.b: "Będą potrzebować srebra, by zapłacić diabłu."
 curia.4.t: "Zabezpieczenie skarbca Kurii"
 curia.4.d: "Gdy wojna ogarnia państwo [Root.GetName], przybył legat papieski, by zapytać o bezpieczeństwo złota Kurii przechowywanego w bankach miasta [Root.Capital.GetCapitalName]. Potrzebujemy planu zabezpieczenia majątku, który Kościół nam powierzył.\n\nPowszechną, choć może nieco tchórzliwą taktyką jest wysłanie karawany poza miasto i ukrycie złota w sekretnym miejscu na czas wojny. Nasi generałowie zapewniają jednak, że zrobią wszystko, by nie dopuścić do upadku miasta [Root.Capital.GetName]. Najbezpieczniejszym miejscem dla złota pozostaje zatem stolica."
 curia.4.a: "Ukryjmy złoto w sekretnym miejscu."
 curia.4.b: "Mury miasta [Root.Capital.GetCapitalName] wytrzymają."
 moving_treasury_tt: "Odzyskamy złoto po przywróceniu pokoju."
 protecting_treasury_tt: "Jeśli stolica upadnie, złoto zostanie utracone."
 curia.5.t: "Zabezpieczenie skarbca Kurii"
 curia.5.d: "Znaczna część skarbca Kurii jest przechowywana w skarbcach banków państwa [From.GetAdjective]. Nasz legat w państwie [From.GetName] informuje, że [From.Monarch.GetTitle] zamierza potajemnie wywieźć pieniądze z miasta i ukryć je w sekretnym miejscu do końca wojny. Musimy jednak zadać sobie pytanie: co się stanie, jeśli państwo [From.GetName] nie przetrwa wojny? Być może rozsądnie byłoby poznać trasę tej karawany..."
 curia.5.a: "To najbezpieczniejsze rozwiązanie."
 curia.5.b: "Zatrudnijmy kondotierów, by napadli na karawanę i odzyskali złoto."
 curia.6.t: "Napad na karawanę ze skarbem"
 curia.6.d: "Karawana, która miała przewieźć złoto Kurii w bezpieczne miejsce, została napadnięta! Podjęliśmy wszelkie środki, by zachować nasze działania w tajemnicy. O karawanie wiedzieli wyłącznie najwyżsi urzędnicy państwa [Root.GetName] oraz Państwa Kościelnego. Czy to możliwe, że sam Ojciec Święty zorganizował ten napad?"
 curia.6.a: "Jeśli tak, powinniśmy zakończyć współpracę z Kościołem."
 curia.7.t: "Odzyskanie złota Kurii"
 curia.7.d: "Pokój powrócił do państwa [Root.GetName], dlatego wysłaliśmy karawanę, by odzyskała złoto Kurii ukryte przez nas na czas wojny. Ojciec Święty będzie niezwykle zadowolony, że zdołaliśmy ochronić majątek Kościoła."
 curia.7.a: "Niech będzie dzięki Panu."
 curia.8.t: "Ograbienie skarbca Kurii"
 curia.8.d: "Postanowiliśmy za wszelką cenę bronić miasta [Root.Capital.GetCapitalName], nie tylko dla ochrony naszego życia, lecz także po to, by zabezpieczyć część skarbca Kurii przechowywaną w naszych bankach. Po upadku miasta banki zostały splądrowane, a złoto przepadło."
 curia.8.a: "Zawiedliśmy Ojca Świętego."
 curia.9.t: "Hojna dziesięcina"
 curia.9.d: "Jako bogaty katolicki naród, nasz wkład w papieską dziesięcinę jest bardzo doceniany przez Kurię. Jednak bez względu na to, jak hojny jest nasz wkład, Kościół nadal domaga się jeszcze większej dziesięciny.\n\n[Root.noble_name.GetName], jeden z najbogatszych szlachciców na dworze, błaga [Root.Monarch.GetRulerGen], aby sprzeciwił[Root.Monarch.GetANoun] się dalszym dziesięcinom, argumentując, że drenuje to bogactwo z [Root.GetAdjective], a także bardziej bezpośrednio z kieszeni szlachty."
 curia.9.a: "Ta dziesięcina z pewnością ocali nasze dusze."
 curia.9.b: "Być może [Root.noble_name.GetName] powinien wnieść osobisty wkład."
 curia.9.c: "To zaszło już za daleko."
 curia.10.t: "Wstrzymanie dziesięciny"
 curia.10.d: "Państwo [Root.GetName] przeżywa poważne trudności finansowe. Nasi doradcy desperacko poszukują nowych źródeł dochodu, by zapobiec załamaniu gospodarki. Jedną z kuszących propozycji jest wstrzymanie dziesięciny należnej Kościołowi i przekazanie tych pieniędzy do skarbca państwowego poprzez podniesienie podatków. Z pewnością rozgniewałoby to duchowieństwo, lecz w tak trudnych czasach musimy rozważyć wszystkie możliwości."
 curia.10.a: "Cóż Bogu po złocie?"
 curia.10.b: "Nie powinniśmy ryzykować gniewu Kościoła."
 curia.11.t: "Prośba Kurii"
 curia.11.d: "Wraz z nadejściem reformacji protestanckiej coraz mniej państw płaci dziesięcinę Kościołowi katolickiemu. Kuria, jako jeden z ostatnich bastionów prawdziwej wiary, poprosiła nas o zwiększenie wkładu, aby zrekompensować straty spowodowane przez heretyków."
 curia.11.a: "Nie opuścimy Kościoła."
 curia.11.b: "Dziesięcina, którą już płacimy, jest aż nadto wystarczająca."
 curia.12.t: "Wsparcie krucjaty"
 curia.12.d: "Państwo [crusading_country.GetName] rozpoczęło sprawiedliwą krucjatę przeciwko bluźnierczym niewiernym z państwa [crusade_target_country.GetAdjective], ruszając do boju dla chwały Boga i Jego Kościoła. Aby okazać poparcie dla tej sprawy, możemy przeznaczyć część skarbca Kurii na dofinansowanie działań wojennych."
 curia.12.a: "Deus Vult!"
 curia.12.b: "Nie potrzebują naszej pomocy."
 curia.13.t: "Wsparcie Kurii"
 curia.13.d: "Papież obiecał pełne poparcie dla naszej sprawiedliwej krucjaty, przeznaczając środki ze skarbca Kurii na dofinansowanie działań wojennych."
 curia.13.a: "Deus Vult!"
 restoring_curia_treasury: "Odbudowa skarbca Kurii"
 desc_restoring_curia_treasury: "Zwalczamy korupcję w Kościele i przywracamy rzetelność ksiąg rachunkowych Kurii."
 opinion_pope_supported_crusade: "Wsparcie naszej krucjaty"
 unreliable_papal_banker: "Zhańbiony bankier papieski"
 desc_unreliable_papal_banker: "Nasze skarbce nie były wystarczająco dobrze zabezpieczone, by ochronić skarbiec Kurii przed najeźdźcami."
 holstein.1.t: "Sprawa Holsztynu"
 holstein.1.d: "Choć Holsztyn przez długi czas znajdował się pod zwierzchnictwem królów skandynawskich, teraz został włączony bezpośrednio do [holstein_owner.GetGovNameGen] [holstein_owner.GetAdjective]. Podczas gdy Święte Cesarstwo Rzymskie było zadowolone z tego, że [holstein_owner.GetName] rządzi Księstwem Holsztynu, pozostaje ono prawną częścią Cesarstwa i zdecydowanie nie jest prowincją [holstein_owner.GetAdjective]."
 holstein.1.a: "Żądanie przywrócenia Holsztynu."
 holstein.1.b: "Zrzeczenie się cesarskich roszczeń."
 holstein.2.d: "Choć Holsztyn przez długi czas znajdował się pod zwierzchnictwem królów skandynawskich, teraz został włączony bezpośrednio do [Root.GetGovNameGen] [Root.GetAdjective]. W epoce zdefiniowanej przez rosnącą władzę scentralizowanych państw nie jest to szczególnie niezwykłe, ale w tym przypadku spowodowało to poważny incydent dyplomatyczny. Podczas gdy Święte Cesarstwo Rzymskie było zadowolone z tego, że rządzimy Księstwem Holsztynu, pozostaje ono prawną częścią Cesarstwa i zdecydowanie nie jest prowincją [Root.GetAdjective].\n\nW związku z tym [From.Monarch.GetTitle] zażądał[From.Monarch.GetANoun] przywrócenia Księstwa Holsztynu, a ponadto zażądał[From.Monarch.GetANoun], aby cała władza [Root.GetAdjective] nad jego terytorium została zrzeczona, tak aby Holsztyn mógł zająć swoje miejsce wśród książąt Cesarstwa."
 holstein.2.a: "Spełnimy żądanie cesarza."
 holstein.2.b: "Holsztyn słusznie należy do nas."
 holstein.3.t: "Sprawa Holsztynu"
 holstein.3.d: "Choć Holsztyn przez długi czas znajdował się pod zwierzchnictwem królów skandynawskich, teraz został włączony bezpośrednio do [holstein_owner.GetGovNameGen] [holstein_owner.GetAdjective]. Podczas gdy Święte Cesarstwo Rzymskie było zadowolone z tego, że [holstein_owner.GetName] rządzi Księstwem Holsztynu, pozostaje ono prawną częścią Cesarstwa i zdecydowanie nie jest prowincją [holstein_owner.GetAdjective]."
 holstein.3.a: "Ta sprawa wymaga namysłu."
 ceded_holstein: "Przekazanie Holsztynu"
 refused_to_cede_holstein: "Zatrzymanie Holsztynu"
 incident_holstein: "Sprawa Holsztynu"
 incident_holstein_member_alert: "Choć Holsztyn przez długi czas znajdował się pod zwierzchnictwem królów skandynawskich, teraz został włączony bezpośrednio do [Root.GetGovNameGen] [Root.GetAdjective]. Podczas gdy Święte Cesarstwo Rzymskie było zadowolone z tego, że [holstein_owner.GetName] rządzi Księstwem Holsztynu, pozostaje ono prawną częścią Cesarstwa i zdecydowanie nie jest prowincją [holstein_owner.GetAdjective]."
 incident_holstein_emperor_alert: "Choć Holsztyn przez długi czas znajdował się pod zwierzchnictwem królów skandynawskich, teraz został włączony bezpośrednio do [Root.GetGovNameGen] [Root.GetAdjective]. Podczas gdy Święte Cesarstwo Rzymskie było zadowolone z tego, że [holstein_owner.GetName] rządzi Księstwem Holsztynu, pozostaje ono prawną częścią Cesarstwa i zdecydowanie nie jest prowincją [holstein_owner.GetAdjective]."
 demand_holstein_tt: "§YCesarz żąda przywrócenia Holsztynu do Cesarstwa od [holstein_owner.GetAdjective].§!"
 hansa_incident.1.t: "Schyłek Ligi Hanzeatyckiej"
 hansa_incident.1.d: "Hanza była niegdyś niekwestionowanym władcą szlaków handlowych od Londynu po Nowogród. Z naszego macierzystego portu w Lubece członkowie związku kontrolowali handel na Bałtyku i czerpali z niego ogromne bogactwa. Obecnie jednak potęga Hanzy chyli się ku upadkowi. Wewnętrzne spory i seria kryzysów gospodarczych sprawiły, że nasi kupcy utracili kontrolę nawet nad handlem wokół samej Lubeki. Nowa potęga, państwo [lubeck_trade_power.GetName], wyparła Hanzę z jej macierzystych wód i zagraża dalszemu istnieniu związku."
 hansa_incident.1.a: "Poprośmy cesarza o pomoc."
 hansa_incident.1.b: "Odnowimy nasze więzi ze związkiem."
 hansa_incident.2.t: "Schyłek Ligi Hanzeatyckiej"
 hansa_incident.2.d: "Liga Hanzeatycka niegdyś rządziła światowym handlem od Londynu do Nowogrodu Wielkiego. Los jednak sprawił, że Liga osłabła. Teraz Liga desperacko szuka pomocy ze strony Świętego Cesarza Rzymskiego."
 hansa_incident.2.a: "Nie mamy żadnych zobowiązań wobec Hanzy."
 hansa_incident.2.b: "Zorganizowanie Wolnych Miast do pomocy."
 hansa_incident.2.c: "Ogłoszenie embarga na państwo [lubeck_trade_power.GetName]."
 hansa_incident.3.t: "Odnowienie Hanzy?"
 hansa_incident.3.d: "Cesarz zlitował się nad zmagającą się z trudnościami Ligą Hanzeatycką, proponując odnowienie Hanzy, która obejmowałaby Wolne Miasta Świętego Cesarstwa Rzymskiego. Jego propozycja nie jest jednak prawem, więc możemy i powinniśmy odmówić, jeśli nie uważamy tego paktu za leżący w naszym interesie."
 hansa_incident.3.a: "Dołącz do Ligi."
 hansa_incident.3.b: "Nie jesteśmy zainteresowani."
 hanseatic_consolidation: "Konsolidacja Hanzy"
 opinion_emperor_helped_hansa: "Odnowiona Hanza"
 opinion_emperor_wont_help_hansa: "Zignorowanie naszego położenia"
 opinion_emperor_imperial_embargo: "Nałożenie embarga cesarskiego"
 IMPERIAL_EMBARGO: "Cesarskie embargo"
 may_join_hansa_tt: "§YZostanie poproszone o dołączenie do odnowionej Ligi Hanzeatyckiej§!"
 shadow_kingdom_warning_tt: "§YCesarz może podporządkować sobie państwa włoskie, pokonując je w dowolnej wojnie, czyniąc je Wolnym Miastem lub zapewniając sojusz lub silne relacje z nimi§!"
 shadow_kingdom.2.d: "Pomimo że Królestwo Włoch formalnie wciąż stanowi część Świętego Cesarstwa Rzymskiego, na swój sposób stało się 'Królestwem cieni' z włoskimi państwami działającymi niezależnie od Cesarza. Niepowodzenie przywrócenia zwierzchnictwa w tym regionie przez kolejnych Cesarzy doprowadziło do przejęcia wielu terenów przez państwa wprost sprzeciwiające się autorytetowi Cesarstwa.\nObecnie wiele z włoskich państw zadaje sobie pytanie, dlaczego powinny przyznawać Cesarzowi jakikolwiek autorytet na swoich ziemiach."
 shadow_kingdom.2.a: "Czas porzucić Włochy."
 shadow_kingdom.2.b: "Musimy podporządkować Włochów."
 shadow_kingdom_emperor_gives_up_tt: "§YWłoskie narody w ŚCR, które zostały podporządkowane, pozostaną w Cesarstwie.§!\n§YWłoskie narody, które nie zostały podporządkowane, opuszczą Cesarstwo.\n\n§YCesarz straci §R0.2§! cesarskiego autorytetu za każdą rozwiniętą prowincję, która opuści Cesarstwo.§!"
 shadow_kingdom_incident_tt: "§YCesarz ma czas do 1490 roku, aby podporządkować jak najwięcej włoskich narodów w Cesarstwie.§!"
 shadow_kingdom_incident_penalty_tt: "Utrata §R0.2§! autorytetu cesarskiego za każdy punkt §Yrozwoju§! prowincji włoskich opuszczających Święte Cesarstwo Rzymskie."
 shadow_kingdom.3.t: "Królestwo cieni"
 shadow_kingdom.3.d: "Pomimo cesarskiego postanowienia o podporządkowania Włoch, wciąż istnieją państwa włoskie, które odmawiają zaakceptowania supremacji Cesarstwa. Wysiłki [Root.GetAdjective] nie poszły jednak całkowicie na marne; te państwa, które zostały podporządkowane, nie odważą się ponownie przeciwstawić Cesarstwu."
 shadow_kingdom.3.a: "Los Włoch jest przesądzony."
 shadow_kingdom_triggered_modifier_tt: "§YPaństwo [Root.GetName] będzie otrzymywać kary do prestiżu, niepokojów społecznych i kosztu stabilności, dopóki pozostanie w Cesarstwie, chyba że sprzymierzy się z Cesarzem.§!"
 shadow_kingdom_result_ia_tooltip: "§YPaństwo [Root.GetName]§! zyska §Y5§! cesarskiego autorytetu za każde włoskie państwo, które pozostanie w Cesarstwie z powodu podporządkowania.\n§YPaństwo  [Root.GetName]§! straci §Y10§! cesarskiego autorytetu za każde niepodległe włoskie państwo, którego nie zostało podporządkowane."
 shadow_kingdom.4.d2: "Zgodnie z obietnicą cesarz rozpoczął kampanię mającą na celu przywrócenie władzy cesarskiej we Włoszech. Państwo [Root.GetName] było jednym z państw, które zostały zmuszone do zaakceptowania rządów Cesarstwa, a nasze poddanie się jest dowodem na to, że słowo Cesarza jest prawem."
 dotf.1.t: "Obrońca zagrożonej wiary"
 dotf.1.d: "Państwo [Root.GetName] zobowiązało się bronić wiary [Root.Religion.GetName] i stać się jej orędownikiem w obliczu przeciwności. Niewiele jest jednak państw wyznających naszą religię, a rzesze wiernych nie mają gdzie szukać schronienia. Jedynym rozwiązaniem jest ewangelizacja – musimy pozyskać nowych wyznawców."
 dotf.1.a: "Nawrócimy lud państwa [Root.GetAdjective]."
 dotf.1.b: "Nasi wrogowie nawrócą się albo zginą."
 evangelism_in_one_country: "Ewangelizacja we własnym kraju"
 desc_evangelism_in_one_country: "Nasza wiara jest słabo obecna w innych państwach, dlatego musimy skupić się na nawracaniu ludzi wewnątrz naszych granic, a nie poza nimi."
 international_evangelism: "Ewangelizacja międzynarodowa"
 desc_international_evangelism: "Uznaliśmy, że aby zachować naszą wiarę, musimy wyjść poza granice państwa i szerzyć ją mieczem."
 dotf.2.t: "Dżihad o prowincję [jihad_target_province.GetName]"
 dotf.2.d: "Przeklęci niewierni z państwa [jihad_target_country.GetName] zdobyli Święte Miasto [jihad_target_province.GetName]! Nie możemy na to pozwolić. Jako obrońcy wiary [Root.Religion.GetName] musimy ogłosić wielki dżihad przeciwko obcym krzyżowcom. Wzywamy wszystkich wiernych muzułmanów, by chwycili za miecz w obronie [jihad_target_province.GetName] i cierpiącego ludu tego miasta."
 dotf.2.a: "Nie spoczniemy, dopóki nie odzyskamy prowincji [jihad_target_province.GetName]."
 jihad_tt: "Wszystkie państwa wyznające wiarę §Y[Root.Religion.GetName]§! otrzymują casus belli §YŚwięta wojna§! przeciwko właścicielowi prowincji §Y[jihad_target_province.GetName]§!, o ile mają z nim wspólną granicę.\nDżihad zakończy się, gdy prowincja §Y[jihad_target_province.GetName]§! zostanie odbita przez państwo §Ymuzułmańskie§!."
 dotf.3.t: "Zwycięski dżihad o prowincję [successful_jihad_province.GetName]"
 dotf.3.d: "Nasze sprawiedliwe wysiłki przeciwko niewiernym najeźdźcom nie poszły na marne – odzyskaliśmy prowincję [successful_jihad_province.GetName]! Muzułmanie na całym świecie wychwalają nasze czyny, a Allah z pewnością spogląda na nas z niebios z przychylnością."
 dotf.3.a: "Bóg jest dobry!"
 end_of_jihad_tt: "Dżihad o prowincję [successful_jihad_province.GetName] dobiega końca."
 opinion_reconquered_holy_city: "Odzyskanie Świętego Miasta"
 opinion_benevolent_dotf: "Wzór dla wszystkich katolików"
 opinion_repaired_relations: "Naprawienie stosunków"
 opinion_not_recripocated: "Odrzucono gałązkę oliwną"
 dotf.4.t: "Kościół powszechny"
 dotf.4.d: "Uczeni od dawna wierzą, że Kościół katolicki mógłby stać się wspólną płaszczyzną porozumienia i podstawą trwałego pokoju w świecie chrześcijańskim, gdyby tylko jego przywódcy zdobyli się na polityczną wolę odłożenia różnic na bok. Jednym z takich myślicieli jest [Root.humanist_thinker_name.GetName], szanowany humanista, który zyskał posłuch u [Root.Monarch.GetTitle]. Sugeruje on, byśmy naprawili stosunki z naszymi rywalami, państwem [catholic_rival.GetAdjective], argumentując, że dobrzy katolicy nie mają prawdziwego powodu, by walczyć przeciwko sobie. Taki akt życzliwości z pewnością stałby się wzorem dla katolickich władców na całym świecie i stworzyłby podstawy trwałego pokoju."
 dotf.4.a: "Powinniśmy spróbować pojednać się z państwem [catholic_rival.GetName]."
 dotf.4.b: "Nonsens. Zamiast tego wyślijmy państwu [catholic_rival.GetName] obraźliwą wiadomość."
 dotf.5.t: "Gałązka oliwna"
 dotf.5.d: "Nasi rywale z [From.GetAdjective] przyszli do nas z bardzo ciekawą propozycją. Chcą wyciągnąć gałązkę oliwną, wybaczając wszystkie dawne krzywdy i naprawiając szkody, które nam wyrządzili, a wszystko to pod płaszczykiem katolickiej jedności."
 dotf.5.a: "Pojednajmy się z naszymi braćmi w wierze z [From.GetAdjective]."
 dotf.5.b: "Pokój z państwem [From.GetName]? Absurd."
 dotf.6.t: "Sobór wyznawców [Root.Religion.GetName] w prowincji [protestant_council_province.GetName]"
 dotf.6.d: "Reformacja jest chaotycznym ruchem, który szybko się zmienia. O doktrynie decydują w równym stopniu polityczny pragmatyzm i rozważania teologiczne. Dlatego jako obrońcy reformacji powinniśmy spróbować zaprowadzić choć odrobinę porządku i jedności wśród reformatorów. W tym celu zwołaliśmy sobór w prowincji [protestant_council_province.GetName], na którym zgromadzili się dostojnicy i teologowie z takich państw jak [first_council_member.GetName], [second_council_member.GetName] i [third_council_member.GetName], by omawiać kwestie wiary i zawierać sojusze polityczne."
 dotf.6.a: "Sobór zakończył się wielkim sukcesem."
 held_protestant_council: "Zwołanie soboru religijnego"
 desc_held_protestant_council: "Zwołaliśmy sobór ekumeniczny, który pomógł umocnić naszą młodą wiarę."
 opinion_held_protestant_council: "Zwołanie soboru religijnego"
 dotf.7.t: "Ostoja Kościoła"
 dotf.7.d: "Gdy reformacja protestancka grozi rozdarciem świata chrześcijańskiego, pozostajemy niezłomni w naszym przywiązaniu do Kościoła katolickiego. Państwo [Root.GetName] stanie się wielką ostoją wiernych, miejscem niezachwianej pobożności i schronieniem dla katolików ze wszystkich krajów."
 dotf.7.a: "Nie ulegniemy herezji."
 bastion_of_the_church_tt: "Wszystkie prowincje §Ykatolickie [Root.Culture.GetName]§! należące do państwa §Y[Root.GetName]§! będą bardziej odporne na nawracanie przez §Y20§! lat."
 bastion_of_the_church: "Ostoja Kościoła"
 desc_bastion_of_the_church: "Nie będziemy tolerować nawet najmniejszej sugestii herezji protestanckiej."
 dotf.8.t: "Dominacja [Root.Religion.GetReligion_gen]"
 dotf.8.d: "Reformacja rozprzestrzeniła się w chrześcijaństwie jak pożar. W całym chrześcijańskim świecie wierni potępili heretyckie tradycje papieża i przyjęli nauki Pisma Świętego. Jako główny orędownik reformacji i obrońca wiary, Kościół [Root.GetAdjective] jest postrzegany przez wielu jako najwyższy autorytet religijny."
 dotf.8.a: "[Root.Religion.GetName] triumfuje!"
 victory_for_the_reformation: "Zwycięstwo reformacji"
 desc_victory_for_the_reformation: "Pokonaliśmy papistowską herezję. Reformacja zakończyła się sukcesem!"
 dotf.9.t: "Rozkwit wiary [Root.Religion.GetName]"
 dotf.9.d: "Tam, gdzie niegdyś dominował sunnizm, przez świat islamski przetoczyła się fala żarliwości [Root.Religion.GetName]. Siłą napędową tej ogromnej zmiany układu sił były niezłomne wysiłki państwa [Root.GetName], które szerzyło i broniło wiary także poza własnymi granicami. Potęga wyznania [Root.Religion.GetName] stała się niezaprzeczalna, a słabsze państwa zaczynają nawracać się dobrowolnie, wyczuwając, że opór wobec zmieniających się czasów nie ma sensu."
 dotf.9.a: "Islam wkracza w nową erę."
 new_era_for_islam: "Nowa era islamu"
 desc_new_era_for_islam: "Nasza wiara zdobyła ogromne znaczenie w świecie islamskim, zastępując niegdyś dominujący sunnizm."
 convert_to_new_sect_muslim: "Przyjęcie nowego odłamu"
 desc_convert_to_new_sect_muslim: "Świat islamski się zmienia, a my przyjęliśmy nowy, dominujący odłam islamu."
 opinion_muslim_will_not_convert: "Odmowa nawrócenia"
 dotf.10.t: "Nowa era islamu"
 dotf.10.d: "Wiara [From.Religion.GetName] w ostatnich latach zyskuje coraz większą dominację, wypierając niegdyś niezachwianą pozycję sunnickiej teologii. Być może powinniśmy dostosować się do nowych czasów i przyjąć tę wiarę?"
 dotf.10.a: "Czasy się zmieniają. Musimy zmienić się wraz z nimi."
 dotf.10.b: "Nigdy nie wyrzekniemy się naszej wiary!"
 estate_burghers_prussian_confederation: "Poddaj się Konfederacji Pruskiej"
 prussian_confederation_privilege_tt: "Związek Pruski nie wystąpi zbrojnie przeciwko państwu."
 flavor_teu.5.t: "Koniec państwa zakonnego"
 flavor_teu.5.d: "Przywileje przyznane Związkowi Pruskiemu pozbawiły zakon krzyżacki niemal wszystkich możliwości sprawowania rządów i niewiele pozostawiły mu dróg do odbudowy zakonu. Prawdziwa władza spoczywa teraz w rękach dawnych członków związku, którzy jako oligarchowie rządzą praktycznie niezależnymi miastami. Wobec faktycznej niemożności przywrócenia rządów zakonu [Root.Monarch.GetTitle] postanowił zrezygnować ze [Root.Monarch.GetHerHis] urzędu i formalnie zakończyć istnienie państwa zakonnego w Prusach."
 flavor_teu.5.a: "Niech tak będzie."
 italian_wars.1.t: "Wojny włoskie"
 italian_wars.1.d: "Wojna dotarła do Włoch. Nie są to 'cywilizowane' potyczki, do których Włosi są przyzwyczajeni, ale wojna praktykowana przez zaprawione w bojach armie [major_power.GetAdjective]. Dźwięk kościelnych dzwonów i targujących się kupców wkrótce zostanie zastąpiony przez makabryczną, niszczycielską kakofonię wystrzałów armatnich.\n\nDla niektórych Włochów okropieństwa wojny stanowią okazję finansową: liczba generałów kondotierów oferujących się za najwyższą cenę dramatycznie wzrosła, a weteranów chętnych do dołączenia do tych najemnych armii nie brakuje."
 italian_wars.1.a: "Wojna jest brutalna."
 italian_wars_tt: "§YUczestnicy głównych włoskich wojen zyskają dostęp do lombardzkich i toskańskich wolnych kompanii, będą mieli obniżony koszt najemników i większą dyscyplinę najemników.§!"
 italian_wars.2.t: "Era kondotierów dobiega końca"
 italian_wars.2.d: "Wojny, które spustoszyły Włochy, spowodowały znaczny wzrost liczby generałów kondotierów sprzedających usługi swoich najemnych armii. W miarę jak konflikt ewoluował w szerszą europejską walkę, ci condottieri stali się mniej istotni dla strategii wojskowych wielkich mocarstw. Era prywatnych armii we Włoszech dobiega końca."
 italian_wars.2.a: "Walcz nie o złoto, lecz o chwałę."
 italian_wars_end_tt: "§YWolne kompanie lombardzkie i toskańskie nie będą już dostępne do wynajęcia. Udział we włoskich wojnach nie będzie już zapewniał premii dla najemników.§!"
 italian_wars_triggered_modifier: "Wojny włoskie"
 desc_italian_wars_triggered_modifier: "Nastała epoka kondotierów – włoscy generałowie gromadzą kompanie najemników i oferują swoje usługi każdemu, kto zechce je wynająć."
 french_wars_of_religion.2.b: "Po nieudanym zamachu na przywódcę katolików [Root.Monarch.GetTitle], obawiając się odwetu, rozkazał zamordować wszystkich wpływowych katolików w mieście [Root.Capital.GetName]. Nieumyślnie zainspirowało to fanatyków wyznania [Root.Religion.GetName] w stolicy do rozpoczęcia rzezi całej katolickiej ludności. Tysiące katolików zamordowano na ulicach, a przemoc może rozprzestrzenić się poza stolicę, jeśli nie podejmiemy działań."
 french_moderates: "Poparcie francuskich umiarkowanych"
 desc_french_moderates: "W czasie francuskich wojen religijnych opowiedzieliśmy się po stronie tolerancji religijnej."
 french_wars_of_religion.17.t: "Zamach na [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 french_wars_of_religion.17.d: "Zainspirowany zdradzieckimi pamfletami antyrojalistycznymi fanatyk religijny [Root.fra_royal_assassin.GetName] zamordował [Root.Monarch.GetTitle]! Zamachowiec dostał się do obozu królewskiego przebrany za skromnego zakonnika, twierdząc, że chce udzielić [Root.Monarch.GetTitle] błogosławieństwa. Zamiast tego wyciągnął nóż i ugodził nim [Root.Monarch.GetTitle] w śledzionę, śmiertelnie raniąc [Root.Monarch.GetHerHim]. [Root.fra_royal_assassin.GetName] został natychmiast stracony, lecz jego zbrodnia na zawsze odmieni bieg francuskiej historii.\n\n[Root.Monarch.GetName] nie miał prawowitego następcy, dlatego tron przechodzi na daleko spokrewniony ród Burbonów. Wybór następcy spośród Burbonów budzi kontrowersje: umiarkowani i hugenoci popierają protestanta Henryka, podczas gdy zagorzali katolicy opowiadają się za jego stryjem Karolem, szanowanym kardynałem Kościoła katolickiego."
 french_wars_of_religion.17.a: "Następcą zostanie Henryk de Bourbon."
 french_wars_of_religion.17.b: "Żaden heretyk nie może zasiąść na tronie Francji."
 support_french_league_tt: "Poprzemy grupę fanatyków, których działania mogą być sprzeczne z interesami państwa."
 do_not_support_french_league_tt: "Narazimy się grupie fanatyków, którzy wystąpią przeciwko rządowi."
 flavor_tus.20.t: "Spisek Pazzich"
 flavor_tus.20.d: "Bankierski ród Pazzi, zaciekli rywale rodziny [Root.Monarch.Dynasty.GetName] oraz [Root.Monarch.GetTitle], uknuł spisek mający obalić Signorię i przejąć władzę w państwie [Root.GetName]. W ten nikczemny plan zaangażowano wiele najpotężniejszych postaci [Root.GetAdjective] polityki – od kupców, przez duchownych, po szlachtę.\n\nPazzi planują zamordować [Root.Monarch.GetName] podczas uroczystej mszy w katedrze, a następnie zająć Palazzo della Signoria i przejąć stery rządów. Jeśli jednak spisek się nie powiedzie, większość politycznych przeciwników Signorii zostanie uznana za przestępców, a dynastia [Root.Monarch.Dynasty.GetName] będzie mogła rządzić niemal bez opozycji."
 flavor_tus.20.a: "Powiesić ich na murach pałacu!"
 flavor_tus.20.b: "Poprzyjmy zamach stanu Pazzich."
 strengthened_signoria_tt: "§YPrzy następnej reelekcji naszego władcy lub wyborze kandydata z jego rodziny nie stracimy tradycji republikańskiej.§!"
 strengthened_signoria_election_tt: "§YTa opcja nie będzie kosztować tradycji republikańskiej dzięki wzmocnionej Signorii.§!"
 signoria_leader_dies_tt: "§Y[Root.Monarch.GetName]§! ginie!"
 pol_disaster_concede_tt: "§YTo skieruje nas na drogę do przekazania pełnej kontroli Sejmowi i zniesienia monarchii.§!"
 flavor_pol.21.t: "Sejm przejmuje władzę"
 flavor_pol.21.d: "Po zgodzie na niezliczone kompromisy z Sejmem [Root.Monarch.GetName] nie może już dłużej tego znieść i ogłasza [Root.Monarch.GetHerHis] abdykację. Żaden kandydat do tronu nie chce dziedziczyć opłakanego stanu [Root.GetAdjective] monarchii, dlatego pełnia władzy przechodzi w ręce Sejmu. Ze względu na monarchię elekcyjną państwo [Root.GetName] bywało nazywane republiką, lecz od dziś stanie się prawdziwą Najjaśniejszą Republiką [Root.GetName]."
 flavor_pol.21.a: "Niech żyje Sejm! Niech żyje Republika!"
 flavor_pol.22.t: "Koniec walki o władzę królewską"
 flavor_pol.22.d: "Po długiej walce, obejmującej zarówno konflikty polityczne, jak i militarne, kryzys w państwie [Root.GetName] dobiegł końca. Nie ma już wątpliwości, gdzie spoczywa prawdziwa władza w państwie [Root.GetName]."
 flavor_pol.22.a: "[Root.Monarch.GetTitle] jest najwyższą władzą!"
 flavor_pol.22.b: "Najwyższą władzę sprawuje Sejm!"
 MOST_SERENE_REPUBLIC: "Najjaśniejsza Republika"
 MARSHAL: "Marszałek"
 SERENE_MARSHAL: "Najjaśniejszy Marszałek"
 MOST_SERNE_MARSHAL: "Najjaśniejszy Marszałek"
 pol_struggle_for_royal_power_disaster: "Walka o władzę królewską"
 desc_pol_struggle_for_royal_power_disaster: "Trwa konflikt o zakres władzy monarchy i uprawnienia Sejmu."
 patriotic_company_leader_deserts: "§Y[patriotic_mercs.Leader.GetName] odchodzi z kompanii [patriotic_mercs.GetName].§!"
 mercs.1.t: "Niezadowolenie w kompanii [patriotic_mercs.GetName]"
 mercs.1.d: "Wielu żołnierzy kompanii [patriotic_mercs.GetName] zaczęło żywić bezpodstawny sentyment do swojej żałosnej ojczyzny, państwa [merc_home_country.GetName]. Znaczna część z nich dezerteruje, przerażona myślą, że miasto [merc_home_province.GetCapitalName] mogłoby stanąć w płomieniach."
 mercs.1.a: "Mają słabe serca."
 mercs.1.b: "Szkoci naprawdę kochają tylko złoto."
 mercs.2.t: "Wróg mojego wroga"
 mercs.2.d: "Żołnierze kompanii [bloodthirsty_mercs.GetName] z radością oczekują okazji do walki ze znienawidzonym wrogiem, państwem [bloodthirsty_mercs_enemy.GetAdjective]. Wygląda na to, że zaciekła wrogość między państwami [bloodthirsty_mercs_home.GetName] i [bloodthirsty_mercs_enemy.GetName] obejmuje nawet najemników."
 mercs.2.a: "Szczęśliwy zbieg okoliczności."
 mercs.2.b: "Tak samo myśli każdy prawdziwy mieszkaniec państwa [Root.GetAdjective]."
 bloodthirsty_mercs_modifier: "Wróg mojego wroga"
 desc_bloodthirsty_mercs_modifier: "Walczymy z zaciekłymi rywalami naszych kompanii najemniczych."
 bloodthirsty_mercs_modifier_universal: "Wróg mojego wroga"
 desc_bloodthirsty_mercs_modifier_universal: "Walczymy z zaciekłymi rywalami naszych kompanii najemniczych."
 mercs.3.t: "Zapłata w łupach"
 mercs.3.d: "Kilka kompanii najemników pozostających na naszej służbie jest coraz bardziej niezadowolonych z warunków zatrudnienia. Twierdzą, że bogactwa wrogich miast, takich jak [rich_enemy_province.GetName], są nieporównywalnie większe od ich skromnych żołdów. [loot_mercs.Leader.GetName], kapitan kompanii [loot_mercs.GetName], wystąpił z żądaniem, by znaczna część łupów wojennych została zarezerwowana dla niego i jego ludzi."
 mercs.3.a: "Pozwólmy im wziąć część łupów."
 mercs.3.b: "Odmówmy im łupów, ale zwiększmy żołd."
 mercs.3.c: "Jak śmią stawiać nam żądania!"
 mercs_allowed_to_loot: "Prawo do grabieży"
 desc_mercs_allowed_to_loot: "Zarezerwowaliśmy część łupów wojennych dla zatrudnionych przez nas najemników."
 mercs_not_allowed_to_loot_money: "Dodatkowy żołd"
 desc_mercs_not_allowed_to_loot_money: "Choć powstrzymaliśmy naszych najemników przed bezmyślnym plądrowaniem wszystkiego na swojej drodze, musimy ponosić znaczne koszty dodatkowego żołdu."
 mercs.4.t: "Weterani zasilają kompanię [veteran_mercs.GetName]"
 mercs.4.d: "Państwo [Root.GetName] cieszy się wielkim uznaniem wśród kapitanów najemników – zarówno ze względu na prestiż międzynarodowy, jak i, co najważniejsze, reputację państwa, które wypłaca żołnierzom najemnym żołd na czas i zgodnie z ustalonymi stawkami. Napływ zagranicznych weteranów zasilił kompanię [veteran_mercs.GetName], ponieważ liczą oni na stałe zatrudnienie w naszej służbie."
 mercs.4.a: "Któż nie chciałby walczyć dla państwa [Root.GetName]?"
 mercs.5.t: "Słonie!"
 mercs.5.d: "Po raz pierwszy od czasów Hannibala i wojen punickich słonie bojowe powróciły do Europy pod dowództwem generałów państwa [Root.GetAdjective]. Nasi wrogowie drżą ze strachu na widok tych potężnych, majestatycznych bestii, odzianych w zbroje i ozdobionych symbolami wojennymi."
 mercs.5.d2: "Po raz pierwszy od czasów Hannibala i wojen punickich słonie bojowe powróciły do Europy pod dowództwem kompanii [elephant_mercs.GetName]. Nasi wrogowie drżą ze strachu na widok tych potężnych, majestatycznych bestii, odzianych w zbroje i ozdobionych symbolami wojennymi."
 mercs.5.a: "Niech drżą przed kompanią [elephant_mercs.GetName]."
 mercs.5.b: "Niech drżą przed nami."
 mercs.6.t: "Amazonki państwa [Root.GetAdjective]"
 mercs.6.d: "Po latach obowiązkowej służby w armii państwa [Root.GetAdjective] grupa weteranek połączyła siły, by założyć kompanię najemniczą dowodzoną wyłącznie przez kobiety. Stacjonujące w mieście [Root.Capital.GetCapitalName] żołnierki Amazonek państwa [Root.GetAdjective] są gotowe walczyć o złoto i chwałę."
 mercs.6.a: "Cóż za niezwykłe zjawisko."
 female_mercs_tt: "§YKompania najemnicza Amazonek staje się dostępna do wynajęcia.§!"
 merc_local_all_female_company: "Amazonki"
 incident_king_in_prussia: "Król w Prusach"
 incident_king_in_prussia_member_alert: "Prusy stają się coraz potężniejszym państwem w Świętym Cesarstwie Rzymskim. Ich wpływ na politykę cesarską stale rośnie, a na arenie międzynarodowej umacniają swoją pozycję. [PRU.Monarch.GetTitle] [PRU.Monarch.GetName] ogłosił [PRU.Monarch.GetHerHis] zamiar utworzenia Królestwa Prus, podnosząc państwo z rangi zwykłego [PRU.GovernmentName]. Jest to niemal bezprecedensowa sytuacja w Cesarstwie, dlatego cesarz musi zdecydować, jak ją rozwiązać."
 incident_king_in_prussia_emperor_alert: "Prusy stają się coraz potężniejszym państwem w Świętym Cesarstwie Rzymskim. Ich wpływ na politykę cesarską stale rośnie, a na arenie międzynarodowej umacniają swoją pozycję. [PRU.Monarch.GetTitle] [PRU.Monarch.GetName] ogłosił [PRU.Monarch.GetHerHis] zamiar utworzenia Królestwa Prus, podnosząc państwo z rangi zwykłego [PRU.GovernmentName]. Jest to niemal bezprecedensowa sytuacja w Cesarstwie, dlatego cesarz musi zdecydować, jak ją rozwiązać."
 king_in_prussia_elevated_tt: "§YPrusy staną się królestwem w obrębie Świętego Cesarstwa Rzymskiego dzięki poparciu cesarza.§!"
 king_in_prussia_compromise_tt: "§YPrusy staną się królestwem w obrębie Świętego Cesarstwa Rzymskiego na mocy kompromisu prawnego tolerowanego przez cesarza.§!"
 king_in_prussia_rejection_tt: "§YPrusy muszą wybrać między fałszywą koroną a statusem księcia cesarskiego.§!"
 king_in_prussia.3.optd: "Przyjmijmy decyzję cesarza z godnością."
 opinion_prussia_not_recognized_allies: "Odrzucenie korony Prus"
 elevated_prussia_rivals: "Podniesienie rangi Prus"
 incident_switzerland: "Szwajcaria i Cesarstwo"
 incident_switzerland_member_alert: "Szwajcaria porzuciła Cesarstwo! Powodowani niezadowoleniem z pokoju religijnego, a także słabnącymi więzami z instytucjami cesarskimi, Szwajcarzy zdecydowali, że członkostwo w Świętym Cesarstwie Rzymskim nie służy już ich interesom."
 incident_switzerland_emperor_alert: "Szwajcaria porzuciła Cesarstwo! Powodowani niezadowoleniem z pokoju religijnego, a także słabnącymi więzami z instytucjami cesarskimi, Szwajcarzy zdecydowali, że członkostwo w Świętym Cesarstwie Rzymskim nie służy już ich interesom."
 emperor_loses_claims_tt: "§YCesarstwi zrzeknie się swoich roszczeń do terytorium Szwajcarii.§!"
 incident_pope: "Papież i Cesarz"
 incident_pope_member_alert: "Ponieważ Włochy ponownie stały się bastionem władzy cesarskiej, papież Rzymu złożył petycję, aby stać się księciem Świętego Cesarstwa Rzymskiego. Przyjęcie przez papieża władzy cesarza miałoby tragiczne konsekwencje dla świata katolickiego. Podczas gdy katolicy w Cesarstwie mogliby wzmocnić swoją wiarę dzięki legitymizacji nadanej przez papieskie członkostwo, ci spoza Cesarstwa raczej nie przyjmą takiej decyzji z zadowoleniem i mogą zwrócić się ku herezji."
 incident_pope_emperor_alert: "Ponieważ Włochy ponownie stały się bastionem władzy cesarskiej, papież Rzymu złożył petycję, aby stać się księciem Świętego Cesarstwa Rzymskiego. Przyjęcie przez papieża władzy cesarza miałoby tragiczne konsekwencje dla świata katolickiego. Podczas gdy katolicy w Cesarstwie mogliby wzmocnić swoją wiarę dzięki legitymizacji nadanej przez papieskie członkostwo, ci spoza Cesarstwa raczej nie przyjmą takiej decyzji z zadowoleniem i mogą zwrócić się ku herezji."
 flavour_tupi_tamoyo_force: "Każda posiadana prowincja sąsiadująca z kulturą Tupinamba otrzymuje modyfikator §Y„Wrogość Tupi”§! na §Y5§! lat, zapewniający następujące efekty: \nNiepokoje lokalne: §R+1§! \nLokalne dochody z podatków: §R-10%§! \nLokalny wzrost kolonii: §R-15§!"
 flavour_tupi_tamoyo_jesuits: "Każda posiadana prowincja kultury Tupinamba otrzymuje modyfikator §Y„Wrogość Tupi”§! na §Y10§! lat, zapewniający następujące efekty: \nNiepokoje lokalne: §R+1§! \nLokalne dochody z podatków: §R-10%§! \nLokalny wzrost kolonii: §R-15§!"
 flavor_tupi_confederation: "Wybranie tej opcji daje szansę na zawarcie sojuszy z innymi plemionami Tupi."
 tamoyo_rivals: "Wtrącający się rywale kolonialni"
 EVTOPTC710: "Stracić [Root.GetLowLevelOfficialForCountry_acc]"
 memes.1.t: "Regiis Proelis"
 memes.1.d: "Przywódca kompanii [da_company.GetName] znudził się i postanowił zorganizować pewną grę. Każdego członka kompanii porzucano w innej części regionu [da_company.Location.GetName], a jego zadaniem było wytropienie pozostałych."
 memes.1.opt.a: "[da_company.Leader.GetName], NIEEE!"
 memes.1.opt.b: "Chyba powinien był zapłacić za skrzynię szczęścia..."
 ven_mercenaries_paid_with_land: "Nadania ziemskie dla najemników"
 desc_ven_mercenaries_paid_with_land: "Przyznając najemnikom ziemię zamiast wypłacania im żołdu w monetach, możemy nieco zmniejszyć finansowe obciążenie związane z ich utrzymaniem."
 ven_venture_captain_recruitment: "Rekrutacja kapitanów kompanii"
 desc_ven_venture_captain_recruitment: "Przyciągnięcie większej liczby dowódców najemników do naszego państwa zwiększy nasze możliwości wystawiania dużych armii w nagłych sytuacjach i zapewni im kompetentnych generałów, choć będzie nas to nieco więcej kosztować."
 flavor_ara7_naples_goes_free: "Neapol uzyska niepodległość pod rządami syna Alfonsa V."
 opinion_NAP_paid_tribute: "Neapol zapłacił trybut"
 naples_in_union_with_france: "§YNeapol§! zostaje naszym młodszym partnerem w unii."
 mch_khan_of_the_mongols_mercs_unlocked_tt: "Odblokowuje dostęp do najemników §YChorągwi mongolskich§!."
 emp_swi_mercenaries_merc_tt: "Odblokowuje dostęp do najemników §YSzwajcarskiej Gwardii Krajowej§!."
 swiss_mountains_modifier: "Szwajcarscy górale"
 desc_swiss_mountains_modifier: "Nasze armie doskonale radzą sobie w walkach w wysokich górach Alp."
 flavor_tus.EVTNAME21: "Nadeszła chwila!"
 flavor_tus.EVTDESC21: "U szczytu naszej potęgi nadszedł moment, by przeprowadzić radykalne zmiany w ustroju państwa. Możemy ogłosić się królami albo potwierdzić nasze przywiązanie do ideałów republiki. Zgromadziliśmy tak wielką władzę, że możemy przeforsować dowolną zmianę."
 flavor_tus.EVTOPTA21: "Nasz ustrój jest doskonały taki, jaki jest!"
 flavor_tus.EVTOPTB21: "Naszym największym osiągnięciem będzie korona!"
 flavor_tus.EVTOPTC21: "Czas, by głos zabrał lud! A mówiąc „lud”, mamy na myśli patrycjuszy."
 flavour_swa.1.name: "Założenie Karlsruhe"
 flavour_swa.1.desc: "Miasto Durlach rozwinęło się w zamożny ośrodek. Odwiedzający często są jednak rozczarowani jego wyglądem i brakiem splendoru w porównaniu z głównymi miastami naszych sąsiadów. [Root.Monarch.GetTitle] [Root.Monarch.GetName] podziela tę opinię. Niedawno [Root.Monarch.GetSheHe] ujrzał we śnie wizję wspaniałego pałacu w sercu pięknego, uporządkowanego miasta – [Root.Monarch.GetHerHis] miasta.\n\nWładze miejskie Durlach niechętnie zgadzają się na gruntowną przebudowę miasta i jego pałaców, dlatego zaproponowano inną lokalizację, położoną w niewielkiej odległości od Durlach. Wybrane miejsce, które zwolennicy projektu chcą nazwać „Karlsruhe”, ma znaczny potencjał. Mieszkańcy Durlach mogą jednak poczuć urazę, jeśli ich miasto zostanie odsunięte na dalszy plan. Czy powinniśmy zbudować nowe miasto?"
 flavour_swa.1.A: "Załóżmy Karlsruhe."
 flavour_swa.1.B: "Nie widzimy potrzeby budowania nowego miasta."
 BRU_ideas: "Brunszwickie idee"
 BRU_ideas_start: "Brunszwickie tradycje"
 BRU_ideas_bonus: "Brunszwicka ambicja"
 bru_welfian_dynasty: "Dynastia Welfów"
 bru_welfian_dynasty_desc: "Nasza dynastia przetrwała setki lat. Jeden z jej przedstawicieli, Otton IV, został nawet cesarzem Świętego Cesarstwa Rzymskiego w XIII wieku. Nasze nazwisko jest zatem dobrze znane w całych Niemczech, co nadaje większą wagę naszym słowom."
 bru_residenzstadt_wolfenbuttel: "Rezydencja w Wolfenbüttel"
 bru_residenzstadt_wolfenbuttel_desc: "Niedawno przenieśliśmy naszą książęcą rezydencję do Wolfenbüttel, miasta o potężnych fortyfikacjach i wspaniałych pałacach. Dzięki naszemu patronatowi stanie się ono pomnikiem chwały i dobroczynności naszej dynastii."
 bru_herzog_august_bibliothek: "Biblioteka księcia Augusta"
 bru_herzog_august_bibliothek_desc: "Pokażemy nasze nowatorskie podejście, zakładając wspaniałą bibliotekę – największą na północ od Alp – która przyciągnie na nasz dwór rękopisy i uczonych z całej Europy."
 bru_trade_guilds: "Gildie brunszwickie"
 bru_trade_guilds_desc: "Choć formalnie należały do księstwa, miasta Brunszwik i Getynga przez długi czas cieszyły się półniezależnością i były rządzone przez wpływową warstwę mieszczan oraz patrycjuszy. Teraz, gdy ponownie umocniliśmy nad nimi naszą władzę, możemy wykorzystać zgromadzone przez nich doświadczenie, by zwiększyć produkcję."
 bru_leibnitz_lessing: "Leibniz i Lessing"
 bru_leibnitz_lessing_desc: "Wielu najwybitniejszych niemieckich myślicieli osiedliło się w Wolfenbüttel, wybierając nasz dwór jako miejsce publikacji traktatów filozoficznych i dzieł literackich. Jako ośrodek nauki w północnych Niemczech możemy liczyć na szybkie upowszechnianie się najnowszych idei na naszych ziemiach."
 bru_schwarze_schar: "Czarni Brunszwiczanie"
 bru_schwarze_schar_desc: "Brunszwiczanie nigdy nie poddadzą się obcej okupacji, niezależnie od tego, jak rozpaczliwa będzie sytuacja. Nawet jeśli wszystko wydawać się będzie stracone, nasze elitarne oddziały nadal będą nękać wroga i zdobywać sławę dzięki swoim wyczynom."
 LUN_ideas: "Lüneburskie idee"
 LUN_ideas_start: "Lüneburskie tradycje"
 LUN_ideas_bonus: "Lüneburska ambicja"
 lun_hansa_contacts: "Hanzeatyckie kontakty"
 lun_hansa_contacts_desc: "Nasze miasta często należały do Hanzy. Nasi kupcy zbudowali dzięki temu rozległą sieć kontaktów, którym mogą sprzedawać swoje towary."
 lun_staple_rights: "Prawo składu"
 lun_staple_rights_desc: "Nasze miasto posiada nie tylko prawo składu, zobowiązujące przejeżdżających kupców do wystawienia towarów na sprzedaż. Wznieśliśmy nawet umocnienia ziemne, by nie mogli nas ominąć. Dzięki temu na naszych targach można handlować wszelkiego rodzaju towarami, co przynosi miastu znaczne bogactwo."
 lun_adroit_diplomacy: "Zręczna dyplomacja"
 lun_adroit_diplomacy_desc: "Jako stosunkowo niewielkie księstwo przez lata musieliśmy rozwijać znaczne umiejętności dyplomatyczne, by zapewnić sobie przetrwanie. To doświadczenie będzie nam służyć również w przyszłości, gdy będziemy dążyć do zdobycia większego znaczenia."
 lun_dynastic_play: "Gałęzie dynastii"
 lun_dynastic_play_desc: "Dynastia Welfów ma liczne linie boczne, z których każda włada własnym niewielkim terytorium. Szansa, że nie znajdziemy odpowiedniego następcy tronu z naszego rodu, jest zatem niewielka."
 lun_lionhearted: "Lwie serce"
 lun_lionhearted_desc: "Widok naszego budzącego postrach sztandaru inspiruje żołnierzy do odwagi i wielkich czynów godnych ludzi o lwim sercu."
 ULM_ideas: "Ulmskie idee"
 ULM_ideas_start: "Ulmskie tradycje"
 ULM_ideas_bonus: "Ulmska ambicja"
 ulm_grosser_schwoerbrief: "Großer Schwörbrief"
 ulm_grosser_schwoerbrief_desc: "Großer Schwörbrief z 1397 roku potwierdza przywileje patrycjuszowskich kupców oraz licznych gildii handlowych w mieście. Nasi mieszczanie i rzemieślnicy, stanowiący fundament miasta, z pewnością rozkwitną pod rządami tej konstytucji."
 ulm_swabian_league: "Schwäbischer Bund"
 ulm_swabian_league_desc: "Schwäbischer Bund, czyli Liga Szwabska, jest związkiem Szwabów powołanym do obrony przed ekspansją Wittelsbachów z Bawarii i Palatynatu oraz rosnącą w siłę Konfederacją Szwajcarską na południu. Liczne układy zawarte z książętami Szwabii i sąsiednich ziem pomogą utrzymać potęgę naszego wolnego miasta i zachować przywilej bezpośredniej podległości cesarzowi. Poprowadzimy ligę do zwycięstwa nad zuchwałymi sąsiadami, którzy nam zagrażają."
 ulm_german_realism: "Kolebka niemieckiego realizmu"
 ulm_german_realism_desc: "Ulm jest siedzibą pracowni i galerii Hansa Multschera, pioniera niemieckiego renesansu. Artysta sprowadził do Niemiec realistyczny styl malarstwa i rzeźby, którego nauczył się podczas studiów we Francji i Niderlandach. Jego innowacje artystyczne przyniosły Ulm uznanie zarówno jako ośrodkowi kultury, jak i gospodarki południowych Niemiec. Wpływ, jaki może wywierać tak wybitny artysta, jest naprawdę niezwykły."
 ulm_duerer_fort: "Fortyfikacje Dürera"
 ulm_duerer_fort_desc: "Po próbie zdobycia miasta przez cesarza Ludwika Bawarskiego w 1316 roku rozbudowaliśmy fortyfikacje miejskie i nadaliśmy ich utrzymaniu najwyższy priorytet. Nowe innowacje wojskowe sprawiają jednak, że nasze miasto staje się coraz bardziej narażone na atak. Zmodernizujemy fortyfikacje, wykorzystując nowe zasady matematyczne, które zwiększą skuteczność artylerii obronnej i znacznie ograniczą efektywność artylerii oblegającej, czyniąc miasto o wiele trudniejszym do zdobycia."
 ulm_textile_trade: "Handel tekstyliami z Ulm"
 ulm_textile_trade_desc: "Nasza reputacja producentów wysokiej jakości tkanin przyniosła uznanie zarówno rzemieślnikom, jak i kupcom. Od setek lat tekstylia z Ulm zapewniają mieszkańcom bogactwo i dobrobyt dzięki handlowi wzdłuż Dunaju i z Włochami. Będziemy wspierać ten handel, pomagając naszym kupcom i zawierając korzystne porozumienia z gildiami oraz kupcami innych miast."
 ulm_swiss_mercs: "Zaciąg szwajcarskich najemników"
 ulm_swiss_mercs_desc: "Nasi południowi sąsiedzi słyną na dworach całej Europy ze znakomitych najemników. Rozwijając wzajemnie korzystne relacje, możemy pozyskać zdolnych żołnierzy do obrony naszej enklawy dobrobytu przed zagrożeniami, a być może także odstraszyć tych, którzy chcieliby naruszyć naszą niepodległość. Nasze wolne miasto musi pozostać wolne."
 ulm_minster: "Dokończenie katedry w Ulm"
 ulm_minster_desc: "Katedra w Ulm jest większa od wielu innych katedr. Została zaprojektowana tak, by pomieścić 20 000 wiernych, a jej wieża jest najwyższą znaną człowiekowi wieżą kościelną. Ogromna iglica stanowi pomnik nie tylko potęgi Kościoła, lecz także bogactwa naszych mieszczan. Choć budowę rozpoczęto w XIV wieku, świątynia wciąż nie została ukończona. Dopilnujemy, by jej dokończenie stało się naszym priorytetem."
 AUG_ideas: "Augsburskie idee"
 AUG_ideas_start: "Augsburskie tradycje"
 AUG_ideas_bonus: "Ambicja Augsburga"
 aug_augusta_vindelicorum: "Augusta Vindelicorum"
 aug_augusta_vindelicorum_desc: "Jesteśmy starym miastem, założonym przez samych Rzymian. Nazwano je Augusta Vindelicorum na cześć pierwszego wielkiego cesarza rzymskiego, Augusta, i uczyniono stolicą prowincji Recja. Choć Rzym, jaki znamy, już nie istnieje, Augsburg trwa, a wraz z nim rzymskie dziedzictwo."
 aug_afra_ulrich: "Miasto świętej Afry i świętego Ulryka"
 aug_afra_ulrich_desc: "Nasze miasto jest związane z dwojgiem wielkich świętych dawnych czasów: świętą Afrą i świętym Ulrykiem. Afra zapewniła schronienie chrześcijańskiemu biskupowi Narcyzowi z Girony w Augsburgu, gdy za panowania Rzymian trwały prześladowania. Później została ochrzczona przez Narcyza. Rzymianie odkryli jednak jej rolę w udzielaniu pomocy prześladowanym i stracili ją w 304 roku.\nŚwięty Ulryk odegrał mniejszą rolę w historii chrześcijaństwa, lecz był wielkim przywódcą naszego miasta. Rządził w latach 923–973 i doprowadził do budowy solidnych murów miejskich, które chroniły Augsburg przed łupieżczymi najazdami Węgrów."
 aug_hans_holbein: "Miejsce narodzin Hansa Holbeina młodszego"
 aug_hans_holbein_desc: "Hans Holbein młodszy (1497–1543) pochodził z rodziny malarzy; sam był zarówno drukarzem, jak i malarzem. Podczas gdy jego ojciec pozostał w Augsburgu i dostarczał dzieła miastu oraz okolicznym ziemiom, Hans młodszy wiele podróżował. Ostatecznie, dzięki pomocy filozofa Erazma z Rotterdamu, trafił na dwór angielski. Do jego najsłynniejszych dzieł należą portrety samego króla Henryka VIII."
 aug_fugger_welser: "Fuggerowie"
 aug_fugger_welser_desc: "Augsburg jest siedzibą Fuggerów, rodziny kupieckiej, której inwestycje i umiejętności handlowe wywarły wpływ na największe mocarstwa Europy. Zaczynając od sprzedaży wyrobów tkackich, Fuggerowie szybko zdobyli wpływy w całej Europie dzięki działalności bankowej, obrotowi nieruchomościami i dominacji w handlu miedzią."
 aug_elias_holl: "Budowle Eliasa Holla"
 aug_elias_holl_desc: "Elias Holl (1573–1646) był mistrzem budowlanym odpowiedzialnym za wzniesienie słynnej Złotej Sali – wspaniałej, złoconej sali reprezentacyjnej ratusza. Jego dzieła stanowią inspirację dla kolejnych pokoleń augsburskich architektów."
 aug_religionsfrieden: "Pokój religijny w Augsburgu"
 aug_religionsfrieden_desc: "Reformacja protestancka rozprzestrzeniała się po Świętym Cesarstwie Rzymskim niczym zaraza. Katolicy i protestanci prowadzili ze sobą wojny, a zagrożona została nawet suwerenność samego cesarza. Cesarz Karol V Habsburg (1500–1558) próbował powstrzymać reformację, walcząc z heretyckimi książętami, lecz ostatecznie musiał uznać porażkę. 25 września 1555 roku Karol podpisał augsburski pokój religijny i państwowy, który zapewnił jedność religijną w państwie. Nie przyznał on protestantom pełnej wolności wyznania ani nie zapobiegł wojnie trzydziestoletniej z 1618 roku, był jednak prekursorem traktatu pokojowego znanego później jako pokój westfalski."
 aug_textile_industry: "Przemysł tekstylny Augsburga"
 aug_textile_industry_desc: "Augsburg od dawna słynął z tkactwa i wysokiej jakości tekstyliów. Reputację tę częściowo utrwaliły wczesne strategie handlowe Fuggerów. Dzięki wykorzystaniu nurtu rzeki Lech augsburskie manufaktury tekstylne wytwarzają tkaniny najwyższej jakości i w dużych ilościach, zaopatrując w nie środkowe Niemcy."
 FRN_ideas: "Frankfurckie idee"
 FRN_ideas_start: "Frankfurckie tradycje"
 FRN_ideas_bonus: "Frankfurcka ambicja"
 frn_buchmesse: "Ustanowienie Targów Książki"
 frn_buchmesse_desc: "Dobrze znane dziś jarmarki we Frankfurcie wywodzą się z przywilejów nadanych przez cesarzy Fryderyka II w 1240 roku i Ludwika Bawarskiego w 1330 roku. Wraz z wynalezieniem prasy drukarskiej powinniśmy ustanowić kolejne targi, poświęcone wyłącznie sprzedaży książek. Przyniesie to korzyści nie tylko naszemu handlowi – liczne dzieła i innowacje przechodzące przez nasze miasto uczynią z niego jeden z najważniejszych ośrodków wiedzy i postępu na kontynencie."
 frn_stock_exchange: "Ujednolicenie kursów walut"
 frn_stock_exchange_desc: "Jako ważny ośrodek handlowy nasze miasto przyciąga zagranicznych kupców posługujących się wieloma różnymi walutami. Nasi przodkowie dopuścili do obiegu tylko trzy monety: turnozę, hellera i brabanckiego lovena. Systemy wymiany walut są jednak coraz bardziej przeciążone, a niedobór legalnego pieniądza pozwala przestępcom dokonywać ogromnych oszustw. Ustanowimy zatem centralną giełdę, opartą na corocznym zgromadzeniu, podczas którego najważniejsi kupcy będą ustalać kursy wymiany poszczególnych walut."
 frn_postzeitung: "Frankfurter Postzeitung"
 frn_postzeitung_desc: "Choć Frankfurter Postzeitung nie jest najstarszą gazetą regionalną w Cesarstwie, jako pierwsza zdobyła wielką popularność w całych Niemczech. Dzięki centralnemu położeniu naszego miasta na szlakach handlowych wiadomości z całych Niemiec i odleglejszych krajów szybko docierają do Frankfurtu, skąd Postzeitung można łatwo rozprowadzać po całym kraju."
 frn_imperial_elections: "Siedziba wyborów i koronacji cesarskich"
 frn_imperial_elections_desc: "Złota Bulla z 1356 roku ustanowiła Frankfurt miejscem wyborów cesarskich. Obecnie coraz częściej koronacje cesarzy odbywają się również w katedrze frankfurckiej. Wspaniała ceremonia koronacyjna jest doskonałą okazją do nawiązywania kontaktów dyplomatycznych w całym Świętym Cesarstwie Rzymskim, ponieważ przybywa na nią niemal każdy władca. Zrobimy na nich wrażenie przepychem uroczystości!"
 frn_cultural_center: "Cywilne centrum kultury"
 frn_cultural_center_desc: "Ponieważ nie podlegamy monarsze ani biskupowi, wszystkie nasze instytucje kultury zależą wyłącznie od zaangażowania mieszkańców. Przez lata utworzyliśmy wiele wartościowych placówek, takich jak Teatr Narodowy we Frankfurcie i Frankfurckie Towarzystwo Muzealne. Dzięki nim splendor naszego miasta przewyższa niewątpliwie wiele miast rezydencjonalnych!"
 frn_sausages: "Frankfurter Würstchen"
 frn_sausages_desc: "Nasze ukochane i popularne kiełbaski frankfurckie są wędzone i wyrabiane z wieprzowiny, choć niektórzy nieuczciwi rzeźnicy dodają do nich inne mięso. Zarządzimy zatem, że każdy rzeźnik może przetwarzać tylko jeden rodzaj mięsa dziennie, aby zachować czystość receptury naszych słynnych kiełbasek."
 frn_freie_stadt: "Freie Stadt Frankfurt"
 frn_freie_stadt_desc: "Przez stulecia Frankfurt był republiką oligarchiczną, zdominowaną przez patrycjuszy. Taki system polityczny stoi jednak w sprzeczności z oświeconymi ideami rozprzestrzeniającymi się po Europie i hamuje rozwój miasta. Dostosujemy się do nowych czasów, zmieniając konstytucję: zagwarantujemy równe prawa wszystkim wyznaniom chrześcijańskim, poprawimy sytuację i prawa niechrześcijan oraz zniesiemy dawne przywileje patrycjuszy. Odtąd wszyscy mężczyźni powyżej 21. roku życia, posiadający odpowiedni majątek we Frankfurcie, będą mogli głosować i decydować o losach miasta!"
 KOL_ideas: "Kolońskie idee"
 KOL_ideas_start: "Kolońskie tradycje"
 KOL_ideas_bonus: "Kolońska ambicja"
 kol_pursuit_of_unity: "Dążenie do jedności terytorialnej"
 kol_pursuit_of_unity_desc: "Nasze terytorium jest geograficznie podzielone między Nadrenię i Westfalię. Musimy znaleźć sposób na zjednoczenie naszych świeckich posiadłości, aby wzmocnić biskupstwo i scentralizować rządy. Być może w naszych archiwach znajdziemy jakieś zapomniane roszczenia."
 kol_archchancellor_of_italy: "Archicancellarius per Italiam"
 kol_archchancellor_of_italy_desc: "W ramach Świętego Cesarstwa Rzymskiego dzierżymy tytuł arcykanclerza Włoch. Choć nie wiąże się on z wielką władzą materialną ani obowiązkami, zapewnia nam prestiż i pomaga zdobywać szacunek innych książąt."
 kol_hanseatic_city: "Hanzeckie miasto handlowe"
 kol_hanseatic_city_desc: "Dzięki centralnemu położeniu nad Renem oraz powiązaniom handlowym z Europą Zachodnią i Wschodnią Kolonia tradycyjnie należała do czołowych członków Hanzy. Handel z Anglią i kontakty w ramach związku uczyniły z niej duże i zamożne miasto kupieckie. Wspierając dalszy rozwój, zapewnimy sobie w przyszłości obfite korzyści gospodarcze!"
 kol_prime_minister: "Premier Kolonii"
 kol_prime_minister_desc: "Zarządzanie tak rozległym biskupstwem jak Kolonia wymaga wiele czasu. Aby administrować tymi ziemiami, arcybiskup zaniedbuje obowiązki duchowe, co wywołuje niezadowolenie poddanych. Ustanawiając urząd premiera, któremu zostanie powierzona świecka administracja arcybiskupstwa, zapewnimy arcybiskupowi więcej czasu na troskę o duchowe potrzeby mieszkańców Kolonii."
 kol_pivotal_ecclesiastic_territory: "Kluczowe terytorium kościelne"
 kol_pivotal_ecclesiastic_territory_desc: "Jako biskupstwo elektorskie i jedno z największych terytoriów kościelnych Cesarstwa Kolonia odgrywa kluczową rolę w wojnach religijnych. Nasze poparcie może przesądzić o zwycięstwie lub upadku każdej ze stron konfliktu. Wykorzystamy tę okazję, by szerzyć prawość i poprawność religijną w całych Niemczech."
 kol_shifting_alliances: "Zmienne sojusze"
 kol_shifting_alliances_desc: "Jako państwo, którego potęga opiera się bardziej na prestiżu niż sile militarnej, arcybiskupstwo potrzebuje kompetentnej, a czasem nawet przebiegłej dyplomacji, by przetrwać. Przez lata sprawowania godności elektorskiej w Świętym Cesarstwie Rzymskim biskupi-elektorzy zdołali nawiązać silne więzi z innymi państwami i poznać kilka sztuczek dyplomatycznego rzemiosła."
 kol_order_of_saint_michael: "Zakon świętego Michała"
 kol_order_of_saint_michael_desc: "Naszym obowiązkiem jest podporządkowanie szlachty naszego terytorium zasadom wiary uznawanym przez Kościół, aby bronić religii w naszym biskupstwie. W tym celu powinniśmy ustanowić zakon wojskowy dostępny wyłącznie dla szlachciców. Zakon, którego patronem będzie święty Michał, nauczy możnych modlitwy i przyjmowania sakramentów z czystą duszą. W ten sposób zyskają dyscyplinę i gorliwość niezbędne do obrony naszego biskupstwa przed wrogami duchowymi i doczesnymi."
 MAI_ideas: "Mogunckie idee"
 MAI_ideas_start: "Mogunckie tradycje"
 MAI_ideas_bonus: "Moguncka ambicja"
 mai_archchancellor_of_germany: "Archicancellarius per Germaniam"
 mai_archchancellor_of_germany_desc: "Od X wieku arcybiskupi Moguncji dzierżą tytuł arcykanclerza, dzięki czemu są najwyższymi dostojnikami Cesarstwa po samym cesarzu. Naszym najważniejszym obowiązkiem jest zwoływanie i organizowanie wyborów cesarskich oraz kierowanie pozostałymi elektorami w poszukiwaniu nowego cesarza."
 mai_center_of_religious_learning: "Ośrodek nauk religijnych"
 mai_center_of_religious_learning_desc: "Moguncja, jeden z najważniejszych ośrodków nauk religijnych i teologii w całej Europie, jest domem wielu wybitnych uczonych chrześcijańskich i żydowskich. Nad nimi czuwa katedra świętego Marcina, siedziba naszego biskupa, w której koronowano królów i cesarzy."
 mai_saint_hildegard: "Święta Hildegarda z Bingen"
 mai_saint_hildegard_desc: "Hildegarda z Bingen, benedyktyńska opatka i polihistorka z XII wieku, jest czczona jako święta w naszym regionie. Jej kanonizację utrudniały jednak spory między dawnymi arcybiskupami a papieżem. Teraz Hildegarda została wreszcie wpisana do rzymskiego martyrologium, co jeszcze bardziej umocni cześć dla niej, a także dla Kościoła, wśród zwykłych ludzi."
 mai_weck_worscht_woi: "Weck, Worscht & Woi"
 mai_weck_worscht_woi_desc: "Weck, Worscht un Woi – chleb, kiełbasa i wino – to ulubiony posiłek naszych poddanych. Dzięki prostocie łatwo go transportować, dlatego doskonale nadaje się na racje żywnościowe dla armii. Posiadamy żyzne ziemie i najlepsze winnice w całych Niemczech, więc bez trudu zapewnimy żołnierzom Weck, Worscht un Woi, podtrzymując ich morale!"
 mai_perpetual_privy_council: "Stała rada tajna"
 mai_perpetual_privy_council_desc: "Rozproszone terytoria, którymi rządzimy, wymusiły utworzenie trwałej administracji centralnej – stałej rady tajnej. Odtąd narzucimy poddanym bardziej rygorystyczne rządy, odbierzemy stanom ich władzę i uniemożliwimy im zwoływanie zgromadzeń."
 mai_rhine_fortress: "Straż nad Renem"
 mai_rhine_fortress_desc: "Od powstania Świętego Cesarstwa Rzymskiego ziemiom niemieckim zagrażają wrogowie z zachodu, którzy wielokrotnie próbowali zepchnąć nas za Ren. Jako najsilniejsza twierdza na zachodnim brzegu rzeki jesteśmy mieczem i tarczą Cesarstwa. Naszym świętym obowiązkiem jest stawić opór każdemu najeźdźcy!"
 mai_fifth_season: "Piąta pora roku"
 mai_fifth_season_desc: "W mniej oświeconych krajach zwykłym ludziom zabrania się krytykowania szlachty. W Moguncji jest inaczej, gdy nadchodzi doroczny karnawał. Pod osłoną masek i dzwonków mieszkańcy mogą wyśmiewać niesprawiedliwości społeczne i polityczne, a na jeden dzień wcielać się w przedstawicieli innych stanów. Kto podczas karnawału nie jest błaznem, przez resztę roku sam jest głupcem!"
 por_royal_military_academy: "Królewska Akademia Fortyfikacji, Artylerii i Rysunku"
 por_royal_military_academy_desc: "Nasze korpusy artylerii i fortyfikacje od dawna stanowią podstawę obrony kraju, czyniąc nasze niewielkie państwo trudnym orzechem do zgryzienia dla wrogich armii. Założymy akademię wojskową – Academia Real de Fortificação, Artilharia e Desenho – aby kształcić oficerów w tych dziedzinach. Dzięki temu będą mogli przekształcić nasze twierdze i artylerię w najlepsze na świecie!"
 TRI_ideas: "Trewirskie idee"
 TRI_ideas_start: "Trewirskie tradycje"
 TRI_ideas_bonus: "Trewirska ambicja"
 tri_crusader_past: "Krzyżacka i krucjatowa przeszłość"
 tri_crusader_past_desc: "Przed wiekami wielu dzielnych ludzi opuściło nasz kraj jako krzyżowcy, by wziąć udział w wyprawach krzyżowych. Ich czyny głęboko zapisały się w pamięci naszego biskupstwa. Nasz herb – krzyż świętego Jerzego – został wybrany na ich cześć. Niech wszyscy nasi żołnierze pamiętają o krucjatowej przeszłości i pokażą, że wciąż płonie w nich dawny ogień."
 tri_university_of_trier: "Uniwersytet w Trewirze"
 tri_university_of_trier_desc: "Papież zezwolił nam na założenie uniwersytetu w naszym mieście, gdzie będziemy kształcić przyszłych kapłanów i urzędników naszego biskupstwa. Uczyńmy to, a ponadto wesprzyjmy studia prawnicze i medyczne, aby Trewir stał się prawdziwym ośrodkiem nauki, przyciągającym studentów z daleka."
 tri_archchancellor_of_gaul: "Archicancellarius per Galliam"
 tri_archchancellor_of_gaul_desc: "Jako arcykanclerz Arles, Burgundii i całej Francji mamy prawo i obowiązek przywrócić te utracone ziemie Cesarstwu. Pod naszym sztandarem odtworzymy cesarskie panowanie we Francji!"
 tri_landesburgen: "Landesburgen"
 tri_landesburgen_desc: "Na naszych świeckich terytoriach znajduje się kilka zamków zwanych „Landesburgen”. Odgrywają one kluczową rolę w administracji, służąc jako siedziby urzędników, punkty poboru opłat oraz silne pozycje, wokół których możemy organizować obronę przed wrogami."
 tri_seamless_robe_of_jesus: "Bezszwowa szata Jezusa"
 tri_seamless_robe_of_jesus_desc: "Podobno Helena, matka cesarza rzymskiego Konstantyna Wielkiego, wysłała Świętą Szatę Jezusa do Trewiru, zwanego wówczas Augusta Treverorum, po odnalezieniu jej w Jerozolimie. Od tamtej pory przechowywana jest w relikwiarzu katedry w Trewirze. Od czasu do czasu wystawiamy ją jednak na widok wiernych, przyciągając do miasta rzesze pielgrzymów."
 tri_prum_abbey: "Opactwo w Prüm"
 tri_prum_abbey_desc: "Prüm było ulubionym klasztorem Karolingów. Po ślubie z Bertradą Młodszą, wnuczką założyciela opactwa, król Pepin Krótki nadał mu liczne przywileje i rozległe posiadłości. Z biegiem lat stało się nie tylko pięknym opactwem, lecz także ośrodkiem nauki kościelnej. Od tamtych czasów znacznie jednak podupadło i nie jest w stanie samodzielnie się utrzymać. Przejmiemy administrację opactwa i przywrócimy mu dawną świetność!"
 tri_domkapitel: "Wpływy kapituły katedralnej"
 tri_domkapitel_desc: "Kapituła katedralna, czyli Domkapitel, ma ogromny wpływ na arcybiskupstwo. Wybiera nowych arcybiskupów, decyduje, kiedy arcybiskup może zwołać stany, a podczas jego nieobecności sprawuje władzę w jego imieniu. Dzięki czujności kapituły Trewir będzie zawsze dobrze zarządzany, niezależnie od tego, czy arcybiskup przebywa na miejscu."
 new_flavour_bav.181.name: "Wygaśnięcie dekretu religijnego"
 new_flavour_bav.181.desc: "W poprzednich latach wprowadziliśmy dekret religijny, aby powstrzymać szerzenie się herezji na naszych ziemiach. Okazał się skuteczny i przetrwaliśmy tak zwaną reformację, nie rezygnując z naszej wiary. Teraz, gdy zagrożenie dla katolicyzmu minęło, nadszedł czas zakończenia obowiązywania dekretu i zniesienia ograniczeń nałożonych na duchowieństwo."
 new_flavour_bav.181.A: "Dobrze."
 new_flavour_bav.20.a.tooltip: "\nPo narodzinach następcy tronu:"
 new_flavour_bav.201.name: "Ukończenie kościoła teatynów"
 new_flavour_bav.201.desc: "Kościół, którego budowę [Root.Monarch.GetTitle] [Root.Monarch.GetName] obiecał [Root.Consort.GetTitle] [Root.Consort.GetName], gdy urodzi mu następcę tronu, został ukończony po narodzinach [Root.Heir.GetName]. Znany jako kościół teatynów, zachwyca pięknem i stanowi cenną ozdobę naszej stolicy!"
 new_flavour_bav.201.A: "Doskonale."
 new_flavour_bav.2401.name: "Ratyzbona spłaca swoje długi"
 new_flavour_bav.2401.desc: "Miasto Ratyzbona spłaciło wobec nas wszystkie swoje długi."
 new_flavour_bav.2401.opt: "Doskonale."
 new_flavour_bav.2402.desc: "Miasto Ratyzbona zdołało w całości spłacić swoje długi wobec cesarza, nie korzystając z naszej oferty."
 new_flavour_bav.2402.opt: "A więc nasza hojność poszła na marne?"
 new_flavour_bav.2403.name: "Ratyzbona nie spłaca swoich długów"
 new_flavour_bav.2403.desc: "Miasto Ratyzbona nie zdołało spłacić swoich długów i nie wywiązało się ze zobowiązań wobec nas. Nie mamy wyboru – musimy odebrać mu status wolnego miasta i przekazać je biskupstwu ratyzbońskiemu."
 new_flavour_bav.2403.opt: "To jest nieszczęście."
 new_flavour_bav.2404.desc: "Miasto Ratyzbona odrzuciło naszą ofertę i postanowiło nie spłacać długu wobec cesarza. W konsekwencji odebrano mu status wolnego miasta, a kontrolę nad nim przekazano biskupstwu ratyzbońskiemu."
 new_flavour_bav.2404.opt: "A przecież tak uprzejmie prosiliśmy..."
 new_flavour_bav.2405.name: "Państwo [regensburg_fromfrom.GetName] interweniuje w obronie Ratyzbony"
 new_flavour_bav.2405.desc: "[regensburg_fromfrom.GetRulerAdjAndTitle] interweniował w obronie Ratyzbony i spłacił jej długi w zamian za przejęcie kontroli nad samym miastem. Wygląda na to, że władze Ratyzbony były tak zdesperowane, iż nie miały wyboru i musiały przyjąć tę propozycję. Jest to bezpośrednie wyzwanie dla naszej władzy, ponieważ Ratyzbona była miastem cesarskim pod naszą ochroną!"
 new_flavour_bav.2405.opt: "Nie możemy tego tolerować."
 new_flavour_bav.2406.desc: "Władze Ratyzbony serdecznie dziękują nam za ofertę, którą nie mają wyboru i muszą przyjąć. Otworzyły bramy miasta, by umożliwić wejście naszemu garnizonowi. Cesarz jest jednak daleki od zadowolenia z takiego obrotu spraw."
 new_flavour_bav.2406.opt: "Doskonale."
 flavor_sax.8.A.tooltip: "§YSaksonia§! NIE otrzyma casus belli §YOdzyskanie unii§! przeciwko §YTuryngii§!."
 flavor_sax.5.name: "Zażegnanie bratobójczej wojny saskiej"
 flavor_sax.5.desc: "Po śmierci wuja [From.Monarch.GetTitle] [From.Monarch.GetName], Fryderyka Turyńskiego, ziemie turyńskie dynastii Wettynów znalazły się pod panowaniem państwa [From.GetName]. Wkrótce jednak wybuchł spór między [From.Monarch.GetTitle] a jego bratem Wilhelmem o sprawiedliwy podział tych ziem. Zgodnie z podziałem w Altenburgu, wynegocjowanym przy pomocy Brandenburgii i Hesji, bracia mieli wspólnie sprawować rządy, a Wilhelm miał otrzymać władzę nad Turyngią.\n\nWilhelm nigdy nie był jednak zadowolony z tego porozumienia. Wywierając presję na [From.Monarch.GetName], zdołał doprowadzić do renegocjacji układu, dzięki czemu jego posiadłości obejmują teraz również Wittenbergę."
 flavor_sax.51.name: "Bratobójcza wojna saska"
 flavor_sax.51.desc: "Po śmierci wuja [From.Monarch.GetTitle] [From.Monarch.GetName], Fryderyka Turyńskiego, ziemie turyńskie dynastii Wettynów znalazły się pod panowaniem państwa [From.GetName]. Wkrótce jednak wybuchł spór między [From.Monarch.GetTitle] a jego bratem Wilhelmem o sprawiedliwy podział tych ziem. Zgodnie z podziałem w Altenburgu, wynegocjowanym przy pomocy Brandenburgii i Hesji, bracia mieli wspólnie sprawować rządy, a Wilhelm miał otrzymać władzę nad Turyngią.\n\nWilhelm nigdy nie był jednak zadowolony z tego porozumienia. Wobec upartej odmowy [From.Monarch.GetTitle] [From.Monarch.GetName], który nie chciał ponownie rozważyć warunków układu, Wilhelm chwycił za broń przeciwko rządom brata."
 flavor_sax.51.opt: "Niech żyje książę Wilhelm!"
 flavor_sax.81.name: "Traktat w Lipsku"
 flavor_sax.81.desc: "Zgodnie z ostatnią wolą Fryderyka II ziemie saskie zostały podzielone między [From.Monarch.GetName], który objął Miśnię, oraz jego [From.Monarch.GetHerHis] brata Ernesta, który przejął Turyngię. Obaj bracia będą odtąd w pełni niezależnie rządzić swoimi ziemiami."
 flavor_sax.81.opt: "Niech żyje książę Ernest!"
 flavor_sax.82.name: "Traktat w Lipsku"
 flavor_sax.82.desc: "Zgodnie z ostatnią wolą Fryderyka II ziemie saskie miały zostać podzielone między [From.Monarch.GetName], który miał objąć Miśnię, oraz jego [From.Monarch.GetHerHis] brata Ernesta, któremu miała przypaść Turyngia. Nikczemny [From.Monarch.GetName] postanowił jednak nie uszanować testamentu, twierdząc, że Fryderyk pod koniec życia cierpiał na napady szaleństwa. [From.Monarch.GetSheHeCap] zamierza teraz narzucić nam [From.Monarch.GetHerHis] bezprawne rządy."
 flavor_sax.82.opt: "Nie możemy na to pozwolić."
 new_flavour_nap.5.B: "Być może i my powinniśmy wesprzeć tych rebeliantów."
 flavor_hun.1.c: "János Hunyadi zostanie naszym nowym królem."
