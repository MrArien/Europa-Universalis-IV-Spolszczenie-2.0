 bullion_famine.1.t: "Wielki głód złota"
 bullion_famine.1.d: "Często płacimy złotem za import jedwabiu, ałunu, przypraw i pereł ze Wschodu. W miarę jak handel między Wschodem a Zachodem staje się coraz częstszy, deficyt złota w Europie staje się coraz bardziej widoczny. Złoto staje się coraz rzadszym towarem w naszym świecie, ale popyt na te luksusy nie maleje. Gdybyśmy uzyskali dostęp do źródła złota poza Europą, położylibyśmy kres temu głodowi złota."
 bullion_famine.1.a: "Powinniśmy zacząć szukać złota, zanim zrobią to inni."
 bullion_famine.1.tooltip: "Pierwsza chrześcijańska europejska potęga, która zabezpieczy nowe źródło złota, odniesie wielkie korzyści."
 bullion_famine.2.t: "Złoto odkryte w prowincji [noneuropean_gold_province.GetName]"
 bullion_famine.2.d: "Nasi odkrywcy zapuścili się w głąb niezbadanych obszarów obcych ziem w poszukiwaniu złota. W końcu się udało – odkryliśmy kopalnię złota w prowincji [noneuropean_gold_province.GetName]. To odkrycie z pewnością położy kres niedoborowi kruszców nękającemu Europę."
 bullion_famine.2.a: "Znaleźliśmy złoto w prowincji [noneuropean_gold_province.GetName]!"
 bullion_gold_mining: "Odkrycie złota"
 desc_bullion_gold_mining: "Nasi ludzie odkryli złoto na obcych ziemiach."
