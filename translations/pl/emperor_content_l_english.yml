 hussite.3.t: "Śluby ubóstwa"
 hussite.3.d: "Wiele sekt husyckich odrzuca gromadzenie bogactw duchownych, kojarząc je z grzeszną dekadencją Kościoła katolickiego. Śluby ubóstwa wśród księży stają się powszechne, a Kościół [Root.GetAdjective] coraz bardziej ogranicza się do spraw duchowych i powstrzymuje się od ingerowania w doczesne sprawy państwa lub ziemi."
 hussite.3.a: "Zachęcajmy duchownych do składania ślubów."
 hussite.3.b: "Silny Kościół ma swoje zalety."
