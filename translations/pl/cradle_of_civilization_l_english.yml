 desc_local_merchants_outcompeted: "Miejscowi kupcy w tej prowincji zostali pokonani przez obcokrajowców, którzy zdominowali działalność handlową w tutejszych miastach. Tworzy się więcej dóbr niż wcześniej, ale większość zysków trafia w obce ręce. "
 protectionism: "Protekcjonizm"
 local_protectionism: "Lokalny protekcjonizm"
 desc_local_protectionism: "W celu zapewnienia miejscowym kupcom pierwszeństwa przed zagranicznymi interesami, bardzo utrudniliśmy życie obcym w tej prowincji. Być może zahamowało to lokalną gospodarkę, ale teraz możemy być pewni, że zyski trafiają do ludzi, którzy na nie zasługują. "
