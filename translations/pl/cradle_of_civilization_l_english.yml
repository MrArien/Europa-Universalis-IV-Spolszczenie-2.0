 mamluk_amir_al_hajj: "Mamelucki amir al-hadżdż"
 desc_mamluk_amir_al_hajj: "Powierzyliśmy jednemu z najbardziej zaufanych mameluków zadanie ochrony karawan zmierzających do świętych miast. Nie ma wojowników równie biegłych jak nasi, więc karawany powinny być bezpieczne, nawet jeśli ich opiekun nie zna dobrze miejscowego terenu ani ludności."
 diplomat_amir_al_hajj: ""
 desc_diplomat_amir_al_hajj: ""
 warrior_amir_al_hajj: ""
 desc_warrior_amir_al_hajj: ""
 bedouin_amir_al_hajj: ""
 desc_bedouin_amir_al_hajj: ""
 awlad_al_nas_commander: "Dowódca z awlad al-nas"
 desc_awlad_al_nas_commander: "Obronę państwa [Root.GetName] powierzono ambitnym przedstawicielom awlad al-nas — synom wyzwolonych mameluków."
 mamluk_commander: "Mamelucki dowódca"
 desc_mamluk_commander: "Obroną tego obszaru kieruje jeden z naszych najbardziej zaufanych mameluków."
 trusting_old_guard: ""
 desc_trusting_old_guard: ""
 loyal_mamluks_in_high_positions: "Lojalni mamelucy"
 desc_loyal_mamluks_in_high_positions: "Zastąpiliśmy mameluków wyniesionych do władzy przez naszych poprzedników lojalnymi, świeżo zakupionymi niewolnikami. Nie przysporzyło nam to przyjaciół wśród kairskich rodów, ale przynajmniej możemy teraz ufać naszym oficerom."
 mamluk_events.0.t: "Mamelucka sukcesja"
 mamluk_events.0.d: "Śmierć [Root.Monarch.GetName] pozostawiła nasze państwo bez władcy. Wszystkie najważniejsze rody mameluckie w [Root.Capital.GetCapitalName] zabiegają o wpływy, by mieć decydujący głos w wyborze następcy. To, który z kandydatów zwycięży, przesądzi o tym, które rody i części kraju poprą nowego władcę. Jedno jest pewne: ci, którzy liczyli na zwycięstwo własnego stronnictwa, nie powitają nowego [Root.Monarch.GetTitle] z radością. Niektórzy mogą nawet poświęcić resztę życia na ograniczanie jego wpływów."
 mamluk_events.0.a: "Potrzebujemy poparcia mameluków kultury [first_ruler_alternative_province.Culture.GetName]."
 mamluk_events.0.b: "Teraz przydadzą nam się wyłącznie mamelucy kultury [second_ruler_alternative_province.Culture.GetName]."
 mamluk_events.0.c: "Popieramy kandydata kultury [third_ruler_alternative_province.Culture.GetName]!"
 mamluk_events.0.dd: "Najlepszym kandydatem będzie ktoś niezwiązany z kairskimi stronnictwami..."
 mamluk_events.1.t: "Żołnierze kultury [not_ruling_culture_province.Culture.GetName]"
 mamluk_events.1.d: "Choć mamelucy stanowią trzon naszych sił zbrojnych, nie cała nasza potęga militarna opiera się na niewolnikach-wojownikach. Znaczną część piechoty tworzą miejscowi żołnierze kultury [not_ruling_culture_province.Culture.GetName], którzy pełnią również służbę wartowniczą i garnizonową. Niewielkie szanse na awans i niskie żołdy nie sprzyjają jednak motywacji, a ich lojalność pozostaje niepewna. Amir odpowiedzialny za te oddziały często zaniedbuje ich szkolenie i wyposażenie. W [not_ruling_culture_province.GetAreaName] nieufność między ludnością kultury [not_ruling_culture_province.Culture.GetName] a mameluckimi amirami doprowadziła do buntu."
 mamluk_events.1.a: "Musimy stłumić bunt, zanim się rozprzestrzeni!"
 mamluk_events.1.b: "Zobaczmy, co możemy zrobić, by poprawić ich sytuację."
 mamluk_events.2.t: "Tarh i monopole królewskie"
 mamluk_events.2.d: "Nasi poprzednicy mądrze wykorzystywali system monopoli królewskich, aby kontrolować dochody z upraw dochodowych i towarów luksusowych. Wraz ze spadkiem popytu nasze inwestycje zaczęły jednak przynosić straty. Zarządca w prowincji [monopoly_province.GetName] donosi, że od dwóch lat nie zdołał sprzedać zgromadzonych zapasów i obawia się, że państwo poniesie dalsze koszty. Proponuje zmusić poddanych do zakupu tych towarów po ustalonej cenie, aby odzyskać zainwestowane środki. Taki proceder tradycyjnie nazywa się tarh."
 mamluk_events.2.a: "Cóż za znakomity pomysł!"
 mamluk_events.2.b: "Będziemy musieli ponieść te koszty."
 mamluk_events.3.t: "Bunt amira kultury [mamluk_province.Culture.GetName]"
 mamluk_events.3.d: "Jeden z najpotężniejszych mameluckich amirów zbudował własne zaplecze polityczne w [mamluk_province.GetAreaName] i ruszył teraz na [Root.Capital.GetCapitalName]. Krążą pogłoski, że jego sprawa cieszy się szerokim poparciem wśród kairskich rodów mameluckich, a nawet w samej cytadeli."
 mamluk_events.3.a: "Za zdradę należy się śmierć!"
 mamluk_events.4.t: "Frakcjonaliści"
 mamluk_events.4.d: "[Root.Monarch.GetTitle] nie jest jedyną osobą posiadającą mameluków w naszym [Root.GovernmentName]. W domach wpływowych wyzwolonych mameluków często służą równie liczne, a czasem nawet liczniejsze zastępy niewolników sprowadzonych z ich rodzinnych stron. Ci potężni amirzy mają zwykle największy wpływ na wybór następcy tronu, lecz nawet po obsadzeniu tronu rody mameluckie odgrywają istotną rolę w polityce [Root.GetAdjective]. [Root.Monarch.GetName] musi zadbać, by rywalizacja tych stronnictw nie sparaliżowała życia politycznego [Root.Capital.GetCapitalName]."
 mamluk_events.4.a: "Musimy spróbować skłócić ich ze sobą."
 mamluk_events.4.b: "Wybierzmy strony i poprzyjmy silniejsze stronnictwa."
 mamluk_events.5.t: "Przewrót pałacowy"
 mamluk_events.5.d: "Głęboko niezadowoleni z nieudolnych rządów [Root.Monarch.GetName], wpływowi mameluccy amirzy postanowili obalić naszego [Root.Monarch.GetTitle] i osadzić na tronie zdolniejszego wojownika."
 mamluk_events.5.a: "Nie opuścimy [Root.Monarch.GetName]!"
 mamluk_events.5.b: "Wszyscy ludzie są śmiertelni."
 mamluk_events.6.t: "Miasto Kair"
 mamluk_events.6.d: "Kair jest znacznie starszy niż nasze [Root.GovernmentName]. Przez setki, a być może nawet tysiąc lat, kolejni władcy i zdobywcy upiększali to miasto. Zaprowadzenie porządku w jego labiryncie budowli — od grobowców Miasta Umarłych i slumsów Fustatu, przez tętniące życiem targowiska Chan al-Chalili, aż po samą potężną Cytadelę Kairską — okazało się monumentalnym zadaniem dla wielu naszych poprzedników. Mimo to od [Root.Monarch.GetName], jako pana miasta, oczekuje się, że odciśnie na Kairze własne piętno: upiększy je i rozbuduje, a także zwalczy choroby oraz zaprowadzi porządek."
 mamluk_events.6.a: "Odnowimy suki i targowisko Chan al-Chalili."
 mamluk_events.6.b: "Musimy zająć się rozrastającymi się slumsami i przedmieściami."
 mamluk_events.6.c: "Meczety i al-Azhar wymagają naszej uwagi."
 mamluk_events.6.dd: "Skupmy się na samej cytadeli i obronie miasta."
 mamluk_events.6.e: "Przyszłe pokolenia będą zazdrościć nam wzniesionych pomników."
 mamluk_events.6.f: "Obecnie niewiele możemy zrobić dla mieszkańców Kairu."
 mamluk_events.7.t: "Nowy amir al-hadżdż"
 mamluk_events.7.d: "Pielgrzymka do świętych miast Mekki i Medyny to obowiązek, który każdy muzułmanin powinien wypełnić przynajmniej raz w życiu. Jako [Root.Monarch.GetTitle] odpowiadamy za to, by pielgrzymi mogli bezpiecznie dotrzeć do celu. Funkcja ta wymaga zarówno sprytu, jak i umiejętności wojskowych: niekiedy trzeba pokonać rozbójników, innym razem wynegocjować prawo przejazdu z miejscowymi władcami, a czasem uciec się do gróźb lub przekupstwa. Amir al-hadżdż będzie odpowiadał za karawany pielgrzymkowe i otrzyma dużą swobodę w zapewnianiu wszystkim pielgrzymom z [Root.GetAdjective] bezpiecznej i spokojnej podróży."
 mamluk_events.7.a: "Wybierzmy Beduina, najlepszego spośród naszych ludzi."
 mamluk_events.7.a.tt: "Wybór §Yamira al-hadżdż§! wpłynie zarówno na szanse powodzenia karawan pielgrzymkowych, jak i na rodzaj konsekwencji ewentualnych problemów podczas hadżdżu:\\nBeduiński amir al-hadżdż będzie potrafił ochronić karawany przed zagrożeniami, z którymi nie poradziliby sobie pozostali kandydaci."
 mamluk_events.7.b: "Wybierzmy Beduina, który zna pustynie Arabii jak własną kieszeń."
 mamluk_events.7.c: "To zadanie wymaga doświadczonego wojownika."
 mamluk_events.7.c.tt: "Wybór §Yamira al-hadżdż§! wpłynie zarówno na szanse powodzenia karawan pielgrzymkowych, jak i na rodzaj konsekwencji ewentualnych problemów podczas hadżdżu:\\nWojownik- Amir al-hadżdż będzie miał duże szanse obronić karawanę w razie napaści, lecz brak taktu może prowadzić do niepotrzebnych konfliktów."
 mamluk_events.7.dd: "Najlepiej poradzi sobie z tym zdolny dyplomata."
 mamluk_events.7.dd.tt: "Wybór §Yamira al-hadżdż§! wpłynie zarówno na szanse powodzenia karawan pielgrzymkowych, jak i na rodzaj konsekwencji ewentualnych problemów podczas hadżdżu:\\nDyplomata pełniący funkcję amira al-hadżdż będzie skuteczniejszy w czasie pokoju, a mniej skuteczny podczas wojny."
 mamluk_events.7.e: "To zadanie może wykonać tylko lojalny mameluk."
 mamluk_events.7.e.tt: "Wybór §Yamira al-hadżdż§! wpłynie zarówno na szanse powodzenia karawan pielgrzymkowych, jak i na rodzaj konsekwencji ewentualnych problemów podczas hadżdżu:\\nMamelucki amir al-hadżdż będzie bardziej godny zaufania, gdy władca cieszy się wysoką legitymizacją, i znacznie mniej godny zaufania przy niskiej legitymizacji."
 mamluk_events.8.t: "Napad na karawany pielgrzymkowe"
 mamluk_events.8.d: "Niedawno karawana pielgrzymów zmierzających do świętych miast wpadła w zasadzkę i została złupiona. Naszym obowiązkiem jest chronić poddanych wyruszających w tę podróż, a teraz pod znakiem zapytania stanęła nasza zdolność do zapewnienia im bezpieczeństwa."
 mamluk_events.8.a: "To się więcej nie powtórzy."
 mamluk_events.8.b: "Musimy przeznaczyć więcej środków na ich ochronę."
 mamluk_events.8.c: "Nasz amir al-hadżdż wykorzysta swoje kontakty, by następnym razem zapewnić lepszy rezultat."
 mamluk_events.9.t: "Pielgrzymi są bezpieczni"
 mamluk_events.9.d: "Nasze starania, by chronić poddanych udających się na pielgrzymkę do świętych miast Mekki i Medyny, przyniosły owoce. Od ostatniego napadu minęło już wiele czasu, a w państwie panuje pokój."
 mamluk_events.9.a: "Doskonale."
 mamluk_events.10.t: "Awlad al-nas"
 mamluk_events.10.d: "Mameluccy niewolnicy od najmłodszych lat są wychowywani na lojalnych wojowników, dlatego często cieszą się pełnym zaufaniem swoich właścicieli lub pracodawców. Ich synowie, zwani awlad al-nas, dorastają jednak w znacznie wygodniejszych i łagodniejszych warunkach, przez co powszechnie uważa się ich za mniej zdolnych i lojalnych. Nie mogą służyć jako królewscy mamelucy, więc awlad al-nas tworzą elitę społeczną w regularnych oddziałach wojskowych oraz niższej administracji. Sami ci szlachetnie urodzeni młodzieńcy nieustannie próbują jednak dowieść, że są gotowi na większą odpowiedzialność. W związku z wakatem na stanowisku dowódcy obrony państwa w regionie [defence_province.GetAreaName] wielu z nich liczy, że powierzymy im to zadanie."
 mamluk_events.10.a: "Mianujmy jednego z synów."
 mamluk_events.10.b: "Możemy ufać tylko swoim — dowódcą musi zostać mameluk."
 mamluk_events.11.t: "Qaranis"
 mamluk_events.11.d: "Nasze [Root.GovernmentName] zostało założone przez mameluckich niewolników, a posiadanie i sprowadzanie wykwalifikowanych niewolników-wojowników wciąż stanowi podstawę władzy każdego [Root.Monarch.GetTitle]. To naturalne, że niewolnik pozostaje bardziej lojalny wobec swojego pana niż wobec kogokolwiek innego w nowej ojczyźnie — tym bardziej jeśli w nagrodę za zasługi otrzyma wolność. Obecnie jednak wielu królewskich mameluków w naszej administracji, na dworze i w armii to ludzie, których $RANDOM_OLD_MONARCH$ kupił i sprowadził do naszego [Root.GovernmentName]. Są wpływowi, lecz nie łączy ich osobista lojalność z [Root.Monarch.GetName]. Nasi nowi mamelucy oskarżają ich o spiski i próby ograniczenia własnych wpływów."
 mamluk_events.11.a: "Usuńmy qaranis z najważniejszych stanowisk!"
 mamluk_events.11.b: "Nie mamy wyboru — musimy im ufać, w końcu wszyscy jesteśmy mamelukami..."
 mamluk_events.12.t: "Farys"
 mamluk_events.12.d: "Furusijja to zestaw ćwiczeń jeździeckich, które uczą młodych wojowników sztuki walki konnej. Dzięki szczegółowym zasadom, podręcznikom szkoleniowym oraz niezwykle popularnym publicznym zawodom i ich mistrzom furusijja została w dużej mierze udoskonalona przez mamelucką arystokrację wojskową. Niektórzy kronikarze twierdzą, że dzisiejsi czempioni nie dorównują wojownikom z przeszłości, jednak organizowanie wielkich publicznych zawodów furusijji przez [Root.Monarch.GetTitle]ów wciąż jest tradycją i cieszy się ogromną popularnością. Mistrzowie tych zmagań pozostają bohaterami licznych opowieści."
 mamluk_events.12.a: "To dobre dla ludu, ale [Root.Monarch.GetTitle] nie powinien wydawać na to pieniędzy."
 mamluk_events.12.b: "Rozbudujmy istniejące hipodromy i wznieśmy nowe, by wspierać kwiat rycerskości."
