 muslim_school_opinion_events.1.t: "Wzajemny szacunek między szkołą [Root.GetReligiousSchool] a szkołą [school_opinion_increase_country.GetReligiousSchool]"
 muslim_school_opinion_events.1.d: "Między szkołami [Root.GetReligiousSchool] i [school_opinion_increase_country.GetReligiousSchool] nigdy nie występowały różnice teologiczne na tyle poważne, by prowadzić do prawdziwego konfliktu, a obie tradycje często współistnieją obok siebie.\nDługotrwała współpraca między państwami [Root.GetAdjective] wyznającymi szkołę [Root.GetReligiousSchool] a państwami [school_opinion_increase_country.GetAdjective] wyznającymi szkołę [school_opinion_increase_country.GetReligiousSchool] zapoczątkowała jednak nową erę wzajemnego zrozumienia i szacunku."
 muslim_school_opinion_events.1.a: "Bóg jest wspaniały."
 muslim_school_opinion_events.2.t: "Normalizacja stosunków między szkołą [Root.GetReligiousSchool] a szkołą [school_opinion_increase_country.GetReligiousSchool]"
 muslim_school_opinion_events.2.d: "Przez pewien czas stosunki między szkołami [Root.GetReligiousSchool] i [school_opinion_increase_country.GetReligiousSchool] były naznaczone nieufnością i konfliktami. Niektórzy uczeni posuwali się nawet do potępiania teologów drugiej szkoły oraz jej wyznawców.\nW ostatnich latach napięcia znacznie jednak osłabły, a uczeni [Root.GetAdjective] wyznający szkołę [Root.GetReligiousSchool] oraz [school_opinion_increase_country.GetAdjective] wyznający szkołę [school_opinion_increase_country.GetReligiousSchool] przewodzą dążeniom do tolerancji i pokojowego współistnienia."
 muslim_school_opinion_events.2.a: "Bóg jest wspaniały."
 muslim_school_opinion_events.3.t: "Ulemowie a wojna między państwami [Root.GetAdjective] i [school_opinion_decrease_country.GetAdjective]"
 muslim_school_opinion_events.3.d: "Przedłużający się konflikt między państwami [school_opinion_decrease_country.GetAdjective] i [Root.GetAdjective] zaczyna przenikać również do sfery religijnej. Wzajemny szacunek i tolerancja osiągnęły najniższy poziom w historii, a nurt [school_opinion_decrease_country.GetReligiousSchool] jest marginalizowany w społeczeństwie [Root.GetAdjective]."
 muslim_school_opinion_events.3.a: "Oburzające."
 muslim_school_events.1.t: "Utalentowany sędzia"
 muslim_school_events.1.d: "Zdobycie wykształcenia teologicznego i prawniczego to często długi proces, obejmujący studiowanie klasycznych dzieł prawniczych pod kierunkiem szejków z różnych medres. Za każde opanowane dzieło lub komentarz student otrzymuje certyfikat zwany idżazą. Wartość takiego świadectwa może się jednak różnić w zależności od medresy i nauczającego szejka.\nPewien uczony zdobywa ostatnio znakomitą opinię w medresach całego kraju. Niewątpliwie czeka go wielka kariera jako kadiego lub muftiego."
 muslim_school_events.1.a: "Słyszałem, że w prowincji [mufti_province.GetAreaName] potrzebny jest nowy kadi."
 muslim_school_events.1.b: "W stolicy [Root.Capital.GetCapitalName] będzie służył pokoleniu wiernych jako mufti, zapewniając im wskazówki w kwestiach prawa."
 muslim_school_events.2.t: "Szejk al-islam"
 muslim_school_events.2.d: "Kadi są sędziami w naszym państwie, natomiast mufti zajmują się ogólną interpretacją prawa i doktryny. Tak rozległe państwo jak nasze potrzebuje jednak nadrzędnego zwierzchnika wszystkich muftich. Tradycyjnie funkcję tę pełni szejk al-islam.\nSzejk al-islam nie tylko sam będzie wydawał fatwy, lecz także mianował wielu regionalnych muftich w naszym państwie. Ostatecznie to on będzie stał na straży zgodności z prawem dekretów naszego władcy ([Root.Monarch.GetTitle]). Oczywiście wybrany przez nas człowiek będzie należał do szkoły [Root.GetReligiousSchool], mamy jednak kilku znamienitych kandydatów."
 muslim_school_events.2.a: "Wybierzmy na to stanowisko najważniejszego i najbardziej lojalnego muftiego."
 muslim_school_events.2.a.tt: "Lojalny szejk al-islam niemal zawsze opowie się po stronie naszego władcy ([Root.Monarch.GetTitle]) i zwiększy szanse na poparcie ze strony establishmentu religijnego."
 muslim_school_events.2.b: "Szejkiem al-islamem musi zostać najuczeńszy i najbardziej niezłomny kandydat."
 muslim_school_events.2.b.tt: "Prawy szejk al-islam będzie nas wspierał, dopóki będziemy rządzić pobożnie. Zwiększy to również częstotliwość wydarzeń związanych z wolą naszych uczonych religijnych."
 muslim_school_events.2.c: "Słynny sufi nada temu urzędowi należytą godność."
 muslim_school_events.2.c.tt: "Suficki szejk al-islam będzie nas wspierał, dopóki będziemy popierać sufizm w naszym państwie. Zwiększy to również częstotliwość wydarzeń związanych z sufizmem."
 muslim_school_events.3.t: "Nowa medresa"
 muslim_school_events.3.d: "Znaczni obywatele prowincji [madrassah_province.GetAreaName] przekazali liczne datki dobroczynne na założenie nowej medresy w mieście [madrassah_province.GetCapitalName]. Zaprosili uczonych nie tylko z całego regionu [madrassah_province.GetAreaName], lecz także ze stolicy [Root.Capital.GetCapitalName] oraz zagranicznych teologów."
 muslim_school_events.3.a: "Wspaniale."
 muslim_school_events.4.t: "Ghazowie"
 muslim_school_events.4.d: "Od stuleci wojny mające na celu rozszerzanie wiary przyciągają grupy ghazich, czyli świętych wojowników działających na rubieżach świata islamu, którzy najeżdżają ziemie wroga i zasilają szeregi wiernych. Nasza wojna z niewiernymi z państwa [infidel.GetAdjective] zwróciła uwagę takich wojowników. Przybyli, by dołączyć do naszych szeregów, dowieść swej wartości jako święci wojownicy, a być może również zdobyć łupy."
 muslim_school_events.4.a: "Są mile widziani."
 muslim_school_events.5.t: "Opieka nad miastem [holy_city.GetCapitalName]"
 muslim_school_events.5.d: "Z każdym rokiem do świętego miasta [holy_city.GetCapitalName] przybywa coraz więcej pielgrzymów pragnących odwiedzić tamtejsze sanktuaria. Wierni przybywają ze wszystkich zakątków świata islamu, przynosząc do naszych portów handel, towary, kapitał, wiadomości i idee z odległych krain."
 muslim_school_events.5.a: "Bóg jest dobry."
 muslim_school_events.6.t: "Migracja szyitów"
 muslim_school_events.6.d: "Choć szyizm jest rozpowszechniony w świecie islamu, większość szyitów żyje na ziemiach rządzonych przez sunnitów, a nawet państwa niemuzułmańskie. Aby przetrwać, nasi współwyznawcy często muszą praktykować takijję, celowo udając, że dystansują się od wiary szyickiej. Jako jedno z nielicznych państw [Root.GovernmentName] wyznających szyizm przyciągamy wiernych, którzy nie chcą już skrywać swojego życia duchowego. Wielu z nich to wykształceni i produktywni członkowie społeczeństwa."
 muslim_school_events.6.a: "Przyjmijmy ich w naszych miastach."
 muslim_school_events.6.b: "Wyślijmy ich, by zaludnili pogranicze."
 muslim_school_events.7.t: "Suficki synkretyzm"
 muslim_school_events.7.d: "Sufi, ze swoim mistycznym i mniej prawniczym podejściem do islamu, często cieszą się większą przychylnością pogan niż wysoko wykształceni ulemowie czy wojownicy wiary. Okazują pobożność na różne sposoby, między innymi poprzez taniec, śpiew i łączenie tradycji islamskich z miejscowymi zwyczajami. Z tego powodu nie zawsze mają dobre stosunki z establishmentem religijnym.\nPrzywódca suficki zdobył znaczne grono zwolenników w prowincji [sufi_province.GetName], a wielu wyznawców religii [sufi_province.Religion.GetName] przyłączyło się do jego uczniów. Jego zwolennicy karczują ziemię pod nowe osady, w których mogliby wspólnie zamieszkać. Może to doprowadzić do znacznego wzrostu wpływów islamu w całym regionie. Wielu ulemów domaga się, byśmy go odprawili, obawiając się, że sprowadza prawdziwych wiernych na manowce i zaciera granicę między islamem a wiarą [sufi_province.Religion.GetName]."
 muslim_school_events.7.a: "Wykonuje dzieło Boga."
 muslim_school_events.7.b: "Będzie musiał głosić swoje nauki gdzie indziej."
 muslim_school_events.8.t: "Zagraniczni teologowie ożywiają naukę"
 muslim_school_events.8.d: "Zaproszeni do naszego kraju teologowie znacznie wzbogacili miejscową myśl religijną. Wywarli trwały wpływ na nasze państwo i zainspirowali nowe pokolenie ulemów."
 muslim_school_events.8.a: "Potrzebuję ich w stolicy [Root.Capital.GetCapitalName]."
 muslim_school_events.8.b: "Znajdą swoje miejsce w różnych częściach naszego kraju."
 muslim_school_events.9.t: "Teologowie szkoły [scholar_country.GetReligiousSchool]"
 muslim_school_events.9.d: "Zapraszając uczonych z państwa [scholar_country.GetAdjective] do naszych medres, nie tylko rozwijamy dyskusję teologiczną w naszym kraju, lecz także zacieśniamy więzi z państwem [scholar_country.GetName] ([scholar_country.GovernmentName])."
 muslim_school_events.9.a: "Doskonale."
 muslim_school_events.10.t: "Spór między uczonymi religijnymi"
 muslim_school_events.10.d: "Nie wszyscy teologowie zgadzają się ze sobą. Zazwyczaj nie stanowi to większego problemu, ponieważ w świecie nauki różnice zdań są czymś naturalnym. Czasami jednak spory przybierają bardziej osobisty charakter. Niektórzy twierdzą, że właśnie w ten sposób zaproszeni przez nas uczeni popadli w konflikt z większością establishmentu religijnego, poważnie szkodząc naszej reputacji międzynarodowej."
 muslim_school_events.10.a: "Smutne."
 muslim_school_events.11.t: "Rozgrywanie sporów przed sądami"
 muslim_school_events.11.d: "Choć szkoła [Root.GetReligiousSchool] jest oficjalnie uznawana przez państwo [Root.GovernmentName], na naszych ziemiach działa wiele sądów i kadich, a wszystkie cztery szkoły wiary są uznawane za właściwe w postępowaniach cywilnych. Oznacza to, że można do pewnego stopnia „rozgrywać sądy”, wnosząc sprawę przed kadiego należącego do szkoły, która z większym prawdopodobieństwem wyda korzystny wyrok.\nPrzedsiębiorczy kupiec z miasta [shiites_here.GetCapitalName] opanował tę sztukę do tego stopnia, że rozgniewał nie tylko miejscową ludność i konkurentów, lecz także lokalnego gubernatora. Niewiele możemy z tym zrobić, nie naruszając przywilejów ulemów."
 muslim_school_events.11.a: "Zadbajmy po prostu o to, by ten człowiek poniósł konsekwencje."
 muslim_school_events.11.b: "Pragmatyzm musi być ważniejszy niż teologia."
 muslim_school_events.12.t: "Takijja"
 muslim_school_events.12.d: "Od stuleci wielu zwolenników Alego uważa za konieczne ukrywanie swojej wiary i udawanie przestrzegania innych obyczajów religijnych, aby zachować własną tradycję. Władze w prowincji [shiites_here.GetName] coraz częściej podejrzewają, że w miejscowych zgromadzeniach sufickich ukrywa się coraz więcej szyitów. Chcą, byśmy poparli ich próby wykrycia i usunięcia tych osób."
 muslim_school_events.12.a: "Nie możemy tolerować heretyków!"
 muslim_school_events.12.b: "Musimy uszanować zgromadzenia sufickie."
 muslim_school_events.13.t: "Protesty w prowincji [protest_province.GetName]"
 muslim_school_events.13.d: "Członkowie ulemów, ludzie o wielkiej sile duchowej, a zarazem część establishmentu, niekiedy przyłączają się do protestów społecznych. Niedawne starcie miejscowego garnizonu z mieszkańcami miasta [protest_province.GetName] zwróciło uwagę wpływowego muftiego z regionu [protest_province.GetAreaName].\nNasz miejscowy dowódca obawia się eskalacji sytuacji, jeśli nie wysłuchamy protestujących, lecz spełnienie ich żądań będzie nas kosztować."
 muslim_school_events.13.a: "Zrekompensujmy straty mieszkańcom prowincji [protest_province.GetName]."
 muslim_school_events.13.b: "Mufti czy nie, nic nie możemy zrobić."
 muslim_school_events.14.t: "Biedota miasta [urbanization_province.GetCapitalName]"
 muslim_school_events.14.d: "Wraz z rozwojem miast niszczeją dawne udogodnienia i mury, które niegdyś je wspierały. Z czasem doprowadziło to do zmian w mieście [urbanization_province.GetCapitalName]. Mniej czyste warsztaty, takie jak garbarnie, przeniosły się poza mury miejskie, podobnie jak cmentarze. Najbardziej widoczny jest jednak rosnący tłum ubogich na ulicach. Istniejące instytucje dobroczynne nie nadążają za szybkim rozwojem miasta, dlatego zaproponowano przeznaczenie większej części majątku państwowego na waqfy, czyli fundacje dobroczynne utrzymujące publiczne jadłodajnie i łaźnie."
 muslim_school_events.14.a: "Oczywiście wesprzemy tak szczytny cel."
 muslim_school_events.14.b: "Czyż miejscowi notable nie mogą finansować dobroczynności z własnej kieszeni?"
 muslim_school_events.15.t: "Miasto [holy_city.GetCapitalName]"
 muslim_school_events.15.d: "Jako opiekunowie świętych meczetów w mieście [holy_city.GetCapitalName] odpowiadamy nie tylko za święte sanktuarium. Od państwa, które szczyci się tym zaszczytem, oczekuje się również troski o mieszkańców świętych miast oraz przybywających tam pielgrzymów. W tym celu wielu władców przeznaczało ogromne środki zarówno na same miasta, jak i na rozległe obszary odległych ziem uprawnych, aby zapewnić wyżywienie i utrzymanie całej okolicy.\nNiektórzy twierdzą, że [Root.Monarch.GetName] nie poświęca tym miastom należytej uwagi, pielgrzymi nie są już bezpieczni, a na ulicach [holy_city.GetCapitalName] panuje wielka bieda."
 muslim_school_events.15.a: "Przeznaczmy więcej ziemi na ich utrzymanie."
 muslim_school_events.15.b: "Niestety, nie mamy obecnie dodatkowych zasobów."
 muslim_school_events.16.t: "Rozbudowa medresy w mieście [madrasa_province.GetCapitalName]"
 muslim_school_events.16.d: "Medresa w mieście [madrasa_province.GetCapitalName] zyskuje coraz większą renomę nie tylko jako ośrodek nauczania szkoły [Root.GetReligiousSchool], lecz także dzięki szejkom wywodzącym się z innych szkół. Szczególnie uczeni [Root.GetReligiousScholars] z innych części świata zdobyli sławę w tej medresie. W rezultacie szybko rozwijają się sama instytucja, przyległa dzielnica targowa oraz całe tętniące życiem miasto.\nRozwój miasta nie jest jednak wolny od problemów, a rozrastająca się medresa wymaga odpowiedniego utrzymania. Gdyby [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself] przeznaczył większą darowiznę dobroczynną na utrzymanie rozbudowanej medresy, skorzystałoby na tym zarówno miasto, jak i cały region."
 muslim_school_events.16.a: "Musimy wesprzeć to przedsięwzięcie."
 muslim_school_events.16.b: "Miejscowi mogą sami ich wyżywić i opłacić."
 muslim_school_events.17.t: "Dargah"
 muslim_school_events.17.d: "Szejk suficki zmarł w prowincji [dargah_province.GetName], a jego zwolennicy wznoszą teraz sanktuarium ku jego czci. Pielgrzymi z różnych części kraju już zaczynają przybywać do prowincji, by zobaczyć miejsce spoczynku tego wielkiego człowieka; niektórzy nazywają go świętym. Miejscowi notable przeznaczyli darowiznę na utrzymanie sanktuarium, a dawni uczniowie zmarłego założyli w pobliżu zgromadzenie.\nSamo oddawanie czci wielkiemu człowiekowi nie jest niczym złym, jednak niektórzy bardziej tradycjonalistyczni pobożni oraz ulemowie uważają taką formę kultu za świętokradztwo.\nWizyta [Root.Monarch.GetName] w sanktuarium w prowincji [dargah_province.GetName] mogłaby znacznie podnieść prestiż samego miejsca, a także poprawić postrzeganie [Root.Monarch.GetHerHis] przez lud."
 muslim_school_events.17.a: "Poszukajmy wskazówek w tym świętym miejscu."
 muslim_school_events.17.b: "Nie możemy podsycać miejscowych zabobonów."
 muslim_school_events.18.t: "Alewici z prowincji [alevi_province.GetName]"
 muslim_school_events.18.d: "Choć nie są naszymi bezpośrednimi współwyznawcami, znaczna część tureckich plemion Anatolii wyznaje szyicki alewizm. Podobnie jak dżafaryci, alewici są szyitami dwunastkowymi i wierzą w nadejście Dwunastego Imama. Ich wiara jest również głęboko zakorzeniona w mistycyzmie i sufizmie. Pod rządami sunnitów byli zmuszeni żyć w pewnej izolacji od społeczeństwa: nie pozwalano im zawierać małżeństw z sunnitami, a państwo odnosiło się do nich z nieufnością.\nWielu mieszkańców prowincji [alevi_province.GetName] to alewici, którzy na ogół z zadowoleniem przyjęli nas jako nowych władców. Ich mistyczne tradycje pod wieloma względami różnią się od naszych, lecz jeśli okażemy tym ludziom przychylność, możemy znacznie szybciej szerzyć szyizm w całym regionie."
 muslim_school_events.18.a: "Wzmocnijmy naszych współwyznawców w tym regionie."
 muslim_school_events.18.b: "Przyjmiemy ich życzliwie, lecz administracja pozostanie w rękach miejscowych władz."
 muslim_school_events.19.t: "Świeccy ulemowie"
 muslim_school_events.19.d: "Nie wszyscy członkowie ulemów są wybitnymi teologami czy intelektualistami. Korupcja może rozprzestrzenić się w każdym zakątku państwa, a niektórym trudno odróżnić to, co służy wierze, od tego, co przynosi korzyść im samym. [Root.Monarch.GetName] dowiedział się, że część pobożnych fundacji istniejących w imperium została uzyskana drogą oszustwa lub nielegalnie przekazana spadkobiercom. Nasz wezyr zasugerował, byśmy skontrolowali i zweryfikowali wszystkie takie nadania w państwie [Root.GovernmentName], zwłaszcza w regionach, które pierwotnie nie znajdowały się pod naszym panowaniem.\nByłoby to jednak poważną zniewagą dla ulemów, którzy uznaliby taki krok za naruszenie swoich przywilejów i atak na całą ich grupę."
 muslim_school_events.19.a: "Kilka nadużyć to niewiele w porównaniu z tym, co ci ludzie nam dają."
 muslim_school_events.19.b: "Tylko zdrajcy mają powody do obaw."
 muslim_school_events.20.t: "Madhhab państwa [Root.GetName]"
 muslim_school_events.20.d: "Jako młode państwo nie wspieramy jeszcze żadnej konkretnej szkoły religijnej. Istnieje wiele sposobów oddawania czci Bogu, lecz nasi władcy powinni kierować się określoną doktryną."
 muslim_school_events.20.a: "Dobrze."
 muslim_school_events.20.b: "Podążajmy za naukami Abu Hanify."
 muslim_school_events.20.c: "Istnieje tylko droga hanbalitów."
 muslim_school_events.20.dd: "Malik ibn Anas wskazał nam właściwą drogę."
 muslim_school_events.20.e: "Nauki imama asz-Szafi'iego są najwłaściwsze."
 muslim_school_events.20.f: "Szkoła dżafarycka będzie nas prowadzić aż do przybycia Mahdiego."
 muslim_school_events.20.g: "Ismail ibn Dżafar i jego zwolennicy będą naszymi przewodnikami."
 muslim_school_events.20.h: "Nigdy nie ukrywajmy naszych zasad! Musimy podążać za naukami Zajda ibn Alego."
 muslim_school_events.21.t: "Neosufizm i reakcja tradycjonalistów"
 muslim_school_events.21.d: "Wielu ulemów jest coraz bardziej niezadowolonych z [Root.Monarch.GetTitle]. Pobożni muzułmanie z pogardą patrzą na dopuszczanie pogan do wysokich urzędów oraz przyjmowanie pogańskich zwyczajów i tradycji. Państwo nie zyskało też przychylności miejscowych prawników, ingerując w interpretację prawa i inne tradycyjne domeny ulemów.\nCharyzmatyczni szejkowie z sufickiego zakonu Naqshbandi zaczęli podburzać ludność przeciwko państwu, zarzucając mu niewłaściwe, a w niektórych przypadkach grzeszne stosowanie prawa islamskiego."
 muslim_school_events.21.a: "Niestety, są w błędzie."
 muslim_school_events.21.a.tt: "Od tej pory establishment religijny będzie silniej reagował na bezbożne postępowanie [Root.Monarch.GetTitle]."
 muslim_school_events.21.a.ttb: "§YUlemowie§! będą teraz oczekiwać nadania im większej ilości ziemi."
 muslim_school_events.22.t: "Wahhabizm"
 muslim_school_events.22.d: "Wśród hanbalickich ulemów państwa [Root.GovernmentName] [Root.GetName] rośnie w siłę ruch nawołujący do powrotu do czystszej wiary. Jego zwolennicy zdecydowanie sprzeciwiają się wszelkim innowacjom względem zwyczajów proroka oraz praktykom, które nie mają oparcia w tekstowych źródłach prawa islamskiego. Odrzucają wszelkie formy sufizmu, kult świętych i tradycje nieislamskie, obiecując stworzenie prawdziwszego społeczeństwa religijnego dla wszystkich, którzy przyjmą ich nauki."
 muslim_school_events.22.a: "Ciekawe"
 muslim_school_events.22.a.tt: "Federacje plemienne mogą teraz zmienić szkołę religijną na hanbalicką."
 muslim_school_events.23.t: "Sanktuaria sufickie"
 muslim_school_events.23.d: "Wspieranie, a nawet utrzymywanie sanktuariów związanych z grobowcami słynnych sufich od dawna stanowiło główny punkt sporu z ulemami. Teraz, gdy do władzy dochodzi bardziej tradycjonalistyczne pokolenie, wywierają oni presję na naszego władcę, by ukrócił tę praktykę."
 muslim_school_events.23.a: "Musimy spełnić ich żądania."
 muslim_school_events.23.b: "Nie. Dawni mistrzowie byli wielkimi ludźmi!"
