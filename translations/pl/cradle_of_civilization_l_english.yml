 local_sufi: "Wpływowy sufi"
 desc_local_sufi: "Miejscowe społeczeństwo znajduje się pod silnym wpływem charyzmatycznego sufiego. Ten przywódca duchowy pozostaje poza bezpośrednim wpływem ulemów, lecz mimo to cieszy się tutaj znacznym poparciem, a wielu jego zwolenników po raz pierwszy przyjmuje islam."
 local_sufi_chased_away: "Zaprowadzenie ortodoksji religijnej"
 desc_local_sufi_chased_away: "Wypędziliśmy z tego regionu miejscowego szejka sufickiego, mimo że cieszył się znacznym wpływem nawet wśród niemuzułmanów. W ten sposób zaprowadziliśmy surowszą ortodoksję wśród miejscowych wiernych."
