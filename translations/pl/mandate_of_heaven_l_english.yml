 harmonized_muslim: "Harmonizacja z Wyznaniami Muzułmańskimi"
 desc_harmonized_muslim: "Przyłączyliśmy wyznania muzułmańskie do etosu narodowego w naszym kraju."
 harmonized_christian: "Harmonizacja z Wyznaniami Chrześcijańskimi"
 desc_harmonized_christian: "Przyłączyliśmy wyznania chrześcijańskie do etosu narodowego w naszym kraju."
 harmonization_classics_translated: "Przekład klasycznych tekstów"
 desc_harmonization_classics_translated: "Aby zachęcić barbarzyńców do zbliżenia się do naszej cywilizowanej społeczności, zezwoliliśmy na przełożenie konfucjańskich klasyków na ich język. Rozmyliśmy w ten sposób czystość myśli Konfucjusza, lecz synteza naszych idei z ich poglądami przyniosła nam nowe zrozumienie."
 harmonization_classics_defended: "Obrona klasycznych tekstów"
 desc_harmonization_classics_defended: "Aktywnie przeciwstawialiśmy się rozmywaniu konfucjańskich idei i myśli w celu dostosowania ich do barbarzyńskiej filozofii. Aby stać się cywilizowanymi, muszą przyjąć nasze obyczaje i porzucić niedorzeczne przekonanie, że to my mielibyśmy upodobnić się do nich."
 harmonization_converted_minister: "Uczony minister"
 desc_harmonization_converted_minister: "Jeden z naszych ministrów zainteresował się nauką, logiką i matematyką obcej religii. Pozwoliliśmy mu swobodnie rozwijać te zainteresowania, czym zgorszyliśmy konfucjańskich uczonych i urzędników w całym kraju."
 harmonization_local_rites_refused: "Stłumione lokalne obrzędy"
 desc_harmonization_local_rites_refused: "Surowo potraktowaliśmy lokalnych urzędników w tym państwie, gdy próbowali włączyć miejscowe rytuały religijne związane z władzą do praktykowania naszego zwierzchnictwa."
 harmony_banned_book: "Zakazana powieść"
 desc_harmony_banned_book: "Zakazaliśmy rozpowszechniania popularnej powieści, która sprowadzała naszych ludzi na manowce."
