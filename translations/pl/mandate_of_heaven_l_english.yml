 CONFIRM_SEND_TRIBUTE_TITLE: "Potwierdź coroczny trybut "
 CONFIRM_SEND_TRIBUTE_DESC: "Nasz suweren §Y$OVERLORD$§! żąda, abyśmy wysłali mu tegoroczny trybut w postaci: §Y$AMOUNT$§! $TYPE$\nZaakceptowanie żądania zwiększy zaufanie między naszymi narodami o §Y$POS_TRUST$§!.\nNatomiast jego odrzucenie spowoduje pogorszenie się naszych relacji i zmniejszy ich zaufanie do nas o §Y$NEG_TRUST$§!."
 TRIBUTE_CANT_REFUSE_WHEN_TRUCE: "Nie możemy odmówić wysłania trybutu zwierzchnikowi, dopóki mamy z nimi rozejm."
 REFUSE: "Odmów!"
