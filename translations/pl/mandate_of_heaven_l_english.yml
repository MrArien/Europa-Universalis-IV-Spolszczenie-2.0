 confucian_events.1.t: "Harmonizacja wierzeń pogańskich"
 confucian_events.1.d: "Nasze wysiłki na rzecz włączenia poddanych wyznających [pagan_province.Religion.GetName] do naszego państwa wreszcie zaczynają przynosić owoce. Nasi pogańscy poddani zaczęli przyjmować ideały konfucjanizmu, a lokalni urzędnicy włączyli elementy miejscowej religii i kultury do szerszego zbioru konfucjańskich zasad. Wraz z napływem miejscowych biurokratów do administracji pogańskie zwyczaje zaczęły przenikać także na wyższe szczeble. Nawet wśród dostojników w [Root.Capital.GetCapitalName] można czasem znaleźć niewielki ołtarz poświęcony panteonowi [pagan_province.Religion.GetName].\nPogaństwo stało się jedną z wielu religii naszego konfucjańskiego państwa [Root.GovernmentName]."
 confucian_events.1.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.2.t: "Harmonizacja chrześcijaństwa"
 confucian_events.2.d: "Z biegiem czasu nasi chrześcijańscy poddani przywykli do naszych obyczajów, przyjęli nasze rytuały i uznali wyższość naszych zasad administracyjnych. Tam, gdzie niegdyś panowała nieufność wobec klasycznych tekstów oraz naszego systemu edukacji i rządów, dziś powszechne jest zrozumienie. Chrześcijańscy poddani zostali włączeni do naszego państwa [Root.GovernmentName], a część ich zwyczajów stała się również naszymi. W [Root.Capital.GetCapitalName] nawet najlepiej wykształceni konfucjańscy uczeni uczestniczą niekiedy w chrześcijańskich obrzędach i odwiedzają kościoły."
 confucian_events.2.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.3.t: "Harmonizacja islamu"
 confucian_events.3.d: "Islam od stuleci jest religią mniejszościową na naszych ziemiach. Z czasem stał się jednak coraz bardziej zintegrowaną częścią naszego społeczeństwa. Muzułmańskie ideały zostały połączone i uzgodnione z naszymi tradycjami, obrzędami oraz metodami działania, a my przyswoiliśmy sobie to, co ta religia ma najlepszego do zaoferowania. Uczonych, lekarzy, kupców, rolników i chłopów wyznających islam można spotkać nawet w okolicach [Root.Capital.GetCapitalName]. Dopóki klękają przed naszym [Root.Monarch.GetTitle], wyznawcy Allaha pozostają integralną częścią naszego społeczeństwa."
 confucian_events.3.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.4.t: "Harmonizacja religii dharmicznych"
 confucian_events.4.d: "Wiara ludów dharmicznych od tysiącleci splata się z naszą, choć nasze przekonania niemal równie długo rozwijały się odmiennymi drogami. Przez długi czas sądzono, że podczas gdy my cenimy rozum i klasyczną naukę, oni dążą do różnorodności i odwołują się do pradawnej siły duchowej. W ostatnich latach staraliśmy się jednak zintegrować społeczeństwo dharmiczne z naszym i pogodzić jego wierzenia z równie silnymi tradycjami filozofii i nauki. Przed nami rysuje się wspólna przyszłość, w której różnorodność dharmicznego panteonu będzie mogła współistnieć z konfucjańskimi klasykami. Wspólnie stworzyliśmy nowy zbiór obrzędów i tradycji, który umocni nasze państwo i zapewni mu większą trwałość."
 confucian_events.4.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.5.t: "Harmonizacja judaizmu"
 confucian_events.5.d: "Minęły wieki odkąd pierwsi Żydzi przybyli do naszego kraju, ale dopiero niedawno pojawiło się ich tak wielu w naszym społeczeństwie. Zrobiliśmy wszystko co w naszej mocy, aby zintegrować ich pradawną religię Abrahamową z naszymi obrzędami, tradycjami i edukacją. Odkąd udało nam się pogodzić konfucjańskich klasyków z żydowskimi badaczami Tory, ich kupcy, żołnierze i rzemieślnicy stali się pełnoprawnymi członkami naszego społeczeństwa. W końcu, kiedy tradycje się połączyły, ludzie ci stali się kamieniem węgielnym nasz[Root.GetGovGender_nasz] [Root.GetGovNameGen]."
 confucian_events.5.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.6.t: "Harmonizacja zaratusztrianizmu"
 confucian_events.6.d: "Zaratusztrianie, wyznawcy tradycji uznawanej za starszą nawet od naszej, doświadczyli zarówno wzrostu, jak i upadku swoich politycznych wpływów. Było jasne, że mamy wiele do nauczenia się z ich nauk, podobnie jak oni mogą wiele zaczerpnąć z naszej tradycji rozumu, sprawiedliwości i uczciwości. Włączenie społeczności takich jak ta w prowincji [zoroastrian_province.GetName] do naszego państwa [Root.GovernmentName] pozwoliło rozpocząć nowy etap harmonizacji, łączący starożytne nauki Zaratustry z naukami Konfucjusza. Nadal jesteśmy krajem, w którym studiuje się klasyczne teksty i żyje zgodnie z nimi, lecz zaratusztrianie stali się integralną częścią naszego społeczeństwa, a ich mądrość po części stała się również naszą."
 confucian_events.6.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.7.t: "Harmonizacja szyntoizmu"
 confucian_events.7.d: "Japończycy z czasem zaczęli włączać zarówno tradycje Konfucjusza, jak i Buddy do swojej dawnej wiary szintoistycznej i uczynili je własnymi przyjmując to, co według nich było najprawdziwszą i najbardziej użyteczną częścią obcych nauk. Pod wieloma względami ułatwiło to z kolei włączenie i harmonizację ich religii z ideologią [Root.GetAdjective]. W miarę upływu czasu tożsamość szyntoizmu była coraz mniej istotnym problemem, a wyznawców szyntoizmu można było znaleźć w elitach i na marginesie społeczeństwa [Root.GetAdjective]. Stworzyli oni nową grupę w ramach naszego skomplikowanego aparatu rządowego, tak, że osoba z zewnątrz miałaby trudności z odróżnieniem ich od innych."
 confucian_events.7.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.8.t: "Harmonizacja z Wiarą Theravada"
 confucian_events.8.d: "Palijskie kanony buddyzmu therawady są pod wieloma względami bliskim naszym konfucjańskim elitom sposobem porządkowania tradycji i wiedzy. Z biegiem czasu te zbiory praw i obrzędów zaczęto studiować i włączać do kanonu, z którym musi zapoznać się każdy wykształcony i wpływowy członek naszego społeczeństwa. Tradycje zostały zharmonizowane, a szersza społeczność therawadyjska uważa nas za równych sobie, tak jak my uznajemy buddystów therawadyjskich w granicach naszego państwa za integralną część [Root.GovernmentName]."
 confucian_events.8.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.9.t: "Harmonizacja wiary mahajany"
 confucian_events.9.d: "Przed wiekami nauki Buddy zaczęły przenikać na nasze ziemie i obecnie mahajana jest jedną z najpowszechniejszych religii w [Root.GetName]. Choć za naczelną zasadę naszego państwa [Root.GovernmentName] uznajemy klasyczną naukę konfucjańską, szanujemy również tradycje Buddy oraz pragnienie zakończenia wiecznego cyklu odradzania, które odczuwa wielu naszych poddanych.\nJesteśmy prawdziwie konfucjańskim państwem rządzonym przez lud wyznający buddyzm mahajany."
 confucian_events.9.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.10.t: "Harmonizacja buddyzmu wadżrajany"
 confucian_events.10.d: "Ci spośród naszych poddanych, którzy gorliwie podążają za wielkimi i tajemniczymi lamami, coraz lepiej rozumieją, jak użyteczną ideologią są nauki Konfucjusza. Dawniej postrzegali świat przez pryzmat tradycji wadżrajany, lecz teraz przyswajają te same klasyczne teksty co my. Mnisi i możni wadżrajany zajmują dziś miejsca w naszym rządzie na wszystkich szczeblach, a ich nieco dzikie i tantryczne tradycje zdają się zostać okiełznane przez nasz rozum i wiedzę."
 confucian_events.10.a: "'Podporządkuj ludzi cnoty, a oświeceniem przyswajaj ich obyczaje.'"
 confucian_events.11.t: "Koncepcja Shangdi"
 confucian_events.11.d: "Wyznawcy religii [harmonization_province.Religion.GetName] coraz częściej włączają konfucjańskie pojęcia i nasze obrzędy do codziennego życia. Ostatnio rozpowszechnia się utożsamianie Shangdi z ich własnymi najwyższymi bóstwami. Taka interpretacja jest nieco nieortodoksyjna dla uczonych naszego państwa [Root.GovernmentName], pozwoliła jednak wiernym [harmonization_province.Religion.GetName] włączyć do swojej teologii wiele konfucjańskich pojęć, obrzędów, zasad i klasycznych nauk.\nW pałacowych salach [Root.Capital.GetCapitalName] trwa dyskusja, czy jest to właściwa droga, która pozwoli wyznawcom [harmonization_province.Religion.GetName] wznieść się ponad barbarzyństwo i stać się Hua."
 confucian_events.11.a: "Musimy nauczyć ich właściwych obyczajów!"
 confucian_events.11.b: "Zaakceptujmy tę interpretację."
 confucian_events.12.t: "Przekłady klasycznych tekstów"
 confucian_events.12.d: "Wyznawcy religii [harmonization_province.Religion.GetName] mają bogate tradycje i obrzędy, lecz przywiązanie do archaicznego języka ich nauk hamuje ich rozwój cywilizacyjny. Jeśli kiedykolwiek mają wznieść się ponad barbarzyńskich Yi tego świata, być może powinniśmy zadbać, by klasyczne teksty i właściwe obrzędy były dostępne w ich ojczystym języku.\nNiektórzy uczeni już rozpoczęli tworzenie takich dzieł. Czy powinniśmy zachęcić ich do dalszego łączenia dawnych pojęć religijnych ze wzniosłymi zasadami Konfucjusza?"
 confucian_events.12.a: "Pozwólmy im stworzyć własną wersję właściwego porządku."
 confucian_events.12.b: "Byłoby to wypaczenie naszej ideologii!"
 confucian_events.13.t: "Wiara [Root.Adm_Advisor.GetName]"
 confucian_events.13.d: "Nasz zaufany minister i powiernik, [Root.Adm_Advisor.GetName], ściśle współpracował ze społecznością wyznającą [harmonization_province.Religion.GetName], by pomóc jej wznieść się ponad barbarzyńską kulturę. Zaskoczony odkryciami [Root.Adm_Advisor.GetHerHis], [Root.Adm_Advisor.GetSheHe] zaczął przyswajać wiele pojęć [harmonization_province.Religion.GetName] po intensywnym studiowaniu tamtejszej nauki i literatury. Wielu obawia się, że [Root.Adm_Advisor.GetSheHe] zbytnio uległ wpływom [harmonization_province.Religion.GetName]. Niektórzy twierdzą nawet, że nasz [Root.Adm_Advisor.GetTitle] potajemnie zmienił wiarę, hańbiąc zarówno [Root.Adm_Advisor.GetHerHis] przodków, jak i całe państwo [Root.GovernmentName]."
 confucian_events.13.a: "Zdejmijmy z urzędu tego [Root.Adm_Advisor.GetWomanMan]!"
 confucian_events.13.b: "Możemy się wiele nauczyć od ludu [harmonization_province.Religion.GetName]."
 confucian_events.14.t: "Prawa i obrzędy"
 confucian_events.14.d: "Choć należą do naszego państwa [Root.GovernmentName], niektóre tradycje wyznawców [harmonization_province.Religion.GetName] są trudne do zaakceptowania. Cywilizowany lud powinien kierować się tym, co słuszne i logiczne według nauk konfucjańskich, lecz ci mężczyźni i kobiety mają wiele obyczajów jawnie sprzecznych z takimi zasadami. Nasi urzędnicy w [harmonization_province.GetName] z trudem radzą sobie z miejscową ludnością, która uparcie trwa przy swoich barbarzyńskich zwyczajach."
 confucian_events.14.a: "Barbarzyńcy!"
 confucian_events.14.b: "Takie drobiazgi nas nie dotyczą."
 confucian_events.15.t: "Wzmocnienie urzędu [Root.Monarch.GetTitle]"
 confucian_events.15.d: "Choć wyznawcy [harmonization_province.Religion.GetName] są barbarzyńcami, mają pewne zwyczaje i obrzędy, które moglibyśmy wykorzystać. Ich tradycje i ceremonie związane z władzą zawierają już pojęcie najwyższego ziemskiego autorytetu, podobnego do naszego [Root.Monarch.GetTitle], co może okazać się przydatne. Lokalni urzędnicy w [harmonization_province.GetName] już z tego korzystają, lecz pojawiła się propozycja, by stosować ceremonie [harmonization_province.Religion.GetName] również na wyższych szczeblach. Inni twierdzą, że pozwalając tym tradycjom skazić nasze obyczaje, zhańbilibyśmy przodków i odwrócili się od tego, co właściwe."
 confucian_events.15.a: "Brzmi to obiecująco..."
 confucian_events.15.b: "Musimy rozprawić się z niegodnymi urzędnikami!"
 confucian_events.16.t: "Niesienie cywilizacji barbarzyńcom"
 confucian_events.16.d: "Z biegiem czasu lud [harmonization_province.Religion.GetName] przyswoił wiele naszych zwyczajów. Gdy nasz [Root.Dip_Advisor.GetTitle] [Root.Dip_Advisor.GetName] odwiedził okolice [harmonization_province.GetName], uznał jednak, że miejscowi wciąż są dalecy od cywilizacji. Ostatnią kroplą było zaproszenie [Root.Dip_Advisor.GetHerHim] przez wpływowego miejscowego posiadacza ziemskiego, lorda [Root.local_influential_person.GetName], na ceremonię nadania imienia jego synowi, podczas której chłopiec otrzymał imię po ojcu.\n\n[Root.Dip_Advisor.GetName] wrócił z tej wyprawy z bardzo niską opinią o ludzie [harmonization_province.Religion.GetName] i jego szansach na zaliczenie go kiedykolwiek do cywilizowanych narodów świata."
 confucian_events.16.a: "W takim razie pozostawimy ich własnemu losowi."
 confucian_events.16.b: "Wyślijmy tam naszych najlepszych ludzi, by ich ucywilizowali."
 confucian_events.17.t: "Cywilizacja [harmonization_province.Religion.GetName]"
 confucian_events.17.d: "Niektórzy barbarzyńcy są bardziej podatni na rozum i intelekt niż inni. Lud [harmonization_province.Religion.GetName] z [harmonization_province.GetName] przyswoił już wiele naszych tradycji, zarówno tych najważniejszych, jak i całkiem drobnych. Odwiedzający nas cudzoziemcy z trudem odróżniają ten region od właściwego [Root.GetName], ponieważ poza kilkoma niewielkimi osobliwościami język, imiona i zwyczaje [Root.Capital.Culture.GetName] wydają się równie [Root.GetAdjective] jak w każdej części państwa [Root.GetName] [Root.GovernmentName]."
 confucian_events.17.a: "Postęp!"
 confucian_events.17.b: "Musimy wykorzystać tę szansę w całym regionie!"
 confucian_events.18.t: "Xiaoren?"
 confucian_events.18.d: "Rządzenie naszym wielkim państwem [Root.GovernmentName] jest najważniejszym obowiązkiem i przywilejem [Root.Monarch.GetTitle]. Dynastia [Root.Monarch.Dynasty.GetName] zawsze szczyciła się przewodzeniem poprzez własny przykład, przestrzeganiem surowej etykiety, osobistą wstrzemięźliwością i starannym odsuwaniem tych, którzy nie spełniają tych wymogów.\nDlatego [Root.Monarch.GetName] z ciężkim sercem obserwuje rozwój [Root.Heir.GetName]. Nasz następca tronu jest daleki od ideału [Root.Heir.GetWomanMan], a jego nauczyciele często opisują [Root.Heir.GetHerHis] jako osobę małostkową, skupioną na doraźnych korzyściach i przyjemnościach. Na dworze istnieją jednak stronnictwa, które byłyby wielce niezadowolone z porzucenia [Root.Heir.GetName]; nowy następca nie zyskałby ich poparcia."
 confucian_events.18.a: "Taki [Root.Heir.GetWomanMan] nie nadaje się do Pałacu Wschodniego."
 confucian_events.18.b: "Potrzebujemy poparcia stronnictw stojących za [Root.Heir.GetTitle]."
 confucian_events.19.t: "Popularna powieść"
 confucian_events.19.d: "Powieść napisana językiem potocznym, opowiadająca znaną historię z epoki [Root.GetOldEra], szybko zyskuje popularność wśród naszych poddanych. Samo w sobie nie stanowi to problemu, lecz dotarły do nas informacje, że jej treść narusza podstawowe zasady ideologii konfucjańskiej, ponieważ można ją odczytać jako zachętę do nieposłuszeństwa wobec władzy centralnej i naszego [Root.Monarch.GetTitle].\nNasi urzędnicy uważają, że książkę należy zakazać, choć niektórzy obawiają się, że zakaz jedynie zwiększy zainteresowanie nią wśród czytelników."
 confucian_events.19.a: "Należy natychmiast jej zakazać."
 confucian_events.19.b: "Przewodzimy przykładem, a nie dekretami. Pozwólmy jej pozostać w obiegu."
 confucian_events.20.t: "Służba cywilna"
 confucian_events.20.d: "Edukacja, samodoskonalenie i przestrzeganie klasycznych nauk stanowią fundament konfucjańskich rządów. Jeśli nasze państwo [Root.GovernmentName] ma dążyć do wielkości, musimy nieustannie poświęcać środki, uwagę i energię, by nasi urzędnicy byli jak najlepiej wykształceni i poinformowani. Niepokoi nas zatem, że ostatnio zdaje się ubywać osób ubiegających się o stanowiska w administracji."
 confucian_events.20.a: "Musimy rozbudować biurokrację!"
 confucian_events.20.b: "Nie ma jeszcze potrzeby wzmacniania kadr."
 confucian_events.21.t: "Konfucjańskie dziedzictwo"
 confucian_events.21.d: "Od czasów chińskiej okupacji cześć oddawana Konfucjuszowi i ideałom konfucjańskim głęboko zakorzeniła się w naszym społeczeństwie. Przejawia się zarówno w prostym kulcie Konfucjusza w religii ludowej zwykłych ludzi, jak i w podziwie dla neokonfucjańskich tekstów oraz ich studiowaniu na naszym dworze.\nChoć duchowieństwo zapewne by się z tym nie zgodziło, niektórzy twierdzą, że jesteśmy przede wszystkim krajem konfucjańskim, a dopiero w drugiej kolejności buddyjskim państwem mahajany."
 confucian_events.21.a: "Jesteśmy cywilizowanym ludem i oddajemy cześć Mistrzom."
 confucian_events.21.b: "Konfucjanizm jest interesujący, lecz Dai Viet to kraj buddyjski."
