 MISSIONARY_HARMONY_LOSS_DESC: "Nawrócenie tej prowincji zmniejszy naszą Harmonię o §R$VAL$§!\n(§R$LOSS_PER_DEV$§! punktów Rozwoju)."
 MODIFIER_YEARLY_HARMONY: "Roczny przyrost harmonii"
