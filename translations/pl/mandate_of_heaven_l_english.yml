 WHEN_HARMONIZED: "Po zharmonizowaniu:"
 WHEN_HARMONIZED_LONG: "Po harmonizacji prowincje wyznające religię $HARMONIZED$ będą tolerowane tak, jakby wyznawały §Y$OUR$§!, a ponadto otrzymasz:"
