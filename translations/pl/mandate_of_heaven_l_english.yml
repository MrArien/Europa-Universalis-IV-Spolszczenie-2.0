 incident_neo_confucianism_title: "Neokonfucjanizm"
 incident_neo_confucianism_desc: "Neokonfucjanizm nie jest w Japonii niczym nowym. Dotarł z Chin w okresie Kamakury i, podobnie jak wiele innych elementów chińskiej oraz szerzej wschodnioazjatyckiej kultury, szybko zapuścił korzenie. Jego racjonalistyczne podejście doskonale nadaje się przede wszystkim do umacniania autorytetu władcy. Gdybyśmy poparli jego rozwój w Japonii, moglibyśmy stworzyć silniejszą podstawę kontroli nad naszym ludem."
 incident_nanban_title: "Handel Nanban"
 incident_nanban_desc: "Na nasze ziemie przybyli zachodni kupcy, przywożąc towary, idee, a nawet broń, jakiej dotąd nie widzieliśmy. Cudzoziemcom tym brakuje ogłady, a nawet podstawowej higieny, lecz sposób, w jaki potraktujemy tych handlarzy, może mieć trwały wpływ na nasze społeczeństwo."
 incident_firearms_title: "Rozpowszechnienie broni palnej"
 incident_firearms_desc: "Broń prochowa, którą zachodni kupcy przywieźli na nasze wybrzeża, stanowi oczywiste zagrożenie dla naszego społeczeństwa. Rozpoczęto już produkcję lokalnych odmian tej broni, zwanych tanegashima, więc wkrótce dostępnych będzie tak wiele egzemplarzy, że nawet zwykły chłop będzie mógł pokonać najlepiej wyszkolonego samuraja."
 incident_spread_of_christianity_title: "Rozprzestrzenianie się chrześcijaństwa"
 incident_spread_of_christianity_desc: "Misjonarze niosący wieści o dziwnej zachodniej religii dotarli do naszych wybrzeży, a ich słowa trafiły do zaskakująco dużej części japońskiej populacji. Chrześcijańskie kongregacje powstają na całej wyspie, a japońscy konwertyci z dnia na dzień nawracają coraz więcej swoich rodaków."
 incident_shogunate_authority_title: "Wzrost władzy szogunatu"
 incident_shogunate_authority_desc: "Od stuleci prawdziwą władzę w Japonii sprawuje szogun, a nie cesarz. Sam autorytet szogunatu od dawna pozostaje jednak słaby. Wygląda na to, że obecny szogun postanowił to zmienić: żąda posłuszeństwa i wzmacnia dawne prawa oraz tradycje, by uzyskać większą kontrolę nad tym rozdartym wojną krajem."
 incident_ikko_shu_title: "Ikko-Ikki"
 incident_ikko_shu_desc: "Buddyzm Czystej Krainy nie jest nową religią na naszych wyspach, lecz podczas wojny domowej, która spustoszyła Japonię, wielu ludzi zwróciło się ku jego naukom. Ten ruch religijny staje się coraz bardziej zmilitaryzowany, a obietnice zbawienia przyciągają chłopów, kapłanów, mnichów, a nawet możnych. Silna wiara jego wyznawców podważa autorytet pradawnych tradycji."
 incident_wokou_title: "Piraci Woko"
 incident_wokou_desc: "Relacje między Chinami, Koreą i Japonią zawsze były niespokojne. Upadający autorytet państwa centralnego w Japonii doprowadził do powstania dużej liczby grup pirackich, z których niektóre są nawet finansowane z pieniędzy zewnętrznych. Ponieważ nasze porty są wykorzystywane przez tych morskich rabusiów, musimy zająć stanowisko wobec tego piractwa."
 incident_urbanization_title: "Urbanizacja"
 incident_urbanization_desc: "Społeczeństwo szybko się zmienia, ponieważ coraz więcej ludzi migruje ze wsi do wielkich miast. Potęga starożytnych gildii handlowych rośnie, a właściciele ziemscy narzekają, że rolnicy nie pozostają na swoich ziemiach."
 CONFIRM_HARMONIZATION: "Potwierdź Harmonizację"
 CONFIRM_CANCEL_MISSIONARIES_DESC: "Spowoduje to, że misjonarze przestaną pracować w następujących prowincjach:\n§Y$PROVS$§!.\n"
