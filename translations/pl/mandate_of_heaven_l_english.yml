 CANCEL_HARMONIZATION: "Anuluj Harmonizację"
 estate_shangbang: "Shangbang"
 estate_gentry: "Shizu"
 gentry_dominance: "Dominacja Shizu"
 EST_VAL_CELESTIAL_EMPIRE: "Niebiańskie Cesarstwo: §Y$VAL$%§!"
 desc_gentry_dominance: "Klany Uczonych mają całkowitą kontrolę nad naszym rządem, a przyjęcie tronu cesarskiego zostało sprowadzone do zwykłej formalności."
 tributary_smuggling_ring_subject: "Szajka przemytników"
 desc_tributary_smuggling_ring_subject: "Wyroby naszych rzemieślników cieszą się tak dużym popytem, że powstała niewielka sieć dostarczająca je nabywcom w państwie naszego suwerena. Działalność ta nie jest całkowicie legalna, a znaczną część zysków niewątpliwie przechwytują po drodze skorumpowani urzędnicy. Mimo to stanowi ona istotny impuls dla gospodarki naszego kraju."
 tributary_smuggling_ring_overlord: "Napływ dóbr egzotycznych"
 desc_tributary_smuggling_ring_overlord: "Choć nie jest to całkowicie legalne, rozwija się niekontrolowany handel dobrami luksusowymi między nami a jednym z naszych trybutariuszy."
 tributary_institution_influence: "Szerzenie wiedzy"
 desc_tributary_institution_influence: "Nasza zależność trybutarna pozwala nam przyswoić część wiedzy od bardziej zaawansowanych mieszkańców cesarskiego centrum."
 tributary_diplomatic_influence: "Wpływy dyplomatyczne"
 desc_tributary_diplomatic_influence: "Nasza zależność trybutarna pozwala nam wywierać większy wpływ na politykę międzynarodową, niż byłoby to możliwe w innych okolicznościach."
 tributary_diffusion_of_knowledge: "Rozpowszechnianie wiedzy"
 desc_tributary_diffusion_of_knowledge: "Nasza sieć trybutarna umożliwiła nam pozyskiwanie idei i metod, które w przeciwnym razie dotarłyby do naszych granic znacznie później."
 tributary_overlord_trading_port: "Port handlowy trybutariusza"
 desc_tributary_overlord_trading_port: "Prowincja ta rozwija się gospodarczo dzięki temu, że stanowi port macierzysty lokalnych flot trybutarnych. To tutaj do kraju dociera również znaczna część towarów z państwa suwerena i osiedla się większość jego kupców."
 influential_tributary_network: "Wpływ polityczny"
 desc_influential_tributary_network: "Nasza sieć trybutarna zapewniła nam znaczenie wykraczające daleko poza granice naszego państwa."
 tributary_overlord_refugees: "Osiedlenie uchodźców politycznych"
 desc_tributary_overlord_refugees: "Prowincja ta przeżywa ożywienie gospodarcze dzięki osiedleniu się grupy uzdolnionych uchodźców politycznych."
 tributary_mission_piracy: "Piractwo"
 desc_tributary_mission_piracy: "Floty trybutarne padają ofiarą piratów na otwartym morzu. Powoduje to spadek naszych dochodów i zwiększa koszty patrolowania szlaków żeglugowych."
 tributary_gave_up_political_refugees: "Wydanie uchodźców politycznych"
 tributary_forced_brain_drain: "Przymusowa emigracja elit"
 tributary_aiding_smugglers: "Pomoc przemytnikom"
 tributary_stopped_smugglers: "Pomoc w walce z przemytnikami"
 tributary_soured_relations: "Incydent trybutarny"
 tributary_impressive_overlord: "Pod wrażeniem suwerena"
 tributary_same_overlord: "W tej samej sferze trybutarnej"
 forced_brain_drain: "Wysłano uczonych"
 tributary_harbored_criminals: "Udzielanie schronienia przestępcom"
 tributary_harbored_criminals_refused_compensation: "Ukrywanie przestępców"
 tributary_paid_for_service: "Nagrodzony za lojalność"
 tributary_ungrateful_overlord: "Niewdzięczny suweren"
 tributary_events.1.t: "Diaspora [Root.GetAdjective]"
 tributary_events.1.d: "Nasza zależność trybutarna od państwa [Root.Overlord.GetName] jest dość luźna, lecz mimo to otworzyła przed utalentowanymi urzędnikami i przedsiębiorcami wiele nowych możliwości. Wielu zaczęło postrzegać stolicę [Root.Overlord.Capital.GetCapitalName] jako najlepsze miejsce do rozwijania kariery, a każda kolejna misja trybutarna skłania następnych ludzi do poznawania uroków [Root.Overlord.GetAdjective] stolicy.\nPoczątkowo obawiano się, że doprowadzi to do odpływu najbardziej wartościowych obywateli naszego kraju. Zjawisko to daje nam jednak wpływy w szerszym gronie państw otaczających [Root.Overlord.GetName]. Nieliczni, którzy zdecydują się powrócić, przywiozą ze sobą cenne doświadczenie, które będziemy mogli wykorzystać."
 tributary_events.1.a: "Wykorzystajmy dobrze talenty tych ludzi!"
 tributary_events.1.b: "To dla dobra [Root.GetAdjective] ludu."
 tributary_events.2.t: "Sfera wpływów [Root.Overlord.GetAdjective]"
 tributary_events.2.d: "Jako część [Root.Overlord.GetAdjective] sfery trybutarnej coraz bardziej stajemy się częścią szerszego [Root.Overlord.GetAdjective] kręgu kulturowego. Język [Root.Overlord.Culture.GetName] rozbrzmiewa na ulicach, a nawet w dostojnych salach [Root.Capital.GetCapitalName]. W [Root.Overlord.GovernmentName] państwa [Root.Overlord.GetName] coraz częściej mówi się również o naszym kraju."
 tributary_events.2.a: "Dobry sposób na zawarcie nowych przyjaźni na odległość."
 tributary_events.2.b: "Nasi sąsiedzi będą pod wrażeniem"
 tributary_events.3.t: "Kapitał polityczny"
 tributary_events.3.d: "Ochrona potężnego państwa [Root.Overlord.GovernmentName] pomaga nam nie tylko w walce z zagranicznymi wrogami. Stanowi również wyraźny sygnał dla ugrupowań politycznych naszego państwa [Root.GovernmentName]. Pokazuje im, że nasz [Root.Monarch.GetTitle] cieszy się poparciem [Root.Overlord.Monarch.GetTitle] państwa [Root.Overlord.GetAdjective], a część splendoru [Root.Overlord.Monarch.GetHerHis] osoby spływa także na nas."
 tributary_events.3.a: "To położy kres tym małostkowym sporom!"
 tributary_events.3.b: "Dzięki temu zaprowadzimy pokój wśród naszych poddanych."
 tributary_events.4.t: "Rosnące wpływy cesarskie"
 tributary_events.4.d: "Nie każde państwo zasługuje na miejsce w naszej sieci trybutarnej, lecz coraz wyraźniej widać, że nasze wpływy w tym regionie rosną. Nawet kraje, na które mamy niewielki lub żaden bezpośredni wpływ, czują potrzebę dostosowania swojej polityki do wytycznych, które ustalamy dla państw z naszej sfery. Na wielu dworach język [Root.Culture.GetName] jest już uznawany za język dyplomacji i kultury, a nasz [Root.Monarch.GetTitle] cieszy się autorytetem wśród ludzi żyjących daleko poza granicami naszego państwa."
 tributary_events.4.a: "Musimy wykorzystać tę sposobność, by zwiększyć nasze wpływy za granicą."
 tributary_events.4.b: "Skorzystajmy z tej okazji, póki możemy."
 tributary_events.5.t: "Misja trybutarna z państwa [tributary_advanced_underling.GetAdjective]"
 tributary_events.5.d: "Niedawna misja trybutarna z państwa [tributary_advanced_underling.GetName] przyniosła nam nie tylko cenne podarunki, lecz także kontakt z ideami i technologiami odmiennymi od naszych. Być może rozsądnie byłoby, z należytą uprzejmością, poprosić [tributary_advanced_underling.GetAdjective] o przysłanie nam większej liczby najzdolniejszych ludzi, abyśmy mogli przyswoić sobie ich metody."
 tributary_events.5.a: "W naszym państwie [Root.GovernmentName] zawsze znajdzie się miejsce dla kolejnych eunuchów."
 tributary_events.5.b: "Utwórzmy specjalną dzielnicę w samym [Root.Capital.GetCapitalName]."
 tributary_events.5.c: "[Root.GetAdjective] lud potrafi rozwijać się samodzielnie."
 tributary_events.6.t: "Kupcy z państwa [Root.Overlord.GetAdjective]"
 tributary_events.6.d: "Coraz liczniejsze misje trybutarne do państwa [Root.Overlord.GetName] sprawiły, że port w [tributary_trader_port.GetCapitalName] stał się głównym punktem przyjmowania statków naszego suwerena. Prowincja [tributary_trader_port.GetName] zaczęła również przyciągać coraz większą liczbę [Root.Overlord.GetAdjective] kupców i awanturników, co dodatkowo sprzyja rozwojowi regionu.\nNiektórzy niewątpliwie dostrzegają w tym jednak doskonały sposób na uniknięcie czujnego wzroku [Root.Overlord.GetAdjective] celników i stróżów prawa. Zachęcanie tych poszukiwaczy fortuny prawdopodobnie przedłuży okres prosperity [tributary_trader_port.GetName], lecz może nie leżeć w naszym najlepszym interesie."
 tributary_events.6.a: "Powitajmy tych imigrantów."
 tributary_events.6.a.tt: "[Root.Overlord.GetName] będzie niezadowolone, jeśli odkryje, że udzielamy schronienia przestępcom."
 tributary_events.6.b: "Lepiej nie zadawać się z wichrzycielami."
 tributary_events.7.t: "Nadużywanie statusu trybutariusza"
 tributary_events.7.d: "Dotarły do nas wieści, że [tributary_criminal_country.Monarch.GetTitle] państwa [tributary_criminal_country.GetName] udziela schronienia licznym przestępcom, piratom i złodziejom, zapewniając im bezpieczną przystań w pobliżu obszarów, które nas interesują. Poważnie szkodzi to naszym interesom w regionie i naraża nas na utratę twarzy zarówno przed innymi trybutariuszami, jak i przed własnym dworem."
 tributary_events.7.a: "Natychmiast zażądajmy zaprzestania tych praktyk i wypłaty odszkodowania!"
 tributary_events.7.b: "Niestety, niewiele możemy na to poradzić."
 tributary_events.8.t: "Trybutariusze kryjący przestępców"
 tributary_events.8.d: "[Root.Overlord.GetAdjective] urzędnicy oskarżają nas o udzielanie schronienia przestępcom gospodarczym i chronienie ich przed sprawiedliwością, której wymaga [Root.Overlord.GovernmentName]. Według [Root.Overlord.GetAdjective] władz pozwalamy im kontynuować nielegalną działalność w obrębie [Root.Overlord.GetAdjective] strefy handlowej. Nasz suweren zamierza teraz zlikwidować te proceder i wysłał do nas poselstwo, żądając pokrycia kosztów tej operacji."
 tributary_events.8.a: "Pozbądźmy się przestępców!"
 tributary_events.8.b: "Pozwólmy niektórym osiąść na stałe w naszym kraju."
 tributary_events.9.t: "Zarządzanie siecią trybutarną"
 tributary_events.9.d: "Otrzymaliśmy skargi z Ministerstwa Obrzędów, że liczne misje trybutarne przybywające do [Root.Capital.GetCapitalName] nadmiernie obciążają jego zasoby. Uroczyste przyjmowanie zagranicznych dostojników, a nawet zajmowanie się przywożonymi przez nich podarunkami, staje się coraz większym i bardziej skomplikowanym przedsięwzięciem. Niektórzy obawiają się, że w krótkiej perspektywie ucierpią na tym nasze działania dyplomatyczne."
 tributary_events.9.a: "Taka jest cena wpływów."
 tributary_events.9.b: "Musimy rozbudować Ministerstwo Obrzędów."
 tributary_events.10.t: "Incydent w [ningbo_province.GetCapitalName]"
 tributary_events.10.d: "Misja trybutarna to nie tylko podróż, której celem jest oddanie hołdu [Root.GetTributaryOverlord], lecz także okazja do handlu z państwem [Root.GovernmentName] [Root.GetName]. Pragnąc to wykorzystać, rywalizujące ze sobą rody szlacheckie w [ningbo_country.GetName] najwyraźniej zaczęły wysyłać do nas własne misje trybutarne, podając się za przedstawicieli [ningbo_country.Monarch.GetTitle], by zdobyć przewagę w wewnętrznych rozgrywkach politycznych [ningbo_country.GetName].\nTym razem jednak dwie takie misje przybyły jednocześnie do [ningbo_province.GetName], a konflikty z ich ojczyzny przerodziły się w krwawe starcie."
 tributary_events.10.a: "Ograniczmy handel z państwem [ningbo_country.GetName]."
 tributary_events.10.b: "Przydzielmy obu stronnictwom różne miejsca składania trybutu."
 tributary_events.11.t: "Incydent w [ningbo_province.GetCapitalName]"
 tributary_events.11.d: "Otrzymaliśmy wiadomość od [Root.Overlord.GetName], że wprowadza ograniczenia w handlu zagranicznym z naszym krajem. Powodem jest nasza niezdolność do powstrzymania lokalnych stronnictw przed wykorzystywaniem sztandaru misji trybutarnej do rozstrzygania własnych, błahych sporów. Jeśli nie podejmiemy zdecydowanych działań, problem ten może ciągnąć się latami."
 tributary_events.11.a: "Smutne."
 tributary_events.11.b: "Zrekompensujmy państwu [Root.Overlord.GetName] poniesione niedogodności."
 tributary_events.12.t: "Trybut od państwa [ningbo_country.GetName]"
 tributary_events.12.d: "Przybył ambasador z [ningbo_country.GetName], przywożąc ogromny podarunek jako zadośćuczynienie za nieprzyjemności, do których doszło w [ningbo_province.GetCapitalName]. [ningbo_country.Monarch.GetTitle] surowo ukarał nieposłusznych podwładnych i osobiście zagwarantuje, że podczas przyszłych misji trybutarnych zostanie zachowany pokój."
 tributary_events.12.a: "Rozsądna decyzja."
 tributary_events.12.a.tt: "Państwo [Root.GetName] otrzyma §G[Root.money_to_give.GetValue]§! od [ningbo_country.GetName]."
 tributary_events.13.t: "Egzotyczne towary z [exotic_tributary.GetName]"
 tributary_events.13.d: "Nasz dwór w [Root.Capital.GetCapitalName] jest zachwycony mnogością egzotycznych towarów przywiezionych przez misję trybutarną z [exotic_tributary.GetName]. Przedsiębiorczy urzędnicy i kupcy szybko dostrzegli, jak wielkim zainteresowaniem cieszą się te dobra, i już zaczęli zawierać odpowiednie układy. Jeśli nie zareagujemy szybko, niemal na pewno powstanie szajka przemytnicza, która będzie sprowadzać do stolicy kolejne egzotyczne towary."
 tributary_events.13.a: "Pozwólmy na to, ale zadbajmy o swój udział w zyskach!"
 tributary_events.13.b: "Musimy natychmiast wprowadzić surowe przepisy."
 tributary_events.14.t: "Nowe możliwości handlowe"
 tributary_events.14.d: "Odkąd zaczęliśmy wysyłać trybut do [Root.Overlord.GetName], egzotyczne wyroby naszych rzemieślników cieszą się dużym popytem w [Root.Overlord.Capital.GetCapitalName]. Doprowadziło to do powstania niewielkiej sieci handlowej, która choć nie całkiem legalna, wzbogaciła wielu [Root.Overlord.GetAdjective] urzędników i przedsiębiorczych [Root.GetAdjective] kupców.\nGdy [Root.Overlord.GetAdjective] [Root.Overlord.Monarch.GetTitle] odkrył skalę tego procederu, wprowadził znacznie surowsze przepisy, by powstrzymać przemyt, który [Root.Overlord.Monarch.GetSheHe] uważa za nielegalny. Tam jednak, gdzie istnieje popyt, trudno powstrzymać ludzi przed próbami zarobku..."
 tributary_events.14.a: "Musimy zrobić, co w naszej mocy, by pomóc [Root.Overlord.Monarch.GetTitle]."
 tributary_events.14.b: "Czas wesprzeć przedsiębiorców z państwa [Root.GetName] [Root.GovernmentName]."
 tributary_events.15.t: "Popyt w państwie [Root.Overlord.GetAdjective]"
 tributary_events.15.d: "Wygląda na to, że nasze misje trybutarne zostały bardzo dobrze przyjęte w [Root.Overlord.Capital.GetCapitalName]. Egzotyczne towary przywiezione przez naszych wysłanników sprawiły, że wzrósł popyt na produkty z [Root.GetAdjective]. Choć ten handel nie jest całkowicie legalny, [Root.Overlord.GetAdjective] władze jak dotąd przymykały na niego oko."
 tributary_events.15.a: "Cóż za szczęście!"
 tributary_events.16.t: "Uchodźcy polityczni"
 tributary_events.16.d: "Po przegranej walce o władzę duża grupa uchodźców politycznych z [Root.Overlord.GetAdjective] państwa [Root.Overlord.GovernmentName] zaczęła szukać schronienia w naszym kraju. Konflikt wydaje się na tyle błahy, że zwycięskie stronnictwo w [Root.Overlord.GetName] nie jest szczególnie zainteresowane poszukiwaniem zbiegłych rodaków, choć zapewne doceniłoby, gdybyśmy ich odesłali. Z drugiej strony są to zdolni ludzie, którzy mogliby wiele wnieść do naszego kraju, gdybyśmy pozwolili im zostać."
 tributary_events.16.a: "Znajdziemy dla nich trochę miejsca..."
 tributary_events.16.b: "Odeślijmy ich do cesarskiego centrum."
 tributary_events.17.t: "Eunuchowie z państw trybutarnych"
 tributary_events.17.d: "Wraz z przybyciem tegorocznych misji trybutarnych w nasze szeregi wstąpiła duża liczba eunuchów. Ci młodzi mężczyźni zostali wybrani ze względu na swoje zdolności i po krótkim przygotowaniu skierowani do służby u naszego [Root.Monarch.GetTitle].\nNiektórzy będą pracować w administracji, inni zaś mogą nawet awansować na zaufanych ministrów lub dowódców naszych armii i flot."
 tributary_events.17.a: "Takie oddanie służbie jest godne naśladowania."
 tributary_events.18.t: "Flota trybutarna zaatakowana przez piratów"
 tributary_events.18.d: "Regularne przybywanie flot trybutarnych, które przywożą na nasze wybrzeża skarby z odległych krajów, stanowi pokusę nie do odparcia dla tych, którzy pragną szybko się wzbogacić. Grupa piratów zaczęła napadać na misje trybutarne, czerpiąc znaczne zyski z licznych podarunków przeznaczonych dla naszego [Root.Monarch.GetTitle]."
 tributary_events.18.a: "Przeznaczmy dodatkowe środki na ich ochronę."
 tributary_events.18.b: "Nasza flota szybko się z nimi rozprawi!"
 tributary_events.19.t: "Nagradzana Lojalność"
 tributary_events.19.d: "[tributary_loyal.GetName] jest pod wieloma względami wzorowym państwem trybutarnym. Jego misje przybywają regularnie, a posłuszeństwo nigdy nie budziło wątpliwości.\nNasz system trybutarny zapewnia nam dary i inne oznaki szacunku od tych, którym gwarantujemy ochronę. Oczekuje się jednak od nas nie tylko obietnicy obrony, lecz także troski o nich na inne sposoby. Być może nadszedł czas, by pokazać, że lojalność zostaje nagrodzona?"
 tributary_events.19.a: "Wyślijmy [tributary_loyal.Monarch.GetTitle] najwspanialsze dary!"
 tributary_events.19.b: "Niestety, nie stać nas na takie zbytki."
 tributary_events.20.t: "[From.GetName] chce zwalczać piratów"
 tributary_events.20.d: "Choć obiecali pomóc oczyścić region z piratów, nie ulega wątpliwości, że [From.GetName] z czasem stało się prawdziwą piracką przystanią. Zawsze wiedzieliśmy, że są barbarzyńcami i trudno im ufać, lecz ostatnie działania [From.Monarch.GetTitle] faktycznie zbliżyły nasze państwa do siebie."
 tributary_events.20.a: "Możemy na tym skorzystać."
 tributary_events.21.t: "[From.GetName] jest piracką przystanią"
 tributary_events.21.d: "[From.Monarch.GetTitle] państwa [From.GetName] postanowił nadal udzielać schronienia znanym piratom. Gdy nasi lokalni urzędnicy zażądali oczyszczenia portów, [From.Monarch.GetTitle] odmówił wykonania polecenia."
 tributary_events.21.a: "Musimy ponownie rozważyć ich status trybutarny."
 tributary_events.22.t: "Nagrodzona Lojalność"
 tributary_events.22.d: "Jako wieloletni i wierny trybutariusz [Root.Overlord.GetName] otrzymaliśmy ogromny podarunek. Wzmocni to nasze rządy w kraju i znacznie powiększy zasoby skarbca!"
 tributary_events.22.a: "Miło otrzymać takie uznanie."
 tributary_events.23.t: "Poszukiwacze szczęścia"
 tributary_events.23.d: "Coroczne misje trybutarne przybywające do [Root.Capital.GetCapitalName] przynoszą nie tylko dary i cenne możliwości handlowe, lecz także pozwalają przedsiębiorczym ludziom z obcych krajów dotrzeć na dwór [Root.GetAdjective]. Po przybyciu szukają zatrudnienia w służbie naszego [Root.Monarch.GetTitle], licząc na bogatsze i lepsze życie."
 tributary_events.23.a: "To kraj pełen możliwości."
 tributary_events.24.t: "[Root.Overlord.GetAdjective] awanturnicy"
 tributary_events.24.d: "Płacąc trybut [Root.Overlord.Monarch.GetTitle] państwa [Root.Overlord.GetName], należymy do [Root.Overlord.GetAdjective] strefy handlowej, a ludzie mogą swobodnie podróżować między naszymi krajami. Wśród osób korzystających z tej sposobności znajdują się poszukiwacze szczęścia i awanturnicy z całego regionu.\nLudzie ci posiadają umiejętności, doświadczenie i pochodzenie odmienne od większości mieszkańców naszego państwa, dzięki czemu mogą wnieść cenny wkład w naszą sprawę."
 tributary_events.24.a: "Witamy ich przybycie."
 tributary_events.25.t: "[Root.Overlord.GetAdjective] stronnictwa mieszają się do [Root.GetAdjective] polityki"
 tributary_events.25.d: "Kilka wpływowych rodów w [Root.Overlord.GetName] postanowiło na własną rękę naprawić brak zaufania między naszymi rządami. Pragną obalić nasz rząd, finansując z własnej kieszeni działania militarne i gospodarcze opozycji przeciwko naszemu [Root.Monarch.GetTitle]!\nPrawdopodobnie można by nakłonić [Root.Overlord.Monarch.GetTitle] państwa [Root.Overlord.GetName] do poskromienia tych wichrzycieli, lecz przekonanie [Root.Overlord.Monarch.GetHerHim] do wysłuchania naszych próśb będzie wymagało książęcego podarunku."
 tributary_events.25.a: "Nie boimy się buntowników."
 tributary_events.25.b: "Książęcy podarunek z pewnością [Root.Overlord.Monarch.GetSheHe] otrzyma!"
 tributary_events.26.t: "Najazdy z państwa [Root.Overlord.GetName]"
 tributary_events.26.d: "Zobowiązując się do płacenia trybutu państwu [Root.Overlord.GovernmentName] [Root.Overlord.GetName], zgodziliśmy się również na utrzymanie otwartej granicy. Mieszkańcy pogranicza zdążyli już znienawidzić ten stan rzeczy.\n\nProwincje bezpośrednio sąsiadujące z ordą nigdy nie są bezpieczne, ponieważ najeźdźcy mogą w każdej chwili pojawić się, by zażądać trybutu w postaci żywych niewolników. Mężczyźni i kobiety są następnie sprzedawani na targach w [Root.Overlord.Capital.GetCapitalName]. Nasi ludzie marzą o dniu, w którym zrzucimy to jarzmo, lecz dopóki obawiamy się armii [Root.Overlord.GetName], musimy znosić te wyprawy."
 tributary_events.26.a: "Pewnego dnia odzyskamy wolność!"
 tributary_events.27.t: "Wsparcie ze strony [Root.Overlord.GetAdjective] stronnictw"
 tributary_events.27.d: "Nasza wojna z państwem [other_tributary_country.GetAdjective] nie pozostała niezauważona w [Root.Overlord.GetName]. Sam [Root.Overlord.Monarch.GetTitle] nie zniży [Root.Overlord.Monarch.GetHerselfHimself] się do angażowania [Root.Overlord.Monarch.GetHerselfHimself] w nasze błahe konflikty, lecz niektórzy członkowie [Root.Overlord.Monarch.GetHerHis] dworu nie mają takich skrupułów. Potężna grupa interesu pragnie naszego zwycięstwa i obiecała udzielić nam pomocy.\nOczywiście nic na tym świecie nie jest za darmo. W zamian oczekują przysług, które pozwolą im realizować własne polityczne intrygi na dworze [Root.Overlord.GetName]."
 tributary_events.27.a: "Wspaniale!"
 tributary_events.27.a.tt: "Rozgniewa to [Root.Overlord.Monarch.GetHerHis] Wysokość, [Root.Overlord.Monarch.GetTitle] państwa [Root.Overlord.GetName]."
 tributary_events.27.b: "Nie będziemy mieszać się w politykę [Root.Overlord.GetAdjective] państwa [Root.Overlord.GovernmentName]."
 tributary_events.28.t: "[Root.Overlord.GetAdjective] stronnictwa wspierają państwo [From.GetName]!"
 tributary_events.28.d: "Choć najwyraźniej nie otrzymały oficjalnego przyzwolenia, [Root.Overlord.GetAdjective] grupy interesu podjęły działania, by pomóc państwu [From.GetAdjective] w wojnie przeciwko nam. To nikczemne postępowanie! Oczekiwalibyśmy, że [Root.Overlord.GetName] będzie lepiej panować nad swoimi poddanymi!"
 tributary_events.28.a: "To straszne!"
 tributary_events.29.t: "Państwo [From.GetName] miesza się do polityki"
 tributary_events.29.d: "Wygląda na to, że nasz trybutariusz, państwo [From.GovernmentName] [From.GetName], zaoferował wsparcie stronnictwom politycznym na naszym dworze w zamian za pomoc w wojnie przeciwko naszemu drugiemu trybutariuszowi, [other_tributary_country.GetName]. Zaszkodziło to naszym stosunkom z tym państwem i wielce rozgniewało naszego [Root.Monarch.GetTitle]."
 tributary_events.29.a: "Barbarzyńcy!"
 horde_slave_raid: "Złupione pogranicze"
 desc_horde_slave_raid: "Nasz suweren z ordy siłą odebrał mieszkańcom pogranicza trybut w postaci ludzi, szkodząc naszej gospodarce i hamując wzrost populacji."
