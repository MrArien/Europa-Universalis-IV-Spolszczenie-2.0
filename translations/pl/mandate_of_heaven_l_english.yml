 overlord_daimyo_at_peace: "Daimyo w stanie pokoju"
 overlord_daimyo_same_isolationism: "Izolacjonizm daimyo"
 HARMONIZE_WITH_RELIGION: "§YHarmonizacja religii§!"
 HARMONIZE_DESC: "Prowincje z religiami zharmonizowanymi będą tolerowane, jak gdyby wyznawały §Y$NAME$§!.\nPaństwa wyznające którąkolwiek z religii zharmonizowanych będą postrzegać cię tak, jak gdyby była to twoja religia państwowa."
