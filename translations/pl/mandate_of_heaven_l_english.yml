 TRIBUTARY_NOT_HORDE_OR_EASTERN_RELIGION: "Tylko Niebiański Cesarz, państwa z grupy religii Wschodu oraz państwa z rządem Stepowych Nomadów mogą ustanowić trybutariuszy."
 TRIBUTARY_IS_TRIBUTARY: "Trybutariusze nie mogą posiadać trybutariuszy."
 TRIBUTARYTITLE: "Utwórz trybut"
 TRIBUTARYDESC: "Zaproponuj im, aby zostali naszym trybutariuszem."
 CANCELTRIBUTARYTITLE: "Anuluj trybut"
 CANCELTRIBUTARYDESC: "Anuluj umowę z naszym trybutariuszem."
 TRIBUTARYNEWDESC: "Czy chcesz zapytać kraj $COUNTRY|Y$ o chęć zostania naszym §Ytrybutariuszem§!?\nJako ich suweren możesz zażądać od nich corocznego trybutu w postaci ¤, £adm£, £dip£, £mil£ lub £icon_manpower£.\nOni natomiast nadal będą mogli utrzymywać autonomiczne stosunki dyplomatyczne z innymi krajami.\nJeśli będą mniej zaawansowani technologicznie od nas, otrzymają zniżkę do kosztu technologii: $EFFECT$."
 BREAKTRIBUTARYNEWDESC: "Czy chcesz przestać być trybutariuszem wobec $COUNTRY$? Spowoduje to rozejm między waszymi krajami i negatywnie wpłynie na stosunki."
 TRIBUTARYREQDESC: "$ACTOR$ oferuje nam stanie się ich trybutariuszem."
 SELECT_TRIBUTE_TITLE: "Wybierz trybut"
 OVERLORD_CHANGED_TRIBUTE_TYPE: "Nasz suweren §Y$OVERLORDNAME$§! żąda teraz, abyśmy wysyłali mu §Y$NAME$§! jako coroczny trybut."
 ONLY_TRIBUTARY_CAN_SEND_TRIBUTE: "Tylko trybutariusze mogą wysyłać trybut."
 TRIBUTARYBREAKDESC: "Czy chcesz zerwać nasze ustalenia dotyczące trybutu z §Y$COUNTRY$§!?\nSpowoduje to pogorszenie naszych relacji i doprowadzi do rozejmu między nami na kolejne $TRUCE$ lat."
 TRIBUTARYSUBJECTBREAKDESC: "Czy chcesz zerwać nasz układ trybutu z §Y$COUNTRY$§!?\nSpowoduje to zmniejszenie naszej stabilności o §R$STAB$§! i pogorszy nasze stosunki."
 TRIBUTARY_BREAK_TRUST: "Już nam nie ufają"
 TRIBUTARY_BREAK_THREATENED: "Czują, że stajemy się dla nich zagrożeniem."
 DEMAND_TRIBUTE_TYPE: "Zażądaj §Y$TYPE$§! jako trybut."
 DEMAND_TRIBUTE_YEARLY_DESC: "Spodziewany trybut na koniec tego roku wyniesie $AMOUNT|Y$ $TYPE$."
 CURRENT_TRIBUTE_TYPE: "Żądamy §Y$TYPE$§! jako trybut."
 ASKFORTRIBUTARYDESC: "Zapytaj, czy możesz zostać ich trybutariuszem. "
 ASKFORTRIBUTARYNEWDESC: "Czy chcesz zapytać kraj $OVERLORD|Y$ o możliwość zostania ich §Ytrybutariuszem§!?\nJeśli się zgodzą, mogą zażądać od nas corocznego trybutu w postaci ¤, £adm£, £dip£, £mil£ lub £icon_manpower£.\nMy natomiast nadal będziemy mogli utrzymywać autonomiczne stosunki dyplomatyczne z innymi krajami.\nJeśli kraj $OVERLORD$ będzie bardziej zaawansowany technologicznie od nas, otrzymamy zniżkę do kosztu technologii: $EFFECT$."
 ASKFORTRIBUTARYTRADELEAGUEWARNING: "§RZostaniemy usunięci z naszej ligi handlowej!§!"
 ASKFORTRIBUTARYTITLE: "Zostań ich trybutariuszem"
 ASKTRIBUTARYDESC: "Kraj §Y$ACTOR$§! chce zostać naszym §Ytrybutariuszem§!. Jeśli potwierdzą tę decyzję, możemy zażądać od nich corocznego trybutu w postaci ¤, £adm£, £dip£, £mil£ lub £icon_manpower£.\nOni natomiast nadal będą mogli utrzymywać autonomiczne stosunki dyplomatyczne z innymi krajami.\nJeśli będą mniej zaawansowani technologicznie od nas, otrzymają zniżkę do kosztu technologii: $EFFECT$."
 ESTABLISHTRIBUTARYDESC: "Kraj §Y$ACTOR$§! chce, abyśmy stali się ich §Ytrybutariuszem§!. Jeśli się zgodzimy, mogą zażądać od nas corocznego trybutu w postaci ¤, £adm£, £dip£, £mil£ lub £icon_manpower£.\nMy natomiast nadal będziemy mogli utrzymywać autonomiczne stosunki dyplomatyczne z innymi krajami.\nJeśli kraj $ACTOR$ będzie bardziej zaawansowany technologicznie od nas, otrzymamy zniżkę do kosztu technologii: $EFFECT$."
 ESTABLISHTRIBUTARYTRADELEAGUEWARNING: "§RZaakceptowanie spowoduje usunięcie nas z naszej ligi handlowej!§!"
 ICON_TRIBUTARY: "Oferta na uzyskanie statusu §Ytrybutariusza§!"
 ICON_ASK_TRIBUTARY: "Oferta na zostanie naszym §Ytrybutariuszem§!"
 TRIBUTARY_MISSION_WAR_NAME: "$ORDER$$FIRST$ Wojna o $SECOND_NAME$ Trybut"
 cb_force_tributary: "Wymuś zostanie trybutariuszem"
