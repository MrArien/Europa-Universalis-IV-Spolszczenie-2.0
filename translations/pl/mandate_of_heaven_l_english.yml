 REFUSED_CALL_FROM_TRIBUTARY_PENALTY: "Jeśli odmówimy, stracimy $MANDATE|R$ mandatu."
 tributary_state_behind_overlord_tech_adm: "Trybutariusz z całkowitym poziomem technologii administracyjnej mniejszym niż posiadany przez suwerena"
 tributary_state_behind_overlord_tech_dip: "Trybutariusz z całkowitym poziomem technologii dyplomatycznej mniejszym niż posiadany przez suwerena"
 tributary_state_behind_overlord_tech_mil: "Trybutariusz z całkowitym poziomem technologii militarnej mniejszym niż posiadany przez suwerena"
 CURRENT_HARMONY: "Harmonia"
 HARMONY_DESCRIPTION: "Harmonia religijna naszego narodu z czasem wzrośnie w sposób naturalny. Konwertowanie prowincji i harmonizacja z innymi religiami w krótkim czasie zmniejszy naszą Harmonię."
 CURRENT_HARMONY_VAL: "§YHarmonia: $VAL$§!\nZmienia się rocznie o $CHANGE$:\n"
