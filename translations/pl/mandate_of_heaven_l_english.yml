 celestial_empire_events.1.t: "Koniec [From.GetGovNameGen] [From.GetAdjective]"
 celestial_empire_events.1.d: "Wraz z upadkiem miasta [From.Capital.GetCapitalName] ostatnie pozostałości Imperium Chińskiego zostały zmiażdżone. Mandat Niebios i starożytna konfucjańska administracja są teraz wyraźnie postrzegane jako przestarzałe koncepcje, a uczona szlachta jako klasa będzie musiała ewoluować w coś innego lub zginąć.\nChociaż pamięć o Imperium będzie żyła przez jakiś czas, [Root.GovernmentName] [Root.GetAdjective] na zawsze zostanie w pamięci jako niszczyciel ostatniego [From.Monarch.GetRulerGen]."
 celestial_empire_events.1.a: "Rozumiem."
 celestial_empire_events.2.t: "Ideologia naszego imperium"
 celestial_empire_events.2.d: "Przyjmując tytuł cesarskich Chin, wkroczyliśmy na ścieżkę pradawnej tradycji. [Root.GetName] odziedziczyło szereg instytucji, takich jak system egzaminów urzędniczych i koncepcja mandatu Niebios, ściśle związanych z chińską filozofią konfucjanizmu.\nJako nowe Cesarstwo Chin sami zdecydujemy, w jakim stopniu chcemy połączyć tę ideologię z własną. Przyjęcie filozofii konfucjańskiej prawdopodobnie pomogłoby nam jednak rządzić rozległym imperium, do którego rościmy sobie prawa, i umocniłoby mandat w oczach poddanych."
 celestial_empire_events.2.a: "[Root.Monarch.GetTitle] jest [Root.GetTributaryOverlord]!"
 celestial_empire_events.2.b: "Nie zhańbimy wiary [Root.Religion.GetName] naszych przodków!"
 celestial_empire_events.3.t: "Sinicyzacja"
 celestial_empire_events.3.d: "Lud [Root.Culture.GetName] coraz bardziej niechętnie odnosi się do nowych chińskich zwyczajów, które wprowadzamy w całym naszym państwie — od dworu po najniższych rangą urzędników prowincjonalnych. Rosnąca nieufność wobec obcych ingerencji w dawne tradycje i normy sprawia, że niektórzy otwarcie kwestionują nawet nasze prawo do sprawowania rządów."
 celestial_empire_events.3.a: "Z czasem się nauczą."
 celestial_empire_events.3.b: "Musimy zachować nasze dziedzictwo!"
 resistance_to_cultural_changes: "Znieważanie przodków"
 desc_resistance_to_cultural_changes: "Mieszkańcy tej prowincji mają nam za złe, że w ramach postępującej sinicyzacji naszego państwa znieważamy tradycje przodków. Narastające wyobcowanie sprawiło, że nie chcą płacić podatków i nie okazują naszemu państwu należytego poparcia."
 empire_of_china_in_name: "Cesarstwo Chin tylko z nazwy"
 desc_empire_of_china_in_name: "Choć udało nam się zdobyć tytuł cesarza Chin, nasze imperium obejmuje zaledwie garstkę Chińczyków. Jeśli nie chcemy być postrzegani jako obcy cesarz, musimy włączyć Chińczyków do struktur naszego rządu."
 less_than_two_chinese_cultures_accepted_tooltip: "Akceptuje mniej niż 2 kultury z chińskiej grupy kulturowej."
 atleast_two_chinese_cultures_accepted_tooltip: "Akceptuje co najmniej 2 kultury z chińskiej grupy kulturowej."
 disaster_active_for_10_years_tooltip: "Katastrofa trwa od 10 lat."
 empire_of_china_in_name.1.t: "Cesarz Chin tylko z nazwy"
 empire_of_china_in_name.1.d: "Choć zyskaliśmy powszechne uznanie jako nowe Cesarstwo Chin, nie zdobyliśmy jeszcze szacunku chińskiego ludu. Nasze znaczne uzależnienie od cudzoziemców, a nawet ludzi uznawanych za niecywilizowanych, w armii i administracji podważa mandat naszej dynastii.\nDopóki nie podejmiemy działań, by stać się prawdziwie chińskim imperium, pozostaniemy cesarstwem jedynie z nazwy i będziemy sprawiać wrażenie, że utraciliśmy mandat Niebios."
 empire_of_china_in_name.1.a: "Z czasem się nauczą."
 empire_of_china_in_name.2.t: "Akceptacja Chińczyków"
 empire_of_china_in_name.2.d: "Nasze wysiłki na rzecz zintegrowania Chińczyków z państwem, które nimi rządzi, przyniosły owoce. Nasze prawo do mandatu Niebios nie jest już kwestionowane z powodu braku więzi z samym ludem. Podobnie jak wielu obcych zdobywców, którzy na przestrzeni wieków podbijali Chiny, być może nigdy nie będziemy postrzegani jako imperium o prawdziwie chińskim pochodzeniu, lecz bez wątpienia jesteśmy Cesarstwem Chin."
 empire_of_china_in_name.2.a: "Za Syna Niebios!"
 empire_of_china_nomadic_border_events.1.t: "Pogranicze koczowników"
 empire_of_china_nomadic_border_events.1.d: "Potężne ordy na pograniczu od zawsze stanowiły zagrożenie dla Cesarstwa Chin. Wraz z pojawieniem się kolejnej silnej ordy nasi poddani zaczynają wątpić, czy zdołamy ich ochronić. Czy [Root.Monarch.GetTitle], który nie potrafi utrzymać ord w ryzach, może naprawdę posiadać mandat Niebios?\nCzas pokaże."
 empire_of_china_nomadic_border_events.1.a: "Za [Root.GetTributaryOverlord]!"
 empire_of_china_nomadic_border_events.2.t: "Przywrócony porządek"
 empire_of_china_nomadic_border_events.2.d: "Nasze granice nie są już zagrożone przez potężne ordy, dzięki czemu kraj może się rozwijać, a nasze rządy nie są już kwestionowane. Krytyka, która niegdyś spadała bezpośrednio na [Root.GetTributaryOverlord], ucichła, a imperium może oczekiwać nowej ery dobrobytu."
 empire_of_china_nomadic_border_events.2.db: "Cesarstwo Chin upadło. Powszechna ruina naszego niegdyś potężnego państwa sprawiła, że dawne obawy poddanych związane z koczowniczym pograniczem stały się odległym wspomnieniem."
 empire_of_china_nomadic_border_events.2.a: "Taka jest wola Niebios."
 empire_of_china_nomadic_border: "Niestrzeżona granica z nomadami"
 empire_of_china_nomadic_border_tt: "Jest ordą i posiada łącznie co najmniej §Y300§! rozwoju we własnych prowincjach oraz u poddanych niebędących trybutariuszami"
 eoc_nomadic_border_tooltip: "Łączny rozwój wynosi co najmniej §Y300§!"
 shogunate_mechanic_explanation: "§MKraj może przejąć władzę nad szogunatem i stać się władcą wszystkich poddanych Daimyo, przejmując prowincję Kioto.§!"
 wokou_pirate_stronghold_indifferent: "Piracka twierdza"
 desc_wokou_pirate_stronghold_indifferent: "W tej prowincji znajduje się dobrze prosperująca piracka twierdza, pozostająca poza naszą kontrolą."
 wokou_pirate_stronghold_friendly: "Przyjazna piracka twierdza"
 desc_wokou_pirate_stronghold_friendly: "Ku niezadowoleniu wszystkich naszych sąsiadów w tej prowincji znajduje się piracka twierdza objęta naszą ochroną."
 wokou_pirate_stronghold_hostile: "Wroga piracka twierdza"
 desc_wokou_pirate_stronghold_hostile: "W tej prowincji rozwinęła się dobrze prosperująca działalność. Jej przedstawiciele nie zamierzają jednak dzielić się kontrolą nad szlakami morskimi."
 desc_empire_of_china_nomadic_border: "Pojawienie się potężnej ordy na naszych granicach rzuca ponury cień na nasze roszczenia do mandatu Niebios. Aby państwo mogło się rozwijać, musimy spacyfikować koczownicze pogranicze."
 wokou_closed_ending: "Spacyfikowane wybrzeża"
 desc_wokou_closed_ending: "Położyliśmy kres pirackim rządom wzdłuż wybrzeży i zakazaliśmy wszystkim rybakom noszenia broni."
 wokou_no_effort_ending: "Koniec Woko"
 desc_wokou_no_effort_ending: "Gwałtowny wzrost aktywności piratów pochodzących z naszych prowincji dobiegł końca."
 wokou_turned_to_navy: "Piraci przemienieni w marynarzy"
 desc_wokou_turned_to_navy: "Wzmocniliśmy przywódców pirackich band na naszych ziemiach i zaprowadziliśmy porządek, nadając im tytuły oraz miejsce w naszej hierarchii. Dzięki temu nasza flota jest silniejsza niż kiedykolwiek."
 urbanization_in_order: "Uporządkowane społeczeństwo"
 desc_urbanization_in_order: "Dołożyliśmy wszelkich starań, by w czasach gwałtownego wzrostu liczby mieszkańców miast i postępującej urbanizacji zachować porządek oraz tradycję. Wprowadziliśmy surowe przepisy określające, kto i dokąd może się przenosić oraz jaki rodzaj pracy może wykonywać. Dzięki temu patrzymy w przyszłość jako zjednoczone, choć nieco rozwarstwione społeczeństwo."
 urbanization_middle_road: "Urbanizacja"
 desc_urbanization_middle_road: "W ostatnich dziesięcioleciach nasze miasta znacznie się rozrosły dzięki rosnącym plonom i masowej migracji ludności wiejskiej do kontrolowanych przez nas ośrodków zamkowych."
 urbanization_social_mobility: "Mobilność społeczna"
 desc_urbanization_social_mobility: "Ludność naszych miast szybko rośnie, ponieważ coraz więcej ludzi szuka nowego życia pod murami naszych zamków. Zwiększyło to mobilność społeczną, a my staramy się wzmacniać ten trend poprzez własną politykę."
 movement_restrictions: "Ograniczenia przemieszczania się"
 desc_movement_restrictions: "Siłą próbowaliśmy ograniczyć przemieszczanie się naszych poddanych po kraju. Utworzyliśmy rejestry, a każda podróż wymaga zgody naszych urzędników."
 urban_growing_pains: "Niekontrolowany rozwój"
 desc_urban_growing_pains: "Wielki napływ ludności ze wsi do tego miasta prawdopodobnie przyniesie mu korzyści w dłuższej perspektywie, lecz obecnie zmaga się ono z problemami dotyczącymi wszystkiego — od porządku publicznego po podstawowe warunki sanitarne."
 support_of_ikkos: "Poparcie Ikko-Ikki"
 desc_support_of_ikkos: "Cieszymy się poparciem gorliwych członków Ikko-Ikki — buddyjskich wspólnot posiadających znaczną autonomię i wpływy zarówno w naszym państwie, jak i u naszych sąsiadów."
 ikkos_empowered: "Miasta świątynne"
 desc_ikkos_empowered: "Miasta świątynne buddystów Czystej Krainy na stałe wpisały się w krajobraz naszego państwa. Mają znaczne wpływy i w dużym stopniu przyczyniają się do rozwoju nowych ośrodków miejskich."
 ikkos_crushed: "Przywrócenie autorytetu"
 desc_ikkos_crushed: "Zmiażdżyliśmy wspólnoty świątynne buddystów Czystej Krainy i ponownie ustanowiliśmy siebie jedyną władzą w naszym państwie."
 incident_end_dejima: "Zamknięte porty"
 desc_incident_end_dejima: "Siłą ograniczyliśmy wpływy Zachodu i poddaliśmy je ścisłej kontroli, chroniąc zwykłych mieszkańców naszego państwa. Tolerujemy handel ze względu na zyski, lecz nie dopuścimy do rozpowszechniania wywrotowych idei."
 incident_end_trade_with_west: "Handel z zachodem"
 desc_incident_end_trade_with_west: "Choć pilnujemy, by handel pozostawał pod ścisłą kontrolą, czerpiemy korzyści z wymiany handlowej z europejskimi państwami morskimi w naszym regionie."
 incident_end_open_ports: "Napływ zachodnich idei"
 desc_incident_end_open_ports: "Otworzyliśmy nasze porty nie tylko na zachodni handel, lecz także na zachodnią naukę i idee. Tylko dzięki uważnym studiom możemy przyswoić najlepsze pomysły i włączyć je do własnej kultury, odrzucając gorsze elementy ich społeczeństwa."
 neo_confucian_administration: "Neokonfucjańska administracja"
 desc_neo_confucian_administration: "Rozwój ideologii neokonfucjańskiej wśród uczonych i urzędników naszego państwa doprowadził do rewolucji w wydajności biurokracji. Promując zasługi zamiast pochodzenia, umocniliśmy naszą władzę nad większością prowincji."
 neo_confucianism_middle_road: "Upowszechnianie wiedzy"
 desc_neo_confucianism_middle_road: "Rosnące zainteresowanie ideologią neokonfucjańską doprowadziło do znacznego upowszechnienia wiedzy w naszym państwie. Choć ideały się zmieniają, ogólny wzrost piśmienności i zainteresowania filozofią wywarł trwały wpływ na nasze społeczeństwo."
 traditionalist_administration: "Tradycjonalizm"
 desc_traditionalist_administration: "Zdecydowanie broniliśmy tradycjonalizmu i honoru wobec nadgorliwego stosowania racjonalizmu w administracji i całym społeczeństwie. Zasługi są ważne, lecz bez pradawnych więzi tradycji i lojalności państwo nie może funkcjonować!"
 supported_loyal_retainers: "Wsparcie dla wiernych wasali"
 desc_supported_loyal_retainers: "W obliczu awansu nowych ludzi w administracji postanowiliśmy jasno pokazać, że nadal faworyzujemy stare, lojalne rody, które zawsze nas wspierały."
 shinto_rational_administration: "Merytokracja"
 desc_shinto_rational_administration: "Robimy wszystko, co w naszej mocy, by promować zasługi w biurokracji zamiast przydzielać urzędy na podstawie urodzenia."
 shinto_self_made_men: "Ludzie, którzy sami doszli do władzy"
 desc_shinto_self_made_men: "Wspieramy nowe pokolenie ludzi, którzy własną pracą zdobyli pozycję i zaczęli dochodzić do władzy w naszym państwie."
 shinto_support_for_court: "Wsparcie dla dworu cesarskiego"
 desc_shinto_support_for_court: "Otaczamy opieką instytucje dworu cesarskiego, będącego źródłem wszelkiej niebiańskiej władzy na tych ziemiach."
 nanban_production_investments: "Inwestycje w produkcję"
 desc_nanban_production_investments: "Zachęcamy naszych rzemieślników do nauki wytwarzania egzotycznych towarów, które ludzie Zachodu zaczęli sprzedawać w naszych portach."
 nanban_dependent_on_imports: "Uzależnienie od importu"
 desc_nanban_dependent_on_imports: "Pozostawiliśmy produkcję wielu wyrobów innym, a nasi kupcy zajmują się uzupełnianiem braków."
 rangaku_incident_modifier: "Rangaku"
 desc_rangaku_incident_modifier: "Zachęcamy do studiowania zachodniej wiedzy. Niektórzy obawiają się, że zaszkodzi to spójności naszego społeczeństwa, inni zaś twierdzą, że wiedza, którą możemy zdobyć na Zachodzie, jest tak cenna, iż nie możemy postąpić inaczej."
 perfecting_the_musket: "Doskonalenie muszkietu"
 desc_perfecting_the_musket: "Nasi rusznikarze słyną z wytwarzania broni wysokiej jakości, przewyższającej wyroby większości innych rzemieślników."
 guns_commonplace: "Upowszechnienie broni palnej"
 desc_guns_commonplace: "Broń palna stała się tak powszechna, że nasze armie doskonale opanowały jej użycie. Przeznaczyliśmy znaczne środki na tę nową technologię, nie porzucając przy tym dawnych tradycji."
 traditional_warfare: "Przykład bushidō"
 desc_traditional_warfare: "Dopracowaliśmy tradycyjne i honorowe zasady prowadzenia wojny oraz postępowania wojownika."
 firearm_restrictions: "Ograniczenia dotyczące broni palnej"
 desc_firearm_restrictions: "Dołożyliśmy wszelkich starań, by ograniczyć rozpowszechnianie broni palnej wyłącznie do naszych zawodowych żołnierzy."
 shinto_events.isolation.tt: "Ten wybór sprawi, że będziesz dążył do §Yzamkniętego§! izolacjonizmu z powodu obecnego §Yincydentu§!"
 shinto_events.open.tt: "Ten wybór sprawi, że będziesz dążył do §Yotwardego§! izolacjonizmu z powodu obecnego §Yincydentu§!"
 shinto_events.much.openness.tt: "Ten wybór sprawi, że będziesz szybko dążył do §Yotwardego§! izolacjonizmu z powodu obecnego §Yincydentu§!"
 shinto_events.much.isolation.tt: "Ten wybór sprawi, że będziesz szybko dążył do §Yzamkniętego§! izolacjonizmu z powodu obecnego §Yincydentu§!"
 shinto_events.middle_way.tt: "Ten wybór sprawi, że będziesz dążył do §Ynutralnego§! izolacjonizmu z powodu obecnego §Yincydentu§!"
 sashidashi_modifier: "Przeprowadzony spis ludności i majątku"
 desc_sashidashi_modifier: "Na rozkaz szoguna przeprowadziliśmy spis wszystkich mieszkańców i całego majątku w naszym państwie."
 shinto_local_christian_mission: "Lokalna misja chrześcijańska"
 desc_shinto_local_christian_mission: "Zezwoliliśmy na rozwój wspólnoty chrześcijańskiej w tej prowincji. Napływ nowych mieszkańców i działalność dobroczynna chrześcijan pomogą jej się rozwijać, lecz doprowadzą również do wzrostu napięć religijnych."
 pirate_fighting: "Walka z piractwem"
 pirate_haven: "Piracka przystań"
 christian_ruler: "Chrześcijański władca"
 desc_christian_ruler: "Choć większość mieszkańców naszego kraju wyznaje szintoizm, nasz władca został ochrzczony i wspiera chrześcijaństwo na dworze."
 shinto_christian_decision_title: "Ochrzcić władcę"
 shinto_christian_decision_desc: "Wspólnota chrześcijańska na naszych ziemiach stale rośnie w siłę i niektórzy uważają, że nadszedł czas, by osobiście przyjąć zachodniego Boga. Nawrócenie naszego władcy na chrześcijaństwo może zostać uznane przez część poddanych za obrazę tradycji, lecz może również przynieść znaczne korzyści."
 shinto_kirishitan_realm: "Królestwo kirishitan"
 desc_shinto_kirishitan_realm: "Chrześcijanie stali się powszechnym widokiem w naszym państwie i na dworze. Członkowie rodziny królewskiej często modlą się do chrześcijańskiego Boga, a wielu naszych ministrów wyznaje już chrześcijaństwo. Zintegrowaliśmy tę obcą wiarę z naszymi tradycjami szintoistycznymi, buddyjskimi i konfucjańskimi."
 christianity_defeated: "Pokonane chrześcijaństwo"
 desc_christianity_defeated: "Obroniliśmy rodzime tradycje i powstrzymaliśmy wywrotowe szerzenie się chrześcijańskich idei wśród naszego ludu."
 significant_christian_presence: "Znacząca obecność chrześcijan"
 desc_significant_christian_presence: "Chrześcijaństwo stało się jedną z religii naszego państwa, podobnie jak szintoizm i buddyzm. Choć wspólnoty chrześcijańskie nadal stanowią znaczącą mniejszość, ich obecność ożywiła wymianę idei i myśli filozoficznej w naszym kraju."
 rise_of_the_daimyo: "Wzrost znaczenia daimyō"
 desc_rise_of_the_daimyo: "W obliczu nasilających się prób centralizacji podejmowanych przez szogunat zamanifestowaliśmy własną siłę."
 growing_power_of_the_shogunate: "Rosnąca potęga szogunatu"
 desc_growing_power_of_the_shogunate: "Udało nam się obrać drogę pośrednią między ślepymi lojalistami a otwartymi buntownikami występującymi przeciwko szogunatowi. Zachowując swobodę manewru, zapewnimy sobie pomyślność."
 adherence_to_shogunate: "Lojalność wobec szogunatu"
 desc_adherence_to_shogunate: "Sprostaliśmy rosnącym wymaganiom szogunatu i jesteśmy obecnie uznawani za jednych z najbardziej honorowych daimyō w Japonii."
 shinto_religious_tensions: "Napięcia religijne"
 desc_shinto_religious_tensions: "Pozwalamy chrześcijańskim misjonarzom szerzyć ich wiarę na naszych ziemiach. Wielu ludzi przyjmuje nowe wyznanie, lecz inni zdecydowanie mu się sprzeciwiają."
 shinto_harsh_initial_stance_on_christianity: "Początkowe restrykcje wobec chrześcijaństwa"
 desc_shinto_harsh_initial_stance_on_christianity: "Nasze pierwsze kontakty z chrześcijańskimi misjonarzami nie przebiegły po ich myśli. Znacznie ograniczyliśmy wszelką działalność misyjną chrześcijan w naszym państwie."
 in_defence_of_shintoism: "Surowe podejście do misjonarzy"
 desc_in_defence_of_shintoism: "Nadal słuchamy rad tradycjonalistów, ograniczając możliwość szerzenia wiary przez chrześcijan w naszym państwie i oddając cześć obyczajom przodków."
 shinto_strenghtened_local_traders: "Wzmocnienie miejscowych rzemieślników"
 desc_shinto_strenghtened_local_traders: "Zamiast pozwalać chrześcijańskim towarom i handlarzom zalewać nasze państwo, postanowiliśmy wzmocnić miejscowych kupców oraz współwyznawców."
 cadastral_survey_modifier: "Kataster gruntowy"
 desc_cadastral_survey_modifier: "Pozwoliliśmy naszemu suwerenowi przeprowadzić kataster naszych ziem, zwiększając jego bezpośrednie wpływy w naszym państwie."
 nanban_port: "Port nanban"
 desc_nanban_port: "Port ten jest ośrodkiem handlu z europejskimi statkami."
 nanban_trade_restrictions: "Ograniczenia handlu nanban"
 desc_nanban_trade_restrictions: "Nałożyliśmy szereg surowych ograniczeń na handel z Zachodem."
 shinto_converted_to_christianity: "Chrześcijańska Japonia"
 desc_shinto_converted_to_christianity: "Zmieniliśmy religię państwową Japonii na chrześcijaństwo i zyskaliśmy poparcie licznych chrześcijańskich mniejszości zamieszkujących kraj."
 shinto_converted_to_mahayana: "Buddyjska Japonia"
 desc_shinto_converted_to_mahayana: "Oficjalną religią państwową Japonii jest teraz buddyzm Czystej Krainy. Włączyliśmy wspólnoty Ikko-Ikki do naszego rządu w możliwie największym stopniu. Buddyjskie mniejszości w całej Japonii pomagają nam przemienić kraj w ziemię ich marzeń."
 shinto_incident_wokou_start.tt: "To rozpocznie incydent §YWoko§!"
 shinto_incident_urbanisation.tt: "To rozpocznie incydent §Yurbanizacji§!"
 shinto_incident_ikko.tt: "To rozpocznie incydent §YIkko-Ikki§!"
 shinto_incident_confucianism.tt: "To rozpocznie incydent §Yneokonfucjanizmu§!"
 shinto_incident_nanban.tt: "To rozpocznie incydent §YNanban§!"
 shinto_incident_tanegashima.tt: "To rozpocznie incydent §Yrozprzestrzenianie broni palnej§!"
 shinto_incident_kirishitan.tt: "To rozpocznie incydent §Ychrześcijanizacji§!"
 shinto_incident_shogunate_authority.tt: "To rozpocznie incydent §Ywładzy Szogunatu§!"
 shinto_events.1.t: "Piraci Woko i handel Bahanami"
 shinto_events.1.d: "W czasach niepewności rybacy i marynarze z tych ziem często uciekali się do piractwa i napadów na wybrzeża naszych sąsiadów. Ostatnia fala naruszeń zakończyła się traktatem Kakitsu, w którym niektórzy Daimyo uzyskali prawo do wysyłania regulowanej liczby ekspedycji handlowych do obcych portów.\nCzasy i równowaga sił są jednak podatne na zmiany, a 'handel Bahanami' ponownie stał się coraz bardziej powszechnym zajęciem wśród naszych poddanych. Niektórzy lordowie sami zaczęli finansować lub aktywnie uczestniczyć w najazdach. W międzyczasie ofiary piratów 'Woko' zaczęły oferować tytuły i zaszczyty tym, którzy pomagają powstrzymać zagrożenie."
 shinto_events.1.a: "Musimy sami kontrolować handel Bahanami!"
 shinto_events.1.b: "Musimy powstrzymać tych piratów!"
 shinto_events.2.t: "Odpowiedź dla Woko"
 shinto_events.2.d: "Częstotliwość piractwa i najazdów wciąż rośnie. Uczestniczą w nich zarówno zwykli rybacy i pomniejsi lordowie, jak i osoby mieszkające na wybrzeżach nękanych przez obcych. Z czasem potężne interesy, zarówno w kraju, jak i za granicą, zaczęły patronować odnoszącym sukcesy wodzom piratów i wygląda na to, że pirackie twierdze zaśmiecają teraz nasze wyspy i wybrzeża.\nTeraz sąsiednie państwa zaczęły podejmować znacznie ostrzejsze działania. Przygotowują się na przybycie najeźdźców i aktywnie polują na przywódców piratów. Nasz[Root.Monarch.GetANoun] [Root.Monarch.GetTitle] otrzymał[Root.Monarch.GetANoun] wyraźne groźby od zagranicznych wysłanników, że jeśli nie podejmiemy zdecydowanych działań, uznają nasze statki za wrogów i założą, że należą do piratów."
 shinto_events.2.a: "Powinniśmy szukać finansowania u zagranicznych inwestorów."
 shinto_events.2.b: "Możemy przymknąć na to oko."
 shinto_events.2.b.tt: "Wszystkie państwa w zasięgu marynarki wojennej otrzymują §R-50§! opinii z państwem §Y[Root.GetName]§!."
 shinto_events.2.c: "Pomóżmy chronić inne kraje."
 shinto_events.2.c.tt: "Wszystkie państwa w zasięgu marynarki wojennej otrzymują §G+50§! opinii z państwem §Y[Root.GetName]§!."
 shinto_events.3.t: "Twierdza piratów w prowincji [save_wokou_target.GetName]"
 shinto_events.3.d: "Lordowie w prowincji [save_wokou_target.GetName] stali się znani jako nieustraszeni korsarze, a lojalność i bogactwo, jakimi dysponują, zapewniły im ogromne wpływy i władzę. Na wyspie położonej tuż przy wybrzeżu pewien wyjątkowo skuteczny przywódca piratów zbudował twierdzę utrzymywaną wyłącznie z jego wypraw. Zdobycie takiej fortecy prawdopodobnie wiązałoby się z wysokimi kosztami, ale ośmiesza on nasze ambicje morskie."
 shinto_events.3.a: "Co nas obchodzi, że żyje z bogactwa obcokrajowców?"
 shinto_events.3.b: "Być może mógłby zostać sługą naszego państwa..."
 shinto_events.3.c: "Musimy wyrwać te chwasty rozkładu z naszego ogrodu!"
 shinto_events.4.t: "Kaizokushu przekształciło się w Suigun"
 shinto_events.4.d: "Z czasem udało nam się przekształcić Woko z bezprawnej i rozproszonej grupy piratów w marynarkę wojenną pod naszym dowództwem. Przywódcy zostali zmuszeni do służenia dla nasz[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen] i otrzymali wpływy i władzę w naszym państwie. Załogi i statki pod naszym dowództwem są teraz profesjonalną i doświadczoną siłą, zdolną do napadów, toczenia bitew na morzu, a nawet przeprowadzania inwazji na małą skalę na obce terytorium.\nOd spokojnych miast [saved_neighbor.GetAdjective] po nawiedzone porty prowincji [save_wokou_target.GetName], nasza marynarka jest szanowana i budzi strach."
 shinto_events.4.a: "Zmieniliśmy piratów w marynarzy."
 shinto_events.5.t: "Koniec Woko"
 shinto_events.5.d: "Wielu kwestionowało nasz zapał w walce z plagą mórz i wybrzeży. Niektórzy twierdzą nawet, że piractwo i grabieże są czymś naturalnym dla wszystkich rybaków i że powinniśmy przymknąć oko na te nikczemne praktyki.\nZ czasem jednak nasi sąsiedzi nauczyli się pilnować swoich wybrzeży i tropić tych, którzy naruszają pokój. Częstotliwość najazdów Woko znacznie spadła od czasu nagłego wzrostu kilka lat temu, pozostawiając niewielki wpływ na ludność [Root.GetAdjective]."
 shinto_events.5.a: "Porządek został przywrócony."
 shinto_events.6.t: "Strzeżone wybrzeża"
 shinto_events.6.d: "Nasze zdecydowane działania mające na celu opanowanie niedoszłych piratów, rabusiów i przemytników wśród mieszkańców wybrzeża doprowadziły do gruntownej przemiany polityki morskiej. Na mocy dekretu [Root.Monarch.GetTitle] wszystkim rybakom zakazano posiadania broni, a statki są regularnie przeszukiwane. Wprowadziliśmy surowe zasady i przepisy dla wszystkich podróżujących po morzach, a nowa straż przybrzeżna pozwala nam zamknąć dostęp do naszych wód. Dawne ofiary nadmorskich napadów są zachwycone i w podzięce obsypały nas zaszczytami oraz nagrodami za pomoc w przywróceniu pokoju."
 shinto_events.6.a: "Porządek został przywrócony."
 shinto_events.7.t: "Jōkamachi"
 shinto_events.7.d: "W coraz bardziej niebezpiecznym świecie zamek zapewnia zarówno ochronę, jak i zatrudnienie. Od lat samurajowie porzucają wiejskie domostwa i przenoszą się wraz z kupcami oraz rzemieślnikami do miast rozrastających się pod murami zamków swoich panów. Nasza stolica, [Root.Capital.GetCapitalName], nie jest wyjątkiem, a jej rozwój niepokoi naszych urzędników.\nAby ograniczyć problemy takie jak pożary i choroby, prawdopodobnie będziemy musieli przeznaczyć nowe środki na poprawę infrastruktury."
 shinto_events.7.a: "Zapewnimy im wszystko, czego potrzebują."
 shinto_events.7.b: "Ograniczmy możliwość osiedlania się w [Root.Capital.GetCapitalName]."
 shinto_events.8.t: "Chłopi migrują do [Root.Capital.GetCapitalName]"
 shinto_events.8.d: "Wraz ze wzrostem liczby ludności na wsi powierzchnia gospodarstw przypadających na każdego rolnika zmniejsza się z każdym podziałem spadkowym. Choć plony rosną, niektórzy chłopi nadal nie są w stanie utrzymać się ze swojej ziemi. Wielu z nich przeniosło się do miasta, pogłębiając problemy związane z gwałtownym rozwojem [Root.Capital.GetCapitalName].\nWłaściciele ziemscy skarżą się na tę sytuację i domagają się przywrócenia większego porządku społecznego. Zdecydowanie sugerują wprowadzenie praw ograniczających przemieszczanie się ludności w granicach naszego państwa."
 shinto_events.8.a: "Zakażmy ludziom przemieszczania się bez zezwolenia."
 shinto_events.8.b: "Nie możemy powstrzymać rozwoju miast."
 shinto_events.9.t: "Monopole handlowe"
 shinto_events.9.d: "Rozwój miast doprowadził do gwałtownego wzrostu potęgi dawnych gildii handlowych Za. Ogólny chaos panujący w naszym państwie sprawił również, że gildie coraz częściej same organizują sobie ochronę. Zdołały już przeciągnąć na swoją stronę świątynie, właścicieli ziemskich i samurajów, lecz zyskały także wrogów.\nNiektórzy apelują do naszego [Root.Monarch.GetTitle], by wystąpił przeciwko gildiom i otworzył gospodarkę dla wszystkich zdolnych ludzi. Inni twierdzą, że powinniśmy przynajmniej przyznać monopole i przywileje również podmiotom spoza gildii."
 shinto_events.9.a: "Zniesiemy dawne przepisy, które zapewniają im przywileje!"
 shinto_events.9.b: "Monopole dobrze funkcjonują, lecz nie powinniśmy przyznawać ich na podstawie tradycji."
 shinto_events.9.c: "Musimy chronić porządek ustanowiony przez naszych przodków."
 shinto_events.10.t: "Stabilność społeczna"
 shinto_events.10.d: "Aby przeciwdziałać zagrożeniu dla porządku, jakie niesie ze sobą gwałtowna urbanizacja naszego społeczeństwa, wprowadziliśmy szereg surowych praw. Przepisy te ograniczają nieuzasadnioną mobilność społeczną, a nawet fizyczne przemieszczanie się ludności. W ten sposób udało nam się zachować honor i stabilność, które przez lata spajały nasze społeczeństwo."
 shinto_events.10.a: "Porządek został przywrócony."
 shinto_events.11.t: "Rozwój miejskich warstw społecznych"
 shinto_events.11.d: "Nasze państwo przeszło okres gwałtownej urbanizacji, zachowując przy tym względną stabilność. Miasta takie jak [Root.Capital.GetCapitalName] rozrosły się i są dziś znacznie większe niż dawniej. Coraz większa część ludności utrzymuje się z handlu, rzemiosła, a nawet służby wojskowej, zamiast pracować na roli."
 shinto_events.11.a: "Przed nami czas dobrobytu."
 shinto_events.12.t: "Mobilność społeczna"
 shinto_events.12.d: "Wzrost liczby ludności i gwałtowna urbanizacja przyniosły naszemu państwu znaczną mobilność społeczną. Zachęcaliśmy do tych przemian, by stworzyć dynamiczne, choć być może niestabilne społeczeństwo. Patrząc w przyszłość, widzimy państwo odmienione — w ciągu zaledwie kilku pokoleń najpowszechniejszym zajęciem stała się praca w administracji, handlu lub wojsku, a nie na roli."
 shinto_events.12.a: "Czasy się zmieniają."
 shinto_events.13.t: "Buddyzm Czystej Krainy"
 shinto_events.13.d: "W tych niespokojnych czasach coraz więcej ludzi zwraca się ku religii, szukając wskazówek i bezpieczeństwa. Buddyzm od dawna współistnieje z szintoizmem, lecz ostatnio liczba jego wyznawców szybko rośnie, a kolejne tradycje buddyjskie przenikają do codziennego życia ludu [Root.GetAdjective].\nObietnica zbawienia i awansu społecznego, którą niosą ze sobą buddyści Czystej Krainy, przyciąga bardzo wielu ludzi. W całym naszym państwie powstają nowe świątynie, finansowane zarówno przez bogatych, jak i biednych."
 shinto_events.13.a: "Ten zapał jest inspirujący! Obejmijmy te świątynie patronatem."
 shinto_events.13.b: "Trudno sprzeciwiać się głębokiej wierze wyznawców."
 shinto_events.13.c: "Ograniczmy wszystko, co wzmacnia pozycję ubogich."
 shinto_events.14.t: "Jinaimachi"
 shinto_events.14.d: "Wspólnoty wiernych Ikko-Ikki zaczęły przekształcać się w niewielkie miasta wokół najważniejszych świątyń buddyjskich w naszym państwie. Ośrodki te mają nie tylko wpływy duchowe, lecz także własne siły zbrojne, złożone zarówno z samurajów niższych rangą właścicieli ziemskich, jak i uzbrojonych chłopów oraz mnichów. Wspólnoty Ikko-Ikki stanowią równoległy ośrodek władzy, konkurujący nie tylko z szogunatem, ale również z każdym daimyō kontrolującym okoliczne ziemie.\nJedna z takich wspólnot powstała wokół świątyni w [ikko_province.GetName]. Możemy skorzystać z jej poparcia, lecz to niebezpieczne połączenie żarliwości religijnej, broni i autonomii zagraża władzy daimyō."
 shinto_events.14.a: "Musimy zniszczyć te gniazda os."
 shinto_events.14.b: "Postarajmy się współpracować z tymi armiami wiernych."
 shinto_events.14.c: "Zezwólmy na budowę kolejnych miast świątynnych."
 shinto_events.15.t: "Napięcia społeczne"
 shinto_events.15.d: "Ikko-Ikki w naszym państwie stają się coraz silniejsi, liczniejsi, a przede wszystkim coraz zuchwalsi. Nasi urzędnicy donoszą, że niekiedy poborca podatkowy Ikko-Ikki zdążył już zebrać należności, zanim sami dotarliśmy do wioski, a kupcy nie czują się bezpiecznie, przejeżdżając przez te wspólnoty. Ikko-Ikki osiągnęli tak wielką siłę, że wielu zaczyna kwestionować ich przywileje."
 shinto_events.15.b: "Nie mogą rozszerzać swoich wpływów poza obecne granice."
 shinto_events.15.c: "To po prostu ich prawo."
 shinto_events.15.a: "Nadszedł czas, by zmiażdżyć tych chłopów!"
 shinto_events.16.t: "Koniec samorządności religijnej"
 shinto_events.16.d: "Wreszcie udało nam się poskromić Ikko-Ikki i podporządkowane im miasta. Chłopów rozbrojono, a nasi przedstawiciele są teraz jedynymi osobami uprawnionymi do pobierania ceł i podatków oraz organizowania obrony przed obcymi."
 shinto_events.16.a: "Porządek został przywrócony."
 shinto_events.17.t: "Równoległy ośrodek władzy"
 shinto_events.17.d: "Wydaje się, że wspólnoty Ikko pozostaną z nami na stałe. Choć staraliśmy się zabezpieczyć własną władzę, przyznaliśmy Jinaimachi znaczne prawa i przywileje. Wszystko wskazuje na to, że nadal będą odgrywać istotną rolę w naszym społeczeństwie."
 shinto_events.17.a: "Amitabha."
 shinto_events.18.t: "Poparcie Ikko-Ikki"
 shinto_events.18.d: "Nieustannie wspieraliśmy rozwój wspólnot świątynnych i w rezultacie zaczęto utożsamiać nas z Ikko-Ikki. Przywódcy buddyjskich wspólnot świątynnych mają znaczny wpływ na nasze społeczeństwo, lecz są również gorliwymi zwolennikami naszego [Root.Monarch.GetTitle]."
 shinto_events.18.a: "Amitabha."
 shinto_events.19.t: "Moralne wskazówki w czasach zamętu"
 shinto_events.19.d: "Wielu najważniejszych daimyō w Japonii albo zdobyło pozycję własnymi siłami, albo polega na lojalności ludzi, którzy tego dokonali. Nasze dawne kodeksy moralne podkreślają jednak znaczenie pochodzenia, lojalności i porządku społecznego opartego na dworze cesarskim. Konfucjańscy uczeni badają obecnie nauki Zhu Xi, szukając wskazówek dotyczących rządzenia naszym krajem.\nTo nowe zainteresowanie neokonfucjanizmem kładzie nacisk na Cztery Księgi zamiast archaicznych klasyków i próbuje stworzyć racjonalny kodeks moralny zarówno dla lokalnych władców, jak i zwykłych ludzi."
 shinto_events.19.a: "Otoczmy opieką instytucje dworu cesarskiego."
 shinto_events.19.b: "Powinniśmy przyciągnąć myślicieli reprezentujących ten nowy nurt filozofii moralnej."
 shinto_events.20.t: "Pochodzenie i przywileje"
 shinto_events.20.d: "Rozpowszechnianie ideałów neokonfucjańskich w naszym społeczeństwie sprawiło, że ludzie niskiego pochodzenia zaczęli zdobywać wpływy intelektualne. Jeden z najwybitniejszych uczonych naszych czasów jest synem ronina i wraz z innymi konfucjańskimi uczonymi pragnie upowszechniać wiedzę poprzez publiczne wykłady oraz książki napisane prostym językiem.\nPod wieloma względami stanowi to wyzwanie dla dawnego porządku społecznego, w którym dostęp do nauki był przywilejem zarezerwowanym dla rodów o odpowiednim pochodzeniu."
 shinto_events.20.a: "Musimy poprzeć tę inicjatywę."
 shinto_events.20.b: "Nie możemy pozwolić, by w ten sposób zagrożono porządkowi społecznemu!"
 shinto_events.21.t: "Merytokracja"
 shinto_events.21.d: "Od najmłodszych lat [Root.Monarch.GetName] studiuje teksty konfucjańskie i słucha wykładów neokonfucjańskich. Jako [Root.Monarch.GetTitle] państwa [Root.GetName] [Root.Monarch.GetSheHe] może teraz wprowadzić w życie wiele z tych filozoficznych zasad. Jednym z ambitnych przedsięwzięć byłoby usunięcie z wpływowych stanowisk osób niekompetentnych, które zawdzięczają swoją pozycję wyłącznie pochodzeniu i dawnym więzom lojalności łączącym nasze rody.\nOczywiście nasi wierni wasale prawdopodobnie uznaliby to za przejaw niewdzięczności i nieuzasadnionej wrogości."
 shinto_events.21.a: "Zasługi powinny być najważniejszą zasadą."
 shinto_events.21.b: "Musimy wspierać tych, którzy są nam lojalni."
 shinto_events.22.t: "Neokonfucjańska administracja"
 shinto_events.22.d: "Poszukiwaliśmy nowej filozofii władzy w naukach Zhu Xi i chińskich tradycjach neokonfucjanizmu. Ideały te okazały się być solidnym fundamentem nie tylko dla naszej biurokracji, ale także dla całego społeczeństwa. Racjonalne myślenie, bardziej rozpowszechniona umiejętność czytania i pisania oraz przedkładanie zasług nad urodzeniem pozwoliły mieszkańcom [Root.GetAdjective] zbudować silniejsze państwo w erze przewrotu."
 shinto_events.22.a: "Rozumiem."
 shinto_events.23.t: ""
 shinto_events.23.d: ""
 shinto_events.23.a: "Rozumiem."
 shinto_events.24.t: ""
 shinto_events.24.d: ""
 shinto_events.24.a: "Rozumiem."
 shinto_events.25.t: "Przybycie europejskich kupców"
 shinto_events.25.d: "Wraz z przybyciem statków z zachodu obserwujemy napływ bardzo poszukiwanych towarów, nie tylko z Europy, ale także z różnych zakątków Azji, które odwiedzają zachodni kupcy. Wielkie statki stają się coraz częstszym widokiem wzdłuż naszych wybrzeży, a dla Daimyo, którzy je witają, obiecują wielkie bogactwa.\nKapitan takiego statku przybył niedawno do miasta [nanban_traders_here.GetName], prosząc o pozwolenie na okresowe dokowanie w pobliskim porcie w celu sprzedaży zachodnich towarów."
 shinto_events.25.a: "Zachęć ich do uczynienia z tego miasta stałego przystanku."
 shinto_events.25.b: "Wprowadźmy surowe zasady dotyczące tego, z kim mogą się spotykać lub prowadzić interesy."
 shinto_events.25.c: "Przyjmiemy ich towary, ale nie oferujemy żadnych gwarancji na przyszłość."
 shinto_events.26.t: "Nieufność wśród europejskich kupców"
 shinto_events.26.d: "Od czasu przybycia przybyszów z Zachodu niektórzy traktują ich z nieufnością. Ich kieszenie są głębokie, ich broń potężna, a dla niektórych ich kultura wydaje się fascynująca. Ci, którzy mają do czynienia z tymi kupcami, donoszą jednak, że Europejczycy nieustannie knują przeciwko sobie. Rzadko zdarza się spotkanie z zagranicznymi emisariuszami, podczas którego nie ostrzegają nas o jakimś spisku lub planie ich przeciwników. To jasne, że nie mamy do czynienia z ludźmi honoru.\nGdy nowa grupa kupców prosi nas o zwiększenie ich przywilejów, nasi doradcy ostrzegają nas, byśmy dokładnie rozważyli tę ofertę."
 shinto_events.26.a: "Pozwolimy im zwiększyć swoją obecność."
 shinto_events.26.b: "Ograniczmy ich wpływy do kilku portów."
 shinto_events.26.c: "Ich działalność musi być ograniczona do miasta [nanban_traders_here.GetCapitalName]."
 shinto_events.27.t: "Rangaku"
 shinto_events.27.d: "Placówka handlowa w mieście [nanban_traders_here.GetName] zaczęła przyciągać nie tylko kupców, ale także uczonych i intelektualistów. Dla tych ludzi książki przywiezione przez obcokrajowców są o wiele cenniejsze niż towary, które chcą sprzedać. Studiowanie zachodniej nauki i kultury, Rangaku, wyrasta na własną dyscyplinę i według zwolenników mamy wiele do nauczenia się. Wielu duchownych jest jednak sceptycznych, podobnie jak niektórzy uczeni konfucjańscy."
 shinto_events.27.a: "Musimy dołożyć wszelkich starań, aby zachęcać do rozpowszechniania zachodniej nauki."
 shinto_events.27.b: "Ich działalność musi być ograniczona do miasta [nanban_traders_here.GetCapitalName]."
 shinto_events.28.t: "Wpływ zagraniczny"
 shinto_events.28.d: "Niektórzy twierdzą, że zbytnio uzależniamy się od zagranicznych kupców. Nasi rzemieślnicy są z pewnością nie mniej utalentowani niż ci za granicą i zamiast wydawać fortunę na import towarów ze świata zewnętrznego, moglibyśmy produkować wiele z nich. Moglibyśmy wtedy sami czerpać zyski z ich odsprzedaży.\nNie nadszedł jeszcze czas na całkowite zaprzestanie handlu, ale jeśli zatrudnimy naszych najlepszych rzemieślników, z czasem nie będziemy już musieli z takim niepokojem oczekiwać na przybycie kolejnego statku handlowego."
 shinto_events.28.a: "Doskonała inwestycja!"
 shinto_events.28.b: "Nie ma potrzeby produkcji tego, co inni robią lepiej."
 shinto_events.29.t: "Kaikoku?"
 shinto_events.29.d: "Spotkanie z zachodem było dość burzliwe, szczególnie dla [Root.GetAdjective]! Nasze wysiłki, by powitać zachodnich kupców, przyniosły nam niezrównany wgląd w europejską kulturę i dobry dostęp do ich towarów. Przedsiębiorczy kokujinowie i inni wpływowi ludzie zaczęli wysyłać swoich synów do Europy, by studiowali zachodnich przybyszów z pierwszej ręki, starając się odkryć jak najwięcej rzeczy, które moglibyśmy wykorzystać u siebie."
 shinto_events.29.a: "Rozumiem."
 shinto_events.30.t: "Handel z zachodem"
 shinto_events.30.d: "Z biegiem czasu zyski z handlu z zachodem spadły z początkowego wysokiego poziomu, ale napływ towarów i pomysłów od tych odległych podróżników wciąż zmienia nasze społeczeństwo. Tylko czas pokaże, w jakim stopniu przyswoimy sobie ideały tych odległych podróżników."
 shinto_events.30.a: "Rozumiem."
 shinto_events.31.t: "Sakoku?"
 shinto_events.31.d: "Podjęliśmy zdecydowane działania, aby ograniczyć wpływ zachodnich handlarzy na nasze społeczeństwo. Chociaż próba całkowitego odcięcia wszystkich kontaktów prawdopodobnie doprowadziłaby do przemytu, ograniczyliśmy kupców do jednego portu i ściśle regulujemy ich interakcje ze światem poza tym punktem kontaktowym. W ten sposób możemy korzystać z dóbr (i broni), które chcemy nabyć, jednocześnie ograniczając ryzyko wywrotowych prób religijnych lub spisków."
 shinto_events.31.a: "Rozumiem."
 shinto_events.32.t: "Broń palna"
 shinto_events.32.d: "Wraz z przybyciem zachodnich kupców do naszego królestwa dotarła pierwsza przenośna broń palna. Broń ta nie jest podobna do tej używanej tutaj i może zrewolucjonizować działania wojenne, jeśli stanie się powszechna. Zdobycie wystarczającej jej ilości nie jest jednak tak proste, jak mogłoby się wydawać. Muszkiety cieszą się dużym popytem wśród tych, którzy widzieli ich moc, ale perspektywa tego, co mogą zrobić w rękach naszych wrogów, a nawet niesfornej społeczności chłopskiej, jest również dość niepokojąca.\nGdy zaczniemy produkować i instruować naszych żołnierzy w zakresie korzystania z tej broni, będziemy musieli zdecydować, kto będzie miał do niej dostęp i ile jej wyprodukujemy."
 shinto_events.32.a: "Siła w liczbach! Wyprodukujmy jak najwięcej."
 shinto_events.32.b: "Przygotujemy wystarczającą ilość dla niewielkiego oddziału zaufanych ludzi."
