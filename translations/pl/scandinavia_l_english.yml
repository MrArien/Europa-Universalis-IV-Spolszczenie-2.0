 flavor_pol.27.t: "Rozbudowa wojska kwarcianego"
 flavor_pol.27.d: "Zręby regularnej armii powstały w Polsce na przełomie XV i XVI wieku, w celu ochrony południowo-wschodnich kresów przed najazdami tatarskimi. System ten został rozbudowany w 1563 r., kiedy to Zygmunt II August złamał umowę z sejmem o finansowaniu go z jednej czwartej wszystkich dochodów zebranych w królewszczyznach, skąd wzięła się jego nazwa - wojsko kwarciane. Teraz, aby zabezpieczyć nasz naród, chronić nasze interesy oraz utrzymać nasz wzrost i dobrobyt, musimy iść z duchem czasu i korzystać z wszelkich przydatnych osiągnięć technologicznych, zwłaszcza w dziedzinie wojskowości i prowadzenia działań wojennych. Nasz wybór w tej kwestii z pewnością odbije się echem w komnatach historii."
 flavor_pol.27.a: "Generalna reforma dobrze pasowałaby do naszej armii!"
 flavor_pol.27.b: "Zreformować kawalerię husarską!"
 flavor_pol.27.c: ""
 flavor_pol.27.dee: ""
 flavor_pol.28.t: ""
 flavor_pol.28.d: ""
 flavor_pol.28.a: ""
 flavor_pol.29.t: "Zabezpieczanie mołdawskiej domeny"
 flavor_pol.29.d: "Sytuacja w Mołdawii stała się tragiczna. Nasz książęcy sąsiad na południu wypadł ostatnio z łask opinii publicznej. Rzeczywiście, państwo to było ostatnio uwikłane w okrutną i krwawą wojnę domową. Ale z chaosu rodzi się porządek, a my musimy być lepsi od naszych mołdawskich poprzedników, jeśli chodzi o rujnowanie kraju. Dlatego należy się przygotować oraz podjąć decyzję, aby zabezpieczyć nasze interesy i kontrolę nad regionem."
 flavor_pol.29.a: "Niech Stefan zasiądzie na tronie, będzie nam dobrze służył!"
 flavor_pol.29.b: "Nie możemy ryzykować wtrącania się w lokalne waśnie..."
 flavor_pol.29.c: "Będą podlegać tylko mnie!"
 flavor_pol.30.t: "Korona Rzymu"
 flavor_pol.30.d: "Wspaniałe miasto [151.GetName] jest w naszych rękach! Niegdyś wspaniała stolica Bizancjum, została podbita przez tureckie armie Sułtanatu Osmańskiego i usunięta z powierzchni Ziemi.\nAle dziś miasto jest wolne od szponów Osmanów! Podczas gdy większość obywateli [Root.GetAdjective] świętuje nasz podbój miasta, dwór [Root.GetAdjective] jest zaniepokojony zarządzeniem miastem [151.GetName]. Podczas gdy zachowanie miasta dla siebie byłoby prestiżowe, doradcy [Root.Monarch.GetRulerGen] sugerują przywrócenie państwa Bizancjum lub wielkiego Imperium Łacińskiego."
 flavor_pol.30.a: "Przywróć §YFeniksa§! do dawnej świetności."
 flavor_pol.30.b: "§YImperium Łacińskie§! odrodzi się na nowo!"
 flavor_pol.30.c: "[151.GetName] należy do nas!"
