 hsa_maritime_hegemon_modifier: "Hegemon morski"
 desc_hsa_maritime_hegemon_modifier: "Staliśmy się niekwestionowanymi władcami mórz. Niech żyje Hanza! Hanza panuje nad falami!"
 flavor_hsa.5.t: "Kantor nowogrodzki"
 flavor_hsa.5.d: "Nowogród był niegdyś ważnym partnerem Związku Hanzeatyckiego, choć sam nie należał do ligi, ponieważ miał dostęp do ogromnych ilości wysokiej jakości futer. Nasz kantor w tym państwie był więc kluczowym źródłem bogactwa związku. Ostatnie zmiany w sytuacji dyplomatycznej i geograficznej pozwoliły naszym kupcom odzyskać dawno utracone placówki w Wielkim Nowogrodzie!"
 flavor_hsa.5.a: "Historyczny dzień dla mieszkańców Lubeki!"
 flavor_hsa.6.t: "Targ śledziowy w Lubece"
 flavor_hsa.6.d: "Obecność ogromnych ławic śledzi w okolicach półwyspu Falsterbo jest legendarna. Od wieków nasi ludzie opowiadali o ich niezwykłej obfitości, a rybacy dostarczali mieszkańcom cenne i świeże towary. Tak wielka ilość łatwo dostępnych ryb zaopatrywała targowiska w Skanii i okolicach, przynosząc ogromne bogactwo wszystkim kupcom zajmującym się handlem śledziami.\n\nWejście na ten rynek i konkurowanie ze Skanią mogłoby okazać się bardzo dochodowe. Mimo obfitości życia morskiego w cieśninie wielu doradców na naszym dworze sugeruje jednak, byśmy pozostali wierni naszemu głównemu towarowi eksportowemu — lubeckiemu zaopatrzeniu morskiemu."
 flavor_hsa.6.a: "Podejmijmy konkurencję z naszymi sąsiadami!"
 flavor_hsa.6.b: "Nigdy nie moglibyśmy porzucić naszych tradycji..."
 flavor_hsa.6.c: "Opracujmy nowatorskie metody konserwacji, by wyprzedzić konkurencję!"
 flavor_hsa.7.t: "Doki i nabrzeża Bryggen"
 flavor_hsa.7.d: "Związek Hanzeatycki jest obecny w Norwegii od stuleci, odkąd rozpoczął działalność w kantorze w Bryggen. Szybko stał się on niezwykle ważnym ośrodkiem handlowym, dominującym w handlu wzdłuż norweskiego wybrzeża. Z czasem jednak wpływy ligi w mieście osłabły, a jej kantory i magazyny przejęli miejscowi kupcy.\n\nOkoło roku [GetYear] w mieście ponownie otwarto kantor Związku Hanzeatyckiego. Gdy obszar ten odzyskał dawne znaczenie jako ośrodek handlowy ligi, infrastruktura portowa — w tym nabrzeża i magazyny — rozkwitła i została znacznie rozbudowana, aby obsłużyć napływ nowych kupców."
 flavor_hsa.7.a: "Przedsiębiorczość i współpraca w najlepszym wydaniu!"
 flavor_hsa.8.t: ""
 flavor_hsa.8.d: "Naturalny port Visby od dawna jest ważnym ośrodkiem handlowym na Bałtyku. Miejscowi kupcy bez trudu współpracowali z zagranicznymi partnerami, a miasto stało się portem łączącym zimne, rosyjskie pustkowia z kupcami z zachodniej Europy. Jednocześnie miasto może poszczycić się imponującym systemem fortyfikacji, co dodatkowo umacnia jego reputację jako bezpiecznego i godnego zaufania ośrodka handlowego."
 flavor_hsa.8.a: ""
 flavor_hsa.9.t: ""
 flavor_hsa.9.d: "Konfederacja Gdańska powstała 21 lutego 1440 roku w Kwidzynie z inicjatywy grupy szlachty i duchowieństwa z kilku miast Prus, w opozycji do regulacji handlowych narzuconych przez zakon krzyżacki. Szybko stała się ważnym uczestnikiem wewnętrznej polityki regionu. Ostatecznie zwróciła się o ochronę do króla Polski, gdy ten chwycił za broń przeciwko Krzyżakom.\n\nMimo konfliktów między wspomnianymi stronami Gdańsk znajduje się obecnie w naszej strefie wpływów. W rezultacie kupcy miejscy i członkowie konfederacji przybyli na nasz dwór w Lubece, aby negocjować i prosić o dostęp do naszych zamożnych rynków."
 flavor_hsa.9.a: ""
 flavor_hsa.9.b: ""
 flavor_hsa.10.t: ""
 flavor_hsa.10.d: "Ze względu na korzystne położenie geograficzne Lubeki zdecydowana większość corocznych spotkań kupieckich członków Związku Hanzeatyckiego odbywa się właśnie w tym mieście. Jesteśmy zatem prezydentem Hanzy i możemy wyznaczać kierunek działań całego związku. Nowy ratusz, wzniesiony w roku [GetYear], będzie centralnym miejscem zgromadzeń i obrad w sprawach ligi. Jego imponująca architektura i przepych będą świadectwem zarówno znaczenia naszego miasta, jak i bogactwa całego Związku Hanzeatyckiego."
 flavor_hsa.10.a: ""
 flavor_hsa.11.t: ""
 flavor_hsa.11.d: ""
 flavor_hsa.11.a: ""
 flavor_hsa.12.t: ""
 flavor_hsa.12.d: "Merkantylizm był teorią i praktyką gospodarczą rozpowszechnioną w Europie od XVI do XVIII wieku. Kładł nacisk na gromadzenie bogactwa poprzez korzystny bilans handlowy, przede wszystkim dzięki eksportowi. Rządy aktywnie wspierały wywóz towarów i zniechęcały do ich importu za pomocą różnych środków, takich jak cła i subsydia. Celem było zwiększenie bogactwa i potęgi państwa poprzez gromadzenie złota i srebra oraz budowę silnego przemysłu krajowego przy jednoczesnym eliminowaniu zagranicznej konkurencji."
 flavor_hsa.12.a: ""
 flavor_hsa.13.t: ""
 flavor_hsa.13.d: ""
 flavor_hsa.13.a: ""
 flavor_hsa.14.t: ""
 flavor_hsa.14.d: "Adler von Lübeck, największy okręt, jaki kiedykolwiek widziała nasza flota, stanie się dumą naszej marynarki wojennej. Nawet nasi najpotężniejsi i najbardziej doświadczeni morsko przeciwnicy zadrżą na widok jego rozmiarów i siły ognia, gdy majestatycznie wypłynie na morze!\n\nPotęga morska, jaką demonstruje Adler, z pewnością wzbudzi zazdrość naszych rywali. Ochrona jego renomy i aury niezwyciężoności sprawi, że nasz naród nadal będzie czerpał korzyści z jego chwalebnego imienia."
 flavor_hsa.14.a: ""
 flavor_hsa.16.t: "Przywileje handlowe Hanzy"
 flavor_hsa.16.d: "Miasto Gdańsk, leżące obecnie w naszym państwie, było niegdyś centrum handlu w ramach niegdyś potężnej Ligi Hanzeatyckiej z siedzibą w Lubece. Od tamtego czasu Liga wypadła z łask z powodu wielu czynników, a jej potęga na Bałtyku i poza nim została zakwestionowana. Pomimo tych niedociągnięć, ostatnie wydarzenia wokół brzegów Niemiec i Bałtyku doprowadziły do odzyskania pozycji przez Ligę. Po raz kolejny potężni kupcy Hanzy przybywają do Gdańska z lukratywną ofertą..."
 flavor_hsa.16.a: "Zaoferuj im lukratywną ofertę!"
 flavor_hsa.16.b: "Zapomnij o tym!"
 flavor_hsa.17.t: "Królewska oferta dla Gdańska"
 flavor_hsa.17.d: "Polski dwór zwrócił się do naszych kupców z lukratywną ofertą. Biorąc pod uwagę ekspansywną naturę naszego handlu i niedawne wydarzenia związane z odzyskaniem dawnej świetności przez Ligę Hanzeatycką, pragną oni powrotu Gdańska do Ligi. Takie dyplomatyczne posunięcie z pewnością będzie kosztowne, ale warto je rozważyć i spróbować uniknąć niepotrzebnego rozlewu krwi przeciwko polskiej koronie i jej potężnej armii, aby nie ryzykować zniszczenia tego, co do tej pory staraliśmy się zbudować."
 flavor_hsa.17.a: "Propozycja do przyjęcia"
 flavor_hsa.17.b: "To szaleństwo!"
 flavor_hsa.17.c: "Niech szef Hanzy wynegocjuje lepszy układ."
 flavor_hsa.18.t: ""
 flavor_hsa.18.d: "Od stuleci kupcy z Lubeki handlują cennymi towarami na wszystkich północnych morzach. Ostatnie wydarzenia dyplomatyczne sprawiły, że monarchia [236.Owner.GetAdjective] przyznała niektórym mieszkańcom Lubeki prawo do swobodnego podróżowania do Londynu i z powrotem, a także zgodę na zakładanie kantorów w najbardziej ruchliwych częściach portu miejskiego. Doprowadziło to historycznie do powstania Stalowego Dziedzińca — zespołu kantorów przeznaczonych dla kupców Hanzy, co przyniosło korzyści obu państwom."
 flavor_hsa.18.a: ""
 flavor_hsa.19.t: ""
 flavor_hsa.19.d: "Od stuleci kupcy z Lubeki handlują cennymi towarami na wszystkich północnych morzach. Ostatnie wydarzenia dyplomatyczne sprawiły, że monarchia [Root.GetAdjective] przyznała niektórym mieszkańcom Lubeki prawo do swobodnego podróżowania do Londynu i z powrotem, a także zgodę na zakładanie kantorów w najbardziej ruchliwych częściach portu miejskiego. Doprowadziło to historycznie do powstania Stalowego Dziedzińca — zespołu kantorów przeznaczonych dla kupców Hanzy, co przyniosło korzyści obu państwom."
 flavor_hsa.19.a: ""
 flavor_hsa.20.t: ""
 flavor_hsa.20.d: "Regulowanie dostaw drewna i zatrudnienia w sektorze morskim było niegdyś podstawą funkcjonowania naszej wielkiej republiki. Jednak na początku XV wieku utraciliśmy monopol na budowę statków i związane z nią towary, a wraz z nim mocny uchwyt nad samymi morzami. Mimo licznych niepowodzeń Hanza niedawno odzyskała utraconą pozycję w handlu zaopatrzeniem morskim, ponownie przejmując kontrolę nad rynkami naszego rodzinnego miasta i zagranicy. Niewielu potrafi dziś przewidzieć, co to oznacza dla naszej przyszłości, lecz powrót miasta do korzeni jest niewątpliwą zapowiedzią pomyślnych czasów!"
 flavor_hsa.20.a: ""
 flavor_hsa.21.t: ""
 flavor_hsa.21.d: "Jako państwo, przez które przepływa tak wiele towarów, obserwujemy ogromny ruch cennych dóbr i ludzi. Jedną z takich wybitnych postaci jest Georg Giese, utalentowany kupiec z Gdańska, który od lat zarządza rodzinnym kantorem w naszym londyńskim kantorze. Jego działalność przyniosła znakomite rezultaty, a nasze zyski i wpływy na rynku londyńskim znacznie wzrosły dzięki jego pracy. Teraz, gdy powrócił z Londynu, możemy wykorzystać jego ogromny potencjał w bardziej bezpośredni sposób."
 flavor_hsa.21.a: ""
 flavor_hsa.21.b: ""
 flavor_hsa.21.c: ""
 flavor_hsa.22.t: ""
 flavor_hsa.22.d: "Związek Hanzeatycki jest zgromadzeniem, a raczej luźnym sojuszem wielu kupców z rozległych ziem potężnego Świętego Cesarstwa Rzymskiego i spoza jego granic. Wielu handlarzy przychodziło i odchodziło: jedni potrafili zdobyć legendarne fortuny i zapisać się na kartach historii, inni mieli mniej szczęścia.\n\nNiewielu pozostawiło jednak w historii tak wyraźny ślad jak Albrecht Moldenhauer, genialny kupiec z naszego miasta Lubeki. Odegrał kluczową rolę w rozwoju handlu ze Szwecją i Norwegią, a dzięki niemu znacznie zwiększył się przepływ towarów przez oba te kraje. Bez wątpienia powinniśmy korzystać z talentu takich ludzi."
 flavor_hsa.22.a: ""
 flavor_hsa.23.t: ""
 flavor_hsa.23.d: ""
 flavor_hsa.23.a: "To jest nasza szansa!"
