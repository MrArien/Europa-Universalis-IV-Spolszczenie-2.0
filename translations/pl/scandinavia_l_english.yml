 pol_centralized_royal_court_authority_modifier: "Scentralizowana królewska władza nad dworem"
 desc_pol_centralized_royal_court_authority_modifier: "Nasza władza w dworskiej domenie jest niekwestionowalna. Po raz pierwszy w historii naszego kraju rozmaite klasy oddają hołd niekwestionowalnej władzy naszego władcy, a nie na odwrót."
 pol_crimson_privileges_modifier: "Szkarłatne przywileje"
 desc_pol_crimson_privileges_modifier: "Utrzymywanie dobrych stosunków z potężnymi monarchami naszego królestwa jest niezbędne, jeśli chcemy utrzymać stabilną wspólną władzę."
 pol_new_henrikian_articles_modifier: "Nowe artykuły henrykowskie"
 desc_pol_new_henrikian_articles_modifier: "Rozmaite dokumenty, obietnice i stypulacje, służące związaniu losu naszej domeny z wieloma potężnymi klasami, które operują w cieniu polityki."
 pol_cardinal_laws_modifier: "Prawa kardynalne"
 desc_pol_cardinal_laws_modifier: "Nasza nowo utworzona republika potrzebuje silnych fundacji prawnych, jeśli chcemy, by nasz lud rozwijał się i prosperował."
 pol_stable_internal_affairs_modifier: "Stabilne sprawy wewnętrzne"
 desc_pol_stable_internal_affairs_modifier: "Królestwo jest jedynie tak stabilne, jak jego komponenty. Żeby zapewnić niezachwianą władzę, musimy chronić wszystkich poddanych w naszej domenie."
 pol_cultural_flowering_polish_domain_modifier: "Kulturowy rozkwit w polskiej domenie"
 desc_pol_cultural_flowering_polish_domain_modifier: "Nie ma lepszego sposobu, by wyrazić nasze społeczne postępy kosztem naszych sąsiadów, niż pokaz naszego wspaniałego kulturowego rozkwitu."
 pol_splendor_polish_crown_modifier: "Splendor polskiej korony"
 desc_pol_splendor_polish_crown_modifier: "Klejnoty naszej królewskiej korony to nie tylko dekoracja na głowie naszego władcy. Reprezentują one moc, dostatek i historię chwalebnego ludu."
 pol_breadbasket_europe_modifier: "Nadwyżki zboża"
 desc_pol_breadbasket_europe_modifier: "Nasza produkcja zboża wielce skorzystała z poprawy naszej produkcji. W efekcie posiadamy nadwyżki zboża!"
 pol_growing_prosperity_modifier: "Rosnący dobrobyt"
 desc_pol_growing_prosperity_modifier: "Nasza decyzja, by finansować rozwój projektów w naszym kraju przyniosła skutki w formie rosnącego dobrobytu."
 pol_golden_era_modifier: "Złota era finansów"
 desc_pol_golden_era_modifier: "Ostatnie postępy w naszych zabiegach finansowych poskutkowały złotą erą przychodów i bogactwa w naszym kraju."
 pol_enable_2nd_manufactory_modifier: "Rozszerzone manufaktury"
 desc_pol_enable_2nd_manufactory_modifier: "Tak, mieliśmy jedną. Ale co z drugą manufakturą?"
 pol_polish_seat_of_power_modifier: "Polski ośrodek władzy"
 desc_pol_polish_seat_of_power_modifier: "Ta prowincja jest nowym centrum naszego ambitnego i potężnego królestwa."
 pol_official_papal_nunciature_modifier: "Oficjalna Nuncjatura Apostolska"
 desc_pol_official_papal_nunciature_modifier: "Ojciec Święty pobłogosławił nas, byśmy przeprowadzali nasze sprawy wewnętrzne z jego aprobatą."
 pol_official_papal_nunciature_2_modifier: "Wzmocniona Nuncjatura Apostolska"
 desc_pol_official_papal_nunciature_2_modifier: "Ojciec Święty dał nam pełną władzę, byśmy przeprowadzali nasze sprawy wewnętrzne z jego aprobatą, jako wzór dla katolicyzmu."
 pol_facing_the_catholics_modifier: "Stawienie czoła katolikom"
 desc_pol_facing_the_catholics_modifier: "Nasz kraj zdecydował postawić się fałszywym naukom słabnącej i skorumpowanej religii."
