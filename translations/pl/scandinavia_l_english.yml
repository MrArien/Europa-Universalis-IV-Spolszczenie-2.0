 teu_pru_conquer_brandenburg_desc: ""
 teu_pru_conquer_silesia_title: ""
 teu_pru_conquer_silesia_desc: "Ziemie Śląska i Łużyc zamieszkują odpowiednio Ślązacy i Serbołużyczanie. Choć nie są oni Niemcami, ich słowiańskie pochodzenie czyni ich potencjalnymi sojusznikami Korony Polskiej - i zagrożeniem dla naszej władzy w Niemczech. Powinniśmy przejąć te ziemie sami i zintegrować je z naszym społeczeństwem, zanim nasi rywale zaczną ich wspierać przeciwko nam."
