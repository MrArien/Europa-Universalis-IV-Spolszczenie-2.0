 liv_livonian_path_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yinflancką§!, do ukończenia tej misji będą wymagane następujące warunki:"
 liv_livonian_path_effects_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yinflancką§!, wystąpią następujące efekty:"
 liv_diplomatic_focus: "Orientacja dyplomatyczna"
 desc_liv_diplomatic_focus: "Koncentrujemy się na działaniach dyplomatycznych, aby znaleźć sojuszników, którzy zapewnią nam bezpieczeństwo przed wrogami."
 liv_diplomatic_knights: "Rycerze-dyplomaci"
 desc_liv_diplomatic_knights: "Choć nasi rycerze słyną z walki z poganami, mają również zdolności dyplomatyczne, które pomagają nam utrzymywać bliskie sojusze."
 liv_protector_of_riga: "Obrońca Rygi"
 desc_liv_protector_of_riga: "Dzięki sile lub dyplomacji nasze państwo stało się obrońcą miasta i biskupstwa Rygi. Sami kapłani ryscy popierają naszą sprawę religijną."
 livonian_diet_capital: "Siedziba inflanckiego Landtagu"
 desc_livonian_diet_capital: "Prowincja ta jest siedzibą inflanckiego Landtagu, który rozstrzyga wszystkie sprawy wewnętrzne między stanami a rządem."
 liv_prepared_army: "Przygotowania wojskowe"
 desc_liv_prepared_army: "Nasze wojsko wyciągnęło wnioski z tragedii bitwy pod Wiłkomierzem. Nasze siły są przygotowane, by ponownie stawić czoła wrogom na polu bitwy."
 liv_lva_colonial_ambition: "Entuzjazm kolonialny"
 desc_liv_lva_colonial_ambition: "Wizja Nowego Świata rozbudza ciekawość wszystkich naszych odkrywców. Dzięki temu są gotowi wyruszać w znacznie dłuższe podróże niż zwykle."
 liv_lva_american_trade_dominance: "Monopol na handel amerykański"
 desc_liv_lva_american_trade_dominance: "Ugruntowaliśmy dominację handlową w Ameryce Północnej i Południowej, tworząc monopol na towary sprowadzane z Nowego Świata."
 liv_lva_random_new_world_colonialism: "Kolonizacja Nowego Świata"
 desc_liv_lva_random_new_world_colonialism: "Odkrycie Nowego Świata i założenie tam pierwszych osad przyciąga do naszych kolonii wielu obywateli żądnych przygód."
 liv_lva_west_african_gold_production: "Intensyfikacja wydobycia złota"
 desc_liv_lva_west_african_gold_production: "Górnicy w tej prowincji zintensyfikowali wydobycie, licząc na odkrycie kolejnych złóż złota."
 liv_lva_indian_trade: "Dostęp do rynku indyjskiego"
 desc_liv_lva_indian_trade: "Uzyskaliśmy dostęp do towarów i kosztowności subkontynentu indyjskiego. Nasi kupcy są mile widziani na rynkach handlowych oferujących pożądane dobra z Indii."
 liv_lva_merchant_fleet: "Rozbudowana flota handlowa"
 desc_liv_lva_merchant_fleet: "Cała nasza polityka morska skupia się na jednym celu: ochronie wpływów handlowych na Morzu Bałtyckim i rywalizacji z Hanzą."
 liv_lva_expanded_land: "Rozbudowane ziemie"
 desc_liv_lva_expanded_land: "Właściciel tej prowincji zadbał o rozbudowę podstawowej infrastruktury dla miejscowej ludności, co ułatwia wznoszenie nowych budynków i zwiększa zadowolenie mieszkańców."
 liv_lva_the_new_capital: "Stolica w Rydze"
 desc_liv_lva_the_new_capital: "Prowincja ta jest nową stolicą swojego właściciela i otrzymała liczne usprawnienia administracyjne oraz infrastrukturalne, których nie wprowadzono w pozostałych prowincjach."
 liv_lva_seat_of_the_livonian_enlightenment: "Ośrodek inflanckiego oświecenia"
 desc_liv_lva_seat_of_the_livonian_enlightenment: "Miasto to jest ośrodkiem inflanckiego oświecenia i administracyjnym centrum uniwersytetów swojego właściciela. Niezależnie od tego, jakie instytucje zostaną odkryte, miasto zawsze będzie o nich wiedzieć."
 liv_lva_defeated_poland: "Zwycięstwo nad Polską"
 desc_liv_lva_defeated_poland: "Pokonaliśmy Polskę na polu bitwy! To zwycięstwo jest wielką inspiracją zarówno dla naszych żołnierzy, jak i urzędników, którzy będą musieli zarządzać polskimi ziemiami."
 liv_lva_allied_poland: "Polski sojusz"
 desc_liv_lva_allied_poland: "Utrzymujemy silny sojusz z Polską. Nasz gabinet dyplomatyczny musiał się odpowiednio rozrosnąć, aby podtrzymywać tę relację."
 liv_lva_conquered_poland: "Zdobywcy z Bałtyku"
 desc_liv_lva_conquered_poland: "Upadek Polski stworzył próżnię władzy w Europie Wschodniej — i to my ją wypełnimy. Nikt nie będzie kwestionował naszych rządów."
 liv_unity_in_faith: "Jedność w wierze"
 desc_liv_unity_in_faith: "Podbiliśmy nowe terytoria i poddaliśmy ich mieszkańców indoktrynacji. Nowo pozyskane ludy łączy teraz z nami wspólna wiara!"
 liv_donations_from_the_churches: "Darowizny z kościołów"
 desc_liv_donations_from_the_churches: "Budowa kilku nowych kościołów doprowadziła do znacznego wzrostu comiesięcznych darowizn. Duchowieństwo jest oczywiście bardzo zadowolone ze swojego udziału."
 liv_the_livonian_defender: "Inflanccy obrońcy"
 desc_liv_the_livonian_defender: "Stawiliśmy czoła wielu wyzwaniom i wielokrotnie ryzykowaliśmy życie, by chronić słabych przed złoczyńcami. Nasz autorytet jako Obrońcy Wiary nie podlega dyskusji.\n\n§YModyfikator trwa do czasu, gdy przestaniemy być Obrońcą Wiary Katolickiej.§!\n§YTytuł można odzyskać, gdy ponownie zdobędziemy godność Obrońcy Wiary Katolickiej.§!"
 liv_the_livonian_defender_tt: "do czasu, gdy przestaniemy być §YObrońcą Wiary§!"
 liv_lva_prussian_military: "Pruska armia"
 desc_liv_lva_prussian_military: "Nasze więzi z pruską administracją przynoszą owoce! Uzyskaliśmy dostęp do pruskiej wiedzy wojskowej, którą możemy wykorzystać we własnej armii."
 liv_protector_of_the_catholics: "Obrońca katolików"
 desc_liv_protector_of_the_catholics: "Nasza odwaga i czyny pokazały chrześcijańskiemu światu, że katolicy mogą liczyć na nasze wsparcie w wojnach z poganami i heretykami!\n\n§YWymuszenie pokoju§! zapewnia §G25§! punktów wpływu papieskiego, jeśli te działania dyplomatyczne zostaną wykorzystane do ochrony państwa §Ykatolickiego§! przed atakującym je państwem §Yheretyckim§! lub §Ypogańskim§!."
 liv_the_great_conversion: "Orientacja misyjna"
 desc_liv_the_great_conversion: "Znaczna część Rusi znajduje się pod kontrolą katolików, lecz ludność nadal wyznaje heretyckie poglądy Kościoła prawosławnego. Musimy skupić wysiłki misjonarskie na tym regionie."
 liv_glory_of_the_catholic_third_rome: "Chwała katolickiego Trzeciego Rzymu"
 desc_liv_glory_of_the_catholic_third_rome: "Trzeci Rzym — roszczący sobie prawo do dziedzictwa rzymskiego — został nawrócony na prawdziwą wiarę katolicką!"
 lif_lva_baltic_expansion: "Ekspansja bałtycka"
 desc_lif_lva_baltic_expansion: "Prowincja ta jest celem licznych planów rozwoju i rozbudowy infrastruktury przygotowanych przez jej właściciela."
 teutonic_headquarter: "Poselstwo zakonów"
 desc_teutonic_headquarter: "W prowincji tej znajduje się poselstwo zakonu krzyżackiego na ziemiach zakonu inflanckiego. Dopóki sojusz między tymi zakonami pozostaje w mocy, poselstwo może służyć zakonowi inflanckiemu jako siedziba dyplomatyczna."
 livonian_headquarter: "Poselstwo zakonów"
 desc_livonian_headquarter: "W prowincji tej znajduje się poselstwo zakonu inflanckiego na ziemiach zakonu krzyżackiego. Dopóki sojusz między tymi zakonami pozostaje w mocy, poselstwo może służyć zakonowi krzyżackiemu jako siedziba dyplomatyczna."
 liv_militarized_knights: "Militaryzacja rycerstwa"
 desc_liv_militarized_knights: "Niektórzy uważają, że rycerze z definicji są już siłą militarną. My jednak sądzimy, że wciąż są zbyt słabo zmilitaryzowani! Musimy zadbać o to, by każdy giermek, każdy rycerz, a nawet koń każdego rycerza był gotowy walczyć w obronie zakonu!"
 liv_honorable_wars: "Honorowe wojny"
 desc_liv_honorable_wars: "W przeciwieństwie do zakonu krzyżackiego nasz zakon nie jest grupą zdegenerowanych podżegaczy wojennych. Nasi rycerze walczą z honorem i godnością.\nŻadne z europejskich mocarstw nie będzie protestować, gdy podporządkujemy sobie pozbawionych rycerskości sąsiadów."
 liv_united_orders: "Zjednoczone zakony"
 desc_liv_united_orders: "Rycerze zakonu krzyżackiego zostali zjednoczeni pod sztandarem zakonu inflanckiego."
 flavor_liv.0.t: "Sytuacja zakonu inflanckiego"
 flavor_liv.0.desc: "Zakon Liwoński jest kontynuatorem Zakonu Kawalerów Mieczowych, który został unicestwiony przez Żmudzinów w 1236 roku. Choć technicznie rzecz biorąc jest wasalem Zakonu Krzyżackiego, Zakon Liwoński pozostał w większości niezależny.\nJednak nasz zakon ma swoje własne problemy. Unia Kalmarska - bardzo wygłodniałe Lwy Północy - dążą do naszego podporządkowania. Litwini, wspierani przez swoich polskich sojuszników, chcą zaanektować ziemie bałtyckie, a Nowogródczanie na wschodzie rozważają ekspansję na zachód.\nTo jednak nie wszystko. W 1435 roku biskupstwa zawiązały Konfederację Liwońską za przewodnictwem Rygi i zaczęły dla własnych korzyści kierować cenne surowce z dala od nas.\n\nAle nie wszystko wygląda dla nas aż tak fatalnie. Czasy się zmieniają, a Zakon Liwoński stoi na rozstaju dróg swojego przeznaczenia. Jeśli uda nam się zakończyć tę konfederację oraz zdołamy odepchnąć naszych wrogów, wtedy nasze państwo będzie mogło dokonać wyboru, którą drogą pójdziemy."
 flavor_liv.0.a.tt: "§YZakon Inflancki§! posiada unikalne drzewko misji, bardziej elastyczne niż pozostałe. Po ukończeniu misji „§YUmocnij naszą władzę§!” otrzymamy wydarzenie, które pozwoli zastąpić misje rozgałęzione misjami z jednej z dwóch poniższych ścieżek:\n\n§YŚcieżka inflancka§!\nŚcieżka inflancka polega na sekularyzacji i rozwiązaniu zakonu inflanckiego oraz przekształceniu go w państwo §YInflanty§!. Jej celem będzie rozwój regionu §YBałtyku§! i kolonizacja §YNowego Świata§!. Umożliwi nam również utworzenie własnego §Yrządu§!, ukształtowanego przez nasze potrzeby i działania.\n\n§YŚcieżka krzyżowców§!\nŚcieżka krzyżowców polega na wierności celowi zakonu, jakim jest chrystianizacja pogan i heretyków. Drzewko misji poprowadzi nas przez kampanię podbojów i nawracania §YRusi§! oraz utworzenie katolickiego imperium w §YEuropie Wschodniej§!."
 flavor_liv.1.t: "Przyszłość zakonu inflanckiego"
 flavor_liv.1.desc: "Nasz zakon zdołał powstrzymać konfederację inflancką i zabezpieczyć swoją przyszłość. Oczywiste jest jednak, że brakuje mu wyraźnego kierunku działania. Nadchodzi nowa era i właśnie teraz, bardziej niż kiedykolwiek, musimy zdecydować, jaką drogą podąży nasze państwo."
 flavor_liv.1.a: "Czas krucjat dobiegł końca. Stworzymy świeckie państwo!"
 flavor_liv.1.a.tt: "Odblokowuje ścieżkę misji §Yinflancką§!."
 flavor_liv.1.b: "Nasza krucjata nie dobiegła końca, dopóki trwa schizma!"
 flavor_liv.1.b.tt: "Odblokowuje ścieżkę misji §Ykrzyżowców§!. Wszystkie misje wymagają pozostania przy wierze §Ykatolickiej§!."
 flavor_liv.1.b.ct: "§RNie będziemy mogli utworzyć §YKurlandii§! ani §YInflant§!.§!"
 flavor_liv.2.t: "Likwidacja biskupstwa"
 flavor_liv.2.desc: "Nasza armia jest gotowa wymusić rozwiązanie jednego z członków konfederacji inflanckiej. Pytanie brzmi: które biskupstwo powinno stać się naszym celem?"
 flavor_liv.2.a: "Biskupstwo Dorpackie zbyt długo było nam solą w oku."
 flavor_liv.2.b: "Musimy zmiażdżyć biskupstwo Ozylii."
 flavor_liv.2.c: "Nadszedł czas, by zakończyć istnienie biskupstwa Kurlandii."
 flavor_liv.2.d: "Biskup rewalski musi się podporządkować."
 flavor_liv.2.e: "Nie możemy zlikwidować żadnego z tych biskupstw..."
 flavor_liv.2.f: "Jakie biskupstwa?"
 flavor_liv.3.t: "Zakup biskupstwa"
 flavor_liv.3.desc: "Konfederacja inflancka utrudnia nam utrzymanie władzy nad ziemiami Kurlandii, Inflant i Estonii. Na szczęście biskupi nie są tak święci, za jakich się podają, i są gotowi sprzedać nam swoje ziemie."
 flavor_liv.3.a: "Biskupstwo Dorpackie zbyt długo było nam solą w oku."
 flavor_liv.3.b: "Musimy kupić biskupstwo Ozylii."
 flavor_liv.3.c: "Nadszedł czas, by zakończyć istnienie biskupstwa Kurlandii."
 flavor_liv.3.d: "Biskup rewalski będzie mógł cieszyć się swoimi pieniędzmi."
 flavor_liv.4.t: "Sekularyzacja zakonu inflanckiego"
 flavor_liv.4.desc: "Jesteśmy zakonem rycerskim, który miał tylko jeden cel: chrystianizację ziem bałtyckich — i osiągnęliśmy go. Wraz z rozprzestrzenianiem się reformacji staje się jednak coraz bardziej oczywiste, że nasz zakon utracił swoje pierwotne zadanie, a krucjata przeciwko współwyznawcom jest według naszych doradców czymś absurdalnym.\nByć może nadszedł wreszcie czas, by rozwiązać zakon inflancki w jego obecnej postaci i utworzyć prawdziwe królestwo — Królestwo Inflant."
 flavor_liv.4.a: "Od dziś świat będzie znał nas jako Inflanty!"
 flavor_liv.4.b: "Nie możemy jeszcze rozwiązać naszego zakonu."
 flavor_liv.5.t: "Sojusz prusko-inflancki"
 flavor_liv.5.desc: "Prusy są następcą zakonu krzyżackiego, naszego dawnego sojusznika i byłego zwierzchnika. Oczywiście łączą nas głębokie więzi, ponieważ mamy wspólną historię walki ramię w ramię przeciwko bałtyckim poganom i polskim wojskom.\nOstatnia wojna pokazała, że choć staliśmy się odrębnymi państwami, nasza przyjaźń nadal trwa."
 flavor_liv.5.a: "Oba nasze państwa będą zjednoczone przeciwko każdemu zagrożeniu!"
 flavor_liv.6.t: "Utworzenie nowego rządu"
 flavor_liv.6.desc: "Nasza sekularyzacja przekształciła państwo w monarchię podobną do wielu innych w okolicy. Nasze państwo jest jednak stosunkowo młode, dlatego brakuje nam doświadczenia i tradycji, które nasi sąsiedzi wypracowali przez lata. Nawet nasi sojusznicy z ziem pruskich zaczęli wprowadzać w swojej monarchii sprawne systemy administracyjne.\nNadszedł czas, by uczyć się na doświadczeniach sąsiadów i ukształtować monarchię odpowiadającą naszym potrzebom."
 flavor_liv.6.a: "Stwórzmy monarchię godną Inflant!"
 flavor_liv.7.t: "Inflanty ogłaszają koniec schizmy"
 flavor_liv.7.desc: "Gdy ziemie ruskie znalazły się w rękach katolików, rycerze inflanccy ogłosili koniec wielkiej schizmy i wezwali całe chrześcijaństwo do uznania przywództwa papiestwa. Papież nie poparł jednak tej deklaracji, dlatego jej wiarygodność nadal budzi wątpliwości. Podboje te mogą jednak wskazywać, że sam Bóg sprzyja katolicyzmowi."
 flavor_liv.7.a: "Wola Boga jest jasna — papież powinien przewodzić."
 flavor_liv.7.b: "Zwykli rycerze nie mogą odwołać patriarchów."
 flavor_liv.8.t: "Osłabienie dominacji handlowej Lubeki"
 flavor_liv.8.desc: "Uzyskaliśmy dostęp do handlu w Lubece na różne sposoby, co pozwoliło nam zwiększyć bogactwo i potęgę. Nasze postępy były tak znaczne, że w końcu rozszerzyliśmy wpływy na zachód i zdobyliśmy centrum handlu w pobliżu samej Lubeki.\nHanza poczuła się zagrożona naszym rozwojem i zaczęła ograniczać nam dostęp do swojego rynku."
 flavor_liv.8.a: "To bardzo niefortunne."
 flavor_liv.13.t: "Kwestia stosunków krzyżacko-inflanckich"
 flavor_liv.13.desc: "Rycerze zakonu krzyżackiego są naszymi braćmi w wierze i broni od czasu powstania obu zakonów. Współpracując z nimi, zdołaliśmy schrystianizować te regiony, lecz nasza współpraca może być jeszcze ściślejsza. Jeśli zacieśnimy wzajemne więzi, korzyści dla wiary będą nieocenione."
 flavor_liv.13.a: "Zacieśnijmy nasze więzi i traktujmy się jak równych sobie."
 flavor_liv.13.a.tt: "Prowincja [Root.Capital.GetName] otrzymuje do końca gry aktywowany modyfikator „§YPoselstwo zakonów§!”, zapewniający następujące efekty:\nUtrzymanie dyplomatów: §G+1§!\nRoczny profesjonalizm armii: §G+0,5%§!\nLokalny modyfikator siły żywej: §G+25,0%§!\nLokalny koszt rozwoju: §G-5,0%§!"
 flavor_liv.13.b: "Nasz sojusz z zakonem krzyżackim jest jedynie środkiem do osiągnięcia celu."
 flavor_liv.14.t: "Więzi między Inflantami a zakonem krzyżackim"
 flavor_liv.14.desc: "Rycerze inflanccy są naszymi braćmi w wierze i broni od czasu powstania obu zakonów. Współpracując z nimi, zdołaliśmy schrystianizować te regiony, lecz nasza współpraca może być jeszcze ściślejsza. Rycerze inflanccy przybyli do nas w tym celu i ustanowili swoją siedzibę w naszej stolicy. Powinniśmy odwzajemnić ten gest."
 flavor_liv.14.a: "Ta więź może przynieść korzyści."
 flavor_liv.15.t: "Militaryzacja rycerzy"
 flavor_liv.15.desc: "Nasz zakon od początku był organizacją wojskową, lecz udało nam się usprawnić organizację i administrację jego rycerzy. Dzięki temu nasze wojska są już prawdziwą armią, a nie tylko grupą rycerzy krzyżowców."
 flavor_liv.15.a: "Nasi rycerze zatriumfują."
 flavor_liv.16.t: "Armia i klasztor"
 flavor_liv.16.desc: "Nasze niedawne reformy wojskowe znacznie zwiększyły nasze możliwości, lecz nadal jest miejsce na dalsze usprawnienia. Całkowite przyjęcie militaryzacji zakonu pozwoliłoby nam stworzyć armię dorównującą siłą wojskom każdego innego wielkiego państwa. Przestalibyśmy być klasztorami z armią, a stalibyśmy się armią z klasztorami."
 flavor_liv.16.a: "Przyjmijmy tę zmianę."
 flavor_liv.16.b: "Nie popadajmy w przesadę."
 flavor_liv.17.t: "Druga bitwa na lodzie"
 flavor_liv.17.desc: "Porażka z rąk księcia Nowogrodu Aleksandra Newskiego i jego sojuszników z Włodzimierza w 1242 roku była plamą na naszej historii wojskowości. Teraz role się odwróciły i udało nam się sprawić, że nasi przeciwnicy sami zakosztowali klęski."
 flavor_liv.17.a: "Niech będzie to przestroga dla wszystkich naszych wrogów."
 flavor_liv.18.t: "Królestwo krzyżowców"
 flavor_liv.18.desc: "Nasze państwo krzyżowców znacznie przekroczyło pierwotne cele i rozszerzyło się na rozległe terytoria. Nie jesteśmy już zwykłym państwem krzyżowców — staliśmy się prawdziwym Królestwem Krzyżowców."
 flavor_liv.18.a: "Niech żyją Inflanty!"
 flavor_liv.18.b: "Pozostańmy skromni."
 flavor_liv.20.t: "Chaos administracyjny w urzędach"
 flavor_liv.20.desc: "Choć nasz [Root.GovernmentName] zazwyczaj dysponuje dość sprawną administracją, zdarzają się dni, gdy nic nie działa tak, jak powinno. Urzędnicy są przeciążeni zarządzaniem naszym terytorium, a burmistrzowie zapominają o swoich obowiązkach. Innymi słowy, panuje obecnie chaos większy, niż ktokolwiek mógł się spodziewać.\nOstatecznie [Root.Monarch.GetTitle] [Root.Monarch.GetName] musi [Root.Monarch.GetHerselfHimself] wkroczyć do akcji i uporządkować administrację."
 flavor_liv.20.a: "Skoncentrujmy wszystkie wysiłki na administracji!"
 flavor_liv.20.b: "Utwórzmy poddanych, którzy będą zarządzać naszym terytorium."
 flavor_liv.20.b.tt: "Każda posiadana prowincja państwowa zyskuje §R20§! lokalnej autonomii."
 flavor_liv.20.c: "Potrzebujemy pomocy wojska."
 flavor_liv.20.c.tt: "Każda posiadana prowincja państwowa traci §G20§! lokalnej autonomii."
 flavor_liv.21.t: "Kwestie wojskowe"
 flavor_liv.21.desc: "Wojna jest kosztownym przedsięwzięciem. Wymaga zasobów, ludzi i wysiłku, a zwycięstwo nigdy nie jest pewne. Choć najemnicy byli powszechnym i popularnym sposobem odnoszenia zwycięstw na polu bitwy, otaczające nas państwa zaczęły tworzyć sprawne armie stałe, szkolone z myślą o trudach walki."
 flavor_liv.21.a: "Najemnicy są równie dobrzy na wojnie."
 liv_merc_focus: "Odnowione kontrakty najemnicze"
 desc_liv_merc_focus: "Nasza decyzja o skoncentrowaniu się na armii złożonej głównie z najemników skłoniła administrację do odnowienia kontraktów najemniczych."
 flavor_liv.21.b: "Armia stała? Od tego mamy piechurów morskich."
 liv_marine_focus: "Orientacja na piechotę morską"
 desc_liv_marine_focus: "Nasza decyzja o większym skupieniu się na marynarce wojennej niż na armii stałej skłoniła wielu żołnierzy do rozpoczęcia służby na morzu."
 flavor_liv.21.c: "Powinniśmy rzeczywiście zainwestować w armię stałą."
 flavor_liv.22.t: "[Root.GetAdjective] stany domagają się przywilejów"
 flavor_liv.22.desc: "Nasz [Root.GovernmentName] czyni postępy w tworzeniu rządu dostosowanego do potrzeb [Root.Monarch.GetTitle] i [Root.Monarch.GetHerHis] ludu.\nNie wszyscy potrafią jednak docenić piękno postępu ustrojowego. Wielkie stany państwa [Root.GetName] zebrały się na dworze [Root.Monarch.GetName] i zagroziły naszemu [Root.Monarch.GetTitle] zamachem stanu, jeśli nie przyznamy im przywilejów w nowym państwie."
 flavor_liv.22.a: "Przyznajmy im bezużyteczne prawa. Nawet się nie zorientują."
 flavor_liv.22.b: "Zagwarantujmy im przywileje."
 flavor_liv.22.b.tt: "Zagwarantowane przywileje"
 flavor_liv.22.c: "Stracimy ich za zdradę."
 flavor_liv.22.c.tt: "Utrata przywódców stanów wskutek egzekucji"
 flavor_liv.23.t: "Niewielki złoty wiek gospodarki"
 flavor_liv.23.desc: "Nasza gospodarka przeżywa niewielki złoty wiek. Mimo hojnych wydatków udaje nam się osiągać dodatni bilans. Doradcy zalecają wykorzystać oszczędności na inwestycje w jeden z kluczowych obszarów państwa."
 flavor_liv.23.a: "Zainwestujmy w administrację, aby zapewnić przyszłe zyski."
 flavor_liv.23.b: "Przeznaczmy pieniądze na ambasady i flotę."
 flavor_liv.23.c: "Nasze wojsko przydałoby się wyposażyć w nowy sprzęt."
 flavor_liv.24.t: "Debata religijna w państwie [Root.GetName]"
 flavor_liv.24.desc: "Religia odgrywa ogromną rolę w naszym społeczeństwie. Jednak odkąd porzuciliśmy monastyczne korzenie, jej znaczenie zmalało, a uwaga opinii publicznej w państwie [Root.GetName] skupiła się na rodzinie panującej.\nDuchowieństwo chce to zmienić i debatuje z naszym [Root.Monarch.GetTitle] oraz pozostałymi stanami nad zwiększeniem roli religii w państwie."
 flavor_liv.24.a: "Duchowieństwo ma rację. Powinniśmy położyć większy nacisk na religię."
 flavor_liv.24.a.tt: "Religijny charakter państwa"
 flavor_liv.24.b: "Religia jest częścią naszego państwa, ale podlega [Root.Monarch.GetTitle]."
 flavor_liv.24.c: "Powinniśmy traktować religię bardziej jako narzędzie własnych korzyści niż tradycję."
 flavor_liv.24.c.tt: "z naszych prowincji §Ywyznających prawdziwą wiarę§!."
 flavor_liv.25.t: "Rola [Root.Monarch.GetTitle]"
 flavor_liv.25.desc: "[Root.Monarch.GetTitle] to prestiżowy tytuł, którego rola w większości innych [Root.GovernmentName] jest jasna: władca państwa. [Root.Monarch.GetSheHe] może jednak oznaczać znacznie więcej. W historii wielu królów samodzielnie zarządzało państwem, nadzorowało dyplomację z obcymi krajami i prowadziło armie do zwycięstwa.\nPytanie brzmi, jaką drogę obierze nasz [Root.Monarch.GetTitle]..."
 flavor_liv.25.a: "Skarbiec i administracja potrzebują kogoś o trzeźwym umyśle — na przykład mnie."
 flavor_liv.25.b: "Dyplomacja to delikatna sprawa. Powinienem zająć się nią osobiście."
 flavor_liv.25.c: "Nic nie dorównuje chwale bitwy. Sam poprowadzę armie do zwycięstwa!"
 liv_the_administrator: "Administrator"
 desc_liv_the_administrator: "Nasz władca postanowił poświęcić całe swoje życie sprawom administracji państwa."
 liv_the_diplomat: "Dyplomata"
 desc_liv_the_diplomat: "Nasz władca postanowił poświęcić całe swoje życie sprawom dyplomacji państwa."
 liv_the_general: "Generał"
 desc_liv_the_general: "Nasz władca postanowił poświęcić całe swoje życie sprawom wojskowym państwa."
 flavor_liv.31.t: "Rząd państwa [Root.GetName]"
 flavor_liv.31.desc: "Od sekularyzacji zakonu inflanckiego minęły dziesięciolecia, które odcisnęły wyraźne piętno na naszej kulturze, społeczeństwie i rządzie. Stawialiśmy czoła licznym wyzwaniom, sporom wewnętrznym i innym problemom, musieliśmy więc dostosowywać się do zmieniających się okoliczności. Ostatecznie nasz rząd przetrwał i przekształcił się w sprawny system, który wykorzystuje nasze mocne strony."
 flavor_liv.31.a: "Jesteśmy armią z własnym państwem!"
 flavor_liv.31.b: "Potrzebujemy połączenia republiki i monarchii."
 flavor_liv.31.c: "Naszym priorytetem powinny być handel i kupiectwo."
 flavor_liv.31.d: "Monarchia nie jest doskonała bez odpowiedniego parlamentu."
 flavor_liv.31.e: "Moje rządy opierają się na woli Boga."
 flavor_liv.31.f: "Tylko uczciwe wybory mogą zapewnić stabilność."
 flavor_liv.31.g: "Dyplomacja jest duszą naszego państwa."
 flavor_liv.31.h: "Nasz rząd ma przygotować nas do utworzenia imperium!"
 flavor_liv.31.i: "Jesteśmy najemnikami z własnym państwem!"
 flavor_liv.31.j: "Marynarka wojenna jest sercem naszego rządu."
 flavor_liv.31.k: "Zapanujemy nad siedmioma morzami!"
 flavor_liv.31.l: "Wszyscy służymy wojsku."
 flavor_liv.31.m: "Państwo to ja!"
 flavor_liv.31.n: "Będziemy rządzić z mądrością i siłą."
 flavor_liv.31.z: "Nasz rząd jest jedną z najwspanialszych monarchii."
 flavor_liv.31.zzz: "Nasz obecny rząd jest już wystarczająco dobry."
 liv_adm: "Priorytet administracyjny"
 liv_dip: "Priorytet dyplomatyczny"
 liv_mil: "Priorytet militarny"
 livonian_administrative_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflanckie panowanie cesarskie§! (§Y[Root.liv_adm.GetValue]§!/§Y5§! punktów orientacji administracyjnej)."
 livonian_absolute_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka monarchia absolutna§! (§Y[Root.liv_adm.GetValue]§!/§Y4§! punktów orientacji administracyjnej)."
 livonian_trade_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka plutokracja§! (§Y[Root.liv_adm.GetValue]§!/§Y3§! punktów orientacji administracyjnej, §Y[Root.liv_dip.GetValue]§!/§Y3§! punktów orientacji dyplomatycznej)."
 livonian_constitutional_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka monarchia konstytucyjna§! (§Y[Root.liv_adm.GetValue]§!/§Y3§! punktów orientacji administracyjnej)."
 livonian_theocratic_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka teokracja§! (§Y[Root.liv_adm.GetValue]§!/§Y3§! punktów orientacji administracyjnej, §Y[Root.liv_mil.GetValue]§!/§Y3§! punktów orientacji wojskowej)."
 livonian_enlightened_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka monarchia oświecona§! (§Y[Root.liv_adm.GetValue]§!/§Y2§! punktów orientacji administracyjnej, §Y[Root.liv_dip.GetValue]§!/§Y2§! punktów orientacji dyplomatycznej, §Y[Root.liv_mil.GetValue]§!/§Y2§! punktów orientacji wojskowej)."
 livonian_naval_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflanckie Stany Generalne§! (§Y[Root.liv_dip.GetValue]§!/§Y5§! punktów orientacji dyplomatycznej)."
 livonian_diplomatic_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka Rada Państwa§! (§Y[Root.liv_dip.GetValue]§!/§Y4§! punktów orientacji dyplomatycznej)."
 livonian_admiral_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka admiralicja§! (§Y[Root.liv_dip.GetValue]§!/§Y4§! punktów orientacji dyplomatycznej)."
 livonian_elective_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka monarchia elekcyjna§! (§Y[Root.liv_dip.GetValue]§!/§Y3§! punktów orientacji dyplomatycznej)."
 livonian_naval_controlled_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka talassokracja§! (§Y[Root.liv_dip.GetValue]§!/§Y3§! punktów orientacji dyplomatycznej, §Y[Root.liv_mil.GetValue]§!/§Y3§! punktów orientacji wojskowej)."
 livonian_military_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka monarchia militarystyczna§! (§Y[Root.liv_mil.GetValue]§!/§Y5§! punktów orientacji wojskowej)."
 livonian_general_controlled_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflancka autokracja§! (§Y[Root.liv_mil.GetValue]§!/§Y4§! punktów orientacji wojskowej)."
 livonian_mercenary_monarchy_points_needed_tt: "Zapewnia postęp w odblokowaniu reformy rządowej §YInflanckie państwo najemnicze§! (§Y[Root.liv_mil.GetValue]§!/§Y3§! punktów orientacji wojskowej)."
 liv_dissolve_bishopric_title: "Rozwiąż biskupstwo"
 liv_dissolve_bishopric_desc: "Aby rozwiązać konfederację inflancką, musimy zająć się każdym z poszczególnych biskupstw. Możemy zlikwidować biskupstwo siłą, choć może to wywołać przeciwko nam powstanie."
 liv_purchase_bishopric_title: "Kup biskupstwo"
 liv_purchase_bishopric_desc: "Aby rozwiązać konfederację inflancką, musimy zająć się każdym z poszczególnych biskupstw. Możemy po prostu wykupić ich ziemie, choć ceny wyznaczone przez biskupów mogą być znacznie wyższe, niż jesteśmy skłonni zapłacić."
 liv_tried_to_get_rid_of_bishopric_tt: "Nie podjęto próby §Ykupienia ani rozwiązania biskupstwa§! w ciągu ostatnich §Y2 lat§!."
 rethinking_catholic_life: "Wycofanie się z życia publicznego"
 desc_rethinking_catholic_life: "Nasz dobry [Root.Monarch.GetTitle] wycofał się z życia publicznego, ponieważ wiara katolicka zaczęła słabnąć. Korupcja papiestwa oraz rosnące potrzeby reformy Kościoła katolickiego sprawiły, że [Root.Monarch.GetName] zatęsknił za wiarą [Root.Monarch.GetHerHis] przodków — wiarą dawnych bogów..."
 rig_riga_in_the_hansa_title: "Nawiąż więzi z Hanzą"
 rig_riga_in_the_hansa_desc: "Jesteśmy częścią Hanzy — i jej najbardziej wysuniętą na wschód eksklawą. Utrzymywanie kontaktów z Hanzą jest trudne ze względu na ogromną odległość. Powinniśmy jednak pozostać w kontakcie z przywódcami Hanzy w Lubece, w przeciwnym razie ryzykujemy, że zostaniemy zapomniani."
 rig_riga_in_the_hansa_tt: "Więzi z Hanzą"
 rig_dominate_the_baltic_trade_title: "Rywalizuj ze Szwedami"
 rig_dominate_the_baltic_trade_desc: "Handel na Bałtyku jest siłą napędową naszego pięknego miasta. Setki kupców przejeżdżają przez Rygę, by handlować z Nowogrodem na wschodzie lub Świętym Cesarstwem Rzymskim na zachodzie.\nSkandynawowie, a zwłaszcza Szwedzi, nie są oczywiście zadowoleni z naszej obecności na Morzu Bałtyckim i próbują odciąć nas od dukatów przepływających przez Bałtyk. Muszą zrozumieć, że to nasze miasto łączy Wschód z Zachodem."
 rig_dominate_the_baltic_trade_tt: "Jeśli ukończono misje „§YObecność handlowa w Lubece§!” i „§YPoselstwo papieskie§!”, uruchomi się wydarzenie „§YReligia jako interes§!”."
 rig_mercs_mission_title: "Kontrakty najemnicze"
 rig_mercs_mission_desc: "Otaczają nas królestwa i imperia, które pragną jedynie włączyć Rygę do swoich granic. Choć nasza obrona jest znakomita, nie ma gwarancji, że okaże się wystarczająca.\nNa szczęście mamy jedną przewagę: nasze miasto jest centrum handlu, a zatem w Rydze gromadzą się ogromne ilości dukatów. Możemy znacznie zwiększyć nasze bezpieczeństwo, wzmacniając armię najemnikami."
 rig_rent_condotitieri_title: "Projekcja naszej potęgi"
 rig_rent_condotitieri_desc: "Dzięki koncentracji na handlu i wpływach religijnych gromadzimy ogromne bogactwo. Bogactwo nie ma jednak znaczenia, jeśli nie potrafimy wykorzystać go do wywierania wpływu na świat. Los wielu mocarstw wisi na włosku — powinniśmy użyć własnej potęgi, by wpłynąć na wynik ich konfliktów."
 rig_rent_condotitieri_tt: "Prowadzi wojnę.\nMusi być spełniony jeden z poniższych warunków:\n Otrzymuje co najmniej §Y20,0%§! swoich dochodów w formie subsydiów\n Wynajmuje kondotierów od państwa §Y[Root.GetName]§!\n Jest sojusznikiem państwa §Y[Root.GetName]§! i znajduje się po tej samej stronie dowolnej wojny."
 rig_ally_the_emperor_title: "Nawiąż kontakt z cesarzem"
 rig_ally_the_emperor_desc: "Dzieli nas duża odległość od naszych niemieckich braci ze Świętego Cesarstwa Rzymskiego. Zakony inflancki i krzyżacki mogą być obecnie naszymi najbliższymi sojusznikami, lecz są również naszymi największymi konkurentami — i jedynie tymczasową ochroną przed sojuszem polsko-litewskim oraz zagrożeniem moskiewskim.\nPowinniśmy zrobić wszystko, co możliwe, by dotrzeć do cesarza i przystąpić do Świętego Cesarstwa Rzymskiego."
 rig_lubeck_trade_title: "Obecność handlowa w Lubece"
 rig_lubeck_trade_desc: "Handel bałtycki jest dla nas dochodowy. W porównaniu z bogactwem rynku Lubeki Morze Bałtyckie wydaje się jednak dość ubogie. Powinniśmy ustanowić własną obecność handlową w Lubece i skierować część tamtejszych dukatów do naszych kieszeni."
 rig_lubeck_trade_tt: "Jeśli ukończono misje „§YRywalizuj ze Szwedami§!” i „§YPoselstwo papieskie§!”, uruchomi się wydarzenie „§YReligia jako interes§!”."
 rig_sell_indulgences_title: "Sprzedawaj odpusty!"
 rig_sell_indulgences_desc: "Grzech jest wszędzie! W dzisiejszych czasach nikt nie potrafi prowadzić pobożnego życia, nie popełniając przypadkiem grzechu.\nNa szczęście Pan jest miłosierny i pozwala katolikom uzyskać przebaczenie grzechów za niewielką cenę odpustów. My, słudzy Pana, powinniśmy na tym skorzystać, sprzedając odpusty monarchiom Europy lub odbierając pieniądze tym, którzy je sprzedają."
 rig_sell_indulgences_at: "Sprzedano co najmniej §Y5§! odpustów za pomocą działania dyplomatycznego „§YSprzedaj odpust§!” (§Y[Root.GetNumOfSoldIndulgences]§!/§Y5§!)."
 rig_sell_indulgences_bt: "Złupiono co najmniej §Y5§! kościołów za pomocą opcji pokojowej „§YZłup kościoły heretyków§!” (§Y[Root.GetNumOfRaidedChurches]§!/§Y5§!)."
 rig_the_baltic_bank_title: "Zdominuj handel"
 rig_the_baltic_bank_desc: "Handel i kupiectwo są, obok religii, najważniejszymi aspektami każdego państwa. Bez potęgi cenionego dukata państwo nie może utrzymać kontroli nad ludnością ani wywierać wpływu na rywali. Staniemy się mistrzami handlu i zapewnimy Rydze bogatą przyszłość."
 rig_finance_great_powers_title: "Finansuj wielkie mocarstwa"
 rig_finance_great_powers_desc: "Czym jest bogactwo, jeśli nie można go wykorzystać? Wielkie mocarstwa tego świata mają potężne armie i rozległe imperia, lecz ich siłę ogranicza zawartość skarbca. Wykorzystamy to i uczynimy z wielkich mocarstw marionetki naszego bogactwa."
 rig_finance_great_powers_ct: "wielkie mocarstwa:\n    Otrzymują subsydia stanowiące co najmniej §Y10,0%§! ich dochodów."
 rig_finance_great_powers_dt: "państwa o rozwoju co najmniej §Y300§!:\n    Otrzymują subsydia stanowiące co najmniej §Y10,0%§! ich dochodów."
 rig_finance_great_powers_tt: "Każde znane państwo, które otrzymuje subsydia pokrywające §Y5%§! jego dochodów od państwa §Y[Root.GetName]§!, zyskuje §G150§! punktów opinii o państwie §Y[Root.GetName]§!."
 rig_improve_papal_relations_title: "Poselstwo papieskie"
 rig_improve_papal_relations_desc: "Nasz [Root.GovernmentName] znajduje się daleko od władzy papieża, przez co trudno nam wywierać wpływ na kurię. Powinniśmy ustanowić w Rydze poselstwo Państwa Kościelnego, które zapewni niezawodną komunikację z Państwem Kościelnym i będzie jednocześnie siedzibą naszego własnego kardynała."
 rig_improve_papal_relations_tt: "Jeśli ukończono misje „§YRywalizuj ze Szwedami§!” i „§YObecność handlowa w Lubece§!”, uruchomi się wydarzenie „§YReligia jako interes§!”."
 rig_establish_religious_dominance_title: "Zajmij się reformacją"
 rig_establish_religious_dominance_desc: "Wiara chrześcijańska stoi na rozdrożu. Reformatorzy zdobyli ogromne wpływy w Europie, zwracając wielu niegdyś pobożnych ludzi przeciwko Stolicy Apostolskiej. Musimy opowiedzieć się po jednej ze stron tego nowego rozłamu, w przeciwnym razie czeka nas własna wojna religijna."
 rig_establish_religious_dominance_tt: "Polityka handlowa §YPropaguj religię§! wymaga teraz jedynie §Y15%§! siły handlu w węźle."
 rig_establish_religious_dominance_ct: "Odblokowuje casus belli §YWojna z herezją§! przeciwko wszystkim państwom heretyckim."
 rig_establish_religious_dominance_bt: "państwa w §YŚwiętym Cesarstwie Rzymskim§! zostały siłą nawrócone przez państwo §Y[Root.GetName]§! i wyznają religię §Y[Root.Religion.GetName]§!."
 rig_defend_the_catholic_league_title: "Doprowadź reformację do końca"
 rig_defend_the_catholic_league_desc: "Niezależnie od tego, czy jesteśmy częścią reformacji, czy jej największym przeciwnikiem, jedno jest pewne: konflikt między naszymi braćmi musi się zakończyć — w taki czy inny sposób!"
 rig_defend_the_catholic_league_at: "Przywilej stanu §Y[Root.GetChurchOrFallbackName]§! „§YZapał ekspansjonistyczny§!” nie nakłada już kar na państwo §Y[Root.GetName]§!. Ponadto przywilej zapewnia teraz dodatkowe §G+10,0%§! morale armii i §G-0,05§! miesięcznego wyczerpania wojennego podczas wojny z §Ypoganami§! lub §Yheretykami§!."
 rig_defend_the_catholic_league_ct: " prowincji w regionach północnych Niemiec, południowych Niemiec, Bałtyku i Polski wyznaje wiarę §Y[Root.Religion.GetName]§!."
 rig_defend_the_catholic_league_bt: " prowincji w regionach północnych Niemiec, południowych Niemiec, Bałtyku i Polski należy do państw wyznających wiarę §Y[Root.Religion.GetName]§!."
 rig_vassalize_livonia_title: "Podporządkowanie Inflantczyków"
 rig_vassalize_livonia_desc: "Zakon inflancki jest następcą zakonu kawalerów mieczowych, dawnego zgromadzenia rycerskiego, które po bitwie pod Szawlami w 1236 roku zostało zredukowane do niewielkiej, żałosnej grupy rannych rycerzy. Formalnie zakon inflancki jest lennikiem zakonu krzyżackiego, lecz w praktyce stanowi autonomiczne państwo. Jego członkowie uważają się za nowych kawalerów mieczowych, dlatego oczywiste jest, że ponownie powinni zostać naszymi poddanymi."
 rig_vassalize_livonia_ct: "Odblokowuje decyzje pozwalające odebrać §Ykonfederację inflancką§! §Yzakonowi inflanckiemu§!, gdy pozostaje on poddanym państwa [Root.GetName]."
 rig_livonian_confederacy_title: "Położyć kres konfederacji"
 rig_livonian_confederacy_desc: "Konfederacja inflancka to sieć kilku biskupstw położonych na ziemiach zakonu inflanckiego. De iure nie podlegają one nikomu. De facto zajmują jednak część terytorium zakonu inflanckiego, który stał się naszym lennikiem. Jeśli chcemy w pełni wykorzystać potencjał naszego nowego rycerskiego poddanego, musimy rozwiązać tę konfederację."
 rig_control_the_trade_league_title: "Rozbić Hanzę"
 rig_control_the_trade_league_desc: "Związek Hanzeatycki składa się z państw marionetkowych, które wszystkie podlegają woli Lubeki.\nOczywiście jest to przesada, lecz członkowie związku rzadko kwestionują decyzje Lubeki. Nadszedł czas, by uświadomili sobie, jak bardzo są wykorzystywani!"
 rig_control_the_trade_league_tt: "Każdy członek ligi handlowej §Y[HSA.GetName]§! ma co najmniej §Y75§! punktów opinii o państwie §Y[Root.GetName]§!."
 rig_control_the_trade_league_ct: "Jeśli ukończymy tę misję, likwidując państwo §Y[HSA.GetName]§! lub jego ligę handlową, otrzymamy §G5§! merkantylizmu.\n\nW przeciwnym razie zostanie uruchomione wydarzenie „§YRozwiązanie Związku Hanzeatyckiego?§!” dla państwa §Y[HSA.GetName]§!."
 rig_control_the_trade_league_at: "Dominacja handlowa Rygi"
 rig_rigan_hansa_title: "Stanąć na czele ligi ryskiej"
 rig_rigan_hansa_desc: "Związek Hanzeatycki już nie istnieje. Wszelkie pozory bogactwa i ochrony, jakie niegdyś zapewniał, należą do przeszłości. Teraz to my musimy zebrać jego pozostałości i stworzyć nową ligę handlową!"
 rig_establish_bishop_authority_title: "Miasto przeciwko państwu"
 rig_establish_bishop_authority_desc: "Ryga, klejnot koronny naszego [Root.GovernmentName], znajduje się w rękach [Root.GetBurghersOrFallbackName], a nie naszych. Mieszczanie sami wybierają burmistrza, nie pytając nas o zdanie, realizują własne cele wbrew naszej woli i zarządzają miastem, nie dzieląc się owocami swojej pracy z [Root.GovernmentName].\nTrzeba z tym skończyć!"
 rig_develop_riga_title: "Rozbudować nasze miasto"
 rig_develop_riga_desc: "Teraz, gdy wreszcie udało nam się przywrócić władzę nad miastem, nadszedł czas, by je rozbudować i przekształcić ze zwykłego klejnotu w prawdziwy diament Morza Bałtyckiego!"
 rig_develop_riga_tt: "§Y[Root.GetName] musi posiadać łącznie mniej niż 6 prowincji w Europie, aby spełnić warunki uruchamianych modyfikatorów prowincji.§!"
 rig_develop_riga_ct: "Państwo §Y[Root.GetName]§! posiada mniej niż §Y6§! prowincji w §YEuropie§!."
 rig_the_rigan_defense_title: "Wzmocnić obronę Rygi"
 rig_the_rigan_defense_desc: "Otacza nas życzliwy zakon inflancki, lecz jego najnowsza historia nie daje nam pewności, że zdoła obronić nas przed Skandynawami, Rosjanami czy Litwinami. Musimy stworzyć własną armię, która zapewni bezpieczeństwo naszemu [Root.GovernmentName]."
 rig_add_cores_to_prussia_tt: "Każda prowincja z rdzeniem §Yzakonu krzyżackiego§! w §YPrusach Zachodnich§! i §YPrusach Wschodnich§! stanie się rdzeniem państwa §Y[Root.GetName]§!. Każda pozostała prowincja w §YPrusach Zachodnich§! i §YPrusach Wschodnich§! stanie się rdzeniem §Yzakonu krzyżackiego§! oraz otrzyma trwałe roszczenie państwa §Y[Root.GetName]§!."
 rig_add_cores_to_livonia_tt: "Każda prowincja z rdzeniem §Yzakonu inflanckiego§! w §YInflantach§!, §YKurlandii§! i §YEstonii§! stanie się rdzeniem państwa §Y[Root.GetName]§!. Każda pozostała prowincja w §YKurlandii§!, §YInflantach§! i §YEstonii§! stanie się rdzeniem §Yzakonu inflanckiego§! oraz otrzyma trwałe roszczenie państwa §Y[Root.GetName]§!."
 rig_subjugate_the_teutonic_order_title: "Ukarać zakon krzyżacki"
 rig_subjugate_the_teutonic_order_desc: "Żaden inny zakon rycerski nie jest tak obłudny, ekscentryczny i fanatyczny jak zakon krzyżacki. Trzeba przyznać, że znakomicie spełnił swoje zadanie — chrystianizację plemion bałtyckich — jeśli pominąć jego porażkę w Ziemi Świętej.\nMimo to nadal prowadził wojny przeciwko Polsce i Litwie, czyli dwóm monarchiom jak najbardziej katolickim. Nawet sam papież próbował poskromić ten zakon, lecz bezskutecznie.\nTeraz na nas spoczywa zadanie, któremu tak wielu nie podołało: ukarać zakon krzyżacki i podporządkować go naszej woli!"
 rig_subjugate_the_teutonic_order_tt: "Jeśli będziemy mieć §Yzakon krzyżacki§! jako poddanego, zostanie uruchomione wydarzenie „§YPodporządkowanie zakonu krzyżackiego§!”."
 rig_rule_over_the_knights_title: "Rycerze Rygi"
 rig_rule_over_the_knights_desc: "Zakony inflancki i krzyżacki są już naszymi poddanymi, lecz ich lojalność pozostawia wiele do życzenia. Musimy dopilnować, by znały swoje miejsce pod naszym panowaniem, wykorzystując ich potęgę do podbojów w regionie bałtyckim w naszym imieniu!"
 rig_rule_over_the_knights_at: "Jeśli państwo [Root.GetName] jest zwierzchnikiem §Yzakonu inflanckiego§!, zakon otrzymuje §G-25.0%§! pragnienia wolności na czas podległości. Dodatkowo zapewnia §Y[Root.GetName]§! §G+1§! relację dyplomatyczną, dopóki pozostaje poddanym."
 rig_rule_over_the_knights_bt: "Jeśli §Yzakon inflancki§! istnieje, a państwo [Root.GetName] jest jego zwierzchnikiem, zakon otrzymuje §G-25.0%§! pragnienia wolności na czas podległości państwu §Y[Root.GetName]§!. Dodatkowo zapewnia §Y[Root.GetName]§! §G+1§! relację dyplomatyczną, dopóki pozostaje poddanym."
 rig_rule_over_the_knights_ct: "Jeśli państwo [Root.GetName] jest zwierzchnikiem §Yzakonu krzyżackiego§!, zakon otrzymuje §G-25.0%§! pragnienia wolności na czas podległości. Dodatkowo zapewnia §Y[Root.GetName]§! §G+1§! relację dyplomatyczną, dopóki pozostaje poddanym."
 rig_rule_over_the_knights_dt: "Jeśli §Yzakon krzyżacki§! istnieje, a państwo [Root.GetName] jest jego zwierzchnikiem, zakon otrzymuje §G-25.0%§! pragnienia wolności na czas podległości państwu §Y[Root.GetName]§!. Dodatkowo zapewnia §Y[Root.GetName]§! §G+1§! relację dyplomatyczną, dopóki pozostaje poddanym."
 rig_rule_over_the_knights_et: "Oba modyfikatory obowiązują do chwili, gdy §Yzakon inflancki§! przestanie być poddanym państwa §Y[Root.GetName]§!."
 rig_rule_over_the_knights_ft: "Oba modyfikatory obowiązują do chwili, gdy §Yzakon krzyżacki§! przestanie być poddanym państwa §Y[Root.GetName]§!."
 not_more_than_6_provinces_outside_europe: "Posiada mniej niż §Y6§! prowincji w §YEuropie§!."
 seat_of_the_rigan_archbishopric: "Siedziba arcybiskupstwa ryskiego"
 desc_seat_of_the_rigan_archbishopric: "W tej prowincji znajduje się siedziba arcybiskupstwa ryskiego. Gdy arcybiskupowi udało się narzucić miastu swoją władzę, Ryga stała się niekwestionowaną stolicą arcybiskupstwa."
 cathedral_of_riga: "Katedra w Rydze"
 desc_cathedral_of_riga: "Katedra w Rydze jest sercem administracji miasta i życia religijnego. W tym budynku załatwiane są sprawy podatkowe i rządowe."
 market_of_riga: "Port handlowy Rygi"
 desc_market_of_riga: "Port handlowy stanowi bramę między Rosją a krajami bałtyckimi i jest głównym źródłem dochodów Rygi. Każdy szanujący się kupiec odwiedza ten targ przynajmniej raz podczas podróży z Zachodu na Wschód lub w przeciwnym kierunku."
 fortification_of_riga: "Zamek w Rydze"
 desc_fortification_of_riga: "Miejsce to początkowo służyło jako szpital dla trędowatych, a później jako zamek ryski. Umocnienia stanowią osłonę chroniącą miasto przed obcymi najeźdźcami. Służą również do szkolenia rekrutów, którzy będą bronić miasta."
 rig_tower_defenders: "Morale obrońców"
 desc_rig_tower_defenders: "Wystarczy cała armia obrońców miasta i jeden kompetentny generał, aby zainspirować żołnierzy do walki do ostatniego żołnierza."
 rig_the_rigan_orders: "Taktyka zakonów"
 desc_rig_the_rigan_orders: "Podporządkowanie obu zakonów zapewniło nam dostęp do całej ich wiedzy wojskowej. Nasza armia wie teraz, czego NIE należy robić, aby uniknąć błędów popełnionych przez zakony inflancki i krzyżacki."
 rig_livonian_overlord: "Władcy zakonu inflanckiego"
 desc_rig_livonian_overlord: "Jesteśmy suwerennym zwierzchnikiem zakonu inflanckiego. Nasze słowo jest prawem dla mistrza krajowego, nie musimy więc zajmować się uciążliwą dyplomacją.\n§YTen modyfikator wygasa, gdy tylko zakon inflancki przestanie być naszym poddanym.§!"
 rig_teutonic_overlord: "Władcy zakonu krzyżackiego"
 desc_rig_teutonic_overlord: "Jesteśmy suwerennym zwierzchnikiem zakonu krzyżackiego. Nasze słowo jest prawem dla wielkiego mistrza, nie musimy więc zajmować się uciążliwą dyplomacją.\n§YTen modyfikator wygasa, gdy tylko zakon krzyżacki przestanie być naszym poddanym.§!"
 rig_order_of_riga: "Rycerze Rygi"
 desc_rig_order_of_riga: "Jesteśmy rycerzami miasta Rygi i przysięgliśmy bronić go do ostatniego człowieka.\n\n§YTen modyfikator wygasa, gdy tylko przestaniemy być poddanym Rygi lub hrabstwa, które niegdyś było Rygą.§!"
 rig_integrated_the_livonian_confederacy: "Integracja konfederacji inflanckiej"
 desc_rig_integrated_the_livonian_confederacy: "Biskupstwa konfederacji inflanckiej przestały istnieć. Biskupi osiedlili się w naszym państwie i przysięgli wierność naszej chwalebnej ojczyźnie."
 rig_influential_religious_power: "Wpływowa potęga religijna"
 desc_rig_influential_religious_power: "Nasze oddanie sprawie uczyniło z nas niekwestionowaną potęgę o ogromnych wpływach w sprawach religijnych."
 rig_commerce_master: "Mistrzowie handlu"
 desc_rig_commerce_master: "Dominujemy w handlu i staliśmy się jego niekwestionowanymi mistrzami. Ceny rynkowe ustalają nasi kupcy, a ich wpływy nieustannie rosną."
 rig_broken_hanseatic_league: "Katastrofa Hanzy"
 desc_rig_broken_hanseatic_league: "Członkowie Związku Hanzeatyckiego uzyskali dodatkowe przywileje, które ograniczają nasze własne zyski z handlu i wymiany towarowej!"
 rig_mercenary_contracts: "Kontrakty najemnicze"
 desc_rig_mercenary_contracts: "Podpisaliśmy specjalne kontrakty najemnicze, dzięki którym możemy znacznie taniej korzystać z usług większych kompanii najemników."
 rig_founder_of_a_new_trade_league: "Nowa liga ryska"
 desc_rig_founder_of_a_new_trade_league: "W obliczu rychłego rozpadu Hanzy jej dawni członkowie szukają przywódcy, który zapewni im ochronę i bogactwo. Szukają właśnie nas!"
 rig_the_rigan_trade_league: "Ryska liga handlowa"
 desc_rig_the_rigan_trade_league: "Przewodzimy ryskiej lidze handlowej — pod każdym względem następcy Hanzy!"
 rig_dissolve_bishopric_title: "Rozwiązać biskupstwo inflanckie"
 rig_dissolve_bishopric_desc: "Aby rozwiązać konfederację inflancką, musimy zająć się każdym z poszczególnych biskupstw. Możemy zlikwidować biskupstwo siłą, lecz może to wywołać przeciwko nam powstanie."
 rig_purchase_bishopric_title: "Wykupić biskupstwo inflanckie"
 rig_purchase_bishopric_desc: "Aby rozwiązać konfederację inflancką, musimy zająć się każdym z poszczególnych biskupstw. Możemy całkowicie wykupić ich ziemie, lecz ceny wyznaczone przez biskupów mogą być znacznie wyższe, niż bylibyśmy skłonni zapłacić."
 rig_reestablish_livonian_order_title: "Odtworzyć zakon inflancki"
 rig_reestablish_livonian_order_desc: "Zakon inflancki powstał wyłącznie w celu prowadzenia krucjat przeciwko pogańskim ludom bałtyckim. Zakon przestał istnieć, lecz herezja nadal szerzy się w regionie bałtyckim. Powinniśmy ponownie go odtworzyć."
 flavor_rig.1.t: "Podporządkowanie zakonu krzyżackiego"
 flavor_rig.1.desc.a: "Zakon krzyżacki od dawna strzeże położonych na południe od nas ziem pruskich. Papież wysłał go tam pierwotnie w konkretnym celu — nawrócenia zamieszkujących te prowincje pogan. Zakon dawno jednak stracił rację bytu, hańbiąc się łupieżczymi najazdami i nękaniem nawet tych, z którymi łączy go wspólna wiara.\n\nZ woli Ojca Świętego te niesforne, zagubione dusze powróciły na drogę cnoty i prawdziwej wiary katolickiej. Ich służba przysłuży się zarówno naszej stolicy, jak i samemu Rzymowi."
 flavor_rig.1.desc.b: "Zakon krzyżacki od dawna strzeże położonych na południe od nas ziem pruskich. Papież wysłał go tam pierwotnie w konkretnym celu — nawrócenia zamieszkujących te prowincje pogan. Zakon dawno jednak stracił rację bytu, hańbiąc się łupieżczymi najazdami i nękaniem nawet tych, z którymi łączy go wspólna wiara.\n\nMimo różnic religijnych i sporów dotyczących boskości oraz wiary musimy jednak uznać ich doświadczenie i umiejętności jako zdolnych wojowników. Być może rozsądnie i roztropnie byłoby trzymać ich na krótkiej smyczy..."
 flavor_rig.1.a: "Udowodnią swoją wartość na polu bitwy."
 flavor_rig.2.t: "Upadek wpływów Rygi"
 flavor_rig.2.desc: "Przez długi czas nasz kraj pozostawał w okowach dworu w [Root.Overlord.Capital.GetCapitalName]. Ostatnie wydarzenia na zachodnich wybrzeżach Bałtyku sprawiły, że nasz dawny zwierzchnik utracił kontrolę nad naszymi lokalnymi sprawami. Korzystając z odzyskanej niepodległości, z woli Boga mogliśmy odnieść zwycięstwo nad niegdyś potężnym państwem [Root.Overlord.GetName]."
 flavor_rig.2.a: "Obyśmy już nigdy nie padli ofiarą kolejnego ambitnego zdobywcy!"
 flavor_rig.3.t: "Potęga, która była zależna"
 flavor_rig.3.desc: "Ostatnie porażki na naszych ziemiach, w połączeniu ze słabnącą władzą nad Prusami, sprawiły, że wymknął nam się z rąk słynny zakon krzyżacki. Wydarzenie to skłoniło wielu do przekonania, że zbliża się koniec świata, gdyż nasi wrogowie nacierają na nasze granice ze wszystkich stron..."
 flavor_rig.3.a: "Czy zdołamy się podnieść?"
 flavor_rig.4.t: "Utrata własnej domeny"
 flavor_rig.4.desc: "Ostatnie porażki na naszych ziemiach, w połączeniu ze słabnącą władzą nad terytorium inflanckim, sprawiły, że wymknął nam się z rąk słynny zakon inflancki. Wydarzenie to skłoniło wielu do przekonania, że zbliża się koniec świata, gdyż nasi wrogowie nacierają na nasze granice ze wszystkich stron..."
 flavor_rig.4.a: "Przyszłość spowija mgła niepewności..."
 flavor_rig.9.t: "Miejsce w Świętym Cesarstwie Rzymskim?"
 flavor_rig.9.desc: "Sytuacja w regionie bałtyckim jest rozpaczliwa. Sąsiednie zakony inflancki i pruski od dziesięcioleci toczą zaciętą walkę ze swoimi południowymi sąsiadami — Polską i Litwą. Nie możemy pozwolić, by ta niepewność trwała nadal, skoro musimy zadbać o naszą przyszłość. W tym celu możemy wysłać królewskich posłańców na dwór cesarza Świętego Cesarstwa Rzymskiego z prośbą o przyjęcie do kierowanego przez niego związku obronnego. Na naszym dworze trwa ożywiona debata w tej sprawie, ponieważ przystąpienie do Cesarstwa oznaczałoby rezygnację z części autonomii i podporządkowanie się prawu oraz jurysdykcji cesarskiej."
 flavor_rig.9.a: "Musimy przystąpić do Cesarstwa!"
 flavor_rig.9.b: "Niech sobie debatują. Pozostaniemy poza Cesarstwem."
 flavor_rig.10.t: "Religia jako interes"
 flavor_rig.10.desc: "Wiara zawsze była i pozostanie siłą napędową naszego rządu, jednak nie da się ukryć, że nasze społeczeństwo ma bardzo plutokratyczny charakter. Kupcy ze wszystkich warstw społecznych sprzedają krucyfiksy, przedmioty rzekomo pobłogosławione przez samego Pana, a także odpusty, dzięki którym można uzyskać odpuszczenie grzechów związanych z handlem takimi przedmiotami.\nReligia to interes — interes, na którym moglibyśmy skorzystać, jeśli zaangażujemy się w związaną z nią działalność handlową."
 flavor_rig.10.a: "Z pewnością Pan pozwoli nam korzystać z tych praktyk."
 flavor_rig.10.b: "Bluźnierstwo! Miłosierdzia Pańskiego nie wolno traktować jak towaru kupieckiego!"
 flavor_rig.11.desc: "Reformacja dotarła do naszego kraju, a my postanowiliśmy odwrócić się od plugawych korupcji i chciwości Kościoła katolickiego. Jednak nawet tak gorliwie wierzące państwo jak nasze musi przyznać, że te heretyckie odpusty przynoszą zyski. Doradcy [Root.Monarch.GetTitle] sugerują, byśmy nadal skupiali się na handlu i wymianie towarowej — nie dla osobistych korzyści, lecz dla dobra reformacji."
 flavor_rig.11.a: "Doradcy mają sporo racji."
 flavor_rig.11.b: "A czym różnilibyśmy się od katolików? Nie, pozostaniemy wierni reformacji."
 flavor_rig.12.t: "Rozwiązanie Związku Hanzeatyckiego?"
 flavor_rig.12.desc: "Nadchodzą ciężkie czasy! Członkowie naszej ligi stracili zaufanie do naszego przywództwa, ponieważ ich własna siła i wpływy stale rosną. Stali się tak zuchwali, że przybyła dziś rano delegacja z Rygi i zażądała rozwiązania paktu handlowego pod groźbą poważnych konsekwencji!"
 flavor_rig.12.a: "Musimy się zgodzić..."
 flavor_rig.12.a.tt: "Prestiż państwa [This.GetName] zostaje ustawiony na §R-75§!."
 flavor_rig.12.b: "Prędzej zginę, niż rozwiążę nasz pakt handlowy!"
 flavor_rig.13.t: "Kupieckie rozdroże?"
 flavor_rig.13.desc: "Słabnące wpływy kupców z Lubeki umożliwiły rozwój Rygi. Wykorzystując rosnącą pozycję, ryscy kupcy zdołali wymusić rozwiązanie Związku Hanzeatyckiego, żądając, by wszyscy jego dawni członkowie przystąpili do paktu handlowego, któremu będą teraz przewodzić. Niezależnie od tego, czy zdecydujemy się do niego dołączyć, czy pójść własną drogą, w powietrzu wciąż unosi się niepewność..."
 flavor_rig.13.a: "Ryga czy Lubeka — bez różnicy, moneta to moneta!"
 flavor_rig.13.b: "Czy to jakiś spóźniony żart primaaprilisowy?"
 swe_sca_secure_electors_title: "Uporządkować sprawy Cesarstwa"
 swe_sca_secure_electors_desc: "Święte Cesarstwo Rzymskie to mozaika ambitnych państw niemieckich, których władcy zajmują się drobnymi sporami między sobą. Cesarz najwyraźniej nie potrafi utrzymać tych książąt w ryzach.\nWarto rozszerzyć naszą strefę wpływów na Niemcy i albo zapewnić sobie lojalność elektorów, albo raz na zawsze położyć kres istnieniu Cesarstwa."
 swe_sca_secure_electors_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy ją, zdobywając poparcie elektorów, otrzymamy modyfikator „§YUbieganie się o koronę cesarską z powodzeniem§!” na §Y15 lat§!, zapewniający następujące efekty:\nRoczny prestiż: §G+1,00§!\nReputacja dyplomatyczna: §G+1,00§!\n\nW przeciwnym razie otrzymamy trwałe roszczenia do obszarów §YNowej Marchii§!, §YMittelmarku§!, §YSaksonii-Anhalt§!, §YDolnej Saksonii§!, §YWesery§!, §YFryzji§!, §YHolandii§! i §YPółnocnej Brabancji§!."
 swe_sca_low_countries_title: "Zabezpieczyć Niderlandy"
 swe_sca_low_countries_desc: "Niderlandy są ojczyzną Holendrów, narodu znanego z osiągnięć w żegludze i handlu. Ich działalność w kanale La Manche niekiedy uszczuplała nasze zyski w Lubece, lecz zazwyczaj nie utrzymywaliśmy ze sobą zbyt bliskich kontaktów.\nTeraz jednak, gdy zaczęliśmy rozszerzać nasze wpływy na Niemcy, oczywiste jest, że Holendrzy również znajdują się w kręgu naszych zainteresowań. W zależności od naszej pozycji w Świętym Cesarstwie Rzymskim powinniśmy zadbać o to, by należeli do Cesarstwa albo do naszego własnego państwa."
 swe_sca_low_countries_tt: " prowincji w obszarach §YPółnocnej Brabancji§!, §YFryzji§! i §YHolandii§!:\n  Spełniony jest jeden z poniższych warunków:\n    Właściciel należy do HRE i ma §Y100§! punktów opinii o państwie §Y[Root.GetName]§!\n    Właścicielem jest państwo §Y[Root.GetName]§! lub jego poddany"
 swe_sca_low_countries_ct: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy ją, zapewniając obszarom §YPółnocnej Brabancji§!, §YFryzji§! i §YHolandii§! przynależność do HRE, będąc jednocześnie cesarzem, otrzymamy §G25§! punktów władzy cesarskiej oraz modyfikator „§YCesarskie Niderlandy§!” na §Y25 lat§!, zapewniający następujące efekty:\nModyfikator przyrostu władzy cesarskiej: §G+50,0%§!\nPoprawa stosunków: §G+20,0%§!\n\nW przeciwnym razie każda prowincja w §YNiderlandach§! należąca do państwa §Y[Root.GetName]§! lub jego poddanych otrzyma modyfikator „§YKontrola nad Niderlandami§!” na §Y15 lat§!, zapewniający następujące efekty:\nLokalny modyfikator produkcji dóbr: §G+25,0%§!\nLata separatyzmu: §G-10§!."
 swe_sca_refine_the_carolaen_training_title: "Udoskonalić szkolenie Karolinów"
 swe_sca_refine_the_carolaen_training_desc: "Karolinowie stanowią trzon naszej armii. Ich dyscyplina i odwaga przyniosły nam wiele zwycięstw na polu bitwy.\nMają jednak jedną wadę: potrzebują rekrutów o sercach równie niezłomnych jak nasza stal, a takich żołnierzy trudno znaleźć. Powinniśmy zreformować proces rekrutacji i udoskonalić szkolenie, aby móc niezawodnie wystawiać większą liczbę Karolinów."
 swe_sca_north_germany_title: "Cesarz Niemców"
 swe_sca_north_germany_desc: "Nadszedł czas, by ktoś kompetentny, uzdolniony i obdarzony wyczuciem przejął obowiązek sprawowania rządów nad naszymi niemieckimi sąsiadami. Dotychczasowi cesarze Świętego Cesarstwa Rzymskiego radzili sobie z tym zadaniem wyjątkowo nieudolnie, dlatego to na nas spoczywa obowiązek poprowadzenia ich ku lepszej przyszłości."
 swe_sca_north_germany_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy ją, zostając cesarzem §YŚwiętego Cesarstwa Rzymskiego§!, otrzymamy §G25§! punktów władzy cesarskiej oraz modyfikator „§YImperator Romanorum§!” na §Y25 lat§!, zapewniający następujące efekty:\nReputacja dyplomatyczna: §G+3,00§!\n\nW przeciwnym razie wystąpi następujący efekt:"
 swe_sca_emperor_of_the_germans_title: "Lew Cesarstwa"
 swe_sca_emperor_of_the_germans_desc: "Znani jesteśmy jako Lew Północy — majestatyczna bestia pełna gracji i potęgi.\nOd dziś będziemy jednak znani również jako Lew Cesarstwa, ponieważ wreszcie zjednoczymy Święte Cesarstwo Rzymskie Narodu Niemieckiego pod naszym sztandarem!"
 swe_sca_emperor_of_the_germans_tt: "Prowincje z grupy kulturowej §Ygermańskiej§! nie będą odczuwać kar wynikających z nieakceptowanej kultury."
 swe_sca_incoroporate_the_hakkapeliita_title: "Włączyć kawalerię do armii"
 swe_sca_incoroporate_the_hakkapeliita_desc: "Hakkapeliici są nieodzownym elementem naszych armii. Osłaniają nasze skrzydła i sieją chaos w szeregach przeciwnika.\nNie wykorzystujemy ich jednak w pełni. Powinniśmy skupić się na dostarczaniu fińskim oddziałom najlepszych koni i najtrwalszego uzbrojenia."
 swe_sca_north_borderlands_title: "Odzyskać ziemie pogranicza"
 swe_sca_north_borderlands_desc: "Z biegiem czasu Cesarstwo utraciło wiele swoich ziem na rzecz obcych państw — najprawdopodobniej w większości z naszej własnej winy.\nJeśli jednak chcemy rozszerzyć nasze wpływy na ziemie niemieckie, musimy ponownie odzyskać te prowincje."
 sca_invest_into_work_forces_title: "Zainwestować w siłę roboczą"
 sca_invest_into_work_forces_desc: "Żaden inny stan nie ma tak kluczowego znaczenia dla rozwoju państwa jak [Root.GetBurghersOrFallbackName]. To właśnie mieszczanie inwestują w przedsięwzięcia budowlane i zapewniają stały dopływ pieniędzy do naszego [Root.GovernmentName]. Powinniśmy zainwestować w ich usługi, ponieważ mogą nam się przydać w niedalekiej przyszłości."
 sca_expand_norwegian_infrastructure_title: "Infrastruktura Gór Skandynawskich"
 sca_expand_norwegian_infrastructure_desc: "Góry Skandynawskie są bogate w żelazo i miedź, lecz ze względu na górzyste ukształtowanie terenu trudno się po nich poruszać. Powinniśmy rozwinąć infrastrukturę prowincji w tym paśmie górskim, aby rozpocząć poszukiwania nowych złóż żelaza i miedzi."
 sca_intensify_metal_production_title: "Zintensyfikować produkcję metali"
 sca_intensify_metal_production_desc: "Skandynawia obfituje w żelazo i miedź — surowce niezbędne do utrzymania silnej armii i bardzo poszukiwane na europejskim rynku. Rozbudowa wydobycia i hutnictwa pozwoli nam nie tylko wyposażyć wojska w lepszą broń, lecz także osiągać znaczne zyski z handlu w Europie."
 swe_sca_learn_from_the_danes_title: "Duńskie szkutnictwo"
 swe_sca_learn_from_the_danes_desc: "Szwedzi nie słyną ze swoich umiejętności morskich. Owszem, od zawsze budziliśmy postrach w walce na lądzie, lecz nasze okręty nie są powodem do największej dumy.\nNa szczęście nasz [Root.GovernmentName] włączył do swoich struktur Królestwo Danii, którego liczni żeglarze i szkutnicy mogą teraz służyć nam swoją wiedzą."
 swe_sca_hire_norwegian_sailors_title: "Norwescy żeglarze"
 swe_sca_hire_norwegian_sailors_desc: "Duńczycy są znakomitymi budowniczymi okrętów i admirałami, lecz to Norwegowie prowadzą te drewniane fortece do bitew morskich."
 swe_sca_hire_norwegian_sailors_at: "Odblokowuje doktrynę morską „§YNorwescy żeglarze§!”."
 swe_sca_hire_norwegian_sailors_bt: "Jeśli ukończyliśmy idee §Ymorskie§! lub §Ymorskie§! (naval), odblokujemy doktrynę morską „§YNorwescy żeglarze§!”."
 swe_sca_the_unsinkable_vasa_ii_title: "Zbudować Vasę"
 swe_sca_the_unsinkable_vasa_ii_desc: "Dzięki wiedzy Duńczyków i kunsztowi rzemieślniczemu Norwegów nadszedł czas, by zbudować okręt flagowy godny poprowadzenia naszej floty ku chwale!"
 nor_sca_rio_grande_and_california_title: "Osiedlić się w Rio Grande"
 nor_sca_rio_grande_and_california_desc: "Krążą pogłoski o bogatych złożach złota i innych cennych metali w regionach Kalifornii i Rio Grande. Musimy zasiedlić te ziemie i sprawdzić, ile prawdy kryje się w tych opowieściach."
 nor_sca_rio_grande_and_california_tt: "Każda prowincja produkująca §Yzłoto§!, należąca do państwa §Y[Root.GetName]§! lub jego poddanych, otrzyma modyfikator „§YIntensyfikacja wydobycia złota§!” na §Y25 lat§!, zapewniający następujący efekt:\nLokalna produkcja dóbr: §G+2,00§!"
 nor_sca_rio_grande_and_california_ct: "Otrzymujemy trwałe roszczenie do każdej prowincji w §YAmeryce Północnej§!, która bezpośrednio lub pośrednio należy do rywala lub wroga państwa §Y[Root.GetName]§!."
 nor_sca_control_the_panama_title: "Przejąć kontrolę nad Panamą"
 nor_sca_control_the_panama_desc: "Panama to wąski pas lądu oddzielający od siebie Ocean Spokojny i Atlantycki. Prowincja ta ma naturalnie ogromną wartość, ponieważ zapewnia dostęp do dwóch oceanów. Musimy ją zdobyć i ustanowić tam opłaty za przepływ!"
 nor_sca_control_the_panama_tt: "Opłaty panamskie"
 nor_sca_norwegian_colombia_title: "Rozszerzyć granice"
 nor_sca_norwegian_colombia_desc: "Na południe od Panamy leży region Nowej Granady — przynajmniej tak nazywają go Hiszpanie. Nie wiemy, co kryje się w tamtejszych dżunglach i górach, lecz naszym obowiązkiem jest rozszerzyć granice na południe i odkryć tajemnice Ameryki Południowej."
 nor_sca_norwegian_colombia_ct: "Otrzymujemy trwałe roszczenie do każdej prowincji w §YAmeryce Południowej§!, która bezpośrednio lub pośrednio należy do rywala lub wroga państwa §Y[Root.GetName]§!."
 nor_sca_norwegian_peru_title: "Podbój Inków"
 nor_sca_norwegian_peru_desc: "Cywilizacja Inków, zamieszkująca góry Peru, posiada ogromne zasoby złota i srebra. Powinniśmy pomóc jej uwolnić się od ciężaru posiadania tak wielkich ilości tych cennych kruszców."
 nor_sca_colonial_empire_title: "Kontroluj Amerykę Południową"
 nor_sca_colonial_empire_desc: "Podobnie jak Ameryka Północna, również Ameryka Południowa kryje liczne bogactwa i skarby. Nie możemy pozwolić, by przejęli je nasi wrogowie!"
 nor_sca_colonial_empire_tt: "Żadna prowincja w §YAmeryce Południowej§! nie należy do rywala ani wroga państwa §Y[Root.GetName]§! lub jego poddanych."
 nor_sca_landgrab_of_west_africa_title: "Wkroczyć do Afryki Zachodniej"
 nor_sca_landgrab_of_west_africa_desc: "Sam dostęp do rynków nie zapewni nam bogactwa. Jeśli naprawdę chcemy czerpać korzyści z zasobów Afryki, musimy wkroczyć w głąb kontynentu i zagarnąć je dla siebie!"
 nor_sca_consolidate_west_africa_title: "Skonsolidować Afrykę Zachodnią"
 nor_sca_consolidate_west_africa_desc: "Region Afryki Zachodniej okazuje się większy, niż początkowo sądziliśmy. Nie możemy jednak się zatrzymać, skoro jesteśmy tak blisko jego skonsolidowania."
 nor_sca_land_fall_in_congo_title: "Zbadać Afrykę Środkową"
 nor_sca_land_fall_in_congo_desc: "Prawdziwe rozmiary kontynentu afrykańskiego wciąż pozostają nieznane. Wielu awanturników i odkrywców wyruszyło, by je poznać, lecz niewielu kiedykolwiek powróciło. Musimy odkryć, co znajduje się na południe od Wybrzeża Kości Słoniowej, i założyć osady na nowych ziemiach."
 nor_sca_the_cape_title: "Zabezpieczyć Przylądek"
 nor_sca_the_cape_desc: "Morze jest dziką bestią — niebezpieczną, kapryśną i nieprzewidywalną. Na szczęście istnieją na świecie miejsca, w których morze jest oazą spokoju. Jednym z nich jest legendarny Przylądek Dobrej Nadziei. Musimy go zdobyć, aby nasze okręty zawsze miały bezpieczny port, w którym będą mogły zawinąć do brzegu."
 nor_sca_a_high_income_title: "Dochód godny floty"
 nor_sca_a_high_income_desc: "Jaką wartość ma potężna flota, jeśli nie stać nas na jej utrzymanie? Musimy zapewnić sobie wysokie dochody, które pozwolą nam zbudować najpotężniejszą flotę na świecie."
 nor_sca_expand_marines_title: "Rozbudować system leidang"
 nor_sca_expand_marines_desc: "Pobór do leidangu dobrze służył nam w przeszłości, lecz z biegiem dekad staje się przestarzały. Powinniśmy zreformować i rozbudować ten system, aby dorównał innym nowoczesnym formom poboru."
 nor_sca_kingdom_on_sea_title: "[Root.GovernmentName] na morzu"
 nor_sca_kingdom_on_sea_desc: "Od zawsze łączyła nas szczególna więź z morzem. Od narodzin naszego państwa żyliśmy dzięki morzu i ginęliśmy na nim. Teraz staniemy się jego niekwestionowanymi władcami!"
 admirals_give_army_professionalism_tt: "Rekrutacja admirałów zwiększa profesjonalizm armii o §G0,5%§!."
 nor_sca_a_mighty_fleet_title: "Potężna flota"
 nor_sca_a_mighty_fleet_desc: "Brytyjczycy z Wysp Brytyjskich, Holendrzy z Niderlandów, Portugalczycy i Hiszpanie z Półwyspu Iberyjskiego — wszystkie te narody są znakomitymi żeglarzami i zbudowały niezrównane floty. Powinniśmy pójść w ich ślady i stworzyć potężną flotę, która na nowo wyznaczy standardy jakości na morzu."
 nor_sca_a_mighty_fleet_tt: "Żadne znane państwo nie posiada potężniejszej floty niż §Y[Root.GetName]§!."
 nor_sca_handle_the_sami_title: "Zintegrować Samów"
 nor_sca_handle_the_sami_desc: "Samowie zamieszkują gęste lasy Północy, gdzie nie żyje żaden inny Skandynaw — ani Szwed, ani Norweg, ani Duńczyk. Nie utrzymują kontaktów handlowych ze światem poza swoimi ziemiami i pozostają całkowicie odizolowani. Żyją jednak na terytorium, które formalnie należy do nas. Powinniśmy zintegrować ich z naszym społeczeństwem, aby móc czerpać korzyści z tych lasów."
 nor_sca_forest_expansion_title: "Ekspansja w lasach"
 nor_sca_forest_expansion_desc: "Lasy Skandynawii pozostają w większości niezbadanymi terenami. Poza zaradnymi Samami, którzy je zamieszkują, są niemal bezludne z powodu surowych zim i niedostatku zasobów.\nLasy stanowią jednak doskonałe tereny łowieckie, obfitujące w futra, a w niektórych miejscach kryją również złoża żelaza. Warto rozszerzyć nasze panowanie na te obszary i zasiedlić nawet najbardziej niegościnne zakątki Skandynawii."
 nor_sca_conquer_the_enterpots_title: "Klejnoty Bałtyku"
 nor_sca_conquer_the_enterpots_desc: "Tylko głupiec mógłby kwestionować znaczenie Morza Bałtyckiego dla handlu między Europą Zachodnią a Wschodnią. Dowodem są liczne porty przeładunkowe i ośrodki handlowe otaczające jego wybrzeża.\nTe miasta handlowe są bezcennymi klejnotami — klejnotami, które bezpośrednio konkurują z naszymi ambicjami gospodarczymi. Powinniśmy przyłączyć je do naszego [Root.GovernmentName]."
 nor_sca_conquer_the_enterpots_tt: "Jest prowincją nadmorską graniczącą z §YMorzem Bałtyckim§! i posiadającą §Ycentrum handlu§!, modyfikator §YOpłata sundzka§! lub modyfikator prowincji §Yestuarium§!."
 nor_sca_conquer_the_enterpots_ct: "§Y[Root.GetName]§! zyskuje stałe roszczenia do całej linii brzegowej §YBałtyku§!."
 nor_sca_dominate_the_baltic_sea_title: "Dominacja na Bałtyku"
 nor_sca_dominate_the_baltic_sea_desc: "Nie możemy dłużej pozwalać, aby potencjalni rywale i wrogowie kontrolowali jakikolwiek port na Morzu Bałtyckim. Czas przejąć kontrolę nad całym wybrzeżem i zostać jedynym władcą Bałtyku!"
 dan_sca_balticum_dominance_tt: "Cała linia brzegowa §YMorza Bałtyckiego§! jest własnością §Y[Root.GetName]§!, lub jego poddanych."
 dan_establish_merc_contracts_title: "Niemieccy najemnicy"
 dan_establish_merc_contracts_desc: "Ziemie duńskie są bogate i mogą utrzymać liczną ludność, która w zamian może służyć krajowi jako żołnierze.\nDlaczego jednak mielibyśmy poświęcać życie dobrych duńskich poddanych w naszych wojnach, skoro możemy wynająć kogoś innego? Na południu, w Niemczech, znajduje się wiele kompetentnych i dobrze wyposażonych kompanii najemników. Powinniśmy nawiązać z nimi kontakt."
 dan_establish_merc_contracts_tt: " siedzib §YGermaniańskich kompanii najemniczych§!:\nWłaścicielem jest państwo §Y[Root.GetName]§! lub jego poddany albo ma co najmniej §Y100§! punktów opinii o państwie §Y[Root.GetName]§!."
 dan_establish_merc_contracts_ct: "Wydarzenie odblokuje kompanie najemnicze zależnie od tego, które siedziby utrzymują więzi z państwem §Y[Root.GetName]§! poprzez opinię lub posiadanie."
 dan_grand_merc_army_title: "Armia najemna"
 dan_grand_merc_army_desc: "Armie walczące w Europie stają się coraz liczniejsze. Musimy nadążać za nowymi standardami prowadzenia wojny, a zatem utrzymywać więcej najemników, którzy będą walczyć w naszych kampaniach."
 dan_control_the_coromandel_title: "Przejąć kontrolę nad Koromandelem"
 dan_control_the_coromandel_desc: "Region Koromandel jest centrum przemysłu tekstylnego południowych Indii. Wiele wytwarzanych tam towarów trafia do Chin, na Bliski Wschód, a ostatecznie nawet do Europy. W naszym najlepiej pojętym interesie leży przejęcie kontroli nad tą częścią Indii."
 dan_coast_of_deccan_title: "Duńskie wybrzeże Dekanu"
 dan_coast_of_deccan_desc: "Wybrzeże zachodnich Indii ma ogromne znaczenie dla umocnienia naszej pozycji na subkontynencie. Musimy je zdobyć!"
 dan_bengal_landfall_title: "Podbić Bengal"
 dan_bengal_landfall_desc: "Duńska Kompania Wschodnioindyjska od pewnego czasu działa w Indiach, lecz jej próby rozszerzenia działalności spotykają się z wrogimi działaniami państw regionu Bengalu. Powinniśmy położyć kres ich panowaniu i przyłączyć je do kompanii handlowej."
 dan_sca_merc_reforms_title: "Kwestia wojskowa"
 dan_sca_merc_reforms_desc: "Najemnicy stają się coraz rzadszym widokiem na polach bitew. Nadszedł czas, by przemyśleć nasze podejście do prowadzenia wojen i odpowiednio zreformować wojsko."
 dan_sca_annex_gujurat_title: "Zapanować nad zachodnimi Indiami"
 dan_sca_annex_gujurat_desc: "Całkowity podbój Indii jest już na wyciągnięcie ręki. Zachodnia część kraju wciąż jednak odmawia wejścia w skład naszego imperium kolonialnego. Musimy podjąć niezbędne działania, by uświadomić tamtejszym władcom ich błąd."
 dan_sca_annex_gujurat_tt: "Jeśli wcześniej ukończono misję „§YZdominować północne Indie§!”, otrzymamy do końca gry modyfikator „§YIntegracja Indii§!”, zapewniający następujące efekty:\nTolerancja pogan: §G+2.00§!\nMaksymalna tolerancja pogan: §G+1.00§!"
 dan_sca_crown_of_india_title: "Korona Indii"
 dan_sca_crown_of_india_desc: "Rozległe ziemie i bogactwa Indii znajdują się w naszym posiadaniu. Mimo to ludność Indii wciąż nie uznaje nas za swojego suwerennego cesarza. Musimy zjednoczyć cały subkontynent pod naszym sztandarem."
 dan_sca_take_north_india_title: "Zdominować północne Indie"
 dan_sca_take_north_india_desc: "Północne Indie to najbogatszy i najludniejszy region subkontynentu. To właśnie jego mieszkańcy dostarczają światu liczne towary. Powinniśmy przejąć kontrolę nad tym obszarem, aby ich praca mogła być kontynuowana bez zakłóceń."
 dan_sca_take_north_india_tt: "Jeśli wcześniej ukończono misję „§YZapanować nad zachodnimi Indiami§!”, otrzymamy do końca gry modyfikator „§YIntegracja Indii§!”, zapewniający następujące efekty:\nTolerancja pogan: §G+2.00§!\nMaksymalna tolerancja pogan: §G+1.00§!"
 dan_sca_colonize_canada_title: "Skolonizuj Kanadę"
 dan_sca_colonize_canada_desc: "Zimno. Surowo. Niektórzy uznaliby te ziemie wręcz za „niezamieszkalne”. Takie właśnie są ziemie Skandynawii.\nPodobne warunki panują w Ameryce Północnej, w regionie Kanady. Zdobycie tych ziem dla siebie jest więc całkowicie logicznym posunięciem."
 dan_sca_colonize_canada_tt: "Maksymalnie §Y5§! skolonizowanych prowincji w §YKolonialnej Kanadzie§!, należących do państwa §Y[Root.GetName]§! lub jego poddanych, otrzymuje budynek §Ykantoru§!."
 dan_colonize_canada_and_na_at: "Duńskie wpływy handlowe"
 dan_sca_colonize_louisiana_title: "Parć dalej na zachód"
 dan_sca_colonize_louisiana_desc: "Ameryka Północna obfituje w cenne surowce. Powinniśmy rozszerzyć nasze kolonie na zachód i zabezpieczyć jak najwięcej ziem."
 dan_sca_colonize_mexico_title: "Złoto Meksyku"
 dan_sca_colonize_mexico_desc: "Ameryka Północna dostarcza wielu cennych towarów, lecz serce Meksyku jest prawdziwą skrzynią skarbów, wypełnioną po brzegi złotem. Naszym najwyższym priorytetem powinno być podporządkowanie tych ziem i przetransportowanie złota do [Root.Capital.GetName]."
 dan_sca_pomeranian_conquest_title: "Podbój Pomorza"
 dan_sca_pomeranian_conquest_desc: "Aby osiągnąć prawdziwą hegemonię na Bałtyku, musimy zadbać o to, by żadne wybrzeże nie zagrażało naszemu handlowi ani bezpieczeństwu państwa. Obecnie jednak obszary Pomorza i Meklemburgii znajdują się w obcych rękach, co może być sprzeczne z naszym interesem. Powinniśmy znaleźć godnego zaufania sojusznika w północnych Niemczech, który kontroluje te wybrzeża, albo sami je podbić."
 dan_sca_prussian_conquest_title: "Podporządkować Prusy"
 dan_sca_prussian_conquest_desc: "Prusy były niegdyś zamieszkane przez Prusów, lud bałtycki, który miał nieszczęście stać się celem zakonu krzyżackiego. Choć dawni Prusowie odeszli już w przeszłość, „nowi” Prusowie założyli na tych ziemiach bogate miasta handlowe i wspaniałe fortyfikacje. Przejęcie kontroli nad Prusami i przyłączenie ich do naszego [Root.GovernmentName] przyniosłoby nam wiele korzyści."
 dan_sca_balticum_dominance_title: "Dominium Maris Baltici"
 dan_sca_balticum_dominance_desc: "Panowanie nad Morzem Bałtyckim jest przedmiotem sporów od czasu powstania królestw skandynawskich. Również państwa spoza kręgu nordyckiego próbowały podporządkować sobie Bałtyk.\nOczywiście wszystkie te państwa są głupcami, gdyż nie ma innego [Root.GovernmentName] poza naszym i tymi, którym najbardziej ufamy, które powinno rościć sobie prawa do tych wybrzeży!"
 dan_sca_livonian_conquest_title: "Okno na wschód"
 dan_sca_livonian_conquest_desc: "Ziemie Estonii, Liwonii i Kuronii są istotną częścią Bałtyku, ale są też swoistym oknem na wschód, gdyż przez nie przepływa handel ze wschodu. \nEstończycy i Łotysze mogą nie chcieć tego przyznać, ale są całkowicie bezradni wobec Rosjan na ich wschodzie. Powinniśmy włączyć ich do naszego królestwa, abyśmy mogli ich chronić przed Wschodem."
 dan_sca_handle_the_sami_title: "Zintegruj Lapończyków"
 dan_sca_handle_the_sami_desc: "Lapończycy to lud zamieszkujący gęste lasy północy, gdzie nie mieszka żaden inny Skandynaw - czy to Szwed, Norweg czy Duńczyk. Nie prowadzą oni handlu ze światem poza swoim terytorium i są całkowicie odizolowani. Żyją jednak na terytorium, które formalnie należy do nas. Powinniśmy włączyć ich do naszego społeczeństwa, abyśmy mogli czerpać korzyści z tych lasów."
 dan_sca_forest_expansion_title: "Ekspansja w lasach"
 dan_sca_forest_expansion_desc: "Lasy Skandynawii pozostają w większości niezbadanymi terenami. Poza zaradnymi Samami, którzy je zamieszkują, są niemal bezludne z powodu surowych zim i niedostatku zasobów.\nLasy stanowią jednak doskonałe tereny łowieckie, obfitujące w futra, a w niektórych miejscach kryją również złoża żelaza. Warto rozszerzyć nasze panowanie na te obszary i zasiedlić nawet najbardziej niegościnne zakątki Skandynawii."
 sca_a_grand_fleet_title: "Wielka flota nordycka"
 sca_a_grand_fleet_desc: "Hiszpańska Armada z Półwyspu Iberyjskiego, Królewska Marynarka Wojenna z Wysp Brytyjskich oraz Królewska Marynarka Wojenna Niderlandów — wszystkie te floty słyną z projekcji swojej potęgi na całym świecie. Musimy stworzyć flotę zdolną konkurować z tymi morskimi mocarstwami."
 sca_a_grand_fleet_tt: "Państwo §Y[Root.GetName]§! otrzymuje trwałe roszczenie do każdej prowincji posiadającej §Ycentrum handlu§! lub §Yestuarium§! w regionach §YKolonialnej Ameryki Wschodniej§!, §YKolonialnej Kanady§!, §YGwinei§!, §YKonga§! i §YAfryki Południowej§!."
 sca_conquer_great_britain_title: "Inwazja na Wyspy Brytyjskie"
 sca_conquer_great_britain_desc: "Ludy skandynawskie i brytyjskie mają długą, splecioną ze sobą historię, sięgającą pierwszego średniowiecznego imperium Morza Północnego. Oczywiście oba regiony rozwinęły się w różnych kierunkach, a ich losy się rozeszły.\nJednak wraz z powstaniem imperium skandynawskiego Brytyjczycy ponownie stali się rywalami zagrażającymi naszym interesom. Być może nadszedł czas, by Wyspami Brytyjskimi ponownie władał skandynawski [Root.Monarch.GetTitle]."
 sca_conquer_german_coastline_title: "Przyłączyć niemieckie wybrzeże"
 sca_conquer_german_coastline_desc: "Aby osiągnąć prawdziwą hegemonię na Bałtyku, musimy zadbać o to, by żadne wybrzeże nie zagrażało naszemu handlowi ani bezpieczeństwu państwa. Obecnie jednak obszary Pomorza i Meklemburgii znajdują się w obcych rękach, co może być sprzeczne z naszym interesem. Powinniśmy sami je podbić."
 sca_conquer_german_coastline_tt: "Każda prowincja w regionie §YPółnocnych Niemiec§! i w węźle handlowym §YLubeka§! otrzymuje modyfikator „§YIntegracja Niemiec§!” na §Y25 lat§!, zapewniający następujące efekty:\nLata separatyzmu: §G-10§!\nLokalne niepokoje: §G-2.00§!\nMiesięczna zmiana autonomii: §G-0.05§!\nLokalna wydajność produkcji: §G+10.0%§!"
 sca_unite_the_region_title: "Zjednoczyć Skandynawię"
 sca_unite_the_region_desc: "Skandynawia od zdecydowanie zbyt dawna pozostaje podzielona na trzy królestwa. Nadeszła epoka nowej, zjednoczonej Skandynawii, a ci, którzy stawią opór i nadal będą kurczowo trzymać się dawnych koron, w końcu będą musieli się nam podporządkować."
 sca_take_over_the_balitc_region_title: "Ambicje bałtyckie"
 sca_take_over_the_balitc_region_desc: "Region bałtycki obfituje w ważne miasta handlowe. Ponieważ leży nad Morzem Bałtyckim, jest rzeczą naturalną, że ziemie te powinny należeć do nas."
 sca_scandinavian_european_empire_title: "Lew Północy"
 sca_scandinavian_european_empire_desc: "Jesteśmy niekwestionowaną potęgą na Wyspach Brytyjskich; poskromicielami upartych niemieckich książąt i członków Hanzy; panami Bałtyku; nieugiętą zaporą przeciwko agresji ze Wschodu. Jesteśmy skandynawskim mocarstwem, które budzi strach nawet wśród nieustraszonych polskich husarzy i dzielnych francuskich muszkieterów.\nJesteśmy Lwem Północy!"
 sca_scandinavian_european_empire_tt: "§YTa projekcja potęgi jest trwała.§!"
 sca_eliminate_the_russian_threat_title: "Umocnić wschodnią granicę"
 sca_eliminate_the_russian_threat_desc: "Carstwo Rosji na wschodzie wielokrotnie dawało wyraz swoim wrogim zamiarom wobec Skandynawii. Musimy działać zawczasu, rozszerzać nasze wpływy na wschód i umocnić granice przed Rosjanami."
 sca_eliminate_the_russian_threat_tt: "Maksymalnie §Y5§! prowincji w regionie §YRusi§! posiadających budynek §Yfortu§! otrzymuje do końca gry modyfikator „§YUmocniona granica§!”, zapewniający następujące efekty:\nLokalna obronność: §G+50.0%§!\nLokalny rozmiar garnizonu: §G+25.0%§!\nLokalne utrzymanie fortu: §G-90.0%§!\n\nModyfikator może objąć maksymalnie §Y1§! fort w każdym obszarze."
 sca_norwegian_infrastructure_title: "Rozbudować infrastrukturę Gór Skandynawskich"
 sca_norwegian_infrastructure_desc: "Góry Skandynawskie obfitują w żelazo i miedź, lecz ze względu na górzyste ukształtowanie terenu trudno się po nich poruszać. Powinniśmy rozwinąć infrastrukturę prowincji w tym paśmie górskim, aby rozpocząć poszukiwania nowych złóż żelaza i miedzi."
 sca_industrialize_norway_title: "Uprzemysłowić Skandynawię"
 sca_industrialize_norway_desc: "Skandynawia obfituje w żelazo i miedź — surowce niezbędne do utrzymania silnej armii i bardzo poszukiwane na europejskim rynku. Rozbudowa wydobycia i hutnictwa pozwoli nam nie tylko wyposażyć wojska w lepszą broń, lecz także osiągać znaczne zyski z handlu w Europie."
 sca_good_income_title: "Niech dukaty płyną"
 sca_good_income_desc: "Choć wiele mocarstw próbuje zapanować nad światem, ostatecznie to dukat ma ostatnie słowo. Państwa powstają i upadają zależnie od jego kaprysu. Nie zamierzamy jednak stać się kolejnym imperium, które popadnie w zapomnienie."
 sca_expand_danish_agriculture_title: "Rozwinąć rolnictwo"
 sca_expand_danish_agriculture_desc: "Ziemie Jutlandii są żyzne i od stuleci zapewniają duńskiej ludności zboże, zwierzęta hodowlane oraz obfitość ryb. Ponieważ pozostałe obszary Skandynawii są mniej odpowiednie do uprawy roli, rozwój Jutlandii ma kluczowe znaczenie dla zaopatrywania reszty naszego kraju."
 sca_develop_kronborg_title: "Odnowić Kronborg"
 sca_develop_kronborg_desc: "Zamek Kronborg to fortyfikacja wzniesiona w 1420 roku przez króla Eryka Pomorskiego w jednym celu: egzekwowania opłaty sundzkiej od Hanzy. Z biegiem czasu zamek znacznie się zestarzał, a jego zdolność do kontrolowania ruchu na morzu osłabła. Powinniśmy go odnowić, aby ponownie mógł spełniać swoje zadanie."
 sca_develop_kronborg_tt: "Projekcja potęgi Kronborgu"
 sca_scandinavian_lion_title: "Imperium Północy"
 sca_scandinavian_lion_desc: "Rozszerzanie potęgi siłą i poprzez podboje to jeden z aspektów sprawnie funkcjonującego imperium. Droga wojenna nie przyniesie jednak efektów, jeśli jego rdzeń nie będzie dobrze zorganizowany.\nSkandynawia od wystarczająco dawna cierpi z powodu niedostatecznego rozwoju i infrastruktury. Nadszedł czas, by stworzyć niezrównaną bazę potęgi na dalekiej północy Europy!"
 sca_falun_copper_title: "Wydobycie w kopalni Falun"
 sca_falun_copper_desc: "Stora Kopparberget to stara kopalnia miedzi w prowincji [8.GetName], której zasoby czystej rudy miedzi zapewniają Szwecji dochody już od IX wieku. W 1347 roku, za panowania króla Magnusa IV, przedsiębiorstwo odpowiedzialne za wydobycie otrzymało kolejne przywileje, co jeszcze bardziej zwiększyło produkcję miedzi.\nStora Kopparberget odpowiada już za znaczną część naszych dochodów, lecz potencjał kopalni nie został jeszcze w pełni wykorzystany."
 sca_expand_finland_title: "Zainwestować w Finlandię"
 sca_expand_finland_desc: "Nawet jak na skandynawskie standardy Finlandia jest słabo rozwinięta. Mimo to ma ogromny potencjał. Inwestycje na ziemiach fińskich pozwolą nam wyrównać poziom ich rozwoju z resztą kraju i znacząco zwiększyć zyski z produkcji futer."
 sca_expand_finland_tt: "z prowincji Wyborg, Österbotten, Rovaniemi i obszaru Finlandii"
 sca_establish_new_scandinavia_title: "Nowa Skandynawia"
 sca_establish_new_scandinavia_desc: "Nowy Świat pełen jest możliwości i bogactw, z których nasz [Root.GovernmentName] z pewnością może skorzystać. Założenie tam osad powinno być naszym priorytetem."
 sca_establish_new_scandinavia_tt: "Obecność Skandynawii"
 sca_colonize_the_caribbeans_title: "Miejsce w słońcu"
 sca_colonize_the_caribbeans_desc: "Choć północ nazywamy naszym domem, nie da się ukryć, że tamtejsza pogoda i klimat nie należą do najprzyjemniejszych dla człowieka. Na szczęście istnieją wyspy Karaibów, które byłyby idealnym miejscem, by nasi ludzie mogli odpocząć od niekończących się zim.\nDodatkową zaletą jest to, że wyspy te mogą stać się centrum handlu w Nowym Świecie, choć to tylko dodatkowy atut."
 sca_scramble_for_africa_title: "Wyścig o Afrykę"
 sca_scramble_for_africa_desc: "Ziemie Europy zostały podzielone między kilka bloków wielkich mocarstw. Europejczycy rywalizują więc o przyczółki w Afryce, by rozszerzać swoje wpływy. Państwo [Root.GetName] nie może pozostać bez własnych posiadłości afrykańskich — musimy zorganizować ekspedycję!"
 sca_restore_the_norse_faith_title: "Przywrócić wiarę nordycką"
 sca_restore_the_norse_faith_desc: "Chrześcijaństwo dotarło do Skandynawii za sprawą niemieckich misjonarzy. Choć poddawano ich próbom, zwykle próbom ognia, przetrwali i zdołali przekonać naszych przodków do wiary chrześcijańskiej. Od tamtej pory Skandynawia stopniowo przyjmowała katolicyzm, a świątynie naszych dawnych bogów niszczono w imię Chrystusa.\nPowinniśmy naprawić szkody wyrządzone niegdyś przez naszych zwiedzionych przodków i przywrócić wiarę nordycką!"
 sca_return_of_the_north_sea_empire_title: "Imperium Morza Północnego"
 sca_return_of_the_north_sea_empire_desc: "Imperium Morza Północnego stworzył wielki Swen Widłobrody, król Danii, Norwegii i Anglii. Jego panowanie trwało jednak krótko. Po jego śmierci syn, Kanut Wielki, przejął po nim władzę, ponownie zjednoczył trzy królestwa i rządził nimi przez 19 chwalebnych lat. Choć był chrześcijaninem, za jego życia kultura wikingów osiągnęła szczyt potęgi.\n\nNadszedł czas, by odzyskać to, co słusznie nam się należy, i przywrócić Imperium Morza Północnego — tym razem pod przewodnictwem prawdziwych bogów!"
 sca_an_absolute_rule_title: "Władza absolutna"
 sca_an_absolute_rule_desc: "Absolutyzm to ustrój, w którym jeden monarcha stoi ponad prawem i skorumpowanymi stanami. Władca dba o to, by zasoby państwa trafiały tam, gdzie są najbardziej potrzebne.\nPaństwo [Root.GetName] musi przyjąć rządy absolutne, aby maksymalnie wykorzystać własne zasoby."
 sca_one_of_the_great_powers_title: "Jedno z wielkich mocarstw"
 sca_one_of_the_great_powers_desc: "Królestwa Północy rzadko postrzegano jako jedno z wielkich mocarstw wpływających na losy Europy. Nawet jeśli odgrywały taką rolę, ich wpływ na historię świata był co najwyżej przypisem.\nZmienimy to i sami staniemy się tymi, którzy piszą historię!"
 sca_the_age_of_revolution_title: "Wiek rewolucji"
 sca_the_age_of_revolution_desc: "Radykalizujące się masy szturmują pałace monarchów i wkrótce potem dokonują ich egzekucji. Rewolucjoniści powstają w najuboższych prowincjach, domagając się większych praw i lepszej przyszłości.\nDla jednych rewolucja stanowi zagrożenie dla ich władzy. Dla innych jest wybawieniem od ucisku. Musimy opowiedzieć się po jednej ze stron: przyłączyć się do niej albo ją zdławić."
 sca_swe_imperial_low_countries: "Cesarskie Niderlandy"
 desc_sca_swe_imperial_low_countries: "Umocniliśmy naszą władzę cesarską nad Niderlandami. Książęta Świętego Cesarstwa Rzymskiego darzą nas podziwem!"
 sca_swe_control_over_the_low_countries: "Kontrola nad Niderlandami"
 desc_sca_swe_control_over_the_low_countries: "Prowincja ta została podporządkowana przez Skandynawów. Wszelkie pomysły na ruch niepodległościowy zostały zduszone w zarodku na najbliższą przyszłość..."
 sca_hegemony_over_germany: "Hegemon Niemiec"
 desc_sca_hegemony_over_germany: "Prowincje należące do grupy kulturowej §Ygermańskiej§! nie odczuwają kar wynikających z nieakceptowanej kultury, dopóki ten modyfikator pozostaje aktywny.\n§YWygasa po zmianie naszej grupy kulturowej.§!\n\nOgłosiliśmy hegemonię nad ziemiami niemieckimi. W zamian za służbę na rzecz imperium skandynawskiego zapewniamy Niemcom ochronę."
 sca_hegemony_over_germany_province: "Hegemon Niemiec"
 desc_sca_hegemony_over_germany_province: "Prowincja ta należy do państwa, które samo ogłosiło się hegemonem Niemiec. Miejscowa ludność podchodzi do tych roszczeń z rezerwą, lecz docenia ochronę zapewnianą jej przez zwierzchnika."
 sca_hegemony_over_germany_province_same_culture: "Hegemon Niemiec"
 desc_sca_hegemony_over_germany_province_same_culture: "Prowincja ta należy do państwa, które samo ogłosiło się hegemonem Niemiec. Miejscowa ludność podchodzi do tych roszczeń z rezerwą, lecz docenia ochronę zapewnianą jej przez zwierzchnika."
 sca_hegemony_over_germany_tt: "do chwili zmiany naszej grupy kulturowej"
 sca_refined_carolean_recruitment: "Rozszerzona rekrutacja Karolinów"
 desc_sca_refined_carolean_recruitment: "Zreformowaliśmy i rozbudowaliśmy proces rekrutacji Karolinów, dzięki czemu możemy wystawiać ich więcej niż kiedykolwiek wcześniej."
 sca_refined_carolean_training: "Udoskonalone szkolenie Karolinów"
 desc_sca_refined_carolean_training: "Jednostki Karolinów przechodzą teraz surowsze szkolenie, dzięki czemu stają się zahartowane w boju jeszcze przed udziałem w pierwszej bitwie.\nPonadto stale rośnie liczba skarg na ich majorów, co tylko potwierdza skuteczność nowego szkolenia!"
 sca_swe_danish_shipyard: "Duńska stocznia"
 desc_sca_swe_danish_shipyard: "W tej prowincji znajduje się sprawnie działająca duńska stocznia. Budowa okrętów jest tu łatwiejsza dzięki dużym zapasom surowców zgromadzonym w stoczni."
 sca_swe_danish_shipyard_tt: "do chwili zniszczenia budynku stoczni lub wielkiej stoczni"
 sca_swe_norwegian_navy: "Norweska flota"
 desc_sca_swe_norwegian_navy: "Naszą flotę wspiera solidna marynarka norweskich żeglarzy."
 sca_nor_panama_sound_toll: "Opłaty panamskie"
 desc_sca_nor_panama_sound_toll: "Opłaty panamskie są wzorowane na opłacie sundzkiej, którą Skandynawowie nałożyli na przepływ przez Panamę. Okręty zawijające do prowincji Panama muszą uiścić opłatę, a transport towarów z jednego wybrzeża na drugie jest obciążony wysokimi podatkami."
 sca_nor_search_for_gold: "Intensyfikacja wydobycia złota"
 desc_sca_nor_search_for_gold: "Osadnicy w tej prowincji intensyfikują wysiłki, by wydobywać i przetapiać jak największe ilości złota."
 sca_nor_treasure_fleet: "Flota skarbów Nowego Świata"
 desc_sca_nor_treasure_fleet: "Złoto Nowego Świata... wystarczy jedna flota skarbów, by zasiliło nasz własny skarbiec!"
 sca_nor_curiosity_of_the_forefathers: "Skandynawska ciekawość"
 desc_sca_nor_curiosity_of_the_forefathers: "Podobnie jak nasi przodkowie przemierzali morza w poszukiwaniu nowych cudów, tak i nasi ludzie odkrywają tajemnice Ameryki Południowej."
 dan_sca_balticum_dominance_mod: "Władca Morza Bałtyckiego"
 desc_dan_sca_balticum_dominance_mod: "Kontrolujemy całe wybrzeże Morza Bałtyckiego, więc doskonale znamy jego wody. Nasza flota i kupcy są do nich dobrze przystosowani i doskonale prosperują na Bałtyku."
 sca_nor_naval_investment: "Inwestycje w infrastrukturę morską"
 desc_sca_nor_naval_investment: "Wykorzystujemy nasze zyski i dochody do rozbudowy infrastruktury przeznaczonej dla floty. Przy okazji inwestujemy również w jednostki lądowe."
 sca_nor_reformed_leidang_conscription: "Zreformowany pobór do leidangu"
 desc_sca_nor_reformed_leidang_conscription: "Dawne, średniowieczne zasady poboru do leidangu zostały całkowicie zreformowane, aby dostosować je do współczesnych standardów rekrutacji."
 sca_nor_goods_tranportation: "Globalny transport towarów"
 desc_sca_nor_goods_tranportation: "Nasza przewaga na morzu pozwala nam z łatwością transportować towary na skalę globalną."
 sca_nor_enhanced_naval_doctrines: "Udoskonalone doktryny morskie"
 desc_sca_nor_enhanced_naval_doctrines: "Budowa i utrzymanie tak wielkiej floty wymaga ogromnych nakładów pracy. Wysiłki te przynoszą jednak wymierne korzyści w zakresie budowy okrętów i rozwoju doktryn morskich."
 dan_sca_merc_contract: "Kontrakt najemniczy"
 desc_dan_sca_merc_contract: "§YRekrutacja najemników nie będzie kosztować profesjonalizmu armii, dopóki ten modyfikator pozostaje aktywny.§!\n\nPodpisaliśmy specjalny kontrakt z państwami niemieckimi, który zapewnia nam pełny dostęp do ich kompanii najemniczych."
 dan_sca_merc_contract_tt: "§YRekrutacja najemników nie będzie kosztować profesjonalizmu armii, dopóki ten modyfikator pozostaje aktywny.§!"
 dan_sca_scandinavian_india: "Rządy Skandynawii"
 desc_dan_sca_scandinavian_india: "Prowincja ta stała się częścią skandynawskiego imperium kolonialnego. Wszelki opór został zdławiony, a miejscowa ludność jest zachęcana do skupienia się na pracy."
 dan_sca_heathen_tolerance: "Integracja Indii"
 desc_dan_sca_heathen_tolerance: "Religia Indii jest nam obca i nawet nie będziemy próbować jej zrozumieć. Zależy nam wyłącznie na tym, by tamtejsza ludność nie stawała nam na drodze."
 dan_sca_grand_merc_army: "Wielka armia najemna"
 desc_dan_sca_grand_merc_army: "Znacznie rozbudowaliśmy nasze armie najemne, dzięki czemu dorównują one coraz liczniejszym armiom stałym naszych rywali."
 sca_a_north_sea_realm: "Państwo Morza Północnego"
 desc_sca_a_north_sea_realm: "Wyspy Brytyjskie, nasz największy rywal morski, zostały podporządkowane i znajdują się teraz pod naszą kontrolą. Niech każdy, kto próbuje przeciwstawić się naszym rządom, pamięta, że ostatecznie nam ulegnie — nawet jeśli ukrywa się przed nami na wyspie."
 sca_german_integration: "Integracja Niemiec"
 desc_sca_german_integration: "Niemcy zamieszkujący tę prowincję zostali zintegrowani z imperium skandynawskim. Choć żywią urazę, skandynawskie prawa zapewniają zadowolenie miejscowej ludności niemieckiej."
 sca_baltic_markets: "Rynki bałtyckie"
 desc_sca_baltic_markets: "Ponieważ jesteśmy jedynym władcą ziem bałtyckich, możemy ustalać ceny na tamtejszych rynkach według własnego uznania."
 sca_lion_of_the_north: "Lew Północy §Y(Trwały)§!"
 sca_expanded_jutland: "Rozbudowana Jutlandia"
 desc_sca_expanded_jutland: "Obszary rolnicze tej prowincji zostały znacznie rozbudowane, aby zwiększyć produkcję dóbr potrzebnych pozostałym ziemiom Skandynawii."
 sca_reinforcement_of_kronborg: "Renowacja Kronborgu"
 desc_sca_reinforcement_of_kronborg: "Zamek Kronborg został odnowiony i zmodernizowany. Posiada teraz działa o większym zasięgu, silniejsze fortyfikacje oraz większy garnizon, który może pomieścić więcej obrońców."
 sca_scandinavian_tenacity: "Skandynawska wytrwałość"
 desc_sca_scandinavian_tenacity: "Mimo życia w jednym z najzimniejszych i najbardziej niegościnnych regionów nasi ludzie nie poddają się i rozwijają. Wznieśliśmy miasta w niekończących się lasach Enare i założyliśmy górnicze metropolie w Górach Skandynawskich. Nasi ludzie są wytrwali i nie ulegają żadnym przeszkodom stawianym przez naturę."
 sca_african_trade_company: "Afrykańska kompania handlowa"
 desc_sca_african_trade_company: "Nasza ekspansja w Afryce otworzyła nowe możliwości przed Skandynawską Kompanią Handlową, która z wielkim zainteresowaniem inwestuje na naszych zamorskich terytoriach."
 sca_one_of_the_great_powers: "Gabinet dyplomatyczny wielkiego mocarstwa"
 desc_sca_one_of_the_great_powers: "Jako jedno z wielkich mocarstw świata jesteśmy zmuszeni utrzymywać stosunki dyplomatyczne z pozostałymi potęgami. Z tego względu rozbudowaliśmy gabinet dyplomatyczny Skandynawii."
 sca_revolutionary_zeal: "Rewolucyjna Skandynawia"
 desc_sca_revolutionary_zeal: "Czasy małostkowych królów i elitarnych możnowładców dobiegły końca! Niech żyje rewolucja!"
 sca_reactionary_zeal: "Zapał reakcyjny"
 desc_sca_reactionary_zeal: "Rewolucja została zdławiona, a niebezpieczne idee, które próbowała szerzyć, zostały zniszczone w zarodku."
 sca_administrative_focus: "Priorytet administracyjny"
 desc_sca_administrative_focus: "Nasz dwór skupia się na rozwijaniu umiejętności administracyjnych przyszłych władców."
 sca_diplomatic_focus: "Priorytet dyplomatyczny"
 desc_sca_diplomatic_focus: "Nasz dwór skupia się na rozwijaniu umiejętności dyplomatycznych przyszłych władców."
 sca_military_focus: "Priorytet militarny"
 desc_sca_military_focus: "Nasz dwór skupia się na rozwijaniu umiejętności wojskowych przyszłych władców."
 sca_administrative_focus_non_heir: "Priorytet administracyjny"
 desc_sca_administrative_focus_non_heir: "Nasz dwór skupia się na rozwijaniu umiejętności administracyjnych obecnego rządu."
 sca_diplomatic_focus_non_heir: "Priorytet dyplomatyczny"
 desc_sca_diplomatic_focus_non_heir: "Nasz dwór skupia się na rozwijaniu umiejętności dyplomatycznych obecnego rządu."
 sca_military_focus_non_heir: "Priorytet militarny"
 desc_sca_military_focus_non_heir: "Nasz dwór skupia się na rozwijaniu umiejętności wojskowych obecnego rządu."
 dan_sca_indian_administration: "Administracja Indii"
 desc_dan_sca_indian_administration: "Subkontynent indyjski jest ogromny i wymaga szczególnych starań, by nim zarządzać. Na szczęście skandynawska biurokracja jest doskonale przygotowana do sprostania gospodarczym i administracyjnym wyzwaniom Indii."
 got_monarchy_emperor_title: "Skarbiec cesarski"
 got_monarchy_emperor_desc: "Unia kalmarska jest potężna i dysponuje siłą morską, wojskową oraz gospodarczą, której nie jesteśmy w stanie dorównać na Gotlandii.\nNa szczęście cesarz Świętego Cesarstwa Rzymskiego ma własne porachunki z unią kalmarską, ponieważ księstwo Holsztynu de iure należy do Cesarstwa, lecz de facto jest poddanym unii. Powinniśmy zawrzeć z cesarzem układ, który zapewni nam subsydia na prowadzenie wojny."
 got_monarchy_estates_title: "Ograniczyć władzę stanów"
 got_monarchy_estates_desc: "Eryk Pomorski, poprzedni król unii kalmarskiej, został obalony przez zdradzieckich możnowładców, którzy utracili do niego zaufanie. Nie możemy dopuścić, by nasi władcy zostali zdetronizowani w podobny sposób. Należy ograniczyć władzę stanów!"
 got_monarchy_norwegian_opinion_title: "Zaufanie Norwegów"
 got_monarchy_norwegian_opinion_desc: "Po wojnie z Hanzą w 1435 roku duńska, szwedzka i norweska szlachta zdetronizowała Eryka. Oczywiste jest jednak, że obecnemu królowi unii kalmarskiej brakuje kompetencji [Root.Monarch.GetName]. Naszym obowiązkiem jest uświadomić Norwegom, że przewodzi im zwykły głupiec."
 got_monarchy_enemy_of_my_enemy_title: "Wróg mojego wroga"
 got_monarchy_enemy_of_my_enemy_desc: "Królestwo Danii zyskało wielu wrogów i rywali na przestrzeni wieków. Dla naszego przetrwania kluczowe jest nawiązanie z nimi kontaktu i prośba o sojusz."
 got_monarchy_enemy_of_my_enemy_tt: "Każdy znany rywal lub wróg państwa §Y[DAN.GetName]§!, który ma co najmniej §Y75§! punktów opinii o państwie [Root.GetName], otrzyma wydarzenie pozwalające mu wybrać sojusz z państwem §Y[Root.GetName]§!."
 got_monarchy_declare_war_title: "Wojna o koronę"
 got_monarchy_declare_war_desc: "Nadszedł czas, by odebrać to, co słusznie nam się należy!\nNadszedł czas, by wypowiedzieć wojnę unii kalmarskiej i położyć kres panowaniu fałszywego króla!"
 got_monarchy_occupy_koppenhagen_title: "Zająć [DAN.Capital.GetName]"
 got_monarchy_occupy_koppenhagen_desc: "Miasto [DAN.Capital.GetName] — stolica unii kalmarskiej, z której niegdyś rządził nasz monarcha — jest naszym najważniejszym celem wojennym. Jeśli chcemy odzyskać unię kalmarską, musimy zająć [DAN.Capital.GetName]."
 got_monarchy_execute_the_wrong_king_title: "Stracić niewłaściwego króla"
 got_monarchy_execute_the_wrong_king_desc: "Eryk Pomorski, niegdyś wielki król Danii i suwerenny władca Skandynawii... Gdy możnowładcy unii kalmarskiej wspólnie postanowili go zdetronizować, jego bratanek Christoph III von Wittelsbach zasiadł na tronie unii. Od tamtej pory ziemiami skandynawskimi rządzi obcokrajowiec — pozbawiony ogłady i kompetencji.\n\nNadszedł czas, by powiesić fałszywego króla w jego własnej stolicy i raz na zawsze przejąć tron Danii."
 got_monarchy_execute_the_wrong_king_tt: "Prowadzi wojnę z państwem §Y[DAN.GetName]§! od co najmniej §Y3 lat§!."
 got_monarchy_execute_the_wrong_king_ct: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy ją, mając państwo §Y[DAN.GetName]§! w unii personalnej z państwem §Y[Root.GetName]§! albo prowadząc wojnę z państwem §Y[DAN.GetName]§! i kontrolując §Y[DAN.Capital.GetName]§!, zostanie uruchomione wydarzenie „§YEgzekucja [DAN.Monarch.GetName]§!”.\n\nW przeciwnym razie otrzymamy §G100§! punktów administracyjnych, dyplomatycznych i wojskowych oraz casus belli §YPrzywrócenie unii§! przeciwko państwom §Y[DAN.GetName]§!, §Y[NOR.GetName]§! i §Y[SWE.GetName]§!, jeśli są niepodległe."
 got_monarchy_king_of_denmark_title: "Ponownie u steru"
 got_monarchy_king_of_denmark_desc: "Nadszedł czas, by porzucić tożsamość Gotlandii — ponownie jesteśmy królem unii kalmarskiej!"
 got_monarchy_pomerania_title: "Stosunki dynastyczne"
 got_monarchy_pomerania_desc: "Unia kalmarska jest potężna i dysponuje siłą morską, wojskową oraz gospodarczą, której nie jesteśmy w stanie dorównać na Gotlandii.\nMusimy skontaktować się z krewnymi [Root.Monarch.GetName] z dynastii [Root.Monarch.Dynasty.GetName] na kontynencie i poprosić ich o pomoc wojskową.\n\nNa szczęście nie mają oni większego powodu, by odmówić takiej prośbie. W końcu korona Danii będzie zwycięstwem nie tylko [Root.Monarch.GetName], lecz także całej dynastii [Root.Monarch.Dynasty.GetName]."
 got_monarchy_pomerania_tt: "Żadne znane państwo, które nie jest poddanym państwa §Y[Root.GetName]§!, nie ma na tronie przedstawiciela dynastii §Y[Root.Monarch.Dynasty.GetName]§!."
 got_monarchy_pomerania_bt: "Każde znane państwo, które nie jest poddanym państwa §Y[Root.GetName]§!, ma na tronie przedstawiciela dynastii §Y[Root.Monarch.Dynasty.GetName]§! i ma co najmniej §Y100§! punktów opinii o państwie §Y[Root.GetName]§!."
 got_monarchy_pomerania_ct: "Państwo §Y[Root.GetName]§! otrzymuje §G10000§! rekrutów za każde państwo, w którym panuje dynastia §Y[Root.Monarch.Dynasty.GetName]§! i które ma co najmniej §Y100§! punktów opinii o państwie §Y[Root.GetName]§!."
 got_monarchy_develop_visby_title: "Rozwinąć miasto Visby"
 got_monarchy_develop_visby_desc: "Miasto Visby jest głównym punktem zainteresowania każdego, kto odwiedza Gotlandię. Powinniśmy rozbudować je na wszelkie możliwe sposoby, aby stało się głównym portem Morza Bałtyckiego."
 got_monarchy_swedish_opinion_title: "Zabezpiecz szwedzką lojalność"
 got_monarchy_swedish_opinion_desc: "Szwecja nigdy nie była łatwym poddanym. To właśnie szwedzka szlachta jako pierwsza zdetronizowała Eryka, gdy wojna z Hanzą zaczęła przybierać niekorzystny obrót.\nSzwecja nadal należy jednak do unii kalmarskiej, dlatego w naszym interesie leży odzyskanie jej lojalności — drogą dyplomacji lub szpiegostwa."
 got_join_the_empire_title: "Ochrona cesarska"
 got_join_the_empire_desc: "Królestwa Skandynawii dążą do naszego podporządkowania. Ich siły przewyższają nasze możliwości obronne, a liczba okrętów wojennych jest większa, niż moglibyśmy kiedykolwiek wystawić przy użyciu dostępnych zasobów. Jedyną nadzieją na wyjście z tej niepewnej sytuacji jest przystąpienie do Świętego Cesarstwa Rzymskiego za wszelką cenę."
 got_republic_trade_federation_title: "Wielka federacja handlowa"
 got_republic_trade_federation_desc: "Morze Bałtyckie słynie z ożywionej działalności handlowej. Dla dobra naszej gospodarki niezwykle ważne jest założenie własnego przedsiębiorstwa handlowego na Bałtyku, abyśmy mogli czerpać korzyści z tamtejszego handlu."
 got_republic_trade_federation_tt: "Rozwój handlu gockiego"
 got_republic_dominate_the_baltic_trace_title: "Przewodzić handlowi bałtyckiemu"
 got_republic_dominate_the_baltic_trace_desc: "Rozszerzyliśmy nasze wpływy. Nadszedł czas, by właściwie je wykorzystać, rozbudować Visby i ustanowić monopol na Bałtyku."
 got_republic_dominate_lubeck_trace_title: "Rywalizować z Hanzą"
 got_republic_dominate_lubeck_trace_desc: "Hanza jest naszym największym konkurentem w handlu na Morzu Bałtyckim. Powinniśmy raz na zawsze położyć kres jej dominacji i zająć jej miejsce."
 got_republic_beyond_lubeck_title: "Handel kanałowy"
 got_republic_beyond_lubeck_desc: "Choć handel w węźle lubeckim przynosi ogromne bogactwa, nasi angielscy sąsiedzi morscy fortunę zawdzięczają kontroli nad kanałem La Manche. Powinniśmy rzucić wyzwanie ich monopolowi na tym szlaku i zdobyć należną nam część jego bogactw."
 got_republic_beyond_lubeck_tt: "Gotlandzcy kupcy "
 got_republic_trade_fleet_title: "Gotlandzka flota handlowa "
 got_republic_trade_fleet_desc: "Jesteśmy państwem wyspiarskim, którego dobrobyt opiera się przede wszystkim na sukcesach handlowych. Musimy zbudować flotę, która będzie jednocześnie naszą obroną morską i narzędziem ochrony kupców na morzu."
 got_republic_strong_mercantilism_title: "Silny merkantylizm"
 got_republic_strong_mercantilism_desc: "Aby naprawdę zdominować handel na Morzu Bałtyckim, musimy zadbać o zadowolenie naszych wewnętrznych stronnictw i obsadzić stanowiska kompetentnymi doradcami, którzy pomogą zmaksymalizować nasze zyski."
 got_republic_dominate_commerce_title: "Handlowe imperium Gotlandii"
 got_republic_dominate_commerce_desc: "Nasze potężne imperium handlowe jest gotowe ustanowić monopol na handel i władzę na Morzu Bałtyckim. Nikt, kto nie uzyska zgody naszych kupców, nie będzie mógł prowadzić działalności na Bałtyku!"
 got_republic_dominate_commerce_tt: "Odblokowuje decyzje pozwalające państwu §Y[Root.GetName]§! zamienić trwałe modyfikatory na inne."
 got_republic_mercenaries_title: "Zatrudnić najemników"
 got_republic_mercenaries_desc: "Choć my, [Root.GetAdjective], jesteśmy dumni z naszego państwa i bronimy go do ostatniego człowieka, nadal pozostajemy jedynie państwem wyspiarskim. Potrzebujemy zawodowych żołnierzy, którzy obronią nas przed zagrożeniem ze strony Skandynawii. Potrzebujemy kompetentnych najemników!"
 got_republic_get_the_sound_toll_title: "Przejąć opłatę sundzką"
 got_republic_get_the_sound_toll_desc: "Żadne inne duńskie osiągnięcie nie jest tak nikczemne jak opłata sundzka. Z jej powodu handel z resztą Europy jest praktycznie niemożliwy, dopóki trzeba płacić Duńczykom za przepływ przez cieśninę.\nPowinniśmy wyświadczyć światu przysługę i przejąć tę opłatę. Dzięki temu ich dukaty trafią przynajmniej do naszego skarbca, a nie do duńskiego."
 got_republic_compete_with_novgorod_title: "Rywalizacja z Nowogrodem"
 got_republic_compete_with_novgorod_desc: "Nowogrodzianie zamierzają zdominować handel bałtycki i skazać nas na życie w nędzy. Nie możemy do tego dopuścić!\nJedynym rozsądnym sposobem, by ich powstrzymać, jest wojna. Potrzebujemy tylko jakiegokolwiek pretekstu, by ją rozpocząć."
 got_republic_russian_kontor_title: "Kantor w Rosji"
 got_republic_russian_kontor_desc: "Choć Nowogród jest naszym konkurentem handlowym, jego stolica stanowi ważny ośrodek handlu dla naszych kupców, którzy chcą zarabiać na wymianie z Rusią. Miastu zagrażają jednak ambitne księstwa ruskie. Musimy zadbać o to, by nasza dominacja na tamtejszych rynkach nie została zakwestionowana."
 got_republic_russian_kontor_tt: "Gocka kontrola nad Nowogrodem"
 got_pirate_free_ports_title: "Piractwo na Rugii i Gotlandii"
 got_pirate_free_ports_desc: "Mówi się, że Rugia była niegdyś bazą Likedeelerów — niemieckich piratów żeglujących po Morzu Bałtyckim.\nTymczasem Gotlandia jest domem byłego króla i budzącego postrach bałtyckiego pirata Eryka VII.\n\nJako piraci Bałtyku, którzy mają choć odrobinę szacunku do samych siebie, nie tylko mamy prawo, lecz wręcz obowiązek zabezpieczyć oba te legendarne porty."
 got_pirate_global_piracy_title: "Piractwo na całym świecie"
 got_pirate_global_piracy_desc: "Łupienie statków na Morzu Bałtyckim jest dochodowe, lecz bardzo ogranicza nasze możliwości. Wiele innych portów na świecie zasługuje na naszą uwagę — i zamierzamy im ją poświęcić!"
 got_pirate_global_piracy_tt: " każdy węzeł handlowy:\n   Co najmniej §Y15%§! siły handlu pochodzi od korsarzy państwa §Y[Root.GetName]§!."
 got_pirate_beyond_the_sound_toll_title: "Poza opłatą sundzką"
 got_pirate_beyond_the_sound_toll_desc: "Nasze niewielkie morze w Europie jest łagodne i piękne, a jego spokój daje ukojenie. Żądza przygód i bogactw popycha nas jednak do poszukiwania tego, co kryje się poza opłatą sundzką. Musimy odkryć, co Nowy Świat ma do zaoferowania sercu starego pirata."
 got_pirate_take_over_the_caribbeans_title: "Piraci z Karaibów"
 got_pirate_take_over_the_caribbeans_desc: "Karaiby są centrum przepływu złota z Nowego Świata do Starego. Powinniśmy więc ustanowić tam silną obecność, aby również otrzymać należną nam część tych bogactw!"
 got_pirate_the_worst_pirate_title: "Najgorszy z piratów"
 got_pirate_the_worst_pirate_desc: "Walka składa się z dwóch elementów: umiejętności posługiwania się bronią palną i białą oraz zdolności psychicznego zdezorientowania przeciwnika. Doskonale opanowaliśmy strzelanie i zadawanie ciosów, lecz nasi załoganci z pewnością potrzebują szkolenia w trudnej sztuce obrażania innych. Port Tortuga stanie się naszym poligonem, aby nasi zawadiacy znali każdą słowną ripostę."
 got_pirate_the_pirate_fleet_title: "Piracka flota [Root.GetAdjective]"
 got_pirate_the_pirate_fleet_desc: "Czym jest pirat bez zaufanego okrętu? Nikim więcej niż marnym szczurem lądowym!\nNie możemy pozwolić, by nasza reputacja ucierpiała tylko dlatego, że byliśmy zbyt skąpi, by zainwestować w porządną flotę!"
 got_pirate_sink_the_danes_title: "Zatopić Duńczyków"
 got_pirate_sink_the_danes_desc: "Korona duńska dysponuje imponującą flotą — to oczywiste. Jeśli chcemy bez przeszkód łupić wybrzeża Morza Bałtyckiego, musimy zadbać o to, by Dania nie stanowiła dla nas zagrożenia na morzu!"
 got_pirate_kronborg_the_pirate_castle_title: "Kronborg — piracki zamek"
 got_pirate_kronborg_the_pirate_castle_desc: "Kapitan Eryk wpadł na znakomity pomysł, gdy był jeszcze królem unii kalmarskiej: ustanowił opłatę sundzką, która z łatwością opróżnia sakiewki kupców. Zamek Kronborg pilnuje zaś, by opłata ta była uiszczana.\nOczywiście zamek Kronborg doskonale nadaje się dla tak znamienitych piratów jak my. Powinniśmy odebrać go Danii."
 got_pirate_loot_london_title: "Złupić Londyn"
 got_pirate_loot_london_desc: "Anglicy otwarcie wrogo odnoszą się do naszego pirackiego procederu i postrzegają nas jako zagrożenie dla swojej hegemonii morskiej. Wzmóżmy ich strach, zdobywając ich ukochane miasto — Londyn."
 got_pirate_loot_london_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy ją, posiadając §Y[236.GetName]§! lub mając ją w posiadaniu naszego poddanego, prowincja otrzyma do końca gry modyfikator „§YPiracki port Londynu§!”, zapewniający następujące efekty:\nLokalny modyfikator liczby rekrutów: §G+100.0%§!\nLokalny modyfikator liczby marynarzy: §G+100.0%§!\nWartość handlu: §G+5§!\n\nW przeciwnym razie złupimy §Y[236.GetName]§!, powodując §Y90%§! spustoszenia oraz zdobywając ¤ i £mil£ w zależności od rozwoju prowincji §Y[236.GetName]§!."
 got_pirate_raid_the_berbers_title: "Piraci kontra Berberowie"
 got_pirate_raid_the_berbers_desc: "Berberowie z Afryki Północnej twierdzą, że są piratami. Amatorzy! Brakuje im ogłady niezbędnej do godnego łupienia wybrzeży. Pokażmy im, jak prawdziwi piraci plądrują miasta!"
 got_pirate_the_lubeck_port_title: "Wolny port Lubeki"
 got_pirate_the_lubeck_port_desc: "Nie sposób przecenić znaczenia Lubeki jako ośrodka handlowego. Miasto leży bezpośrednio na granicy między Morzem Północnym a Bałtykiem. Nic dziwnego, że stało się państwem rządzonym przez kupców.\nWszyscy wiedzą, że nawet najuczciwszy kupiec jest mniej godny zaufania niż najgorszy pirat. Powinniśmy wyświadczyć północnej Europie przysługę i przekształcić to plugawą metropolię handlową w bezpieczną przystań dla wolnomyślicieli i piratów!"
 got_pirate_raid_the_north_sea_title: "Postrach Morza Północnego"
 got_pirate_raid_the_north_sea_desc: "Dotychczas skupialiśmy się wyłącznie na piractwie na Morzu Bałtyckim. Na razie może to wystarczyć, lecz nie jest długoterminowym rozwiązaniem naszego zapotrzebowania na złoto. Musimy rozszerzyć działalność na Morze Północne i nauczyć Anglików oraz Holendrów bać się piratów [Root.GetAdjective]."
 got_pirate_loot_the_lowlands_title: "Złupić Niderlandy"
 got_pirate_loot_the_lowlands_desc: "Państwa Niderlandów produkują jedne z najlepszych i najbardziej cenionych tkanin w Europie. Byłoby wielką szkodą, gdyby flota okrętów [Root.GetAdjective] przypadkiem odwiedziła Niderlandy, zabrała te tkaniny i sprzedała je na czarnym rynku..."
 got_pirate_loot_the_lowlands_tt: "Każda prowincja w §YNiderlandach§! produkująca §Ytkaniny§! otrzymuje następujący efekt:\n\nJeśli prowincja należy do państwa §Y[Root.GetName]§! lub jego poddanych, otrzymuje modyfikator „§YGocka kontrola§!” na §Y25 lat§!, zapewniający następujące efekty:\nLokalna produkcja dóbr: §G+25.0%§!\n\nJeśli prowincja jest kontrolowana, lecz nie należy do państwa §Y[Root.GetName]§!, zostaje złupiona przez państwo §Y[Root.GetName]§!, które otrzymuje §G15§! ¤ oraz §G0.05§! rocznego dochodu państwa [Root.GetName]. Prowincja otrzymuje również modyfikator „§YGocki najazd§!” na §Y25 lat§!, zapewniający następujące efekty:\nLokalny przyrost dobrobytu: §R-0.15§!\nLokalny koszt rozwoju: §R+10.0%§!\n\nJeśli prowincja zostanie jedynie złupiona, lecz nie będzie kontrolowana, efekty te będą miały §Y50%§! swojej siły, jeśli nie znajduje się pod kontrolą państwa §Y[Root.GetName]§!."
 got_pirate_the_curia_treasure_title: "Skarbiec papieski"
 got_pirate_the_curia_treasure_desc: "Jeden z największych skarbów świata przez cały czas znajdował się tuż pod naszym nosem: papieski skarbiec kurii! To będzie śmiałe przedsięwzięcie i wielu gorliwych katolików może nas za nie znienawidzić, lecz w głębi serca wiemy, że musimy złupić kurię."
 got_pirate_raid_the_baltics_title: "Postrach Bałtyku"
 got_pirate_raid_the_baltics_desc: "Kupcy zbyt długo prowadzili niezakłócony handel na Morzu Bałtyckim. Nadszedł czas, by nauczyć ich niepokoju na sam widok naszej bandery na morzu."
 got_pirate_raid_the_baltics_at: " nadmorskich prowincji nad §YMorzem Bałtyckim§! należy do państwa §Y[Root.GetName]§! lub zostało §Yzłupionych§!."
 got_pirate_raid_the_baltics_tt: "Państwo §Y[Root.GetName]§! otrzymuje trwałe roszczenie do każdej prowincji posiadającej §Ycentrum handlu§! lub modyfikator prowincji §Yestuarium§!, położonej w obszarach §YSzlezwiku-Holsztynu§!, §YMeklemburgii§!, §YPrzedpomorza§!, §YPomorza Tylnego§!, §YPrus Zachodnich§!, §YPrus Wschodnich§!, §YKurlandii§!, §YInflant§!, §YEstonii§! lub §YPołudniowej Karelii§!."
 got_pirate_the_danzig_port_title: "Wolny port Gdańska"
 got_pirate_the_danzig_port_desc: "Gdańsk jest jednym z najważniejszych ośrodków handlowych nad Morzem Bałtyckim i siedzibą potężnej, choć dość aroganckiej warstwy kupieckiej. Znajduje się tu również jeden z największych portów morskich Bałtyku. Ten ważny port handlowy jest całkowicie marnowany w rękach kupców. Należy go wyzwolić i włączyć do pirackiej konfederacji."
 got_pirate_a_pirate_haven_title: "Piracka przystań"
 got_pirate_a_pirate_haven_desc: "Poza granicami naszej konfederacji ludzie naszego pokroju nie są mile widziani. Najwyraźniej wszyscy ci szczury lądowe nie przepadają za naszą działalnością.\nMusimy stworzyć miejsce, które piraci z północnej Europy będą mogli nazwać domem. Potrzebujemy bezpiecznej pirackiej przystani."
 got_pirate_reach_the_mediterrenean_sea_title: "Dotrzeć na Morze Śródziemne"
 got_pirate_reach_the_mediterrenean_sea_desc: "Choć nasze rodzime morze cieszy się popularnością wśród kupców, jego bogactwa bledną w porównaniu z tym, co oferuje rozległe Morze Śródziemne. Bogactwa i skarby, do których nie mamy dostępu! To musi się zmienić!"
 got_pirate_reach_the_mediterrenean_sea_tt: "Co najmniej §Y5%§! siły handlu w dowolnym węźle handlowym §YMorza Śródziemnego§! pochodzi od korsarzy państwa §Y[Root.GetName]§!."
 got_pirate_reach_the_mediterrenean_sea_ct: "Państwo §Y[Root.GetName]§! otrzymuje trwałe roszczenie do każdej wyspy na §YMorzu Śródziemnym§!."
 got_pirate_loot_venices_arsenal_title: "Złupić Arsenał"
 got_pirate_loot_venices_arsenal_desc: "Arsenał Wenecki to kompleks stoczni i zbrojowni. Choć nie jest jedynym takim obiektem, odgrywa ważną rolę w potędze morskiej Wenecji na Morzu Śródziemnym.\nZłupimy go, aby „pozyskać” część potężnych weneckich okrętów i uzbrojenia."
 create_5_galleys_tt: "§Y5§! jednostek §Ygaler§! zostanie utworzonych w prowincji §Y[This.GetName]§! dla państwa §Y[Root.GetName]§!."
 got_pirate_the_riga_port_title: "Wyzwolić port Rygi"
 got_pirate_the_riga_port_desc: "Lubeka jest portem łączącym Morze Północne z Bałtykiem, natomiast Ryga łączy handel Europy Zachodniej z Rusią.\nOczywiście my, szanowani piraci, jesteśmy żywo zainteresowani Rygą i chętnie zobaczylibyśmy ją w naszej pirackiej konfederacji."
 got_pirate_renowned_pirate_king_title: "Sławny król piratów"
 got_pirate_renowned_pirate_king_desc: "W przeszłości wielu piratów ogłaszało się „królami” swoich konfederacji. Żaden z nich nie zdołał jednak naprawdę przetrwać próby czasu.\n[Root.Monarch.GetTitle] [Root.Monarch.GetName] odmieni ten stan rzeczy i stanie się jednym z największych przywódców naszej załogi!"
 got_pirate_renowned_pirate_king_tt: "Wygrywanie wojen z państwami, które mają większy rozwój niż państwo [Root.GetName], daje teraz §G5%§! szansy na nadanie naszemu [Root.Monarch.GetTitle] statusu §YLegendarnego pirata§!.\n§YLegendarni piraci nie zużywają tradycji republikańskiej przy ponownym wyborze.§!"
 got_pirate_create_the_pirate_federation_title: "Piracka federacja"
 got_pirate_create_the_pirate_federation_desc: "Jest to dość luźna federacja i zasady są raczej 'wytycznymi', ale na pewno przyniesie to korzyści nam obu."
 flavor_got.1.t: "Roszczenia Eryka Pomorskiego"
 flavor_got.1.desc: "Nasz [Root.Monarch.GetTitle], Eryk Pomorski, był niegdyś królem Danii i przywódcą unii kalmarskiej. Wojna z Hanzą w 1435 roku oraz powstanie Engelbrekta naraziły go jednak na niebezpieczeństwo ze strony duńskiej i szwedzkiej szlachty. Ostatecznie został zdetronizowany, a jego miejsce zajął bratanek, Christoph III von Wittelsbach.\n\nMimo utraty tronu Eryk niewątpliwie zachował uzasadnione roszczenia do korony unii kalmarskiej. Pytanie brzmi, czy mieszkańcy państwa [Root.GetName] zechcą wesprzeć go w dążeniu do odzyskania tego, co mu odebrano..."
 flavor_got.1.a: "Popieramy Eryka, króla unii kalmarskiej."
 flavor_got.1.a.tt: "Odblokowuje misje §Ymonarchistyczne§! dla państwa §Y[Root.GetName]§!, które pozwolą utworzyć §YDanię§!."
 flavor_got.1.b: "Eryk nie jest niczyim królem. W najlepszym razie może być burmistrzem Gotlandii."
 flavor_got.1.b.tt: "Odblokowuje misje §Yrepublikańskie§! lub §Ypirackie§! dla państwa §Y[Root.GetName]§!, zależnie od wyboru w kolejnym wydarzeniu."
 flavor_got.2.t: "Układ z [Emperor.Monarch.GetTitle]"
 flavor_got.2.desc: "Unia kalmarska jest potężnym państwem Północy, a jej pokonanie wymaga licznych żołnierzy i zasobów. Na szczęście ma również wielu wrogów.\nJednym z nich jest Święte Cesarstwo Rzymskie, ponieważ księstwo Holsztynu stanowi przedmiot sporu między [Emperor.Monarch.GetTitle] a [DAN.Monarch.GetTitle] unii kalmarskiej.\n\n[Emperor.Monarch.GetTitle] może być zainteresowany sfinansowaniem naszej wojny przeciwko Danii."
 flavor_got.2.a: "Miejmy nadzieję, że [Emperor.Monarch.GetTitle] okaże się hojny."
 flavor_got.2.a.tt: "Poprosimy państwo §Y[Emperor.GetName]§! o wsparcie finansowe."
 flavor_got.2.b: "Nie potrzebujemy niczyjej pomocy."
 flavor_got.3.t: "Państwo [From.GetName] prosi o nasze wsparcie"
 flavor_got.3.desc: "Skontaktowali się z nami przedstawiciele niewielkiego państwa [From.GovernmentName] [From.GetName]. Proszą o wsparcie finansowe wojny z unią kalmarską, aby przywrócić prawowitego władcę na duński tron.\nChoć wsparcie wojny państwa [From.GetName] z Danią wydaje się mało korzystne, powinniśmy pamiętać, że księstwo Holsztynu — de iure należące do Świętego Cesarstwa Rzymskiego — znajduje się w rękach Duńczyków. Możemy zawrzeć układ z państwem [From.GetName] i wesprzeć je finansowo w zamian za obietnicę zwrotu księstwa Cesarstwu."
 flavor_got.3.a: "Państwo [From.GetName] otrzyma dostęp do cesarskiego skarbca w zamian za Holsztyn."
 flavor_got.3.a.tt: "Jeśli państwo §Y[From.GetName]§! zaakceptuje ten warunek i kiedykolwiek uzyska bezpośrednie lub pośrednie posiadanie prowincji §Y[13.GetName]§! lub §Y[1775.GetName]§!, otrzyma cesarskie ultimatum nakazujące zwrot tych prowincji Świętemu Cesarstwu Rzymskiemu.\nW przypadku odmowy doprowadzi to do wojny między państwami §Y[Root.GetName]§! i §Y[From.GetName]§!.\n\nPo zaakceptowaniu naszego warunku przez państwo §Y[From.GetName]§! wystąpią następujące efekty:"
 flavor_got.3.b: "Ci [From.GetAdjective] nie wydają się godni zaufania..."
 flavor_got.4.t: "Układ z [Emperor.Monarch.GetTitle]"
 flavor_got.4.desc: "Otrzymaliśmy odpowiedź od [From.Monarch.GetTitle]: państwo [From.GetName] zapewni nam dostęp do cesarskiego skarbca. W zamian żąda jednak zwrotu księstwa Holsztynu Cesarstwu po zakończeniu naszej wojny z unią kalmarską..."
 flavor_got.4.a: "To uczciwa oferta."
 flavor_got.4.a.tt: "Jeśli państwo §Y[Root.GetName]§! kiedykolwiek uzyska bezpośrednie lub pośrednie posiadanie prowincji §Y[13.GetName]§! lub §Y[1775.GetName]§!, otrzyma cesarskie ultimatum nakazujące zwrot tych prowincji Świętemu Cesarstwu Rzymskiemu.\nW przypadku odmowy doprowadzi to do wojny między państwami §Y[From.GetName]§! i §Y[Root.GetName]§!."
 flavor_got.4.b: "Ten warunek jest nie do przyjęcia."
 flavor_got.4.b.tt: "Nie będziemy niczego winni Świętemu Cesarstwu Rzymskiemu, ale nie otrzymamy drugiej szansy na poproszenie o wsparcie."
 flavor_got.5.t: "Brak układu z [Emperor.Monarch.GetTitle]"
 flavor_got.5.desc: "Otrzymaliśmy odpowiedź od [From.Monarch.GetTitle]: państwo [From.GetName] nie ufa nam na tyle, by powierzyć nam cesarski skarbiec. Niestety nie otrzymamy żadnego wsparcia ze strony Świętego Cesarstwa Rzymskiego w naszej wojnie z unią kalmarską."
 flavor_got.5.a: "Było warto spróbować..."
 flavor_got.6.t: "Państwo [From.GetName] przyjmuje układ"
 flavor_got.6.desc: "Otrzymaliśmy wiadomość od państwa [From.GetName]. Akceptują nasz warunek i obiecują, że zwrócą Księstwo Holsztynu Świętemu Cesarstwu Rzymskiemu."
 flavor_got.6.a: "Miejmy nadzieję, że dotrzymują swoich obietnic."
 flavor_got.7.t: "Państwo [From.GetName] odrzuca układ"
 flavor_got.7.desc: "Otrzymaliśmy wiadomość od państwa [From.GetName]. Odrzucają nasz warunek i rezygnują ze wsparcia finansowego Świętego Cesarstwa Rzymskiego."
 flavor_got.7.a: "To będzie ich problem."
 flavor_got.8.t: "Kwestia Holsztynu"
 flavor_got.8.desc: "Udało nam się pokonać zdradziecką unię kalmarską i zdobyć wielką potęgę w Skandynawii. Jednym z naszych najnowszych nabytków są ziemie księstwa Holsztynu, które niegdyś należały do Świętego Cesarstwa Rzymskiego.\nJeden z naszych doradców przypomniał nam, że państwo [Root.GetName] zawarło układ z Cesarstwem: w zamian za dostęp do cesarskiego skarbca państwo [Root.GetName] oficjalnie obiecało zwrócić księstwo Holsztynu Cesarstwu. Rozsądnie byłoby dotrzymać tej obietnicy, w przeciwnym razie grozi nam wyniszczająca wojna z [Emperor.Monarch.GetTitle]."
 flavor_got.8.a: "Holsztyn powróci do Cesarstwa."
 flavor_got.8.b: "Księstwo pozostanie pod naszą kontrolą."
 flavor_got.8.b.tt: "Państwo [Emperor.GetName] najprawdopodobniej wystosuje ultimatum w sprawie księstwa."
 flavor_got.9.t: "Kwestia Holsztynu"
 flavor_got.9.desc: "Państwo [From.GovernmentName] [From.GetName] zdołało pokonać unię kalmarską i przejmuje teraz kontrolę nad Skandynawią. W trakcie podbojów zdobyło również księstwo Holsztynu. Należy przypomnieć [From.Monarch.GetTitle] państwa [From.GetName], że to dukaty z cesarskiego skarbca umożliwiły mu osiągnięcie obecnej pozycji i że ma do spełnienia obietnicę."
 flavor_got.9.a: "Zgadza się. Przygotować ultimatum dla [From.Monarch.GetName], nakazujące zwrot księstwa."
 flavor_got.9.a.tt: "Wyślemy ultimatum do państwa §Y[From.GetName]§!, nakazujące mu uwolnienie księstwa Holsztynu.\nOdmowa zostanie uznana za akt agresji wobec Świętego Cesarstwa Rzymskiego i doprowadzi do §Ywojny obronnej§! przeciwko państwu §Y[From.GetName]§!."
 flavor_got.9.b: "Zostawmy kwestię Holsztynu. Mamy ważniejsze sprawy."
 flavor_got.9.b.tt: "Pozwolimy państwu §Y[From.GetName]§! zachować ziemie Holsztynu."
 flavor_got.10.t: "Holsztyn albo wojna!"
 flavor_got.10.desc: "Na nasz dwór dotarły niepokojące wieści: [From.Monarch.GetTitle] Świętego Cesarstwa Rzymskiego żąda zwrotu Holsztynu Cesarstwu w ciągu najbliższych sześciu miesięcy. W przeciwnym razie [From.Monarch.GetTitle] i [From.Monarch.GetHerHis] sojusznicy uznają naszą odmowę za akt agresji i wypowiedzą nam wojnę!"
 flavor_got.10.a: "Spełnić żądania."
 flavor_got.10.b: "Nie ulegniemy niczyim żądaniom. Holsztyn pozostanie częścią państwa [Root.GetName]!"
 flavor_got.10.b.tt: "Państwo §Y[From.GetName]§! i jego sojusznicy uznają państwo [Root.GetName] za agresora i wypowiedzą mu §Rwojnę obronną§! przeciwko państwu §Y[Root.GetName]§!."
 flavor_got.11.t: "Rozstrzygnięcie kwestii Holsztynu"
 flavor_got.11.desc: "Dziś otrzymaliśmy wiadomość od [From.Monarch.GetTitle]: zrzekają się swoich praw do Holsztynu i pozwalają nam zachować te ziemie."
 flavor_got.11.a: "Zaskakujące, ale mile widziane."
 flavor_got.12.t: "Rozstrzygnięcie kwestii Holsztynu"
 flavor_got.12.desc: "[From.Monarch.GetTitle] państwa [From.GetName] podporządkował się ultimatum. Holsztyn ponownie należy do Świętego Cesarstwa Rzymskiego."
 flavor_got.12.a: "Wspaniale."
 flavor_got.13.t: "Eskalacja sporu o Holsztyn"
 flavor_got.13.desc: "Zdradzieccy imbecyle z państwa [From.GetName] odmawiają dotrzymania obietnicy. Nadal kontrolują ziemie, które słusznie należą do Świętego Cesarstwa Rzymskiego.\nNa ten akt agresji można odpowiedzieć tylko w jeden sposób: wojną!"
 flavor_got.13.a: "Szkoda, że sprawy zaszły tak daleko."
 flavor_got.14.t: "Egzekucja [DAN.Monarch.GetName]"
 flavor_got.14.desc: "[Root.Monarch.GetName] przemierza zrujnowane ulice [DAN.Capital.GetCapitalName]. Lata wojny odcisnęły na mieście wyraźne piętno.\nWojska [Root.GetAdjective] wtargnęły do miasta, pojmały fałszywego [DAN.Monarch.GetTitle] i przyprowadziły [DAN.Monarch.GetHerHim] przed oblicze [Root.Monarch.GetName], prawowitego pretendenta do tronu unii kalmarskiej. Żołnierze [Root.Monarch.GetName] przygotowali kamienny blok na środku miasta i zmuszają teraz upokorzonego [DAN.Monarch.GetTitle], by przy nim uklęknął. Bez jednego wypowiedzianego słowa głowa [DAN.Monarch.GetName] zostaje ułożona na bloku, a kat unosi topór. Głowa fałszywego [DAN.Monarch.GetTitle] toczy się pod nogi [Root.Monarch.GetName], który odczuwa jedynie satysfakcję z pomyślnej realizacji planu."
 flavor_got.14.a: "Wraz z jego śmiercią tron wreszcie wraca w ręce, do których należy zgodnie z prawem [DAN.Monarch.GetHerHis]."
 flavor_got.15.t: "Odnowienie duńskiej korony"
 flavor_got.15.desc: "W 1435 roku prawowity król Eryk Pomorski został wygnany z Danii, a jego miejsce zajął bratanek. Za tą zdradą stali możnowładcy Norwegii, Szwecji i — co najgorsze — samej Danii.\nDziś w mieście [12.GetCapitalName] [Root.Monarch.GetTitle] [Root.Monarch.GetName] z dynastii [Root.Monarch.Dynasty.GetName], prawowity [Root.Monarch.GetTitle] unii kalmarskiej, ogłosił [Root.Monarch.GetHerHis] proklamację: korona państwa [Root.GetName] zostanie przekształcona w koronę Danii, wraz ze wszystkimi jej obowiązkami, prawami i prestiżem. Szlachta z dawnych ziem duńskich utraci swoje prawa, przywileje i majątki. Od dziś władza nowego władcy Danii będzie absolutna."
 flavor_got.15.a: "Niech żyje Drugie Królestwo Danii!"
 flavor_got.16.t: "Przywrócenie lojalności Norwegów"
 flavor_got.16.desc: "„Dość tego!” — takie nastawienie dominuje wśród norweskiej szlachty. Duńska monarchia coraz bardziej rozczarowuje norweską klasę rządzącą. Norwegowie tęsknią za czasami, gdy rządził nimi król Eryk.\n\nDyplomaci i szpiedzy [Root.GetAdjective] zasiali ideę osadzenia [Root.GetAdjective] króla na norweskim tronie. Ku zaskoczeniu [Root.Monarch.GetName] ziarno to już wydało owoce: norweska szlachta rozpoczęła otwarty bunt przeciwko duńskiemu zwierzchnikowi, a nawet część norweskiego ludu dołączyła do floty państwa [Root.GetName], by walczyć z uzurpatorem na duńskim tronie."
 flavor_got.16.a: "Norwescy żeglarze zawsze są mile widziani w naszej flocie."
 flavor_got.17.t: "Odzyskanie lojalności Szwedów"
 flavor_got.17.desc: "Choć nie było to łatwe zadanie, nasi dyplomaci i szpiedzy w końcu zdołali zjednać sobie szwedzką szlachtę. Powstanie Engelbrekta pozostawiło w Szwedach głębokie pragnienie niepodległości, lecz na szczęście szwedzcy unioniści opowiadają się teraz po stronie [Root.Monarch.GetName], [Root.Monarch.GetTitle] państwa [Root.GetName], który ma zostać kolejnym królem Szwecji."
 flavor_got.17.a: "To wspaniałe wieści."
 got_no_swedish_disloayalty_to_gotland_tt: "Wydarzenie „§YSzwedzkie marzenie o niepodległości§!” nie będzie już uruchamiane, jeśli zostaniemy seniorem unii personalnej ze Szwecją.\nDuńska misja „§YSzlachta Szwecji§!” nie będzie już wymagać ukończenia łańcucha wydarzeń, aby można ją było zaliczyć."
 flavor_got.18.t: "Prośba o sojusz od państwa [From.GetName]"
 flavor_got.18.desc: "Na nasz dwór przybyli dyplomaci z niewielkiego państwa [From.GovernmentName] [From.GetName]. Proszą o zawarcie formalnego sojuszu, który ochroni ich przed duńskim zagrożeniem."
 flavor_got.18.a: "Jeśli zaszkodzi to Danii, powinniśmy zawrzeć z nimi sojusz."
 flavor_got.18.b: "Ich problemy nie są naszymi problemami."
 flavor_got.34.t: "Okupacja [DAN.Capital.GetName]"
 flavor_got.34.desc: "Stolica Królestwa Danii upadła! Choć duńskie siły stawiały godny podziwu opór, ostatecznie nie miały szans w starciu z państwem [Root.GetName] i jego armią.\nSzlachta z podległych Danii państw zaczyna kwestionować obecny kształt unii kalmarskiej. Głosy domagające się nowego króla unii kalmarskiej stają się coraz donośniejsze!"
 flavor_got.34.a: "Prawowity władca powrócił!"
 flavor_got.37.t: "Utracone roszczenia Eryka Pomorskiego"
 flavor_got.37.desc: "Eryk Pomorski był królem unii kalmarskiej od 1412 roku do chwili, gdy w 1435 roku został zdetronizowany przez możnowładców unii. Od tamtej pory mieszkał na Gotlandii i w mniejszym lub większym stopniu sprawował władzę nad wyspą.\nZe względu na swoją przeszłość Eryk zawsze miał uzasadnione roszczenia do tronu unii kalmarskiej. Jego przedwczesna śmierć sprawia jednak, że żadne z nich nigdy się nie urzeczywistni... chyba że nowy [Root.Monarch.GetTitle] państwa [Root.GetName] postanowi przejąć roszczenia Eryka do tronu dla [Root.Monarch.GetHerselfHimself]."
 flavor_got.37.a: "Przejmę jego dziedzictwo i sam upomnę się o unię kalmarską!"
 flavor_got.37.b: "Niech jego roszczenia umrą razem z nim. Mamy inne sprawy do załatwienia."
 flavor_got.37.b.tt: "Zamienimy misje §Ymonarchistyczne§! na misje §Yrepublikańskie§! lub §Ypirackie§! dla państwa §Y[Root.GetName]§!."
 flavor_got.38.t: "Los republiki Gotlandii"
 flavor_got.38.desc: "Wyspa Gotlandia przez stulecia utrzymywała się z rybołówstwa i handlu, przy czym ten drugi stopniowo zyskiwał na znaczeniu.\nPrzybycie byłego króla Eryka Pomorskiego zmieniło jednak życie Gotlandczyków. Nie rządził wyspą jako król, lecz jako pirat, dbając o to, by żeglarze Morza Bałtyckiego nigdy nie zapomnieli jego imienia. W porównaniu z monotonią zwykłego życia ekscytacja związana z korsarstwem wydaje się wielu osobom niezwykle kusząca. Znaczna część mieszkańców Gotlandii woli jednak bezpieczniejsze i bardziej zgodne z prawem sposoby zarabiania na życie.\n\nRepublika Gotlandii stoi na rozdrożu. Obie drogi obiecują wielkie bogactwo i miejsce w księgach historii, jakiego nie zdobył nikt inny. Który los wybierze jednak ta wyspa?"
 flavor_got.38.a: "Nasze bogactwo zależy od umiejętności handlowych. Taki jest nasz los."
 flavor_got.38.b: "Życie jest zbyt krótkie, by marnować je na handel. Naszym przeznaczeniem jest piractwo!"
 flavor_got.39.t: "Miejsce w słońcu?"
 flavor_got.39.desc: "Gotlandia jest wyspą naszych przodków i portem, który wielu z nas nazywa swoim domem. Bylibyśmy jednak głupcami, gdybyśmy udawali, że jej klimat jest lepszy niż klimat tropikalnych wysp Karaibów. Wielu naszych ludzi z różnych powodów pragnie przenieść główny port na te wyspy.\n\nOczywiście musielibyśmy również bezpośrednio zintegrować naszą karaibską kolonię z administracją, lecz byłaby to niewielka cena za łatwiejszy dostęp do flot skarbów, które moglibyśmy łupić."
 flavor_got.39.a: "Mam dość tej skandynawskiej pogody. Przenosimy się na Karaiby!"
 flavor_got.39.b: "Zapomnijmy o tym. Nie możemy tak po prostu porzucić naszej dawnej ojczyzny, Gotlandii."
 flavor_got.40.desc: "Gotlandia jest wyspą naszych przodków i portem, który wielu z nas nazywa swoim domem. Bylibyśmy jednak głupcami, gdybyśmy udawali, że jej klimat jest lepszy niż klimat tropikalnych wysp Karaibów. Wielu naszych ludzi z różnych powodów pragnie przenieść główny port na te wyspy."
 flavor_got.41.t: "Wielki skok na Hayrettina Barbarossę"
 flavor_got.41.desc: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] płynie do portu w prowincji [341.GetName] na pokładzie zaledwie jednej, żałośnie małej łodzi. [Root.Monarch.GetSheHeCap] ma tylko jeden cel: zdobyć cenny okręt flagowy państwa [341.Owner.GetName] — Hayrettina Barbarossę. Towarzysze [Root.Monarch.GetHerHisCap] uważają [Root.Monarch.GetHerHim] za szaleńca, który podejmuje się takiego wyczynu, lecz determinacja [Root.Monarch.GetName] jest niezłomna.\n\nPewnego popołudnia [Root.Monarch.GetTitle] dociera do portu, a [Root.Monarch.GetHerHis] łódź tonie wskutek uszkodzenia kadłuba. Nie robi to jednak na [Root.Monarch.GetHerHim] najmniejszego wrażenia. Po krótkiej, nieplanowanej wizycie w więzieniu [Root.Monarch.GetTitle] [Root.Monarch.GetName] zdobywa poważnie uszkodzony okręt na oczach władz [341.Owner.GetAdjective]. Naturalnie [Root.Monarch.GetSheHe] zostaje zaatakowany przez ich największą chlubę — Hayrettina Barbarossę, nazwanego na cześć ich najsłynniejszego pirata.\nMarynarze [341.Owner.GetAdjective] nie spodziewali się jednak, że [Root.Monarch.GetName] zaplanował to od samego początku. Gdy więc marynarze [341.Owner.GetAdjective] weszli na pokład uszkodzonego okrętu, [Root.Monarch.GetTitle] przejął ich pusty już okręt flagowy i odpłynął z nim ku horyzontowi."
 flavor_got.41.a: "TERAZ z pewnością o mnie usłyszeli."
 flavor_got.42.t: "Wielki skok na skarbiec kurii"
 flavor_got.42.desc: "Nie ma miejsca bardziej świętego i bezpiecznego niż Bazylika św. Piotra — a dziś dzielni piraci, których serca wypełnia wyłącznie złoto grzeszników, włamują się do siedziby Stolicy Apostolskiej.\n\nO poranku wielka flota państwa [Root.GetName] zdobyła nadmorskie miasteczko Fiumicino. W porcie zacumowało kilka potężnych okrętów, a dziesiątki naszych chciwych bukanierów ruszyły na samo miasto Rzym. Choć żołnierze państwa [118.Owner.GetName] stawili godny podziwu opór, popełnili jeden fatalny błąd: stanęli między piratem a jego ukochanym skarbem!\n\nOblężenie prowincji [118.GetName] trwało kilka dni, lecz ostatecznie [118.Owner.Monarch.GetTitle] musiał skapitulować. [Root.Monarch.GetTitle] [Root.Monarch.GetName] rozkazał wówczas [Root.Monarch.GetHerHis] ludziom odstrzelić drzwi skarbca Kościoła katolickiego. Skarbiec kurii stoi otworem przed piratami państwa [Root.GetName]!"
 flavor_got.42.a: "Tak czy inaczej trafimy do piekła, ale przynajmniej zabierzemy ze sobą złoto papieża!"
 flavor_got.43.t: "Rajd na Arsenał Wenecki"
 flavor_got.43.desc: "„Śmiały plan! Kiedy ruszamy?” — pyta młody, podekscytowany bukanier. „To szaleństwo, [Root.Monarch.GetName], i dobrze o tym wiesz” — odpowiada drugi, znacznie bardziej zrzędliwy i starszy kapitan. „Ale może warto spróbować...” — dodaje wykształcony przemytnik. [Root.Monarch.GetTitle] [Root.Monarch.GetName] przedstawił [Root.Monarch.GetHerHis] załodze plan [Root.Monarch.GetHerHis] złupienia jednego z najlepiej strzeżonych arsenałów — Arsenału Weneckiego. Reakcje były... bardziej zróżnicowane, niż [Root.Monarch.GetName] się spodziewał. Kapitanowie, bukanierzy, kwatermistrzowie i przemytnicy dyskutowali bez końca o ryzyku i potencjalnych zyskach...\n\nW końcu [Root.Monarch.GetTitle] [Root.Monarch.GetName] miał dość debaty i przekonał wszystkich, wskazując na możliwe korzyści z takiego rajdu. Owszem, można było zrabować mnóstwo złota i przejąć okręty, lecz głównym celem było zdobycie weneckich planów konstrukcyjnych statków. Dzięki nim [Root.GetAdjective] staną się niezwyciężeni na morzu, a ich pirackie panowanie pozostanie niekwestionowane. Ostatecznie [Root.Monarch.GetHerHis] załoga zgodziła się wziąć udział w planie [Root.Monarch.GetHerHis].\n\nNastępnego ranka samotny, zniszczony okręt [Root.GetAdjective] wpłynął do weneckiego portu. Oczywiście galery [112.Owner.GetAdjective] zatrzymały jednostkę, którą można było uznać jedynie za kawałek unoszącego się na wodzie drewna.\nPo wejściu na wrak jeden z marynarzy [112.GetAdjective] zauważył, że łódź pachnie palonym drewnem, podczas gdy inny dostrzegł leżące na pokładzie beczki z prochem...\n\nEksplozja i kłęby dymu całkowicie zasłoniły piracką flotę [Root.GetAdjective], która następnie wpłynęła prosto do portów Arsenału Weneckiego..."
 flavor_got.43.a: "To wystarczyło, by odwrócić ich uwagę. Zabierać wszystko, co się da, z Arsenału!"
 got_imperial_coffers: "Skarbiec cesarski"
 desc_got_imperial_coffers: "Cesarz Świętego Cesarstwa Rzymskiego zapewnił nam dostęp do cesarskiego skarbca w zamian za Holsztyn."
 got_curtailing_the_estates: "Ograniczona władza stanów"
 desc_got_curtailing_the_estates: "Wyciągnęliśmy wnioski z doświadczeń Eryka Pomorskiego z czasów jego panowania w unii kalmarskiej. Władza stanów została znacznie ograniczona, a autorytet władcy jest teraz niepodważalny."
 got_war_against_the_danes: "Wojna z potęgą duńską"
 desc_got_war_against_the_danes: "Nasi ludzie stają naprzeciw przytłaczającej potęgi, lecz pozostajemy niezłomni. Pokonamy królestwa skandynawskie i sami staniemy się wielkim mocarstwem!"
 got_return_of_the_king: "Podporządkowanie Danii"
 desc_got_return_of_the_king: "Wygnany król z Gotlandii powrócił na nasz tron. Dopilnował, by żaden z duńskich możnowładców nigdy więcej nie ośmielił się podnieść głosu przeciwko jego majestatowi."
 got_restored_rightful_kalmar_union: "Odnowienie duńskiej korony"
 desc_got_restored_rightful_kalmar_union: "Pierwsze Królestwo Danii cierpiało z powodu zbyt silnego skupienia władzy na Danii i nadmiernych wpływów duńskiej szlachty — oba te czynniki doprowadziły do katastrofy, która spotkała króla Eryka w 1435 roku.\nTeraz jednak odzyskaliśmy tron, a nasza dynastia ponownie sprawuje władzę. Szlachta została osłabiona, a nasza polityka wobec unii skupia się na utrzymaniu jej jedności."
 got_rise_of_a_new_dynasty: "Powstanie nowej dynastii"
 desc_got_rise_of_a_new_dynasty: "Dynastia naszego państwa jest wyjątkowa. Dla niektórych to przerażająca myśl, lecz dla nas oznacza początek wielkiej potęgi dynastycznej."
 got_expanded_port: "Rozbudowany port w Visby"
 desc_got_expanded_port: "Dzięki ogromnym inwestycjom w rozwój port w Visby stał się niezwykle ważnym ośrodkiem handlowym na Bałtyku."
 got_investment_into_capital: "Inwestycje w Visby"
 desc_got_investment_into_capital: "Dzięki rosnącym wpływom i udziałowi w handlu na Morzu Bałtyckim mieszkańcy Visby mają środki, by inwestować w infrastrukturę swojego ukochanego miasta."
 got_lubeck_trade_fleet: "Flota handlowa Lubeki"
 desc_got_lubeck_trade_fleet: "Ponieważ jesteśmy teraz nowym właścicielem portu handlowego w Lubece, uzyskaliśmy pełny dostęp do floty kupieckiej Hanzy."
 got_merchants_of_the_baltics: "Kupcy Bałtyku"
 desc_got_merchants_of_the_baltics: "Nasza najnowsza flota może mieć zastosowanie wojskowe, lecz jej głównym celem jest zwiększenie naszej kontroli nad handlem na Morzu Bałtyckim."
 got_combat_fleet: "Uzbrojona flota handlowa"
 desc_got_combat_fleet: "Choć nasze okręty handlowe nie zostały zaprojektowane do walki, arystokraci naszego państwa wyposażyli je w więcej dział, niż kiedykolwiek przewidywano."
 got_artisan_fleet: "Flota rzemieślników"
 desc_got_artisan_fleet: "Nasza flota nie jest w pełni nastawiona ani na handel, ani na działania wojenne. Stanowi kompromis między tymi dwoma dziedzinami, skupiając się przede wszystkim na przewozie towarów i rzemieślników."
 got_aristocratic_trade_focus: "Priorytety arystokracji"
 desc_got_aristocratic_trade_focus: "Pod rządami arystokratów nasze państwo skupia się na wykorzystaniu zysków z handlu do rozwoju zaawansowanych technologii morskich i ogólnej poprawy jakości okrętów."
 got_trader_reign: "Rządy kupców"
 desc_got_trader_reign: "Pod rządami kupców nasze państwo skupia się na wzmacnianiu potęgi merkantylnej wszelkimi możliwymi sposobami oraz obsadzaniu wysokich stanowisk zaufanymi ludźmi, którzy nie potrzebują wysokich wynagrodzeń."
 got_oligarchic_guilds_rule: "Rządy gildii"
 desc_got_oligarchic_guilds_rule: "Pod rządami gildii nasze państwo skupia się na wykorzystaniu zysków z handlu do utrzymania stabilności i dobrej kondycji gospodarczej kraju."
 got_baltic_military_power: "Wojskowe priorytety arystokracji"
 desc_got_baltic_military_power: "Arystokraci naszego państwa przeznaczają swoje zasoby na obronę narodową naszej ukochanej republiki."
 got_baltic_monopoly: "Handlowe priorytety kupców"
 desc_got_baltic_monopoly: "Kupcy naszego państwa przeznaczają swoje zasoby na maksymalizację zysków z handlu i rozszerzanie naszych globalnych wpływów."
 got_baltic_maritime_empire: "Biurokratyczne priorytety gildii"
 desc_got_baltic_maritime_empire: "Gildie naszego państwa przeznaczają swoje zasoby na utrzymanie stabilności republiki i doskonalenie administracji."
 got_the_art_of_insults: "Sztuka obelg"
 desc_got_the_art_of_insults: "Walkę wygrywa się przede wszystkim w głowie. Posługując się najbardziej plugawymi i absurdalnymi obelgami, nasi bukanierzy dezorientują przeciwnika, zanim zadadzą mu ostateczny cios."
 got_global_piracy: "Piractwo na całym świecie"
 desc_got_global_piracy: "Czarne bandery naszych okrętów budzą postrach na całym świecie! Nasze jednostki docierają do najdalszych zakątków globu, czego nie mógłby dokonać żaden inny pirat!"
 got_dread_of_the_baltic_sea: "Postrach Morza Bałtyckiego"
 desc_got_dread_of_the_baltic_sea: "Nasze chwalebne zwycięstwo nad duńską flotą napełnia serca „cywilizowanych” państw strachem i przerażeniem. Nie odważą się zjednoczyć przeciwko nam!"
 got_pirate_port_of_london: "Piracki port Londynu"
 desc_got_pirate_port_of_london: "Londyn wpadł w ręce piratów. Służy teraz jako wolny port piratów Morza Północnego, w którym obowiązuje wyłącznie Kodeks Piracki."
 got_free_pirate_port: "Wolny port piracki"
 desc_got_free_pirate_port: "Prowincja ta jest wolnym portem pirackim. W zamian za opłaty za naprawę okrętów miejscowa ludność może żyć w spokoju.\nWielu młodych rekrutów spragnionych przygód dołącza do piratów w tej prowincji."
 got_piratical_control: "Gocka kontrola"
 desc_got_piratical_control: "Prowincja ta znajduje się pod kontrolą piratów gockich. Mimo brutalnego traktowania ludności klasa robotnicza odpowiedzialna za produkcję tkanin jest traktowana przez pirackich zwierzchników z niezwykłym szacunkiem."
 got_heavily_looted: "Gocki najazd"
 desc_got_heavily_looted: "Prowincja ta została złupiona i splądrowana przez piratów gockich. Miną lata, zanim podniesie się po niespodziewanym ataku tych bukanierów..."
 got_quite_looted: "Gocki najazd"
 desc_got_quite_looted: "Prowincja ta została zaatakowana przez piratów gockich. Miną lata, zanim podniesie się po niespodziewanym ataku tych bukanierów..."
 got_finest_pirate_cloths: "Najlepsze pirackie tkaniny"
 desc_got_finest_pirate_cloths: "Nasz najazd na Niderlandy zakończył się pełnym sukcesem. Teraz nasi załoganci dysponują najlepszymi tkaninami, jakie ma do zaoferowania Europa.\nNic nie dorównuje łupieniu — chyba że łupienie w dobrym stylu."
 got_the_buccaneers_focus: "Pirackie priorytety bukanierów"
 desc_got_the_buccaneers_focus: "Bukanierzy stoją na czele luźnej konfederacji pirackiej. Zgodnie z ich zasadami nasi żeglarze i okręty będą wykorzystywać dostępne zasoby, by utrzymać kruchą stabilność, którą się cieszymy."
 got_the_smugglers_focus: "Pirackie priorytety przemytników"
 desc_got_the_smugglers_focus: "Przemytnicy stoją na czele luźnej konfederacji pirackiej. Zgodnie z ich zasadami nasi żeglarze i okręty będą wykorzystywać dostępne zasoby, by maksymalizować wszelkie osiągane zyski."
 got_the_captains_focus: "Pirackie priorytety kapitanów"
 desc_got_the_captains_focus: "Kapitanowie stoją na czele luźnej konfederacji pirackiej. Zgodnie z ich zasadami nasi żeglarze i okręty będą wykorzystywać dostępne zasoby, by przygotować załogi do nadchodzących bitew."
 got_stolen_weapons_of_the_venetian_arsenal: "Uzbrojenie Arsenału Weneckiego"
 desc_got_stolen_weapons_of_the_venetian_arsenal: "Rajd na Arsenał Wenecki zapewnił nam pełny dostęp do uzbrojenia weneckiej floty. Te działa i plany konstrukcyjne okrętów z pewnością dobrze przysłużą się piratom gockim."
 got_choose_aristocratic_gutnish_imperial_focus_title: "Przyjąć priorytety arystokracji"
 got_choose_aristocratic_gutnish_imperial_focus_desc: "Nasza obecna sytuacja jest rozpaczliwa. Musimy ponownie przemyśleć nasze priorytety i przyjąć sposób rozwiązywania problemów proponowany przez arystokratów."
 got_choose_traders_gutnish_imperial_focus_title: "Przyjąć priorytety kupców"
 got_choose_traders_gutnish_imperial_focus_desc: "Nasza obecna sytuacja jest rozpaczliwa. Musimy ponownie przemyśleć nasze priorytety i przyjąć sposób rozwiązywania problemów proponowany przez kupców."
 got_choose_guilds_gutnish_imperial_focus_title: "Przyjąć priorytety gildii"
 got_choose_guilds_gutnish_imperial_focus_desc: "Nasza obecna sytuacja jest rozpaczliwa. Musimy ponownie przemyśleć nasze priorytety i przyjąć sposób rozwiązywania problemów proponowany przez gildie."
 got_choose_the_buccaneers_focus_title: "Wybrać pirackie priorytety bukanierów"
 got_choose_the_buccaneers_focus_desc: "Nasza obecna sytuacja wymaga, by bukanierzy przejęli władzę i ukierunkowali działania konfederacji pirackiej na utrzymanie jedności tego luźnego związku."
 got_choose_the_smugglers_focus_title: "Wybrać pirackie priorytety przemytników"
 got_choose_the_smugglers_focus_desc: "Nasza obecna sytuacja wymaga, by przemytnicy przejęli władzę i ukierunkowali działania konfederacji pirackiej na maksymalizację naszych zysków."
 got_choose_the_captains_focus_title: "Wybrać pirackie priorytety kapitanów"
 got_choose_the_captains_focus_desc: "Nasza obecna sytuacja wymaga, by kapitanowie przejęli władzę i ukierunkowali działania konfederacji pirackiej na zdyscyplinowaną walkę z wrogami na morzu i lądzie."
 LTG: "Łatgalia"
 LTG_ADJ: "łatgalski"
 NORTH_SEA_EMPIRE: "Imperium Morza Północnego"
 NORTH_SEA_EMPIRE_ADJ: "nordycki"
 baltic_german: "bałtycka"
 norse: "nordycki"
 livonian: "inflancki"
 incident_teutonic_order_wants_to_join: "Krzyżacy i Cesarstwo"
 incident_teutonic_order_wants_to_join_emperor_alert: "[TEU.Monarch.GetTitle] z [TEU.GetAdjective] chce dołączyć do Świętego Cesarstwa Rzymskiego."
 incident_teutonic_order_wants_to_join_member_alert: "[TEU.Monarch.GetTitle] z [TEU.GetAdjective] chce dołączyć do Świętego Cesarstwa Rzymskiego."
 couronian_nation_baltic_german_title: "Przyjąć tożsamość kurlandzką"
 couronian_nation_baltic_german_desc: "Nasze państwo zostało zredukowane do Kurlandii, ziem Łotyszy. Trzymanie się dawnych tradycji i tożsamości narodowej nie przynosi już nikomu korzyści. Powinniśmy zaakceptować naszą nową ojczyznę i związać się z Łotyszami. Przyjmijmy nową tożsamość bałtyckiego księstwa, które włada Łotyszami z Kurlandii."
 livonian_nation_title: "Przekształcić się w Inflanty"
 livonian_nation_desc: "Epoka rycerzy krzyżowych szybko przemija. Nadejdzie czas, gdy nie będziemy już czerpać żadnych korzyści z zachowywania pozorów zakonu monastycznego. Poza tym mistrz krajowy znacznie chętniej zostałby księciem... a może nawet królem. Przekształcenie się w świeckie państwo pozwoli nam ożywić administrację i zdobyć szacunek sąsiadów."
 livonian_nation_batlic_german_title: "Utworzyć Inflanty"
 livonian_nation_batlic_german_desc: "Ziemie Kurlandii, Inflant i Estonii należały niegdyś do zakonu inflanckiego. Jeśli zakon nie wywiąże się ze swojego zadania, możemy zająć jego miejsce i zapoczątkować nową epokę dobrobytu oraz inflanckiej odwagi."
 sell_indulgence_title: "Zaoferować odpust"
 sell_indulgence_desc: "Zaoferuj odpust [From.Monarch.GetTitle] państwa [From.GetName] @[From.GetTag], aby [From.Monarch.GetHerHis] odpokutował za swoje grzechy.\n\nWydaj §Y50§! punktów wpływu papieskiego, aby zaoferować odpust państwu §Y[From.GetName]§!. Jeśli oferta zostanie przyjęta, państwo [From.GetName] przekaże dochód z §G3 miesięcy§! państwu §Y[Root.GetName]§!, a w zamian otrzyma §G1§! punkt stabilności i §G10§! prestiżu.\n\n§YZwiększa pragnienie reformacji o §R0.25%§!.§!"
 sell_indulgence_tooltip: "Zaoferuj odpust, aby uwolnić ich od grzechów."
 sell_indulgence_dialog: "Państwo [This.GetName] oferuje odpust państwu [Root.GetName]. Przyjęcie oferty będzie nas kosztować dochód z §R3 miesięcy§!, lecz w zamian otrzymamy §G1§! punkt stabilności i §G10§! prestiżu.\n\n§YPrzyjęcie oferty zwiększy pragnienie reformacji o §R0.25%§!.§!"
 sell_indulgence_alert_tooltip: "Otrzymaliśmy ofertę odpustu."
 sell_indulgence_catholic: "§R- Państwo §Y[From.GetName]§! musi wyznawać katolicyzm.§!"
 sell_indulgence_pope: "§R- Nie zaleca się sprzedawania odpustów samemu papieżowi, chyba że chcemy spłonąć na stosie.§!"
 sell_indulgence_subject: "§R- Nie możemy sprzedawać odpustów państwom podległym.§!"
 sell_indulgence_pi: "§R- Sprzedaż odpustów wymaga co najmniej §Y50§! punktów wpływu papieskiego.§!"
 sell_indulgence_war: "§R- Nie możemy sprzedawać odpustów naszym wrogom wojennym.§!"
 STABILITY_AI_MODIFIER: "Stabilność"
 CANNOT_AFFORD_IT_AI_MODIFIER: "Brak wystarczających środków"
 NUM_OF_LOANS_AI_MODIFIER: "Liczba pożyczek"
 CANNOT_DECLARE_WARS_TEUTONS_HRE: "Sztuczna inteligencja nie może wypowiadać wojen innym członkom HRE"
 venetian_merchant_republic: "Rząd wenecki"
 venetian_merchant_republic_desc: "Najjaśniejsza Republika Wenecka stosuje złożony i skomplikowany system wyboru urzędników państwowych. Seria tajnych głosowań wyłania 41 elektorów, z których każdy wrzuca następnie głos do urny. Z urny losuje się jedną kartę, a człowiek, którego nazwisko na niej widnieje, zostaje nowym dożą. System ten ma przeciwdziałać korupcji wyborczej i zapewnić uczciwy wybór."
 republic_and_religion: "Religia w republice"
 tribe_mechanic: "Plemię"
 great_veche_republic: "Wielka republika wiecowa"
 great_veche_republic_desc: "Wiec w naszym państwie zyskał większy wpływ na administrację rządową, oprócz dotychczasowych uprawnień ustawodawczych i sądowniczych. Podczas gdy inni mają carów lub cesarzy, my mamy radę, której władza przewyższa wszystko, o czym mogłaby marzyć jakakolwiek inna republika."
 religious_values_reform: "Wartości religijne"
 religious_values_reform_desc: "Religia odgrywa w naszej republice równie ważną rolę co prawo głosu. Religijne aspekty naszego państwa pomagają nam wybrać właściwą osobę w chwilach wątpliwości, a duchowieństwo dba o pobożny przebieg rządów."
 democratic_values_reform: "Rządy merytokratyczne"
 democratic_values_reform_desc: "Nasza republika nie wybiera władców na podstawie koneksji ani wpływów oligarchów. Zamiast tego ludność głosuje na kandydatów według ich umiejętności. Ten system merytokracji nie różnicuje ludzi ze względu na płeć i obejmuje wszystkie dziedziny naszego społeczeństwa."
 aristocratic_values_reform: "Cnoty politei"
 aristocratic_values_reform_desc: "Oligarchowie nie mogą rządzić bez poparcia ludu, a lud nie potrafi samodzielnie decydować, czego chce. Aby republika mogła sprawnie funkcjonować, musimy chronić wartości zarówno zwykłych ludzi, jak i tych, którzy sprawują władzę."
 mechanic_reelection_depowers_estates_yes: "Ponowny wybór zmniejsza wpływy stanów o §Y10%§!"
 REELCTION_DEPOWER_ESTATES: "Ponownie wybrano tego samego władcę"
 force_reelection_reform: "Sformalizować prawo do ponownego wyboru"
 force_reelection_reform_desc: "Nawet w tak chwalebnej republice jak nasza państwem rządzi jednostka, a jednostki mają skłonność do wykorzystywania władzy dla osobistych korzyści. Wprowadźmy prawo klasy rządzącej do wymuszenia ponownych wyborów w chwilach wątpliwości."
 mechanic_can_force_election_yes: "Można wymusić ponowne wybory"
 force_reelection_title: "Wymusić ponowne wybory"
 force_reelection_desc: "Lojalność obecnego [Root.Monarch.GetTitle] wobec naszej republiki jest kwestionowana. Nadszedł czas, by zarządzić nadzwyczajne ponowne wybory i pozwolić ludowi natychmiast oddać głosy na [Root.Monarch.GetHerHis] następcę!"
 force_reelection_tt: "Nie wymuszono ponownych wyborów w ciągu ostatnich §Y15 lat§!."
 force_reelection_ct: "§YPonowny wybór tego samego władcy będzie kosztować §R50%§! tradycji republikańskiej.§!"
 devotee_to_the_people_reform: "Oddanie ludowi"
 devotee_to_the_people_reform_desc: "Rządzenie republiką nie jest zadaniem, które można wykonywać tymczasowo. Aby naprawdę służyć ludowi i republice, nasi władcy muszą przez całe życie wypełniać obowiązki związane ze swoją władzą i odpowiedzialnością."
 cultural_administration_reform: "Administracja kulturowa"
 cultural_administration_reform_desc: "Nasz kraj jest domem dla wielu odmiennych kultur, obcych naszej własnej. Aby ograniczyć napięcia wewnętrzne, państwo dzieli się według kultur, a każda z nich wybiera swojego przedstawiciela odpowiedzialnego za jej administrację."
 attorney_general_reform: "Prokurator generalny"
 attorney_general_reform_desc: "Prokurator generalny jest głównym doradcą prawnym naszego rządu i odpowiada za wymiar sprawiedliwości w kraju. Taki podział władzy zapewnia bezpieczeństwo ludności i ułatwia integrację nowo przyłączonych poddanych."
 mechanic_republican_tradition_from_advisors_yes: "Doradcy zwiększają roczną tradycję republikańską o §G0.02§! za każdy poziom"
 estate_council_reform: "Zwierzchnictwo sejmu"
 estate_council_reform_desc: "Prezydent sprawuje władzę w kraju, lecz uprawnienia sądownicze i wykonawcze znajdują się w rękach stanów. W związku z tym wzmocniliśmy rolę sejmu w zarządzaniu licznymi aspektami republiki."
 mechanic_can_not_seize_land_yes: "Nie można odebrać królewszczyzny"
 can_not_seize_land: "Nie można odebrać królewszczyzny"
 mechanic_can_not_seize_land: "Nie można odebrać królewszczyzny"
 mechanic_diet_increases_not_influence_yes: "Zwoływanie zgromadzeń nie zwiększa już wpływu"
 mechanic_elections_influence_estates_yes: "Wybory wpływają na stany"
 mechanic_republican_tradition_from_diets_yes: "Zwołanie sejmu zwiększa tradycję republikańską o §G2§! (wartość zależy od długości kadencji)"
 mechanic_seizing_land_no_rebels_yes: "Przejmowanie ziemi koronnej nie wywołuje buntów"
 mechanic_absolutism_reduction_on_ruler_death_yes: "Utrata §Y60§! absolutyzmu po wyborze nowego władcy"
 mechanic_absolutism_resets_on_ruler_death_yes: "Absolutyzm zostaje wyzerowany po wyborze nowego władcy"
 mechanic_reelection_increases_absolutism_yes: "Ponowny wybór zwiększa absolutyzm o §G10§! za każdą kadencję wyborczą"
 ADD_ABSOLUTISM_BASED_ON_ELECTION_TERM: "Uzyskany absolutyzm zostaje pomnożony przez §G[Root.election_term.GetValue]§! ze względu na liczbę kadencji (§Y[Root.election_term.GetValue]§!) §Y[Root.Monarch.GetName]§!."
 consolidate_power_to_the_ruler_reform: "Skonsolidowana władza"
 consolidate_power_to_the_ruler_reform_desc: "Niektórzy mogą uznać tę praktykę za antyrepublikańską, lecz nie da się zaprzeczyć, że rządy absolutne mają swoje zalety. Skupiając całą władzę w rękach naszego władcy, możemy zapewnić krajowi możliwość dorównania otaczającym nas monarchiom absolutnym."
 consolidate_power_into_different_candidates_reform: "Nowi ludzie"
 consolidate_power_into_different_candidates_reform_desc: "Nasza republika nie może ufać osobom zbyt długo utrzymującym się u władzy. Wolimy wybierać nowych ludzi, którzy nie zostali uwikłani w korupcję i podejrzane interesy."
 stability_principle_reform: "Zasada obrony"
 stability_principle_reform_desc: "Najważniejszą zasadą naszej republiki jest ochrona ludu. Choć temat ten nie cieszy się popularnością w naszym rządzie, musimy utrzymywać siły zbrojne zdolne do samoobrony i zachowania wewnętrznej stabilności."
 military_rulership_reform: "Rządy wojskowe"
 military_rulership_reform_desc: "Republika jest solą w oku wielu potencjalnych wrogów, którzy pragną ją zniszczyć. Dla bezpieczeństwa kraju powierzyliśmy generałom stery rządów. Niech ich doświadczenie i miłość do ojczyzny chronią republikę. \n\nWyłącza wybory."
 dynastic_rulership_reform: "Rządy dynastyczne"
 dynastic_rulership_reform_desc: "Powiązania są potężniejsze niż jakikolwiek miecz. Ustanowienie dynastii na politycznym czele państwa pozwala nam budować stosunki dyplomatyczne z monarchiami, a jednocześnie zachować republikańskie zasady.\nTo, że wybrany władca wydaje się członkiem tej samej rodziny, jest jedynie czystym przypadkiem."
 power_to_the_raiders_reform: "Zwiększyć władzę bukanierów"
 power_to_the_raiders_reform_desc: "Bukanierzy stanowią trzon naszej wolnej pirackiej przystani. Bez nich łupy zrabowane bogatym kupcom nie trafiałyby do naszych skrzyń. Rozszerzając zakres ich swobody działania, możemy zapewnić sobie stały napływ nowych łupów."
 power_to_the_captains_reform: "Władza w rękach kapitanów"
 power_to_the_captains_reform_desc: "Powiedzmy sobie szczerze: czym jest pirat bez okrętu? Co najwyżej marnym złodziejaszkiem. Powierzając władzę kapitanom, uzyskamy dostęp do najlepszych okrętów, jakie ma do zaoferowania świat."
 power_to_the_smugglers_reform: "Władza dla przemytników"
 power_to_the_smugglers_reform_desc: "Nie całe złoto pochodzi z odnalezionych skarbów lub zrabowanych statków kupieckich. Część zysków przynosi handel towarami, które niektórzy uznają za nielegalne. Dla przemytników legalność jest oczywiście raczej sugestią niż zasadą. Przyznając im dodatkową władzę, ułatwimy im przenikanie na rynki."
 mechanic_enables_estate_church_yes: "Odblokowuje stan §Yduchowieństwa§!."
 mechanic_enables_estate_nobles_yes: "Odblokowuje stan §Yszlachty§!."
 mechanic_enables_estate_burghers_yes: "Odblokowuje stan §Ymieszczan§!."
 mechanic_enables_estate_cossacks_yes: "Odblokowuje stan §YKozaków§!."
 mechanic_enables_estate_dhimmi_yes: "Odblokowuje stan §Ydhimmi§!."
 mechanic_enables_estate_nomadic_tribes_yes: "Odblokowuje stan §Yplemion§!."
 mechanic_enables_estate_brahmins_yes: "Odblokowuje stan §Ybraminów§!."
 mechanic_enables_estate_maratha_yes: "Odblokowuje stan §YMarathów§!."
 mechanic_enables_estate_vaisyas_yes: "Odblokowuje stan §Ywaiśjów§!."
 mechanic_enables_estate_jains_yes: "Odblokowuje stan §Ydżinistów§!."
 mechanic_enables_estate_rajput_yes: "Odblokowuje stan §Yradźputów§!."
 estate_quartersmasters: "Kwatermistrzowie"
 high_sea_power_projection: "Złupione wybrzeża"
 raiding_increases_pp: "Najazdy zwiększają projekcję potęgi"
 estate_imperial_nobility: "Cesarska szlachta"
 establish_religious_institution_for_pirates_reform: "Ustanowić instytucje religijne"
 establish_religious_institution_for_pirates_reform_desc: "Choć wielu naszych załogantów dawno przestało wierzyć w jakiekolwiek bóstwo poza samym morzem, w naszych szeregach wciąż są piraci równie pobożni jak kapłani. Ich interpretacja wiary jest jednak nieco mniej... restrykcyjna."
 crew_before_faith_reform: "Załoga ponad wiarą"
 crew_before_faith_reform_desc: "Nasi ludzie pochodzą z najróżniejszych zakątków świata. Łączy ich jednak jedno: bogowie, w których niegdyś wierzyli, dawno ich opuścili. Mogą polegać już tylko na swoich towarzyszach z załogi."
 respect_for_the_sea_reform: "Szacunek dla morza"
 respect_for_the_sea_reform_desc: "Na pełnym morzu żadna wiara cię nie uratuje. Nie ma boga, który ocali twoją duszę.\nJest tylko Davy Jones i jego morska otchłań, w której wszyscy ostatecznie skończymy."
 relgious_freedom_reform: "Pełna wolność religijna"
 relgious_freedom_reform_desc: "Nie ma znaczenia, w co wierzy pirat. W jednego boga, wielu bogów czy w żadnego — nikogo z naszych ludzi to nie obchodzi. Znacznie ważniejsze jest to, ile złota można ze sobą zabrać."
 the_pirate_ways_reform: "Droga korsarza"
 the_pirate_ways_reform_desc: "Wśród państw przestrzegających prawa nie ma dla nas miejsca. Nie ufają nam, a my nie mamy powodu, by ufać im. Ostatecznie jedynym towarzyszem, którego możemy mieć u boku, jest inny łotr."
 PIRATE_DENIED_ALLIANCE: "Nie możemy zawierać sojuszy z państwami, które nie wywiesiły czarnej bandery."
 FROM_PIRATE_DENIED_ALLIANCE: "Ustrój państwa [From.GetName] nie pozwala mu zawierać sojuszy z republikami niepirackimi."
 mechanic_cannot_ally_non_pirates_yes: "Nie można zawierać sojuszy z państwami innymi niż §Yrepubliki pirackie§!"
 break_every_non_pirate_alliance_tt: "Każdy sojusznik niebędący §Yrepubliką piracką§! zerwie sojusz z państwem §Y[Root.GetName]§!."
 blocks_other_reforms_for_this_level_for_10_years_tt: "Blokuje inne reformy tego samego poziomu ustroju na §Y10 lat§!."
 had_the_pirate_ways_reform_tt: "Posiadało reformę „§YDroga korsarza§!” przez §Y10 lat§!."
 military_principle_reform: "Zasada wojskowa"
 military_principle_reform_desc: "Republikę otaczają wrogowie pragnący zniszczenia naszego państwa i przywrócenia monarchii. Naszym najwyższym priorytetem — naszą zasadą — jest wykorzystanie potęgi wojskowej do rozszerzania republiki."
 mechanic_winning_wars_gives_rt_yes: "Wygrane wojny zapewniają §G5§! punktów tradycji republikańskiej (oddzielne pokoje nie są uwzględniane)"
 enlightened_principle_reform: "Zasada oświecenia"
 enlightened_principle_reform_desc: "Oświecenie stanowi kolejny intelektualny i filozoficzny etap rozwoju naszego społeczeństwa. Przyjęcie idei oświecenia jest naszą zasadą, która pozwoli nam wkroczyć w nową epokę."
 empowered_quartermasters_reform: "Wzmocnić kwatermistrzów"
 empowered_quartermasters_reform_desc: "Kapitanowie dowodzą załogą, bukanierzy walczą, a przemytnicy handlują, lecz to kwatermistrzowie dbają o funkcjonowanie pirackiego przedsięwzięcia. Organizują racje żywnościowe, planują najazdy i opracowują Kodeks Piracki.\nAby nasza konfederacja mogła sprawnie funkcjonować, powinniśmy przyznać kwatermistrzom większą władzę."
 open_naval_services_reform: "Otwarte usługi stoczniowe"
 open_naval_services_reform_desc: "Jesteśmy piratami, którzy lubią łupić statki kupieckie i palić całe porty. Jesteśmy jednak również rzemieślnikami, którzy niejednokrotnie musieli samodzielnie naprawiać własne okręty. Powinniśmy zaoferować naszą wiedzę w zakresie budowy i naprawy statków kupcom, którzy nie stanowią dobrego celu dla naszych zwykłych korsarskich wypraw."
 naval_supplies_bonus_prod: "Otwarte usługi stoczniowe"
 desc_naval_supplies_bonus_prod: "Prowincja ta produkuje dodatkowe zaopatrzenie morskie."
 mechanic_extra_trade_goods_from_naval_supplies_yes: "Produkcja §Yzaopatrzenia morskiego§!: §G+100.0%§!"
 master_smugglers_reform: "Układ przemytników"
 master_smugglers_reform_desc: "Rozpoczęcie handlu z prawdziwymi państwami, które mają swoje prawa i zasady, jest niemal niemożliwe. Zupełnie inaczej wygląda jednak handel z niektórymi ich bogatymi obywatelami.\nPrzemytnicy mają osobiste kontakty z kilkoma bogatymi przywódcami kompanii najemniczych, którzy chętnie nas wesprą w zamian za część naszych... legalnie pozyskanych towarów."
 cutthroat_approach_reform: "Łowcy nagród"
 cutthroat_approach_reform_desc: "Nie całe złoto trzeba zdobywać dzięki najazdom i korsarstwu. Możemy napełniać skarbiec, odbierając nagrody wyznaczane przez państwa świata za okręty flagowe ich rywali."
 mechanic_flagship_bounty_hunter_yes: "Zniszczenie wrogiego okrętu flagowego zapewnia §G1§! roczny dochód i §G10§! tradycji morskiej (premie są podwojone, jeśli okręt flagowy zostanie przejęty)"
 rule_through_plunder_reform: "Rządy poprzez łupienie"
 rule_through_plunder_reform_desc: "Żyjemy w świecie, w którym nikt nikomu nie ufa, a jedynym sposobem utrzymania jakiejkolwiek władzy są obietnice łupów. Na szczęście nasi ludzie doskonale rozumieją tę zasadę."
 pirate_representation_reform: "Rada piracka"
 pirate_representation_reform_desc: "Możemy działać poza wszelkim prawem cesarskim, ale nie jesteśmy niezorganizowaną bandą przestępców wbijających sobie noże w plecy. Każdy wolny port naszej konfederacji jest siedzibą wpływowego kapitana. Kapitanowie ci tworzą Radę Piracką, która pilnuje przestrzegania wewnętrznych zasad konfederacji."
 unified_piratical_confederacy_reform: "Zjednoczona konfederacja piracka"
 unified_piratical_confederacy_reform_desc: "Nasze „państwo” zawsze było luźną konfederacją różnych pirackich okrętów, ich kapitanów i kwatermistrzów. Ostatnie zmiany w administracji konfederacji przekształciły ją jednak w rzeczywiste samorządne państwo, posiadające własne organy władzy wykonawczej, ustawodawczej i sądowniczej.\nJesteśmy prawdziwym państwem pirackim!"
 scourge_of_the_seven_sea_reform: "Postrach siedmiu mórz"
 scourge_of_the_seven_sea_reform_desc: "Prawdziwa natura pirata przejawia się nie tylko w miłości do błyszczących skarbów, lecz także w żądzy walki nawet w najbardziej beznadziejnych bitwach. Jako szanowani korsarze mamy obowiązek w pełni przyjąć te cechy piractwa."
 mechanic_raiding_increases_pp_yes: "Łupienie wybrzeży zwiększa projekcję potęgi o §G+1§!"
 neutral_ground_reform: "Polityka neutralnego portu"
 neutral_ground_reform_desc: "Stojimy poza prawem. Oczywiście przynosi nam to niepożądane skutki uboczne, takie jak listy gończe wystawiane przez wielkie mocarstwa. Dzięki temu nasze porty są jednak idealnym miejscem na „neutralny grunt” dla rywalizujących piratów, kolonii, a nawet wspomnianych mocarstw, ponieważ nie opowiadamy się zdecydowanie po żadnej ze stron."
 mechanic_vassals_can_hoist_the_black_flag_yes: "Poddani mogą teraz §Ywywiesić czarną banderę§!"
 mechanic_pirate_vassal_bonus_yes: "Otrzymujemy następujące modyfikatory za każdego §Ypirackiego poddanego republikańskiego§!:\nPrzyrost rekrutów: §G+4000§!\nPrzyrost marynarzy: §G+2000§!\nRoczna tradycja morska: §G0.25§!\nLimit sił morskich: §G+2.00§!"
 pirate_subject: "Podległa republika piracka"
 REPUBLIC_DENIED_ALLIANCE: "Nie możemy zawierać sojuszy z państwami, które nie są republikami."
 FROM_REPUBLIC_DENIED_ALLIANCE: "Ustrój państwa [From.GetName] nie pozwala mu zawierać sojuszy z państwami niebędącymi republikami."
 mechanic_cannot_ally_non_republics_yes: "Nie można zawierać sojuszy z państwami innymi niż §Yrepubliki§!"
 REV_REPUBLIC_DENIED_ALLIANCE: "Nie możemy sprzymierzać się z krajami, które nie są republikami."
 FROM_REV_REPUBLIC_DENIED_ALLIANCE: "Ustrój państwa [From.GetName] nie pozwala mu zawierać sojuszy z państwami niebędącymi republikami."
 mechanic_cannot_ally_non_republics_or_non_rev_yes: "Nie można zawierać sojuszy z państwami innymi niż §Yrepubliki§! i §Yimperium rewolucyjne§!."
 break_every_non_republic_alliance_tt: "Każdy sojusznik niebędący §Yrepubliką§! zerwie sojusz z państwem §Y[Root.GetName]§!."
 break_every_non_rev_republic_alliance_tt: "Każdy sojusznik niebędący §Yrepubliką§! ani §Ypaństwem rewolucyjnym§! zerwie sojusz z państwem §Y[Root.GetName]§!."
 national_assembly_reform: "Zgromadzenie Narodowe"
 national_assembly_reform_desc: "Zgromadzenie Narodowe jest sercem nowego rządu, w którym przedstawiciele różnych stronnictw naszego państwa zbierają się, by proponować i składać projekty ustaw. Spośród tych stronnictw wybierany jest nowy kandydat na przywódcę państwa."
 mechanic_elections_increase_factions_influence_yes: "Wybory zmieniają wpływy stronnictw"
 mechanic_is_pirate_republic_reform_yes: "Wywiesiło czarną banderę i jest §Yrepubliką piracką§!!"
 mechanic_is_pirate_republic_reform: "Jest reformą ustrojową §Yrepubliki pirackiej§!"
 cult_of_reason_reform: "Kult Rozumu"
 cult_of_reason_reform_desc: "Religia jest trucizną ograniczającą umysły ludności. Zamiast kierować się logiką, ludzie wierzą w boga odpowiedzialnego za ich cierpienie.\nZrzucamy z naszych umysłów kajdany niewiedzy. Żaden bóg nie będzie już wyznaczał granic naszemu ludowi!"
 conserve_the_religion_reform: "Zachować religię"
 conserve_the_religion_reform_desc: "Wiara stanowi istotną część naszego społeczeństwa od samego początku istnienia państwa. Nawet w chaosie rewolucji nie możemy utracić wiary w nasze przekonania."
 secularization_of_the_state_reform: "Sekularyzacja państwa"
 secularization_of_the_state_reform_desc: "Wielu fanatycznych rewolucjonistów pragnie zniszczyć samo pojęcie religii, lecz nie da się zaprzeczyć, że dla wielu naszych ludzi jest ona źródłem pocieszenia i bezpieczeństwa. Naszym celem nie powinno być wyplenienie wiary, lecz oddzielenie instytucji kościelnych od rządu."
 bonus_stats_for_elected_ruler_tt: "§YPremia za wybory losowe§!: Wszystkie umiejętności wybranego władcy zmieniają się o §G1§!."
 mechanic_bonus_stats_for_elected_ruler_yes: "Wszystkie umiejętności wybranych władców zmieniają się o §G1§!"
 federal_senate_reform: "Senat federalny"
 federal_senate_reform_desc: "Prowincje naszego państwa mają długą tradycję samorządności i udziału w sprawach rządowych. Ich głosy są wysłuchiwane w wielkim senacie naszego kraju."
 mechanic_centralize_state_no_reform_cost_yes: "§YCentralizacja obszaru§! zwróci poniesione koszty"
 mechanic_centralize_state_half_refund_yes: "§YCentralizacja obszaru§! zwróci §G50%§! poniesionych kosztów"
 mechanic_centralize_state_development_yes: "§YCentralizacja państwa§! dodaje §G+1§! losowego rozwoju każdej posiadanej prowincji w danym obszarze."
 mechanic_unlock_special_state_edicts_yes: "Ma dostęp do unikalnych dla er §Yedyktów stanowych§!\n§YEra wielkich odkryć§!: modyfikator podatków lokalnych §G+50.0%§!\n§YEra reformacji§!: lokalny wkład w jedność religijną §G-50.0%§!\n§YEra absolutyzmu§!: okres separatyzmu §G-10§!\n§YEra rewolucji§!: modyfikator lokalnie produkowanych towarów §G+33.0%§!"
 mechanic_unlock_special_state_edicts: "Dostęp do unikatowych dla epoki §Yedyktów państwowych§!"
 feudal_taxes_state_edict: "Edykt podatków feudalnych"
 religious_tolerance_state_edict: "Edykt tolerancji religijnej"
 state_integration_state_edict: "Edykt integracji państwa"
 urbanization_state_edict: "Edykt urbanizacji"
 state_and_religion: "Państwo i religia"
 economical_matters: "Kwestie ekonomiczne"
 economical_matters_republic: "Kwestie ekonomiczne"
 economical_matters_theocracy: "Kwestie ekonomiczne"
 mechanic_seizing_land_no_rebels_from_estate_nobles_yes: "Odebranie ziemi od §Yszlachty§! nie wywołuje buntów szlachty"
 mechanic_winning_battles_increases_legitimacy_yes: "Wygrywanie bitew prowadzonych przez władcę zwiększa legitymizację (lub jej ekwiwalent) o §G0.5§!, tradycję republikańskie, absolutyzm i ferwor rewolucyjny o §G0.1§!"
 restoration_of_clergy_reform: "Przywrócenie duchowieństwa"
 restoration_of_clergy_reform_desc: "Celem rewolucji jest zmiana starego porządku świata, odebranie władzy opresyjnym klasom i monarchom i przekazanie jej ludziom. Jest to jednak sprzeczne z wartościami religijnymi wyznawanymi przez naszych ludzi, ponieważ duchowieństwo byłoby jedną dotkniętą klasą. Aby utrzymać porządek w Cesarstwie, konieczne jest ponowne przywrócenie duchowieństwa."
 grant_noble_castle_rights_reform: "Nadanie szlacheckich praw zamku"
 grant_noble_castle_rights_reform_desc: "Szlachta naszego kraju bezpośrednio konkuruje z Koroną o własność ziem. Przyznając szlachcie prawa do posiadania własnych zamków i otaczających ją wiosek, możemy złagodzić konflikty między monarchią a szlachtą."
 mechanic_on_fort_built_nobles_loyalty_yes: "Wznoszenie nowoczesnych budynków fortyfikacyjnych zwiększa lojalność §Yszlachty§! o §G5%§!"
 maintain_nobles_status_quo_reform: "Kompromis ze szlachtą"
 maintain_nobles_status_quo_reform_desc: "Równowaga sił w naszym państwie między stanami a Koroną to delikatna sprawa. Naszą najlepszą decyzją jest utrzymanie tej równowagi w stanie nienaruszonym, ani nie udzielać więcej przywilejów klasie szlacheckiej, ani nie ograniczając jej władzy."
 grant_nobles_electorate_reform: "Szlachecki elektorat"
 grant_nobles_electorate_reform_desc: "Los monarchii jest związany z panującym monarchą. Jako taka nagła śmierć władcy jest zawsze szokiem dla rządu i jego ludu.\nPrzyznając szlachcie prawo wyboru kolejnej głowy państwa, możemy zapewnić, że bezkrólewie i chaos, który na nim panuje, pozostaną krótkotrwałe."
 blackmail_nobility_reform: "Marionetka szlachty"
 blackmail_nobility_reform_desc: "Klasa rządząca właścicieli i szlachty zakłada, że jest odpowiedzialna za sprawy państw. W rzeczywistości to dynastia monarchów i służący jej szpiedzy trzymają szlachtę w ryzach i zapewniają, że szlachta jest jedynie marionetką rządu."
 grant_military_command_reform: "Szlachetny korpus oficerski"
 grant_military_command_reform_desc: "Podczas gdy kler głosi kazania, mieszczanie zajmują się handlem, a zwykli ludzie wykonują ciężką pracę, szlachta wyrusza na polowanie i szkoli się w sztukach walki. Stawiając szlachtę na czele dowództwa wojskowego, możemy zapewnić niezawodny napływ kompetentnych dowódców do naszych armii."
 mechanic_recruiting_generals_increases_nobles_loyalty_yes: "Rekrutacja generałów zwiększa lojalność §Yszlachty§! o §G2%§!"
 expand_imperial_court_reform: "Rozbudowany dwór królewski"
 expand_imperial_court_reform_desc: "Poszerzając dwór królewski, posiadłości monarchy mogą rządzić obszarami, pozostając jednocześnie w strefie wpływów monarchy. W ten sposób nasze państwo nie popada w problemy związane z państwem zdecentralizowanym, mając jednocześnie środki na inne sprawy."
 limit_imperial_court_reform: "Królewska faworyzacja"
 limit_imperial_court_reform_desc: "Biurokracją naszego kraju zajmują się bliscy krewni i zaufani doradcy monarchów. Choć nie jest tak naprawdę scentralizowana, władza jest w rękach tych, którzy sprawdzili się w przeszłości."
 mechanic_seizing_land_loyalty_yes: "Zmniejszenie strat lojalności wynikających z odebrania królewszczyzny o §G5%§!"
 regional_council_reform: "Rady regionalne"
 regional_council_reform_desc: "Utrzymanie dużego imperium nie jest łatwym zadaniem, ponieważ obecność w każdym stanie jest praktycznie niemożliwa. Rady regionalne mogą zapewnić, że stany zorganizują się same, bez konieczności ingerencji rządu."
 representation_of_the_crown_reform: "Przedstawiciele korony"
 representation_of_the_crown_reform_desc: "Nasza władza nie odbywa się za pomocą bezpośrednich środków, ale dzięki poddanym i sługom, którzy przysięgają wierność naszej koronie. Oficjalnie wybrani przedstawiciele korony doradzają władcom podległych nam narodów, aby zachowali wspomnianą lojalność."
 subject_tax_modifier: "Przedstawiciele korony"
 mechanic_subject_tax_modifier_25_yes: "Wasale i marchie zyskują §G25%§! zwiększony modyfikator podatków państwowych"
 dyanstic_administration_reform: "Administracja dynastyczna"
 dyanstic_administration_reform_desc: "Klasy nie są godnymi zaufania sojusznikami monarchii, ponieważ ich priorytetem jest poszerzanie własnej władzy zamiast służenia państwu. Tylko krewnym władcy należy powierzyć zarządzanie wyzwaniami administracyjnymi, przed którymi stoi państwo."
 legitimation_of_power: "Legitymizacja władzy"
 machiavellianistic_rule_reform: "Rządy makiawelizmu"
 machiavellianistic_rule_reform_desc: "Państwo jest ponad moralnością; ponad cnotami i grzechami. Rząd musi podejmować decyzje wyłącznie w oparciu o korzyści dla państwa - nawet jeśli są one uważane za 'złe'. Suweren ma prawo działać dla dobra swojego państwa bez względu na moralność."
 six_livres_reform: "Sześć ksiąg o Rzeczypospolitej"
 six_livres_reform_desc: "Absolutne rządy jednego monarchy są tak samo szkodliwe dla państwa, jak pozwolenie masom na rządzenie samymi sobą. Władza monarchy nie powinna podlegać żadnej frakcji w państwie, choć do pewnego stopnia powinna być ograniczona przez instytucje, aby utrzymać równowagę sił między władcą a ludem."
 two_treatises_reform: "Dwa traktaty o rządzie"
 two_treatises_reform_desc: "Natura ludzkości charakteryzuje się rozsądkiem i tolerancją. Żaden człowiek nie rodzi się zły. Jednak natura ludzka prowadzi naszych ludzi do egoizmu i działania wyłącznie dla własnego dobra.\nRząd zapewnia, że ten egoizm jest prowadzony w sposób cywilny. Służy również obronie naturalnego prawa do życia, zdrowia, wolności i własności."
 the_leviathan_reform: "Lewiatan"
 the_leviathan_reform_desc: "Życie bez rządu, zwane również stanem naturalnym, jest stanem anarchii. Każdy człowiek jest sam dla siebie, a jedynym rezultatem jest wojna wszystkich przeciwko wszystkim.\nLudzie w naszym rządzie cedują część swoich praw na rzecz naszej suwerennej władzy w celu ochrony przed niezgodą."
 the_social_contract_reform: "Umowa społeczna"
 the_social_contract_reform_desc: "Rządy z przeszłości są wynikiem różnych poziomów nierówności między klasami społecznymi.\nUmowa społeczna to koncepcja, w ramach której ludzie łączą się w społeczeństwo obywatelskie. Porzucając swoje roszczenia do praw naturalnych, jednostki mogą zarówno zachować siebie, jak i pozostać wolne."
 peoples_kingdom_reform: "Królestwo dla ludu"
 peoples_kingdom_reform_desc: "Władca jest niczym więcej bez swoich poddanych niż zwykłym człowiekiem. Jako taki, monarcha służy swojemu ludowi tak samo, jak lud służy jemu."
 deified_monarchy_reform: "Boskie prawa"
 deified_monarchy_reform_desc: "Rządy monarchy nie są prawem, które każdy może sobie rościć. Jest to prawo boskie, przyznane przez naszą wiarę. Monarcha jest zatem ucieleśnieniem boskiej woli naszej własnej wiary."
 mechanic_free_noble_levies_yes: "Przywilej '§Yzwiększony pobór§!' nie zwiększa już wpływów i nie zmniejsza maksymalnego absolutyzmu."
 empowered_regency_modifier: "Wzmocniona regencja"
 desc_empowered_regency_modifier: "Ściśle współpracując ze szlachtą, która obecnie zasiada na tronie, możemy zapewnić sprawny porządek i wydajność w sprawach rządowych."
 mechanic_improved_nobles_regency_yes: "Mając §YNszlachetną regencję§! otrzymamy następujące efekty:\nRoczna legitymizacja: §G+1.00§!\nModyfikator kosztu stabilności: §G-25,0%§!\nMiesięczne punkty administracyjne: §G+1§!\nMiesięczne punkty dyplomatyczne: §G+1§!\nMiesięczne punkty militarne: §G+1§!"
 centralize_empire_reform: "Scentralizowana biurokracja "
 centralize_empire_reform_desc: "Rozległe ziemie pod naszą jurysdykcją rozciągają się od wschodu do zachodu. Musimy zapewnić sprawne działanie naszych prowincji pod naszą imperialną domeną."
 norwegian_parliamentary_monarchy: "Monarchia norweska"
 norwegian_parliamentary_monarchy_desc: "Wraz z wypędzeniem duńskiej szlachty, norweska monarchia ponownie służy Norwegii. Aby wesprzeć rząd, monarchia norweska ustanowiła system parlamentarny z monarchą na czele."
 presidential_monarchy_reform: "Prawo do petycji"
 presidential_monarchy_reform_desc: "Monarchia jest tak stabilna, jak pozwalają na to ludzie. Nie jest tajemnicą, że masy tęsknią za reprezentacją w aparacie państwa. Przedstawiając monarsze sprawy i zmartwienia ludności, możemy zapewnić zadowolenie poddanych monarchii."
 mechanic_enforced_interfaith_dialogue_buff_yes: "Przywilej  '§Ywymuszony dialog międzywyznaniowy§!' nie zmniejsza lojalności duchowieństwa ani maksymalnego absolutyzmu."
 mechanic_monastic_order_yes: "Jest §Yzakonem monastycznym§!"
 mechanic_monastic_order: "Zakon monastyczny"
 education_of_the_state: "Edukacja państwa"
 education_of_the_bishop_reform: "Wykształcenie teokraty"
 education_of_the_bishop_reform_desc: "Los naszego państwa spoczywa w rękach Boga. To jednak nasz teokratyczny władca musi odczytywać boskie znaki i interpretować je na korzyść naszego ludu.\nAby uniknąć błędnych interpretacji, państwo musi skupić wysiłki na kształceniu przyszłych władców."
 mechanic_education_focus_enabled_yes: "Nowi władcy uruchomią wydarzenie §Yedukacyjne§! dotyczące przyszłych dziedziców"
 education_of_the_advisors_reform: "Wykształcenie dworu"
 education_of_the_advisors_reform_desc: "Nasz władca może reprezentować wolę naszej wiary, lecz nadal jest tylko człowiekiem podatnym na ludzkie błędy. Dzięki wykształceniu całego dworu będziemy mogli ograniczyć pomyłki władcy."
 education_of_the_missionaries_reform: "Wykształcenie misjonarzy"
 education_of_the_missionaries_reform_desc: "Poganie i heretycy stanowią największą próbę naszej wiary. Uwodzą pobożnych ludzi zatrutymi myślami, odciągając ich od prawdziwej religii.\nMusimy uświadomić naszym misjonarzom, jakie zagrożenia z tego wynikają."
 education_of_the_people_reform: "Edukacja ludu"
 education_of_the_people_reform_desc: "Wiedza i edukacja są darem od Boga. Człowiek rodzi się z wolną wolą i zdolnością myślenia, a naszym obowiązkiem jest zadbać, by każdy mieszkaniec państwa mógł korzystać z tego daru."
 religoius_doctrine: "Doktryna religijna"
 balanced_mission_reform: "Zrównoważona misja"
 balanced_mission_reform_desc: "Sprawy naszej teokracji nie mogą skupiać się wyłącznie na jednym aspekcie. W interesie zarówno państwa, jak i naszej wiary leży równomierne inwestowanie w misje wewnętrzne i zewnętrzne."
 commercial_mission_reform: "Misja handlowa"
 commercial_mission_reform_desc: "Choć religia napędza nasze ambicje, nie da się zaprzeczyć, że nasze państwo zależy od potęgi dukata. Na szczęście religia i zarabianie pieniędzy idą ze sobą w parze."
 mission_to_protect_reform: "Misja ochrony"
 mission_to_protect_reform_desc: "Naszej wierze nieustannie zagrażają zarówno poganie, jak i heretycy. Możemy polegać jedynie na innych wyznawcach naszej religii — naszych braciach i siostrach w wierze. Naszym obowiązkiem jest chronić ich przed przeklętymi siłami zła."
 pursuit_of_knowledge_reform: "Dążenie do wiedzy"
 pursuit_of_knowledge_reform_desc: "Naszym celem nie jest obrona religii ani przymusowe szerzenie wiary. Skupiamy się natomiast na samej naturze istnienia i relacji między światem śmiertelników a sferą boską."
 constitional_theocracy_reform: "Teokracja konstytucyjna"
 constitional_theocracy_reform_desc: "Państwo istnieje wyłącznie po to, by służyć temu, co boskie. Aby w pełni poświęcić się temu celowi, musimy zadbać, by żaden słabego ducha władca teokratyczny nie doszedł do władzy i nie wypaczył naszej sprawy."
 faith_and_power_reform: "Wiara i potęga"
 faith_and_power_reform_desc: "Walka i potęga to jedyne sposoby, by zbliżyć się do boskości. Dzięki zwycięstwom na polu bitwy lud naszego państwa okazuje pobożność i oddanie."
 belief_and_unity_reform: "Wiara i jedność"
 belief_and_unity_reform_desc: "Wiara jest siłą jednoczącą, która spaja państwo i jego ludność. Rząd istnieje wyłącznie po to, by zapewnić trwałość tej jedności."
 state_of_theologians_reform: "Państwo teologów"
 state_of_theologians_reform_desc: "Nasza religia nie jest bronią ani usprawiedliwieniem wojny. Nie istnieje też dla zysku. Nasza wiara wyrasta z intelektualnych i duchowych teorii, dyskusji oraz zrozumienia. Teologia jest celem istnienia państwa i jego poddanych."
 divinity_through_craftsmanship_reform: "Boskość poprzez rzemiosło"
 divinity_through_craftsmanship_reform_desc: "Teologowie dyskutują o sposobach osiągnięcia boskiego oświecenia, lecz tylko nieliczni rozumieją, co naprawdę przybliża nas do nieśmiertelnej sfery. Akt tworzenia jest jedynym świętym sposobem zbliżenia się do naszego Stwórcy."
 culture_within_the_state: "Kultura, wiara i państwo"
 religious_culture_reform: "Społeczeństwo religijne"
 religious_culture_reform_desc: "Religia i kultura są ze sobą nierozerwalnie związane. Nikt z naszego społeczeństwa nie może uważać się za członka naszej kultury, jeśli nie przestrzega tych samych rytuałów."
 harmonization_of_cultures_reform: "Harmonizacja kultur"
 harmonization_of_cultures_reform_desc: "Pojęcie kultury jest pod wieloma względami podobne do religii, choć kształtują je tradycje, wartości społeczne i środowisko, a nie boskie oświecenie. Kultury w naszym państwie powinny harmonizować ze sobą, o ile ich przedstawiciele wyznają prawdziwą wiarę."
 cultural_safe_haven_reform: "Bezpieczna przystań kultur"
 cultural_safe_haven_reform_desc: "Kultury są sztucznymi normami społecznymi stworzonymi przez ludzi, by odróżniać się od innych. W rzeczywistości wszyscy jesteśmy śmiertelnikami kroczącymi po tym świecie. Liczy się wyłącznie wiara w prawdziwą boską istotę."
 taxation_of_the_foreigners_reform: "Opodatkowanie obcych"
 taxation_of_the_foreigners_reform_desc: "Kultura mniejszości nie ma dla nas większego znaczenia. Dopóki jej przedstawiciele są gotowi poświęcić część swoich dochodów na świętą sprawę, mogą swobodnie kultywować własne tradycje."
 mechanic_may_not_reduce_tax_on_exploitation_yes: "§G50%§! szansy na uniknięcie utraty §Ypodatku podstawowego§! podczas eksploatacji prowincji"
 mechanic_may_not_reduce_tax_on_own_exploitation_yes: "§G25%§! szansy na uniknięcie utraty §Ypodatku podstawowego§! podczas eksploatacji prowincji należących do własnej grupy kulturowej"
 mechanic_may_not_reduce_tax_on_foreign_exploitation_yes: "§G50%§! szansy na uniknięcie utraty §Ypodatku podstawowego§! podczas eksploatacji prowincji należących do obcych grup kulturowych"
 mechanic_can_see_theocratic_heir_stats_yes: "Można sprawdzić §Yumiejętności władcy§! wybieranego dziedzica"
 papal_embassy_reform: "Ziemie dla Kościoła"
 papal_embassy_reform_desc: "Kościół katolicki jest kluczową częścią naszego społeczeństwa. W każdą niedzielę nasi pobożni obywatele odwiedzają kaplice, kościoły i katedry, aby się pomodlić.\nAby utrzymać naszych obywateli na właściwej drodze, sam Kościół musi sprawować władzę nad niektórymi obszarami naszego kraju."
 papal_embassy: "Ziemie dla Kościoła"
 mechanic_improved_opinion_of_pope_yes: "Trwale zwiększa opinię §YPaństwa Papieskiego§! o §G25§!"
 i_am_the_church_reform: "Głowa katolickiego Kościoła"
 i_am_the_church_reform_desc: "Całe nasze państwo, cała nasza egzystencja służy tylko jednemu celowi: nie służyć nikomu poza Bogiem. Jesteśmy głową Kościoła rzymskokatolickiego, duchowym przywódcą światowej religii."
 mechanic_improved_defender_of_faith_yes: "Religijni dyplomaci nie mają wpływu na wpływ lub absolutyzm, gdy są obrońcami wiary.\nBycie obrońcą wiary daje następujące efekty:\nTolerancja dla prawdziwej wiary: §G+2.00§!\nReputacja dyplomatyczna: §G+1.00§!\nPoprawa stosunków: §G+15.0%§!"
 gov_improved_defender_of_faith_mod: "Obrońca Kościoła"
 desc_gov_improved_defender_of_faith_mod: "Jako głowa Kościoła [Root.Religion.GetName] naturalnie stajemy się również jego obrońcą. Niech świat wie, że samo papiestwo będzie bronić ludu Bożego!\n\n§YObowiązuje do chwili, gdy przestaniemy być Obrońcą Wiary.§!"
 lands_for_the_monasteries_reform: "Przekazać ziemie klasztorom"
 lands_for_the_monasteries_reform_desc: "Klasztory prawosławne są świętymi miejscami, zwolnionymi z podatków i cieszącymi się pełną autonomią. Nadanie ziem klasztorom zadowoli patriarchat przy znikomym koszcie."
 mechanic_selling_titles_increases_pa_yes: "Sprzedaż tytułów zwiększa autorytet patriarchalny o §G5%§!"
 mechanic_free_religious_culture_yes: "Przywilej stanu „§YKultura religijna§!” nie zwiększa już wpływów §Yduchowieństwa§!"
 mechanic_on_church_built_clergy_loyalty_yes: "Budowa kościołów i katedr zwiększa lojalność §Yduchowieństwa§! odpowiednio o §G+2%§! i §G+5%§!"
 focus_of_the_patriarchy_reform: "Wspierać szkoły monastyczne"
 focus_of_the_patriarchy_reform_desc: "Klasztory państwowe słyną jako ośrodki nauki i sztuki. W każdej szkole monastycznej przebywają liczni uczeni religijni, specjaliści w takich dziedzinach jak historia Kościoła, egzegeza Pisma Świętego, czytanie, gramatyka, poezja, muzyka, kaligrafia i malarstwo."
 mechanic_active_holy_sites_improve_clergy_loyalty_yes: "Zwiększa lojalność §Yduchowieństwa§! o §G5%§! za każde aktywne święte miejsce"
 EST_FIVE_HOLY_SITES_BONUS: "Za 5 aktywnych świętych miejsc: "
 EST_FOUR_HOLY_SITES_BONUS: "Za 4 aktywne święte miejsca: "
 EST_THREE_HOLY_SITES_BONUS: "Za 3 aktywne święte miejsca: "
 EST_TWO_HOLY_SITES_BONUS: "Za 2 aktywne święte miejsca: "
 EST_ONE_HOLY_SITES_BONUS: "Za 1 aktywne święte miejsce: "
 EST_358_HOLY_SITE: "Za święte miejsce w §YAleksandrii§!: "
 EST_1227_HOLY_SITE: "Za święte miejsce w §Y Aksum§!: "
 EST_2313_HOLY_SITE: "Za święte miejsce w §YAntiochii§!: "
 EST_1234_HOLY_SITE: "Za święte miejsce w §YKasr Ibrim§!: "
 EST_419_HOLY_SITE: "Za święte miejsce w §YErywaniu§!: "
 mechanic_clerical_ministers_tech_buff_yes: "Przywilej stanu „§YUrzędnicy duchowni§!” zmniejsza koszt technologii o §G5%§!"
 zoroastrian_focus_reform: "Przyjąć koncepcję wolnej woli"
 zoroastrian_focus_reform_desc: "Zaratustra, założyciel naszej dobroczynnej religii, był zagorzałym zwolennikiem koncepcji wolnej woli. Przyjęcie jej jako wiodącej doktryny religijnej naszego państwa pozwoli nam zapewnić dobrobyt i stabilność w naszym kraju."
 power_to_the_synagogoues_reform: "Przyznać przywileje rabinom"
 power_to_the_synagogoues_reform_desc: "Rabini naszego państwa są ludźmi wiedzy i wykształcenia. Przyznanie im przywilejów, które rozszerzą ich wpływy, przyniesie wielki postęp w sprawach teologicznych."
 mechanic_loyalty_from_celebration_yes: "Obchody święta zwiększają teraz lojalność §Yrabinów§! o §G+20%§!"
 head_of_the_reformed_church_reform: "Głowa reformowanego Kościoła"
 head_of_the_reformed_church_reform_desc: "Nasza wiara nie jest już związana ze Stolicą Apostolską. Władca jest teraz prawdziwą głową religii państwowej i jako taki ma obowiązki i przywileje kierowania kierunkiem religijnym."
 confucian_governing_reform: "Wzmocnienie konfucjańskiej biurokracji"
 confucian_governing_reform_desc: "Nasi uczeni są mądrymi doradcami państwa i pobożnymi wyznawcami nauk Konfucjusza. Są oni również siłą stojącą za aparatem administracyjnym rządu. Wzmacniając ich przywileje, wzmacniamy również ich zdolności biurokratyczne."
 mechanic_full_loyalty_on_harmonization_yes: "Harmonizacja religii zwiększa lojalność §Yduchowieństwa§! o §G+100%§! i zapewnia §G50§! £adm£ "
 empower_buddhist_temples_reform: "Wzmocnienie pozycji klasztorów"
 empower_buddhist_temples_reform_desc: "Nauki Buddy są kluczowym elementem naszego państwa. Żadne działanie nie jest podejmowane bez uwzględnienia wynikającej z niego karmy dla naszych ludzi.\nŚledzenie karmy naszego społeczeństwa jest prawie niemożliwe, ponieważ jest to pojęcie abstrakcyjne. W tym jednak mogą pomóc klasztory naszego kraju."
 mechanic_clergy_estate_agendas_gives_karma_yes: "Ukończenie programu §Yduchowieństwa§! daje §Y+10§! Karmy"
 mechanic_seizing_land_takes_karma_yes: "Odebranie ziemi daje §Y-10§! Karmy"
 mechanic_buffed_monastic_temples_yes: "Przywilej stanu „§YŚwiątynie monastyczne§!” zapewnia lub odbiera teraz §Y5 punktów karmy§! zamiast 3.\nDodatkowo zapewnia teraz §G+0.03§! rocznego zaniku karmy, nie zwiększa już wpływów ani nie zmniejsza maksymalnego absolutyzmu."
 mechanic_enable_karma_decision_yes: "Odblokowuje decyzję pozwalającą dostosować karmę co §Y20§! lat"
 buddhism_consulate_monasteries_title: "Zasięgnąć rady klasztorów"
 buddhism_consulate_monasteries_desc: "Sytuacja naszego duchowego dobrostanu jest rozpaczliwa — karma utraciła równowagę. Powinniśmy zasięgnąć rady klasztorów, aby wskazały nam drogę powrotną do nirwany."
 buddhism_events.44.t: "Konsultacja z klasztorami"
 buddhism_events.44.desc: "Sytuacja naszego duchowego dobrostanu jest rozpaczliwa — karma utraciła równowagę. Na szczęście klasztory państwa [Root.GetName] służą [Root.Monarch.GetTitle] [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] najbliższym doradą."
 buddhism_events.44.a: "Przyjąć pozytywną karmę."
 buddhism_events.44.b: "Przyjąć negatywną karmę."
 public_hindu_practices_reform: "Rozszerzyć przywileje braminów"
 public_hindu_practices_reform_desc: "Bramini są kastą kapłańską w naszym hinduskim społeczeństwie. Ich obowiązkiem jest utrzymywanie świątyń i odprawianie rytuałów naszej wiary."
 mechanic_reduce_new_deity_decision_cd_yes: "Przywilej stanu „§YWybór osobistego bóstwa§!” nie zwiększa już wpływów.\nDecyzję „§YWybór osobistego bóstwa§!” można podejmować co §G5§! lat."
 decision_once_every_five_years: "Tej decyzji można użyć tylko raz na każde §Y5§! lat."
 strengthen_shaman_privileges_reform: "Wzmocnić przywileje duchowieństwa"
 strengthen_shaman_privileges_reform_desc: "Duchowieństwo naszego państwa ma kluczowe znaczenie dla utrzymania stabilności, ponieważ jego słowo jest prawem dla wszystkich stanów. Wzmacniając jego przywileje, możemy zapewnić sobie lojalność duchownych wobec władcy."
 mechanic_no_influence_from_fetishist_privileges_yes: "Przywileje stanowe charakterystyczne dla fetyszyzmu nie zwiększają już wpływów §Yduchowieństwa§!"
 abolished_caste_system_reform: "Znieść system kastowy"
 abolished_caste_system_reform_desc: "System kastowy hinduizmu jest wadliwy i skorumpowany, ponieważ zachęca do złego traktowania niektórych grup społecznych.\nKierujemy się naukami Guru Nanaka i raz na zawsze zniesiemy kasty."
 strengthen_the_ulema_reform: "Wzmocnić ulemę"
 strengthen_the_ulema_reform_desc: "Ulema stanowi serce naszego społeczeństwa. Dzięki jej prawom i przywództwu osiągniemy w naszym państwie najwyższy poziom pobożności."
 abandon_the_legal_ways_title: "Porzucić legalizm"
 abandon_the_legal_ways_desc: "Surowe zasady myślenia i prawa ustanawiane przez legalistyczną ulemę okazały się mało przydatne dla aparatu państwowego. Choć będzie to szokiem dla naszych pobożnych poddanych, nadszedł czas, by porzucić zasady legalizmu."
 return_to_the_legal_ways_title: "Przyjąć legalizm"
 return_to_the_legal_ways_desc: "Swobodne interpretacje Koranu spełniły już swoje zadanie w naszym państwie. Choć będzie to szokiem dla naszych pobożnych poddanych, nadszedł czas, by przyjąć zasady legalizmu."
 mechanic_allow_piety_switch_decision_yes: "Odblokowuje decyzje pozwalające przyjąć §Ylegalizm§! przy pobożności poniżej -50 lub §Ymistycyzm§! przy pobożności powyżej 50"
 strengthen_the_dhimmi_reform: "Wzmocnić dhimmi"
 strengthen_the_dhimmi_reform_desc: "Choć ulemę uważa się za centrum naszej kultury, to dhimmi stanowią kluczowy element naszego rządu."
 mechanic_free_guarantee_dhimmi_autonomy_yes: "Przywilej stanu „§YGwarantowana autonomia dhimmi§!” nie zwiększa już wpływów ani nie zmniejsza maksymalnego absolutyzmu"
 legacy_of_the_steppes_reform: "Dziedzictwo stepów"
 legacy_of_the_steppes_reform_desc: "W przeciwieństwie do wielu innych państw, które napotkaliśmy, nasz rząd ukształtowały tradycje tengryzmu i rozległe stepy. Choć nie jesteśmy już hordą, legitymizacja władcy nadal rodzi się na polu bitwy."
 state_and_shrines_intertwined_reform: "Zespolenie świątyń z państwem"
 state_and_shrines_intertwined_reform_desc: "Wiara w kami jest głęboko zakorzeniona w naszej kulturze i religii. Choć zachowujemy wyraźną granicę między kannushi a sprawami państwowymi, oczywiste jest, że nasz rząd działa w interesie i zgodnie z wartościami shintō."
 embedded_norse_government_reform: "Zakotwiczenie tradycji nordyckich"
 embedded_norse_government_reform_desc: "Religia naszych przodków napędza działania naszego państwa. Dawne, zapomniane praktyki powróciły i stały się teraz centralnym elementem naszego społeczeństwa."
 mechanic_winning_war_increases_legitimacy_yes: "Wygrywanie wojen zwiększa legitymizację (lub jej odpowiednik) o §G5§!\nTradycja republikańska wzrasta zamiast tego o §G2§!"
 strengthen_clergy_reform: "Wzmocnić przywileje duchowieństwa"
 strengthen_clergy_reform_desc: "Stan kapłański służy państwu, zapewniając naszemu ludowi duchowe przewodnictwo w trudnych czasach. Duchowieństwo zasługuje na rozszerzenie swoich praw, które będzie wyrazem uznania dla jego roli w państwie."
 curtail_clergy_power_reform: "Ograniczenie przywilejów duchownych"
 curtail_clergy_power_reform_desc: "Religia może mieć duże znaczenie społeczne w naszym rządzie, ale klasa kapłańska naszego państwa zyskała zbyt duży wpływ. Ich wąski światopogląd będzie tylko hamował rozwój naszego państwa, jeśli utrzymają swoją władzę."
 mechanic_seizing_land_no_rebels_from_estate_church_yes: "Odebranie ziemi od §Yduchowieństwa§! nie wywołuje buntów duchowieństwa"
 separate_clergy_from_state_affairs_reform: "Oddzielenie duchowieństwa od państwa"
 separate_clergy_from_state_affairs_reform_desc: "Umysły teologiczne służyły państwu, ale teraz stały się zbyt potężne. Nadszedł czas, aby oddzielić duchowieństwo od spraw aparatu rządowego."
 mechanic_disables_estate_church_yes: "Wyłącza klasę §Yduchowieństwa§!."
 mechanic_disables_estate_burghers_yes: "Wyłącza klasę §Ymieszczan§!."
 mechanic_disables_estate_maratha_yes: "Wyłącza klasę §Ymarathów§!."
 mechanic_disables_estate_brahmins_yes: "Wyłącza klasę §Ybraminów§!."
 mechanic_disables_estate_vaisyas_yes: "Wyłącza klasę §Ywajśjów§!."
 mechanic_disables_estate_cossacks_yes: "Wyłącza klasę §Ykozaków§!."
 mechanic_disables_estate_nomadic_tribes_yes: "Wyłącza klasę §Yplemion§!."
 mechanic_disables_estate_dhimmi_yes: "Wyłącza klasę §Yzimmów§!."
 mechanic_disables_estate_jains_yes: "Wyłącza klasę §Ydźinistów§!."
 mechanic_disables_estate_rajput_yes: "Wyłącza klasę §Yradźputów§!."
 maintain_clergy_balance_of_power_reform: "Utrzymanie równowagi sił"
 maintain_clergy_balance_of_power_reform_desc: "Duchowieństwo jest dla nas jak każda inna klasa: potężnym i użytecznym dobrem. Aby utrzymać równowagę sił między klasami, korzystne jest, aby nasze państwo nie ingerowało w interesy i działania klasy duchowieństwa."
 secure_clergy_power_reform: "Rozszerzenie praw świątyni"
 secure_clergy_power_reform_desc: "Duchowni naszego państwa są tak samo zainteresowani dobrami doczesnymi, jak nasza szlachta. Aby ich uspokoić bez poświęcania zbyt dużej części naszej własnej władzy, w naszym najlepszym interesie jest rozszerzenie ziem i praw świątyń naszego kraju."
 gov_expanded_temple_rights_mod: "Rozszerzone prawa świątyni"
 desc_gov_expanded_temple_rights_mod: "Budynki sakralne w tej prowincji zyskały więcej praw i gruntów w zamian za zwiększony podatek."
 mechanic_temples_modifier_yes: "Świątynie i katedry dają prowincji modyfikator podatków lokalnych §G+33.0%§! i lokalny poziom niepokojów §G-2.00§!"
 empower_the_burghers_reform: "Wzmocnienie pozycji mieszczan"
 empower_the_burghers_reform_desc: "Mieszczanie są handlarzami i kupcami w naszym państwie. Zapewniają oni stały dopływ pieniędzy do naszego skarbca. Wzmocnienie ich przywilejów i wpływów prowadzi do szybszej akumulacji naszego bogactwa."
 new_world_exploitation_reform: "Eksploatacja Nowego Świata"
 new_world_exploitation_reform_desc: "Zasoby Nowego Świata są obfite i mają wielką wartość. Przyznając pewne prawa i przywileje naszym kupcom, możemy zapewnić, że te zagraniczne towary są eksploatowane i transportowane do naszego państwa, które następnie dystrybuujemy w Starym Świecie."
 mechanic_extra_trade_goods_for_colonial_subjects_yes: "Poddani kolonialni zyskują modyfikator wyprodukowanych towarów §G+10.0%§!"
 new_world_exploitation_modifier: "Eksploatacja Nowego Świata (Suweren)"
 curtail_the_burghers_reform: "Ograniczenie mieszczan"
 curtail_the_burghers_reform_desc: "Prawa i przywileje mieszczan były zbyt rozległe przez zbyt długi czas. Wojny i ekspansja państwa napotykają na brak wsparcia ze strony naszej własnej klasy kupców. Nadszedł czas, by ograniczyć prawa kupców i stworzyć scentralizowane państwo."
 mechanic_seizing_land_no_rebels_from_estate_burghers_yes: "Odebranie ziemi od §Ymieszczaństwa§! nie wywołuje buntów mieszczaństwa"
 mercantilistic_approach_reform: "Podejście merkantylne"
 mercantilistic_approach_reform_desc: "Wolny handel oznacza równą relację między importem a eksportem towarów. Choć jest to korzystne w przypadku niektórych towarów, ma niewielką wartość dla naszego państwa. Tylko poprzez maksymalizację eksportu przy jednoczesnej minimalizacji importu z zagranicy, nasze państwo może rozwijać swoją gospodarkę."
 mechanic_no_mercantilism_loss_from_privilege_yes: "Przywilej '§Yzadłużenie u mieszczaństwa§!' nie zmniejsza już merkantylizmu."
 free_trade_reform: "Przyjęcie wolnego handlu"
 free_trade_reform_desc: "Kupcy z całego świata powinni mieć możliwość podróżowania na nasze ziemie i angażowania się w handel z naszą ludnością. Porzucając ciasnotę merkantylizmu, państwo zyskuje łatwiejszy dostęp do zagranicznych myśli."
 mechanic_monarch_power_on_institutions_yes: "Przyjęcie nurtu daje teraz §G100§! punktów monarchy każdej kategorii"
 mechanic_free_improve_inland_routes_yes: "Polityka handlowa '§Yrozwój śródlądowych szlaków§!' nie wymaga już korzystania z siły handlu."
 lockean_proviso_reform: "Lockean Proviso"
 lockean_proviso_reform_desc: "Niewykorzystana własność jest marnotrawstwem zarówno dla natury, jak i państwa. Wprowadzając i kładąc nacisk na dobra stałe, które przynoszą użyteczność przez pewien czas, ludzie mogą wymieniać swoje nadmierne posiadłości bez naruszania prawa naturalnego. Rząd łagodziłby konflikt między akumulacją własności a dystrybucją bogactwa."
 embrace_the_economic_theory_reform: "Przyjęcie teorii ekonomicznej"
 embrace_the_economic_theory_reform_desc: "Gospodarka odgrywa niezaprzeczalnie ważną rolę w aparacie państwa. Złożone systemy handlu, finansów i luksusu muszą zostać okiełznane, aby służyły zdrowiu rządu."
 reestablish_the_burgeoisie_reform: "Przywrócenie klasy mieszczańskiej"
 reestablish_the_burgeoisie_reform_desc: "Mieszczaństwo w przeszłości było klasą kupców i rzemieślników. W przeciwieństwie do szlachty, klasa mieszczan nie odgrywała żadnej roli w ucisku ludności w przeszłości i dlatego warto ją przywrócić."
 mechanic_halved_parliament_bribes_yes: "Zmniejszenie kosztu przekupstwa parlamentu o §G50%§!"
 less_than_15_provinces_on_same_continent: "Ma mnie niż §Y15§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 less_than_25_provinces_on_same_continent: "Ma mnie niż §Y25§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 less_than_35_provinces_on_same_continent: "Ma mnie niż §Y35§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 less_than_50_provinces_on_same_continent: "Ma mnie niż §Y50§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 at_least_15_provinces_on_same_continent: "Ma co najmniej §Y15§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 at_least_25_provinces_on_same_continent: "Ma co najmniej §Y25§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 at_least_35_provinces_on_same_continent: "Ma co najmniej §Y35§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 at_least_50_provinces_on_same_continent: "Ma co najmniej §Y50§! prowincji na kontynencie §Y[Root.Capital.GetContinentName]§!."
 support_monarchists: "Poprzeć monarchistów"
 support_orangists: "Poprzeć oranżystów"
 support_theocrats: "Poprzeć teokratów"
 support_statists: "Poprzeć statystów"
 support_revolutionaries: "Poprzeć rewolucjonistów"
 support_militarists: "Poprzeć militarystów"
 pay_militarization: "Ograniczyć militaryzację"
 passive_effects_events.1.t: "Działania dyplomatów religijnych"
 passive_effects_events.1.desc: "Nasi dyplomaci religijni byli ostatnio bardzo zajęci. Przemierzyli cały kontynent, by spotkać nowych braci i siostry w wierze."
 passive_effects_events.1.a: "Chwała dyplomatom religijnym!"
 custom_global_allowed_num_of_buildings: "Zaplanowane budowle"
 custom_global_allowed_num_of_buildings_desc: "W przeszłości mieszkańcy naszych miast stawiali budynki według własnego uznania, co prowadziło do ogromnego marnotrawstwa przestrzeni. Dzięki nowej strategii, którą nazywamy „planowaniem”, wykorzystujemy teraz dostępne miejsce znacznie efektywniej."
 custom_all_estate_influence_modifier_positive: "Prawa stanów"
 custom_all_estate_influence_modifier_positive_desc: "Nasze państwo nie mogłoby istnieć bez stanów. Każdy z nich odgrywa ważną rolę w rządzie, dzięki czemu uzyskał znaczącą pozycję i wpływy w kraju."
 custom_all_estate_influence_modifier_negative: "Kontrola nad stanami"
 custom_all_estate_influence_modifier_negative_desc: "Oczywiste jest, że w państwach o mniej absolutnej władzy stany mają ogromne wpływy na rządy. Korumpują władców swoimi żądaniami i przywilejami, dbając wyłącznie o własne korzyści.\nMusimy kontrolować stany i każdy ich krok!"
 custom_can_colony_boost_development: "Ustawa o wykwalifikowanej emigracji"
 custom_can_colony_boost_development_desc: "W przeciwieństwie do innych potęg kolonialnych wysyłamy do Nowego Świata wyłącznie najlepszych ludzi. Nasi koloniści są ekspertami w swoich dziedzinach i potrafią przetrwać na dzikich terenach obcego kontynentu bez jakiegokolwiek wsparcia z zewnątrz."
 custom_can_transfer_vassal_wargoal: "Agresywne negocjacje"
 custom_can_transfer_vassal_wargoal_desc: "Skoro możemy domagać się więcej, powinniśmy posunąć się jeszcze dalej i zażądać nawet najbardziej lojalnych poddanych naszych przeciwników."
 custom_ignore_coring_distance: "Administracja przez lokalnych gubernatorów"
 custom_ignore_coring_distance_desc: "Dlaczego mielibyśmy zarządzać wyłącznie prowincjami połączonymi bezpośrednio z naszą stolicą? Dzięki umiejętnemu wykorzystaniu lokalnych gubernatorów możemy sprawnie administrować prowincjami oddzielonymi od naszego rządu centralnego."
 custom_national_focus_years: "Elastyczna biurokracja"
 custom_national_focus_years_desc: "Biurokracja jest powolna, uciążliwa i nieefektywna. Tak twierdzą rządy państw o sztywnym systemie administracyjnym.\nMy natomiast opanowaliśmy sztukę prowadzenia dokumentacji i potrafimy znacznie szybciej zmieniać priorytety państwa niż mniej merytokratyczne kraje świata."
 custom_no_stability_loss_on_monarch_death: "Ceremonie pogrzebowe"
 custom_no_stability_loss_on_monarch_death_desc: "Śmierć jest naturalną częścią życia — nawet królowie nie są przed nią bezpieczni. Uczcijmy naturalny kres życia naszych monarchów i początek nowego cyklu rządów."
 custom_development_cost_modifier: "Wspierana urbanizacja"
 custom_development_cost_modifier_desc: "Osady wiejskie kształtują gospodarkę naszego kraju. Choć mają swoje zalety, nie dorównują tętniącym życiem metropoliom imperiów. Musimy wspierać urbanizację i zachęcać chłopów naszego państwa do awansu społecznego."
 custom_monthly_church_power: "Zorganizowane nabożeństwa"
 custom_monthly_church_power_desc: "W naszych miejscach kultu obowiązuje ścisły harmonogram ceremonii. Każdy etap jest szczegółowo zaplanowany, a wszyscy bez wyjątku muszą uczestniczyć w tych rytuałach."
 custom_can_not_build_colonies: "Zakaz emigracji"
 custom_can_not_build_colonies_desc: "Nasze państwo potrzebuje każdego dostępnego człowieka. Z tego względu nie ma mowy o zainteresowaniu koloniami ani jakąkolwiek inną formą emigracji."
 custom_can_not_build_buildings: "Odebrane prawa miejskie"
 custom_can_not_build_buildings_desc: "Miasta rozwijają się zbyt szybko i zagrażają autorytetowi naszego rządu. Możemy go utrzymać wyłącznie poprzez odebranie im praw miejskich, a tym samym prawa do wznoszenia budynków."
 custom_can_not_build_missionaries: "Zakaz przymusowych nawróceń"
 custom_can_not_build_missionaries_desc: "Religia jest trucizną, której jedyną korzyścią jest cierpienie tych, którzy nie wierzą w to, w co wierzymy my. Zakaz przymusowych nawróceń to oświecona droga naprzód dla mieszkańców naszych ziem."
 custom_can_not_declare_war: "Pacyfizm państwowy"
 custom_can_not_declare_war_desc: "Wypowiedzenie wojny oznacza przyznanie się do słabości i niezdolności do samodzielnego rozwoju. Nasze państwo przyjmuje zasady pacyfizmu, a tym samym wyższości moralnej."
 custom_can_not_send_merchants: "Zamknięte rynki"
 custom_can_not_send_merchants_desc: "Wolny handel prowadzi do naszej własnej zagłady gospodarczej. Nasi kupcy jedynie unikają podatków i zapewniają bogactwo naszym rywalom.\nZamykając rynki i ograniczając pozycję kupców, możemy uchronić kraj przed tak ponurym losem."
 custom_capped_by_forcelimit: "Ograniczone magazyny zaopatrzenia"
 custom_capped_by_forcelimit_desc: "Zgodnie z naszymi możliwościami logistycznymi państwo może utrzymywać jedynie siły mieszczące się w granicach „limitu zaopatrzenia”. Rekrutacja kolejnych oddziałów będzie niemożliwa, dopóki nie zbudujemy dodatkowych magazynów zaopatrzenia — co przy naszym ograniczonym poziomie technologicznym jest niewykonalne."
 custom_reform_progress_growth_building: "Infrastruktura rządowa"
 custom_reform_progress_growth_building_desc: "Nikogo nie dziwi, że dokumentacja rządowa wymaga odpowiedniego miejsca do przechowywania i obsługi."
 custom_can_chain_claim: "Wydajne fałszerstwo"
 custom_can_chain_claim_desc: "Tworzenie skromnych roszczeń do sąsiednich prowincji to rzemiosło amatorskich szpiegów. Nasi agenci opanowali jednak sztukę fałszerstwa i potrafią przygotować roszczenia nawet do najbardziej odległych ziem."
 custom_reasons_to_elect: "Przyjaciele na wysokich stanowiskach"
 custom_reasons_to_elect_desc: "W przeciwieństwie do innych organizmów politycznych Święte Cesarstwo Rzymskie jest zbiorem na wpół suwerennych państw, które wybierają cesarza. Na szczęście mamy przyjaciół na wysokich stanowiskach, którzy mogą zapewnić nam wstąpienie na tron cesarski."
 custom_allow_client_states: "Państwa siostrzane"
 custom_allow_client_states_desc: "Bezpośrednie sprawowanie rządów nad rozległymi ziemiami może nadmiernie obciążać naszą administrację. Tworząc państwa siostrzane podległe naszemu państwu, możemy zmniejszyć ciężar zarządzania wielkimi terytoriami."
 custom_allow_free_estate_privilege_revocation: "Autorytet korony"
 custom_allow_free_estate_privilege_revocation_desc: "Klasy społeczne i państwo zawarły porozumienie: korona królewska ma prawo odebrać klasom wszelkiego rodzaju przywileje, a w zamian klasy mogą istnieć."
 custom_free_maintenance_on_expl_conq: "Duch odkrywcy"
 custom_free_maintenance_on_expl_conq_desc: "W przeciwieństwie do generałów i admirałów konkwistadorzy oraz odkrywcy naszego państwa wyruszają w drogę nie z obowiązku ani dla osobistych korzyści, lecz z pragnienia odkrywania tego, co dotąd pozostawało ukryte przed ludzkością."
 custom_stability_cost_to_declare_war: "Edykt wojny totalnej"
 custom_stability_cost_to_declare_war_desc: "Wojna. Nasz kraj zna tylko wojnę.\nWojna. Tylko ją przyniesiemy światu.\nNiech bagna uginają się pod ciężarem naszych wojsk, a ci, którzy kryją się za złudzeniem pokoju, zadrżą ze strachu."
 custom_transport_attrition: "Beczki cytryn"
 custom_transport_attrition_desc: "Jedną z najczęstszych przyczyn śmierci żeglarzy na pełnym morzu jest szkorbut. Wyposażając każdy nasz okręt w beczki pełne cytryn, możemy ograniczyć liczbę marynarzy umierających z powodu tej przeklętej choroby."
 custom_regiment_disembark_speed: "Szkolenie desantowe"
 custom_regiment_disembark_speed_desc: "Wojsko zazwyczaj rozdziela siły lądowe i morskie, zapewniając każdej grupie odrębne szkolenie. Choć metoda ta ma swoje zalety, staje się przeszkodą, gdy jednostki lądowe i morskie muszą współpracować. Wprowadzając szkolenie desantowe, możemy przyspieszyć wysadzanie naszych wojsk z okrętów."
 custom_years_to_integrate_personal_union: "Akt unii"
 custom_years_to_integrate_personal_union_desc: "Akt unii to szczególna konstytucja łącząca nasz tron z tronami młodszych partnerów unii personalnej. Zapewnia on w istocie narzucenie praw naszego państwa młodszemu partnerowi i ułatwia jego integrację."
 custom_landing_penalty: "Surowe szkolenie desantowe"
 custom_landing_penalty_desc: "Starcie z wrogiem na równym terenie jest prostym zadaniem. Walka w trudnym terenie stanowi większe wyzwanie, lecz nasi ludzie potrafią mu sprostać. Atak na armię przeciwnika podczas desantu morskiego to jednak samobójstwo.\nZe względu na nasze duże uzależnienie od okrętów transportowych musimy zaakceptować, że po desancie nasze siły nieuchronnie będą musiały stoczyć walkę. Musimy przygotować je do tego wyjątkowego rodzaju starcia poprzez surowe szkolenie."
 custom_cb_on_overseas: "Przyjęty imperializm"
 custom_cb_on_overseas_desc: "Świat stał się mały. Imperia rozszerzają swoje wpływy we wszystkich kierunkach i podporządkowują sobie tych, którzy nie potrafią się bronić. Epoka lokalnych konfliktów dobiegła końca. Nastał wiek imperializmu.\nOczywiście nie możemy pozwolić sobie na pozostanie w tyle. My również musimy wziąć udział w wyścigu o podział świata."
 custom_flagship_cost: "Finansowanie okrętu flagowego"
 custom_flagship_cost_desc: "Okręt flagowy jest klejnotem naszej floty. Jest jednak również celem wrogich ataków podczas walki, przez co może zatonąć. Musimy zadbać o to, by zawsze dysponować zasobami pozwalającymi odbudować okręt flagowy niewielkim kosztem."
 custom_colonial_type_change_cost_modifier: "Elastyczna biurokracja kolonialna"
 custom_colonial_type_change_cost_modifier_desc: "Gubernatorzy kolonialni reprezentują wolę korony w Nowym Świecie. Nie zawsze jednak nadają się do pełnienia swoich funkcji, a administracja kolonii musi dostosowywać się do nowych wymagań zwierzchnika. Elastyczna biurokracja kolonialna pozwoli nam łatwo zmieniać formę rządów w kolonii."
 custom_colonial_subject_type_upgrade_cost_modifier: "Inwestorzy Nowego Świata"
 custom_colonial_subject_type_upgrade_cost_modifier_desc: "Kolonie w Nowym Świecie przyciągają wielu ludzi pragnących szczęścia w roli osadników. Przyciągają jednak również kupców, handlarzy i innych bogaczy, którzy dostrzegają szansę na pomnożenie swojego majątku. Przyznając tym inwestorom przywileje, możemy zadbać o to, by ich pieniądze wspierały nasze własne plany wobec kolonii."
 custom_has_carolean: "Karolinowie"
 custom_has_carolean_desc: "Karolinowie to szwedzka i fińska piechota imperium szwedzkiego. Rekrutowani spośród chłopstwa, przechodzą surowe szkolenie i słyną z tego, że budzą strach w sercach wrogów.\nRegimenty Karolinów można rekrutować wyłącznie w posiadanych prowincjach o kulturze §Yszwedzkiej§! lub §Yfińskiej§!, a możliwa liczba jednostek zależy od rozwoju tych prowincji."
 custom_amount_of_carolean: "Hymn Carolus Rex"
 custom_amount_of_carolean_desc: "Karolinowie walczą do gorzkiego końca i bez wahania ruszają do szarży. Niech ich zwycięstwa i wola walki zostaną uwiecznione w hymnie, który będzie inspiracją dla wszystkich!"
 custom_can_recruit_hussars: "Husaria"
 custom_can_recruit_hussars_desc: "Husaria to potężna, lecz rzadka jednostka. Jej niszczycielskie szarże zadają ogromne straty morale przeciwnika, a ponadto doskonale sprawdza się w §Yfazie szoku§!. \n\nLiczba regimentów §Yhusarii§! jest obliczana na podstawie rozwoju prowincji z akceptowanymi kulturami, w przeliczeniu na 1 jednostkę na każde 100 punktów rozwoju."
 custom_amount_of_hussars: "Rzuć monetą husarzowi"
 custom_amount_of_hussars_desc: "Husaria to elita naszej armii. Jej udział wielokrotnie przesądzał o wyniku bitwy. Służba w husarii nie jest jednak łatwym losem. Pokażmy mieszkańcom naszego kraju, z czym muszą mierzyć się husarze, i pozwólmy im przekazywać część swoich oszczędności na ich utrzymanie."
 custom_military_tactics: "Gry taktyczne"
 custom_military_tactics_desc: "Zwycięstwo rodzi się najpierw w umyśle. Przemyślne taktyki i pozbawione skrupułów strategie mają w naszym wojsku najwyższy priorytet. Państwo zapewnia żołnierzom i dowódcom dostęp do gier taktycznych, takich jak szachy, aby wpajać tę zasadę każdemu z nich."
 custom_max_hostile_attrition: "Polityka wojny partyzanckiej"
 custom_max_hostile_attrition_desc: "Podczas gdy taktyka spalonej ziemi odcina najeźdźców od zaopatrzenia, milicja wyczerpuje wroga poprzez wojnę partyzancką. Dzięki tym dwóm działaniom żadna wroga armia nie będzie mogła zbyt długo pozostawać na naszych ziemiach."
 custom_morale_damage: "Okrzyk bojowy"
 custom_morale_damage_desc: "Bitwy są starciem siły ludzkiej i sprzętu, lecz ostatecznie to morale zmusza armię do odwrotu. Nasi żołnierze doskonale o tym wiedzą i wydają potężne okrzyki bojowe, które przerażają nawet najodważniejszych wrogów."
 custom_morale_damage_received: "Żelazna wola"
 custom_morale_damage_received_desc: "Nasi wrogowie próbują wygrywać bitwy, odstraszając nas z pola walki. Choć ich wysiłki są godne uznania, poniosą porażkę, ponieważ nasi żołnierze mają żelazną wolę. Wolę, która nie zważa na nic poza zwycięstwem — nawet jeśli oznacza to walkę do ostatniego człowieka."
 custom_attack_bonus_in_capital_terrain: "Taktyka na znanym terenie"
 custom_attack_bonus_in_capital_terrain_desc: "Taktyka na znanym terenie (znana również jako FTT) to manewry wojskowe opracowane przez sztab armii. Są to wyspecjalizowane doktryny i zestawy taktyk, które sprawdzają się na obszarach dobrze znanych wszystkim naszym żołnierzom."
 custom_can_bypass_forts: "Manewr obejścia fortyfikacji"
 custom_can_bypass_forts_desc: "Nasi generałowie odkryli nową, potężną strategię, która znacznie ułatwi pokonywanie umocnień: dzięki złożonemu manewrowi nasze wojska mogą ominąć fortyfikacje, obchodząc je dookoła.\nDowództwo wojskowe przysięga, że wielokrotnie obserwowało tę sztuczkę u naszych przeciwników."
 custom_force_march_free: "Wielki marsz"
 custom_force_march_free_desc: "Każdy rekrut musi wziąć udział w długim marszu wzdłuż granic naszego wielkiego państwa. Musi ukończyć go w ciągu jednego dnia, a ci, którym się to nie uda, zostaną wydaleni z wojska. Tylko najlepsi są w stanie sprostać tym warunkom i służyć w naszych siłach zbrojnych."
 custom_global_attacker_dice_roll_bonus: "Szczęście sprzyja atakującym"
 custom_global_attacker_dice_roll_bonus_desc: "Fortuna sprzyja odważnym. A nikt nie jest odważniejszy niż nasi żołnierze ruszający do natarcia."
 custom_global_defender_dice_roll_bonus: "Szczęście obrońcy"
 custom_global_defender_dice_roll_bonus_desc: "Choć nikt nie chce się do tego przyznać, szczęście odgrywa dużą rolę na polu bitwy. Na szczęście podczas obrony przed obcymi najeźdźcami zdaje się nam sprzyjać samo przeznaczenie."
 custom_own_territory_dice_roll_bonus: "Przewaga własnego terenu"
 custom_own_territory_dice_roll_bonus_desc: "Prowadzenie wojny na obcym terytorium jest niebezpiecznym przedsięwzięciem. Żołnierze nie znają terenu, miejscowi spiskują przeciwko najeźdźcom, a sama infrastruktura może okazać się bezużyteczna. Z tych powodów żadne obce państwo nie odniesie znaczących sukcesów na naszych ziemiach."
 custom_regiment_manpower_usage: "Lokalny pobór"
 custom_regiment_manpower_usage_desc: "Choć jest to bardzo niekonwencjonalne rozwiązanie, regimenty naszej armii mogą rekrutować nowych żołnierzy spośród miejscowej ludności — niezależnie od ich wcześniejszego doświadczenia oraz różnic kulturowych i religijnych. Dzięki tej taktyce możemy znacznie oszczędzać własne rezerwy rekrutów."
 custom_idea_manpower_in_own_culture_provinces: "Kultura wojowników"
 custom_idea_manpower_in_own_culture_provinces_desc: "W naszej kulturze mężczyzna staje się prawdziwym mężczyzną dopiero po odbyciu służby wojskowej. Choć tradycja ta jest krytykowana jako „okrutna”, przyniosła nam wiele zwycięstw i nadal będzie je przynosić."
 custom_idea_manpower_in_accepted_culture_provinces: "Służba wojskowa w zamian za obywatelstwo"
 custom_idea_manpower_in_accepted_culture_provinces_desc: "Każdy mieszkaniec naszego kraju, który nie urodził się jako jeden z nas, musi udowodnić swoją wartość poprzez służbę wojskową. Dopiero wtedy może uzyskać pełne obywatelstwo."
 custom_idea_manpower_in_culture_group_provinces: "Bracia broni"
 custom_idea_manpower_in_culture_group_provinces_desc: "W czasie wojny potrzebny jest każdy człowiek. Żołnierze z pokrewnych nam kultur walczą na froncie ramię w ramię z naszymi ludźmi."
 custom_may_build_supply_depot: "Szkolenie logistyczne"
 custom_may_build_supply_depot_desc: "Wojna to nie tylko starcie siły ludzkiej i zasobów, lecz także logistyki. Każdy żołnierz powinien znać szczegóły prowadzenia działań logistycznych."
 custom_may_refill_garrison: "Szybkie uzupełnianie garnizonu"
 custom_may_refill_garrison_desc: "Obrona jest najlepszą formą ataku. Przynajmniej tak usłyszeli świeżo przydzieleni obrońcy garnizonu."
 custom_may_return_manpower_on_disband: "Rozbudowana administracja wojskowa"
 custom_may_return_manpower_on_disband_desc: "Większość żołnierzy bezpowrotnie tracimy po zakończeniu przez nich służby, ponieważ zazwyczaj nie da się ich odnaleźć. Rozbudowując administrację i angażując naszych biurokratów w sprawy wojskowe, możemy zagwarantować, że byli żołnierze powrócą do służby."
 custom_manpower_against_imperial_enemies: "Cesarskie wezwanie do broni"
 custom_manpower_against_imperial_enemies_desc: "Święte Cesarstwo Rzymskie jest domem dla wielu na wpół suwerennych państw, z których każde ma własne plany i interesy. Jednak w chwilach zagrożenia zewnętrznego członkowie Cesarstwa odpowiadają na cesarskie wezwanie do broni i udostępniają nam swoje wojska."
 custom_global_trade_goods_size: "Plan pięcioletni"
 custom_global_trade_goods_size_desc: "Wszyscy chłopi oraz właściciele ziemscy muszą obiecać koronie, że w ciągu najbliższych pięciu lat wyprodukują określoną ilość dóbr. Towary te zostaną następnie wykorzystane do pomnożenia bogactwa państwa."
 flavor_fin.1.t: "Fińskie ambicje imperialne"
 flavor_fin.1.desc: "W miarę jak nasze państwo przekształca się w prawdziwe imperium, dumni Finowie pragną odzwierciedlić historię sukcesu naszego [Root.GovernmentName], które zdołało podnieść się z nędzy i osiągnąć wielkość. Nasi doradcy przedstawili kilka propozycji odpowiedniej nazwy dla powstającego imperium..."
 flavor_fin.1.a: "Będziemy znani jako Fińskie Imperium Bałtyckie!"
 flavor_fin.1.b: "Imperium Fińskie — prosto i elegancko!"
 flavor_fin.1.c: "Nasze państwo będzie Wielką Finlandią!"
 flavor_fin.1.d: "W ojczystym języku naszego państwa: Suomi!"
 flavor_fin.1.e: "Powinniśmy jednak pozostać przy nazwie Finlandia."
 pol_leverage_magnates_title: "Wpływ magnatów"
 pol_leverage_magnates_desc: "Magnaci mają kluczowe znaczenie dla polskiego rządu i społeczeństwa. Musimy zająć się ich statusem w królestwie, albo dając im więcej władzy, albo ją ograniczając."
 pol_great_sejm_title: "Sejm Wielki"
 pol_great_sejm_desc: "Parlament, Sejm, od dziesięcioleci doradza królowi we wszystkich ważnych aspektach królestwa. Stał się tak ważny dla naszego rządu, że dalsze promowanie go byłoby mądrym posunięciem."
 pol_branching_mission_aa_title: "Misja zablokowana"
 pol_branching_mission_aa_desc: ""
 pol_branching_mission_gl_title: "Misja zablokowana"
 pol_branching_mission_gl_desc: ""
 pol_branching_mission_ga_title: "Misja zablokowana"
 pol_branching_mission_ga_desc: ""
 pol_throne_bohemia_title: "Tron Czech"
 pol_throne_bohemia_desc: "Sąsiadujące ze sobą królestwa Polski i Czech mają historię bliskich relacji, ale także konfliktów granicznych. W ostatnich dziesięcioleciach powstanie husyckie miało kluczowe znaczenie dla polityki regionalnej. Teraz mamy szansę rozwiązać ten zakorzeniony problem, albo oferując Jagiellona na tron czeski, albo próbując raz na zawsze zmiażdżyć husytów."
 pol_balance_princely_lands_title: "Równowaga ziem książęcych"
 pol_balance_princely_lands_desc: "Nasza potęga rozszerzyła się nie tylko w naszej ojczyźnie, Polsce, ale także w przyłączonych regionach Czech i Węgier. Zrównoważone i harmonijne zarządzanie wszystkimi naszymi ziemiami jest konieczne, aby utrzymać ten wzrost i mocno ugruntować prymat Korony."
 pol_cultural_flowering_title: "Rozkwit kulturowy"
 pol_cultural_flowering_desc: "Rosnąca potęga i bogactwo naszego kraju sprawiły, że stał się on atrakcyjny dla artystów, uczonych i innych ludzi pióra i działania, zapoczątkowując Złoty Wiek, który możemy wykorzystać do rozwoju naszego rządu i społeczeństwa."
 pol_revival_krakow_title: "Odrodzenie Krakowa"
 pol_revival_krakow_desc: "Kraków od wieków jest stolicą Królestwa Polskiego. Chociaż już teraz jest najważniejszym miastem w naszym kraju i ważnym ośrodkiem handlowym, można w nim poczynić więcej inwestycji i ulepszeń, aby wykorzystać renesansowe idee, które rozprzestrzeniają się na całym kontynencie."
 pol_branching_mission_cf_title: "Misja zablokowana"
 pol_branching_mission_cf_desc: ""
 pol_branching_mission_sp_title: "Misja zablokowana"
 pol_branching_mission_sp_desc: ""
 pol_varna_aftermath_title: "Pokłosie bitwy pod Warną"
 pol_varna_aftermath_desc: "Wynik bitwy pod Warną, stoczonej 10 listopada 1444 roku, był wielką klęską chrześcijaństwa, a co więcej, Polska straciła także swojego króla, Władysława III. Teraz musimy rozwiązać kryzys sukcesyjny wynikający z jego śmierci, odbudować naszą armię i spróbować zabezpieczyć sąsiednie ziemie Węgier i Czech, aby stawić czoła zagrożeniu osmańskiemu."
 pol_protect_hungary_title: "Zabezpieczenie Węgier"
 pol_protect_hungary_desc: "Królestwo Węgier jest znacznie osłabione w wyniku bitwy pod Warną, co czyni powstanie Osmanów jeszcze bardziej niebezpiecznym dla całego regionu. Naszym obowiązkiem jest teraz podwojenie wysiłków w celu wzmocnienia naszych relacji i zapewnienia dodatkowego wsparcia w tych ponurych czasach."
 pol_support_mercantile_class_title: "Wsparcie kupców"
 pol_support_mercantile_class_desc: "Kupcy stanowią trzon miast i miasteczek naszego kraju. Nieustannie domagają się wsparcia w swoich działaniach handlowych, ale może to być dla nas korzystne, ponieważ możemy czerpać zyski, zachęcając do zawierania transakcji handlowych na naszych ziemiach i zapewniając ich lojalność."
 pol_breadbasket_europe_title: "Spichlerz Europy "
 pol_breadbasket_europe_desc: "Produkcja rolna w Polsce od wieków oparta jest na systemie folwarcznym. Gdybyśmy dalej inwestowali w rozbudowę i doskonalenie tego systemu, moglibyśmy znacznie zwiększyć produkcję oraz eksport zbóż przez Bałtyk, czyniąc nas spichlerzem Europy."
 pol_develop_countryside_title: "Rozwój wsi"
 pol_develop_countryside_desc: "Inwestycje w system folwarczny zostały uznane za skuteczne w tworzeniu dużej produkcji rolnej, co przyniosło nam ogromne zyski. Teraz nasi doradcy zasugerowali, że dalsza poprawa rozwoju wiejskich miast i wsi oraz standardów życia chłopów również pobudzi rynki na wsi, prowadząc do większego dobrobytu i wyższych zysków ekonomicznych."
 pol_branching_mission_iep_title: "Misja zablokowana"
 pol_branching_mission_iep_desc: ""
 pol_branching_mission_dem_title: "Misja zablokowana"
 pol_branching_mission_dem_desc: ""
 pol_branching_mission_low_title: "Misja zablokowana"
 pol_branching_mission_low_desc: ""
 pol_deal_mazovia_title: "Kwestia Piastów"
 pol_deal_mazovia_desc: "Ziemie Mazowsza było rządzone przez członków dynastii Piastów, odkąd zostały włączone do Królestwa Polskiego wieki temu. Te bogate ziemie znajdują się pośrodku naszych ziem, więc Księstwo Mazowieckie musi ponownie stać się pełnoprawną częścią Polski."
 pol_negotiate_nunciature_title: "Negocjowanie nuncjatury"
 pol_negotiate_nunciature_desc: "Polska była przyczółkiem katolicyzmu na Wschodzie, odkąd król Mieszko I przyjął chrzest w zachodnim obrządku łacińskim, a jego następcy przysięgli wierność Stolicy Apostolskiej. Teraz nasze poświęcenie i wysiłek zasługują na nagrodę od papieża w postaci naszej prośby o nuncjaturę papieską, która pozwoliłaby nam zmaksymalizować nasze wpływy w Rzymie."
 pol_expand_krakow_university_title: "Uniwersytet w Krakowie"
 pol_expand_krakow_university_desc: "Uniwersytet Krakowski został założony przez króla Kazimierza Wielkiego i zatwierdzony przez papieża Urbana V w 1364 roku, stając się pierwszą i najważniejszą instytucją tego typu w naszym kraju. Jego sukces w dostarczaniu wykształconych uczonych, którzy służą nam przez wieki, zachęca do rozwoju uniwersytetu, ponieważ rozum jest silniejszy niż ciało."
 pol_branching_mission_eoe_title: "Misja zablokowana"
 pol_branching_mission_eoe_desc: ""
 pol_branching_mission_dv_de_title: "[Root.GetSelectableMissionTitle]"
 pol_branching_mission_dv_de_desc: "[Root.GetSelectableMissionDescription]"
 pol_branching_mission_te_ps_title: "[Root.GetSelectableMissionTitle]"
 pol_branching_mission_te_ps_desc: "[Root.GetSelectableMissionDescription]"
 pol_branching_mission_ic_pne_title: "[Root.GetSelectableMissionTitle]"
 pol_branching_mission_ic_pne_desc: "[Root.GetSelectableMissionDescription]"
 pol_polish_renaissance_title: "Polski renesans"
 pol_polish_renaissance_desc: "Ideały innowacji i odnowy rozprzestrzeniają się z Włoch, a Polska nie może pozostać w tyle. Musimy przyjąć ten renesans z otwartymi ramionami."
 pol_dissemination_new_ideas_title: "Propagowanie nowej wiedzy"
 pol_dissemination_new_ideas_desc: "Nowe wyznanie, reformacja, wyodrębniło się z katolicyzmu po tym, jak Marcin Luter publicznie ujawnił swoje 'Dziewięćdziesiąt pięć tez', odrzuconych przez papieża i uznanych za heretyckie. Nowe idee rozprzestrzeniły się w naszym kraju i teraz musimy stanąć przed decyzją, jaka będzie nasza polityka religijna od teraz. Czy pozostaniemy wiernymi katolikami, czy przyjmiemy wyznanie protestanckie lub reformowane jako naszą nową religię, czy też staniemy się bezpieczną przystanią tolerancji dla różnych wyznań?"
 pol_branching_mission_pm_title: "[Root.GetSelectableMissionTitle]"
 pol_branching_mission_pm_desc: "[Root.GetSelectableMissionDescription]"
 pol_moldavia_title: "Bunt Romana"
 pol_moldavia_desc: "Waśń dynastyczna wybuchła w Mołdawii po śmierci hospodara Aleksandra Dobrego w 1432 roku. Jest to strategiczne państwo, ponieważ uważamy je za naszą tarczę na granicy osmańskiej. Nadszedł czas, aby przywrócić porządek w tym strategicznym dla nas hospodarstwie."
 pol_wallachia_title: "Zmiażdżenie Wołochów"
 pol_wallachia_desc: "Wołoszczyzna jest kluczowym terytorium strategicznym, ponieważ znajduje się pośrodku ziem osmańskich i węgierskich. Dlatego też przejęcie nad nią kontroli pozwoliłoby nam stworzyć tarczę, która pomógłby nam zabezpieczyć nasze ziemie."
 pol_branching_mission_btr_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_btr_desc: "[Root.GetLockedMissionDescription]"
 pol_branching_mission_tpp_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_tpp_desc: "[Root.GetLockedMissionDescription]"
 pol_branching_mission_pph_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_pph_desc: "[Root.GetLockedMissionDescription]"
 LOCKED_MISSION_TITLE: "Misja zablokowana"
 LOCKED_MISSION_DESCRIPTION: "Ta misja jest zablokowana."
 pol_raise_noble_host_title: "Pospolite ruszenie"
 pol_raise_noble_host_desc: "W następstwie Warny musimy odzyskać zdolności naszej armii, skutecznie ponownie zwołując nasze szlacheckie wojska."
 pol_embellish_gdansk_title: "Rozwój portu bałtyckiego"
 pol_embellish_gdansk_desc: "Zapewniliśmy sobie kontrolę nad Gdańskiem, najważniejszym portem na południowo-wschodnim Bałtyku i kluczem do wzrostu gospodarczego naszego kraju. Gdybyśmy mogli go dalej rozwijać, znacznie zwiększyłoby to bogactwo naszego narodu."
 pol_branching_mission_db_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_db_desc: "[Root.GetLockedMissionDescription]"
 pol_branching_mission_ptp_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_ptp_desc: "[Root.GetLockedMissionDescription]"
 pol_branching_mission_constantinople_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_constantinople_desc: "[Root.GetLockedMissionDescription]"
 pol_prussia_confederation_title: "Związek Pruski"
 pol_prussia_confederation_desc: "Ludność Prus Zachodnich głośno woła o wyzwolenie spod panowania krzyżackiego. Musimy zaoferować im nasze wsparcie w walce o wolność, a także możemy zadać decydującą porażkę naszym odwiecznym wrogom."
 pol_branching_mission_bl_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_bl_desc: "[Root.GetLockedMissionDescription]"
 pol_branching_mission_dop_title: "[Root.GetLockedMissionTitle]"
 pol_branching_mission_dop_desc: "[Root.GetLockedMissionDescription]"
 plc_articles_agreement_title: "Warunki uzgodnione"
 plc_articles_agreement_desc: "Za każdym razem, gdy nowy król zostaje wybrany przez Sejm Wielki, musi on zobowiązać się do przestrzegania postanowień dokumentu potwierdzającego prawa Rzeczypospolitej, znanego jako 'Pacta Conventa'. Teraz gdy władza naszego władcy została zwiększona, mamy okazję przeformułować te warunki uzgodnione na naszą korzyść."
 plc_golden_liberty_title: "Złota wolność"
 plc_golden_liberty_desc: "W Rzeczypospolitej Obojga Narodów, w związku z rosnącym wpływem szlachty na politykę, powstał unikalny system polityczny, nazywany złotą wolnością, który z czasem przekształcił się w republikę pod przewodnictwem [Root.Monarch.GetRulerGen]. Od naszej decyzji będzie zależało, w jakiej formie będzie ona odtąd funkcjonować."
 plc_governance_act_title: "Konstytucja"
 plc_governance_act_desc: "Wiatry zmian dotarły do naszego narodu, napędzane walką między reżimami absolutystycznymi i rewolucyjnymi. W związku z tym nowa konstytucja jest potrzebna różnym stanom, które tworzą społeczeństwo naszego kraju, i to w naszych rękach leży określenie jej podstaw i zakresu."
 plc_cross_wild_field_title: "Przez dzikie ziemie"
 plc_cross_wild_field_desc: "Bałkany są bardzo rozdrobnionymi terytoriami, które nie były w stanie zostać skonsolidowane pod jednolitym rządem, o ile nam wiadomo, od czasów rzymskich cesarzy. Teraz jednak mamy ambicję zjednoczyć ziemie południowych Słowian pod naszymi rządami."
 plc_cultural_flowering_title: "Rozkwit kulturowy"
 plc_cultural_flowering_desc: "Nasze wysiłki sprawiły, że nasz kraj posiada doskonałą pozycję wśród naszych sąsiadów, dzięki naszym wpływom politycznym, dyplomatycznym i gospodarczym. Oznaczało to Złoty Wiek dla naszego kraju, uważany przez obywateli i obcokrajowców, umacniając nas jako wiodące centrum sztuki i kultury."
 plc_seats_power_title: "Siedziby władzy"
 plc_seats_power_desc: "Chociaż mamy rozwijającą stolicę, różne rezydencje zasłużyły na to, by być siedzibą naszego władcy podczas jego podróży po kraju. Jednymi z najbardziej godnych uwagi są zamki na wyspie Troki, dawna rezydencja Wielkich Książąt Litewskich, oraz Malbork, zdobyty na Zakonie Krzyżackim. Dalsze ulepszenia uczyniłyby je uroczymi i bezpiecznymi tymczasowymi rezydencjami dla naszego dworu."
 plc_invest_eastern_poland_title: "Inwestycje we wsch. Polsce"
 plc_invest_eastern_poland_desc: "Co powiemy, gdy nasze dzieci zapytają: 'dlaczego nie zainwestowałeś we wschodniej Polsce?'"
 plc_dominate_european_markets_title: "Dominacja na rynkach"
 plc_dominate_european_markets_desc: "Reformy, polityki i działania, które zostały przeprowadzone na przestrzeni czasu, pozwoliły nam zapewnić sobie dominującą pozycję na rynkach europejskich, jako główna potęga gospodarcza kontynentu."
 plc_break_the_rus_title: "Rozbicie Rusi"
 plc_break_the_rus_desc: "Rosyjscy książęta szybko rosną w siłę i wpływy. Jeśli nie podejmiemy wobec nich działań, przyćmią nas wojskowo i będziemy na ich łasce."
 plc_purple_phoenix_title: "Purpurowy Feniks"
 plc_purple_phoenix_desc: "Mamy okazję przejąć Konstantynopol, miasto pożądane przez cały świat, przywracając dawną chwałę rzymskich cesarzy."
 plc_proclaim_polish_hegemony_title: "Ogłoszenie hegemonii"
 plc_proclaim_polish_hegemony_desc: "Poświęciliśmy tak wiele wysiłku i zasobów, aby zabezpieczyć naszą władzę i pozycję, że teraz jesteśmy uważani za posiadacza hegemonii nad Bałtykiem!"
 plc_lifetime_of_war_title: "Czas wojny"
 plc_lifetime_of_war_desc: "Od czasu klęski pod Warną nasz kraj buduje silną i wyćwiczoną armię, która ochroni nas przed wszystkimi sąsiednimi zagrożeniami. Jeśli mamy chronić nasze granice, musimy wykorzystać lekcje sztuki wojennej. Wybierz, który obszar naszych sił zbrojnych będzie przewodził naszym wysiłkom militarnym przez następne wieki."
 plc_edict_education_title: "Edykt o edukacji"
 plc_edict_education_desc: "Rozbudowa Uniwersytetu Krakowskiego okazała się wielkim sukcesem. Dlatego mądrze byłoby rozpowszechnić korzyści płynące z kształcenia uczonych w całym kraju poprzez finansowanie nowych ośrodków nauki i wiedzy."
 plc_dominate_baltic_title: "Kontrola nad Bałtykiem"
 plc_dominate_baltic_desc: "Handel na Morzu Bałtyckim okazał się kluczowy dla dobra naszego kraju, kierując coraz większe bogactwo na nasze ziemie. Bardziej ambitne przedsięwzięcia mające na celu dalsze zwiększenie kontroli nad nim doprowadziłyby do większego bogactwa, zwiększając również naszą władzę nad regionem."
 plc_prevent_deluge_title: "Zapobieganie potopowi"
 plc_prevent_deluge_desc: "Słyszeliśmy niepokojące doniesienia ze Sztokholmu; jego władcy planują niszczycielską inwazję na Polskę, mającą na celu obrócenie naszego kraju w popiół. Nie możemy do tego dopuścić; musimy uderzyć na Sztokholm, zanim oni uderzą nas!"
 pol_develop_ukraine_title: "Rozwijanie Rusi"
 pol_develop_ukraine_desc: "Ziemie Rusi po obu stronach potężnego Dniepru są żyzne i obiecujące. Zostały jednak wyludnione przez wieki wojen i najazdów, pozostawiając Ruś jedynie cieniem tego, czym mogłaby być pod odpowiednią administracją. Musimy ponownie zainwestować w okiełznanie tego kraju."
 pol_tend_east_title: "[Root.GetPreviewColorPOL]Kierunek - wschód[Root.GetPreviewColorPOL_end]"
 pol_tend_east_desc: "Dzielimy wspólne przywództwo polityczne z Wielkim Księstwem Litewskim, odkąd królowa Jadwiga poślubiła wielkiego księcia Jagiełłę, zapoczątkowując dynastię Jagiellonów. Istniały napięcia między szlachtą polską i litewską, ale między tymi dwoma krajami rozwijały się również bliższe relacje, które mądrze byłoby kontynuować."
 pol_imperial_commonwealth_title: "[Root.GetPreviewColorPOL]Cesarstwo Rzeczpospolitej[Root.GetPreviewColorPOL_end]"
 pol_imperial_commonwealth_desc: "Rzeczpospolita Obojga Narodów okazała się wielkim sukcesem, podnosząc nas do rangi Cesarstwa, uznawanego przez inne europejskie dwory."
 pol_delegate_emperor_title: "Delegat u cesarza"
 pol_delegate_emperor_desc: "Święte Cesarstwo Rzymskie jest kłopotliwą jednostką polityczną, ale także prestiżową i kryje w sobie możliwości dalszego promowania naszego kraju ponad innych, jeśli uda nam się zapewnić dobre stosunki z cesarzem."
 pol_place_sun_title: "[Root.GetPreviewColorPOL]Nasze miejsce pod słońcem[Root.GetPreviewColorPOL_end]"
 pol_place_sun_desc: "Nasze starania o dołączenie do Cesarstwa zakończyły się sukcesem i udało nam się nawet zostać cesarskim elektorem. Teraz nadszedł czas, aby podnieść stawkę jeszcze wyżej i ubiegać się o tytuł Świętego Cesarza Rzymskiego."
 pol_proclaim_new_empire_title: "[Root.GetPreviewColorPOL]Proklamowanie nowego imperium[Root.GetPreviewColorPOL_end]"
 pol_proclaim_new_empire_desc: "Skorzystaliśmy z okazji, by stanąć na czele Świętego Cesarstwa Rzymskiego, otwierając w nim nową erę. Teraz musimy odcisnąć piętno naszego nowego rządu na tej starej polityce."
 plc_printing_movement_title: "Ruch drukarski"
 plc_printing_movement_desc: "Nasza ziemia jest pełna pastwisk i pól zieleni jak okiem sięgnąć. Nierozsądnie byłoby nie wykorzystać tak żyznej ziemi zarówno w przenośni, jak i dosłownie. Jeśli mamy przyjąć nowe trendy, które ogarniają Europę, takie jak prasa, musimy wyznaczyć odpowiedni obszar, na którym będzie się ona rozwijać."
 plc_break_livonia_title: "Ziemie inflanckie"
 plc_break_livonia_desc: "Nasza próba kontrolowania ziem pruskich zakończyła się sukcesem. Teraz mamy możliwość dalszego rozszerzania naszych wpływów poprzez przejęcie kontroli nad Rygą i ziemiami inflanckimi, ostatecznie kończąc zagrożenie krzyżowe dla naszego kraju."
 plc_duchy_pomerania_title: "Księstwo Pomorskie"
 plc_duchy_pomerania_desc: "Pomorskie porty byłyby naturalnym zapleczem dla naszego handlu bałtyckiego, gdyby udało nam się je zdobyć!"
