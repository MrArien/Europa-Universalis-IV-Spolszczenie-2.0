 PEACE_po_claim_norwegian_throne: "Zgłoś roszczenia do norweskiej korony"
 CB_ALLOWED_po_claim_norwegian_throne: "Zgłoś roszczenia do norweskiej korony"
 po_claim_norwegian_throne_desc: "[Root.GetName] i [NOR.GetName] utworzą Unię, z [Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName] stając się [Root.Monarch.GetTitle] ponad obydwoma narodami."
 po_extinguish_the_revolution: "Zgaś rewolucję"
 PEACE_po_extinguish_the_revolution: "Zgaś rewolucję"
 CB_ALLOWED_po_extinguish_the_revolution: "Zgaś rewolucję"
 po_extinguish_the_revolution_desc: "Wszystkie prowincje państwa [From.GetName], w których obecna jest rewolucja, odrzucą §Yrewolucję§!. Państwo [Root.GetName] otrzymuje §G100§! £adm£, §G100§! £dip£ i §G100§! £mil£."
 po_claim_elector_role: "Zdobądź godność elektora"
 PEACE_po_claim_elector_role: "Zdobądź godność elektora"
 CB_ALLOWED_po_claim_elector_role: "Zdobądź godność elektora"
 po_claim_elector_role_desc: "Państwo [Root.GetName] zostaje §Ykuratorem§! Świętego Cesarstwa Rzymskiego. Losowo wybrany poddany państwa [Root.GetName] traci godność elektora."
 po_raid_churches: "Najazd na kościół heretyków"
 PEACE_po_raid_churches: "Najazd na kościół heretyków"
 CB_ALLOWED_po_raid_churches: "Najazd na kościół heretyków"
 po_raid_churches_desc: "Państwo [Root.GetName] łupi najlepiej rozwinięty kościół lub katedrę, całkowicie niszcząc budowlę i plądrując prowincję. Państwo [Root.GetName] otrzymuje w zamian 50 punktów siły kościoła lub 25 punktów żarliwości."
 GRAND_CRUSADE_NO_OTHER_WAR: "Przewodzimy wielkiej krucjacie! Nie możemy pozwolić sobie na rozpraszanie uwagi kolejną wojną zaczepną."
 estate_burghers_forest_expansion: "Rozwój osadnictwa leśnego"
 estate_burghers_forest_expansion_desc: "Mieszczanie i chłopi przystosowali się do trudnego terenu lasów i puszcz, dzięki czemu mogą budować wspaniałe miasta nawet w najbardziej odległych i niedostępnych ostępach naszego [Root.GovernmentName]. Przyznając im dodatkowe przywileje, możemy zadbać o to, by wykorzystywali swoje zasoby z korzyścią dla całego państwa."
 estate_burghers_forest_expansion_gt: "Zmniejsza koszt rozwoju każdej posiadanej prowincji typu §Ylasy§! o §G15,0%§!, a każdej prowincji typu §Yzagajniki§! o §G10,0%§!."
 estate_burghers_forest_expansion_rt: "Usuwa obniżkę kosztu rozwoju ze wszystkich posiadanych prowincji typu §Ylasy§! i §Yzagajniki§!."
 estate_burghers_forest_expansion_forest: "Rozbudowa osadnictwa w lasach"
 desc_estate_burghers_forest_expansion_forest: "Mieszczanie i chłopi tego państwa otrzymali od rządu środki, które pozwalają im zagospodarowywać trudno dostępne leśne ostępy."
 estate_burghers_forest_expansion_woods: "Rozbudowa osadnictwa w zagajnikach"
 desc_estate_burghers_forest_expansion_woods: "Mieszczanie i chłopi tego państwa otrzymali od rządu środki, które pozwalają im zagospodarowywać trudno dostępne zadrzewione tereny."
 estate_burghers_mountain_expansion: "Rozwój osadnictwa górskiego"
 estate_burghers_mountain_expansion_desc: "Mieszczanie i chłopi przystosowali się do trudnego terenu gór i wyżyn, dzięki czemu mogą budować wspaniałe miasta nawet w najbardziej odległych i niegościnnych górach naszego [Root.GovernmentName]. Przyznając im dodatkowe przywileje, możemy zadbać o to, by wykorzystywali swoje zasoby z korzyścią dla całego państwa."
 estate_burghers_mountain_expansion_gt: "Zmniejsza karę do kosztu rozwoju wynikającą z rodzaju terenu we wszystkich posiadanych prowincjach typu §Ygóry§!, §Ywyżyny§! i §Ywzgórza§! o §G50,0%§!."
 estate_burghers_mountain_expansion_rt: "Usuwa obniżkę kosztu rozwoju ze wszystkich posiadanych prowincji typu §Ygóry§!, §Ywyżyny§! i §Ywzgórza§!."
 estate_burghers_mountain_expansion_mountains: "Rozbudowa osadnictwa w górach"
 desc_estate_burghers_mountain_expansion_mountains: "Mieszczanie i chłopi tego państwa otrzymali od rządu środki, które pozwalają im zagospodarowywać trudny górski teren."
 estate_burghers_mountain_expansion_highlands: "Rozbudowa osadnictwa na wyżynach"
 desc_estate_burghers_mountain_expansion_highlands: "Mieszczanie i chłopi tego państwa otrzymali od rządu środki, które pozwalają im zagospodarowywać trudny teren wyżynny."
 estate_burghers_mountain_expansion_hills: "Rozbudowa osadnictwa na wzgórzach"
 desc_estate_burghers_mountain_expansion_hills: "Mieszczanie i chłopi tego państwa otrzymali od rządu środki, które pozwalają im zagospodarowywać trudny teren wzgórz."
 estate_nobles_leidang_conscription: "Pobór w systemie leidang"
 estate_nobles_leidang_conscription_desc: "Leidang to szczególna forma poboru, która pozwala nam organizować flotę przybrzeżną na potrzeby wojen zaczepnych i obronnych. System polega na wcielaniu żeglarzy spośród chłopstwa i zobowiązywaniu ich do służby przez dwa lub trzy letnie miesiące w czasie pokoju. Podczas wojny wszyscy wolni mężczyźni muszą służyć we flocie."
 estate_nobles_danish_nobility: "Duńska szlachta"
 estate_nobles_danish_nobility_desc: "Z powodu czarnej śmierci nad naszym państwem władzę sprawuje zaledwie garstka norweskich możnowładców. Powstałą próżnię władzy wykorzystali duńscy szlachcice, którzy obecnie rządzą naszym krajem jako namiestnicy duńskiego króla."
 estate_nobles_nobles_instead_of_royal_court: "Dwór szlachecki"
 estate_nobles_nobles_instead_of_royal_court_desc: "Czarna śmierć zabiła ponad połowę ludności Norwegii, przez co utrzymywanie własnego dworu królewskiego przestało być możliwe. Zamiast tego naszym [Root.GovernmentName] zarządza dwór utrzymywany przez duńską szlachtę. Dopóki sprawuje ona władzę, legitymizacja prawdziwego norweskiego monarchy będzie nieustannie kwestionowana."
 estate_burghers_orthodox_tolerance: "Przyznaj autonomię prawosławnym"
 estate_burghers_orthodox_tolerance_desc: "Wyznania prawosławne i koptyjskie mogą być obce naszym chrześcijańskim wartościom, lecz w przeciwieństwie do innych herezji nie próbują szerzyć swojej wiary w granicach naszego państwa. Przyznając im pewien zakres autonomii w praktykach religijnych, możemy zapewnić sobie ich lojalność."
 estate_burghers_orthodox_tolerance_effect_tooltip: "Każda posiadana prowincja wyznająca religię §Yprawosławną§! lub §Ykoptyjską§! otrzymuje:\nLokalna siła misjonarzy: §R-100%§!\nLokalny wkład w jedność religijną: §G-100%§!"
 estate_burghers_orthodox_tolerance_revoke_effect_tooltip: "Modyfikator „§YPrzyznana autonomia prawosławnym§!” zostaje usunięty ze wszystkich posiadanych prowincji wyznających religię §Yprawosławną§! lub §Ykoptyjską§!."
 estate_burghers_guaranteed_autonomy_mod: "Gwarantowano autonomię prawosławia"
 desc_estate_burghers_guaranteed_autonomy_mod: "Państwo przyznało lokalną autonomię w praktykach religijnych kościoła prawosławnego i koptyjskiego."
 estate_church_anti_heresy_act: "Wprowadź ustawę przeciw herezji"
 estate_church_anti_heresy_act_desc: "Herezja pozostaje herezją, niezależnie od tego, czy jest nową nauką reformacyjną, czy dawną religią. Wprowadzając ustawę przeciw herezji, możemy zapewnić duchowieństwu środki potrzebne do prowadzenia inkwizycji przeciwko heretykom."
 has_no_effects_on_granted: "Nie ma żadnego efektu po przyznaniu."
 estate_nobles_carolean_march: "Marsz Karolinów"
 estate_nobles_carolean_march_desc: "Nawet pod ciężkim ostrzałem szyki oddziałów karolińskich nigdy nie mogą się załamać. Wyznaczając na dowódców szczególnie oddanych generałów wywodzących się ze szlachty, których determinacja pozostaje niezłomna nawet w ogniu bitwy, zapewnimy, że nasi Karolinowie ruszą na wroga w szyku i z dyscypliną."
 estate_nobles_carolean_charge: "Szarża Karolinów"
 estate_nobles_carolean_charge_desc: "Psychologia jest ważną bronią na wojnie. Karolinowie nie muszą celować z precyzją, skoro sam atak na wroga z pikami w dłoniach wywołuje wystarczającą panikę. Powinniśmy zatem wyznaczyć na dowódców wojowniczych szlachciców, którzy spojrzeli śmierci prosto w oczy."
 estate_nobles_carolean_march_modifier: "Marsz Karolinów"
 desc_estate_nobles_carolean_march_modifier: "Nawet pod ciężkim ostrzałem szyki oddziałów karolińskich nigdy nie mogą się załamać. Determinacja naszych Karolinów zastraszy każdego przeciwnika!"
 estate_nobles_carolean_charge_modifier: "Szarża Karolinów"
 desc_estate_nobles_carolean_charge_modifier: "Psychologia jest ważną bronią na wojnie. Karolinowie nie muszą celować z precyzją, skoro sam atak na wroga z pikami w dłoniach wywołuje wystarczającą panikę."
 estate_did_not_have_carolean_privilege_for_five_years: "W ciągu ostatnich §Y5 lat§! nie wybraliśmy przywileju §Ykarolińskiego§!."
 estate_church_lands_of_riga: "Ziemie kościelne Rygi"
 estate_church_lands_of_riga_desc: "Ziemie Inflant i Wenden mogą należeć do nas, lecz znaczna ich część znajduje się pod kontrolą arcybiskupstwa ryskiego. Dopóki istnieje konfederacja inflancka, przejęcie ziem należących do Rygi nie będzie możliwe."
 estate_church_bishopric_of_dorpat: "Biskupstwo dorpackie"
 estate_church_bishopric_of_dorpat_desc: "Biskupstwo dorpackie jest częścią konfederacji inflanckiej. Jego ziemie de iure należą do nas, lecz de facto administruje nimi konfederacja inflancka. Dopóki istnieje konfederacja, nie będziemy czerpać pełnych korzyści z tych prowincji."
 estate_church_bishopric_of_osel_wiek: "Biskupstwo Ösel-Wiek"
 estate_church_bishopric_of_osel_wiek_desc: "Biskupstwo Ösel-Wiek jest częścią konfederacji inflanckiej. Jego ziemie de iure należą do nas, lecz de facto administruje nimi konfederacja inflancka. Dopóki istnieje konfederacja, nie będziemy czerpać pełnych korzyści z tych prowincji."
 estate_church_bishopric_of_courland: "Biskupstwo kurońskie"
 estate_church_bishopric_of_courland_desc: "Biskupstwo Kurlandii jest częścią konfederacji inflanckiej. Jego ziemie de iure należą do nas, lecz de facto administruje nimi konfederacja inflancka. Dopóki istnieje konfederacja, nie będziemy czerpać pełnych korzyści z tych prowincji."
 estate_church_bishopric_of_reval: "Biskupstwo rewelskie"
 estate_church_bishopric_of_reval_desc: "Biskupstwo rewelskie jest częścią konfederacji inflanckiej. Jego ziemie de iure należą do nas, lecz de facto administruje nimi konfederacja inflancka. Dopóki istnieje konfederacja, nie będziemy czerpać pełnych korzyści z tych prowincji."
 estate_nobles_religious_conscription: "Pobór religijny"
 estate_nobles_religious_conscription_desc: "Religia jest potężnym narzędziem przyciągania ludzi gorliwych oraz tych, którzy nie mają innych możliwości. Przyznając szlachcie określone prawa do katedr, a duchowieństwu dodatkowe przywileje, możemy wykorzystywać kościoły i katedry do werbowania nowych żołnierzy w imię wiary."
 estate_nobles_religious_conscription_cathedral: "Pobór religijny"
 desc_estate_nobles_religious_conscription_cathedral: "Szlachta i duchowieństwo tej prowincji współpracują, by werbować nowych żołnierzy spośród gorliwych wiernych."
 estate_nobles_religious_conscription_temple: "Pobór religijny"
 desc_estate_nobles_religious_conscription_temple: "Szlachta i duchowieństwo tej prowincji współpracują, by werbować nowych żołnierzy spośród gorliwych wiernych."
 estate_nobles_religious_conscription_effect_tooltip: "Każda posiadana prowincja wyznająca religię §Y[Root.Religion.GetName]§! i posiadająca kościół otrzymuje §G+15,0%§! lokalnej siły żywej. Prowincje wyznające religię §Y[Root.Religion.GetName]§! i posiadające katedrę otrzymują zamiast tego §G+33,0%§! lokalnej siły żywej."
 estate_nobles_religious_conscription_revoke_effect_tooltip: "Modyfikator „§YPobór religijny§!” zostaje usunięty ze wszystkich posiadanych prowincji wyznających religię §Y[Root.Religion.GetName]§! i posiadających kościół lub katedrę."
 estate_nobles_leidang_mass_conscription: "Masowy pobór w systemie leidang"
 estate_nobles_leidang_mass_conscription_desc: "Współczesna wojna nie zważa na jakość uzbrojenia ani morale żołnierzy. Liczą się jedynie ludzie, których można rzucić na pole bitwy — na lądzie lub na morzu. Choć brzmi to okrutnie, musimy rozszerzyć pobór na wszystkie grupy mężczyzn, aby pozyskać jak najwięcej marynarzy."
 estate_nobles_leidang_mass_conscription_mod: "Masowy pobór w systemie leidang"
 desc_estate_nobles_leidang_mass_conscription_mod: "Współczesna wojna nie zważa na jakość uzbrojenia ani morale żołnierzy. Liczą się jedynie ludzie, których można rzucić na pole bitwy — na lądzie lub na morzu. Choć brzmi to okrutnie, musimy rozszerzyć pobór na wszystkie grupy mężczyzn, aby pozyskać jak najwięcej marynarzy."
 estate_nobles_leidang_elite_conscription: "Elitarny pobór w systemie leidang"
 estate_nobles_leidang_elite_conscription_desc: "Inni traktują swoich żołnierzy jak chodzące ciała, gotowe wypełnić obowiązek i zginąć w pierwszych dziesięciu sekundach walki. My jednak nie jesteśmy tacy jak inni. Nasi piechurzy morscy są najlepsi z najlepszych, równie dobrze wyszkoleni w walce na morzu i na lądzie. Jest ich niewielu, lecz dyscyplina czyni z nich skuteczną broń."
 estate_nobles_leidang_elite_conscription_mod: "Elitarny pobór w systemie leidang"
 desc_estate_nobles_leidang_elite_conscription_mod: "Inni traktują swoich żołnierzy jak chodzące ciała, gotowe wypełnić obowiązek i zginąć w pierwszych dziesięciu sekundach walki. My jednak nie jesteśmy tacy jak inni. Nasi piechurzy morscy są najlepsi z najlepszych, równie dobrze wyszkoleni w walce na morzu i na lądzie. Jest ich niewielu, lecz dyscyplina czyni z nich skuteczną broń."
 norse_events.1.t: "Ścieżki nordyckich bogów"
 norse_events.1.desc: "[Root.Monarch.GetName], wielki [Root.Monarch.GetTitle] państwa [Root.GetName], wybrał ścieżkę jednego z naszych bogów. Jednak [Root.Monarch.GetSheHe] nie ma pewności, czy obecny kult zaprowadzi [Root.Monarch.GetHerHim] do wspaniałych sal Walhalli. [Root.Monarch.GetSheHeCap] szuka teraz rady u stanu [Root.GetChurchOrFallbackName], aby ponownie rozważyć wybór osobistego bóstwa i wybrać takie, które przyniesie zwycięstwo oraz chwałę [Root.Monarch.GetHerHim] i ludowi [Root.GetAdjective]."
 norse_events.1.a: "Odyn zna naszą przyszłość. Poprowadzi nas i nasz lud."
 norse_events.1.b: "Freyja przyniesie owoce naszej pracy."
 norse_events.1.c: "Thor będzie nas chronić."
 norse_events.1.d: "Sprawiedliwość Tyra jest naszą drogą."
 norse_events.1.e: "Fale Njorda przyniosą bogactwo naszemu [Root.GovernmentName]."
 norse_events.1.f: "Niech mądrość Snotry poprowadzi nas ku świetlanej przyszłości."
 swe_historical_friends_nor_tt: "Jeśli ukończymy tę misję, gdy @NOR Norwegia będzie naszym poddanym i będzie miała co najmniej §Y50§! punktów opinii, nasza wzajemna przyjaźń historyczna umocni się."
 blackmailing: "Szantaż"
 blackmailing_desc: "Nawet najbardziej święty sojusznik ma swoje szkielety w szafie. Dobre relacje z sojusznikami to zawsze dobry początek, ale aby naprawdę nimi manipulować, powinniśmy upewnić się, że zawsze znamy listę ich sekretów i możemy wykorzystać je przeciwko nim, jeśli sprzeciwią się naszej dobrej woli."
 expanded_policies: "Rozszerzona polityka"
 expanded_policies_desc: "Polityka ma kluczowe znaczenie dla kierunku i przyszłości naszego kraju. Powinniśmy inwestować i rozwijać kodeks prawny naszego królestwa, abyśmy mogli łatwiej zarządzać polityką."
 norse_ideas: "Idee nordyckie"
 norse_ideas_start: "Tradycje nordyckie"
 norse_ideas_bonus: "Ambicja nordycka"
 norse_ideas_eternal_struggle: "Wieczna walka"
 norse_ideas_eternal_struggle_desc: "Od stuleci nasz lud walczy z obcymi lub między sobą — jarł przeciwko jarłowi, królestwo przeciwko królestwu. Zawsze jesteśmy gotowi do wojny, co czyni nas nieprzewidywalnym i budzącym grozę przeciwnikiem, gdyż nikt się nas nie spodziewa. Gdy tylko na horyzoncie pojawiają się żagle naszej floty, wrogowie wiedzą, że są zgubieni."
 norse_ideas_norse_seamen: "Nordyccy żeglarze"
 norse_ideas_norse_seamen_desc: "Na morzach, rzekach i jeziorach Nordowie od zawsze czują się jak w domu. Niewiele narodów potrafi tak dobrze żeglować i walczyć na wodzie jak my. Gdy rozpoczyna się bitwa, okręty i ich załogi działają jak jeden organizm, niszcząc każdego wroga, który ośmieli się im przeciwstawić."
 norse_ideas_a_wall_of_shields_for_the_king: "Ściana tarcz dla króla"
 norse_ideas_a_wall_of_shields_for_the_king_desc: "Pozycję przywódcy naszego ludu zdobywa się dzięki odwadze i poświęceniu. Żaden wojownik nie pójdzie za dowódcą, który jest tchórzem i nie zajmuje pierwszego szeregu w ścianie tarcz. Dlatego nasi przywódcy cieszą się szacunkiem podwładnych, a cała grupa działa jak jeden organizm — niczym młot uderzający w kowadło."
 norse_ideas_norse_artisans: "Nordyccy rzemieślnicy"
 norse_ideas_norse_artisans_desc: "Nasi wrogowie twierdzą, że jedyne, co potrafi nasz lud, to szerzyć śmierć. W rzeczywistości przede wszystkim jesteśmy rolnikami, rzemieślnikami i rybakami, którzy starają się zapewnić dobrobyt ubogim ziemiom zamieszkiwanym przez nas od stuleci."
 norse_ideas_berserkir: "Berserkir"
 norse_ideas_berserkir_desc: "Wśród naszych wojowników nie było niczym niezwykłym poświęcenie się zwierzęciu totemicznemu. Takich wojowników nazywano berserkirami (niedźwiedziami), jöfurrami (dzikami) lub úlfhéðnarami (wilkami). Wszyscy wpadali w bojowy szał na początku walki, niszcząc wrogów i niosąc strach na polu bitwy. Nadszedł czas, by przywrócić te tradycje."
 norse_ideas_leifs_legacy: "Dziedzictwo Leifa"
 norse_ideas_leifs_legacy_desc: "Saga o Eryku Rudym opowiada o wyprawie jego syna, Leifa Erikssona, na zachód i odkryciu nowej krainy, którą nazwał Winlandią. Mędrzec potrafi odnaleźć wśród wersów wskazówki prowadzące do tej mitycznej ziemi, a być może nawet do potomków islandzkiego odkrywcy."
 norse_ideas_ancestral_faith: "Wiara przodków"
 norse_ideas_ancestral_faith_desc: "Niezależnie od tego, czy wierzyliśmy w Asów, czy w chrześcijańskiego Boga, nasz lud zawsze uznawał istnienie sił nadprzyrodzonych rządzących światem. Wiara ta nadała naszemu ludowi głęboką duchowość i silną więź z zaświatami."
 LTG_ideas: "Łatgalskie idee"
 LTG_ideas_start: "Łatgalskie tradycje"
 LTG_ideas_bonus: "Łatgalska ambicja"
 ltg_daugava_river_trade: "Handel na Dźwinie"
 ltg_daugava_river_trade_desc: "Dźwina od stuleci stanowi ważny szlak handlowy. Niech przez kolejne stulecia nadal napełnia nasze skarbce!"
 ltg_diplomatic_overtures: "Zabiegi dyplomatyczne"
 ltg_diplomatic_overtures_desc: "Nasze ziemie od zawsze otaczają liczni groźni sąsiedzi, którzy pragną albo złupić nasz dobytek, albo podporządkować nas swojej władzy. Aktywna dyplomacja może pomóc nam uniknąć konfliktów, którym trudno byłoby sprostać wyłącznie siłą militarną."
 ltg_religious_flexibility: "Elastyczność religijna"
 ltg_religious_flexibility_desc: "Fanatyzm religijny jest obcy naszemu ludowi. Otwartość umysłu to praktyczna konieczność na tych ziemiach, leżących na pograniczu Wschodu i Zachodu."
 ltg_latvian_people: "Naród łotewski"
 ltg_latvian_people_desc: "W ciągu stuleci bliskich kontaktów i migracji Kurowie, Łatgalowie, Liwowie, Selonowie i Semigalowie stopniowo połączyli się w jeden naród łotewski. Pokazuje to, jak współistnienie różnych grup może wzmacniać nasz lud."
 ltg_modernize_livonian_castles: "Modernizacja zamków inflanckich"
 ltg_modernize_livonian_castles_desc: "Od średniowiecza Inflanty pokryte są licznymi zamkami. Wiele z nich jest już przestarzałych i podatnych na ostrzał współczesnej artylerii. Musimy wzmocnić ich obronę, wznosząc nowoczesne bastiony zdolne odeprzeć takie zagrożenia."
 ltg_daina: "Daina"
 ltg_daina_desc: "Daina to tradycyjna forma poezji łotewskiej, której tematyka obejmuje zarówno codzienne życie, jak i starożytną mitologię. Podtrzymywanie tej tradycji pomaga zachować naszą kulturę i tożsamość."
 ltg_reduction_of_noble_lands: "Ograniczenie ziem szlacheckich"
 ltg_reduction_of_noble_lands_desc: "Odzyskanie ziem nadawanych szlachcie przez stulecia ma kluczowe znaczenie dla rozwoju naszego państwa. Bezpośrednia kontrola nad nimi usprawni zarządzanie i zwiększy wpływy podatkowe."
 LIV_ideas: "Idee rycerzy liwońskich"
 LIV_ideas_start: "Łatgalskie rycerzy liwońskich"
 LIV_ideas_bonus: "Ambicja rycerzy liwońskich"
 liv_knights_of_livonia: "Kawalerowie Mieczowi"
 liv_knights_of_livonia_desc: "W 1236 roku dawny zakon kawalerów mieczowych został pokonany przez Żmudzinów w bitwie pod Szawlami. Pozostali przy życiu członkowie zakonu zostali następnie włączeni do zakonu krzyżackiego, a w 1237 roku utworzyli Zakon Kawalerów Mieczowych w Inflantach. Choć dawny zakon przestał istnieć, jego taktyki bojowe są nadal stosowane przez nasz zakon."
 liv_hanseatic_merchants: "Kupcy hanzeatyccy"
 liv_hanseatic_merchants_desc: "Ziemie nadbałtyckie stanowią pomost między Europą Zachodnią a ruskim Nowogrodem. Kupcy hanzeatyccy często podróżują przez nasze miasta, aby handlować z Rusinami na wschodzie i odwrotnie."
 liv_livonian_castles: "Zamki zakonne"
 liv_livonian_castles_desc: "Zamki są strategicznymi fortyfikacjami, które pomagają bronić naszych ziem przed niewiernymi i heretykami. Musimy dbać o ich utrzymanie, aby zawsze były gotowe do obrony naszego terytorium."
 liv_baptizers_of_terra_mariana: "Chrzciciele Terra Mariana"
 liv_baptizers_of_terra_mariana_desc: "Ziemię Inflant poświęcono Najświętszej Maryi Pannie i nazwano Terra Mariana, aby szerzyć słowo Boże. Musimy pójść śladami naszych braci, którzy ochrzcili miejscowych pogan, i kontynuować szerzenie prawdziwej wiary."
 liv_local_serfs: "Miejscowi chłopi pańszczyźniani"
 liv_local_serfs_desc: "Większość naszych ziem należy do niemieckich szlachciców, lecz uprawiają je miejscowi chłopi pańszczyźniani. Podczas gdy oni trudzą się na polach, my możemy czerpać korzyści z tych rozległych, scentralizowanych majątków."
 liv_promote_local_bishops: "Wspieraj miejscowych biskupów"
 liv_promote_local_bishops_desc: "Nasza siła wynika nie tylko z obecności rycerzy krzyżowych, lecz także ze wsparcia miejscowych biskupów. Okazując im należny szacunek i sprawiedliwie nimi rządząc, możemy liczyć na to, że zadbają o duchową wierność naszych poddanych."
 liv_the_new_infantry: "Reformy wojskowe"
 liv_the_new_infantry_desc: "Epoka walki kawaleryjskiej dobiega końca. To piechota rozstrzyga teraz bitwy naszego zakonu. Powinniśmy opracować nowe taktyki, przyjąć nowoczesne uzbrojenie i przekształcić nasze średniowieczne podejście do walki piechoty w podstawę sił zbrojnych."
 LVA_ideas: "Liwońskie idee"
 LVA_ideas_start: "Liwońskie tradycje"
 LVA_ideas_bonus: "Liwońska ambicja"
 lva_legacy_of_the_knights: "Dziedzictwo rycerzy"
 lva_legacy_of_the_knights_desc: "Nasze państwo jest całkowicie zsekularyzowane, a religia nie ma już takiego znaczenia jak w czasach, gdy byliśmy państwem zakonnym. Nie możemy jednak zapominać o dokonaniach wojskowych i naukach płynących z historii inflanckich rycerzy oraz zakonu kawalerów mieczowych."
 lva_border_between_east_and_west: "Granica między Wschodem a Zachodem"
 lva_border_between_east_and_west_desc: "Nasze ziemie bywają nazywane oknem na Zachód lub na Wschód — zależnie od tego, kogo zapytać. Leżymy na granicy Europy Zachodniej i ziem ruskich. Nasze położenie przyciąga kupców, ale także potencjalnych wrogów z obu kierunków. Musimy być przygotowani na przyjęcie jednych i drugich."
 lva_livonian_hanseatic_cities: "Miasta hanzeatyckie"
 lva_livonian_hanseatic_cities_desc: "Zakon inflancki, nasz poprzednik, powstał dzięki niemieckim kupcom z Lubeki i Bremy, którzy zdobyli interesy handlowe na ziemiach położonych u ujścia Dźwiny. Kupcy ci założyli miasta, które od stuleci należą do Hanzy."
 lva_livlandischer_landtag: "Inflancki Landtag"
 lva_livlandischer_landtag_desc: "Już w czasach zakonu inflanckiego nasze ziemie składały się z różnych stronnictw, kultur i stanów, z których każde walczyło o władzę. Konflikty między państwem, duchowieństwem i potężnymi miastami hanzeatyckimi były na porządku dziennym. Aby rozwiązywać te wewnętrzne spory, zakon ustanowił Inflancki Landtag — sejm stanów inflanckich.\nDo dziś Landtag aktywnie działa, utrzymując w ryzach liczne grupy interesów."
 lva_livonian_colonization: "Kolonizacja inflancka"
 lva_livonian_colonization_desc: "Choć leżymy daleko od Nowego Świata, nie możemy ignorować zmian, jakie przyniosło jego odkrycie. Mocarstwa Europy wykorzystują możliwości oferowane przez Nowy Świat i rozszerzają swoje wpływy poza kontynent. Nie możemy pozwolić, byśmy pozostali w tyle!"
 lva_naval_professionalism: "Profesjonalizacja floty"
 lva_naval_professionalism_desc: "Nasi pruscy sąsiedzi chełpią się profesjonalizacją swojej armii. Trzeba przyznać, że ich siły zbrojne robią wrażenie, lecz są przeznaczone wyłącznie do walki na lądzie.\nDzięki historycznym więziom z czasów krucjat utrzymujemy dobre stosunki z Prusakami. Możemy zatem przeznaczyć nasze zasoby na rozwój imponująco profesjonalnej floty, podczas gdy oni zajmą się żołnierką i obroną naszych ziem."
 lva_religious_tolerance: "Tolerancja religijna"
 lva_religious_tolerance_desc: "Reformacja ukazała zepsucie wiary katolickiej i prześladowania tych, których Kościół uznaje za heretyków. Powinniśmy przyjąć tych, którzy uciekają przed inkwizycją Kościoła katolickiego, i zapewnić im nowy dom w naszym państwie."
 KRL_ideas: "Karelskie idee"
 KRL_ideas_start: "Karelskie tradycje"
 KRL_ideas_bonus: "Karelska ambicja"
 krl_ladoge_fishing_industry: "Rybołówstwo na Ładodze"
 krl_ladoge_fishing_industry_desc: "Jezioro Ładoga obfituje w ryby. Zachęcając rybaków z całego kraju do osiedlania się w miastach wokół jeziora i zakładając osady rybackie, zapewnimy naszym mieszkańcom wystarczające zaopatrzenie w żywność."
 krl_between_two_seas: "Między dwoma morzami"
 krl_between_two_seas_desc: "Nasze państwo rozciąga się od Morza Białego po Zatokę Fińską i Morze Bałtyckie. Aby chronić nasze wybrzeża, musimy rozwijać technologie stoczniowe."
 krl_the_sestra_river: "Rzeka Sestra"
 krl_the_sestra_river_desc: "Ziemie karelskie pierwotnie rozciągały się wzdłuż rzek Sestry i Newy. Możemy czerpać zyski, wspierając handel prowadzony tymi szlakami rzecznymi."
 krl_the_two_karelian_realms: "Dwie Karelie"
 krl_the_two_karelian_realms_desc: "Traktat w Nöteborgu z 1323 roku podzielił Karelię między Szwecję a Nowogród. Podział ten utrzymywał się przez kolejne stulecia. Sami dobrze wiemy, jak bolesne jest rozdzielenie jednego narodu, dlatego możemy okazywać naszym poddanym większe zrozumienie."
 krl_baltic_shipyards: "Bałtyckie stocznie"
 krl_baltic_shipyards_desc: "Morze Bałtyckie tętni życiem morskim, podczas gdy Morze Białe pozostaje niemal puste, z wyjątkiem kilku niewielkich flot handlowych. Powinniśmy w większości zignorować Morze Białe i skupić wysiłki stoczniowe na zwiększeniu naszej obecności na Bałtyku."
 krl_valaam_monastery: "Klasztor Wałaamski"
 krl_valaam_monastery_desc: "Klasztor Wałaamski jest prawosławnym klasztorem w Karelii, położonym na wyspie Wałaam na jeziorze Ładoga. Nie wiadomo dokładnie, kiedy go wzniesiono, lecz jego znaczenie dla wiernych z Karelii jest bezsporne."
 krl_from_the_varangians_to_the_greeks: "Od Waregów do Greków"
 krl_from_the_varangians_to_the_greeks_desc: "Jezioro Ładoga stanowiło ważny odcinek szlaku handlowego prowadzącego od Waregów do Greków. Znamy jego znaczenie, lecz niestety inne państwa go nie doceniają. Powinniśmy rozgłaszać wieści o naszym państwie za pośrednictwem kupców i zachęcać do zwiększenia wymiany handlowej z Karelią."
 SCA_ideas: "Skandynawskie idee"
 SCA_ideas_start: "Skandynawskie tradycje"
 SCA_ideas_bonus: "Skandynawska ambicja"
 sca_connecting_history: "Wspólna historia"
 sca_connecting_history_desc: "Królestwa Danii, Szwecji i Norwegii łączy długa, splątana historia sięgająca czasów wikingów. Dawne więzi między ludami nordyckimi pozwalają im trzymać się razem nawet w najtrudniejszych okresach."
 sca_united_craftsman: "Mistrzowskie rzemiosło"
 sca_united_craftsman_desc: "Skandynawia to surowa kraina, w której noce zdają się nie mieć końca, a mróz bywa nieznośny. Nasi ludzie, przyzwyczajeni do takich warunków, są mistrzami rzemiosła. Wznoszą domy z wygodnymi meblami oraz solidne budowle, które potrafią przetrwać bezlitosne zimy."
 sca_unified_scandinavian: "Zjednoczona Skandynawia"
 sca_unified_scandinavian_desc: "Przez niezliczone stulecia królestwa Północy pozostawały podzielone i uwikłane w bratobójczą walkę o władzę. Choć ich europejscy sąsiedzi czerpali z tego radość, rywalizacja zmuszała każde królestwo do wypracowania własnej polityki i wyciągania własnych wniosków.\nTeraz wszystkie zostały wreszcie zjednoczone pod jednym sztandarem, a dawne trudy przyniosą owoce, gdy będą służyć królestwu Skandynawii."
 sca_danish_baltic_fleet: "Duńska flota bałtycka"
 sca_danish_baltic_fleet_desc: "Duńczycy nie słyną ze zwycięstw na lądzie, lecz ich flota opowiada zupełnie inną historię. Duńska admiralicja i stocznie czynią z nich cennego sojusznika w naszej walce o dominację na Morzu Bałtyckim i w handlu światowym."
 sca_norwegian_marines: "Norwescy piechurzy morscy"
 sca_norwegian_marines_desc: "Norwegowie to zahartowani żeglarze, których życie i śmierć zależą od potęgi Morza Północnego. Stulecia spędzone na oceanie nauczyły ten wytrzymały lud sztuki morskiej, której brakuje wielu innym państwom nadbrzeżnym."
 sca_finnish_hakkapeliita: "Fińscy hakkapeliici"
 sca_finnish_hakkapeliita_desc: "Fińska kawaleria — hakkapeliici — jest wyjątkowa. Doskonałe umiejętności jeździeckie i wysokiej jakości konie czynią z niej cenny element naszych sił zbrojnych, idealny do przeprowadzania uderzeń na każdego przeciwnika."
 sca_swedish_carolean: "Szwedzcy Karolinowie"
 sca_swedish_carolean_desc: "Żadna inna piechota nie budzi w sercach wrogów takiego strachu jak szwedzcy Karolinowie. Ich dyscyplina pozwala im maszerować pod ciężkim ostrzałem wprost na linie nieprzyjaciela i oddawać śmiercionośną salwę z bliskiej odległości."
 sca_empire_of_the_north: "Lew Północy"
 sca_empire_of_the_north_desc: "Królestwa Skandynawii nazywano Lwami Północy, lecz żadne z nich nie pokazało mocarstwom Europy prawdziwej potęgi lwa. My natomiast jesteśmy prawdziwym Lwem Północy. Nasza niekwestionowana władza nad Skandynawią nie podlega dyskusji, a naszej potędze nikt nie jest w stanie dorównać."
 BUK_ideas: "Bukharskie idee"
 BUK_ideas_start: "Bukharskie tradycje"
 BUK_ideas_bonus: "Bukharska ambicja"
 buk_jochid_patrimony: "Dziedzictwo Dżocziego"
 buk_jochid_patrimony_desc: "Władcy Buchary z dynastii Szejbanidów wywodzili się od Szejbana, piątego syna Dżocziego, najstarszego syna samego Czyngis-chana. Po wygaśnięciu linii Batu-chana i Ordy-chana w XIII wieku chanowie Szejbanidzi ogłosili się jedynymi prawowitymi dziedzicami wszystkich ziem Dżocziego, które od tego czasu zajmowali uzurpatorzy Timurydów."
 buk_naqshbandi_patronage: "Patronat nad tarikatem Naqshbandijja"
 buk_naqshbandi_patronage_desc: "Buchara była miejscem narodzin zarówno Baha ad-Dina Naqshbanda Buchariego, jak i założonego przez niego bractwa sufickiego Naqshbandijja. Po jego śmierci władcy Buchary wznieśli rozległy kompleks nekropolii ku czci Baha ad-Dina, uznawanego za ich duchowego patrona, i nadal wspierają znajdujące się tam meczet oraz medresę. Bractwo Naqshbandijja szybko stało się jednym z największych i najbardziej wpływowych zakonów sufickich, dominując w Azji Środkowej, Chinach i Indiach. Grobowiec jego założyciela jest więc popularnym celem pielgrzymek."
 buk_mahalla_schools: "Szkoły mahalli"
 buk_mahalla_schools_desc: "Podobnie jak chrześcijańska parafia, mahalla jest jednostką administracyjną skupioną wokół meczetu i służącej mu społeczności. Chanowie Szejbanidzi z Buchary wykorzystali istniejącą już sieć miejskich mahalli, aby zakładać szkoły publiczne kształcące dzieci zwykłych mieszkańców. Uzdolnieni uczniowie kontynuują naukę w medresach, gdzie poznają poezję i literaturę perską, muzykę, arytmetykę, logikę, teologię, fiqh oraz nauki przyrodnicze. Upowszechnienie piśmienności może przynieść ogromny wzrost dorobku naukowego."
 buk_the_jews_of_bukhara: "Żydzi bucharscy"
 buk_the_jews_of_bukhara_desc: "Buchara i Samarkanda od co najmniej V wieku są domem licznej, perskojęzycznej społeczności żydowskiej. Żydowscy kupcy i rzemieślnicy rozkwitali tu dzięki położeniu miast przy głównej odnodze Jedwabnego Szlaku. Odgrywają istotną rolę w handlu i gospodarce Buchary oraz Samarkandy. Złagodzenie ograniczeń nakładanych na dhimmich i zezwolenie im na budowę własnych synagog oraz swobodny handel bez uciążliwych restrykcji przyniesie korzyści całemu państwu."
 buk_the_ark: "Ark"
 buk_the_ark_desc: "Ark w Bucharze to potężna cytadela na skraju miasta, pełniąca zarazem funkcję twierdzy, pałacu i samodzielnej dzielnicy. Według legendy zbudował ją Siwjasz, jeden z mitycznych bohaterów perskiego eposu Szahname, czyli Księgi królewskiej. Pod jej murami znajduje się kamienna podstawa o głębokości dwudziestu metrów — pozostałości wcześniejszych umocnień, które nie oparły się trudom podbojów. Wewnątrz murów mieści się rozległy kompleks budynków, w tym biblioteka budząca zazdrość wszystkich uczonych kręgu kultury perskiej. Niegdyś gościła takich myślicieli jak Rudaki, Ferdousi, Awicenna, Farabi i Omar Chajjam."
 buk_the_tower_of_death: "Wieża Śmierci"
 buk_the_tower_of_death_desc: "Wysoki minaret meczetu Po-i-Kalyan ocalał przed zniszczeniem, które spotkało sam meczet z rąk Czyngis-chana, dzięki swoim imponującym rozmiarom. Choć wokół niego wzniesiono nowe meczety, z czasem zyskał miano Wieży Śmierci, ponieważ wykorzystywano go do wykonywania egzekucji. Służy przede wszystkim do wzywania wiernych na modlitwę, a niekiedy także jako wieża obserwacyjna pobliskiej cytadeli. Nieustannie przypomina jednak o nieugiętej sprawiedliwości chana."
 buk_sahih_al-bukhari: "Sahih al-Buchari"
 buk_sahih_al-bukhari_desc: "Dzieło znanego uczonego i prawnika, imama Muhammada al-Buchariego, uważane jest za jeden z najbardziej wiarygodnych zbiorów hadisów — przekazów o słowach i czynach proroka Mahometa oraz jego towarzyszy, stanowiących podstawę prawa islamskiego. Do imama i jego dzieł roszczą sobie prawo różne szkoły prawne, najgłośniej zaś hanbalici, lecz jego dziedzictwo należy przede wszystkim do Buchary."
 trading_city_ideas: "Idee miasta handlowego"
 trading_city_ideas_start: "Tradycje miasta handlowego"
 trading_city_ideas_bonus: "Ambicja miasta handlowego"
 tc_city_of_commerce: "Miasto handlu"
 tc_city_of_commerce_desc: "Nasze miasto jest ośrodkiem handlu i wymiany towarowej. Kupcy i handlarze odbywają długie podróże tylko po to, by je odwiedzić."
 tc_self_defense: "Mury miejskie"
 tc_self_defense_desc: "Nie jesteśmy wojownikami, lecz kupcami. Bezpieczeństwo naszego miasta ma jednak najwyższy priorytet, a każdy handlarz jest gotów bronić go własnym życiem."
 tc_merchant_guild: "Gildia kupiecka"
 tc_merchant_guild_desc: "Każde miasto handlowe ma swoją gildię kupiecką. Nasze nie jest wyjątkiem."
 tc_citys_artisans: "Wybitni rzemieślnicy"
 tc_citys_artisans_desc: "Brak zaangażowania w ekspansję i wojny pozwala wielu mieszkańcom naszego miasta rozwijać umiejętności rzemieślnicze."
 tc_city_mercenary_contracts: "Kontrakty najemnicze"
 tc_city_mercenary_contracts_desc: "Ze względu na niewielkie rozmiary naszego państwa niemal niemożliwe jest wystawienie wielkich armii. Na szczęście zawsze można znaleźć najemników, którzy chętnie będą walczyć za nas."
 tc_merchant_range: "Miasto o dalekim zasięgu"
 tc_merchant_range_desc: "Charakter naszego miasta przyciąga kupców, handlarzy i innych ludzi interesu z całego kontynentu."
 tc_trade_fleet: "Flota handlowa"
 tc_trade_fleet_desc: "Nasze okręty są przystosowane do przewożenia dużych ilości towarów i kupców z jednego miejsca do drugiego. Flota handlowa zapewnia nam dominację w handlu morskim."
 UKR_ideas: "Ruskie idee"
 UKR_ideas_start: "Ruskie tradycje"
 UKR_ideas_bonus: "Ruska ambicja"
 expelled_minority_home: "Wypędzona mniejszość"
 desc_expelled_minority_home: "Obrońcy religii i kultury tej prowincji zostali wypędzeni do Nowego Świata. Pozostała ludność jest teraz bardziej skłonna zaakceptować próby nawrócenia."
 temple_of_uppsala_modifier: "Świątynia w Uppsali"
 desc_temple_of_uppsala_modifier: "Świątynia w Uppsali jest świętym miejscem pogańskiej wiary nordyckiej. Głównymi zajęciami w kompleksie świątynnym są składanie ofiar religijnych i oddawanie czci bogom."
 kalmar_union_events.1.t: "Nowy [Root.Monarch.GetTitle] z [Root.GetName]"
 kalmar_union_events.1.desc: "[Root.Monarch.GetName] został koronowany w [Root.Capital.GetName] i jest teraz [Root.Monarch.GetTitle] państwa [Root.GetName], a także całej unii kalmarskiej.\nJednak pozostałe państwa skandynawskie, z którymi łączą nas unie personalne, również muszą uznać [Root.Monarch.GetName] za swojego prawowitego władcę. W przeciwnym razie unii może grozić rozpad..."
 kalmar_union_events.1.a: "Nasi młodsi partnerzy pokochają [Root.Monarch.GetName]."
 kalmar_union_events.1.a.tt: "[Root.Monarch.GetName] obejmuje władzę nad unią kalmarską bez przyznawania szlachcie młodszych partnerów dodatkowych przywilejów.\nMoże to doprowadzić do §Yodrzucenia§! władcy lub wyboru §Yregenta§! w państwach naszych młodszych partnerów.\nKażdy skandynawski młodszy partner wybierze swojego §Y[Root.Monarch.GetTitle]§!.\n\nPaństwa połączone unią personalną, w których pragnienie wolności przekracza 90%, zawsze odrzucą [Root.Monarch.GetName], natomiast te, w których wynosi ono mniej niż 10%, zawsze wybiorą naszego władcę na swojego [Root.Monarch.GetTitle]."
 kalmar_union_events.1.b: "Przyznaj szlachcie naszych poddanych dodatkowe przywileje."
 kalmar_union_events.1.b.tt: "Każda §Yzbuntowana§! skandynawska unia personalna otrzymuje modyfikator „§YPrzyznane przywileje szlacheckie§!” do śmierci §Y[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§!, zapewniający następujące efekty:\nModyfikator podatków państwowych: §G+10,0%§!\nRównowaga lojalności szlachty: §G+10,0%§!\nWpływy szlachty: §Y+10,0%§!\nPragnienie wolności: §G-5,0%§!\n\nPonadto lojalność szlachty w tych państwach wzrasta o §G+15,0%§!, podczas gdy państwo §Y[Root.GetName]§! traci §R10,0%§! lojalności stanu [Root.GetNobilityOrFallbackName] za każdą zbuntowaną skandynawską unię personalną.\nPaństwa połączone unią personalną chętniej wybiorą §Y[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§! na swojego §Y[Root.Monarch.GetTitle]§!.\nKażdy skandynawski młodszy partner unii wybierze swojego §Y[Root.Monarch.GetTitle]§!."
 kalmar_union_events.1.c: "Zadbaj, by młodsi partnerzy unii zaakceptowali [Root.Monarch.GetName].\n\nPaństwa połączone unią personalną, w których pragnienie wolności przekracza 90%, zawsze odrzucą [Root.Monarch.GetName], natomiast te, w których wynosi ono mniej niż 10%, zawsze wybiorą naszego władcę na swojego [Root.Monarch.GetTitle]."
 kalmar_union_events.1.c.tt: "Każda §Yzbuntowana§! skandynawska unia personalna otrzymuje modyfikator „§YPrzyznane rozległe przywileje szlacheckie§!” do śmierci §Y[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§!, zapewniający następujące efekty:\nModyfikator podatków państwowych: §G+25,0%§!\nRównowaga lojalności szlachty: §G+20,0%§!\nWpływy szlachty: §Y+20,0%§!\nPragnienie wolności: §G-15,0%§!\n\nPonadto lojalność szlachty w tych państwach wzrasta o §G+25,0%§!, podczas gdy państwo §Y[Root.GetName]§! traci §R15,0%§! lojalności stanu [Root.GetNobilityOrFallbackName] oraz §R10§! legitymizacji za każdą zbuntowaną skandynawską unię personalną.\nPaństwa połączone unią personalną będą znacznie chętniej wybierać §Y[Root.Monarch.GetName] [Root.Monarch.Dynasty.GetName]§! na swojego §Y[Root.Monarch.GetTitle]§!.\nKażdy skandynawski młodszy partner unii wybierze swojego §Y[Root.Monarch.GetTitle]§!."
 kalmar_union_events.2.t: "Wybór [Root.Monarch.GetTitle] państwa [Root.GetName]"
 kalmar_union_events.2.desc: "Po śmierci poprzedniego władcy nowy [From.Monarch.GetTitle] objął tron państwa [From.GetName]. Ponieważ jesteśmy członkiem unii kalmarskiej, de iure oznacza to, że [From.Monarch.GetName] jest również [Root.Monarch.GetTitle] państwa [Root.GetName]. Zanim jednak [From.Monarch.GetSheHe] zostanie wybrany przez stan [Root.GetNobilityOrFallbackName], uznamy [From.Monarch.GetHerHim] za naszego [Root.Monarch.GetTitle]."
 kalmar_union_events.2.a: "[From.Monarch.GetName] zostanie naszym wybranym [Root.Monarch.GetTitle]!"
 kalmar_union_events.2.b: "Zaproponuj [Root.GetAdjective] [Root.Monarch.GetTitle], który będzie rządził unią."
 kalmar_union_events.2.c: "Wybierz zamiast niego miejscowego regenta."
 kalmar_union_events.3.t: "[Root.GetAdjective] regent"
 kalmar_union_events.3.desc: "Jest oczywiste, że [kalmar_union_leader.Monarch.GetName] będzie działać w interesie państwa [kalmar_union_leader.GetAdjective], a nie naszym. Korzystając z prawa do autonomii, musimy wybrać jednego z naszych rodaków i zaproponować go na nowego [Root.Monarch.GetTitle] unii kalmarskiej."
 kalmar_union_events.3.a: "Administracja naszego [Root.GovernmentName] potrzebuje wsparcia."
 kalmar_union_events.3.a.tt: "Zaproponujemy nowego władcę kultury §Y[Root.Culture.GetName]§! państwu §Y[kalmar_union_leader.GetName]§!, który skupi się na §Yadministracyjnym§! aspekcie unii kalmarskiej.\n§YReligijni buntownicy§! powstaną w państwie [Root.GetName], jeśli [kalmar_union_leader.GetName] odrzuci naszego kandydata na regenta."
 kalmar_union_events.3.b: "Unia potrzebuje dyplomaty."
 kalmar_union_events.3.b.tt: "Zaproponujemy nowego władcę kultury §Y[Root.Culture.GetName]§! państwu §Y[kalmar_union_leader.GetName]§!, który skupi się na §Ydyplomatycznym§! aspekcie unii kalmarskiej.\n§YPartykularyści§! powstaną w państwie [Root.GetName], jeśli [kalmar_union_leader.GetName] odrzuci naszego kandydata na regenta."
 kalmar_union_events.3.c: "Potrzebujemy kogoś z doświadczeniem wojskowym."
 kalmar_union_events.3.c.tt: "Zaproponujemy nowego władcę kultury §Y[Root.Culture.GetName]§! państwu §Y[kalmar_union_leader.GetName]§!, który skupi się na §Ymilitarnym§! aspekcie unii kalmarskiej.\n§YZbuntowana szlachta§! powstanie w państwie [Root.GetName], jeśli [kalmar_union_leader.GetName] odrzuci naszego kandydata na regenta."
 kalmar_union_events.4.t: "[From.Monarch.GetTitle] z państwa [From.GetName]"
 kalmar_union_events.4.desc: "Nasz poddany i młodszy partner unii, państwo [From.GetName], wyraził głębokie niezadowolenie z rządów [Root.Monarch.GetName]. Jego przedstawiciele twierdzą, że [Root.Culture.GetName] [Root.Monarch.GetTitle] nie jest w stanie zadbać o interesy państwa [From.GetAdjective], dlatego proponują [From.Culture.GetName] [From.Monarch.GetTitle], który miałby rządzić unią kalmarską."
 kalmar_union_events.4.a: "Unia będzie rządzona przez [From.GetAdjective] [From.Monarch.GetTitle]."
 kalmar_union_events.4.b: "Odrzuć tego uzurpatora tytułu [From.Monarch.GetTitle]."
 kalmar_union_events.4.c: "Mamy już własnego [Root.Monarch.GetTitle]."
 kalmar_union_events.5.t: "Ponowny wybór [Root.Monarch.GetTitle] unii"
 kalmar_union_events.5.desc: "Choć poprzedni władca został zaakceptowany przez ludność kultury [Root.Culture.GetName], jeden z naszych młodszych partnerów unii wyraził głębokie niezadowolenie i wywarł na nas presję, byśmy wybrali przedstawiciela jego klasy rządzącej na [Root.Monarch.GetTitle] unii kalmarskiej — a zarazem państwa [Root.GetName].\nNie wszyscy członkowie unii wiedzą jednak o tej zmianie. Musimy powiadomić pozostałych młodszych partnerów, że mają nowego [Root.Monarch.GetTitle] do wyboru — tym razem nie będą mogli przedstawiać własnych kandydatów."
 kalmar_union_events.6.t: "Ponowny wybór [Root.Monarch.GetTitle]"
 kalmar_union_events.6.desc: "Poprzedni władca unii kalmarskiej został odrzucony przez jednego z jej członków, a na władcę całej unii zaproponowano nowego [Root.Monarch.GetTitle]. Pytanie brzmi, czy ludność państwa [Root.GetAdjective] zaakceptuje [Root.Monarch.GetName] jako [Root.Monarch.GetTitle] państwa [Root.GetName]."
 kalmar_union_events.7.t: "Bunt pretendenta w państwie [dan_rebellious_junior_partner.GetName]"
 kalmar_union_events.7.desc: "Wybór [Root.Monarch.GetName] na [Root.Monarch.GetTitle] unii kalmarskiej wzbudził gniew szlachty państwa [dan_rebellious_junior_partner.GetName]. Grupa możnowładców zorganizowała pokaźną armię, która popiera pretendenta do tronu państwa [dan_rebellious_junior_partner.GetName]. Wszystkie nadzieje buntowników na niepodległość skupiają się jednak na życiu przywódcy tej rebelii.\nMożemy dać tym buntownikom kultury [dan_rebellious_junior_partner.Culture.GetName] nauczkę i rozbić armię pretendenta albo spróbować zorganizować zamach na ich nieokrzesanego przywódcę."
 kalmar_union_events.7.a: "Zmiażdż bunt!"
 kalmar_union_events.7.b: "Wybierz się z ich przywódcą na „polowanie”."
 kalmar_union_events.8.t: "[Root.Monarch.GetName] traci poparcie w państwie [dan_rebellious_junior_partner.GetName]"
 kalmar_union_events.8.desc: "Szlachta państwa [dan_rebellious_junior_partner.GetName] zaczyna wątpić w dobre intencje [Root.Monarch.GetTitle] [Root.Monarch.GetName] i wybrała miejscowego regenta, który zarządza interesami państwa [dan_rebellious_junior_partner.GetName]. Jest to oczywiście jawny sprzeciw wobec [Root.Monarch.GetTitle] unii kalmarskiej, a pragnienie niepodległości wśród ludności [dan_rebellious_junior_partner.GetAdjective] będzie odtąd tylko rosło.\nJeśli zdecydujemy się przyznać dodatkowe przywileje szlachcie państwa [dan_rebellious_junior_partner.GetName], [Root.Monarch.GetName] może odzyskać szansę na uznanie za prawowitego [Root.Monarch.GetTitle] państwa [dan_rebellious_junior_partner.GetName]."
 kalmar_union_events.8.a: "Pozwól, by miejscowy regent rządził ziemiami państwa [dan_rebellious_junior_partner.GetName]."
 kalmar_union_events.8.b: "Kilka dodatkowych praw dla szlachty państwa [dan_rebellious_junior_partner.GetAdjective] może rozwiązać problem."
 kalmar_union_events.9.t: "Żądania stanu [Root.GetNobilityOrFallbackName]"
 kalmar_union_events.9.desc: "Zarządzanie unią kalmarską jest dla [Root.Monarch.GetName] trudnym zadaniem ze względu na brak ratyfikacji traktatu unijnego oraz sprzeczne interesy poszczególnych członków unii i ich szlachty. Możnowładcy państwa [dan_rebellious_junior_partner.GetName] nie widzą na przykład powodów, by popierać unię ani wybierać [Root.Culture.GetName] [Root.Monarch.GetTitle], który miałby nimi rządzić.\nJednak również nasz własny stan [Root.GetNobilityOrFallbackName] jest przeciwnikiem unii kalmarskiej. Wykorzystuje podzielną uwagę [Root.Monarch.GetTitle] [Root.Monarch.GetName] i próbuje narzucić [Root.Monarch.GetTitle] własne żądania.\n\nKolejny możnowładca przybył dziś rano na [Root.GetAdjective] dwór, aby wyłudzić środki z [Root.GetAdjective] skarbca na jeden ze swoich niekończących się problemów.[Root.GetDanNoblesDemand]"
 dan_nobles_demand_crownland: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] domaga się większej kontroli nad ziemią koronną. Jakby już nie miał jej wystarczająco dużo..."
 dan_nobles_demand_soldiers: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] domaga się siły żywej na potrzeby swoich błahych wewnętrznych sporów..."
 dan_nobles_demand_cash: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] znalazł się w kryzysie finansowym i potrzebuje naszego wsparcia pieniężnego. Najwyraźniej kupił o jedną beczkę zagranicznego wina za dużo..."
 dan_nobles_demand_privileges: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] domaga się dodatkowych przywilejów i praw. Wkrótce nie zdziwi nas już, jeśli zażąda specjalnego przywileju korzystania z prywatnej latryny..."
 dan_nobles_demand_go_hunting: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] wyraził chęć udania się na polowanie z [Root.Heir.GetName]. Z pewnością będzie to bezpieczna rozrywka dla wszystkich uczestników..."
 dan_nobles_demand_peasant_suppression: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] wprowadził lokalne, arbitralne „prawa” i domaga się ich legalizacji. Wygląda na to, że rozrywki stanu [Root.GetNobilityOrFallbackName] stają się z każdym dziesięcioleciem coraz bardziej autodestrukcyjne..."
 dan_nobles_demand_kill_some_rebels: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] najwyraźniej rozgniewał chłopów naszego [Root.GovernmentName] — tych samych, dzięki którym mamy chleb na stole. Teraz domaga się stłumienia buntu chłopskiego, który sam wywołał..."
 dan_nobles_demand_forget_corruption: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] błaga nas, byśmy przymknęli oko na pewne oszustwa podatkowe. Jakby stan [Root.GetNobilityOrFallbackName] nie miał już wystarczająco dużo dukatów..."
 dan_nobles_demand_administrative_support: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] domaga się wsparcia administracyjnego. Trudno uwierzyć, że stan [Root.GetNobilityOrFallbackName] w ogóle zarządza czymkolwiek poza własnymi zamkami..."
 dan_nobles_demand_diplomatic_support: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] błaga o wsparcie dyplomatyczne. Najwyraźniej próba uwiedzenia księżniczki z obcego kraju nie przebiegła zgodnie z ich prymitywnym planem..."
 dan_nobles_demand_military_support: "\n\nTym razem stan [Root.GetNobilityOrFallbackName] domaga się nowego uzbrojenia i wyposażenia wojskowego. Zaczynamy podejrzewać, że ci szlachcice nie zamierzają długo żyć..."
 kalmar_union_events.9.a: "Odrzuć żądania stanu [Root.GetNobilityOrFallbackName]."
 kalmar_union_events.9.b: "Przyjmij żądania stanu [Root.GetNobilityOrFallbackName]."
 kalmar_union_events.10.t: "Upadek unii kalmarskiej"
 kalmar_union_events.10.desc: "Unia kalmarska miała utrzymać królestwa Danii, Norwegii i Szwecji razem, jednocząc je w jedno wielkie mocarstwo Północy. Mimo naszych najlepszych starań unia utraciła jednak jedno z trzech królestw, a tym samym przestała istnieć."
 kalmar_union_events.10.a: "To koniec unii..."
 dan_granting_privileges_to_juniors_extra: "Rozległe przywileje dla szlachty unijnej"
 desc_dan_granting_privileges_to_juniors_extra: "Aby [Root.Monarch.GetName] mógł zostać wybranym [Root.Monarch.GetTitle] unii kalmarskiej, [Root.Monarch.GetSheHe] znacznie rozszerzył przywileje partnerów unii — kosztem naszych dochodów podatkowych."
 dan_granted_privileges_to_nobility_extra: "Przyznano rozległe przywileje szlacheckie"
 desc_dan_granted_privileges_to_nobility_extra: "Szlachta naszego państwa otrzymała od [Root.Monarch.GetTitle] unii kalmarskiej liczne, daleko idące przywileje. W rezultacie jest lojalna wobec naszego zwierzchnika, a nie wobec nas."
 dan_granting_privileges_to_juniors: "Przywileje dla szlachty unijnej"
 desc_dan_granting_privileges_to_juniors: "Aby [Root.Monarch.GetName] mógł zostać wybranym [Root.Monarch.GetTitle] unii kalmarskiej, [Root.Monarch.GetSheHe] znacznie rozszerzył przywileje partnerów unii — kosztem naszych dochodów podatkowych."
 dan_granted_privileges_to_nobility: "Przyznano przywileje szlacheckie"
 desc_dan_granted_privileges_to_nobility: "Szlachta naszego państwa otrzymała od [Root.Monarch.GetTitle] unii kalmarskiej liczne, daleko idące przywileje. W rezultacie jest lojalna wobec naszego zwierzchnika, a nie wobec nas."
 sound_toll_protection_modifier: "Ochrona cła sundzkiego"
 desc_sound_toll_protection_modifier: "Prowincja ta należy do portów pobierających cło sundzkie w cieśninie Sund. Dzięki utrzymaniu miejscowych targowisk i obrony morskiej zyskała dodatkowe znaczenie gospodarcze i strategiczne."
 dan_completed_mission_dan_the_sound_toll_tt: "W dowolnym momencie ukończono misję „§YRozbuduj cło sundzkie§!” lub „§YZdobądź cło sundzkie§!”."
 dan_east_india_company: "Duńska Kompania Wschodnioindyjska"
 desc_dan_east_india_company: "Ta prowincja jest administrowana przez duńskie terytorium zależne w Indiach - Duńską Kompanię Wschodnioindyjską. Inwestorzy z całej Skandynawii podróżują do tej prowincji w celu rozwijania jej infrastruktury."
 kalmar_union: "Unia kalmarska"
 kalmar_union_desc: "Unia kalmarska jest specyficzną formą sojuszu między królestwami Północy, które przysięgają lojalność jednemu monarsze wybieranemu przez szlachtę z każdego z krajów unii. Jednakże zawsze istnieje ryzyko rozpadu unii kalmarskiej z powodu braku ratyfikacji traktatu unii oraz odmiennych interesów jej członków."
 mechanic_kalmar_union_succession_yes: "Posiada elekcje Unii Kalmarskiej"
 mechanic_cannot_integrate_personal_unions_yes: "Uniemożliwia integrację unii personalnych"
 PUINTEGRATIONIMPOSSIBLE: "Twoje §Yreformy rządowe§! uniemożliwiają integrację podrzędnych partnerów w unii personalnej."
 mechanic_cannot_abandon_personal_unions_yes: "Uniemożliwia opuszczanie unii personalnych"
 PUABANDONINGIMPOSSIBLE: "Twoje §Yreformy rządowe§! uniemożliwiają opuszczanie twoich podrzędnych partnerów w unii personalnej."
 allotment_system: "System przydziałowy"
 allotment_system_desc: "Indelningsverket, czyli szwedzki system przydziałowy, był systemem organizacji wojskowej umożliwiającym szybką mobilizację sił zbrojnych państwa. W ramach tego systemu, co dziesiąty mężczyzna w wieku od 15 do 44 lat zostawał pobrany na stałe do wojska jako część państwowej piechoty. Jednocześnie część szlachty, która była zwolniona z płacenia podatków, w zamian musiała wzmacniać armię swoją kawalerią."
 danish_archkingdom: "Zjednoczona unia kalmarska"
 danish_archkingdom_desc: "Unia kalmarska została wreszcie ratyfikowana, stając się prawem państwowym Szwecji i Norwegii. W rezultacie przekształcono ją w prawdziwe królestwo, choć część naszego ludu woli nazywać je „arcykrólestwem”, nawiązując do Krzysztofa III."
 mechanic_personal_union_war_contribution_yes: "Młodsi partnerzy unii otrzymują premie przysługujące §Ymarchii§!\nZa każdego poddanego będącego §Ymłodszym partnerem unii§! otrzymujemy następujące modyfikatory:\nWzrost siły żywej: §G+4000§!\nWzrost liczby marynarzy: §G+2000§!\nNarodowy modyfikator siły żywej: §G+5,0%§!\nNarodowy modyfikator liczby marynarzy: §G+5,0%§!"
 pu_overlord_bonus: "Wkład unii personalnej w wojnę"
 pu_subject_bonus: "Wkład unii personalnej w wojnę"
 teutonic_bishopric_reform: "Biskupstwo Krzyżackie"
 teutonic_bishopric_reform_desc: "Specjalne państwo bardzo podobne do zwykłej teokracji, ale z cechami z czasów Zakonu Krzyżackiego. Władca duchowy może walczyć ramię w ramię ze swoimi żołnierzami na froncie."
 prussian_theocratic_reform: "Niebiańskie Państwo Wojskowe"
 prussian_theocratic_reform_desc: "Ile warta jest wiara, jeśli nie można jej obronić? Prawdziwy sługa boży podejmuje walkę równie ochoczo jak głoszenie kazań czy modlitwę. Nasz pruski rząd jest oparty na zasadzie, że armia jest równie ważna, jak sama religia."
 holy_horde_reform: "Święta Orda"
 holy_horde_reform_desc: "Ukształtowany przez ciężki klimat stepów, nasz krzyżacki rząd został przekształcony w coś na kształt zorganizowanego nomadycznego państwa krzyżowców. Poprzez użycie koni i silną wiarę w naszą misję, krzyżowcy tej Świętej Ordy będą rozprzestrzeniać prawdziwą wiarę w nawet najdalsze zakątki tego świata!"
 crusading_kingdom_reform: "Zakon krzyżowy"
 crusading_kingdom_reform_desc: "Nasze państwo przerosło możliwości zwykłego zakonu monastycznego. Dzięki włączeniu rycerzy w administracyjne i wojskowe struktury państwa zakon przekształcił się w zakon krzyżowy! Deus vult!"
 militarized_crusader_order_reform: "Imperium krzyżowców"
 militarized_crusader_order_reform_desc: "Nie jesteśmy już jedynie zakonem krzyżowców, lecz niezwykle sprawną organizacją rycerską, która zawstydza całe imperia. Nasz zapał do szerzenia prawdziwej wiary dorównuje jedynie surowej dyscyplinie naszych żołnierzy."
 livonian_military_monarchy: "Militarystyczna monarchia Liwońska"
 livonian_military_monarchy_desc: "Nasza monarchia to wynik naszego nacisku na militarne aspekty naszego państwa. Aż tak bardzo, że niektórzy nasi mężowie stanu nazywają ją żartobliwie 'młodszym bratem Prus'."
 livonian_naval_monarchy: "Liwońskie stany generalne"
 livonian_naval_monarchy_desc: "Nasz rząd nie jest raczej rządzony przez jedną absolutną władzę, a przez stany, które tworzą to państwo. Co 4 lata reprezentanci tych stanów gromadzą się na naszym wielkim dworze, żeby wybrać następnego władcę."
 livonian_trade_monarchy: "Liwońska plutokracja"
 livonian_trade_monarchy_desc: "Nasza monarchia ma naturę plutokratyczną, gdzie stronnicy władcy są tymi z największymi zarobkami. Nasz władca jest szefem odnoszącego sukcesy przedsiębiorstwa kupieckiego, tak samo jak wielu innych członków naszego rządu."
 livonian_theocratic_monarchy: "Liwońska teokracja"
 livonian_theocratic_monarchy_desc: "Nasz rząd jest ukształtowany poprzez religię i wiarę. Nasz władca jest częścią kleru i, mimo że panuje tutaj monarchia, to styl rządów jest bardziej podobny do teokracji."
 livonian_elective_monarchy: "Liwońska monarchia elekcyjna"
 livonian_elective_monarchy_desc: "Nasz władca nie siada na tronie dzięki prawu swojej krwi, lecz dzięki poparciu naszych klas. Mimo że klasy wolą wybierać kogoś od nich samych, to nie jest też niemożliwym wybór szlachty z innych krajów."
 livonian_monarchy: "Liwońska monarchia"
 livonian_monarchy_desc: "Nasz rząd jest oparty na filarach zwykłej, stabilnej monarchii. Nasze społeczeństwo nauczyło się na wydarzeniach z przeszłości i zaadaptowało się do przeróżnych wyzwań."
 livonian_mercenary_monarchy: "Liwońskie państwo najemnicze"
 livonian_mercenary_monarchy_desc: "Najemnicy mają złą reputację w Europie. Ale w tym rządzie to właśnie oni rządzą."
 livonian_diplomatic_monarchy: "Liwońska rada stanów"
 livonian_diplomatic_monarchy_desc: "Mimo że jest monarchią w nazwie, to nasze państwo jest rządzone przez radę administratorów i dyplomatów, którzy pilnują, by interesy państwa zostały spełnione. Dynastia zarządzająca tą radą jest rządzącą rodziną w naszym państwie."
 livonian_constitutional_monarchy: "Liwońska monarchia konstytucyjna"
 livonian_constitutional_monarchy_desc: "Nasz rząd rozdzielił władzę od monarchy. Kiedy decyzja na rzecz państwa jest podejmowana, parlament musi ją najpierw zatwierdzić.\nJedną z korzyści takiego systemu jest to, że śmierć naszego władcy nie jest już postrzegana jako zagrożenie dla istnienia państwa."
 livonian_administrative_monarchy: "Liwońskie państwo cesarskie"
 livonian_administrative_monarchy_desc: "Podczas gdy inni władają królestwami, nasz rząd włada cesarstwem. Naszym celem jest szybka ekspansja państwa w celu dominacji nad światem."
 livonian_admiral_monarchy: "Liwońska admiralicja"
 livonian_admiral_monarchy_desc: "Nasz rząd jest dopasowany do ciężkiego środowiska morza. Skoro nasza cała ekonomia opiera się na bogactwach morza, to nasi władcy są wybierani spośród najlepszym admirałów, jakich mamy."
 livonian_naval_controlled_monarchy: "Liwońska talassokracja"
 livonian_naval_controlled_monarchy_desc: "Nasza monarchia jest ukształtowania przez potęgę morza. Każdy monarcha naszego wielkiego państwa musi być admirałem, żeby móc dotrzeć nawet do najdalszych miejsc naszego kraju."
 livonian_general_controlled_monarchy: "Liwońska autokracja"
 livonian_general_controlled_monarchy_desc: "Niektóre armie mają państwa. Nasza armia ma wciąż rosnące imperium, a my dopilnujemy, żeby dalej rozszerzało się ono dzięki większej ilości naszych sił."
 livonian_absolute_monarchy: "Liwońska monarchia absolutna"
 livonian_absolute_monarchy_desc: "Cały apart rządu; wszystkie elementy rządu maja tylko jeden cel: ochrona absolutnej władzy monarchy."
 livonian_enlightened_monarchy: "Liwońska monarchia oświecona"
 livonian_enlightened_monarchy_desc: "Nasz monarcha jest pionierem idei oświeconego państwa, w którym absolutna władza jest wspierania przez idee oświecenie."
 merchant_theocracy_reform: "Błogosławiona plutokracja"
 merchant_theocracy_reform_desc: "Teokracja, w której bogactwo i handel odgrywają równie ważną rolę co Kościół katolicki. Stolica Apostolska zezwala nam również sprzedawać odpusty tym, którzy najbardziej ich potrzebują."
 reformer_state_reform: "Zbawcza plutokracja"
 reformer_state_reform_desc: "Teokracja, w której bogactwo i handel odgrywają równie ważną rolę co idee reformacji. Nasz zapał religijny skłania również kupców do głoszenia nauk reformacji na ziemiach heretyków."
 mechanic_mercs_do_not_cost_army_professionalism_yes: "Kompanię najemników można wynajmować bez utraty §Yprofesjonalizmu armii§!"
 mechanic_no_stability_loss_on_monarch_death_yes: "Brak utraty stabilności po śmierci władcy"
 mechanic_can_propogate_religion_yes: "Można stosować politykę handlową „§YSzerzenie religii§!”"
 mechanic_can_spread_the_reformation_yes: "Można szerzyć reformację za pomocą polityki „§YSzerzenie religii§!” w epoce odkryć i epoce reformacji"
 can_spread_reformation_tt: "Można używać polityki §YSzerzenie religii§!, aby szerzyć §Yreformację§! w epoce odkryć lub epoce reformacji"
 mechanic_can_sell_indulgences_yes: "Można sprzedawać §Yodpusty§! państwom katolickim"
 mechanic_can_loot_heretic_churches_yes: "Można wybrać opcję pokojową „§YZłup kościoły§!” przeciwko heretykom"
 mechanic_allow_carolean_yes: "Może rekrutować §Ypiechotę karolińską§!"
 mechanic_cannot_become_dictatorship_yes: "Nie może stać się dyktaturą."
 mechanic_cannot_become_dictatorship: "Nie może stać się dyktaturą."
 CRUSADER_ORDER: "Zakon Krzyżowy"
 CRUSADER_EMPIRE: "Imperium Krzyżowe"
 CRUSADER: "Krzyżowiec"
 GRAND_CRUSADER: "Wielki Krzyżowiec"
 CRUSADER_fem: "Krzyżowczyni"
 GRAND_CRUSADER_fem: "Wielka Krzyżowczyni"
 JARLDOM: "Jarlostwo"
 JARL: "Jarl"
 dan_retake_gotland_title: "Odzyskaj Gotlandię"
 dan_retake_gotland_desc: "Nasz poprzedni król, Eryk VII Gryf, rządził Danią i całą unią kalmarską w latach 1412–1439. Z powodu problemów gospodarczych wywołanych jego wojną z Hanzą został ostatecznie zdetronizowany, a tron przejął jego bratanek, „arcykról” Krzysztof III.\nChoć Eryk nie włada już unią kalmarską, znalazł sobie dom na wyspie Gotlandii, gdzie nadal żyje jako pirat.\nMimo że nie jest już naszym królem, Gotlandia wciąż należy do Danii. Nadszedł czas, by Eryk ostatecznie abdykował."
 dan_eliminate_the_hanse_title: "Upokórz Lubekę"
 dan_eliminate_the_hanse_desc: "W 1426 roku król Eryk ustanowił cło sundzkie, które stało się jednym z głównych źródeł dochodów Danii. Każdy statek nienależący do Danii, który przepływał przez cieśninę Sund, musiał uiszczać nam opłatę.\nNiestety Hanza nie była zainteresowana dobrobytem Danii i nałożyła embargo na całą unię kalmarską. Ostatecznie w 1426 roku jej zuchwałość doprowadziła do otwartej wojny między Danią a Hanzą. Ku naszemu upokorzeniu ci nic niewarci kupcy wygrali wojnę w 1435 roku i wymusili zniesienie cła.\nPowinniśmy pomścić tę hańbę, podbijając miasto Lubekę albo przejmując kontrolę nad tamtejszym węzłem handlowym."
 dan_eliminate_the_hanse_bt: "Państwo §Y[Root.GetName]§! posiada co najmniej §Y30%§! siły handlu w węźle handlowym §YLubeka§!."
 dan_eliminate_the_hanse_ct: "Żadne znane państwo nie należy do ligi handlowej państwa §Y[HSA.GetName]§!."
 dan_eliminate_the_hanse_at: "Odblokowuje decyzję, która wywoła wojnę o §Ykonflikt handlowy§! między państwem §Y[Root.GetName]§! a właścicielami prowincji §Y[47.GetName]§!, §Y[1858.GetName]§!, §Y[45.GetName]§!, §Y[44.GetName]§! i §Y[1874.GetName]§! (państwo §Y[Root.GetName]§! będzie §Yobrońcą§! w tych wojnach)."
 dan_the_german_trade_cities_title: "Miasta Hanzy"
 dan_the_german_trade_cities_desc: "Nadbrzeżne miasta Świętego Cesarstwa Rzymskiego należą w większości do Hanzy. Jeśli chcemy rozwiązać tę ligę, która od tak dawna zagraża naszej dominacji handlowej w cieśninie Sund, powinniśmy zablokować, zająć lub zaanektować te miasta."
 dan_the_german_trade_cities_ct: "Otrzymujemy dochód handlowy z okresu §G4 lat§!."
 dan_the_german_trade_cities_tt: "Następujące warunki muszą być spełnione dla §Y3§! spośród prowincji §Y[47.GetName]§!, §Y[1858.GetName]§!, §Y[45.GetName]§!, §Y[44.GetName]§! i §Y[1874.GetName]§!:\n    Należy do państwa §Y[Root.GetName]§! lub jego poddanych\n    Jest kontrolowana przez państwo §Y[Root.GetName]§!\n    Jest blokowana przez państwo §Y[Root.GetName]§!, gdy jej właściciel prowadzi wojnę z państwem §Y[Root.GetName]§!\n    Jej właściciel §Ypodporządkował się§! dominacji handlowej państwa §Y[Root.GetName]§!, gdy państwo §Y[Root.GetName]§! podejmie decyzję „§YWywołaj konflikt handlowy z Hanzą§!”."
 dan_the_german_trade: "Duńskie wpływy handlowe w Niemczech"
 dan_the_sound_toll_title: "Rozbuduj cło sundzkie"
 dan_the_sound_toll_desc: "Cło sundzkie jest jednym z najważniejszych, jeśli nie najważniejszym źródłem dochodów duńskiej korony. Zapewnia królowi niezależność od szlachty i pozwala nam żelazną ręką kontrolować przepływ handlu między Morzem Bałtyckim a Morzem Północnym. Warto rozbudować system poboru cła, wznosząc dodatkowe baterie nadbrzeżne i targowiska, na których kupcy będą musieli uiszczać opłaty."
 dan_the_sound_toll_ct: "Następujące warunki muszą być spełnione w prowincjach §Y[12.GetName]§!, §Y[4142.GetName]§!, §Y[1775.GetName]§! i §Y[6.GetName]§!:\n    Należą do państwa §Y[Root.GetName]§! i są jego prowincjami narodowymi\n    Posiadają dowolny §Ybudynek handlowy§!\n    Posiadają dowolny §Ybudynek obrony wybrzeża§!"
 dan_the_sound_toll_tt: "Prowincje §Y[12.GetName]§!, §Y[4142.GetName]§!, §Y[1775.GetName]§! i §Y[6.GetName]§! otrzymują aktywowany modyfikator prowincji „§YOchrona cła sundzkiego§!”, który działa tak długo, jak prowincja posiada dowolny budynek obrony morskiej i dowolny budynek targowy, zapewniając następujące efekty:\nLokalna siła handlu: §G+3,00§!\nWyniszczenie wrogiej floty: §G+3,00§!\nMożliwa liczba budynków: §G+2§!\nKoszt promowania merkantylizmu: §G-5,0%§!"
 dan_control_the_channel_title: "Przejmij kontrolę nad kanałem"
 dan_control_the_channel_desc: "Odkrycie Nowego Świata na zachodzie sprawiło, że towary i zyskowny handel napływają do kanału La Manche. Liczenie na to, że Brytyjczycy lub Holendrzy skierują swoje bezcenne towary do cieśniny Sund, byłoby daremne. Zamiast tego powinniśmy rozszerzyć nasze wpływy handlowe w kanale La Manche i przejąć jak największą część handlu od naszych morskich rywali."
 dan_push_westwards_title: "Odkryj Nowy Świat"
 dan_push_westwards_desc: "Wieści od naszych rywali mówią o tajemniczych ziemiach na dalekim Zachodzie, pełnych niewyobrażalnych cudów i możliwości dla ambitnych imperiów światowych. Musimy odkryć te ziemie, zanim nasi wrogowie zdążą rozpocząć tam ekspansję."
 dan_push_westwards_at: "Państwo §Y[Root.GetName]§! odkryło co najmniej jedną prowincję nadbrzeżną w regionie §YZatoki Hudsona§!, §YKandy§!, §YPółnocno-Wschodnim§! lub §YPołudniowo-Wschodnim§!."
 dan_push_westwards_bt: "Państwo §Y[Root.GetName]§! odkryło co najmniej jedną prowincję nadbrzeżną w §YNowym Świecie§!."
 dan_push_westwards_tt: "Po odkryciu co najmniej jednej §Ynie skolonizowanej prowincji nadbrzeżnej§! w Nowym Świecie, spełniającej wymagania tej misji, uruchomi się wydarzenie „§YKolonizacja Nowego Świata§!”."
 dan_colonize_north_america_title: "Skolonizuj Amerykę"
 dan_colonize_north_america_desc: "Ziemie Ameryki wydają się bogate w takie zasoby jak futra, bawełna i zupełnie nowy środek pobudzający zwany „tytoniem”. Powinniśmy jak najszybciej założyć nowe osady na tym kontynencie, aby czerpać zyski z tych dóbr."
 dan_colonize_the_caribbean_title: "Dansk Vestindien"
 dan_colonize_the_caribbean_desc: "Kupcy z naszego [Root.GovernmentName] proszą o zgodę na założenie kompanii handlowej w Nowym Świecie. Ponieważ Ameryka składa się, jak się okazuje, z dwóch wielkich kontynentów, rozsądnie byłoby skolonizować Karaiby i powierzyć te wyspy kupcom."
 dan_colonize_rnw_title: "Skolonizuj Nowy Świat"
 dan_colonize_rnw_desc: "Ziemie Nowego Świata są gotowe na duńskie osadnictwo. Powinniśmy wysłać na ten nowy kontynent najbardziej żądnych przygód mieszkańców i skolonizować go w imieniu korony [Root.GetAdjective]."
 dan_the_baltic_force_title: "Rozbuduj siły zbrojne"
 dan_the_baltic_force_desc: "Mamy wielu wrogów: na południu Święte Cesarstwo Rzymskie, na zachodzie Anglików, na wschodzie Republikę Nowogrodzką, a na północy — co najgorsze — Szwecję. Powinniśmy rozbudować nasze wojska lądowe i flotę oraz przygotować je na najgorsze."
 dan_livonian_order_title: "Odzyskaj Estonię"
 dan_livonian_order_desc: "Wielki król Waldemar II poprowadził duńskie wojska do licznych zwycięstw nad poganami w Estonii. Jednak od czasu powstania św. Jerzego ziemie te należą do zakonu inflanckiego. Musimy pójść w jego ślady i odzyskać to, co odebrał nam zakon."
 dan_livonian_order_tt: "Każda posiadana prowincja o kulturze §Yestońskiej§! otrzymuje modyfikator „§YIntegracja Estonii§!” do czasu, gdy kultura §Yestońska§! przestanie być akceptowana. Zapewnia on następujący efekt:\nLokalny modyfikator produkcji dóbr: §G+10,0%§!"
 dan_take_over_neva_title: "Wyeliminuj Nowogród"
 dan_take_over_neva_desc: "Stosunki z republiką wiecową Nowogrodu od zawsze były co najmniej chłodne. Nie poprawiły ich ani dążenia Nowogrodu do kontrolowania wschodniego szlaku handlowego, ani ekspansja jego granic w głąb Skandynawii. Nawet jeśli Nowogród nie stanowiłby dla nas zagrożenia, to rosnące w siłę Wielkie Księstwo Moskiewskie już tak.\nAby chronić ludy skandynawskie, powinniśmy przejąć strategiczne prowincje [274.GetName], [33.GetName] i [310.GetName]."
 dan_take_over_neva_tt: "Kontroler szlaków nowogrodzkich"
 dan_colonial_ambitions_title: "Ambicje kolonialne"
 dan_colonial_ambitions_desc: "Świat nieustannie się zmienia, a my musimy dostosować się do nowych okoliczności. Wielkie mocarstwa Europy odwracają wzrok od kontynentu i kierują uwagę ku ziemiom, które nie zostały jeszcze odkryte. Czasy średniowiecza stają się jedynie odległym wspomnieniem. Nadchodzi epoka kolonializmu i powinniśmy być jednymi z pierwszych, którzy na niej skorzystają."
 dan_colonize_the_gold_coast_title: "Skolonizuj Złote Wybrzeże"
 dan_colonize_the_gold_coast_desc: "Afryka obfituje w bezcenne towary, takie jak kość słoniowa, barwniki i oczywiście złoto. Nie tylko my chcemy jednak pozyskiwać te dobra z Afryki i kierować je do własnych skarbców. Rozsądnie byłoby założyć kolonie na wybrzeżu Afryki Zachodniej, aby kontrolować, kto uzyska dostęp do tych zasobów, a kto zostanie go pozbawiony."
 dan_colonize_the_gold_coast_ct: "Każda posiadana przez państwo §Y[Root.GetName]§! lub jego poddanych prowincja niebędąca wyspą w regionie §YGwinei§! otrzymuje modyfikator „§YDanske Guldkyst§!” na §Y25 lat§!, zapewniający następujące efekty:\nLokalny koszt budowy: §G-15,0%§!\nLokalna siła handlu: §G+15,0%§!"
 dan_colonize_the_gold_coast_tt: "Państwo §Y[Root.GetName]§! otrzymuje stałe roszczenia do każdej prowincji z §Ycentrum handlu§! lub modyfikatorem §Yestuarium§! w regionie §YAfryki Południowej§!."
 dan_take_a_foothold_in_the_cape_title: "Przejmij kontrolę nad Przylądkiem"
 dan_take_a_foothold_in_the_cape_desc: "Przylądek Dobrej Nadziei jest głównym przystankiem dla wszystkich kupców z Europy podróżujących do Azji i z powrotem. Kto kontroluje Przylądek, ten kontroluje również handel między Europą a Azją. Nasze doświadczenia z cłem sundzkim pokazują, że Przylądek jest wręcz idealnym miejscem do ustanowienia kolejnego cła."
 dan_expand_african_trade_title: "Rozszerz handel afrykański"
 dan_expand_african_trade_desc: "Choć Przylądek Dobrej Nadziei służy przede wszystkim jako punkt koncentracji towarów z Indii i Azji, nadal jest częścią Afryki — kontynentu oferującego wiele możliwości sam w sobie. Powinniśmy poszerzyć nasze horyzonty i ustanowić [Root.GetAdjective] dominację handlową na pozostałych rynkach Afryki."
 dan_expand_african_trade_tt: "Wszystkie węzły handlowe w §YAfryce§!:\n  Państwo §Y[Root.GetName]§! ma w nich albo §Ynajwiększą siłę handlu§!, albo co najmniej §Y25%§! siły handlu."
 dan_improve_norway_relations_title: "Korona Norwegii"
 dan_improve_norway_relations_desc: "Unia kalmarska jednoczy całą Skandynawię pod jedną koroną, a arystokraci Szwecji i Norwegii są posłuszni naszemu [Root.Monarch.GetTitle]. Jednak jeszcze przed powstaniem unii kalmarskiej Danię i Norwegię łączyła długa wspólna historia, sięgająca czasów Kanuta Wielkiego i jego Imperium Morza Północnego. Powinniśmy jeszcze bardziej zacieśnić więzi z Norwegią, aby pozostała wierna unii kalmarskiej."
 dan_integrate_holstein_title: "Zintegruj Holsztyn"
 dan_integrate_holstein_desc: "W 1203 roku król Waldemar II najechał i podbił ziemie księstwa Holsztynu. Podbój nie okazał się jednak trwały, ponieważ książę Adolf IV Holsztyński i koalicja państw północnoniemieckich zdołali pokonać Waldemara w bitwie pod Bornhöved w 1227 roku.\nNadszedł czas, by ponownie odzyskać Holsztyn i włączyć go do naszego państwa."
 dan_integrate_holstein_tt: "Państwo [Root.GetName] traci modyfikator §YZaanektowani poddani§!, jeśli go posiada."
 dan_ratify_kalmar_succession_title: "Ratyfikuj unię kalmarską"
 dan_ratify_kalmar_succession_desc: "Choć unia kalmarska jest de facto prawdziwym sojuszem Danii, Norwegii i Szwecji, łączącym wszystkie trzy królestwa pod berłem jednego monarchy, nigdy nie została formalnie ratyfikowana przez żadnego z jej członków. Nadszedł czas, by to zmienić i przekształcić unię w ściślejszy związek wszystkich królestw skandynawskich."
 dan_integrate_norway_title: "Zintegruj Norwegię"
 dan_integrate_norway_desc: "Po ratyfikacji traktatu unii kalmarskiej szlachta żadnego z królestw nie ma już prawa weta w sprawie wyboru kolejnego króla. W praktyce Norwegia jest już częścią Danii. Pozostaje jedynie całkowicie włączyć norweską koronę do naszego państwa."
 dan_unite_scandinavia_title: "Zjednocz Skandynawię"
 dan_unite_scandinavia_desc: "Marzenie o zjednoczonej Skandynawii jest równie stare jak nasze królestwa. Kanut Wielki był najbliżej zjednoczenia całego regionu dzięki swojemu Imperium Morza Północnego, lecz zbyt mocno koncentrował się na koronie angielskiej, by zająć się szwedzką.\nDrugie miejsce zajmuje królowa Małgorzata I ze swoją wizją unii kalmarskiej — dziś jej wizja stanie się rzeczywistością!"
 dan_university_of_coppenhagen_title: "Uniwersytet w Kopenhadze"
 dan_university_of_coppenhagen_desc: "Uniwersytety są ośrodkami wiedzy i nauki. Mają zatem ogromne znaczenie dla postępu technologicznego każdego państwa, ponieważ to właśnie na uczelniach rodzą się przełomowe idee.\nUtworzenie takiej instytucji wymaga jednak oficjalnej zgody tych, którzy już posiadają odpowiednią wiedzę i wykształcenie — stanu [Root.GetChurchOrFallbackName]. Będziemy musieli zyskać jego przychylność, aby zbudować uniwersytet przyspieszający nasz postęp technologiczny."
 dan_an_educated_people_title: "Wykształcony naród"
 dan_an_educated_people_desc: "Trudne czasy reformacji, a także przepaść technologiczna między Europejczykami a rdzennymi mieszkańcami Nowego Świata pokazały nam, jak ważne dla dobrobytu państwa są edukacja i wiedza. Powinniśmy zbudować więcej uniwersytetów w Skandynawii, aby podnieść ogólny poziom wykształcenia ludności."
 dan_trade_post_in_india_title: "Dansk Ostindien"
 dan_trade_post_in_india_desc: "Handel między Europą a Indiami jest odwiecznym przedsięwzięciem, które w przeszłości przyniosło bogactwo i dobrobyt wielu imperiom. Oczywiście również my mamy własne interesy związane z handlem indyjskim. Powinniśmy zwiększyć nasze wpływy w Indiach i uzyskać dostęp do rynków Dalekiego Wschodu."
 dan_trade_post_in_india_at: "Prowincja znajduje się w nadregionie §YIndii§! i posiada §Ycentrum handlu§! lub §Yestuarium rzeczne§!."
 dan_trade_post_in_india_ct: "Każde państwo posiadające co najmniej §Y5%§! siły handlu w dowolnym §Yindyjskim§! węźle handlowym i mające stolicę w §YIndiach§! otrzymuje wydarzenie „§YKupcy [Root.GetAdjective]§!”."
 dan_funnel_malacca_trade_title: "Przyprawy z Malakki"
 dan_funnel_malacca_trade_desc: "Przyprawy są w Europie rzadkością, lecz popyt na nie jest ogromny. Tymczasem Indie Wschodnie obfitują w przyprawy i inne niezwykle dochodowe towary. Zasada podaży i popytu wymaga od nas ustanowienia obecności handlowej w Malakce, abyśmy mogli wreszcie pomóc europejskim sąsiadom rozwiązać problem niedoboru przypraw — oczywiście za odpowiednią cenę."
 dan_funnel_malacca_trade_ct: "Każde państwo posiadające co najmniej §Y5%§! siły handlu w węźle §YMalakka§!, §YSyjam§!, §YFilipiny§! lub §YMolu ki§! i mające stolicę w §YMalajach§!, §YIndonezji§! lub §YMolu kach§! otrzymuje wydarzenie „§YKupcy [Root.GetAdjective]§!”."
 dan_improve_swedish_relations_title: "Korona Szwecji"
 dan_improve_swedish_relations_desc: "Sama unia kalmarska nie jest zbyt starym związkiem — powstała w 1397 roku. Mimo to szlachta szwedzka wielokrotnie wyrażała niezadowolenie z powodu [Root.Culture.GetName] [Root.Monarch.GetTitle] zasiadającego na jej tronie. W latach 1434–1436 szwedzcy górnicy, chłopi, a nawet możnowładcy skupili się wokół Engelbrekta Engelbrektssona i wszczęli otwarty bunt przeciwko [Root.GetAdjective] koronie podczas naszej wojny z Hanzą. Dopiero niefortunna, choć bardzo wygodna dla nas śmierć Engelbrekta zdołała stłumić powstanie i przywrócić porządek w Szwecji.\nSzwedzi i ich szlachta, w przeciwieństwie do Norwegów, wciąż jednak przypominają beczkę prochu, która czeka na okazję do kolejnego wybuchu rebelii. Musimy jak najszybciej zabezpieczyć dobre stosunki ze szwedzką szlachtą."
 dan_handle_sweden_title: "Szlachta Szwecji"
 dan_handle_sweden_desc: "Szwedzka szlachta musi zaakceptować, że jest częścią unii kalmarskiej, a tym samym [Root.GetAdjective] korony. Łatwiej to jednak powiedzieć, niż zrobić, ponieważ na szwedzki tron wybiera ona każdego chłopa zamiast naszego [Root.Monarch.GetTitle].\nMusimy zapewnić sobie lojalność szwedzkiej szlachty — pieniędzmi albo mieczem."
 dan_handle_sweden_ct: "Szwedzcy buntownicy popierający pretendenta przestaną podnosić bunt przeciwko państwu §Y[Root.GetName]§!."
 dan_handle_sweden_tt: "Ukończono łańcuch wydarzeń §YSzwedzkie marzenie o niepodległości§! lub osiągnięto §Yepokę reformacji§! bez jego uruchomienia.\nŁańcuch wydarzeń rozpoczyna się w §YSzwecji§! podczas §Yepoki odkryć§!, od roku §Y1450§!, o ile §YSzwecja§! pozostaje poddanym §YDanii§!."
 dan_integrate_sweden_title: "Zintegruj Szwecję"
 dan_integrate_sweden_desc: "Wreszcie unia kalmarska została ratyfikowana. Szlachta norweska, a zwłaszcza szwedzka, musi uznać [Root.GetAdjective] [Root.Monarch.GetTitle] za swojego władcę.\nMożemy w końcu dokończyć dzieło rozpoczęte przez Małgorzatę w 1397 roku i włączyć Szwecję do duńskiej korony."
 dan_handle_own_nobility_title: "Odbierz przywileje"
 dan_handle_own_nobility_desc: "Szlachta Norwegii i Szwecji już dostarcza nam wystarczająco dużo problemów, lecz [Root.GetAdjective] możnowładcy wcale nie są lepsi. Nie pragną zjednoczenia Skandynawii, a ich krótkowzroczne interesy realizowane są kosztem naszych zasobów. Powinniśmy odebrać im przywileje i przejąć ich ziemie."
 dan_handle_own_nobility_ct: "Szlachta nie będzie już wysuwać żadnych żądań, dopóki utrzymujemy unię kalmarską."
 dan_an_absolute_monarchy_title: "Absolutyzm [Root.GetAdjective]"
 dan_an_absolute_monarchy_desc: "Epoka państw feudalnych dobiega końca. Współcześni monarchowie i władcy skupiają całą władzę państwową w rękach korony. Powinniśmy uczynić to samo, zanim pozostaniemy w tyle za sąsiadami, którzy już zreformowali swoje systemy rządów."
 dan_denmark_on_european_stage_title: "Na europejskiej scenie"
 dan_denmark_on_european_stage_desc: "W Europie wyrastają nowe wielkie mocarstwa, a sieci sojuszy i dyplomacji zyskują coraz większe znaczenie. Jeśli chcemy przetrwać w tym nieustannie zmieniającym się świecie rosnących imperiów, potrzebujemy strategicznych sojuszników, którzy podzielają nasze spojrzenie na rywali."
 dan_denmark_on_european_stage_at: "Zyskujemy §G10§! przysług i zaufania u każdego sojusznika spełniającego wymagania tej misji."
 dan_denmark_on_european_stage_ct: "§YSojusznicy§! państwa §Y[Root.GetName]§!, których stolica znajduje się na §Y[Root.Capital.GetContinentName]§! i którzy mają co najmniej §Y90§! łącznego rozwoju."
 dan_a_danish_great_power_title: "Zostań światową potęgą"
 dan_a_danish_great_power_desc: "Czas małych średniowiecznych królestw i mocarstw regionalnych minął. Zamiast tego świat jest w ruchu z powodu dużych i wpływowych mocarstw, które mają globalny zasięg. Nie możemy pozwolić nam pozostać za naszymi rywalami, którzy przekształcają się w takie potęgi!"
 dan_a_danish_great_power_at: "Państwa posiadające co najmniej §Y200§! własnego rozwoju i rozwoju poddanych niebędących państwami trybutarnymi zostały poddane §Ywpływom§! państwa §Y[Root.GetName]§!."
 dan_a_danish_great_power_bt: "Żadne znane państwo nie ma większego własnego rozwoju ani rozwoju poddanych niebędących państwami trybutarnymi niż państwo §Y[Root.GetName]§!."
 dan_a_danish_great_power_ct: "Państwa posiadające co najmniej §Y200§! własnego rozwoju i rozwoju poddanych niebędących państwami trybutarnymi otrzymują subsydia w wysokości §Y25%§! swoich dochodów od państwa §Y[Root.GetName]§!."
 dan_rival_england_title: "Rzuć wyzwanie Anglii"
 dan_rival_england_desc: "Anglicy na zachodzie są jednym z największych mocarstw morskich Europy. Niestety ich interesy stoją w bezpośredniej sprzeczności z naszymi, ponieważ oba państwa pragną zdominować handel na Morzu Północnym."
 dan_trump_the_english_fleet_title: "Rzuć wyzwanie angielskiej flocie"
 dan_trump_the_english_fleet_desc: "Królewska Marynarka Wojenna Anglii jest jedną z najpotężniejszych flot świata. Nie mamy szans zakończyć jej dominacji na Morzu Północnym, dopóki nasza własna flota nie dorówna jej siłą. Powinniśmy zbudować więcej ciężkich okrętów i rozwinąć wiedzę w dziedzinie szkutnictwa, aby w niedalekiej przyszłości móc stawić jej czoła."
 dan_land_in_northumberland_title: "Najedź Anglię Północną"
 dan_land_in_northumberland_desc: "Nadszedł czas, by położyć kres angielskiemu zagrożeniu. Popłyniemy na zachód i wylądujemy w północnych angielskich ziemiach, w Northumberland!"
 dan_conquer_england_title: "Podbij Anglię"
 dan_conquer_england_desc: "W 1016 roku duński król Kanut Wielki poprowadził inwazję na Anglię i podbił królestwo w ciągu kilku miesięcy. Jego dokonania doprowadziły do powstania Imperium Morza Północnego.\nDziś powtórzymy to, czego dokonano przed wieloma stuleciami, i ponownie podbijemy całą Anglię ku chwale Danii!"
 dan_conquer_england_tt: "Jeśli prowincja §Y[236.GetName]§! należy do państwa §Y[Root.GetName]§!, uruchomi się wydarzenie „§YNowa stolica Imperium Morza Północnego?§!”.\nJeśli prowincja §Y[236.GetName]§! należy do naszego poddanego, prowincja §Y[Root.Capital.GetName]§! otrzymuje §G3§! bazowego podatku, §G3§! bazowej produkcji i §G2§! bazowej siły żywej."
 dan_the_age_of_reformation_title: "Era reformacji"
 dan_the_age_of_reformation_desc: "Czyny Kościoła katolickiego nie są już dłużej niekwestionowane. Uczeni wiary chrześcijańskiej krytykują Stolicę Apostolską za sprzedaż odpustów. W Europie wkrótce rozpocznie się schizma o nieprzewidzianych rozmiarach; czas Wielkiej Reformacji chrześcijaństwa.\nMusimy wybrać swoją stronę w tej nowej erze, w przeciwnym razie konflikt religijny może zagrozić naszej jedności."
 dan_first_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 dan_first_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 dan_second_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 dan_second_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 dan_third_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 dan_third_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 dan_a_catholic_scandinavia_title: "[Root.GetPreviewColorDAN]Katolicka Skandynawia[Root.GetPreviewColorDAN_end]"
 dan_a_catholic_scandinavia_desc: "Reformacja rozprzestrzenia się niczym pożar, a nawet nasz rodzinny region może stać się jej celem. Musimy wykorzenić wszelkie przejawy herezji, które pojawią się w Skandynawii, i zapewnić naszą wierność Stolicy Apostolskiej."
 dan_protect_the_catholic_faith_title: "[Root.GetPreviewColorDAN]Obrońca katolicyzmu[Root.GetPreviewColorDAN_end]"
 dan_protect_the_catholic_faith_desc: "Wiara katolicka – prawdziwa i jedyna słuszna wiara chrześcijańska – jest zagrożona unicestwieniem w wyniku tej heretyckiej próby reformacji. Musimy pokazać Europie nasze barwy i wspierać naszych katolickich braci naszą pomocą wojskową."
 dan_protect_the_catholic_faith_tt: "Państwo §Y[Root.GetName]§! zyskuje §G+10§! zaufania u każdego znanego państwa §Ykatolickiego§!."
 dan_join_the_30_years_war_catholic_title: "[Root.GetPreviewColorDAN]Liga religijna[Root.GetPreviewColorDAN_end]"
 dan_join_the_30_years_war_catholic_desc: "Napięcia między heretykami a wyznawcami prawdziwej wiary w Świętym Cesarstwie Rzymskim stale rosną. Wybuch wojny religijnej jest tylko kwestią czasu. Jeśli do niej dojdzie, zwycięstwo Ligi Katolickiej będzie w najlepszym interesie całego chrześcijaństwa."
 dan_a_protestant_scandinavia_title: "[Root.GetPreviewColorDAN]Reformowana Skandynawia[Root.GetPreviewColorDAN_end]"
 dan_a_protestant_scandinavia_desc: "Wpływy papiestwa muszą zostać usunięte z naszego rodzinnego regionu. W Skandynawii nie może pozostać ani jedna katolicka osada!"
 dan_protect_the_reformation_title: "[Root.GetPreviewColorDAN]Broń reformacji[Root.GetPreviewColorDAN_end]"
 dan_protect_the_reformation_desc: "Reformacja każdego dnia zyskuje nowych wyznawców, lecz nasi wrogowie również rosną w siłę. Zacofani heretycy gromadzą wojska, by zgasić płomień reformacji. Nasi bracia i siostry w wierze potrzebują kogoś, kto obroni ich przed katolickim zagrożeniem. Potrzebują nas!"
 dan_protect_the_reformation_at: "Co najmniej §Y3 chrześcijańskie§!, §Yniekatolickie§! państwa są naszymi §Ypoddanymi§! lub §Ysojusznikami§! państwa [Root.GetName] albo mają §Yzagwarantowaną niepodległość§! przez państwo [Root.GetName]."
 dan_protect_the_reformation_tt: "Państwo §Y[Root.GetName]§! zyskuje §G+10§! zaufania u każdego znanego państwa §Ychrześcijańskiego§!, §Yniekatolickiego§!."
 dan_spread_the_reformation_title: "[Root.GetPreviewColorDAN]Szerz reformację[Root.GetPreviewColorDAN_end]"
 dan_spread_the_reformation_desc: "Czas przestać się bronić! Katolicy drżą przed naszą potęgą, a my poprowadzimy ich ku prawdziwej ścieżce wiary chrześcijańskiej — słowem lub potężnym mieczem!"
 dan_spread_the_reformation_tt: "Jeśli wygramy §Ywojnę lig religijnych§! po stronie §Yprotestanckiej§!, każde państwo §Yprotestanckie§! i §Yreformowane§! w §YŚwiętym Cesarstwie Rzymskim§! poprawi swoją opinię o nas o §G+150§! punktów."
 dan_a_norse_scandinavia_title: "[Root.GetPreviewColorDAN]Przywróć wiarę nordycką[Root.GetPreviewColorDAN_end]"
 dan_a_norse_scandinavia_desc: "Chrześcijaństwo zostało przyniesione do Skandynawii przez niemieckich misjonarzy. Choć poddawano ich próbom, zwykle próbom ognia, przetrwali i zdołali przekonać naszych przodków do wiary chrześcijańskiej. Od tego czasu coraz większa część Skandynawii przyjmowała katolicyzm, a świątynie dawnych bogów niszczono w imię Chrystusa.\nPowinniśmy naprawić szkody wyrządzone niegdyś przez naszych zwiedzionych przodków i przywrócić wiarę nordycką!"
 dan_raid_the_north_sea_title: "[Root.GetPreviewColorDAN]Łupieżcy Północy[Root.GetPreviewColorDAN_end]"
 dan_raid_the_north_sea_desc: "Zanim porzuciliśmy naszych bogów, nasz lud budził strach i przerażenie w sercach słabych chrześcijan. Najeżdżaliśmy ich wybrzeża i łupiliśmy kościoły oraz świątynie. Nadszedł czas, by ponownie nauczyć tych pogan, że powinni się nas bać!"
 dan_raid_the_north_sea_tt: "Dokonano co najmniej §Y40§! najazdów. (§Y[Root.GetNumRaids]§!/§Y40§!)"
 dan_return_of_the_north_sea_empire_title: "[Root.GetPreviewColorDAN]Imperium Morza Północnego[Root.GetPreviewColorDAN_end]"
 dan_return_of_the_north_sea_empire_desc: "Imperium Morza Północnego zostało utworzone przez wielkiego Swena Widłobrodego, króla Danii, Norwegii i Anglii. Jego panowanie trwało jednak krótko. Po jego śmierci syn, Kanut Wielki, przejął dziedzictwo ojca, ponownie zjednoczył trzy królestwa i rządził nimi przez dziewiętnaście chwalebnych lat. Choć był chrześcijaninem, za jego życia kultura wikingów osiągnęła szczyt potęgi.\n\nNadszedł czas, by odzyskać to, co słusznie należy do nas, i odbudować Imperium Morza Północnego — tym razem pod przewodnictwem prawdziwych bogów!"
 dan_commune_between_the_religions_title: "[Root.GetPreviewColorDAN]Pomiędzy wyznaniami[Root.GetPreviewColorDAN_end]"
 dan_commune_between_the_religions_desc: "Reformacja rozdziera wiarę katolicką. Bracia chwytają za miecze przeciwko sobie nawzajem, całe królestwa pogrążają się w chaosie, a ich mieszkańcy mordują się w imię tego samego Boga.\nPowinniśmy pokazać tym szaleńcom, że pokojowe współistnienie różnych wyznań jest możliwe."
 dan_remove_power_from_the_clergy_title: "[Root.GetPreviewColorDAN]Ogranicz władzę duchowieństwa[Root.GetPreviewColorDAN_end]"
 dan_remove_power_from_the_clergy_desc: "Duchowieństwo jest plagą naszego państwa, ponieważ uosabia właśnie ten fanatyzm religijny, który chcemy wykorzenić. Powinniśmy odebrać duchowieństwu przywileje i pozbawić je wszelkiej władzy."
 dan_a_multicultural_kingdom_title: "[Root.GetPreviewColorDAN]Wielokulturowe [Root.GovernmentName][Root.GetPreviewColorDAN_end]"
 dan_a_multicultural_kingdom_desc: "Tolerancja religijna to tylko jeden z aspektów. Powinniśmy również rozważyć tolerancję między kulturami. Jeśli chcemy być latarnią oświecenia w tym mrocznym świecie, musimy pokazać, że w państwie [Root.GetName] każdy jest mile widziany — bez względu na wyznanie czy kulturę."
 flavor_dan.101.t: "Los Eryka Gryfa"
 flavor_dan.101.desc: "Eryk Gryf z Pomorza, niegdyś potężny król unii kalmarskiej, jest teraz zwykłym piratem, który przejął miasto Visby na Gotlandii. Jego piracki żywot dobiega końca, ponieważ ponownie przejęliśmy pełną kontrolę nad wyspą. Pytanie brzmi: co powinno się teraz stać z tym zhańbionym królem?"
 flavor_dan.101.a: "Wypędź go z Gotlandii."
 flavor_dan.101.b: "Pozwól mu rządzić Gotlandią. Jego pirackie doświadczenie może się przydać."
 flavor_dan.101.c: "Życie pirata mogłoby być czymś dla mnie..."
 flavor_dan.102.t: "Kolonizacja Nowego Świata"
 flavor_dan.102.desc: "Pogłoski o zupełnie nowych ziemiach na Dalekim Zachodzie okazały się prawdziwe! Nasi odkrywcy znaleźli lądy, których nie zaznaczono na żadnej z naszych map — nawet tych sporządzonych przez przodków wikingów. Powinniśmy wysłać do Nowego Świata osadników żądnych przygód i ustanowić pierwszą [Root.GetAdjective] placówkę na tym nowym kontynencie!"
 flavor_dan.102.a: "Wyślij osadników do prowincji [dan_rnw_colonial_province.GetName]."
 flavor_dan.102.b: "Wyślij osadników do prowincji [dan_hudson_bay_colonial_province.GetName]."
 flavor_dan.102.c: "Skolonizuj prowincję [dan_canada_colonial_province.GetName]."
 flavor_dan.102.d: "Prowincja [dan_northeast_america_colonial_province.GetName] powinna być naszą pierwszą kolonią."
 flavor_dan.102.e: "[dan_southeast_america_colonial_province.GetName] Jest prawowitym [Root.GetAdjective] terytorium."
 flavor_dan.102.zzz: "Szkoda, że nie pozostały już żadne nadbrzeżne prowincje do skolonizowania..."
 flavor_dan.103.t: "Ratyfikacja unii kalmarskiej"
 flavor_dan.103.desc: "W 1397 roku 67 przedstawicieli duchowieństwa i szlachty Danii, Norwegii oraz Szwecji podpisało w Kalmarze traktat, który przeszedł do historii jako unia kalmarska. Choć dokument podpisali możnowładcy i duchowni wszystkich trzech królestw, nigdy nie został ratyfikowany, przez co unia kalmarska nie miała jednolitej podstawy prawnej.\nW roku [GetYear] [Root.Monarch.GetTitle] państwa [Root.GetName] ponownie zgromadził szlachtę i duchowieństwo wszystkich trzech królestw w [Root.Capital.GetName]. Dziś unia kalmarska wreszcie otrzymuje podstawę prawną, która przekształca jej członków w rzeczywistych młodszych partnerów unii państwa [Root.GetName]. Od tej chwili Norwegią i Szwecją zawsze będzie rządził [Root.GetAdjective] [Root.Monarch.GetTitle]!"
 flavor_dan.103.a: "Niech ten dzień stanie się początkiem nowej ery Skandynawii!"
 flavor_dan.104.t: "Københavns Universitet"
 flavor_dan.104.desc: "Uniwersytet Kopenhaski (Københavns Universitet) został założony w [GetYear] i jest najstarszą uczelnią w Danii. Jego budowę rozpoczęto po tym, jak [Root.Culture.GetName] [Root.Monarch.GetTitle] otrzymał od papieża [PAP.Monarch.GetName] bullę zezwalającą na utworzenie uniwersytetu w Danii.\nUniwersytet jest jednym z nielicznych miejsc w państwie [Root.GetName], które otrzymały królewski przywilej, czyniący z niego autonomiczną instytucję wolną od ingerencji korony i zwykłych praw obowiązujących ludność [Root.GetAdjective]."
 flavor_dan.104.a: "Wspaniale."
 flavor_dan.105.t: "Zjednoczenie Skandynawii"
 flavor_dan.105.desc: "Przez stulecia Skandynawia była podzielona na trzy królestwa: Danię, Szwecję i Norwegię. Wielokrotnie próbowano jednoczyć je poprzez unie personalne, a ostatnią z nich była unia kalmarska.\nTym razem jednak związek ten ostatecznie położy kres podziałowi Północy! Szwecja i Norwegia zostały włączone do korony państwa [Root.GetName], a cała Skandynawia wkracza w nową złotą erę pod rządami [Root.GetAdjective]!"
 flavor_dan.105.a: "Królowa Małgorzata byłaby teraz taka dumna."
 flavor_dan.106.t: "Krwawa łaźnia w [Root.Capital.GetName]"
 flavor_dan.106.desc: "Koronacja [From.Monarch.GetName] na [From.Monarch.GetTitle] państwa [Root.GetName] nie obyła się bez problemów. [Root.GetAdjective] szlachta podzieliła się na stronnictwa prounijne i antyunijne — tych, którzy cieszą się z przywilejów nadanych przez naszego zwierzchnika z państwa [From.GetAdjective], oraz tych, którzy pragną niepodległości [Root.GetAdjective].\nGdy napięcia między obiema frakcjami narastały, [From.Monarch.GetTitle] interweniował i wydał ucztę dla [Root.GetAdjective] szlachty. Okazało się jednak, że była to pułapka zastawiona przez prounijne stronnictwo: wielu możnowładców dążących do niepodległości uwięziono, a wkrótce potem stracono za herezję!\n\nNasz lud jest wstrząśnięty okrucieństwem, do którego zdolny był [Root.Monarch.GetName]. [Root.GetAdjective] stan [Root.GetNobilityOrFallbackName] został całkowicie zdziesiątkowany, a [Root.GetAdjective] ludność na razie podporządkowała się rzeźnikom z państwa [From.GetName]. Krwawa łaźnia w [Root.Capital.GetName] zostanie jednak na zawsze zapamiętana w państwie [Root.GetName]..."
 flavor_dan.106.a: "I taki okrutny [From.Monarch.GetTitle] ma nami rządzić? Phi..."
 flavor_dan.107.t: "Doradca Dansk Ostindien"
 flavor_dan.107.desc: "Duńska Kompania Wschodnioindyjska (Ostindisk Kompagni) jest kompanią handlową duńskiej korony, zajmującą się wymianą handlową z Indiami. Wielu ludzi szukających fortuny i bogactwa wyrusza więc w podróż do Indii. Większość kupców to zwyczajni handlarze, lecz niektórzy wykazują wyjątkowe zdolności w zarządzaniu skarbcem, handlu, nawigacji i księgowości. Powinniśmy zatrudnić jednego z tych utalentowanych kupców w naszym rządzie."
 flavor_dan.107.a: "Potrzebujemy kogoś, kto będzie zarządzał skarbcem."
 flavor_dan.107.b: "Właśnie dobrego kupca szukamy."
 flavor_dan.107.c: "Nawigacja stała się ostatnio niezwykle istotna."
 flavor_dan.107.d: "Nasze wojsko potrzebuje porządnej księgowości."
 flavor_dan.108.t: "[From.GetAdjective] kupcy w państwie [Root.GetName]"
 flavor_dan.108.desc: "W naszym kraju pojawili się cudzoziemcy w dziwnych strojach. Początkowo obawialiśmy się najgorszego, lecz nieznajomi okazali się nie zdobywcami, a kupcami.\nNajwyraźniej przybyli z państwa [From.GetName] i szukają możliwości inwestowania w naszą gospodarkę w zamian za ograniczenie naszego własnego handlu w Indiach."
 flavor_dan.108.a: "Przyjmij tę ofertę."
 flavor_dan.108.b: "Wypędź tych cudzoziemców z naszego kraju."
 flavor_dan.109.t: "Stan unii kalmarskiej"
 flavor_dan.109.desc: "W 1397 roku królowa Małgorzata I Duńska ustanowiła unię kalmarską — dość luźny związek trzech królestw: Danii, Norwegii i Szwecji, w którym dominującą pozycję zajmowała Dania. Akt unii nigdy jednak nie stał się prawem w Szwecji ani Norwegii. W rezultacie po śmierci króla unii kalmarskiej dwa pozostałe królestwa musiały wybierać duńskiego monarchę na swojego władcę — z czym szczególnie Szwedzi mieli trudności.\n\nOprócz problemów z utrzymaniem unii zagrożeniem dla jej stabilności jest również sama duńska szlachta, ponieważ uwaga duńskiego króla jest podzielona między trzy królestwa. Możnowładcy regularnie będą domagać się zasobów korony na realizację własnych celów, dopóki ich władza nie zostanie znacznie ograniczona."
 flavor_dan.109.a: "Przed nami trudne czasy..."
 flavor_dan.109.a.tt: "Unia kalmarska przestanie istnieć, jeśli §YSzwecja§! lub §YNorwegia§! kiedykolwiek wywalczy niepodległość i wygra z nami wojnę o jej odzyskanie."
 flavor_dan.110.t: "Podwyższenie cła sundzkiego"
 flavor_dan.110.desc: "Chciwi [From.GetAdjective] podnieśli i tak już dotkliwe cło sundzkie, doprowadzając połowę naszych kupców na skraj bankructwa za samo przepłynięcie przez cieśninę Sund. Skargi trafiają jedynie do głuchych uszu [From.GetAdjective] [From.Monarch.GetTitle]. Wszelka dyplomacja z państwem [From.GetName] jest daremna, mamy więc tylko dwa wyjścia: podporządkować się cłu sundzkiemu albo wypowiedzieć państwu [From.GetName] wojnę handlową, tak jak Hanza uczyniła to przed laty."
 flavor_dan.110.a: "Dość tego! Państwo [From.GetName] od zdecydowanie zbyt dawna wyciąga od nas dukaty!"
 flavor_dan.110.a.tt: "Każdy członek naszej §Yligi handlowej§!, który sam nie rozważa wojny z państwem [From.GetName], dołączy do nas we wszystkich wojnach zaczepnych."
 flavor_dan.110.b: "Nie mamy siły, by przeciwstawić się państwu [From.GetName]."
 dan_submitted_to_danish_trade_dominance_modifier: "Podporządkowanie się cłu sundzkiemu"
 flavor_dan.111.t: "Państwo [From.GetName] podporządkowuje się dominacji handlowej państwa [Root.GetAdjective]"
 flavor_dan.111.desc: "Choć oburzenie [From.GetAdjective] było ogromne, gdy podnieśliśmy cło dla członków Hanzy, rząd państwa [From.GetName] musiał podporządkować się naszej dominacji. Strach przed całkowitym unicestwieniem okazał się silniejszy niż obawa przed utratą zysków."
 flavor_dan.111.a: "Mądra decyzja ich [From.Monarch.GetTitle]."
 dan_submitted_to_danish_trade_dominance_tt: "Państwo §Y[From.GetName]§! podporządkowuje się naszej dominacji handlowej."
 flavor_dan.112.t: "Norwegia w unii kalmarskiej"
 flavor_dan.112.desc: "Przed czarną śmiercią Norwegia była równorzędnym partnerem Szwecji i Danii, posiadającym własną silną szlachtę i dwór królewski. Zaraza dotarła jednak również do Norwegii, a w 1348 roku 60% jej ludności poniosło marną śmierć. Od tego wydarzenia znaczenie norweskiej korony stopniowo malało, a miejscową szlachtę z czasem zastępowali Duńczycy.\nObecnie korona Norwegii jest najmniej znaczącym z trzech tytułów królewskich. W Norwegii nie brakuje jednak głosów pragnących przywrócić ojczyźnie dawną chwałę i zapewnić jej większe uznanie w ramach unii kalmarskiej."
 flavor_dan.112.a: "Zrównaj koronę Norwegii z naszą własną."
 flavor_dan.112.b: "Zachowaj status quo."
 flavor_dan.112.c: "Przekształć Norwegię w [Root.GetAdjective] prowincję."
 flavor_dan.113.t: "Niemieccy najemnicy"
 flavor_dan.113.desc: "Nasz lud dobrze zna sztukę wojenną, a gospodarka pozwala nam wystawić imponującą armię do obrony ojczyzny. Naszą prawdziwą specjalnością pozostaje jednak walka na morzu.\nW [GetYear] wielki [Root.Monarch.GetTitle] państwa [Root.GetName] zgromadził w [Root.Capital.GetName] przywódców germańskich kompanii najemniczych, aby podpisać królewski kontrakt między [Root.GovernmentName] państwa [Root.GetName] a tymi kompaniami. W zamian za [Root.GetAdjective] bogactwo najemnicy przysięgli wierność [Root.GetAdjective] koronie."
 flavor_dan.113.a: "Ci najemnicy z pewnością udowodnią swoją wartość."
 flavor_dan.114.t: "Szwecja w unii kalmarskiej"
 flavor_dan.114.desc: "W przeciwieństwie do Norwegii Królestwo Szwecji trudniej utrzymać w unii. Podczas wojny Danii z Hanzą w 1435 roku Szwecja doświadczyła problemów gospodarczych spowodowanych przez Hanzę. W ich następstwie górnik i możnowładca Engelbrekt Engelbrektsson zebrał niewielką armię buntowników. Unia kalmarska, jaką znamy dzisiaj, mogła już wtedy przestać istnieć, gdyby nie jego przedwczesna śmierć.\nJest oczywiste, że szwedzka szlachta nie jest już zadowolona z [Root.GetAdjective] ingerencji w swoje sprawy. Na szczęście część szwedzkiej klasy rządzącej popiera unię. Możemy wykorzystać nasze zasoby, by przekonać pozostałych możnowładców i również przeciągnąć ich na stronę unii."
 flavor_dan.114.a: "Spróbuj przekonać pozostałą szlachtę do naszej sprawy."
 flavor_dan.114.b: "Z czasem sami poprą unię."
 flavor_dan.114.c: "Nie warto zajmować się szwedzką szlachtą. Lepiej wykorzystać zasoby Szwecji."
 flavor_dan.115.t: "Marzenie o wolności"
 flavor_dan.115.desc: "Choć [Root.GetAdjective] możnowładcy kierowali się dobrymi intencjami wobec państwa [Root.GetName], gdy podpisywali traktat unii kalmarskiej, nikt z naszego ludu nie chce podlegać duńskiej koronie. Marzenie o niepodległej Szwecji staje się coraz bardziej kuszące..."
 flavor_dan.115.a: "Pewnego dnia to marzenie stanie się rzeczywistością!"
 flavor_dan.117.t: "Niezadowolenie [Root.GetAdjective] szlachty"
 flavor_dan.117.desc: "Wraz z opracowaniem skandynawskiej konstytucji [From.Monarch.GetTitle] państwa [From.GetName] przygotowuje ratyfikację unii kalmarskiej, a w dalszej perspektywie nasze włączenie do [From.GetAdjective] korony. Ponieważ konstytucja odbiera władzę [Root.GetAdjective] stanowi [Root.GetNobilityOrFallbackName], niezadowolenie w naszym [Root.GovernmentName] narasta. Podczas gdy prounijni możnowładcy próbują bronić decyzji państwa [From.GetAdjective], przeciwnicy unii przygotowują siły do kolejnego powstania przeciwko unii kalmarskiej..."
 flavor_dan.117.a: "Państwo [From.GetName] nie będzie kontrolować nas wiecznie."
 flavor_dan.118.t: "Nadciągająca rewolucja w państwie [From.GetName]"
 flavor_dan.118.desc: "Napięcia między państwem [Root.GetName] a [From.GetAdjective] szlachtą osiągają nowy poziom. Ustanowienie konstytucji skandynawskiej oburzyło wielu przedstawicieli [From.GetAdjective] klasy rządzącej, a nawet część przeciwników unii w państwie [Root.GetName] przygotowuje się do chwycenia za broń przeciwko unii kalmarskiej.\nNa horyzoncie majaczy wielka rewolucja. Musimy działać, jeśli nie chcemy stanąć w obliczu gniewu licznych [From.GetAdjective] buntowników popierających pretendentów do tronu."
 flavor_dan.118.a: "Poradzimy sobie z buntami."
 flavor_dan.118.b: "Powinniśmy zgromadzić [From.GetAdjective] przeciwników unii i... rozprawić się z nimi."
 flavor_dan.119.t: "Nowa stolica Imperium Morza Północnego?"
 flavor_dan.119.desc: "Gdy Kanut Wielki podbił Anglię, zabezpieczył swoje panowanie, rządząc nią z Londynu, podczas gdy ziemiami Danii i Norwegii zarządzała jego nordycka żona.\nPo wielu stuleciach Imperium Morza Północnego zostało ponownie odbudowane, choć tym razem Anglii nie podbili [Root.GetAdjective] wikingowie, lecz nasze rozwinięte społeczeństwo. Rządzenie Anglią będzie jednak trudne ze względu na odległość między [Root.Capital.GetName] a angielskimi ziemiami. Warto rozważyć ponowne przeniesienie stolicy do Londynu."
 flavor_dan.119.a: "[236.GetName] zostanie naszą nową stolicą!"
 flavor_dan.119.b: "Zamiast tego rozbudujmy [Root.Capital.GetName]."
 flavor_dan.120.t: "Utrata wpływów w kanale La Manche"
 flavor_dan.120.desc: "Utrata naszych wpływów handlowych w kanale La Manche poważnie uszczupla dochody z handlu i ogranicza dostęp do wielu wspaniałych towarów z Nowego Świata."
 flavor_dan.120.a: "Cholera..."
 flavor_dan.122.t: "Następstwa krwawej łaźni"
 flavor_dan.122.desc: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] udał się do stolicy Szwecji i zaprosił wszystkich szwedzkich możnowładców na wielki festyn z okazji koronacji. Szlachta szwedzka przyjęła zaproszenie z wahaniem i przybyła do centrum stolicy.\nWkrótce po przybyciu wszystkich możnowładców [Root.Monarch.GetTitle] zarządził jednak proces szwedzkiej szlachty i stracił większość jej przedstawicieli za herezję!\n\nChoć był to okrutny czyn, okazał się konieczny dla naszego [Root.GovernmentName]. Unia kalmarska rozpadłaby się, gdyby myśli antyunijne nadal szerzyły się w Szwecji. Ludność szwedzka postrzega jednak to wydarzenie jako dowód duńskiej tyranii..."
 flavor_dan.122.a: "Tak trzeba było postąpić. Szwedzi będą musieli to zaakceptować."
 flavor_dan.123.t: "Wojna pretendentów w Szwecji"
 flavor_dan.123.desc: "Nasza bezczynność skłoniła coraz większą część szwedzkiej szlachty do gromadzenia sojuszników i wszczynania otwartych buntów przeciwko naszym rządom. Nie wszyscy Szwedzi uznają jednak ich działania za uzasadnione, a okrucieństwa popełniane przez buntowników w imię „wolności i swobód” przynoszą ogromne zniszczenia szwedzkim ziemiom. Możnowładcy stają się coraz bardziej niepopularni wśród zwykłych mieszkańców Szwecji.\nWojna pretendentów będzie bardzo kosztowna dla naszego skarbca i zasobów ludzkich, ale przynajmniej pokaże Szwedom, że [Root.GetAdjective] rządy oznaczają sprawiedliwość, a nie tyranię — w przeciwieństwie do porządku, który próbują narzucić ich możnowładcy."
 flavor_dan.123.a: "Wreszcie Szwedzi zaakceptowali nasze rządy."
 flavor_dan.124.t: "Zmieniająca się rola najemników"
 flavor_dan.124.desc: "Od czasów Cesarstwa Rzymskiego królowie i generałowie polegali w swoich wojnach na najemnikach. Państwo [Root.GetName] nie jest pod tym względem wyjątkiem. Z biegiem czasu europejskie rządy zaczęły jednak tworzyć armie stałe — siły zbrojne rekrutowane spośród własnych poddanych i powoływane pod broń w razie potrzeby. Nasi doradcy są podzieleni. Z jednej strony armia stała gwarantuje, że do obrony naszych ambicji wykorzystujemy profesjonalnych i lojalnych żołnierzy. Z drugiej strony musielibyśmy być gotowi poświęcać życie dobrych [Root.GetAdjective] ludzi dla naszych celów.\nOstateczna decyzja należy do [Root.Monarch.GetTitle]."
 flavor_dan.124.a: "Powinniśmy pozostać przy armiach najemniczych."
 flavor_dan.124.b: "Dla państwa [Root.GetName] nadszedł czas na armię stałą."
 dan_humiliated_the_hanse: "Upokorzenie Hanzy"
 desc_dan_humiliated_the_hanse: "Hanza to jedynie drobna liga kupiecka, kurczowo trzymająca się marzeń o dominacji handlowej na Bałtyku. Po rozbiciu jej przywódcy, Lubeki, nasza dominacja w tamtejszym węźle handlowym stała się niepodważalna."
 dan_estonian_culture_accepted: "Integracja Estonii"
 desc_dan_estonian_culture_accepted: "Naród estoński został włączony do naszego rządu i może utrzymywać pewną formę samorządności.\n\n§YModyfikator zostanie usunięty, gdy tylko kultura estońska przestanie być akceptowana w państwie [Root.GetName].§!"
 dan_estonian_culture_accepted_tt: "do czasu, gdy kultura §Yestońska§! przestanie być akceptowana"
 dan_estonian_support: "Poparcie narodu estońskiego"
 desc_dan_estonian_support: "Estończycy w tej prowincji cieszą się dużym zakresem samorządności i swobód. W zamian ich produktywność służy korzyściom ich zwierzchnika.\n\n§YModyfikator zostanie usunięty, gdy tylko właściciel przestanie akceptować kulturę estońską.§!"
 dan_control_over_the_english_channel: "Kontrola nad kanałem La Manche"
 desc_dan_control_over_the_english_channel: "Jesteśmy jedynym państwem kontrolującym kanał La Manche, dzięki czemu nasz kraj ma dostęp do towarów i skarbów z całego świata!\n\n§YModyfikator zostanie usunięty, jeśli utracimy całą siłę handlu w kanale La Manche.§!"
 dan_control_over_the_english_channel_tt: "do czasu utraty całej siły handlu w węźle §Ykanału La Manche§!"
 dan_new_world_expansion: "Ekspansja w Nowym Świecie"
 desc_dan_new_world_expansion: "Najodważniejsi i najbardziej żądni przygód Duńczycy wyruszają, by kolonizować Nowy Świat ku chwale swojej ojczyzny!"
 dan_danish_gold_coast: "Danske Guldkyst"
 desc_dan_danish_gold_coast: "Prowincja ta należy do duńskiej kompanii handlowej Złotego Wybrzeża, dzięki czemu kupcy dysponują zasobami potrzebnymi do wznoszenia miejscowych budowli."
 dan_gold_coast_control: "Kontrola nad Złotym Wybrzeżem"
 desc_dan_gold_coast_control: "Złote Wybrzeże w Afryce znajduje się pod naszą kontrolą. Kupcy z całej Danii podróżują tam, aby rozwijać miejscową kompanię handlową i uzyskiwać dostęp do zupełnie nowych rynków."
 dan_african_trade_company: "Duńska Afrykańska Kompania Handlowa"
 desc_dan_african_trade_company: "Dzięki naszym wpływom w handlu afrykańskim powstała nowa kompania handlowa, która utrzymuje i rozszerza naszą dominację handlową w Afryce."
 dan_nor_equal_crowns: "Równorzędne korony"
 desc_dan_nor_equal_crowns: "Uznaliśmy koronę norweską za równorzędną duńskiej i szwedzkiej. Musimy zatem inwestować w norweski dwór królewski i przyznać dodatkowe przywileje szlachcie obu naszych państw.\n\nNorwegia otrzymuje modyfikator „§YRównorzędna korona duńska§!” do czasu, gdy przestanie być naszym młodszym partnerem unii. Zapewnia on następujące efekty:\nPragnienie wolności: §G-10,00%§!\nRoczny prestiż: §G+0,50§!\nRoczny dochód podatkowy: §G+24,00§!¤\n\n§YModyfikator wygasa, gdy Norwegia przestanie pozostawać w unii personalnej z państwem [Root.GetName].§!"
 dan_nor_equal_crowns_tt: "do czasu, gdy §YNorwegia§! przestanie pozostawać z nami w unii personalnej"
 dan_nor_equal_crowns_norway: "Równorzędna korona duńska"
 desc_dan_nor_equal_crowns_norway: "Przywódca unii kalmarskiej zrównał naszą koronę ze swoją i wspiera nas w utrzymywaniu [Root.GetAdjective] dworu królewskiego.\n\n§YModyfikator trwa do czasu, gdy przestaniemy być młodszym partnerem unii kalmarskiej.§!"
 dan_exploiting_norwegians: "Degradacja norweskiej korony"
 desc_dan_exploiting_norwegians: "Postanowiliśmy jeszcze bardziej zdegradować norweską koronę i traktować całe królestwo jak [Root.GetAdjective] prowincję. W rezultacie czerpiemy dochody z norweskich podatków i siły żywej oraz odbieramy przywileje norweskiej szlachcie.\n\n§YModyfikator wygasa, gdy Norwegia przestanie pozostawać w unii personalnej z państwem [Root.GetName].§!"
 dan_norwegian_marines: "Norwescy piechurzy morscy"
 desc_dan_norwegian_marines: "Norweska korona została włączona do naszej, a jej siły morskie i piechota morska powiększają teraz nasze własne wojska."
 dan_danish_investment: "Duńskie inwestycje"
 desc_dan_danish_investment: "Duńczycy z zachodu przybyli do naszego kraju i rozpoczęli inwestycje w miejscową produkcję. Nasi kupcy narzekają na ich obecność, lecz ludzie pracy doceniają rozwój infrastruktury i nowe możliwości, jakie przynoszą Duńczycy."
 dan_swe_supports_pro_unionists: "Poparcie dla prounijnych"
 desc_dan_swe_supports_pro_unionists: "Postanowiliśmy zainwestować w szwedzką szlachtę i przekonać ją do współpracy z państwem [Root.GetName].\n\nSzwecja otrzymuje modyfikator „§YPoparcie dla unionistów§!” do czasu, gdy przestanie być naszym młodszym partnerem unii. Zapewnia on następujące efekty:\nPragnienie wolności: §G-10,00%§!\nWpływy szlachty: §Y+10,0%§!\nRównowaga lojalności szlachty: §G+20,0%§!\nRoczny dochód podatkowy: §G+24,00§!¤\n\n§YModyfikator wygasa, gdy Szwecja przestanie pozostawać w unii personalnej z państwem [Root.GetName].§!"
 dan_swe_supports_pro_unionists_tt: "do czasu, gdy §YSzwecja§! przestanie pozostawać z nami w unii personalnej"
 dan_swe_supported_unionists: "Poparcie dla unionistów"
 desc_dan_swe_supported_unionists: "Przywódca unii kalmarskiej przeznaczył zasoby na wsparcie [Root.GetAdjective] stronników, którzy popierają unię kalmarską zamiast [Root.GetAdjective] niepodległości.\n\n§YModyfikator trwa do czasu, gdy przestaniemy być młodszym partnerem unii kalmarskiej.§!"
 dan_exploiting_swedes: "Wykorzystywanie szwedzkich zasobów"
 desc_dan_exploiting_swedes: "Postanowiliśmy zignorować szwedzką szlachtę i skupić się na pozyskaniu jak największej ilości zasobów Szwecji. Znacznie zwiększa to nasze dochody, lecz Szwedzi mogą przestać darzyć nas sympatią...\n\n§YModyfikator wygasa, gdy Szwecja przestanie pozostawać w unii personalnej z państwem [Root.GetName].§!"
 dan_dream_of_freedom: "Marzenie o wolności"
 desc_dan_dream_of_freedom: "Wojna Danii z Hanzą pokazała, jak bardzo jesteśmy bezbronni w ramach unii kalmarskiej i jak niewiele Dania troszczy się o [Root.GetAdjective] interesy. Marzenie o niepodległości państwa [Root.GetName] staje się coraz bardziej realne dla nas wszystkich."
 dan_swedish_steel: "Szwedzka stal"
 desc_dan_swedish_steel: "Wraz z integracją Szwecji znaczna część jej wyposażenia wojskowego stała się częścią naszych sił zbrojnych i służy teraz w [Root.GetAdjective] armii."
 dan_danish_absolutism: "Duński absolutyzm"
 desc_dan_danish_absolutism: "Epoka państw feudalnych dobiegła końca. Rozpoczęła się epoka absolutyzmu, a państwo [Root.GetName] będzie jednym z pierwszych pionierów centralizacji całej władzy państwowej."
 dan_naval_preperations: "Przygotowania morskie"
 desc_dan_naval_preperations: "Konflikt z Anglikami jest nieunikniony. Na szczęście rozpoczęliśmy już przygotowania do budowy floty, która będzie mogła rywalizować z Królewską Marynarką Wojenną."
 dan_king_of_denmark_and_england: "Drugie Imperium Morza Północnego"
 desc_dan_king_of_denmark_and_england: "Przed wiekami Kanut Wielki zjednoczył trzy korony Danii, Norwegii i Anglii w jedno Imperium Morza Północnego.\nJego imperium przetrwało jednak tylko do śmierci władcy. Nasze nowe, drugie Imperium Morza Północnego będzie trwać tak długo, jak długo Dania będzie panować na falach!"
 dan_catholic_support: "Poparcie papieskie"
 desc_dan_catholic_support: "Ponieważ opowiadamy się po stronie katolickiej, sam papież wysłał do nas legatów, którzy wspierają nas w sprawach religijnych naszego państwa."
 dan_protestant_support: "Poparcie duchowieństwa"
 desc_dan_protestant_support: "Ponieważ opowiadamy się po stronie reformacji, nasze duchowieństwo przysięgło wierność naszej sprawie i wspiera nas w różnych sprawach związanych z Kościołem."
 dan_communication_between_the_faiths: "Dialog między wyznaniami"
 desc_dan_communication_between_the_faiths: "Nie jesteśmy krajem fanatyków, którzy próbują wykorzenić ludzi wyznających „niewłaściwą” wiarę. Nasza polityka opiera się na otwartym dialogu między różnymi wyznaniami w granicach naszego państwa."
 dan_plunder_and_pillaging: "Łupienie i grabież"
 desc_dan_plunder_and_pillaging: "Perspektywa zdobycia łupów przemawia do wielu naszych wojowników, którzy szukają fortuny w świątyniach pogan."
 stockholm_bloodbath: "Blizny po krwawej łaźni"
 desc_stockholm_bloodbath: "Na rozkaz monarchy rządzącego unią kalmarską [Root.GetAdjective] możnowładcy zostali zgromadzeni, osądzeni za herezję i szybko straceni w [Root.Capital.GetName]. Wydarzenie to pokazało, jak niewiele kogokolwiek obchodzi nasz los i jak łatwo nasi wrogowie mogą zgromadzić się, by wymordować nasz lud.\nPaństwo [Root.GetName] już nigdy nie będzie niczyim sługą!"
 dan_losing_ruling_grip: "Utrata kontroli nad władzą"
 desc_dan_losing_ruling_grip: "Nasz [Root.Monarch.GetTitle] traci [Root.Monarch.GetHerHis] władzę nad państwem, przez co idea niepodległości państwa [Root.GetName] staje się coraz bardziej kusząca dla ludności."
 dan_sca_standing_professional_merc_army: "Profesjonalne armie najemnicze"
 desc_dan_sca_standing_professional_merc_army: "Postanowiliśmy skupić nasze wysiłki wojskowe na rozbudowie armii najemniczych. Będą nam służyć wyłącznie najlepsi!"
 dan_sca_refocus_on_personal_armies: "Powrót do armii stałych"
 desc_dan_sca_refocus_on_personal_armies: "§YNie można rekrutować kompanii najemników, dopóki ten modyfikator jest aktywny.§!\n\nPostanowiliśmy ponownie skupić wysiłki wojskowe na armii stałej. Najemnicy nie są nam już potrzebni, ponieważ żadna inna armia nie jest tak profesjonalna jak nasza."
 dan_sca_refocus_on_personal_armies_tt: "§YZablokowuje możliwość rekrutowania kompanii najemników, dopóki ten modyfikator jest aktywny.§!"
 dan_colonial_ambitions_mod: "Ambicje kolonialne"
 desc_dan_colonial_ambitions_mod: "Nasz lud pragnie odkrywać Nowy Świat i zdobywać nowe ziemie w imieniu duńskiej korony."
 dan_provoke_trade_conflict_war_title: "Wywołaj konflikt handlowy z Hanzą"
 dan_provoke_trade_conflict_war_desc: "Hanza jest uciążliwym partnerem, z którym trudno dojść do porozumienia. Konkurują z nami o dominację handlową na Morzu Bałtyckim, a ich pozycja w Świętym Cesarstwie Rzymskim zapewnia im przed nami ochronę.\nCesarz jest jednak zobowiązany wspierać Hanzę wyłącznie w wojnie obronnej. Prowokując Hanzę do zaatakowania nas, możemy doprowadzić do rozwiązania ligi bez konieczności prowadzenia wojny z całym Świętym Cesarstwem Rzymskim. Wystarczy sprowokować hanzeatyckich kupców..."
 dan_provoke_trade_conflict_war_tt: "Państwo [Root.GetName] albo §Ynakłada embargo§! na właściciela tej prowincji, albo ma przeciwko niemu casus belli §Ykonflikt handlowy§!."
 dan_provoke_trade_conflict_war_ct: "Właściciele prowincji §Y[47.GetName]§!, §Y[1858.GetName]§!, §Y[45.GetName]§!, §Y[44.GetName]§! i §Y[1874.GetName]§! (jeśli nie są państwem [Root.GetName] ani jego [Root.GetAdjective] poddanym) albo wypowiedzą §Rwojnę§! państwu §Y[Root.GetName]§! z casus belli §Ykonflikt handlowy§!, albo §Ypodporządkują się§! [Root.GetAdjective] dominacji handlowej.\n\n§RPrzywódcy lig handlowych wezwą do wojny WSZYSTKICH członków swoich lig.§!"
 dan_proclaim_archking_title_decision_title: "Ogłoś tytuł arcy-[Root.Monarch.GetTitle]"
 dan_proclaim_archking_title_decision_desc: "Krzysztof III Wittelsbach tytułował się „arcykrólem” Danii. Gdyby nie arcykról, nasze państwo nie znajdowałoby się dziś w obecnym położeniu. [Root.Monarch.GetName] może uczcić jego dokonania, przyjmując tytuł arcy-[Root.Monarch.GetTitle]."
 proclaim_archking_title_tt: "[Root.Monarch.GetName] otrzyma tytuł §Yarcy-[Root.Monarch.GetTitle]§!."
 flavor_sca.1.t: "Kwestia religijna państwa [Root.GetName]"
 flavor_sca.1.desc.a: "Wraz z rozwojem reformacji narastają spory teologiczne w naszym [Root.GovernmentName]. Nasz lud nigdy nie był szczególnie przywiązany do papiestwa, a w pewnym stopniu również do samego chrześcijaństwa, lecz religia nadal odgrywa rolę w naszym życiu. Możemy pozostać wierni papieżowi albo poprzeć reformację. Każda decyzja wiąże się z ryzykiem, ale korzyści dyplomatyczne, jakie może osiągnąć państwo [Root.GetName], będą tego warte."
 flavor_sca.1.desc.b: "Chrześcijańskie państwa Europy przechodzą okres reformacji, sporów i wewnętrznych konfliktów religijnych. Chrześcijanie atakują innych chrześcijan pod pretekstem służenia swojemu Bogu. Gdyby to wszystko wydarzyło się kilka lat wcześniej, być może przyłączylibyśmy się do tych bezsensownych sporów i zastanawiali, czy człowiek w zabawnym kapeluszu rzeczywiście powinien reprezentować niebiosa.\nNa szczęście nasz lud odnalazł drogę z powrotem w objęcia Odyna. Stoi przed nami pewne pytanie, lecz nie dotyczy ono religii."
 flavor_sca.1.a: "Pozostaniemy wierni Stolicy Apostolskiej."
 sca_unlock_catholic_missions_tt: "Odblokowuje misje §Ykatolickie§!."
 flavor_sca.1.a.tt: "Opinia każdego znanego państwa wyznającego religię §Y[Root.Religion.GetName]§! spada o §R100§! punktów."
 flavor_sca.1.b: "Przyszłość należy do reformacji."
 sca_unlock_protestant_missions_tt: "Odblokowuje misje §Yreformacyjne§!."
 flavor_sca.1.c: "Pytanie brzmi: ile złota możemy złupić z tych głupców?"
 sca_unlock_norse_missions_tt: "Odblokowuje misje §Ynordyckie§!."
 flavor_sca.1.d: "Tylko dialog między wyznaniami może uleczyć tę ranę."
 flavor_sca.1.d.tt: "Każde znane państwo §Ychrześcijańskie§!, które nie jest prawosławne ani koptyjskie, zmienia opinię o nas o §R-50§! punktów."
 flavor_sca.2.t: "Edukacyjne priorytety [Root.Monarch.GetName]"
 flavor_sca.2.desc: "Edukacja jest kluczowym elementem naszego społeczeństwa i niezbędnym warunkiem utrzymania postępu państwa — dotyczy to również naszego [Root.Monarch.GetTitle] i [Root.Monarch.GetHerHis] następcy. [Root.Monarch.GetSheHeCap] powinien wybrać kierunek rozwoju państwa, który zmniejszy obciążenie administracji związane z prowadzeniem określonej polityki, a zarazem posłuży jako narzędzie kształcenia przyszłego [Root.Monarch.GetTitle]."
 flavor_sca.2.a: "Administracja wymaga naszej uwagi."
 flavor_sca.2.b: "Powinniśmy skupić się na dyplomacji."
 flavor_sca.2.c: "Nasze wojsko wymaga większej uwagi."
 nor_handle_the_burghers_title: "Zjednaj sobie stan [Root.GetBurghersOrFallbackName]"
 nor_handle_the_burghers_desc: "Stany są fundamentem naszego państwa. Stan [Root.GetChurchOrFallbackName] zajmuje się sprawami religijnymi, a stan [Root.GetNobilityOrFallbackName] prowadzi naszą dyplomację z sąsiadami. Najważniejszy jest jednak stan [Root.GetBurghersOrFallbackName], odpowiedzialny za rozwój i przepływ pieniędzy w naszym [Root.GovernmentName]. Powinniśmy zyskać jego przychylność, aby móc w przyszłości korzystać z jego doświadczenia."
 nor_north_sea_markets_title: "Rynki Morza Północnego"
 nor_north_sea_markets_desc: "Morze Północne od zawsze odgrywało kluczową rolę w [Root.GetAdjective] historii. Jego ryby żywią nasz lud, a fale prowadzą nas ku zagranicznym skarbom.\nMa ono jednak również inne ważne znaczenie — jest naszym morzem handlu i wymiany towarowej. Powinniśmy założyć targowiska w kluczowych prowincjach państwa, aby przejąć kontrolę nad handlem."
 nor_dominate_trade_title: "Zmonopolizuj handel na Morzu Północnym"
 nor_dominate_trade_desc: "Morze Północne jest nierozerwalnie związane z handlem w Lubece i kanale La Manche. Kto zdominuje Morze Północne, zyska również wpływ na te dwa bogate rynki. Powinniśmy zmonopolizować handel na Morzu Północnym i rozszerzyć nasze wpływy na sąsiednie rynki."
 nor_dominate_trade_tt: "Monopol na Morzu Północnym"
 nor_the_great_disovery_fleet_title: "Wielka flota odkrywcza"
 nor_the_great_disovery_fleet_desc: "Wielkie mocarstwa zaczynają rozszerzać swoje wpływy daleko poza Europę i docierać na kontynenty nieznane reszcie świata.\nNie możemy pozwolić, by rywale nam uciekli, podczas gdy my będziemy stać w miejscu w Skandynawii. Powinniśmy utworzyć flotę odkrywców, która będzie żeglować po obcych morzach i poszukiwać możliwości realizacji naszych ambicji kolonialnych."
 nor_discover_new_world_title: "Zupełnie nowy świat"
 nor_discover_new_world_desc: "Pogłoski mówią o kontynentach pełnych niewiarygodnych skarbów i starożytnych cywilizacji. Musimy przebić się przez mgłę nieznanego i sprawdzić, czy te opowieści są prawdziwe."
 nor_discover_new_world_ct: "Dowolna prowincja (z wyjątkiem §YGrenlandii§!) w §YAmeryce Północnej§! lub §YAmeryce Południowej§! została odkryta przez §Y[Root.GetName]§!."
 nor_discover_new_world_tt: "Państwo §Y[Root.GetName]§! otrzymuje stałe roszczenia do każdej prowincji z §Ycentrum handlu§! lub §Yestuarium§! w regionach §YKolonialna Ameryka Wschodnia§!, §YKolonialna Kanada§!, §YKolonialne Karaiby§! i §YKolonialny Meksyk§!."
 nor_colonize_canada_and_na_title: "Ziemie Ameryki"
 nor_colonize_canada_and_na_desc: "Islandzki żeglarz Leif Eriksson był pierwszym Skandynawem, który na początku XI wieku odkrył ziemie za Atlantykiem. Nie wiedział, że odkrył zupełnie nowy kontynent.\nWikingowie z Winlandii dawno już odeszli, lecz ich odwaga nie pójdzie na marne. Skolonizujemy tę niezwykłą krainę i przejmiemy jej zasoby w imieniu [Root.GetAdjective] korony!"
 nor_colonize_canada_and_na_tt: "Maksymalnie §Y5§! skolonizowanych prowincji w regionie §YKolonialna Kanada§! lub §YKolonialna Ameryka Wschodnia§!, należących do państwa §Y[Root.GetName]§! lub jego poddanych, otrzymuje §Ykantor§!."
 nor_colonize_canada_and_na_at: "Norweskie wpływy handlowe"
 nor_colonize_new_world_title: "Skolonizuj Nowy Świat"
 nor_colonize_new_world_desc: "Nowy Świat jest pełen cudów przekraczających naszą wyobraźnię. Powinniśmy jak najszybciej przeznaczyć zasoby na jego kolonizację, aby czerpać korzyści z jego bogactw."
 nor_dominate_new_world_title: "Zdominuj Nowy Świat"
 nor_dominate_new_world_desc: "Bogactwo, które czerpiemy z naszych kolonii, jest zagrożone, dopóki nasi rywale utrzymują przyczółki na tych kontynentach. Powinniśmy wyprzeć wrogów z Nowego Świata i zapewnić sobie całkowitą dominację nad naszymi koloniami."
 nor_dominate_new_world_tt: "Żaden §Yrywal§! ani §Ywróg§! państwa §Y[Root.GetName]§! nie posiada §Ykolonii§! w §YNowym Świecie§!."
 nor_colonize_the_north_title: "Rozszerz ekspansję na zachód"
 nor_colonize_the_north_desc: "Ameryka Północna jest bogata w cenne zasoby. Powinniśmy rozszerzyć nasze kolonie na zachód i zabezpieczyć jak najwięcej ziem."
 nor_find_allies_title: "Sojusznicy [Root.GetAdjective]"
 nor_find_allies_desc: "W przeciwieństwie do naszego wschodniego sąsiada nasz [Root.GovernmentName] nie ma siły, by samodzielnie stawić czoła Danii. Jeśli chcemy zabezpieczyć niepodległość, musimy znaleźć potencjalnych sojuszników, którzy wesprą nas pieniędzmi, siłą żywą lub bezpośrednim udziałem w wojnie."
 nor_find_allies_ct: "Rywalami lub wrogami §YDanii§!\n    Opinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y100§! punktów."
 nor_build_navy_title: "Flota [Root.GetName]"
 nor_build_navy_desc: "[Root.GetAdjective] lud od zawsze był związany z morzem. Przed wiekami nasi przodkowie używali długich łodzi, by łupić i plądrować europejskie wybrzeża. To nasi żeglarze walczyli u boku Duńczyków przeciwko Anglikom.\nNawet w ostatnich czasach to nasze okręty starły się z flotą Hanzy podczas duńskiej wojny handlowej z ligą. Nadszedł czas, by rozbudować flotę, aby ponownie mogła służyć chwale państwa [Root.GetName]."
 nor_get_colonial_title: "Ambicje kolonialne"
 nor_get_colonial_desc: "Świat się zmienia. Dawne czasy średniowiecznych starć odchodzą w przeszłość, a zbliża się nowa epoka globalnej ekspansji. Powinniśmy przygotować się na nadchodzącą przyszłość."
 nor_conquer_scotland_title: "Roszczenia Orkadów"
 nor_conquer_scotland_desc: "Wyspy [369.GetName], [1978.GetName] i [1979.GetName] znajdują się w posiadaniu szkockiego klanu Sinclairów, który formalnie jest poddanym Szkocji. Jednak hrabstwo Orkadów służy [Root.GetAdjective] koronie, która oczywiście pragnie przejąć je dla siebie i surowo ukarać klan.\nPowinniśmy wyeliminować Szkocję, aby chronić nasze interesy na Morzu Północnym i zapobiec szkockiej agresji przeciwko naszym posiadłościom."
 nor_conquer_scotland_tt: "Jeśli państwo §Y[HSC.GetName]§! nie istnieje, uruchomi się wydarzenie „§YZarządzanie Szkocją§!”.\nW przeciwnym razie jedna losowa posiadana prowincja na obszarze §YNizin§!, §YWyżyn§! lub §YWysp§! otrzyma §Y3§! bazowego podatku, §Y3§! bazowej produkcji i §Y2§! bazowej siły żywej, a państwo §Y[Root.GetName]§! otrzyma modyfikator §YK kontrola nad Szkocją§! (siła handlu: §G+10,0§!) w prowincji §Y[1975.GetName]§! do końca gry."
 nor_control_over_scotland: "Kontrola nad Szkocją"
 nor_colonize_greenland_title: "Kolonia na Grenlandii"
 nor_colonize_greenland_desc: "Grenlandia jest jednym z najbardziej odległych zakątków naszego [Root.GovernmentName]. Odkrył ją Eryk Rudy w 986 roku, a z czasem nasi przodkowie skolonizowali tę rozległą wyspę.\nW ostatnich latach kontakt z Grenlandią jednak osłabł i nie wiadomo, co mogło być tego przyczyną. Powinniśmy ponownie nawiązać kontakt z Grenlandią i sprawdzić, co stało się z jej mieszkańcami."
 nor_colonize_greenland_bt: "Prowincja §Y[1104.GetName]§! otrzymuje §Y3§! bazowej siły żywej, §Y3§! bazowej produkcji i §Ycentrum handlu§! poziomu 1, jeśli należy do państwa §Y[Root.GetName]§! lub jego poddanych."
 nor_colonize_greenland_ct: "Prowincja §Y[1105.GetName]§! otrzymuje §Y3§! bazowej siły żywej i §Y3§! bazowej produkcji, jeśli należy do państwa §Y[Root.GetName]§! lub jego poddanych."
 nor_colonize_greenland_dt: "Uruchomi się wydarzenie „§YZaginiona osada na Grenlandii§!”, jeśli prowincja §Y[1104.GetName]§! lub §Y[1105.GetName]§! nie jest skolonizowana, a w jednej z tych prowincji stacjonują §Y3 regimenty piechoty§!."
 nor_colonize_mexico_title: "Złoto Meksyku"
 nor_colonize_mexico_desc: "Choć Ameryka Północna dostarcza wielu cennych towarów, serce Meksyku jest prawdziwą skrzynią skarbów, wypełnioną po brzegi złotem. Naszym najwyższym priorytetem jest podporządkowanie sobie tych ziem i przewiezienie złota do [Root.Capital.GetName]."
 nor_circumnavigate_the_world_title: "Mistrzostwo nawigacji"
 nor_circumnavigate_the_world_desc: "Niektórzy uważają, że najlepsi nawigatorzy pochodzą z Iberii i to im świat zawdzięcza odkrycie Nowego Świata.\nOczywiście to kompletna bzdura! W końcu to Skandynaw odkrył Nowy Świat, gdy Iberyjczycy wciąż zajmowali się rekonkwistą. Pokażemy światu, że prawdziwi mistrzowie nawigacji mieszkają na zimnej Północy!"
 nor_circumnavigate_the_world_at: "Państwo §Y[Root.GetName]§! opłynęło świat dookoła za pomocą §Yodkrywcy§!."
 nor_circumnavigate_the_world_bt: "Państwo §Y[Root.GetName]§! odkryło bezpośrednią morską drogę dookoła świata. (Kliknij §Yznak zapytania§!, aby przenieść kamerę do kolejnego regionu, który należy odkryć na potrzeby tej misji)."
 nor_circumnavigate_the_world_ct: "Jeśli jako pierwsi opłyniemy świat dookoła, otrzymamy §G100§! £adm£, §G100§! £dip£ i §G100§! £mil£."
 nor_declare_independence_title: "Wolność dla [Root.GetName]!"
 nor_declare_independence_desc: "Unia kalmarska była de facto siłą jednoczącą całą Skandynawię. Duńczycy wykorzystywali ją jednak wyłącznie do realizacji własnych celów, traktując nasz [Root.GovernmentName] jak zwykłą prowincję. To musi się skończyć! Nadszedł czas na niepodległość państwa [Root.GetName]!"
 nor_get_independent_title: "Wywalcz niepodległość!"
 nor_get_independent_desc: "Nasi dawni duńscy władcy nie pozwolą nam odejść bez walki. Musimy pokonać Duńczyków, jeśli chcemy spełnić marzenie o niepodległym [Root.GovernmentName] państwa [Root.GetName]!"
 nor_norway_denmark_title: "Norwegia–Dania"
 nor_norway_denmark_desc: "Dania była naszym zwierzchnikiem, a za niepodległość zapłaciliśmy krwią, lecz większość naszych dostaw żywności pochodzi właśnie z Danii. Powinniśmy „odnowić” unię kalmarską pod naszą własną koroną i ustanowić [Root.GovernmentName] Norwegii i Danii."
 nor_norway_denmark_tt: "Jeśli §YDania§! jest młodszym partnerem unii personalnej pod zwierzchnictwem państwa §Y[Root.GetName]§!, uruchomi się wydarzenie „§YKorona Danii§!”."
 nor_colonize_caribbeans_title: "Skolonizuj Karaiby"
 nor_colonize_caribbeans_desc: "Wyspy karaibskie leżą w samym centrum handlu Nowego Świata. Powinniśmy je skolonizować, aby towary z Nowego Świata nie trafiały w ręce Iberyjczyków ani Anglików."
 nor_colonize_caribbeans_tt: "Kontrola nad handlem karaibskim"
 nor_dominate_north_america_title: "Zdominuj Amerykę Północną"
 nor_dominate_north_america_desc: "Kontynent Ameryki Północnej jest ogromny i obfituje w zasoby. Musimy zapewnić sobie całkowitą dominację nad tymi ziemiami i koloniami zarządzającymi nimi w naszym imieniu oraz wyprzeć z Nowego Świata wszystkich rywali i wrogów."
 nor_dominate_north_america_tt: "Żadna prowincja w §YAmeryce Północnej§! nie należy do rywala ani wroga państwa §Y[Root.GetName]§! lub jego poddanych."
 nor_build_troops_title: "Rozbuduj siły zbrojne"
 nor_build_troops_desc: "Dania i Szwecja mogą nas bronić, gdy znajdujemy się pod ochroną unii kalmarskiej, lecz nie możemy polegać na nich wiecznie. Potrzebujemy własnej armii, która będzie bronić naszych granic przed ambitnymi sąsiadami."
 nor_restore_the_leidang_title: "Przywróć system leidang"
 nor_restore_the_leidang_desc: "Leidang to szczególna forma poboru, która pomaga nam organizować flotę przybrzeżną na potrzeby wojen zaczepnych i obronnych. System polega na wcielaniu żeglarzy spośród chłopstwa i zobowiązywaniu ich do służby przez dwa lub trzy letnie miesiące w czasie pokoju. Podczas wojny wszyscy wolni mężczyźni muszą służyć we flocie.\nJednak między XIII a XV wiekiem system ten został zastąpiony klasycznym systemem feudalnym, w którym dominowała szlachta.\nFeudalizm ma swoje zalety, lecz pod względem rekrutacji wykwalifikowanych żeglarzy nie dorównuje poborowi w systemie leidang. Powinniśmy przywrócić ten system, aby zyskać dostęp do kompetentnych marynarzy."
 nor_the_grand_norwegian_fleet_title: "Rozbuduj królewską flotę"
 nor_the_grand_norwegian_fleet_desc: "Niektóre państwa wykorzystują dyplomację, by narzucać swoją wolę. Inne wolą stosować brutalną siłę w postaci potężnej armii.\nMy natomiast będziemy realizować nasze cele za pomocą morza i floty. Najpierw jednak musimy zbudować flotę zdolną do projekcji naszej potęgi."
 upgrade_norwegian_doctrine: "Odblokowuje potężniejszą wersję doktryny morskiej §YNorwescy żeglarze§!."
 nor_restore_norwegian_nobility_title: "Wypędź duńską szlachtę"
 nor_restore_norwegian_nobility_desc: "Czarna śmierć była tragedią dla całej Europy, a nasze państwo również nie uniknęło jej okrutnego ciosu. W 1349 roku zaraza zabiła jedną trzecią naszej ludności i całkowicie zdziesiątkowała norweską szlachtę. Powstałą próżnię władzy wykorzystali oczywiście duńscy możnowładcy, którzy z czasem zastąpili norweską klasę rządzącą.\nDopóki nasza własna szlachta pozostaje obca we własnym kraju, nasz los będzie zależał od Duńczyków. Musimy odebrać jej przywileje i przejąć jej ziemie!"
