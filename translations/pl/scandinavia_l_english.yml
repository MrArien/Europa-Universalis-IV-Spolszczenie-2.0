 SET_RANK_EMPIRE_TOOLTIP: "Ranga rządowa państwa §Y[This.GetName]§! zmienia się na §Yimperium§!."
 swe_engelbrekt_rebellion_title: "Powstanie Engelbrekta"
 swe_engelbrekt_rebellion_desc: "W latach 1434 i 1436 dzielni szwedzcy górnicy i chłopi, prowadzeni przez szlachcica Engelbrekta Engelbrektssona, chwycili za kilofy i widły, by uwolnić Szwecję spod zgubnych wpływów Duńczyków. Powstanie jednak upadło, gdy Engelbrekt został zamordowany.\nChoć jego bunt zakończył się porażką, jego duch wciąż żyje w naszym narodzie. Nadszedł czas, by zebrać wojska gotowe walczyć o niepodległość naszej ojczyzny!"
 swe_military_advisor_title: "Rada wojskowa"
 swe_military_advisor_desc: "Powstanie Engelbrekta zakończyło się niepowodzeniem z powodu jego zabójstwa, a także poparcia, jakiego Sztokholm udzielił duńskiej koronie. Nawet gdyby Engelbrekt zdołał zdobyć poparcie Sztokholmu, brakowało mu umiejętności wojskowych, by poprowadzić buntowników do zwycięstwa. Musimy postąpić lepiej i zapewnić sobie doradców wojskowych, gdy nadejdzie chwila walki o niepodległość."
 swe_military_advisor_tt: "Uruchomiono wydarzenie „§YKoniec unii kalmarskiej§!” i wybraliśmy opcję „§YWolność!§!”."
 swe_conquest_of_novgorod_title: "Dziedzictwo Waregów"
 swe_conquest_of_novgorod_desc: "Miasto Nowogród zostało założone przez starożytnych Waregów ze Skandynawii, gdy jeszcze w VIII wieku podążali szlakami handlowymi do Cesarstwa Bizantyjskiego. Ostatecznie Nowogród stał się częścią narodu wschodniosłowiańskiego, a stare oznaki Waregów zniknęły. Ale miasto nadal jest częścią naszego starożytnego dziedzictwa i jako takie należy do nas i mamy prawo je odzyskać."
 swe_conquest_of_moscovy_title: "Miasto Rusi"
 swe_conquest_of_moscovy_desc: "Miasto Moskwa jest domem dla ludu moskiewskiego, którzy ostatecznie przyjęli nazwę Ruś. Podobnie jak Nowogród, tak i Moskwa została założona przez naszych przodków, choć byli głównie znani jako Rus Kijowska. Na przestrzeni wieków związek między naszym ludem a Rusią Kijowską stał się luźny, jeśli w ogóle istniał.\nJednak Rosjanie z Moskwy udowodnili, że są groźnym zagrożeniem. Naszym interesem jest zdobycie ich centrum władzy, aby chronić Szwecję przed ich wpływem. Historyczne powiązanie z miastem to tylko miły bonus."
 swe_high_income_title: "Zwiększ nasz dochód"
 swe_high_income_desc: "Skandynawia nie należy do najbogatszych regionów Europy. Choć nasza produkcja żelaza, a zwłaszcza miedzi, utrzymuje nas ponad deficytem, to wciąż nie są to dochody wystarczające, by zapewnić bezpieczną przyszłość dla nasz[Root.GetGovGender_nasz] [Root.GetGovNameGen]. Powinniśmy zwiększyć nasz dochód państwowy za pomocą wszelkich niezbędnych środków."
 swe_conquer_scania_title: "Szwedzka Skåneland"
 swe_conquer_scania_desc: "Skåneland to duński przyczółek na kontynentalnej części Skandynawii. Dopóki pozostaje w ich rękach, zawsze będziemy zagrożeni od południa. Powinniśmy jak najszybciej podbić ten obszar, aby powstrzymać zagrożenie ze strony Danii."
 swe_develop_dalaskogen_title: "Stora Kopparberget"
 swe_develop_dalaskogen_desc: "Stora Kopparberget to stara kopalnia miedzi w prowincji [8.GetName], której zasoby czystej rudy miedzi zapewniają Szwecji dochody już od IX wieku. W 1347 roku, za panowania króla Magnusa IV, przedsiębiorstwo odpowiedzialne za wydobycie otrzymało dodatkowe przywileje, co jeszcze bardziej zwiększyło produkcję miedzi.\nChoć Stora Kopparberget już teraz odpowiada za znaczną część naszych dochodów, nie wykorzystano jeszcze w pełni jego potencjału."
 swe_industrialize_sweden_title: "Uprzemysłowienie Szwecji"
 swe_industrialize_sweden_desc: "Svealand jest sercem naszej gospodarki. Miedź z prowincji [8.GetAdjective] pokrywa dwie trzecie europejskiego zapotrzebowania, a nasze żelazo i stal są wysoko cenione przez armie całego świata. Europejski popyt na nasze metale zdaje się jednak nie mieć końca. Powinniśmy rozbudować przemysł Svealandu, aby móc zaopatrywać rynki całej Europy.\nNasze własne wojska również z pewnością chętnie ruszą do boju, uzbrojone w szwedzką stal."
 swe_industrialize_sweden_tt: "z prowincji w regionie §YSvealand§!, w których wydobywa się §Ymiedź§! lub §Yżelazo§!."
 swe_swedish_allies_title: "Szwedzcy sojusznicy"
 swe_swedish_allies_desc: "Podczas gdy nasi ludzie pragną niepodległości, same nasze siły mogą nie wystarczyć, aby wyegzekwować naszą wolność od Duńczyków. Potrzebujemy znaleźć sojuszników poza Skandynawią, którzy pragną zniszczenia Unii Kalmarskiej."
 swe_swedish_allies_at: "rywale lub wrogowie §Y[DAN.GetName]§! mają co najmniej §Y100§! punktów opinii o państwie §Y[Root.GetName]§!."
 swe_swedish_allies_bt: "rywali lub wrogów naszego suwerena ma co najmniej §Y100§! punktów opinii o państwie §Y[Root.GetName]§!."
 swe_declare_independence_title: "Ogłoś niepodległość!"
 swe_declare_independence_desc: "Wreszcie nadszedł czas naszej niepodległości! Przerwijmy tę unię niekompetencji i ustanowijmy koronę godną panowania nad Szwecją!"
 swe_declare_independence_ct: "Jeśli wygramy §Ywojnę o niepodległość§!, otrzymamy wydarzenie przyznające stałe roszczenia do wszystkich prowincji wymaganych do ukończenia misji „§YWybrzeże Niemiec§!”, „§YWrota na Wschód§!” i „§YDziedzictwo Waregów§!”."
 swe_claim_norwegian_crown_title: "Korona Norwegii"
 swe_claim_norwegian_crown_desc: "Unia kalmarska została osłabiona przez naszą niepodległość, lecz nadal istnieje dzięki bliskim więzom łączącym Danię i Norwegię. Duński król może temu zaprzeczać, ale w oczach duńskiej administracji Norwegia jest raczej prowincją niż prawdziwym królestwem. Naszym obowiązkiem, jako dobrego sąsiada, jest uwolnienie Norwegów spod duńskiego ucisku i zapewnienie im wreszcie rządów troskliwego monarchy."
 swe_fall_of_denmark_title: "Upadek Danii"
 swe_fall_of_denmark_desc: "Z Norwegią pod naszą opieką, Dania jest wszystkim, co pozostało z niegdyś potężnej 'Unii' Kalmarskiej. Jednak nasza niezależność będzie zawsze zagrożona, dopóki istnieje duński król. Nadszedł czas, aby przejąć Danię dla siebie i zrobić to, czego Unia Kalmarska nigdy nie zrobiła: zjednoczyć całą Skandynawię pod jednym właściwym królem."
 swe_colonial_ambitions_title: "Ambicje kolonialne"
 swe_colonial_ambitions_desc: "Świat stoi u progu nowej epoki. Nasi sąsiedzi odkrywają lądy za Atlantykiem lub odnajdują szlaki handlowe do Indii wokół Afryki. Gromadzą bogactwa i potęgę, podczas gdy my pozostajemy na dalekiej północy. Nie możemy pozwolić sobie na pozostanie w tyle za innymi wielkimi mocarstwami. Nadszedł czas, byśmy również podjęli ambicje kolonialne!"
 swe_colonial_ambitions_tt: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do każdego §Ycentrum handlu§! lub prowincji z §Yestuarium§! w regionach kolonialnych §YWschodnia Ameryka§! i §YKanada§!."
 swe_colonize_delaware_title: "Nowa Szwecja"
 swe_colonize_delaware_desc: "Nowy Świat jest pełen możliwości i bogactw, które z pewnością przydadzą się naszemu państwu [Root.GovernmentName]. Ustanowienie osad w Nowym Świecie powinno być dla nas priorytetem."
 swe_colonize_delaware_tt: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do każdego §Ycentrum handlu§! lub prowincji z §Yestuarium§! w regionie kolonialnym §YKaraiby§!."
 swe_colonize_caribbeans_title: "Skolonizuj Karaiby"
 swe_colonize_caribbeans_desc: "Karaiby są faktycznym centrum handlu Nowego Świata. Wszystkie szlaki prędzej czy później prowadzą na Karaiby, skąd towary trafiają do Europy. Kto kontroluje Karaiby, ten kontroluje przepływ handlowy dwóch całych kontynentów. Oczywiście musimy zadbać o to, by to nasze państwo kierowało handlem Nowego Świata, zakładając własne kolonie na tych wyspach."
 swe_colonialism_trade_desc: "Kontrola handlu na Karaibach"
 swe_colonize_random_new_world_title: "Skolonizuj Nowy Świat"
 swe_colonize_random_new_world_desc: "Nowy Świat jest pełen możliwości i bogactw, które z pewnością przydadzą się naszemu państwu [Root.GovernmentName]. Ustanowienie osad w Nowym Świecie powinno być dla nas priorytetem."
 swe_the_swedish_trade_fleet_title: "Utworzenie floty handlowej"
 swe_the_swedish_trade_fleet_desc: "Norwegowie i Duńczycy są znawcami morza, podczas gdy my jesteśmy zahartowanym w bojach ludem lądowym. Nie ulega jednak wątpliwości, że flota handlowa jest niezbędna, jeśli chcemy zapewnić naszemu państwu [Root.GovernmentName] bogactwo i stabilność gospodarczą."
 swe_create_baltic_trde_posts_title: "Budowa faktorii handlowych"
 swe_create_baltic_trde_posts_desc: "Flota może pomóc w ochronie naszego handlu, lecz potrzebujemy również miejsc, w których można go prowadzić. Powinniśmy wznieść targowiska w najważniejszych miastach Skandynawii, aby przechwycić część pieniędzy płynących przez Bałtyk."
 swe_create_baltic_trde_posts_ct: "Jest §Ycentrum handlu§! lub prowincją z §Yestuarium§! i znajduje się w regionie §YSkandynawii§!, w węźle handlowym §YLubeka§! albo §YMorza Bałtyckiego§!, lub jest prowincją §Y[33.GetName]§!."
 swe_monopolize_the_baltic_sea_title: "Zmonopolizuj Bałtyk"
 swe_monopolize_the_baltic_sea_desc: "Teraz, kiedy ustanowiliśmy dominację handlową na Bałtyku, nadszedł czas, aby rozszerzyć naszą potęgę i zmonopolizować Morze Bałtyckie, a także Morze Północne i Lubekę. Nikt poza nami nie powinien czerpać korzyści z towarów, które docierają do Bałtyku."
 swe_gain_support_from_estates_title: "Wsparcie ze strony klas"
 swe_gain_support_from_estates_desc: "Podczas gdy nasi chłopi i niższa klasa marzą o przyszłości bez duńskich wpływów, wyższa klasa niechętnie podąża za zewem wolności. Wszak król duński nadał wiele przywilejów naszym klasom, co czyni ich dość lojalnymi wobec sprawy duńskiej. Na szczęście chciwości klas nie jest obca lojalności. Jeśli nadamy im więcej przywilejów niż duńscy królowie w przeszłości, to jest szansa, że nas poprą."
 swe_gain_support_from_estates_tt: "Uruchomiono wydarzenie „§YRzeź w [Root.Capital.GetName]§!”."
 swe_gain_support_from_estates_ct: "Posiadaj przynajmniej §Y3§! przyznane przywileje, przynajmniej dla §Y2§! stanów."
 swe_gain_support_from_estates_at: "Ofertę złożą nam wyłącznie stany posiadające §Y3§! przywileje."
 swe_a_new_dynasty_title: "Stabilizacja [Root.GovernmentName]"
 swe_a_new_dynasty_desc: "Po wyrwaniu się z unii kalmarskiej nasze państwo [Root.GovernmentName] pogrążyło się w chaosie i niestabilności. Zanim podejmiemy dalszą ekspansję, musimy ustabilizować państwo, umocnić pozycję władcy i spłacić zobowiązania wobec stanów."
 swe_a_new_dynasty_ct: "§Y[Root.GetName]§! nie ma długów wobec żadnego ze stanów."
 swe_the_polish_throne_title: "Królestwo Polskie"
 swe_the_polish_throne_desc: "Królestwo Polskie na naszym południu jest celem dążeń wielu królestw: Krzyżacy próbują rozszerzyć swoją władzę na terytorium Polski, Moskale są bardziej zainteresowani aneksją zachodnich Słowian, a Osmanowie na południu stanowią poważne zagrożenie dla wszystkich w tym regionie.\nAby osiągnąć prawdziwą hegemonię na północy musimy znaleźć politykę jak postępować z Polską. Z jednej strony może warto spróbować wprowadzić naszą dynastię na ich tron, a z drugiej strony Królestwo Polskie może stać się strategicznym i niezawodnym sojusznikiem przeciwko Rosjanom i Świętemu Cesarstwu Rzymskiemu.\nAlternatywnie, moglibyśmy podbić je w starym stylu i być jednym z wielu, którzy domagają się cennych polskich ziem dla siebie."
 swe_the_polish_throne_tt: "Wymagania tej misji zależą od naszego wyboru podczas wydarzenia „§YKorona Polski§!”."
 swe_the_polish_throne_ct: "Nagrody za tę misję zależą od naszego wyboru podczas wydarzenia „§YKorona Polski§!”."
 swe_the_scandinavian_empire_title: "Era szwedzkiej potęgi"
 swe_the_scandinavian_empire_desc: "Wielokrotnie próbowano utworzyć prawdziwe imperium skandynawskie, lecz żadna z tych prób nie zbliżyła się nawet do zjednoczenia trzech królestw Północy. Ostatnia z nich, unia kalmarska, była najbardziej żałosną porażką.\nTo na nas spoczywa zadanie zjednoczenia Skandynawii w jeden organizm państwowy i utworzenia prawdziwego imperium, które będzie mogło dorównać Świętemu Cesarstwu Rzymskiemu czy carstwu rosyjskiemu."
 swe_colonize_west_african_coast_title: "Kolonizacja Wybrzeża Kości Słoniowej"
 swe_colonize_west_african_coast_desc: "Wybrzeże Kości Słoniowej jest ważnym ośrodkiem handlu towarami z całej Afryki. Musimy zdobyć tam przyczółek, aby nasi europejscy rywale nie mogli korzystać z tamtejszych dóbr."
 swe_beyond_africa_title: "Poza Afryką"
 swe_beyond_africa_desc: "Nasi kupcy podążają za strumieniem pieniędzy. Po założeniu kolonii w Afryce Zachodniej ruszyli dalej wzdłuż szlaków handlowych i teraz domagają się kolonizacji ziem położonych za Afryką."
 swe_swedish_universities_title: "Uniwersytety Szwecji"
 swe_swedish_universities_desc: "W prowincji [1.GetName] znajduje się Uppsala, miasto o wielkim znaczeniu historycznym i religijnym. Po chrystianizacji naszego państwa [Root.GovernmentName] Uppsala stała się siedzibą arcybiskupstwa. Jako ważny ośrodek duchowieństwa potrzebuje odpowiedniego uniwersytetu, który zapewni wykształcenie naszym poddanym.\nZ kolei miasto [6.Capital.GetName] może nie należało do Szwecji od dawna, lecz również ma długą tradycję jako ośrodek nauki. Znajduje się tam szkoła katedralna — Katedralskolan w [6.Capital.GetName] — która wykształciła wielu członków duńskiego duchowieństwa.\nPowinniśmy rozwijać oba miasta i tworzyć instytucje naukowe."
 swe_handle_the_sami_title: "Integracja Lapończyków"
 swe_handle_the_sami_desc: "Lapończycy zamieszkują gęste lasy północy, gdzie nie osiedlił się żaden inny Skandynaw — ani Szwed, ani Norweg, ani Duńczyk. Nie prowadzą handlu ze światem zewnętrznym i pozostają całkowicie odizolowani. Żyją jednak na terytorium, które formalnie należy do nas. Powinniśmy włączyć ich do naszego społeczeństwa, aby móc czerpać korzyści z tych lasów."
 swe_handle_the_sami_tt: "Należy do państwa §Y[Root.GetName]§! lub jego poddanego, wyznaje religię §Y[Root.Religion.GetName]§! i ma kulturę akceptowaną przez właściciela prowincji."
 swe_forest_expansion_title: "Ekspansja leśna"
 swe_forest_expansion_desc: "Lasy Skandynawii pozostają w większości niezbadanym obszarem. Poza zamieszkującymi je zaradnymi Lapończykami są niemal bezludne z powodu surowych zim i niedostatku zasobów.\nLasy stanowią jednak doskonałe tereny łowieckie, obfitujące w futra, a w ziemi niektórych z nich kryją się złoża takich surowców jak żelazo. Warto zatem rozszerzyć nasze władztwo na te obszary i zasiedlić nawet najbardziej niegościnne zakątki Skandynawii."
 swe_forest_expansion_tt: "Każda prowincja typu §YLas§! lub §YZagajnik§! w regionie §YSkandynawii§! należy do państwa §Y[Root.GetName]§! i ma co najmniej §Y6§! rozwoju."
 swe_forest_expansion_ct: "Każda posiadana prowincja w regionie §YSkandynawii§! otrzymuje §G+10,00%§! postępu dobrobytu.\nKażda posiadana prowincja w regionie §YSkandynawii§! o klimacie §Yarktycznym§! otrzymuje do końca gry modyfikator „§YEkspansja arktyczna§!”, zapewniający następujące efekty:\nLokalny koszt rozwoju: §G-40,0%§!\nLiczba możliwych budynków: §G+1§!"
 swe_the_livonian_order_title: "Okno na wschód"
 swe_the_livonian_order_desc: "Ziemie Estonii, Liwonii i Kuronii są istotną częścią Bałtyku, ale są też swoistym oknem na wschód, gdyż przez nie przepływa handel ze wschodu.\nEstończycy i Łotysze mogą nie chcieć tego przyznać, ale są całkowicie bezradni wobec Rosjan na ich wschodzie. Powinniśmy włączyć ich do naszego królestwa, abyśmy mogli ich chronić."
 swe_the_livonian_order_at: "Posiadamy prowincję §Y[38.GetName]§! lub należy ona do naszego poddanego, a ponadto posiadamy co najmniej §Y6§! prowincji w §YInflantach§!, §YEstonii§! i §YKurlandii§!."
 swe_the_livonian_order_bt: "§Y[GetPolandPLC]§! jest sojusznikiem państwa §Y[Root.GetName]§!, ma co najmniej §Y100§! punktów opinii o [Root.GetName] i posiada co najmniej §Y6§! prowincji w §YInflantach§!, §YEstonii§! i §YKurlandii§!.\nProwincja §Y[38.GetName]§! należy do państwa [Root.GetName] lub jego poddanego ALBO należy do §Y[GetPolandPLC]§!, a państwo [Root.GetName] ma co najmniej §Y1000,0§!¤."
 swe_the_teutonic_order_title: "Ziemie Prusów"
 swe_the_teutonic_order_desc: "Prusy były niegdyś zamieszkane przez Prusów, lud bałtycki, który miał nieszczęście stać się celem najazdów zakonu krzyżackiego. Choć Prusowie odeszli już do historii, „nowi” Prusacy wznieśli na tych ziemiach bogate miasta handlowe i wspaniałe fortyfikacje. Korzystne byłoby przejęcie Prus i przyłączenie ich do naszego państwa [Root.GovernmentName] dla jego chwały."
 swe_dominium_maris_baltici_title: "Dominium Maris Baltici"
 swe_dominium_maris_baltici_desc: "Panowanie nad Morzem Bałtyckim jest przedmiotem sporów od czasu powstania królestw skandynawskich. Również państwa spoza Północy próbowały podporządkować sobie Bałtyk.\nOczywiście są to same głupstwa — tylko nasze państwo [Root.GovernmentName] i nasi najwierniejsi sojusznicy powinni mieć prawo do roszczeń wobec bałtyckiego wybrzeża!"
 swe_dominium_maris_baltici_tt: "Cała linia brzegowa §YBałtyku§! jest albo własnością §Y[Root.GetName]§!, jego poddanych lub jego sojuszników."
 swe_dominium_maris_baltici_ct: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy ją, posiadając całe wybrzeże lub zapewniając jego posiadanie naszemu poddanemu, otrzymamy do końca gry modyfikator „§YDominium Maris Baltici§!”, zapewniający następujące efekty:\nLata separatyzmu: §G-5§!\nMiesięczny splendor: §G+2,00§!\n\nW przeciwnym razie otrzymamy na §Y25 lat§! modyfikator „§YDyplomacja bałtycka§!”, zapewniający następujące efekty:\nReputacja dyplomatyczna: §G+1,00§!\nStosunki dyplomatyczne: §G+1§!"
 swe_the_teutonic_order_at: "Posiadamy prowincję §Y[40.GetName]§! lub należy ona do naszego poddanego, a ponadto posiadamy co najmniej §Y5§! prowincji w §YPrusach Wschodnich§! i §YPrusach Zachodnich§!."
 swe_the_teutonic_order_bt: "§Y[GetPolandPLC]§! jest sojusznikiem państwa §Y[Root.GetName]§!, ma co najmniej §Y100§! punktów opinii o [Root.GetName] i posiada co najmniej §Y5§! prowincji w §YPrusach Wschodnich§! i §YPrusach Zachodnich§!.\nProwincja §Y[40.GetName]§! należy do państwa [Root.GetName] lub jego poddanego ALBO należy do §Y[GetPolandPLC]§!, a państwo [Root.GetName] ma co najmniej §Y500,0§!¤."
 swe_swedish_pommerania_title: "Niemieckie wybrzeże"
 swe_swedish_pommerania_desc: "Aby osiągnąć prawdziwą hegemonię na Bałtyku, musimy zadbać o to, by żadne wybrzeże nie zagrażało naszemu handlowi ani bezpieczeństwu państwa. Obecnie jednak obszary Pomorza i Meklemburgii znajdują się w obcych rękach, co może być sprzeczne z naszym interesem. Powinniśmy znaleźć godnego zaufania sojusznika w północnych Niemczech, który kontroluje te wybrzeża, albo podbić je samodzielnie."
 swe_swedish_pommerania_at: "Dowolny sojusznik posiada co najmniej §Y7§! prowincji na §YPomorzu Tylnym§!, §YPomorzu Przednim§! i w §YMeklemburgii§! oraz ma co najmniej §Y100§! punktów opinii i §Y70§! zaufania do państwa §Y[Root.GetName]§!.\nWszystkie 7 prowincji musi należeć do tego samego sojusznika."
 swe_swedish_pommerania_ct: "Jeśli ukończymy tę misję poprzez §Ypodbój§!, państwo §Y[Root.GetName]§! otrzyma roszczenia do obszarów §YDolnej Saksonii§! i §YWezery§! oraz modyfikator „§YPodbój Pomorza§!” na §Y25 lat§!, zapewniający następujące efekty:\nKoszt tworzenia rdzenia: §G-10,0%§!\n\nJeśli ukończymy tę misję poprzez §Ydyplomację§!, państwo §Y[Root.GetName]§! §Rutaci§! stałe roszczenia do obszarów §YMeklemburgii§!, §YPomorza Przedniego§! i §YPomorza Tylnego§! (z wyjątkiem prowincji §Y[45.GetName]§!), ale otrzyma §G100§! punktów dyplomatycznych, §G50§! przysług od sojusznika, który umożliwi ukończenie misji, oraz modyfikator „§YSojusz germański§!” na §Y25 lat§!, zapewniający następujące efekty:\nMiesięczny modyfikator przysług: §G+25,0%§!\nReputacja dyplomatyczna: §G+1,00§!"
 swe_bane_of_the_hansa_title: "Zmora Hanzy"
 swe_bane_of_the_hansa_desc: "Hanza jest jednym z głównych graczy na Bałtyku. Kontroluje przepływ handlu z północnych Niemiec i mocno trzyma w garści handel na całym Morzu Bałtyckim. Ponadto była przyczyną wielu wojen między Danią a Świętym Cesarstwem Rzymskim i pośrednio szkodziła naszemu państwu. Nadszedł czas, by przypomnieć tym kupcom, jakie jest ich prawdziwe miejsce na Bałtyku."
 swe_bane_of_the_hansa_trade_tt: "Szwedzka dominacja handlowa"
 swe_bane_of_the_hansa_ct: "Jeśli ukończymy tę misję, posiadając prowincję §Y[45.GetName]§! lub zapewniając jej posiadanie naszemu poddanemu, prowincja [45.GetName] otrzyma §G4§! bazowej produkcji oraz §G+100,00§! postępu dobrobytu, jeśli znajduje się w stanie.\n\nJeśli ukończymy tę misję, kontrolując (lecz nie posiadając) prowincję §Y[45.GetName]§!, prowincja [45.GetName] otrzyma §R100§! spustoszenia i zostanie całkowicie złupiona przez państwo §Y[Root.GetName]§!."
 swe_reforms_of_vasa_title: "Reformy Wazów"
 swe_reforms_of_vasa_desc: "Tradycyjnie nasze państwo jest monarchią elekcyjną, w której szlachta wybiera monarchę rządzącego Szwecją. Ten sposób wyłaniania króla okazał się jednak wadliwy, gdy w 1397 roku szwedzcy możnowładcy przystali na propozycję królowej Małgorzaty i zawarli unię kalmarską. Nadszedł czas, by przekształcić nasz ustrój w scentralizowaną monarchię, niezależną od kaprysów szlachty."
 swe_lord_of_eastern_europe_title: "Władca Europy Wschodniej"
 swe_lord_of_eastern_europe_desc: "Waregowie, nasi przodkowie, byli niegdyś władcami Europy Wschodniej. W X wieku ustanowili szlak handlowy łączący Szwecję z Konstantynopolem, stolicą Cesarstwa Wschodniorzymskiego. Z czasem Waregowie przekształcili się w Ruś Kijowską, a więzi między Szwecją i Grecją osłabły, gdy w Europie Wschodniej pojawiały się coraz liczniejsze i potężniejsze grupy interesów.\nChoć nie mamy już historycznych roszczeń do Europy Wschodniej, dawne szlaki handlowe wciąż istnieją. Stanowią nasze dziedzictwo i naszym obowiązkiem jest odzyskać nad nimi kontrolę — drogą dyplomacji lub podboju."
 swe_the_theologian_discussions_title: "Debaty teologiczne"
 swe_the_theologian_discussions_desc: "Reformacja ogarnęła Europę, a kwestie religijne nabierają coraz większego znaczenia dla państwa. Musimy opowiedzieć się po jednej ze stron w świecie podzielonym przez rozłam religijny."
 swe_first_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 swe_first_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 swe_second_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 swe_second_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 swe_third_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 swe_third_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 swe_fourth_religion_mission_title: "[Root.GetSelectableMissionTitle]"
 swe_fourth_religion_mission_desc: "[Root.GetSelectableMissionDescription]"
 swe_envies_of_the_pope_title: "[Root.GetPreviewColorSWE]Wysłannicy papieża[Root.GetPreviewColorSWE_end]"
 swe_envies_of_the_pope_desc: "Nasza decyzja o pozostaniu wiernymi jedynej prawdziwej wierze ucieszyła papieża. Jednak wskutek reformacji Państwo Kościelne ma niewielu sojuszników. Powinniśmy zawrzeć sojusz ze Stolicą Apostolską i zapewnić naszym wiernym wpływy w kurii."
 swe_envies_of_the_pope_tt: "Jeśli jesteśmy sprzymierzeni z państwem §Y[PAP.GetName]§!, państwo [PAP.GetName] otrzymuje modyfikator „§YWsparcie Północy§!” na §Y50 lat§!, zapewniający następujący efekt:\nSkuteczność bojowa piechoty: §G+10,0%§!"
 swe_catholic_bulwark_title: "[Root.GetPreviewColorSWE]Katolicki bastion[Root.GetPreviewColorSWE_end]"
 swe_catholic_bulwark_desc: "Jako jeden z nielicznych obrońców papieża mamy obowiązek stać się katolickim bastionem na północy i zwalczać herezję."
 swe_catholic_bulwark_ct: "Jeśli podczas §Ywojny lig§! staniemy po stronie §Ykatolickiej§!, otrzymamy modyfikator „§YWalka w obronie Ligi Katolickiej§!”, zapewniający następujące efekty:\nRoczny wpływ papieski: §G+1,00§!\nDyscyplina: §G+5,0%§!\nTradycja armii z bitew: §G+100,0%§!\n\n§YModyfikator wygaśnie, gdy tylko przestaniemy uczestniczyć w wojnie lig.§!"
 swe_catholic_30_years_war_title: "[Root.GetPreviewColorSWE]Liga religijna[Root.GetPreviewColorSWE_end]"
 swe_catholic_30_years_war_desc: "Sytuacja religijna w Świętym Cesarstwie Rzymskim staje się coraz bardziej napięta. Protestanccy elektorzy domagają się wolności wyznania, podczas gdy cesarz próbuje narzucić jedność religijną w Niemczech. Eskalacja konfliktu do pełnoskalowej wojny jest tylko kwestią czasu.\nPowinniśmy zaangażować się w ten konflikt religijny, aby chronić interesy Stolicy Apostolskiej, a być może również rozszerzyć własne wpływy w północnych Niemczech."
 swe_catholic_30_years_war_ct: "§YLiga protestancka§! nie powstała, a nadszedł rok §Y1625§!, LUB liga istniała przez §Y30§! lat, lecz nie wypowiedziała wojny."
 swe_catholic_30_years_war_at: "Jeśli zwyciężymy w §Ywojnie lig religijnych§! po stronie §Ykatolickiej§!, wszystkie §Ykatolickie§! państwa w §YŚwiętym Cesarstwie Rzymskim§! poprawią swoją opinię o nas o §G+150§!."
 swe_catholic_30_years_war_tt: "Wszystkie §Ykatolickie§! państwa w §YŚwiętym Cesarstwie Rzymskim§! poprawiają swoją opinię o nas o §G+150§!."
 swe_defenders_of_the_reformers_title: "[Root.GetPreviewColorSWE]Przystąp do reformacji[Root.GetPreviewColorSWE_end]"
 swe_defenders_of_the_reformers_desc: "Ponieważ jesteśmy teraz częścią reformacji, ważne jest, żeby znaleźć sojuszników w tym świecie heretyków. Wrogowie reformacji są przecież bardzo liczni."
 swe_defenders_of_the_reformers_ct: "Jest §Ychrześcijaninem§!, ale nie jest §Yprawosławnym§! ani §Ykatolikiem§!."
 swe_protestant_sword_title: "[Root.GetPreviewColorSWE]Miecz protestantyzmu[Root.GetPreviewColorSWE_end]"
 swe_protestant_sword_desc: "Reformacja rozprzestrzenia się niczym pożar, a katolicy próbują stłumić ruch reformacyjny i wypędzić jego zwolenników ze swoich ziem. Wrogość katolików jest oczywista i tylko kwestią czasu jest, kiedy rozpoczną wojny napastnicze, by „wyplenić herezję”. Powinniśmy stać się mieczem reformacji i nie dopuścić, by katoliccy fanatycy ją powstrzymali!"
 swe_protestant_sword_at: "Dowolne państwo należące do §YŚwiętego Cesarstwa Rzymskiego§! zostało siłą nawrócone przez §Y[Root.GetName]§! i wyznaje religię §Y[Root.Religion.GetName]§!.\n§YUtworzenie państwa z innym tagiem unieważni ostatnie przymusowe nawrócenie.§!"
 swe_protestant_sword_bt: "Dowolny z naszych sojuszników jest §Yprotestancki§!, należy do §YŚwiętego Cesarstwa Rzymskiego§! i jest §Yelektorem§! lub ma co najmniej §Y100§! rozwoju (wliczając jego własnych poddanych)."
 swe_protestant_sword_ct: "Jeśli podczas §Ywojny lig§! staniemy po stronie §Yprotestanckiej§!, otrzymamy modyfikator „§YWalka w obronie Ligi Protestanckiej§!”, zapewniający następujące efekty:\nModyfikator siły Kościoła: §G+25,0%§!\nMiesięczny zapał: §G+1,00§!\nDyscyplina: §G+5,0%§!\nTradycja armii z bitew: §G+100,0%§!\n\n§YModyfikator wygaśnie, gdy tylko przestaniemy uczestniczyć w wojnie lig.§!"
 swe_protestant_sword_dt: "Odblokowuje decyzję, która może doprowadzić do powstania §YLigi protestanckiej§!."
 swe_protestant_30_years_war_title: "[Root.GetPreviewColorSWE]Liga religijna[Root.GetPreviewColorSWE_end]"
 swe_protestant_30_years_war_desc: "Sytuacja religijna w Świętym Cesarstwie Rzymskim staje się coraz bardziej napięta. Protestanccy elektorzy domagają się wolności wyznania, podczas gdy cesarz próbuje narzucić jedność religijną w Niemczech. Eskalacja konfliktu do pełnoskalowej wojny jest tylko kwestią czasu.\nPowinniśmy zaangażować się w ten konflikt religijny, aby chronić Ligę Protestancką, a być może również rozszerzyć własne wpływy w północnych Niemczech."
 swe_protestant_30_years_war_tt: "Wszystkie §Yprotestanckie§! i §Yreformowane§! państwa w §YŚwiętym Cesarstwie Rzymskim§! poprawiają swoją opinię o nas o §G+150§!."
 swe_worship_the_gods_title: "[Root.GetPreviewColorSWE]Kult bogów[Root.GetPreviewColorSWE_end]"
 swe_worship_the_gods_desc: "Pierwsze próby szerzenia chrześcijaństwa w Szwecji rozpoczęły się w IX wieku. Dwukrotnie niepozorni misjonarze nie zdołali odwieść nas od chwały Odyna.\nW końcu jednak znaleźli króla, który w pogoni za władzą był gotów sprzedać swoje miejsce w Walhalli. Król Olof Skötkonung przyjął chrzest w Husaby. Próbował zniszczyć świątynię w Uppsali, lecz sprzeciwili mu się jego własni poddani, którzy pozostali wierni wierze nordyckiej.\nStulecie później królowi Inge Starszemu udało się zburzyć świątynię, pozostawiając po niej jedynie gruzy. Od tego momentu pełna chrystianizacja Szwecji była już tylko kwestią czasu.\nSkoro wreszcie powróciliśmy do naszego nordyckiego dziedzictwa, nadszedł czas, by odbudować świątynie i miejsca kultu ku chwale naszych bogów."
 swe_spread_the_norse_faith_title: "[Root.GetPreviewColorSWE]Szerzenie wiary nordyckiej[Root.GetPreviewColorSWE_end]"
 swe_spread_the_norse_faith_desc: "Szwecja nie była jedynym królestwem, które padło ofiarą chrystianizacji Skandynawii. Nasi sąsiedzi, Duńczycy i Norwegowie, również doświadczyli dążeń Kościoła do szerzenia jego nikczemnej religii i ulegli obietnicom potęgi, przyjmując chrześcijaństwo. Jako wierni wyznawcy wiary nordyckiej mamy obowiązek przywrócić w Skandynawii prawowitą religię."
 unlock_norse_free_deity_decision_tt: "Odblokowuje decyzję pozwalającą zmienić §Ybóstwo§! za życia władcy w zamian za §Ylegitymizację§!."
 swe_devastate_the_christians_title: "[Root.GetPreviewColorSWE]Zniszcz chrześcijaństwo[Root.GetPreviewColorSWE_end]"
 swe_devastate_the_christians_desc: "Chrześcijanie wymazali naszą pradawną religię i nawrócili daleką Północ. Teraz, gdy powróciliśmy do naszych korzeni, świat chrześcijański znów na nas czyha. Powinniśmy pokazać tym niewiernym, gdzie jest ich miejsce!"
 swe_devastate_the_christians_ct: "Żadne §Yeuropejskie§! państwo nie wyznaje religii §Ychrześcijańskiej§!."
 swe_devastate_the_christians_tt: "Wygraj §Y25§! wojen z państwami §Ychrześcijańskimi§!, wyznając §Ywiarę nordycką§! (§Y[Root.SwedenCountWarsWon]§!/§Y25§!)."
 swe_dabble_into_european_diplomacy_title: "Polityka europejska"
 swe_dabble_into_european_diplomacy_desc: "Obce mocarstwa od dawna próbują wpływać na losy Szwecji. Unia kalmarska jest jednym z takich przykładów, który wciąż tkwi w naszej zbiorowej pamięci.\nTeraz, gdy nie jesteśmy już niczyimi poddanymi, nadszedł nasz czas, by samemu wpływać na europejską scenę polityczną i układ sił."
 swe_dabble_into_european_diplomacy_tt: "sojusznicy, których stolice leżą w §YEuropie§!, mają co najmniej §Y75§! punktów opinii o państwie §Y[Root.GetName]§! i są albo państwem §Y[PAP.GetName]§!, albo §Ycesarzem§! ŚCR, albo mają łącznie co najmniej §Y250§! rozwoju, nie licząc poddanych trybutarnych."
 swe_a_swedish_great_power_title: "Wielkie mocarstwo Północy"
 swe_a_swedish_great_power_desc: "Unia kalmarska miała stać się wielkim europejskim mocarstwem Północy. W rzeczywistości jednak jej ambicje hamowali zuchwali i uparci duńscy królowie, którzy wykorzystywali potęgę unii do prowadzenia błahych wojen z Hanzą — tak jak za panowania Eryka Pomorskiego w 1426 roku.\nPowinniśmy osiągnąć to, czego nie zdołała unia kalmarska, i stać się północnym mocarstwem, które w istotny sposób wpływa na losy Europy!"
 swe_finnish_swedish_relations_title: "Stosunki fińsko-szwedzkie"
 swe_finnish_swedish_relations_desc: "Finlandia należy do naszego państwa [Root.GovernmentName] od XIII wieku. Została włączona do naszego władztwa, a Finowie uzyskali prawo głosu przy wyborze króla Szwecji — tak jak podczas elekcji Małgorzaty I w 1388 roku. Stosunki między naszymi narodami można jednak jeszcze bardziej zacieśnić, ponieważ Finowie są cennym sojusznikiem naszych interesów. Powinniśmy rozwijać ziemie fińskie na znak dobrej woli."
 swe_steel_for_the_hakkapeliitta_title: "Hakapelici"
 swe_steel_for_the_hakkapeliitta_desc: "Hakapelici to fińska lekka kawaleria, która doskonale sprawdza się w potyczkach, rajdach i zwiadach. Ich szybkość pozwala im na manewrowanie ogniem wroga i szarżę przez jego linie. Jednak ich liczebność jest niewielka, a Finowie nie mają infrastruktury, która pozwoliłaby na wyszkolenie większej ilości dla Szweckiej [Root.GovernmentName].\nPowinniśmy zbudować koszary w Finlandii i dostosować naszą taktykę tak, abyśmy mogli wykorzystać więcej Hakapeltów w walce."
 swe_the_carolean_units_title: "Reforma armii"
 swe_the_carolean_units_desc: "Nasza armia słynie z pionierskich rozwiązań wojskowych i budzi postrach jakością bojową. Nasz system wojskowy nieustannie pozostaje jednak zagrożony przez skorumpowanych doradców i generałów, którym bardziej zależy na nabijaniu własnych kies niż na rozbudowie naszych sił. Gdyby do tego doszło, zagrożeniem dla państwa [Root.GetName] mogłyby stać się nawet niewielkie królestwa, takie jak Dania.\nMusimy zapewnić sobie władzę absolutną, aby zneutralizować zagrożenia wewnętrzne, a następnie zreformować zarówno ustrój państwa, jak i naszą armię."
 swe_the_carolean_units_at: "Nie musimy wydawać §Ypunktów militarnych§!, jeśli posiadamy co najmniej §Y75§! absolutyzmu lub technologię militarną na poziomie §Y19§!."
 swe_the_carolean_units_bt: "Jeśli ukończymy tę misję, mając §Y75§! absolutyzmu lub technologię militarną na poziomie §Y19§!, NIE wydamy na nią §Ypunktów militarnych§!."
 swe_drill_the_carolean_title: "Szkolenie Karolinów"
 swe_drill_the_carolean_desc: "Karolinowie są owocem naszych szeroko zakrojonych reform wojskowych. Ci zahartowani w boju żołnierze podchodzą jak najbliżej nieprzyjaciela, by zasypać go gradem ołowiu. Następnie ruszają do szarży na szeregi wroga, siejąc przerażenie i panikę na pierwszej linii.\nChoć ich taktyka okazała się skuteczna, wymaga jeszcze dopracowania, ponieważ straty ponoszone podczas pierwszej salwy są nadal nieakceptowalne. Powinniśmy przeprowadzić ćwiczenia naszych jednostek specjalnych i doskonalić ich celność."
 swe_protestant_defender_of_faith_title: "[Root.GetPreviewColorSWE]Obrońca prawdziwej wiary[Root.GetPreviewColorSWE_end]"
 swe_protestant_defender_of_faith_desc: "Wygraliśmy wojnę religijną w Niemczech! Jednak zagrożenie ze strony heretyków wciąż się utrzymuje. Powinniśmy przyjąć tytuł Obrońcy Wiary, aby nasi bracia i siostry [Root.Religion.GetName] mogli praktykować swoją wiarę bez zagrożenia ze strony Reformacji."
 swe_catholic_defender_of_faith_title: "[Root.GetPreviewColorSWE]Obrońca prawdziwej wiary[Root.GetPreviewColorSWE_end]"
 swe_catholic_defender_of_faith_desc: "Wygraliśmy wojnę religijną w Niemczech! Jednak zagrożenie ze strony heretyków wciąż się utrzymuje. Powinniśmy przyjąć tytuł Obrońcy Wiary, aby nasi bracia i siostry [Root.Religion.GetName] mogli praktykować swoją wiarę bez zagrożenia ze strony Katolików."
 swe_catholic_defender_of_faith_ct: "§Y[Root.GetName]§! siłą nawróciło inne państwo na wiarę §Y[Root.Religion.GetName]§!."
 swe_catholic_defender_of_faith_tt: "Nawróć §Y30§! prowincji (§Y[Root.GetNumConvertedProvinces]§!/§Y30§!)."
 swe_won_wars_variable: "[Root.swe_won_wars_against_christians.GetValue]"
 swe_a_viking_empire_title: "[Root.GetPreviewColorSWE]Nowe imperium nordyckie[Root.GetPreviewColorSWE_end]"
 swe_a_viking_empire_desc: "Wikingowie dawnych czasów stworzyli imperium, któremu nie dorównywało żadne inne — choćby legendarne Imperium Morza Północnego. Ostatecznie jednak ich państwa nie były trwałe, a plugawy odór chrześcijaństwa doprowadził do ich nieuchronnego upadku.\nStwórzmy imperium nordyckie, które przetrwa wszelkie przeciwności i przyniesie chwałę bogom!"
 swe_commune_between_the_religions_title: "[Root.GetPreviewColorSWE]Pomiędzy wyznaniami[Root.GetPreviewColorSWE_end]"
 swe_commune_between_the_religions_desc: "Reformacja rozdziera wiarę katolicką. Bracia chwytają za miecze przeciwko sobie nawzajem, całe królestwa pogrążają się w chaosie, a ich mieszkańcy mordują się w imię tego samego Boga.\nPowinniśmy pokazać tym szaleńcom, że pokojowe współistnienie wyznawców różnych religii jest możliwe."
 swe_revoke_clergy_power_title: "[Root.GetPreviewColorSWE]Ograniczenie władzy duchowieństwa[Root.GetPreviewColorSWE_end]"
 swe_revoke_clergy_power_desc: "Duchowieństwo jest plagą naszego państwa, gdyż uosabia właśnie ten religijny fanatyzm, który chcemy wykorzenić. Powinniśmy odebrać mu przywileje i pozbawić je wszelkiej władzy."
 swe_multi_cultural_kingdom_title: "[Root.GetPreviewColorSWE]Wielokulturowe [Root.GovernmentName][Root.GetPreviewColorSWE_end]"
 swe_multi_cultural_kingdom_desc: "Tolerancja religijna to tylko jeden z aspektów. Powinniśmy również zadbać o tolerancję między kulturami. Jeśli chcemy być latarnią oświecenia w tym mrocznym świecie, musimy pokazać, że w państwie [Root.GetName] każdy jest mile widziany — bez względu na wyznanie czy kulturę."
 swe_establish_peace_of_westphalia_title: "[Root.GetPreviewColorSWE]Pokój religijny[Root.GetPreviewColorSWE_end]"
 swe_establish_peace_of_westphalia_desc: "Świętemu Cesarstwu Rzymskiemu grozi rozpad z powodu reformacji. Powinniśmy ingerować w jego sprawy wewnętrzne i pokazać, że pokój religijny oraz współistnienie różnych wyznań również mogą być rozwiązaniem!"
 swe_catholic_triggers_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ykatolicką§!, do ukończenia tej misji będą wymagane następujące warunki:"
 swe_reformation_triggers_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yreformacyjną§!, do ukończenia tej misji będą wymagane następujące warunki:"
 swe_humanist_triggers_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yhumanistyczną§!, do ukończenia tej misji będą wymagane następujące warunki:"
 swe_catholic_effects_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ykatolicką§!, wystąpią następujące efekty:"
 swe_reformation_effects_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yreformacyjną§!, wystąpią następujące efekty:"
 swe_humanist_effects_tt: "\nJeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Yhumanistyczną§!, wystąpią następujące efekty:"
 swe_swedish_peasantry_title: "Postulaty chłopstwa"
 swe_swedish_peasantry_desc: "Chłopstwo odgrywa w naszym państwie znaczącą rolę. Stanowi podstawę naszej gospodarki i zapewnia wyżywienie ludności. Oczywiście powinniśmy zadbać o to, by chłopi pozostali wierni swojej ojczyźnie. Budowa manufaktur w ich interesie może pokazać im nasze dobre intencje."
 swe_swedish_peasantry_ct: "Doszło do katastrofy „§YWojna Dackego§!”."
 swe_swedish_peasantry_tt: "Katastrofa „§YWojna Dackego§!” nie może wybuchnąć, dopóki ten modyfikator pozostaje aktywny.\nKażda posiadana prowincja produkująca §Yzboże§!, §Yryby§! lub §Yzwierzęta hodowlane§! otrzymuje §G+33,0%§! lokalnego modyfikatora produkcji dóbr, dopóki ten modyfikator pozostaje aktywny."
 flavor_swe.1628.a.tt: "Zatonął §Yciężki okręt§! państwa §Y[Root.GetName]§!."
 sca_unlock_humanist_missions_tt: "Odblokowuje misje §Yhumanistyczne§!."
 flavor_swe.101.t: "Wojna religijna w Europie"
 flavor_swe.101.desc: "Napięcie pomiędzy Ligą Katolicką a Ligą Protestancką sięgnęło zenitu. Wojna między katolikami a protestantami właśnie się rozpoczęła - i państwo [Root.GetName] jest w nią w pełni zaangażowane. Nasi ludzie są jednak gotowi walczyć o to, co słuszne!"
 flavor_swe.101.a: "Ku zwycięstwu!"
 flavor_swe.1010.t: "Koniec [Root.GetAdjective] zaangażowania wojennego"
 flavor_swe.1010.desc: "Dla państwa [Root.GetName] wojna lig religijnych dobiegła końca. Nasi żołnierze wracają do rodzin, a wynajęci najemnicy liczą swoje zarobki."
 flavor_swe.1010.a: "Miejmy nadzieję, że Europa nie przejdzie w przyszłości przez jeszcze gorszą wojnę..."
 flavor_swe.102.desc: "[EngelbrektEventDescription]\n\nJednak jego duch wciąż żyje w umysłach naszego ludu. Pragnienie niepodległej Szwecji jest wśród chłopstwa ogromne, a nawet szwedzka klasa rządząca ma już dość duńskiego panowania. Uzyskamy niepodległość. Pytanie tylko, kiedy ponownie chwycimy za broń."
 flavor_swe.102.a: "Jeszcze nie nadszedł czas na kolejne powstanie."
 flavor_swe.102.b: "Czas naszej niepodległości jest już bliski!"
 flavor_swe.103.t: "System indelningsverket w państwie [Root.GetName]"
 flavor_swe.103.desc: "System indelningsverket to sposób organizacji wojska umożliwiający szybką mobilizację państwa. Co dziesiąty mężczyzna w wieku od 15 do 44 lat zostaje wcielony na stałe do piechoty narodowej, podczas gdy szlachta, zwolniona z podatków, musi zapewnić oddziały kawalerii. Dzięki temu systemowi korzystanie z najemników stało się mniej konieczne, ponieważ Szwecja dysponuje teraz stałą armią.\nZ czasem system indelningsverket poddano kolejnej reformie, wprowadzając nabór potencjalnych żołnierzy na poziomie prowincji zamiast wsi. Każda prowincja szwedzkiego imperium musi wystawić dla armii szwedzkiej regiment liczący 1200 Karolinów."
 flavor_swe.103.a: "Doskonale!"
 flavor_swe.104.t: "Nadchodzi nowy dowódca"
 flavor_swe.104.desc: "W 1397 roku rady koronne Norwegii, Szwecji i Danii zebrały się w mieście Kalmar i postanowiły zjednoczyć trzy skandynawskie narody pod berłem jednego monarchy. Ta unia kalmarska mogła być największym państwem Europy, lecz od samego początku trapiły ją luźna struktura organizacyjna i zachwiana równowaga sił, wynikająca z dominacji Danii.\nPragnienie niepodległości osiągnęło w końcu nowy poziom, gdy [DAN.Monarch.GetName] został wybrany na nowego [DAN.Monarch.GetTitle] unii kalmarskiej i zaplanował egzekucję kilku szwedzkich możnowładców w [Root.Capital.GetName].\n[Root.GetVasaDescription]"
 flavor_swe.104.desc.a: "Johan Kristiernsson Vasa, wuj Karla Knutssona z dynastii Bonde, poderwał chłopów i szlachtę do walki, przejmując po Engelbrekcie przywództwo nad nowym powstaniem."
 flavor_swe.104.desc.b: "Erik Johansson Vasa, wierny stronnik rodu Sture, poderwał chłopów do walki i przejął po Engelbrekcie przywództwo nad nowym powstaniem przeciwko duńskiej koronie."
 flavor_swe.104.desc.c: "Gustav Eriksson Vasa, stronnik stronnictwa Sture, poderwał chłopów do walki i przejął po Engelbrekcie przywództwo nad nowym powstaniem przeciwko duńskiej dominacji."
 flavor_swe.104.desc.d: "Johan Kristiernsson Vasa, wuj Karla Knutssona z dynastii Bonde, poderwał chłopów i szlachtę do walki, przejmując po Engelbrekcie przywództwo nad nowym powstaniem. Po krwawej rzezi w [Root.Capital.GetName], w której zginęła jego rodzina, Johan zyskał również poparcie szwedzkiej szlachty!"
 flavor_swe.104.desc.e: "Erik Johansson Vasa, wierny stronnik rodu Sture, poderwał chłopów do walki i przejął po Engelbrekcie przywództwo nad nowym powstaniem przeciwko duńskiej koronie. Po brutalnej rzezi w [Root.Capital.GetName], w której zamordowano jego rodzinę, Erik zdołał zdobyć ogromne poparcie rodu Sture, od dawna nastawionego antyduńsko."
 flavor_swe.104.desc.f: "Gustav Eriksson Vasa, stronnik stronnictwa Sture, poderwał chłopów do walki i przejął po Engelbrekcie przywództwo nad nowym powstaniem przeciwko duńskiej dominacji. Po krwawej łaźni w [Root.Capital.GetName], w której zamordowano jego rodzinę, Gustav zdołał zdobyć pełne poparcie szwedzkiej szlachty dla swojej sprawy."
 flavor_swe.104.a: "Wolność!"
 swe_vasa_leads_the_rebellion_tt: "Gustav Vasa zostanie królem §Y[Root.GetName]§!, jeśli wygramy wojnę o niepodległość przed wygaśnięciem modyfikatora „§YVasa przewodzi powstaniu§!”."
 swe_vasa_will_lead_sweden_tt: "Generał zostanie królem §Y[Root.GetName]§!, jeśli wygramy wojnę o niepodległość przed wygaśnięciem modyfikatora „§YVasa przewodzi powstaniu§!”."
 flavor_swe.105.t: "Wyniesienie nowego króla państwa [Root.GetName]"
 flavor_swe.105.desc: "Po zwycięstwie nad Danią korona [Root.GetAdjective] ponownie jest niezależna i spoczywa na głowie Szweda. Przywódca powstania, [Root.GetHelpingVasa], zdobył poparcie naszego ludu, a choć [Root.Monarch.GetName] jest de facto władcą państwa [Root.GetName], [Root.Monarch.GetHerHis] legitymizacja jako [Root.Monarch.GetTitle] jest co najmniej wątpliwa. Zaproponowano koronowanie [Root.GetHelpingVasa] na króla państwa [Root.GetName] w uznaniu jego zasług podczas zwycięskiej wojny o niepodległość."
 flavor_swe.105.a: "[Root.GetHelpingVasa] powinien stanąć na czele państwa [Root.GetName]!"
 flavor_swe.105.b: "Powinniśmy dać szansę [Root.Monarch.GetName]."
 swe_Johan_vasa_tt: "Jan Waza"
 swe_Erik_vasa_tt: "Eryk Waza"
 swe_Gustav_vasa_tt: "Gustaw Waza"
 flavor_swe.106.t: "Zwolennicy niepodległości Szwecji"
 flavor_swe.106.desc: "Unia Kalmarska miała reprezentować zjednoczoną wolę Danii, Norwegii i Szwecji oraz być obrońcą ich wspólnych interesów. W rzeczywistości jednak służyła jedynie jako rozszerzone źródło bogactwa i zasobów ludzkich dla Duńczyków, pozwalając duńskim królom na prowadzenie wojen z Hanzą i wywoływanie kłopotów z królestwami Europy Wschodniej. Duńczycy mieli wielu wrogów, a większość z nich z przyjemnością poparłaby nas w naszej sprawie o niepodległość.\nByłoby jednak bardziej chwalebne, gdyby nasze królestwo zdołało samodzielnie wygrać nieuniknioną wojnę o niepodległość, co przyniosłoby nam szacunek innych monarchii Europy."
 flavor_swe.106.a: "Mimo wszystko potrzebujemy każdego możliwego stronnika."
 flavor_swe.106.a.tt: "Każdy rywal lub wróg §Y[DAN.GetName]§!, który ma co najmniej §Y0§! punktów opinii o państwie [Root.GetName], poprze niepodległość państwa §Y[Root.GetName]§!."
 flavor_swe.106.b: "Duńczycy nie stanowią zagrożenia! Sami wygramy tę wojnę!"
 flavor_swe.106.b.tt: "§YJeśli wygramy wojnę o niepodległość bez zagranicznego wsparcia, otrzymamy dodatkowe nagrody!§!"
 flavor_swe.106.c: "Dania sama przyzna nam wolność. Prędzej czy później..."
 flavor_swe.107.t: "Państwo [From.GetName] prosi nas o wsparcie jego niepodległości"
 flavor_swe.107.desc: "Dziś rano wysłannicy z [From.GetAdjective] dotarli na dwór [Root.GetAdjective]. Poprosili nas o wsparcie w dążeniu do niepodległości. Choć nie mamy wiele wspólnego z ludem [From.GetAdjective], są oni poddanymi naszego wroga, Danii. Wspierając ich, moglibyśmy osłabić naszego wroga i rozszerzyć nasze wpływy na Bałtyku."
 flavor_swe.107.a: "Będziemy wspierać państwo [From.GetName]!"
 flavor_swe.107.b: "Niewiele możemy zyskać na niepodległości [From.GetAdjective]."
 flavor_swe.1060.t: "Niepodległość [Root.GetAdjective]"
 flavor_swe.1060.desc.a: "Nasze zwycięstwo nad Duńczykami pokazało światu, że nie potrzebujemy żadnych sojuszników. Sam naród [Root.GetAdjective] wystarczy, by pokonać tyranię duńskiej korony, a dzięki temu zdobyliśmy szacunek i chwałę w całej Europie!"
 flavor_swe.1060.desc.b: "Nasze państwo [Root.GovernmentName] prowadzi wojnę o niepodległość [Root.GetAdjective]. Morale naszych wojsk było wyższe niż kiedykolwiek — aż do chwili, gdy żołnierze próbowali porozumieć się ze swoimi towarzyszami na polu bitwy po szwedzku. Najwyraźniej nowy [Root.Monarch.GetTitle] już złamał [Root.Monarch.GetHerHis] pierwszą obietnicę złożoną na początku [Root.Monarch.GetHerHis] panowania i wezwał sojuszników, którzy mają zapewnić nam zwycięstwo. Być może była to decyzja strategiczna, lecz z pewnością osłabiła morale naszych sił.\nZdecydowanie rozczarowujący początek panowania nowej dynastii [Root.Monarch.Dynasty.GetName]. Miejmy nadzieję, że przyszłe działania nowo suwerennego rządu [Root.GetAdjective] nie rozczarują już bardziej narodu [Root.GetAdjective]."
 flavor_swe.1060.desc.c: "Nasze państwo poczyniło liczne przygotowania do nadchodzącej wojny z Danią: szkolono żołnierzy, wytapiano stal i przekupywano stany.\nDlatego najnowsze wieści były dla wszystkich w państwie [Root.GetName] zaskoczeniem. Dania, nasz opresyjny suweren, całkowicie utraciła tron Szwecji i nie jest w stanie odzyskać go w najbliższym czasie. Nasze państwo jest niepodległe!"
 flavor_swe.1060.a: "Niech żyje Korona [Root.GetAdjective]"
 flavor_swe.1060.a.tt: "Każde duńskie państwo będące rywalem lub wrogiem oraz każde państwo zagrożone przez Danię zyskuje §G+100§! punktów opinii o państwie §Y[Root.GetName]§!."
 flavor_swe.1060.b: "Tak mi dziękujesz?"
 flavor_swe.1060.c: "Dobrze."
 flavor_swe.108.t: "Wsparcie klas"
 flavor_swe.108.desc: "Jak to zwykle bywa, klasy po otrzymaniu kilku przywilejów zostały w końcu przekonane do poparcia naszej sprawy. Teraz składają nam specjalną ofertę, która będzie miała wielką wartość w naszej nieuniknionej wojnie z Danią. Zaznaczają jednak, że ich oferta jest raczej przysługą dla rządu [Root.GetAdjective] przede wszystkim zaś oczekują spłaty po ustanowieniu Korony [Root.GetAdjective]."
 flavor_swe.108.a: "Przyjmij ofertę [Root.GetNobilityOrFallbackName]."
 swe_in_debt_with_the_nobles_tt: "§YTego modyfikatora można się pozbyć wyłącznie poprzez spłatę długu wobec §Y[Root.GetNobilityOrFallbackName] lub ich wyłączenie.§!\n\nAby spłacić dług, musimy podjąć decyzję spełniającą następujące wymagania:\n[Root.Capital.GetName] posiada nowoczesny §Yfort§!\nPosiadamy §Y20§! tradycji armii\nUkończono §Y4§! agendy [Root.GetNobilityOrFallbackName] LUB posiadamy §Y10%§! ziemi koronnej."
 flavor_swe.108.b: "Przyjmij ofertę [Root.GetBurghersOrFallbackName]."
 swe_in_debt_with_the_burghers_tt: "§YTego modyfikatora można się pozbyć wyłącznie poprzez spłatę długu wobec §Y[Root.GetBurghersOrFallbackName] lub ich wyłączenie.§!\n\nAby spłacić dług, musimy podjąć decyzję spełniającą następujące wymagania:\nPosiadamy dochód równy §Y1§! rocznemu dochodowi\nUkończono §Y4§! agendy [Root.GetBurghersOrFallbackName] LUB posiadamy §Y10%§! ziemi koronnej."
 flavor_swe.108.c: "Przyjmij ofertę [Root.GetChurchOrFallbackName]."
 swe_in_debt_with_the_clergy_tt: "§YTego modyfikatora można się pozbyć wyłącznie poprzez spłatę długu wobec §Y[Root.GetChurchOrFallbackName] lub ich wyłączenie.§!\n\nAby spłacić dług, musimy podjąć decyzję spełniającą następujące wymagania:\nPosiadamy co najmniej §Y5§! kościołów lub katedr\nPosiadamy co najmniej §Y100§! wpływu papieskiego\nPosiadamy §Y40§! prestiżu\nUkończono §Y4§! agendy [Root.GetChurchOrFallbackName] LUB posiadamy §Y10%§! ziemi koronnej."
 flavor_swe.108.d: "Nie potrzebujemy takich przysług, dziękujemy bardzo."
 flavor_swe.1080.t: "Następstwa rzezi w [Root.Capital.GetName]"
 flavor_swe.1080.desc: "Zazwyczaj trudno przekonać stany dowolnego państwa do wspólnego działania — zwłaszcza gdy suweren przyznał im liczne przywileje i szczególne prawa. Jednak nasze stany — [Root.GetChurchOrFallbackName], [Root.GetBurghersOrFallbackName] i [Root.GetNobilityOrFallbackName] — były świadkami brutalnej rzezi w [Root.Capital.GetName] i same padły jej ofiarą. Przysięgają wierność państwu [Root.GetName] i obiecują pełne poparcie dla naszej walki o niepodległość."
 flavor_swe.109.t: "Cesarstwo Skandynawii"
 flavor_swe.109.desc: "Przez stulecia Północ była podzielona na kilka królestw, z których każde próbowało samodzielnie zdominować region. W przeszłości wielokrotne próby ostatecznego zjednoczenia tych ziem kończyły się niepowodzeniem z powodu stronniczych rządów, braku organizacji lub zwykłego nordyckiego uporu.\nTeraz jednak wszystko to dobiegło końca, ponieważ jesteśmy niekwestionowanym mocarstwem Północy i władamy trzema stolicami północnych królestw.\nNadszedł czas, by ustanowić prawdziwe Imperium Północy, które przyniesie dobrobyt całemu regionowi!"
 flavor_swe.109.a: "Niech żyje Cesarstwo [Root.GetAdjective]"
 flavor_swe.110.t: "Złupienie [45.GetName]"
 flavor_swe.110.desc: "[45.GetName] od zawsze było klejnotem koronnym północnych Niemiec — bogatym miastem handlu, dostatku i prestiżu.\nAż do chwili, gdy miasto zaatakowali okrutni [From.GetAdjective]. Choć obrońcy [45.GetAdjective] walczyli z [From.GetAdjective] tak długo, jak mogli, ostatecznie ponieśli klęskę. Setki żołnierzy [From.GetAdjective] wtargnęły do miasta, złupiły każdy dom i splądrowały ulice."
 flavor_swe.110.a: "Barbarzyńcy!"
 flavor_swe.112.t: "Inwestycje w Falun"
 flavor_swe.112.desc: "Falun jest jednym z filarów naszej gospodarki, wobec czego pojawiło się pytanie, jak zwiększyć przychód generowany przez kopalnię miedzi w prowincji [8.GetName]. Niektórzy z naszych doradców zalecają nam rozbudowę samej kopalni, podczas gdy inni uważają, że lepszą opcją będzie rozwój infrastruktury wokół kopalni."
 flavor_swe.112.a: "Powinniśmy rozbudować kopalnię."
 flavor_swe.112.b: "Więcej uwagi powinniśmy poświęcić infrastrukturze wokół kopalni."
 flavor_swe.112.c: "Według nas, kopalnia nie potrzebuje żadnych dodatkowych inwestycji."
 flavor_swe.113.t: "Budowa nowego okrętu flagowego"
 flavor_swe.113.desc.a: "Dzięki duńskiemu kunsztowi rzemieślniczemu, norweskiej wiedzy morskiej i szwedzkim zasobom pracownicy z prowincji [vasa_ii_province.GetName] zdołali zbudować okręt flagowy dla państwa [Root.GetName]. Wspaniałość, elegancja i potęga — właśnie takie cechy miał mieć Vasa, okręt, który poprowadzi flotę [Root.GetAdjective] do zwycięstwa!"
 flavor_swe.113.desc.b: "Niegdyś Królestwo Szwecji podjęło próbę zbudowania potężnego okrętu flagowego — Vasy. Nie szczędzono wydatków na jego zdobienia i wyposażenie, lecz jednostka miała jedną zasadniczą wadę: była po prostu zbyt ciężka.\n\nWiele lat po tym wydarzeniu ludy nordyckie zebrały się w prowincji [vasa_ii_province.GetName], by zbudować drugi okręt flagowy, który poprowadzi flotę [Root.GetAdjective] do zwycięstwa. Dzięki duńskiemu kunsztowi rzemieślniczemu, norweskiej wiedzy morskiej i szwedzkim zasobom pracownicy z prowincji [vasa_ii_province.GetName] zdołali zbudować okręt flagowy dla państwa [Root.GetName]. Wspaniałość, elegancja i potęga — oto cechy potężnego Vasy II."
 flavor_swe.113.a: "Vasa będzie doskonałym okrętem flagowym."
 flavor_swe.113.b: "Tym razem NIE zatonie tuż po opuszczeniu macierzystego portu!"
 flavor_swe.114.t: "Miedź z prowincji [8.GetName]"
 flavor_swe.114.desc: "Kopalnia w Falun, położona w prowincji [8.GetName], jest głównym dostawcą miedzi wykorzystywanej w Europie. Dzięki znacznej rozbudowie wydobycia w prowincji [8.GetName] ilość pozyskiwanej rudy miedzi wzrosła do poziomu, na którym praktycznie zmonopolizowaliśmy większą część rynku tego surowca. W połączeniu z naszą dominacją handlową na Morzu Bałtyckim daje nam to doskonałą pozycję do ustalania cen miedzi, a w mniejszym stopniu również żelaza."
 flavor_swe.114.a: "Powinniśmy całkowicie zmonopolizować rynek miedzi i podnieść jej cenę."
 flavor_swe.114.b: "Sprzedajmy jak najwięcej miedzi. Potrzebujemy teraz pieniędzy!"
 flavor_swe.114.c: "Utrzymajmy obecny kierunek rozwoju rynku miedzi."
 flavor_swe.119.t: "Uniwersytety w Uppsali i [6.Capital.GetName]"
 flavor_swe.119.desc: "Od czasu chrystianizacji Szwecji Uppsala jest siedzibą arcybiskupstwa o tej samej nazwie. Jako ważny ośrodek religijny stała się centrum nauczania i nauki, dlatego budowa odpowiedniego uniwersytetu, który rozszerzyłby dostęp do edukacji, była naturalnym kolejnym krokiem.\nPodobnie jak Uppsala, również [6.Capital.GetName] było ośrodkiem kościelnym i siedzibą potężnego biskupstwa — arcybiskupstwa Danii. Oczywiście musiało się to zmienić, gdy [6.Capital.GetName] stało się integralną częścią państwa [Root.GetAdjective], lecz jego znaczenie religijne i tradycje edukacyjne przetrwały. Z czasem również w [6.Capital.GetName] powstał uniwersytet, tym razem służący kształceniu mieszkańców Skåneland w języku szwedzkim."
 flavor_swe.119.a: "Wspaniale!"
 SWEDEN_COPPER_MONOPOLIZATION: "Monopolizacja szwedzkiej miedzi"
 SWEDEN_IRON_MONOPOLIZATION: "Monopolizacja szwedzkiego żelaza"
 SWEDEN_COPPER_FLOOD: "Nadmiar szwedzkiej miedzi"
 SWEDEN_IRON_FLOOD: "Nadmiar szwedzkiego żelaza"
 SWEDEN_COPPER: "Stabilny rynek miedzi"
 SWEDEN_IRON: "Stabilny rynek żelaza"
 flavor_swe.120.t: "Los Skanii"
 flavor_swe.120.desc: "Obszar Skåneland należy do Danii od IX wieku. Zamieszkuje go zatem wielu Duńczyków, z których liczni wyrażają niezadowolenie z naszych rządów nad ich ojczystymi ziemiami. Korzystne może być włączenie ich do naszej kultury. Może to wywołać krótkotrwały bunt, lecz w dłuższej perspektywie Skåneland stanie się niekwestionowaną częścią państwa [Root.GetName]."
 flavor_swe.120.a: "Naucz ich obyczajów kultury [Root.Culture.GetName]."
 flavor_swe.120.b: "Z czasem nauczą się nas akceptować."
 flavor_swe.121.t: "Rozwój Królestwa [Root.GetAdjective]"
 flavor_swe.121.desc: "Wojna z naszymi dawnymi panami była krwawa i wymagała ogromnych ofiar w ludziach oraz majątku. Ostatecznie jednak zwyciężyliśmy i odnieśliśmy zasłużony triumf — zdobyliśmy niepodległość!\nWraz z rozpadem unii kalmarskiej rozpoczyna się nowa era i wzrost potęgi nowego królestwa Skandynawii — państwa [Root.GetName]."
 flavor_swe.121.a: "To początek nowej epoki."
 flavor_swe.123.t: "Szlak Waregów"
 flavor_swe.123.desc: "„Waregowie” — greckie określenie wikingów ze Skandynawii, nadane przez Rzymian wschodnich, gdy nasi przodkowie dotarli do Konstantynopola pod koniec VIII wieku. Przybyli szlakiem nazywanym po prostu „Drogą od Waregów do Greków”, biegnącym wzdłuż Dniepru.\n\nWiele najważniejszych miast leżących na tej trasie znajduje się obecnie w naszym posiadaniu lub na terytorium naszych sojuszników, a ten historyczny szlak handlowy ponownie tętni życiem!"
 flavor_swe.123.a: "Wspaniale!"
 flavor_swe.124.t: "Korona Polski"
 flavor_swe.124.desc: "Podczas gdy nasza dynastia umacnia swoje prawa do tronu Szwecji, szlachta państwa [Root.GetName] zwraca wzrok na naszego południowego sąsiada — Królestwo Polskie. Po konsolidacji Skandynawii i opanowaniu szlaku przez Rosję Polska jest ostatnim kierunkiem ekspansji naszego państwa. Nie wszyscy możnowładcy zgadzają się jednak z tym poglądem, wskazując na korzyści, jakie przyniósłby nam silny polski sojusznik na południu. Inni zauważają, że możliwe byłoby osadzenie na polskim tronie członka dynastii [Root.Monarch.Dynasty.GetName], a tym samym ustanowienie nad Polską unii personalnej.\nOstateczna decyzja [Root.Monarch.GetName] dotycząca kształtu stosunków [Root.GetAdjective]-polskich pozostaje w rękach monarchy."
 flavor_swe.124.a: "'[Root.Monarch.GetTitle] Polski'... to brzmi ciekawie."
 flavor_swe.124.a.tt: "Obierzemy politykę §Ywięzi dynastycznych§! wobec państwa §Y[GetPolandPLC]§!. Zmieni to wymagania i nagrody misji „§YKrólestwo Polskie§!” w następujący sposób:\nWymagania:\nPanująca dynastia państwa §Y[GetPolandPLC]§! to dynastia §Y[Root.Monarch.Dynasty.GetName]§!, a my posiadamy co najmniej tyle samo prestiżu i legitymizacji co państwo §Y[GetPolandPLC]§!.\nNagrody:\nPaństwo §Y[Root.GetName]§! otrzymuje casus belli §YPrzywrócenie unii§! przeciwko państwu §Y[GetPolandPLC]§!."
 flavor_swe.124.b: "Zamierzamy ich podbić tradycyjną metodą."
 flavor_swe.124.b.tt: "Obierzemy politykę §Ypodboju§! wobec państwa §Y[GetPolandPLC]§!. Zmieni to wymagania i nagrody misji „§YKrólestwo Polskie§!” w następujący sposób:\nWymagania:\n§Y15§! prowincji w regionie §YPolski§! należy do państwa §Y[Root.GetName]§! lub jego poddanych.\nNagrody:\nOtrzymujemy §G150§! punktów administracyjnych, przyjmujemy kulturę §Ypolską§! i akceptujemy ją jako kulturę państwową, a każda prowincja w regionie §YPolski§! traci §G25,00%§! lokalnej autonomii oraz §G10§! lat separatyzmu."
 flavor_swe.124.c: "Nie mamy żadnych interesów w Polsce, ale polski sojusznik rzeczywiście mógłby się przydać."
 flavor_swe.124.c.tt: "Obierzemy politykę §Ywspółistnienia§! wobec państwa §Y[GetPolandPLC]§!. Zmieni to wymagania i nagrody misji „§YKrólestwo Polskie§!” w następujący sposób:\nWymagania:\nPaństwo §Y[GetPolandPLC]§! jest sojusznikiem i małżonkiem dynastycznym państwa §Y[Root.GetName]§! oraz ma co najmniej §Y150§! punktów opinii i §Y80§! zaufania do państwa §Y[Root.GetName]§!. Państwo §Y[GetPolandPLC]§! ma również łącznie §Y600§! rozwoju (wliczając poddanych).\nNagrody:\nPaństwo §Y[Root.GetName]§! otrzymuje §G100§! punktów dyplomatycznych i §G400§! splendoru. Państwa §Y[GetPolandPLC]§! i §Y[Root.GetName]§! zostają §Yhistorycznymi przyjaciółmi§!.\n\n§YTa ścieżka wpłynie na misje „Wrota na Wschód” i „Ziemie Prusów”, umożliwiając ich ukończenie dzięki posiadaniu polskiego sojusznika kontrolującego wymagane prowincje. Nie otrzymamy jednak dodatkowych roszczeń z tych misji.§!"
 flavor_swe.125.t: "Kupno prowincji [40.GetName]?"
 flavor_swe.125.desc: "Prowincja [40.GetName] stanowi ujście Niemna, a także ważne centrum handlu na Morzu Bałtyckim. Jest ono jednak w posiadaniu [40.Owner.GetAdjective], państwa, z którym zawarliśmy sojusz, tym samym nie możemy jej zdobyć bez zerwania stosunku dyplomatycznego. Na szczęście pieniądze potrafią czynić cuda, więc jeśli zaoferujemy państwu [40.Owner.GetName] odpowiednio hojną ilość dukatów, będziemy mieli szansę zakupu prowincji [40.GetName]."
 flavor_swe.125.a: "Uważamy, że oni nie odrzucą tej jednorazowej oferty!"
 flavor_swe.125.b: "To naprawdę nie jest tego warte."
 flavor_swe.126.t: "Oferta z [From.GetAdjective]"
 flavor_swe.126.desc: "Nasz zaufany sojusznik, [From.GetName], przysłał do nas swojego ambasadora. Chcieliby kupić od nas prowincję [40.GetName] za kwotę 500 dukatów."
 flavor_swe.126.a: "500 dukatów, mówisz? To świetny interes!"
 flavor_swe.126.b: "Dziękujemy, ale uważamy, że prowincja [40.GetName] powinna pozostać częścią [Root.GetAdjective]."
 flavor_swe.127.t: "Państwo [From.GetName] przyjęło naszą ofertę kupna prowincji [40.GetName]!"
 flavor_swe.127.desc: "Świetne wieści napływają do nas z [From.GetAdjective]. [From.Monarch.GetTitle] [From.GetAdjective] przyj[From.Monarch.GetEndPast] naszą ofertę i sprzedał[From.Monarch.GetANoun] nam prowincję [40.GetName] za kwotę 500 dukatów."
 flavor_swe.127.a: "Doskonale."
 flavor_swe.128.t: "Państwo [From.GetName] odrzuciło naszą ofertę kupna prowincji [40.GetName]!"
 flavor_swe.128.desc: "Złe wieści napływają do nas z [From.GetAdjective]. [From.Monarch.GetTitle] [From.GetAdjective] odrzucił[From.Monarch.GetANoun] naszą ofertę, co oznacza, że prowincja [40.GetName] pozostaje częścią [From.GetAdjective]."
 flavor_swe.128.a: "Jaka szkoda."
 flavor_swe.129.t: "Kupno prowincji [38.GetName]?"
 flavor_swe.129.desc: "[38.GetName] jest ważnym miastem handlowym na Morzu Bałtyckim, wobec czego jest to bardzo wartościowa prowincja dla jej posiadacza. Jednak [38.GetName] jest w posiadaniu naszych sojuszników z [38.Owner.GetAdjective]. Na szczęście ich [38.Owner.Monarch.GetTitle] może zainteresować się hojną ofertą sprzedaży nam tego miasta."
 flavor_swe.129.a: "1000 dukatów za prowincję [38.GetName] wydaje się być dobrą ofertą."
 flavor_swe.129.b: "To miasto nie jest warte 1000 dukatów."
 flavor_swe.130.t: "Oferta z [From.GetAdjective]"
 flavor_swe.130.desc: "Nasz zaufany sojusznik, [From.GetName], przysłał do nas swojego ambasadora. Chcieliby kupić od nas prowincję [38.GetName] za kwotę 1000 dukatów."
 flavor_swe.130.a: "1000 dukatów za prowincję [38.GetName] wydaje się być uczciwe."
 flavor_swe.130.b: "[38.GetName] to zbyt wartościowe miasto, by mogło zostać sprzedane."
 flavor_swe.131.t: "Państwo [From.GetName] przyjęło naszą ofertę kupna prowincji [38.GetName]!"
 flavor_swe.131.desc: "Świetne wieści napływają do nas z [From.GetAdjective]. [From.Monarch.GetTitle] [From.GetAdjective] przyj[From.Monarch.GetEndPast] naszą ofertę i sprzedał[From.Monarch.GetANoun] nam prowincję [38.GetName] za kwotę 1000 dukatów."
 flavor_swe.131.a: "Doskonale."
 flavor_swe.132.t: "Państwo [From.GetName] odrzuciło naszą ofertę kupna prowincji [38.GetName]!"
 flavor_swe.132.desc: "Złe wieści napływają do nas z [From.GetAdjective]. [From.Monarch.GetTitle] [From.GetAdjective] odrzucił[From.Monarch.GetANoun] naszą ofertę, co oznacza, że prowincja [38.GetName] pozostaje częścią [From.GetAdjective]."
 flavor_swe.132.a: "Jaka szkoda."
 flavor_swe.134.t: "Proklamacja [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 flavor_swe.134.desc: "Napięcia między protestantami a katolikami w Świętym Cesarstwie Rzymskim stają się z każdym dniem coraz bardziej wybuchowe. Do wojny doszłoby już wcześniej, gdyby nie fakt, że protestanci są w mniejszości.\nW tym pamiętnym dniu [Root.Monarch.GetTitle] [Root.Monarch.GetName] z państwa [Root.Religion.GetName] [Root.GovernmentName] państwa [Root.GetName] ogłosił [Root.Monarch.GetHerHis] proklamację: państwo [Root.GovernmentName] państwa [Root.GetName] uznaje prawa niemieckich protestantów i będzie wspierać ich interesy militarnie, gospodarczo oraz politycznie.\nPonadto [Root.Monarch.GetName] z dynastii [Root.Monarch.Dynasty.GetName] osobiście stanie na czele Ligi Protestanckiej w imieniu wszystkich krzywdzonych przez [Emperor.Monarch.GetTitle] i będzie walczyć o przewagę religijną w Świętym Cesarstwie Rzymskim."
 flavor_swe.134.a: "Wszystko jest już gotowe..."
 flavor_swe.135.t: "Proklamacja [From.Monarch.GetTitle] [From.Monarch.GetName]"
 flavor_swe.135.desc: "Napięcia między protestantami a katolikami w Świętym Cesarstwie Rzymskim stają się z każdym dniem coraz bardziej wybuchowe. Do wojny doszłoby już wcześniej, gdyby nie fakt, że protestanci są w mniejszości.\nW tym pamiętnym dniu [From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.Religion.GetName] [From.GovernmentName] państwa [From.GetName] ogłosił [From.Monarch.GetHerHis] proklamację: państwo [From.GovernmentName] państwa [From.GetName] uznaje prawa niemieckich protestantów i będzie wspierać ich interesy militarnie, gospodarczo oraz politycznie.\n\nW następstwie tej oficjalnej deklaracji protestanccy członkowie Świętego Cesarstwa Rzymskiego zebrali się i utworzyli Ligę Protestancką, która stanie do walki z [Emperor.Monarch.GetTitle]."
 flavor_swe.135.a: "Nadszedł czas, byśmy uzyskali wolność religijną!"
 swe_the_varangian_route: "Szlak Waregów"
 norse_events.2.t: "Fala ciekawości"
 norse_events.2.desc: "Skandynawia przyjęła chrześcijaństwo u szczytu średniowiecza. Choć początkowo ludność Danii, Szwecji i Norwegii niechętnie odnosiła się do nowej wiary, ostatecznie się nawróciła i podporządkowała Stolicy Apostolskiej, otrzymując obietnicę rozgrzeszenia.\nNordyckie ludy nie wiedziały jednak, jak naprawdę wygląda droga do tego rozgrzeszenia: zwykły kapłan może sprzedawać odpusty rzekomo chroniące przed ogniem piekielnym, biskupi wyzyskują miasta, które obiecali chronić, a papież bardziej troszczy się o własne korzyści niż o los katolicyzmu.\n\nW takich czasach nic dziwnego, że [Root.Monarch.GetTitle] [Root.Monarch.GetName] zaczyna kwestionować autorytet papiestwa. Podczas jednej z [Root.Monarch.GetHerHis] wypraw przez bezdroża państwa [Root.GetName] [Root.Monarch.GetSheHe] natrafił na jeden z dawnych kamieni runicznych, wzniesionych przez naszych pogańskich przodków. [Root.Monarch.GetHerHisCap] ciekawość dawnych bogów została rozbudzona..."
 norse_events.2.a: "Kościół jest stracony. Lepiej poznajmy dawną wiarę nordycką!"
 norse_events.2.a.tt: "§Y[Root.Monarch.GetName]§! uda się na odludzie państwa [Root.GetName], aby lepiej poznać naszych nordyckich przodków..."
 norse_events.2.b: "To szaleństwo!"
 norse_events.3.t: "Odkrycie [Root.Monarch.GetName]"
 norse_events.3.desc: "[Root.Monarch.GetName] udał się do gęstych lasów państwa [Root.GetName] w towarzystwie niewielkiej grupy najbliższych doradców i sług. W końcu [Root.Monarch.GetTitle] taki jak [Root.Monarch.GetHerHim] nie może przetrwać w dziczy, polegając wyłącznie na [Root.Monarch.GetHerselfHimself].\nPo kilku tygodniach podróży, poszukiwań i rozważań ciekawski [Root.Monarch.GetTitle] wraz z [Root.Monarch.GetHerHis] orszakiem odnalazł w końcu opuszczoną świątynię, w której znajdował się niewielki zbiór posągów różnych bogów wiary nordyckiej. Gdy [Root.Monarch.GetName] ich dotknął, doznał ataku i całkowicie stracił [Root.Monarch.GetHerHis] zmysły!\n\nDwa dni później, gdy słudzy [Root.Monarch.GetHerHisCap] rozbili niewielki obóz, [Root.Monarch.GetTitle] w końcu obudził się z [Root.Monarch.GetHerHis] niechcianego snu."
 norse_events.3.a: "Nasz [Root.Monarch.GetTitle] twierdzi, że [Root.Monarch.GetSheHe] otrzymał wizję!"
 norse_events.4.t: "[Root.Monarch.GetName] zwraca się ku dawnym bogom"
 norse_events.4.desc: "Od nagłej utraty zmysłów przez [Root.Monarch.GetName] minęło już kilka miesięcy. Choć trwała ona krótko, wizje, które rzekomo ujrzał [Root.Monarch.GetName], całkowicie odmieniły [Root.Monarch.GetHerHim].\n\n[Root.Monarch.GetSheHe] przestał zajmować się sprawami Kościoła, a [Root.Monarch.GetSheHe] nie wydawał się już troszczyć o bezpieczeństwo państwa. Zamiast tego [Root.Monarch.GetTitle] studiował każdy manuskrypt i każdy dokument dotyczący dawnej religii nordyckiej. Niektórzy martwili się o [Root.Monarch.GetHerHis] zdrowie psychiczne, lecz rozmowy z [Root.Monarch.GetHerHis] otoczeniem ujawniły, że [Root.Monarch.GetSheHe] wcale nie utracił [Root.Monarch.GetHerHis] bystrego umysłu.\n\nPewnego dnia [Root.Monarch.GetName] jednak zupełnie zniknął, a na dwór dotarły wieści z prowincji [new_norse_province.GetName]..."
 norse_events.4.a: "Wiedza ta na nic się nie zda, jeśli nie podzielimy się nią z ludem!"
 norse_events.5.t: "Nawrócenie państwa [Root.GetName] na wiarę nordycką"
 norse_events.5.desc: "W naszych prowincjach głoszone są pogańskie nauki. Ci, którzy jeszcze niedawno byli gorliwymi chrześcijanami, wrzucają krzyże do morza i wznoszą świątynie ku czci dawnych bogów. Kościoły zamieniane są w chramy.\nW samym środku tych wydarzeń znajduje się [Root.Monarch.GetTitle] [Root.Monarch.GetName], który sam ogłosił się „Widzącym Dawnych Bogów” i nadzoruje nawracanie całych obszarów państwa [Root.GetName]."
 norse_events.5.a: "Dokonało się! Znów wyznajemy prawdziwą wiarę!"
 norse_events.6.t: "Odbudowa świątyni w Uppsali"
 norse_events.6.desc: "Świątynia w Uppsali była świętym miejscem wyznawców wiary nordyckiej, dopóki król Inge Starszy nie zdołał jej zniszczyć, pozostawiając po niej jedynie gruzy. Nasza wiara nigdy nie podniosła się po tej stracie i w końcu odwróciliśmy się od bogów.\n\nDziś jednak naprawimy tę hańbę! Świątynia w Uppsali została odbudowana i jest wspanialsza oraz okazalsza niż kiedykolwiek wcześniej!"
 norse_events.6.a: "Przygotujcie ofiarę. Dziś świętujemy!"
 norse_events.6.a.tt: "§Y[1.GetName]§! otrzymuje §Ycentrum religijne§! wiary §Y[1.Religion.GetName]§! oraz aktywowany modyfikator prowincji „§YŚwiątynia w Uppsali§!” z następującymi efektami dla właściciela wyznającego religię §Y[1.Religion.GetName]§!:\nMisjonarze: §G+1§!\nGlobalna siła misjonarzy: §G+2,0%§!\nTolerancja prawdziwej wiary: §G+1,00§!"
 norse_events.7.t: "Przebudzenie wiary nordyckiej"
 norse_events.7.desc: "Animistyczni buntownicy z prowincji [new_norse_province.GetName] odnaleźli starożytne kamienie runiczne, pozostawione przed wiekami przez wikingów. Wiara naszych przodków otworzyła przed buntownikami zupełnie nowy świat wierzeń. Nie walczą już przeciwko nam w obronie animistycznych tradycji, lecz w imię nowo odkrytych bogów Asgardu."
 norse_events.7.a: "Szaleństwo!"
 norse_events.7.b: "Nie ma powodu do buntu — my również jesteśmy dziećmi bogów!"
 norse_events.8.t: "Powrót kultury nordyckiej"
 norse_events.8.desc: "Wraz z odrodzeniem wiary nordyckiej ludność państwa [Root.GetName] zaczęła ponownie kultywować tradycje i obrzędy, które uważano za dawno zapomniane. Odrodzenie dawnej kultury nordyckiej może dać naszemu państwu szansę na zerwanie więzów, którymi chrześcijaństwo skrępowało naszą kulturę."
 norse_events.8.a: "Czas powrócić do naszych kulturowych korzeni!"
 norse_events.8.a.tt: "Każda posiadana prowincja o kulturze §Yszwedzkiej§!, §Yduńskiej§!, §Ynorweskiej§! lub §Yislandzkiej§! zmienia kulturę na §Ynordycką§!."
 norse_events.8.b: "Nie możemy zaprzepaścić postępu, jaki osiągnęliśmy przez stulecia."
 norse_events.9.t: "Odbudowa Imperium Morza Północnego"
 norse_events.9.desc: "W 1013 roku król Kanut Wielki zjednoczył królestwa Danii, Norwegii i Anglii w jedno państwo — Imperium Morza Północnego. Jego dokonania stały się wzorem zarówno dla królestw chrześcijańskich, jak i nordyckich, a jego dziedzictwo przetrwało aż do dziś.\n\nTeraz korony Skandynawii i Wysp Brytyjskich ponownie jednoczą się pod jednym nordyckim sztandarem. Jarłowie licznych ziem kłaniają się przed wielkim [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Nie ulega wątpliwości, że [Root.GovernmentName] państwa [Root.GetName] jest prawowitym spadkobiercą Imperium Morza Północnego.\nPozostaje tylko jedno pytanie: czy państwo [Root.GetAdjective] powinno przyjąć nazwę „Imperium Morza Północnego”?"
 norse_events.9.a: "Od dziś będziemy znani jako Imperium Morza Północnego!"
 norse_events.9.b: "Nazwa [Root.GetName] lepiej wzbudza strach."
 norse_raid_fleet: "Nordycka flota łupieżcza"
 norse_raid_fleet_desc: "Wikingowie wyspecjalizowali się w szybkich uderzeniach i odwrocie, zanim przeciwnik zdołał odpowiedzieć. Choć ich doktryna wojskowa i morska nieco się zestarzała w obecnych czasach, można ją dostosować do realiów nowożytności."
 swe_global_trade_empire_modifier: "Bałtyckie imperium morskie"
 desc_swe_global_trade_empire_modifier: "Dominujemy na wodach Bałtyku i pełnym morzu Nowego Świata."
 swe_debt_with_the_clergy: "Dług wobec duchowieństwa"
 desc_swe_debt_with_the_clergy: "Duchowieństwo pomogło nam osiągnąć niepodległość. Teraz domaga się zapłaty za udzielone wsparcie.\n\n§YTego modyfikatora można się pozbyć wyłącznie poprzez spłatę długu lub wyłączenie stanu duchowieństwa.§!"
 swe_debt_with_the_burghers: "Dług wobec mieszczan"
 desc_swe_debt_with_the_burghers: "Mieszczanie pomogli nam osiągnąć niepodległość. Teraz domagają się zapłaty za udzielone wsparcie.\n\n§YTego modyfikatora można się pozbyć wyłącznie poprzez spłatę długu lub wyłączenie stanu mieszczan.§!"
 swe_debt_with_the_nobles: "Dług wobec szlachty"
 desc_swe_debt_with_the_nobles: "Szlachta pomogła nam osiągnąć niepodległość. Teraz domaga się zapłaty za udzielone wsparcie.\n\n§YTego modyfikatora można się pozbyć wyłącznie poprzez spłatę długu lub wyłączenie stanu szlacheckiego.§!"
 swe_vasa_leads_the_rebellion: "Vasa przewodzi powstaniu"
 desc_swe_vasa_leads_the_rebellion: "Czas ucisku dobiegł końca! Nasz lud jest gotów walczyć do ostatniego tchu, aby nasze królestwo mogło wreszcie samo decydować o swoim losie!\n\n§YJeśli wygramy wojnę o niepodległość, generał z rodu Vasa zostanie królem państwa [Root.GetName], o ile ten modyfikator będzie aktywny.§!"
 swe_any_vasa_leads_the_rebellion: "Vasa przewodzi powstaniu"
 desc_swe_any_vasa_leads_the_rebellion: "Czas ucisku dobiegł końca! Nasz lud jest gotów walczyć do ostatniego tchu, aby nasze królestwo mogło wreszcie samo decydować o swoim losie!\n\n§YJeśli wygramy wojnę o niepodległość, generał z rodu Vasa zostanie królem państwa [Root.GetName], o ile ten modyfikator będzie aktywny.§!"
 swe_fight_for_independence: "Walka o niepodległość"
 desc_swe_fight_for_independence: "Nasz lud chwyta za broń, by walczyć o niepodległość!\n\n§YJeśli wygramy wojnę o niepodległość bez pomocy zagranicznych sojuszników, otrzymamy dodatkowe nagrody!§!"
 swe_fight_for_independence_tt: "do czasu uzyskania niepodległości oraz zawarcia pokoju lub pozyskania sojuszników podczas wojny o niepodległość"
 swe_rise_of_a_new_dynasty: "Powstanie szwedzkiej monarchii"
 desc_swe_rise_of_a_new_dynasty: "Szwecją rządzi nowy król — wybrany przez Szwedów władca, który wreszcie reprezentuje interesy ich ojczyzny!"
 swe_support_of_the_sapmi: "Poparcie Samów"
 desc_swe_support_of_the_sapmi: "Prowincję zamieszkują Samowie, których wspiera ich zwierzchnik.\n\n§YModyfikator zostanie usunięty, jeśli właściciel prowincji przestanie akceptować kulturę samijską.§!"
 swe_influential_temple: "Wpływowa świątynia"
 desc_swe_influential_temple: "Duchowieństwo tej prowincji wykorzystało pieniądze swojego zwierzchnika, aby zwiększyć lokalne wpływy budowli sakralnej."
 swe_nobles_fortification: "Ufortyfikowane miasto"
 desc_swe_nobles_fortification: "Szlachta tej prowincji wykorzystała pieniądze swojego zwierzchnika, aby ufortyfikować miasto i zwiększyć w nim swoje wpływy."
 sca_great_empire_of_scandinavia: "Stormaktstiden"
 desc_sca_great_empire_of_scandinavia: "Trzy królestwa Północy zostały wreszcie zjednoczone w jedno wielkie imperium — szwedzkie imperium Skandynawii, epokę wielkiej potęgi!"
 dan_great_empire_of_scandinavia: "Wielkie Imperium Skandynawii"
 desc_dan_great_empire_of_scandinavia: "Trzy królestwa Północy zostały wreszcie zjednoczone w jedno wielkie Imperium Skandynawii!"
 swe_arctic_expansion: "Ekspansja w Arktyce"
 desc_swe_arctic_expansion: "Dzięki rządowym dotacjom prowincja przeżywa wzrost liczby osadników."
 swe_search_for_new_world: "Ambicje kolonialne"
 desc_swe_search_for_new_world: "Wszystko jest gotowe do stworzenia własnego imperium kolonialnego. Nasi odkrywcy pragną dotrzeć do Nowego Świata i zasiedlić wszystkie wolne ziemie, jakie zdołają znaleźć."
 swe_swedish_colonialism: "Entuzjazm kolonialny"
 desc_swe_swedish_colonialism: "Obietnica nowego życia w Nowym Świecie przyciąga wielu mieszkańców naszego państwa. Ich entuzjazm wobec kolonizacji odległego kontynentu, z dala od chłodu Skandynawii, sprzyja realizacji naszych ambicji."
 swe_baltic_trade_fleet: "Bałtycka flota handlowa"
 desc_swe_baltic_trade_fleet: "Doświadczenie zdobywane przez naszą flotę dzięki nowo utworzonej flocie handlowej będzie niezwykle cenne dla przyszłego projekcji siły na morzach. Oczywiście okręty te są również bardzo przydatne do ochrony naszego handlu."
 swe_baltic_trade: "Szwedzkie rynki"
 desc_swe_baltic_trade: "Dzięki budowie specjalnych targowisk nasz [Root.GovernmentName] może z łatwością nakładać podatki na kupców działających nad Bałtykiem i czerpać dochody z ich działalności w naszych ośrodkach handlowych."
 swe_swedish_influence_in_asia: "Szwedzkie wpływy w Azji"
 desc_swe_swedish_influence_in_asia: "Ekspansja poza Afrykę pozwala nam rozszerzać naszą potęgę i wpływy nawet na najodleglejsze zakątki Azji."
 swe_economical_upswing: "Rozkwit gospodarczy"
 desc_swe_economical_upswing: "Wzrost dochodów państwa pobudza rozwój przemysłu, zwiększając jego zamożność i produktywność. W tym świecie bogactwo rodzi jeszcze większe bogactwo."
 swe_local_economical_upswing: "Rozkwit gospodarczy"
 desc_swe_local_economical_upswing: "Prowincja przeżywa rozkwit gospodarczy, który zwiększa jej produktywność i potencjał rozwoju."
 swe_guns_drums_and_steel: "Muszkiety, werble i stal"
 desc_swe_guns_drums_and_steel: "Nasi żołnierze dzierżą wyłącznie najlepszą szwedzką stal, maszerują w rytm najpiękniejszych werbli i strzelają z najdroższych muszkietów, jakie można znaleźć w Europie."
 swe_diplomat_from_the_north: "Królewski ambasador"
 desc_swe_diplomat_from_the_north: "Skoro zaczęliśmy angażować się w politykę wielkich mocarstw, ważniejsze niż kiedykolwiek jest posiadanie ambasadora, który będzie reprezentował nasze interesy na europejskiej scenie politycznej."
 swe_norse_opportunist: "Nordyccy oportuniści"
 desc_swe_norse_opportunist: "Chrześcijańskie państwa Europy walczą między sobą, podczas gdy my wyznajemy jedyną prawdziwą wiarę — wiarę Odyna. To doskonała okazja, być może jedyna w życiu, by wykorzystać ich spory i uderzyć na świat chrześcijański, gdy jego mieszkańcy zajęci są wzajemnym wyniszczaniem."
 swe_theologian_discussions: "Debaty teologiczne"
 desc_swe_theologian_discussions: "Świat chrześcijański przeżywa kryzys religijny wywołany reformacją. W takich czasach debaty teologów mają większe niż kiedykolwiek znaczenie dla zachowania religijnej jedności państwa."
 swe_support_from_the_pope: "Poparcie papieskie"
 desc_swe_support_from_the_pope: "Nasza wierność Stolicy Apostolskiej została nagrodzona przez samego papieża. Otrzymaliśmy miejscową delegację kardynałów, którzy łagodzą nastroje naszego duchowieństwa i wspierają nasze sprawy w Rzymie."
 swe_swedish_steel_for_the_pope: "Nordyckie wsparcie"
 desc_swe_swedish_steel_for_the_pope: "Szwedzka stal i wojska dotarły do Stolicy Apostolskiej, gdzie przysięgły wierność papieżowi. Będą bronić nas przed zagrożeniem ze strony heretyków!"
 swe_enforcers_of_religious_superiority: "Obrońcy wyższości religijnej"
 desc_swe_enforcers_of_religious_superiority: "Reformacja zbliża się do punktu kulminacyjnego. Wojna religijna w Świętym Cesarstwie Rzymskim wydaje się nieunikniona, lecz być może siłą miecza zdołamy narzucić heretykom jedyną prawdziwą wiarę, zanim będzie za późno..."
 swe_catholic_great_power: "Obrońca Stolicy Apostolskiej"
 desc_swe_catholic_great_power: "Nasza odwaga w boju i oddanie obronie prawdziwej wiary pokazały światu, że to właśnie my jesteśmy godni miana obrońcy Stolicy Apostolskiej."
 swe_reformation_great_power: "Obrońca reformacji"
 desc_swe_reformation_great_power: "Nasza odwaga w boju i oddanie obronie prawdziwej wiary pokazały światu, że to właśnie my jesteśmy godni miana obrońcy reformacji."
 swe_support_from_the_reformers: "Poparcie dla reformacji"
 desc_swe_support_from_the_reformers: "Sojusze zawarte z braćmi i siostrami w wierze zapewniły nam lojalność oraz poparcie duchowieństwa dla reformacji."
 swe_might_of_the_varangians: "Potęga potomków Waregów"
 desc_swe_might_of_the_varangians: "Choć nie jesteśmy już Waregami z dawnych czasów, nasza waleczność i zdolność podbojów budzą taki sam strach jak niegdyś dokonania naszych przodków!"
 swe_norse_great_power: "Obrońca dawnych wierzeń"
 desc_swe_norse_great_power: "Utworzenie imperium nordyckiego uczyniło nas oficjalnym obrońcą dawnych wierzeń nordyckich. Każdy mężczyzna z każdej nordyckiej prowincji z ochotą będzie walczył i umierał za bogów!"
 swe_fight_for_the_catholic_league: "Walka w obronie Ligi Katolickiej"
 desc_swe_fight_for_the_catholic_league: "Nasze państwo przystąpiło do Ligi Katolickiej i prowadzi teraz rozległą wojnę z mocarstwami Europy. Dyscyplina i religijny zapał naszych wojsk osiągnęły niespotykany dotąd poziom."
 swe_fight_for_the_protestant_league: "Walka w obronie Ligi Protestanckiej"
 desc_swe_fight_for_the_protestant_league: "Nasze państwo przystąpiło do Ligi Protestanckiej i prowadzi teraz rozległą wojnę z mocarstwami Europy. Dyscyplina i religijny zapał naszych wojsk osiągnęły niespotykany dotąd poziom."
 swe_fight_for_league_tt: "do końca §Ywojny lig§!"
 swe_east_european_integration: "Integracja Europy Wschodniej"
 desc_swe_east_european_integration: "Ekspansja w Europie Wschodniej wymagała reformy naszego podejścia do cudzoziemców w Szwecji. Rada rozważała edukację kulturową klas rządzących, lecz ostatecznie uznała to rozwiązanie za niewykonalne. Zamiast tego rozszerzono prawa obcych kultur, zapewniając im większą swobodę i tolerancję w zamian za lojalność."
 swe_an_empire_of_tolerance: "Imperium tolerancji"
 desc_swe_an_empire_of_tolerance: "W naszym imperium mile widziani są ludzie wszystkich wyznań, a każdego traktujemy z szacunkiem i godnością, na jakie zasługuje!"
 swe_dominium_maris_baltici_mod: "Dominium Maris Baltici"
 desc_swe_dominium_maris_baltici_mod: "Morze Bałtyckie należy do nas! Niech Imperium Szwedzkie włada nim przez całą wieczność!"
 swe_baltic_diplomacy: "Dyplomacja bałtycka"
 desc_swe_baltic_diplomacy: "Wybrzeże Morza Bałtyckiego dzielimy z naszymi najbardziej zaufanymi sojusznikami. Ze względu na charakter tego podziału terytorialnego kluczowe znaczenie ma utrzymywanie z nimi dobrych stosunków dyplomatycznych."
 swe_support_of_the_peasantry: "Poparcie chłopstwa"
 desc_swe_support_of_the_peasantry: "Modyfikator produkcji dóbr §Yzboże§!: §G+33,0%§!\nModyfikator produkcji dóbr §Yryby§!: §G+33,0%§!\nModyfikator produkcji dóbr §Yzwierzęta hodowlane§!: §G+33,0%§!\nNasze inwestycje w chłopstwo przyniosły oczekiwane rezultaty. Rolnicy i rybacy naszego państwa są zadowoleni z naszych rządów i mogą w pełni skupić się na produkcji swoich dóbr.\nKatastrofa „§YWojna Dackego§!” nie może wybuchnąć, dopóki ten modyfikator pozostaje aktywny."
 swe_support_of_the_peasantry_prov: "Poparcie chłopstwa"
 desc_swe_support_of_the_peasantry_prov: "Chłopi tej prowincji cieszą się poparciem władz."
 swe_germanic_alliance: "Sojusz germański"
 desc_swe_germanic_alliance: "Dzięki naszemu wsparciu ekspansji państw germańskich więzi dyplomatyczne między Szwecją a tymi państwami ulegają zacieśnieniu."
 swe_repay_estate_church_title: "Spłać dług wobec stanu [Root.GetChurchOrFallbackName]"
 swe_repay_estate_church_desc: "Stan [Root.GetChurchOrFallbackName] udzielił nam znacznego wsparcia w walce o niepodległość. Jego pomoc nie była jednak bezinteresowna i teraz domaga się spłaty długu. Jeśli chcemy, aby rządy [Root.Monarch.GetName] nie budziły żadnych wątpliwości, musimy uregulować nasze zobowiązania wobec tego stanu."
 swe_repay_estate_church_at: "Dzięki ukończeniu §Y4§! agend stanu §Y[Root.GetChurchOrFallbackName]§! nie będziemy musieli spłacać długu w §Yziemi koronnej§!."
 swe_repay_estate_church_ct: "Jeśli podejmiemy tę decyzję, gdy lojalność stanu §Y[Root.GetChurchOrFallbackName]§! wynosi co najmniej §Y60§!, otrzymamy dodatkową premię rekompensującą spłatę długu."
 swe_repay_estate_burghers_title: "Spłać dług wobec stanu [Root.GetBurghersOrFallbackName]"
 swe_repay_estate_burghers_desc: "Stan [Root.GetBurghersOrFallbackName] udzielił nam znacznego wsparcia w walce o niepodległość. Jego pomoc nie była jednak bezinteresowna i teraz domaga się spłaty długu. Jeśli chcemy, aby rządy [Root.Monarch.GetName] nie budziły żadnych wątpliwości, musimy uregulować nasze zobowiązania wobec tego stanu."
 swe_repay_estate_burghers_at: "Dzięki ukończeniu §Y4§! agend stanu §Y[Root.GetBurghersOrFallbackName]§! nie będziemy musieli spłacać długu w §Yziemi koronnej§!."
 swe_repay_estate_burghers_ct: "Jeśli podejmiemy tę decyzję, gdy lojalność stanu §Y[Root.GetBurghersOrFallbackName]§! wynosi co najmniej §Y60§!, otrzymamy dodatkową premię rekompensującą spłatę długu."
 swe_repay_estate_nobles_title: "Spłać dług wobec stanu [Root.GetNobilityOrFallbackName]"
 swe_repay_estate_nobles_desc: "Stan [Root.GetNobilityOrFallbackName] udzielił nam znacznego wsparcia w walce o niepodległość. Jego pomoc nie była jednak bezinteresowna i teraz domaga się spłaty długu. Jeśli chcemy, aby rządy [Root.Monarch.GetName] nie budziły żadnych wątpliwości, musimy uregulować nasze zobowiązania wobec tego stanu."
 swe_repay_estate_nobles_at: "Dzięki ukończeniu §Y4§! agend stanu §Y[Root.GetNobilityOrFallbackName]§! nie będziemy musieli spłacać długu w §Yziemi koronnej§!."
 swe_repay_estate_nobles_ct: "Jeśli podejmiemy tę decyzję, gdy lojalność stanu §Y[Root.GetNobilityOrFallbackName]§! wynosi co najmniej §Y60§!, otrzymamy dodatkową premię rekompensującą spłatę długu."
 swe_provoke_religious_leagues_forming_decision_title: "Proklamuj opiekę nad protestantami"
 swe_provoke_religious_leagues_forming_decision_desc: "Protestanci w Świętym Cesarstwie Rzymskim padają ofiarą inkwizycji, jawnej wrogości i dyskryminacji ze strony samej korony cesarskiej. Brakuje im jednak odwagi i siły, by chwycić za broń i przeciwstawić się doznawanym niesprawiedliwościom.\nNadszedł czas, by opowiedzieć się po stronie reformacji i oficjalnie ogłosić, że będziemy wspierać oraz chronić protestantów w Świętym Cesarstwie Rzymskim."
 swe_provoke_religious_leagues_forming_decision_tt: "Sojusznik wyznający religię §Yprotestancką§!, będący członkiem §YŚwiętego Cesarstwa Rzymskiego§! i zarazem §Yelektorem§! lub posiadający łączny rozwój równy co najmniej §Y100§! (wliczając poddanych), otrzyma wydarzenie „§YProklamacja [Root.Monarch.GetTitle] [Root.Monarch.GetName]§!”."
 swe_provoke_religious_leagues_forming_decision_ct: "Każde §Ykatolickie§! państwo w §YEuropie§! uzna to za akt wrogości religijnej, a jego opinia o nas spadnie o §R100§! punktów."
 norse_flexible_deity_decision_title: "Ponownie wybierz bóstwo osobiste"
 norse_flexible_deity_decision_desc: "Bogowie są wszędzie. Są powietrzem, którym oddychamy, i ziemią, po której stąpamy. Są toporem, którym walczymy, i wodą, z którą płyniemy.\nW religii politeistycznej takiej jak nasza wybór jednego spośród wielu wspaniałych bogów, któremu chce się poświęcić szczególną cześć, nie jest łatwy. Często wraz z biegiem życia zmieniają się również nasze przekonania. Na szczęście nasi kapłani utrzymują łączność z bogami i pozwalają naszemu [Root.Monarch.GetTitle] zmienić osobiste bóstwo opiekuńcze."
 norse_restore_the_uppsala_temple_title: "Odbuduj świątynię w Uppsali"
 norse_restore_the_uppsala_temple_desc: "Świątynia w Uppsali była jednym z najważniejszych świętych miejsc naszej wiary. Przeklęci chrześcijanie najechali jednak te ziemie i doszczętnie ją spalili.\nMusimy przywrócić świątyni dawną świetność w imię bogów!"
 norse_gain_norse_missions_title: "Ścieżka religijna państwa [Root.GetName]"
 norse_gain_norse_missions_desc: "Niegdyś byliśmy gorliwymi chrześcijanami.\nGłupcy! Byliśmy głupcami, gdy pluliśmy w twarze naszym bogom! Musimy radykalnie przemyśleć naszą ścieżkę religijną i natychmiast powrócić do chwały wiary nordyckiej!"
 swe_defeated_denmark_alone: "Szacunek wobec szwedzkiej potęgi"
 swe_abandoned_the_reformation: "Porzucenie reformacji"
 swe_betrayed_our_faith: "Zdrajca naszej wiary"
 swe_betrayed_the_holy_see: "Zdrada Stolicy Apostolskiej"
 swe_refused_to_support_independence: "Odmowa poparcia naszej niepodległości"
 dan_refused_to_support_independence: "Odmowa poparcia niepodległości naszego poddanego"
