 flavor_lit.19.t: "Powstanie Chmielnickiego"
 flavor_lit.19.d: "Najbardziej niepokorne elementy naszego dworu, Kozacy stanowiący trzon naszej ruchomej armii, wystosowali ultimatum do najwyższej władzy ziem. Ostatnie wydarzenia w sprawach dworskich bardzo niezadowoliły ich hetmanów i teraz ośmielają się żądać swojej niezależności. Ich dążenia do niepodległości karmią się nierealnym marzeniem, które doprowadziło do utworzenia na Rusi Hetmanatu Kozackiego. Jeśli ich żądania nie zostaną spełnione, grożą popełnieniem okrucieństw i grabieży na całym naszym terenie."
