 NSU_ADJ: "północnomorski"
 hsa_gateway_to_east_title: "Brama na Wschód"
 hsa_gateway_to_east_desc: "Ryga od zawsze była naszym partnerem. Umocnijmy nasze więzi w wybrany przez nas sposób i rozszerzmy wpływy na wodach Bałtyku."
 hsa_st_peterhof_depot_title: "Skład w Petershofie"
 hsa_st_peterhof_depot_desc: "Utrzymanie hegemonii handlowej na morzach Europy Północnej nie jest łatwym zadaniem. Niegdyś zarządcy Nowogrodu kłaniali się przed naszymi ogromnymi wpływami. Być może powinniśmy przypomnieć im, dlaczego muszą okazywać nam szacunek."
 hsa_peace_vordingborg_title: "Pokój w Vordingborgu"
 hsa_peace_vordingborg_desc: "W 1435 roku król Danii został zmuszony do oddania niemieckim kupcom z Lubeki monopolu na swoich rynkach. Rozsądnie byłoby ponownie potwierdzić warunki tego traktatu w wybrany przez nas sposób."
 hsa_herring_migration_title: "Wędrówka śledzi"
 hsa_herring_migration_desc: "Targi rybne w Lund okazały się dochodowym przedsięwzięciem dla naszych duńskich sąsiadów. Utworzenie podobnego targowiska po drugiej stronie Sundу z pewnością przyniosłoby zyski!"
 hsa_markets_bryggen_title: "Targowiska Bryggen"
 hsa_markets_bryggen_desc: "Wybrzeża Norwegii są zawsze pełne kupców i podróżnych przewożących towary do portów Morza Północnego i z powrotem. Otwarcie kantorów w Bryggen pozwoliłoby jeszcze bardziej umocnić naszą obecność w węźle handlowym."
 hsa_organize_hanseatic_diets_title: "Zorganizować zjazdy hanzeatyckie"
 hsa_organize_hanseatic_diets_desc: "U szczytu potęgi Związek Hanzeatycki zrzeszał setki kupców, gildii i członków w całych Niemczech oraz nad Bałtykiem, sięgając aż po Nowogród i Londyn. Choć utraciliśmy dawny blask, musimy zachować i poprawić sprawność naszej administracji oraz utrzymać członków ligi w ryzach."
 hsa_wards_city_title: "Okręgi gildyjne"
 hsa_wards_city_desc: "Zakładanie kantorów w obcych państwach i na rynkach całej Europy to dopiero pierwszy krok ku odzyskaniu prestiżu. Aby zapewnić prawidłowe funkcjonowanie naszych zagranicznych kantorów, powołajmy starszych i nadzorców, którzy będą sprawować nad nimi pieczę."
 hsa_restore_visby_title: "Odbudować Visby"
 hsa_restore_visby_desc: "Wyspa Gotlandia, której ważnym ośrodkiem jest Visby, mieściła niegdyś rozległy kompleks kantorów Związku Hanzeatyckiego. Odzyskanie tych ziem pozytywnie wpłynie na naszą siłę handlową na Bałtyku."
 hsa_induct_danzig_ports_title: "Włączyć porty Gdańska"
 hsa_induct_danzig_ports_desc: "Gdańsk jest prawdopodobnie najważniejszym miastem we wschodniej części Morza Bałtyckiego. Nasi kupcy niegdyś zgromadzili na jego nabrzeżach ogromne bogactwa. Odzyskanie tam przyczółka z pewnością poprawiłoby nasz dobrobyt i stan skarbca."
 hsa_royal_prussia_title: "Prusy Królewskie"
 hsa_royal_prussia_desc: "Księstwo Pruskie utraciło łaskę Boga. To, co niegdyś było dumnym zakonem katolickim, stało się zwykłym pionkiem nieudolnego przywództwa i sąsiednich monarchów. Rozsądnie byłoby interweniować i uratować tamtejszą ludność przed tyranią."
 hsa_expand_market_square_title: "Rozbudować Altstadt"
 hsa_expand_market_square_desc: "Lubeka nie jest małym miasteczkiem rolniczym. Jej część została specjalnie rozbudowana, by ułatwić działalność licznym kupcom przybywającym z całej Europy. Budowa odpowiedniego rynku i rozbudowa Starego Miasta z pewnością umocniłyby naszą kontrolę nad rodzimym węzłem handlowym Lubeki."
 hsa_impose_lubeck_law_title: "Narzuć prawo lubeckie"
 hsa_impose_lubeck_law_desc: "Prawo lubeckie zapewniało samorządność i samodzielną administrację miejską, nie znosząc jednak zależności od zwierzchnika — biskupa, księcia, króla, a w przypadku Lubeki cesarza. Przyznawało miastom pewien stopień autonomii i samodzielności w sprawach ustawodawczych, sądowniczych i wykonawczych. Aby zapewnić sprawną i prawidłową współpracę członków naszej ligi handlowej, musimy ostrożnie podchodzić do ich swobód i autonomii."
 hsa_tend_towns_title: "Zadbać o miasta"
 hsa_tend_towns_desc: "Zagarnianie całego bogactwa dla siebie nie jest jedynym sposobem na zwiększenie naszych wpływów w poszczególnych węzłach handlowych. Niezależnie od tego, czy rozdzielimy pieniądze i sfinansujemy rozwój członków ligi, czy też postanowimy wzbogacić samych siebie, droga do chwały i potęgi wymaga zapłacenia złotem."
 hsa_develop_mineral_trade_title: "Rozwinąć handel surowcami mineralnymi"
 hsa_develop_mineral_trade_desc: "Europę dotknął kryzys kruszcowy. Niedobór cennych minerałów, takich jak złoto i srebro, przyczynił się do upadku wielu zamożnych kupców na całym kontynencie, w tym również naszych. Aby złagodzić sytuację, musimy nawiązać współpracę z Europejczykami mającymi dostęp do cennych kruszców, zdobyć je dla siebie lub pomóc Goslarowi w opracowaniu nowych metod odnowienia starych kopalń."
 hsa_young_men_lubeck_title: "Młodzieńcy z Lubeki"
 hsa_young_men_lubeck_desc: "System poboru organizowany przez Hanzę obejmuje wszystkich zdolnych do służby chłopów z całej naszej ligi handlowej. Aby chronić republiki i pozostałych członków związku oraz bronić mieszkańców naszych ziem, naprzód, młodzieńcy z Lubeki!"
 hsa_grinning_steers_head_title: "Uśmiechnięta głowa wołu"
 hsa_grinning_steers_head_desc: "Księstwo Meklemburgii zbyt długo zachowuje niepodległość. Podbój wybrzeży na wschód od naszego miasta ułatwi dalszą ekspansję w Świętym Cesarstwie Rzymskim."
 hsa_along_sea_title: "Wzdłuż morza"
 hsa_along_sea_desc: "Na wybrzeżach Pomorza wielu osławionych korsarzy znalazło bezpieczną przystań dla swojej nielegalnej działalności. Nie możemy pozwolić, by te szkodniki nadal łupiły na Bałtyku ciężko zarobione pieniądze naszych kupców!"
 hsa_double_entry_bookkeeping_title: "Księgowość podwójna"
 hsa_double_entry_bookkeeping_desc: "Różne osiągnięcia w dziedzinie biznesu i handlu okazały się cenne dla ogromnego wzrostu bogactwa na Półwyspie Apenińskim. Jeśli chcemy dotrzymać kroku konkurencji, rozsądnie będzie przyjąć te same rozwiązania."
 hsa_queens_hall_title: "Sala Królowej"
 hsa_queens_hall_desc: "Wydawanie wyroków i zarządzanie ligą nie jest łatwym zadaniem. Dlatego powinniśmy przeznaczyć środki na wzniesienie centralnego sądu, który będzie zajmował się bieżącymi sprawami Hanzy i jej członków."
 hsa_construct_holstentor_title: "Wznieść Bramę Holsztyńską"
 hsa_construct_holstentor_desc: "Rozbudowa wielkiej sieci handlowej z pewnością przyniesie nam ogromne bogactwo i potęgę. Oznacza jednak również, że będziemy ścierać się z konkurentami i rywalami zarówno na rynkach, jak i na polach bitew. Aby chronić nasz lud i zyski, musimy bronić serca Hanzy!"
 hsa_new_system_trade_title: "Nowy system handlu"
 hsa_new_system_trade_desc: "Wprowadźmy zasady i przepisy wymierzone w konkurencyjnych kupców, którzy nie posiadają pieczęci Republikańskiej Ligi Hanzeatyckiej, a przy okazji pośrednio wzmocnijmy naszych własnych handlarzy."
 hsa_queen_of_the_hansa_title: "Królowa Hanzy"
 hsa_queen_of_the_hansa_desc: "Żadne państwo na wszystkich rynkach Europy Północnej nie ma większej potęgi, wpływów ani bogactwa niż my. Nadszedł czas, by scentralizować Związek Hanzeatycki i rozpocząć nową epokę handlu oraz dyplomacji, wkraczając w wielką niewiadomą."
 hsa_secure_salt_road_title: "Zabezpieczyć szlak solny"
 hsa_secure_salt_road_desc: "Handel rybami przez Sund i Półwysep Jutlandzki jest niewątpliwie ważny. Jednak zabezpieczenie produkcji soli na naszej południowej granicy i ewentualna współpraca z Hamburgiem przyniosą ogromne korzyści."
 hsa_flow_trade_title: "Przepływ handlu"
 hsa_flow_trade_desc: "Terytoria w dolinach Wezery na zachód od nas znajdują się pod słabym przywództwem. Powinniśmy ingerować w lokalną politykę i uwolnić mieszkańców od nieudolnych i nieefektywnych rządów."
 hsa_appoint_war_minister_title: "Powołać ministra wojny"
 hsa_appoint_war_minister_desc: "Wojna się zmieniła. Dawne, słabo wyposażone armie z poboru, złożone głównie z chłopów i kiepsko wyszkolonych ludzi, ustępują miejsca odpowiednio wyszkolonym siłom zbrojnym i armiom stałym. Aby rozwiać obawy dworu dotyczące spraw wojskowych, musimy powołać ministra wojny i przejąć kontrolę nad zmodernizowanym wojskiem."
 hsa_finance_guilds_title: "Sfinansować gildie"
 hsa_finance_guilds_desc: "Gildie Lubeki są siłą napędową naszej gospodarki. Musimy podjąć niezbędne działania, by zapewnić im odpowiednie finansowanie w całej naszej lidze handlowej."
 hsa_develop_handsflotte_title: "Rozbudować Handelsflotte"
 hsa_develop_handsflotte_desc: "Sprawna marynarka wojenna to dobry pierwszy krok dla republiki, która pragnie zapanować nad morskimi szlakami Europy. Teraz powinniśmy sfinansować rozbudowę naszej floty i chronić handel."
 hsa_charter_north_america_title: "Uzyskać prawa do Ameryki Północnej"
 hsa_charter_north_america_desc: "Ziemie za Oceanem Atlantyckim kryją wiele możliwości handlowych i źródeł zysku! Musimy je zbadać, sporządzić ich mapy i jak najlepiej wykorzystać, aby pomnożyć zyski z egzotycznych towarów i nowych cywilizacji."
 hsa_imperial_allegience_title: "Wierność cesarzowi"
 hsa_imperial_allegience_desc: "Stoimy u progu wyjątkowego układu prawnego dotyczącego naszych stosunków z cesarzem. Członkowie stanów bezpośrednio podległych Cesarstwu mają bezpośredni kontakt z cesarzem w sprawach dyplomacji i wojny. Musimy wykorzystać te wpływy, by zgłosić roszczenia do ziem Holsztynu i północnej części Cesarstwa."
 hsa_pen_sword_title: "Pióro i miecz"
 hsa_pen_sword_desc: "Podbój księstw Szlezwiku i Holsztynu nie jest łatwym zadaniem. Powinniśmy wykorzystać nasze cesarskie wpływy w Świętym Cesarstwie Rzymskim i zgłosić roszczenia do tych ziem, zanim sam cesarz zażąda ich dla siebie."
 hsa_bypass_sound_toll_title: "Obejść opłatę sundzką"
 hsa_bypass_sound_toll_desc: "Opłata sundzka pobierana na Zelandii od dawna jest dla nas solą w oku. Obciąża przepływające okręty i nieduńskich kupców przewożących towary przez cieśninę. Musimy podjąć odpowiednie kroki, by ograniczyć jej wpływ."
 hsa_tame_north_sea_title: "Poskromić Morze Północne"
 hsa_tame_north_sea_desc: "Za cieśninami Kattegatu rozciąga się Morze Północne. To ważny węzeł dla statków przewożących towary z całej Europy i spoza niej. Monopol na tym akwenie pozwoliłby nam ukierunkowywać handel i wpływać na jego przepływ do naszych rodzimych rynków."
 hsa_expand_admiralty_title: "Rozbudować admiralicję"
 hsa_expand_admiralty_desc: "Dowództwo na morzach musi pozostać w pewnych rękach admiralicji hanzeatyckiej. Rozbudowa potężnej floty i powiększenie lubeckich doków przyciągną lepszych i bardziej kompetentnych ludzi, którzy staną na czele naszych okrętów."
 hsa_schiffbauer_gilde_title: "Gildia szkutników"
 hsa_schiffbauer_gilde_desc: "Co sprawia, że nasze rodzinne miasto słynie ze znakomitych szkutników w całej Europie Północnej? Oczywiście nasze stocznie! Czy jest lepszy sposób na uczczenie kunsztu naszych budowniczych okrętów i wyjątkowych jednostek niż sfinansowanie przemysłu stoczniowego?"
 hsa_marine_pilots_title: "Piloci morscy"
 hsa_marine_pilots_desc: "Nawigacja na morzach nie jest łatwym zadaniem. Aby zapewnić jak największe bezpieczeństwo naszym ładunkom i okrętom, musimy szkolić lepszych admirałów i kapitanów — słynnych „pilotów morskich” z Lubeki — którzy będą prowadzić nasze jednostki i doprowadzać je do celu w jednym kawałku."
 hsa_eagle_of_lubeck_title: "Orzeł Lubeki"
 hsa_eagle_of_lubeck_desc: "Wielki okręt flagowy na czele naszych sił morskich sprawi, że nasi wrogowie i rywale będą drżeć ze strachu! Nadszedł czas, by wykorzystać naszą przewagę nad morzem!"
 hsa_peterhof_depot_modifier: "Stacja handlowa w składzie Petershof"
 hsa_permitted_kontor_modifier: "Dozwolony kantor"
 hsa_lubeck_herring_market_modifier: "Targ śledziowy w Lubece"
 desc_hsa_lubeck_herring_market_modifier: "Nowy targ śledziowy na wybrzeżu naszego miasta jest pełen możliwości handlowych."
 hsa_lubeck_herring_market_modifier2: "Rozbudowany targ śledziowy w Lubece"
 desc_hsa_lubeck_herring_market_modifier2: "Nowy targ śledziowy na wybrzeżu naszego miasta jest pełen możliwości handlowych."
 hsa_bryggen_kontor_modifier: "Kantor w Bryggen"
 desc_hsa_bryggen_kontor_modifier: "Nasze kantory w głównych miastach wschodniej Skandynawii zapewniają nam znaczną przewagę kupiecką."
 hsa_fresh_administration_modifier: "Odświeżona administracja"
 desc_hsa_fresh_administration_modifier: "Regularne odnawianie składu naszej administracji daje mieszkańcom pocieszające poczucie przejrzystości działania państwa."
 hsa_longterm_admin_modifier: "Długoterminowa administracja"
 desc_hsa_longterm_admin_modifier: "Przyjęcie modelu stabilnej, długoterminowej administracji pozytywnie wpływa na stabilność naszego państwa."
 hsa_allowed_regional_admin_opinion_modifier: "Dozwolona administracja regionalna"
 hsa_diplomatic_powerhouse: "Potęga dyplomatyczna"
 desc_hsa_diplomatic_powerhouse: "Nasz dwór ma ogromne wpływy w sprawach wewnętrznych i zagranicznych."
 hsa_hanseatic_diets_modifier: "Zjazdy hanzeatyckie"
 desc_hsa_hanseatic_diets_modifier: "Dekrety administracyjne wydawane przez najwyższe sądy mają ogromną moc i są respektowane przez wszystkich."
 hsa_altermanner_modifier: "Powołani rajcy"
 desc_hsa_altermanner_modifier: "Powołanie nadzorców handlu na naszych ziemiach znacznie zwiększyło naszą obecność kupiecką na rynkach, na których prowadzimy działalność."
 hsa_visby_warehouse_modifier: "Magazyn w Visby"
 desc_hsa_visby_warehouse_modifier: "Visby, ważny węzeł szlaków morskich, oferuje teraz więcej miejsca dla kupców, którzy mogą składować i transportować towary z odległych krain."
 hsa_danzig_merchants_in_league_modifier: "Gdańscy kupcy w lidze"
 desc_hsa_danzig_merchants_in_league_modifier: "Nasi kupcy podróżują daleko i szeroko, przewożąc towary od jednego wybrzeża do drugiego i przywożąc do domu znaczne zyski z handlu."
 hsa_influx_of_trade_and_foreigners_modifier: "Napływ kupców i cudzoziemców"
 desc_hsa_influx_of_trade_and_foreigners_modifier: "Liczni kupcy i cudzoziemcy prowadzący interesy na naszych rynkach często przywożą ze sobą wiedzę i umiejętności z odległych krain."
 hsa_mercantile_burgermeister_modifier: "Kupiecki burmistrz"
 desc_hsa_mercantile_burgermeister_modifier: "Lokalny nadzorca dbający o sprawne funkcjonowanie naszych rynków jest niezbędny, by utrzymać konkurencyjność i zyski."
 hsa_guild_burgermeister_modifier: "Gildyjny burmistrz"
 desc_hsa_guild_burgermeister_modifier: "Lokalny nadzorca dbający o sprawne funkcjonowanie naszych linii produkcyjnych i planów budowlanych jest niezbędny, by utrzymać przewagę konkurencyjną."
 hsa_aristocrat_burgermeister_modifier: "Burmistrz arystokrata"
 desc_hsa_aristocrat_burgermeister_modifier: "Powierzając lokalną administrację wpływowemu miejscowemu możnowładcy, możemy zapewnić wyższą jakość usług w sprawach wojskowych."
 hsa_strong_mercantile_union_modifier: "Silny związek kupiecki"
 desc_hsa_strong_mercantile_union_modifier: "Pieczęć Hanzy ma ogromne znaczenie w negocjacjach dotyczących handlu i przedsięwzięć morskich."
 hsa_valuable_mineral_deposits_modifier: "Cenne złoża minerałów"
 desc_hsa_valuable_mineral_deposits_modifier: "Prowincja ta kryje znaczne ilości metali szlachetnych."
 hsa_valuable_mineral_abundance_modifier: "Obfitość cennych minerałów"
 desc_hsa_valuable_mineral_abundance_modifier: "Opodatkowanie wydobycia cennych metali jest bardzo dochodowym sposobem na zwiększenie przychodów i uzyskanie korzystniejszych warunków pożyczek."
 hsa_wealth_of_the_hansa_modifier: "Bogactwo Hansy"
 desc_hsa_wealth_of_the_hansa_modifier: "Udział w Związku Hanzeatyckim jest dla naszego miasta niezwykle dochodowym przedsięwzięciem."
 hsa_recruiting_from_league_modifier: "Rekrutacja wśród członków ligi"
 desc_hsa_recruiting_from_league_modifier: "Wezwaliśmy zdolnych do służby mężczyzn ze wszystkich państw naszej ligi handlowej, by służyli i bronili serca Hanzy."
