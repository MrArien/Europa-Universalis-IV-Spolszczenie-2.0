 teu_seek_imperial_protection_title: "[Root.GetPreviewColorTEU]Szukaj ochrony cesarskiej[Root.GetPreviewColorTEU_end]"
 teu_seek_imperial_protection_desc: "W roku 1225 książę mazowiecki Konrad I z dynastii Piastów zwrócił się do nas o pomoc w walce z pogańskimi Prusami, którzy nie chcieli się nawrócić. Oczywiście nasz zacny zakon szybko rozprawił się z tymi poganami, nawrócił ich na prawdziwą wiarę i pokonał każdego, kto odmawiał jej przyjęcia. Następnie nasz zakon utworzył państwo w Prusach Zachodnich i Wschodnich i kontynuował naszą krucjatę przeciwko pogańskim Litwinom.\nJednakże nasza obecność w Prusach zawsze była cierniem w oku dla Królestwa Polskiego. A nawet Litwini, na których nawracanie poświęciliśmy tyle dekad, dążą do naszej zguby!\n\nChoć Święte Cesarstwo Rzymskie nie jest szczególnie życzliwe dla naszego zakonu, to jednak jest jedyną potęgą, która byłaby gotowa bronić nas przed polskim zagrożeniem."
 teu_livonian_alliance_title: "Sojusz inflancki"
 teu_livonian_alliance_desc: "Zakon inflancki jest drugim zakonem rycerskim założonym nad Bałtykiem. Utworzony w 1202 roku w Rydze, postawił sobie za cel chrystianizację bałtyckich Żmudzinów. Po druzgocącej klęsce w 1236 roku zakon inflancki został sojusznikiem zakonu krzyżackiego i wspólnie nawróciliśmy ziemie bałtyckie na prawdziwą wiarę.\n\nPowinniśmy odbudować z nim sojusz, abyśmy mogli wzajemnie wspierać się w przyszłych trudnych czasach."
 teu_livonian_alliance_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli jesteśmy sojusznikiem §YZakonu Inflanckiego§!, uruchomi się wydarzenie „§YZjednoczenie zakonów?§!”.\n\nJeśli rywalizujemy z §YZakonem Inflanckim§!, otrzymamy przeciwko niemu casus belli §YPodporządkowanie§!.\n\nJeśli §YZakon Inflancki§! nie istnieje, otrzymamy §G100§! punktów siły militarnej."
 teu_strengthen_livonia_title: "Więzi między zakonami"
 teu_strengthen_livonia_desc: "Choć oba nasze państwa są zakonami monastycznymi, interesy zakonu inflanckiego i krzyżackiego rzadko są zbieżne, odkąd nawróciliśmy pogan. Nasz sojusz z Inflantczykami nie jest więc pewny. Powinniśmy wzmocnić naszą pozycję w zakonie inflanckim, poprawiając z nim stosunki dyplomatyczne lub podporządkowując go sobie."
 teu_strengthen_livonia_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy tę misję, gdy §YZakon Inflancki§! jest naszym poddanym, otrzymamy modyfikator „§YZjednoczony zakon§!”, zapewniający następujące efekty:\nSzybkość odzyskiwania siły żywej: §G+10,0%§!\nRoczna tradycja armii: §G+0,50§!\n\nJeśli ukończymy tę misję, gdy §YZakon Inflancki§! jest naszym sojusznikiem, otrzymamy modyfikator „§YRycerze dyplomaci§!”, zapewniający następujące efekty:\nRelacje dyplomatyczne: §G+1§!\nMiesięczny przyrost przysług: §G+20,0%§!\n\nJeśli ukończymy tę misję poprzez podbój, otrzymamy modyfikator „§YWładca ziem inflanckich§!”, zapewniający następujące efekty:\nNarodowy modyfikator siły żywej: §G+10,0%§!\nNiepokoje państwowe: §G-1,00§!"
 teu_handle_the_prussian_confederation_title: "Zajmij się konfederacją"
 teu_handle_the_prussian_confederation_desc: "Po naszej klęsce w bitwie pod Grunwaldem w 1410 roku nasz zakon rycerski został zmuszony do wypłacenia odszkodowań wojennych królowi Polski. Ponieważ doprowadziło nas to na skraj bankructwa, wielki mistrz musiał zrobić to, co konieczne: podnieść podatki stanom i miastom.\nStany — zwłaszcza mieszczanie — były oczywiście oburzone. Ostatecznie w 1440 roku zebrały się w pruskim mieście Elblągu i założyły Związek Pruski. Od tego czasu konfederacja sabotuje nasz zakon, wspierając finansowo naszego największego wroga — Królestwo Polskie.\nJeśli chcemy przetrwać, musimy zająć się tą konfederacją."
 teu_handle_the_prussian_confederation_tt: "Uruchomiło się wydarzenie „§YPowstanie konfederacji pruskiej§!”."
 teu_defeat_the_poles_title: "Pokonaj Polskę"
 teu_defeat_the_poles_desc: "Królestwo Polskie zmaga się z nami już od stulecia. Musimy im pokazać, że nie mogą nam już zagrażać! Musimy ich pokonać na otwartym polu i zilustrować ich brak mocy w porównaniu z naszą wielkością!"
 teu_defeat_the_poles_tt: "§YOdblokuj resztę drzewka misji.§!"
 teu_build_to_force_limit_title: "Rozbuduj naszą armię"
 teu_build_to_force_limit_desc: "Wojny z Polską i Litwą w latach 1409–1411 oraz 1431–1435 zdziesiątkowały nasze wojsko i osłabiły nas przed kolejnym nieuniknionym konfliktem z Polską. Musimy jak najszybciej rozbudować armię i zwerbować nowych żołnierzy."
 teu_pru_teutonic_order_and_the_empire_title: "[Root.GetPreviewColorTEU]Zakon i Cesarstwo[Root.GetPreviewColorTEU_end]"
 teu_pru_teutonic_order_and_the_empire_desc: "Przystąpienie do Świętego Cesarstwa Rzymskiego rozpatrywaliśmy nie ze względu na naszą miłość do innych germańskich królestw, ale dla własnej ochrony przed przymierzem polsko-litewskim. Teraz, gdy pokonaliśmy Polskę, zagrożenie, jakie stanowili dla nas, już nie ma racji bytu.\nNadszedł czas, aby zebrać posiadłości i doradców w celu ponownej rewizji naszego politycznego stanowiska wobec Świętego Cesarstwa Rzymskiego."
 teu_pru_conquer_brandenburg_title: "[Root.GetPreviewColorTEU_PRU]Podbij margrabstwo[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_conquer_brandenburg_desc: "Margrabstwo Brandenburgii jest jednym z militarnie sprawniejszych państw północnych Niemiec. Jego armia zahartowała się w wojnach ze słowiańskimi plemionami u zarania Świętego Cesarstwa Rzymskiego.\nChoć tamte czasy dawno minęły, siły Brandenburgii nadal są groźne. Powinniśmy podbić jej ziemie i włączyć jej wojsko do naszych sił zbrojnych."
 teu_pru_conquer_silesia_title: "[Root.GetPreviewColorTEU_PRU]Ślązacy i Serbołużyczanie[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_conquer_silesia_desc: "Ziemie Śląska i Łużyc zamieszkują odpowiednio Ślązacy i Serbołużyczanie. Choć nie są oni Niemcami, ich słowiańskie pochodzenie czyni ich potencjalnymi sojusznikami Korony Polskiej - i zagrożeniem dla naszej władzy w Niemczech. Powinniśmy przejąć te ziemie sami i zintegrować je z naszym społeczeństwem, zanim nasi rywale zaczną ich wspierać przeciwko nam."
 teu_pru_conquer_silesia_at: "Żadna prowincja w regionach §YPółnocnych Niemiec§! i §YPolski§! nie ma kultury §Yśląskiej§!."
 teu_pru_conquer_silesia_bt: "Żadna prowincja w regionach §YPółnocnych Niemiec§! i §YPolski§! nie ma kultury §Yłużyckiej§!."
 teu_pru_unite_the_saxons_title: "[Root.GetPreviewColorTEU_PRU]Zjednocz Sasów[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_unite_the_saxons_desc: "Sasi we wschodniej części Niemiec są podzieleni na kilka mniejszych księstw, które zajmują się wzajemnymi walkami. Powinniśmy zjednoczyć tych ludzi, kończąc ich spory i włączając ich do naszego państwa."
 teu_pru_push_into_southern_germany_title: "[Root.GetPreviewColorTEU_PRU]Rozszerz wpływy na południowe Niemcy[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_push_into_southern_germany_desc: "Podbój północnych Niemiec znacznie zwiększył naszą potęgę i wpływy w Europie Środkowej, lecz południowa część Niemiec nadal wymyka się spod naszej kontroli. Nadszedł czas, by wkroczyć do południowych Niemiec i podporządkować sobie rozdrobnione tam państwa."
 teu_pru_an_empire_of_blood_and_iron_title: "[Root.GetPreviewColorTEU_PRU]Imperium krwi i żelaza[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_an_empire_of_blood_and_iron_desc: "Święte Cesarstwo Rzymskie jest słabe i zbyt zdecentralizowane, by chronić interesy narodu niemieckiego. Niemcy potrzebują silnego mocarstwa, które obroni ich przed obcymi potęgami. Zjednoczenia nie osiągnie się jednak przemówieniami i głosowaniem większości, lecz krwią i żelazem."
 teu_pru_an_empire_of_blood_and_iron_tt: "Znajduje się w jednej z §Ywyróżnionych§! prowincji w §Ypołudniowych Niemczech§!, §Ypółnocnych Niemczech§! lub na §YŚląsku§!."
 teu_pru_push_into_pomarania_title: "[Root.GetPreviewColorTEU_PRU]Przejmij Pomorze[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_push_into_pomarania_desc: "Nasi zachodni sąsiedzi, Pomorzanie, są potomkami ludów, które niegdyś zamieszkiwały ziemie pruskie. Mówi się, że nadal pragną zemsty za działania dawnych rycerzy z 1225 roku i późniejszych lat. Powinniśmy rozszerzyć nasze wpływy na zachód i przejąć Pomorze, aby płomień zemsty wreszcie zgasł."
 teu_pru_annex_the_lower_saxons_title: "[Root.GetPreviewColorTEU_PRU]Zaanektuj miasta Hanzy[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_annex_the_lower_saxons_desc: "Kampania wojskowa w Niemczech wymaga zasobów, a przede wszystkim dukatów. Nasza gospodarka jest w stanie utrzymać państwo, lecz nadal nie jest tak silna, jak mogłaby być. Miasta Dolnej Saksonii należą do Hanzy, a zatem są ważnymi ośrodkami handlu i wymiany towarowej. Powinniśmy je zaanektować i wykorzystać potencjał hanzeatyckich kupców."
 pru_merchants_of_the_hansa: "Kupcy hanzeatyccy"
 teu_pru_annex_the_lower_saxons_tt: "Otrzymujemy dochód handlowy z okresu §G2 lat§!."
 teu_pru_annex_western_germany_title: "[Root.GetPreviewColorTEU_PRU]Podbij Westfalię[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_annex_western_germany_desc: "Westfalia jest centrum produkcji tekstyliów w zachodnich Niemczech. Rozsądnie byłoby podbić ten region i rozbudować infrastrukturę włókienniczą, aby zarówno ulepszyć mundury naszej armii, jak i zwiększyć zasoby skarbca."
 teu_pru_annex_western_germany_tt: "z produkcji w Westfalii i Fryzji Wschodniej."
 teu_pru_take_over_northern_germany_title: "[Root.GetPreviewColorTEU_PRU][Root.GetAdjective] Nadrenia[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_take_over_northern_germany_desc: "Nadrenia jest regionem, o który rywalizuje wiele wielkich mocarstw pragnących rozszerzyć swoje wpływy w Niemczech. Lepiej, by te ziemie znalazły się pod naszym panowaniem, niż miałyby stać się terytorium obcego mocarstwa."
 teu_pru_develop_the_country_title: "[Root.GetPreviewColorTEU]Rozwiń Prusy[Root.GetPreviewColorTEU_end]"
 teu_pru_develop_the_country_desc: "Nasze pruskie ziemie macierzyste są żyzne i mogą utrzymywać silną lokalną gospodarkę. Jednak dawne wojny z Polską i Litwą zmusiły nas do zaniedbania tego obszaru. Teraz wreszcie nadszedł czas, by nadrobić zaległości."
 teu_pru_reform_the_state_title: "[Root.GetPreviewColorTEU]Zreformuj państwo[Root.GetPreviewColorTEU_end]"
 teu_pru_reform_the_state_desc: "Nasze prawa i rząd muszą odzwierciedlać charakter naszego narodu. Uchwalona zostanie seria reform, które przekształcą państwo w dobrze naoliwiony aparat rządowy."
 teu_pru_an_absolute_kingdom_title: "[Root.GetPreviewColorTEU]Państwo absolutne[Root.GetPreviewColorTEU_end]"
 teu_pru_an_absolute_kingdom_desc: "Państwo podzielone na feudalne domeny i stany, które prowadzą wewnętrzne walki o władzę, jest skazane na upadek. Aby osiągnąć wielkość, nasze państwo musi uznać wyłącznie absolutną władzę naszego [Root.Monarch.GetTitle]."
 teu_pru_an_absolute_kingdom_tt: "Ukończ katastrofę „§YDwór i państwo§!” z wynikiem „§YZłamana władza lokalna§!” lub „§YWzmocniona władza centralna§!” albo osiągnij §Yepokę rewolucji§!."
 teu_pru_prussian_enlightenment_title: "[Root.GetPreviewColorTEU]Oświecone państwo[Root.GetPreviewColorTEU_end]"
 teu_pru_prussian_enlightenment_desc: "Lud naszego państwa nie jest głupi. Kwestionuje sens absolutnej władzy, a nawet samą ideę monarchii i teokracji. Niektórzy mogą obawiać się tych pytań, ponieważ zapowiadają kres ich panowania. My jednak powinniśmy przyjąć idee oświecenia i uzasadniać nasze rządy nie tylko łaską samego Pana, lecz także logiką i świadomością."
 teu_pru_crush_the_republics_title: "[Root.GetPreviewColorTEU]Rozpraw się z rewolucją[Root.GetPreviewColorTEU_end]"
 teu_pru_crush_the_republics_desc: "Rewolucja dotarła do Europy. Monarchowie obawiają się o swoją władzę, podczas gdy mieszczanie świętują. Dawne królestwa stają się teraz narodami.\nMusimy jasno określić nasze stanowisko wobec rewolucji i zdecydować, czy ją poprzeć, czy zdławić."
 teu_pru_develop_konigsberg_title: "[Root.GetPreviewColorTEU]Rozbuduj [41.GetName][Root.GetPreviewColorTEU_end]"
 teu_pru_develop_konigsberg_desc: "[41.GetName] jest jednym z najważniejszych miast Prus, obok [43.GetName]. Dzięki swojemu położeniu stanowi znaczący ośrodek handlu i przyciąga kupców, uczonych oraz mieszczan. Powinniśmy rozbudować miasto i uczynić z niego naszą wspaniałą stolicę."
 teu_pru_army_reforms_title: "[Root.GetPreviewColorTEU]Zreformuj armię[Root.GetPreviewColorTEU_end]"
 teu_pru_army_reforms_desc: "Dyscyplina oddziela armię od motłochu. Musimy zapewnić, by nasi żołnierze byli dobrze wyszkoleni, dobrze wyposażeni, a przede wszystkim zdyscyplinowani."
 teu_pru_disciplined_army_title: "[Root.GetPreviewColorTEU][Root.GetNobilityOrFallbackName] i wojsko[Root.GetPreviewColorTEU_end]"
 teu_pru_disciplined_army_desc: "Jest oczywiste, że nie możemy pozwolić, by naszymi armiami dowodził jakiś chłop, który twierdzi, że przeczytał chińską księgę o wojnie. Musimy zadbać o to, by stan [Root.GetNobilityOrFallbackName] był gotowy do służby w charakterze generałów naszej armii."
 teu_pru_proof_of_strength_title: "[Root.GetPreviewColorTEU]Dowód siły[Root.GetPreviewColorTEU_end]"
 teu_pru_proof_of_strength_desc: "Zreformowana armia nie spełnia swojej roli, jeśli nie sprawdzi się w ogniu wojny. Powinniśmy przetestować nasze taktyki, siłę żywą i wyposażenie na polu bitwy oraz udowodnić, że nasza armia poradzi sobie z każdym wrogiem."
 teu_pru_proof_of_strength_tt: "Straciło w walce co najmniej §Y60 000§! żołnierzy przeciwko państwu §Y[Root.GetName]§!."
 teu_pru_proof_of_strength_bt: "Ma co najmniej tyle samo łącznego rozwoju co państwo §Y[Root.GetName]§!."
 teu_pru_proof_of_strength_ct: "Żadne inne państwo nie ma większego limitu sił zbrojnych ani rozwoju niż państwo §Y[Root.GetName]§!."
 teu_pru_an_army_with_a_state_title: "[Root.GetPreviewColorTEU]Armia i państwo[Root.GetPreviewColorTEU_end]"
 teu_pru_an_army_with_a_state_desc: "Mniejsze państwa mają armię. Nasza armia będzie miała własne państwo."
 teu_pru_vassalize_brandenburg_title: "[Root.GetPreviewColorTEU_PRU]Podporządkuj Brandenburgię[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_vassalize_brandenburg_desc: "Margrabstwo Brandenburgii jest jednym z militarnie sprawniejszych państw północnych Niemiec. Jego armia zahartowała się w wojnach ze słowiańskimi plemionami u zarania Świętego Cesarstwa Rzymskiego.\nJednak jeszcze bardziej interesująca jest rola Brandenburgii w Cesarstwie. Jako jeden z nielicznych elektorów jej władca może głosować na kolejnego cesarza. Jeśli chcemy sami zdobyć tę godność, najpierw musimy podporządkować sobie margrabstwo."
 teu_pru_become_an_elector_title: "[Root.GetPreviewColorTEU_PRU]Zdobądź godność elektora[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_become_an_elector_desc: "W przeciwieństwie do wielu innych imperiów w historii Święte Cesarstwo Rzymskie nie wybiera następcy na podstawie dziedziczenia, lecz w drodze elekcji. Jeśli chcemy kształtować wewnętrzną politykę Cesarstwa, musimy zostać jednym z siedmiu elektorów cesarskich."
 teu_pru_the_religious_war_title: "[Root.GetPreviewColorTEU_PRU]Przystąp do wojny lig religijnych[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_the_religious_war_desc: "Reformacja rozprzestrzenia się w Świętym Cesarstwie Rzymskim niczym pożar. Jest oczywiste, że doprowadzi to do wojny o nieprzewidywalnych rozmiarach. Powinniśmy opowiedzieć się po jednej ze stron i szybko poprowadzić ją do zwycięstwa!"
 teu_pru_30_years_war_tt: "Każde państwo wyznające religię §Y[Root.Religion.GetName]§! w Świętym Cesarstwie Rzymskim zyskuje §G150§! punktów opinii o nas."
 teu_pru_30_years_war_at: "Każde państwo wyznające religię §Y[Root.Religion.GetName]§! w Świętym Cesarstwie Rzymskim zyskuje §G150§! punktów opinii o nas, jeśli byliśmy po stronie zwycięskiej w §Ywojnie lig religijnych§!."
 teu_pru_become_emperor_title: "[Root.GetPreviewColorTEU_PRU]Zdobądź cesarską koronę[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_become_emperor_desc: "Cesarz Świętego Cesarstwa Rzymskiego kieruje sprawami państwowymi Cesarstwa, broni go przed zagrożeniami zewnętrznymi i wewnętrznymi oraz czerpie siłę żywą i bogactwo od jego członków. Obecny cesarz jest słaby i korzysta z bogactw Cesarstwa, nie potrafiąc jednocześnie chronić interesów jego członków. Nadszedł czas, byśmy sami zdobyli cesarską koronę!"
 teu_pru_unite_the_empire_title: "[Root.GetPreviewColorTEU_PRU]Zjednocz Święte Cesarstwo Rzymskie[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_unite_the_empire_desc: "W obecnym kształcie Cesarstwo jest co najwyżej marną karykaturą imperium. Jeśli naród niemiecki kiedykolwiek ma dorównać pozostałym wielkim mocarstwom Europy, trzeba zjednoczyć go pod władzą jednego państwa."
 teu_pru_improve_diplomatic_skills_title: "[Root.GetPreviewColorTEU_PRU]Rozwiń nasze umiejętności dyplomatyczne[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_improve_diplomatic_skills_desc: "Nasza historia to dzieje zakonu monastycznego, który prowadził wojny z poganami, aby ich nawrócić. Nasze zdolności dyplomatyczne wystarczyły, by Polska nie zaanektowała nas natychmiast po zakończeniu krucjaty. Jednak według standardów Świętego Cesarstwa Rzymskiego nasze umiejętności dyplomatyczne są porównywalne z umiejętnościami barbarzyńców.\nMusimy poprawić naszą dyplomację, aby przetrwać w nowym otoczeniu politycznym."
 teu_pru_improve_diplomatic_skills_tt: "Każdy sojusznik i poddany państwa §Y[Root.GetName]§!, który ma co najmniej §Y150§! punktów opinii, zyskuje §G10§! zaufania do państwa [Root.GetName]."
 teu_pru_secularize_the_state_title: "[Root.GetPreviewColorTEU_PRU]Zsekularyzuj Prusy[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_secularize_the_state_desc: "Choć nasza historia wiąże się z teokratycznym zakonem, nie ulega wątpliwości, że żaden biskup ani zwykły rycerz nie może zostać cesarzem Świętego Cesarstwa Rzymskiego. Musimy przekształcić się w świecką monarchię, która w oczach elektorów będzie godna wyboru na kolejnego cesarza."
 teu_pru_warsaw_and_krakow_title: "[Root.GetPreviewColorTEU_PRU]Kraków i Warszawa[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_warsaw_and_krakow_desc: "Polska ma wiele zamożnych miast o bogatej historii i doskonałej infrastrukturze. Żadne z nich nie może się jednak równać z jej klejnotami — Krakowem i Warszawą. Oba są ważnymi ośrodkami handlu i siedzibami władzy Polski oraz jej poddanego, Mazowsza. Powinniśmy podbić te miasta, aby osłabić Polskę, a jednocześnie wzmocnić naszą własną gospodarkę."
 teu_pru_conquer_poland_title: "[Root.GetPreviewColorTEU_PRU]Podbij Ruś Czerwoną[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_conquer_poland_desc: "Musimy przeć dalej na południe, aby raz na zawsze zneutralizować polskie zagrożenie! Ich ostatni bastion znajduje się na heretyckich ziemiach Rusi Czerwonej."
 teu_pru_conquer_poland_at: "Ten modyfikator zostaje usunięty, jeśli kiedykolwiek zdegradujemy kulturę §Ypolską§! "
 teu_pru_conquer_poland_bt: "Modyfikator zostanie usunięty, jeśli kiedykolwiek zdegradujemy kulturę §Yrusińską§!."
 teu_pru_take_over_moldavia_title: "[Root.GetPreviewColorTEU_PRU]Przejmij Mołdawię[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_take_over_moldavia_desc: "Ziemie mołdawskie są żyznym obszarem znanym z produkcji wina. Stanowią również punkt dostępu Osmanów do Rusi. Powinniśmy zaanektować Mołdawię, aby uniemożliwić Turkom ekspansję w Europie Wschodniej, a przy okazji uzyskać dostęp do wina."
 teu_pru_fortify_the_borders_title: "[Root.GetPreviewColorTEU_PRU]Ufortyfikuj granice[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_fortify_the_borders_desc: "Nasz [Root.GovernmentName] rozciąga się od Bałtyku aż po Morze Czarne. Ze względu na ogrom naszego terytorium graniczymy z wieloma potencjalnymi zagrożeniami, takimi jak Święte Cesarstwo Rzymskie na zachodzie czy Turcy osmańscy na południu."
 teu_pru_fortify_the_borders_ct: "Losowy fort na obszarze §YWielkopolski§!, §YPolski Środkowej§!, §YMałopolski§! lub §YMołdawii§! otrzymuje do końca gry modyfikator „§YUfortyfikowana granica§!”, zapewniający następujące efekty:\nLokalna obronność: §G+50,0%§!\nLokalny rozmiar garnizonu: §G+25,0%§!\nLokalne utrzymanie fortu: §G-90,0%§!\n\nMaksymalnie §Y1§! fort na obszarze może otrzymać ten modyfikator."
 teu_pru_empire_of_the_east_title: "[Root.GetPreviewColorTEU_PRU]Imperium Pruskie[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_empire_of_the_east_desc: "Dzięki podbojowi Polski, Litwy i Rusi nasz [Root.GovernmentName] osiągnął szczyt potęgi, przyćmiewając nawet Święte Cesarstwo Rzymskie.\nMimo to znaczna część naszych ziem pozostaje słabo rozwinięta. Powinniśmy rozbudować infrastrukturę państwa, abyśmy przewyższali Cesarstwo nie tylko wielkością, lecz także jakością! Utwórzmy własne [Root.GetAdjective] imperium!"
 teu_pru_conquer_lithuania_title: "[Root.GetPreviewColorTEU_PRU]Pokonaj Litwę[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_conquer_lithuania_desc: "Nasz [Root.GovernmentName] pozostaje w nieustannym konflikcie z Litwą, odkąd postawiliśmy stopę nad Bałtykiem w 1225 roku. To dzięki naszym wysiłkom Litwini ostatecznie porzucili pogańską wiarę i przyjęli chrześcijaństwo. Nawet wtedy nasza walka z nimi się jednak nie zakończyła.\nNadszedł czas, by raz na zawsze zakończyć spory z Litwinami."
 teu_pru_conquer_lithuania_at: "Modyfikator zostanie usunięty, jeśli kiedykolwiek zdegradujemy kulturę §Ylitewską§!."
 teu_pru_push_into_ruthenia_title: "Rozszerz wpływy na Ruś"
 teu_pru_push_into_ruthenia_desc: "Ruś to rozległy region pełen pól uprawnych i łąk, jak okiem sięgnąć. Litwa podbiła te ziemie hordom, a teraz przyszła kolej na nas."
 teu_pru_teutonic_ruthenia_title: "[Root.GetPreviewColorTEU_PRU]Zaanektuj Ruś[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_teutonic_ruthenia_desc: "Ruś jest niemal całkowicie w naszych rękach. Wystarczy jeszcze kilka kampanii podbojowych, aby cały region został zjednoczony pod naszym sztandarem."
 teu_pru_fortify_dnieper_title: "[Root.GetPreviewColorTEU_PRU]Ufortyfikuj Dniepr[Root.GetPreviewColorTEU_PRU_end]"
 teu_pru_fortify_dnieper_desc: "Moskale wielokrotnie wykazywali zainteresowanie Europą Wschodnią. Jest oczywiste, że chcą rozszerzyć swoje wpływy na zachód i podbić wszystko, co stanie im na drodze. Musimy ufortyfikować Dniepr, aby odeprzeć rosyjską nawałę!"
 teu_pru_fortify_dnieper_tt: "Jest prowincją położoną nad §YDnieprem§!, należy do państwa §Y[Root.GetName]§! lub jego poddanych niebędących państwami trybutarnymi i posiada budynek §Yfortu§! najwyższego poziomu dostępnego przy obecnym poziomie technologii."
 teu_pru_fortify_dnieper_ct: "Maksymalnie §Y5§! prowincji posiadających budynek §Yfortu§! nad Dnieprem otrzymuje do końca gry modyfikator „§YUfortyfikowana granica§!”, zapewniający następujące efekty:\nLokalna obronność: §G+50,0%§!\nLokalny rozmiar garnizonu: §G+25,0%§!\nLokalne utrzymanie fortu: §G-90,0%§!"
 teu_pru_a_prussian_navy_title: "[Root.GetPreviewColorTEU]Utwórz pruską flotę[Root.GetPreviewColorTEU_end]"
 teu_pru_a_prussian_navy_desc: "Choć koncentrujemy się przede wszystkim na walce lądowej, nie ulega wątpliwości, że dominacja na morzu jest równie ważna, jeśli popadniemy w konflikt z Hanzą lub Skandynawią. Powinniśmy utworzyć flotę, która będzie uosabiać nasze najlepsze cechy."
 teu_pru_dominate_baltic_trade_title: "[Root.GetPreviewColorTEU]Chroń handel bałtycki[Root.GetPreviewColorTEU_end]"
 teu_pru_dominate_baltic_trade_desc: "Handel bałtycki jest głównym źródłem naszych dochodów. Musimy chronić go przed kupcami Hanzy i Danii, w przeciwnym razie stracimy zyski."
 teu_pru_strengthen_mercantilism_title: "[Root.GetPreviewColorTEU]Rozbuduj bałtyckie targowiska[Root.GetPreviewColorTEU_end]"
 teu_pru_strengthen_mercantilism_desc: "Hanza i Skandynawowie próbują wypchnąć nas z rynku bałtyckiego. Musimy zbudować targowiska w kluczowych prowincjach i rozwijać nasze centra handlu, aby dotrzymać im kroku."
 teu_pru_strengthen_mercantilism_tt: "Każda prowincja z §Yestuarium§! lub §Ycentrum handlu§! na obszarach §YPrus Zachodnich§!, §YPrus Wschodnich§!, §YŻmudzi§!, §YKurlandii§!, §YInflant§! i §YEstonii§! jest posiadaną i narodową prowincją państwa §Y[Root.GetName]§! oraz posiada budynek §Yhandlowy§!."
 teu_pru_manufactories_for_prussia_title: "[Root.GetPreviewColorTEU]Wznieś manufaktury[Root.GetPreviewColorTEU_end]"
 teu_pru_manufactories_for_prussia_desc: "Imponująca armia wymaga silnej gospodarki. Powinniśmy wznieść w naszym państwie manufaktury, aby gospodarka mogła nadążyć za rozbudową sił zbrojnych."
 teu_pru_manufactories_for_prussia_tt: "z manufaktur zapewniających co najmniej §Y6§! bazowej produkcji."
 teu_pru_employ_advisors_title: "[Root.GetPreviewColorTEU]Kompetentny gabinet[Root.GetPreviewColorTEU_end]"
 teu_pru_employ_advisors_desc: "Państwo [Root.GetName] nie może cały czas polegać na swoim [Root.Monarch.GetTitle]. W końcu nasz [Root.Monarch.GetTitle] jest tylko człowiekiem, a zatem również popełnia ludzkie błędy. Potrzebujemy kompetentnego gabinetu doradców, którzy zapewnią sprawne funkcjonowanie państwa nawet w okresie bezkrólewia."
 teu_crusader_clergy_influence_title: "[Root.GetPreviewColorTEU]Nadaj [Root.GetChurchOrFallbackName_dat] przywileje[Root.GetPreviewColorTEU_end]"
 teu_crusader_clergy_influence_desc: "Nasza krucjata może zakończyć się niepowodzeniem, jeśli własny stan [Root.GetChurchOrFallbackName] nie będzie nas wspierał. Musimy zapewnić sobie jego lojalność i przyznać mu przywileje, aby współpracował z [Root.Monarch.GetTitle]."
 teu_crusader_conquer_novgorod_title: "[Root.GetPreviewColorTEU]Podbij Nowogród[Root.GetPreviewColorTEU_end]"
 teu_crusader_conquer_novgorod_desc: "Nowogród jest bastionem prawosławnej herezji i leży tuż u progu ziem naszych braci, zakonu inflanckiego. Musimy zniszczyć tę plugawą republikę kupiecką i podbić jej terytorium."
 teu_crusader_third_rome_title: "[Root.GetPreviewColorTEU]Upadek Trzeciego Rzymu[Root.GetPreviewColorTEU_end]"
 teu_crusader_third_rome_desc: "Moskiewscy Rusini mają czelność nazywać się dziedzicami Rzymian. Nie obchodzą nas takie niedorzeczne tytuły. Nie możemy jednak zaakceptować ich praktykowania herezji i bezczeszczenia prawdziwej wiary chrześcijańskiej. Tak zwany Trzeci Rzym upadnie dziś z naszej ręki!"
 teu_crusader_third_rome_tt: "Jeśli posiadamy §Y[295.GetName]§!, uruchomi się wydarzenie „§YLos prowincji [295.GetName]§!”.\nW przeciwnym razie otrzymamy §G100§! punktów siły dyplomatycznej."
 teu_crusader_end_the_schism_title: "[Root.GetPreviewColorTEU]Zakończ schizmę[Root.GetPreviewColorTEU_end]"
 teu_crusader_end_the_schism_desc: "Chrześcijaństwo od zbyt dawna jest podzielone z powodu błahych różnic w wierze. Papieże nie widzieli powodu, by je uzdrowić, a głupcy z Cesarstwa Bizantyjskiego byli zbyt zajęci podbojami muzułmanów. To na nas spoczywa obowiązek zakończenia schizmy i wykorzenienia herezji."
 teu_crusader_end_the_schism_tt: "Każde państwo §Yprawosławne§! otrzyma wydarzenie „§YZakon krzyżacki kończy schizmę§!”."
 teu_crusader_land_of_churches_title: "[Root.GetPreviewColorTEU]Wznieś kościoły[Root.GetPreviewColorTEU_end]"
 teu_crusader_land_of_churches_desc: "Nasza krucjata powinna nie tylko nawrócić mieszkańców Europy Wschodniej na prawdziwą wiarę, lecz także zapewnić, że pozostaną wierni katolicyzmowi. Dlatego konieczne jest, aby każda wieś, nawet najmniejsza, posiadała kościół wzniesiony ku chwale papieża."
 teu_crusader_build_cathedrals_title: "[Root.GetPreviewColorTEU]Wznieś katedry[Root.GetPreviewColorTEU_end]"
 teu_crusader_build_cathedrals_desc: "Mówi się, że kościoły są domem Boga, lecz katedry stanowią najwspanialszy wyraz naszej wiary. Dla największej chwały naszego Pana wzniesiemy katedry na naszych ziemiach!"
 teu_crusader_build_cathedrals_tt: "Każda posiadana prowincja z §Ykatedrą§! zapewnia nam §G5§! punktów wpływu papieskiego i otrzymuje na §Y25 lat§! modyfikator „§YKatedra krzyżacka§!”, zapewniający następujące efekty:\nLokalny modyfikator podatków: §G+200,0%§!\nLokalne niepokoje: §G-3,00§!"
 teu_crusader_lithuanian_crusade_title: "[Root.GetPreviewColorTEU]Zaanektuj Litwę[Root.GetPreviewColorTEU_end]"
 teu_crusader_lithuanian_crusade_desc: "W 1225 roku książę mazowiecki Konrad poprosił nas o pomoc w krajach bałtyckich. Naszymi wrogami były pogańskie plemiona bałtyckie, które odmawiały przyjęcia chrześcijaństwa. Jednym z nich byli przodkowie dzisiejszych Litwinów.\nTwierdzą oni, że są teraz wiernymi katolikami, lecz ich zachowanie i agresja wobec nas świadczą o czymś innym. Musimy kontynuować krucjatę przeciwko Litwinom i przejąć ich ziemie!"
 teu_crusader_conquer_crimea_title: "[Root.GetPreviewColorTEU]Zchrystianizuj stepy[Root.GetPreviewColorTEU_end]"
 teu_crusader_conquer_crimea_desc: "Stepy czarnomorskie nie są zamieszkane przez pogan, lecz żyjący tam muzułmanie stanowią zagrożenie dla chrześcijańskiego świata. Musimy wkroczyć na stepy i ponieść naszą krucjatę przeciwko hordom!"
 teu_crusader_fortify_the_caucasus_title: "[Root.GetPreviewColorTEU]Ufortyfikuj Kaukaz[Root.GetPreviewColorTEU_end]"
 teu_crusader_fortify_the_caucasus_desc: "Kaukaz stanowi naturalną granicę między Europą a Azją na południu. Ponieważ pasmo to jest również granicą między naszym państwem a Imperium Osmańskim, zawsze istnieje ryzyko, że Turcy w każdej chwili je przekroczą. Powinniśmy podbić północną część Kaukazu i ją ufortyfikować."
 teu_crusader_bulwark_against_the_turks_title: "[Root.GetPreviewColorTEU]Pokonaj Osmanów[Root.GetPreviewColorTEU_end]"
 teu_crusader_bulwark_against_the_turks_desc: "Osmanowie — plaga Europy i chrześcijaństwa. Nasi słabi sąsiedzi boją się tureckiego sułtana. Dlaczego? Jego największym osiągnięciem było zaanektowanie żałosnej pozostałości Cesarstwa Rzymskiego.\nPokażemy chrześcijańskiemu światu, że nasz zakon przewyższa każdego tureckiego żołnierza zarówno oddaniem wierze, jak i umiejętnościami na polu bitwy!"
 teu_crusader_conquer_poland_title: "[Root.GetPreviewColorTEU]Podbij Polskę[Root.GetPreviewColorTEU_end]"
 teu_crusader_conquer_poland_desc: "Krucjata czy nie, zakon krzyżacki i polska korona nigdy nie potrafiły dojść do porozumienia. Odkąd osiedliliśmy się w Prusach w 1225 roku, Królestwo Polskie próbuje się nas pozbyć. Nie chodzi tu o religię, lecz o nasze przetrwanie — musimy pokonać Polskę i podbić jej ziemie."
 teu_crusader_push_into_ruthenia_title: "[Root.GetPreviewColorTEU]Ruskie równiny[Root.GetPreviewColorTEU_end]"
 teu_crusader_push_into_ruthenia_desc: "Ruś jest ojczyzną Rusi Kijowskiej i wiary prawosławnej. Ponieważ jej mieszkańcy są heretykami, naturalne jest, że przejmiemy ich ziemie i nawrócimy ich na prawdziwą wiarę chrześcijańską."
 teu_crusader_eliminate_the_great_horde_title: "[Root.GetPreviewColorTEU]Zlikwiduj hordy[Root.GetPreviewColorTEU_end]"
 teu_crusader_eliminate_the_great_horde_desc: "Około 1260 roku wielkie imperium mongolskie podbiło wszystkie stepy Europy Wschodniej, a nawet najechało ziemie polskie. Stanowiło ogromne zagrożenie dla chrześcijaństwa i zdołałoby opanować Europę, gdyby sam Pan nie interweniował.\nImperium mongolskie już nie istnieje, lecz jego dziedzictwo nadal żyje wśród niewiernych hord nękających stepy i góry Uralu. Nadszedł czas, by odesłać je z powrotem do piekła, z którego przybyły!"
 teu_crusader_steppes_crusade_title: "[Root.GetPreviewColorTEU]Wkrocz na stepy[Root.GetPreviewColorTEU_end]"
 teu_crusader_steppes_crusade_desc: "Choć góry Uralu zostały oczyszczone z niewiernych, stepy Azji Środkowej nadal są domem dla kolejnych dzikich hord. Dla bezpieczeństwa naszej wiary i naszego ludu musimy wkroczyć głębiej na stepy, podbić te hordy i sprowadzić je na drogę Pana."
 teu_crusader_steppes_crusade_tt: "z prowincji §Ykatolickich§! w regionach §YUralu§!, §YStepu Pontyjskiego§! i §YAzji Środkowej§!."
 teu_crusader_a_holy_horde_title: "[Root.GetPreviewColorTEU]Krzyżowcy stepów[Root.GetPreviewColorTEU_end]"
 teu_crusader_a_holy_horde_desc: "Nasze podboje zaprowadziły nas do samego serca Azji Środkowej. Osiągnęliśmy rozmiary, o jakich inne imperia mogą jedynie marzyć.\nZanim będziemy mogli kontynuować krucjatę na wschód, musimy na chwilę się zatrzymać i zreorganizować strukturę administracyjną państwa."
 teu_crusader_mil_reform_1_title: "[Root.GetPreviewColorTEU]Zdobądź doświadczenie bojowe[Root.GetPreviewColorTEU_end]"
 teu_crusader_mil_reform_1_desc: "Nasze armie wielokrotnie ponosiły klęski w ostatnich wojnach polsko-krzyżackich. Naturalnie poważnie ucierpiało przez to morale naszych wojsk. Nadszedł czas, by ponownie odnieść zwycięstwa na polu bitwy i zdobyć cenne doświadczenie bojowe dla nowych rekrutów."
 teu_crusader_mil_reform_1_tt: "Wygrano co najmniej §Y20§! bitew (§Y[Root.GetNumWonBattles]§!/§Y20§!).\n§RBitwy stoczone przed ukończeniem misji „§YPokonaj Polskę§!” nie są wliczane.§!"
 teu_crusader_mil_reform_2_title: "[Root.GetPreviewColorTEU]Zreformuj armię[Root.GetPreviewColorTEU_end]"
 teu_crusader_mil_reform_2_desc: "Nasze wojsko pokazało, że jest przestarzałe. Nadal stosujemy taktyki średniowiecznej Europy Zachodniej, które nie sprawdzają się na terenach Europy Wschodniej. Musimy je zreformować!"
 teu_crusader_mil_reform_2_tt: "Modyfikator „§YDoświadczenie z pola bitwy§!” zostaje ulepszony do modyfikatora opisanego poniżej."
 teu_crusader_mil_reform_3_title: "[Root.GetPreviewColorTEU]Przystosuj się do równin[Root.GetPreviewColorTEU_end]"
 teu_crusader_mil_reform_3_desc: "Ruś i stepy czarnomorskie to rozległe regiony o zupełnie płaskim terenie. Miasta są od siebie oddalone, a przemarsz piechoty zajmuje trzykrotnie więcej czasu niż podróż konna. Przyszłe bitwy będą rozstrzygane nie w lasach czy na bagnach, lecz na łąkach i stepach. Musimy dostosować naszą armię do tego nowego, obcego terenu."
 teu_crusader_mil_reform_3_tt: "Modyfikator „§YArmia przystosowana do równin§!” zostaje ulepszony do modyfikatora opisanego poniżej."
 teu_crusader_mil_reform_4_title: "[Root.GetPreviewColorTEU]Utwórz wielką kawalerię[Root.GetPreviewColorTEU_end]"
 teu_crusader_mil_reform_4_desc: "Nasze bitwy z hordami pokazały, że utrzymywanie piechoty na tych rozległych, pustych stepach nie jest już opłacalne. Musimy ponownie dostosować naszą armię i utworzyć wielką formację kawalerii dla naszego zakonu, aby dotrzymać kroku dzikim hordom."
 teu_crusader_mil_reform_4_tt: "Modyfikator „§YArmia przystosowana do równin§!” zostaje ulepszony do modyfikatora opisanego poniżej."
 teu_crusader_secure_papal_alliance_title: "[Root.GetPreviewColorTEU]Zabezpiecz sojusz z papiestwem[Root.GetPreviewColorTEU_end]"
 teu_crusader_secure_papal_alliance_desc: "Nasz zakon istnieje po to, by reprezentować interesy papieża. Dlatego ważne jest, abyśmy utrzymywali silny sojusz ze Stolicą Apostolską."
 teu_crusader_embrace_religious_ideas_title: "[Root.GetPreviewColorTEU]Przyjmij idee religijne[Root.GetPreviewColorTEU_end]"
 teu_crusader_embrace_religious_ideas_desc: "Jesteśmy państwem religii, wiary i przekonań. Powinniśmy przyjąć religijny charakter naszego zakonu i wybrać narodowe idee teologiczne."
 teu_crusader_embrace_religious_ideas_at: "Jeśli ukończyliśmy §Yidee religijne§!, nasz [Root.Monarch.GetTitle] może otrzymać do §G2§! £adm£."
 teu_crusader_embrace_religious_ideas_bt: "Jeśli ukończyliśmy §Yidee boskie§!, nasz [Root.Monarch.GetTitle] może otrzymać do §G2§! £mil£."
 teu_crusader_convert_provinces_title: "[Root.GetPreviewColorTEU]Nawróć ziemie[Root.GetPreviewColorTEU_end]"
 teu_crusader_convert_provinces_desc: "Łatwo zapomnieć, że naszym celem nie jest wyłącznie walka. W końcu jesteśmy zakonem rycerskim, którego członkowie rodzą się i dorastają z mieczem w dłoni. Jednak jeszcze ważniejszą częścią naszej misji jest nie tylko pokonanie pogan, lecz także nawrócenie ich na prawdziwą wiarę. Nawrócimy te ziemie albo zginiemy, próbując!"
 teu_crusader_convert_provinces_tt: "Nawrócono §Y75§! prowincji (§Y[Root.GetNumConvertedProvinces]§!/§Y75§!)."
 teu_crusader_gain_income_title: "[Root.GetPreviewColorTEU]Zwiększ dochody[Root.GetPreviewColorTEU_end]"
 teu_crusader_gain_income_desc: "Choć niewielu członków naszego zakonu chce to przyznać, utrzymanie gospodarki nadal należy do obowiązków państwa. Miecze, zbroje, konie, armaty — wszystko to kosztuje. Musimy zwiększyć dochody, aby zapewnić powodzenie naszym krucjatom."
 teu_crusader_castle_expertise_title: "[Root.GetPreviewColorTEU]Mistrzowie fortyfikacji[Root.GetPreviewColorTEU_end]"
 teu_crusader_castle_expertise_desc: "Droga ofensywna może prowadzić do zwycięstwa, lecz nie możemy lekceważyć znaczenia fortów i zamków. Powinniśmy budować i utrzymywać forty w strategicznych punktach naszego państwa, aby żadne siły inwazyjne nie mogły nas zaskoczyć od strony nieosłoniętej granicy."
 teu_crusader_survive_the_reformation_title: "[Root.GetPreviewColorTEU]Oprzyj się reformacji[Root.GetPreviewColorTEU_end]"
 teu_crusader_survive_the_reformation_desc: "Reformacja — dzieło samego diabła! Niegdyś wierni katolicy odwracają się od Stolicy Apostolskiej i przyjmują świętokradcze praktyki. Nie możemy pozwolić, byśmy sami ulegli temu grzesznemu zachowaniu!"
 can_always_embrace_the_counter_reformation_tt: "Państwo §Y[Root.GetName]§! może bezterminowo przyjmować §Ykontrreformację§!."
 teu_crusader_destroy_the_heresies_title: "[Root.GetPreviewColorTEU]Zmiażdż herezję[Root.GetPreviewColorTEU_end]"
 teu_crusader_destroy_the_heresies_desc: "Reformacja przyniosła światu wielu heretyckich niewiernych, którzy próbują szerzyć swoje trujące nauki wśród innych katolików. Musimy natychmiast położyć kres temu heretyckiemu przedsięwzięciu i zdławić reformację!"
 teu_crusader_destroy_the_heresies_at: "W §YEuropie§! nie istnieje żadne §Ycentrum reformacji§!."
 teu_crusader_destroy_the_heresies_bt: "Żadne państwo §Yprotestanckie§! ani §Yreformowane§! nie ma stolicy w §YEuropie§!."
 flavor_teu.5.b: "Ten traktat nic nie znaczy. Zmiażdżymy oligarchów!"
 flavor_teu.10.t: "Przyszłość zakonu krzyżackiego"
 flavor_teu.10.desc: "Choć nasz zakon zdołał pokonać Polskę, jest oczywiste, że nasze państwo nie ma już wyraźnego kierunku ani nadrzędnego celu. Gdy osiedliliśmy się na tych ziemiach, nasza droga była jasna: chrystianizacja plemion bałtyckich. Osiągnęliśmy ten cel, lecz nigdy nie zastanowiliśmy się, co powinno nastąpić później. Ta bezcelowość uczyniła nas słabymi i zdegenerowanymi.\nMusimy ponownie odnaleźć nasze przeznaczenie, w przeciwnym razie jesteśmy skazani na zostanie zwykłym poddanym jednego z sąsiadów."
 flavor_teu.10.a: "Czas krucjat dobiegł końca. Zbudujemy nową, pruską przyszłość."
 flavor_teu.10.a.tt: "Odblokowuje ścieżkę misji §Ypruską§!."
 flavor_teu.10.b: "Musimy kontynuować krucjatę — tym razem przeciwko heretykom!"
 flavor_teu.10.b.tt: "Odblokowuje ścieżkę misji §Ykrzyżowców§!. Wszystkie misje wymagają pozostania przy wierze §Ykatolickiej§!."
 flavor_teu.10.b.ct: "§RNie będziemy mogli utworzyć §YPrus§!.§!"
 flavor_teu.11.t: "Miejsce w Świętym Cesarstwie Rzymskim"
 flavor_teu.11.desc.a: "Pierwotnie przystąpiliśmy do Świętego Cesarstwa Rzymskiego, aby uzyskać ochronę przed Polską i Litwą. Ostatecznie zdołaliśmy pokonać Polaków i zapewnić zakonowi bezpieczną przyszłość. W związku z tym pojawia się pytanie, czy powinniśmy pozostać w Świętym Cesarstwie Rzymskim.\n\nZwolennicy pozostania w Cesarstwie wskazują, że jego rozdrobnienie umożliwi nam stosunkowo łatwą ekspansję przez Niemcy.\nInni popierający ten pomysł zauważają, że dyplomatyczny charakter Świętego Cesarstwa Rzymskiego może pozwolić nam zdobyć znaczną potęgę bez dalszych strat w ludziach na wojnach.\n\nPrzeciwnicy tej koncepcji podkreślają jednak, że pozostanie w Cesarstwie będzie końcem naszego wspaniałego zakonu monastycznego, ponieważ cesarz nie chce, by zakon o tak imponującej reputacji zagrażał drobnym hrabiom i książętom na jego granicach. Ponadto polityka wewnętrzna Cesarstwa może okazać się większym utrapieniem, niż nasi rycerze są gotowi znosić. Być może warto zamiast tego skupić wysiłki na dalszym podboju Polski i Litwy oraz utworzyć własne królestwo."
 flavor_teu.11.desc.b: "Nasi doradcy proponowali, by szukać ochrony cesarskiej przed Polską w ramach Świętego Cesarstwa Rzymskiego. Nasz [Root.Monarch.GetTitle] odrzucił jednak ten pomysł, ponieważ [Root.Monarch.GetSheHe] twierdził, że sami możemy pokonać Polaków. Ku zaskoczeniu wszystkich rzeczywiście udało nam się zwyciężyć nad Polską. Teraz, gdy nasi południowi sąsiedzi nie stanowią już zagrożenia, w zakonie ponownie pojawiło się pytanie o Święte Cesarstwo Rzymskie.\n\nZwolennicy przystąpienia do Cesarstwa wskazują, że jego rozdrobnienie umożliwi nam stosunkowo łatwą ekspansję przez Niemcy.\nInni popierający ten pomysł zauważają, że dyplomatyczny charakter Świętego Cesarstwa Rzymskiego może pozwolić nam zdobyć znaczną potęgę bez dalszych strat w ludziach na wojnach.\n\nPrzeciwnicy tej koncepcji podkreślają jednak, że pozostanie w Cesarstwie będzie końcem naszego wspaniałego zakonu monastycznego, ponieważ cesarz nie chce, by zakon o tak imponującej reputacji zagrażał drobnym hrabiom i książętom na jego granicach. Ponadto polityka wewnętrzna Cesarstwa może okazać się większym utrapieniem, niż nasi rycerze są gotowi znosić. Być może warto zamiast tego skupić wysiłki na dalszym podboju Polski i Litwy oraz utworzyć własne królestwo."
 flavor_teu.11.a: "Powinniśmy wykorzystać możliwości dyplomatyczne w Cesarstwie."
 flavor_teu.11.a.tt: "Odblokowuje ścieżkę misji §Ydyplomacji cesarskiej§!."
 flavor_teu.11.b: "Nasi doradcy mają rację. Niemcy są łatwym celem ekspansji."
 flavor_teu.11.b.tt: "Odblokowuje ścieżkę misji §Yniemieckiego podboju§!."
 flavor_teu.11.c: "Na Boga! Polityka Cesarstwa nas nie obchodzi!"
 flavor_teu.11.c.tt: "Odblokowuje ścieżkę misji §YKrólestwa Prus§!."
 flavor_teu.12.t: "[Root.GetAdjective] zwycięstwa"
 flavor_teu.12.desc: "Nasi krzyżowcy odnieśli sukces na polu bitwy. Wygraliśmy kilka starć, a rycerze zakonu krzyżackiego triumfują!"
 flavor_teu.12.a: "Zwycięstwo należy do nas!"
 flavor_teu.13.t: "Zjednoczenie zakonów?"
 flavor_teu.13.desc: "Choć zakon krzyżacki i zakon inflancki mają bardzo podobną strukturę i cele, istnieje między nimi jedna zasadnicza różnica: nasza gospodarka jest silna, a my możemy pochwalić się zwycięstwami. Zakon inflancki natomiast musiał być prowadzony do zwycięstwa przez nas, tak jak podczas bitwy na jeziorze Pejpus w 1242 roku.\n[LIV.Monarch.GetTitle] zakonu inflanckiego wie, że w naszym sojuszu to my jesteśmy silniejszym zakonem. Być może uda się przekonać [LIV.Monarch.GetSheHe] do połączenia sił pod naszym zwierzchnictwem."
 flavor_teu.13.a: "Złóż propozycję [LIV.Monarch.GetTitle]."
 flavor_teu.13.a.tt: "Zaproponujemy wasalizację państwu §Y[LIV.GetName]§!. Jeśli ją przyjmie, stanie się naszym wasalem; w przeciwnym razie otrzymamy casus belli §YP podporządkowanie§! przeciwko §Y[LIV.GetName]§! na §Y30 lat§!.\n\nIch akceptacja będzie tym bardziej prawdopodobna, im większą mamy §Yreputację dyplomatyczną§!."
 flavor_teu.13.b: "Powinniśmy zamiast tego skupić się na trwałym sojuszu."
 flavor_teu.14.t: "Państwo [From.GetName] proponuje wasalizację"
 flavor_teu.14.desc: "Dziś rano na naszym dworze pojawił się giermek zakonu krzyżackiego. Przyniósł wiadomość od swojego [From.Monarch.GetTitle].\n„Wielki [From.Monarch.GetTitle] państwa [From.GetName] składa wam, szlachetny [Root.Monarch.GetTitle] [Root.Monarch.GetName] zakonu inflanckiego, oraz waszym braciom ofertę wasalizacji. Zakon krzyżacki zapewni wam ochronę w zamian za służbę wojskową”.\nOferta może być obraźliwa, lecz prawdą jest, że nasz zakon nie dysponuje siłą bojową zakonu krzyżackiego. A przy Nowogrodzie, Litwie i Danii jako rywalizujących sąsiadach silny protektor może okazać się pożądany."
 flavor_teu.14.a: "Powinniśmy przyjąć tę ofertę. Przynajmniej będziemy służyć innemu zakonowi rycerskiemu."
 flavor_teu.14.b: "Potrzebujemy ochrony, ale nie ze strony tych samochwałów."
 flavor_teu.15.t: "Zakon inflancki przyjmuje naszą ofertę!"
 flavor_teu.15.desc: "Otrzymaliśmy wiadomość od zakonu inflanckiego: przyjął naszą ofertę i ogłosił się naszym wiernym wasalem!"
 flavor_teu.15.a: "Wspaniale!"
 flavor_teu.16.t: "Zakon inflancki odrzuca naszą ofertę"
 flavor_teu.16.desc: "Otrzymaliśmy wiadomość od zakonu inflanckiego: odrzucił naszą ofertę! Nie wierzy, że możemy zapewnić mu potrzebną ochronę."
 flavor_teu.16.a: "Próbowaliśmy przekonać ich słowem. Teraz przemówi miecz."
 flavor_teu.17.t: "Cesarstwo a zakon krzyżacki"
 flavor_teu.17.desc: "Stosunki między zakonem krzyżackim a Świętym Cesarstwem Rzymskim były zawsze co najwyżej powierzchowne. Choć niekiedy otrzymywaliśmy wyrazy sympatii i pomoc z ziem niemieckich, większość cesarzy Świętego Cesarstwa Rzymskiego nie poświęcała nam wiele uwagi, a my również nie zabiegaliśmy o ich względy — w końcu byliśmy skupieni na wojnie z bałtyckimi poganami.\n\nOd czasu do czasu nasze bitwy przyciągały najemników z Cesarstwa, choć nie zawsze walczyli oni po naszej stronie, jak podczas bitwy pod Grunwaldem w 1410 roku. Przez większość czasu nasze państwa jednak współistniały bez większych kontaktów. W obliczu nadciągającego zagrożenia ze strony Królestwa Polskiego nadszedł jednak czas, by zwrócić się do cesarza i poprosić o ochronę cesarską. Pytanie brzmi, jakich warunków może zażądać w zamian za zapewnienie nam ochrony..."
 flavor_teu.17.a: "Lepiej poprosić, zanim staniemy się poddanymi Polaków."
 flavor_teu.17.a.tt: "Poprosimy [Emperor.Monarch.GetTitle] państwa §Y[Emperor.GetName]§! o zgodę na przystąpienie do §YŚwiętego Cesarstwa Rzymskiego§!.\nCesarz może jednak postawić nam pewne warunki..."
 flavor_teu.17.b: "Bah! Jesteśmy zakonem krzyżackim! Sami poradzimy sobie z Polską."
 flavor_teu.18.t: "Los Niemiec"
 flavor_teu.18.desc: "Święte Cesarstwo Rzymskie przestało istnieć, a zapewniana niegdyś jego członkom ochrona cesarska należy już do przeszłości. Rada rycerzy i doradców zebrała się w [Root.Capital.GetName], aby omówić dalsze działania. Połowa rady proponuje skupić wysiłki na podboju Niemiec, aby zjednoczyć je pod jednym sztandarem. Druga połowa podkreśla, że zagrożenie ze strony Polski i Rusi nadal istnieje i zamiast tego powinniśmy skoncentrować się na podboju tych regionów.\n\nOstateczna decyzja o obranej drodze należy do naszego [Root.Monarch.GetTitle]."
 flavor_teu.18.a: "Państwa niemieckie pogrążyły się w chaosie. Musimy zjednoczyć je pod naszym sztandarem!"
 flavor_teu.18.b: "Nie mamy zasobów na podbój Niemiec, dopóki Polska pozostaje zagrożeniem."
 flavor_teu.19.t: "Krzyżackie roszczenia do Ziemi Burzenland"
 flavor_teu.19.desc: "W 1211 roku król Węgier Andrzej II nadał nam Ziemię Burzenland. W zamian zobowiązaliśmy się chronić południowo-wschodnią granicę Królestwa Węgier przed zagrożeniem ze strony Kumanów.\nPrzez czternaście lat zakon cieszył się szczególnymi przywilejami, takimi jak zwolnienie z podatków oraz prawo do zakładania targowisk i sprawowania sądów. Wszystko to utraciliśmy, gdy następca Andrzeja, Bela, i węgierska szlachta wypędzili nas z naszych prawowitych ziem.\n\nPo ponad 200 latach Ziemia Burzenland ponownie znajduje się pod kontrolą zakonu krzyżackiego. Podczas naszej nieobecności dawna drewniana warownia Dietrichstein została rozebrana. Na jej miejscu stoi teraz zamek Bran, którego architektura zwróciła uwagę [Root.Monarch.GetTitle] [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] doradców. Pojawiło się pytanie, czy powinniśmy wykorzystać zasoby Karpat do rozbudowy zamku Bran i uczynienia z niego naszej nowej stolicy, czy też pozostać w [1841.GetName] i przeznaczyć je na Marienburg."
 flavor_teu.19.a: "Zamek Bran zostanie naszą nową stolicą!"
 flavor_teu.19.b: "Lepiej przeznaczyć te zasoby na [1841.GetName]."
 teu_can_utilize_bran_castle_tt: "Państwo §Y[Root.GetName]§! korzysta z §Yzamku Bran§! bez żadnych warunków."
 teu_expanded_resources_marienburg: "Rozszerzone zasoby"
 desc_teu_expanded_resources_marienburg: "Zamek w Malborku otrzymuje dodatkowe zasoby z Karpat, co obniża koszty planowania i rozbudowy zamku oraz otaczającego go miasta."
 teu_expanded_resources_bran_castle: "Rozszerzone zasoby"
 desc_teu_expanded_resources_bran_castle: "Zamek Bran otrzymuje dodatkowe zasoby z Karpat, co obniża koszty planowania i rozbudowy zamku oraz otaczającego go miasta."
 flavor_teu.20.t: "Reyse rycerzy"
 flavor_teu.20.desc: "Nasze bitwy z pogańskimi Litwinami w ubiegłym stuleciu przyciągnęły wielu znamienitych rycerzy z Europy Zachodniej — zwłaszcza z Królestwa Francji i Anglii. Ich sezonowe wyprawy krzyżowe nad Bałtyk zyskały miano „Reyse”, co oznacza „kampanię”.\n\nZ czasem Litwini porzucili pogańską wiarę i przyjęli chrześcijaństwo, co położyło kres wyprawom największych rycerzy Europy.\n\nDla wielu nadszedł kres epoki zakonów rycerskich, a my będziemy postrzegani jako relikt minionych czasów. Lecz teraz, po raz ostatni: wezwijmy rycerzy Europy na ich ostatnią Reyse!"
 flavor_teu.20.a: "Stoczmy turniej! Biesiadujmy! Świętujmy dziedzictwo europejskiego rycerstwa!"
 teu_the_last_reyse: "Ostatnia Reyse"
 desc_teu_the_last_reyse: "Dla wielu w Europie epoka rycerzy dobiega końca. Ostatecznie pozostaniemy ostatnim zakonem, trzymającym się wartości i cnót, które otaczający nas ludzie uznają za przestarzałe.\nLecz teraz, w tym ostatnim okresie, uczcijmy naszą ostatnią sezonową wyprawę — ostatnią Reyse — jako zjednoczony zakon rycerzy z całego kontynentu!"
 flavor_teu.21.t: "Odzyskanie Ziemi Świętej"
 flavor_teu.21.desc: "Zakon krzyżacki powstał w 1191 roku po zdobyciu Akki podczas trzeciej krucjaty. Nasze zwycięstwo było jednak krótkotrwałe, ponieważ zostaliśmy wyparci z Ziemi Świętej i musieliśmy ustanowić nasze państwo w Europie.\n\nDawne niepowodzenia nie mają już dla nas znaczenia, ponieważ odzyskaliśmy Ziemię Świętą i miasto Jerozolimę! Misja naszego zakonu wreszcie dobiegła końca."
 flavor_teu.21.a: "Chrześcijanie na całym świecie radują się z tych wspaniałych wieści!"
 flavor_teu.22.t: "Wielka wojna chłopska"
 flavor_teu.22.desc: "Chłopi Świętego Cesarstwa Rzymskiego otwarcie buntują się przeciwko swoim szlacheckim panom. Rozwścieczone gromady wieśniaków podpalają domy i walczą z wojskami cesarskimi oraz ich sojusznikami.\n\nChoć troski szlachty i chłopów Cesarstwa niewiele nas obchodzą, te brutalne tłumy nie potrafią odróżnić majątków swoich panów od naszych. Heretyccy chłopi złupili nasze posiadłości w Cesarstwie, czyniąc je całkowicie bezużytecznymi!"
 flavor_teu.22.a: "Zapłacą za to!"
 flavor_teu.23.t: "Zakon krzyżacki w Lidze Świętej"
 flavor_teu.23.desc: "Reformacja rozprzestrzeniła się w Niemczech niczym pożar, a wielu książąt odwróciło się od Kościoła katolickiego. Utworzyli własną ligę, aby rzucić cesarzowi wyzwanie w walce o władzę w Cesarstwie.\nNaszym obowiązkiem jest nie tylko jako świętego zakonu, lecz także jako współbraci Niemców stanąć po stronie [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName] przeciwko temu heretyckiemu zagrożeniu!"
 flavor_teu.23.a: "Będziemy bronić Stolicy Apostolskiej aż do śmierci!"
 flavor_teu.23.b: "Wojny religijne między chrześcijanami nie są naszą sprawą."
 flavor_teu.24.t: "Hanza i zakon"
 flavor_teu.24.desc: "Podczas wielkiego oblężenia Akki w 1191 roku zakon krzyżacki został utworzony przez niemieckich kupców z Lubeki i Bremy. Od tamtej pory nasz zakon rozrastał się, kierując się cnotami i wartościami ubóstwa, czystości oraz posłuszeństwa. Ze względu na charakter naszych podstawowych zasad zakon krzyżacki często cierpiał na niedostatek dukatów.\nNa szczęście Hanza pamięta o naszych korzeniach i w przeszłości zapewniała nam statki oraz wsparcie finansowe podczas podboju Prus. W zamian mieliśmy chronić hanzeatyckich kupców, choć z czasem okazało się to błędem naszego państwa, ponieważ kupcy ci utworzyli później groźną konfederację pruską.\n\nMimo to Hanza pozostaje cennym wsparciem dla naszego skarbca. Warto odnowić stosunki z [HSA.Monarch.GetTitle] państwa [HSA.GetName], abyśmy mogli nadal korzystać z ich pomocy finansowej."
 flavor_teu.24.a: "Powinniśmy rzeczywiście odnowić te stosunki."
 flavor_teu.24.b: "Nasze relacje z Hanzą zakończyły się wraz z powstaniem konfederacji pruskiej."
 teu_renewed_hanseatic_relations: "Odnowione stosunki z Hanzą"
 desc_teu_renewed_hanseatic_relations: "Hanza była w przeszłości nieocenionym wsparciem dla działalności zakonu krzyżackiego. Odnowiliśmy z nią stosunki, aby ponownie korzystać z jej pomocy finansowej."
 flavor_teu.25.t: "Odwet za wojny husyckie"
 flavor_teu.25.desc: "Podczas wojen husyckich część heretyckich husytów wsparła naszych polskich wrogów w 1433 roku i walczyła przeciwko nam. Siedem tysięcy ludzi przemaszerowało przez zachodnie Prusy aż do Morza Bałtyckiego, pozostawiając po drodze jedynie pożogę i ruiny.\n\nCzyny husytów wciąż są żywe w pamięci naszych rycerzy, dlatego nikogo nie zdziwiło, gdy nasi żołnierze przeszli ulicami [BOH.Capital.GetName] i złupili każde gospodarstwo. Na koniec, dla uczczenia tego aktu odwetu, nasi zbrojni przynieśli butelki wody wypełnione solanką i wylali ich zawartość na głowę czeskiego [BOH.Monarch.GetTitle] [BOH.Monarch.GetName]."
 flavor_teu.25.a: "Ostatnim razem przybyliście do nas, by ujrzeć morze. Teraz morze przybyło do was."
 flavor_teu.26.t: "Utworzenie monarchii pruskiej"
 flavor_teu.26.desc: "Rządy teokratyczne mają swoje zalety, lecz ostatecznie jedynie pełna sekularyzacja państwa pozwoli nam osiągnąć nasze cele. Nasi doradcy przygotowali wszystkie zmiany administracyjne, a utworzenie prawdziwej monarchii jest już na wyciągnięcie ręki. Aby je zrealizować, wystarczy koronować naszego [Root.Monarch.GetTitle]."
 flavor_teu.26.a: "Odtąd będziemy znani jako Królestwo Prus!"
 flavor_teu.26.b: "Po namyśle powinniśmy pozostać biskupstwem."
 flavor_teu.27.t: "Zakon krzyżacki w Cesarstwie"
 flavor_teu.27.desc: "Rycerzom zakonu krzyżackiego udało się zostać członkiem Świętego Cesarstwa Rzymskiego. Nie jest do końca jasne, jak tego dokonali, lecz twierdzą, że pragną jedynie uzyskać ochronę cesarską przed Polską.\nWiększa liczba członków Cesarstwa jest zawsze mile widziana, jednak zakon krzyżacki ma dość złą reputację i często sprawia kłopoty. Wszystkie księstwa graniczące z zakonem już teraz czują się przez niego poważnie zagrożone, więc jeśli zakon krzyżacki dołączy do Cesarstwa, uznają nas za słabego cesarza, który nie potrafi obronić ich przed obcymi najeźdźcami..."
 flavor_teu.28.t: "Zakon krzyżacki chce przystąpić do Cesarstwa"
 flavor_teu.28.desc: "Rycerze zakonu krzyżackiego przesłali na nasz dwór formalną prośbę. Chcą uzyskać ochronę cesarską przed Polską i Litwą oraz przystąpić do Cesarstwa do czasu, aż zdołają pokonać Polaków.\nZakon cieszył się niegdyś sporą popularnością wśród książąt i hrabiów północnych Niemiec, gdy prowadził krucjatę przeciwko bałtyckim poganom. Jednak jego niedawne wojny z Polską i już schrystianizowaną Litwą poważnie nadszarpnęły jego reputację. Rycerze nie walczą już w imię Stolicy Apostolskiej, lecz dla własnych korzyści, a hrabstwa graniczące z zakonem obawiają się jego agresji.\nChoć większa liczba członków Cesarstwa jest zawsze mile widziana, przyjęcie zakonu do Cesarstwa — nawet tymczasowo — może sprawić, że [Emperor.Monarch.GetName] z państwa [Emperor.GetName] stanie się bardzo niepopularny wśród graniczących z zakonem księstw."
 flavor_teu.28.a: "Niech Krzyżacy dołączą do Cesarstwa."
 flavor_teu.28.a.tt: "Zgodzimy się, aby §YKrzyżacy§! przyłączyli się do Świętego Cesarstwa Rzymskiego bez żadnych warunków.\nSąsiedzi zakonu, którzy są częścią Cesarstwa, czują się zagrożeni i nie będą nas wspierać w najbliższej przyszłości...\n\nKażdy sąsiad §Y[From.GetAdjective]§!, który jest częścią Świętego Cesarstwa Rzymskiego, traci §R150§! opinii o państwie §Y[Root.GetName]§!."
 flavor_teu.28.b: "Zezwolimy zakonowi na dołączenie, ale nałożymy na niego surowe przepisy."
 flavor_teu.28.b.tt: "Przyjmujemy Krzyżaków do Świętego Cesarstwa Rzymskiego. Zakazujemy jednak zakonowi atakowania jakiegokolwiek innego członka Świętego Cesarstwa Rzymskiego, dopóki nie rozwiąże on swojego zakonu i nie przekształci się w §YBiskupstwo§! lub §YKsięstwo Prus§!\nJeśli zdecydują się zaatakować członka Cesartwa, Krzyżacy zostaną usunięci ze Świętego Cesarstwa Rzymskiego, a my uznamy ich akt agresji za wojnę ofensywną przeciwko Cesarstwu."
 flavor_teu.28.c: "Odrzucimy prośbę Krzyżaków."
 flavor_teu.28.c.tt: "Odrzucimy prośbę Krzyżaków o przyłączenie się do Świętego Cesarstwa Rzymskiego."
 flavor_teu.29.t: "Cesarz wita nas!"
 flavor_teu.29.desc: "Pomimo naszych obaw, cesarz Świętego Cesarstwa Rzymskiego wita nas z otwartymi ramionami! Nie będziemy musieli martwić się żadnymi karami ani przepisami."
 flavor_teu.29.a: "Wspaniale!"
 flavor_teu.29.a.tt: "Zostaliśmy przyjęci do Świętego Cesarstwa Rzymskiego bez żadnych warunków."
 flavor_teu.30.t: "Państwo [Root.GetName] dołącza do Cesarstwa - na razie"
 flavor_teu.30.desc: "Cesarz zaakceptował naszą prośbę i zaprosił nas do Świętego Cesarstwa Rzymskiego. Jednak ze względu na naszą reputację cesarz uznał za konieczne nałożenie na nas przepisów, dopóki nie zintegrujemy się z Cesartwem..."
 flavor_teu.30.a: "Uczciwa propozycja."
 flavor_teu.30.a.tt: "Zostaliśmy przyjęci do Świętego Cesarstwa Rzymskiego.\nJednakże Cesarz zabrania nam wypowiadania jakiejkolwiek wojny innym członkom Cesarstwa, dopóki nie rozwiążemy zakonu i nie zreformujemy się w §YBiskupstwo§! lub §YKsięstwo Prus§!\nWypowiedzenie jakiejkolwiek wojny członkowi Świętego Cesarstwa Rzymskiego spowoduje §Rwyrzucenie§! nas z Cesarstwa i rozpoczniemy §Rofensywną wojnę§! przeciwko państwu §Y[Emperor.GetName]§!."
 flavor_teu.30.a.bt: "Cesarstwo przejrzało nasz podstęp. Zgodnie z Reichsverordnung 66, dla Krzyżaków nie ma miejsca w Cesarstwie."
 flavor_teu.30.b: "Zasady? Nikt nie będzie nam rozkazywał!"
 flavor_teu.30.b.tt: "Przyszłe próby dołączenia do Świętego Cesarstwa Rzymskiego będą wymagały wyższej oceny cesarza."
 flavor_teu.31.t: "Cesarz odrzuca Krzyżaków"
 flavor_teu.31.desc: "Pomimo naszych najlepszych prób dyplomatycznych, cesarz Świętego Cesarstwa Rzymskiego nie widzi powodu, by pozwolić nam dołączyć do Cesarstwa. Jesteśmy zdani na siebie w walce z Polską..."
 flavor_teu.31.a: "Czy cesarz powiedział nam chociaż dlaczego?"
 flavor_teu.31.a.tt: "Odrzucono naszą możliwość przyłączenia się do Świętego Cesarstwa Rzymskiego."
 flavor_teu.33.t: "Nielegalna wojna w Cesarstwie"
 flavor_teu.33.desc: "Przystąpiliśmy do Świętego Cesarstwa Rzymskiego pod warunkiem, że potrzebujemy jedynie ochrony przed Polską, a cesarz udzielił nam jej w zamian za obietnicę, że nie będziemy prowadzić działań wojennych na terenie Cesarstwa. Dziś złamaliśmy tę obietnicę.\nCesarz wygnał nas z Cesarstwa i uznał naszą wojnę za akt agresji przeciwko samej Koronie Cesarskiej!"
 flavor_teu.33.a: "Przygotujcie się! Nadciąga armia cesarska!"
 flavor_teu.34.t: "Zakon krzyżacki w Cesarstwie"
 flavor_teu.34.desc.a: "Zdecydowaliśmy, że nasza przyszłość leży w Świętym Cesarstwie Rzymskim. Musimy zatem dotrzymać obietnicy złożonej cesarzowi, co oznacza rozwiązanie zakonu krzyżackiego. Od dziś będziemy znani jako Biskupstwo Pruskie!"
 flavor_teu.34.desc.b: "Zdecydowaliśmy, że nasza przyszłość leży w Świętym Cesarstwie Rzymskim. Na szczęście wielki cesarz pozwolił nam zachować nasz święty zakon nawet w granicach Świętego Cesarstwa Rzymskiego! Chwała Panu i cesarzowi!"
 flavor_teu.34.a: "Amen!"
 flavor_teu.34.b: "Chwała im!"
 flavor_teu.35.t: "Powstanie Cesarstwa Niemieckiego"
 flavor_teu.35.desc.a: "Święte Cesarstwo Rzymskie — ani święte, ani rzymskie, ani cesarstwo. Cesarz nigdy nie zdołał ustanowić jakiejkolwiek kontroli nad licznymi rozdrobnionymi państwami niemieckimi, a konflikty religijne jeszcze bardziej osłabiły jego pozycję.\nPodczas gdy Cesarstwo chyliło się ku upadkowi, nasz [Root.GovernmentName] rósł w siłę, a państwa niemieckie przyłączały się do nas — słowem lub mieczem. Większość Niemiec znajduje się już w naszym posiadaniu, a wezwanie do utworzenia prawdziwego imperium — Cesarstwa Niemieckiego, imperium Niemców — rozbrzmiewa coraz głośniej.\n\nDziś spełnimy to wezwanie, przekształcając nasz [Root.GovernmentName] w Cesarstwo Niemieckie!"
 flavor_teu.35.desc.b: "Święte Cesarstwo Rzymskie obiecało chronić państwa niemieckie przed obcymi potęgami, lecz każda wojna przeciwko naszemu [Root.GovernmentName] była kolejnym upokorzeniem dla tego upadającego tworu. Księstwa Cesarstwa przyłączyły się do naszego państwa, ponieważ wiedzą, że potrafimy je obronić. Większość Niemiec znajduje się już w naszym posiadaniu, a wezwanie do utworzenia prawdziwego imperium — Cesarstwa Niemieckiego, imperium Niemców — rozbrzmiewa coraz głośniej.\n\nDziś spełnimy to wezwanie, przekształcając nasz [Root.GovernmentName] w Cesarstwo Niemieckie!"
 flavor_teu.35.desc.c: "Święte Cesarstwo Rzymskie okazało się całkowitą porażką. Mimo wszystkich obietnic cesarza Cesarstwo przestało istnieć, a państwa niemieckie pozostały bez ochrony przed obcymi potęgami — aż do chwili, gdy wkroczyliśmy i zjednoczyliśmy je w jedno państwo niemieckie. Większość Niemiec znajduje się już w naszym posiadaniu, a wezwanie do utworzenia prawdziwego imperium — Cesarstwa Niemieckiego, imperium Niemców — rozbrzmiewa coraz głośniej.\n\nDziś spełnimy to wezwanie, przekształcając nasz [Root.GovernmentName] w Cesarstwo Niemieckie!"
 flavor_teu.35.a: "Niech żyje Cesarstwo!"
 flavor_teu.35.b: "Cesarstwo musi poczekać. Najpierw musimy zająć się innymi sprawami."
 flavor_teu.35.b.tt: "§YOdblokowuje decyzję narodową o utworzeniu Niemiec.§!"
 flavor_teu.36.t: "Wiara prawosławna na Rusi"
 flavor_teu.36.desc: "Kościół prawosławny ma silny wpływ zarówno na kulturę ruską, jak i na samą Ruś. Wzniesiono tam wiele świątyń wzorowanych na Hagii Sophii, a obrzędy religijne są dla mieszkańców świętością. Choć obie nasze religie są chrześcijańskie, dzielą je różnice nie do pogodzenia.\nStan [Root.GetBurghersOrFallbackName] sugeruje, by pozwolić Rusinom praktykować ich wiarę w spokoju. W zamian prawosławni Rusini mogliby bez wahania zaakceptować nasze rządy.\nStan [Root.GetChurchOrFallbackName] zaleca jednak wykorzenienie tej herezji, zanim inni mieszkańcy naszego kraju ulegną obcej wierze."
 flavor_teu.36.a: "Wciąż jesteśmy chrześcijanami. Niech modlą się, jak chcą."
 flavor_teu.36.b: "Zaiste, tę herezję należy jak najszybciej zakończyć!"
 flavor_teu.37.t: "Los prowincji [295.GetName]"
 flavor_teu.37.desc: "W wyniku nieustannego upadku słabego Cesarstwa Bizantyjskiego miasto [295.GetName] stało się ważnym ośrodkiem religii prawosławnej. Niektórzy nasi rycerze pragną złupić miasto, tak jak podczas czwartej krucjaty w 1204 roku. Mogłoby to jednak doprowadzić do wielkiego powstania moskiewskich Rusinów przeciwko nam.\nInna propozycja zakłada ponowne wykorzystanie kościołów i nawrócenie ludności na katolicyzm, przy jednoczesnym pozbawieniu prawosławnych patriarchów ich stanowisk. Doprowadzi to do buntu religijnego, choć mniejszego niż w przypadku złupienia miasta.\nOstatnia propozycja naszych rycerzy zakłada włączenie moskiewskich Rusinów do naszego państwa i pomoc w odbudowie ich miasta. Z pewnością zyskamy w ten sposób przychylność Rusinów, lecz przyszłe próby nawracania w prowincji [295.GetName] i okolicy mogą spotkać się z silnym oporem."
 flavor_teu.37.a: "Włączmy Moskali do naszego państwa."
 flavor_teu.37.b: "Przeznaczmy prawosławne kościoły do innych celów."
 flavor_teu.37.c: "Przymknijmy oko na działania rycerzy w prowincji [295.GetName]."
 flavor_teu.38.t: "Zakon krzyżacki kończy schizmę"
 flavor_teu.38.desc: "Rycerze zakonu krzyżackiego zdobyli Moskwę, prawosławny ośrodek religijny, i ogłosili ostateczny koniec schizmy. Oczywiście rycerze ci postradali zmysły, lecz upadek prawosławia w Konstantynopolu i zwycięstwa zakonu krzyżackiego mówią same za siebie. Moglibyśmy pozostać przy dawnych obyczajach, ale znaki wskazują, że Bóg może rzeczywiście stać po stronie katolicyzmu."
 flavor_teu.38.a: "Przyjmiemy katolicyzm."
 flavor_teu.38.b: "Bah! Ci rycerze i tak są szaleńcami. Pozostaniemy przy prawosławiu."
 flavor_teu.39.t: "Utworzenie zakonu krzyżowego"
 flavor_teu.39.desc: "Wraz z kolejnymi podbojami zarządzanie naszym państwem staje się dla zakonu coraz bardziej wyczerpujące. Jest oczywiste, że nie jesteśmy już wyłącznie zakonem monastycznym, który ukrywa się w klasztorach. Jesteśmy zakonem realizującym świętą misję szerzenia katolicyzmu w Europie Wschodniej.\nAby osiągnąć nasze cele, musimy jednak zreformować ograniczające nas reguły zakonne."
 flavor_teu.39.a: "Przekształćmy się w zakon krzyżowy, aby wszyscy poznali naszą misję!"
 flavor_teu.39.b: "Obecne reguły są chyba wystarczająco dobre."
 flavor_teu.40.t: "Upokorzenie Imperium Osmańskiego"
 flavor_teu.40.desc: "Choć walka z Osmanami nie była tak łatwa, jak się spodziewaliśmy, ostatecznie nie zdołali oprzeć się naszemu natarciu. Zakon krzyżacki zwyciężył tam, gdzie poniosło porażkę tak wielu naszych chrześcijańskich braci. Chrześcijańscy poddani sułtanatu byli świadkami naszych zwycięstw: widzieli klęski armii osmańskich i teraz przygotowują się do zrzucenia tureckich kajdan!"
 flavor_teu.40.a: "Osmanowie nie są nieśmiertelni. Sami zdecydujecie, czy chcecie pozostać ich niewolnikami!"
 flavor_teu.40.a.tt: "Każda §Ychrześcijańska§! prowincja §YOsmanów§! otrzymuje na §Y10 lat§! modyfikator „§YZainspirowani zwycięstwem krzyżackim§!”, zapewniający następujący efekt:\nLokalne niepokoje: §R+20,00§!\n\nKażda §Ychrześcijańska§!, nie§Ykatolicka§! prowincja Osmanów staje się §Ykatolicka§!."
 flavor_teu.41.t: "Krzyżowcy stepów"
 flavor_teu.41.desc: "Podczas gdy inne zakony koncentrują wysiłki na podboju Ziemi Świętej, nasz zakon obrał inną drogę. Zainspirowani brutalnym zdobywcą Czyngis-chanem i kierowani świętą misją nawracania niewiernych, rozszerzaliśmy nasze państwo coraz dalej na wschodnie stepy. Obecnie zwykła administracja byłaby niemal niemożliwa, gdyby nie najważniejsze narzędzie naszego zakonu: koń.\nNawet tego nie zauważyliśmy, a staliśmy się tym, co niegdyś zagrażało chrześcijaństwu — hordą rozciągającą się od zimnych wód Bałtyku aż po gorące pustynie Azji Środkowej. Kierunek naszej ekspansji jest jednak jasny: podążamy dalej na wschód, zgodnie z wolą Pana!"
 flavor_teu.41.a: "Deus vult!"
 flavor_teu.42.t: "Sytuacja zakonu krzyżackiego"
 flavor_teu.42.desc: "Zakon krzyżacki, zrzeszający szlachetnych niemieckich rycerzy, został ustanowiony na wybrzeżu Bałtyku, aby chrystianizować miejscowe plemiona. Choć misję tę zrealizowano dziesiątki lat temu, postanowiliśmy pozostać na ziemiach dawnych Prusów i uczynić je naszym domem — ku wielkiemu niezadowoleniu Polski. W ciągu ostatnich 40 lat nasz zakon stoczył cztery wojny z Polską i jej sojusznikami. W wyniku niedawnych niepowodzeń wojennych bogate miasta Prus spiskują przeciwko naszej władzy. Konfederacja pruska stanowi nadciągające zagrożenie, z którym trzeba szybko się rozprawić...\n\nNie wszystko jednak wygląda ponuro. Zakon krzyżacki stoi na rozdrożu i musi zdecydować o swojej przyszłości. Jeśli zdołamy pokonać zagrożenie ze strony Polski, nasz zakon będzie mógł obrać nową drogę."
 flavor_teu.42.a: "Tylko czas pokaże, co nas czeka."
 flavor_teu.42.a.tt: "§YZakon krzyżacki§! posiada unikalne, bardzo elastyczne drzewko misji. Po ukończeniu misji „§YPokonaj Polskę§!” otrzymamy wydarzenie pozwalające zastąpić misje rozgałęzione misjami z jednej z dwóch poniższych ścieżek:\n\n§YŚcieżka pruska§!\nŚcieżka pruska polega na sekularyzacji i rozwiązaniu zakonu krzyżackiego oraz przekształceniu go w państwo §YPrusy§!. Jej celem będzie utrzymanie jednej z najsilniejszych armii w historii i dalszy rozwój ziem pruskich. Doprowadzi również do kolejnego rozgałęzienia misji, w którym zdecydujemy, czy chcemy realizować §Ydyplomację w Cesarstwie§!, §Yrozszerzyć wpływy na Niemcy§! i zjednoczyć Niemców, czy też §Ywykuć własny los§! jako Królestwo Prus na ziemiach Polski i Rusi.\n\n§YŚcieżka krzyżowców§!\nŚcieżka krzyżowców polega na wierności celowi zakonu, jakim jest chrystianizacja pogan i heretyków. Drzewko misji poprowadzi nas przez kampanię podbojów i nawracania w §YEuropie Wschodniej§! oraz na §Ystepach Azji Środkowej§!."
 flavor_teu.43.a.tt: "Zgodzimy się, aby §YKrzyżacy§! przyłączyli się do Świętego Cesarstwa Rzymskiego bez żadnych warunków.\nSąsiedzi zakonu, którzy są częścią Cesarstwa, mogą czuć się zagrożeni tym wyborem.\n\nKażdy sąsiad §Y[TEU.GetAdjective]§!, który jest częścią Świętego Cesarstwa Rzymskiego, traci §R150§! opinii o państwie §Y[Root.GetName]§!."
 flavor_teu.44.t: "Incydent krzyżacki"
 flavor_teu.44.desc: "Przystąpiliśmy do Świętego Cesarstwa Rzymskiego na mocy porozumienia zawartego wyłącznie z cesarzem. Jednak wiele niemieckich państw graniczących z nami czuje się teraz zagrożonych naszą obecnością i domaga się, by całe Święte Cesarstwo Rzymskie zajęło się rozwiązaniem problemu naszej obecności."
 flavor_teu.44.a: "Dobrze."
 flavor_teu.45.t: "Kozacy na Rusi"
 flavor_teu.45.desc: "Nasza kampania na ziemiach ruskich zakończyła się wielkim sukcesem. Ludność ruska jest teraz częścią [Root.GetAdjective] [Root.GovernmentName], a jej wielkie miasta służą jako dodatkowe bazy operacyjne państwa [Root.GetName].\n\nJeden ważny element wymknął się jednak spod naszej kontroli: wolni mieszkańcy stepów, Kozacy, żyją na naszych ziemiach, lecz nie podlegają naszej władzy. Powinniśmy szybko rozwiązać ten problem, aby nasze panowanie nad Rusią pozostało niezagrożone."
 flavor_teu.45.a: "Przyznaj im prawo do zamieszkiwania stepów w zamian za ich służbę."
 flavor_teu.45.b: "Włącz ich do naszych sił zbrojnych."
 teu_unified_orders: "Zjednoczone zakony"
 desc_teu_unified_orders: "Zakon inflancki i zakon krzyżacki zostały zjednoczone w jeden potężny zakon. Rycerze i wiedza wojskowa obu zakonów połączyły siły, by służyć większemu celowi."
 teu_livonian_teutonic_alliance: "Rycerze dyplomatyczni"
 desc_teu_livonian_teutonic_alliance: "Utrzymanie sojuszu wymaga dyplomatycznego kunsztu. Na szczęście nasz sojusz z zakonem inflanckim przyprowadził do nas rycerzy, którzy opanowali sztukę dwuznacznych komplementów."
 teu_ruler_over_livonia: "Władca ziem inflanckich"
 desc_teu_ruler_over_livonia: "Zakon inflancki już nie istnieje. Na szczęście nasze rządy są równie sprawiedliwe i mądre jak jego, więc ludność ponownie może czuć się bezpiecznie."
 teu_teutonic_persistance: "Krzyżacka wytrwałość"
 desc_teu_teutonic_persistance: "Choć nasze wojska zostały co najmniej dwukrotnie rozbite w ciągu ostatnich dziesięcioleci, wola walki i obrony przed Polakami oraz Litwinami nadal pozostaje niezłomna."
 teu_pru_prussian_unification_wars: "Ambicja zjednoczeniowa"
 desc_teu_pru_prussian_unification_wars: "Koncentrujemy się na zjednoczeniu państw niemieckich. Słowem lub mieczem połączymy je pod naszym sztandarem, a nasi dyplomaci zadbają o to, by nasza sprawa była słuszna."
 teu_pru_saxon_productivity: "Saska produktywność"
 desc_teu_pru_saxon_productivity: "Sasi są pracowitym ludem, który wykazuje się innowacyjnością w produkcji porcelany. Na szczęście ich produktywność przyniesie bogactwo naszemu państwu."
 teu_pru_blood_and_iron: "Zjednoczenie krwią i żelazem"
 desc_teu_pru_blood_and_iron: "Święte Cesarstwo Rzymskie było słabe i zbyt zdecentralizowane, by chronić interesy narodu niemieckiego. Niemcy potrzebują silnego mocarstwa, które obroni ich przed obcymi potęgami. Zjednoczenia nie osiągnie się jednak przemówieniami i decyzjami większości, lecz krwią i żelazem."
 teu_pru_unifier_of_the_hre: "Zjednoczenie drogą dyplomacji"
 desc_teu_pru_unifier_of_the_hre: "Święte Cesarstwo Rzymskie zostało wreszcie zjednoczone pod naszym panowaniem. Państwa niemieckie przysięgły nam wierność! Do zjednoczenia naszego ludu nie potrzebowaliśmy ani żelaza, ani krwi, lecz potęgi pióra i słowa!"
 teu_pru_westphalian_uniforms: "Westfalskie sukno"
 desc_teu_pru_westphalian_uniforms: "Tekstylia z Westfalii są najwyższej jakości, dlatego wykorzystujemy je do produkcji mundurów dla naszych żołnierzy."
 teu_pru_university_of_konigsberg: "Uniwersytet w Królewcu"
 desc_teu_pru_university_of_konigsberg: "Uniwersytet w Królewcu jest prestiżową instytucją naukową, która wydała światu wielu filozofów."
 teu_pru_developed_prussia: "Rozbudowany rozwój"
 desc_teu_pru_developed_prussia: "Dzięki rozwojowi infrastruktury znacznie wzrosła na pewien czas efektywność poboru podatków, produkcji i pozyskiwania nowych rekrutów."
 teu_pru_prussian_enlightenment_modifier: "Pruskie oświecenie"
 desc_teu_pru_prussian_enlightenment_modifier: "Przyjęliśmy idee oświecenia i uzasadniamy nasze rządy nie religią, lecz nauką, potęgą i osobowością."
 teu_pru_embraced_the_revolution: "Przyjęcie rewolucji"
 desc_teu_pru_embraced_the_revolution: "Przyjęliśmy rewolucję! Monarchowie całego świata powinni obawiać się naszego zapału do wyzwalania ich poddanych spod tyranii!"
 teu_pru_crushed_the_revolution: "Stłumienie rewolucji"
 desc_teu_pru_crushed_the_revolution: "Stłumiliśmy rewolucję! Żadna rewolucja nie jest w stanie utrzymać państwa, chyba że jest to rewolucja odgórna!"
 teu_pru_nobles_in_general_positions: "Szlachta w korpusie generalskim"
 desc_teu_pru_nobles_in_general_positions: "W przeciwieństwie do szlachty w większości innych państw, możnowładcy naszego kraju są ściśle związani z wojskiem. Dzięki temu możemy być pewni, że nasza armia będzie doskonale wyszkolona."
 teu_prussian_electorate: "Elektorat pruski"
 desc_teu_prussian_electorate: "Uzyskaliśmy godność elektora Świętego Cesarstwa Rzymskiego. Aby ułatwić nam dostosowanie się do nowej pozycji, cesarz przydzielił nam tymczasowo dyplomatę."
 teu_rejects_imperial_protection: "Krzyżacka duma"
 desc_teu_rejects_imperial_protection: "Nasi rycerze są dumnymi wojownikami, którzy będą bronić naszego terytorium do ostatniego człowieka. Odrzucenie jakiejkolwiek ochrony ze strony Świętego Cesarstwa Rzymskiego zainspirowało ich do jeszcze zacieklejszej walki."
 teu_pru_integration_of_the_poles: "Integracja Polaków"
 desc_teu_pru_integration_of_the_poles: "Po podboju Polski wielu jej mieszkańców znalazło się w granicach naszego państwa. Aby utrzymać ścisłą kontrolę nad Polską, zintegrowaliśmy poszczególne kultury z naszym narodem i ograniczyliśmy w ten sposób ryzyko przyszłych buntów.\n\n§YModyfikator zostanie usunięty, jeśli zdegradujemy kulturę polską.§!"
 teu_pru_integration_of_the_ruthenians: "Integracja Rusinów"
 desc_teu_pru_integration_of_the_ruthenians: "Po podboju Rusi wielu jej mieszkańców znalazło się w granicach naszego państwa. Aby utrzymać ścisłą kontrolę nad tym regionem, zintegrowaliśmy poszczególne kultury z naszym narodem i ograniczyliśmy w ten sposób ryzyko przyszłych buntów.\n\n§YModyfikator zostanie usunięty, jeśli zdegradujemy kulturę rusińską.§!"
 teu_pru_integration_of_the_lithuanians: "Integracja Litwinów"
 desc_teu_pru_integration_of_the_lithuanians: "Po podboju Litwy wielu jej mieszkańców znalazło się w granicach naszego państwa. Aby utrzymać ścisłą kontrolę nad ziemiami litewskimi, zintegrowaliśmy Litwinów z naszym narodem i ograniczyliśmy w ten sposób ryzyko przyszłych buntów.\n\n§YModyfikator zostanie usunięty, jeśli zdegradujemy kulturę litewską.§!"
 teu_pru_wine_and_faith: "Wino i wiara"
 desc_teu_pru_wine_and_faith: "Prowincja ta znajduje się pod pruską kontrolą. Produktywność wina znacznie wzrosła, a misjonarze głoszą tu dobre słowo Boże. I wino."
 teu_pru_fortified_border: "Ufortyfikowana granica"
 desc_teu_pru_fortified_border: "Prowincja ta jest ufortyfikowana rozbudowanym systemem zamków, bastionów i innych umocnień obronnych, które mogą wytrzymać nawet intensywny ostrzał artyleryjski."
 teu_pru_prussian_empire: "Imperium Pruskie"
 desc_teu_pru_prussian_empire: "Nasze imperium tworzą liczne kultury, rozwój ziem i militaryzacja. Jesteśmy bastionem między rosyjskim carem a naszymi germańskimi braćmi na zachodzie! Chronimy narody polski, litewski i ruski!"
 teu_pru_prussian_navy: "Pruska doktryna morska"
 desc_teu_pru_prussian_navy: "Podobnie jak w przypadku naszej armii, również marynarka wojenna koncentruje się przede wszystkim na jakości i doświadczeniu zdobywanym podczas bitew morskich."
 teu_pru_expanded_cabinet: "Rozbudowany gabinet"
 desc_teu_pru_expanded_cabinet: "Zatrudnienie utalentowanych doradców wywołało reakcję łańcuchową, dzięki której nawiązaliśmy kontakty z kolejnymi kompetentnymi doradcami gotowymi służyć pomocą naszemu [Root.Monarch.GetTitle]."
 teu_pru_imperial_crown: "Korona cesarska"
 desc_teu_pru_imperial_crown: "Zdobyliśmy koronę cesarską Świętego Cesarstwa Rzymskiego. Naszym obowiązkiem i zaszczytnym przywilejem jest teraz ochrona Cesarstwa przed zagrożeniami zewnętrznymi i wewnętrznymi.\n\n§YModyfikator zostanie usunięty, gdy przestaniemy być cesarzem Świętego Cesarstwa Rzymskiego.§!"
 UNTIL_NO_MORE_EMPEROR: "do czasu, gdy przestaniemy być §Ycesarzem§! §YŚwiętego Cesarstwa Rzymskiego§!"
 teu_crusade_resistant_orthodox_belief: "Niezłomna wiara prawosławna"
 desc_teu_crusade_resistant_orthodox_belief: "Mieszkańcy tej prowincji uzyskali autonomię religijną od swojego krzyżowców zwierzchnika. Wszelkie próby ich nawrócenia spotkają się z silnym oporem."
 teu_crusade_end_of_the_schism: "Koniec schizmy"
 desc_teu_crusade_end_of_the_schism: "Zakończyliśmy schizmę! Nikt nie może kwestionować naszego autorytetu religijnego w sprawach chrześcijaństwa!"
 teu_crusade_teutonic_cathedral: "Katedra krzyżacka"
 desc_teu_crusade_teutonic_cathedral: "W prowincji tej znajduje się prestiżowa katedra założona przez zakon krzyżacki. W przeciwieństwie do większości katolickich katedr ta przyciąga jeszcze więcej wiernych na cotygodniowe modlitwy."
 teu_crusade_zeal_of_the_crusader: "Zapał krzyżowców"
 desc_teu_crusade_zeal_of_the_crusader: "Nasze podboje rozbudziły w misjonarzach niespotykany dotąd zapał religijny. Głoszą słowo Boże z takim żarem, z jakim płonęły wioski niewiernych!"
 teu_crusade_horses_of_the_steppes: "Konie stepów"
 desc_teu_crusade_horses_of_the_steppes: "Podbój stepów pontyjskich zapewnił nam dostęp do rodzimych ras koni z tego rozległego regionu. Dzięki nadwyżce koni utrzymanie naszej kawalerii stało się znacznie łatwiejsze, niż się spodziewaliśmy."
 teu_crusade_ottomans_vanquished: "Pokonani Osmanowie"
 desc_teu_crusade_ottomans_vanquished: "Pokonaliśmy Osmanów i wyparliśmy ich plagę z wybrzeży Europy. Całe chrześcijaństwo docenia nasze niestrudzone wysiłki, które doprowadziły do tego zwycięstwa."
 teu_crusade_inspired_by_the_teutons: "Zainspirowani zwycięstwem krzyżackim"
 desc_teu_crusade_inspired_by_the_teutons: "Prowincja ta była świadkiem zwycięstwa zakonu krzyżackiego nad Osmanami i znajduje się obecnie w całkowitym chaosie. Chrześcijanie domagają się niepodległości od swoich tureckich zwierzchników."
 teu_crusader_mil_reform_1_mod: "Doświadczenie z pola bitwy"
 desc_teu_crusader_mil_reform_1_mod: "Wygrane bitwy pokazały znaczenie właściwego wykorzystania kawalerii. Nasi wrogowie nadal opierali się jednak głównie na piechocie, dlatego zainteresowanie dalszym rozwijaniem naszych zdolności kawaleryjskich pozostaje na razie niewielkie."
 teu_crusader_mil_reform_2_mod: "Zreformowana armia"
 desc_teu_crusader_mil_reform_2_mod: "Stosowane przez nas taktyki wojskowe zostały zmodernizowane i dostosowane do warunków terenowych oraz przeciwników Europy Wschodniej."
 teu_crusader_mil_reform_3_mod: "Armia przystosowana do równin"
 desc_teu_crusader_mil_reform_3_mod: "Zaczęliśmy wykorzystywać więcej koni w naszych oddziałach, czyniąc je bardziej mobilną i zabójczą siłą na równinach i stepach."
 teu_crusader_mil_reform_4_mod: "Konna armia krzyżowców"
 desc_teu_crusader_mil_reform_4_mod: "Nasza armia została ponownie zreformowana. Przystosowała się do rozległych, pustych stepów i wykorzystuje teraz kawalerię jako główną siłę uderzeniową. Przejęliśmy taktyki hord..."
 teu_crusader_the_great_missionaries: "Święta misja"
 desc_teu_crusader_the_great_missionaries: "Ogromna liczba nawróconych przez nas prowincji przekonała wiernych o słuszności naszej świętej misji."
 teu_crusader_a_fortified_order: "Ufortyfikowany zakon"
 desc_teu_crusader_a_fortified_order: "Nasz święty zakon rozbudował system fortyfikacji na swoich ziemiach. Inwazja na nasze państwo stanie się trudnym zadaniem dla każdego wroga."
 teu_crusader_crushed_the_reformation: "Zmiażdżona reformacja"
 desc_teu_crusader_crushed_the_reformation: "Nasz wspaniały zakon nie tylko oparł się pokusom przeklętej reformacji, lecz także ją zmiażdżył wraz z każdym, kto był na tyle nierozsądny, by podążyć tą grzeszną ścieżką!"
 imperial_prussian_capital: "Cesarska stolica Prus"
 desc_imperial_prussian_capital: "Prowincja ta jest centrum administracyjnym rządu pruskiego. W tym mieście sprawy administracyjne całego kraju są prowadzone z niezrównaną skutecznością."
 holy_horde_capital: "Stolica świętej hordy"
 desc_holy_horde_capital: "Stolica świętej hordy krzyżowców. Żołnierze religijni z całego imperium przybywają do tego ważnego miasta, aby wziąć udział w poborze."
 teu_prussian_electorship: "Dyplomacja niemiecka"
 desc_teu_prussian_electorship: "Niemiecka dyplomacja może nie dorównuje najlepszym na świecie, lecz w granicach Niemiec radzi sobie całkiem dobrze."
 teu_integrated_cossacks: "Zintegrowani Kozacy"
 desc_teu_integrated_cossacks: "Kozacy ze stepów ruskich zostali włączeni w szeregi naszych wojsk. Choć nie było to łatwe zadanie, ostatecznie przystosowali się do pruskiego stylu życia w naszej armii."
 teu_holy_horde_modifier: "Święta horda"
 desc_teu_holy_horde_modifier: "Rozległe stepy na wschodzie muszą zostać podbite. To nasze przeznaczenie jako krzyżowców."
 purchase_the_electorate_title: "Zakup elektoratu"
 purchase_the_electorate_desc: "Dukaty to potężne narzędzie. Nie tylko w świecie handlu, ale także w świecie polityki międzynarodowej. Możliwe jest wykupienie roli elektora od cesarza."
 purchase_the_electorate_ct: "Nie proszono cesarza o elektorat w ciągu ostatnich §Y2 lat§!."
 purchase_the_electorate_tt: "Zaoferujemy panstwu §Y[Emperor.GetName]§! §Y6000§! ¤ za przeniesienie elektoratu z naszego poddanego na nas."
 request_the_electorate_title: "Prośba o elektorat"
 request_the_electorate_desc: "Ponieważ jesteśmy ściśle związani z Cesarzem, może być możliwe zażądanie przeniesienia elektoratu od naszego poddanego do nas. Wszystko, co musimy zrobić, to przyjaźnie poprosić."
 request_the_electorate_tt: "Poprosimy państwo §Y[Emperor.GetName]§! o przeniesienie elektoratu z naszego poddanego do nas."
 usurp_the_electorate_title: "Uzurpuj Elektorat"
 usurp_the_electorate_desc: "Jako że jesteśmy cesarzem Świętego Cesarstwa Rzymskiego, mamy prawo przejąć i rozdzielić prawo do wyboru następnego cesarza tak, jak nam się podoba. Ponieważ jeden z naszych poddanych ma takie prawo, przeniesienie elektoratu na nas jest więcej niż uzasadnione."
 dnz_danzig_and_the_empire_title: "Lojalność stanów"
 dnz_danzig_and_the_empire_desc: "Przyszłość naszego państwa jest nieznana, ale jedno jest pewne: niezależnie od kierunku, jaki obierze państwo [Root.GetName], stany muszą stanąć po stronie naszego [Root.Monarch.GetTitle]."
 dnz_stabilize_the_republic_title: "Stabilne rządy"
 dnz_stabilize_the_republic_desc: "Nasz [Root.GovernmentName] jest stosunkowo młody w porównaniu z otaczającymi nas monarchiami. Tamte państwa zdołały już przezwyciężyć wewnętrzne problemy oraz osiągnąć bezpieczeństwo i dobrobyt. Jeśli chcemy z nimi konkurować, musimy zadbać o stabilność."
 dnz_great_city_of_danzig_title: "Wielkie miasto Gdańsk"
 dnz_great_city_of_danzig_desc: "Gdańsk jest klejnotem Morza Bałtyckiego, przyciągającym kupców z Niemiec, Skandynawii, Polski, a nawet Rusi. Tak cenny ośrodek należy rozbudować i dalej rozwijać."
 dnz_secure_prussia_title: "Zabezpiecz Prusy"
 dnz_secure_prussia_desc: "Ziemie pruskie są okupowane przez aroganckich rycerzy zakonu krzyżackiego. Stanowią również przedmiot zainteresowania Królestwa Polskiego.\nŻadne z tych państw nie będzie kontrolować Prus, ponieważ ziemie te należą do nas!"
 dnz_expand_into_poland_title: "Ekspansja ku Polsce"
 dnz_expand_into_poland_desc: "Polskie tereny Wielkopolski i Kujaw są żyzne i wysoko rozwinięte. Służą one również jako źródła Zasobów ludzkich dla Polski, która wykorzystuje tych ludzi do walki z nami. Powinniśmy podbić te ziemie dla naszego dobra."
 dnz_army_of_the_republic_title: "Wielka Armia Gdańska"
 dnz_army_of_the_republic_desc: "Nasze [Root.GovernmentName] jest kruche i stanowi łatwy łup dla naszych rywali i wrogów, a nasza obrona jest przede wszystkim na terenie naszej stolicy. Musimy stworzyć Wielką Armię [Root.GovernmentName], aby przeciwdziałać rosnącemu zagrożeniu ze strony naszych sąsiadów."
 flavor_dnz.1.t: "Przyszłość Gdańska"
 flavor_dnz.1.desc: "Nasze [Root.GovernmentName] jest otoczone przez Święte Cesarstwo Rzymskie, Królestwo Polskie i Królestwa Skandynawskie. Podczas gdy niektórzy w naszym państwie widzą to jako niepewną sytuację, inni widzą to jako sposób na ekspansję. Tak czy inaczej, przyszłość Gdańska jest niepewna, ale jest w naszych rękach."
 flavor_dnz.1.a: "Nasz los spoczywa na ziemiach Niemiec."
 flavor_dnz.1.b: "Będziemy kształtować naszą przyszłość na ziemiach Polski."
 flavor_dnz.1.b.tt: "Odblokuj ścieżkę misji §YPruskiej republiki§!"
 dnz_development_investment: "Inwestycje w rozwój"
 desc_dnz_development_investment: "Stabilizacja naszych rządów zachęciła wielu mieszkańców do zaangażowania się w rozwój posiadanych przez nas ziem."
 dnz_path_of_conquest: "Droga podboju"
 desc_dnz_path_of_conquest: "Zjednoczenie Prus pod naszym sztandarem rozbudziło w żołnierzach i urzędnikach zapał do kontynuowania podbojów."
 liv_improve_diplomatic_abilities_title: "Rozwiń nasze zdolności dyplomatyczne"
 liv_improve_diplomatic_abilities_desc: "Nasze państwo graniczy z potężnymi wrogami, którzy chcą podbić nasze ziemie. Musimy skupić się na dyplomacji, aby znaleźć sojuszników przeciwko naszym przeciwnikom."
 liv_find_strong_allies_title: "Znajdź potężnych sojuszników"
 liv_find_strong_allies_desc: "Nasza sytuacja jest niepewna, ponieważ Litwa, Nowogród i Skandynawowie znajdują się tuż za naszymi granicami. Powinniśmy jak najszybciej znaleźć silnych sojuszników, aby potencjalni najeźdźcy dwa razy się zastanowili, zanim odważą się nas zaatakować."
 liv_find_strong_allies_tt: "Posiada co najmniej §Y150§! własnego rozwoju oraz rozwoju poddanych niebędących państwami trybutarnymi, a także co najmniej §Y150§! punktów opinii o państwie [Root.GetName]."
 liv_handle_teutonic_order_title: "Rycerze zakonu krzyżackiego"
 liv_handle_teutonic_order_desc: "W 1236 roku Zakon Kawalerów Mieczowych został pokonany przez Żmudzinów i ich semigalskich sojuszników. Pozostałości zakonu włączono w 1237 roku do zakonu krzyżackiego, co ostatecznie doprowadziło do powstania zakonu inflanckiego. De iure wielki mistrz zakonu krzyżackiego jest naszym zwierzchnikiem, lecz de facto oba zakony są raczej autonomicznymi sojusznikami.\nWojny między zakonem krzyżackim a Polską pokazały, że rycerze krzyżaccy nie są już tak sprawni militarnie jak dawniej. Nadszedł czas, by pomóc naszym braciom w Prusach, odnawiając z nimi sojusz — lub zastępując ich archaiczną administrację naszymi znacznie lepszymi rządami."
 liv_handle_teutonic_order_at: "Jest sojusznikiem lub poddanym państwa §Y[Root.GetName]§! i ma co najmniej §Y150§! punktów opinii o państwie [Root.GetName].\n"
 liv_handle_teutonic_order_bt: "Jest rywalem lub wrogiem państwa §Y[Root.GetName]§!, a państwo [Root.GetName] ma przeciwko niemu casus belli §YZajęcie terytorium§! przeciwko państwu [This.GetName]."
 liv_handle_teutonic_order_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli jesteśmy sojusznikiem §YZakonu Krzyżackiego§! lub podporządkowaliśmy go sobie, zyskujemy §G15§! zaufania i §G20§! przysług wobec zakonu krzyżackiego.\n\nJeśli rywalizujemy z §YZakonem Krzyżackim§!, otrzymujemy przeciwko niemu casus belli §YPodporządkowanie§!.\n\nJeśli §YZakon Krzyżacki§! nie istnieje, otrzymujemy §G100§! punktów siły militarnej."
 liv_handle_riga_title: "Chroń Rygę"
 liv_handle_riga_desc: "Ryga jest siedzibą miejscowego biskupstwa i jednym z najważniejszych portów handlowych w krajach bałtyckich. Jako spadkobiercy Zakonu Kawalerów Mieczowych mamy obowiązek chronić miasto i biskupstwo przed zagrożeniami zewnętrznymi."
 liv_strengthen_ruling_authority_title: "Umocnij naszą władzę"
 liv_strengthen_ruling_authority_desc: "Nasze państwo jest rządzone przez niemiecką mniejszość, która sprawuje władzę nad rzeszami miejscowej ludności. Musimy umocnić naszą pozycję i zadbać o zadowolenie Estończyków oraz Łotyszy, aby utrzymać stabilność państwa."
 liv_strengthen_ruling_authority_ct: "Ustanów §YZakon Krzyżacki§! historycznym przyjacielem, jeśli jest poddanym państwa §Y[Root.GetName]§! i nie jest już historycznym przyjacielem państwa §Y[Root.GetName]§!."
 liv_lva_strengthen_the_state_title: "[Root.GetPreviewColorLIV]Zsekularyzuj zakon[Root.GetPreviewColorLIV_end]"
 liv_lva_strengthen_the_state_desc: "Prawa i idee naszego zakonu zostały pierwotnie stworzone przez Zakon Kawalerów Mieczowych i opierają się na walce z poganami. Obecnie mają już co najmniej 200 lat i są mocno przestarzałe.\nZakony rycerskie spełniły swoje zadanie, lecz teraz nadszedł czas, by przekształcić się w świeckie państwo."
 liv_lva_competent_rule_title: "Utwórz sejm stanowy"
 liv_lva_competent_rule_desc: "Ziemie inflanckie są domem dla miast hanzeatyckich, pobożnych biskupstw i naszego zakonu. Naturalnie nieuniknione są wewnętrzne spory i konflikty. W 1419 roku arcybiskup Ambundii zainicjował pierwsze zgromadzenie Landtagu — sejmu inflanckiego — aby rozwiązać te problemy.\nJednak dawny sejm jest przestarzały i nie obejmuje wszystkich spraw państwa. Nadszedł czas, by zlikwidować stary Landtag i utworzyć prawdziwy sejm stanowy."
 liv_handle_internal_struggle_title: "Konfederacja inflancka"
 liv_handle_internal_struggle_desc: "Konfederacja inflancka była luźno zorganizowanym związkiem pod naszym przewodnictwem, utworzonym w 1435 roku. Jest to sojusz obronny pięciu biskupstw i zakonu inflanckiego, mający chronić niemieckie panowanie nad Kurlandią, Inflantami i Estonią przed zagrożeniem ze strony Nowogrodu i jego Kościoła prawosławnego.\nPoszczególne biskupstwa konfederacji nie są jednak naszymi poddanymi, lecz autonomicznymi państwami, które często toczą ze sobą drobne spory. Nadszedł czas, by rozwiązać konfederację i włączyć ziemie biskupstw do naszego państwa."
 liv_expand_army_title: "Rozbuduj armię"
 liv_expand_army_desc: "Bitwa pod Wiłkomierzem w 1435 roku była dla nas sygnałem alarmowym, ponieważ kosztowała życie naszego landmistrza i kilku wysoko postawionych rycerzy. Musimy przygotować nasze siły i rozbudować armię, aby uniknąć kolejnej tragedii na miarę Wiłkomierza."
 liv_fortify_land_title: "Ufortyfikuj Inflanty"
 liv_fortify_land_desc: "Ziemie Kurlandii, Inflant i Estonii są dość płaskie, przez co trudno chronić je przed najeźdźcami. Powinniśmy wznieść fortyfikacje w naszym kraju, aby zrekompensować brak naturalnych przeszkód obronnych."
 liv_fortify_land_tt: "Losowy fort na obszarach §YKurlandii§!, §YInflant§! i §YEstonii§! otrzymuje do końca gry modyfikator „§YUfortyfikowana granica§!”, zapewniający następujące efekty:\nLokalna obronność: §G+50,0%§!\nLokalny rozmiar garnizonu: §G+25,0%§!\nLokalne utrzymanie fortu: §G-90,0%§!\n\nModyfikator otrzymają maksymalnie §Y4§! prowincje."
 liv_lva_colonial_ambitions_title: "[Root.GetPreviewColorLIV]Ambicje kolonialne[Root.GetPreviewColorLIV_end]"
 liv_lva_colonial_ambitions_desc: "Nadchodzi nowa era. Epoka średniowiecznych wojen w Europie dobiega końca, a wielkie mocarstwa poszukują nowych ziem na zachodzie, aby rozszerzyć swoje wpływy.\nNie możemy pozwolić sobie na pozostanie w tyle tylko dlatego, że znajdujemy się nad Bałtykiem!"
 liv_lva_discover_new_world_title: "[Root.GetPreviewColorLIV]Odkryj Nowy Świat[Root.GetPreviewColorLIV_end]"
 liv_lva_discover_new_world_desc: "Musimy odkryć cuda Nowego Świata. W końcu trudno skolonizować ziemie, których nie ma na naszych mapach."
 liv_lva_colonize_north_america_title: "[Root.GetPreviewColorLIV]Skolonizuj Amerykę Północną[Root.GetPreviewColorLIV_end]"
 liv_lva_colonize_north_america_desc: "Kontynent Ameryki Północnej oferuje nam wiele możliwości. Wspaniałe i niezwykłe towary, takie jak tytoń, będą bardzo cenne na naszych rynkach."
 liv_lva_colonize_north_america_tt: "Bałtycko-amerykańskie połączenie handlowe"
 liv_lva_livonian_caribbeans_title: "[Root.GetPreviewColorLIV]Kolonia na Karaibach[Root.GetPreviewColorLIV_end]"
 liv_lva_livonian_caribbeans_desc: "Karaiby są centrum całego handlu Nowego Świata. Towary z Ameryki Północnej i Południowej trafiają tam, skąd następnie kierowane są do Europy.\nMusimy zabezpieczyć te wyspy dla siebie!"
 liv_lva_livonian_caribbeans_tt: "Bałtycko-karaibskie połączenie handlowe"
 liv_lva_dominate_colonial_trade_title: "[Root.GetPreviewColorLIV]Zdominuj handel kolonialny[Root.GetPreviewColorLIV_end]"
 liv_lva_dominate_colonial_trade_desc: "Zakładanie kolonii w Nowym Świecie nie ma sensu, jeśli nie potrafimy czerpać z nich zysków. Musimy zapewnić sobie monopol na handel Ameryki Północnej i Południowej."
 liv_lva_dominate_colonial_trade_tt: "Wszystkie węzły handlowe w §YAmeryce Północnej§! i §YAmeryce Południowej§!:\n §Y[Root.GetName]§! ma w nich albo §Ynajwiększą siłę handlu§!, albo co najmniej §Y35%§! siły handlu."
 liv_lva_a_random_world_title: "[Root.GetPreviewColorLIV]Dziwny, nowy świat[Root.GetPreviewColorLIV_end]"
 liv_lva_a_random_world_desc: "Musimy odkryć cuda Nowego Świata. W końcu trudno skolonizować ziemie, których nie ma na naszych mapach."
 liv_lva_settle_the_new_world_title: "[Root.GetPreviewColorLIV]Zasiedl Nowy Świat[Root.GetPreviewColorLIV_end]"
 liv_lva_settle_the_new_world_desc: "Nowy Świat obfituje w zasoby i towary zupełnie nam nieznane. Rozsądnie byłoby jak najszybciej założyć tam osady i wykorzystać te bogactwa."
 liv_lva_dominate_new_world_trade_title: "[Root.GetPreviewColorLIV]Zdominuj Nowy Świat[Root.GetPreviewColorLIV_end]"
 liv_lva_dominate_new_world_trade_desc: "Nowy Świat znacznie zwiększa naszą potęgę, lecz nie tylko my chcemy wykorzystać te nowe kontynenty. Musimy dopilnować, by żaden z naszych rywali nie zdołał postawić stopy w Nowym Świecie!"
 liv_lva_colonize_west_africa_title: "[Root.GetPreviewColorLIV]Skolonizuj Afrykę Zachodnią[Root.GetPreviewColorLIV_end]"
 liv_lva_colonize_west_africa_desc: "Szlaki handlowe Afryki Zachodniej są bardzo pożądane przez naszych kolonialnych rywali. Na szczęście zapominają oni o złocie ukrytym w głębi tego regionu. Prawdopodobnie nie zdołamy zdominować całego handlu afrykańskiego, lecz jeden port zapewniający dostęp do złota może nam w zupełności wystarczyć."
 liv_lva_colonize_west_africa_tt: "Każda posiadana prowincja w regionie §YNiger§!, która produkuje §Yzłoto§! otrzymuje '§Yzintensyfikowane wydobycie złota§!' do końca gry, dając następujące efekty:\nModyfikator lokalnie produkowanych towarów: §G+25.0%§!\nSzansa na wyczerpanie lokalnego złota: §G-15.0%§!"
 liv_lva_reach_the_cape_title: "[Root.GetPreviewColorLIV]Dotrzyj do Przylądka[Root.GetPreviewColorLIV_end]"
 liv_lva_reach_the_cape_desc: "Przylądek Dobrej Nadziei jest głównym przystankiem dla kupców z Europy podróżujących do Azji i z powrotem. Kto kontroluje Przylądek, ten kontroluje również handel między Europą a Azją. Nic dziwnego, że o ten obszar zaciekle rywalizują wszyscy pragnący dominacji w handlu afrykańsko-azjatyckim."
 liv_lva_reach_the_cape_tt: "Państwo §Y[Root.GetName]§! otrzymuje stałe roszczenia do każdej prowincji z §Ycentrum handlu§! lub §Yestuarium§! w węźle handlowym §YKoromandel§!."
 liv_lva_trade_in_india_title: "[Root.GetPreviewColorLIV]Utwórz porty w Indiach[Root.GetPreviewColorLIV_end]"
 liv_lva_trade_in_india_desc: "Indie są niezwykle dochodowym regionem dla kupców i handlarzy z całej Europy — również naszych. Oczywiście musimy uzyskać dostęp do tego bogatego subkontynentu.\nNasi doradcy sugerują, aby... przejąć kilka kluczowych portów w Indiach, dzięki czemu nasi kupcy będą mogli prowadzić tam działalność."
 liv_lva_trade_in_india_tt: "Znajduje się w węźle handlowym §YKoromandel§!."
 liv_lva_expand_the_fleet_title: "[Root.GetPreviewColorLIV]Rozbuduj flotę[Root.GetPreviewColorLIV_end]"
 liv_lva_expand_the_fleet_desc: "Kluczowym warunkiem dobrobytu każdego państwa jest zapewnienie stałego strumienia dochodów. Niektóre rządy osiągają to dzięki podatkom lub łupom.\nMy natomiast czerpiemy dochody z handlu na Morzu Bałtyckim. Rozbudujmy naszą flotę handlową, aby chronić dominację na Bałtyku."
 liv_lva_construct_markets_title: "[Root.GetPreviewColorLIV]Zbuduj targowiska[Root.GetPreviewColorLIV_end]"
 liv_lva_construct_markets_desc: "Choć nasze miasta zostały założone przez Hanzę, nie są w stanie skutecznie konkurować z Lubeką. Powinniśmy rozbudować targowiska w tych miastach i zabezpieczyć handel na Morzu Bałtyckim."
 liv_lva_construct_markets_tt: "Bałtyckie targowiska"
 liv_lva_dominate_lubeck_trade_title: "[Root.GetPreviewColorLIV]Rozpraw się z Hanzą[Root.GetPreviewColorLIV_end]"
 liv_lva_dominate_lubeck_trade_desc: "Hanza jest najpotężniejszą federacją handlową północnych Niemiec. Zdobycie jakiejkolwiek pozycji na rynku Lubeki będzie niezwykle trudne.\nNie jest to jednak niemożliwe. Dzięki dyplomacji, ustępstwom lub sile możemy uzyskać dostęp do tego rynku i znacznie zwiększyć zyski z handlu."
 liv_lva_dominate_lubeck_trade_tt: "\n§YModyfikator handlowy zostanie zmniejszony do §R20,0§! siły handlu w Lubece, jeśli będziemy posiadać jakąkolwiek prowincję z centrum handlu, estuarium lub modyfikatorem cła sundzkiego w węźle handlowym Lubeki.§!"
 liv_lva_dominate_lubeck_trade_at: "§Y[HSA.GetName]§! jest albo §Ypoddanym§!, albo §Ysojusznikiem§! z poziomem zaufania co najmniej §Y80§! wobec państwa §Y[Root.GetName]§!."
 liv_lva_dominate_lubeck_trade_bt: "§Y[HSA.GetName]§! jest §Yobjęte embargiem§! nałożonym przez państwo §Y[Root.GetName]§!, a państwo §Y[Root.GetName]§! posiada co najmniej §Y50§! siły handlu w węźle handlowym §YLubeki§!."
 liv_lva_dominate_lubeck_trade_no_provinces: "Dostęp do handlu Hanzy"
 liv_lva_dominate_lubeck_trade_provinces: "Ograniczony dostęp do handlu Hanzy"
 liv_lva_develop_livonia_title: "[Root.GetPreviewColorLIV]Rozwiń Inflanty[Root.GetPreviewColorLIV_end]"
 liv_lva_develop_livonia_desc: "Nasze państwo jest stosunkowo niewielkie w porównaniu z ziemiami sąsiadów, lecz ma duży potencjał. Powinniśmy rozwinąć infrastrukturę Kurlandii, Inflant i Estonii, aby w pełni wykorzystać możliwości tych ziem."
 liv_lva_develop_livonia_tt: "Każda prowincja (z wyjątkiem §Y[38.GetName]§!) na obszarach §YKurlandii§!, §YInflant§! i §YEstonii§! należy do państwa §Y[Root.GetName]§! i ma co najmniej §Y10§! rozwoju."
 liv_lva_develop_livonia_ct: "Każda posiadana prowincja na obszarach §YKurlandii§!, §YInflant§! i §YEstonii§! o rozwoju co najmniej §Y10§! otrzymuje na §Y25 lat§! modyfikator „§YRozbudowane ziemie§!”, zapewniający następujące efekty:\nLokalny koszt budowy: §G-15,0%§!\nLokalny czas budowy: §G-25,0%§!\nLokalne niepokoje: §G-2,00§!"
 liv_lva_riga_capital_title: "[Root.GetPreviewColorLIV]Uczyń Rygę naszą stolicą[Root.GetPreviewColorLIV_end]"
 liv_lva_riga_capital_desc: "Położenie Rygi nad Dźwiną czyni z niej doskonałe miasto dla handlu bałtyckiego. Choć nie jest tak rozwinięta jak Królewiec czy Gdańsk, Ryga jest prawdziwym klejnotem Morza Bałtyckiego.\nPowinniśmy przenieść stolicę do tego zamożnego miasta i rozbudować jego zabudowę."
 liv_lva_construct_universities_title: "[Root.GetPreviewColorLIV]Wznieś uniwersytety[Root.GetPreviewColorLIV_end]"
 liv_lva_construct_universities_desc: "Oświecenie ogarnęło świat. Ludzie zaczynają kwestionować rządy nielicznych. Nauka i edukacja zastępują religię w naszym społeczeństwie.\nPowinniśmy podążyć za tym trendem i rozpocząć budowę uniwersytetów w naszym kraju, aby szerzyć idee oświecenia."
 liv_lva_take_over_neva_title: "[Root.GetPreviewColorLIV]Przejmij Newę[Root.GetPreviewColorLIV_end]"
 liv_lva_take_over_neva_desc: "Nowogrodzka prowincja Newa ma strategiczne znaczenie. Jest nie tylko ważnym centrum handlu, lecz także jedynym dogodnym dostępem Rusinów do Bałtyku. Zaleca się podbicie tej prowincji i odcięcie Rosjan na wschodzie od Morza Bałtyckiego, zanim będą mogli wykorzystać ją do prowadzenia przeciwko nam działań wojennych."
 liv_lva_handle_polish_threat_title: "[Root.GetPreviewColorLIV]Zajmij się Polską[Root.GetPreviewColorLIV_end]"
 liv_lva_handle_polish_threat_desc: "Polska jest jednym z silniejszych królestw Europy Wschodniej. Zwycięstwa odnoszone w wojnach między tym królestwem a niegdyś potężnym zakonem krzyżackim świadczą o jej przewadze militarnej.\nW przeciwieństwie do Prusów z zakonu krzyżackiego nasze państwo nigdy nie miało poważnych problemów z samą Polską. Dla własnego przetrwania powinniśmy nawiązać kontakt z Polakami i zawrzeć z nimi sojusz."
 liv_lva_handle_polish_threat_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy tę misję poprzez pokonanie państwa §Y[GetPolandPLC]§!, otrzymamy na §Y25 lat§! modyfikator „§YZwycięstwo nad Polską§!”, zapewniający następujące efekty:\nMorale armii: §G+10,0%§!\nKoszt tworzenia rdzenia: §G-10,0%§!\n\nJeśli ukończymy tę misję poprzez zawarcie sojuszu z państwem §Y[GetPolandPLC]§!, otrzymamy na §Y25 lat§! modyfikator „§YSojusz z Polską§!”, zapewniający następujące efekty:\nRelacje dyplomatyczne: §G+1§!\nMiesięczny przyrost przysług: §G+25,0%§!\n\nJeśli ukończymy tę misję, gdy państwo §Y[GetPolandPLC]§! nie istnieje, otrzymamy na §Y25 lat§! modyfikator „§YZdobywcy z Bałtyku§!”, zapewniający następujący efekt:\nLata separatyzmu: §G-10§!"
 liv_lva_prussian_alliance_title: "[Root.GetPreviewColorLIV]Sojusz z Prusami[Root.GetPreviewColorLIV_end]"
 liv_lva_prussian_alliance_desc: "Prusowie, niegdyś rycerze zakonu krzyżackiego, są doświadczonymi wojskowymi i mężami stanu. Ich umiejętności administracyjne oraz zdolność do wystawiania doskonale zdyscyplinowanych żołnierzy są powszechnie znane.\nŁączy nas wspólna historia dawnych zakonów rycerskich oraz państw niemieckich, które uczyniły z krajów bałtyckich swój dom."
 liv_lva_prussian_alliance_dt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli ukończymy tę misję poprzez zawarcie sojuszu z państwem §YPrusy§!, uruchomi się wydarzenie „§YSojusz prusko-inflancki§!”.\n\nW przeciwnym razie otrzymamy na §Y30 lat§! modyfikator „§YPruska armia§!”, zapewniający następujące efekty:\nRoczna tradycja armii: §G+1,00§!\nRoczny profesjonalizm armii: §G+1,0%§!"
 liv_lva_prussian_alliance_at: "Jest po tej samej stronie wojny co państwo §Y[PRU.GetName]§!, ma co najmniej §Y50%§! wyniku wojny i jest sojusznikiem państwa §Y[PRU.GetName]§!."
 liv_lva_prussian_alliance_bt: "Ma państwo §Y[PRU.GetName]§! jako poddanego z pragnieniem wolności niższym niż §Y10%§!."
 liv_lva_prussian_alliance_ct: "Posiada całe §YZachodnie§! i §YWschodnie Prusy§! oraz zaakceptowało kulturę §Ypruską§!."
 liv_lva_reform_the_government_title: "[Root.GetPreviewColorLIV]Zreformuj rząd[Root.GetPreviewColorLIV_end]"
 liv_lva_reform_the_government_desc: "Nasi sąsiedzi opracowali specjalne systemy, prawa i polityki, aby sprawnie zarządzać swoimi państwami. Ich rządy są dostosowane do potrzeb, dzięki czemu są przygotowani na każde wyzwanie.\nNasz [Root.GovernmentName] jest stosunkowo młody w porównaniu z resztą Europy. Jesteśmy niezapisaną kartą, która czeka na swój los."
 liv_lva_reform_the_government_tt: "Państwo §Y[Root.GetName]§! rozpocznie łańcuch wydarzeń, który ukształtuje przyszły §Y[Root.GetAdjective] rząd§!."
 liv_lva_complete_your_government_title: "[Root.GetPreviewColorLIV]Monarchia inflancka[Root.GetPreviewColorLIV_end]"
 liv_lva_complete_your_government_desc: "Prusowie na południu zreformowali swój system wojskowy i ustanowili rząd, który można opisać jako „armię z państwem”. Ich prawdziwy sukces polega jednak na sprawności administracji kraju — militaryzacja jest jedynie owocem ich systemu rządów.\nPowinniśmy uczyć się od naszych pruskich sąsiadów, zreformować państwo i wprowadzić sprawną administrację."
 liv_lva_complete_your_government_tt: "Uruchomiło się wszystkich §Y6§! wydarzeń dotyczących rządu inflanckiego dla państwa §Y[Root.GetName]§! (§Y[Root.GetLivonianGovernmentEventsFired]§!/§Y6§!)."
 NUM_OF_LIVONIAN_GOVERNMENT_EVENTS_TT: "[Root.liv_event_counter.GetValue]"
 liv_conquer_prussia_title: "[Root.GetPreviewColorLIV]Podbij Prusy[Root.GetPreviewColorLIV_end]"
 liv_conquer_prussia_desc: "Nasz zakon inflancki powstał jako odłam zakonu krzyżackiego po druzgocącej klęsce Zakonu Kawalerów Mieczowych w 1236 roku. Od tamtej pory nasze więzi z dawnymi braćmi osłabły, a nasze drogi się rozeszły. Powinniśmy spróbować odnowić relacje z naszą dawną pruską ojczyzną poprzez podbój."
 liv_conquer_lithuania_title: "[Root.GetPreviewColorLIV]Podbij Litwę[Root.GetPreviewColorLIV_end]"
 liv_conquer_lithuania_desc: "Litwini od stuleci są cierniem w naszym boku, a porażka w bitwie pod Wiłkomierzem w 1435 roku kosztowała nas życie wielu ludzi, w tym wielkiego mistrza. Nadszedł czas, by raz na zawsze ich podbić i zakończyć zagrożenie z południa!"
 liv_livonian_baltic_lands_title: "[Root.GetPreviewColorLIV]Rozwiń ziemie bałtyckie[Root.GetPreviewColorLIV_end]"
 liv_livonian_baltic_lands_desc: "Ziemie bałtyckie mają ogromną wartość dla każdego, kto interesuje się handlem na Morzu Bałtyckim. Miasta takie jak Ryga, Gdańsk czy Wilno stanowią serce handlu, a kultury łotewska, estońska i litewska nadają temu regionowi jego charakter.\nPowinniśmy rozwijać te ziemie i zapewnić dobrobyt ludom bałtyckim."
 liv_connect_with_the_pope_title: "[Root.GetPreviewColorLIV]Więzi z papiestwem[Root.GetPreviewColorLIV_end]"
 liv_connect_with_the_pope_desc: "Od XIII wieku nasz zakon stanowi bastion wiary katolickiej we wschodniej części Bałtyku. Jednak po schizmie zachodniej nasze relacje z papiestwem uległy pogorszeniu, a porażki ostatnich dziesięcioleci postawiły nas w trudnym położeniu. Musimy odbudować więzi ze Stolicą Apostolską, ponieważ w nadchodzących latach możemy potrzebować jej poparcia."
 liv_ensure_religious_unity_title: "[Root.GetPreviewColorLIV]Zapewnij jedność religijną[Root.GetPreviewColorLIV_end]"
 liv_ensure_religious_unity_desc: "W ostatnich latach nasze terytorium znacznie się powiększyło. Musimy zadbać o to, by wszyscy nasi poddani zostali ochrzczeni i nawróceni na jedyną prawdziwą wiarę katolicką, ponieważ jest to nasza główna misja i obowiązek."
 liv_land_of_churches_title: "[Root.GetPreviewColorLIV]Kraina kościołów[Root.GetPreviewColorLIV_end]"
 liv_land_of_churches_desc: "Aby zapewnić, że nasi poddani pozostaną wierni katolicyzmowi, musimy utworzyć sieć parafii, która umożliwi odprawianie mszy na całym naszym terytorium i pozwoli kapłanom prowadzić powierzoną im trzodę."
 liv_land_of_churches_tt: "z posiadanych prowincji §Ykatolickich§!, które mają §Ykościół§! lub §Ykatedrę§!"
 liv_build_cathedrals_title: "[Root.GetPreviewColorLIV]Domy Boże[Root.GetPreviewColorLIV_end]"
 liv_build_cathedrals_desc: "Biskupstwa Estonii, Inflant i Kurlandii wzniosły katedry ku chwale Pana. Te Domy Boże nie są już jednak utrzymywane, ponieważ biskupstwa przestały istnieć. Naszym obowiązkiem jest odnowić stare katedry i wznieść nowe ku chwale Pana!"
 liv_proclaim_defender_of_faith_title: "[Root.GetPreviewColorLIV]Obrońca wiary[Root.GetPreviewColorLIV_end]"
 liv_proclaim_defender_of_faith_desc: "Nasza misja ewangelizacyjna w krajach bałtyckich wymaga, by nasz zakon został ogłoszony bastionem i obrońcą jedynej prawdziwej wiary w regionie, którą należy szerzyć wśród naszych katolickich braci."
 liv_proclaim_defender_of_faith_tt: "Przez §Y25§! kolejnych lat pozostaje §YObrońcą Wiary§!, nie tracąc w żadnym momencie tego tytułu."
 liv_proclaim_defender_of_faith_ct: "§YModyfikator ten można odzyskać, gdy ponownie zdobędziemy tytuł Obrońcy Wiary Katolickiej.§!"
 liv_ally_the_emperor_title: "[Root.GetPreviewColorLIV]Zawrzyj sojusz z cesarzem[Root.GetPreviewColorLIV_end]"
 liv_ally_the_emperor_desc: "Reformacja rozprzestrzeniła się, dzieląc Kościół katolicki. Najlepszym sposobem na umocnienie zwierzchnictwa Stolicy Apostolskiej może być zawarcie sojuszu ze Świętym Cesarzem Rzymskim, który nadal wyznaje naszą wiarę."
 liv_support_the_emperor_title: "[Root.GetPreviewColorLIV]Wesprzyj Ligę Świętą[Root.GetPreviewColorLIV_end]"
 liv_support_the_emperor_desc: "Podział religijny w Świętym Cesarstwie Rzymskim doprowadził do powstania dwóch lig wyznaniowych: katolickiej i protestanckiej. Można zatem przewidywać, że prędzej czy później wybuchnie wojna na tle różnic religijnych. Musimy wesprzeć naszych katolickich braci w nadchodzącej walce, aby prawdziwa wiara zatriumfowała."
 liv_crush_the_reformation_title: "[Root.GetPreviewColorLIV]Zmiażdż reformację[Root.GetPreviewColorLIV_end]"
 liv_crush_the_reformation_desc: "Reformacja doprowadziła do podziałów religijnych i walk wewnętrznych wśród chrześcijan. Nadszedł czas, by raz na zawsze położyć kres tej herezji!"
 liv_unite_the_orders_title: "[Root.GetPreviewColorLIV]Zjednocz zakony[Root.GetPreviewColorLIV_end]"
 liv_unite_the_orders_desc: "Nasz zakon inflancki powstał jako odłam zakonu krzyżackiego po druzgocącej klęsce Zakonu Kawalerów Mieczowych w 1236 roku. Od tamtej pory nasze więzi z dawnymi braćmi osłabły, a nasze drogi się rozeszły. Powinniśmy spróbować odnowić relacje z naszą dawną pruską ojczyzną — słowem lub mieczem."
 liv_unite_the_orders_tt: "Nagroda zależy od sposobu ukończenia misji.\n\nJeśli utrzymamy sojusz z §YZakonem Krzyżackim§!, uruchomi się wydarzenie „§YKwestia stosunków krzyżacko-inflanckich§!”.\n\nJeśli zamiast tego podbijemy całe §YPrusy§!, otrzymamy §G5%§! profesjonalizmu armii, §G20§! tradycji armii, a każda §Ypruska§! prowincja uzyska do końca gry modyfikator „§YZjednoczony zakon§!”, zapewniający następujące efekty:\nLokalne niepokoje: §G-2,00§!\nLokalny modyfikator siły żywej: §G+25,0%§!"
 liv_militarize_the_knights_title: "[Root.GetPreviewColorLIV]Zmilitaryzuj rycerzy[Root.GetPreviewColorLIV_end]"
 liv_militarize_the_knights_desc: "Teraz, gdy ponownie zjednoczyliśmy bałtyckie zakony rycerskie we wspólnej sprawie, nadszedł czas, by szkolić naszych braci i przygotować ich na nadchodzące wyzwania."
 liv_militarized_order_title: "[Root.GetPreviewColorLIV]Armia i klasztor[Root.GetPreviewColorLIV_end]"
 liv_militarized_order_desc: "Po udanej krucjacie przeciwko wschodnim heretykom nasz zakon stał się coraz bardziej gotowy do wojny. Musimy teraz zadbać o to, by nasi rycerze zostali rozmieszczeni w całym kraju i przygotowani na nadchodzące kampanie."
 liv_marsh_into_novgorod_title: "[Root.GetPreviewColorLIV]Druga bitwa na lodzie[Root.GetPreviewColorLIV_end]"
 liv_marsh_into_novgorod_desc: "Przed wiekami na zamarzniętym jeziorze Pejpus stoczono bitwę, w której nasi dzielni poprzednicy ponieśli dotkliwą klęskę z rąk Aleksandra Newskiego, księcia Nowogrodu. Nadszedł czas zemsty: ruszymy naprzód i zmiażdżymy heretyków ze wschodu!"
 liv_end_the_third_rome_title: "[Root.GetPreviewColorLIV]Połóż kres Trzeciemu Rzymowi[Root.GetPreviewColorLIV_end]"
 liv_end_the_third_rome_desc: "Wielka schizma od stuleci dzieli Kościół zachodni i wschodni. Głową Kościoła wschodniego był tradycyjnie patriarcha Konstantynopola, lecz po osmańskim ataku na bizantyjską stolicę duchowe centrum wspólnot prawosławnych stopniowo przeniosło się na ziemie ruskie. Mamy teraz okazję przywrócić tę trzodę na łono jedynej prawdziwej wiary i uleczyć ranę, która od stuleci dzieli Kościół katolicki."
 liv_end_the_third_rome_tt: " prowincje w regionie §YRusi§!:\n    Religia w §Yprowincji§! to §Y[Root.Religion.GetName]§!\n    Właściciel prowincji:\n      Wyznaje religię §Y[Root.Religion.GetName]§!\n      Jest państwem §Y[Root.GetName]§! albo jego §Ypoddanym§! lub §Ysojusznikiem§! państwa §Y[Root.GetName]§!."
 liv_heal_the_schism_title: "[Root.GetPreviewColorLIV]Ulecz schizmę[Root.GetPreviewColorLIV_end]"
 liv_heal_the_schism_desc: "Chrześcijaństwo od zbyt dawna jest podzielone z powodu błahych różnic w wierze. Papieże nie widzieli powodu, by je uzdrowić, a głupcy z Cesarstwa Bizantyjskiego byli zbyt zajęci podbojami muzułmanów. To na nas spoczywa obowiązek zakończenia schizmy i wykorzenienia herezji."
 liv_heal_the_schism_tt: "Każde państwo §Yprawosławne§! otrzyma wydarzenie „§YInflanty ogłaszają koniec schizmy§!”."
 liv_heal_the_schism_at: "§Y[295.GetName]§!, §Y[33.GetName]§! i §Y[310.GetName]§! są §Ykatolickie§! i należą do państwa §Ykatolickiego§!."
 liv_heal_the_schism_bt: " prowincje w §YRusi§! są §Ykatolickie§!."
 liv_subjugate_lithuania_title: "[Root.GetPreviewColorLIV]Podbij Litwę[Root.GetPreviewColorLIV_end]"
 liv_subjugate_lithuania_desc: "Litwini są naszymi wrogami od samego początku istnienia zakonu. Choć nie wyznają już wiary romuwskiej, nadal stanowią zagrożenie dla naszego istnienia i musimy odpowiednio się z nim rozprawić."
 liv_take_over_ruthenia_title: "[Root.GetPreviewColorLIV]Nawróć Ruś[Root.GetPreviewColorLIV_end]"
 liv_take_over_ruthenia_desc: "Rusini kijowscy na Rusi są pobożnymi chrześcijanami. Niestety, dawno temu popadli w herezję i nie uznają zwierzchnictwa Stolicy Apostolskiej. Musimy pokazać im błędy ich drogi i przywrócić ich na łono Kościoła katolickiego!"
 liv_convert_all_of_russia_title: "[Root.GetPreviewColorLIV]Przymusowo nawróć Rosję[Root.GetPreviewColorLIV_end]"
 liv_convert_all_of_russia_desc: "Rosjanie również wierzą w Chrystusa, lecz wyznają prawosławie. Ich także należy przywrócić na łono Stolicy Apostolskiej."
 liv_the_catholic_bulwark_title: "[Root.GetPreviewColorLIV]Rozwiń ziemie[Root.GetPreviewColorLIV_end]"
 liv_the_catholic_bulwark_desc: "Ziemie ruskie, niegdyś zamieszkane przez heretyków, znajdują się teraz w naszych rękach. Aby utrzymać katolicyzm jako religię dominującą w tym regionie, powinniśmy okazać Rusinom katolicką życzliwość i rozwinąć te dzikie ziemie."
 liv_support_other_catholics_title: "[Root.GetPreviewColorLIV]Wesprzyj naszych braci[Root.GetPreviewColorLIV_end]"
 liv_support_other_catholics_desc: "Ujarzmiliśmy prawosławną herezję na wschodzie, lecz w Europie jest wielu innych heretyków zagrażających autorytetowi Kościoła. Jako zakon rycerski ze wschodu mamy obowiązek pomóc naszym braciom, którzy znaleźli się na łasce heretyków i pogan zamieszkujących ziemie przy ich granicach."
 liv_support_other_catholics_ct: " państwa §Y[Root.Religion.GetName]§!:\n    Wszystkie poniższe warunki muszą być spełnione:\n      Jest niepodległe lub jest państwem trybutarnym, ale nie jest poddanym państwa §Y[Root.GetName]§!\n      Prowadzi wojnę z państwem §Yheretyckim§! lub §Ypogańskim§!\n      Otrzymuje co najmniej §Y20,0%§! swoich dochodów w formie subsydiów, wynajmuje kondotierów od państwa §Y[Root.GetName]§! lub jest sojusznikiem państwa §Y[Root.GetName]§!."
 liv_support_other_catholics_tt: "§YWymuszenie pokoju§! zapewnia §G25§! punktów wpływu papieskiego, jeśli te działania dyplomatyczne zostaną wykorzystane do ochrony państwa §Ykatolickiego§! przed atakującym je państwem §Yheretyckim§! lub §Ypogańskim§!, dopóki ten modyfikator pozostaje aktywny."
 catholics_healed_schism_tt: "§YKościół katolicki§! uleczył schizmę między katolicyzmem a prawosławiem."
