 flavor_teu.43.a.tt: "Zgodzimy się, aby §YKrzyżacy§! przyłączyli się do Świętego Cesarstwa Rzymskiego bez żadnych warunków.\nSąsiedzi zakonu, którzy są częścią Cesarstwa, mogą czuć się zagrożeni tym wyborem.\n\nKażdy sąsiad §Y[TEU.GetAdjective]§!, który jest częścią Świętego Cesarstwa Rzymskiego, traci §R150§! opinii o państwie §Y[Root.GetName]§!."
