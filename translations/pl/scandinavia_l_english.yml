 FU2_spread_the_northern_style_desc: "Nasi artyści nie mają powodów, by zazdrościć swoim włoskim odpowiednikom. Rozprzestrzenianie się idei renesansowych w naszym kraju dało początek unikalnemu stylowi i wielu słynnym ludziom kultury."
 declare_hanseatic_league_title: "Ogłoś Związek Hanzeatycki"
 declare_hanseatic_league_desc: "Bogactwo ukryte w portach Bałtyku i północnych Niemiec musi zostać wykorzystane przez zdolnych i skrupulatnych kupców. To do nas należy poprawa starych tradycji handlu, ekonomię i mnóstwa monet. Stare instytucje były zgniłe do cna, a ich kupcy zadowoleni z bylejakości i korupcji. Nadszedł czas, abyśmy przetarli szlak, podważyli i pogrzebali status quo! Z jego popiołów narodzi się nowa Hanza, rozwinięta i nieposkromiona!"
