 desc_pol_new_henrikian_articles_modifier: "Rozmaite dokumenty, obietnice i stypulacje, służące związaniu losu naszej domeny z wieloma potężnymi klasami, które operują w cieniu polityki."
 pol_cardinal_laws_modifier: "Prawa kardynalne"
 desc_pol_cardinal_laws_modifier: "Nasza nowo utworzona republika potrzebuje silnych fundacji prawnych, jeśli chcemy, by nasz lud rozwijał się i prosperował."
 pol_stable_internal_affairs_modifier: "Stabilne sprawy wewnętrzne"
 desc_pol_stable_internal_affairs_modifier: "Królestwo jest jedynie tak stabilne, jak jego komponenty. Żeby zapewnić niezachwianą władzę, musimy chronić wszystkich poddanych w naszej domenie."
 pol_cultural_flowering_polish_domain_modifier: "Kulturowy rozkwit w polskiej domenie"
 desc_pol_cultural_flowering_polish_domain_modifier: "Nie ma lepszego sposobu, by wyrazić nasze społeczne postępy kosztem naszych sąsiadów, niż pokaz naszego wspaniałego kulturowego rozkwitu."
 pol_splendor_polish_crown_modifier: "Splendor polskiej korony"
 desc_pol_splendor_polish_crown_modifier: "Klejnoty naszej królewskiej korony to nie tylko dekoracja na głowie naszego władcy. Reprezentują one moc, dostatek i historię chwalebnego ludu."
 pol_breadbasket_europe_modifier: "Nadwyżki zboża"
 desc_pol_breadbasket_europe_modifier: "Nasza produkcja zboża wielce skorzystała z poprawy naszej produkcji. W efekcie posiadamy nadwyżki zboża!"
 pol_growing_prosperity_modifier: "Rosnący dobrobyt"
 desc_pol_growing_prosperity_modifier: "Nasza decyzja, by finansować rozwój projektów w naszym kraju przyniosła skutki w formie rosnącego dobrobytu."
 pol_golden_era_modifier: "Złota era finansów"
 desc_pol_golden_era_modifier: "Ostatnie postępy w naszych zabiegach finansowych poskutkowały złotą erą przychodów i bogactwa w naszym kraju."
 pol_enable_2nd_manufactory_modifier: "Rozszerzone manufaktury"
 desc_pol_enable_2nd_manufactory_modifier: "Tak, mieliśmy jedną. Ale co z drugą manufakturą?"
 pol_polish_seat_of_power_modifier: "Polski ośrodek władzy"
 desc_pol_polish_seat_of_power_modifier: "Ta prowincja jest nowym centrum naszego ambitnego i potężnego królestwa."
 pol_official_papal_nunciature_modifier: "Oficjalna Nuncjatura Apostolska"
 desc_pol_official_papal_nunciature_modifier: "Ojciec Święty pobłogosławił nas, byśmy przeprowadzali nasze sprawy wewnętrzne z jego aprobatą."
 pol_official_papal_nunciature_2_modifier: "Wzmocniona Nuncjatura Apostolska"
 desc_pol_official_papal_nunciature_2_modifier: "Ojciec Święty dał nam pełną władzę, byśmy przeprowadzali nasze sprawy wewnętrzne z jego aprobatą, jako wzór dla katolicyzmu."
 pol_facing_the_catholics_modifier: "Stawienie czoła katolikom"
 desc_pol_facing_the_catholics_modifier: "Nasz kraj zdecydował postawić się fałszywym naukom słabnącej i skorumpowanej religii."
 pol_reformed_education_system_modifier: "Zreformowany system edukacji"
 desc_pol_reformed_education_system_modifier: "Edukacja jest fundamentalnym aspektem naszego społeczeństwa. Zreformowanie jest przyniosło niesamowicie pozytywne rezultaty."
 pol_incentives_modifier: "Zachęty dla rozwoju sztuki i architektury"
 desc_pol_incentives_modifier: "Finansowanie rozmaitych myślicieli naszej epoki miało pozytywny wpływ na nasze starania w dziedzinie nauki."
 pol_incentives2_modifier: "Zachęty dla rozwoju sztuki i architektury"
 desc_pol_incentives2_modifier: "Finansowanie rozmaitych myślicieli naszej epoki miało pozytywny wpływ na nasze starania w dziedzinie nauki."
 pol_strong_catholic_ties_modifier: "Silne katolickie więzy"
 desc_pol_strong_catholic_ties_modifier: "Silna relacja z kurią przyniosła nam więcej wpływów w Stolicy Apostolskiej, które pozwolą nam na promowanie swoich programów politycznych."
 pol_shield_against_catholicism_modifier: "Tarcza przeciw katolicyzmowi"
 desc_pol_shield_against_catholicism_modifier: "Nasz kraj jest dumnym obrońcą naszych braci w wierze przeciwko szponom katolicyzmu."
 pol_guarantee_religious_rights_modifier: "Gwarantowane prawa dla mniejszości religijnych"
 desc_pol_guarantee_religious_rights_modifier: "Nasza decyzja, by gwarantować prawa religijne dla rozmaitych mniejszości w naszej domenie przyniosła pozytywne rezultaty!"
 pol_major_printing_center_modifier: "Główne centrum drukarskie"
 desc_pol_major_printing_center_modifier: "Ta prowincja jest sercem ruchu drukarskiego w naszym kraju."
 pol_judicial_reforms_modifier: "Poważne reformy prawne"
 desc_pol_judicial_reforms_modifier: "Reformy prawne, takie jak ta, są dobrym sposobem, by dostosować administrację naszego kraju i utrzymać ją tak wydajną, jak to możliwe."
 pol_cardinal_laws2_modifier: "Pierwsza polska republikańska konstytucja"
 desc_pol_cardinal_laws2_modifier: "Nasza nowo utworzona republika potrzebuje silnej podstawy prawnej, jeśli chcemy, by nasz lud rozwijał się i prosperował."
 pol_polish_bohemian_ties_modifier: "Więzi polsko-czeskie"
 desc_pol_polish_bohemian_ties_modifier: "Nasze więzi dyplomatyczne i dynastyczne z władcą Czech są silne i przynoszą nam korzyści."
 pol_cavalry_with_state_modifier: "Kawaleria z własnym państwem"
 desc_pol_cavalry_with_state_modifier: "Liczebność jazdy w naszej armii jest tak wielka, że staliśmy się państwem kawalerii!"
 modernized_fire_ranks_modifier: "Zmodernizowane salwy ogniowe"
 desc_modernized_fire_ranks_modifier: "Nowoczesne metody ćwiczeń ogniowych regimentów są niezbędne, aby doskonalić nasze umiejętności wojskowe."
 pol_elite_hussar_cavalry_2_modifier: "Elitarna kawaleria"
 desc_pol_elite_hussar_cavalry_2_modifier: "Grot naszej armii stanowi elitarna, doskonale wyszkolona kawaleria husarii skrzydlatej!"
 pol_elite_hussar_cavalry_modifier: "Elitarna husaria"
 desc_pol_elite_hussar_cavalry_modifier: "Powszechnie wiadomo, że husaria skrzydlata potrafi odmienić los każdej bitwy lub oblężenia, a po przybyciu na pole walki rozgromić przeciwnika!"
 pol_modernized_army_2_modifier: "Zmodernizowana armia"
 desc_pol_modernized_army_2_modifier: "Armia jako całość stanowi sprawnie działający element naszego rządu, w którym przywiązuje się ogromną wagę do szczegółów i jakości."
 pol_modernized_army_modifier: "Zmodernizowana armia"
 desc_pol_modernized_army_modifier: "Armia jako całość stanowi sprawnie działający element naszego rządu, w którym przywiązuje się ogromną wagę do szczegółów i jakości."
 pol_krakow_university_modifier: "Uniwersytet w Krakowie"
 desc_pol_krakow_university_modifier: "Uniwersytet tego miasta cieszy się znakomitą reputacją jako filar edukacji przyszłych pokoleń naszego narodu."
 pol_uniting_the_fractures_modifier: "Jednoczenie podzielonego regionu"
 desc_pol_uniting_the_fractures_modifier: "Otaczające nas regiony są podzielone i pozbawione przywództwa. Mamy prawo je zjednoczyć i objąć ochroną."
 pol_increased_crown_taxes_modifier: "Zwiększone podatki koronne"
 desc_pol_increased_crown_taxes_modifier: "Narody podlegające naszej koronie otrzymały rozkaz zwiększenia swoich płatności na rzecz naszego władcy."
 pol_fortified_border_modifier: "Umocniona granica"
 desc_pol_fortified_border_modifier: "Naszą granicę chronią nowoczesne zamki z odpowiednio wyposażonymi garnizonami, gotowymi bronić naszego ludu."
 pol_efficienct_development_modifier: "Efektywny rozwój domeny"
 desc_pol_efficienct_development_modifier: "Bardzo starannie i efektywnie przydzielamy środki na rozwój naszych ośrodków miejskich i wiejskich."
 pol_global_maritime_empire_modifier: "Globalna potęga morska"
 desc_pol_global_maritime_empire_modifier: "Staliśmy się globalną, niekwestionowaną i niezrównaną potęgą w dziedzinie handlu oraz obecności na morzach!"
 pol_global_maritime_empire_2_modifier: "Globalna potęga morska"
 desc_pol_global_maritime_empire_2_modifier: "Staliśmy się globalną, niekwestionowaną i niezrównaną potęgą w dziedzinie handlu oraz obecności na morzach!"
 pol_poland_rise_modifier: "Odrodzenie Polski!"
 desc_pol_poland_rise_modifier: "Nasza chwalebna armia i administracja z dumą wznoszą się na nowe wyżyny, służąc chwale naszego sztandaru."
 pol_thriving_center_of_gdansk_modifier: "Kwitnący ośrodek Gdańska"
 desc_pol_thriving_center_of_gdansk_modifier: "Prowincja ta jest prężnym ośrodkiem handlu i rozwijającym się centrum miejskim, pełnym możliwości kupieckich."
 pol_winter_preparations_modifier: "Przygotowania do zimy"
 desc_pol_winter_preparations_modifier: "Przed rozpoczęciem kampanii wojskowych poczyniliśmy odpowiednie przygotowania na surowe zimy Północy."
 pol_swedish_metal_imports_modifier: "Skandynawskie metale"
 desc_pol_swedish_metal_imports_modifier: "Import wysokiej jakości skandynawskich metali pozwolił nam zwiększyć masową produkcję uzbrojenia i artylerii na potrzeby naszego państwa."
 pol_victory_polish_crown_modifier: "Dominacja nad Skandynawią"
 desc_pol_victory_polish_crown_modifier: "Odnieśliśmy triumf nad prestiżowymi państwami Skandynawii. Nasza chwała nie zna granic."
 pol_increased_production_of_metals_modifier: "Zwiększona produkcja metali"
 desc_pol_increased_production_of_metals_modifier: "Lokalna produkcja metali otrzymała istotny impuls, co przełożyło się na wzrost wydobycia i wytwórczości."
 pol_annexed_ruthenia_opinion_modifier: "Aneksja Rusi"
 pol_shared_prosperity_modifier: "Wspólny dobrobyt"
 desc_pol_shared_prosperity_modifier: "Razem nasze dwa państwa podążają naprzód ramię w ramię, wspólnie ciesząc się dobrobytem!"
 pol_efficient_taxation_lit_lands_modifier: "Efektywne opodatkowanie ziem litewskich"
 desc_pol_efficient_taxation_lit_lands_modifier: "Opodatkowanie wschodnich ziem podlegających koronie litewskiej przyniosło naszym skarbcom znakomite rezultaty."
 pol_polish_empire_modifier: "Polskie Imperium"
 desc_pol_polish_empire_modifier: "Nasi kompetentni dyplomaci i administratorzy z powodzeniem rozbudowali aparat administracyjny imperium."
 pol_polish_influence_modifier: "Polskie wpływy"
 pol_polish_hungarian_ties_modifier: "Więzi polsko-węgierskie"
 desc_pol_polish_hungarian_ties_modifier: "Nasze więzi z Królestwem Węgier są z pewnością silne i oba nasze narody czerpią korzyści z tego porozumienia!"
 pol_bid_emperorship_modifier: "Propozycja zastania cesarzem"
 desc_pol_bid_emperorship_modifier: "Nasze roszczenia wobec Cesarstwa na zachodzie są nie tylko uzasadnione, ale także wysoce szanowane."
 pol_defenders_of_rome_modifier: "Obrońcy Rzymu"
 desc_pol_defenders_of_rome_modifier: "W czasach kłopotów i terroru nasz naród świeci jasno jako obrońcy Rzymu i katolickiego świata."
 pol_commonwealth_supreme_modifier: "Potęga Rzeczypospolitej"
 desc_pol_commonwealth_supreme_modifier: "Nasze imperium osiągnęło najwyższy poziom potęgi. Żaden wróg nie zdołał oprzeć się naszym siłom zbrojnym. Odnieśliśmy całkowite zwycięstwo!"
 pol_imperial_polish_decrees_modifier: "Polskie dekrety cesarskie"
 desc_pol_imperial_polish_decrees_modifier: "Dekrety wydawane przez naszego cesarza mają najwyższą rangę i autorytet, inspirując oraz zachęcając mieszkańców naszego rozległego państwa."
 pol_trigger_for_army_professionalism_modifier: "Wzrost profesjonalizmu armii dzięki generałom"
 pol_overlordship_in_prussia_modifier: "Zwierzchnictwo nad Prusami"
 desc_pol_overlordship_in_prussia_modifier: "Nasz pruski poddany zapewnia nam wysokiej jakości wojska, gotowe bronić naszego ludu i siać strach w sercach wrogów."
 pol_developing_port_modifier: "Rozwijający się port"
 desc_pol_developing_port_modifier: "Port ten od niedawna obsługuje znacznie większy ruch kupiecki, co stwarza ogromny potencjał dalszego rozwoju."
 pol_daugava_estuary_modifier: "Rozbudowane estuarium Dźwiny"
 pol_wave_of_migration_modifier: "Fala migracji"
 desc_pol_wave_of_migration_modifier: "Niedawne nabytki i zmiany w naszej domenie sprawiły, że prowincja ta stała się atrakcyjnym celem dla wielu migrantów szukających szczęścia."
 pol_cheap_ap_mercs_modifier: "Niższy koszt profesjonalizmu armii przy rekrutacji najemników"
 pol_prosperity_in_ukraine_modifier: "Dobrobyt na Ukrainie"
 desc_pol_prosperity_in_ukraine_modifier: "Rozległe ziemie Rusi są teraz domem dla rozwijających się i zamożnych społeczności."
 pol_polish_swedish_act_of_baltic_coprosperity_modifier: "Polsko-szwedzki akt wspólnego dobrobytu na Bałtyku"
 desc_pol_polish_swedish_act_of_baltic_coprosperity_modifier: "Nasza życzliwa postawa wobec skandynawskich przyjaciół przyniosła korzyści finansowe i otworzyła drogę do wzajemnego rozwoju."
 pol_heir_of_rome_modifer: "Prawdziwy dziedzic Rzymu"
 desc_pol_heir_of_rome_modifer: "Wraz z naszym podbojem lśniącej latarni Rzymu, starego miasta Konstantynopola, przyjęliśmy na siebie tytuł spadkobierców Rzymu."
 pol_renewed_crusader_fervor_modifier: "Nowy zapał krzyżowców"
 desc_pol_renewed_crusader_fervor_modifier: "Raz jeszcze wzywamy wiernych naszych ziem, by chwycili za miecz i bronili naszej wiary przed tymi, którzy chcą ją zniszczyć."
 flavor_pol.23.t: "Powstanie małych królów"
 flavor_pol.23.d: "Ostatnie zmiany w układzie sił w naszym królestwie nie pozostały niezauważone. Przez wieki polska szlachta nieustannie dążyła do uzyskania większej autonomii i przywilejów. Jednak ostatnie próby konsolidacji władzy przez naszego monarchę najwyraźniej wywołały otwarty bunt, na czele którego stanęły najpotężniejsze rody w naszej domenie."
 flavor_pol.23.a: "Król może być tylko jeden!"
 flavor_pol.24.t: "Konstytucja z [GetYear] roku"
 flavor_pol.24.d: "Administracja Korony Polskiej była w opłakanym stanie odkąd ktokolwiek pamięta. U szczytu potęgi szlachty ziemiańskiej uchwalanie prawa i podpisywanie reform było koszmarnym przedsięwzięciem. Dzięki czemuś, co można określić jako wyjątkową sprawność dyplomatyczną i administracyjną, [Root.Monarch.GetName] zdołał[Root.Monarch.GetANoun] zgromadzić wystarczający kapitał polityczny, a także przysługi, aby pozbyć się tych nieznośnych feudalnych pijawek z naszego dworu."
 flavor_pol.24.a: "Naród pilnie potrzebuje reform!"
 flavor_pol.24.b: "Konieczne są pewne reformy."
 flavor_pol.24.c: "Pod polskim sztandarem wszyscy będą równi!"
 flavor_pol.25.t: "Polsko-czeski pakt o współpracy"
 flavor_pol.25.d: "Mówi się, że ścisła współpraca i dyplomacja mogą przesądzić o losach państw. Ostatnie próby zażegnania różnic z naszymi polskimi braćmi na Wschodzie doprowadziły do zawarcia polsko-czeskiego paktu o współpracy w roku [GetYear]. To od nas zależy, jak i w jaki sposób zareagujemy na tak znaczące rozszerzenie przyjaźni i współistnienia."
 flavor_pol.25.a: "Korona polska stanie na czele unii naszych państw."
 flavor_pol.25.b: "Razem nasze dwa państwa będą rozkwitać jako równorzędni partnerzy."
 flavor_pol.25.c: "Nie wytarłbym nawet butów polskim sztandarem!"
 flavor_pol.26.t: "Polsko-węgierski pakt o współpracy"
 flavor_pol.26.d: "Mówi się, że ścisła współpraca i dyplomacja mogą przesądzić o losach państw. Ostatnie próby zażegnania różnic z naszymi polskimi braćmi na Wschodzie doprowadziły do zawarcia polsko-węgierskiego paktu o współpracy w roku [GetYear]. To od nas zależy, jak i w jaki sposób zareagujemy na tak znaczące rozszerzenie przyjaźni i współistnienia."
 flavor_pol.26.a: "Korona polska stanie na czele unii naszych państw."
 flavor_pol.26.b: "Razem nasze dwa państwa będą rozkwitać jako równorzędni partnerzy."
 flavor_pol.26.c: "Nie wytarłbym nawet butów polskim sztandarem!"
 flavor_pol.27.t: "Rozbudowa wojska kwarcianego"
 flavor_pol.27.d: "Zręby regularnej armii powstały w Polsce na przełomie XV i XVI wieku, w celu ochrony południowo-wschodnich kresów przed najazdami tatarskimi. System ten został rozbudowany w 1563 r., kiedy to Zygmunt II August złamał umowę z sejmem o finansowaniu go z jednej czwartej wszystkich dochodów zebranych w królewszczyznach, skąd wzięła się jego nazwa - wojsko kwarciane. Teraz, aby zabezpieczyć nasz naród, chronić nasze interesy oraz utrzymać nasz wzrost i dobrobyt, musimy iść z duchem czasu i korzystać z wszelkich przydatnych osiągnięć technologicznych, zwłaszcza w dziedzinie wojskowości i prowadzenia działań wojennych. Nasz wybór w tej kwestii z pewnością odbije się echem w komnatach historii."
 flavor_pol.27.a: "Generalna reforma dobrze pasowałaby do naszej armii!"
 flavor_pol.27.b: "Zreformować kawalerię husarską!"
 flavor_pol.27.c: "Udoskonalić techniki prowadzenia ognia."
 flavor_pol.27.dee: "Skupić się wyłącznie na rozbudowie kawalerii!"
 flavor_pol.28.t: "Collegium Maius i rozwój myśli"
 flavor_pol.28.d: "Bogactwo i dziedzictwo są potężnymi narzędziami, jeśli wykorzystuje się je dla dobra publicznego. Tak właśnie powstała pierwsza akademia w Krakowie — Collegium Maius. Istota narodu myślącego, zamknięta w pięknych murach budowli w stylu renesansowym, otworzy drogę naszym wspaniałym umysłom ku gwiazdom, zapewniając wiedzę i rozwój wielkim ludziom, takim jak Mikołaj Kopernik."
 flavor_pol.28.a: "Wspaniała instytucja, która będzie kształcić przyszłe pokolenia!"
 flavor_pol.29.t: "Zabezpieczanie mołdawskiej domeny"
 flavor_pol.29.d: "Sytuacja w Mołdawii stała się tragiczna. Nasz książęcy sąsiad na południu wypadł ostatnio z łask opinii publicznej. Rzeczywiście, państwo to było ostatnio uwikłane w okrutną i krwawą wojnę domową. Ale z chaosu rodzi się porządek, a my musimy być lepsi od naszych mołdawskich poprzedników, jeśli chodzi o rujnowanie kraju. Dlatego należy się przygotować oraz podjąć decyzję, aby zabezpieczyć nasze interesy i kontrolę nad regionem."
 flavor_pol.29.a: "Niech Stefan zasiądzie na tronie, będzie nam dobrze służył!"
 flavor_pol.29.b: "Nie możemy ryzykować wtrącania się w lokalne waśnie..."
 flavor_pol.29.c: "Będą podlegać tylko mnie!"
 flavor_pol.30.t: "Korona Rzymu"
 flavor_pol.30.d: "Wspaniałe miasto [151.GetName] jest w naszych rękach! Niegdyś wspaniała stolica Bizancjum, została podbita przez tureckie armie Sułtanatu Osmańskiego i usunięta z powierzchni Ziemi.\nAle dziś miasto jest wolne od szponów Osmanów! Podczas gdy większość obywateli [Root.GetAdjective] świętuje nasz podbój miasta, dwór [Root.GetAdjective] jest zaniepokojony zarządzeniem miastem [151.GetName]. Podczas gdy zachowanie miasta dla siebie byłoby prestiżowe, doradcy [Root.Monarch.GetRulerGen] sugerują przywrócenie państwa Bizancjum lub wielkiego Imperium Łacińskiego."
 flavor_pol.30.a: "Przywróć §YFeniksa§! do dawnej świetności."
 flavor_pol.30.b: "§YImperium Łacińskie§! odrodzi się na nowo!"
 flavor_pol.30.c: "[151.GetName] należy do nas!"
 flavor_pol.31.t: "Bałtyckie złoto i bramy królów"
 flavor_pol.31.d: "Pokonanie wrogów i przeszukanie ich domeny w poszukiwaniu tego, co słusznie nam się należy, to tylko połowa przyjemności. Cóż warte jest bogactwo bez domu, do którego można powrócić? Domu ozdobionego złotymi arkadami, zaprojektowanego przez zastępy ludzi renesansu pragnących pozostawić swój ślad w jednym z najważniejszych i najbardziej wpływowych miast świata. [43.GetName] ma wszystko, czego potrzeba, by stać się domem naszego nieustannie rozwijającego się narodu."
 flavor_pol.31.a: "Miasto godne królewskiego majestatu!"
 flavor_pol.32.t: "Układy lubelskie"
 flavor_pol.32.d: "Nie jest tajemnicą, że władza i wpływy mają niekorzystny wpływ na ludzi. Jednak władza sprawowana roztropnie i kierowana pewną ręką może przynieść ogromne korzyści w sprawach zagranicznych i wewnętrznych. Niedojrzali litewscy możnowładcy nieustannie nas nękają, odmawiając udziału w sejmach i zgromadzeniach, paraliżując cały proces. Jeśli nie rozumieją języka dyplomacji, być może lepiej przemówi do nich pokaz siły, którego cenę zapłacą ich własne ziemie?"
 flavor_pol.32.a: "Zmusimy Litwinów do podpisania porozumienia."
 flavor_pol.32.b: "Nie możemy ryzykować naszych delikatnych stosunków..."
 flavor_pol.33.t: "Sejm z roku [GetYear]"
 flavor_pol.33.d: "Pewnego spokojnego poranka w roku [GetYear] posłaniec wpadł przez drzwi cesarskiego pałacu, czerwony na twarzy i zdyszany, pragnąc jak najszybciej dostarczyć ważną korespondencję z ośrodka władzy w Polsce. Najwyraźniej miejscowy polski możnowładca, niedawno koronowany na króla, wbrew zaleceniom własnych doradców postanowił zerwać więzi z Litwą i skierować wzrok na Zachód. W rezultacie polski monarcha oficjalnie złożył wniosek o przyjęcie swojego państwa do Świętego Cesarstwa Rzymskiego."
 flavor_pol.33.a: "Zaskakujące, ale mile widziane!"
 flavor_pol.33.b: "Dopóki stoimy na czele Cesarstwa, nigdy nie pozwolimy im do niego wstąpić!"
 reformist_personality: "Reformator"
 desc_reformist_personality: "Ten władca jest reformatorem. Dążąc do stabilności i wielkości państwa, jest gotów wprowadzać reformy istniejących systemów, aby zmodernizować kraj."
 reformist_personality_die_desc: "Reformy [Root.Monarch.GetHerHisCap] przekształciły nasze proste państwo w prawdziwy naród."
 ancestor_reformist_personality: "Reformator"
 desc_ancestor_reformist_personality: ""
 ancestor_reformist_personality_die_desc: "Reformy [Root.Monarch.GetHerHisCap] przekształciły nasze proste państwo w prawdziwy naród."
 estate_burghers_polish_merchant_seal: "Pieczęć polskiego kupiectwa"
 estate_burghers_polish_merchant_seal_desc: "Pieczęć naszego chwalebnego władcy ma ogromne znaczenie na targowiskach w całym państwie. Przyznanie mieszczanom dostępu do związanych z nią wpływów niewątpliwie zwiększyłoby ich potęgę handlową zarówno w kraju, jak i za granicą."
 estate_nobles_sponsor_hussars: "Sponsorowanie husarii"
 estate_nobles_sponsor_hussars_desc: "Pozwólmy najznamienitszym możnowładcom naszego państwa finansować elitarne regimenty husarii w zamian za lokalne ustępstwa i wpływy."
 LAE: "Cesarstwo Łacińskie"
 LAE_ADJ: "Cesarstwa Łacińskiego"
 RPR: "Prusy Książęce"
 RPR_ADJ: "pruski"
 PLC_ideas: "Idee Rzeczpospolitej"
 PLC_ideas_start: "Tradycje Rzeczypospolitej"
 PLC_ideas_bonus: "Ambicje Rzeczypospolitej"
 plc_prosperous_folwarks: "System folwarczny"
 plc_prosperous_folwarks_desc: "Posiadłość ziemska szlachcica w Rzeczypospolitej zazwyczaj składa się z tego, co nazywamy folwarkiem. Jest to duże gospodarstwo rolne, na którym liczni chłopi pańszczyźniani wytwarzają nadwyżki przeznaczone na handel wewnętrzny i zagraniczny. Dopóki utrzymamy sprawne funkcjonowanie tego systemu i z czasem być może zreformujemy związane z nim prawa, folwarki będą nadal dostarczać znacznych ilości towarów na nasze szlaki handlowe i do państwowych magazynów."
 pol_jagiellonian_university: "Uniwersytet Jagielloński"
 pol_jagiellonian_university_desc: "Założony w 1364 roku Uniwersytet Jagielloński w Krakowie jest prawdopodobnie jednym z najwspanialszych ośrodków nauki w całej Europie! Przyciągał, kształcił i rozwijał umysły filozoficzne oraz naukowe, bez których Europa — a tym bardziej narody polski i litewski — niemal nie mogłyby się obejść. W przyszłości Uniwersytet Jagielloński nadal będzie jednym z najjaśniejszych punktów naszej wielkiej Rzeczypospolitej."
 plc_the_obrona_potoczna: "Obrona potoczna"
 plc_the_obrona_potoczna_desc: "To, co nazywamy „obroną potoczną”, jest w istocie stałą armią opłacaną z prywatnej kiesy monarchy. Tradycyjnie stacjonuje ona na obszarach zagrożonych lub w miejscach, gdzie granica z sąsiadem nie została jasno wytyczona, aby chronić interesy Rzeczypospolitej. Z czasem ten rodzaj sił zbrojnych zapewni nam doskonale wyszkolonych żołnierzy i doświadczonych generałów, którzy będą wiedzieli, jak radzić sobie z każdym rodzajem wroga — polskiego, litewskiego, ukraińskiego czy obcego pochodzenia."
 plc_refine_our_golden_liberty: "Doskonalenie złotej wolności"
 plc_refine_our_golden_liberty_desc: "Nasza doktryna polityczna brzmi: „Nasze państwo jest republiką pod przewodnictwem króla”. Kierujemy się tą zasadą i jej następującymi elementami: wyborem króla przez całą szlachtę, sejmem, pacta conventa, wolnością religijną, prawnym prawem do buntu przeciw królowi, który naruszył zagwarantowane swobody, liberum veto oraz tworzeniem organizacji służących realizacji wspólnych celów politycznych. Zachowując te zasady naszej republiki i doskonaląc je za pomocą nowych praw i ustaw, sprawimy, że Rzeczpospolita nigdy nie stanie się przestarzała ani politycznie skostniała."
 pol_royal_guards: "Polska Gwardia Królewska"
 pol_royal_guards_desc: "Polska Gwardia Królewska odpowiada bezpośrednio za ochronę monarchy i jego rodziny, stanowiąc przyszły szczyt potęgi Rzeczypospolitej. Wyposażona w najlepszy dostępny sprzęt i szkolona przez całe życie na wiele sposobów, w przyszłości wzmocni i zahartuje nasze wojsko, zwłaszcza piechotę, jednocześnie chroniąc monarchę i jego rodzinę przed niebezpieczeństwem."
 plc_tempered_by_neighbors: "Zahartowani przez sąsiadów"
 plc_tempered_by_neighbors_desc: "Wokół nas nieustannie trwa konflikt. Szwedzi? Spory o Bałtyk. Węgrzy? Konflikty graniczne. Krzyżacy? Dawne urazy i żądza ziemi. Rosjanie? Ambicje terytorialne po obu stronach. Od dawna jesteśmy wystawiani na próby w boju, ponieważ nasze wschodnie i zachodnie granice trudno wyznaczyć inaczej niż na odręcznej mapie. Wojny te nie złamały jednak narodu polskiego i litewskiego — uczyniły go jedynie silniejszym."
 LAE_ideas: "Łacińskie idee"
 LAE_ideas_start: "Łacińskie tradycje"
 LAE_ideas_bonus: "Łacińska ambicja"
 lae_emperor_constantinople: "Cesarz Konstantynopola"
 lae_emperor_constantinople_desc: "Konstantynopol ponownie jest stolicą odrodzonego Cesarstwa Łacińskiego, z której będzie ono rozszerzać swoje wpływy i sprawować władzę."
 lae_latin_patriarch: "Patriarcha łaciński"
 lae_latin_patriarch_desc: "Patriarchowie są czterema biskupami metropolitami wschodniej części Morza Śródziemnego, a patriarcha łaciński Konstantynopola rości sobie prawo do ustanowienia swojej władzy nad całym regionem."
 lae_byzantine_bureaucracy: "Administracja bizantyjska"
 lae_byzantine_bureaucracy_desc: "Cesarstwo Bizantyjskie odziedziczyło długą tradycję sprawnej administracji, funkcjonującej od tysiąca lat. Warto wykorzystać tę biurokrację na potrzeby odrodzonego Cesarstwa Łacińskiego."
 lae_guilds_pera: "Gildie kupieckie Pery"
 lae_guilds_pera_desc: "Kolonia włoskich kupców osiedla się w Konstantynopolu, mając swoją siedzibę w dzielnicy Pera, po drugiej stronie Złotego Rogu."
 lae_partitio_graeci: "Partitio Graeci"
 lae_partitio_graeci_desc: "Odzyskanie ziem od schizmatyckich Greków i przywrócenie ich Kościołowi rzymskokatolickiemu jest najwyższym priorytetem cesarzy łacińskich."
 lae_frankokratia: "Frankokracja"
 lae_frankokratia_desc: "„Frankowie” to ogólne określenie obejmujące wszystkie państwa Europy Zachodniej i Środkowej, które stanowią główne oparcie dyplomatyczne i militarne Cesarstwa Łacińskiego."
 RPR_ideas: "Pruskie idee"
 RPR_ideas_start: "Pruskie tradycje"
 RPR_ideas_bonus: "Pruskie ambicje"
 reciprocal_guarantee_of_two_nations: "Wzajemna gwarancja dwóch narodów"
 reciprocal_guarantee_of_two_nations_desc: "Przez stulecia liczne organizmy polityczne w naszym państwie działały z względną autonomią, nieustannie wywołując konflikty. Nadszedł czas, by przejąć stery i podporządkować sobie te elementy, zapewniając sprawne i efektywne funkcjonowanie spraw wewnętrznych."
 polish_great_sejm: "Sejm Wielki"
 polish_great_sejm_desc: "Sejm Wielki jest najwyższą władzą w sprawach korony polskiej. Jego głosy oddawane są głównie przez prowincjonalną i potężną szlachtę, która mocno trzyma się spraw dworu."
 polish_elective_monarchy: "Polska monarchia elekcyjna"
 polish_elective_monarchy_desc: "Mimo unii łączącej nas z litewskimi braćmi szlachta nadal skupia w swoich rękach większość władzy. Elekcyjny charakter naszej monarchii oznacza jednak możliwość wprowadzenia na tron obcych władców, co może okazać się zarówno błogosławieństwem, jak i przekleństwem."
 polish_autocratic_monarchy: "Polska monarchia autokratyczna"
 polish_autocratic_monarchy_desc: "Nie będziemy już zależeć od spełniania zachcianek niesfornych, małostkowych ludzi, którzy mieli szczęście urodzić się w szlacheckim domu. Polska korona jest wreszcie wolna i może samodzielnie kształtować swój los!"
 revoke_the_pacta_conventa_title: "Unieważnić pacta conventa"
 revoke_the_pacta_conventa_desc: "Szlachta narzuciła naszemu władcy przywileje, które uznano za niezgodne z prawem. Była to próba przejęcia władzy przez możnowładców i dalszego osłabienia autorytetu królewskiego. Musimy uchylić tę jawną zniewagę naszego majestatu."
 lit_emblem_faith_title: "Symbol wiary"
 lit_emblem_faith_desc: "Nasze państwo od dawna jest nękane konfliktami religijnymi. Aby uporządkować sprawy wewnętrzne, musimy umocnić naszą wiarę i zadbać o stosunki ze Stolicą Apostolską."
 sca_lit_religious_unity_title: "Uregulować sprawy religijne"
 sca_lit_religious_unity_desc: "Kwestia religii na Litwie musi zostać rozstrzygnięta. Wielu naszych poddanych nadal wyznaje prawosławie, nie wspominając już o rosnących wezwaniach katolików do reform. Musimy rozwiązać tę sprawę wszelkimi dostępnymi środkami."
 lit_privilege_vilnius_title: "Przywilej wileński"
 lit_privilege_vilnius_desc: "Wielu szlachciców ziemskich w naszym królestwie nie wyznaje religii naszego państwa. Ponieważ niemądre jest przeciwstawianie się tak potężnemu potencjalnemu dobroczyńcy naszego państwa, musimy zjednoczyć tych arystokratów, przyznając im specjalne przywileje."
 lit_jesuit_academy_title: "Akademia jezuicka"
 lit_jesuit_academy_desc: "Żadne państwo nie może szczycić się rolą krzewiciela wiedzy i oświecenia bez prężnego ośrodka naukowego. Aby temu zaradzić, w 1579 roku założono Uniwersytet Wileński — trzeci najstarszy uniwersytet w regionie. Pierwotnie utworzony przez jezuitów jako uczelnia wyższa, z czasem miał pomieścić wiele wydziałów, w tym teologię, nauki humanistyczne i filozofię."
 lit_stabilize_interior_title: "Ustabilizować sytuację wewnętrzną"
 lit_stabilize_interior_desc: "Niedawna wojna domowa pozostawiła blizny na naszych ziemiach. Jeśli chcemy odciąć się od zła przeszłości, musimy zadbać o ustabilizowanie spraw wewnętrznych."
 lit_reform_magdeburg_laws_title: "Prawo magdeburskie"
 lit_reform_magdeburg_laws_desc: "Wprowadzenie zachodnich przepisów regulujących rozwój naszych ośrodków miejskich niewątpliwie przyczyniło się do ich rozkwitu. Jeśli jednak chcemy wykorzystać falę urbanizacji napędzaną naszym bogactwem, musimy zreformować prawo i zadbać o jego skuteczność."
 lit_elective_courts_title: "Ustanowić sądy elekcyjne"
 lit_elective_courts_desc: "Mimo prób wprowadzenia merytokratycznych procedur sądowych poprzez utworzenie sądów kierowanych przez sejmiki stało się jasne, że instytucje te przekształciły się w kolejne narzędzie rozszerzania wpływów szlachty. Wielu możnowładców lekceważy lub ignoruje wydawane orzeczenia. Musimy wykorzenić tę korupcję i ustanowić sprawny system prawny w całym państwie."
 lit_enforce_tribunal_title: "Wzmocnić Trybunał"
 lit_enforce_tribunal_desc: "Delegowanie kompetencji i odpowiedzialności jest niezbędne, jeśli chcemy osiągnąć stabilność i pomyślny rozwój. Aby to umożliwić, musimy utworzyć najwyższy sąd apelacyjny dla arystokracji państwa."
 sca_lit_ukraine_2_title: "Rozwinąć Ruś"
 sca_lit_ukraine_2_desc: "Kijów był niegdyś dumnym miastem i stolicą całej Rusi. Od tamtej pory popadł jednak w ruinę. Powinniśmy przywrócić mu dawną świetność i uczynić z niego główny ośrodek handlu i bogactwa, będący chlubnym symbolem dobrobytu naszego państwa."
 sca_lit_develop_sluck_title: "Słuckie pasy"
 sca_lit_develop_sluck_desc: "Szlachta upodobała sobie noszenie eleganckich pasów z delikatnych tkanin, którymi przepasuje swoje szaty. Żadne nie dorównują jednak tym wytwarzanym w Słucku. Musimy zadbać o to, by prowincja mogła produkować ich wystarczająco dużo, aby zaspokoić rosnące potrzeby możnowładców."
 lit_build_manufactories_title: "Uprzemysłowić Litwę"
 lit_build_manufactories_desc: "W dziedzinie produkcji dokonuje się wielki postęp, zarówno technologiczny, jak i organizacyjny. Zainwestujmy znaczne środki w nowe manufaktury — być może wkrótce nastąpi wielka rewolucja przemysłowa."
 sca_mission_lit_cossacks_title: "Zaprzyjaźnić się z Kozakami"
 sca_mission_lit_cossacks_desc: "Kozacy są lojalnymi przyjaciółmi i niebezpiecznymi wrogami. Powinniśmy zadbać o to, by Kozacy zamieszkujący nasze ziemie byli zadowoleni, wierni i gotowi do walki z naszymi przeciwnikami."
 sca_lit_conquer_crimea_title: "Podbić Krym"
 sca_lit_conquer_crimea_desc: "Najazdy i handel niewolnikami od stuleci nękają Ruś. Musimy położyć kres tym barbarzyńskim praktykom, podporządkowując sobie Tatarów krymskich."
 lit_harness_steppes_title: "Zagospodarować stepy"
 lit_harness_steppes_desc: "Stepy od wieków wydawały na świat liczne legendarne postacie, które pojawiały się i odchodziły, pozostawiając swój ślad na kartach historii. Jeśli chcemy sięgnąć gwiazd, musimy zadbać o każdy aspekt naszego państwa, a zwłaszcza o nowo podbite ziemie na południowo-wschodnim pograniczu."
 lit_great_power_politics_title: "Polityka wielkich mocarstw"
 lit_great_power_politics_desc: "Nie będziemy już odgrywać drugorzędnej roli w wielkich sprawach Starego Kontynentu. Nadszedł czas, by mieszkańcy naszego wielkiego państwa powstali i pokazali zarówno sojusznikom, jak i wrogom, że nasza siła przetrwa próbę czasu i zwycięży tych, którzy chcieliby zakończyć nasze długotrwałe panowanie. Litwa zasługuje na wielkość, którą słusznie powinna osiągnąć."
 lit_settle_polish_inheritance_title: "Sukcesja polska"
 lit_settle_polish_inheritance_desc: "Polska, nasz najbliższy sojusznik, przeżywa kryzys przywództwa, który może mieć katastrofalne skutki dla niepodległości Litwy. Musimy wyjść z tej sytuacji z nienaruszonymi granicami — czy to poprzez unię, czy też walkę o naszą niepodległość."
 lit_march_west_title: "Marsz na Zachód"
 lit_march_west_desc: "Ziemie polskiej korony na zachodzie są gotowe do podboju. Niedawna, przedwczesna śmierć poprzedniego władcy pozostawiła polski tron pusty. Nadszedł czas, by uderzyć i rozszerzyć naszą domenę."
 sca_lit_defeat_the_livonian_order_title: "Pokonać zakon inflancki"
 sca_lit_defeat_the_livonian_order_desc: "Zakon inflancki prowadzi wojny z Litwą od chwili swojego powstania, nawet po naszym przejściu na katolicyzm. Musimy raz na zawsze go rozgromić."
 sca_mission_lit_polish_union_title: "Ustanowić Rzeczpospolitą"
 sca_mission_lit_polish_union_desc: "Polska i Litwa są sobie przeznaczone, niezależnie od tego, czy Polacy zdają sobie z tego sprawę. Nasze narody muszą zostać zjednoczone pod rządami jednego władcy, jednego prawdziwego króla."
 sca_lit_conquer_novgorod_title: "Złamać potęgę Nowogrodu"
 sca_lit_conquer_novgorod_desc: "Rosnące wpływy Moskwy zagrażają równowadze sił na Rusi. Powinniśmy zadbać o to, by nasi dawni sojusznicy, Republika Nowogrodzka, potrafili dotrzymać jej kroku. W przeciwnym razie będziemy musieli aktywniej zaangażować się w sprawy ruskie."
 sca_lit_conquer_muscovy_title: "Kampania moskiewska"
 sca_lit_conquer_muscovy_desc: "Nawet z silnym Nowogrodem, który sprawdzi ich potęgę, Moskale pozostają zagrożeniem nie do przyjęcia. Musimy osadzić na ich tronie litewskiego króla, albo uderzyć na samą Moskwę."
 lit_wave_piety_modifier: "Fala pobożności"
 desc_lit_wave_piety_modifier: "Nasi ludzie wykazali się bezprecedensową siłą wiary, wyrażając jedność z boskością i jej ziemskimi przedstawicielami."
 lit_privilege_vilnius_modifier: "Przywilej wileński"
 desc_lit_privilege_vilnius_modifier: "Dzięki ścisłej współpracy z najznamienitszymi możnowładcami naszego państwa udało nam się wzmocnić podstawy tolerancji w naszych społecznościach."
 lit_stable_rule_modifier: "Stabilne rządy"
 desc_lit_stable_rule_modifier: "Epoka autonomicznych terytoriów w granicach naszego państwa dobiegła końca. Teraz wszyscy drobni panowie i baronowie na południu podlegają naszemu zwierzchnikowi. Zmiana ta pozytywnie wpłynęła na rozwój naszego państwa i jego mieszkańców."
 lit_stable_rule_2_modifier: "Stabilne rządy"
 desc_lit_stable_rule_2_modifier: "Epoka autonomicznych terytoriów w granicach naszego państwa dobiegła końca. Teraz wszyscy drobni panowie i baronowie na południu podlegają naszemu zwierzchnikowi. Zmiana ta pozytywnie wpłynęła na rozwój naszego państwa i jego mieszkańców."
 lit_centers_urbanization_modifier: "Ośrodki urbanizacji Litwy"
 desc_lit_centers_urbanization_modifier: "Prowincja ta staje się rozwijającym się ośrodkiem urbanizacji na ziemiach litewskich. Przybywa tu wielu kupców, artystów i zamożnych ludzi, którzy tchną życie w to piękne miasto."
 lit_efficient_sejmiks_modifier: "Sprawne sejmiki"
 desc_lit_efficient_sejmiks_modifier: "Nowo powołane sejmiki zdają się przestrzegać litewskiego prawa, dzięki czemu obrady ustawodawcze przebiegają sprawnie."
 lit_efficient_leg_proceedings_modifier: "Sprawne postępowanie ustawodawcze"
 desc_lit_efficient_leg_proceedings_modifier: "Nasza administracja nadąża teraz za duchem czasu i działa sprawniej niż kiedykolwiek wcześniej dzięki niezbędnym reformom biurokratycznym wprowadzonym przez dwór królewski."
 lit_harnessed_steppes_modifier: "Rozwój stepów"
 desc_lit_harnessed_steppes_modifier: "Stepy na południowy wschód od naszych granic są domem dla wielu wędrownych ludów. Opodatkowanie ich przyniosło zauważalną poprawę naszego miesięcznego bilansu."
 lit_golden_age_lit_modifier: "Złoty wiek Litwy"
 desc_lit_golden_age_lit_modifier: "Mimo nieustannych prób naszych wrogów i wbrew wszelkim przeciwnościom lud Litwy rozwija się, staje się silniejszy i zamożniejszy. To prawdziwy złoty wiek naszego wielkiego państwa!"
 lit_part_of_the_polish_domain_modifier: "Członek polskiego sejmu"
 desc_lit_part_of_the_polish_domain_modifier: "Jako część polskiej domeny możemy wiele zyskać, podejmując próby ustabilizowania naszych spraw wewnętrznych i podporządkowania lokalnych panów oraz baronów."
 lit_increased_dev_modifier: "Efektywny rozwój polskiej domeny"
 lit_attracting_migrants_modifier: "Przyciąganie migrantów"
 desc_lit_attracting_migrants_modifier: "Nasze państwo cieszy się opinią tolerancyjnego i otwartego. Dzięki temu nasze ziemie stają się coraz atrakcyjniejszym celem migracji."
 lit_lithuanian_supremacy_modifier: "Litewska supremacja"
 desc_lit_lithuanian_supremacy_modifier: "Nasza kultura góruje nad wszystkimi innymi dzięki swojej wyjątkowości, wyrażającej się w prestiżu, sztuce, architekturze i literaturze."
 canonization_of_casimir_modifier: "Kanonizacja Kazimierza"
 desc_canonization_of_casimir_modifier: "Nasz ukochany władca Kazimierz stał się jasną gwiazdą katolicyzmu i zajął należne mu miejsce pośród licznych świętych naszej religii."
 lit_landed_cossack_lords_modifier: "Osadzeni na ziemi kozaccy możnowładcy"
 desc_lit_landed_cossack_lords_modifier: "Nadając ziemię kozackim możnowładcom, skutecznie zapewniliśmy sobie ich lojalność oraz dostęp do najlepszych jeźdźców i koni dla naszych sił zbrojnych."
 enable_estate_nomadic_tribes_modifier: "Odblokowuje stan plemion"
 lit_forum_thought_modifier: "Litewski ośrodek wymiany myśli"
 desc_lit_forum_thought_modifier: "Instytucja ta jest bijącym sercem ruchu naukowego na Litwie. Nauczając takich dziedzin jak prawo, architektura, filozofia i wielu innych, uniwersytet zyskał ogromny prestiż i stał się ośrodkiem innowacji."
 lit_canonize_casimir_tt: "\n§YJeśli ukończymy tę misję przed śmiercią Kazimierza, zostanie on kanonizowany i ogłoszony świętym.§!"
 until_we_form_country_desc: "do chwili utworzenia innego państwa"
 lit_all_estates_loyalty_55_tt: "Lojalność wszystkich §Ystanów§! wynosi co najmniej §Y55§!"
 lit_every_province_that_fulfills_req_tt: "Każda §Yprowincja§! spełniająca wymagania otrzyma następującą nagrodę:"
 lit_reform_magdeburg_laws: "\nNasza idea narodowa „§YPrawo magdeburskie§!” zostanie ulepszona."
 lit_every_overlord_owned_or_subject_prov_1_random_dev: "Każda stepowa §Yprowincja§! należąca do nas, naszego poddanego niebędącego państwem trybutarnym lub naszego §Yzwierzchnika§! otrzyma §G1§! losowy punkt rozwoju."
 lit_better_than_2_gp_tt: "Co najmniej §Y2§! miejsce w rankingu wielkich mocarstw."
 lit_halve_hegemony_reqs_tt: "\n§PZmniejszone wymagania do uzyskania dowolnej hegemonii§!"
 lit_declined_pu: "Odrzucono unię z @POL §YPolską§!"
 lit_accepted_pu: "Zaakceptowano unię z @POL §YPolską§!"
 lit_claim_livonian_lands_tt: "Otrzymamy roszczenie do ziem inflanckich."
 lit_take_pu_lesser: "\nJeśli staniemy się poddanym §Ypolskiej korony§!:"
 lit_poland_subject_tt: "Jeśli @POL §YPolska§! jest naszym poddanym, rozwijanie jej ziem przyniesie §Ydwukrotnie§! większe korzyści przez następne §Y5§! lat."
 lit_4_ca_tt: "Jeśli ukończymy tę misję, posiadając co najmniej §Y4§! §Yakceptowane kultury§!:"
 lit_enable_nomads_for_30_years: "Odblokowuje stan §Yplemion§! na §Y30 lat§!."
 25_permanent_power_projection: "Nagroda za misję: projekcja potęgi §Y(trwała)§!"
 10_permanent_power_projection: "Nagroda za misję: projekcja potęgi §Y(trwała)§!"
 lit_has_3_toh_tt: "Ma co najmniej §G3§! punkty tolerancji heretyków."
 lit_every_province_with_man_base_production_tt: "\nKażda posiadana prowincja z §Ymanufakturą§! otrzyma §G1§! podstawowej produkcji."
 flavor_lit.14.t: "Kanonizacja Kazimierza Jagiellończyka"
 flavor_lit.14.d: "Kazimierz urodził się w królewskim pałacu w Warszawie, a dorastał pod opieką polskiego kapłana. Konserwatywne wychowanie sprawiło, że cenił swoją wiarę i nosił ją niczym emblemat na piersi. Działania podjęte podczas jego panowania, zwłaszcza wzniesienie kilku świątyń i poprawa stosunków ze Stolicą Apostolską, doprowadziły do ogłoszenia go świętym — wybitnym symbolem litewskiej pobożności i siły religijnej."
 flavor_lit.14.a: "Błogosław, Panie, naszego władcę!"
 flavor_lit.15.t: "Academia et Universitas Vilnensis Societatis Jesu"
 flavor_lit.15.d: "W roku [GetYear], na prośbę monarchy i najwyższych warstw szlachty, w prowincji [272.GetName] utworzono akademię jezuicką. Jej głównym zadaniem było łączenie religii z nauką, filozofii i nauk humanistycznych z teologią. Wkrótce zapisali się pierwsi studenci, a jeszcze w tym samym roku powstała wielka biblioteka, do której liczni wybitni przedstawiciele litewskiej polityki przekazali tysiące książek i tomów wiedzy."
 flavor_lit.15.a: "Cóż za wspaniałe czasy!"
 flavor_lit.16.t: "Odnowienie dawnych więzi"
 flavor_lit.16.d: "Polski tron pozostaje pusty już od pewnego czasu, po tragicznej śmierci ostatniego polskiego monarchy na polach Warny. Porażka w starciu z wojskami osmańskimi była druzgocąca: polska korona rozpadła się, kładąc kres unii trzech największych państw Europy. Teraz polscy posłańcy przynoszą wieści i proszą, by nasz własny Kazimierz przeniósł się do polskiej stolicy, aby z nowej siedziby władzy rządzić oboma państwami. Oznaczałoby to jednak rezygnację z niepodległości, a w znacznej mierze również z autonomii. Nasza decyzja z pewnością odbije się echem na kartach historii."
 flavor_lit.16.a: "Nasze losy są ze sobą związane. Niech tak będzie."
 flavor_lit.16.b: "Nie możemy ryzykować utraty niepodległości..."
 flavor_lit.17.t: "Stepy krymskie"
 flavor_lit.17.d: "Nasze podboje na stepach krymskich przyniosły znaczne korzyści: rozszerzyliśmy domenę i zdobyliśmy nowe ziemie, które można opodatkować. Są nam one jednak obce, a miejscowe zwyczaje i koczownicze ludy pozostają tajemnicą. Nasi doradcy przedstawili wiele propozycji rozwiązania tej sytuacji. Niektórzy sugerują przekazanie administracji tych ziem naszym kozackim możnowładcom w zamian za ich przychylność i lojalność. Inni członkowie rady popierają jednak ustanowienie bezpośredniego zarządu lub nawet włączenie koczowniczych władców konnych do naszej administracji aż do ich ostatecznej i całkowitej asymilacji."
 flavor_lit.17.a: "Powierzmy stepy Kozakom."
 flavor_lit.17.b: "Będziemy negocjować bezpośrednio z władcami konnych ludów!"
 flavor_lit.17.c: "Te ziemie należą wyłącznie do nas!"
 flavor_lit.18.t: "Francysk Skaryna i cuda druku"
 flavor_lit.18.d: "Francysk Skaryna, jeden z pierwszych drukarzy książek na ziemiach litewskich, dorastał w zamożnym domu w Połocku. Studiował na Uniwersytecie Krakowskim, gdzie uzyskał stopień naukowy w dziedzinie sztuk wyzwolonych, a następnie zdobył doktorat z medycyny na Uniwersytecie w Padwie we Włoszech. Wiele lat później, po zakończeniu kariery akademickiej, założył kilka drukarni działających na obszarze od Pragi po Wilno. Wśród jego drukowanych dzieł znalazły się Psałterz oraz wielojęzyczny przekład Biblii."
 flavor_lit.18.a: "W ten sposób poznamy dobrodziejstwa szerzenia mądrości i nauki."
 flavor_lit.19.t: "Powstanie Chmielnickiego"
 flavor_lit.19.d: "Najbardziej niepokorne elementy naszego dworu, Kozacy stanowiący trzon naszej ruchomej armii, wystosowali ultimatum do najwyższej władzy ziem. Ostatnie wydarzenia w sprawach dworskich bardzo niezadowoliły ich hetmanów i teraz ośmielają się żądać swojej niezależności. Ich dążenia do niepodległości karmią się nierealnym marzeniem, które doprowadziło do utworzenia na Rusi Hetmanatu Kozackiego. Jeśli ich żądania nie zostaną spełnione, grożą popełnieniem okrucieństw i grabieży na całym naszym terenie."
 flavor_lit.19.a: "Przyznajmy im autonomię, za którą tak tęsknią."
 flavor_lit.19.b: "Przynieście mój bat!"
 flavor_lit.19.c: "Stepy nas wzywają!"
 lit_new_magdeburg_laws: "Nowe prawo magdeburskie"
 lit_new_magdeburg_laws_desc: "Jednym ze skutków zwrotu Litwy ku Zachodowi jest wprowadzenie niemieckiego prawa miejskiego w wielu ośrodkach miejskich państwa. Prawo magdeburskie, dostosowane do lokalnych warunków, będzie regulować liczne aspekty gospodarcze i polityczne urbanizacji — od planowania przestrzennego po handel i podatki."
 LIT2_ideas: "Litewskie idee"
 LIT2_ideas_start: "Litewskie tradycje"
 LIT2_ideas_bonus: "Litewskie ambicje"
 PLC_LIT_ideas: " Litewsko-Polskie idee"
 PLC_LIT_ideas_start: "Litewsko-Polskie tradycje"
 PLC_LIT_ideas_bonus: "Litewsko-Polskie ambicje"
 LPC: "Rzeczpospolita Obojga Narodów"
 LPC_ADJ: "Rzeczpospolita"
 lithuanian_grand_kingdom: "Wielkie Królestwo"
 lithuanian_grand_kingdom_desc: "Mimo braku centralizacji przez większą część XV wieku ziemiami naszego księstwa rządziło wielu ambitnych książąt. Ostatnie wydarzenia międzynarodowe, w połączeniu z ekspansją terytorialną i wysiłkami na rzecz centralizacji, pozwoliły nam rozszerzyć kontrolę i wpływy w regionie oraz ogłosić powstanie pierwszego Wielkiego Królestwa!"
 lithuanian_grand_empire: "Wielkie Imperium"
 lithuanian_grand_empire_desc: "Wcześniejsze próby podporządkowania sobie poszczególnych stanów przyniosły znakomite rezultaty. Gdy w Europie świta epoka absolutyzmu, nasi królowie będą teraz cieszyć się takim samym wpływem, władzą i przywilejami, jakie w historii Starego Kontynentu przysługiwały cesarzom. Niech żyje nasze Wielkie Imperium!"
 invest_heir_education: "Zainwestować w edukację księcia"
 drill_exercises: "Ćwiczenia musztry"
 appease_the_estates: "Zjednać sobie stany"
 estates_fund_industrialization: "Sfinansować projekt przemysłowy"
 estates_fund_industrialization_tt: "Jedna losowa posiadana prowincja z rozwojem §Y10§! otrzyma §Ymanufakturę§!."
 pol_5_crownland_tt: "Koszt tego projektu wynosi §Y5%§! ziemi koronnej."
 legendary_pirate_personality: "Legendarny pirat"
 desc_legendary_pirate_personality: "Ten władca zyskał sławę legendarnego pirata siedmiu mórz. Twój władca przechytrzył niezliczone floty i zna podmuch każdego z wielkich oceanów. Dopóki sprawuje władzę, nie musisz martwić się o jakość floty.\n§YPonowny wybór legendarnego pirata nie kosztuje tradycji republikańskiej.§!"
 legendary_pirate_personality_die_desc: "Wrodzy szczury lądowe mogą wreszcie odetchnąć z ulgą, ponieważ nie muszą już obawiać się najazdów wielkiego [Root.Monarch.GetName]."
 legendary_pirate_personality_at: "§YPonowny wybór legendarnego pirata nie kosztuje tradycji republikańskiej.§!"
 legendary_pirate_personality_bt: "§Y[Root.Monarch.GetName] jest teraz legendarnym piratem i ponowny wybór nie kosztuje już tradycji republikańskiej.§!"
 pirates.25.t: "Pirackie sukcesy [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 pirates.25.desc: "Wojna między państwem [Root.GetName] a państwem [From.GovernmentName] [From.GetName] była wyczerpująca dla wszystkich — od zwykłych, nieporadnych bukanierów po doświadczonych kapitanów. Nikt jednak nie wykazał się takimi umiejętnościami, sprytem i refleksem jak [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Gdyby nie przywództwo [Root.Monarch.GetHerHis] podczas wielkiej wojny [Root.GetAdjective]-[From.GetAdjective], wszyscy moglibyśmy już zawisnąć na szubienicy."
 pirates.25.a: "Niech [Root.Monarch.GetTitle] [Root.Monarch.GetName] poprowadzi nas ku zwycięstwu i złotu!"
 fin_forcelimit_title: "Rozbudować armię"
 fin_forcelimit_desc: "Nasze księstwo może wydawać się nieistotne w cieniu potężnych sąsiadów. Mimo to musimy rozbudować siły zbrojne, aby wywalczyć i obronić naszą niepodległość!"
 fin_independence_title: "Obronić niepodległość"
 fin_independence_desc: "Wolność jest najsłodsza dla tych, którzy poznali gorycz niewoli. Walczmy o autonomię i zerwijmy kajdany narzucone przez naszego rzekomego suwerena! Finlandia będzie wolna."
 fin_stockholm_title: "Złamać Sztokholm"
 fin_stockholm_desc: "Stolica dekadenckiego Królestwa Szwecji jest jedynie błyskotką, kolejnym ważnym miastem, które padnie przed naszą potężną armią. Przyłączenie go do kolekcji naszych portów z pewnością zwiększy naszą legitymizację i wpływy w regionie."
 fin_culture_title: "Uczcić naszą kulturę"
 fin_culture_desc: "Mimo sukcesów w sprawach wojskowych i administracyjnych na dworze królewskim coraz częściej pojawia się kwestia naszej tożsamości narodowej. Wkrótce musimy wybrać drogę dla naszego narodu — tolerancję albo kulturową supremację."
 fin_dalaskrogen_title: "Przejąć środki produkcji"
 fin_dalaskrogen_desc: "Dawny król Szwecji wykorzystywał kopalnie w prowincji [8.GetName] dla własnego zysku. Kontrolowanie głównego źródła miedzi w Europie jest niezwykle dochodowym przedsięwzięciem. Wyzwólmy prowincję i jej mieszkańców spod szwedzkiego panowania — nie mają nic do stracenia poza swoimi kajdanami!"
 fin_baltic_empire_title: "Imperium Bałtyckie"
 fin_baltic_empire_desc: "Skandynawia i wody Bałtyku były na przestrzeni wieków kolebką wielkich imperiów. W obliczu ostatnich prób ingerencji obcych mocarstw musimy chronić nasze wybrzeża i umocnić nad nimi dominację!"
 fin_baltic_empire_tt: "Włącza możliwości rekrutacji §YKarolenów§!."
 fin_grow_farms_title: "Społeczności rolnicze"
 fin_grow_farms_desc: "Gospodarka naszego państwa opiera się przede wszystkim na łowiectwie i rolnictwie. Rozsądnie byłoby rozwinąć produkcję, tworząc w ten sposób solidne podstawy dobrobytu narodu."
 fin_high_income_title: "Dopracować finanse"
 fin_high_income_desc: "Fiński dwór musi słynąć z oszczędności i odpowiedzialności. Nie zbudujemy wiarygodnej reputacji na regionalnych rynkach finansowych, jeśli nie zadbamy o księgi rachunkowe i nie uporządkujemy naszych finansów."
 fin_neva_title: "Wieża świętego Olafa"
 fin_neva_desc: "Wschodnie ziemie naszej domeny zamieszkują dzikie i krwiożercze księstwa, które rywalizują o tron ludu Rusi. Musimy zabezpieczyć linię frontu i rozwinąć odpowiednie umocnienia, aby nie paść ofiarą ich ekspansjonistycznych zapędów."
 fin_tar_trade_title: "Przejąć kontrolę nad handlem smołą"
 fin_tar_trade_desc: "Budowa okrętów to pewny krok ku rozwojowi naszej obecności morskiej na Bałtyku. Smoła, substancja wykorzystywana przy budowie statków, jest powszechnie dostępna na północnych wybrzeżach, a zarazem niezwykle ważna dla przyszłego rozwoju naszej floty."
 fin_fourth_rome_title: "Biała śmierć"
 fin_fourth_rome_desc: "Nadszedł czas, by nasz wielki naród porzucił skromny strój niewielkiego księstwa i ujawnił potęgę wobec nieświadomych niczego gigantów Starego Kontynentu. Przyszłe kampanie wojenne przyniosą opowieści o naszej potędze militarnej."
 fin_abo_academy_title: "Akademia w Turku"
 fin_abo_academy_desc: "Choć sprawnie zajmujemy się administracją i sprawami wojskowymi, wyraźnie zaniedbaliśmy zaawansowaną edukację naszego ludu. Rozwój umysłów powinien stać się przewodnią zasadą naszego państwa."
 fin_build_turku_title: "Rozbudować Turku"
 fin_build_turku_desc: "Centralizacja państwa rozpoczyna się wtedy, gdy władca pewną ręką prowadzi lud ku wspólnemu ośrodkowi. Dla nas takim centrum musi stać się zamożne miasto górujące nad bogatym wybrzeżem Bałtyku."
 fin_found_helsingfors_title: "Miasto Helsinki"
 fin_found_helsingfors_desc: "Kontynuując urbanizację naszego państwa, musimy zakładać nowe osady tętniące życiem kupców i chłopów, będące symbolem naszego niepowstrzymanego i nieugaszonego rozwoju!"
 fin_handle_the_sami_title: "Zintegruj Lapończyków"
 fin_handle_the_sami_desc: "Lapończycy to lud zamieszkujący gęste lasy północy, gdzie nie mieszka żaden inny Skandynaw - czy to Szwed, Norweg czy Duńczyk. Nie prowadzą oni handlu ze światem poza swoim terytorium i są całkowicie odizolowani. Żyją jednak na terytorium, które formalnie należy do nas. Powinniśmy włączyć ich do naszego społeczeństwa, abyśmy mogli czerpać korzyści z tych lasów."
 fin_savage_tactics_modifier: "Dzikie taktyki"
 desc_fin_savage_tactics_modifier: "Mamy wielu wrogów, którzy nie spoczną, dopóki nie podporządkują sobie naszego państwa lub nie wymażą go z kart historii. Aby temu zapobiec, musimy odpłacić pięknym za nadobne i wykorzystać nasze dzikie taktyki przeciwko wszystkim, którzy pragną skrzywdzić lub zniewolić nasz lud."
 fin_era_of_independence_modifier: "Wiek wielkiego grzmotu"
 desc_fin_era_of_independence_modifier: "Rozpoczęła się era naszej niepodległości! Teraz złotymi literami i powiewem sukcesu zapiszemy nasze narodowe przedsięwzięcia w księgach historii!"
 fin_celebrated_melting_pot_modifier: "Sławna mozaika kultur"
 desc_fin_celebrated_melting_pot_modifier: "Wiele grup ludności o różnym pochodzeniu uważa nasze państwo za swój dom, co napawa dumą nasze społeczeństwo."
 fin_accelerated_assimilation_modifier: "Przyspieszona asymilacja"
 desc_fin_accelerated_assimilation_modifier: "Dzięki propagandzie, skuteczniejszym metodom perswazji i kampaniom wymierzonym w obcą ludność naszego państwa przyspieszyliśmy jej przyjmowanie naszej kultury i stylu życia."
 fin_abundant_food_modifier: "Obfitość żywności"
 desc_fin_abundant_food_modifier: "Życie w zimnym klimacie naszej domeny od zawsze wiązało się z problemami z zaopatrzeniem. Dzięki fachowemu planowaniu i ciężkiej pracy zgromadziliśmy jednak odpowiednie zapasy, dzięki czemu w dającej się przewidzieć przyszłości żaden Fin nie będzie głodował."
 fin_viipurin_linna_modifier: "Zamek w Wyborgu"
 desc_fin_viipurin_linna_modifier: "Jedna z najgroźniejszych twierdz i wschodnia brama Skandynawii. Zamek ten stał się miejscem śmierci wielu wrogów narodu fińskiego."
 fin_commercial_tar_modifier: "Handel smołą"
 desc_fin_commercial_tar_modifier: "Wraz z rozszerzaniem naszych podbojów i wpływów wokół Bałtyku naturalne jest, że powinniśmy wejść na rynek produkcji i wykorzystania smoły, niezbędnej dla naszych przedsięwzięć morskich."
 fin_heir_of_rome_modifier: "Prawowity dziedzic Rzymu"
 fin_white_death_descends_upon_europe: "Biała śmierć nad Europą"
 desc_fin_white_death_descends_upon_europe: "Nasz lud nie będzie już poddanym ani pionkiem wielkich mocarstw. Jesteśmy teraz wystarczająco potężni i wpływowi, a nasze armie i domena nie mają sobie równych. Nasz naród z dumą ogłosił się panem Skandynawii."
 fin_finnish_militarization_modifier: "Fińska militaryzacja"
 desc_fin_finnish_militarization_modifier: "Ustawa o powszechnej militaryzacji wprowadzona w całym państwie jest dobrym sposobem na modernizację i rozbudowę naszej infrastruktury obronnej."
 fin_finnish_swedish_carolean: "Karolinowie"
 desc_fin_finnish_swedish_carolean: "Słynne wojska Szwecji — Karolinowie — znajdują się teraz pod dowództwem naszego chwalebnego sztabu generalnego!"
