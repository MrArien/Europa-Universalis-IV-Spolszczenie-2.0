 TERCIO_DESC: "Tercio, dosłownie „trzecia część”, to specjalne jednostki stanowiące trzon hiszpańskich armii. Choć historycznie żołnierzy tych formacji werbowano nie tylko w Hiszpanii, lecz także we Włoszech i Walonii, najbardziej cenione tercjańskie oddziały pochodziły z hiszpańskich prowincji. Przez dziesięciolecia tercja były niemal niepokonane na polach bitew Europy i basenu Morza Śródziemnego, stając się inspiracją dla innych państw.\nTercio łączy zwartą formację z dużą siłą ognia.\nRegimenty Tercio można werbować we własnych prowincjach należących do §Yiberyjskiej§! grupy kulturowej, a ich maksymalna liczba zależy od rozwoju tych prowincji."
