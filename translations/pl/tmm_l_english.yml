 SAMURAI_DESC: "Samuraj to członek japońskiej szlachty wojskowej średniowiecza i wczesnej epoki nowożytnej. Samurajowie szkoleni są w posługiwaniu się bronią i powinni przestrzegać kodeksu postępowania zwanego bushidō, który podkreśla znaczenie lojalności, odwagi i honoru. Służą swoim panom, daimyō, i oczekuje się od nich gotowości do oddania życia w ich obronie. Klasa samurajów została ostatecznie zniesiona pod koniec XIX wieku w ramach restauracji Meiji i przywrócenia władzy cesarskiej w Japonii.\nSamurajów można werbować we własnych prowincjach należących do §Yjapońskiej§! grupy kulturowej, a ich maksymalna liczba zależy od rozwoju tych prowincji."
