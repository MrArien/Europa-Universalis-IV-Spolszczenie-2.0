 STRELTSY_DESC: "Strzelcy to rosyjskie jednostki piechoty uzbrojonej w broń palną, które z czasem stały się kastą zawodowych żołnierzy, ponieważ służba wojskowa była dożywotnia i dziedziczna.\nTen rodzaj wojsk utworzył w XVI wieku Iwan IV Groźny, lecz Piotr I Wielki rozwiązał je jako odrębne jednostki i włączył do regularnej armii w ramach reform modernizujących instytucje państwa.\nStrzelców można werbować we wszystkich własnych prowincjach, a ich maksymalna liczba zależy od całkowitego rozwoju państwa."
