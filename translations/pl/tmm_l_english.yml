 MUSKETEER_DESC: "Muszkieterzy byli piechurami powszechnie wykorzystywanymi przez armię francuską, a w XVII wieku stanowili elitarną gwardię królów Francji. Szkolono ich w posługiwaniu się muszkietem w szyku, na przykład w linii lub czworoboku, często we współdziałaniu z pikinierami i kawalerią. Słynni francuscy muszkieterzy znani byli z odwagi, lojalności i charakterystycznych mundurów, do których należały kapelusze z szerokim rondem oraz długie szpady.\nMuszkieterów można werbować we własnych prowincjach należących do §Yfrancuskiej§! grupy kulturowej, a ich maksymalna liczba zależy od rozwoju tych prowincji."
