 GALLEON_DESC: "Galeony to charakterystyczne dla Hiszpanii okręty wojenne — ciężkie jednostki o silnym uzbrojeniu i wytrzymałej konstrukcji. Mają długi i stosunkowo wąski kadłub, dzięki czemu są szybkie i zwrotne.\nLiczba galeonów, które można zbudować, zależy od całkowitego rozwoju posiadanych prowincji należących do §Yiberyjskiej§! grupy kulturowej. Okręty te można budować w tych prowincjach, jeśli leżą na wybrzeżu."
