 GEOBUKSEON_DESC: "Kobukson, znany na Zachodzie również jako „okręt-żółw”, to duży koreański okręt wojenny, charakterystyczny dla koreańskiej floty. Słynie z przypominającego skorupę pancerza, który osłania kadłub i chroni marynarzy, oraz smoczej głowy umieszczonej na dziobie, z której można było wypuszczać dym zasłaniający okręt.\nLiczba kobuksonów, które można zbudować, zależy od limitu sił morskich. Okręty te można budować w prowincjach nadbrzeżnych."
