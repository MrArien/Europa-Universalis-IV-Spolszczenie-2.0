 GALLEASS_DESC: "Galeas jest większy i ma wyższe burty niż galera, lecz łączy jej szybkość z dzielnością morską i siłą artylerii galeonu.\nW XV–XVII wieku we Włoszech zbudowano stosunkowo niewiele galeasów, głównie na potrzeby Wenecji. Okazały się jednak kluczowe podczas najważniejszych starć morskich na Morzu Śródziemnym, takich jak bitwa pod Lepanto.\nLiczba galeasów, które można zbudować, zależy od tradycji morskiej. Można je budować w prowincjach nadbrzeżnych posiadających dok lub stocznię."
