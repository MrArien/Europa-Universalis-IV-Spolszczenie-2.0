 MAN_OF_WAR_DESC: "Okręty wojenne typu man-of-war to potężne fregaty brytyjskiej marynarki. Uzbrojone w rzędy dział i napędzane wielkimi żaglami, łączą szybkość z siłą ognia w sposób niemal niezrównany.\nLiczba okrętów tego typu, które można zbudować, zależy od całkowitego limitu sił morskich. Można je budować w prowincjach posiadających dok lub stocznię."
