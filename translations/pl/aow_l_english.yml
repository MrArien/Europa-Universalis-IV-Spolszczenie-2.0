 flavor_ori.1.t: ""
 flavor_ori.1.d: "Obrzędy odprawiane w wielkiej świątyni w Puri oraz drewniany wizerunek, w którym objawia się Dźagannatha, bywają wyśmiewane przez obcych władców. W Orisie Dźagannatha, „Pan Wszechświata”, jest jednak bezsprzecznie najpopularniejszym bóstwem.\nDźagannatha i jego kapłani niezmiennie wspierali również radżę Kapilendrę, założyciela naszej dynastii. Nadszedł czas, by nasz ród odwdzięczył się za tę lojalność. Powinniśmy otoczyć opieką świątynię w Puri i uczynić kult Dźagannathy najważniejszym wyznaniem w naszym królestwie."
 flavor_ori.1.a: "Chwała Dźagannacie!"
 flavor_ori.1.b: "Nie stawiajmy wszystkiego na jedną kartę."
 flavor_ori.2.t: "Wojny Kapilendry"
 flavor_ori.2.d: "Gdy w 1434 roku Kapilendra Deva obalił ostatniego z władców z dynastii Gangi Wschodnich, Orisa znajdowała się w opłakanym stanie. Najazdy muzułmanów z północy i zachodu, a także rywalizacja z południowymi sąsiadami znacznie osłabiły królestwo. Radża Kapilendra szybko jednak odwrócił ten stan rzeczy. Dzięki kolejnym wojnom z Bengalem, dynastią Reddy z Andhry, sułtanami Bahmanidów i imperium Widźajanagaru Orisa pod jego przywództwem znacznie się powiększyła i umocniła.\nNieustanne wojny odbiły się jednak na ludności naszego królestwa, a wyjątkowo nieudane żniwa doprowadziły do narastania niezadowolenia. Zasugerowano, że nastroje społeczne poprawiłyby się, gdybyśmy tymczasowo znieśli tradycyjny podatek solny i w większym stopniu skupili się na dobru poddanych."
 flavor_ori.2.a: "Nie potrzebujemy podatku od soli."
 flavor_ori.2.b: "Nie możemy ulec presji społecznej."
 flavor_ori.3.t: "Śmierć Kapilendry"
 flavor_ori.3.d: "Po długim życiu wielki wojownik i król Kapilendra leży na łożu śmierci. Ku przerażeniu swoich osiemnastu prawowitych synów stary władca, kierując się głosem Dźagannathy, postanowił jednak wyznaczyć na dziedzica nieślubnego syna, Puruszottamę.\nGdy król wydaje ostatnie tchnienie, sukcesja pozostaje daleka od rozstrzygnięcia. Hamvira, dotychczas główny kandydat do tronu, uciekł na południe i chwycił za broń przeciwko Puruszottamie."
 flavor_ori.3.a: "Musimy wypełnić wolę Dźagannathy!"
 flavor_ori.3.b: "To Hamvira jest prawowitym dziedzicem!"
 flavor_ori.3.a.tt: "Nasi sąsiedzi dowiedzą się o tej decyzji i odpowiednio na nią zareagują."
 flavor_ori.4.t: "Kryzys sukcesyjny w Orisie"
 flavor_ori.4.d: "Dotarły do nas wieści, że Kapilendra, wojowniczy król Orisy, nie żyje i wygląda na to, że jego synowie walczą o tron pozostawiając królestwo słabym i bezbronnym."
 flavor_ori.4.a: "Rozumiem."
 flavor_ori.5.t: "Oferta Hamviry"
 flavor_ori.5.d: "Dziś przybył posłaniec od Hamviry, pretendenta do tronu Orisy. Hamvira twierdzi, że da nam szereg ważnych fortów na wschodzie, jeżeli wesprzemy go w walce o tron Orisy."
 flavor_ori.5.a: "Wyślij wojsko i pieniądze."
 flavor_ori.5.b: "Unikaj zaangażowania"
 flavor_ori.6.t: "Bahmanidzi wzywają Hamvirę"
 flavor_ori.6.d: "Sułtan Bahmanidów, odwieczny wróg naszego królestwa, zdecydował się poprzeć Hamvirę. Nie mamy pewności co otrzymał w zamian, ale jeśli wierzyć pogłoskom, Hamvira był wystarczająco zdesperowany, aby obiecać Bahmanidom znaczną część naszego kraju."
 flavor_ori.6.a: "Upewnij się zatem, że nie zwycięży."
 flavor_ori.7.t: "Zwycięski Hamvira"
 flavor_ori.7.d: "Skoro armie pretendenta Hamviry przejmują kontrolę nad stolicą, wojna domowa zdaje się zbliżać do końca. Na południu sułtan Bahmanidów działał szybko obsadzając swoimi żołnierzami garnizony w tych fortach, które im obiecano."
 flavor_ori.7.a: "Nie jest dobrze."
 flavor_ori.8.t: "Hamvira spłaca długi."
 flavor_ori.8.d: "Pod koniec wojny domowej w Orisie udało nam się przejąć kontrolę nad obszarami obiecanymi nam przez Hamvirę."
 flavor_ori.8.a: "Wspaniale!"
 flavor_ori.9.t: "Kult Dźagannatha"
 flavor_ori.9.d: "Wraz z odejściem Gajapatów z tronu Orisy zerwano ścisłą więź pomiędzy państwem a Dźagannathą i jego kapłanami. Podczas gdy świątynia w Puri i sam kult tego bóstwa pozostają wciąż ważne dla życia kulturalnego i duchowego Orisy, nie jest on już tak ściśle związany z samą monarchią."
 flavor_ori.9.a: "Rozumiem."
 flavor_ori.10.t: "Narodziny literatury orija"
 flavor_ori.10.d: "Do tej pory sanskryt był jedynym językiem literackim w Orisie, a potoczny język orija był zarezerwowany dla Śudrów i niższych kast. Sarala Das, emerytowany żołnierz z niewielkim wykształceniem, zaczął to jednak zmieniać tłumacząc Mahabharatę na orija. Pozostałe swa dzieła Sarala Das napisał również wyłącznie w orija, więc kolejni poeci mogą teraz pójść w jego ślady."
 flavor_ori.10.a: "Rozumiem."
 flavor_ori.11.t: "Achyutananda"
 flavor_ori.11.d: "Poeta, wizjoner i niezwykle płodny autor zdobywa w naszym królestwie coraz większą popularność jako święty wisznuicki. Podobno Achjutananda potrafi przepowiadać przyszłość, a jego księgi powstają w orija — języku zwykłych ludzi."
 flavor_ori.11.a: "Rozumiem."
 zan_shirazi_islam: "Islam szirazi"
 zan_religious_orthodoxy: "Przyjęcie naszych poglądów religijnych"
 zan_religious_unrest: "Odejście od tradycji szirazi"
 desc_zan_religious_unrest: "Aby zjednać sobie licznych zagranicznych kupców w naszym państwie, zaczęliśmy eliminować nieortodoksyjne praktyki religijne. Choć w dłuższej perspektywie może nam to przynieść korzyści, obecnie podważa legitymizację naszej dynastii, której władza opiera się na tych tradycjach, a zarazem wywołuje napięcia między licznymi grupami wyznaniowymi w państwie."
 zan_sacked_by_the_zimba: "Złupienie przez lud Zimba"
 desc_zan_sacked_by_the_zimba: "Miasto zostało zaatakowane i złupione przez lud Zimba. Odbudowa i ponowne zaludnienie sprawiają, że lokalna gospodarka wciąż odczuwa skutki najazdu."
 zan_kilwa_chronicle: "Kronika Kilwy"
 desc_zan_kilwa_chronicle: "Kronika Kilwy to księga opisująca dzieje naszej dynastii — od jej początków, jeszcze przed przybyciem do Kilwy, aż po czasy obecne. Dokument ten bez cienia wątpliwości potwierdza nasze prawowite prawo do panowania nad portami wybrzeża Suahili."
 flavor_zan.1.t: "Islam szirazi i patrycjusze Kilwy"
 flavor_zan.1.d: "Większość państw Suahili jest do dziś rządzona przez dynastie wywodzące swoje pochodzenie od pierwszej migracji muzułmanów do tego regionu. Islam praktykowany przez tych, którzy nazywają siebie Szirazami, nie jest jednak najbardziej ortodoksyjną odmianą tej religii. Na naszym dworze codziennie odprawia się wiele dawnych lokalnych obrzędów, a rodom szirazi przypisuje się magiczne zdolności, które mają uzasadniać ich prawo do rządzenia tymi miastami.\nWraz ze wzrostem bogactwa Kilwy i innych państw Suahili przybywają jednak kolejne fale cudzoziemców. Kupcy z Omanu, Persji, królestwa Bahmanidów i odległych krain osiedlili się w naszych miastach, a rosnąca grupa miejscowych handlarzy nawiązała z nimi współpracę. Wielu przybyszów gardzi naszymi tradycjami. Przyjęcie bardziej ortodoksyjnej odmiany islamu z pewnością poprawiłoby nasze stosunki z innymi państwami Oceanu Indyjskiego, lecz mogłoby podważyć naszą władzę i zaszkodzić relacjom z pozostałymi państwami Suahili."
 flavor_zan.1.a: "Musimy pozostać wierni zwyczajom naszych przodków."
 flavor_zan.1.b: "Oczyśćmy nasze królestwo z pogańskich wierzeń i obrzędów."
 flavor_zan.2.t: "Kronika Kilwy"
 flavor_zan.2.d: "Wraz z napływem coraz większej liczby zagranicznych kupców z ortodoksyjnych państw muzułmańskich na wybrzeże Suahili nasze dawne obyczaje szirazi spotykają się z coraz ostrzejszą krytyką. Z oburzeniem obserwujemy, jak niektóre stare dynastie szirazi na wybrzeżu zostają obalone przez rosnącą w siłę grupę miejscowych kupców sprzymierzonych z przybyszami.\nJako jedna z najstarszych i najpotężniejszych dynastii szirazi wciąż jednak trzymamy się mocno. Aby wywrzeć odpowiednie wrażenie zarówno na cudzoziemcach, jak i krajowych wichrzycielach, powinniśmy zlecić skrybom spisanie kroniki naszego sławnego rodu. Dzięki niej nikt nie będzie mógł podważyć naszego szirazyjskiego pochodzenia ani dawnych islamskich korzeni dynastii."
 flavor_zan.2.a: "Stwórzmy taką kronikę."
 flavor_zan.2.b: "Mamy ważniejsze sprawy na głowie."
 flavor_zan.3.t: "Porzucenie tradycji szirazi"
 flavor_zan.3.d: "Reforma struktur religijnych naszego królestwa doprowadziła nas do momentu, w którym musimy zdecydować, którą tradycję chcemy naśladować. W naszym państwie żyją perscy szyici, ibadyccy kupcy z Omanu, a także indyjscy i tureccy sunnici. Poza kwestiami teologicznymi wybór odmiany islamu, z którą się utożsamimy, prawdopodobnie ukształtuje politykę zagraniczną naszego królestwa na wiele lat."
 flavor_zan.3.a: "Dotychczasowe reformy są wystarczające."
 flavor_zan.3.b: "Przyjmijmy szyizm."
 flavor_zan.3.c: "Zwiążmy się z ibadytami."
 flavor_zan.3.od: "Zaprosimy sunnickich uczonych, by pomogli zreformować nasze królestwo."
 flavor_zan.4.t: "Kanibale!"
 flavor_zan.4.d: "Nasze królestwo zawdzięcza swoje istnienie sieci handlowej Oceanu Indyjskiego i sprawuje niewielką rzeczywistą kontrolę nad afrykańskim interiorze. Musimy jednak nieustannie mieć się na baczności przed ludami zamieszkującymi głębię kontynentu. Jedna z takich grup, kanibalistyczny lud Zimba, od dawna szerzy strach na wybrzeżu daleko na południe od nas. Dziś Zimba bez ostrzeżenia napadli na samo miasto Kilwa. Wielu mieszkańców Kilwy zginęło, a jeszcze więcej uciekło z miasta. Odbudowa potrwa lata; trudno przypomnieć sobie większą tragedię w historii naszego królestwa."
 flavor_zan.4.a: "Dzień żałoby."
 flavor_zan.4.b: "Przeznaczmy wszystkie środki na odbudowę i odnowę Kilwy."
 flavor_zan.5.t: "Przewrót Sulejmana i Muhammada al-Mazluma"
 flavor_zan.5.d: "Gdy sułtan Isma’il wstąpił na tron Kilwy w 1442 roku, jego władzę zakwestionowali lokalni władcy Zanzibaru, którzy popierali roszczenia jego krewnego Sa’ida do sułtanatu. Spisek Sa’ida został jednak udaremniony przez królewskiego wezyra Sulejmana oraz emira Muhammada al-Mazluma.\nPo śmierci samego Isma’ila Sulejman i Muhammad najwyraźniej uznali jednak, że nadszedł czas, by przejąć władzę we własnym imieniu. Działając szybko, wykorzystali swoje wpływy, by zabezpieczyć stolicę, po czym uzgodnili podział władzy i naprzemienne obejmowanie tronu."
 flavor_zan.5.a: "Sulejman obejmuje tron."
 flavor_zan.5.b: "Muhammad al-Mazlum obejmuje tron."
 flavor_zan.5.c: "$MONARCH$ jest naszym prawowitym władcą!"
 flavor_zan.6.t: "Niepopularny uzurpator"
 flavor_zan.6.d: "Choć $MONARCH$ przez wiele lat pełnił funkcję królewskiego ministra, zanim samowolnie przejął władzę, jego zamach stanu uczynił go niepopularnym wśród mieszkańców Kilwy. Wpływowi obywatele domagają się teraz jego ustąpienia. Jeśli ich nie udobruchamy, prędzej czy później może dojść do buntu."
 flavor_zan.6.a: "Abdykuj na rzecz $HEIR$."
 flavor_zan.6.b: "Nasz władca zdobył prawo do tego tronu."
 flavor_zan.7.t: "Spiskujący wezyr"
 flavor_zan.7.d: "Utrzymanie się na tronie Kilwy nigdy nie było łatwe. Liczne spiski towarzyszące koronacjom monarchów w ostatnich dziesięcioleciach sprawiły, że urząd wezyra w królewskiej administracji stał się łakomym kąskiem dla ambitnych ludzi, którzy pragną zdobyć tron, zamiast wiernie służyć koronie.\nOstatni spadek popularności monarchii najwyraźniej wystarczył naszemu obecnemu wezyrowi, by spróbować przejąć tron dla siebie."
 flavor_zan.7.a: "Rozumiem."
 ful_marabout_wars: "Buntownicy marabuci"
 desc_ful_marabout_wars: "W tym regionie rozwinął się ruch ludowy dążący do ograniczenia władzy centralnej i utworzenia ortodoksyjnego państwa islamskiego rządzonego zgodnie z szariatem."
 flavor_ful.1.t: "Niepokoje marabutów w prowincji $PROVINCENAME$"
 flavor_ful.1.d: "Kaznodzieje-marabuci, zainspirowani charyzmatycznym Nasirem al-Dinem, zaczęli głosić potrzebę reformy islamu w prowincji $PROVINCENAME$. Wielu miejscowych wojowników przyłączyło się do marabutów. Wspólnie działają poza strukturami państwa, by stworzyć społeczeństwo kierujące się najczystszą postacią szariatu. Zdecydowanie sprzeciwiają się wszelkim pogańskim tradycjom i obcym wpływom."
 flavor_ful.1.a: "Rozumiem."
 flavor_ful.2.t: "Prawosławna rewolucja islamska"
 flavor_ful.2.d: "Od pojawienia się marabutów w połowie XVII wieku napięcia religijne w naszym kraju stopniowo narastały. Teraz stronnictwo marabutów w kraju $COUNTRYNAME$ otwarcie wystąpiło przeciwko dawnej arystokracji w stolicy $CAPITAL_CITY$. Zapowiadana rewolucja szybko zyskała poparcie wielu pasterzy Fulbe zamieszkujących rozległe obszary naszego państwa. Wkrótce staniemy w obliczu niezwykle poważnego buntu."
 flavor_ful.2.a: "Musimy przyłączyć się do rewolucji! Śmierć arystokratom!"
 flavor_ful.2.b: "Musimy zachować nasze tradycje!"
 flavor_ful.3.t: "Koniec dżihadu Fulbe"
 flavor_ful.3.d: "Ponieważ nasze państwo całkowicie porzuciło ideały islamskie, na których zostało zbudowane, stronnictwo marabutów opuściło kraj i przeniosło swoją działalność gdzie indziej."
 flavor_ful.3.a: "Rozumiem."
