 desc_famine_refused_aid: "Głód spowodowany przez grabieże wojenne nawiedza prowincję, zwłaszcza po tym, jak odmówiono jej pomocy państwa."
 plundered_in_war: "Grabieże wojenne"
 desc_plundered_in_war: "Miejscowa ludność cierpi z powodu żołnierzy dokonujących napadów, aby nakarmić Boga Wojny i siebie samych, co dzieje się kosztem cywilów."
 plague_at_siege: "Zaraza podczas oblężenia"
 desc_plague_at_siege: "Wojna przyniosła chorobę tej prowincji, nasiloną jeszcze przez oblegające ją armie."
 lingering_plague: "Długotrwała zaraza"
 desc_lingering_plague: "Odmowa dowódców wojskowych obu stron konfliktu, by postawić dobrobyt ludności ponad zwycięstwem, pozwoliła na rozprzestrzenienie się tutaj chorób."
 terrorized_by_mercenaries: "Terror najemników"
 desc_terrorized_by_mercenaries: "Miejscowi ucierpieli od grabieży i tortur z rąk bezwzględnych najemników, coraz bardziej nienawidząc okupantów."
 curtailed_mercenaries: "Redukcja zatrudnienia najemników"
 post_war_tax_relief: "Powojenna ulga podatkowa"
 desc_post_war_tax_relief: "Aby zmniejszyć trudności rodzin borykających się z utratą bliskich podczas wojny, podatki zostały obniżone."
 decreased_drafting: "Mniejszy zaciąg"
 desc_decreased_drafting: "Utrata tak wielu istnień ludzkich w ostatniej wojnie sprawiła, że byliśmy bardziej wyrozumiali w rekrutacji naszej armii."
 suffering_bereaved: "Cierpienia żałobników"
 desc_suffering_bereaved: "Rodziny żołnierzy, którzy oddali życie za nasz naród, rozgniewał nasz brak współczucia dla ich trudnej sytuacji."
 desc_curtailed_mercenaries: "Po tym, jak siły najemników ograniczyły zbyt wiele swobód przez co miejscowa ludność doznała kłopotów, zaczęliśmy bardziej uważać kogo zatrudniamy i ile im płacimy."
 local_witch_hunts: "Lokalne polowania na czarownice"
 desc_local_witch_hunts: "Mieszkańcy tej zniszczonej wojną prowincji szukają nadprzyrodzonych przyczyn swojego cierpienia ścigając podejrzane czarownice."
 nationwide_witch_hunts: "Ogólnokrajowe polowania na czarownice"
 desc_nationwide_witch_hunts: "Prześladowania czarów są inspirowane na szczeblu państwowym i odbywają się pod nadzorem inkwizytora sądowego."
 forbade_witch_hunts: "Zakaz polowania na czarownice"
 desc_forbade_witch_hunts: "Przywódcy państwowi i kościelni w naszym kraju opowiedzieli się przeciwko heretyckiej wierze w magię, frustrując tych, którzy trzymają się takich przesądów."
 loyal_unbelievers: "Lojalni niewierzący"
 desc_loyal_unbelievers: "Szpiedzy wykorzystali swoje kontakty religijne, aby udawać lojalność wobec naszych wrogów i usprawniając tym nasze operacje szpiegowskie za granicą."
 disloyal_unbelievers: "Nielojalni niewierzący"
 desc_disloyal_unbelievers: "Szpiedzy, którzy nie wyznają naszej religii państwowej, pozwolili wrogom narazić na szwank nasze operacje szpiegowskie."
 abadoned_religious_rebels: "Opuszczeni buntownicy religijni"
 desc_abadoned_religious_rebels: "Aby uniknąć kryzysu dyplomatycznego, zdystansowaliśmy się od zagranicznych rebeliantów, którzy twierdzą, że walczą w obronie naszej wiary."
 desert_traders: "Pustynni handlarze"
 animist_syncretism: "Synkretyzm animistyczny"
 desc_animist_syncretism: "Mieszanka starych lokalnych tradycji i nowych monoteistycznych pomysłów utrudnia określanie granic religijnych."
 dogmatic_preacher: "Wsteczny Kaznodzieja"
 desc_dogmatic_preacher: "Nie chcąc, aby słowo Boże zostało zmieszane z prastarymi przesądami, lokalny wysiłek misjonarzy, napotkał tutaj trudności."
 buying_firearms_from_neighbor: "Kupowanie broni palnej od sąsiada"
 desc_buying_firearms_from_neighbor: "Dzięki przyjęciu oferty naszych sąsiadów sprzedaży nam bardziej zaawansowanej broni, zyskali oni przewagę w wymianie handlowej z nami."
 refused_slave_trade_with_europeans: "Odmówiono handlu niewolnikami z Europejczykami"
 desc_refused_slave_trade_with_europeans: "Nasza odmowa sprzedawania do europejskich kolonii niewolników schwytanych podczas wojny, pozwoliła nam zachować kontrolę nad naszym lokalnym handlem."
 slave_trade_with_europeans: "Handel niewolnikami z Europejczykami"
 desc_slave_trade_with_europeans: "Umowa z naszymi europejskimi sąsiadami na sprzedaż im niewolników zwiększyła popyt, a nasza podaż poszła w sukurs."
 raided_by_cavalry: "Najechano przez kawalerię"
 desc_raided_by_cavalry: "Niespodziewany atak małego oddziału wrogiej kawalerii osłabił obronę tej prowincji."
 new_dyeing_methods: "Nowe metody barwienia"
 desc_new_dyeing_methods: "Badanie życia roślin w dżungli dostarczyło nowych metod tworzenia barwników."
 used_to_tropical: "Przyzwyczajeni do tropików"
 desc_used_to_tropical: "Nasi ludzie są przyzwyczajeni do klimatu i środowiska w tej prowincji."
 distrusts_heathens: "Nieufni innowiercy"
 desc_distrusts_heathens: "Wpływ miejscowego kardynała doprowadził administrację do nieufności względem pogan i ograniczenia ich praw."
 cardinal_in_administration: "Kardynał w rządzie"
 desc_cardinal_in_administration: "Kardynałowi przydzielono ważne stanowisko w naszym rządzie, dając realny wpływ na sposób rządzenia narodem. "
 blackmailing_cardinal: "Szantażowany kardynał"
 desc_blackmailing_cardinal: "Trzymanie w garści kardynała w sąsiednim kraju pomogło nam ulepszyć sieć szpiegowską poza naszymi granicami."
 SCORE_REVOLUTION: "Kolebka rewolucji: $VAL|%=+0$"
 REVOLUTION_IS_TAKING_PLACE: "W kraju $WHERE$ wybuchła rewolucja."
 revolution_target: "Kolebka rewolucji"
 REVOLUTION_TARGET_DESC: "W trakcie rewolucji wynik kraju zwiększa się o $SCORE|+0%$."
 FOLLOWING_EFFECTS: "Ma to następujące skutki:"
 PEACE_DISMANTLE_REVOLUTION: "Demontaż rewolucji"
 PEACE_CHANGE_HRE_RELIGION: "Dominacja religijna"
 DISMANTLE_REVOLUTION: "Rewolucja dobiegnie końca, a $WHO$ na powrót stanie się monarchią."
 REVOLUTIONARY_NAME: "Rewolucyj. $NAME$"
 REVOLUTIONARY_SHORT_NAME: "Rew. $NAME$"
 religious_leagues.1.t: "Triumfujący cesarz"
 religious_leagues.1.d: "Wojna religijna w Imperium zakończyła się całkowitym zwycięstwem cesarza. Parlament Cesarski zebrał się w zgromadzeniu, aby ogłosić katolicyzm jedyną akceptowalną wiarą Świętego Cesarstwa Rzymskiego. Elektorzy, którzy wyznają inną wiarę, zostaną pozbawieni przywilejów, a cesarz otrzyma szerokie uprawnienia do wymuszania jedności katolickiej w Imperium."
 religious_leagues.1.a: "Wspaniały dzień!"
 religious_leagues.2.t: "Unia Ewangelicka zwycięża"
 religious_leagues.2.d: "Wojna religijna w Imperium zakończyła się zwycięstwem Unii Ewangelickiej. Cesarz został zmuszony do abdykacji, a protestantyzm jest obecnie dominującą wiarą w Imperium."
 religious_leagues.2.a: "Czarny dzień!"
 religious_leagues.3.t: "Liga Katolicka zwycięża"
 religious_leagues.3.d: "Wojna religijna w Imperium zakończyła się zwycięstwem Ligi Katolickiej. Cesarz został zmuszony do abdykacji, a katolicyzm jest obecnie dominującą wiarą w Imperium."
 religious_leagues.3.a: "Czarny dzień!"
 religious_leagues.4.t: "Pokój w Westfalii"
 religious_leagues.4.d: "Wojna religijna w Imperium zakończyła się bez rozstrzygnięcia i obie strony zebrały się w mieście Münster w Westfalii, aby podpisać kompromis pokojowy. Zgodnie z warunkami pokoju westfalskiego, wiara wyznaniowa każdego państwa będzie określana przez jego władcę, zgodnie z zasadą „czyje królestwo, jego religia”."
 religious_leagues.4.a: "'Cuius regio, eius religio'"
 religious_leagues.5.t: "Unia Ewangelicka"
 religious_leagues.5.d: "Po tym jak cesarz $MONARCH$ odrzucił konfesyjne stanowisko protestantów na cesarskim parlamencie, protestanccy książęta cesarscy utworzyli związek szmalkaldzki, ze wspólną armią i skarbcem oraz poszukującą wsparcia za granicą. Katolickie państwa niemieckie, czując się zagrożone tym nowym sojuszem, przegrupowały się w Ligę Katolicką. Rozpoczął się konflikt religijny w Cesarstwie."
 religious_leagues.5.a: "Ci heretycy będą żałować swojej zuchwałości!"
 religious_leagues.6.t: "Sejm Rzeszy w mieście $CAPITAL_CITY$"
 religious_leagues.6.d: "Po tym, jak Unia Ewangelicka nie zdołała skutecznie rzucić wyzwania cesarzowi, Parlament Cesarski zebrał się na zgromadzeniu, aby ogłosić katolicyzm jedyną akceptowalną wiarą Świętego Cesarstwa Rzymskiego. Elektorzy, którzy wyznają inną wiarę, zostaną pozbawieni przywilejów, a cesarz otrzyma szerokie uprawnienia do wymuszania jedności katolickiej w Imperium."
 religious_leagues.6.a: "Wspaniały dzień!"
 religious_leagues.7.t: "Sejm Rzeszy w mieście $CAPITAL_CITY$"
 religious_leagues.7.d: "Po nieudanej próbie rzucenia wyzwania cesarzowi przez Ligę Katolicką parlament cesarski zebrał się na sejmie, aby ogłosić protestantyzm jedynym wyznaniem Świętego Cesarstwa Rzymskiego. Elektorzy wyznający inną religię utracą swoje przywileje, a cesarz otrzyma szerokie uprawnienia do egzekwowania jedności wyznaniowej w Rzeszy."
 religious_leagues.7.a: "Wspaniały dzień!"
 religious_leagues.8.t: "Triumfujący cesarz"
 religious_leagues.8.d: "Wojna religijna w Imperium zakończyła się całkowitym zwycięstwem cesarza. Parlament cesarski zebrał się na posiedzeniu, aby ogłosić protestantyzm jedyną wyznawaną religią w Świętym Cesarstwie Rzymskim. Elektorzy, którzy wyznają inną religię, zostaną pozbawieni przywilejów, a cesarz otrzyma szerokie uprawnienia do egzekwowania jedności protestanckiej w Imperium."
 religious_leagues.8.a: "Wspaniały dzień!"
 aow_events.1.t: "Sytacja w mieście [Root.GetName]"
 aow_events.1.d: "Państwo [Root.Owner.GetName] cierpi na wojnie, ale te prowincje, które leżą na drodze wroga, cierpią najbardziej. To, co wydaje się żołnierzowi lub dowódcy wygodnym źródłem zaopatrzenia, jest często wszystkim, co mają zwykli ludzie. Obrzeża miasta [Root.GetCapitalName] zostały splądrowane w tej wojnie. Teraz zwracają się do rządu o pomoc w odbudowie, aby cierpienia [Root.Owner.GetAdjective] nie ciągnęły się latami po ostatecznym zawarciu pokoju."
 aow_events.1.a: "Zapewnimy wszystko, co niezbędne."
 aow_events.1.b: "Te pieniądze lepiej wydać na wygranie tej wojny."
 aow_events.2.t: "Na granicy"
 aow_events.2.d: "Oblężenia pochłaniają wiele czasu i życia, dlatego zwykle podejmujemy wszelkie niezbędne kroki, by jak najszybciej je zakończyć. Podczas trwającej wojny jedno z oblężeń przypadło w pobliżu granicy, co wywołało dyskusję o tym, jak daleko żołnierze mogą się posunąć w łupieniu okolicznych terenów.\\n\\nPaństwo po drugiej stronie granicy nie jest naszym wrogiem w tej wojnie, ale być może zrozumie sytuację, jeśli kilka jego osad zostanie — rzekomo przez pomyłkę — splądrowanych. Zdobyte w ten sposób zapasy mogłyby znacznie ułatwić oblężenie."
 aow_events.2.a: "Zdobądźcie tyle zaopatrzenia, ile potrzeba, i zakończcie oblężenie."
 aow_events.2.a.tt: "[This.Owner.GetName] może nie być z tego zadowolone..."
 aow_events.2.b: "Rozsądniej będzie nie wykraczać poza granice naszych wrogów."
 aow_events.3.t: "[From.GetName] narusza nasze granice"
 aow_events.3.d: "Mimo że nasze państwa pozostają w pokoju, otrzymaliśmy doniesienia o żołnierzach [From.GetAdjective], którzy napadli na nasze pogranicze w prowincji [Root.GetName], rabując chłopów w poszukiwaniu zaopatrzenia. Ich ambasadorowie zapewniają, że doszło do zwykłej pomyłki, a armia desperacko próbuje zdobyć zapasy potrzebne do prowadzenia oblężenia po drugiej stronie granicy. Niezależnie od tego, czy był to wypadek, prowincja [Root.GetName] poniosła straty."
 aow_events.3.a: "To niedopuszczalne pogwałcenie naszych granic!"
 aow_events.3.b: "Wszyscy możemy popełniać błędy podczas wojny. Przeprosiny wystarczą."
 aow_events.4.t: "Opór"
 aow_events.4.d: "Mieszkańcy i szlachta nie zawsze są zadowoleni z naszych rządów, ale jeszcze mniej cieszą się z obcej okupacji ich ziemi. Chociaż prowincja jest pod kontrolą wroga, w prowincji [Root.GetName] wyrósł ruch oporu, gotowy uderzyć przeciwko najeźdźcom i odzyskać ziemię dla swojej sprawy. Ich przywódca zwrócił się do nas o pomoc, obiecując, że jeśli my dostarczymy broń, to oni wzniecą pożogę."
 aow_events.4.a: "Miejmy nadzieję, że ci patrioci narobią trochę zamieszania."
 aow_events.4.b: "Jeśli chcą wspierać państwo [Root.Owner.GetName], powinni współpracować z naszymi siłami zbrojnymi."
 aow_events.5.t: "Zaraza podczas oblężenia prowincji [Root.GetName]"
 aow_events.5.d: "W ślad za wojną podążają zaraza, głód i śmierć. Nasze wojska w prowincji [Root.GetName] utrzymały twierdzę mimo oblężenia sił wroga, lecz w prowincji wybuchła straszliwa epidemia zagrażająca zarówno cywilom, jak i żołnierzom po obu stronach. Aby oszczędzić mieszkańcom jeszcze większej klęski, przynajmniej jedna ze stron musi ewakuować część ludności. Jeśli jednak napastnicy nie zachowają takiej ostrożności, mogą wykorzystać sytuację i zyskać przewagę podczas oblężenia."
 aow_events.5.a: "Dobrze, musimy pomyśleć o mieszkańcach."
 aow_events.5.a.tt: "Jeśli nasi wrogowie pozostaną na miejscu, mogą wykorzystać tę okazję, by zdobyć przewagę podczas oblężenia."
 aow_events.5.b: "Nie zrezygnujemy z naszej obrony!"
 aow_events.5.b.tt: "Jeśli napastnicy nie przeprowadzą częściowej ewakuacji, epidemia się nasili..."
 aow_events.6.t: "Zaraza podczas oblężenia prowincji [From.GetName]"
 aow_events.6.d: "W ślad za wojną podążają zaraza, głód i śmierć. Wojska państwa [From.Owner.GetAdjective] w prowincji [From.GetName] utrzymały twierdzę mimo naszego oblężenia, lecz w prowincji wybuchła straszliwa epidemia zagrażająca zarówno cywilom, jak i żołnierzom po obu stronach. Aby oszczędzić mieszkańcom i naszym żołnierzom jeszcze większej klęski, przynajmniej jedna ze stron musi ewakuować część ludności. Jeśli jednak obrońcy nie zachowają takiej ostrożności, mogą wykorzystać sytuację i zniweczyć nasze postępy w oblężeniu."
 aow_events.6.a: "Nie możemy dopuścić, by kryzys jeszcze się pogłębił."
 aow_events.6.b: "Nie możemy pozwolić im zdobyć przewagi!"
 aow_events.6.b.tt: "Jeśli obrońcy nie przeprowadzą częściowej ewakuacji, epidemia się nasili..."
 aow_events.7.t: "Obrońcy [From.Owner.GetAdjective] wycofują się z oblężonej twierdzy"
 aow_events.7.d: "Gdy w prowincji [From.GetName] wybuchła epidemia, odmówiliśmy ewakuacji, uznając, że to obrońcy — w pierwszej kolejności dbający o własnych mieszkańców — powinni podjąć takie działania. Na szczęście mieliśmy rację: obrońcy ustąpili i osłabili swoje pozycje podczas oblężenia, aby przeznaczyć część sił na powstrzymanie rozprzestrzeniania się choroby. To doskonała okazja do natarcia na ich osłabione pozycje."
 aow_events.7.a: "Z pewnością skorzystamy z tej okazji."
 aow_events.8.t: "Napastnicy wycofują się spod oblężonej twierdzy"
 aow_events.8.d: "Gdy w prowincji [From.GetName] wybuchła epidemia, odmówiliśmy ewakuacji, uznając, że pierwsze kroki powinny podjąć wojska napastników, które sprowadziły tam zarazę. Na szczęście mieliśmy rację: obawiając się skutków choroby dla swoich żołnierzy, napastnicy ustąpili, co spowodowało chwilowe osłabienie ich oblężenia. Nasze umocnienia pozostały tymczasem nienaruszone."
 aow_events.8.a: "Oby nigdy nie stracili ducha."
 aow_events.9.t: "Zaraza w prowincji [Root.GetName] przybiera na sile"
 aow_events.9.d: "Mimo że zaraza pustoszy ogarniętą wojną krainę, ani nasi dzielni obrońcy, ani nieustępliwi napastnicy oblegający twierdzę w prowincji [Root.GetName] nie zamierzają ustąpić. Wzajemny upór doprowadził do ogromnych strat wśród ludności cywilnej miasta [Root.Capital.GetCapitalName], które mieszkańcy widzą teraz zniszczone zarówno przez wojnę, jak i zarazę."
 aow_events.9.a: "Obie strony postąpiły głupio..."
 aow_events.10.t: "Zaraza w prowincji [From.GetName] przybiera na sile"
 aow_events.10.d: "Mimo że zaraza pustoszy ogarniętą wojną krainę, ani nieustępliwi obrońcy, ani nasi zuchwali napastnicy oblegający twierdzę w prowincji [From.GetName] nie zamierzają ustąpić. Ich upór doprowadził do ogromnych strat wśród ludności cywilnej miasta [From.Capital.GetCapitalName], niszcząc jego infrastrukturę i jeszcze bardziej utrudniając oblężenie."
 aow_events.10.a.tt: "Zaraza będzie nękać prowincję [This.GetName] przez wiele lat, zwiększając wyniszczenie obcych wojsk i szkodząc jej mieszkańcom."
 aow_events.11.t: "Rozprzestrzenianie się zarazy"
 aow_events.11.d: "Wojna przyczyniła się do rozprzestrzeniania chorób. Epidemia, która początkowo ograniczała się do okolic oblężonej twierdzy, objęła teraz znacznie większy obszar. Przyczyniły się do tego zarówno przemieszczanie się wysiedlonych cywilów, jak i ruchy wojsk, których trudno uniknąć podczas wojny. W końcu choroba dotarła również do prowincji [Root.GetName]."
 aow_events.11.a: "Przeklęta wojna..."
 aow_events.12.t: "Okrucieństwo najemników"
 aow_events.12.d: "Wojna rzadko obywa się bez okrucieństwa. Żołnierze nie słyną z miłosierdzia, lecz podczas tej wojny nasze wojska okupacyjne dopuściły się wyjątkowo podłych czynów. Najemnicy z kompanii [hired_mercenary_band.GetName], których wysłaliśmy do okupacji obszaru [war_province.GetAreaName], najwyraźniej niezadowoleni z otrzymywanego żołdu, zaczęli rabować ludność cywilną. Ich postępowanie splamiło reputację wszystkich naszych wojsk. Wymuszanie pieniędzy terrorem i torturami stało się powszechne, przez co żołnierze [Root.GetAdjective] budzą zarówno nienawiść, jak i strach, a opowieści o ich okrucieństwach docierają daleko poza granice teatru wojny."
 aow_events.12.a: "Musimy zapobiec podobnym sytuacjom w przyszłości."
 aow_events.12.b: "Bellum se ipsum alet! Niech biorą, co chcą."
 aow_events.13.t: "Oddziały najemników łupią obszar [Root.GetAreaName]"
 aow_events.13.d: "Okupacja obszaru [Root.GetAreaName] przez wroga drogo kosztowała jego mieszkańców. Kierowani chciwością i desperacją najemnicy z kompanii [hired_mercenary_band.GetName], wynajętej przez państwo [From.GetUsableName], brutalnie złupili i sterroryzowali miejscową ludność, próbując wymusić od niej pieniądze i zasoby."
 aow_events.13.a: "Chciwość deprawuje ludzkie serca..."
 aow_events.14.t: "Uchodźcy z prowincji [Root.GetName]"
 aow_events.14.d: "Skutki niedawnej wojny wciąż nękają państwo [Root.Owner.GetName]. Niektóre obszary zostały zniszczone do tego stopnia, że niemal nie nadają się do zamieszkania, a ludzie musieli się przemieszczać, by przetrwać w tych warunkach. Część mieszkańców całkowicie opuściła prowincję [Root.GetName] i osiedliła się w sąsiednich prowincjach, mniej dotkniętych wojennymi zniszczeniami."
 aow_events.14.a: "Wojna może się skończyła, ale nasze problemy nie."
 aow_events.15.t: "Rodziny, które pozostały w domu"
 aow_events.15.d: "Ostatnia wojna drogo kosztowała nasz naród. Wielu powołano pod broń, lecz niewielu wróciło. Rodziny zarówno szlachty, jak i pospólstwa ciężko pracowały, czekając na powrót żołnierzy, ale wojna dobiegła końca, a oni nigdy nie wrócili. Trud nie ustaje — wielu musi pracować za tych, których utracili, i ledwie znajduje czas na żałobę. Ci, którzy mogą się nad tym zastanowić, coraz częściej dochodzą do wniosku, że zbyt lekkomyślnie poświęcaliśmy ludzkie życie."
 aow_events.15.a: "Możemy zmniejszyć obciążenia podatkowe rodzin pogrążonych w żałobie."
 aow_events.15.b: "W przyszłości powinniśmy łagodniej prowadzić pobór do wojska."
 aow_events.15.c: "To cena, którą trzeba zapłacić za chwałę naszego państwa."
 aow_events.16.t: "Czarnoksięstwo"
 aow_events.16.d: "Mieszkańcy zniszczonego przez wojnę miasta [Root.Capital.GetCapitalName] szukają przyczyn nieszczęść, które ich spotkały. Na szczęście nie obwiniają za nie naszych rządów, lecz niestety znaleźli inne wyjaśnienie, które wywołało niemałe poruszenie. Twierdzą, że długotrwałe skutki wojny, dotykające jednych bardziej niż innych, mogą być wyłącznie dziełem osób parających się czarami i magią.\\n\\nOskarżenia sypią się bez opamiętania, a miejscowe władze są gotowe zorganizować odpowiednie procesy. Oczywiście na tyle odpowiednie, na ile procesy o czary mogą być w państwie [Root.GetName]."
 aow_events.16.a: "Pozwólmy im przeprowadzić lokalne procesy."
 aow_events.16.b: "$INQUISITOR$ może zająć się tymi sprawami w bardziej uporządkowany sposób."
 aow_events.16.c: "Takie niedorzeczne zabobony nie mają miejsca w państwie [Root.Owner.GetName]!"
 aow_events.17.t: "Polowanie na czarownice"
 aow_events.17.d: "Odkąd cierpiący mieszkańcy prowincji [Root.GetName] otrzymali błogosławieństwo państwa i Kościoła, by ścigać osoby rzekomo sprowadzające na nich głód i choroby za pomocą czarów, gorliwie korzystają z tego przyzwolenia. Początkowo wskazywano jedynie osoby budzące oczywiste podejrzenia, lecz teraz czarownice zdają się być wszędzie. Tłum domaga się krwi zarówno chłopów, jak i szlachty, a nawet część miejscowego duchowieństwa może być niegodna zaufania.\\n\\nTak wielka liczba praktyk satanistycznych z pewnością tłumaczy powojenne trudności prowincji [Root.GetName], jednak następujące po nich masowe procesy wymykają się spod kontroli. Powinniśmy dopuścić myśl, że niektórzy oskarżeni są niewinni."
 aow_events.17.a: "Połóżmy kres temu szaleństwu!"
 aow_events.17.b: "Wstawmy się za szlachtą."
 aow_events.17.c: "Wstawmy się za pospólstwem."
 aow_events.17.e: "Pozwólmy im wymierzyć sprawiedliwość wedle własnego uznania."
 aow_events.18.t: "Czarownica z obcego kraju"
 aow_events.18.d: "Zdolność niezawodnego rozpoznawania czarownic i czarowników to rzadki dar, o którym nie wiemy, komu Bóg go udzieli. Znacznie powszechniejszy jest natomiast dar rozpoznawania ich z mniejszą pewnością — na podstawie dziwnego lub nietypowego zachowania czy niezwykłych osiągnięć. Ma on tę dodatkową zaletę, że pozwala częściej wskazywać osoby nieprzystosowane społecznie.\\n\\nCzasami może to jednak przysporzyć kłopotów. Mieszkańcy prowincji [Root.GetName] wskazali ostatnio pewną szlachciankę z państwa [they_send_us_witches.GetAdjective] jako czarownicę. Postawienie jej przed sądem może wywołać incydent dyplomatyczny, lecz brak reakcji może zostać uznany za oznakę niedostatecznej wiary."
 aow_events.18.a: "Musimy położyć kres temu lękowi przed nieznanym."
 aow_events.18.b: "Czarownice, szpiedzy — kto wie, czym się zajmują?"
 aow_events.19.t: "Wyjątkowo niepokojące oskarżenie"
 aow_events.19.d: "Pod czujnym okiem $INQUISITOR$ procesy o czary i herezję przebiegały dotąd w stosunkowo uporządkowany sposób. $INQUISITOR_CAP_ADJ$ nie zasiadałby przecież na naszym dworze, gdybyśmy nie ufali $INQUISITOR_O_PRONOUN$. Ostatnie wydarzenie skomplikowało jednak sytuację, gdyż $INQUISITOR_ADJ$ podważył nasze zaufanie do innej osoby. $STATESMAN$$TRADER$$SPYMASTER$$DIPLOMAT$, który wielce przysłużył się państwu [Root.GetName] w stosunkach zagranicznych, został oskarżony o czary. To dowód, że nikt nie jest poza podejrzeniem.\\n\\n$STATESMAN$$TRADER$$SPYMASTER$$DIPLOMAT$ twierdzi, że $INQUISITOR$ wysuwa te oskarżenia z czystej zazdrości. Być może stoi za tym polityczna intryga, ale przecież dotąd ufaliśmy naszemu inkwizytorowi."
 aow_events.19.a: "Nie pozwolisz czarownicy żyć."
 aow_events.19.b: "Nie będziesz świadczył fałszywie przeciw bliźniemu swemu."
 aow_events.20.t: "Ognie piekielne"
 aow_events.20.d: "$INQUISITOR$ sumiennie wykonuje swoje obowiązki. Dzięki poparciu [Root.Monarch.GetTitle] osoby praktykujące czary są skazywane na śmierć i palone na stosie, jakby już za życia trafiały do piekła. Bezlitosne ściganie tych występków sprawiło, że nasza gorliwość religijna nie budzi żadnych wątpliwości.\\n\\nMimo to czasem pojawiają się chwile zwątpienia. Pewnego dnia młody następca tronu [Root.Heir.GetName] po raz pierwszy obserwuje publiczną egzekucję czarownicy. W blasku płomieni widzisz przerażenie w oczach [Root.Heir.GetHerHis], a zanim egzekucja dobiegnie końca, twoje dziecko błaga o darowanie skazanej życia. Twoje wyjaśnienia nie powstrzymują łez i w końcu nie potrafisz uzasadnić tego widoku niewinnemu umysłowi. Być może skazana również jest niewinna, a ty pewnego dnia sam spłoniesz — na wieki."
 aow_events.20.a: "Dziecko ma rację. Nasza gorliwość odebrała nam rozsądek."
 aow_events.20.b: "Cicho, dziecko, i módl się, by nikt tego nie usłyszał..."
 aow_events.21.t: "Nieznany strzelec"
 aow_events.21.d: "Państwo [Root.GetName] ma za sobą wiele niedawnych wojen, a [Root.GetAdjective] poddani coraz częściej podważają ich sens. Mimo to [Root.Monarch.GetTitle] nieustannie prowadzi armię naprzód. Żołnierze są wyczerpani i wielu z nich marzy o powrocie do domu. Nigdy jednak nie zdawaliśmy sobie sprawy, jak bardzo.\\n\\nAż do dziś. Gdy wojska szykowały się do starcia z wrogiem, rozległ się strzał, a król padł martwy na ziemię. Strzał oddał nieprzyjacielski snajper? A może był to spisek pretendentów do tronu? Możliwe też, że ktoś po prostu desperacko pragnął zakończyć tę wojnę."
 aow_events.21.a: "Być może nigdy się nie dowiemy."
 aow_events.22.t: "Zmiana usposobienia"
 aow_events.22.d: "Po zakończeniu wojny nasz żarliwy doradca dyplomatyczny $DIPLOMAT$ wielokrotnie błagał [Root.Monarch.GetName], by nie tylko zmienił politykę zagraniczną i zapobiegł kolejnemu rozlewowi krwi, lecz także przewartościował swoje priorytety jako władca.\\n\\n„Dopóki lud widzi, że [Root.Monarch.GetTitle] szykuje się do wojny, jak może nie obwiniać nas, gdy ta w końcu nadejdzie?” — pyta $DIPLOMAT$. „Nie chodzi tylko o to, czego pragnie lud. Chodzi o to, czego potrzebuje nasze państwo”."
 aow_events.22.a: "Masz rację. Państwo [Root.GetName] potrzebuje pokoju."
 aow_events.22.b: "Porzucić ducha, który poprowadził mnie na wojnę? Niedorzeczność."
 aow_events.23.t: "Wierni na ziemiach wroga"
 aow_events.23.d: "Wielu żołnierzy postrzega trwającą wojnę jako konflikt religijny. Wywołało to dyskusję na temat jednego z naszych oblężeń, podczas którego miejscowa ludność wyznaje religię [Root.Religion.GetName]. Zwykle nasze wojska zaopatrują się podczas oblężenia, zabierając mieszkańcom potrzebne zapasy. Pobożni żołnierze uważają jednak, że powinniśmy oszczędzić naszych braci i siostry wyznających religię [Root.Religion.GetName], nawet jeśli oznacza to przedłużenie oblężenia. Co jest ważniejsze dla ludu [Root.GetAdjective] — wiara czy wojna?"
 aow_events.23.a: "Oszczędźmy współwyznawców."
 aow_events.23.b: "Nie ma litości dla wrogów państwa [Root.GetName]!"
 aow_events.24.t: "Państwo [Root.GetName] zdradzone przez braci w wierze"
 aow_events.24.d: "Gdy nasi wrogowie po raz pierwszy zaatakowali wyznawców religii [Root.Religion.GetName] w państwie [Root.GetName], podzielali oni wiarę napastników, mimo naszych usilnych prób nawrócenia ich na właściwą drogę. Teraz, po brutalnych doświadczeniach wojny, przekonali się, jak płytka jest moralność wyznawców religii [Root.Religion.GetName]. Oblężeni i złupieni przez tych, którym ufali, z goryczą porzucili dawne wierzenia i przysięgli wierność nie tylko naszemu państwu, lecz także naszej religii."
 aow_events.24.a: "Pokażemy im, że wiara [Root.Owner.Religion.GetName] jest bardziej szlachetna."
 aow_events.25.t: "Niewierni w prowincji [Root.GetName] tracą pewność"
 aow_events.25.d: "Podczas gdy większość naszych poddanych obawia się najeźdźców wyznających religię [Root.Religion.GetName], niektórzy mieszkańcy zdają się ich witać z otwartymi ramionami. Po zajęciu prowincji [Root.GetName] przez wroga jej mieszkańcy zaczęli najwyraźniej zastanawiać się, czy nie byłoby im lepiej w państwie rządzonym przez władców ich własnej wiary. Aby zapobiec tej zdradzie, miejscowi dostojnicy wysłali na nasz dwór posłańca z prośbą o obietnicę większej powściągliwości w sprawach religijnych w prowincji [Root.GetName]. W przeciwnym razie wróg może już zdobywać tam wpływy."
 aow_events.25.a: "Odpłacimy lojalnym szacunkiem."
 aow_events.25.b: "Nie będziemy tolerować nielojalności."
 aow_events.26.t: "Wyznawcy [Root.GetReligion_gen]"
 aow_events.26.d: "Mądrzy i duchowo oświeceni ludzie z prowincji [From.GetName] odkryli, po tym jak zajęliśmy ich ziemie, że mogą skorzystać na przyłączeniu się do nas. W końcu [From.Owner.GetName] jest krajem wyznającym [From.Owner.Religion.GetName], z niewielkim zrozumieniem ich zwyczajów. Jeśli wojna pójdzie dobrze, to z pewnością pomoże."
 aow_events.26.a: "Być może będziemy mogli ich przyjąć..."
 aow_events.27.t: "Zdrada wyznawców religii [Root.Religion.GetName] w prowincji [Root.GetName]!"
 aow_events.27.d: "Nasza wojna z wyznawcami religii [Root.Religion.GetName] nie uszła uwadze ich miejscowych stronników. W prowincji [Root.GetName] zdrajcy, dla których wiara jest ważniejsza od ojczyzny, wykorzystali okazję, by powstać przeciwko nam. Być może chcą wesprzeć wroga lub zachęcić inne państwa wyznające religię [Root.Religion.GetName] do przyłączenia się do wojny."
 aow_events.27.a: "Wiara wyznacza drogę wszystkim, nawet niegodziwcom."
 aow_events.28.t: "Walka na zewnątrz, konflikt wewnątrz"
 aow_events.28.d: "Zdarza się, że konflikty rozgrywające się na arenie międzynarodowej znajdują odzwierciedlenie w naszych własnych granicach. Dziś dotarły do nas wieści, że wojna z państwami wyznającymi religię [Root.Religion.GetName] wywołała konflikt religijny w prowincji [Root.GetName], gdzie współistnieją wyznawcy religii [Root.Religion.GetName] i [Root.Owner.Religion.GetName]. Ludzie, którzy dotąd byli sąsiadami i przyjaciółmi, teraz atakują się nawzajem z powodu różnic, jakie dostrzegają między nami a naszymi przeciwnikami."
 aow_events.28.a: "Podobnie jak wojna, ten konflikt musi toczyć się własnym biegiem."
 aow_events.28.b: "Zjednoczcie się przeciw prawdziwemu wrogowi! Wszyscy jesteście [Root.Owner.GetAdjective]!"
 aow_events.29.t: "Ojczyzna ponad wiarą"
 aow_events.29.d: "Nasze stosunki z dysydentami religijnymi w prowincji [Root.GetName] bywały różne, lecz przynajmniej część miejscowych wyznawców religii [Root.Religion.GetName] zdaje się doceniać nasze rządy. „Zdaje się” to być może kluczowe określenie, ponieważ niedawno zwrócili się do nas z propozycją wykorzystania swoich więzi religijnych w jednym z państw będących naszymi rywalami, aby wzmocnić naszą międzynarodową siatkę szpiegowską. Jeśli okażą się godni zaufania, mogą stać się rzadkim i niezwykle cennym nabytkiem..."
 aow_events.29.a: "Zaufamy im i uwierzymy, że pozostaną nam wierni."
 aow_events.29.b: "Nie potrzebujemy tak podstępnych metod... ani związanego z nimi ryzyka."
 aow_events.30.t: "Wojownicy wyznający religię [Root.Religion.GetName]"
 aow_events.30.d: "Najbardziej gorliwi wyznawcy religii [Root.Religion.GetName] w prowincji [Root.GetName] od dawna strzegą granicy, podejrzliwie obserwując zamiary niewiernych po drugiej stronie. Teraz ich obawy potwierdziło oficjalne wypowiedzenie wojny. Gotowi oddać życie za sprawę religii [Root.Religion.GetName], miejscowi milicjanci dołączyli do naszych sił w walce z najeźdźczą armią."
 aow_events.30.a: "Naprzód, strażnicy prawdy!"
 aow_events.31.t: "Wcześni reformatorzy"
 aow_events.31.d: "Kiedy wieści o wierze [Root.Religion.GetName] rozprzestrzeniły się na naszą ziemię, byliśmy jednymi z pierwszych, którzy ją zaakceptowali. Wiemy, gdzie leży przyszłość wiary chrześcijańskiej i chociaż ciągnięte siłą mniej oświecone narody poświęcają swój czas, aby się tam dostać, my z dumą maszerujemy w tym kierunku.\n\nNa szczęście nie jesteśmy otoczeni przez głupców ze wszystkich stron. Władcy sąsiedniego kraju wybrali tę samą godną podziwu ścieżkę, uwalniając się ze szponów papieża i kształcąc się w teologii [Root.Religion.GetName]. Kościół [Root.GetName] może posiadać czołowych uczonych, ale wciąż jeszcze wiele może się nauczyć od innych."
 aow_events.31.a: "Razem szerzyć będziemy prawdziwe słowo Boże!"
 aow_events.31.b: "Kościół w prowincji [Root.GetName] pozostaje samotny."
 aow_events.32.t: "Nie wyznaje ani [Root.Religion.GetReligion_gen], ani Katolicyzmu"
 aow_events.32.d: "Kaznodzieje z [Root.Religion.GetReligion_gen] nie są jedynymi, którzy sprzeciwiają się Kościołowi katolickiemu. Uczeni z różnych ruchów kwestionują jego zepsutą doktrynę, być może nie w doskonałej harmonii z naszą własną krytyką, ale mimo to bardzo istotną. Jeden z naszych sąsiednich krajów jest domem dla jednego z takich ruchów. Czy w tych burzliwych czasach naprawdę możemy sobie pozwolić na spory teologiczne, kiedy moglibyśmy współpracować? Może to przynieść nam korzyści, jeśli oni wykażą się taką samą otwartością umysłu."
 aow_events.32.a: "Staniemy z nimi przeciwko papieżowi, jeśli oni staną z nami."
 aow_events.32.b: "Rozpowszechniają kłamstwa, tylko inne kłamstwa."
 aow_events.33.t: "[From.Religion.GetReligionPeop_Cap] wyciągają rękę"
 aow_events.33.d: "Kościół [From.GetAdjective] jest daleki od pełnej zgody z Kościołem [Root.GetAdjective] w wielu kwestiach duchowych, ale w jednej światowej sprawie się zgadzamy: hegemonia papieża i patriarchów nie może być zaakceptowana przez prawdziwych chrześcijan. Dla nich jest to wystarczający powód do współpracy, mimo że oni wyznają [From.Religion.GetName], a my [Root.Religion.GetName]. Co ma pierwszeństwo, rzeczywistość polityczna naszego wspólnego wroga czy doktryna naszego kościoła?"
 aow_events.33.a: "Razem możemy przywrócić chrześcijaństwu to, czym miało być."
 aow_events.33.b: "Ostatnią rzeczą, jakiej potrzebujemy, jest teologiczne zamieszanie w naszych własnych szeregach."
 aow_events.34.t: "[From.Religion.GetReligionPeop_Cap] zaakceptowali"
 aow_events.34.d: "Nasz wspaniałomyślny gest wobec [From.GetAdjective] opłacił się. Pomimo dzielących nas różnic, przywódcy [From.Religion.GetReligion_gen] przyznali, że my, jako awangarda reformacji, powinniśmy spróbować zjednoczyć nasze sprawy dla większego dobra."
 aow_events.34.a: "Pobożni ludzie z [Root.GetAdjective] i [From.GetAdjective] zapamiętają ten dzień."
 aow_events.35.t: "[From.Religion.GetReligionPeop_Cap_gen] odrzucają naszą prośbę"
 aow_events.35.d: "Głupkowato dogmatyczny [From.GetName] jest najwyraźniej zbyt zaciekły w swoich działaniach, by prowadzić dyplomację z tymi, którzy próbują im pomóc. Być może nasze metody [Root.Religion.GetReligion_gen] wydają im się tak samo błędne, jak polityka Stolicy Apostolskiej."
 aow_events.35.a: "Czy nie wiedzą, jak kochać bliźniego jak siebie samego?"
 aow_events.36.t: "Heretycy wkraczają na nasze ziemie"
 aow_events.36.d: "Ciężko pracowaliśmy, by wykorzenić heretyckie zamęty, które zagrażają chrześcijańskiej wierze, tymczasem tuż za naszymi granicami pewne państwo przyjęło te nauki. Być może sądzą, że nie zauważyliśmy, iż pozwolili, by ludzie odrzucający Kościół katolicki nadawali ton życiu w ich stolicy i stamtąd szerzyli swoje kłamstwa. Być może sądzą, że nie dostrzegliśmy, iż również w naszym kraju całe prowincje odwróciły się od prawdziwej wiary. Czyżby?"
 aow_events.36.a: "Nie, doskonale wiemy, co należy uczynić."
 aow_events.36.b: "Możemy przynajmniej udawać, że wiemy."
 aow_events.37.t: "Źródło protestanckiej zarazy"
 aow_events.37.d: "Zazwyczaj motłoch każdego państwa jest jego własnym problemem. Inaczej jest jednak wtedy, gdy inne państwo otwarcie popiera tę samą duchową zgniliznę. Wielu duchownych i dowódców wojskowych dostrzega bezpośredni związek między protestanckimi buntownikami, z którymi dziś walczymy, a poparciem, jakiego nasi sąsiedzi udzielają sprawie protestanckiej. Nie możemy cieszyć się szacunkiem i budzić strachu, jeśli nie skonfrontujemy ich z poparciem — jawnym lub ukrytym — dla heretyków pustoszących ziemie [Root.GetAdjective]."
 aow_events.37.a: "Niech lepiej przygotują sobie odpowiedź!"
 aow_events.37.b: "Nie wywołujmy kolejnych problemów."
 aow_events.38.t: "Źródło kalwińskiej zarazy"
 aow_events.38.d: "Zazwyczaj motłoch każdego państwa jest jego własnym problemem. Inaczej jest jednak wtedy, gdy inne państwo otwarcie popiera tę samą duchową zgniliznę. Wielu duchownych i dowódców wojskowych dostrzega bezpośredni związek między reformowanymi buntownikami, z którymi dziś walczymy, a poparciem, jakiego nasi sąsiedzi udzielają sprawie kalwińskiej. Nie możemy cieszyć się szacunkiem i budzić strachu, jeśli nie skonfrontujemy ich z poparciem — jawnym lub ukrytym — dla heretyków pustoszących ziemie [Root.GetAdjective]."
 aow_events.38.a: "Niech lepiej przygotują sobie odpowiedź!"
 aow_events.38.b: "Nie wywołujmy kolejnych problemów."
 aow_events.39.t: "[From.GetName] konfrontuje nas w sprawie buntowników"
 aow_events.39.d: "Najwyraźniej decyzja rządu [From.GetAdjective] o narzuceniu wiary katolickiej mieszkańcom własnych ziem okazała się błędem z więcej niż jednego powodu. Poddani wyznający [Root.Religion.GetName] zbuntowali się przeciwko swoim władcom, a wielu poszkodowanych obwinia o to nasze poparcie dla prawdziwej wiary.\n\nAmbasador [From.GetName] otwarcie poruszył teraz tę kwestię i dość apodyktycznie zażądał, byśmy wyrzekli się buntowników i ich walki. Choć oczywiście chcielibyśmy, aby wiara [Root.Religion.GetName] szerzyła się dalej, jest to przede wszystkim problem dyplomatyczny, a nie religijny. Jakie zajmiemy stanowisko wobec tych zagranicznych buntowników?"
 aow_events.39.a: "Cuius regio, eius religio. Powinni uszanować wolę swoich władców."
 aow_events.39.b: "Żądamy, abyście zaprzestali uciskania tych biednych poddanych wyznających [Root.Religion.GetName]!"
 aow_events.39.c: "Będziemy otwarcie i z radością wspierać wiernych w walce z wami!"
 aow_events.40.t: "[From.GetName] wyrzeka się buntowników wyznających [From.Religion.GetName]"
 aow_events.40.d: "Niezależnie od problemów, jakie sprawiają nam wyznawcy [From.Religion.GetName] we własnych granicach, możemy pocieszać się faktem, że przywódcy ich religii na arenie międzynarodowej odcinają się od tego buntu. [From.GetName] zapewniło nas, że niezależnie od własnych przekonań uważa powstanie przeciwko naszym rządom za niedopuszczalne."
 aow_events.40.a: "Miejmy nadzieję, że to nie są tylko dwulicowe zapewnienia."
 aow_events.41.t: "[From.GetName] broni buntowników wyznających [From.Religion.GetName]"
 aow_events.41.d: "Najwyraźniej wyznawcy [From.Religion.GetName] w [From.GetName] są bardziej zuchwali, niż przypuszczaliśmy. Gdy zwróciliśmy im uwagę, że ich bracia i siostry w wierze wszczynają zamieszki na naszych ulicach, odpowiedzieli, że sami jesteśmy sobie winni, ponieważ nie szanujemy ich heretyckich przekonań."
 aow_events.41.a: "Skoro tak postrzegają sprawę, trudno oczekiwać, by zachowali nasz szacunek."
 aow_events.42.t: "[From.GetName] finansuje buntowników wyznających [From.Religion.GetName]!"
 aow_events.42.d: "Nasze próby skłonienia [From.GetName] do wzięcia odpowiedzialności za szerzoną przez nich herezję najwyraźniej przyniosły odwrotny skutek. Nie tylko poparli ruch buntowniczy wymierzony w religię państwową, lecz także otwarcie podburzają ludność do kolejnych zamieszek, dodając heretykom odwagi. Każda kropla katolickiej krwi przelana na naszej ziemi przez tych szaleńców obciąża teraz ich sumienie."
 aow_events.42.a: "Nie ma rozgrzeszenia dla tych, którzy trwają w grzechu."
 aow_events.43.t: "Kardynał za granicą"
 aow_events.43.d: "Czasami możemy zapoczątkować pewne wydarzenia, nie zdradzając przy tym naszego udziału. Niedawno nadarzyła się ku temu okazja: kardynał przebywający w prowincji [send_cardinal_province.GetName] wyznał agentowi z [Root.GetName], że za odpowiednią opłatą rozważy przeniesienie się przez granicę do [receive_cardinal_province.GetName] i wspieranie nas w Kurii. Oferta jest kusząca, lecz jej przyjęcie może mieć wysoką cenę — gniew [send_cardinal_province.Owner.GetUsableName], państwa, które kardynał miałby opuścić."
 aow_events.43.a: "Zaryzykujemy. Może nigdy się nie dowiedzą."
 aow_events.43.b: "Ryzyko jest zbyt duże, ale człowiek, który go odnalazł, zasługuje na awans."
 aow_events.44.t: "Kardynał przekupiony, by się przenieść"
 aow_events.44.d: "Kardynał, który wcześniej przebywał w panstwie [Root.GetName], blisko granicy, teraz całkowicie opuścił nasz kraj i przeniósł się do naszych sąsiadów. Agenci [From.GetAdjective], którzy przekupili go, by nas zdradził, prawdopodobnie myśleli, że nie zauważymy ich ręki w tej sprawie, ale się mylili. To celowe sabotowanie naszych wpływów w Kurii jest niedopuszczalne i nie pozostanie bez odzewu."
 aow_events.44.a: "To zniewaga zarówno dla nas, jak i dla naszego Kościoła."
 aow_events.45.t: "Wątpliwości co do wiary"
 aow_events.45.d: "Kardynał w [Root.GetName] żył w bliskim sąsiedztwie heretyków w naszym kraju i zamiast ich potępiać, próbował ich zrozumieć. Choć samo podejście można uznać za pełne współczucia, niedawno zwierzył się jednemu z naszych ministrów, że sam zaczął wątpić w nauki Kościoła. Gdyby papież się o tym dowiedział, kardynał nie mógłby już służyć w Kurii. Być może jednak uda nam się skłonić go do zachowania milczenia za kilka dukatów."
 aow_events.45.a: "Wiary nie da się kupić, ale milczenie owszem."
 aow_events.45.a.tt: "papież odkrywa nasze działania."
 aow_events.45.b: "To przykre, lecz człowiek targany wątpliwościami nie nadaje się na to stanowisko."
 aow_events.46.t: "Papież odkrywa podstęp"
 aow_events.46.d: "Kardynał, któremu zapłaciliśmy za milczenie o jego wątpliwościach dotyczących nauk Kościoła, niestety nadal wierzył w konieczność wyznawania grzechów. Co gorsza, sposób, w jaki wyznał je papieżowi, nie zapewnił mu przebaczenia — być może dlatego, że wcale nie żałuje swoich wątpliwości. Żałuje natomiast przyjęcia naszej łapówki. O wszystkim dowiedział się Ojciec Święty, który jest niezadowolony zarówno z nas, jak i z byłego już kardynała."
 aow_events.46.a: "Czy jest już za późno, byśmy i my poprosili o przebaczenie?"
 aow_events.47.t: "Kardynał nie ufa poganom"
 aow_events.47.d: "Kardynał w [Root.GetName] dotąd pozostawał lojalny wobec [Root.Owner.GetName], lecz widok pogan mieszkających tak blisko jego rodzinnego miasta, [Root.GetCapitalName], wzbudził w nim wątpliwości co do dalszego pobytu w tym kraju. W liście do [Root.Owner.Monarch.GetTitle] stwierdził, że tym ludziom nie można ufać, i zażądał objęcia ich znacznie surowszymi przepisami niż pozostałych mieszkańców."
 aow_events.47.a: "Jeśli nie możemy oceniać czyjegoś charakteru na podstawie wiary, to na jakiej podstawie?"
 aow_events.47.b: "Nie zamierzamy ograniczać ich praw z powodu opinii jednego człowieka."
 aow_events.48.t: "Kontakty w Stolicy Apostolskiej"
 aow_events.48.d: "$THEOLOGIAN$$INQUISITOR$, będąc mądrym i szanowanym katolikiem, utrzymuje dobre relacje z kardynałami i innymi ludźmi w Kościele nawet poza granicami [Root.GetAdjective]. Niedawno odkryli, że człowiek, który właśnie został awansowany na kardynała, który jest również ich dobrym przyjacielem, rozważa przeprowadzkę do naszego kraju, aby ułatwić ich wspólną pracę nad tekstem teologicznym. Gdybyśmy wspomogli ten proces, mielibyśmy w Kurii kardynała, który jest lojalny nie tylko wobec dla naszego doradcy, ale także wobec [Root.Monarch.GetRulerGen]."
 aow_events.48.a: "Zrobimy wszystko, co w naszej mocy, by mu pomóc."
 aow_events.48.b: "Nasza administracja ma inne priorytety niż nepotyzm."
 aow_events.49.t: "Kardynał minister"
 aow_events.49.d: "Jeden z kardynałów z [Root.GetAdjective] okazał się być wykwalifikowanym administratorem, dzięki czemu nasz[Root.Monarch.GetANoun] [Root.Monarch.GetTitle] otrzymuje od niego mnóstwo rad. W tym momencie uczynienie go ministrem w naszym rządzie byłoby jedynie formalnością, ale mimo wszystko ważną formalnością, ponieważ może on zyskać jeszcze większe wpływy. Posiadanie kardynała w rządzie z pewnością uwiarygodniłoby nas w oczach papieża i wzmocniło przekonanie, że [Root.GetName] to przede wszystkim państwo katolickie."
 aow_events.49.a: "Do tej pory nam pomagał, więc miejmy formalności za sobą."
 aow_events.49.b: "[Root.Monarch.GetName] nie potrzebuje jego rady, by rządzić państwem [Root.GetName]."
 aow_events.50.t: "Polityka kardynała oburza szlachtę"
 aow_events.50.d: "Odkąd powołaliśmy jednego z kardynałów na stanowisko ministra naszego rządu, znacznie wykracza on poza doradztwo teologiczne i wprowadza istotne innowacje w administracji państwa [Root.GetName]. Niestety jego propozycje centralizacji władzy wymagają odebrania części uprawnień szlachcie, która zaczęła postrzegać go jako karierowicza. Usunięcie go ze stanowiska z powodu tego sporu prawdopodobnie oznaczałoby całkowitą utratę jego lojalności, lecz dla szlachty, która miałaby stracić na jego planach, jest to poświęcenie warte poniesienia."
 aow_events.50.a: "Minister wskazuje nam drogę ku przyszłości."
 aow_events.50.b: "Przekroczył swoje uprawnienia i należy go odwołać."
 aow_events.51.t: "Grzechy kardynała"
 aow_events.51.d: "Podczas szpiegowania jednego z sąsiednich państw nasi agenci śledzili wpływowego człowieka — kardynała — i odkryli, że choć jego lojalność wydaje się niezłomna, jego moralność jest zepsuta w stopniu niewyobrażalnym dla Kościoła. Szczegóły jego występków nie mają dla nas znaczenia, lecz mogą zainteresować papieża i dać nam sposobność do osłabienia wpływów naszego sąsiada w Kurii. Z drugiej strony, posiadanie haka na człowieka tak wysokiej rangi może okazać się przydatne w wielu sytuacjach."
 aow_events.51.a: "Stolica Apostolska musi zostać poinformowana o jego czynach."
 aow_events.51.b: "Możemy wykorzystać te informacje do szantażu i rozbudowy naszej siatki szpiegowskiej."
 aow_events.52.t: "Kardynał zdemaskowany"
 aow_events.52.d: "O kardynale z prowincji [Root.GetName] krążyły plotki, że ma słaby charakter, ale zawsze był na tyle dyskretny, że nie uzasadniało to dalszego dochodzenia. Teraz okazuje się, że zagraniczni szpiedzy z [From.GetAdjective], którzy mieli na niego oko, położyli temu kres i ujawnili jego grzechy papieżowi. Jego dni jako kardynała są policzone, a nasza władza w Kurii zostanie osłabiona z powodu tej przedwczesnej interwencji [From.GetAdjective]."
 aow_events.52.a: "Co za podstępny sposób na odebranie nam wpływów."
 west_african.1.t: "Sułtanat [Root.GetName]"
 west_african.1.d: "Nasz lud przeszedł długą drogę od swoich początków. Tam, gdzie niegdyś istniało wiele plemion, każde z własnymi zwyczajami i przywódcami, dziś mieszkańcy całego [Root.GetName] uznają [Root.Monarch.GetName] za swego władcę. Wielu przypuszcza, że [Root.Monarch.GetSheHe] wkrótce ogłosi [Root.Monarch.GetHerselfHimself] sułtanem, lecz może to wywołać sprzeciw, jeśli tytuł nada [Root.Monarch.GetHerHim] kalif.\n\nDotarły do nas wieści, że siedziba osmańskiego kalifatu znajduje się w odległym Stambule, a tamtejszy władca może zgodzić się na audiencję. Być może błogosławieństwo kalifa zapewni sułtanatowi [Root.GetName] poparcie wiernych mieszkańców naszego kraju."
 west_african.1.a: "Wyruszmy do tej odległej krainy i poprośmy o ich wsparcie!"
 west_african.1.b: "Nie potrzebujemy ich zgody, by sprawować władzę!"
 west_african.2.t: "Sułtan w [From.GetName]"
 west_african.2.d: "Przybył wysłannik z ziem [From.GetName], prosząc [Root.Monarch.GetName] o wsparcie w [Root.Monarch.GetHerHis] roli kalifa dla utworzenia nowego sułtanatu. Dowiadujemy się, że lud [From.GetAdjective], niegdyś podzielony na liczne plemiona, jest teraz pobożnie muzułmański i oddany swemu władcy, [From.Monarch.GetName], który pragnie z naszym poparciem przyjąć tytuł sułtana."
 west_african.2.a: "Szlachetny cel. Powstanie nowego sułtanatu jest również dla nas błogosławieństwem."
 west_african.2.b: "Jeśli chcesz zostać Sułtanem, musisz przekonać ludzi do siebie."
 west_african.3.t: "Kalif aprobuje powstanie sułtanatu"
 west_african.3.d: "Emisariusz wrócił z Istambułu przynosząc wieści o tym, jak przywódca muzułmańskiego świata ustanowił [Root.Monarch.GetName] Sułtanem [Root.GetName]. To, co w przeciwnym razie mogło przerodzić się w gwałtowną walkę o władzę i wstrząsy polityczne, zyska teraz poparcie większości, a może wszystkich, mądrych i wiernych spośród [Root.GetAdjective] ludu."
 west_african.3.a: "Tylko niewierni nam się sprzeciwią."
 west_african.4.t: "Kalif potępia Sułtanat"
 west_african.4.d: "Emisariusz wrócił ze Stambułu, ale pomimo naszych usilnych starań kalif nie przyznał nam tytułu. Według [From.Monarch.GetHerHim], to od nas zależy przekonanie ludzi, że [Root.Monarch.GetName] potrafi sprawować władzę jako sułtan."
 west_african.4.a: "Kalif wykazujący się tak kiepskim osądem nie jest godzien tego tytułu."
 west_african.5.t: "Ludzie Pustyni"
 west_african.5.d: "Lud [Root.Owner.GetAdjective] od dawna żyje w tym suchym klimacie. Niektóre nierozumne państwa lekceważą nas, uznając, że zamieszkujemy ziemie, których inni nie chcieli, lecz opanowaliśmy sztukę przetrwania i walki, której powinny się obawiać.\n\nTuż za granicą, w [Root.GetName], nasi pobratymcy cierpią pod jarzmem obcych ludzi. Ich ciemięzcy mogą nie zdawać sobie sprawy, do czego zdolni są przedstawiciele kultury [Root.Culture.GetName], gdy ktoś ich lekceważy. Z pomocą miejscowych moglibyśmy zorganizować najazd na ziemie oprawców, uderzyć szybko i wykorzystać fakt, że znamy tamtejszą pustynię lepiej niż ktokolwiek inny."
 west_african.5.a: "Przybędziemy i wycofamy się niczym burza piaskowa."
 west_african.5.b: "Nie napadniemy w ten sposób na sąsiadów, bez względu na to, kim są ich poddani."
 west_african.6.t: "Pustynni Jeźdźcy"
 west_african.6.d: "Niektórzy przedstawiciele elity [Root.Culture.GetName] zostali niedawno zaatakowani przez oddział, który — jak sądzą — zorganizowało obce wojsko. Początkowo wydawało się, że do napaści doszło zbyt głęboko na naszym terytorium, by mogła być dziełem obcych, lecz stopniowo wyłania się wyjaśnienie. Wygląda na to, że [From.Culture.GetName] z jednej z naszych prowincji przygranicznych, których uważaliśmy za lojalnych poddanych, spiskowali z naszymi sąsiadami i pomogli zorganizować atak.\n\nChoć odwet w podobny sposób może nie być możliwy, istnieją inne metody, by pokazać, co sądzimy o tak tchórzliwych zagrywkach."
 west_african.6.a: "Prędzej czy później za to zapłacą."
 west_african.7.t: "Bezpieczniejsza Granica"
 west_african.7.d: "Minęło wiele czasu, lecz nie zapomnieliśmy, że [Root.GetName] posłużyło niegdyś jako punkt wypadowy do zuchwałego najazdu i złupienia naszego kraju. Wielu uważa, że zagrożenie wciąż jest realne, i domaga się, by [Root.Owner.Monarch.GetTitle] podjął działania: wzmocnił kontrolę nad granicą i zagwarantował, że pustynni rabusie nigdy więcej jej nie przekroczą."
 west_african.7.a: "Natychmiast wyślemy niezbędne wojsko."
 west_african.7.b: "[Root.Owner.Monarch.GetTitle] osobiście uda się patrolować granicę [Root.Owner.Monarch.GetHerselfHimself]!"
 west_african.7.c: "Z pewnością można zorganizować jakąś lokalną inicjatywę."
 west_african.8.t: "Pustkowie dla jednych, dom dla innych"
 west_african.8.d: "Lud [Root.Culture.GetName] zawsze wykazywał się zaradnością i zdolnością przystosowania, które inni uznaliby za niemożliwe. Ziemie, na których inni nie potrafiliby żyć ani nawet podróżować, są naszym domem, drogami i domeną. Możemy dobrze to wykorzystać, również w handlu. Jedna z naszych głównych tras handlowych przebiega tuż obok takiego obszaru i już od pewnego czasu dyskutujemy, jak najlepiej spożytkować tę sposobność."
 west_african.8.a: "Możemy skierować nasze karawany szlakami, które znamy tylko my."
 west_african.8.b: "Można wykorzystać ten teren jako bazę wypadową do ataku na szlak handlowy."
 west_african.9.t: "Bałwochwalstwo czy Cześć?"
 west_african.9.d: "Nasze wysiłki ocalenia pogan w [Root.GetName] wydały owoc, lecz jest to owoc dziwny i nieznany. Lokalna społeczność zaczęła akceptować Chrystusa, lecz wiara ta została spleciona ze starymi odłamami. Aniołowie i dusze, prawdziwy Pan i Pan Nieba, Błogosławiona Dziewica i Bogini Ziemi... czy ci ludzie naprawdę wierzą w to, co usłyszą, czy po prostu nazywają swoich dawnych bogów innymi imionami? Miejscowy misjonarz, zmartwiony duszami ludu [Root.Owner.GetAdjective], a także własną, zwrócił się do nas z prośbą o radę."
 west_african.9.a: "Ich wiara jest czysta, a odrzucenie jej byłoby głupotą."
 west_african.9.b: "To jest gorsze niż herezja. Musi zostać wyplewione."
 west_african.10.t: "Bóg Nieba"
 west_african.10.d: "Ufamy duchom, bogom, którzy zawsze byli z nami, a nasi ludzie rzadko są pod wrażeniem kłamstw tych, którzy nas od nich wyprowadzą. Jednak niektórzy ludzie na naszej granicy, którzy mieli kontakt z tymi, którzy czczą jednego, który, jak twierdzą, powrócił z martwych, wydają się widzieć podobieństwa między swoją wiarą a naszą. Tak jak wielu tutaj decyduje się czcić Ojca Nieba, nasi sąsiedzi mówią o tym, który nazywa Chrystus, że ma samego Ojca Niebieskiego. Wielu zaczęło sugerować, że ci dwaj mogą być jednym i tym samym, a wrogość między naszymi wiarami jest niczym innym jak nieporozumieniem."
 west_african.10.a: "To jest kolejne, proste kłamstwo, które oni roznoszą, aby zwalczyć naszą wiarę."
 west_african.10.b: "Wiele innych rzeczy nazywamy inaczej, więc dlaczego nie mielibyśmy inaczej nazywać bogów?"
 west_african.11.t: "Tradycja czy haram?"
 west_african.11.d: "Głoszenie słowa Proroka mieszkańcom [Root.GetName] nie było niemożliwe, lecz dotychczasowe rezultaty niepokoją część naszych uczonych religijnych. Choć porzucili wiele pogańskich tradycji, nadal oddają cześć przodkom, a praktyka ta budzi niepokojące skojarzenia z kultem. Nie widzimy nic złego w szanowaniu rodziny, lecz czy może wyniknąć coś dobrego z modlitw kierowanych do zmarłych zamiast do Boga? Są to jednak pradawne obyczaje. Ich odrzucenie może zniechęcić wielu ludzi, którzy w przeciwnym razie by nas wysłuchali."
 west_african.11.a: "Będziemy szanować ich praktyki tak samo jak nasze."
 west_african.11.b: "Nie ma innych bogów niż Bóg. Jeśli się tego nie nauczą, nic nie osiągniemy."
 west_african.12.t: "Wiele duchów, jeden Bóg"
 west_african.12.d: "Od dawna znamy wiarę muzułmańską, lecz pozostaliśmy wierni własnym tradycjom. Ci, którzy poświęcają się wyłącznie odległemu Stwórcy, porzucając bogów i duchy zamieszkujące pośród nas, z pewnością kroczą ku nieszczęściu.\n\nMieszkańcy pogranicza, żyjący na co dzień obok muzułmanów, zaczęli jednak patrzeć na tę sprawę inaczej. Odkrywają, że słowa Mahometa przemawiają do nich równie mocno jak do ich sąsiadów. Zamiast uznawać to za zdradę dawnych obyczajów, utożsamiają Boga Proroka z naszym najbardziej czczonym bóstwem niebios."
 west_african.12.a: "Zapominacie o przodkach, modląc się do niebios. To niedopuszczalne."
 west_african.12.b: "Być może, jeśli zaakceptujemy ich jedynego Boga, oni uznają naszych wielu bogów."
 west_african.13.t: "Zero kompromisów w kwestii wiary"
 west_african.13.d: "Mimo, że wielu naszych obywateli jeszcze nie jest czcicielami wiary [Root.Religion.GetName], musimy pozostać cierpliwi i pełni nadziei. Inni nie są tak cierpliwi. Wielu naszych obywateli uważa za absurd fakt, iż [Root.Monarch.GetTitle], rządzący z bożej łaski, akceptuje rozpowszechnianie pogaństwa w naszym kraju. To z kolei wywołało zaniepokojenie wśród tych samych pogan, że są oni poddani zewnętrznie narzuconemu systemowi przekonań, a niektórzy z nich wzywają do obalenia [Root.Monarch.GetTitle], jeśli [Root.Monarch.GetSheHe] zrobi to nie okazujcie czci praktykom duchowym, które żyły z ludźmi tutaj przez tysiące lat."
 west_african.13.a: "Wierzący mają rację. Nie będziemy tolerować bezbożności."
 west_african.13.b: "Animiści pomimo, że są wprowadzani w błąd, muszą być uznawani za obywateli."
 west_african.13.c: "Pozwólmy im rozwiązać sprawę między sobą."
 west_african.13.e: "Wciąż jest czas na pojednanie."
 west_african.14.t: "Uczeni wyznający [Root.Religion.GetName]"
 west_african.14.d: "Choć jesteśmy odcięci od wielu współwyznawców, nie porzuciliśmy islamskiej nauki. $THEOLOGIAN$ jest tylko jednym z wielu uczonych, którzy napisali wielkie dzieła na ten temat, inspirując swoją pracą niezliczonych naśladowców. Dzięki naszemu oddaniu wierze [Root.Religion.GetName] dzieła teologiczne powstające w [Root.Capital.GetCapitalName] uczyniły to miasto sławnym."
 west_african.14.a: "Niech na zawsze pozostanie ono ostoją mądrości."
 west_african.15.t: "Flora [Root.GetName]"
 west_african.15.d: "Uczeni i badacze spośród ludu [Root.GetAdjective] wyróżniają się niezwykłą innowacyjnością i ciekawością świata. Ostatnio skupili się na gromadzeniu informacji o roślinności rozległych obszarów dżungli naszego kraju, licząc na zdobycie wiedzy przydatnej w badaniach nad medycyną i technikami barwienia. Dotychczasowe wysiłki przyniosły sukces, a projekt botaniczny pobudził rozwój również innych dziedzin nauki."
 west_african.15.a: "Jeszcze dużo zostało do odkrycia."
 west_african.16.t: "Broń od naszych sąsiadów"
 west_african.16.d: "Nie wątpimy w siłę i wytrzymałość naszych wojowników [Root.GetAdjective], lecz nie umknęły nam technologiczne postępy armii sąsiednich państw. Wprowadzenie broni palnej znacząco zmienia sposób prowadzenia wojny i dostrzegamy w niej wyraźne korzyści.\n\nNasi sąsiedzi raczej nie przekażą nam wszystkich szczegółów technicznych potrzebnych do pełnego wyposażenia armii, wydają się jednak gotowi sprzedać nam część swojej broni. Choć w wymianie handlowej zapewne zyskaliby na tym przewagę, zakup niewątpliwie przysłużyłby się naszym siłom zbrojnym."
 west_african.16.a: "Musimy zdobyć to wyposażenie za wszelką cenę."
 west_african.16.b: "Nasza armia spełnia swoje zadanie, zarówno z tą bronią, jak i bez niej."
 west_african.17.t: "Transatlantycki handel niewolnikami"
 west_african.17.d: "[Root.GetName] nie jest jedynym krajem utrzymującym niewolników — w tej części świata jeńcy wojenni często kończą właśnie w ten sposób. Nasi europejscy sąsiedzi ostatnio szczególnie interesują się tym procederem. Najwyraźniej rozpaczliwie potrzebują służby do pracy na nowych ziemiach, które zajęli za oceanem. W tym celu próbują zawrzeć z nami długoterminową umowę handlową, która ułatwi im zakup niewolników.\n\nMoglibyśmy na tym zarobić, lecz konsekwencje budzą pewne obawy. Europejczycy najwyraźniej uznają naszych ludzi, a przynajmniej jeńców, za odpowiedni materiał na niewolników i traktują ich z nieograniczonym okrucieństwem. Nie chcemy przyzwalać na takie praktyki, ale nie wiadomo, do czego posuną się, jeśli odmówimy."
 west_african.17.a: "Jeśli tylko zdołamy, nie sprzedamy tym ludziom ani jednego niewolnika."
 west_african.17.b: "Jeśli stać ich na zapłatę, możemy dostarczyć towar."
 west_african.17.c: "Nadszedł czas, by położyć kres niewolnictwu — zarówno u nas, jak i u nich."
 west_african.18.t: "Dawni koczownicy"
 west_african.18.d: "Lud [Root.Culture.GetName] z [Root.GetName] tradycyjnie prowadził, przynajmniej częściowo, koczowniczy tryb życia. Nasze wysiłki na rzecz centralizacji sprawiły, że jest to coraz trudniejsze, lecz mieszkańcy przywykli do dawnych zwyczajów i oczekują, że nie będziemy w nie ingerować. Utrudnia to jednak zarządzanie państwem [Root.Owner.GetName]. Niektórzy doradcy [Root.Owner.Monarch.GetTitle] sugerują, byśmy przejęli kontrolę i ograniczyli swobodę przemieszczania się tych ludzi, lecz mogłoby to zostać odebrane jako podeptanie stylu życia, który zapewnił im dotychczasowy sukces."
 west_african.18.a: "Pozwólmy im żyć tak jak dotychczas."
 west_african.18.b: "[Root.GetName] i tak jest już wystarczająco niesforne."
 west_african.19.t: "Aszanti"
 west_african.19.d: "Lud Akan zamieszkuje Kumasi i okoliczne ziemie od dawna, choć dotąd nie uznawaliśmy go za odrębne państwo. Jego plemię ma jednak tak duże znaczenie dla naszych obecnych spraw, że musimy prowadzić z nim handel i dyplomację. Charakter państwa Akan może się jeszcze zmienić, lecz nie możemy podważać jego istnienia."
 west_african.19.a: "Kto wie, może pewnego dnia wyrosną na potęgę równą imperium."
 west_african.20.t: "Złoty Stolec (Sika 'dwa)"
 west_african.20.d: "Aszanti od pewnego czasu sąsiadują z jedną z naszych kolonii i dotąd nie dochodziło między nami do poważniejszych incydentów dyplomatycznych. Wszystko zmieniło się niedawno, gdy nasz gubernator $COLONIAL_GOVERNOR$, przedstawiciel na Złotym Wybrzeżu, usłyszał o Złotym Tronie. Ten tajemniczy, starożytny artefakt ma podobno ogromne znaczenie dla Aszanti — jest bowiem siedzibą ich króla. Choć wcześniej pobieżnie wiedzieliśmy o jego istnieniu, dopiero niedawno dowiedział się o nim $COLONIAL_GOVERNOR$. Gubernator zażądał, by pozwolono mu na nim zasiąść, co miałoby dowieść jego, a tym samym naszej, nadrzędnej władzy w regionie.\n\n„Dlaczego w tej chwili nie siedzę na Złotym Tronie?” — zapytał Aszanti. Jak dotąd nie wykazali oni najmniejszej chęci spełnienia jego żądania. Co więcej, sama sugestia najwyraźniej głęboko ich obraziła. Jak daleko powinniśmy się posunąć, by dopiąć swego?"
 west_african.20.a: "Tak daleko, jak będzie trzeba!"
 west_african.20.a.tt: "Aszanti mogą nie przyjąć tego życzliwie."
 west_african.20.b: "Nie potrzebujemy człowieka, który musi uciekać się do takich metod, by zamanifestować swoją dominację."
 west_african.21.t: "Wojna o Złoty Stolec"
 west_african.21.d: "Złoty Tron jest symbolem władzy króla Aszanti i nikomu nie wolno go bezcześcić. Tymczasem [From.GetAdjective], po których spodziewaliśmy się choć odrobiny szacunku dla naszych tradycji, mimo że sami się nimi nie interesują, przysłali tu gubernatora żądającego, by zasiadł na Tronie, jak gdyby sam był królem. Oburzyło to Królową Matkę i wielu innych. Domagają się oni powstrzymania tego człowieka i ochrony świętości Złotego Tronu, nawet jeśli miałoby to oznaczać wojnę."
 west_african.21.a: "Jeśli [From.GetName] powierza reprezentowanie siebie takiemu głupcowi, wojna jest nieunikniona."
 west_african.21.b: "Tradycje nie są warte rozpoczynania wojny."
 west_african.22.t: "Samorządność dla ludu [Root.Culture.GetName]"
 west_african.22.d: "Wierzymy, że lud [Root.Owner.Culture.GetName] sprawiedliwie rządzi państwem [Root.Owner.GetName]. [Root.Owner.Monarch.GetName] uczciwie traktuje różne plemiona podlegające naszej władzy, lecz niektórym z [Root.Owner.Monarch.GetHerHis] poddanych to nie wystarcza. Lud [Root.Culture.GetName] wysłał przedstawiciela z [Root.GetName] z prośbą o większe prawa do samodzielnego decydowania o sprawach własnych plemion, jeśli mają nadal pozostawać pod panowaniem [Root.Owner.Monarch.GetTitle]. Prośba wydaje się skromna, lecz wieści o niezadowoleniu w ich rodzimych prowincjach sprawiają, że brzmi raczej jak żądanie."
 west_african.22.a: "Plemiona najlepiej rządzą się same."
 west_african.22.b: "Nie ulegamy żądaniom, nawet jeśli są zawoalowane."
 west_african.23.t: "Rajdy przez dżunglę"
 west_african.23.d: "Odkąd przyjęliśmy kawalerię, konni wojownicy [Root.GetName] budzą postrach dzięki niezwykłej zdolności do przeprowadzania szybkich ataków daleko na terytorium wroga, łupienia go i osłabiania jego obrony. Grupa żołnierzy przygotowała plan wsparcia trwającej wojny, oparty na tej taktyce. Zamierzają odłączyć się od głównej armii i przeprowadzić tajny atak, zanim wróg zdąży zareagować. Plan jest ryzykowny, lecz może przynieść bardzo potrzebne środki na prowadzenie wojny."
 west_african.23.a: "Potrzebujemy więcej takich planów!"
 west_african.23.b: "Przyprowadźcie do mnie pomysłodawców. Niech pomogą nam realizować większe przedsięwzięcia."
 west_african.24.t: "W nieznane"
 west_african.24.d: "Nieznane tereny w dżungli na naszych granicach i poza nimi mogą wydawać się groźne dla wielu innych ludów. Nasze plemię od dawna żyje jednak na podobnych ziemiach i nigdy nie rozkwitłoby, gdybyśmy bali się odkrywać nieznane. Teraz liczna grupa młodych myśliwych prosi [Root.Monarch.GetTitle] o zgodę na wyprawę i osiedlenie się w dowolnym miejscu, które odkryją. To niewątpliwie zdolni ludzie, którzy mogliby wiele osiągnąć, gdyby nie tracili czasu na marzenia o nieznanych krainach. Lecz kim jesteśmy, by tłumić młodzieńczą ciekawość?"
 west_african.24.a: "Idźcie i zagarnijcie dla [Root.GetName] wszystko, co odkryjecie!"
 west_african.24.b: "Jesteśmy [Root.Monarch.GetTitle], a oni są potrzebni tutaj."
 west_african.25.t: "Nowe barwniki"
 west_african.25.d: "Nasze badania nad roślinnością [Root.GetName] wciąż przynoszą nowe odkrycia. Ostatnio opracowaliśmy nową metodę wytwarzania barwników, która jest wydajna i pozwala uzyskać imponujące kolory, jakich nie spotkaliśmy nigdzie indziej. Ponieważ barwniki należą do ważnych towarów eksportowych [Root.GetAdjective], zadbamy o szybkie rozpowszechnienie tych cennych technik w całym kraju."
 west_african.25.a: "Nie możemy się doczekać, by je wypróbować!"
 west_african.26.t: "Duchy wciąż są z nami"
 west_african.26.d: "Wiele obcych religii próbowało zapuścić wśród nas korzenie, a liczni misjonarze usiłowali nawrócić nas na wiarę w Boga — zawsze jedynego, zawsze tego samego, zawsze innego, zawsze ich własnego. Mimo trudnych czasów, które przeszliśmy, nadal oddajemy cześć duchom i naszym przodkom. Starszyzna oznajmiła teraz, że nadszedł czas na większe obchody tych pradawnych obrzędów i że należy zachęcić do udziału mieszkańców całego [Root.GetName].\n\nTuż za granicą mieszkają ludzie, którzy chcieliby nas nawrócić, więc takie ogólnokrajowe święto prawdopodobnie rozdrażni tych, którzy uważają się za lepszych od nas. Nasi dyplomaci sugerują, by ograniczyć obchody do mniejszej skali i nie obrażać sąsiadów."
 west_african.26.a: "Nasi przodkowie nie kryli się ze wstydu i my również nie będziemy!"
 west_african.26.b: "Nie możemy sobie pozwolić na gniew tych, którzy zapomnieli prawdy."
 west_african.27.t: "Nieśmiertelny [Root.Monarch.GetTitle]"
 west_african.27.d: "[Root.GetName] jest krajem pełnym utalentowanych rzemieślników i artystów. Od [Root.Monarch.GetTitle] często oczekuje się zamówienia dzieła sztuki upamiętniającego [Root.Monarch.GetHerHis] poprzednika. Tradycja ta pomaga zachować pamięć o przodkach, a zarazem ukazuje bogactwo i wpływy obecnego władcy.\n\nDostępnych jest wiele materiałów, choć tradycyjnie wybiera się brąz. Powinniśmy zdecydować się na coś odpowiedniego dla majestatu poprzedniego [Root.Monarch.GetTitle], a zarazem przystępnego cenowo dla [Root.Monarch.GetName]."
 west_african.27.a: "Nasi rzeźbiarze potrafią czynić cuda z terakoty."
 west_african.27.b: "Dzieło z brązu przystoi [Root.Monarch.GetTitle]."
 west_african.27.c: "Jeśli zdobędziemy potrzebną kość słoniową, powstanie dzieło na wieki."
 west_african.27.e: "Nie zadowolimy się niczym innym niż złotem."
 west_african.27.f: "Nie stać nas na takie fanaberie."
 west_african.28.t: "Broń palna ludu [Root.Culture.GetName]"
 west_african.28.d: "Nasze wysiłki na rzecz przyswojenia niektórych europejskich technologii zostały nieco zahamowane przez trwającą wojnę, lecz wykorzystanie nowej broni na polu bitwy przyniosło pozytywne skutki. Nasi żołnierze okazali się bardzo biegli w posługiwaniu się bronią palną, a nawet ci członkowie armii, którzy sceptycznie podchodzili do naszych starań, teraz patrzą na nie znacznie przychylniej. Wciąż daleko nam do pełnego uzbrojenia żołnierzy w broń palną, ale poczyniliśmy na tej drodze znaczące postępy."
 west_african.28.a: "Wojownicy [Root.GetAdjective] już dziś budzą postrach. Jutro będą niepowstrzymani."
 GEO_ideas: "Gruzińskie idee"
 GEO_ideas_start: "Gruzińskie tradycje"
 GEO_ideas_bonus: "Gruzińska ambicja"
 bagrationi_dynasty: "Dynastia Bagrationich"
 bagrationi_dynasty_desc: "Dynastia tak stara, że jej początki giną w mrokach dziejów. Królowie i królowe z rodu Bagrationich władają Gruzją nieprzerwanie od IX wieku — najpierw jako książęta, a później jako monarchowie."
 georgian_isolation: "Gruzińska izolacja"
 georgian_isolation_desc: "Otoczeni przez potężne państwa o odmiennych religiach i kulturach, musimy prowadzić oportunistyczną politykę zagraniczną i często zmieniać sojusze, by zjednywać sobie sąsiadów oraz jak najdłużej zachować pokój."
 restoration_of_fortresses_and_churches: "Odbudowa twierdz i kościołów"
 restoration_of_fortresses_and_churches_desc: "Aby podźwignąć państwo po wyniszczających najazdach ostatnich stuleci, musimy odbudować najważniejsze twierdze i kościoły. Dzięki temu nasze miasta i wsie będą mogły ponownie rozkwitnąć. Na sfinansowanie tych przedsięwzięć nałożono specjalny podatek."
 georgian_protectorates: "Gruzińskie państwa lenne"
 georgian_protectorates_desc: "Przed przybyciem Mongołów, w okresie swojej świetności, Gruzja sprawowała zwierzchnictwo nad wieloma państwami zależnymi. Otoczeni ludami o odmiennych kulturach i religiach, możemy łatwiej poszerzać nasze wpływy, tworząc państwa podległe, zamiast bezpośrednio wcielać nowe ziemie do królestwa."
 samouravo_counties: "Reforma samouravo"
 samouravo_counties_desc: "Dzięki reformie administracyjnej, która dzieli rozległe, autonomiczne saeristavo (księstwa) na mniejsze i łatwiejsze w zarządzaniu samouravo (hrabstwa), nasze państwo stanie się łatwiejsze do administrowania, stabilniejsze i wierniejsze koronie."
 sadrosho_districts: "Okręgi sadrosho"
 sadrosho_districts_desc: "Sadrosho (chorągwie) to specjalne okręgi wojskowe służące do mobilizacji sił zbrojnych. Świeccy możnowładcy okazali się krnąbrni i niegodni zaufania w zarządzaniu nimi, dlatego przekażemy tę władzę duchownym dostojnikom, takim jak miejscowi biskupi."
 georgian_embassies: "Gruzińskie ambasady"
 georgian_embassies_desc: "Otaczają nas państwa pragnące naszego upadku, dlatego szukamy sojuszników, którzy pomogą nam zjednoczyć i ocalić królestwo. Wysłaliśmy ambasadorów do najpotężniejszych monarchów Europy, prosząc ich o wsparcie."
 sumatran_ideas: "Sumatrzańskie idee"
 reliance_on_trade: "Oparcie na handlu"
 reliance_on_trade_desc: "Handel od zawsze stanowił główne źródło naszego ogromnego bogactwa. Dlatego od pokoleń doskonalimy umiejętności targowania się i uczymy się jak najkorzystniej prowadzić interesy z innymi."
 porch_of_mecca: "Przedsionek Mekki"
 porch_of_mecca_desc: "Miasta Sumatry jako pierwsze w Azji Południowo-Wschodniej przyjęły islam. Nie tylko gościliśmy muzułmańskich podróżników z całego świata, lecz także szerzyliśmy wiarę poprzez działalność misyjną w imię Proroka. Jesteśmy indonezyjskim filarem islamu!"
 spice_pirates: "Piraci korzenni"
 spice_pirates_desc: "Odkąd w Cieśninie Malakka rozwija się handel, działają tam również piraci. Może powinniśmy porozumieć się z doświadczonymi przywódcami piratów i sprawić, by ich obecność przynosiła nam korzyści?"
 center_of_scholarship: "Ośrodek nauki"
 center_of_scholarship_desc: "Od stuleci wspaniałe miasta Sumatry są ośrodkami nauki i wiedzy. Przyciągają największe umysły najpierw świata buddyjskiego, a obecnie muzułmańskiego. Nikt nie może równać się z naszymi uczonymi!"
 merchants_of_the_indian_ocean: "Kupcy Oceanu Indyjskiego"
 merchants_of_the_indian_ocean_desc: "Nasi kupcy przemierzają świat wzdłuż i wszerz, docierając do jego najbardziej egzotycznych zakątków — od Maghrebu na zachodzie po Chiny na wschodzie, a nawet dalej! Ogromne zyski z handlu przyprawami przyciągają wielu nowych ludzi do kupiectwa."
 legacy_of_srivijaya: "Dziedzictwo Śriwidźaji"
 legacy_of_srivijaya_desc: "Śriwidźaja była potężnym państwem sumatrzańskim, które wywierało wpływ na większość Azji Południowo-Wschodniej. Przez kilka stuleci utrzymywała silną hegemonię w regionie, rozszerzając swoje wpływy dzięki handlowi i potędze militarnej. A my jesteśmy jej dumnymi spadkobiercami! Radujmy się!"
 rule_of_the_sea: "Władztwo nad morzem"
 rule_of_the_sea_desc: "Wielkie imperia Sumatry od zawsze miały silne tradycje talassokracji. Musimy utrzymać dominację na morzach, aby chronić zarówno nasz handel, jak i nasze miasta!"
 sumatran_ideas_start: "Sumatrzańskie tradycje"
 sumatran_ideas_bonus: "Sumatrzańska ambicja "
 AFG_ideas: "Afgańskie idee"
 AFG_ideas_start: "Afgańskie tradycje"
 AFG_ideas_bonus: "Afgańska ambicja "
 pashtunwali: "Pasztunwali"
 pashtunwali_desc: "Od stuleci nasz lud kieruje się zasadami pasztunwali. Ten kodeks honorowy nakazuje odpowiadać zemstą na każdą zniewagę. Nie cofniemy się przed niczym, by pomścić naszych poległych synów."
 shadows_of_the_hindu_kush: "W cieniu Hindukuszu"
 shadows_of_the_hindu_kush_desc: "Wszyscy Pasztunowie urodzili się w cieniu potężnego pasma górskiego zwanego Hindukuszem. Góry te staną się naszą twierdzą, której nie zdobędzie żaden najeźdźca."
 tureh: "Tureh"
 tureh_desc: "Jedna z podstawowych zasad pasztunwali. Wojownik musi być odważny i stawić czoła każdemu zagrożeniu dla swojej rodziny, ziemi lub honoru. Nie zabraknie nam więc ludzi gotowych walczyć w obronie ojczyzny."
 afghan_diaspora: "Afgańska diaspora"
 afghan_diaspora_desc: "Przed zrywem Mogołów wielu Afgańczyków wyemigrowało do północnych Indii, gdzie zdominowali lokalną arystokrację. Nawet wówczas, gdy Afganistan był pod kontrolą Safawidów i Mogołów, kraj ten służył jako miejsce rekrutacji żołnierzy i doradców. Zapewniło to Afganistanowi znaczące wpływy na obcych dworach."
 durrani_imperialism: "Imperializm Durranich"
 durrani_imperialism_desc: "Po uzyskaniu przez Afganistan niepodległości od Persji wielu afgańskich jeźdźców powróciło do ojczyzny, by służyć władcy znanemu jako Durr-i-Durrani, czyli „perła pereł”. Początkowo oddziały te trudniły się jedynie najazdami, lecz wkrótce stały się fundamentem największego imperium, jakie kiedykolwiek władało z Kabulu."
 institutionalized_loya_jirga: "Instytucjonalizacja lojal jirgi"
 institutionalized_loya_jirga_desc: "Wielka rada plemienna zwana lojal jirgą tradycyjnie zbierała się, by rozstrzygać najważniejsze sprawy, takie jak koronacja nowego króla. Teraz rola lojal jirgi zostanie trwale uregulowana, aby nikt nie mógł kwestionować naszego prawa do rządzenia."
 graveyard_of_empires: "Cmentarzysko imperiów "
 graveyard_of_empires_desc: "Żadna obca siła nie zajmie naszych ziem. Niech te rzekome imperia próbują swoich sił — każde z nich przekona się, że nie sprosta temu zadaniu."
 WAL_ideas: "Wołoskie idee"
 WAL_ideas_start: "Wołoskie tradycje"
 WAL_ideas_bonus: "Wołoska ambicja"
 cunning_diplomacy: "Przebiegła dyplomacja"
 cunning_diplomacy_desc: "Władcy Wołoszczyzny, zagrożeni przez potężniejszych przeciwników z obu stron, nauczyli się zręcznie zmieniać sojusze, gdy wymagała tego sytuacja. Niektórzy zapewniali sobie tron dzięki osmańskiemu wsparciu, a następnie zawierali sojusze z Węgrami lub cesarzem Świętego Cesarstwa Rzymskiego."
 foreign_trade_restrictions: "Ograniczenia handlu zagranicznego"
 foreign_trade_restrictions_desc: "Za panowania Włada Palownika handel zagraniczny ograniczono do trzech miast, aby wesprzeć wołoskich kupców."
 mercenary_guard: "Gwardia najemna"
 mercenary_guard_desc: "Aby zabezpieczyć władzę hospodara przed rywalami roszczącymi sobie prawo do tronu, Wład Palownik utworzył stałą gwardię najemną, niezależną od lokalnych układów politycznych."
 w_foreign_advisors: "Zagraniczni doradcy"
 w_foreign_advisors_desc: "Począwszy od rządów Włada Palownika, stanowiska na dworze często powierzano cudzoziemcom nieposiadającym ziemi na Wołoszczyźnie. Ograniczało to zależność władcy od miejscowej arystokracji."
 legacy_of_the_impaler: "Dziedzictwo Palownika"
 legacy_of_the_impaler_desc: "W chwili śmierci Wład Palownik był znany w całej Europie jako tyran czerpiący sadystyczną przyjemność z tortur i zabijania. Być może jego dziedzictwo zostało niesprawiedliwie ocenione, lecz budzenie strachu ma swoje zalety — wrogowie Wołoszczyzny zadrżą na widok naszych nadciągających wojsk."
 boyar_regime: "Rządy bojarów"
 boyar_regime_desc: "Traktat z Alba Iulia ugruntował władzę wołoskiej szlachty. W rządzeniu państwem u boku wojewody miał uczestniczyć również dwunastoosobowy sobór najpotężniejszych bojarów."
 abolition_of_serfdom: "Zniesienie pańszczyzny"
 abolition_of_serfdom_desc: "W 1746 roku na Wołoszczyźnie zniesiono poddaństwo chłopów, co znacznie ograniczyło liczbę zbiegów uciekających do Siedmiogrodu."
 CANNOT_JOIN_LEAGUE_AT_LEAGUE_WAR: "§R- Podczas wojny związkowej nie możemy dołączyć do ligi ani jej opuścić.§!"
 CANNOT_JOIN_LEAGUE_AT_WAR: "§R- Będąc w stanie wojny, nie możemy dołączyć do ligi ani jej opuścić.§!"
 CANNOT_JOIN_LEAGUE_TRUCE_WITH_EMPEROR: "§R- Nie możemy dołączyć do tej ligi, ponieważ zawarliśmy rozejm z cesarzem.§!"
 EMPEROR_CANNOT_JOIN_LEAGUE: "§R- Cesarz nie może dołączyć do ligi ani jej opuścić.§!"
 NOT_DISCOVERED_HRE: "§R- Nie odkryliśmy Świętego Cesarstwa Rzymskiego!§!"
 HRE_ON_OTHER_CONTINENT: "§R- Nie możemy dołączyć do ligi, jeśli nasza stolica leży na innym kontynencie niż Święte Cesarstwo Rzymskie.§!"
 ALREADY_MEMBER_OF_LEAGUE: "§R- Jesteśmy członkiem ligi religijnej!§!"
 RECENTLY_JOINED_LEAGUE: "§R- Niedawno dołączono do ligi religijnej i przed §Y$DATE$§! nie można jej opuścić."
 manchu_nation_1_title: "Przyjmij tożsamość mandżurską."
 manchu_nation_1_desc: "With the three capitals of the ancient Jurchen tribes firmly in our hands, it is now time to proclaim our people's unification and let the entire world know that Manchurians are now one."
 cb_sengoku: "Sengoku"
 cb_sengoku_desc: "Powinniśmy rozszerzyć nasze wpływy w siogunacie, odbierając ziemie sąsiedniemu klanowi."
 british_nation_diplomatically_title: "Utwórz państwo brytyjskie na drodze dyplomatycznej"
 british_nation_diplomatically_desc: "Jednocząc się dla rozwoju skutecznej polityki wewnętrznej i rozciągając nasze wpływy poza granice, będziemy mogli wzmocnić naszą pozycję w świecie i przekształcić się w jedną z największych potęg Europy – Imperium Brytyjskie."
 canal_events.25.t: "Ukończenie Kanału Kilońskiego"
 canal_events.25.d: "Po bezprecedensowym przedsięwzięciu budowlanym, jakiego region ten dotąd nie widział, w [Root.GetName] ukończono budowę Kanału Kilońskiego, łączącego Morze Północne z Bałtykiem. Nasza flota może teraz szybciej i bezpieczniej przemieszczać się między tymi akwenami, co otwiera drogę do wyjątkowych manewrów wojskowych i przedsięwzięć handlowych."
 canal_events.25.a: "Odmieni to losy żeglugi i bieg historii!"
 canal_events.26.t: "Ukończono Kanał Sueski"
 canal_events.26.d: "Na przestrzeni dziejów wielokrotnie próbowano połączyć Morze Czerwone ze Śródziemnym, lecz żaden z tych projektów nie dorównał przedsięwzięciu [Root.Owner.GetName]. Dawniej statki musiały opływać cały kontynent, by podróżować między Europą a Oceanem Indyjskim. Przeszkoda lądowa, na którą przez stulecia przeklinało zapewne wielu kapitanów, została wreszcie przekuta przez naszych genialnych inżynierów. Przez dziesięciolecia nikt nie wierzył, że jest to możliwe, lecz my odważyliśmy się nie tylko o tym pomyśleć, ale i wcielić ten plan w życie."
 canal_events.27.t: "Ukończono Kanał Panamski"
 canal_events.27.d: "Wielu twierdziło, że to niemożliwe. Inni uznawali taki projekt za mrzonkę lub odległą wizję przyszłości, lecz [Root.Owner.GetName] urzeczywistniło to marzenie. Spośród pomysłów połączenia dwóch oceanów to właśnie połączenie Atlantyku z Pacyfikiem wydawało się najbardziej odległe, mimo że oba akweny dzieli stosunkowo wąski pas lądu. Dzięki wytrwałości, pomysłowości i ogromnym środkom, które przeznaczyliśmy na ten projekt, kanał został ukończony. Nasze statki mogą teraz bezpiecznie przepływać między oceanami bez konieczności opływania przylądka Horn. Kanał, wyprzedzający swoją epokę o całe stulecia, będzie nie tylko szlakiem żeglugowym, lecz także pomnikiem dowodzącym, że dla [Root.Owner.GetName] nie ma rzeczy niemożliwych."
 canal_events.28.t: "Opóźnienie budowy kanału w [From.Owner.GetName]"
 canal_events.28.d: "Nasze państwo podległe [From.Owner.GetName] przekazało nam wiadomość, że budowa kanału opóźnia się z powodu różnych czynników, na które nie ma ono wpływu."
 canal_events.28.a: "Godne ubolewania."
 canal_events.29.t: "Budowa kanału w [From.Owner.GetName] przed terminem"
 canal_events.29.d: "Nasze państwo podległe [From.Owner.GetName] poinformowało nas, że dzięki sprawnemu prowadzeniu projektu budowa kanału postępuje szybciej, niż przewidywano."
 canal_events.29.a: "Wspaniale!"
