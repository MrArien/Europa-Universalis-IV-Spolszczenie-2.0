 HRE_LEAGUE_LEADER_SCORE: "Aby zostać nowym liderem tej ligi kraj §Y$COUNTRY$§! musiałby zgromadzić ponad §Y$SCORE_NEEDED$§! punktów militarnych, jako że dotychczasowy lider zgromadził ich §Y$SCORE_LEADER$§!. Kraj §Y$COUNTRY$§! zgromadził obecnie §Y$SCORE_CURRENT$§! punktów militarnych. O całkowitej liczbie punktów militarnych decydują wielkość zasobów ludzkich oraz limity siły i taktyki. Bycie w stanie wojny drastycznie ją zmniejsza, natomiast bycie elektorem znacznie ją zwiększa."
