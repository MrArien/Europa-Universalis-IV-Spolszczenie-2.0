 joined_league_for_land: "Dołączono do ligi dla ziem"
 joined_league_for_faith: "Dołączono do ligi w imię wiary"
 enforced_sound_toll: "Wprowadzono cła sundzkie"
 unaided_during_blockade: "Pozostawieni bez pomocy podczas blokady"
 desc_unaided_during_blockade: "Brak wsparcia ze strony państwa w czasie blokady miasta sprawił, że jego mieszkańcy stracili zaufanie do swoich władców."
 scottish_mercenaries: "Szkoccy najemnicy"
 desc_scottish_mercenaries: "Wielu Szkotów służy w naszych armiach jako żołnierze najemni, przez co możemy w większym stopniu polegać na tego rodzaju wojskach."
 huguenot_stronghold: "Twierdza hugenotów"
 desc_huguenot_stronghold: "Dysydenci religijni znaleźli tu schronienie i rozpoczęli umacnianie swoich pozycji, przygotowując się do obrony lub buntu."
 jesuit_ruler: "Jezuicki władca"
 desc_jesuit_ruler: "Władca odebrał wykształcenie u jezuitów i nie toleruje herezji ani heretyków."
 nobles_fled: "Ucieczka szlachty"
 desc_nobles_fled: "Gdy nasza stolica upadła, szlachta poczuła się zagrożona i uciekła z kraju, szukając schronienia w sąsiednich państwach naszej wiary."
 golden_age_transylvania: "Złoty wiek Siedmiogrodu"
 desc_golden_age_transylvania: "Nasz utalentowany monarcha i inwestycje poczynione w stolicy zapoczątkowały złoty wiek naszego państwa."
 god_is_spanish: "Bóg jest Hiszpanem"
 desc_god_is_spanish: "Nasze sukcesy w wojnie ligowej przekonały wielu, że Bóg stoi po naszej stronie i walczy w obronie naszego państwa."
 god_wants_peace: "Bóg pragnie pokoju"
 desc_god_wants_peace: "Nasze niepowodzenia w wojnie ligowej przekonały wielu, że Bóg pragnie, byśmy zawarli pokój i porzucili nadzieję na zwycięstwo."
 in_league_for_land: "W lidze dla zdobyczy terytorialnych"
 desc_in_league_for_land: "Jasno daliśmy do zrozumienia, że przystąpiliśmy do wojny ligowej, by zdobywać ziemie, a kwestie religijne mają dla nas drugorzędne znaczenie."
 in_league_for_faith: "W lidze w obronie wiary"
 desc_in_league_for_faith: "Jasno daliśmy do zrozumienia, że przystąpiliśmy do wojny ligowej, by walczyć o przetrwanie prawdziwej wiary."
 tyw_events.1.t: "Reservatum Ecclesiasticum"
 tyw_events.1.d: "Jako cesarz być może będziemy musieli zaakceptować, że niektórzy z naszych poddanych popadną w herezję, by uniknąć wewnętrznych konfliktów. W końcu to władca dyktuje religię królestwa. Nie możemy sobie jednak pozwolić na taką pobłażliwość w stosunku do księstw kościelnych. Wydaje się, że jeden z książąt-biskupów rządzących w Świętym Cesarstwie Rzymskim porzucił Kościół i posłuchał kłamstw protestantów, ryzykując nie tylko własną duszę, ale także dusze wszystkich swoich poddanych. Dzięki kościelnej klauzuli zastrzegamy sobie prawo do zmuszenia go do rezygnacji w przypadku takiej zdrady."
 tyw_events.1.a: "Wyegzekwować to! Dobry katolik zajmie jego miejsce."
 tyw_events.1.a.tt: "Wyślij wiadomość do [This.Monarch.GetRulerGen] z [This.GetAdjective]. [This.Monarch.GetHerHisCap] odpowiedź poznamy za dwa tygodnie."
 tyw_events.1.b: "Spowodowałoby to zbyt wiele kłopotów."
 tyw_events.2.t: "Cesarz żąda rezygnacji"
 tyw_events.2.d: "Nawrócenie [Root.Monarch.GetName] na [Root.Religion.GetName] najwyraźniej rozgniewało [From.Monarch.GetRulerGen]. [From.Monarch.GetName] twierdzi teraz, że egzekwuje Reservatum Ecclesiasticum, klauzulę, który zmusza [Root.Monarch.GetRulerGen] w Cesarstwie do rezygnacji z tytułów, jeśli nie wyznaje Katolicyzmu. Ta klauzula nie cieszy się poparciem wśród protestantów w Cesarstwie i być może Cesarstwo straciłoby część swojego autorytetu, gdyby rzeczywiście jej użyło."
 tyw_events.2.a: "To prawo cesarza."
 tyw_events.2.b: "Nigdy! Zbawienie istnieje poza Kościołem!"
 tyw_events.3.t: "[From.Monarch.GetTitle] odmawia rezygnacji"
 tyw_events.3.d: "Ku naszemu zaskoczeniu i oburzeniu, [From.Monarch.GetName] z [From.GetAdjective] odmówił[From.Monarch.GetANoun] uznania ważności kościelnej klauzuli zgodnie z naszą interpretacją, twierdząc, że przywoływanie jej jest dowodem tyranii z naszej strony. Jeśli chcemy ocalić dusze ludu [From.GetAdjective], wygląda na to, że sami musimy egzekwować prawdziwą wiarę."
 tyw_events.3.a: "Heretycy spłoną."
 tyw_events.4.t: "[From.Monarch.GetTitle] rezygnuje"
 tyw_events.4.d: "[From.Monarch.GetTitle] z [From.GetAdjective] mądrze zaakceptował[From.Monarch.GetANoun] nasze egzekwowanie kościelnej klauzuli i zrezygnował[From.Monarch.GetANoun] z tytułu [From.Monarch.GetName]. Pokazaliśmy również, że Święte Cesarstwo Rzymskie pozostaje wierne swojej nazwie i oczekujemy, że nasi przywódcy religijni, oraz wszyscy książęta, pozostaną na prawdziwej ścieżce lub przekażą swój tytuł temu, kto to zrobi."
 tyw_events.4.a: "Cesarz chroni."
 tyw_events.5.t: "Blokada"
 tyw_events.5.d: "Mieszkańcy miasta [Root.GetCapitalName] w dużej mierze polegają na swoim porcie, aby zaopatrywać miasto w to, czego potrzebuje, ale blokada prowincji [Root.GetName] uniemożliwiła zdobycie wielu luksusów, jak i niektórych towarów, które są niezbędne do prowadzenia miasta. Mieszkańcy z trudem radzą sobie sami z brakiem [Root.GetTradeGoodsName_gen] i zwracają się do [Root.Owner.Monarch.GetRulerGen], aby znaleźć rozwiązanie."
 tyw_events.5.a: "Przekierować zasoby w celu dostarczenia towarów szlakami lądowymi."
 tyw_events.5.b: "Zatrudnij naszą sieć korsarzy do przemycania towarów."
 tyw_events.5.c: "Wojna jest ciężka dla wszystkich. Będą musieli sobie poradzić."
 tyw_events.6.t: "Wielka kometa"
 tyw_events.6.d: "Niezwykłe zjawiska na nocnym niebie często uznawano za złowieszcze znaki lub zapowiedzi końca świata. Ostatnio zaobserwowano wyjątkowo widowiskowe zjawisko — wielką kometę, która wywołała poruszenie większe niż zwykle.\n\n$NATURAL_SCIENTIST$ wykorzystał jednak tę okazję, by dokładnie zbadać ruch komety. Efektem tych obserwacji jest praca naukowa, która wiele mówi nam o odległości tego ciała niebieskiego od Ziemi i rozwiewa liczne dawne przesądy dotyczące komet. Nie wiadomo, czy zwykli ludzie zapamiętają te odkrycia, ale kometa przyniosła nam więcej wiedzy niż strachu."
 tyw_events.6.a: "Wciąż spoglądajmy w niebo!"
 tyw_events.7.t: "Wychowanie [Root.Monarch.GetTitle]"
 tyw_events.7.d: "Tragiczna śmierć poprzedniego [Root.Monarch.GetTitle] sprawiła, że [Root.Heir.GetName] został bez rodzica, lecz nie bez opiekunów ani nauczycieli. Doradcy na naszym dworze dokładają starań, by zapewnić [Root.Heir.GetHerHim] jak najlepsze wykształcenie przed objęciem rządów w [Root.GetName]. Wielu zabiega o to, by mieć największy wpływ na młodego następcę tronu, licząc na zdobycie jego przyszłych względów i wpływów. Ostatecznie komuś zapewne się to uda i wpłynie na to, jakim władcą okaże się [Root.Heir.GetName]."
 tyw_events.7.a: "Najlepsze wykształcenie zapewni doradca zajmujący się sprawami administracyjnymi."
 tyw_events.7.a.tt: "[Root.Heir.GetName] rozwinie [Root.Heir.GetHerHis] zdolności administracyjne."
 tyw_events.7.b: "Umysł dyplomaty jest niezbędny zarówno do nauki, jak i rządzenia [Root.GetName]."
 tyw_events.7.b.tt: "[Root.Heir.GetName] rozwinie [Root.Heir.GetHerHis] zdolności dyplomatyczne."
 tyw_events.7.c: "Sztuka wojenna musi być głównym przedmiotem nauki przyszłego [Root.Monarch.GetTitle]."
 tyw_events.7.c.tt: "[Root.Heir.GetName] rozwinie [Root.Heir.GetHerHis] zdolności militarne."
 tyw_events.8.t: "Szkoccy najemnicy"
 tyw_events.8.d: "Choć Szkocja jak dotąd zdołała uniknąć udziału w konfliktach religijnych w Świętym Cesarstwie Rzymskim, nie oznacza to braku zainteresowania. Doskonale zdajemy sobie sprawę, że ta wojna wpłynie na całą Europę, a jej wynik ma również znaczenie dla naszej dyplomacji. Szkocja może nie zechcieć walczyć w imieniu żadnej z lig, lecz wielu Szkotów jest gotowych to zrobić. Służąc jako najemnicy w obcych armiach na kontynencie, mogą odmienić losy wojny bez bezpośredniego zaangażowania naszego państwa."
 tyw_events.8.a: "Wyślijmy ich do walki po stronie Ligi Ewangelickiej."
 tyw_events.8.b: "Wyślijmy ich do walki po stronie Ligi Katolickiej."
 tyw_events.8.c: "Potrzebujemy wszystkich żołnierzy, których zdołamy zebrać na miejscu."
 tyw_events.9.t: "Szkoccy najemnicy"
 tyw_events.9.d: "Szkoccy najemnicy zaczęli masowo zasilać nasze szeregi. Doniesienia wskazują, że również nasi sojusznicy przyjmują wielu z nich, gotowych dołączyć do sprawiedliwej walki o ostateczne zakończenie konfliktów religijnych w Świętym Cesarstwie Rzymskim. Choć ich ojczyzna nie przystąpiła do wojny, Szkoci najwyraźniej są gotowi walczyć po stronie naszej ligi — za odpowiednią zapłatą."
 tyw_events.9.a: "W takim razie jesteśmy gotowi im zapłacić."
 tyw_events.10.t: "Węgrzy buntują się przeciwko władzy Habsburgów"
 tyw_events.10.d: "Węgrzy zamieszkujący [Root.GetName] zaczęli postrzegać konflikt religijny w Cesarstwie jako spór między nimi a Habsburgami władającymi [Root.Owner.GetName]. Gdy protestanccy i katoliccy królowie oraz cesarze prowadzą wojnę, twierdzą oni, że lud również powinien chwycić za broń, by bronić swojej wiary. Jakby trwająca wojna nie przysparzała nam już dość problemów, teraz musimy jeszcze zmierzyć się z wichrzycielami na ziemiach, które dawno powinny pogodzić się z panowaniem dynastii Habsburgów."
 tyw_events.10.a: "Nasi wrogowie wszędzie szerzą kłamstwa."
 tyw_events.11.t: "Hugenoci gromadzą się w La Rochelle"
 tyw_events.11.d: "Wojny religijne mogą już dobiegać końca, lecz konflikty wyznaniowe we Francji wciąż trwają. Hugenoccy heretycy, rzekomo zaniepokojeni prawem do wyznawania swojej wiary pod rządami [Root.Monarch.GetName], rozpoczęli przygotowania do możliwego otwartego buntu. Na razie nie posunęli się tak daleko, lecz zgromadzili się w La Rochelle i zaczęli umacniać miejskie fortyfikacje. Ich dokładne zamiary pozostają niejasne, ale najbardziej buntowniczy spośród nich twierdzą, że zamierzają utworzyć niezależne państwo, wyzwalając się spod władzy Francji i katolików."
 tyw_events.11.a: "Jeśli tak dalej pójdzie, możemy okazać się równie bezwzględni, jak nas przedstawiają."
 tyw_events.12.t: "Hugenoccy buntownicy potrzebują naszej pomocy"
 tyw_events.12.d: "Choć [Root.GetName] uwolniło się już spod tyranii Kościoła katolickiego, wielu ludzi za granicą nadal cierpi z powodu podobnego ucisku. Hugenoci we Francji uznali za konieczne wzniesienie umocnień, by przygotować się na prześladowania, które francuski reżim z pewnością zechce na nich sprowadzić.\n\nWiara tych dzielnych ludzi może być szczera, lecz wątpliwe, czy zdołają sami oprzeć się potędze francuskiej armii. Z poparciem [Root.Monarch.GetTitle] z [Root.GetAdjective] wszystko staje się jednak możliwe."
 tyw_events.12.a: "Każmy im uderzyć na Francuzów — ruszymy im z pomocą!"
 tyw_events.12.b: "Wolelibyśmy nie ściągać na siebie gniewu Francji."
 tyw_events.13.t: "Brytyjskie wsparcie dla hugenotów"
 tyw_events.13.d: "Hugenoccy dysydenci zgromadzeni w La Rochelle, którzy wcześniej zachowywali przynajmniej pewną ostrożność, nabrali śmiałości dzięki poparciu [From.Monarch.GetTitle] z [From.GetAdjective]. Najwyraźniej zdradzieccy heretycy z [From.GetName] uznali za stosowne nie tylko szerzyć swoje kłamstwa we Francji, lecz także wzniecać tu pożogę. Niezależnie od tego, czy dotrzymają obietnicy, hugenoci otwarcie wystąpili przeciwko władzy."
 tyw_events.13.a: "Wrogowie Francji zapłacą za to — zarówno w La Rochelle, jak i w [From.Capital.GetCapitalName]."
 tyw_events.14.t: "Upadek Pragi"
 tyw_events.14.d: "Praga była niegdyś siedzibą wielu królów, a nawet cesarzy, i kryje w sobie liczne świadectwa minionych epok. Dzisiejsze zdobycie miasta przez wojska [Root.GetAdjective] kusi, by wywieźć część jego skarbów do [Root.Capital.GetCapitalName] i przywłaszczyć je sobie. Niektóre rzadkie zabytki nie mają sobie równych w znanym świecie, więc może to być nasza jedyna szansa, by je zdobyć... Nie obędzie się jednak bez gniewu mieszkańców Pragi."
 tyw_events.14.a: "Zabierzmy je do naszej stolicy! Tak buduje się dziedzictwo."
 tyw_events.14.b: "Te skarby należą do tego miejsca."
 tyw_events.15.t: "Albrecht von Wallenstein"
 tyw_events.15.d: "Wśród konfliktów religijnych w Świętym Cesarstwie Rzymskim talentem dowódczym wyróżnił się szlachcic z rodu Waldsteinów. Pochodzący z Czech Wallenstein już na początku wojny dowiódł swojej lojalności wobec cesarza. Dostarcza nam nowych pomysłów i wprowadza innowacje zarówno w strategii, jak i taktyce wojennej. Mamy nadzieję, że nadal będzie cennym wsparciem w naszych wysiłkach na rzecz przywrócenia wiary i porządku w Cesarstwie."
 tyw_events.15.a: "Cesarz [Root.Monarch.GetName] bardziej niż kiedykolwiek potrzebuje teraz lojalnych ludzi."
 tyw_events.16.t: "Podważana lojalność Wallensteina"
 tyw_events.16.d: "Od chwili, gdy na początku wojny dołączył do naszych sił, Wallenstein dał się poznać jako niezwykle zdolny dowódca wojskowy. Choć stara się okazywać lojalność i wdzięczność, wiadomo, że nie zgadza się z wieloma decyzjami cesarza [Root.Monarch.GetName]. Wiarygodne źródła donoszą, że niektóre nasze odmowy pójścia na kompromis w tym konflikcie wręcz go rozgniewały. Wielu podejrzewa teraz, że rozważa przejście na stronę wroga. Na szczęście część oficerów jego wojsk wciąż jest przede wszystkim lojalna wobec nas. Mogliby dopilnować, by Wallenstein nigdy nie walczył dla innej ligi."
 tyw_events.16.a: "Trzeba go pojmać — żywego lub martwego."
 tyw_events.16.b: "Potrzebujemy go żywego, by nadal dowodził naszymi wojskami."
 tyw_events.17.t: "Wallenstein nas zdradza"
 tyw_events.17.d: "Najgorsze obawy naszych doradców okazały się słuszne. Zależność od dowództwa Wallensteina, w czasie gdy wojna coraz bardziej obciążała nasze państwo i Cesarstwo, ośmieliła go do dezercji w samym środku konfliktu. Uciekł, by dołączyć do wroga. Nasze wojska jeszcze spotkają go na polach bitew, lecz teraz będzie dowodził armiami zdrajców walczących przeciwko cesarzowi."
 tyw_events.17.a: "Powinniśmy byli go zabić, gdy mieliśmy ku temu okazję."
 tyw_events.17.a.tt: "Albrecht von Wallenstein przejdzie na stronę państwa [This.GetName]."
 tyw_events.18.t: "Generał Wallenstein przechodzi na stronę [From.GetName]"
 tyw_events.18.d: "Nasza wojna przeciwko tyranii cesarza Świętego Cesarstwa Rzymskiego wyznającego [From.Religion.GetName], którego siedzibą jest [From.Capital.GetCapitalName], sprawiła, że nawet generałowie [From.Monarch.GetHerHis] zaczęli wątpić w słuszność sprawy. Widząc, że [From.GetName] nie chce iść na kompromis mimo przedłużającej się wojny, Albrecht von Wallenstein uznał, że lepiej będzie służyć nam. Wygląda na to, że jego lojalność podawano w wątpliwość o jeden raz za dużo."
 tyw_events.18.a: "Przepowiednia sama się spełniła, ale dla nas to szczęśliwy obrót spraw."
 tyw_events.19.t: "Zimowe oblężenie"
 tyw_events.19.d: "Oblężenie przeciągające się przez zimę jest zawsze kosztowne i najlepiej całkowicie go uniknąć. Ta zima była wyjątkowo ciężka i podczas jednego z naszych oblężeń zamarzł zarówno sprzęt, jak i żołnierze. W takim tempie będziemy musieli albo odzyskać siły i przeczekać zimę, albo wysłać więcej ludzi, z których wielu prawdopodobnie umrze z zimna i głodu. Ilu jesteśmy gotowi poświęcić, aby zdobyć to jedno miasto?"
 tyw_events.19.a: "Tyle, ile potrzeba."
 tyw_events.19.b: "Poczekajmy cierpliwie na właściwy moment."
 tyw_events.20.t: "Kres rodu Gryfitów"
 tyw_events.20.d: "Niespokojna sytuacja w Świętym Cesarstwie Rzymskim odbiła się na zdrowiu naszego [Root.Monarch.GetTitle]. Nasze niewielkie państwo znalazło się w samym środku narastającego konfliktu, a w najgorszym możliwym momencie nasz władca podupadł na zdrowiu i nie doczekał się dziedzica. Wraz z [Root.Monarch.GetHerHis] śmiercią kończą się rządy Gryfitów, którzy władali Pomorzem przez stulecia. Nasze ziemie mogą zostać podzielone przez potęgi, które wykorzystują słabość najsłabszych członków Cesarstwa."
 tyw_events.20.a: "Przetrwamy jako suwerenne państwo nawet w tych trudnych czasach."
 tyw_events.20.a.tt: "[This.GetName] zyskają roszczenia na wszystkich prowincjach pomorskich."
 tyw_events.21.t: "Kres rodu Gryfitów"
 tyw_events.21.d: "Po stuleciach panowania nad Pomorzem zmarł bezpotomnie ostatni [From.Monarch.GetTitle] z dynastii Gryfitów, który władał tym krajem. Trwające konflikty religijne w Świętym Cesarstwie Rzymskim mogą zachęcić ambitnych władców do zgłoszenia roszczeń do tego regionu. Nie tylko my dostrzegliśmy taką możliwość — wiele potęg może wkrótce szykować się do podziału pomorskich ziem."
 tyw_events.21.a: "Dobrze rozpoznajemy nadarzające się okazje."
 tyw_events.22.t: "Bitwa o [Root.GetCapitalName]"
 tyw_events.22.d: "Wojna ligowa dotarła do samego serca naszego państwa, a mimo to ponieśliśmy klęskę. Wojska [From.GetAdjective] starły się z naszymi w pobliżu stolicy, [Root.Capital.GetCapitalName], i odniosły zwycięstwo, co wywołało niepokój i wstyd w naszych siłach zbrojnych. Wojna wciąż może zakończyć się naszym zwycięstwem, lecz ta bitwa może zostać zapamiętana — czy nam się to podoba, czy nie."
 tyw_events.22.a: "Możemy tylko mieć nadzieję, że nasze przyszłe sukcesy przyćmią to wszystko."
 tyw_events.23.t: "Wrogowie Ligi"
 tyw_events.23.d: "Nasza decyzja o opowiedzeniu się po jednej ze stron konfliktu religijnego w Świętym Cesarstwie Rzymskim wywołała jeszcze gorętsze dyskusje na temat stanowiska [Root.GetName] wobec reformacji. Nie mamy wątpliwości co do celów Ligi, lecz w naszym kraju nie brakuje osób, które je kwestionują. Dla nas jest oczywiste, że wybraliśmy słuszną stronę dla dobra wszystkich mieszkańców [Root.GetAdjective], bez względu na wyznanie. Niektórzy poddani widzą w tym jednak jedynie kłamstwa heretyków. Najbardziej zagorzali przeciwnicy chwycili za broń przeciwko swoim władcom i Lidze."
 tyw_events.23.a: "Jak niewiele ci ludzie wiedzą o sprawach międzynarodowych."
 tyw_events.24.t: "$THEOLOGIAN$$INQUISITOR$ kwestionuje naszą wiarę"
 tyw_events.24.d: "[Root.Monarch.GetName] jest władcą kierującym się praktycznym rozsądkiem. Choć jest równie pobożny jak każdy [Root.Monarch.GetTitle], na pierwszym miejscu stawia sojusze korzystne politycznie. Mimo wyznawania wiary [Root.Religion.GetName] przystąpiliśmy do ligi religijnej, która sprzeciwia się naszym przekonaniom. Większość doradców uważa to za konieczność — niektórzy mogli nawet sami to zasugerować.\n\n$THEOLOGIAN$$INQUISITOR$ nie należy jednak do takich doradców. Jako osoba głęboko wierząca nie potrafi ukryć oburzenia naszą decyzją, a jej postawa zaczyna już szkodzić naszej dyplomacji. Choć pozostajemy lojalni wobec Ligi, utrzymanie dobrych stosunków z jej członkami może okazać się trudne, skoro nie tylko wyznajemy niewłaściwą wiarę, ale także otaczamy się takimi ludźmi."
 tyw_events.24.a: "Jeśli nie potrafi trzymać języka za zębami, musi odejść."
 tyw_events.24.b: "Nasi sojusznicy zasługują na prawdę, nawet jeśli nie chcą jej usłyszeć."
 tyw_events.25.t: "[Root.Religion.GetName] [Root.Culture.GetName] kwestionują nasze rządy"
 tyw_events.25.d: "Mieszkańcy [Root.GetName] często spotykali się z podważaniem swojej lojalności wobec [Root.Owner.GetName] — zarówno z powodu [Root.Culture.GetName] pochodzenia, jak i odmowy przyjęcia wiary [Root.Owner.Religion.GetName]. Niektórzy zaczęli przez to zastanawiać się, czy w ogóle powinni podlegać władzy [Root.Owner.Monarch.GetName]. Coraz częściej domagają się prawa do podejmowania decyzji o zarządzaniu prowincją przez miejscowych przedstawicieli, którzy będą bronić ich interesów. Zbliżamy się do momentu, w którym trzeba będzie pójść na jakiś kompromis."
 tyw_events.25.a: "Przekażmy władzę miejscowej szlachcie [Root.Religion.GetName] wyznania i [Root.Owner.Culture.GetName] pochodzenia."
 tyw_events.25.b: "Przekażmy władzę tym spośród [Root.Culture.GetName], którzy wyznają religię [Root.Owner.Religion.GetName]."
 tyw_events.25.c: "Zgódźmy się przyznać im pewien zakres samorządności."
 tyw_events.26.t: "Jezuickie wychowanie [Root.Heir.GetName]"
 tyw_events.26.d: "Towarzystwo Jezusowe, zakon znany powszechnie od nazwy swoich członków jako jezuici, zaoferowało wykształcenie młodemu [Root.Heir.GetName]. Wielu krewnych i doradców poparło tę propozycję, licząc, że [Root.Heir.GetSheHe] wyrośnie na — jak sami nazywają siebie jezuici — żołnierza Boga. W tych niespokojnych czasach, przekonują, najważniejszą cechą władcy jest siła ducha. Inni obawiają się jednak, że tak bliski związek z Kościołem uczyni młodego [Root.Monarch.GetTitle] bezwzględnym wobec tych, którzy odchodzą od jego nauki."
 tyw_events.26.a: "Potrzebujemy [Root.Monarch.GetTitle], który będzie walczyć w obronie naszej wiary!"
 tyw_events.26.a.tt: "[Root.Heir.GetName] zostanie wychowany na żołnierza Boga, obeznanego ze sztuką wojenną, lecz surowego wobec heretyków."
 tyw_events.26.b: "Nie pozwolimy, by zakon religijny wpływał na naszego przyszłego władcę."
 tyw_events.27.t: "Jezuicko wykształcony [Root.Monarch.GetTitle] wstępuje na tron"
 tyw_events.27.d: "Powierzenie jezuitom edukacji [Root.Monarch.GetName] przyniosło rezultaty, których większość mogła się spodziewać. Nowemu [Root.Monarch.GetTitle] nie brakuje przekonania ani odwagi, lecz jest on zagorzałym orędownikiem Kościoła katolickiego, a zwłaszcza jezuitów. Wierni radują się, ale heretycy boją się teraz [Root.GetName] bardziej niż kiedykolwiek."
 tyw_events.27.a: "Ad maiorem Dei gloriam."
 tyw_events.28.t: "[Root.Culture.GetName] szlachta ucieka za granicę"
 tyw_events.28.d: "Wojna o jedność religijną w Świętym Cesarstwie Rzymskim nie przebiega po naszej myśli. Nasza stolica, [Root.Capital.GetCapitalName], przez wielu uznawana za ostatnie bezpieczne schronienie dla tych, którym udało się do niej dotrzeć, została zdobyta przez wroga. Szlachta — zarówno ta, która od początku mieszkała w mieście, jak i ta, która wcześniej tam uciekła — obawia się teraz upadku [Root.GetName] i zaczyna szukać schronienia u sąsiadów, którzy mogą jeszcze przyjąć wyznawców wiary [Root.Religion.GetName]."
 tyw_events.28.a: "Niech uciekają i wrócą, gdy [Root.GetName] nadejdą lepsze czasy."
 tyw_events.28.b: "Zapewnijmy im bezpieczeństwo w naszych granicach, bez względu na koszty."
 tyw_events.29.t: "Poszukująca schronienia [From.Culture.GetName] szlachta"
 tyw_events.29.d: "Okupacja miasta [From.Capital.GetCapitalName] przeraziła wielu spośród szlachty [From.GetAdjective], powodując ich ucieczkę z kraju i nadzieję na znalezienie schronienia wśród innych wyznawców [Root.Religion.GetReligion_gen]. Ponieważ konflikt ma podłoże religijne, przynajmniej na pierwszy rzut oka, powinniśmy pomagać tym, którzy podzielają naszą wiarę. Jednak oczy wrogów Ligi są zawsze zwrócone na nas i jest wielu, którzy nie byliby zadowoleni, widząc swoich wrogów pod naszą ochroną."
 tyw_events.29.a: "Z pewnością są inni, którzy mogą udźwignąć ten ciężar."
 tyw_events.29.b: "Wierni z [Root.Religion.GetReligion_gen] zawsze znajdą tu schronienie."
 tyw_events.30.t: "Íñigo Vélez de Guevara"
 tyw_events.30.d: "Konflikty takie jak obecny spór o sytuację religijną w Świętym Cesarstwie Rzymskim, choć mogą wydawać się rozstrzygane na polu bitwy, wymagają również dyplomatycznego wyczucia i przebiegłości. Na naszych usługach znajduje się człowiek obdarzony właśnie takimi talentami — hrabia Oñate. Sąsiedzi naszych przeciwników w Cesarstwie mogą być zainteresowani przejęciem ziem, które wolelibyśmy odebrać naszym wrogom. Samo przekazanie im tej informacji może wywołać konflikt korzystny dla nas."
 tyw_events.30.a: "Przekażmy im, że [Root.GetName] chce oddać im ziemie naszych wrogów."
 tyw_events.30.a.tt: "Zaoferuj państwu [This.GetName] roszczenia do sąsiedniego państwa Cesarstwa, które opowiedziało się przeciwko naszej lidze."
 tyw_events.30.b: "Jego talenty lepiej wykorzystać w długofalowych działaniach dyplomatycznych."
 tyw_events.31.t: "[From.GetName] oferuje ziemie przeciwników Ligi"
 tyw_events.31.d: "Wydaje się, że przystąpienie jednego z naszych sąsiadów, członka Cesarstwa, do przeciwnej ligi rozgniewało państwo [From.GetName]. Wysłano do nas ambasadora, Íñiga Véleza de Guevarę, który prowadził już działania dyplomatyczne w różnych częściach Cesarstwa. Ma nam zaoferować roszczenia do ziem należących do państw sprzeciwiających się ich lidze.\n\nNadchodzą trudne czasy, lecz nawet one stwarzają okazje. Możemy wykorzystać tę szansę do rozszerzenia naszych granic albo pokazać, że niezależnie od przynależności do lig nie żywimy wrogich zamiarów wobec sąsiadów z Cesarstwa."
 tyw_events.31.a: "Przyjmijmy ofertę ambasadora."
 tyw_events.31.b: "Niech wszyscy wiedzą, że nie rościmy sobie praw do tych ziem."
 tyw_events.32.t: "Wprowadź cła sundzkie dla Szwecji"
 tyw_events.32.d: "Cło sundzkie od początku XV wieku stanowi ważne źródło dochodów Danii i pozwala nam wywierać znaczący wpływ na handel odbywający się przez cieśninę Sund.\n\nSzwecja była zwolniona z opłat od czasu, gdy nasze kraje połączyła unia kalmarska. Nie podlega jednak duńskiej koronie już od dawna. Być może nadszedł czas, by również Szwedzi zaczęli płacić — nasza hojność wynikająca z dawnych więzi ma przecież swoje granice."
 tyw_events.32.a: "Powinniśmy byli znieść to zwolnienie już dawno temu."
 tyw_events.32.b: "Takie tradycje pozwalają utrzymać pokój."
 tyw_events.33.t: "Dania wprowadza cła sundzkie"
 tyw_events.33.d: "Choć kontrola nad cieśniną Sund już teraz zapewnia Duńczykom silną pozycję w handlu bałtyckim, najwyraźniej chciwość wzięła nad nimi górę. Otrzymaliśmy wiadomość, że cło sundzkie, z którego nasz kraj był zwolniony od czasów unii kalmarskiej, zaczęto pobierać również od szwedzkich statków. To już teraz zapowiada się na poważną niedogodność, a niektórzy doradcy sugerują nawet rozpoczęcie wojny w odpowiedzi na tę zniewagę."
 tyw_events.33.a: "Duńskie diabły!"
 tyw_events.34.t: "Prośba o osmańskie poparcie dla roszczeń do Polski"
 tyw_events.34.d: "Żyjemy w czasach pełnych możliwości, a nasz kraj dopiero rozpoczął poszerzanie swoich granic. Powstaliśmy na styku świata chrześcijańskiego i muzułmańskiego, mając w pobliżu zarówno Święte Cesarstwo Rzymskie, jak i Imperium Osmańskie. Musimy więc mądrze wykorzystywać nasze kontakty, by przetrwać. Utrzymujemy dobre stosunki dyplomatyczne z Turkami, możemy zatem skorzystać z ich poparcia i przygotować inwazję na ziemie polskie, by przyłączyć je do naszego państwa."
 tyw_events.34.a: "Nadszedł właściwy moment. To nasza szansa."
 tyw_events.34.a.tt: "Jeśli Osmanowie się zgodzą, w ciągu tygodnia powinniśmy uzyskać roszczenia do sąsiednich polskich prowincji."
 tyw_events.34.b: "Siedmiogród nie życzy Polakom niczego złego."
 tyw_events.35.t: "Siedmiogród prosi o poparcie roszczeń do Polski"
 tyw_events.35.d: "[From.Monarch.GetName] z Siedmiogrodu przekazał nam wiadomość o rozważanej inwazji na Polskę. Siedmiogrodzianie sądzą, że osłabienie ich sąsiadów przyniosłoby nam korzyści, i proszą o nasze milczące poparcie dla swoich roszczeń do tych ziem."
 tyw_events.35.a: "Znakomita inicjatywa."
 tyw_events.35.b: "Nie widzimy sensu w podejmowaniu takiej kampanii."
 tyw_events.36.t: "Wyzwólmy Węgry spod ucisku religijnego"
 tyw_events.36.d: "Utworzenie lig w Świętym Cesarstwie Rzymskim pokazało, że żyjemy w czasach, gdy państwa nie pozostają już bezczynne, pozwalając, by ludzie wyznający ich wiarę cierpieli pod rządami bezbożnych władców. Niedaleko naszych granic węgierscy wyznawcy religii [Root.Religion.GetName] znajdują się właśnie w takiej niedopuszczalnej sytuacji. Nasz kraj łączą z Węgrami silne więzi prawne i duchowe, nie możemy więc pozwolić, by to trwało. Nadszedł czas, by ich wyzwolić i odzyskać te ziemie, tak aby nigdy więcej nie przelano na nich krwi wyznawców [Root.Religion.GetName]."
 tyw_events.36.a: "Siedmiogród stoi po stronie Węgrów."
 tyw_events.37.t: "Złoty wiek Siedmiogrodu"
 tyw_events.37.d: "Nasz kraj przeżywa być może najlepszy okres od chwili, gdy przybrał obecną postać. [Root.Monarch.GetName] dowiódł, że jest niezwykle zdolnym [Root.Monarch.GetTitle], a inwestycje mają uczynić [Root.Capital.GetCapitalName] miastem pełnym kultury i splendoru. Mamy nadzieję, że w nadchodzącej dekadzie architektura i oświata rozkwitną w całym kraju, i modlimy się, by ta epoka pokoju i dobrobytu trwała jak najdłużej."
 tyw_events.37.a: "Zbudujemy państwo, które przetrwa wieki."
 tyw_events.38.t: "Zjednoczeni w wierze"
 tyw_events.38.d: "[Root.Monarch.GetName], będąc wierząc[Root.Monarch.GetAYm] [Root.Monarch.GetWomanMan_dat], znalazł[Root.Monarch.GetANoun] niezwykle osobisty sposób na budowanie zaufania i zapewnianie lojalności. Podczas osobistego spotkania z innym władcą wyznającym [Root.Religion.GetName], często prosi ich o wspólną modlitwę w intencji ich wspólnych celów. Choć może to oznaczać rezygnację z dystansu niezbędnego w dyplomacji, może to stworzyć silniejsze więzi niż jakakolwiek formalna umowa. [Root.Monarch.GetSheHeCap] znowu rozważa zastosowanie tej metody podczas nadchodzącej wizyty w obcej stolicy, choć nie ma pewności, czy zakończy się ona sukcesem.\n\n"
 tyw_events.38.a: "Nie tylko umysły, ale także dusze muszą się zjednoczyć, aby powstało prawdziwe zaufanie."
 tyw_events.38.b: "Być może lepiej byłoby praktykować bardziej świecką dyplomację."
 tyw_events.39.t: "Bóg jest Hiszpanem"
 tyw_events.39.d: "Nasza obecna wojna o sytuację religijną w Świętym Cesarstwie Rzymskim przebiega pomyślnie. Optymizm związany z realizacją naszych celów religijnych przybrał szczególnie duchową postać, gdy jeden z naszych ministrów ogłosił, że Bóg jest Hiszpanem i w tych dniach walczy za nasze państwo. Jeśli wszystko nadal będzie układać się po naszej myśli, nawet wrogowie będą musieli przyznać, że jest w tym ziarno prawdy."
 tyw_events.39.a: "Czy żołnierz mógłby prosić o lepszego sojusznika?"
 tyw_events.40.t: "Bóg pragnie pokoju"
 tyw_events.40.d: "Nasza obecna wojna o sytuację religijną w Świętym Cesarstwie Rzymskim przebiega źle. Ponieważ religia stanowi sedno tego konfliktu, wielu spośród tych, którzy niegdyś twierdzili, że Bóg jest z nami, gdy przystępowaliśmy do Ligi, teraz utrzymuje, że Bóg odbiera nam środki do prowadzenia wojny i pragnie, byśmy zawarli pokój. Choć nie jest to jedyna interpretacja obecnych wydarzeń, powtarza się ją na tyle często, że coraz więcej ludzi wątpi w możliwość zwycięstwa."
 tyw_events.40.a: "Wiara, która rodzi zwątpienie, jest niewiele warta."
 tyw_events.41.t: "Zwiększa się wymiana barterowa"
 tyw_events.41.d: "Podczas gdy zły stan waluty [Root.GetAdjective] staje się dla nas coraz bardziej niepokojący, zwykli ludzie zaczęli szukać innych rozwiązań. Wielu z nich coraz bardziej obawia się korzystania z pieniędzy i unika ich, gdy tylko jest to możliwe, powracając do starych sposobów handlu, takich jak system barterowy. Być może ich obawy są nieuzasadnione, ale jeśli nie podejmiemy szybkich działań, możemy stracić kontrolę nad gospodarką i samym krajem."
 tyw_events.41.a: "Miejmy nadzieję, że to zadziała, dopóki nie opanujemy problemu."
 tyw_events.41.b: "Musimy zasięgnąć rady naszych najlepszych ekonomistów."
 tyw_events.42.t: "Zdobycie hiszpańskiej floty skarbów"
 tyw_events.42.d: "Nasi korsarze od dawna uprzykrzają życie hiszpańskim flotom, lecz niedawno opracowany śmiały plan pozwoli nam stać się czymś więcej niż tylko utrapieniem. Hiszpańska flota skarbów wypływa właśnie z kolonii, przewożąc ładunek srebra, złota i egzotycznych towarów o wartości przewyższającej ich wagę w tych kruszcach. Nasi korsarze planują przechwycić okręty na początkowym odcinku ich trasy. Zapewniają, że ładunek można zdobyć przy niewielkim ryzyku, a plan może się nie powieść właściwie tylko wtedy, gdy ktoś zdradzi go Hiszpanom."
 tyw_events.42.a: "Te skarby lepiej przysłużą się w rękach [Root.GetAdjective]."
 tyw_events.42.b: "Nie chcemy ściągać na siebie gniewu hiszpańskiej armady."
 tyw_events.43.t: "Hiszpańska flota skarbów zdobyta!"
 tyw_events.43.d: "Jeden po drugim przechwytywaliśmy okręty hiszpańskiej floty skarbów. Wiele z nich udało się zaskoczyć, a część uwięzić, gdyż nie spodziewały się tak śmiałego ataku. Mimo że niektóre statki otrzymały wcześniej ostrzeżenie, ładunek zdobytych okrętów zapewni naszej gospodarce zastrzyk środków na wiele miesięcy, a może nawet lat. Korsarze powrócili do [Root.Capital.GetCapitalName] jako bohaterowie. Prawdopodobnie nigdy więcej nie uda nam się przeprowadzić tak udanego przejęcia łupów."
 tyw_events.43.a: "Mimo wszystko miło było choć raz tego dokonać."
 tyw_events.44.t: "Flota skarbów zdobyta przez Holendrów"
 tyw_events.44.d: "Holenderscy korsarze, którzy od dawna utrudniają nam sprowadzanie towarów z odległych kolonii, niedawno bezpośrednio zaatakowali naszą flotę skarbów. Doszło do tego, gdy opuszczała ona port, by przewieźć srebro i złoto z hiszpańskich portów do naszej ojczyzny. Część okrętów była przygotowana na atak i zdołała go uniknąć, lecz pozostałe poniosły dotkliwe straty. Nie ustaliliśmy jeszcze, jaką karę wymierzymy Holendrom ani czego od nich zażądamy, ale z pewnością za to zapłacą."
 tyw_events.44.a: "Złoto, srebro i krew byłyby dopuszczalnymi walutami. "
 tyw_events.45.t: "Wykształcony [Root.Monarch.GetTitle]"
 tyw_events.45.d: "Wykształcenie, które [Root.Monarch.GetName] otrzymał w dzieciństwie podczas regencji, przygotowało [Root.Monarch.GetHerHim] do sprawowania rządów jako [Root.Monarch.GetTitle] — dokładnie tak, jak mieliśmy nadzieję. Doradcy odpowiedzialni za tę edukację są dumni, że pozostawili tak trwały ślad w mądrości i motywacjach [Root.Monarch.GetWomanMan], który będzie władać [Root.GetName]."
 tyw_events.45.a: "I słusznie."
 tyw_events.46.t: "Zwycięstwo pod [From.Capital.GetCapitalName]!"
 tyw_events.46.d: "Wojna ligowa zaprowadziła nas aż pod stolicę jednego z naszych wrogów. Uderzyliśmy w samo serce jego państwa i odnieśliśmy zwycięstwo, przynosząc mu wielki wstyd. Spośród wielu dzielnych żołnierzy biorących udział w bitwie szczególnie wyróżnił się jeden, któremu przypisuje się znaczną zasługę za sukces. Za wyjątkowy spokój i błyskotliwe decyzje w samym środku zamętu został awansowany do stopnia generała."
 tyw_events.46.a: "Być może jeszcze niejednemu państwu napędzi strachu."
 tyw_events.47.t: "Przygotowanie obrony"
 tyw_events.47.d: "[Root.GetName] znalazło się pod atakiem, lecz wróg jak dotąd nie posunął się daleko w głąb naszych ziem. Nasi stratedzy wojskowi sugerują wzmocnienie obrony tam, gdzie jest to najbardziej potrzebne. Zwracają się jednak do [Root.Monarch.GetName] o decyzję, które miejsca należy umocnić. Bez wątpienia nie możemy pozwolić sobie na utratę kontroli nad stolicą, lecz być może mimo wszystko powinniśmy w pierwszej kolejności ufortyfikować granice."
 tyw_events.47.a: "Skupmy się na przygotowaniu stolicy i okolicznych prowincji."
 tyw_events.47.b: "Budowę umocnień należy rozpocząć na naszych granicach."
 tyw_events.48.t: "Prawdziwe zamiary"
 tyw_events.48.d: "Choć wojna ligowa rozpoczęła się z powodów religijnych, wyznanie panujące w Świętym Cesarstwie Rzymskim nie jest jedyną kwestią, która interesuje członków lig. Niektórzy widzą w wojnie okazję do odebrania ziem przeciwnikom, traktując religijne cele przywódców jako sprawę drugorzędną, a może nawet jako zwykły pretekst.\n\nNiedawno odwiedzili nas ambasadorowie przywódcy naszej ligi, którzy nalegają, byśmy jasno określili nasze prawdziwe motywy, co ma pomóc w przyszłych negocjacjach pokojowych."
 tyw_events.48.a: "Chcemy zakończyć tę wojnę z większym terytorium i nie zamierzamy tego ukrywać."
 tyw_events.48.b: "[Root.GetName] walczy w obronie samej wiary!"
 tyw_events.49.t: "Państwo [From.GetName] twierdzi, że walczy o ziemię"
 tyw_events.49.d: "[Root.Religion.GetName] ma dla nas kluczowe znaczenie, ale niektórzy członkowie Ligi nie mają tak szlachetnych intencji. Niedawno z miasta [From.Capital.GetCapitalName] powrócił ambasador z wieściami od [From.GetAdjective], który przyznał, że to, co naprawdę chcą zyskać na tej wojnie, to rozszerzenie swoich granic. Nieprzyjemne wieści, osłabiające naszą współpracę i pozycję w negocjacjach pokojowych."
 tyw_events.49.a: "Przynajmniej są szczerzy w swoim egoizmie."
 tyw_events.50.t: "Państwo [From.GetName] twierdzi, że walczy o wiarę"
 tyw_events.50.d: "Nie wszyscy członkowie Ligi przyłączyli się do nas, by walczyć o sprawę [Root.Religion.GetReligion_gen]. Wielu po prostu wybrało naszą stronę, ponieważ jest to politycznie korzystne. Wieści z [From.GetAdjective] są jednak takie, że naprawdę troszczą się o naszą sytuację i postrzegają Ligę przede wszystkim jako sojusz religijny, i idą do walki ze świadomością, że wspierają dzieło Boże u naszego boku."
 tyw_events.50.a: "Miejmy nadzieję, że pozostaną wierni tak szlachetnemu ideałowi."
 AUTO_TRANSPORT_CURRENT_MISSION: "$ARMIES|Y$ są obecnie transportowane przez $NAVIES|Y$ do prowincji $TARGET|Y$."
 MOVE_AUTO_TRANSPORT_TITLE: "Transport automatyczny"
 MOVE_AUTO_TRANSPORT_DIALOG: "Czy chcesz, by $LIST$ przetransportowała automatycznie jednostkę §Y$UNIT$§! do prowincji §Y$DESTINATION$§!?"
 EXPLORE_MISSION_SEA_TITLE: "Zbadaj nieodkryte ziemie"
 EXPLORE_MISSION_SEA_DIALOG: "Czy chcesz, by jednostka $UNIT$ automatycznie zbadała te morza?"
 EXPLORE_MISSION_CIRCUMNAVIGATE_TITLE: "Opłyń kulę ziemską"
 EXPLORE_MISSION_CIRCUMNAVIGATE_DIALOG: "Czy chcesz, by $UNIT$ podjęła próbę opłynięcia kuli ziemskiej? To bardzo trudne zadanie, które może doprowadzić do utraty floty na skutek jej wyniszczenia."
 EXPLORE_MISSION_COAST_TITLE: "Sporządź mapę linii brzegowej"
 EXPLORE_MISSION_COAST_DIALOG: "Czy chcesz, by $UNIT$ automatycznie sporządzała mapy tej linii brzegowej?"
 SPLIT_UNIT_AUTO_TRANSPORT_TITLE: "Transport automatyczny"
 SPLIT_UNIT_MOVE_AUTO_TRANSPORT_DIALOG: "Czy chcesz, by §Y$UNIT$§! uległa podziałowi, a $LIST$ automatycznie przetransportowała wydzielone jednostki do prowincji §Y$DESTINATION$§!?"
 per_najaf: "Sanktuarium w Nedżefie"
 desc_per_najaf: "Nedżef, miejsce ostatniego spoczynku Alego, jest dla szyitów jednym z najświętszych miejsc na ziemi. Jako opiekunowie tego świętego miasta wykonaliśmy różne projekty, aby uczynić to miejsce takim, jakim powinno być."
 per_miniature_school: "Perska szkoła malarstwa miniaturowego"
 desc_per_miniature_school: "Malarstwo miniaturowe kwitnie. Każdy, kto znaczy choć trochę w świecie islamskim, pragnie nabyć lub naśladować dzieła naszych mistrzów."
 per_mushashaiya: "Musha'sha'iyyah"
 desc_per_mushashaiya: "Bojowa sekta Musha'sha'iyyaha opanowała tę prowincję, co doprowadziło do niepokojów i niestabilności społecznej."
 per_safawiya: "Safawijja"
 desc_per_safawiya: "Wojowniczy zakon Safawidów opanował tę prowincję i wielu jej mieszkańców pragnie dołączyć do członków swojej wiary."
 per_shia_conversion_policy: "Państwo szyickie"
 desc_per_shia_conversion_policy: "Silny kraj to kraj o silnej wierze. Aktywnie promujemy szyizm imamicki jako wiarę dla mieszkańców Persji."
 per_pragmatic_ulema: "Nawrócenie duchowieństwa"
 desc_per_pragmatic_ulema: "Przyjęliśmy politykę hojnych nagród dla duchownych sunnickich, którzy przechodzą na naszą nową religię państwową."
 per_conversion_of_the_clergy: "Nawrócenie duchowieństwa"
 desc_per_conversion_of_the_clergy: "Wszyscy duchowni, którzy nie chcą stać się wiernymi wyznawcami naszej nowej religii państwowej, są aktywnie prześladowani. W naszym państwie nie może być zdrajców wśród kleru."
 per_shiite_immigration: "Napływ szyitów"
 desc_per_shiite_immigration: "Szyiccy uczeni, prawnicy, duchowni i inni wybitni ludzie przybywają tłumnie do naszego państwa z całego świata."
 per_building_isfahan: "Przebudowa Isfahanu"
 desc_per_building_isfahan: "Zasoby tego regionu są częściowo pochłaniane przez projekt przekształcenia Isfahanu w światową metropolię."
 per_isfahan_maidan: "Isfahan nisf-i jahan"
 desc_per_isfahan_maidan: "„Isfahan jest połową świata” — głosi stare powiedzenie. Po przebudowie miasta jest to prawdziwsze niż kiedykolwiek. Isfahan stał się artystyczną, polityczną i kulturalną stolicą nie tylko Persji, lecz całego świata perskojęzycznego."
 MOVE_WITH_TRANSPORT: "Ruch tutaj możliwy jest z pomocą statków transportowych."
 MOVE_WITH_TRANSPORT_BUSY: "Ruch tutaj możliwy jest z pomocą statków transportowych, ale wszystkie floty transportowe są obecnie zajęte."
 CAN_EXPLORE_TOOLTIP: "Kliknij PPM, by nakazać swojej flocie zbadanie tej prowincji."
 CANNOT_CIRCUMNAVIGATE_ALREADY_CIRCUMNAVIGATED: "Kulę ziemską można opłynąć tylko raz!"
 CANNOT_CIRCUMNAVIGATE_NO_TECH: "Potrzebujesz technologii dyplomatycznej co najmniej na poziomie §Y$NUM$§!, aby móc opłynąć kulę ziemską."
 CANNOT_EXPLORE_NO_EXPLORER: "Musisz mieć odkrywcę na czele tej floty, aby móc wysłać ją na wyprawę badawczą.\n"
 CANNOT_EXPLORE_NO_ADJACENT: "Aby wysłać odkrywcę na wyprawę badawczą, musisz najpierw zbadać sąsiednią prowincję.\n"
 CANNOT_EXPLORE_NOT_ENOUGH_SHIPS: "Musisz mieć w sumie co najmniej 3 lekkie i ciężkie okręty w tej flocie, aby móc nią eksplorować."
 CANNOT_EXPLORE_NOT_IN_PORT: "Flota musi znajdować się w porcie, aby można było wysłać ją na wyprawę badawczą."
 CANNOT_EXPLORE_TOO_FAR_AWAY: "Ta prowincja leży zbyt daleko od twojej najbliższej prowincji narodowej, aby można było ją zbadać."
 flavor_per.7.t: "Perskie malarstwo miniaturowe"
 flavor_per.7.d: "W sztuce perskiej zakaz przedstawiania postaci ludzkich nigdy nie obejmował w takim samym stopniu literatury świeckiej. Perska szlachta od niepamiętnych czasów zamawiała bogato iluminowane manuskrypty, zdobione kunsztownymi i niezwykle kosztownymi miniaturami.\nWraz z odrodzeniem Imperium Perskiego przemysł malarstwa miniaturowego przeżywa obecnie rozkwit. Dzieła mistrzów ze szkoły w $CAPITAL$ przyciągają nie tylko rodzimych nabywców, lecz są także eksportowane do całego świata islamskiego."
 flavor_per.7.a: "Rozumiem."
 flavor_per.8.t: "Iskander Munshi"
 flavor_per.8.d: "Po całym życiu spędzonym w królewskiej administracji Iskandar Beg Munshi ukończył wielką kronikę dziejów naszego państwa. Rozpoczynając od założenia naszej dynastii, Munshi opisuje wydarzenia z czasów panowania kolejnych szachów. Relacja z bliższych mu czasów opiera się w znacznej mierze na bogatych doświadczeniach kronikarza zdobytych podczas służby na dworze."
 flavor_per.8.a: "Rozumiem."
 flavor_per.9.t: "Nadżaf"
 flavor_per.9.d: "Mamy szczęście być opiekunami Nedżefu, jednego z najświętszych miast świata i miejsca spoczynku imama Alego. W ostatnich latach, podczas zmagań Timura, Dżalajirydów i Kara Kojunlu, miasto oraz jego sanktuaria zostały nieco zaniedbane. Naszym obowiązkiem jest naprawić tę sytuację."
 flavor_per.9.a: "Musimy dołożyć wszelkich starań, by upiększyć Nedżef i jego sanktuaria."
 flavor_per.9.b: "Chrońmy Nedżef, lecz bez popadania w rozrzutność."
 flavor_per.10.t: "Powstanie Musha’sha’iyyah"
 flavor_per.10.d: "Sufickie bractwo Musha'sha'iyyah skupione wokół irackiego teologa Muhammeda Ibn Falaha szybko zyskuje zwolenników wśród arabskich i perskich plemion w południowej Mezopotamii. Ponieważ sekta nadal zdobywa zwolenników i wsparcie finansowe, pozostaje niejasne, czy Ibn Falah lub którykolwiek z jego następców stanie się znaczącym czynnikiem w polityce Persji."
 flavor_per.10.a: "Rozumiem."
 flavor_per.11.t: "Powstanie Safawijji"
 flavor_per.11.d: "Potężne sufickie bractwo Safawijja w północno-zachodniej Persji zaczęło przekształcać się z zakonu o w dużej mierze ascetycznym charakterze w organizację wojskową. Nauki bractwa znalazły podatny grunt wśród turkmeńskich plemion Persji, a jego przywódcy są coraz częściej postrzegani jako istoty na wpół boskie. Dopiero czas pokaże, jaki wpływ wywrze to na perską politykę."
 flavor_per.11.a: "Rozumiem."
 flavor_per.12.t: "Powstanie kizylbaszów"
 flavor_per.12.d: "Pojawienie się religijnego państwa perskiego poruszyło serca plemion kizylbaszów zamieszkujących nasze ziemie. Drobne starcia z urzędnikami państwowymi przerodziły się już w otwarty bunt."
 flavor_per.12.a: "Rozumiem."
 flavor_per.13.t: "Perski szyizm"
 flavor_per.13.d: "Zbyt długo Persja pozostawała podzielona, gdy obcy najeźdźcy wkraczali na nasze ziemie. Choć $MONARCH$ cieszy się ogromną popularnością jako $MONARCHTITLE$, trwałego państwa nie można budować wyłącznie na osobistej lojalności. Musimy zjednoczyć nasz lud wokół wspólnej tożsamości religijnej, odmiennej od wyznania naszych sąsiadów.\nObecnie nie wszyscy nasi poddani utożsamiają się z szyizmem, jednak wielu muzułmanów w Persji praktykuje zwyczaje szyickie, takie jak oddawanie czci imamom. Jeśli zapewnimy, że wszyscy nasi mieszkańcy będą wyznawać szyizm dwunastkowy, stworzymy perską tożsamość, która przetrwa próbę czasu."
 flavor_per.13.a: "Nasza wiara zjednoczy nasz lud."
 flavor_per.13.b: "Różnorodność również jest źródłem siły."
 flavor_per.14.t: "Wiara sunnickich ulemów"
 flavor_per.14.d: "Choć ludowy islam w Iranie może być przychylnie nastawiony do szyizmu, środowisko ulemów od zawsze zdominowane było przez sunnitów. Dla części duchownych przemiana ta przebiegła wyjątkowo gładko, niemal podejrzanie łatwo, podczas gdy inni odmawiają dostosowania się do nowych porządków naszego państwa."
 flavor_per.14.a: "Nagradzajmy tych, którzy się nawrócą."
 flavor_per.14.b: "Karzmy tych, którzy odmawiają nawrócenia."
 flavor_per.15.t: "Napływ szyickich elit"
 flavor_per.15.d: "Od stuleci nie istniało silne państwo szyickie — ani w Iranie, ani gdziekolwiek indziej. Wraz z narodzinami naszego królestwa na nasze granice zaczęli napływać szyiccy teologowie, duchowni i przedstawiciele wszelkich dziedzin szyickiego życia intelektualnego z całego świata muzułmańskiego.\nTo dla nas pomyślny obrót spraw, ponieważ na naszych ziemiach brakuje szyickich prawników, duchownych i urzędników. Rozwój sytuacji wzbudził jednak niepokój wielu muzułmańskich monarchów, którzy zaczęli postrzegać nasze państwo jako zagrożenie."
 flavor_per.15.a: "Witamy naszych braci."
 flavor_per.15.b: "Nie powinniśmy ryzykować gniewu naszych sąsiadów."
 flavor_per.16.t: "Isfahan"
 flavor_per.16.d: "Jeśli chcemy zbudować prawdziwie perski naród, musimy stworzyć godną tego miana, prawdziwie perską stolicę. Isfahan to stare miasto położone w samym sercu perskich ziem, doskonale odpowiadające naszym ambicjom.\nUtalentowani architekci z całego kraju są gotowi przekształcić je w godny symbol naszej potęgi. Będzie to jednak przedsięwzięcie zarówno kosztowne, jak i czasochłonne."
 flavor_per.16.a: "Rozpocznijmy prace!"
 flavor_per.16.b: "$CAPITAL_CITY$ jest stolicą tego państwa."
 flavor_per.17.t: "Isfahan nisf-i jahan"
 flavor_per.17.d: "Budowa nowego ośrodka władzy w Isfahanie dobiegła wreszcie końca, a przed nami rozpościera się teraz jedno z najwspanialszych miast świata. Od alei Czahar Bagh po wielki plac Majdan-e Naksh-e Dżahan zgromadziliśmy w jednym miejscu wszystkie instytucje rządowe naszego imperium.\nMajdan w Isfahanie jest mikrokosmosem naszego imperium — ogromnym placem pełnym kramów kupców przybyłych ze wszystkich zakątków kraju, nad którym górują monumentalny Meczet Szacha, Cesarski Bazar oraz pałac Ali Qapu, w którym rezyduje nasz $MONARCHTITLE$. Podczas przebudowy miasta, z konieczności, opracowano wiele nowych technik budowlanych, a całe pokolenie rzemieślników i architektów rozwinęło swoje umiejętności dalece ponad dotychczasowe wyobrażenia."
 flavor_per.17.a: "Wspaniale!"
 flavor_jaj.1.t: "Państwo Siddich w Habsan"
 flavor_jaj.1.d: "Relacje różnią się co do dokładnego przebiegu wydarzeń. Jedni twierdzą, że napastnicy przybyli nocą, inni — że ukryli się w wielkich skrzyniach przebranych za podarunki. Jakkolwiek do tego doszło, dowódca jednego z naszych nadmorskich fortów zdołał jednocześnie utracić kontrolę zarówno nad wyspiarską twierdzą, jak i nad całym podległym mu regionem. Sprawcami jest grupa Siddich — dawnych niewolników etiopskiego pochodzenia, którzy stali się częstym widokiem we flotach i armiach tej części świata.\nPrzywódca Siddich wysłał dziś na nasz dwór posłańca z prośbą, byśmy pozwolili im zachować kontrolę nad zdobytym fortem. W zamian obiecują wiernie służyć naszemu państwu."
 flavor_jaj.1.a: "Dobrze."
 flavor_jaj.1.b: "Trzeba rozprawić się z tymi buntownikami!"
 flavor_jaj.1.c: "Pozwólmy im działać bez przeszkód."
 mer_fortification_effort: "Umocnienia Mewaru"
 desc_mer_fortification_effort: "Nasz rana postanowił przeprowadzić ogólny przegląd wszystkich fortów na naszych ziemiach."
 mer_kumbalgarh: "Kumbhalgarh"
 desc_mer_kumbalgarh: "Ten obszar jest kontrolowany przez potężną górską twierdzę Kumbhalgarh. Podobno jej długie i grube mury ustępują jedynie fortyfikacjom w odległych Chinach."
 mer_vijaya_sthambha: "Wijaja Stambha"
 desc_mer_vijaya_sthambha: "Wijaja Stambha, czyli Wieża Zwycięstwa, nawiązuje stylem do starszych dżinijskich zabytków z tego regionu i upamiętnia sukcesy naszej dynastii."
 flavor_mer.1.t: "Wijaja Stambha"
 flavor_mer.1.d: "Aby upamiętnić zwycięstwa nad licznymi wrogami — sułtanem Malwy, zdradzieckimi radżami Marwaru i chciwym sułtanem Gudźaratu — rana Kumbha rozpoczął w 1442 roku budowę niezwykłego pomnika.\nWznoszenie Wijaja Stambhy, bogato zdobionej dziewięciokondygnacyjnej wieży, trwało ponad dziesięć lat. Jest ona świadectwem nie tylko potęgi naszej dynastii, lecz także kunsztu i umiejętności naszych rzeźbiarzy oraz architektów."
 flavor_mer.1.a: "Doskonałość!"
 flavor_mer.2.t: "Powrót rany Jodhy Rathore"
 flavor_mer.2.d: "Gdy w 1438 roku przyłączyliśmy sąsiednie królestwo Marwaru, uczyniliśmy to w akcie odwetu. Radowie z rodu Rathore, niegdyś zaufani przyjaciele i regenci naszych władców, spiskowali, by zamordować królewskiego dziedzica i obalić nasze królestwo. Od tamtej pory ostatni żyjący potomek rodu Rathore tułał się po pustyniach Radżastanu, czekając na sposobność odzyskania dziedzictwa.\nWygląda na to, że w przekonaniu Jodhy Rathore ta chwila właśnie nadeszła. Otrzymaliśmy wieści, że nasi żołnierze w forcie Mandore w Marwarze zostali pokonani przez oddziały wierne sprawie rodu Rathore."
 flavor_mer.2.a: "To oznacza wojnę."
 flavor_mer.2.b: "Puśćmy dawne krzywdy w niepamięć."
 flavor_mer.3.t: "Kumbhalgarh"
 flavor_mer.3.d: "Królestwo Mewaru jest dumne i silne, stanowiąc ucieleśnienie dawnego ducha radźputów, lecz ma niewielu przyjaciół i wielu wrogów. Aby się bronić i odstraszyć potencjalnych najeźdźców, musimy umocnić nasze królestwo. Przygotowano plany budowy twierdzy, która wykorzysta pasmo Aravalli jako naturalną zaporę przeciw wrogom. Ta potężna forteca na szczycie góry pozwoli nam obserwować znaczną część naszych ziem, a wraz z twierdzą Chittorgarh uczyni nasze terytorium niezwykle trudnym do opanowania dla każdego najeźdźcy."
 flavor_mer.3.a: "Zbuduj Kumbhalgarh"
 flavor_mer.3.b: "Zamiast tego umocnijmy tereny wiejskie."
 flavor_mer.4.t: "Mira Bai"
 flavor_mer.4.d: "Kilka lat temu, próbując pojednać naszą dynastię z rywalami z Marwaru, wydaliśmy jednego z książąt za księżniczkę z rodu Rathore, Mirę Bai. Małżeństwo okazało się jednak krótkotrwałe, gdyż młoda księżniczka już po kilku latach została wdową.\nPo śmierci męża Mira Bai coraz bardziej poświęciła się Krysznie. Widziano ją, jak przemierza ulice stolicy, śpiewając i tańcząc z innymi ludźmi o równie żarliwej wierze. Takie zachowanie nie przystoi królewskiej wdowie, co wywołało niezadowolenie części rodziny królewskiej. Być może właśnie dlatego Mira Bai postanowiła opuścić $CAPITAL_CITY$. Podobno wędruje teraz po Radżastanie, głosząc miłość i oddanie Krysznie."
 flavor_mer.4.a: "Rozumiem."
 flavor_mer.5.t: "Spisek przeciwko ranie Kumbhie"
 flavor_mer.5.d: "Rana Kumbha, jeden z najwybitniejszych władców naszej dynastii, padł ofiarą odrażającego spisku. Jeden z królewskich synów, Udai, zamordował własnego ojca, najwyraźniej nie bacząc na to, że na zawsze splami reputację naszej rodziny.\nOjcobójstwo wstrząsnęło królestwem do głębi. Dumni naczelnicy Mewaru, nie chcąc mieć nic wspólnego z mordercą, postanowili poprzeć Raimala, brata Udaia."
 flavor_mer.5.a: "Poprzyjmy Udaia."
 flavor_mer.5.b: "Poprzyjmy Raimala."
