 tyw_events.38.t: "Zjednoczeni w wierze"
 tyw_events.38.d: "[Root.Monarch.GetName], będąc wierząc[Root.Monarch.GetAYm] [Root.Monarch.GetWomanMan_dat], znalazł[Root.Monarch.GetANoun] niezwykle osobisty sposób na budowanie zaufania i zapewnianie lojalności. Podczas osobistego spotkania z innym władcą wyznającym [Root.Religion.GetName], często prosi ich o wspólną modlitwę w intencji ich wspólnych celów. Choć może to oznaczać rezygnację z dystansu niezbędnego w dyplomacji, może to stworzyć silniejsze więzi niż jakakolwiek formalna umowa. [Root.Monarch.GetSheHeCap] znowu rozważa zastosowanie tej metody podczas nadchodzącej wizyty w obcej stolicy, choć nie ma pewności, czy zakończy się ona sukcesem.\n\n"
 tyw_events.38.a: "Nie tylko umysły, ale także dusze muszą się zjednoczyć, aby powstało prawdziwe zaufanie."
 tyw_events.38.b: "Być może lepiej byłoby praktykować bardziej świecką dyplomację."
 tyw_events.39.t: "Bóg jest Hiszpanem"
 tyw_events.39.d: ""
 tyw_events.39.a: ""
 tyw_events.40.t: "Bóg pragnie pokoju"
 tyw_events.40.d: ""
 tyw_events.40.a: ""
 tyw_events.41.t: "Zwiększa się wymiana barterowa"
 tyw_events.41.d: "Podczas gdy zły stan waluty [Root.GetAdjective] staje się dla nas coraz bardziej niepokojący, zwykli ludzie zaczęli szukać innych rozwiązań. Wielu z nich coraz bardziej obawia się korzystania z pieniędzy i unika ich, gdy tylko jest to możliwe, powracając do starych sposobów handlu, takich jak system barterowy. Być może ich obawy są nieuzasadnione, ale jeśli nie podejmiemy szybkich działań, możemy stracić kontrolę nad gospodarką i samym krajem."
 tyw_events.41.a: "Miejmy nadzieję, że to zadziała, dopóki nie opanujemy problemu."
 tyw_events.41.b: "Musimy zasięgnąć rady naszych najlepszych ekonomistów."
