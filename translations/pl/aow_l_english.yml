 malay_peninsula_region: "Półwysep Malajski"
 mlc_tun_perak: "Tun Perak"
 desc_mlc_tun_perak: "Nasz kraj rozkwita pod sprawnymi rządami bendahary Tuna Peraka."
 mlc_piracy_controlled: "Piractwo pod kontrolą"
 desc_mlc_piracy_controlled: "Piractwo na wodach malajskich często stanowi poważny problem, lecz obecnie mamy je pod kontrolą."
 mlc_islamic_laws_enforced: "Surowsze egzekwowanie prawa religijnego"
 desc_mlc_islamic_laws_enforced: "Aby zadowolić bardziej ortodoksyjne kręgi naszego duchowieństwa, przyjęliśmy surowszą interpretację prawa islamskiego, mniej zgodną z tradycyjnymi prawami Malakki. Ten nowy kierunek polityki sułtanatu wzbudził jednak wśród wielu nie-muzułmanów obawę, że zostaną zepchnięci na margines społeczeństwa."
 mlc_economic_boom: "Bum ekonomiczny"
 desc_mlc_economic_boom: "Nasza decyzja o niemal całkowitym zniesieniu podatków od handlu pobudziła gospodarkę i zapoczątkowała bezprecedensowy okres wzrostu gospodarczego w naszym królestwie."
 flavor_mlc.1.t: "Spisek przeciwko radży Ibrahimowi"
 flavor_mlc.1.d: "Równowaga religijna w tak kosmopolitycznym państwie jak Malakka jest niezwykle krucha. W naszym kraju żyją obok siebie kupcy wielu wyznań i kultur, choć w pewnym stopniu zachowują odrębność. Największe społeczności — Gudźaratczycy, Tamilowie, Jawajczycy i Chińczycy — mają wobec państwa własne zobowiązania. Utrzymanie równowagi wpływów między tymi grupami należy do najważniejszych zadań każdego władcy Malakki.\nWstąpienie Ibrahima na tron w 1444 roku wzbudziło więc niemałe poruszenie. Ibrahim praktykował hinduizm i wielu postrzegało go jako tradycjonalistę, który chciał ograniczyć wpływy islamu w naszym kraju. Mimo to wielkim zaskoczeniem było znalezienie młodego władcy martwego w jego pałacu. Wielu podejrzewa, że maczał w tym palce jego główny minister, królewski bendahara, lecz niewiele można udowodnić."
 flavor_mlc.1.a: "Radża Ibrahim nie zostanie zapomniany."
 flavor_mlc.2.t: "Bendahara Tun Perak"
 flavor_mlc.2.d: "W przeciwieństwie do zmarłego radży Ibrahima, znanego obecnie jako Abu Syahid Szach, król-męczennik, nasz nowy władca jest muzułmaninem, a kupieckie społeczności naszego miasta zdają się bardziej przychylnie odnosić do jego rządów. Mimo to królewski bendahara, który spiskuje przeciwko swojemu suwerenowi, stanowi przerażający precedens. Powinniśmy zastąpić tego ministra, jeśli nie chcemy podzielić losu jego poprzedniego pana. Zaufani doradcy wskazują młodego i odnoszącego sukcesy generała jako odpowiedniego kandydata. Tun Perak słynie z mądrości jak na swój wiek, a przede wszystkim z niezwykłej lojalności."
 flavor_mlc.2.a: "Powołajmy Tuna Peraka."
 flavor_mlc.2.b: "Powołajmy marionetkę i odsuńmy bendaharę od wpływów."
 flavor_mlc.3.t: "Piractwo na wodach malajskich"
 flavor_mlc.3.d: "Utrzymanie szlaków morskich w bezpieczeństwie jest priorytetem państwa tak zależnego od handlu jak nasze. Ostatnio aktywność piratów znów wzrosła. Tradycyjnie tego rodzaju zadanie powierzano kupieckim społecznościom naszego miasta."
 flavor_mlc.3.a: "Powierzmy to zadanie jednej ze społeczności kupieckich."
 flavor_mlc.3.b: "Rozwiążemy ten problem własnymi siłami."
 flavor_mlc.4.t: "Islam i państwo malakkańskie"
 flavor_mlc.4.d: "Malakka była pod wieloma względami centrum islamizacji Archipelagu Malajskiego. Nasze państwo zawsze unikało jednak surowych i nadmiernie ortodoksyjnych odmian prawa islamskiego, woląc pozostać atrakcyjnym miejscem dla kupców wszystkich narodowości. Zamiast tego opieramy porządek prawny na tradycji, a ortodoksyjne przepisy islamu stosujemy jedynie w szczególnych przypadkach, często związanych z utrzymaniem porządku publicznego. Choć przez lata budziło to sprzeciw osób o bardziej rygorystycznych poglądach religijnych, polityka ta sprzyjała handlowi i zyskała poparcie społeczności Malakki.\nZ czasem muzułmanie stali się jednak coraz liczniejsi i wpływowi w naszym państwie. Ze względu na znaczenie Malakki dla szerzenia islamu na wyspach niektórzy zaczęli nawet uważać ją za miejsce pielgrzymek. Być może nadszedł czas, by wprowadzić nieco więcej ortodoksji do praw i obyczajów naszego państwa?"
 flavor_mlc.4.a: "Tak, w imię Allaha."
 flavor_mlc.4.b: "Nie, pozostańmy przy naszych dawnych tradycjach."
 flavor_mlc.5.t: "Cła i opłaty"
 flavor_mlc.5.d: "Handel jest jedynym zajęciem naszego królestwa i ku zaskoczeniu wielu odwiedzających mamy niewiele osiągnięć w rolnictwie, więc musimy importować nawet podstawowe artykuły spożywcze. Mimo to nasze królestwo kwitnie, a statki z całej Azji przybywają do naszych doków, aby sprzedawać i kupować wszelkie towary.\nW celu dalszego wspierania handlu królewska Bendahara zasugerowała, żeby obniżyć cła prawie do zera. Ta odważna polityka wyróżniałaby nas nawet od królestw zorientowanych na handel i, jej zdaniem, zapewniłaby nam pozycję największego emporium Wschodu."
 flavor_mlc.5.a: "Malakka nie ma nic własnego, a ma wszystko, co oferuje świat."
 flavor_mlc.5.b: "Nie możemy sobie pozwolić na obniżenie tych opłat."
 flavor_mlc.6.t: "Hang Tuah"
 flavor_mlc.6.d: "Podczas tłumienia zamieszek wywołanych przez człowieka, który wpadł w szał na prowincji, nasz bendahara otrzymał dziś nieoczekiwaną pomoc od miejscowego wojownika. Gdy wszyscy strażnicy bendahary uciekli, ten człowiek i jego przyjaciele szybko i dzielnie ruszyli na ratunek naszemu ministrowi. Poruszony tak wielkim oddaniem państwu bendahara natychmiast mianował młodego wojownika, Hanga Tuaha, królewskim dowódcą.\nNasze królestwo zyskało właśnie służbę jednego ze swoich największych bohaterów."
 flavor_mlc.6.a: "Oby nasz lud nigdy nie zniknął z powierzchni ziemi."
 flavor_mlc.7.t: "Przybycie Portugalczyków"
 flavor_mlc.7.d: "Przybycie statków z odległych krain nie jest w Malakce niczym niezwykłym, lecz dzisiejszy gość wzbudził szczególne zainteresowanie. Kapitan twierdzi, że przybywa z chrześcijańskiego królestwa na dalekim zachodzie, zwanego Portugalią, i chce podpisać umowę handlową, która uczyniłaby jego kraj jednym z naszych najbardziej uprzywilejowanych partnerów.\nMuzułmańska społeczność gudźaracka usilnie przekonuje jednak, że przybysz jest niebezpieczny, a jego ojczyzna to zaprzysięgły wróg naszej religii. Gudźaratczycy tak stanowczo sprzeciwiają się obecności Portugalczyków, że zaczęli już otwarcie wrogo traktować przybyszów, konfiskując ich towary i wdzierając się na pokłady ich statków. Sytuacja może bardzo szybko wymknąć się spod kontroli..."
 flavor_mlc.7.a: "Zgrommy Gudźaratczyków i spróbujmy załagodzić sytuację."
 flavor_mlc.7.b: "Nie możemy pozwolić Portugalczykom umocnić się w tej części świata."
 flavor_mlc.7.a.tt: "Portugalia uzna ten incydent za nieco MNIEJ POWAŻNY."
 flavor_mlc.7.b.tt: "Portugalia uzna ten incydent za POWAŻNIEJSZY."
 flavor_mlc.8.t: "Incydent w Malakce"
 flavor_mlc.8.d: "Dotarły do nas wieści, że sułtanat Malakki skonfiskował ładunek statków portugalskich, które zawinęły do jego portu. Obawiamy się, że nasi dawni wrogowie ze świata muzułmańskiego zdążyli już nastawić Malakkę przeciwko nam."
 flavor_mlc.8.a: "Rozumiem."
 tribal_democracy_ruthenian: "Hetmanat"
 tribal_democracy_ruler_ruthenian: "Hetman"
 tribal_democracy_ruler_female_ruthenian: "Hetman"
 tribal_democracy_ruler_vassal_ruthenian: "Ataman"
 prices.11.t: "Najzimniejszy okres małej epoki lodowej"
 prices.11.d: "Zimy stają się coraz dłuższe i chłodniejsze, odkąd sięgamy pamięcią. Tej zimy lód i śnieg ponownie przesuwają się dalej na południe, niszcząc uprawy. Wino się psuje, a ryby zaczynają migrować do cieplejszych wód."
 prices.11.a: "Brrrr."
 LITTLE_ICE_AGE: "Najzimniejszy okres małej epoki lodowej"
 prices.12.t: "Korkowe zamknięcia butelek"
 prices.12.d: "Postęp w produkcji butelek pozwolił wytwórcom wina tworzyć naczynia o bardziej ujednoliconych rozmiarach, dzięki czemu można było ponownie wprowadzić korkowe zamknięcia. To znacznie skuteczniejszy sposób zabezpieczania wina niż dawne zatyczki z tkaniny, a zarazem rozwiązanie umożliwiające transport trunku na odległości wcześniej uznawane za niemożliwe. Być może właśnie jesteśmy świadkami narodzin światowego handlu winem."
 prices.12.a: "Rozumiem."
 WINE_CORKS: "Rozwój międzynarodowego handlu winem"
 prices.13.t: "Nowe tkaniny"
 prices.13.d: "Wśród tkaczy w kraju $COUNTRY$ zaczęła upowszechniać się nowa technika produkcji tkanin. Tak zwane „nowe tkaniny” są znacznie cieńsze, lżejsze i tańsze od grubych sukien wełnianych, na które dotąd istniał popyt. Zainteresowanie nowymi wyrobami rośnie, lecz do ich produkcji potrzeba znacznie mniej wełny, co powoduje spadek jej cen."
 prices.13.a: "Rozumiem."
 NEW_DRAPERIES: "Nowe tkaniny"
 prices.14.t: "Jednolite przepisy"
 prices.14.d: "Dawne armie zaciągowe są coraz częściej zastępowane przez bardziej trwałe armie narodowe. W ramach tego procesu wiele państw zaczęło regulować wygląd mundurów swoich żołnierzy, a niektóre z nich zaczęły nawet dostarczać je swoim żołnierzom. Barwnik nigdy nie był tani, a wraz ze wzrostem popytu zarówno na barwniki, jak i tkaniny, ceny rosną."
 prices.14.a: "Rozumiem."
 REGULATED_UNIFORMS: "Jednolite przepisy"
 prices.15.t: "Rybołówstwo Wielkich Wybrzeży"
 prices.15.d: "Nasi odkrywcy informują, że nad Wielkimi Brzegami Nowej Fundlandii znaleźli akweny wypełnione setkami tysięcy ryb, które tylko czekają na złowienie! Wyprawy kutrów rybackich przybierają na sile na tych wodach, a rynki zalewają niewyobrażalne zasoby ryb."
 prices.15.a: "Rozumiem."
 GREAT_FISHERIES: "Rybołówstwo Wielkich Wybrzeży"
 prices.16.t: "Kaliko i inne tkaniny bawełniane"
 prices.16.d: "Stały napływ indyjskich tkanin bawełnianych zaczyna znacząco zmieniać europejskie zwyczaje odzieżowe. Muśliny, kaliko i inne wyroby bawełniane osiągają na europejskich rynkach coraz wyższe ceny."
 prices.16.a: "Rozumiem."
 CALICOES: "Kaliko"
 prices.17.t: "Wyniszczenie populacji bobrów europejskich"
 prices.17.d: "Popyt na futra nieustannie rósł przez całe średniowiecze, a coraz chłodniejszy klimat tylko go zwiększał. Populacja bobrów europejskich nie jest już w stanie sprostać stale rosnącemu zapotrzebowaniu. Doszło do tego, że bobry stały się w Europie niezwykle rzadkie, a futra trzeba sprowadzać ogromnym kosztem z Rosji i dalekiej północy."
 prices.17.a: "Rozumiem."
 DEPLETION_OF_EUROPEAN_BEAVER: "Wyniszczenie populacji bobrów europejskich"
 prices.18.t: "Kapelusze filcowe"
 prices.18.d: "Futro bobra doskonale nadaje się do wyrobu kapeluszy. Dobrze chroni przed zimnem i zachowuje kształt nawet podczas niepogody oraz przez długi czas. Rosnący popyt na kapelusze filcowe, a także skomplikowany proces ich wytwarzania, przyczyniły się do rozwoju prężnej branży kapeluszniczej w naszej gospodarce."
 prices.18.a: "Rozumiem."
 FELT_HATS: "Kapelusze filcowe"
 prices.19.t: "Stałe floty wojenne"
 prices.19.d: "Stałe floty wojenne, niegdyś rzadkość, stają się obecnie normą. Instytucje odpowiedzialne za zarządzanie tymi nowymi flotami coraz aktywniej uczestniczą w zakupie zaopatrzenia, budowie okrętów, przydzielaniu racji żywnościowych i utrzymaniu jednostek."
 prices.19.a: "Rozumiem."
 PERMANENT_NAVIES: "Stałe floty wojenne"
 prices.20.t: "Działa z brązu"
 prices.20.d: "Działa z brązu wkroczyły na pola bitew i z pewnością pozostaną na nich na długo. Rozwijający się przemysł artyleryjski potrzebuje coraz większych ilości surowców, co w ostatnich latach doprowadziło do gwałtownego wzrostu popytu na miedź, a w konsekwencji także jej cen."
 prices.20.a: "Rozumiem."
 BRONZE_CANNONS: "Działa z brązu"
 prices.21.t: "Japońska kultura herbaty"
 prices.21.d: "Picie herbaty od dawna jest częścią japońskiej kultury. Jednak dalszy rozwój japońskiej ceremonii herbacianej w XVI wieku sprawił, że napój ten stał się powszechny w całym japońskim społeczeństwie."
 prices.21.a: "Rozumiem."
 JAPANESE_TEA_CULTURE: "Ceremonia picia herbaty"
 prices.22.t: "Upadek handlu przyprawami"
 prices.22.d: "Wraz ze wzrostem liczby konkurentów na rynku przypraw dostępność niegdyś niezwykle rzadkich w Europie przypraw ze Wschodu znacznie się zwiększyła. Niektórzy próbowali stabilizować ich ceny, paląc własne zapasy lub zaostrzając zasady eksportu, lecz rentowność tego handlu wyraźnie i trwale spada."
 prices.22.a: "Rozumiem."
 DECLINE_OF_SPICE_TRADE: "Upadek handlu przyprawami"
 prices.23.t: "Zmieniające się wzorce konsumpcji"
 prices.23.d: "Cukier był niegdyś rzadkim luksusem, który trzeba było sprowadzać z Maghrebu lub Bliskiego Wschodu. Wraz z otwarciem świata i wzrostem siły nabywczej mieszkańców miast nadal uchodzi za dobro luksusowe, lecz stał się znacznie bardziej przystępny cenowo."
 prices.23.a: "Rozumiem."
 POPULARIZATION_OF_SUGAR: "Upowszechnienie cukru"
 prices.24.t: "Upowszechnienie tkanin jedwabnych"
 prices.24.d: "Jedwab cieszył się ogromnym popytem na całym świecie na długo przed końcem średniowiecza, a jego pozyskiwanie było jedną z głównych przyczyn wypraw odkrywczych na Wschód. Dzięki większej dostępności jedwabiu — zarówno surowego, jak i tkanego — popyt na jedwabne materiały w zachodniej Europie stale rośnie."
 prices.24.a: "Rozumiem."
 POPULAR_SILK_FABRICS: "Moda na tkaniny jedwabne"
 prices.25.t: "Plantacje barwników w Bengalu"
 prices.25.d: "Nasza bezpośrednia kontrola nad niektórymi obszarami produkcji barwnika w północnych Indiach przyciągnęła wielu poszukiwaczy fortuny, którzy chcą rozszerzyć produkcję na nasze ziemie w Bengalu. Niektóre części Bengalu wydają się idealne do uprawy indygo i większość wydaje się oceniać, że jest prawdopodobne, że wysiłki te zakończą się sukcesem, jeśli pozwolimy na to. Uprawa indygo i proces przekształcania roślin w barwnik to jednak ciężka praca, a pozwolenie tym pozbawionym skrupułów ludziom na swobodę może prowadzić do trudności w przyszłości."
 prices.25.a: "Zezwól na to."
 prices.25.b: "Ograniczyć tworzenie nowych plantacji."
 BENGALI_INDIGO_PRODUCTION: "Większa dostępność barwników"
 prices.26.t: "Rozwój fornirowania"
 prices.26.d: "Początkowo wielu gatunków drewna tropikalnego nie wykorzystywano w stolarstwie, ponieważ uważano je za zbyt kruche. Rozwój techniki fornirowania pozwolił jednak używać hebanu i innych egzotycznych gatunków ze względu na ich piękno, a nie wytrzymałość. W rezultacie produkcja ozdobnych, oryginalnych szaf i innych luksusowych mebli z drewna tropikalnego stała się ważną gałęzią rzemiosła."
 prices.26.a: "Rozumiem."
 VENEERING: "Meble fornirowane"
 prices.27.t: "Spadek populacji słoni w Azji Południowo-Wschodniej"
 prices.27.d: "Po wielu latach stopniowego kurczenia się populacja słoni w Azji Południowo-Wschodniej osiągnęła rekordowo niski poziom. Popyt na słonie i wyroby z kości słoniowej w Azji Południowo-Wschodniej oraz Chinach jednak nie słabnie, dlatego ceny słoni i ich ciosów rosną."
 prices.27.a: "Rozumiem."
 IVORY_SHORTAGE: "Niedobór kości słoniowej w Azji Wschodniej"
 prices.28.t: "Rozwój obróbki żelaza"
 prices.28.d: ""
 prices.28.a: "Rozumiem."
 IRON_WORKING: "Rozwój obróbki żelaza"
 prices.29.t: "Gorąca czekolada"
 prices.29.d: ""
 prices.29.a: "Rozumiem."
 HOT_CHOCOLATE: "Picie gorącej czekolady"
 prices.30.t: "Rosnąca popularność tytoniu"
 prices.30.d: "Tytoń, pierwotnie reklamowany jako roślina lecznicza, zyskuje coraz większą popularność jako używka zarówno w świecie chrześcijańskim, jak i muzułmańskim. Od Paryża po Bengal zwyczaj ten rozpowszechnił się do tego stopnia, że handel tytoniem staje się niezwykle dochodowy."
 prices.30.a: "Rozumiem."
 POPULARIZATION_OF_TOBACCO: "Upowszechnienie tytoniu"
 prices.31.t: "Rozpowszechnianie plantacji kawy"
 prices.31.d: "Przez stulecia kawa była uprawiana i eksportowana wyłącznie z Jemenu oraz Etiopii. Zwłaszcza jemeńscy kupcy kontrolowali handel tym towarem tak silnie, że posuwali się do daleko idących działań, by nikt nie wywoził sadzonek kawowca poza ich granice.\nPodobnie jak niegdyś jedwabnik wędrował na zachód szlakami handlowymi, tak teraz kawowiec trafił w ręce naszych kupców. Plantacje w prowincji [java_coffee_here.GetName] zaczęły dostarczać znaczne ilości kawy, dzięki czemu ziarna stały się znacznie łatwiej dostępne."
 prices.31.a: "Napijmy się kawy z [java_coffee_here.GetName]!"
 prices.32.t: "Upadek [mocha.GetCapitalName]"
 prices.32.d: "Kupcy, którzy niegdyś przypływali do naszych portów po kawę, mają teraz inne możliwości. [mocha.GetCapitalName] nadal pozostaje ważnym portem, lecz nie jest już głównym światowym ośrodkiem handlu ziarnami kawy."
 prices.32.a: "Oby kupcy [From.GetAdjective] zadławili się swoimi plugawymi miksturami."
 JAVA_COFFEE: "Rozpowszechnianie plantacji kawy"
 prices.33.t: "Międzynarodowy rynek książek"
 prices.33.d: "Chociaż papier jest lepszy od pergaminu pod wieloma względami, nigdy nie był w stanie całkowicie go wyprzeć. Jednak wraz z popularyzacją prasy drukarskiej, książki, broszury, a nawet karty do gry stały się powszechne w sposób, w jaki nigdy wcześniej nie były. Sama sztuka produkcji papieru również stała się znacznie bardziej wyrafinowana w ciągu ostatnich dziesięcioleci, a te dwie rzeczy zbiegają się teraz, czyniąc papier znacznie bardziej poszukiwanym niż kiedykolwiek wcześniej.\nByć może najbardziej widocznym tego przykładem jest rynek książek w mieście [bookmarket_here.GetCapitalName], który z roku na rok wydaje się coraz większy. Początkowo były to targi dla drukarzy z miasta [bookmarket_here.GetAreaName], ale obecnie odwiedzają je goście z całego kontynentu."
 prices.33.a: "Największy rynek książek naprawdę znajduje się w mieście [bookmarket_here.GetCapitalName]."
 prices.33.b: "Przyniesie to korzyści całej prowincji."
 INCREASED_PRINTING: "Rozwój nowoczesnego drukarstwa i wydawnictw"
 prices.34.t: "Holender"
 prices.34.d: "Przez stulecia papiernie wykorzystywały mechaniczne młoty do rozbijania zbitej masy papierniczej i rozdrabniania włókien, z których następnie wytwarzano papier.\nRzemieślnicy z prowincji [hollender_beater_province.GetName], wykorzystując energię miejscowych wiatraków, opracowali wydajniejsze rozwiązanie. Tak zwany holender [Root.GetAdjective] to kadź wyposażona w napędzany wiatrem poziomy wał z ostrzami. W ciągu kilku godzin potrafi on rozdrobnić tyle masy papierniczej, ile dawniej wymagało to kilku dni pracy młotów."
 prices.34.a: "Rynek papierniczy już nigdy nie będzie taki sam."
 HOLLENDER_BEATER: "Holendry zastępujące młoty w produkcji papieru"
 prices.35.t: "Zarządzanie imperium"
 prices.35.d: "Urzędnicy od dawna przedkładają papier nad pergamin i inne materiały, ponieważ znacznie łatwiej się z nim pracuje. Istnieją również różne sposoby zabezpieczania dokumentów urzędowych przed fałszerstwem. Jednym z nich jest wynaleziony w Fabriano znak wodny, innym — wyszukane techniki marmurkowania i kaligrafii stosowane przez islamskich wytwórców papieru.\nW miarę jak imperia obejmują coraz większe terytoria, nierzadko rozciągające się na więcej niż jeden kontynent, autentyczność dokumentów i łatwość ich użycia stają się kluczowe. Od Chin po Europę administracje imperialne zaczynają więc wykorzystywać papier wyłącznie do sporządzania oficjalnych dokumentów i rozkazów."
 prices.35.a: "Przyszłość należy do papieru."
 PAPER_IN_BUREAUCRACY: "Znaki wodne i marmurkowanie papieru"
 prices.36.t: "Biblioteki wypożyczające i kluby książki"
 prices.36.d: "Wraz ze wzrostem umiejętności czytania i pisania upowszechnianie książek stało się celem zarówno gospodarczym, jak i ideologicznym. Księgarze są coraz częstszym widokiem w wielu miastach, a w dużych ośrodkach, takich jak [lending_libraries_here.GetName], całe ulice sklepów wypełniają skrzynie z książkami na sprzedaż.\nOsoby, których nie stać na zakup własnych egzemplarzy, mają teraz coraz więcej możliwości wypożyczania książek lub wspólnego finansowania ich zakupu. Powstają płatne biblioteki wypożyczające, spółdzielnie zakupowe oraz stowarzyszenia subskrypcyjne."
 prices.36.a: "Czy masom naprawdę można powierzyć słowo pisane?"
 LENDING_LIBRARIES: "Biblioteki wypożyczające i kluby książki"
 prices.37.t: "Kolumbijska wymiana"
 prices.37.d: "Wraz z kolonizacją obu Ameryk między Starym a Nowym Światem zaczęły rozprzestrzeniać się nowe nasiona, uprawy i zwierzęta. Od chwili sprowadzenia rośliny takie jak kukurydza, maniok i pomidory rozprzestrzeniają się po całym Starym Świecie, podczas gdy zwierzęta pociągowe spoza Ameryki zyskują coraz większe znaczenie w Nowym Świecie.\nZiemie, które wcześniej przez część roku, a niekiedy w ogóle nie nadawały się pod uprawę, zaczęto wykorzystywać do produkcji żywności i zbóż. Dostępność pożywienia na świecie jest dziś większa niż kiedykolwiek. Niewiele zjawisk w tym stuleciu przyniesie zwykłym ludziom równie wielkie korzyści — żywność stała się znacznie mniej deficytowa."
 prices.37.a: "To wspaniale..."
 prices.38.t: "Szlifowanie fasetowe"
 prices.38.d: "Mistrzowie szlifierstwa z miasta [diamond_city.GetCapitalName] dokonali przełomu w obróbce diamentów, eksperymentując z pyłem diamentowym zawieszonym w oleju i nanoszonym na tarcze szlifierskie. Dzięki temu [Root.GetAdjective] rzemieślnicy mogą nadawać tym rzadkim kamieniom zupełnie nowe kształty i znacznie zwiększać ich blask. Technika ta, zwana szlifem fasetowym, pozwala uzyskać kamienie o bardziej harmonijnych kształtach geometrycznych i lepszych właściwościach optycznych. Wraz z rozprzestrzenianiem się nowych kamieni i metod ich obróbki na dworach oraz w warsztatach gwałtownie rośnie popyt na biżuterię, diamenty i kamienie szlachetne."
 prices.38.a: "Klejnoty potrafią olśniewać."
 FACETING: "Szlifowanie fasetowe"
 prices.39.t: "Diamenty nowego świata"
 prices.39.d: ""
 prices.39.a: "Diamenty są wieczne."
 BRAZILIAN_DIAMONDS: "Diamenty nowego świata"
 prices.40.t: "Odrzucenie kadzidła przez protestantów i reformowanych"
 prices.40.d: "Wielu teologów reformowanych i protestanckich odrzuca nie tylko bogate zdobienia kościołów katolickich, lecz także używanie kadzidła podczas obrzędów religijnych. Stosowanie wonności, świec i kadzideł jest coraz częściej uznawane za świętokradztwo. W rezultacie popyt na wszelkiego rodzaju kadzidła, które przez ponad tysiąc lat sprowadzano ze Wschodu do Europy, by pozyskiwać z nich olibanum i mirrę, zaczął wreszcie spadać."
 prices.40.a: "Niech wszystko spłonie."
 REFORMED_REJECTION_OF_INCENSE: "Odrzucenie kadzidła przez protestantów i reformowanych"
 prices.41.t: "Rozwój przemysłu perfumeryjnego"
 prices.41.d: "Rosnąca liczebność warstwy kupieckiej oraz coraz bardziej wymagające obyczaje społeczne szlachty i wyższych warstw zwiększyły popyt na perfumy. Oczekuje się dziś, że sale wielkich pałaców będą nie tylko majestatyczne, lecz także przyjemnie pachnące. Doprowadziło to do gwałtownego wzrostu zapotrzebowania na olibanum, mirrę i inne wonne surowce wykorzystywane do produkcji perfum. W mieście [perfume_city_grass.GetCapitalName] przetwarzanie miejscowych kwiatów i sprowadzanych wonności stało się wręcz odrębną, znaczącą gałęzią przemysłu."
 prices.41.a: "Najwyraźniej mają nosa do takich spraw."
 GROWTH_OF_PERFUME_BUSINESS: "Rozwój branży perfumeryjnej"
 prices.42.t: "Hodowla selektywna"
 prices.42.d: "Dzięki naukowej i intensywnej hodowli koni, świń, bydła i owiec [Root.GetAdjective] rolnicy zaczęli tworzyć zupełnie nowe rasy zwierząt, lepiej przystosowane do konkretnych zadań. Od stuleci poszczególne regiony słynęły z własnych ras hodowlanych, lecz pionierskie metody pokazują, jak łatwo człowiek może celowo udoskonalać zwierzęta.\nW rezultacie handel bydłem przeżywa odrodzenie, a jakość sprzedawanych zwierząt gwałtownie wzrasta — nie chodzi już tylko o zwiększanie ich liczby."
 prices.42.a: "Wybitny wynalazca."
 SELECTIVE_BREEDING: "Hodowla selektywna"
 prices.43.t: "Czeski kryształ"
 prices.43.d: "Przez wieki szkło weneckie dominowało w sektorze szklarskim, a mniejsze przedsiębiorstwa szklarskie starały się wiernie naśladować mistrzów z wyspy Murano. Czechy są regionem szklarskim od XII wieku, ale dzięki połączeniu rodzimej kredy z potażem w nowej metodzie, czescy szklarze są wreszcie w stanie rzucić wyzwanie weneckiemu szkłu. Nowy rodzaj czeskiego kryształu jest zarówno bardziej trwały, błyszczący, jak i wyraźnie różni się stylem od szkła weneckiego. Czeskie kryształowe żyrandole, szklana biżuteria i grawerowane szkło szybko stają się powszechnym widokiem na wszystkich dworach Europy."
 prices.43.a: "Czysty jak kryształ."
 BOHEMIAN_GLASS: "Czeskie szkło"
 prices.44.t: "Udoskonalenia w produkcji soczewek"
 prices.44.d: "Od XIII wieku okulary ze szklanymi soczewkami stopniowo zastępowały kamienie do czytania znane ze starszych epok. Dzięki dokładnym badaniom optycznym soczewki osiągnęły teraz taki poziom doskonałości, że pozwalają powiększać nawet najmniejsze przedmioty.\nKu radości uczonych można z nich tworzyć zarówno mikroskopy optyczne, umożliwiające badanie rzeczy dotąd niewidocznych, jak i teleskopy soczewkowe, pozwalające obserwować odległe obiekty, takie jak gwiazdy. Optyka stoi u progu rewolucji, która przyniesie ogromne korzyści nauce, nawigacji i sztuce wojennej."
 prices.44.a: "Możemy teraz widzieć odległe rzeczy tak, jakby znajdowały się tuż obok."
 MODERN_OPTICS: "Nowoczesna optyka"
 prices.45.t: "Szkło ołowiowe i kryształowe"
 prices.45.d: "Szklarze w prowincji [glass_province.GetName] zaczęli łączyć krzemień i piasek z ołowiem, aby uzyskać przejrzyste, łatwe w obróbce i pozbawione skaz szkło. Ta nowa metoda szybko rzuca wyzwanie dotychczasowym światowym ośrodkom szklarskim, ponieważ rynki zalewa nowy, niezwykle popularny produkt."
 prices.45.a: "Cudownie."
 LEAD_CRYSTAL: "Kryształ ołowiowy"
 prices.46.t: "Ulepszenia w wydobyciu węgla"
 prices.46.d: "Z biegiem czasu technologia znacznie zwiększyła wydajność istniejących kopalni węgla, a także umożliwiła wydobycie węgla w wielu miejscach, w których wcześniej byłoby to niewykonalne. Nasze kopalnie węgla pracują z bezprecedensową wydajnością i chociaż ciągła industrializacja nadal oznacza, że węgiel jest bardzo poszukiwany, popyt ten można teraz łatwiej zaspokoić."
 prices.46.a: "Doskonale."
 IMPROVED_COAL_MINING: "Większa dostępność węgla"
 trade_company_moluccas: "Czarter Molucki"
 TRADE_COMPANY_MOLUCCAS_Indonesia_Trade_Company: "Kompania Molucka"
