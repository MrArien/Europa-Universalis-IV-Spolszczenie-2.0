 tamil_traders_content: "Niezależni Tamilscy handlarze"
 desc_tamil_traders_content: "Region ten jest domem dla starych i potężnych gildii handlowych, którym pozwoliliśmy zachować stare przywileje w nadziei, że zmniejszy to napięcia między nimi a centralną administracją naszego kraju."
 tamil_traders_angered: "Zaniepokojone wspólnoty handlowe"
 desc_tamil_traders_angered: "Gildie kupieckie i rzemieślnicze tego regionu są zaniepokojone tym, że naruszyliśmy ich dawne przywileje."
 vadugan_settlement: "Teluscy osadnicy"
 desc_vadugan_settlement: "Teluscy osadnicy z północy zaczęli budować swoją własną społeczność w tym tamilskim regionie, co powoduje napięcia między nimi a istniejącą ludnością wiejską."
 rural_tamil_autonomy: "Obrona autonomii wiejskich wspólnot"
 desc_rural_tamil_autonomy: "Ograniczyliśmy migrację zewnętrzną na ten obszar i broniliśmy praw społeczności lokalnych poprzez ograniczenie napływu kolonistów wojskowych z północy."
 tamil_grandee: "Tamilijski możnowładca"
 desc_tamil_grandee: "To właśnie tutaj znajduje się baza wpływów lokalnego watażki Chellappy. Na razie wydaje się zadowolony z obecnej sytuacji, lecz stopniowo umacnia swoją władzę w regionie."
 pulicat_booming: "Wielki Port Pulicatu"
 desc_pulicat_booming: "Idealne położenie Pulicatu czyni go głównym portem sprowadzającym towary z wielkiego miasta Widźajanagar. Wraz ze wzrostem stolicy rośnie i port, a splot szczęśliwych okoliczności. W tej chwili jest to najbardziej okazały port na Oceanie Indyjskim."
 tirupati_tirumala_temple_complex: "Kompleks świątynny Tirupati-Tirumala"
 desc_tirupati_tirumala_temple_complex: "Jako główna świątynia patronowana przez nasz stan, kompleks w Tirupati urósł do rangi jednego z największych klejnotów Indii. Podczas gdy sam fakt, że miasto świątynne kontroluje tak wiele wiosek na tym obszarze nieznacznie zmniejsza nasze dochody tutaj, jest to więcej niż rekompensata za sławę, jaką świątynia daje naszemu stanowi."
 flavor_vij.11.t: "Tamilskie gildie handlowe"
 flavor_vij.11.d: "Imperium Widźajanagaru, którego zaplecze wojskowe znajdowało się na suchych wyżynach zamieszkanych przez ludy mówiące językami kannada i telugu na płaskowyżu Dekan, od zawsze miało trudności z utrzymaniem w ryzach tętniących życiem miast handlowych południowej krainy Tamilów.\nDo naszej stolicy przybyło właśnie poselstwo reprezentujące wiele najważniejszych tamilskich gildii kupieckich. Jego członkowie żądają poszanowania dawnych tradycji i praw.\nNie proszą o drobne ustępstwa — oczekują raczej zapewnienia, że będziemy pozostawiać im znaczną swobodę działania."
 flavor_vij.11.a: "Możemy pozwolić im na większą autonomię."
 flavor_vij.11.b: "Musimy trzymać tych sklepikarzy krótko."
 flavor_vij.12.t: "Migracja Wadugów"
 flavor_vij.12.d: "Od założenia naszego imperium nieprzerwany strumień osadników mówiących językiem telugu napływa z północnej Telingany na południe, na nasze ziemie. Dotychczas hojnie przydzielaliśmy im grunty do zagospodarowania na słabo zaludnionych obszarach państwa i budowaliśmy zbiorniki wodne, by wspierać rozwój ich osad. Dzięki temu zyskaliśmy liczne i lojalne źródło rekrutów dla naszych armii.\nOstatnio jednak osadnicy ci, nazywani przez Tamilów Wadugami, zaczęli przesuwać się jeszcze dalej na południe, na obszary zamieszkane przez ludność tamilską. Tamilskie społeczności rolnicze domagają się, by pozwolono im powstrzymać napływ osadników telugu na ich ziemie."
 flavor_vij.12.a: "Zignoruj ten protest."
 flavor_vij.12.b: "Pomóż chłopom bronić swoich domów."
 flavor_vij.13.t: "Wzrost znaczenia Chellappy Narasimhy"
 flavor_vij.13.d: "Autonomia naszych posiadłości w krainie Tamilów stworzyła doskonałe warunki do zbudowania lokalnej bazy władzy przez ambitnego możnowładcę.\nCzłowiek ten, znany jako Chellappa, poprosił o zgodę na służbę w charakterze generała i sprawia wrażenie zadowolonego z działania w ramach struktur naszego imperium. Powszechnie jednak uważa się, że człowiek tak ambitny musi mierzyć znacznie wyżej niż tylko w stanowisko wojskowe. Łatwo byłoby odmówić mu zaszczytu, o który zabiega, i spróbować odsunąć go od polityki, lecz ryzykujemy w ten sposób zrażenie do siebie człowieka kontrolującego znaczną część naszego gospodarczego serca.\nZ drugiej strony być może najrozsądniej byłoby uderzyć już teraz, zamiast przedłużać konflikt, który wielu uważa za nieunikniony."
 flavor_vij.13.a: "Trzymaj przyjaciół blisko, a wrogów jeszcze bliżej."
 flavor_vij.13.b: "Spróbujmy ograniczyć jego wpływy do tamilskiej bazy władzy."
 flavor_vij.13.c: "Uderzmy teraz i zmiażdżmy go, zanim urośnie w siłę."
 flavor_vij.14.t: "Bunt Chellappy"
 flavor_vij.14.d: "Wygląda na to, że nasz generał Chellappa spiskował, by samemu sięgnąć po tron!\n\nPrzyjął teraz imię Narasimha Saluva, zebrał wierne sobie wojska i maszeruje na stolicę."
 flavor_vij.14.a: "Rozumiem."
 flavor_vij.15.t: "Bunt Chellappy"
 flavor_vij.15.d: "Wodzowie ziem tamilskich dali się zwieść i uwierzyli, że lepiej będzie im we własnym państwie niż w granicach naszego imperium. Lokalny możnowładca Chellappa Saluva zebrał armię i próbuje utworzyć własne państwo na obszarze, który już faktycznie znajduje się pod jego kontrolą."
 flavor_vij.15.a: "Rozumiem."
 flavor_vij.16.t: "Marginalizacja Chellappy"
 flavor_vij.16.d: "Z biegiem czasu wpływy Chellappy osłabły. Nie jest już nową ani obiecującą postacią, dlatego przestał odgrywać istotną rolę w polityce tamilskiej."
 flavor_vij.16.a: "Rozumiem."
 flavor_vij.17.t: "Pulicat"
 flavor_vij.17.d: "Północne Wybrzeże Koromandelskie, a w szczególności miasto Pulicat, ma zasadnicze znaczenie dla naszego imperium. To przez ten przybrzeżny region wszystkie dobra Wschodu docierają do liczącej 500 000 dusz stolicy naszego cesarstwa.\nW miarę jak region odradza się po orisańskiej okupacji, a stolica Widźajanagar wciąż się powiększa, wydaje się, że port wkroczył w złotą erę wzrostu gospodarczego i dobrobytu."
 flavor_vij.17.a: "Rozumiem."
 flavor_vij.18.t: "Kompleks świątynny Tirupati-Tirumala"
 flavor_vij.18.d: "Być może najwspanialsza świątynia w całym naszym państwie — wielka świątynia Wenkateswary wraz z przyległym miastem świątynnym Tirupati — jest coraz silniej związana z władcami naszego kraju. Z biegiem lat z ważnego miejsca pielgrzymkowego przekształciła się w jedno z największych miast świątynnych Indii. Jej funkcjonowanie wspierają niezliczone dary i kosztowności, a także ponad 40 wsi dostarczających żywność i dochody.\nNie powinniśmy jednak na tym poprzestać. Zwiększając nasze wsparcie, przekazując świątyni kolejne wsie i dary, możemy uczynić z niej największe miasto świątynne całych południowych Indii. Niech Tirupati rozkwita tak długo, jak długo rosnąć będzie nasze imperium!"
 flavor_vij.18.a: "Złóżmy hojny dar."
 flavor_vij.18.b: "Ograniczmy nasze wsparcie do skromniejszych datków."
 flavor_vij.19.t: "Abd-ur-Razzaq, wysłannik dworu Timurydów"
 flavor_vij.19.d: "Do naszej stolicy przybył dziś ambasador Szahrucha z odległej Samarkandy. Timurydzki wysłannik przebył długą drogę i widział po drodze wiele wspaniałych miejsc, lecz to, co zastał w naszym wielkim mieście, wywarło na nim szczególne wrażenie. Jego wiedza o świecie poza Indiami oraz spostrzeżenia dotyczące ziem naszych bezpośrednich sąsiadów będą dla nas niezwykle cenne."
 flavor_vij.19.a: "Rozumiem."
 flavor_vij.20.t: "Cesarska stolica Ćalukjów"
 flavor_vij.20.d: "Choć już dawno temu zniknęło, Imperium Ćalukja, rozciągające się od Dekanu po królestwa Tamilów, jest wciąż wspominane. W miarę jak nasze własne imperium rozszerzało się i rozwijało, poeci i kronikarze pisali tak, jakby Widźajanagar było odrodzonym imperium Ćalukja. Teraz, gdy zajęliśmy starożytną stolicę Ćalukji, Kalyanę, położoną niedaleko dawnej stolicy bahmańskiej Bidar, mamy możliwość przeniesienia Dworu do północnego miasta, abyśmy mogli uznać dziedzictwo Ćalukji za własne.\n\nTradycyjna stolica w Widźajanagar, Mieście Zwycięstwa, pozostaje wszak wielkim i prestiżowym miastem, które pozwala nam wykuwać własne imperialne dziedzictwo."
 flavor_vij.20.a: "Miasto Zwycięstwa pozostanie naszą stolicą."
 flavor_vij.20.b: "Przejmiemy dziedzictwo Ćalukjów i przeniesiemy stolicę do Kaljany!"
 flavor_vij.20.c: "Pozostawmy stolicę tam, gdzie znajduje się obecnie."
 flavor_vij.21.t: "Miasto Zwycięstwa"
 flavor_vij.21.d: "Imperium Widźajanagaru odniosło zwycięstwo nad wszystkimi wrogami. Nowo powstały sułtanat Bahmanidów został całkowicie pokonany, tamilscy królowie posłusznie uznają nasze zwierzchnictwo, a do naszych posiadłości przyłączyliśmy nawet Andhrę i Lankę. W stolicy trwają uczty i festiwale, świętujące nasze zwycięstwo w południowych Indiach. Maharadża nadaje sobie tytuł Ćhatrapatiego, [Root.Owner.Monarch.GetHerselfHimself], wysyłając światu jasny sygnał: Widźajanagar nie podporządkuje się żadnej obcej potędze."
 flavor_vij.21.a: "Zwyciężyliśmy!"
 aow_trade_goods_events.1.t: "Tropikalne drewno"
 aow_trade_goods_events.1.d: "Nasi koloniści informują, że gęste puszcze, porastające prowincję $PROVINCENAME$, pełne są wyjątkowo pięknych i rzadkich gatunków drewna."
 aow_trade_goods_events.1.a: "To dobra wiadomość"
 aow_trade_goods_events.2.t: "Barwniki"
 aow_trade_goods_events.2.d: "Nasi koloniści informują, że prowincja $PROVINCENAME$ jest domem dla roślin, z których można produkować barwniki."
 aow_trade_goods_events.2.a: "To dobra wiadomość"
