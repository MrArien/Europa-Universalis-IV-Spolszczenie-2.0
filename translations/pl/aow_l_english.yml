 ALLOW_FOREIGN_ARMIES_TITLE: "§YPozwól sojusznikom wejść na pokład§!"
 ALLOW_FOREIGN_ARMIES_DESC: "Zezwól armiom sojuszniczym wsiąść na okręty tej floty, by mogła je przetransportować."
 STOP_ALLOW_FOREIGN_ARMIES_TITLE: "§YZabroń sojusznikom wejść na pokład§!"
 STOP_ALLOW_FOREIGN_ARMIES_DESC: "Zabroń armiom sojuszniczym wsiadać na te okręty."
