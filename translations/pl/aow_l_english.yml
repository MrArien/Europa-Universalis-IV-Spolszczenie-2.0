 tyw_events.29.t: "Poszukująca schronienia [From.Culture.GetName] szlachta"
 tyw_events.29.d: "Okupacja miasta [From.Capital.GetCapitalName] przeraziła wielu spośród szlachty [From.GetAdjective], powodując ich ucieczkę z kraju i nadzieję na znalezienie schronienia wśród innych wyznawców [Root.Religion.GetReligion_gen]. Ponieważ konflikt ma podłoże religijne, przynajmniej na pierwszy rzut oka, powinniśmy pomagać tym, którzy podzielają naszą wiarę. Jednak oczy wrogów Ligi są zawsze zwrócone na nas i jest wielu, którzy nie byliby zadowoleni, widząc swoich wrogów pod naszą ochroną."
 tyw_events.29.a: "Z pewnością są inni, którzy mogą udźwignąć ten ciężar."
 tyw_events.29.b: "Wierni z [Root.Religion.GetReligion_gen] zawsze znajdą tu schronienie."
