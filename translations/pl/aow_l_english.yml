 prices.14.d: "Dawne armie zaciągowe są coraz częściej zastępowane przez bardziej trwałe armie narodowe. W ramach tego procesu wiele państw zaczęło regulować wygląd mundurów swoich żołnierzy, a niektóre z nich zaczęły nawet dostarczać je swoim żołnierzom. Barwnik nigdy nie był tani, a wraz ze wzrostem popytu zarówno na barwniki, jak i tkaniny, ceny rosną."
