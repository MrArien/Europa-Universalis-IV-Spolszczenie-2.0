 flavor_kbo.6.t: "$MONARCH$ wprowadza reformy"
 flavor_kbo.6.d: "Zainspirowany tym, co zobaczył podczas pielgrzymki, nasz $MONARCHTITLE$ $MONARCH$ zdecydował, że nasze królestwo musi zmodernizować swoją armię i gospodarkę. $MONARCH$ podjął istotne działania mające na celu wzmocnienie naszej kawalerii, zaproszenia tureckich strzelców i przyjęcia technik administracyjnych, które widział wśród naszych muzułmańskich braci w drodze do Mekki."
 flavor_kbo.6.a: "Zreformuj gospodarkę i armię."
 flavor_kbo.6.b: "Skup się na armii."
 flavor_kbo.6.c: "Skup się na gospodarce."
