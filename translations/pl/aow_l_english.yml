 march_bonus: "Jest marchią"
 MARCH_EFFECT: "Marchia nie płaci żadnych podatków swojemu Zwierzchnikowi, a Zwierzchnik nie może ich anektować.\nJeśli całkowity rozwój Marchii jest nie większy niż §Y$MAXDEV$%§! jej Zwierzchnika (obecnie $RATIO$), otrzymuje ona także następujące bonusy:\n$EFFECT$"
