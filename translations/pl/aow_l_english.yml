 HRE_RELIGIOUS_WAR: "§YWojna religijna§!"
 HRE_RELIGIOUS_WAR_DESC: "W Świętym Cesarstwie Rzymskim toczy się wojna religijna pomiędzy katolikami i protestantami. Podczas wojny religijnej można dołączyć do ligi protestanckiej lub katolickiej. Liga wyznania, które nie jest dominujące, może wypowiedzieć cesarzowi wojnę, próbując zmienić dominującą religię w Cesarstwie."
 HRE_RELIGIOUS_PEACE: "§YPokój religijny§!"
 HRE_RELIGIOUS_PEACE_DESC: "W Cesarstwie wprowadzono w życie traktat o trwałym pokoju religijnym. Poszczególni książęta mogą samodzielnie wybierać sobie wiarę, a cesarz może być dowolnego wyznania."
