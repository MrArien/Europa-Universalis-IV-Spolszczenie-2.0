 flavor_jnp.6.t: ""
 flavor_jnp.6.d: "Niedaleko Jaunpuru leży Waranasi — jedno z najstarszych miast świata i najświętsze miejsce hinduizmu. Każdego dnia niezliczeni indyjscy pielgrzymi przemierzają nasze ziemie, by dotrzeć nie tylko do Waranasi, lecz także do wielu innych świętych miejsc hinduizmu, buddyzmu i dżinizmu w regionie, który kontrolujemy.\nPodróżni ci, kierowani przekonaniami religijnymi, podejmą próbę dotarcia do celu niemal niezależnie od przeszkód, jakie moglibyśmy im stawiać. Nasz wezyr zaproponował więc, byśmy — podobnie jak wcześniej sułtani Delhi — nałożyli specjalny podatek na wszystkich pielgrzymów odwiedzających święte miejsca na naszych ziemiach. Takie rozwiązanie zapewniłoby skarbowi stałe dochody, lecz byłoby bardzo niepopularne wśród naszych nie-muzułmańskich poddanych."
 flavor_jnp.6.a: "Potrzebujemy podatku pielgrzymkowego."
 flavor_jnp.6.b: "Pozwólmy pielgrzymom podróżować bez przeszkód."
 flavor_jnp.7.t: "Sadak-e-Azam"
 flavor_jnp.7.d: "Przez sam środek naszych ziem, od Bengalu aż po Kabul, biegnie jeden z najstarszych szlaków handlowych świata. Sadak-e-Azam jest handlową arterią północnych Indii i drogą, którą większość towarów oraz kupców przybywa na nasze ziemie lub je opuszcza. Zapewnienie podróżnym bezpieczniejszej i szybszej przeprawy powinno być priorytetem naszego sułtanatu, jak i każdej innej władzy, przez której terytorium przebiega ten szlak. Zasugerowano, że naprawa istniejącej drogi i uzupełnienie dotychczasowych punktów postoju siecią naszych własnych karawanserajów znacznie ułatwiłoby podróż wielu kupcom."
 flavor_jnp.7.a: "Zainwestujmy w Sadak-e-Azam."
 flavor_jnp.7.b: "Kupcy powinni sami pokrywać swoje wydatki."
 flavor_jnp.8.t: "Gubernator Kalpi"
 flavor_jnp.8.d: "Między płaskowyżem Malwy a równinami sułtanatu Jaunpuru leży niewielkie państwo Kalpi. Od lat obszar ten był przedmiotem sporów między nami a sułtanami Malwy, aż w 1433 roku ostatecznie dostał się w ich ręce.\nPogłoski o niewłaściwym traktowaniu muzułmańskich dziewcząt na dworze gubernatora Malwy podsyciły ostatnio oburzenie wśród naszej muzułmańskiej ludności. Być może właśnie na taką sposobność czekaliśmy..."
 flavor_jnp.8.a: "Zażądajmy prawa do ukarania Kalpi."
 flavor_jnp.8.b: "Pozostawmy tę sprawę bez dalszego biegu."
 flavor_jnp.9.t: "Los Kalpi"
 flavor_jnp.9.d: "Posłowie sułtanów Jaunpuru twierdzą, że sułtan Kalpi, nasz wasal, źle traktuje muzułmanki i musi zostać ukarany. Władcy Jaunpuru chcą wziąć sprawy w swoje ręce i przeprowadzić karną wyprawę przeciwko Kalpi.\nSłyszeliśmy również pogłoski o sytuacji w Kalpi, lecz tę decyzję należy dobrze rozważyć. Kalpi od dawna jest obszarem spornym między Jaunpurem a Malwą i niewykluczone, że Jaunpurczycy mają znacznie większe ambicje, niż przyznają."
 flavor_jnp.9.a: "Pozwólmy Jaunpurczykom ukarać Kalpi."
 flavor_jnp.9.b: "Musimy wspierać naszego wasala."
 flavor_jnp.10.t: "Kalpi — uzyskano zgodę"
 flavor_jnp.10.d: "Malwa zgodziła się pozwolić nam ukarać sułtana Kalpi, licząc na poprawę stosunków między naszymi państwami."
 flavor_jnp.10.a: "Wspaniale!"
 flavor_jnp.11.t: "Sułtan Malwy odmawia"
 flavor_jnp.11.d: "Malwa jasno dała do zrozumienia, że każda wyprawa karna przeciwko Kalpi będzie oznaczała również wojnę z nią."
 flavor_jnp.11.a: "Rozumiem."
 javan_region: "Jawa"
