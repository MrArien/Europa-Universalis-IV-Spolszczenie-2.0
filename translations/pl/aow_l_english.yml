 per_najaf: "Sanktuarium w Nedżefie"
 desc_per_najaf: "Nedżef, miejsce ostatniego spoczynku Alego, jest dla szyitów jednym z najświętszych miejsc na ziemi. Jako opiekunowie tego świętego miasta wykonaliśmy różne projekty, aby uczynić to miejsce takim, jakim powinno być."
 per_miniature_school: "Perska szkoła malarstwa miniaturowego"
 desc_per_miniature_school: "Malarstwo miniaturowe kwitnie. Każdy, kto znaczy choć trochę w świecie islamskim, pragnie nabyć lub naśladować dzieła naszych mistrzów."
 per_mushashaiya: "Musha'sha'iyyah"
 desc_per_mushashaiya: "Bojowa sekta Musha'sha'iyyaha opanowała tę prowincję, co doprowadziło do niepokojów i niestabilności społecznej."
 per_safawiya: "Safawijja"
 desc_per_safawiya: "Wojowniczy zakon Safawidów opanował tę prowincję i wielu jej mieszkańców pragnie dołączyć do członków swojej wiary."
 per_shia_conversion_policy: "Państwo szyickie"
 desc_per_shia_conversion_policy: "Silny kraj to kraj o silnej wierze. Aktywnie promujemy szyizm imamicki jako wiarę dla mieszkańców Persji."
 per_pragmatic_ulema: "Nawrócenie duchowieństwa"
 desc_per_pragmatic_ulema: "Przyjęliśmy politykę hojnych nagród dla duchownych sunnickich, którzy przechodzą na naszą nową religię państwową."
