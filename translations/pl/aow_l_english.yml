 TRIANGLE_TRADE: "Handel trójkątny"
 prices.1.t: "Handel trójkątny"
 prices.1.d: "Kiedy europejskie państwa zaczęły kolonizować Amerykę Północną i Południową stworzyły duże plantacje celem produkcji bawełny, tytoniu i cukru. Najpierw próbowali wykorzystać miejscową ludność jako niewolników, ale ci szybko powymierali. Następnie sprowadzono niewolników z Afryki, co stworzyło trójkątny system handlu. W Europie sprzedawano tekstylia, rum i towary rzemieślnicze do Afryki; w Afryce sprzedawano niewolników do Ameryki; W Ameryce sprzedawano bawełnę, cukier i tytoń do Europy."
 prices.1.a: "Spowoduje to zwiększenie popytu na niewolników."
 EUROPEANS_IN_CHINA: "Europejscy handlarze w Chinach"
 prices.2.t: "Europejscy handlarze w Chinach"
 prices.2.d: "Dzięki sporemu kontyngentowi europejskich handlarzy w Chinach, popyt na chińską porcelanę gwałtownie wzrósł. Wszyscy Europejczycy domagają chińskiej porcelany, a Chińczycy przyjmują tylko srebrno i złoto jako zapłatę."
 prices.2.a: "Spowoduje to zwiększenie popytu na chińską porcelanę."
 JOHAN_FRIEDRICH_BOTTGER: "Produkcja porcelany w Europie"
 prices.3.t: "Porcelana w Miśni"
 prices.3.d: "Nasi wynalazcy spędzili trochę czasu na badaniu próbek porcelany, które nasi handlarze przywieźli z Chin. Twierdzą, że odkryli tajemnice jej produkcji. Próbki, z którymi miał[Root.Owner.Monarch.GetANoun] okazję zapoznać się [Root.Owner.Monarch.GetTitle] [Root.Owner.Monarch.GetName] są z pewnością bardzo dobre i przyniosą znaczne bogactwo, jeśli będą mogły być produkowane w dużych ilościach. Teraz proszą nas o dotację na założenie manufaktury porcelany, która - jak twierdzą - pozwoli im opanować niemiecki rynek wyrobów porcelanowych."
 prices.3.a: "Porcelana będzie naszą ścieżką do bogactwa."
 PROTESTANT_DONT_EAT_FISH: "Protestanci nie jedzą ryb"
 prices.4.t: "Zakorzenienie protestantyzmu"
 prices.4.d: "Kiedy protestantyzm jest przyjmowany w coraz większej ilości katolickich państw, tym mniej ludzi przestrzega Wielkiego Postu. Bez tych czterdziestu dni, kiedy wszyscy porządni katolicy nie mogą jeść mięsą i zmuszeni są do jedzenia ryb, popyt na ryby maleje."
 prices.4.a: "Spowoduje to zmniejszenie popytu na ryby."
 COFFEE_BOOM: "Boom kawowy"
 prices.5.t: "Boom kawowy"
 prices.5.d: "Kawa, która początkowo była napojem kojarzonym ze światem muzułmańskim, z czasem stała się powszechna nawet wśród chrześcijan w Europie. W coraz bardziej połączonym świecie zdobywanie czegokolwiek, w tym kawy, nie jest już tak trudne, jak kiedyś. W rezultacie kawiarnie są coraz częściej zakładane w Europie, a egzotyczne ziarna są coraz bardziej poszukiwane."
 prices.5.a: "Spowoduje to wzrost cen kawy."
 COTTON_IMPORTS: "Import europejskiej bawełny"
 COTTON_IMPORTS_BANNED: "Import bawełny zakazany"
 prices.6.t: "Import bawełny"
 prices.6.d: "W epoce renesansu, indyjskie tkaniny bawełniane stały się w Europie bardziej popularne. Ostatecznie [Root.GetAdjective] przemysł bawełniany znalazł się silną presją i zażądał zakazu importu bawełny."
 prices.6.a: "Nie będziemy ograniczać wolnego handlu."
 prices.6.b: "Merkantylizm jest właściwą drogą."
 TEA_AND_SUGAR: "Herbata i cukier"
 prices.7.t: "Herbaty i cukru"
 prices.7.d: "Pochodząca z Chin herbata, pojawiwszy się w [Root.GetAdjective], szybko stała się miejscowym narodowym napojem. Słodzoną cukrem herbatą raczą się bogaci, biedni, a nawet [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 prices.7.a: "Spowoduje to zwiększenie popytu na herbatę i cukier."
 SPICE_TRADE: "Handel przyprawami"
 prices.8.t: "Handel przyprawami"
 prices.8.d: "Odkrycie wschodnioindyjskiego szlaku handlowego zapoczątkowało wiek handlu przyprawami. Mając dostęp do nowych szlaków handlowych, kontrola przepływu przypraw takich jak pieprz i cynamom stała się ważniejsza niż kiedykolwiek wcześniej."
 prices.8.a: "Spowoduje to wzrost cen przypraw."
 ABOLITIONISM: "Abolicjonizm"
 prices.9.t: "Abolicjonizm"
 prices.9.d: "Teraz, kiedy niewolnictwo zostało zakazane w [Root.GetName], a inne kraje również mogą pójść w tym kierunku, wydaje się, że transatlantycki handel niewolnikami odnotuje gwałtowny spadek."
 prices.9.a: "Spowoduje to zmniejszenie popytu na niewolników."
 HUAYNAPUTINA: "Erupcja Huaynaputiny"
 prices.10.t: "Erupcja Huaynaputiny"
 prices.10.d: "W lutym 1600 r., nastąpiła ogromna erupcja peruwiańskiego wulkanu Huaynaputina. Skutki wybuchu były odczuwalne na całym świecie, gdzie głód zabił miliony ludzi z powodu upadku handlu zbożem i winem."
 prices.10.a: "Zboże i wino będą teraz mniej opłacalne."
