 HRE_PERMANENT_RELIGION: "§Y$RELIGION$§! jest religią oficjalną"
 HRE_PERMANENT_RELIGION_DESC: "§Y$RELIGION$§! jest oficjalną religią Świętego Cesarstwa Rzymskiego. Tylko władcy wyznający §Y$RELIGION$§! mają prawo starać się o tron cesarski. Również wszyscy elektorzy muszą wyznawać §Y$RELIGION$§!. Cesarz może użyć działania dyplomatycznego - narzucenia jedności religijnej - na państwach członkowskich innego wyznania."
