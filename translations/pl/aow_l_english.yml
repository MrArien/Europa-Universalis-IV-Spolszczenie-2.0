 mor_crisis: "Kryzys maghrebski"
 desc_mor_crisis: "Cały Maghreb ma za sobą wiele złych lat, po których wciąż się podnosi. Miejmy nadzieję, że wkrótce sprawy znów nabiorą tempa."
 mor_andalucian_moors: "Andaluzyjscy Maurowie"
 desc_mor_andalucian_moors: "Wielu andaluzyjskich Maurów osiedliło się w naszych miastach, wzbogacając kulturę miejską, a wraz z nią nasze państwo."
 mor_idrisid_cult_soaring: "Rozkwit kultu Idrysydów"
 desc_mor_idrisid_cult_soaring: "Kult Idrisa rośnie szybciej, niż ktokolwiek mógł sobie wyobrazić. Ten niezwykle popularny ruch może nie będzie trwał wieczne, ale teraz rozpala serca naszego ludu."
 flavor_mor.1.t: "Kryzys maghrebski"
 flavor_mor.1.d: "Ostatnie stulecie było dla państw Maghrebu okresem ciężkich prób i bezlitosnych nieszczęść. Postępujące pustynnienie, kurczenie się ludności miejskiej, powszechne klęski głodu oraz coraz silniejsze grupy nieposłusznych koczowników przemierzających prowincje sprawiły, że większość państw Afryki Północnej ma już za sobą znacznie lepsze czasy.\nOstatnio sytuacja nieco się poprawia: rozwija się handel wewnętrzny i ponownie widać oznaki urbanizacji. Nasze państwa wciąż są jednak cieniem dawnej potęgi. Wielu obawia się, że gdy tylko Iberyjczycy rozprawią się z Królestwem Grenady, zwrócą się przeciwko nam."
 flavor_mor.1.a: "Pozwólmy im spróbować! Powinniśmy wznowić powstanie!"
 flavor_mor.2.t: "Mauretańscy uchodźcy"
 flavor_mor.2.d: "Hiszpania wybrała wypędzenie Maurów, którzy nadal rezydują w ich granicach. Ogromna ilość andaluzyjskich, mauretańskich uchodźców dotarła do naszych portów i pyta o pozwolenie wstępu do naszego kraju. Podczas, gdy boli nas wypędzenie tych ludzi z własnych domów, to może być błogosławieństwo dla naszego królestwa. Większość uchodźców to mieszkańcy miast, rzemieślnicy, scholarzy, artyści i urzędnicy. Właśnie tego rodzaju mieszkańcy naszych miast mają wielki niedobór po wielkim kryzysie Magrebu."
 flavor_mor.2.a: "Witamy naszych braci w wierze."
 flavor_mor.3.t: "Muhammad al-Dżazuli i Dala’il al-chajrat"
 flavor_mor.3.d: "Słynny przywódca suficki, pochodzący z doliny Sus, niedawno powrócił po długim pobycie w Hidżazie i szybko zdobywa popularność w naszym królestwie. Al-Dżazuli przywiózł ze świętej ziemi dzieło „Dalā'il al-Khayrāt” — zbiór modlitw i litanii, w których prosi się Boga o błogosławieństwo, miłosierdzie i łaskę dla Mahometa.\nW przeciwieństwie do samego Al-Dżazuliego księga może trafić do wielu miejsc. Jej niezwykła popularność sprawia, że prawdopodobnie przetrwa zarówno autora, jak i naszą dynastię."
 flavor_mor.3.a: "Rozumiem."
 flavor_mor.4.t: "Idrysydzki Kult w Fezie"
 flavor_mor.4.d: "Spełniając przepowiednię starej legendy, kilka lat temu doskonale zachowane ciało Idrisa II znaleziono w jednym z meczetów Fezu. Od tamtej pory idrysydzcy Szarifowie rozwijają ten kult nie tylko w Fezie, ale i w całym królestwie.\nWydaje się, że ten pobożny kult może poprawić nastroje naszej populacji po trudnym okresie, który mamy za sobą. Z tak uduchowionymi kultami jak ten zawsze związane jest pewne ryzyko, więc warto też przypominać, kto dzierży władzę doczesną."
 flavor_mor.4.a: "Wesprzyjmy Idrysydów."
 flavor_mor.4.b: "Pozwólmy im na reprezentację, lecz nie udzielajmy oficjalnego wsparcia."
 flavor_mor.5.t: "Abu Zakarija Jahja al-Wattasi"
 flavor_mor.5.d: "Wbrew tytulaturze, Maroko ma nie jedną, lecz dwie królewskie dynastie. Od dwudziestu lat niemal całą władzę, która formalnie przynależy dynastii Marynidów, w rzeczywistości sprawuje potężny wezyr Abu Zakarija Jahja z dynastii Wattasydów.\nNiezwykłą popularność zyskał on po zwycięstwie nad Portugalią w 1437 roku i objęciu opieką kultu Idrysidów w Fezie. Abu Zakarija Jahja sprawił, że biurokracja królewska, wypełniona członkami rodziny Wattasydów, funkcjonuje bez zarzutu. Ponieważ Wattasydzi są spokrewnieni z Marynidami, nie wzbudza to niczyjego niepokoju. Teraz, gdy Abu Zakarija Jahja leży na łożu śmierci, także nie ma wątpliwości, co przyniesie przyszłość. Ten wielki człowiek najwyraźniej nic nie pozostawił przypadkowi i zawczasu ustalił, że to jego kuzyn będzie kolejnym wezyrem. Pozostaje wszak niejasne, co rodzina Wattasydów uczyni z siecią powiązań, którą starannie uplótł Jahja."
 flavor_mor.5.a: "Straciliśmy wielkiego człowieka."
 flavor_mor.6.t: "Spisek Wattasydów?"
 flavor_mor.6.d: "Teraz jest już dla nas jasne, że pozwoliliśmy rodzinie Wattasydów zdobyć zbyt wielkie wpływy i władzę w naszym królestwie. Jeśli nie ograniczymy ich potęgi teraz, później możemy już nie mieć takiej możliwości. Sułtan $MONARCH$ jest przekonany, że przeciwko tronowi zawiązano spisek."
 flavor_mor.6.a: "Zabić ich wszystkich!"
 flavor_mor.6.b: "Zostaną naszymi zaufanymi doradcami."
 flavor_mor.7.t: "Bunt Wattasydów."
 flavor_mor.7.d: "Nasz sułtan dopuścił się nagłej zdrady wobec wezyrów z rodu Wattasydów — kazał pojmać i stracić wszystkich członków tej rodziny, których udało się odnaleźć. Wattasydzi cieszą się jednak dużą popularnością, dlatego decyzja ta spotkała się z powszechnym oburzeniem.\nGdy wczoraj $MONARCH$ mianował nowego wezyra, nienależącego do rodu Wattasydów, wybuchły zamieszki. Krążą pogłoski, że gdzieś ukrywa się jeszcze dwóch braci Wattasydów, którzy chcą przejąć kontrolę nad buntem i pomścić swoją rodzinę."
 flavor_mor.7.a: "Rozumiem."
 flavor_mor.8.t: "Ultimatum Wattasydów"
 flavor_mor.8.d: "Wygląda na to, że podejrzenia wobec naszych wezyrów z rodu Wattasydów były uzasadnione. Dziś sułtan otrzymał ultimatum od Muhammada al-Wattasiego. Musi albo dobrowolnie zrzec się tronu, albo liczyć się z otwartym buntem przeciwko swojej władzy."
 flavor_mor.8.a: "Abdykuj"
 flavor_mor.8.b: "Tron jest mój!"
 flavor_mor.9.t: "Sudańska Ekspedycja"
 flavor_mor.9.d: "Od stuleci polegaliśmy na karawanach przewożących sól i złoto przez Saharę.\nPomimo sprzeciwu niemal wszystkich doradców $MONARCH$ obstaje teraz przy tym, że musimy samodzielnie zabezpieczyć ten szlak handlowy. Tuaregowie nie są godni zaufania, jeśli chodzi o ochronę karawan, a możemy być niemal pewni, że nasze królestwo skuteczniej zadba o źródła tych cennych towarów, jeśli przejmie nad nimi bezpośrednią kontrolę."
 flavor_mor.9.a: "Przejdźmy przez Saharę!"
 flavor_mor.9.b: "To jest oszukańcze zadanie, pustyni nie da się kontrolować."
 flavor_mor.10.t: "Sudańska Ekspedycja"
 flavor_mor.10.d: "Marokańskie armie postępują wgłąb południowej Sahary wzdłuż trasy Oazy Tuat."
 flavor_mor.10.a: "To nie może być dobre."
 flavor_mor.12.t: "Imperialne Miasta"
 flavor_mor.12.desc: "W swojej historii, kilka wielkich miast miały zaszczyt być centrum politycznym Sułtanatu Maroka. Pod zwierzchnictwem Idryzydów i Marynidów, północne miasto Fez miało uprzywilejowane miejsce w rządzie, pozwalając jego władcom rywalizować z ich wrogami w Iberii i we wschodnim Magrebie. Almaworydzi i Almochadzi uprzywilejowali południowe miasto Marrakesz, gdy Kalif Yaqub al-Mansur postanowił ustanowić stolicę w Rabacie. Niektórzy na dworze uważają, iż za polityczne centrum może służyć Meknes. Żadne z tych miast nie może być dobrą stolicą dla naszego państwa."
 flavor_mor.12.a: "Fez powinien być stolicą."
 flavor_mor.12.b: "Marrakesz powinien być stolicą."
 flavor_mor.12.c: "Meknes powinno być stolicą."
 flavor_mor.12.d: "Rabat powinien być stolicą."
 flavor_mor.13.t: "Poruszenia na Południu"
 flavor_mor.13.desc: "W następstwie konfliktu między Wattasydami a Marynidami południowe potęgi zaczęły się poruszać. Wyczuwając słabość, sufici, plemiona i emirowie zawierają między sobą sojusze oraz układy małżeńskie. Wielu członków dworu [Root.Monarch.GetTitle] woli pozostawić ich własnym sprawom i zamknąć się w [Root.Capital.GetName], lecz zagrożenie z południa będzie tylko rosło, jeśli nie podejmiemy działań."
 flavor_mor.13.a: "Pokaz siły przypomni im, gdzie jest ich miejsce."
 flavor_mor.13.b: "Powinniśmy pozostawić ich własnym sprawom."
 fulo_spawning_region: "Fulanie"
 mal_fulani_migration: "Ekspansja Fulanów"
 desc_mal_fulani_migration: "Koczownicy Fulbe zaczęli przenikać przez nasze granice w tym regionie i aktywnie podważają naszą władzę nad poddanymi."
 mal_islamisation_of_the_aristocracy: "Islamizacja Arystokracji"
 desc_mal_islamisation_of_the_aristocracy: "Nauki islamu stopniowo przenikają od części arystokracji do zwykłych mieszkańców naszego imperium. Choć wywołuje to pewne napięcia między tradycjonalistami a konwertytami, w dłuższej perspektywie niewątpliwie przyczyni się do większej stabilności państwa."
 mal_portuguese_meddling: "Zewnętrzne Interwencje"
 desc_mal_portuguese_meddling: "Portugalscy kupcy wtrącają się w tym regionie zachęcając podwładnych do powstań przeciwko centralnej władzy."
 mal_portuguese_traders: "Portugalskie Kontakty Handlowe"
 desc_mal_portuguese_traders: "Nasze porty są uczęszczane przez portugalskich kupców, którzy przywieźli nam konie i egzotyczne dobra w zamian za złoto i niewolników."
 mal_unsafe_roads: "Niebezpieczne Drogi"
 desc_mal_unsafe_roads: "Regionalne drogi są nawiedzane przez bandytów. Choć ostatecznie niewątpliwie przywrócony zostanie porządek, obecnie szkodzi to zarówno lokalnej gospodarce, jak i powoduje napięcia między naszymi poddanymi a państwem."
 mal_wangaras_upset: "Niezadowolenie Wangarów"
 desc_mal_wangaras_upset: "Siłą ograniczając kontakty z portugalskimi kupcami, zdołaliśmy jednocześnie zrazić do siebie własną warstwę kupiecką — Wangarów. Relacje między tronem a kupcami zapewne z czasem wrócą do normy, lecz odbudowa gospodarki może potrwać znacznie dłużej."
 flavor_mal.2.t: "Pojawienie się Fulanów"
 flavor_mal.2.d: "Grupa wędrownych koczowników znanych jako Fulbe zjednoczyła się pod przywództwem Tengelli i jego syna Koly'ego. Wędrując na południe, Fulbe utworzyli ekspansywne państwo wokół Futa Toro, kierujące swoje ambicje na cały region Senegambii. Nie szanują oni naszych granic i już wielokrotnie ich wojownicy wdzierali się głęboko na nasze ziemie, nakładali podatki na naszych mieszkańców i podważali naszą władzę."
 flavor_mal.2.a: "Rozumiem."
 flavor_mal.4.t: "Wangara i Portugalczycy"
 flavor_mal.4.d: "Odkąd portugalscy kupcy przyjęli mniej agresywną postawę, coraz częściej można ich spotkać na naszych zachodnich wybrzeżach. Pod wieloma względami jest to korzystne dla państwa: zyskaliśmy łatwiejszy dostęp do koni dla naszej armii oraz możliwość sprowadzania cennych towarów z egzotycznych portów odwiedzanych przez portugalskich handlarzy. Portugalczycy sprzedadzą nam niemal wszystko w zamian za złoto lub niewolników, a nasza warstwa kupiecka — Wangarowie — rozkwita dzięki temu partnerstwu.\nNiektórzy dostrzegają jednak powody do niepokoju. Liczba niewolników żądanych w zamian za jednego konia zdaje się rosnąć z każdym dniem. Nasze własne wyprawy zamorskie nie przyniosły dotąd dobrych rezultatów, lecz całkowite uzależnienie się od obcych kupców byłoby nierozsądne — z pewnością nie kierują się oni naszym dobrem."
 flavor_mal.4.a: "Rozumiem."
 flavor_mal.5.t: "Portugalska ingerencja"
 flavor_mal.5.d: "Portugalscy kupcy na naszym zachodnim wybrzeżu stali się ostatnio prawdziwym utrapieniem. Konie, które dostarczają naszej armii, oraz egzotyczne towary sprowadzane z odległych krajów są dla nas bardzo cenne, lecz Portugalczycy nie potrafią powstrzymać się od ingerowania w lokalną politykę. Jest jasne, że kilku wodzów utrzymujących z nimi kontakty zostało zachęconych do rozszerzania własnej władzy i stopniowego zrywania więzi z administracją centralną.\nMożemy rozwiązać ten problem, uderzając bezpośrednio w wodzów albo próbując ograniczyć wpływy Portugalczyków."
 flavor_mal.5.a: "Zdecydowanie ograniczmy wpływy portugalskie."
 flavor_mal.5.b: "Problemem są nielojalni wodzowie."
 flavor_mal.6.t: "Islamizacja arystokracji"
 flavor_mal.6.d: "Choć nasze królestwo jest oficjalnie muzułmańskie, dawna religia przodków wciąż ma wielu zwolenników. Islam zdobywa jednak ostatnio coraz większe wpływy wśród arystokracji, a wędrownych marabutów coraz częściej można spotkać nawet w najodleglejszych zakątkach naszych ziem.\nNasi poprzednicy unikali wywierania zbyt silnej presji na poddanych, by ich nawrócić. Jeśli jednak zechcemy, możemy wykorzystać ostatnie przemiany i wesprzeć szerzenie prawdziwej wiary."
 flavor_mal.6.a: "Nawracajmy nasz lud!"
 flavor_mal.6.b: "Nie zakłócajmy obecnego porządku."
 flavor_mal.7.t: "Niebezpieczne Drogi"
 flavor_mal.7.d: "Czas podróży ze stolicy na wybrzeże niepokojąco się wydłużył, ponieważ bezpośredni szlak jest nękany przez bandytów, najeźdźców z plemienia Fulbe i lokalnych wodzów, którzy próbują wzbogacić się, napadając na zamożnych kupców Wangara.\nJeśli szybko nie rozwiążemy tego problemu, możemy utracić kontakt z odległymi częściami naszego imperium."
 flavor_mal.7.a: "Przyznajmy lokalnym wodzom uprawnienia do rozwiązania tego problemu."
 flavor_mal.7.b: "Przeznaczmy środki państwowe na oczyszczenie wszystkich dróg."
 flavor_mal.7.c: "Skupmy się na naszych najważniejszych ziemiach."
 flavor_mal.8.t: "Powstanie Kaabu"
 flavor_mal.8.d: "Sami Koli, gubernator Kaabu, oskarża nas o zaniedbywanie nadmorskich obszarów handlowych naszego imperium. Zagroził zerwaniem wszelkich więzi z naszym państwem i zaczął prowadzić interesy bezpośrednio z europejskimi potęgami handlowymi, zamiast występować w ich imieniu jako nasz przedstawiciel. Kaabu nigdy nie było szczególnie oddane religii państwowej Mali, a z czasem stało się bastionem miejscowych wierzeń tradycyjnych. Nowi władcy szybko zaczęli wykorzystywać tę sytuację przeciwko nam.\nSilna tożsamość religijna i więzi handlowe z państwami atlantyckimi dają Kaabu wszelkie szanse, by stać się trwałym państwem. Jeśli chcemy temu zapobiec, powinniśmy działać jak najszybciej."
 flavor_mal.8.a: "Musimy zmiażdżyć tych buntowników!"
 flavor_mal.8.b: "Będziemy musieli się nimi zająć później."
 incan_nation_title: "Tawantinsuyu, Imperium Inków"
 incan_nation_desc: "Niegdyś jedno z wielu małych regionalnych królestw, a dziś nasze państwo posiada ziemię we wszystkich czterech regionach Andów. Nasze królestwo przekształciło się w coś większego, potężne imperium wielu narodów zjednoczonych pod silną klasą władców. Dla naszych poddanych jesteśmy po prostu ich zwierzchnikami, Inkami."
 incan_nation_rnw_title: "Tawantinsuju, Imperium Inków"
 incan_nation_rnw_desc: "Niegdyś jedno z wielu małych regionalnych królestw, a dziś nasze państwo posiada ziemię we wszystkich czterech regionach Andów. Nasze królestwo przekształciło się w coś większego, potężne imperium wielu narodów zjednoczonych pod silną klasą władców. Dla naszych poddanych jesteśmy po prostu ich zwierzchnikami, Inkami."
 incan_nation_empire_custom_tooltip: "Ranga rządów państwa §Y[Root.GetName]§! zostaje zmieniona na §YCesarstwo§!."
 andean_group: "andyjska"
 andean_desc: "W ramach andyjskiej grupy technologicznej koszt poziomu technologicznego jest wyższy o 150% (250% wartości podstawowej)."
 oromo_spawn_region: "Oromia"
 eth_independent_church: "Niezależny Kościół"
 desc_eth_independent_church: "Przygotowujemy się do zerwania więzi z patriarchą Aleksandrii. To ryzykowny krok, lecz już teraz przyczynia się do odrodzenia naszego Kościoła."
 eth_itinerant_capital: "Wędrująca stolica"
 desc_eth_itinerant_capital: "Dwór wędrujący po kraju ma wiele wad, lecz jego zaletą jest możliwość szerzenia kultury naszego dworu królewskiego w całym państwie."
 eth_zara_yakob_centralisation: "Reformy centralizacji"
 desc_eth_zara_yakob_centralisation: "Obecnie przeprowadzamy serię reform, których celem jest ograniczenie autonomii prowincji w naszym imperium."
 eth_oromo_migration: "Migracja Oromo"
 desc_eth_oromo_migration: "W ostatnim czasie na ten obszar napłynęła znaczna liczba koczowników Oromo."
 eth_mount_geshen: "Góra Królów"
 desc_eth_mount_geshen: "Podtrzymujemy królewską tradycję Góry Geszen. Wszyscy następcy tronu pozostają na obszarze wokół tej góry, dzięki czemu możemy mieć pewność, że w razie potrzeby zawsze będzie na miejscu odpowiedni dziedzic."
 flavor_eth.6.t: "Reformy centralizacyjne Zary Jakoba"
 flavor_eth.6.d: "Pod rządami dynastii salomońskiej Etiopia przekształciła się z królestwa w wielkie imperium. Różnorodne regiony podlegające naszej władzy nie mają jednak wspólnego języka, religii ani systemu administracyjnego.\nZara Jakob, najzdolniejszy władca, jakiego Etiopia miała od wielu lat, przygotował szereg reform, które mogą znacznie przyczynić się do zjednoczenia państwa."
 flavor_eth.6.a: "Musimy scentralizować państwo."
 flavor_eth.6.b: "Z centralizacją możemy jeszcze poczekać."
 flavor_eth.7.t: "Wędrująca stolica"
 flavor_eth.7.d: "Aby sprawować kontrolę nad zróżnicowanym imperium etiopskim, władcy z dynastii salomońskiej nigdy nie ustanowili stałej stolicy. Zamiast tego dwór królewski co kilka miesięcy przenosi się od jednego wodza do drugiego.\nW takich warunkach trudno zapewnić ciągłość administracji, lecz wędrujący dwór ma również zalety. Częste wizyty dworu królewskiego we wszystkich zakątkach imperium przyczyniają się do rozwoju wspólnej kultury elit na naszych ziemiach."
 flavor_eth.7.a: "Tak było od zawsze."
 flavor_eth.7.b: "Aktywnie wspierajmy przemiany kulturowe na prowincji."
 flavor_eth.8.t: "Debre Berhan — Góra Światła"
 flavor_eth.8.d: "$MONARCH$ doznał wizji, w której ujrzał lśniącą górę przeznaczoną na nową stolicę Etiopii. W tym miejscu wzniesiono już kościół, a teraz do państwa należy urzeczywistnienie marzenia naszego cesarza."
 flavor_eth.8.a: "Nadszedł czas, by ustanowić stałą stolicę."
 flavor_eth.8.b: "Nie zrywajmy z tradycją."
 flavor_eth.9.t: "Złupienie Debre Berhan"
 flavor_eth.9.d: "Stare tradycje trudno wykorzenić. Gdy okolice Debre Berhan padły łupem najeźdźców, nową stolicę opuścili wszyscy — od dworzan po najskromniejszego stajennego. Nie mamy wyboru i musimy powrócić do zwyczaju wędrującego dworu."
 flavor_eth.9.a: "Musimy przenieść się do prowincji."
 flavor_eth.10.t: "Gondar — nowa stolica"
 flavor_eth.10.d: "$MONARCH$ coraz więcej czasu spędza w pobliżu klasztorów nad jeziorem Tana. Dzięki nieustannemu mecenatowi monarchy w okolicy zaczęło wyrastać niewielkie miasteczko targowe, a niektórzy już nazywają je drugą stolicą naszego królestwa.\\nPomysł ten coraz bardziej podoba się $MONARCH$, który uważa, że ustanowienie tu stałej stolicy pozwoli nam zapoczątkować nowe dziedzictwo duchowe i architektoniczne."
 flavor_eth.10.a: "Zbudujmy tutaj naszą stolicę."
 flavor_eth.10.b: "Nie możemy przywiązywać się do jednego miejsca."
 flavor_eth.11.t: "Los egipskich Koptów"
 flavor_eth.11.d: "Dotarły do nas wieści z Egiptu, że sułtan mameluków prześladuje Koptów zamieszkujących jego ziemie. Jako królestwo podlegające temu samemu Patriarchatowi Aleksandryjskiemu mamy obowiązek zareagować. Sytuację komplikuje jednak fakt, że sam patriarcha znajduje się w rękach mameluków. Bezpośredni atak mógłby zagrozić fundamentom naszego Kościoła."
 flavor_eth.11.a: "Wyślijmy sułtanowi stanowczy list."
 flavor_eth.11.b: "Nie ryzykujmy gniewu mameluków."
 flavor_eth.11.c: "To powód do wypowiedzenia wojny!"
 flavor_eth.12.t: "List z Etiopii"
 flavor_eth.12.d: "Otrzymaliśmy dziś list od cesarza Etiopii. Zawiera on szczegółowy opis licznych domniemanych krzywd, jakich nasz sułtanat miał dopuścić się wobec Koptów mieszkających na naszych ziemiach.\\nPrawdopodobnie nie ma jednak powodów do obaw — patriarcha zarówno egipskich, jak i etiopskich Koptów znajduje się w naszych rękach. Mało prawdopodobne, by etiopski monarcha zaryzykował bezpieczeństwo swojego patriarchy z tak błahego powodu."
 flavor_eth.12.a: "Odeślijmy sarkastyczną odpowiedź."
 flavor_eth.12.b: "Spróbujmy przeprosić i naprawić nasze stosunki."
 flavor_eth.13.t: "Nadszedł kolejny list z Etiopii"
 flavor_eth.13.d: "Otrzymaliśmy wiadomość, że cesarz Etiopii uważa, iż źle traktujemy ludność koptyjską na naszych ziemiach. Wyraźnie uznaje to za powód do wojny, a krążą pogłoski, że atak Etiopii może nastąpić lada chwila."
 flavor_eth.13.a: "Nie odważyliby się."
 flavor_eth.14.t: "Poseł od mameluków"
 flavor_eth.14.d: "Dziś na nasz dwór przybył posłaniec mameluków z odpowiedzią sułtana na nasze obawy dotyczące Koptów zamieszkujących jego ziemie.\\nOdpowiedź daleka jest jednak od oczekiwanych przeprosin. Sułtan postanowił okazać pogardę etiopskiemu dworowi i szydzi z wszelkich działań odwetowych, jakie moglibyśmy podjąć."
 flavor_eth.14.a: "Uwięźmy posła."
 flavor_eth.14.b: "To powód do wypowiedzenia wojny!"
 flavor_eth.14.c: "Dajmy temu spokój."
 flavor_eth.15.t: "Przeprosiny mameluków"
 flavor_eth.15.d: "Sułtan mameluków przysłał wiadomość, że przygląda się sytuacji Koptów na swoich ziemiach. Zapewnia nas, że żywi wyłącznie przyjazne uczucia wobec ludu etiopskiego i Kościoła koptyjskiego."
 flavor_eth.15.a: "Rozumiem."
 flavor_eth.16.t: "Zatrzymanie posła"
 flavor_eth.16.d: "Cesarz Etiopii był tak niezadowolony z naszej odpowiedzi na jego list, że rozkazał zatrzymać naszego posłańca."
 flavor_eth.16.a: "Rozumiem."
 flavor_eth.17.t: "Śmierć biskupa"
 flavor_eth.17.d: "Zmarł biskup Etiopii, a tamtejszy Kościół zwrócił się do koptyjskiego patriarchy Aleksandrii o wyznaczenie następcy.\\nPatriarcha wybrał już nowego biskupa, lecz jest to doskonała okazja, by przypomnieć Etiopczykom, kto tu rządzi. Cesarz Etiopii aktywnie nawraca swoich muzułmańskich poddanych, a ponadto nadal przetrzymuje posła, którego wysłaliśmy, by go upomnieć."
 flavor_eth.17.a: "Nie dopuśćmy do mianowania nowego biskupa."
 flavor_eth.17.b: "Nie powinniśmy ingerować w te sprawy."
 flavor_eth.18.t: "Zaginiony biskup"
 flavor_eth.18.d: "Od śmierci ostatniego biskupa Etiopii minęło już sporo czasu, a my wciąż czekamy na wyznaczenie jego następcy przez Aleksandrię. Czyżby mamelucy maczali w tym palce?"
 flavor_eth.18.a: "Rozumiem."
 flavor_eth.19.t: "Zakony monastyczne"
 flavor_eth.19.d: "Jedną z największych sił Kościoła etiopskiego jest ogromna liczba prężnie działających klasztorów rozsianych po całym naszym państwie. Zakony monastyczne przyczyniły się do jego rozwoju, zakładając nowe klasztory na świeżo podbitych ziemiach i szerząc tam prawdziwą wiarę. Klasztory Etiopii są również ośrodkami kształcenia duchowieństwa, szlachty i urzędników, a tym samym w minionych latach w znacznym stopniu przyczyniły się do odrodzenia naszego Kościoła.\\nJest jednak i druga strona medalu: klasztory oraz zarządzające nimi zakony stały się niezwykle bogate i autonomiczne."
 flavor_eth.19.a: "Spróbujmy ograniczyć ich wpływy."
 flavor_eth.19.b: "Zabezpieczmy przywileje zakonów."
 flavor_eth.20.t: "Niezależność od patriarchatu"
 flavor_eth.20.d: "Zależność etiopskiego Kościoła od Patriarchatu Aleksandryjskiego od zawsze była obciążeniem dla naszego państwa. Być może niegdyś potrzebowaliśmy biskupów, duchownych i duchowego przewodnictwa z zagranicy. Jednak w ciągu ostatnich dwóch stuleci Kościół etiopski znacznie się rozwinął. Nasze królestwo samo kształci już duchownych, a na całym terytorium dysponujemy rozbudowaną siecią kościołów i klasztorów.\\nPonieważ egipski patriarchat znajduje się w niewoli muzułmańskich zdobywców, często musimy długo czekać między śmiercią jednego biskupa a mianowaniem kolejnego. Znacznie sprawniej byłoby powoływać przywódców religijnych spośród własnego duchowieństwa."
 flavor_eth.20.a: "Nie możemy znieważyć naszego patriarchy."
 flavor_eth.20.b: "Nasz Kościół powinien być wolny od obcych wpływów."
 flavor_eth.21.t: "Oromo"
 flavor_eth.21.d: "Dziwny lud koczowniczy przekroczył naszą granicę, przybywając z głębi Afryki na nasze pogranicze. Wędrują w wielkich grupach pod osłoną niezwykle sprawnych wojowników, a ich obce zwyczaje zagrażają rozbiciem i całkowitą przemianą miejscowego porządku społecznego.\\nWyznawcy Waaka szybko wypierają i nawracają zwolenników wszystkich religii w okolicy, zastępując dawne struktury społeczne własnymi."
 flavor_eth.21.a: "Rozumiem."
 flavor_eth.23.t: "Osadnicy Oromo"
 flavor_eth.23.d: "Grupy koczowniczych osadników przybyły do prowincji $PROVINCENAME$. Ludność prowincji jest wypierana lub asymilowana przez Oromo."
 flavor_eth.23.a: "Rozumiem."
 flavor_eth.24.t: "Integracja Oromo"
 flavor_eth.24.d: "Wygląda na to, że fale osadników Oromo napływających na nasze ziemie wreszcie osłabły. Sami przybysze zaczęli się osiedlać, a choć nasze społeczeństwo uległo wielu przemianom, gwałtowny początkowy etap integracji tego ludu zdaje się dobiegać końca."
 flavor_eth.24.a: "Rozumiem."
 flavor_eth.26.t: "Amba Geszen — Góra Królów"
 flavor_eth.26.d: "Niegdyś nasze wielkie królestwo nękały kryzysy i wojny domowe wybuchające przy każdej zmianie władcy. Aby rozwiązać ten problem, jeden z pierwszych królów dynastii salomońskiej ustanowił instytucję Góry Geszen. Od tamtej pory wszyscy książęta królewscy, z wyjątkiem bezpośredniego następcy tronu, są odizolowani od świata zewnętrznego na zboczach góry Geszen. Państwo dba o to, by niczego im tam nie brakowało, a czas odosobnienia mogą poświęcić na naukę i kontemplację. Góra jest pilnie strzeżona, by chronić książąt przed światem zewnętrznym, a królestwo przed ich roszczeniami do tronu.\\nZwyczaj ten dobrze nam służył przez lata, a królestwo stało się znacznie stabilniejsze niż dawniej. Niektórzy uważają jednak, że trzymanie wszystkich królewskich dziedziców w jednym miejscu jest dość ryzykowne.\\nNasz król jest już w podeszłym wieku i nie ma następcy. Właśnie w takiej sytuacji góra może okazać się niezwykle przydatna."
 flavor_eth.26.a: "Powinniśmy być wdzięczni za dalekowzroczność naszych przodków."
 flavor_eth.26.b: "Nie potrzebujemy tego pozłacanego więzienia."
 flavor_eth.26.b.tt: "Góra zostanie przeznaczona do innych celów."
 flavor_eth.27.t: "Helena Etiopska"
 flavor_eth.27.d: "Na początku swojego panowania król $MONARCH$ poślubił córkę jednego z muzułmańskich wodzów królestwa. Gdy młoda kobieta przyjęła chrześcijaństwo i złożyła przysięgę wierności cesarzowi Etiopii, nikt nie mógł przewidzieć, że stanie się jedną z najbardziej wpływowych postaci etiopskiej polityki na wiele kolejnych lat. Eleni, znana również jako Helena, z czasem służyła nie tylko swojemu mężowi, lecz także kilku kolejnym królom, jako utalentowana doradczyni i osoba wywierająca wpływ zza tronu."
 flavor_eth.27.a: "Rozumiem."
 flavor_eth.28.t: "Tragedia na Górze Królów"
 flavor_eth.28.d: "Nikt nie wie dokładnie, co się wydarzyło, lecz dziś dotarła do nas wiadomość, że wszyscy książęta przebywający na Górze Geszen nie żyją. Wygląda na to, że ktoś zdołał zaskoczyć strażników, a następnie wymordował królewskich dziedziców. Królestwo próbuje otrząsnąć się z szoku, lecz jedno jest jasne: ta tradycja nie będzie już częścią naszego dziedzictwa narodowego."
 flavor_eth.28.a: "Wszystko stracone."
 REPUBLIC_OF_WESTPHALIA: "Republika Westfalii"
 KINGDOM_OF_WESTPHALIA: "Królestwo Westfalii"
 KINGDOM_OF_NAPLES: "Królestwo Neapolu"
 REPUBLICS_OF_NAPLES: "Republika Partenopejska"
 KINGDOM_OF_ITALY: "Królestwo Włoch"
 SUBALPINE_REPUBLIC: "Republika Włoska"
 GC_ASIA_BOOKMARK: "Królestwa wschodu"
 GC_ASIA_BOOKMARK_DESC: "Azja jest domem dla większości światowej populacji i miejscem pochodzenia większości wytwarzanych towarów. W 1444 r. nadal jest pod wieloma względami wyraźnym centrum świata. Od Chin dynastii Ming, poprzez niezliczoną liczbę krajów w Indiach i Indochinach, aż po rozpadające się Imperium Timurydów i rozległe stepy na północy, Azja jak dotąd nie wykazywała zainteresowania konfliktami, takimi jak krucjata warneńska czy wojna stuletnia."
 GC_AMERICA_BOOKMARK: "Pierwsze narody"
 GC_AMERICA_BOOKMARK_DESC: "50 lat przed spotkaniem z Kolumbem, Ameryki są ogromnym i różnorodnym regionem. Na południu Cusco właśnie zaczęło przekształcać się z małego królestwa w wielkie Imperium Inków. W Ameryce Środkowej nowo utworzone azteckie trójprzymierze jest tylko jedną z wielu silnych regionalnych potęg. W Ameryce Północnej, prawdopodobnie najbardziej podzielonym regionie ze wszystkich, zaczęły tworzyć się federacje Irokezów i Huronów."
 GC_AFRICA_BOOKMARK: "Imperia piasków"
 GC_AFRICA_BOOKMARK_DESC: "W 1444 r. Afryka była regionem pełnym wschodzących królestw. Na wschodzie chrześcijańskie Cesarstwo Etiopii przeżywa złoty wiek pod rządami sławnego władcy Zary Jaykoba. W Afryce Zachodniej pustkę pozostawioną przez rozpadające się Imperium Mali wypełniają wschodzące państwa, takie jak Songhaj. Kryzys w Maghrebie niebawem doprowadzi do odrodzenia silnego Królestwa Maroka na północnym zachodzie, podczas gdy północny wschód stanie się placem zabaw dla europejskich i tureckich imperialistów."
 bng_nabibangsha: "Nabibangsha"
 desc_bng_nabibangsha: "Nabibangsha oraz inne przejawy synkretyzmu hindusko-muzułmańskiego sprawiają, że codzienne życie w naszym religijnie podzielonym kraju jest względnie spokojne."
 bng_mosque_city_of_bagerhat: "Miasto meczetów Khalifatabad"
 desc_bng_mosque_city_of_bagerhat: "Znajduje się tu miasto meczetów Khalifatabad, w którym wznosi się jeden z najwspanialszych meczetów Indii."
 bng_delta_reclaimed: "Rekultywacja Delty"
 desc_bng_delta_reclaimed: "Dzięki ciężkiej pracy naszych poddanych, nowe rozległe tereny zostały otwarte dla osadnictwa i uprawy, zwiększając tym samym dochody prowincji, jak i lokalne zainteresowanie wiarą islamską."
 bng_delhian_refugees: "Uchodźcy delhijscy"
 desc_bng_delhian_refugees: "Otworzyliśmy nasze ramiona dla uciekającej szlachty z Sułtanatu Delhijskiego. Ci zubożali szlachcice chętniej zdobywają swoje fortuny służąc naszemu krajowi."
 bng_port_of_calcutta: "Port w Kalkucie"
 desc_bng_port_of_calcutta: "Niegdyś w miejscu kilku niewielkich wiosek, Kalkuta jest dziś tętniącym życiem portem, zdominowanym w dużej mierze przez europejskich kupców."
 flavor_bng.1.t: "Zakon Czisztijja i sułtani Bengalu"
 flavor_bng.1.d: "Zakon suficki Czisztijja zawsze miał szczególne relacje z naszą dynastią. Mógł liczyć na nasz patronat, a w zamian my liczyliśmy na jego wsparcie. Niecałe pokolenie temu Nur Qutb-i 'Alam, przywódca zakonu Czisztijja w Bengalu, zapewnił nam powrót do władzy, gdy sułtanowi zagroził hinduski uzurpator.\nGdy dotarła do nas smutna wiadomość o śmierci Nur Qutb-i 'Alama, nadszedł czas, by potwierdzić ten sojusz pomiędzy władzą ziemską i duchową. Z drugiej strony, może być to doskonała okazja, by oddalić zakon Czisztijja od naszego tronu, gdyż organizacja ta wraz ze swoim rozwojem, stanowi zagrożenie dla naszego komfortu."
 flavor_bng.1.a: "Kontynuuj patronat nad zakonem."
 flavor_bng.1.b: "Rozejdźmy się."
 flavor_bng.2.t: "Nabibangsha"
 flavor_bng.2.d: "Z czasem obecność Sufi w Bengalu doprowadziła w pewnym stopniu do synkretyzmu religijnego. W ramach istniejącego trendu bengalski autor i poeta Sayid Sultan stworzył ostatnio coś zupełnie wyjątkowego. Jest to książka w języku bengalskim o rodowodzie proroków islamu. Jedną z niezwykłych cech tej książki było zaliczenie przez Sayida Sultana do klasycznej grupy proroków islamskich boga Kryszny, który pojawił się przed Mahometem. "
 flavor_bng.2.a: "To wspaniałe dzieło literatury bengalskiej."
 flavor_bng.2.b: "Nie możemy pozwolić na takie bluźnierstwo."
 flavor_bng.3.t: "Miasto meczetów Khalifatabad"
 flavor_bng.3.d: "W niedawno wykarczowanej części głębokich lasów namorzynowych w regionie Sunderbanów leży miasto Khalifatabad. Niezadowolony z efektów oczyszczania tego obszaru w 1430 roku, lokalny władca Khan Jahan Ali poświęcił całe swoje życie na wypełnianiu miasta meczetami oraz innymi wspaniałymi budowlami. Wśród wielu wzniesionych meczetów w dzielnicy Bagerhat znajduje się ogromny meczet Shait Gambuj z ponad 80 kopułami, będąc tym samym prawdopodobnie największym meczetem w Indiach."
 flavor_bng.3.a: "Rozumiem."
 flavor_bng.4.t: "Rekultywacja Delty"
 flavor_bng.4.d: "Bengal słynie z żyznych gleb i obfitych plonów. Rozległa delta Gangesu wciąż jest jednak pokryta gęstą dżunglą i bagnami. Oczyszczanie ziemi, by zapewnić miejsce do życia i uprawy naszej stale rosnącej ludności, trwa powoli, lecz nieprzerwanie od niepamiętnych czasów.\\nOstatnio w ten proces zaangażowało się wielu świętych mężów, w tym liczni sufi. Zdołali poruszyć serca naszych poddanych, dzięki czemu osuszanie i zagospodarowywanie ziemi przebiega sprawniej niż kiedykolwiek wcześniej. Jakby na potwierdzenie, że wszystko zmierza we właściwym kierunku, zmienił się nawet bieg potężnego Gangesu, co dodatkowo ułatwiło te działania."
 flavor_bng.4.a: "Rozumiem."
 flavor_bng.5.t: "Arystokraci na wygnaniu"
 flavor_bng.5.d: "Po upadku Sułtanatu Delhijskiego znaczna część dawnej elity szlacheckiej przekroczyła nasze granice. Przybysze pragną rozpocząć nowe życie i pewnego dnia odzyskać to, co utraciły ich rody.\\nTo zróżnicowana grupa Afgańczyków, Uzbeków, Turanów i Persów, z których każdy przywykł do sprawowania znacznej władzy. Nasze państwo z pewnością mogłoby skorzystać z ich kontaktów i doświadczenia. Ich przybycie wywołuje jednak napięcia społeczne i niepokoje na naszych ziemiach."
 flavor_bng.5.a: "Musimy zachęcać tych wartościowych ludzi, aby nam służyli!"
 flavor_bng.5.b: "Staraj się zniechęcać ich do pozostawania na naszych ziemiach."
 flavor_bng.6.t: "Panowanie tygrysa"
 flavor_bng.6.d: "Pewien człowiek imieniem Szer Szach Sur, znany również jako Szer Chan, wyrósł na niekwestionowanego przywódcę delhijskich możnych, którzy osiedlili się na części naszych ziem. Obiecując bogactwo i zemstę, ten charyzmatyczny przywódca zgromadził armię i jest gotów pomaszerować przeciwko każdemu, kto stanie mu na drodze.\\nMożna by sądzić, że długofalowym celem tej armii jest odzyskanie Sułtanatu Delhijskiego, lecz dziś otrzymaliśmy ultimatum z obozu Szer Szacha. Mamy opuścić tron i pozwolić mu przejąć władzę nad naszym królestwem albo sam zdobędzie ją siłą miecza."
 flavor_bng.6.a: "Jeżeli chcesz mojego tronu, będziesz musiał o niego zawalczyć. "
 flavor_bng.6.b: "Poddaj się."
 flavor_bng.6.b.tt: "(Szer Szach zaczyna z niską legitymizacją)"
 flavor_bng.7.t: "Radża Bhurshutu"
 flavor_bng.7.d: "Niedawno dowiedzieliśmy się, że hinduski właściciel jednego z największych majątków ziemskich w naszym sułtanacie spiskował z naszymi wrogami w Orisie. Ów majątek to pradawne władztwo znane jako królestwo Bhurshutu, istniejące jeszcze przed nastaniem muzułmańskich rządów w Indiach."
 flavor_bng.7.a: "Skonfiskuj majątek."
 flavor_bng.8.t: "Nadanie przywileju osadniczego w Kalkucie"
 flavor_bng.8.d: "Ambasador reprezentujący interesy Angielskiej Kompanii Wschodnioindyjskiej przybył dziś na nasz dwór, prosząc o pozwolenie na utworzenie stałej osady w delcie Gangesu w celu usprawnienia wymiany handlowej między nami a Zachodem.\nJak można się spodziewać po tym przedsiębiorcy, jest on gotów zapłacić za ten przywilej."
 flavor_bng.8.a: "Przyznajmy im kilka wiosek w delcie."
 flavor_bng.8.b: "Odprawmy wysłannika z niczym."
 flavor_bng.9.t: "Rozwój Kalkuty."
 flavor_bng.9.d: "Wioski, które niegdyś przekazaliśmy zachodnim kupcom, rozrosły się w wielki port handlowy znany jako Kalkuta. Gospodarka miasta kwitnie, a cały region czerpie z tego korzyści, istnieją jednak powody do niepokoju.\\nZ uwagi na ogromne wpływy gospodarcze europejskich kupców coraz częściej uważa się ich za rzeczywistą władzę w całej okolicy, a nie tylko w samym mieście. Miejscowy dowódca rozpoczął budowę kilku nowych fortów w celu ochrony miasta, nie pytając nas o zgodę. Nasze żądania wstrzymania prac spotkały się zaś z milczeniem."
 flavor_bng.9.a: "Zburz te forty!"
 flavor_bng.9.b: "Zostaw forty w spokoju."
 flavor_bng.10.t: "Czarna Dziura Kalkuty"
 flavor_bng.10.d: "Wysłani przez nas żołnierze do Kalkuty szybko obrócili w pył nowe forty i uwięzili mieszkańców Zachodu, których znaleźli w środku. Gdy tylko więźniowie wrócili do swoich macierzystych krajów, ten incydent urósł do niewyobrażalnych rozmiarów. \nWśród uwolnionych zaczęła krążyć historia o strasznym lochu zwanym Czarną Dziurą Kalkuty. Według opowieści zdecydowana większość tam osadzonych zmarła z powodu okropnych warunków w jakich musieli przebywać. Nasz lokalny dowódca zapewnia nas, że to nieprawda, ale to obecnie nie ma żadnego znaczenia. Kupcy z Angielskiej Kompanii Wschodnioindyjskiej robią wszystko, co w ich mocy, aby przekonać swój ojczysty kraj do 'przywrócenia porządku' w naszym królestwie."
 flavor_bng.10.a: "Rozumiem."
 flavor_bng.11.t: "Czarna Dziura Kalkuty"
 flavor_bng.11.d: "Historia haniebnych czynów dotarła do nas z odległej Kalkuty. Okazuje się, że tamtejsza angielska osada została zaatakowana przez miejscowego władcę. Kupcy i żołnierze ponoć doświadczyli w Kalkucie straszliwej kary wtrącenia do niesławnego lochu znanego jako 'Czarna Dziura Kalkuty'.\nOdkąd dotarły do nas te wieści, jesteśmy zasypywani prośbami indyjskich kupców, którzy wzywają nas do natychmiastowego działania i przywrócenia porządku w tej barbarzyńskiej części świata."
 flavor_bng.11.a: "Rozumiem."
 flavor_bng.12.t: "Triumf tygrysa"
 flavor_bng.12.d: "Zasięg Bengalu rozciąga się od Pendżabu aż po granice Chin. W historii niewiele było potężniejszych imperiów i żadne nie było lepiej rządzone. Wieści o naszym zwycięstwie rozbrzmiewają w całym imperium, lecz nigdzie nie świętuje się huczniej niż w [Root.Capital.GetName], dokąd zwykli mieszkańcy, kupcy, uczeni i możni ściągają, by oddać hołd chwale [Root.Monarch.GetName].\\n\\nTygrys Bengalu triumfuje!"
 flavor_bng.12.a: "Zwyciężyliśmy!"
 bah_bidar_fort: "Fort Bidar"
 desc_bah_bidar_fort: "Nasza stolica jest równie ekstrawagancka, jak dobrze strzeżona."
 bah_attracting_the_right_people: "Pozyskiwanie właściwych ludzi"
 desc_bah_attracting_the_right_people: "Obecnie prowadzimy kampanię intensywniejszą niż kiedykolwiek, aby przekonać utalentowanych muzułmańskich dowódców, kupców i administratorów, aby przybyli do naszego kraju i poszukali tutaj szczęścia."
 bah_habhsis: "Lojalni Habshi"
 desc_bah_habhsis: "Coraz więcej naszych fortów obsadzają lojalni niewolnicy Habshi. Możemy na nich polegać, ponieważ pozostają wierni tronowi, a nie rywalizującym frakcjom dworskim."
 bah_deccanis_gharbians: "Dekańczycy i Gharbiańczycy"
 desc_bah_deccanis_gharbians: "Nasz dwór pozostaje podzielony między frakcje Dekańczyków i Gharbiańczyków. Próbujemy ustabilizować sytuację, naprzemiennie wspierając obie grupy, lecz napięcia wciąż są wyraźne i znacznie utrudniają codzienne zarządzanie państwem."
 bah_gharbians: "Poparcie dla Gharbiańczyków"
 desc_bah_gharbians: "Wspieramy frakcję Gharbiańczyków na dworze, a w zamian do naszego kraju nieustannie napływają nowi awanturnicy z muzułmańskich państw Zachodu."
 bah_deccanis: "Poparcie dla Dekańczyków"
 desc_bah_deccanis: "Wspieramy frakcję Dekańczyków na dworze, a w zamian nasze prowincje stały się znacznie spokojniejsze i łatwiejsze do kontrolowania."
 bah_bidriware_boom: "Rozkwit wyrobów bidri"
 desc_bah_bidriware_boom: "Rzemieślnicy z Bidaru opracowali nową technikę metaloplastyki, znaną jako bidri. Jej rozpowszechnienie ożywiło lokalną gospodarkę."
 flavor_bah.1.t: "Bidar, prawdziwa stolica Bahmańczyków. "
 flavor_bah.1.d: "Zmęczony ciągłymi intrygami i niezdrową atmosferą w Gulbardze, jedną z pierwszych decyzji, którą w młodości podjął $MONARCH$ było przeniesienie stolicy Królestwa Bahmanidów do Bidaru. W miejscu po starym forcie, dokładnie na środku płaskowyżu Dekanu, zbudowano zupełnie nową stolicę, wspaniałe miasto porównywalne do wielkich miast Persji i Transoksanii. Z 37 bastionami i 7 bramami Bidar jest także imponującym fortem i najważniejszą twierdzą naszej dynastii.\nZbudowany, aby wywrzeć wrażenie także na samym dworze królewskim, jest nie mniej imponujący, a Sala Audiencyjna z Turkusowym Tronem naszej dynastii jest prawdopodobnie najbardziej znanym symbolem naszej rodziny.\nOczywiście wszystko kosztuje. Nasz wezyr przekazał nami dzisiaj listę rzeczy wymagających pilnej uwagi oraz listę regionów, które powinniśmy dalej rozwijać w pierwszej kolejności."
 flavor_bah.1.a: "Bidar musi pozostać stolicą godną naszej dynastii."
 flavor_bah.1.b: "Nie przesadzajmy z tym."
 flavor_bah.2.t: "Pozyskiwanie właściwych ludzi"
 flavor_bah.2.d: "Sułtanat Bahmanidów jest pod wieloma względami państwem kolonialnym. Dekan znajduje się pod muzułmańską kontrolą zaledwie od 20 lat, odkąd nasi przodkowie zrzucili imperialistyczne jarzmo Delhijczyków. Zdecydowaną większość naszych poddanych stanowią hinduscy Marathowie, Kannadyjczycy i Telugowie.\\nPonieważ sułtani Delhi przez długi czas odcinali nam dostęp do północnych Indii, musieliśmy polegać na zamorskiej imigracji bezpośrednio z Persji i świata arabskiego, aby zaspokoić potrzeby naszego państwa.\\nNasza dynastia zawsze dokładała więc starań, by przyciągać do tego coraz bardziej kosmopolitycznego królestwa zdolnych i wykształconych ludzi. Odkąd jednak utraciliśmy kontrolę nad zachodnim wybrzeżem, napływ utalentowanych przybyszów zmienił się w ledwie strużkę. Jeśli chcemy uniknąć poważnego kryzysu, musimy podwoić wysiłki i sprowadzić tu wszystkich wartościowych ludzi, mimo związanego z tym ryzyka."
 flavor_bah.2.a: "Podwójmy nasze wysiłki."
 flavor_bah.2.b: "W większym stopniu wykorzystajmy miejscowe talenty."
 flavor_bah.3.t: "Mahmud Gawan"
 flavor_bah.3.d: "Dziś do $CAPITAL$ przybył perski kupiec imieniem Mahmud Gawan, prosząc o audiencję. Gdy pozwolono mu się przedstawić, wyjaśnił, że jest właśnie takim człowiekiem, jakiego potrzebuje nasze królestwo. Oprócz osobistych zalet jako kupiec i administrator posiada sieć kontaktów w całym świecie muzułmańskim, z której moglibyśmy skorzystać.\\nMahmud Gawan obiecuje, że jeśli zapewnimy mu odpowiednie środki, rozkwitnie nasza gospodarka, a sława królestwa stanie się tak wielka, że ludzie z całego świata będą tłumnie przybywać na nasze wybrzeża, by nam służyć."
 flavor_bah.3.a: "Oto prawdziwy książę kupców!"
 flavor_bah.4.t: "Lojalni Habshi"
 flavor_bah.4.d: "Niewolnicy od wieków stanowią jeden z najważniejszych towarów w sieci handlowej Oceanu Indyjskiego. Młodzi Etiopczycy są porywani, nawracani na islam i szkoleni na elitarnych żołnierzy, administratorów oraz marynarzy, a następnie sprzedawani władcom Indii i Persji.\\nNasze królestwo cierpi na wyraźny niedobór ludzi jednocześnie zdolnych i lojalnych, dlatego ci „Habshi” mogą okazać się cennym nabytkiem dla naszej dynastii. Zamiast ufać skłóconym frakcjom Gharbiańczyków i Dekańczyków na dworze, wykorzystajmy tych niewolników do obsadzania naszych fortów, urzędów i okrętów."
 flavor_bah.4.a: "Rozpocznijmy masowy import Habshi."
 flavor_bah.4.b: "Spróbujmy znaleźć inne rozwiązanie."
 flavor_bah.5.t: "Dekańczycy i Gharbiańczycy"
 flavor_bah.5.d: "Nasza polityka nieustannego sprowadzania ludzi z zagranicy przyniosła również niepożądane skutki. „Dekańczycy” — szlachta bahmanidzka drugiego i trzeciego pokolenia wraz z pozostałą częścią dawnej hinduskiej arystokracji — stają się coraz silniejszą frakcją na dworze i opowiadają się za miejscowym charakterem sułtanatu. Przeciwstawiają się im nowi przybysze z Zachodu, „Gharbiańczycy”, którzy przybyli szukać fortuny na bogatych ziemiach Indii.\\nDwór jest już tak podzielony, że ostatnio obie frakcje trzeba było rozdzielać nawet w sali audiencyjnej i podczas uroczystości królewskich."
 flavor_bah.5.a: "Spróbujmy podsycać ich wzajemną rywalizację."
 flavor_bah.5.b: "Opowiedzmy się po stronie Gharbiańczyków."
 flavor_bah.5.c: "Opowiedzmy się po stronie Dekańczyków."
 flavor_bah.6.t: "Bidri"
 flavor_bah.6.d: "W warsztatach Bidaru opracowano nową technikę metaloplastyki. Ten nowy styl szybko rozpowszechnił się wśród perskich rzemieślników w mieście i stał się znanym towarem eksportowym naszej stolicy."
 flavor_bah.6.a: "Wspaniale!"
 flavor_bah.7.t: "Odnaleziono ogromny diament"
 flavor_bah.7.d: "Dziś dotarła do nas niezwykła przesyłka z kopalni diamentów w Kollur. Kamień jest największym diamentem, jaki kiedykolwiek widziano na targach w Golkondzie, dlatego uznano, że należy osobiście przekazać go $MONARCHTITLE$."
 flavor_bah.7.a: "Zawsze będę go strzec."
 flavor_bah.7.b: "Sprzedaj to"
 flavor_bah.8.t: "Afanasij Nikitin"
 flavor_bah.8.d: "Dziś na nasz dwór przybył podróżnik z odległego kraju. Pod wrażeniem naszej gościnności i splendoru stolicy opowiada o sąsiadach, których odwiedził. Opowiada również o dalekiej krainie, z której wyruszył — o mieście zwanym Twer i ziemi, gdzie zimy są długie i mroźne."
 flavor_bah.8.a: "Interesujące…"
 guj_walls_of_ahmedabad: "Mury Ahmadabadu"
 desc_guj_walls_of_ahmedabad: "System murów, bram i ponad 170 bastionów chroni Ahmadabad przed najeźdźcami, a zarazem pozwala miastu nadal rozwijać się w zawrotnym tempie."
 guj_champaner_project: "Budowa Champaneru"
 desc_guj_champaner_project: "Obecnie nie szczędzimy środków na budowę drugiej stolicy na pagórkowatym pograniczu regionu Gudźaratu."
 guj_champaner: "Champaner"
 desc_guj_champaner: "Znajduje się tu nasza druga stolica — wspaniałe miasto-twierdza Champaner."
 guj_merchants_doing_well: "Rozkwit kupiectwa"
 desc_guj_merchants_doing_well: "Nasza społeczność kupiecka przeżywa obecnie okres wielkiego rozkwitu."
 guj_hardline_rel_policy: "Rygorystyczna polityka religijna"
 desc_guj_hardline_rel_policy: "Po okresie pobłażliwości ponownie egzekwujemy prawo religijne w naszym państwie i prowadzimy znacznie surowszą politykę wobec niemuzułmanów."
 flavor_guj.1.t: "Rozwój Ahmadabadu"
 flavor_guj.1.d: "Nasza stolica, Ahmadabad, rozwija się w zawrotnym tempie od chwili założenia w 1411 roku i nic nie wskazuje na to, by ten wzrost miał wkrótce wyhamować. Bliskość Khambatu, jednego z największych portów Indii, a według niektórych także najbardziej ruchliwego portu świata, zapewnia nieustanny napływ ludzi, towarów i kapitału.\\nTak szybko rozwijające się miasto trudno jednak skutecznie bronić, zwłaszcza że leży pośrodku równin Gudźaratu. Niektórzy twierdzą, że powinniśmy aktywniej uczestniczyć w planowaniu miasta, zamiast skupiać się wyłącznie na jego upiększaniu. System murów i bastionów zaproponowany przez naszych architektów może wydawać się ogromnym przedsięwzięciem, lecz alternatywą jest stolica niemal pozbawiona obrony."
 flavor_guj.1.a: "Zbuduj mury."
 flavor_guj.1.b: "Lepiej pozostawić miasto otwartą stolicą."
 flavor_guj.2.t: "Champaner — druga stolica?"
 flavor_guj.2.d: "Fort Champaner znajduje się w niezwykle dogodnym strategicznie miejscu, pośród gór między płaskowyżem Malwy a równinami Gudźaratu. Oprócz naturalnych walorów obronnych jego położenie pozwala kontrolować szlak handlowy łączący Doab z portami morskimi naszego państwa.\\n$MONARCHTITLE$ $MONARCH$ opracował niezwykle ambitny plan przekształcenia fortu Champaner w nową, wspaniałą drugą stolicę naszego królestwa. Budowa tego symbolu naszej dynastii zostanie powierzona najlepszym architektom świata indo-islamskiego, a na wydatkach nie będziemy oszczędzać."
 flavor_guj.2.a: "Zacznijmy budowę!"
 flavor_guj.2.b: "Nie interesuje nas ten próżny projekt."
 flavor_guj.3.t: "Champaner"
 flavor_guj.3.d: "Wreszcie nasza druga stolica jest niemal ukończona. Wokół wzgórza Champaner powstało okazałe miasto z pałacami, meczetami, świątyniami, nowoczesnym systemem zaopatrzenia w wodę, a przede wszystkim potężnymi fortyfikacjami.\\nJedną z najwspanialszych budowli jest ogromny meczet Dżami Masdżid, wzniesiony w wyrafinowanym gudźarackim stylu indo-muzułmańskim, z którego słynie nasz sułtanat."
 flavor_guj.3.a: "Wspaniale!"
 flavor_guj.4.t: "Utrata Champaneru"
 flavor_guj.4.d: "Utraciliśmy miasto Champaner, a wraz z nim marzenia o idealnej stolicy."
 flavor_guj.4.a: "Rozumiem."
 flavor_guj.5.t: "Burhanuddin Qutub-e Alam"
 flavor_guj.5.d: "Jeden z mistrzów sufickich mieszkających w naszej stolicy coraz otwarciej wyraża ostatnio poparcie dla naszej dynastii. Wielu ludzi dostrzega już, że prowadzimy królestwo we właściwym kierunku, a jego wypowiedzi wywarły bardzo pozytywny wpływ na nastroje społeczne."
 flavor_guj.5.a: "Cóż za przenikliwy człowiek!"
 flavor_guj.6.t: "Dżiniści i hinduscy kupcy — Wasanta Wilasa"
 flavor_guj.6.d: "Dobrobyt kupców Gudźaratu zawsze leżał na sercu naszej dynastii. Nie tylko tolerujemy dżinijskich, hinduskich i zaratusztriańskich handlarzy prowadzących interesy w naszych miastach, lecz także na wiele sposobów wspieramy ich działalność.\\nW rezultacie kupcy wszystkich wyznań w Gudźaracie cieszą się ostatnio znakomitą koniunkturą. W niedawno ukończonym rękopisie poświęconym wiosennym obrzędom i bogu Krysznie wpływowy hinduski kupiec z Ahmadabadu wykorzystał okazję, by pochwalić miasto i jego władców.\\nByć może jest to najlepszy dowód skuteczności naszej polityki."
 flavor_guj.6.a: "Świetnie."
 flavor_guj.6.b: "Bluźnierstwo! Nasze prawa stały się zdecydowanie zbyt pobłażliwe."
 flavor_guj.7.t: "Poselstwo do sułtana osmańskiego"
 flavor_guj.7.d: "W niebezpiecznym świecie warto mieć kontakty, które mogą zapewnić nam ochronę. Odkąd Portugalczycy pojawili się na Oceanie Indyjskim, trudno mieć pewność, że ktokolwiek jest bezpieczny na morzu. Otrzymujemy kolejne doniesienia o statkach napadanych przez chrześcijańskie okręty. Piraci zagrażają handlowi, z którego żyje nasz sułtanat, i muszą zostać powstrzymani.\\nNiedawno dowiedzieliśmy się, że Imperium Osmańskie, choć odległe, zdobyło porty nad Morzem Czerwonym. Czy nie powinniśmy skontaktować się z sułtanem Konstantynopola i omówić możliwość zawarcia sojuszu przeciwko chrześcijańskim piratom?"
 flavor_guj.7.a: "Wyślijmy posła do Wysokiej Porty."
 flavor_guj.7.b: "Sami sobie poradzimy."
 flavor_guj.8.t: "Czy czas zaangażować się w sprawy Oceanu Indyjskiego?"
 flavor_guj.8.d: "Dziś na nasz dwór przybył poseł z odległego sułtanatu Gudźaratu. Sułtan Gudźaratu donosi, że nękają go portugalscy piraci, których okręty zagrażają napływowi orientalnych towarów na wschód, do naszych ziem. Portugalczycy uniemożliwiają również indyjskim wiernym pielgrzymowanie do Mekki i Medyny — podróż ta dla wielu rozpoczyna się właśnie w Gudźaracie.\\nGudźarat leży daleko, lecz z pewnością możemy wysłać mu pomoc w tej walce."
 flavor_guj.8.a: "Musimy stanąć murem za naszymi braćmi w wierze!"
 flavor_guj.8.b: "Indie? Mamy znacznie pilniejsze sprawy na własnym podwórku."
 flavor_guj.9.t: "Pomoc Osmanów"
 flavor_guj.9.d: "Sułtan osmański przesłał nam wiadomość, w której wyraża głębokie zrozumienie dla naszego pragnienia uwolnienia się od portugalskiego zagrożenia. Aby pomóc nam w obronie, przysłał kilka okrętów oraz osmańskich oficerów marynarki. Obie te formy wsparcia mogą okazać się przydatne w przyszłej walce z Portugalczykami."
 flavor_guj.9.a: "Rozumiem."
 flavor_guj.10.t: "Złe wieści"
 flavor_guj.10.d: "Niestety, wygląda na to, że sułtanowi nie zależy tak bardzo jak nam na utworzeniu wspólnego frontu przeciwko chrześcijańskim piratom. Przysłał wiadomość, że nie interesują go zamorskie przedsięwzięcia na Wschodzie."
 flavor_guj.10.a: "Rozumiem."
 flavor_guj.11.t: "Śmierć Ahmada Kattu"
 flavor_guj.11.d: "Zmarł Ahmad Kattu, mistrz suficki i stronnik naszej dynastii. Ten wielki człowiek przez ponad jedno pokolenie służył jako doradca gudźarackich sułtanów, a niegdyś uczestniczył również w planowaniu wspaniałego miasta Ahmadabad. Jego śmierć pozostawia w naszym królestwie ogromną duchową pustkę, a nasza dynastia na zawsze pozostanie jego dłużnikiem."
 flavor_guj.11.a: "Wznieśmy wspaniałe mauzoleum ku czci tego wielkiego człowieka."
 flavor_guj.11.b: "To wielka strata dla królestwa."
 flavor_guj.12.t: "Kissa-i Sandźan — społeczność parsów w Gudźaracie"
 flavor_guj.12.d: "Wiele setek lat temu grupa zaratusztriańskich uchodźców z Persji osiedliła się w Gudźaracie, dając początek społeczności parsów w Sandźanie. Przez stulecia ta mniejszość religijna wykazywała się odpornością i aktywnie uczestniczyła w rozwoju tego dynamicznego regionu.\\nNiedawno kapłan parsów spisał ustną tradycję historyczną swojej społeczności — od ucieczki z Persji w X wieku aż po czasy obecne. Powstała w ten sposób Kissa-i Sandźan jest bez wątpienia klasycznym przykładem wybitnej poezji perskiej, lecz przede wszystkim opowieścią, którą sami parsi będą pielęgnować przez kolejne pokolenia."
 flavor_guj.12.a: "Rozumiem."
 flavor_guj.13.t: "Mirat-i-Sikandiri"
 flavor_guj.13.d: "Sułtanat Gudźaratu może poszczycić się bogatą tradycją historiograficzną, a nasza dynastia przez lata otaczała patronatem wielu kronikarzy dworskich. Niedawno ukończone dzieło szejka Sikandara ibn Muhammada Mandźhu, Mirat-i-Sikandiri, jest nie tylko znakomitym przykładem tej tradycji, lecz także próbuje uwzględnić wszystkie wcześniejsze opracowania na ten temat. Powstała w ten sposób szczegółowa kronika dziejów Sułtanatu Gudźaratu od jego powstania aż po dzień dzisiejszy."
 flavor_guj.13.a: "Rozumiem."
