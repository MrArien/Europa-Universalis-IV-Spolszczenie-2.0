 desc_joined_league_war: "Udział w wojnach religijnych Świętego Cesarstwa Rzymskiego sporo nas nauczył w temacie sztuki wojennej."
 hre_dominant_catholic: "Cesarstwo katolickie"
 desc_hre_dominant_catholic: "Wiara katolicka jest oficjalną religią Świętego Cesarstwa Rzymskiego. Jej wyznawanie daje naszemu państwu legitymizację moralną."
 hre_dominant_protestant: "Cesarstwo protestanckie"
