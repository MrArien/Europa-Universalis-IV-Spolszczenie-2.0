l_english:
 flavor_ter.1.t: "Przyprawy muszą płynąć"
 flavor_ter.1.desc: "[Root.GetName] ma wielkie ambicje ekspansji, która zaczyna się od okolicznych wysp. Musimy wybrać miejsce na założenie kolejnej kolonii [Root.GetAdjective]."
 flavor_ter.1.a: "[648.GetName]."
 flavor_ter.1.b: "[644.GetName]."
 flavor_ter.1.c: "[647.GetName]."
 flavor_ter.1.d: "[2717.GetName]."
 flavor_ter.1.e: "[645.GetName]."
 flavor_ter.1.f: "[1245.GetName]."
 flavor_ter.1.g: "[ter_colony_province.GetName]."
 flavor_ter.1.h: "Przyprawy płyną."
 flavor_ter.2.a: "[2693.GetName]."
 flavor_ter.2.b: "[632.GetName]."
 spice_defeat_rival_title: "Pokonaj naszego rywala"
 spice_defeat_rival_desc: "Jeśli chcemy założyć imperium na Molukach, musimy działać szybko, by wyeliminować rywalizujące ze sobą królestwa."
 spice_colony_1_title: "Kolonia [Root.GetAdjective]"
 spice_colony_1_desc: "Nasza pierwsza kolonia jest już w trakcie zakładania — to początek wielu osad, które złożą się na przyszłe imperium. Musimy zapewnić jej ochronę."
 spice_colony_2_title: "Ekspansja [Root.GetAdjective]"
 spice_colony_2_desc: "Powstaje druga kolonia, przybliżając nas do realizacji naszych celów. Powinniśmy pomóc jej się rozwijać."
 spice_colony_3_title: "Dominacja [Root.GetAdjective]"
 spice_colony_3_desc: "Wybraliśmy już miejsce pod trzecią kolonię. Miejmy nadzieję, że będzie najwspanialsza ze wszystkich."
 spice_colony_modifier: "Imperium przypraw"
 desc_spice_colony_modifier: "Dysponujemy teraz środkami pozwalającymi zakładać kolejne kolonie na całych Molukach."
 spice_colony_province_modifier: "Kolonia na Wyspach Korzennych"
 desc_spice_colony_province_modifier: "Wskazaliśmy tę prowincję jako miejsce założenia naszej następnej kolonii."
 spice_island_colony_tt: "Wybrano jako kolonię na Wyspach Korzennych"
 spice_export_spice_title: "Eksport goździków"
 spice_export_spice_desc: "Nasze raczkujące imperium morskie znacznie się rozrosło od jego powstania. Teraz nadszedł czas, aby potwierdzić naszą dominację na morzach."
 spice_conquer_sulawesi_title: "Podbij Sulawesi"
 spice_conquer_sulawesi_desc: "Mamy pieniądze i mamy okręty. Nadszedł czas, by dowieść naszej potęgi militarnej i rozpocząć inwazję na Celebes."
 mnd_peg_sadhuim_title: "Odbuduj Sadhuim"
 mnd_peg_sadhuim_desc: "Sadhuim było niegdyś stolicą wielkiego królestwa Monów, które istniało przed wiekami. Powinniśmy odbudować miasto i przywrócić mu dawną świetność."
 mnd_peg_burma_trade_title: "Handel na Irawadi"
 mnd_peg_burma_trade_desc: "Zapewnimy sobie dominację w handlu na rzece Irawadi, pokonując konkurentów i tworząc wielką flotę kupiecką."
 mnd_peg_sumatra_title: "Przyczółek na Sumatrze"
 mnd_peg_sumatra_desc: "Jeśli chcemy kontrolować lukratywny handel przyprawami, musimy najpierw zdobyć przyczółek w świecie malajskim. Atjeh na krańcu Sumatry będzie doskonałym miejscem do rozpoczęcia ekspansji."
 mnd_peg_spice_trade_title: "Zdominuj handel przyprawami"
 mnd_peg_spice_trade_desc: "Po zdobyciu przyczółka możemy skierować uwagę na najbogatsze porty handlowe regionu. Staniemy się panami handlu przyprawami."
 mnd_peg_arakan_title: "Ujarzmij Arakan"
 mnd_peg_arakan_desc: "Sułtanowie Arakanu znajdują się w niepewnej pozycji między nami a potężnym Sułtanatem Bengalu. Ta sytuacja raczej nie potrwa długo, więc powinniśmy ich podbić, zanim Bengal będzie mieć szansę."
 mnd_peg_bengal_title: "Zaatakuj Bengal"
 mnd_peg_bengal_desc: "Bengal jest bogaty, ludny i prestiżowy. Podbicie tej ziemi wyeliminowałoby wielkie zagrożenie, a jednocześnie znacznie wzmocniło nasze własne państwo."
 mnd_peg_hariphunchai_title: "Przywróć Hariphunchai"
 mnd_peg_hariphunchai_desc: "Przed migracjami ludów tajskich północą władało królestwo Monów Hariphunchai. Powinniśmy odtworzyć to państwo pod naszym przewodnictwem."
 mnd_peg_dvarati_title: "Odzyskaj Dwarawati"
 mnd_peg_dvarati_desc: "Mówiąca językiem mon cywilizacja Dwarawati niegdyś dominowała na ziemiach obecnie rządzonych przez Tajów. Nadszedł czas odrodzenia tej starożytnej kultury."
 mnd_peg_restore_the_mon_title: "Przesiedlenie Monów"
 mnd_peg_restore_the_mon_desc: "Lud Monów niegdyś zamieszkiwał rozległe obszary Azji Południowo-Wschodniej, lecz dziś został zepchnięty do Dolnej Birmy. Powinniśmy ponownie szerzyć naszą kulturę."
 mnd_peg_ava_title: "Staw opór Birmańczykom"
 mnd_peg_ava_desc: "Królestwo Ava sprawuje hegemonię nad Birmańczykami, a jego potęga zagraża rozszerzeniem się na nasze ziemie. Powinniśmy przeciwstawić się jego ambicjom i zdobyć hegemonię nad południowymi miastami Bamarów."
 mnd_peg_irrawaddy_title: "W górę Irawadi"
 mnd_peg_irrawaddy_desc: "Staliśmy się wystarczająco silni, by rzucić wyzwanie potędze Ava. Rozpoczniemy kampanię wzdłuż Irawadi i podporządkujemy sobie Birmańczyków."
 mnd_peg_pagan_title: "Modlitwa w Pagan"
 mnd_peg_pagan_desc: "Nasi dawni rywale z królestwa Pagan byli znakomitymi architektami i gorliwymi buddystami. Ich pagody popadły w ruinę pod rządami Ava — powinniśmy je odrestaurować."
 peg_pagan: "Pagody Paganu"
 desc_peg_pagan: "Wiedza architektoniczna królestwa Pagan pomaga nam w realizacji własnych przedsięwzięć budowlanych."
 mnd_peg_golden_land_title: "Złota kraina"
 mnd_peg_golden_land_desc: "Suvarnabhumi było legendarnym królestwem starożytności. Wiele imperiów marzyło o odtworzeniu chwały Złotej Krainy, lecz żadnemu się to nie udało. My będziemy pierwsi."
 mnd_peg_religious_devotion_title: "Monastyczne oddanie"
 mnd_peg_religious_devotion_desc: "Musimy zyskać przychylność buddyjskich mnichów opiekujących się naszymi pagodami i hojnie wspierać budowę oraz odnowę świętych miejsc."
 peg_devotion: "Religijne oddanie"
 desc_peg_devotion: "Pobożność naszego ludu pomaga nam troszczyć się o utrzymanie naszych zabytków."
 mnd_peg_golden_pagoda_title: "Odnów Złotą Pagodę"
 mnd_peg_golden_pagoda_desc: "Złota Pagoda w Dagonie jest naszym największym osiągnięciem, lecz wymaga renowacji. Musi stać się najwspanialszym pomnikiem świata buddyjskiego."
 mnd_peg_ceylon_title: "Więzi z Cejlonem"
 mnd_peg_ceylon_desc: "Cejlon jest najświętszym miejscem w buddyzmie therawadyjskim i ma ogromne znaczenie dla naszych tradycji zakonnych."
 restored_sadhuim: "Odbudowa Sadhuim"
 desc_restored_sadhuim: "Miasto Sadhuim jest odbudowane"
 mon_restoration: "Przesiedlenie Monów"
 desc_mon_restoration: "Musimy przywrócić kulturze Monów jej dawną pozycję i znaczenie."
 restored_golden_pagoda: "Odnowienie Złotej Pagody"
 desc_restored_golden_pagoda: "Złota Pagoda została odnowiona."
 peg_ceylon_modifier: "Lankijski buddyzm"
 desc_peg_ceylon_modifier: "Odnowiliśmy nasze więzi z lankijskim buddyzmem."
 sailor_mon: "Porozumienia z Orang Laut"
 desc_sailor_mon: "Zawarliśmy porozumienie z ludem Orang Laut."
 mon_renaissance: "Odrodzenie Monów"
 desc_mon_renaissance: "Cywilizacja Mon przeżywa nowy złoty wiek."
 shan_confederation_title: "Zjednocz Szan"
 shan_confederation_desc: "Pomniejszych władców Szanów należy zjednoczyć pod jednym sztandarem. Dopiero wtedy będziemy mogli rozszerzyć nasze panowanie na całą Birmę i stworzyć wielkie imperium."
 shan_domination_title: "Dominacja Szan"
 shan_domination_desc: "Wreszcie jesteśmy zjednoczeni. Teraz musimy zmobilizować nasze armie przeciwko królestwu Ava, które arogancko ogłasza się hegemonem całej Birmy. Dziś rozpoczyna się era dominacji Szanów."
 shan_confederation_tt: "Wszystkie państwa z kulturą główną §YSzan§! muszą być naszymi sojusznikami lub poddanymi."
 shan_confederation_tt_2: "Żadne państwo z kulturą główną §YSzan§! nie posiada armii większej niż §Y[Root.GetName]§!"
 mnd_siam_prepare_title: "Przygotowania do inwazji"
 mnd_siam_prepare_desc: "Przygotowując się do naszej inwazji na Malakkę, musimy zbudować stosowną flotę, a także upewnić się, że nasze działania nie sprowokują chińskiego cesarza."
 mnd_siam_mlc_title: "Zaatakuj Malakkę"
 mnd_siam_mlc_desc: "Malakka stała się prosperującym portem handlowym i byłaby dobrym dodatkiem do naszych posiadłości na Półwyspie Malajskim."
 mnd_siam_trade_title: "Kontroluj handel przyprawami"
 mnd_siam_trade_desc: "Teraz, gdy kontrolujemy Malakkę, handel przyprawami stoi przed nami otworem. Powinniśmy zabezpieczyć kolejne faktorie w pobliżu Cieśniny Malakka, aby umocnić naszą dominację w handlu przyprawami."
 mnd_siam_transfer_development_title: "Zaludnij [Root.Capital.GetCapitalName]"
 mnd_siam_transfer_development_desc: "[Root.Capital.GetCapitalName] jest wielkim miastem, lecz może stać się jeszcze wspanialsze, jeśli zmusimy mieszkańców peryferii lub podbitych wrogów do osiedlenia się w stolicy."
 mnd_siam_mandala_title: "Stwórz mandalę"
 mnd_siam_mandala_desc: "Powinniśmy ukształtować nasze państwo na wzór mandali. Nie jesteśmy w stanie sprawować bezpośredniej władzy nad każdym zakątkiem królestwa, dlatego powierzamy część kompetencji państwom wasalnym, które będą rządzić w naszym imieniu."
 mnd_siam_great_monument_title: "Spójrzcie na moje dzieła"
 mnd_siam_great_monument_desc: "Najwspanialszym świadectwem rozkwitu cywilizacji są jej pomniki. Niech wszyscy, którzy ujrzą nasze dzieła, popadną w rozpacz."
 emerald_buddha_mission_tt: " Posiada modyfikator prowincji §YSzmaragdowy Budda§!"
 mnd_siam_city_of_worlds_desire_title: "Miasto, które pragnie świat"
 mnd_siam_city_of_worlds_desire_desc: "Nie wystarczy, by [Root.Capital.GetCapitalName] było wielkim miastem. Musi stać się największym miastem świata i siedzibą całej doczesnej władzy."
 mnd_siam_devaraja_title: "Dewaradża"
 mnd_siam_devaraja_desc: "[Root.Monarch.GetTitle] nie jest jedynie śmiertelnym władcą, lecz także duchowym centrum naszego państwa. Musimy zadbać, by nasi poddani mieli pewność, że monarchia jest bezpieczna, a wiara chroniona."
 mnd_siam_revolution_title: "Syjamska rewolucja"
 mnd_siam_revolution_desc: "Zachodnie mocarstwa zaczynają zagrażać [Root.GetName]. Musimy poznać ich zamiary, a następnie albo je wypędzić, albo znaleźć sposób, by ich obecność przyniosła nam korzyści."
 mnd_siam_royal_duel_title: "Wygraj królewski pojedynek"
 mnd_siam_royal_duel_desc: "Zgodnie z tradycją [Root.Monarch.GetTitle] osobiście bierze udział w walce, przemierzając pole bitwy na grzbiecie słonia. Nie ma większego wojskowego osiągnięcia niż osobiste pokonanie innego króla w bitwie."
 mnd_siam_subjugate_khmer_title: "Zmiażdż Khmerów"
 mnd_siam_subjugate_khmer_desc: "W 1431 roku złupiliśmy khmerskie miasto Angkor i zniszczyliśmy niegdyś dominujące imperium Khmerów. To jednak za mało. Musimy podporządkować ich sobie całkowicie."
 mnd_siam_divide_the_lao_title: "Podziel Lang Czang"
 mnd_siam_divide_the_lao_desc: "Lan Xang jest rozległym, lecz kruchym królestwem. Byłoby dla nas najkorzystniej, gdyby jego słabości wyszły na jaw, zanim podejmiemy próbę aneksji."
 mnd_siam_subjugate_the_lao_title: "Ujarzmij Lao"
 mnd_siam_subjugate_the_lao_desc: "Po rozbiciu Lan Xang możemy podporządkować sobie mniejsze królestwa laotańskie i uczynić je wasalami [Root.GetName]."
 mnd_siam_subjugate_vietnam_title: "Ujarzmij Wietnam"
 mnd_siam_subjugate_vietnam_desc: "Władcy Dai Viet uważają, że są bezpieczni za swoimi górami i pod opieką chińskiego cesarza. Udowodnimy im, że ich przekonanie jest błędne."
 mnd_siam_defy_china_title: "Przeciwstaw się Chinom"
 mnd_siam_defy_china_desc: "Chiny od zawsze rzucają wielki cień na Azję Południowo-Wschodnią, stanowiąc stałe, choć nieregularne zagrożenie dla naszej suwerenności. Musimy stać się wystarczająco silni, by otwarcie rzucić wyzwanie cesarzowi i najechać południowe Chiny."
 mnd_siam_take_the_mandate_title: "Przejmij mandat"
 mnd_siam_take_the_mandate_desc: "Chińscy cesarze szczycą się posiadaniem mandatu niebios."
 siam_mandate_modifier: "Mandat Syjamu"
 desc_siam_mandate_modifier: "Przejeliśmy mandat niebios, czyniąc nas prawowitymi władcami Chin."
 siam_accepted_mon: "Ochrona kultury Monów"
 desc_siam_accepted_mon: "Zapewniliśmy ludowi Monów ochronę przed tymi, którzy chcieliby go skrzywdzić i wypędzić z ojczystych ziem."
 mnd_siam_inherit_sukhothai_title: "Odziedzicz Sukhothai"
 mnd_siam_inherit_sukhothai_desc: "Po podporządkowaniu królestwa Sukhothai przed kilkudziesięciu laty osadziliśmy na jego tronie księcia Trailoka. Powinniśmy doprowadzić do zjednoczenia obu królestw."
 mnd_siam_subjugate_chiang_mai_title: "Podporządkuj Chiang Mai"
 mnd_siam_subjugate_chiang_mai_desc: "Władcy Chiang Mai sądzą, że odizolowana północ zapewnia im bezpieczeństwo. Pokażemy im, że nie zdołają łatwo uniknąć naszego panowania."
 mnd_siam_protect_the_mon_title: "Chroń Monów"
 mnd_siam_protect_the_mon_desc: "Lud Monów niegdyś władał wielkim imperium i dał początek wielu elementom naszej własnej kultury. Jego dawna złota epoka dawno przeminęła, dlatego powinniśmy objąć go opieką."
 mnd_siam_defeat_burma_title: "Rozgrom Birmę"
 mnd_siam_defeat_burma_desc: "Nie możemy dopuścić do powstania nowego imperium na zachodzie. Musimy zrobić wszystko, by zdławić potencjalne zagrożenia, zanim staną się dla nas rzeczywistym wyzwaniem."
 mnd_siam_conquer_burma_title: "Zaatakuj Birmę"
 crush_burma_tt: "Żadne niepodległe ani trybutarne państwo ze stolicą w regionie §YBirma§! nie ma więcej niż §Y50§! rozwoju."
 mnd_siam_conquer_burma_desc: "Nie możemy ufać, że Birma pozostanie na zawsze spacyfikowana. Musimy podporządkować sobie cały region."
 had_siamese_revolution_tt: "Ukończono katastrofę §YRewolucja syjamska§!"
 had_siamese_revolution_tt_2: "Żadne państwo §YZachodu§! nie posiada prowincji na subkontynencie §YWyspy Korzenne§!."
 mnd_siam_absolutism_title: "Królewski absolutyzm"
 mnd_siam_absolutism_desc: "Władza [Root.Monarch.GetTitle] nie podlega żadnej dyskusji. Musimy scentralizować państwo i ustanowić rządy absolutne, aby wszyscy mogli cieszyć się jego blaskiem."
 mnd_siam_japan_title: "Poselstwo do Japonii"
 mnd_siam_japan_desc: "Władcy Japonii słyną z nieufności wobec obcych wpływów i trudno nawiązać z nimi przyjazne stosunki. Jeśli jednak uda nam się ustanowić skuteczne poselstwo, być może zdołamy pozyskać do naszej służby budzących grozę samurajów."
 japanese_mercs_flag: "Kompania najemników §YJapońscy ochotnicy§! stanie się dostępna do zaciągu."
 merc_japanese_volunteers: "§JJapońscy ochotnicy§!"
 siam_mandala_modifier: "Wielka mandala"
 desc_siam_mandala_modifier: "Oparliśmy ustrój naszego państwa na modelu mandali i stworzyliśmy prawdziwie harmonijną wspólnotę, w której każdy zna swoje miejsce."
 siam_monument_modifier: "Budowniczowie pomników"
 desc_siam_monument_modifier: "Dowiedliśmy, że jesteśmy wybitnymi architektami i mistrzami logistyki wielkich przedsięwzięć budowlanych."
 siam_best_city_modifier: "Miasto pożądania świata"
 desc_siam_best_city_modifier: "Nasza stolica jest bezsprzecznie najwspanialszym miastem świata, jaśniejącym centrum całej doczesnej władzy."
 siam_trade: "Syjamska dominacja handlowa"
 desc_siam_trade: "Zdominowaliśmy handel przyprawami i możemy kierować płynące z niego bogactwa do skarbca państwa."
 khmer_end_dark_age_tt: "Katastrofa §YCiemne wieki Kambodży§! dobiega końca."
 mnd_khm_restore_angkor_title: "Odbuduj Angkor"
 mnd_khm_restore_angkor_desc: "Niegdyś wspaniałe miasto Angkor leży w ruinach po brutalnym złupieniu przez syjamskie armie. Musimy je odbudować."
 mnd_khm_city_of_temples_title: "Miasto Świątyń"
 mnd_khm_city_of_temples_desc: "Angkor Wat było niegdyś najwspanialszą świątynią świata, lecz dziś popada w ruinę. Powinniśmy je odbudować."
 mnd_khm_religion_title: "Sprawy wiary"
 mnd_khm_religion_desc: "Przejście na buddyzm therawady nie przebiegło całkowicie bezproblemowo. Wielu nadal wyznaje dawną religię hinduistyczną, a liczni mieszkańcy zachowali również starsze wierzenia w lokalne bóstwa. Musimy znaleźć rozwiązanie naszych podziałów religijnych."
 mnd_khm_resurgence_title: "Odrodzenie Khmerów"
 mnd_khm_resurgence_desc: "Ciemne wieki nie mogą trwać wiecznie. Przetrwamy mrok i odnajdziemy drogę ku światłu."
 mnd_khm_golden_age_title: "Drugi złoty wiek"
 mnd_khm_golden_age_desc: "Imperium Khmerów ponownie powstanie, rozpoczynając drugą złotą epokę."
 new_khmer_golden_age: "Nowa złota epoka Khmerów"
 desc_new_khmer_golden_age: "Przed nami nowa złota epoka."
 mnd_khm_enlightened_rule_title: "Oświecone rządy"
 mnd_khm_enlightened_rule_desc: "Król nie jest zwykłym śmiertelnikiem, lecz źródłem boskiego oświecenia. Musimy zapewnić państwu wystarczający zasięg władzy, by jego światło dotarło do wszystkich poddanych."
 mnd_khm_rebuild_title: "Odbuduj miasta"
 mnd_khm_rebuild_desc: "Najazdy i klęski żywiołowe spustoszyły nasze ziemie. Musimy ponownie zaludnić gospodarstwa i zadbać o wystarczające dostawy żywności dla wszystkich."
 mnd_khm_irrigation_title: "Zaawansowane nawadnianie"
 mnd_khm_irrigation_desc: "Nasze imperium było niegdyś bogate i dostatnie dzięki rozległej sieci kanałów wykorzystywanych zarówno do nawadniania pól, jak i żeglugi. Powinniśmy odbudować te kanały, by rozwinąć rolnictwo."
 mnd_khm_protect_the_cham_title: "Chroń Czampę"
 mnd_khm_protect_the_cham_desc: "Czampa poniosła klęski z rąk Dai Viet i prawdopodobnie nie zdoła długo się utrzymać. Powinniśmy podporządkować sobie królestwa Czamów, by uchronić je przed losem pod rządami Wietnamczyków."
 mnd_khm_subjugate_dia_viet_title: "Ujarzmij Dai Viet"
 mnd_khm_subjugate_dia_viet_desc: "Dai Viet ma wielkie ambicje rozszerzenia południowych granic. Nie możemy pozwolić, by wkroczyło na nasze ziemie."
 mnd_khm_avenge_angkor_title: "Pomścij Angkor"
 mnd_khm_avenge_angkor_desc: "Złupienie Angkoru było wielkim upokorzeniem. Odpłacimy naszym wrogom tym samym."
 mnd_khm_subjugate_ayu_title: "Podporządkuj Ajutthaję"
 mnd_khm_subjugate_ayu_desc: "Klęska, którą ponieśliśmy z rąk Ajutthaji, nigdy nie może się powtórzyć. Musimy podporządkować sobie jej królestwo."
 mnd_khm_restored_empire_title: "Przywrócenie Imperium"
 mnd_khm_restored_empire_desc: "Imperium Khmerów władało niegdyś rozległymi obszarami kontynentu, rządząc wieloma ludami pod przewodnictwem oświeconych władców. Musimy odbudować nasze imperium."
 mnd_khm_reclaim_the_north_title: "Odzyskaj północ"
 mnd_khm_reclaim_the_north_desc: "Północna część naszego imperium znalazła się pod panowaniem Lan Xang. Odzyskamy nasze prawowite ziemie."
 mnd_khm_subjugate_laos_title: "Ujarzmij Lang Czang"
 mnd_khm_subjugate_laos_desc: "W okresie upadku imperium tolerowaliśmy niepodległość Laotańczyków, lecz teraz, gdy znów rośniemy w siłę, nie możemy na to pozwolić."
 mnd_khm_overseas_adventures_title: "Zamorskie wyprawy"
 mnd_khm_overseas_adventures_desc: "Nie ma powodu, byśmy ograniczali się do granic dawnego imperium. Powinniśmy spojrzeć poza wybrzeże, ku bogactwom Borneo."
 mnd_khm_defy_china_title: "Przeciwstaw się Chinom"
 mnd_khm_defy_china_desc: "Chiny uważają, że należą im się daniny z całej Azji Południowo-Wschodniej. Nie możemy kłaniać się przed tym fałszywym cesarzem."
 mnd_khm_take_the_mandate_title: "Przejmij mandat"
 mnd_khm_take_the_mandate_desc: "Jeśli zdobędziemy Mandat Niebios, będziemy mogli samodzielnie rządzić Chinami i dowieść wszystkim, że nasze prawo do panowania jest boskie."
 mnd_khm_invade_burma_title: "Zaatakuj Birmę"
 mnd_khm_invade_burma_desc: "Birma zagraża zjednoczeniem zwaśnionych królestw i podważeniem naszej dominacji. Musimy rozszerzyć granice na zachód, by temu zapobiec."
 angkor_restoration: "Odbudowa Angkoru"
 desc_angkor_restoration: "Po przywróceniu Angkor Wat do dawnej świetności nasi architekci zdobyli doświadczenie i zapał potrzebne do rozpoczęcia kolejnych przedsięwzięć budowlanych w całym imperium."
 angkor_complete: "Miasto świątyń"
 desc_angkor_complete: "Angkor Wat przewyższa dawną świetność i jest teraz najwspanialszą budowlą świata."
 khm_navy: "Zamorskie wyprawy"
 desc_khm_navy: "Dzięki nowo zbudowanej flocie Imperium Khmerów jest gotowe do prowadzenia wypraw przez ocean."
 subjugation_of_ayu: "Ujarzmienie Ajutthaji"
 desc_subjugation_of_ayu: "Pokonaliśmy i podporządkowaliśmy sobie naszych największych rywali. Wszyscy, którzy nam się pokłonią, poznają teraz cenę nieposłuszeństwa."
 khm_burma_campaign: "Dziedzictwo kampanii birmańskiej"
 desc_khm_burma_campaign: "Nasza inwazja na Birmę była krwawym przedsięwzięciem, z którego wyciągnęliśmy wiele cennych lekcji."
 lna_emerald_buddha_title: "Chroń świątynię"
 lna_emerald_buddha_desc: "Szmaragdowy Budda musi być bezpiecznie przechowywany w naszym kraju, ponieważ wielu chce go ukraść."
 lna_emerald_buddha_tt: "Jakakolwiek posiadana prowincja ma modyfikator §YSzmaragdowy Budda§!"
 lna_rice_fields_title: "Milion pól ryżowych"
 lna_rice_fields_desc: "Lan Na jest żyzną i pracowitą krainą. Musimy w pełni wykorzystać jej potencjał."
 lna_sukhothai_title: "Podbij Sukhothai"
 lna_sukhothai_desc: "Jeśli chcemy stać się dominującą potęgą wśród ludów tajskich, musimy najpierw podbić dawną siedzibę władzy w Sukhothai."
 lna_ayu_title: "Ujarzmij Ajutthaję"
 lna_ayu_desc: "Władcy Ajutthaji chcieliby, abyśmy stali się jedynie państwem wasalnym pod ich panowaniem. Nie wiedzą jednak, że to oni sami zostaną naszymi poddanymi."
 protected_emerald_buddha: "Ochrona Szmaragdowego Buddy"
 desc_protected_emerald_buddha: "Świątynia zawierająca świętego Szmaragdowego Buddę została odpowiednio ufortyfikowana przed tymi, którzy chcieliby ją nam ukraść."
 suk_restore_sukhothai_title: "Przywróć Sukhothai"
 suk_restore_sukhothai_desc: "Sukhothai znacznie podupadło i stało się zaledwie wasalem potężniejszej Ajutthaji. Musimy odzyskać dawną chwałę, przywracając władzę w Sukhothai."
 suk_absorb_ayu_title: "Wchłoń Ajutthaję"
 suk_absorb_ayu_desc: "Musimy zintegrować Ajutthaję z naszym państwem, aby ponownie stać się dominującą potęgą Syjamu."
 suk_conquer_chiang_mai_title: "Ujarzmij Lanna"
 suk_conquer_chiang_mai_desc: "Władcy Chiang Mai sądzą, że odizolowana północ zapewnia im bezpieczeństwo. Pokażemy im, że nie zdołają łatwo uniknąć naszego panowania."
 buddha: "Budda"
 buddha_desc: "Założyciel wiary buddyjskiej. Idee buddyzmu nadal odgrywają istotną rolę w naszej praktyce hinduizmu."
 sun_consider_islam_title: "Rozważ islam"
 sun_consider_islam_desc: "Wiara islamska szybko rozprzestrzenia się na całym Nusantara. Powinniśmy lepiej poznać tę religię i zastanowić się, czy jest dla nas odpowiednia."
 sun_develop_cities_title: "Rozwój nowych miast"
 sun_develop_cities_desc: "Czasy się zmieniają, a miasta powstają i upadają. Musimy rozwijać nowe ośrodki handlu i osadnictwa, aby mogły stać się centrami władzy naszego państwa."
 sun_candi_temples_title: "Odbuduj świątynie kandi"
 sun_candi_temples_desc: "Jawa jest pełna świątyń kandi, które haniebnie dopuszczono do ruiny i zapomnienia. Musimy podjąć się ich odbudowy i odzyskać te święte miejsca."
 sun_borobudur_title: "Odbuduj Borobudur"
 sun_borobudur_desc: "Majapahit doprowadził wielką świątynię Borobudur do ruiny. Musimy ją odbudować."
 sun_borobudur: "Odbudowano Borobudur"
 desc_sun_borobudur: "Nasze wysiłki na rzecz odnowienia świątyni wzbogaciły naszą wiedzę architektoniczną."
 sun_rice_production_title: "Zwiększ produkcję ryżu"
 sun_rice_production_desc: "Armia maszeruje na własnym żołądku. Musimy zwiększyć produkcję ryżu, aby zapewnić dobrobyt ludności i zaopatrzenie naszych wojsk."
 sun_majapahit_relations_title: "Dziedzictwo Bubat"
 sun_majapahit_relations_desc: "Wiele lat temu zostaliśmy zdradzeni przez Majapahit, co doprowadziło do tragicznej bitwy pod Bubat. Nasze stosunki od tamtej pory uległy pogorszeniu, być może nieodwracalnie. Być może jedynym sposobem zapewnienia sobie bezpieczeństwa jest podporządkowanie Majapahitu naszej władzy."
 sun_majapahit_relations_tt: "§YMajapahit§! jest niepodległym państwem lub trybutariuszem, a w okresie §YUpadku Majapahitu§! jego niepodległość została zagwarantowana przez §Y[Root.GetName]§!."
 sun_can_vassalize_maj: "Jeśli zagwarantujemy niepodległość §YMajapahitu§!, stanie się on naszym wasalem."
 sun_rule_java_title: "Zapanuj nad Jawą"
 sun_rule_java_desc: "Cała Jawa musi zostać włączona do Królestwa Sundajskiego."
 sun_conquer_lampung_title: "Podbij Lampung"
 sun_conquer_lampung_desc: "Południowa Sumatra słynie z produkcji pieprzu i stanowi doskonały cel naszej ekspansji."
 sun_subjugate_sumatra_title: "Ujarzmij Sumatrę"
 sun_subjugate_sumatra_desc: "Pomniejsi sułtani Sumatry są podzieleni i nieprzygotowani do prawdziwej wojny. Powinniśmy uderzyć, zanim zdołają się zjednoczyć."
 flavor_sun.1.t: "Wiara sunnicka"
 flavor_sun.1.d: "W miarę jak coraz więcej naszych poddanych przyjmuje islam, musimy poważnie rozważyć, czy nie powinniśmy ustanowić go religią państwową. Niektórzy będą ganić nas za odwrócenie się od przeszłości, lecz powinniśmy rozważyć, co będzie najlepsze dla naszego państwa i jego mieszkańców."
 flavor_sun.1.a: "Przyjmiemy wiarę sunnicką."
 flavor_sun.1.b: "Nie porzucimy wiary [Root.Religion.GetName]."
 sun_kept_the_faith: "Pozostanie przy wierze"
 desc_sun_kept_the_faith: "Odmówiliśmy porzucenia naszej wiary i postanowiliśmy przeciwstawić się rozprzestrzenianiu islamu w naszym państwie."
 sunda_construction: "Budowa świątyń kandi"
 desc_sunda_construction: "Poświęcamy się budowie nowych świątyń kandi."
 ruler_of_java: "Władcy Jawy"
 desc_ruler_of_java: "Sunda sprawuje teraz bezpośrednią władzę nad całą Jawą."
 flavor_sun.2.t: "Nowa stolica, nowe państwo [Root.GovernmentName]"
 flavor_sun.2.desc: "Banten i Cirebon stały się pod naszym panowaniem ważnymi miastami, a w pobliżu Kalapy założyliśmy nowe miasto nazwane Jayakertą. Każde z nich mogłoby stać się znakomitą siedzibą władzy, gdybyśmy zechcieli przenieść tam dwór i ogłosić nową epokę w dziejach naszego państwa."
 flavor_sun.2.a: "Stolica pozostanie w [Root.Capital.GetCapitalName]."
 flavor_sun.2.b: "Banten będzie naszą stolicą."
 flavor_sun.2.c: "Cirebon będzie znakomitym wyborem."
 flavor_sun.2.d: "Jayakerta stanie się naszą wspaniałą twierdzą."
 flavor_sun.3.t: "Doniosły ślub"
 flavor_sun.3.d: "Wiele lat temu generał Majapahitu Gajah Mada podstępem doprowadził do zawarcia małżeństwa politycznego, które uczyniłoby Sundę zwykłym wasalem Majapahitu. Dziś nie ma mowy o żadnym podstępie. Gdy nasz książę poślubia swoją jawajską wybrankę, podpisywane są traktaty formalizujące podporządkowanie Majapahitu władzy państwa [Root.GetName] [Root.GovernmentName]."
 flavor_sun.3.a: "Majapahit nie będzie już nam zagrażać."
 mnd_bei_impress_sulu_title: "Zdobądź przychylność Sulu"
 mnd_bei_impress_sulu_desc: "Utrzymujemy bliskie stosunki z niewielkim sułtanatem Sulu. Powinniśmy umocnić te więzi, by przygotować grunt pod jego późniejszą integrację z naszym imperium."
 mnd_bei_conquer_mindanao_title: "Podbij Mindanao"
 mnd_bei_conquer_mindanao_desc: "Z pomocą naszych poddanych z Sulu rozpoczniemy inwazję na Mindanao."
 mnd_bei_conquer_philippines_title: "Podbój wysp Visayas"
 mnd_bei_conquer_philippines_desc: "Po podboju wysp Visayas nasze kampanie na północnym wschodzie dobiegną końca."
 mnd_bei_impress_maynila_title: "Zdobądź przychylność Maynili"
 mnd_bei_impress_maynila_desc: "Radża Maynili z pewnością wie, że nie jest w stanie nam się przeciwstawić. Być może, zabiegając o jego względy, skłonimy go do dobrowolnego podporządkowania się naszej władzy."
 mnd_bei_conquer_luzon_title: "Podbij Luzon"
 mnd_bei_conquer_luzon_desc: "Gdy Maynila znajduje się już pod naszym panowaniem, droga do [Root.GetAdjective] podboju Luzonu stoi otworem."
 bei_easy_colony: "Potencjalna kolonia Brunei"
 desc_bei_easy_colony: "To miejsce uznano za doskonałego kandydata na kolonię Brunei."
 mnd_bei_conquer_sambas_title: "Podbij Sambas"
 mnd_bei_conquer_sambas_desc: "Sąsiednie królestwo Sambas jest jedyną przeszkodą na drodze do naszej dominacji nad zachodnim Borneo."
 mnd_bei_unite_borneo_title: "Zjednocz Borneo"
 mnd_bei_unite_borneo_desc: "Musimy zjednoczyć całe Borneo pod berłem imperium Brunei."
 mnd_bei_conquer_berau_title: "Podbij Berau"
 mnd_bei_conquer_berau_desc: "Rozpoczniemy podbój wschodniego Borneo od ataku na królestwo Berau."
 mnd_bei_civil_strife_title: "Zażegnaj spory wewnętrzne"
 mnd_bei_civil_strife_desc: "Gdy sukcesja nie jest zabezpieczona, zawsze istnieje ryzyko wybuchu wojny domowej. Musimy uniknąć takiego obrotu spraw albo stawić czoła jego konsekwencjom."
 bei_civil_war_tt: "Doszło do katastrofy §YWojna domowa§!."
 no_bei_civil_war_tt: "Nie doszło do katastrofy §YWojna domowa§!."
 mnd_maj_subjects_title: "Zażądaj lojalności"
 mnd_maj_subjects_desc: "Majapahit władał niegdyś rozległą siecią państw wasalnych i trybutarnych. Musimy zapewnić sobie lojalność królestw, które nadal pozostają w naszym uścisku, i spróbować odbudować część dawnego imperium."
 maj_no_more_subject_liberty_tt: "Wydarzenie §YNielojalność wobec Majapahitu§! nie będzie już występować."
 mnd_maj_stability_title: "Przywróć porządek"
 mnd_maj_stability_desc: "Wiara w monarchię słabnie, ponieważ sukcesja jest nieustannie kwestionowana. Musimy przywrócić porządek w państwie i zapewnić lud, że niebezpieczeństwo minęło."
 maj_no_more_pretenders_tt: "Rebelianci §YPretendenci§! nie będą już kwestionować każdej sukcesji."
 maj_end_disaster_mission_tt: "Katastrofa §YUpadek Majapahitu§! dobiegnie końca."
 mnd_maj_end_disaster_title: "Zapobiegnij upadkowi"
 mnd_maj_end_disaster_desc: "Nasz gwałtowny upadek musi zostać równie gwałtownie odwrócony. Gdy zabezpieczymy tron, naszą wiarę i lojalność poddanych, będziemy mogli wydostać się z mroku."
 mnd_maj_religion_title: "Chroń wiarę"
 mnd_maj_religion_desc: "Tradycyjna hinduistyczno-buddyjska wiara Majapahitu słabnie, w miarę jak na Nusantarze przybywa muzułmańskich kupców i zdobywców. Musimy zadbać o to, by lud miał silną wiarę, która wskaże mu drogę."
 maj_religion_mission_tt: "Katastrofa §YUpadek Majapahitu§! trwa od co najmniej §Y10§! lat."
 maj_no_more_bad_religion_events_tt: "Wydarzenie §YRozprzestrzenianie islamu§! nie będzie już występować, a ryzyko pojawienia się państw odrywających się od naszego władztwa zniknie."
 maj_no_more_bad_religion_events_tt_2: "Ryzyko pojawienia się państw odrywających się od naszego władztwa zniknie."
 maj_subject_liberty_modifier: "Lojalność wobec Majapahitu"
 desc_maj_subject_liberty_modifier: "Wymusiliśmy lojalność wobec władzy Majapahitu."
 maj_legitimacy_modifier: "Przywrócona legitymizacja"
 desc_maj_legitimacy_modifier: "Przywróciliśmy zaufanie do państwa Majapahitu i jego monarchii."
 maj_religion_modifier: "Triumf religijny"
 desc_maj_religion_modifier: "Doprowadziliśmy do porozumienia religijnego w Majapahicie."
 mnd_maj_enforce_loyalty_title: "Wymuś lojalność"
 mnd_maj_enforce_loyalty_desc: "Nie wystarczy już, że nasi poddani zaledwie powstrzymują się od otwartego buntu. Nadszedł czas, by wymusić prawdziwą lojalność."
 mnd_maj_rein_in_malacca_title: "Poskrom Malakkę"
 mnd_maj_rein_in_malacca_desc: "Malakka, nasz dawny rywal, zyskała znaczenie dzięki osławionej flocie skarbów Zheng He, która położyła kres naszej hegemonii na Nusantarze. Musimy zmiażdżyć rywali i ponownie włączyć półwysep do naszego państwa."
 mnd_maj_rein_in_brunei_title: "Poskrom Brunei"
 mnd_maj_rein_in_brunei_desc: "Brunei niegdyś lojalnie uznawało zwierzchnictwo Majapahitu, lecz później zbuntowało się i stworzyło własne imperium. Musimy ponownie rzucić je na kolana."
 mnd_maj_gaja_madas_oath_title: "Przysięga Gajah Mady"
 mnd_maj_gaja_madas_oath_desc: "Wielki mąż stanu Gajah Mada przysiągł, że cały Nusantara zostanie podbity przez Majapahit. Pamiętamy tę przysięgę i wypełnimy ją."
 mnd_maj_subjugate_the_mainland_title: "Podporządkuj kontynent"
 mnd_maj_subjugate_the_mainland_desc: "Nawet Gajah Mada nie marzył o tym, że Majapahit pewnego dnia zdominuje królestwa tajskie i khmerskie. Rozszerzymy imperium do niespotykanych dotąd rozmiarów."
 mnd_maj_negara_agung_title: "Negara Agung"
 mnd_maj_negara_agung_desc: "Rozszerzanie granic imperium i obejmowanie nowych ludów naszym panowaniem to wielkie przedsięwzięcie. Musimy jednak zadbać również o nasze ziemie rdzenne, czyli negara agung. Stolica powinna być wielkim miastem, ośrodkiem handlu i kultury z całego Nusantary."
 mnd_maj_chakravarti_title: "Ćakrawarti"
 mnd_maj_chakravarti_desc: "Idealny monarcha rządzi idealnym państwem, materialnym i duchowym centrum świata. Majapahit stanie się takim państwem."
 mnd_maj_candi_shrines_title: "Świątynie Ćandi"
 mnd_maj_candi_shrines_desc: "Na całym Nusantarze znajdują się liczne zrujnowane lub opuszczone świątynie kandi, w których niegdyś oddawano cześć bóstwom hinduizmu i buddyzmu. Musimy je odnowić, by odrodziła się nasza wiara."
 mnd_maj_porch_of_mecca_title: "Przedsionek Mekki"
 mnd_maj_porch_of_mecca_desc: "Region Atjeh stał się punktem wypadowym dla szerzenia islamu na Nusantarze. Musimy zdławić tę nową wiarę i przywrócić Atjeh pod władzę Majapahitu."
 no_more_muslims_tt: "Żadne państwo ze stolicą w regionie §YMalaje§! lub §YIndonezja§! nie wyznaje religii z grupy §YMuzułmańskie§!."
 all_muslims_tt: "Każde państwo ze stolicą w regionie §YMalaje§! lub §YIndonezja§! wyznaje religię z grupy §YMuzułmańskie§!."
 mnd_maj_prepare_eastern_campaigns_title: "Wschodnie kolonie"
 mnd_maj_prepare_eastern_campaigns_desc: "Majapahit pobierał niegdyś trybut od licznych pomniejszych królestw Nusa Tenggara. Nadszedł czas, byśmy sprawowali nad nimi bardziej bezpośrednią władzę. Powinniśmy zgromadzić flotę i przygotować środki do kolonizacji tych wysp, zanim rozpoczniemy kampanię na wschodzie."
