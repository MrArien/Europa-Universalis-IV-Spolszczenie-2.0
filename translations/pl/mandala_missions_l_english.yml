l_english:
 flavor_ter.1.t: "Przyprawy muszą płynąć"
 flavor_ter.1.desc: "[Root.GetName] ma wielkie ambicje ekspansji, która zaczyna się od okolicznych wysp. Musimy wybrać miejsce na założenie kolejnej kolonii [Root.GetAdjective]."
 flavor_ter.1.a: "[648.GetName]."
 flavor_ter.1.b: "[644.GetName]."
 flavor_ter.1.c: "[647.GetName]."
 flavor_ter.1.d: "[2717.GetName]."
 flavor_ter.1.e: "[645.GetName]."
 flavor_ter.1.f: "[1245.GetName]."
 flavor_ter.1.g: "[ter_colony_province.GetName]."
 flavor_ter.1.h: "Przyprawy płyną."
 flavor_ter.2.a: "[2693.GetName]."
 flavor_ter.2.b: "[632.GetName]."
 spice_defeat_rival_title: "Pokonaj naszego rywala"
 spice_defeat_rival_desc: "Jeśli chcemy założyć imperium na Molukach, musimy działać szybko, by wyeliminować rywalizujące ze sobą królestwa."
 spice_colony_1_title: "Kolonia [Root.GetAdjective]"
 spice_colony_1_desc: "Nasza pierwsza kolonia jest już w trakcie zakładania — to początek wielu osad, które złożą się na przyszłe imperium. Musimy zapewnić jej ochronę."
 spice_colony_2_title: "Ekspansja [Root.GetAdjective]"
 spice_colony_2_desc: "Powstaje druga kolonia, przybliżając nas do realizacji naszych celów. Powinniśmy pomóc jej się rozwijać."
 spice_colony_3_title: "Dominacja [Root.GetAdjective]"
 spice_colony_3_desc: "Wybraliśmy już miejsce pod trzecią kolonię. Miejmy nadzieję, że będzie najwspanialsza ze wszystkich."
 spice_colony_modifier: "Imperium przypraw"
 desc_spice_colony_modifier: "Dysponujemy teraz środkami pozwalającymi zakładać kolejne kolonie na całych Molukach."
 spice_colony_province_modifier: "Kolonia na Wyspach Korzennych"
 desc_spice_colony_province_modifier: "Wskazaliśmy tę prowincję jako miejsce założenia naszej następnej kolonii."
 spice_island_colony_tt: "Wybrano jako kolonię na Wyspach Korzennych"
 spice_export_spice_title: "Eksport goździków"
 spice_export_spice_desc: "Nasze raczkujące imperium morskie znacznie się rozrosło od jego powstania. Teraz nadszedł czas, aby potwierdzić naszą dominację na morzach."
 spice_conquer_sulawesi_title: "Podbij Sulawesi"
 spice_conquer_sulawesi_desc: "Mamy pieniądze i mamy okręty. Nadszedł czas, by dowieść naszej potęgi militarnej i rozpocząć inwazję na Celebes."
 mnd_peg_sadhuim_title: "Odbuduj Sadhuim"
 mnd_peg_sadhuim_desc: "Sadhuim było niegdyś stolicą wielkiego królestwa Monów, które istniało przed wiekami. Powinniśmy odbudować miasto i przywrócić mu dawną świetność."
 mnd_peg_burma_trade_title: "Handel na Irawadi"
 mnd_peg_burma_trade_desc: "Zapewnimy sobie dominację w handlu na rzece Irawadi, pokonując konkurentów i tworząc wielką flotę kupiecką."
 mnd_peg_sumatra_title: "Przyczółek na Sumatrze"
 mnd_peg_sumatra_desc: "Jeśli chcemy kontrolować lukratywny handel przyprawami, musimy najpierw zdobyć przyczółek w świecie malajskim. Atjeh na krańcu Sumatry będzie doskonałym miejscem do rozpoczęcia ekspansji."
 mnd_peg_spice_trade_title: "Zdominuj handel przyprawami"
 mnd_peg_spice_trade_desc: "Po zdobyciu przyczółka możemy skierować uwagę na najbogatsze porty handlowe regionu. Staniemy się panami handlu przyprawami."
 mnd_peg_arakan_title: "Ujarzmij Arakan"
 mnd_peg_arakan_desc: "Sułtanowie Arakanu znajdują się w niepewnej pozycji między nami a potężnym Sułtanatem Bengalu. Ta sytuacja raczej nie potrwa długo, więc powinniśmy ich podbić, zanim Bengal będzie mieć szansę."
 mnd_peg_bengal_title: "Zaatakuj Bengal"
 mnd_peg_bengal_desc: "Bengal jest bogaty, ludny i prestiżowy. Podbicie tej ziemi wyeliminowałoby wielkie zagrożenie, a jednocześnie znacznie wzmocniło nasze własne państwo."
 mnd_peg_hariphunchai_title: "Przywróć Hariphunchai"
 mnd_peg_hariphunchai_desc: "Przed migracjami ludów tajskich północą władało królestwo Monów Hariphunchai. Powinniśmy odtworzyć to państwo pod naszym przewodnictwem."
 mnd_peg_dvarati_title: "Odzyskaj Dwarawati"
 mnd_peg_dvarati_desc: "Mówiąca językiem mon cywilizacja Dwarawati niegdyś dominowała na ziemiach obecnie rządzonych przez Tajów. Nadszedł czas odrodzenia tej starożytnej kultury."
 mnd_peg_restore_the_mon_title: "Przesiedlenie Monów"
 mnd_peg_restore_the_mon_desc: "Lud Monów niegdyś zamieszkiwał rozległe obszary Azji Południowo-Wschodniej, lecz dziś został zepchnięty do Dolnej Birmy. Powinniśmy ponownie szerzyć naszą kulturę."
 mnd_peg_ava_title: "Staw opór Birmańczykom"
 mnd_peg_ava_desc: "Królestwo Ava sprawuje hegemonię nad Birmańczykami, a jego potęga zagraża rozszerzeniem się na nasze ziemie. Powinniśmy przeciwstawić się jego ambicjom i zdobyć hegemonię nad południowymi miastami Bamarów."
 mnd_peg_irrawaddy_title: "W górę Irawadi"
 mnd_peg_irrawaddy_desc: "Staliśmy się wystarczająco silni, by rzucić wyzwanie potędze Ava. Rozpoczniemy kampanię wzdłuż Irawadi i podporządkujemy sobie Birmańczyków."
 mnd_peg_pagan_title: "Modlitwa w Pagan"
 mnd_peg_pagan_desc: "Nasi dawni rywale z królestwa Pagan byli znakomitymi architektami i gorliwymi buddystami. Ich pagody popadły w ruinę pod rządami Ava — powinniśmy je odrestaurować."
 peg_pagan: "Pagody Paganu"
 desc_peg_pagan: "Wiedza architektoniczna królestwa Pagan pomaga nam w realizacji własnych przedsięwzięć budowlanych."
 mnd_peg_golden_land_title: "Złota kraina"
 mnd_peg_golden_land_desc: "Suvarnabhumi było legendarnym królestwem starożytności. Wiele imperiów marzyło o odtworzeniu chwały Złotej Krainy, lecz żadnemu się to nie udało. My będziemy pierwsi."
 mnd_peg_religious_devotion_title: "Monastyczne oddanie"
 mnd_peg_religious_devotion_desc: "Musimy zyskać przychylność buddyjskich mnichów opiekujących się naszymi pagodami i hojnie wspierać budowę oraz odnowę świętych miejsc."
 peg_devotion: "Religijne oddanie"
 desc_peg_devotion: "Pobożność naszego ludu pomaga nam troszczyć się o utrzymanie naszych zabytków."
 mnd_peg_golden_pagoda_title: "Odnów Złotą Pagodę"
 mnd_peg_golden_pagoda_desc: "Złota Pagoda w Dagonie jest naszym największym osiągnięciem, lecz wymaga renowacji. Musi stać się najwspanialszym pomnikiem świata buddyjskiego."
 mnd_peg_ceylon_title: "Więzi z Cejlonem"
 mnd_peg_ceylon_desc: "Cejlon jest najświętszym miejscem w buddyzmie therawadyjskim i ma ogromne znaczenie dla naszych tradycji zakonnych."
 restored_sadhuim: "Odbudowa Sadhuim"
 desc_restored_sadhuim: "Miasto Sadhuim jest odbudowane"
 mon_restoration: "Przesiedlenie Monów"
 desc_mon_restoration: "Musimy przywrócić kulturze Monów jej dawną pozycję i znaczenie."
 restored_golden_pagoda: "Odnowienie Złotej Pagody"
 desc_restored_golden_pagoda: "Złota Pagoda została odnowiona."
 peg_ceylon_modifier: "Lankijski buddyzm"
 desc_peg_ceylon_modifier: "Odnowiliśmy nasze więzi z lankijskim buddyzmem."
 sailor_mon: "Porozumienia z Orang Laut"
 desc_sailor_mon: "Zawarliśmy porozumienie z ludem Orang Laut."
 mon_renaissance: "Odrodzenie Monów"
 desc_mon_renaissance: "Cywilizacja Mon przeżywa nowy złoty wiek."
 shan_confederation_title: "Zjednocz Szan"
 shan_confederation_desc: "Pomniejszych władców Szanów należy zjednoczyć pod jednym sztandarem. Dopiero wtedy będziemy mogli rozszerzyć nasze panowanie na całą Birmę i stworzyć wielkie imperium."
 shan_domination_title: "Dominacja Szan"
 shan_domination_desc: "Wreszcie jesteśmy zjednoczeni. Teraz musimy zmobilizować nasze armie przeciwko królestwu Ava, które arogancko ogłasza się hegemonem całej Birmy. Dziś rozpoczyna się era dominacji Szanów."
 shan_confederation_tt: "Wszystkie państwa z kulturą główną §YSzan§! muszą być naszymi sojusznikami lub poddanymi."
 shan_confederation_tt_2: "Żadne państwo z kulturą główną §YSzan§! nie posiada armii większej niż §Y[Root.GetName]§!"
 mnd_siam_prepare_title: "Przygotowania do inwazji"
 mnd_siam_prepare_desc: "Przygotowując się do naszej inwazji na Malakkę, musimy zbudować stosowną flotę, a także upewnić się, że nasze działania nie sprowokują chińskiego cesarza."
 mnd_siam_mlc_title: "Zaatakuj Malakkę"
 mnd_siam_mlc_desc: "Malakka stała się prosperującym portem handlowym i byłaby dobrym dodatkiem do naszych posiadłości na Półwyspie Malajskim."
 mnd_siam_trade_title: "Kontroluj handel przyprawami"
 mnd_siam_trade_desc: "Teraz, gdy kontrolujemy Malakkę, handel przyprawami stoi przed nami otworem. Powinniśmy zabezpieczyć kolejne faktorie w pobliżu Cieśniny Malakka, aby umocnić naszą dominację w handlu przyprawami."
 mnd_siam_transfer_development_title: "Zaludnij [Root.Capital.GetCapitalName]"
 mnd_siam_transfer_development_desc: "[Root.Capital.GetCapitalName] jest wielkim miastem, lecz może stać się jeszcze wspanialsze, jeśli zmusimy mieszkańców peryferii lub podbitych wrogów do osiedlenia się w stolicy."
 mnd_siam_mandala_title: "Stwórz mandalę"
 mnd_siam_mandala_desc: "Powinniśmy ukształtować nasze państwo na wzór mandali. Nie jesteśmy w stanie sprawować bezpośredniej władzy nad każdym zakątkiem królestwa, dlatego powierzamy część kompetencji państwom wasalnym, które będą rządzić w naszym imieniu."
 mnd_siam_great_monument_title: "Spójrzcie na moje dzieła"
 mnd_siam_great_monument_desc: "Najwspanialszym świadectwem rozkwitu cywilizacji są jej pomniki. Niech wszyscy, którzy ujrzą nasze dzieła, popadną w rozpacz."
 emerald_buddha_mission_tt: " Posiada modyfikator prowincji §YSzmaragdowy Budda§!"
 mnd_siam_city_of_worlds_desire_title: "Miasto, które pragnie świat"
 mnd_siam_city_of_worlds_desire_desc: "Nie wystarczy, by [Root.Capital.GetCapitalName] było wielkim miastem. Musi stać się największym miastem świata i siedzibą całej doczesnej władzy."
 mnd_siam_devaraja_title: "Dewaradża"
 mnd_siam_devaraja_desc: "[Root.Monarch.GetTitle] nie jest jedynie śmiertelnym władcą, lecz także duchowym centrum naszego państwa. Musimy zadbać, by nasi poddani mieli pewność, że monarchia jest bezpieczna, a wiara chroniona."
 mnd_siam_revolution_title: "Syjamska rewolucja"
 mnd_siam_revolution_desc: "Zachodnie mocarstwa zaczynają zagrażać [Root.GetName]. Musimy poznać ich zamiary, a następnie albo je wypędzić, albo znaleźć sposób, by ich obecność przyniosła nam korzyści."
 mnd_siam_royal_duel_title: "Wygraj królewski pojedynek"
 mnd_siam_royal_duel_desc: "Zgodnie z tradycją [Root.Monarch.GetTitle] osobiście bierze udział w walce, przemierzając pole bitwy na grzbiecie słonia. Nie ma większego wojskowego osiągnięcia niż osobiste pokonanie innego króla w bitwie."
 mnd_siam_subjugate_khmer_title: "Zmiażdż Khmerów"
 mnd_siam_subjugate_khmer_desc: "W 1431 roku złupiliśmy khmerskie miasto Angkor i zniszczyliśmy niegdyś dominujące imperium Khmerów. To jednak za mało. Musimy podporządkować ich sobie całkowicie."
 mnd_siam_divide_the_lao_title: "Podziel Lang Czang"
 mnd_siam_divide_the_lao_desc: "Lan Xang jest rozległym, lecz kruchym królestwem. Byłoby dla nas najkorzystniej, gdyby jego słabości wyszły na jaw, zanim podejmiemy próbę aneksji."
 mnd_siam_subjugate_the_lao_title: "Ujarzmij Lao"
 mnd_siam_subjugate_the_lao_desc: "Po rozbiciu Lan Xang możemy podporządkować sobie mniejsze królestwa laotańskie i uczynić je wasalami [Root.GetName]."
 mnd_siam_subjugate_vietnam_title: "Ujarzmij Wietnam"
 mnd_siam_subjugate_vietnam_desc: "Władcy Dai Viet uważają, że są bezpieczni za swoimi górami i pod opieką chińskiego cesarza. Udowodnimy im, że ich przekonanie jest błędne."
 mnd_siam_defy_china_title: "Przeciwstaw się Chinom"
 mnd_siam_defy_china_desc: "Chiny od zawsze rzucają wielki cień na Azję Południowo-Wschodnią, stanowiąc stałe, choć nieregularne zagrożenie dla naszej suwerenności. Musimy stać się wystarczająco silni, by otwarcie rzucić wyzwanie cesarzowi i najechać południowe Chiny."
 mnd_siam_take_the_mandate_title: "Przejmij mandat"
 mnd_siam_take_the_mandate_desc: "Chińscy cesarze szczycą się posiadaniem mandatu niebios."
 siam_mandate_modifier: "Mandat Syjamu"
 desc_siam_mandate_modifier: "Przejeliśmy mandat niebios, czyniąc nas prawowitymi władcami Chin."
 siam_accepted_mon: "Ochrona kultury Monów"
 desc_siam_accepted_mon: "Zapewniliśmy ludowi Monów ochronę przed tymi, którzy chcieliby go skrzywdzić i wypędzić z ojczystych ziem."
 mnd_siam_inherit_sukhothai_title: "Odziedzicz Sukhothai"
 mnd_siam_inherit_sukhothai_desc: "Po podporządkowaniu królestwa Sukhothai przed kilkudziesięciu laty osadziliśmy na jego tronie księcia Trailoka. Powinniśmy doprowadzić do zjednoczenia obu królestw."
 mnd_siam_subjugate_chiang_mai_title: "Podporządkuj Chiang Mai"
 mnd_siam_subjugate_chiang_mai_desc: "Władcy Chiang Mai sądzą, że odizolowana północ zapewnia im bezpieczeństwo. Pokażemy im, że nie zdołają łatwo uniknąć naszego panowania."
 mnd_siam_protect_the_mon_title: "Chroń Monów"
 mnd_siam_protect_the_mon_desc: "Lud Monów niegdyś władał wielkim imperium i dał początek wielu elementom naszej własnej kultury. Jego dawna złota epoka dawno przeminęła, dlatego powinniśmy objąć go opieką."
 mnd_siam_defeat_burma_title: "Rozgrom Birmę"
 mnd_siam_defeat_burma_desc: "Nie możemy dopuścić do powstania nowego imperium na zachodzie. Musimy zrobić wszystko, by zdławić potencjalne zagrożenia, zanim staną się dla nas rzeczywistym wyzwaniem."
 mnd_siam_conquer_burma_title: "Zaatakuj Birmę"
 crush_burma_tt: "Żadne niepodległe ani trybutarne państwo ze stolicą w regionie §YBirma§! nie ma więcej niż §Y50§! rozwoju."
 mnd_siam_conquer_burma_desc: "Nie możemy ufać, że Birma pozostanie na zawsze spacyfikowana. Musimy podporządkować sobie cały region."
 had_siamese_revolution_tt: "Ukończono katastrofę §YRewolucja syjamska§!"
 had_siamese_revolution_tt_2: "Żadne państwo §YZachodu§! nie posiada prowincji na subkontynencie §YWyspy Korzenne§!."
 mnd_siam_absolutism_title: "Królewski absolutyzm"
 mnd_siam_absolutism_desc: "Władza [Root.Monarch.GetTitle] nie podlega żadnej dyskusji. Musimy scentralizować państwo i ustanowić rządy absolutne, aby wszyscy mogli cieszyć się jego blaskiem."
 mnd_siam_japan_title: "Poselstwo do Japonii"
 mnd_siam_japan_desc: "Władcy Japonii słyną z nieufności wobec obcych wpływów i trudno nawiązać z nimi przyjazne stosunki. Jeśli jednak uda nam się ustanowić skuteczne poselstwo, być może zdołamy pozyskać do naszej służby budzących grozę samurajów."
 japanese_mercs_flag: "Kompania najemników §YJapońscy ochotnicy§! stanie się dostępna do zaciągu."
 merc_japanese_volunteers: "§JJapońscy ochotnicy§!"
 siam_mandala_modifier: "Wielka mandala"
 desc_siam_mandala_modifier: "Oparliśmy ustrój naszego państwa na modelu mandali i stworzyliśmy prawdziwie harmonijną wspólnotę, w której każdy zna swoje miejsce."
 siam_monument_modifier: "Budowniczowie pomników"
 desc_siam_monument_modifier: "Dowiedliśmy, że jesteśmy wybitnymi architektami i mistrzami logistyki wielkich przedsięwzięć budowlanych."
 siam_best_city_modifier: "Miasto pożądania świata"
 desc_siam_best_city_modifier: "Nasza stolica jest bezsprzecznie najwspanialszym miastem świata, jaśniejącym centrum całej doczesnej władzy."
 siam_trade: "Syjamska dominacja handlowa"
 desc_siam_trade: "Zdominowaliśmy handel przyprawami i możemy kierować płynące z niego bogactwa do skarbca państwa."
 khmer_end_dark_age_tt: "Katastrofa §YCiemne wieki Kambodży§! dobiega końca."
 mnd_khm_restore_angkor_title: "Odbuduj Angkor"
 mnd_khm_restore_angkor_desc: "Niegdyś wspaniałe miasto Angkor leży w ruinach po brutalnym złupieniu przez syjamskie armie. Musimy je odbudować."
 mnd_khm_city_of_temples_title: "Miasto Świątyń"
 mnd_khm_city_of_temples_desc: "Angkor Wat było niegdyś najwspanialszą świątynią świata, lecz dziś popada w ruinę. Powinniśmy je odbudować."
 mnd_khm_religion_title: "Sprawy wiary"
 mnd_khm_religion_desc: "Przejście na buddyzm therawady nie przebiegło całkowicie bezproblemowo. Wielu nadal wyznaje dawną religię hinduistyczną, a liczni mieszkańcy zachowali również starsze wierzenia w lokalne bóstwa. Musimy znaleźć rozwiązanie naszych podziałów religijnych."
 mnd_khm_resurgence_title: "Odrodzenie Khmerów"
 mnd_khm_resurgence_desc: "Ciemne wieki nie mogą trwać wiecznie. Przetrwamy mrok i odnajdziemy drogę ku światłu."
 mnd_khm_golden_age_title: "Drugi złoty wiek"
 mnd_khm_golden_age_desc: "Imperium Khmerów ponownie powstanie, rozpoczynając drugą złotą epokę."
 new_khmer_golden_age: "Nowa złota epoka Khmerów"
 desc_new_khmer_golden_age: "Przed nami nowa złota epoka."
 mnd_khm_enlightened_rule_title: "Oświecone rządy"
 mnd_khm_enlightened_rule_desc: "Król nie jest zwykłym śmiertelnikiem, lecz źródłem boskiego oświecenia. Musimy zapewnić państwu wystarczający zasięg władzy, by jego światło dotarło do wszystkich poddanych."
 mnd_khm_rebuild_title: "Odbuduj miasta"
 mnd_khm_rebuild_desc: "Najazdy i klęski żywiołowe spustoszyły nasze ziemie. Musimy ponownie zaludnić gospodarstwa i zadbać o wystarczające dostawy żywności dla wszystkich."
 mnd_khm_irrigation_title: "Zaawansowane nawadnianie"
 mnd_khm_irrigation_desc: "Nasze imperium było niegdyś bogate i dostatnie dzięki rozległej sieci kanałów wykorzystywanych zarówno do nawadniania pól, jak i żeglugi. Powinniśmy odbudować te kanały, by rozwinąć rolnictwo."
 mnd_khm_protect_the_cham_title: "Chroń Czampę"
 mnd_khm_protect_the_cham_desc: "Czampa poniosła klęski z rąk Dai Viet i prawdopodobnie nie zdoła długo się utrzymać. Powinniśmy podporządkować sobie królestwa Czamów, by uchronić je przed losem pod rządami Wietnamczyków."
 mnd_khm_subjugate_dia_viet_title: "Ujarzmij Dai Viet"
 mnd_khm_subjugate_dia_viet_desc: "Dai Viet ma wielkie ambicje rozszerzenia południowych granic. Nie możemy pozwolić, by wkroczyło na nasze ziemie."
 mnd_khm_avenge_angkor_title: "Pomścij Angkor"
 mnd_khm_avenge_angkor_desc: "Złupienie Angkoru było wielkim upokorzeniem. Odpłacimy naszym wrogom tym samym."
 mnd_khm_subjugate_ayu_title: "Podporządkuj Ajutthaję"
 mnd_khm_subjugate_ayu_desc: "Klęska, którą ponieśliśmy z rąk Ajutthaji, nigdy nie może się powtórzyć. Musimy podporządkować sobie jej królestwo."
 mnd_khm_restored_empire_title: "Przywrócenie Imperium"
 mnd_khm_restored_empire_desc: "Imperium Khmerów władało niegdyś rozległymi obszarami kontynentu, rządząc wieloma ludami pod przewodnictwem oświeconych władców. Musimy odbudować nasze imperium."
 mnd_khm_reclaim_the_north_title: "Odzyskaj północ"
 mnd_khm_reclaim_the_north_desc: "Północna część naszego imperium znalazła się pod panowaniem Lan Xang. Odzyskamy nasze prawowite ziemie."
 mnd_khm_subjugate_laos_title: "Ujarzmij Lang Czang"
 mnd_khm_subjugate_laos_desc: "W okresie upadku imperium tolerowaliśmy niepodległość Laotańczyków, lecz teraz, gdy znów rośniemy w siłę, nie możemy na to pozwolić."
 mnd_khm_overseas_adventures_title: "Zamorskie wyprawy"
 mnd_khm_overseas_adventures_desc: "Nie ma powodu, byśmy ograniczali się do granic dawnego imperium. Powinniśmy spojrzeć poza wybrzeże, ku bogactwom Borneo."
 mnd_khm_defy_china_title: "Przeciwstaw się Chinom"
 mnd_khm_defy_china_desc: "Chiny uważają, że należą im się daniny z całej Azji Południowo-Wschodniej. Nie możemy kłaniać się przed tym fałszywym cesarzem."
 mnd_khm_take_the_mandate_title: "Przejmij mandat"
 mnd_khm_take_the_mandate_desc: "Jeśli zdobędziemy Mandat Niebios, będziemy mogli samodzielnie rządzić Chinami i dowieść wszystkim, że nasze prawo do panowania jest boskie."
 mnd_khm_invade_burma_title: "Zaatakuj Birmę"
 mnd_khm_invade_burma_desc: "Birma zagraża zjednoczeniem zwaśnionych królestw i podważeniem naszej dominacji. Musimy rozszerzyć granice na zachód, by temu zapobiec."
 angkor_restoration: "Odbudowa Angkoru"
 desc_angkor_restoration: "Po przywróceniu Angkor Wat do dawnej świetności nasi architekci zdobyli doświadczenie i zapał potrzebne do rozpoczęcia kolejnych przedsięwzięć budowlanych w całym imperium."
 angkor_complete: "Miasto świątyń"
 desc_angkor_complete: "Angkor Wat przewyższa dawną świetność i jest teraz najwspanialszą budowlą świata."
 khm_navy: "Zamorskie wyprawy"
 desc_khm_navy: "Dzięki nowo zbudowanej flocie Imperium Khmerów jest gotowe do prowadzenia wypraw przez ocean."
 subjugation_of_ayu: "Ujarzmienie Ajutthaji"
 desc_subjugation_of_ayu: "Pokonaliśmy i podporządkowaliśmy sobie naszych największych rywali. Wszyscy, którzy nam się pokłonią, poznają teraz cenę nieposłuszeństwa."
 khm_burma_campaign: "Dziedzictwo kampanii birmańskiej"
 desc_khm_burma_campaign: "Nasza inwazja na Birmę była krwawym przedsięwzięciem, z którego wyciągnęliśmy wiele cennych lekcji."
 lna_emerald_buddha_title: "Chroń świątynię"
 lna_emerald_buddha_desc: "Szmaragdowy Budda musi być bezpiecznie przechowywany w naszym kraju, ponieważ wielu chce go ukraść."
 lna_emerald_buddha_tt: "Jakakolwiek posiadana prowincja ma modyfikator §YSzmaragdowy Budda§!"
 lna_rice_fields_title: "Milion pól ryżowych"
 lna_rice_fields_desc: "Lan Na jest żyzną i pracowitą krainą. Musimy w pełni wykorzystać jej potencjał."
 lna_sukhothai_title: "Podbij Sukhothai"
 lna_sukhothai_desc: "Jeśli chcemy stać się dominującą potęgą wśród ludów tajskich, musimy najpierw podbić dawną siedzibę władzy w Sukhothai."
 lna_ayu_title: "Ujarzmij Ajutthaję"
 lna_ayu_desc: "Władcy Ajutthaji chcieliby, abyśmy stali się jedynie państwem wasalnym pod ich panowaniem. Nie wiedzą jednak, że to oni sami zostaną naszymi poddanymi."
 protected_emerald_buddha: "Ochrona Szmaragdowego Buddy"
 desc_protected_emerald_buddha: "Świątynia zawierająca świętego Szmaragdowego Buddę została odpowiednio ufortyfikowana przed tymi, którzy chcieliby ją nam ukraść."
 suk_restore_sukhothai_title: "Przywróć Sukhothai"
 suk_restore_sukhothai_desc: "Sukhothai znacznie podupadło i stało się zaledwie wasalem potężniejszej Ajutthaji. Musimy odzyskać dawną chwałę, przywracając władzę w Sukhothai."
 suk_absorb_ayu_title: "Wchłoń Ajutthaję"
 suk_absorb_ayu_desc: "Musimy zintegrować Ajutthaję z naszym państwem, aby ponownie stać się dominującą potęgą Syjamu."
 suk_conquer_chiang_mai_title: "Ujarzmij Lanna"
 suk_conquer_chiang_mai_desc: "Władcy Chiang Mai sądzą, że odizolowana północ zapewnia im bezpieczeństwo. Pokażemy im, że nie zdołają łatwo uniknąć naszego panowania."
 buddha: "Budda"
 buddha_desc: "Założyciel wiary buddyjskiej. Idee buddyzmu nadal odgrywają istotną rolę w naszej praktyce hinduizmu."
 sun_consider_islam_title: "Rozważ islam"
 sun_consider_islam_desc: "Wiara islamska szybko rozprzestrzenia się na całym Nusantara. Powinniśmy lepiej poznać tę religię i zastanowić się, czy jest dla nas odpowiednia."
 sun_develop_cities_title: "Rozwój nowych miast"
 sun_develop_cities_desc: "Czasy się zmieniają, a miasta powstają i upadają. Musimy rozwijać nowe ośrodki handlu i osadnictwa, aby mogły stać się centrami władzy naszego państwa."
 sun_candi_temples_title: "Odbuduj świątynie kandi"
 sun_candi_temples_desc: "Jawa jest pełna świątyń kandi, które haniebnie dopuszczono do ruiny i zapomnienia. Musimy podjąć się ich odbudowy i odzyskać te święte miejsca."
 sun_borobudur_title: "Odbuduj Borobudur"
 sun_borobudur_desc: "Majapahit doprowadził wielką świątynię Borobudur do ruiny. Musimy ją odbudować."
 sun_borobudur: "Odbudowano Borobudur"
 desc_sun_borobudur: "Nasze wysiłki na rzecz odnowienia świątyni wzbogaciły naszą wiedzę architektoniczną."
 sun_rice_production_title: "Zwiększ produkcję ryżu"
 sun_rice_production_desc: "Armia maszeruje na własnym żołądku. Musimy zwiększyć produkcję ryżu, aby zapewnić dobrobyt ludności i zaopatrzenie naszych wojsk."
 sun_majapahit_relations_title: "Dziedzictwo Bubat"
 sun_majapahit_relations_desc: "Wiele lat temu zostaliśmy zdradzeni przez Majapahit, co doprowadziło do tragicznej bitwy pod Bubat. Nasze stosunki od tamtej pory uległy pogorszeniu, być może nieodwracalnie. Być może jedynym sposobem zapewnienia sobie bezpieczeństwa jest podporządkowanie Majapahitu naszej władzy."
 sun_majapahit_relations_tt: "§YMajapahit§! jest niepodległym państwem lub trybutariuszem, a w okresie §YUpadku Majapahitu§! jego niepodległość została zagwarantowana przez §Y[Root.GetName]§!."
 sun_can_vassalize_maj: "Jeśli zagwarantujemy niepodległość §YMajapahitu§!, stanie się on naszym wasalem."
 sun_rule_java_title: "Zapanuj nad Jawą"
 sun_rule_java_desc: "Cała Jawa musi zostać włączona do Królestwa Sundajskiego."
 sun_conquer_lampung_title: "Podbij Lampung"
 sun_conquer_lampung_desc: "Południowa Sumatra słynie z produkcji pieprzu i stanowi doskonały cel naszej ekspansji."
 sun_subjugate_sumatra_title: "Ujarzmij Sumatrę"
 sun_subjugate_sumatra_desc: "Pomniejsi sułtani Sumatry są podzieleni i nieprzygotowani do prawdziwej wojny. Powinniśmy uderzyć, zanim zdołają się zjednoczyć."
 flavor_sun.1.t: "Wiara sunnicka"
 flavor_sun.1.d: "W miarę jak coraz więcej naszych poddanych przyjmuje islam, musimy poważnie rozważyć, czy nie powinniśmy ustanowić go religią państwową. Niektórzy będą ganić nas za odwrócenie się od przeszłości, lecz powinniśmy rozważyć, co będzie najlepsze dla naszego państwa i jego mieszkańców."
 flavor_sun.1.a: "Przyjmiemy wiarę sunnicką."
 flavor_sun.1.b: "Nie porzucimy wiary [Root.Religion.GetName]."
 sun_kept_the_faith: "Pozostanie przy wierze"
 desc_sun_kept_the_faith: "Odmówiliśmy porzucenia naszej wiary i postanowiliśmy przeciwstawić się rozprzestrzenianiu islamu w naszym państwie."
 sunda_construction: "Budowa świątyń kandi"
 desc_sunda_construction: "Poświęcamy się budowie nowych świątyń kandi."
 ruler_of_java: "Władcy Jawy"
 desc_ruler_of_java: "Sunda sprawuje teraz bezpośrednią władzę nad całą Jawą."
 flavor_sun.2.t: "Nowa stolica, nowe państwo [Root.GovernmentName]"
 flavor_sun.2.desc: "Banten i Cirebon stały się pod naszym panowaniem ważnymi miastami, a w pobliżu Kalapy założyliśmy nowe miasto nazwane Jayakertą. Każde z nich mogłoby stać się znakomitą siedzibą władzy, gdybyśmy zechcieli przenieść tam dwór i ogłosić nową epokę w dziejach naszego państwa."
 flavor_sun.2.a: "Stolica pozostanie w [Root.Capital.GetCapitalName]."
 flavor_sun.2.b: "Banten będzie naszą stolicą."
 flavor_sun.2.c: "Cirebon będzie znakomitym wyborem."
 flavor_sun.2.d: "Jayakerta stanie się naszą wspaniałą twierdzą."
 flavor_sun.3.t: "Doniosły ślub"
 flavor_sun.3.d: "Wiele lat temu generał Majapahitu Gajah Mada podstępem doprowadził do zawarcia małżeństwa politycznego, które uczyniłoby Sundę zwykłym wasalem Majapahitu. Dziś nie ma mowy o żadnym podstępie. Gdy nasz książę poślubia swoją jawajską wybrankę, podpisywane są traktaty formalizujące podporządkowanie Majapahitu władzy państwa [Root.GetName] [Root.GovernmentName]."
 flavor_sun.3.a: "Majapahit nie będzie już nam zagrażać."
 mnd_bei_impress_sulu_title: "Zdobądź przychylność Sulu"
 mnd_bei_impress_sulu_desc: "Utrzymujemy bliskie stosunki z niewielkim sułtanatem Sulu. Powinniśmy umocnić te więzi, by przygotować grunt pod jego późniejszą integrację z naszym imperium."
 mnd_bei_conquer_mindanao_title: "Podbij Mindanao"
 mnd_bei_conquer_mindanao_desc: "Z pomocą naszych poddanych z Sulu rozpoczniemy inwazję na Mindanao."
 mnd_bei_conquer_philippines_title: "Podbój wysp Visayas"
 mnd_bei_conquer_philippines_desc: "Po podboju wysp Visayas nasze kampanie na północnym wschodzie dobiegną końca."
 mnd_bei_impress_maynila_title: "Zdobądź przychylność Maynili"
 mnd_bei_impress_maynila_desc: "Radża Maynili z pewnością wie, że nie jest w stanie nam się przeciwstawić. Być może, zabiegając o jego względy, skłonimy go do dobrowolnego podporządkowania się naszej władzy."
 mnd_bei_conquer_luzon_title: "Podbij Luzon"
 mnd_bei_conquer_luzon_desc: "Gdy Maynila znajduje się już pod naszym panowaniem, droga do [Root.GetAdjective] podboju Luzonu stoi otworem."
 bei_easy_colony: "Potencjalna kolonia Brunei"
 desc_bei_easy_colony: "To miejsce uznano za doskonałego kandydata na kolonię Brunei."
 mnd_bei_conquer_sambas_title: "Podbij Sambas"
 mnd_bei_conquer_sambas_desc: "Sąsiednie królestwo Sambas jest jedyną przeszkodą na drodze do naszej dominacji nad zachodnim Borneo."
 mnd_bei_unite_borneo_title: "Zjednocz Borneo"
 mnd_bei_unite_borneo_desc: "Musimy zjednoczyć całe Borneo pod berłem imperium Brunei."
 mnd_bei_conquer_berau_title: "Podbij Berau"
 mnd_bei_conquer_berau_desc: "Rozpoczniemy podbój wschodniego Borneo od ataku na królestwo Berau."
 mnd_bei_civil_strife_title: "Zażegnaj spory wewnętrzne"
 mnd_bei_civil_strife_desc: "Gdy sukcesja nie jest zabezpieczona, zawsze istnieje ryzyko wybuchu wojny domowej. Musimy uniknąć takiego obrotu spraw albo stawić czoła jego konsekwencjom."
 bei_civil_war_tt: "Doszło do katastrofy §YWojna domowa§!."
 no_bei_civil_war_tt: "Nie doszło do katastrofy §YWojna domowa§!."
 mnd_maj_subjects_title: "Zażądaj lojalności"
 mnd_maj_subjects_desc: "Majapahit władał niegdyś rozległą siecią państw wasalnych i trybutarnych. Musimy zapewnić sobie lojalność królestw, które nadal pozostają w naszym uścisku, i spróbować odbudować część dawnego imperium."
 maj_no_more_subject_liberty_tt: "Wydarzenie §YNielojalność wobec Majapahitu§! nie będzie już występować."
 mnd_maj_stability_title: "Przywróć porządek"
 mnd_maj_stability_desc: "Wiara w monarchię słabnie, ponieważ sukcesja jest nieustannie kwestionowana. Musimy przywrócić porządek w państwie i zapewnić lud, że niebezpieczeństwo minęło."
 maj_no_more_pretenders_tt: "Rebelianci §YPretendenci§! nie będą już kwestionować każdej sukcesji."
 maj_end_disaster_mission_tt: "Katastrofa §YUpadek Majapahitu§! dobiegnie końca."
 mnd_maj_end_disaster_title: "Zapobiegnij upadkowi"
 mnd_maj_end_disaster_desc: "Nasz gwałtowny upadek musi zostać równie gwałtownie odwrócony. Gdy zabezpieczymy tron, naszą wiarę i lojalność poddanych, będziemy mogli wydostać się z mroku."
 mnd_maj_religion_title: "Chroń wiarę"
 mnd_maj_religion_desc: "Tradycyjna hinduistyczno-buddyjska wiara Majapahitu słabnie, w miarę jak na Nusantarze przybywa muzułmańskich kupców i zdobywców. Musimy zadbać o to, by lud miał silną wiarę, która wskaże mu drogę."
 maj_religion_mission_tt: "Katastrofa §YUpadek Majapahitu§! trwa od co najmniej §Y10§! lat."
 maj_no_more_bad_religion_events_tt: "Wydarzenie §YRozprzestrzenianie islamu§! nie będzie już występować, a ryzyko pojawienia się państw odrywających się od naszego władztwa zniknie."
 maj_no_more_bad_religion_events_tt_2: "Ryzyko pojawienia się państw odrywających się od naszego władztwa zniknie."
 maj_subject_liberty_modifier: "Lojalność wobec Majapahitu"
 desc_maj_subject_liberty_modifier: "Wymusiliśmy lojalność wobec władzy Majapahitu."
 maj_legitimacy_modifier: "Przywrócona legitymizacja"
 desc_maj_legitimacy_modifier: "Przywróciliśmy zaufanie do państwa Majapahitu i jego monarchii."
 maj_religion_modifier: "Triumf religijny"
 desc_maj_religion_modifier: "Doprowadziliśmy do porozumienia religijnego w Majapahicie."
 mnd_maj_enforce_loyalty_title: "Wymuś lojalność"
 mnd_maj_enforce_loyalty_desc: "Nie wystarczy już, że nasi poddani zaledwie powstrzymują się od otwartego buntu. Nadszedł czas, by wymusić prawdziwą lojalność."
 mnd_maj_rein_in_malacca_title: "Poskrom Malakkę"
 mnd_maj_rein_in_malacca_desc: "Malakka, nasz dawny rywal, zyskała znaczenie dzięki osławionej flocie skarbów Zheng He, która położyła kres naszej hegemonii na Nusantarze. Musimy zmiażdżyć rywali i ponownie włączyć półwysep do naszego państwa."
 mnd_maj_rein_in_brunei_title: "Poskrom Brunei"
 mnd_maj_rein_in_brunei_desc: "Brunei niegdyś lojalnie uznawało zwierzchnictwo Majapahitu, lecz później zbuntowało się i stworzyło własne imperium. Musimy ponownie rzucić je na kolana."
 mnd_maj_gaja_madas_oath_title: "Przysięga Gajah Mady"
 mnd_maj_gaja_madas_oath_desc: "Wielki mąż stanu Gajah Mada przysiągł, że cały Nusantara zostanie podbity przez Majapahit. Pamiętamy tę przysięgę i wypełnimy ją."
 mnd_maj_subjugate_the_mainland_title: "Podporządkuj kontynent"
 mnd_maj_subjugate_the_mainland_desc: "Nawet Gajah Mada nie marzył o tym, że Majapahit pewnego dnia zdominuje królestwa tajskie i khmerskie. Rozszerzymy imperium do niespotykanych dotąd rozmiarów."
 mnd_maj_negara_agung_title: "Negara Agung"
 mnd_maj_negara_agung_desc: "Rozszerzanie granic imperium i obejmowanie nowych ludów naszym panowaniem to wielkie przedsięwzięcie. Musimy jednak zadbać również o nasze ziemie rdzenne, czyli negara agung. Stolica powinna być wielkim miastem, ośrodkiem handlu i kultury z całego Nusantary."
 mnd_maj_chakravarti_title: "Ćakrawarti"
 mnd_maj_chakravarti_desc: "Idealny monarcha rządzi idealnym państwem, materialnym i duchowym centrum świata. Majapahit stanie się takim państwem."
 mnd_maj_candi_shrines_title: "Świątynie Ćandi"
 mnd_maj_candi_shrines_desc: "Na całym Nusantarze znajdują się liczne zrujnowane lub opuszczone świątynie kandi, w których niegdyś oddawano cześć bóstwom hinduizmu i buddyzmu. Musimy je odnowić, by odrodziła się nasza wiara."
 mnd_maj_porch_of_mecca_title: "Przedsionek Mekki"
 mnd_maj_porch_of_mecca_desc: "Region Atjeh stał się punktem wypadowym dla szerzenia islamu na Nusantarze. Musimy zdławić tę nową wiarę i przywrócić Atjeh pod władzę Majapahitu."
 no_more_muslims_tt: "Żadne państwo ze stolicą w regionie §YMalaje§! lub §YIndonezja§! nie wyznaje religii z grupy §YMuzułmańskie§!."
 all_muslims_tt: "Każde państwo ze stolicą w regionie §YMalaje§! lub §YIndonezja§! wyznaje religię z grupy §YMuzułmańskie§!."
 mnd_maj_prepare_eastern_campaigns_title: "Wschodnie kolonie"
 mnd_maj_prepare_eastern_campaigns_desc: "Majapahit pobierał niegdyś trybut od licznych pomniejszych królestw Nusa Tenggara. Nadszedł czas, byśmy sprawowali nad nimi bardziej bezpośrednią władzę. Powinniśmy zgromadzić flotę i przygotować środki do kolonizacji tych wysp, zanim rozpoczniemy kampanię na wschodzie."
 mnd_maj_subjugate_makassar_title: "Ujarzmij Makasar"
 mnd_maj_subjugate_makassar_desc: "Nasze panowanie nad Celebesem całkowicie się załamało i musimy to naprawić. Szczególnie królestwo Makassar stało się zbyt potężne jak na nasze upodobania."
 mnd_maj_cloves_title: "Zdominuj Moluki"
 mnd_maj_cloves_desc: "Handel goździkami należy do najbardziej dochodowych na świecie. Gdy nasza hegemonia była niepodważalna, Majapahit kontrolował ten handel. Musimy ponownie osiągnąć taką dominację."
 mnd_maj_sunda_relations_title: "Stosunki z Sundą"
 mnd_maj_sunda_relations_desc: "Majapahit utrzymywał niegdyś bliskie stosunki z sąsiednim Królestwem Sundajskim, lecz Gajah Mada zniszczył je podczas bitwy pod Bubat. Powinniśmy albo odbudować tę relację, albo położyć kres sporom, podporządkowując sobie Sundę."
 mnd_maj_fleet_title: "Odbuduj flotę"
 mnd_maj_fleet_desc: "Floty Majapahitu były niegdyś wspaniałym widokiem, a potężne dżongi dominowały na horyzoncie. Musimy odbudować naszą flotę."
 mnd_maj_privateer_china_title: "Zakłóć chiński handel"
 mnd_maj_privateer_china_desc: "Gdy Zheng He wraz ze swoją flotą skarbów wpłynął na wody Nusantary, naruszył równowagę sił i handlu w naszym imperium. Odpłacimy mu pięknym za nadobne, wysyłając nową flotę, by zakłóciła handel w Chinach."
 mnd_maj_blockade_china_title: "Wielka blokada"
 mnd_maj_blockade_china_desc: "Przygotowaliśmy naszą ostateczną zemstę na dynastii Ming: wielką blokadę, która całkowicie odetnie chińskie porty od handlu morskiego. Wymaga to pełnego wykorzystania naszych zdolności morskich, lecz jesteśmy pewni, że dysponujemy odpowiednią liczbą okrętów i umiejętnościami, by przeprowadzić Wielką Blokadę."
 majapahit_respected: "Odrodzenie Majapahitu"
 desc_majapahit_respected: "Imperium Majapahitu wkroczyło w okres odrodzenia."
 negara_agung: "Negara Agung"
 desc_negara_agung: "Serce imperium jest zaludnione i zabezpieczone."
 maj_colony_modifier: "Potencjalna kolonia Majapahitu"
 desc_maj_colony_modifier: "To miejsce uznano za doskonałą lokalizację dla kolonii Majapahitu."
 maj_trade_modifier: "Imperium handlowe Majapahitu"
 desc_maj_trade_modifier: "Nasi kupcy podróżują w najdalsze zakątki świata, by sprowadzać bogactwa do ojczyzny."
 maj_privateer_china: "Zakłócenie chińskiego handlu"
 desc_maj_privateer_china: "Rozkazaliśmy naszym korsarzom zakłócać chiński handel z największą możliwą skutecznością."
 maj_china_trade: "Zakłócenie chińskiego handlu"
 desc_maj_china_trade: "Rozkazaliśmy naszym korsarzom zakłócać chiński handel z największą możliwą skutecznością."
 maj_great_blockade: "Wielka blokada"
 desc_maj_great_blockade: "Potężny drewniany mur całkowicie odetnie chińskie wybrzeże, uniemożliwiając żeglugę i handel morski."
 maj_religious_unity: "Pokój religijny"
 desc_maj_religious_unity: "Dążymy do zapewnienia pokoju religijnego w naszym państwie."
 is_buddhist_tt: "Wyznaje religię z grupy §Ybuddyjskiej§!."
 follows_buddha_tt: "Podąża za naukami §YBuddy§!."
 majapahit_cb_1_tt: "Odblokowuje casus belli §YKampanie Majapahitu§! przeciwko państwom z kulturą główną §Ymalajską§!."
 majapahit_cb_2_tt: "Odblokowuje casus belli §YKampanie Majapahitu§! przeciwko państwom z §Ychińskiej§! grupy technologicznej."
 majapahit_cb_3_tt: "Odblokowuje casus belli §YKampanie Majapahitu§! przeciwko §Ywszystkim państwom§!."
 buddha_deity_tt: "Odblokowuje osobiste bóstwo §YBudda§!."
 propagate_religion_maj_tt: "Odblokowuje politykę handlową §YSzerzenie religii§!.\\nTwoje prowincje §Yhinduistyczne§! stają się odporne na politykę handlową §YSzerzenie religii§!."
 maj_china_coast_claims_tt: "§Y[Root.GetName]§! otrzymuje trwałe roszczenia do wszystkich §Ynabrzeżnych§! prowincji na subkontynencie §YChiny§!."
 VASSAL_MISSION_WAR_NAME_MAJ: "$ORDER$ kampania $FIRST$ przeciwko $SECOND_NAME$"
 cb_vassalize_majapahit: "Kampanie Majapahitu"
 cb_vassalize_majapahit_desc: "Imperium Majapahitu podniosło się znad krawędzi upadku i jest gotowe wznowić kampanie podporządkowywania sąsiadów."
 cb_vassalize_malacca: "Kampanie Malakki"
 cb_vassalize_malacca_desc: "Malakka zajęła miejsce Majapahitu jako hegemon Nusantary. Podporządkujemy sobie każdego, kto stanie nam na drodze."
 maj_reduced_lib_desire: "Wymuszona lojalność"
 desc_maj_reduced_lib_desire: "Jesteśmy lojalni wobec naszych zwierzchników z Majapahitu."
 indonesia_palopo_iron_title: "Żelazo z Palopo"
 indonesia_palopo_iron_desc: "Celebes zawdzięcza swoją nazwę bogatym złożom żelaza. Głupotą byłoby nie wykorzystać tych zasobów, budując manufakturę uzbrojenia."
 indonesia_banjar_textiles_title: "Tkaniny z Banjaru"
 indonesia_banjar_textiles_desc: "Produkcja tkanin w Banjarze przeżywa rozkwit. Powinniśmy wesprzeć tę gałąź przemysłu, budując manufakturę tekstylną."
 indonesia_lampung_pepper_title: "Pieprz z Lampung"
 indonesia_lampung_pepper_desc: "Południowy region Sumatry słynie z produkcji ogromnej części światowych zasobów pieprzu. Powinniśmy zapewnić maksymalne plony, zakładając fabryki w Lampung."
 indonesia_moluccan_cloves_title: "Goździki z Moluków"
 indonesia_moluccan_cloves_desc: "Goździki należą do najbardziej cenionych towarów na świecie. Gdybyśmy zdobyli monopol na ich handel, moglibyśmy wzbogacić się ponad wszelkie wyobrażenie."
 indonesia_sea_cucumbers_title: "Strzykwy"
 indonesia_sea_cucumbers_desc: "Kupcy z Celebesu opowiadają o wyspie na południu, gdzie ludzie zbierają strzykwy. Powinniśmy ją odnaleźć i albo handlować tym cennym towarem, albo przejąć jego produkcję siłą."
 indonesia_trade_dominance_title: "Dominacja handlowa"
 indonesia_trade_dominance_desc: "Na Nusantarze sukces imperium mierzy się jego zdolnością do kontrolowania handlu."
 indonesia_spice_must_flow_title: "Przyprawy muszą płynąć"
 indonesia_spice_must_flow_desc: "Musimy osiągnąć całkowitą dominację nad handlem przyprawami — zarówno pod względem produkcji, jak i dystrybucji."
 indonesia_navy_title: "Flota [Root.GetAdjective]"
 indonesia_navy_desc: "Prowadzenie kampanii podbojowych na lądzie w tym regionie jest niemal niemożliwe. Musimy utrzymywać potężną flotę galer oraz wystarczającą liczbę okrętów transportowych, by przewozić żołnierzy."
 indonesia_convert_island_title: "Nawróć wyspy"
 indonesia_convert_island_desc: "Krajobraz religijny Nusantary ulega zmianom, niekoniecznie zgodnym z naszym interesem. Musimy zadbać o to, by mieszkańcy naszych wysp wyznawali prawdziwą wiarę."
 indonesia_convert_island.tooltip: "Wszystkie prowincje na naszych wyspach muszą wyznawać wiarę §Y[Root.Religion.GetName]§!."
 indonesia_convert_region_title: "Dominacja religijna"
 indonesia_convert_region_desc: "Szerzenie wiary jest naszym świętym obowiązkiem. Cały Nusantara musi poznać światło boskości."
 obj_convert_60_provinces_tooltip_tt: "Co najmniej 60 prowincji w regionach §YIndonezja§!, §YMalaje§! i/lub §YMoluki§! musi wyznawać religię §Y[Root.Religion.GetName]§!."
 obj_convert_20_provinces_tooltip_tt: "Nawrócono co najmniej 20 prowincji na tym obszarze."
 indonesia_vassals_title: "Królestwa wasalne"
 indonesia_vassals_desc: "Nie powinniśmy rozszerzać naszego państwa wyłącznie poprzez bezpośrednie podboje. Powinniśmy również podporządkowywać sobie inne królestwa i pobierać od nich trybut."
 indonesia_expel_europeans_title: "Wypędź Europejczyków"
 indonesia_expel_europeans_desc: "Europejskie mocarstwa są nieproszonymi najeźdźcami na Nusantarze. Nie pozwolimy zmuszać się do niekorzystnych umów handlowych ani przyjmować ich zwodniczych obietnic ochrony. Wypędzimy ich."
 indonesia_best_trade_node_title: "Dominacja handlu"
 indonesia_best_trade_node_desc: "Cieśnina Malakka stanie się czymś znacznie więcej niż tylko jednym z przystanków na morskim Jedwabnym Szlaku. Uczynimy naszą ojczyznę samym centrum światowego handlu."
 indonesia_unite_nusantara_title: "Zjednocz Nusantarę"
 indonesia_unite_nusantara_desc: "Wszystkie ludy archipelagu muszą zostać zjednoczone w jednym państwie."
 malay_united_nusantara: "Zjednoczona Nusantara"
 desc_malay_united_nusantara: "Wszyscy jesteśmy mieszkańcami Nusantary."
 indonesia_invade_the_mainland_title: "Najedź kontynent"
 indonesia_invade_the_mainland_desc: "Teraz, gdy zgromadziliśmy pełnię sił Nusantary, możemy skierować wzrok na kontynent, gdzie chylące się ku upadkowi królestwa czekają na podbój."
 malay_military_domination: "Dominacja militarna"
 desc_malay_military_domination: "Będziemy panować nie tylko nad morzami."
 malay_galleys: "Wojna galerami"
 desc_malay_galleys: "Staliśmy się ekspertami w wykorzystywaniu niewielkich jednostek podczas walk morskich."
 indonesia_trade_dominance: "Dominacja handlowa Indonezji"
 desc_indonesia_trade_dominance: "Osiągnęliśmy dominację handlową na Nusantarze."
 indonesia_spice_must_flow: "Przyprawy muszą płynąć"
 desc_indonesia_spice_must_flow: "Nasza produkcja przypraw nie ma sobie równych."
 malay_vassal_income: "Pobieranie trybutu"
 desc_malay_vassal_income: "Pobieramy trybut od naszych państw poddanych."
 malay_convert_cost_modifier: "Gorliwi wyznawcy wiary"
 desc_malay_convert_cost_modifier: "Wielu naszych mieszkańców wstępuje do stanu duchownego i zgłasza się na ochotnika do szerzenia wiary tam, gdzie jest ona słaba."
 malay_tolerance_own: "Dominacja religijna"
 desc_malay_tolerance_own: "Nasze wysiłki ewangelizacyjne wzmacniają serca tych, którzy wyznają naszą wiarę."
 palopo_iron: "Żelazo z Palopo"
 desc_palopo_iron: "Na Celebesie łatwo dostępne są złoża żelaza."
 banjar_textiles: "Tkaniny z Banjaru"
 desc_banjar_textiles: "Rozwinęliśmy przemysł tekstylny w Banjarze."
 lampung_pepper: "Pieprz z Lampung"
 desc_lampung_pepper: "Region Lampung produkuje znaczną część światowego pieprzu."
 clove_boom: "Boom na goździki"
 desc_clove_boom: "Zwiększyliśmy produkcję goździków na Molukach."
 tiwi_sea_cucumbers: "Strzykwy"
 desc_tiwi_sea_cucumbers: "Wyspa Tiwi służy do pozyskiwania strzykw, które są przedmiotem handlu nawet z odległymi Chinami."
 no_europeans_in_indonesia_tt: "Żadne §Yeuropejskie§! państwo nie posiada prowincji w regionach §YMalaje§! ani §YIndonezja§!."
 cha_reconquer_indrapura_title: "Odzyskaj Indrapura"
 cha_reconquer_indrapura_desc: "Miasta Indrapura i Kandarapura padły ofiarą najazdu wietnamskiego. Musimy odwrócić bieg wydarzeń i odzyskać te miasta."
 cha_conquer_vietnam_title: "Podbij Wietnam"
 cha_conquer_vietnam_desc: "Najeźdźców z Dai Viet należy nie tylko odeprzeć, lecz także podporządkować naszej władzy, aby już nigdy nie zagrozili Czampie."
 cha_subjugate_highlands_title: "Podporządkuj wyżyny"
 cha_subjugate_highlands_desc: "Plemiona zamieszkujące wyżyny wymykają się spod władzy wszystkich państw. Musimy wprowadzić je w świat cywilizacji."
 cha_navy_title: "Flota Czampy"
 cha_navy_desc: "Czampa jest królestwem morskim, lecz najazdy wietnamskie zmusiły nas do skupienia się na lądzie. Powinniśmy odbudować flotę handlową."
 cha_malay_connections_title: "Więzi z Malajami"
 cha_malay_connections_desc: "Czamowie są ludem malajskim, lecz zostaliśmy odizolowani od większości świata malajskiego. Powinniśmy odbudować nasze kontakty, zawierając sojusz z jednym z nowych muzułmańskich mocarstw Nusantary."
 champa_tt: "Dowolne sprzymierzone państwo należy do grupy kulturowej §Ymalajskiej§!, wyznaje §Ysunnizm§! i ma co najmniej §Y50§! rozwoju."
 cha_prey_on_khmer_title: "Wykorzystaj słabość Khmerów"
 cha_prey_on_khmer_desc: "Imperium Khmerów chwieje się po najazdach tajskich. Powinniśmy wykorzystać tę okazję, złupić ich nową stolicę i zdobyć kontrolę nad Mekongiem."
 cha_tondo_expedition_title: "Wyprawa do Tondo"
 cha_tondo_expedition_desc: "Powinniśmy wysłać ekspedycję wojskową do Tondo, rozpoczynając budowę morskiego imperium Czampy."
 cha_expedition_to_the_east_title: "Wyprawy na wschód"
 cha_expedition_to_the_east_desc: "Krążą pogłoski o wielkim kontynencie na wschodzie, który czeka na odkrycie i eksploatację. Powinniśmy zorganizować wyprawę, by sprawdzić, czy te opowieści są prawdziwe."
 opinion_champa_islam: "Zmieniono wiarę na islam"
 opinion_champa_hindu: "Niezłomny hinduista"
 flavor_cha.1.t: "Islam w Czampie"
 flavor_cha.1.d: "Dzięki odnowionym kontaktom z malajską siecią handlową coraz częściej stykamy się z islamem. Sułtani i kupcy zachęcają nas do przyjęcia ich wiary, co z pewnością umocniłoby nasze stosunki z nowymi sojusznikami."
 flavor_cha.1.a: "Islam jest dla nas właściwą drogą."
 flavor_cha.1.b: "Pozostaniemy przy dawnych obyczajach."
 cham_culture_resurgent: "Odrodzenie kultury czamskiej"
 desc_cham_culture_resurgent: "Kultura czamska rozkwita teraz, gdy nie zagraża nam już najazd wietnamski."
 cham_maritime_state: "Morskie państwo Czamów"
 desc_cham_maritime_state: "Czampa w dużym stopniu opiera się na handlu morskim, a my staliśmy się ekspertami w wykorzystywaniu jego możliwości."
 champa_expeditions: "Wyprawy Czampy"
 desc_champa_expeditions: "Nasi odkrywcy zaczynają wytyczać szlak do ziem leżących na wschodzie."
 bli_independence_title: "Zabezpiecz niepodległość"
 bli_independence_desc: "Bali zbyt długo płaciło trybut niewdzięcznym władcom Majapahitu. Jeśli chcemy zapewnić wielkość własnemu państwu, musimy zrzucić zwierzchnictwo naszych panów."
 bli_colony_1_title: "Rozszerz granice na wschód"
 bli_colony_1_desc: "Nasze pierwsze podboje powinny objąć wyspy Lombok i Sumbawa na wschodzie. Miejscowe królestwa są zbyt słabe, by oprzeć się naszemu panowaniu."
 bli_majapahit_refugees_title: "Uchodźcy z Majapahitu"
 bli_majapahit_refugees_desc: "Gdy imperium Majapahitu zbliża się do całkowitego upadku, wielu możnowładców ucieka z Jawy. Powinniśmy przyjąć ich na Bali, by umocnić naszą pozycję."
 bli_majapahit_reconquest_title: "Zgłoś pretensje do Jawy"
 bli_majapahit_reconquest_desc: "Rodziny możnowładcze, które zaprosiliśmy na Bali, wciąż roszczą sobie prawa do rodowych siedzib na Jawie. Powinniśmy najechać Jawę w ich imieniu i ustanowić tam nasze rządy."
 bli_colonies_modifier: "Kolonie Bali"
 desc_bli_colonies_modifier: "Rozszerzyliśmy nasze królestwo na Lombok i Sumbawę, lecz nic nie stoi na przeszkodzie, by zakładać kolonie również w bardziej odległych miejscach."
 bli_majapahit_refugees: "Uchodźcy z Majapahitu"
 desc_bli_majapahit_refugees: "Przyjęliśmy możnowładców z Majapahitu, którzy z ochotą służą na naszym dworze."
 atj_propagate_religion_tt: "Polityka handlowa §YSzerzenie religii§! wymaga teraz jedynie §Y35%§! siły handlowej w węźle."
 atj_holy_war_cb_sumatra_tt: "Odblokowuje casus belli §YMiecz islamu§! przeciwko §Yinnowiercom§! z kulturą główną §Ysumatrzańską§!."
 atj_holy_war_cb_java_tt: "Odblokowuje casus belli §YMiecz islamu§! przeciwko §Yinnowiercom§! z kulturą główną §Yjawajską§! lub §Ysundajską§!."
 atj_holy_war_cb_moluccas_tt: "Odblokowuje casus belli §YMiecz islamu§! przeciwko §Yinnowiercom§! z kulturą główną §Ycelebeską§! lub §Ymolucką§!."
 atj_holy_war_cb_neighbors_tt: "Odblokowuje casus belli §YMiecz islamu§! przeciwko §Ywszystkim sąsiednim innowiercom§!."
 atj_sumatra_islam_tt: "Wszystkie państwa z kulturą główną §Ysumatrzańską§! przyjmują wiarę z grupy §Ymuzułmańskiej§!."
 atj_java_islam_tt: "Wszystkie państwa z kulturą główną §Ysundajską§! lub §Yjawajską§! przyjmują wiarę z grupy §Ymuzułmańskiej§!."
 atj_moluccas_islam_tt: "Wszystkie państwa z kulturą główną §Ymolucką§! lub §Ycelebeską§! przyjmują wiarę z grupy §Ymuzułmańskiej§!."
 atj_porch_of_mecca_modifier: "Przedsionek Mekki"
 desc_atj_porch_of_mecca_modifier: "Nasze państwo podjęło się szerzenia islamu na całej Nusantarze."
 atj_porch_of_mecca_title: "Przedsionek Mekki"
 atj_porch_of_mecca_desc: "Pielgrzymi udający się na hadżdż przybywają do [Root.GetName], by znaleźć drogę do Mekki. Musimy zapewnić im gościnę i utrzymywać dobre stosunki z ulemami."
 atj_sumatra_islam_title: "Zislamizuj Sumatrę"
 atj_sumatra_islam_desc: "Wiele miast-państw na Sumatrze przyjęło już islam. Musimy dokończyć dzieła i sprawić, by prawda Allaha dotarła na całą wyspę."
 atj_java_islam_title: "Zislamizuj Jawę"
 atj_java_islam_desc: "Na Jawie istnieje wiele społeczności muzułmańskich, a ich władcy polegają na muzułmańskich kupcach w prowadzeniu handlu. Uświadomimy im, jak nierozsądne jest odrzucanie islamu."
 atj_moluccas_islam_title: "Zislamizuj Moluki"
 atj_moluccas_islam_desc: "Ludy Celebesu i Moluków nadal wyznają dawne pogańskie religie. Musimy obalić ich fałszywe bożki."
 cb_sword_of_islam: "Miecz Islamu"
 cb_sword_of_islam_desc: "Ci innowiercy zbłądzili daleko od ścieżki Allaha. Wskażemy im właściwą drogę."
 SWORD_OF_ISLAM_WAR_NAME: "$ORDER$ dżihad państwa $FIRST$ przeciwko $SECOND_NAME$"
 atj_sublime_porte_title: "Wysoka Porta"
 atj_sublime_porte_desc: "Sułtan osmański jest najpotężniejszym władcą świata muzułmańskiego. Powinniśmy zabiegać o jego przychylność, licząc na uzyskanie pomocy."
 atj_conquer_aceh_title: "Zjednocz Atjeh"
 atj_conquer_aceh_desc: "Atjeh jest podzielone między dominujący sułtanat Pasai i wschodzący sułtanat Atjeh. Oba muszą zostać zjednoczone w jeden sułtanat."
 atj_sumatra_campaign_title: "Kampania sumatrzańska"
 atj_sumatra_campaign_desc: "Naszym pierwszym imperialnym priorytetem powinno być ustanowienie dominacji na Sumatrze."
 atj_peninsula_campaign_title: "Kampania na półwyspie"
 atj_peninsula_campaign_desc: "Po zabezpieczeniu Sumatry możemy skierować uwagę na bogate porty handlowe półwyspu."
 atj_sublime_port: "Pomoc Wysokiej Porty"
 desc_atj_sublime_port: "Zrobiliśmy wystarczające wrażenie na sułtanie osmańskim, który przysyła nam pomoc."
 mnd_dai_control_the_army_title: "Przejmij kontrolę nad armią"
 mnd_dai_control_the_army_desc: "Armiami Dai Viet nadal dowodzą rody możnowładcze. Musimy podporządkować wojsko władzy państwowej."
 mnd_dai_curtail_noble_families_title: "Ogranicz wpływy szlachty"
 mnd_dai_curtail_noble_families_desc: "Rywalizujące dynastie możnowładcze same pragną zdobyć tron. Musimy ograniczyć ich wpływy i rozszerzyć kompetencje państwa."
 mnd_dai_prevent_division_title: "Zapobiegnij podziałowi"
 mnd_dai_prevent_division_desc: "Nasze państwo jest zagrożone podziałem między rywalizujące rody możnowładcze. Musimy zapobiec rozłamowi i zachować jedność Dai Viet."
 prevent_dai_disaster_tt: "Katastrofa §YDynastie Północy i Południa§! nigdy nie wystąpi."
 mnd_dai_examination_system_title: "Przywróć egzaminy urzędnicze"
 mnd_dai_examination_system_desc: "Konfucjański system egzaminów podupadł w ostatnich dziesięcioleciach. Musimy ponownie potwierdzić nasze przywiązanie do wykształconej i skutecznej biurokracji."
 mnd_dai_defy_ming_title: "Rzuć wyzwanie Mingom"
 mnd_dai_defy_ming_desc: "Le Loi wypędził tyranów z dynastii Ming z Dai Viet, lecz nadal sprawują oni hegemonię nad naszym państwem. Musimy pokazać Mingom, że nie będziemy kłaniać się cesarzowi w Pekinie."
 mnd_dai_conquer_canton_title: "Podbij Kanton"
 mnd_dai_conquer_canton_desc: "Nasz podbój Chin rozpoczniemy od miasta Kanton. Powinniśmy poczekać, aż władza Mingów na południu osłabnie i nie będą w stanie powstrzymać naszego natarcia."
 mnd_dai_mandate_of_heaven_title: "Zdobądź Mandat Niebios"
 mnd_dai_mandate_of_heaven_desc: "Utrzymanie Mandatu nie jest łatwe, a Mingowie udowodnili, że nie zasługują na jego posiadanie. Nadszedł czas, by nowy cesarz i nowa dynastia objęli tron."
 mnd_dai_cham_conquest_title: "Podbij Czampę"
 mnd_dai_cham_conquest_desc: "Poczyniliśmy obiecujące postępy na ziemiach Czamów, lecz inwazja jest daleka od zakończenia. Musimy całkowicie rozgromić Czamów i w pełni zintegrować ziemie Czampy z Dai Viet."
 mnd_dai_great_march_south_title: "Wielki marsz na południe"
 mnd_dai_great_march_south_desc: "Granice naszego imperium muszą sięgnąć jeszcze dalej na południe, do delty Mekongu, gdzie wciąż utrzymują się pozostałości upadłego imperium Khmerów."
 mnd_dai_subjugate_cambodia_title: "Ujarzmij Kambodżę"
 mnd_dai_subjugate_cambodia_desc: "Imperium Khmerów ma już swoje najlepsze lata za sobą. Niegdyś potężne, popadło w ruinę i rozpacz. Jego mieszkańcom będzie lepiej pod naszym panowaniem."
 mnd_dai_muang_phuan_title: "Zapanuj nad Muang Phuan"
 mnd_dai_muang_phuan_desc: "Muang Phuan jest niewielkim królestwem, które zabiega o względy zarówno Dai Viet, jak i Lan Xang. Taki stan rzeczy jest nie do przyjęcia — muszą opowiedzieć się po naszej stronie."
 mnd_dai_lxa_title: "Ujarzmij Lang Czang"
 mnd_dai_lxa_desc: "Królestwo Laosu od dawna jest cierniem w naszym boku. Nadszedł czas, by się go pozbyć."
 mnd_dai_lna_title: "Ujarzmij Lanna"
 mnd_dai_lna_desc: "Kraina Miliona Pól Ryżowych aż prosi się o podbój. Jej bogate plony wkrótce zaspokoją głód [Root.GetAdjective]."
 mnd_dai_siam_title: "Ujarzmij Syjam"
 mnd_dai_siam_desc: "Syjam z pewnością stworzyłby imperium obejmujące całą Azję, gdyby tylko miał taką możliwość. Nie możemy dopuścić do jego hegemonii, ponieważ to nam jest ona przeznaczona."
 mnd_dai_japan_relations_title: "Stosunki japońskie"
 mnd_dai_japan_relations_desc: "Niezwykle trudno jest zabiegać o przychylność władców Japonii, jednak nagrody za to są wspaniałe."
 mnd_dai_purchase_arms_title: "Kup zachodnie uzbrojenie"
 mnd_dai_purchase_arms_desc: "Artyleria jest kosztowna i czasochłonna w produkcji, a europejscy kupcy zdają się posiadać jej pod dostatkiem. Powinniśmy wynegocjować zakup uzbrojenia dla państwa [Root.GetName]."
 dai_arms_tt: "Dowolne §Yeuropejskie§! państwo z §Yzachodnią§!, §Ywschodnią§! lub §Yanatolijską§! grupą technologiczną, posiadające prowincje w superregionie §YIndonezja§!, ma opinię o państwie [Root.GetName] wynoszącą co najmniej §Y100§!."
 mnd_dai_temples_title: "Wiara i nauka"
 mnd_dai_temples_desc: "Między naukami Konfucjusza i Buddy można znaleźć wiele mądrości. Powinniśmy zakładać świątynie, w których będzie ona przekazywana."
 mnd_dai_universities_title: "Edukacja państwowa"
 mnd_dai_universities_desc: "System egzaminów jest solidny, lecz wielu ludzi nie może w nim uczestniczyć z powodu analfabetyzmu. Powinniśmy podnieść poziom wykształcenia w naszym kraju."
 mnd_dai_imperial_citadel_title: "Cesarska cytadela"
 mnd_dai_imperial_citadel_desc: "Powinniśmy zadbać, by nasza stolica była miejscem chwały i bogactwa, w którym wspaniała cesarska cytadela będzie świadczyć o potędze państwa."
 dai_discipline: "Kontrola nad armią"
 desc_dai_discipline: "Armia nie jest już kontrolowana przez rody możnowładcze realizujące własne interesy."
 dai_curtailed_nobles: "Ograniczone wpływy szlachty"
 desc_dai_curtailed_nobles: "Ograniczyliśmy władzę szlachty."
 dai_stability: "Niezjednoczeni? Już nie"
 desc_dai_stability: "Stworzyliśmy zjednoczone państwo, wolne od podziałów między rywalizującymi rodami."
 dai_discipline_permanent: "Imperialny podbój"
 desc_dai_discipline_permanent: "Liczne kampanie w Azji Południowo-Wschodniej nauczyły nas, jak ważna jest zdyscyplinowana armia."
 dai_japan_relations: "Stosunki z Japonią"
 desc_dai_japan_relations: "Nawiązaliśmy silne relacje z władcami Japonii."
 dai_arms_trade: "Zakup europejskiego uzbrojenia"
 desc_dai_arms_trade: "Wynegocjowaliśmy zakup artylerii od europejskich mocarstw."
 dai_harmonization: "Harmonia religijna"
 desc_dai_harmonization: "W naszym państwie jest miejsce dla wielu wyznań, o ile podporządkują się państwu."
 dai_learning: "Nauki klasztorne"
 desc_dai_learning: "Budda ma nam wiele do przekazania."
 dai_state_education: "Wiara i nauka"
 desc_dai_state_education: "Edukacja rozświetli nam drogę."
 mnd_mlc_pajang_title: "Ujarzmij Pahang"
 mnd_mlc_pajang_desc: "Pahang jest ostatnim buddyjskim królestwem na Półwyspie Malajskim i łatwym celem naszej ekspansji. Podporządkujemy je sobie i osadzimy na tronie lojalnego księcia."
 mnd_mlc_peninsula_title: "Zdominuj półwysep"
 mnd_mlc_peninsula_desc: "Musimy zdominować półwysep i wszystkie pomniejsze królestwa, by żaden z ich raczkujących portów handlowych nie mógł nigdy zagrozić Malakce."
 mnd_mlc_show_of_force_title: "Pokaz siły"
 mnd_mlc_show_of_force_desc: "Naszą ekspansję na Sumatrze rozpoczniemy od pokazu siły. Musimy udowodnić książętom Siaku, że przewyższamy potęgą ich dawnych zwierzchników z Majapahitu."
 mnd_mlc_jambi_title: "Podporządkowanie Sumatry"
 mnd_mlc_jambi_desc: "Mając przyczółek w Siaku, możemy rozpocząć kampanię podporządkowywania pozostałych sułtanów Sumatry."
 mnd_mlc_ming_title: "Poselstwo do cesarza"
 mnd_mlc_ming_desc: "Niegdyś utrzymywaliśmy bliskie stosunki z chińską dynastią Ming. Ostatnio Mingowie wykazują niewielkie zainteresowanie sprawami wykraczającymi poza ich granice i mało prawdopodobne, by ochronili nas w razie kryzysu. Musimy odnowić relacje z cesarzem."
 mnd_mlc_champa_title: "Zaprzyjaźnij się z Czampą"
 mnd_mlc_champa_desc: "Czampa znajduje się w niepewnym położeniu na kontynencie, ponosząc kolejne klęski z rąk Dai Viet. Powinniśmy objąć ją opieką."
 mnd_mlc_develop_malacca_title: "Rozwiń Malakkę"
 mnd_mlc_develop_malacca_desc: "Uczynimy z Malakki największy port handlowy świata, ozdobiony wspaniałymi świątyniami i fortyfikacjami."
 mnd_mlc_tributaries_title: "Lojalni poddani"
 mnd_mlc_tributaries_desc: "Sułtan wymaga bezwzględnej lojalności od książąt-wasali."
 mnd_mlc_destroy_majapahit_title: "Zniszcz Majapahit"
 mnd_mlc_destroy_majapahit_desc: "Majapahit niegdyś panował nad niemal całą Nusantarą, w tym nad naszym własnym księstwem. Teraz, gdy staliśmy się rywalem zdolnym rzucić wyzwanie jego hegemonii, musimy raz na zawsze zniszczyć to imperium."
 mnd_mlc_defeat_ayutthaya_title: "Pokonaj Ajutthaję"
 mnd_mlc_defeat_ayutthaya_desc: "Ajutthaja próbuje podporządkować nasz sułtanat siłą. Pokażemy jej, że nie ugnie się tak łatwo."
 mlc_trade_modifier: "Dominujący port handlowy"
 desc_mlc_trade_modifier: "Malakka stała się dominującym portem handlowym na Nusantarze."
 mlc_morale: "Podbój półwyspu"
 desc_mlc_morale: "Malakka zjednoczyła Półwysep Malajski."
 mlc_subjects: "Książęta podlegli"
 desc_mlc_subjects: "Wiele państw podlega naszemu zwierzchnictwu, a ich lojalność jest zapewniona."
 mlc_cb_tt: "Odblokowuje casus belli §YKampanie Malakki§! przeciwko państwom z kulturą główną §Ymalajską§!."
 lxa_mph_title: "Zapanuj nad Muang Phuan"
 lxa_mph_desc: "Muang Phuan zbyt długo wymykało się bezpośredniej władzy Lan Xang. Musimy włączyć je do naszego państwa."
 lxa_dai_title: "Zaatakuj Dai Viet"
 lxa_dai_desc: "Wietnamczycy nieustannie zagrażają naszym północnym prowincjom. Musimy rozpocząć inwazję i podporządkować ich sobie."
 lxa_lna_title: "Ujarzmij Lanna"
 lxa_lna_desc: "Kraina Miliona Pól Ryżowych jest gotowa na żniwa. Powinniśmy objąć ją naszym panowaniem."
 lxa_ayu_title: "Zaatakuj Syjam"
 lxa_ayu_desc: "Wschodzące królestwo Ajutthaji ma wielkie ambicje. Nie możemy pozwolić mu ich zrealizować."
 lxa_civil_war_title: "Uniknij podziałów"
 lxa_civil_war_desc: "Wojna domowa grozi rozdarciem naszego państwa. Nie możemy do tego dopuścić."
 lxa_raid_angkor_title: "Najazd na Kambodżę"
 lxa_raid_angkor_desc: "Khmerowie są osłabieni po złupieniu Angkoru. Powinniśmy wykorzystać tę okazję i przeprowadzić własny najazd."
 lxa_khm_title: "Podporządkuj Khmerów"
 lxa_khm_desc: "Udowodniliśmy, że Khmerowie nie potrafią stawić skutecznego oporu. Powinniśmy wykorzystać tę okazję i podporządkować ich sobie."
 lxa_buddha_title: "Szmaragdowy Budda"
 lxa_buddha_desc: "W Chiang Mai znajduje się wspaniały Szmaragdowy Budda. Powinniśmy wziąć go dla siebie, ponieważ jesteśmy naprawdę pobożni."
 lxa_religion_title: "Nawróć politeistów"
 lxa_religion_desc: "W Lan Xang wciąż wielu ludzi wyznaje tradycyjne religie ludowe. Musimy uświadomić im, że ich droga jest błędna."
 lxa_elephants_title: "Milion słoni"
 lxa_elephants_desc: "Lan Xang to Kraina Miliona Słoni. Powinniśmy sprostać tej nazwie i wystawiać do walki najbardziej imponujące słonie bojowe."
 lxa_legitimacy: "Prawowita władza"
 desc_lxa_legitimacy: "Zapobiegliśmy rozpadowi naszego państwa i zapewniliśmy prawowitość naszym rządom."
 lxa_tolerance_own: "Jedna wiara"
 desc_lxa_tolerance_own: "Nawróciliśmy zbłąkanych animistów na prawdziwą wiarę."
 lxa_elephants: "Milion słoni"
 desc_lxa_elephants: "Odnowiliśmy tradycję wykorzystywania słoni na polu bitwy."
 lxa_missionaries: "Buddyjska gorliwość"
 desc_lxa_missionaries: "Umiejscowiliśmy Szmaragdowego Buddę w naszej stolicy, ożywiając naszą buddyjską wiarę."
 tdo_growing_strong_title: "Buduj potęgę"
 tdo_growing_strong_desc: "Las może wyrosnąć z jednego nasiona. Powinniśmy wznieść kilka fortów i pozwolić, by głęboko zakorzeniły się w naszej ziemi."
 tdo_the_queens_channel_title: "Kanał Królowej"
 tdo_the_queens_channel_desc: "Kanał Królowej stanowi naszą naturalną granicę z Manilą. Powinniśmy to wykorzystać i poświęcić szczególną uwagę handlowi morskiemu."
 tdo_befriend_majapahit_title: "Zaprzyjaźnij się z Majapahitem"
 tdo_befriend_majapahit_desc: "Niegdyś sprzymierzone z nami talassokratyczne imperium Majapahitu wciąż zasługuje na nasze zaufanie. Musimy pokazać światu, że nigdy nie zapominamy o przyjaciołach... ani o wrogach."
 tdo_abandon_the_dragon_title: "Porzuć Smoka"
 tdo_abandon_the_dragon_desc: "Potężni sojusznicy bywają przydatni, lecz jeśli sami chcemy stać się potężnym sojusznikiem, musimy pokazać światu, że [Root.GetName] nie boi się Smoka."
 tdo_stones_of_ganesh_title: "Kamienie Ganeśi"
 tdo_stones_of_ganesh_desc: "Z głową słonia i mądrością boga Ganeśa jest jednym z najbardziej czczonych bóstw tej krainy. Nie powinniśmy zakłócać jego spoczynku."
 tdo_ganesh: "Kamienie Ganeśi"
 desc_tdo_ganesh: "Zapewniliśmy sobie przychylność pana Ganeśi."
 tdo_befriend_majapahit: "Przyjaźń z Majapahitem"
 desc_tdo_befriend_majapahit: "Tondo z powodzeniem zawarło sojusz z Majapahitem."
 tdo_the_queens_channel: "Kanał Królowej"
 desc_tdo_the_queens_channel: "Usprawniliśmy handel w porcie Manili."
 tdo_growing_strong: "Budowanie potęgi"
 desc_tdo_growing_strong: "Wznieśliśmy fortyfikacje i przygotowaliśmy naszą ziemię na wojnę."
 mas_all_the_ships_of_aklan_title: "Wszystkie okręty Aklan"
 mas_all_the_ships_of_aklan_desc: "Fale rozstępują się przed kadłubami naszych okrętów. Powinniśmy pokazać wszystkim państwom, dlaczego tak się dzieje."
 mas_the_sound_of_bells_title: "Dźwięk dzwonów"
 mas_the_sound_of_bells_desc: "Tradycja naszego ludu nakazuje uderzać w gongi i dzwony podczas bitew morskich. Ich dźwięk będzie naszym ostatnim ostrzeżeniem."
 mas_going_back_home_title: "Powrót do domu"
 mas_going_back_home_desc: "Według legendy dziesięciu datu z Borneo przybyło na nasze wyspy i zawarło układ z jednym z dawnych bohaterów. Nadszedł czas, by przygotować wyprawę w przeciwnym kierunku."
 mas_the_book_of_maragtas_title: "Księga Maragtas"
 mas_the_book_of_maragtas_desc: "Odzyskamy teraz pradawną ojczyznę naszego ludu. Musimy wysłać ekspedycję ku niedostępnym wybrzeżom Borneo i dalej, poza nie."
 mas_all_the_ships_of_aklan: "Wszystkie okręty Aklan"
 desc_mas_all_the_ships_of_aklan: "Nasza flota znacznie się rozrosła, robiąc wrażenie na najbliższych sąsiadach."
 mas_the_sound_of_bells: "Dźwięk dzwonów"
 desc_mas_the_sound_of_bells: "Złowrogi dźwięk naszych pradawnych pieśni dotarł do uszu wrogów."
 mas_going_back_home: "Powrót do domu"
 desc_mas_going_back_home: "Zgromadziliśmy już wystarczające bogactwa, by wyruszyć w drogę powrotną do ojczyzny."
 filipino_conquer_luzon_title: "Podbij Luzon"
 filipino_conquer_luzon_desc: "Luzon to nazwa północnej części naszego archipelagu. Musimy zabezpieczyć władzę nad tamtejszymi państwami, zanim wkroczymy na niezasiedlone ziemie."
 filipino_conquer_the_north_title: "Podbij północ"
 filipino_conquer_the_north_desc: "Po podporządkowaniu sobie północnych państw niezasiedlone ziemie stoją przed nami otworem."
 filipino_conquer_visayas_title: "Podbij Visayas"
 filipino_conquer_visayas_desc: "Visayas to nazwa środkowej części naszego archipelagu. Musimy zabezpieczyć władzę nad tamtejszymi państwami, zanim wkroczymy na niezasiedlone ziemie."
 filipino_conquer_the_center_title: "Podbij centrum"
 filipino_conquer_the_center_desc: "Po podporządkowaniu sobie państw środkowej części archipelagu niezasiedlone ziemie stoją przed nami otworem."
 filipino_conquer_mindanao_title: "Podbij Mindanao"
 filipino_conquer_mindanao_desc: "Mindanao to nazwa południowej części naszego archipelagu. Musimy zabezpieczyć władzę nad tamtejszymi państwami, zanim wkroczymy na niezasiedlone ziemie."
 filipino_conquer_the_south_title: "Podbij południe"
 filipino_conquer_the_south_desc: "Po podporządkowaniu sobie południowych państw niezasiedlone ziemie stoją przed nami otworem."
 filipino_conquer_luzon: "Podbój Luzon"
 desc_filipino_conquer_luzon: "Pokaz siły na Luzonie podniósł morale naszego ludu."
 filipino_conquer_visayas: "Podbój Visayas"
 desc_filipino_conquer_visayas: "Pokaz siły na Visayas podniósł morale naszego ludu."
 filipino_conquer_mindanao: "Podbój Mindanao"
 desc_filipino_conquer_mindanao: "Pokaz siły na Mindanao podniósł morale naszego ludu."
 plb_gold_and_diamonds_title: "Złoto i diamenty"
 plb_gold_and_diamonds_desc: "Nasz kraj słynie z bogactw naturalnych. W głębi naszych kopalń znaleziono złoża złota i diamentów. Powinniśmy je wykorzystać, aby zwiększyć naszą siłę handlową w węźle."
 plb_a_place_where_the_water_leaks_title: "Tam, gdzie przecieka woda"
 plb_a_place_where_the_water_leaks_desc: "Nasz kraj od zawsze kojarzony jest z wodą, nawet z nazwy. Utrzymywanie floty odpowiedniej wielkości przypomni sąsiadom, skąd wzięło się to skojarzenie."
 plb_orang_laut_title: "Orang Laut"
 plb_orang_laut_desc: "Morscy koczownicy Orang Laut przemierzają nasze wody, łowiąc ryby i zbierając morskie płody. Ich obecność sięga również wybrzeży sąsiednich państw, co może dać nam dobry pretekst do zgłoszenia roszczeń do tych ziem."
 plb_arrival_of_dragonships_title: "Przybycie smoczych okrętów"
 plb_arrival_of_dragonships_desc: "Technologia budowy smoczych łodzi dotarła do nas za pośrednictwem kupców z kontynentu. Musimy zbadać ten nowy typ jednostek i dostosować go do własnych potrzeb."
 plb_pirate_kings_title: "Królowie piratów"
 plb_pirate_kings_desc: "Nasze morze zawsze było pełne piratów. Zyskaliśmy reputację grabieżców i złodziei, ale nie doceniono korzyści, jakie dobra flota piracka może przynieść narodowi - na przykład nowe wybrzeża do napadania."
 plb_muara_takus_title: "Muara Takus"
 plb_muara_takus_desc: "Starożytne świątynie imperium Śriwidźaja zostały opuszczone po jego tragicznym upadku. Jeśli uda nam się je odbudować, nasza siła religijna będzie większa niż kiedykolwiek."
 plb_vidhyadara_torana_title: "Vidhyadara Torana"
 plb_vidhyadara_torana_desc: "Ozdobiona klejnotami brama wojenna imperium Śriwidźaja była znana na całej Nusantarze i stanowiła symbol bogactwa tego państwa. Jeśli zawrzemy sojusz z kimś, kto wciąż o niej pamięta, odzyskamy prestiż."
 plb_king_under_the_mountain_title: "Król pod górą"
 plb_king_under_the_mountain_desc: "Dynastia Śailendra władała naszymi ziemiami przed wiekami. Jej rządy były pomyślne i dostatnie, a sama dynastia przybyła z Jawy. Odzyskamy to, co do nas należy."
 plb_kings_court_title: "Dwór królewski"
 plb_kings_court_desc: "Rezydencja datu od zawsze była miejscem spotkań możnowładców i uczonych. Ambasadorowie z podporządkowanych nam królestw powiększali grono odwiedzających. Nadszedł czas, by przywrócić świetność temu dworowi."
 plb_restore_srivijaya_title: "Odbuduj Śriwidźaję"
 plb_restore_srivijaya_desc: "Imperium Sriwidźaja naszych przodków rozciągało się na całą Nusantarę, a jego stolica znajdowała się na Sumatrze. Podbijemy ziemie, które kiedyś należały do nas i ustanowimy nową, równie dobrze prosperującą talassokrację."
 plb_gold: "Złoto"
 desc_plb_gold: "Wykorzystaliśmy nasze zasoby, by zwiększyć siłę handlową państwa."
 plb_and_diamonds: "I diamenty"
 desc_plb_and_diamonds: "Pokazaliśmy naszą potęgę w węźle handlowym, dzięki czemu nasza siła handlowa wzrosła."
 plb_sea_people: "Ludzie morza"
 desc_plb_sea_people: "Tradycja morska naszego narodu zostanie wzmocniona przez naszych morskich koczowników."
 plb_dragonships: "Smocze okręty"
 desc_plb_dragonships: "Dostosowaliśmy smocze łodzie do naszych okrętów, poprawiając ich osiągi."
 plb_srivijaya_temples: "Świątynie Śriwidźaji"
 desc_plb_srivijaya_temples: "Nasze świątynie pomogły zwiększyć skuteczność perswazji naszych misjonarzy."
 plb_shailendra_dynasty: "Dynastia Śailendra"
 desc_plb_shailendra_dynasty: "Nazwa tej dynastii ma podobno oznaczać „króla gór” — i właśnie nim się staniemy."
 plb_srivijaya_restored: "Odbudowana Śriwidźaja"
 desc_plb_srivijaya_restored: "Osiągnęliśmy świetność sprzed wieków."
 ne_birchbark_canoes_title: "Kanu z brzozowej kory"
 ne_birchbark_canoes_desc: "Czółna są naszym podstawowym środkiem transportu. Kontrolując je, możemy kontrolować rzeki oraz przewóz ludzi i towarów. Powinniśmy zadbać o posiadanie co najmniej jednej prowincji z dobrym dostępem do wysokiej jakości drewna."
 ne_canoes: "Produkcja czółen"
 desc_ne_canoes: "Zwiększyliśmy produkcję czółen."
 ne_longhouses_title: "Wigwamy i długie domy"
 ne_longhouses_desc: "Zapewnienie schronienia naszemu ludowi musi należeć do naszych najważniejszych priorytetów. Musimy zadbać o jego bezpieczeństwo, budując dobrze chronione domostwa."
 ne_fortified_village: "Ufortyfikowana wioska"
 desc_ne_fortified_village: "Mieszkańcy naszej wioski mogą teraz żyć w spokoju."
 ne_palisades_title: "Wznoszenie palisad"
 ne_palisades_desc: "Zabezpieczenie naszych domostw znacząco poprawi dobrobyt mieszkańców. Kolejnym krokiem ku niezawodnej obronie będzie otoczenie całej wioski solidną palisadą."
 ne_palisaded_village: "Wioska otoczona palisadą"
 desc_ne_palisaded_village: "Naszą wioskę można teraz łatwo obronić przed atakami wroga."
 ne_great_lakes_conquest_title: "Podbij Wielkie Jeziora"
 ne_great_lakes_conquest_desc: "Widok tak wspaniałego obszaru jak Wielkie Jeziora sam w sobie uzasadnia każdy podbój tych ziem. Kontrolowanie jezior oznacza jednak również kontrolę nad wodą: transportem, rybołówstwem i głównym źródłem życia. Wszystko to będzie należeć do nas."
 ne_conquer_northeast_title: "Podbij północny wschód"
 ne_conquer_northeast_desc: "Odnieśliśmy wielki sukces w panowaniu nad ziemią i wodami. Nasi przodkowie mogą z dumą spoglądać na nasze wioski i podziwiać ich niezaprzeczalny dobrobyt. Naszym obowiązkiem jest szerzyć to osiągnięcie w całym regionie."
 ne_conquered_northeast: "Podbój północnego wschodu"
 desc_ne_conquered_northeast: "Zwycięsko podbiliśmy kilka sąsiednich prowincji."
 ne_agriculture_title: "Rolnictwo na wschodzie"
 ne_agriculture_desc: "Błogosławią nas żyzne gleby, na których nasze uprawy mogą wspaniale rosnąć. Nasiona kiełkują niemal tak szybko jak dzieci, a ich żywotność dorównuje młodym ludziom. Troska o plony oznacza troskę o całą społeczność."
 ne_agricultural_complex: "Kompleks rolniczy"
 desc_ne_agricultural_complex: "Nasz system nawadniania znacznie usprawnił uprawę ziemi."
 se_birdmen_title: "Ptasi wojownicy"
 se_birdmen_desc: "Musimy działać jak drapieżne ptaki — niebezpieczni i precyzyjni niczym sokół spadający na zdobycz. Wzniesienie potężnej armii i zapełnienie jej budzącymi postrach wojownikami będzie odpowiednim pokazem siły."
 se_birdmen_hunt: "Łowy ptasich wojowników"
 desc_se_birdmen_hunt: "Nasi budzący postrach wojownicy pokonają każdą wrogą armię."
 se_the_thunderers_title: "Jak grom"
 se_the_thunderers_desc: "Udowodniliśmy już siłę naszej armii, lecz to nie wystarczy. Gdy piorun uderza w ziemię, gleba staje się żyźniejsza. Gdy zaś grom uderzy w naszych ludzi, my również staniemy się silniejsi."
 se_along_the_river_title: "Wzdłuż rzeki"
 se_along_the_river_desc: "Nasza armia jest potężniejsza niż kiedykolwiek. Duchy spoglądają na nas i wstrzymują oddech, gdy maszerujemy przez te ziemie. Wszystko, co otacza nurt rzeki, będzie nasze."
 se_our_river: "Nasza rzeka"
 desc_se_our_river: "Podbiliśmy wody."
 se_platform_mounds_title: "Kopce platformowe"
 se_platform_mounds_desc: "Budowa domów na szczytach wzgórz zapewni nam dodatkowe możliwości obrony. Możemy również wzmocnić palisady, by nikt nawet nie pomyślał o zaatakowaniu naszej wioski."
 se_medicine_wheel_title: "Krąg medycyny"
 se_medicine_wheel_desc: "Religia jest ważną częścią naszego życia nie tylko ze względu na duchowy spokój, jaki przynosi społeczności, lecz także błogosławieństwa dla naszego zdrowia. Powinniśmy wznieść odpowiednie miejsce do odprawiania obrzędów."
 se_solar_blessing: "Błogosławieństwo słońca"
 desc_se_solar_blessing: "Nasza wiara jest teraz silniejsza."
 se_agriculture_title: "Rolnictwo na wschodzie"
 se_agriculture_desc: "Błogosławią nas żyzne gleby, na których nasze uprawy mogą wspaniale rosnąć. Nasiona kiełkują niemal tak szybko jak dzieci, a ich żywotność dorównuje młodym ludziom. Troska o plony oznacza troskę o całą społeczność."
 sw_against_the_desert_title: "Przeciw pustyni"
 sw_against_the_desert_desc: "Wszędzie, dokąd sięgamy wzrokiem, rozciąga się sucha ziemia. Nasze wioski otaczają mile pustyni, której surowe warunki nie znają litości. Rzeki i jeziora dają nam jednak nadzieję. Dopilnujemy, by spustoszenie nie rozprzestrzeniło się na nasze ziemie."
 sw_the_taming_of_the_sands_title: "Poskromienie piasków"
 sw_the_taming_of_the_sands_desc: "Skoro udało nam się przystosować warunki życia do surowości pustyni, naszym obowiązkiem jest szerzyć tę wiedzę i obejmować kolejne prowincje naszą opieką."
 sw_conquered_southwest: "Podbój południowego zachodu"
 desc_sw_conquered_southwest: "Zwycięsko podbiliśmy kilka sąsiednich prowincji."
 sw_turquoise_mines_title: "Wydobycie turkusu"
 sw_turquoise_mines_desc: "Większość naszych stosunków handlowych z kulturami południa opiera się na wysokiej jakości turkusie wydobywanym w naszych kopalniach. Wykorzystamy naszą wiedzę górniczą, by utrzymać te relacje."
 sw_turquoise: "Udane wydobycie"
 desc_sw_turquoise: "Dzięki naszym technikom wydobywczym pozyskaliśmy cenne towary handlowe."
 sw_yucca_palms_title: "Palmy jukkowe"
 sw_yucca_palms_desc: "Palmy jukkowe należą do nielicznych gatunków zdolnych przetrwać tę nieustępliwą pogodę. Jesteśmy wdzięczni za ich obecność, a z ich liści wyplatamy sandały i kosze. Przejęcie kontroli nad ich naturalnym środowiskiem pozwoli nam kontrolować ich uprawę."
 sw_joshua_trees: "Drzewa Jozuego"
 desc_sw_joshua_trees: "Zwiększyliśmy już kontrolę nad produkcją drzew jukkowych."
 sw_paquime_title: "Paquimé"
 sw_paquime_desc: "Jednym z najważniejszych świadectw kultury Mogollon, jakie nam pozostawiono, jest Paquimé — rozległa osada obejmująca dziesiątki budynków. Powinniśmy skorzystać z ich doświadczenia architektonicznego i przystosować tę osadę do naszych potrzeb."
 sw_casas_grandes: "Casas Grandes"
 desc_sw_casas_grandes: "Całkowicie włączyliśmy tę prowincję do naszej kultury."
 sw_medicine_wheel_title: "Koło Medycyny"
 sw_medicine_wheel_desc: "Religia odgrywa ważną rolę w naszym życiu nie tylko ze względu na duchowy spokój, jaki przynosi naszej społeczności, lecz także na błogosławieństwa, które zapewniają nam zdrowie. Powinniśmy wyznaczyć odpowiednie miejsce do odprawiania naszych obrzędów."
 nah_earth_people_title: "Ludzie Ziemi"
 nah_earth_people_desc: "Na tym świecie istnieją dwa rodzaje ludzi. My, Ludzie Ziemi, musimy troszczyć się o naszą ziemię i z szacunkiem korzystać z powierzonych nam zasobów. Naszym obowiązkiem jest zachowanie równowagi między ludźmi a Matką Naturą."
 nah_earth_blessing_title: "Błogosławieństwo Ziemi"
 nah_earth_blessing_desc: "Zamożny naród bogaty jest nie tylko w wartości, lecz także w dobra materialne. Zapewnienie sobie narzędzi niezbędnych do troski o naszych ludzi również należy do naszych obowiązków."
 nah_holy_people_title: "Święci Ludzie"
 nah_holy_people_desc: "Święci Ludzie stworzyli słońce, księżyc, pory roku, gwiazdy, tę czystą wodę i to wzburzone morze. Powinniśmy należycie ich czcić na znak wdzięczności."
 nah_holy_blessing_title: "Święte Błogosławieństwo"
 nah_holy_blessing_desc: "Święci Ludzie nauczyli nas, gdzie leżą granice życia. Otrzymaliśmy piękną ziemię, lecz chciwość nie zna litości i musimy oprzeć się pokusie ekspansji. Te cztery góry wyznaczą pierwsze granice naszego państwa."
 nah_ravine_dwellers_title: "Mieszkańcy Wąwozów"
 nah_ravine_dwellers_desc: "Surowy teren, który zamieszkujemy, przyniósł nam tyle samo niebezpieczeństw, co korzyści. Mając takiego sprzymierzeńca, możemy ufortyfikować własne pozycje i uczynić je niemal niezdobytymi."
 nah_hogan_construction_title: "Budowa hoganów"
 nah_hogan_construction_desc: "Hogany to nasze tradycyjne domostwa. Służą nam zarówno jako mieszkania, jak i miejsca ceremonii, dlatego muszą być dobrze chronione. Wzniesienie kilku ufortyfikowanych hoganów w naszej stolicy z pewnością wesprze nasze działania obronne."
 nah_the_enemy_way_title: "Droga Wroga"
 nah_the_enemy_way_desc: "Naszym obowiązkiem jest zjednoczenie wszystkich Nawahów pod wspólną, najwyższą władzą."
 nah_dinetah_title: "Dinétah"
 nah_dinetah_desc: "Dinétah jest naszą ojczyzną przodków. Granice wyznaczone przez cztery góry muszą zostać rozszerzone, aż zapanujemy nad całą ziemią, która do nas należy."
 nah_navajo_ravines: "Wąwozy Nawahów"
 desc_nah_navajo_ravines: "Nasze forty oprą się teraz nawet największej furii natury."
 nah_hogan_constructed: "Wzniesione hogany"
 desc_nah_hogan_constructed: "Z powodzeniem ufortyfikowaliśmy nasze domostwa."
 nah_blessed_by_the_earth: "Błogosławieństwo Ziemi"
 desc_nah_blessed_by_the_earth: "Nasza gospodarka nigdy nie była w lepszej kondycji."
 pue_place_that_always_was_title: "Miejsce, które zawsze istniało"
 pue_place_that_always_was_desc: "Aby iść naprzód, musimy spojrzeć wstecz. Ukryte pośród gór znajduje się miejsce, które istniało od zawsze i będzie trwać nawet wtedy, gdy nas już nie będzie. Posiadanie go pomoże nam również osiągnąć wieczność."
 pue_mesa_verde: "Mesa Verde"
 desc_pue_mesa_verde: "Musimy przywrócić świetność Miejscu, które zawsze istniało."
 pue_people_of_the_white_rock_title: "Lud Białej Skały"
 pue_people_of_the_white_rock_desc: "Istnieje skała biała jak zęby dziecka, a jej rozmiar dorównuje jedynie księżycowi. Podobno mieszkali tam nasi przodkowie, a następnie rozszerzyli swoje ziemie na inne skały równie białe i wielkie jak tamta — jak zęby, jak księżyc."
 pue_people_of_the_white_rock_tt: "Prowincje §YOhkay Owingeh§!, §YNaflat§! i §YA'aku§! muszą należeć do gracza lub państwo musi mieć §Yrozmiar federacji§! wynoszący co najmniej §Y3§!."
 pue_the_white_rock: "Biała Skała"
 desc_pue_the_white_rock: "Posiadamy teraz najważniejsze płaskowyże w naszej okolicy."
