 mng_insight_28_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli nam wybrać sposób sprawowania rządów i określić zasady funkcjonowania dworu poprzez wzmocnienie jednej z trzech gałęzi naszej administracji."
 mng_insight_34_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli nam nadać naszemu władcy cechę §YWielkiego Inżyniera§!, a także ulepszyć §YWarsztaty§! w prowincjach objętych wymaganiami misji związanej z §YWielkim Kanałem§!."
 mng_insight_29_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie zapewni dostęp do nowej, unikalnej reformy, która pozwoli nam odebrać przywileje stanowe, a także zwiększyć zdolność rządzenia i absolutyzm."
 mng_insight_30_tt: "§GInformacje o wydarzeniu§!:\nWydarzenie umożliwi utworzenie Akademii Hanlin w prowincji [700.GetName], zapewniając nam wyjątkowe premie tak długo, jak utrzymamy reformę rządową §YSystem egzaminacyjny§!."
 mng_insight_31_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli nam rozwinąć i zwiększyć liczbę punktów mocy monarchy, których możemy żądać od naszych poddanych."
 mng_insight_32_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli nam powierzyć @KOR Korei opiekę nad naszymi terytoriami przygranicznymi, co może również doprowadzić do zacieśnienia stosunków dyplomatycznych między naszymi państwami."
 mng_insight_33_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli właścicielowi prowincji [677.GetName] nawiązać z nami stosunki §Ypaństwa trybutarnego§!, zapewniając nam wyjątkowe premie."
 mng_insight_35_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli rozbudować nasze wały przeciwpowodziowe oraz szerzyć dobrobyt i rozwój w odpowiednich prowincjach."
 mng_insight_36_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie zapewni nam dostęp do większej liczby prowincji z metalami szlachetnymi, a także doradcę skarbowego ze znaczną zniżką. Jeśli ukończymy misję, gdy nasz sojusznik lub poddany naszego sojusznika będzie posiadać §YCerro Rico del Potosí§!, jego §Yprodukcja§! znacznie wzrośnie."
 mng_insight_37_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli nam zacieśnić §Ystosunki dyplomatyczne§! z §Ykoreańskim§! władcą oraz cieszyć się wzajemnym dobrobytem i możliwością nawiązania historycznej przyjaźni."
 mng_insight_38_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie zapewni nam bezprecedensową kontrolę nad państwami trybutarnymi, a także potężną, stałą i unikalną nagrodę."
 mng_insight_39_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli właścicielowi prowincji [1020.GetName] zostać naszym poddanym, jeśli wyrazi na to zgodę, lub zapewni nam casus belli do jego podporządkowania, jeśli odmówi."
 mng_insight_40_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie pozwoli nam wybrać między §YZachodnim§! a §YWschodnim§! urzędem, z których każdy zapewnia naszemu państwu unikalne premie."
