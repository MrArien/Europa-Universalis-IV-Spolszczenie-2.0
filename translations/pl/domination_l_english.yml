 jap_gokaido_reform: "Reforma Gokaidō"
 jap_gokaido_reform_desc: "W Japonii wytyczono Pięć Dróg, wzdłuż których utworzono stacje pocztowe, gdzie podróżni mogą odpocząć i zaopatrzyć się w potrzebne towary."
 absolute_shogunate_reform: "Najwyższy siogunat"
 absolute_shogunate_reform_desc: "Siogun sprawuje władzę absolutną. Zarówno cesarz, jak i daimyō zostali pozbawieni realnych wpływów i pełnią jedynie funkcje reprezentacyjne."
 japanese_divine_empire: "Boskie Cesarstwo"
 japanese_divine_empire_desc: "Nasz Boski Cesarz, bezpośredni potomek bogini słońca Amaterasu, słusznie odzyskał należne mu miejsce na czele państwa. Dzięki temu, że ponownie przewodzi nam swoją boską obecnością, nasz kraj z pewnością zyska przychylność bogów."
 jap_ability_invite_cardinal: "Prośba o łaskę Stolicy Apostolskiej"
 jap_ability_invite_cardinal_desc: "Nasza chrześcijańska gorliwość pozwoli nam domagać się reprezentacji i wpływów w oczach wyższej władzy."
 jap_ability_military_parade_desc: "Widok naszych sił zbrojnych natchnie ludność i przyczyni się do dobrobytu kraju!"
 jap_ability_bolster_morale_desc: "W czasie wojny wezwiemy wiernych do chwycenia za broń i obrony naszej suwerenności."
