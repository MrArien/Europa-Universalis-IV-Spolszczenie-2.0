 desc_mng_reform_haijin_policy_modifier: "Reforma polityki handlowej w całym naszym państwie przyniosła bardzo korzystne skutki dla gospodarki i naszych poddanych."
 mng_bogue_modifier: "Ujście Bogue"
 desc_mng_bogue_modifier: "Poszerzone ujście jednej z największych rzek naszego państwa stało się ośrodkiem wzmożonej działalności gospodarczej i handlowej."
 mng_imperial_printing_center_modifier: "Cesarskie Centrum Druku"
 desc_mng_imperial_printing_center_modifier: "Centralny urząd odpowiedzialny za drukowanie i rozpowszechnianie dzieł literackich we wszystkich zakątkach naszego kraju."
 mng_divine_mandate_modifier: "Boska przychylność"
 desc_mng_divine_mandate_modifier: "Nasze mandatowe posłannictwo, powierzone nam przez same Niebiosa, jest niezaprzeczalne. Świat spoczywa teraz w naszych dłoniach."
 mng_backed_by_emperor_of_china_modifier: "Wsparcie Cesarza Chin"
 desc_mng_backed_by_emperor_of_china_modifier: "Cieszymy się poparciem najznamienitszych i najpotężniejszych dynastii Chin. Z pewnością zapewni nam ono tak potrzebną prawowitość i potęgę."
 mng_eastern_campaigns_modifier: "Wyprawy na Wschód"
 desc_mng_eastern_campaigns_modifier: "Zgromadzenie machin oblężniczych i utworzenie ośrodków zaopatrzenia to rozsądny plan przygotowania przyszłych wypraw poza granice naszego państwa."
 mng_sinicization_of_japan_modifier: "Sinizacja Japonii"
 desc_mng_sinicization_of_japan_modifier: "Nowo podbite ziemie naszego państwa należy rozwijać i podnosić ich poziom, by dorównały standardom jednolitości krzewionym przez rząd centralny."
 mng_inner_branch_bureau_modifier: "Wewnętrzne Biuro Nadzoru"
 desc_mng_inner_branch_bureau_modifier: "Potężny urząd nadzorujący korupcję w administracji i przekazujący Cesarzowi niezbędne raporty."
 mng_outer_wall_beijing_modifier: "Zewnętrzne Mury Pekinu"
 desc_mng_outer_wall_beijing_modifier: "Wzniesiono rozległe umocnienia wokół naszego miasta, aby pomieścić rosnącą liczbę mieszkańców w obrębie naszych posiadłości."
 mng_outer_wall_beijing_and_imperial_granary_modifier: "Zewnętrzne Mury i Cesarski Spichlerz Pekinu"
 desc_mng_outer_wall_beijing_and_imperial_granary_modifier: "Wzniesiono rozległe umocnienia wokół naszego miasta, aby pomieścić rosnącą liczbę mieszkańców, a także największy spichlerz w całym państwie."
 mng_safe_coasts_modifier: "Bezpieczne wybrzeża"
 desc_mng_safe_coasts_modifier: "Nasze wybrzeża korzystają teraz ze skutecznej ochrony, co zapoczątkowało nową epokę bezpieczeństwa i rozkwitu handlu."
 mng_era_of_culture_modifier: "Epoka kultury"
 desc_mng_era_of_culture_modifier: "Obecne czasy nazwano epoką kultury ze względu na mnogość dzieł literackich, sztuk teatralnych i osiągnięć naukowych, które zawdzięczamy roztropnym rządom i dobrobytowi."
 mng_starting_malus_5_modifier: "Przeciążenie administracji"
 mng_starting_malus_4_modifier: "Przeciążenie administracji"
