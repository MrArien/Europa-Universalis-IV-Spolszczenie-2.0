 desc_great_engineer_personality: "Wizjoner i pionier w dziedzinie budownictwa. Niezależnie od tego, czy kieruje nim własna ambicja i zapał, czy pragnienie poprawy losu poddanych, nasz władca wykazuje niezwykłe zdolności w planowaniu i realizacji przedsięwzięć budowlanych."
