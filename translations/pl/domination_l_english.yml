 chi_strongest_warlord_tt: "Posiada najwyższy §Yrozwój§! i największą §Yarmię§! na subkontynencie chińskim"
 chi_subject_reward_tt: "Jeśli ukończymy misję poprzez zwiększenie §Yliczby§! naszych poddanych, będąc zarazem §YCesarzem Chin§!, otrzymamy §G10§! punktów Mandatu za każdego poddanego oraz następującą nagrodę:"
 chi_mana_per_subject_tt: "Jeśli ukończymy misję poprzez zwiększenie §Yliczby§! naszych poddanych, otrzymamy po §Y25§! punktów £adm£ £dip£ i £mil£ za każdego z nich oraz następującą nagrodę:"
 chi_outwards_expansion_reward_tt: "
