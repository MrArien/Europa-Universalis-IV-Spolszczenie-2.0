 flavor_gbr.200.unknown: "Pozwólmy kolonistom wybrać rodzaj produkcji."
 eng_make_orkney_offer_title: "Oferta zakupu prowincji [369.GetName]"
 eng_make_orkney_offer_desc: "Po podporządkowaniu Szkocji północna część Wysp Brytyjskich znalazła się pod panowaniem państwa [Root.GetAdjective]. Nadal jednak wymykają się nam północne wyspy [369.GetName], [1978.GetName] i [1979.GetName]. Dwie ostatnie mają niewielkie znaczenie, lecz wyspa [369.GetName] musi zostać włączona do naszego państwa.\nByć może udałoby się kupić ją od państwa [369.Owner.GetName]."
 eng_abolish_adjustments_of_laws_title: "Uchylenie zmian w prawie"
 eng_abolish_adjustments_of_laws_desc: "Zmiany w naszym systemie prawnym nie są już potrzebne. Nadszedł czas, by je znieść."
 eng_end_the_law_discussions_title: "Zakończenie debat nad zmianami prawa"
 eng_end_the_law_discussions_desc: "Wprowadzanie nowych kwestii parlamentarnych zmieniających nasze ustawodawstwo stanowi poważne obciążenie dla administracji. Nadszedł czas, by na pewien okres zakończyć te debaty."
 eng_end_the_law_discussions_at: "§YKwestie parlamentarne zmieniające nasze idee narodowe nie będą już dostępne.§!"
 eng_start_the_law_discussions_title: "Wznowienie debat nad zmianami prawa"
 eng_start_the_law_discussions_desc: "Nasza sytuacja ponownie wymaga elastycznego dostosowywania praw państwowych."
 eng_start_the_law_discussions_at: "§YKwestie parlamentarne zmieniające nasze idee narodowe znów będą dostępne.§!"
 eng_the_crown_of_ireland: "Korona Irlandii"
 desc_eng_the_crown_of_ireland: "Ustanowienie Irlandii pełnoprawnym królestwem z pewnością podniesie prestiż naszego [Root.Monarch.GetTitle] jako prawowitego władcy tej wyspy."
 eng_the_crown_of_iberia: "Korona Iberyjska"
 desc_eng_the_crown_of_iberia: "Ustanowienie Iberii pełnoprawnym królestwem z pewnością podniesie prestiż naszego [Root.Monarch.GetTitle] jako prawowitego władcy tego półwyspu."
 eng_the_crown_of_italy: "Korona Włoska"
 desc_eng_the_crown_of_italy: "Ustanowienie Włoch pełnoprawnym królestwem z pewnością podniesie prestiż naszego [Root.Monarch.GetTitle] jako prawowitego władcy tego kraju."
 eng_english_rule_over_ireland: "Bezpośrednie panowanie"
 desc_eng_english_rule_over_ireland: "Ta prowincja znajduje się pod bezpośrednim panowaniem Anglików. Z pewnością nie przyniesie to żadnych negatywnych konsekwencji w przyszłości."
 eng_unified_britain: "Zjednoczona Brytania"
 desc_eng_unified_britain: "Jego Wysokość [Root.Monarch.GetTitle] zostanie pobłogosławiony, gdy wielki naród [Root.GetUsableName] zjednoczy Wyspy Brytyjskie ku chwale Pana."
 gbr_british_rule: "Panowanie brytyjskie"
 desc_gbr_british_rule: "Ta prowincja stanowi integralną część Królestwa Brytyjskiego. Dawne obawy przed chaosem i lokalnymi niepokojami ustąpiły miejsca bezpiecznej i stabilnej administracji."
 eng_a_house_united: "Zjednoczony ród"
 desc_eng_a_house_united: "Po zakończeniu Wojny Dwóch Róż ród [Root.Dynasty.GetName] sprawuje władzę nad państwem [Root.GetUsableName] przy wsparciu szlachty i dyplomatów."
 eng_dynastical_security: "Bezpieczeństwo dynastyczne"
 desc_eng_dynastical_security: "Wojny Dwóch Róż udało się uniknąć w ostatniej chwili. W przyszłości ród [Root.Dynasty.GetName] zadba o to, by po każdym [Root.Monarch.GetTitle] tron obejmował prawowity następca."
 eng_a_new_religious_destiny: "Nowe przeznaczenie religijne"
 desc_eng_a_new_religious_destiny: "Chrześcijaństwo przestało być naszą religią, a przyszłość wyznaniowa państwa [Root.GetName] pozostaje otwarta. Niezależnie jednak od tego, jaki los nas czeka, żarliwa wiara naszego ludu pozostanie niezmienna!"
 eng_a_different_kind_of_christian: "Poza reformacją"
 desc_eng_a_different_kind_of_christian: "Podczas gdy nasi dawni bracia w wierze mordują się nawzajem w wirze reformacji, nasz lud odnalazł oświecenie w naukach religii [Root.Religion.GetName]. Litujemy się nad tymi, którzy wciąż trzymają się archaicznych zasad katolicyzmu i jego zreformowanej odmiany."
 eng_loyalty_to_catholocisim: "Lojalność wobec papieża"
 desc_eng_loyalty_to_catholocisim: "Dowiedliśmy naszej lojalności wobec sprawy katolickiej. Nasze wpływy w sprawach papieskich rosną."
 eng_own_church_creation: "Jeden kraj, jeden Kościół"
 desc_eng_own_church_creation: "Zgubny wpływ duchowieństwa został wreszcie ograniczony. Kościół podlega teraz państwu, a religia protestancka zatriumfuje w państwie [Root.GetName]."
 eng_calvinist_path: "Droga kalwinizmu"
 desc_eng_calvinist_path: "Wybraliśmy drogę kalwinizmu. Niech Pan okaże miłosierdzie naszym wrogom, bo my go nie okażemy."
 eng_head_of_the_anglican_church: "Zwierzchnik Kościoła anglikańskiego"
 desc_eng_head_of_the_anglican_church: "Kościół katolicki został wypędzony, a luterański i kalwiński nurt reformacji nam nie wystarczają. Wybieramy własną drogę religijną, odpowiadającą potrzebom władców Brytanii."
 eng_the_age_of_reformation: "Chaos religijny"
 desc_eng_the_age_of_reformation: "[Root.GetAdjective] władcy mają §Y50,0%§! szansy na wyznawanie religii §Rheretyckiej§! w chwili wstąpienia na tron.\nWładcy mogą przyjąć §Ystanowisko religijne§! wobec reformacji, które wpłynie na przyszłe wydarzenia.\n\nKierunek religijny państwa pogrążony jest w całkowitym chaosie. [Root.Monarch.GetTitle]owie dowolnie decydują o kierunku naszej wiary, a duchowieństwo jest zagrożone przez państwo.\nNasz lud czeka niepewna przyszłość...\n§YModyfikator obowiązuje do końca epoki reformacji lub do chwili, gdy przestaniemy być chrześcijanami.§!"
 eng_reformer_ruler: "Zwolennik reformacji"
 desc_eng_reformer_ruler: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] jest zwolennikiem reformacji. [Root.Monarch.GetHerHisCap] działania doprowadzą do dyskryminacji tych, którzy nadal pozostają wierni Kościołowi katolickiemu.\n§YModyfikator obowiązuje do końca epoki reformacji lub do chwili, gdy przestaniemy być chrześcijanami.§!"
 eng_catholic_ruler: "Zwolennik Kościoła katolickiego"
 desc_eng_catholic_ruler: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] jest członkiem Kościoła katolickiego. [Root.Monarch.GetHerHisCap] działania doprowadzą do dyskryminacji tych, którzy nadal popierają reformację.\n§YModyfikator obowiązuje do końca epoki reformacji lub do chwili, gdy przestaniemy być chrześcijanami.§!"
 eng_tolerant_ruler: "Niezdecydowane stanowisko"
 desc_eng_tolerant_ruler: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] nie ma jednoznacznego stanowiska w kwestiach religijnych. W rezultacie [Root.Monarch.GetHerHis] rządy przynoszą niestabilność państwu, starając się zapewnić równość wyznaniom.\n§YModyfikator obowiązuje do końca epoki reformacji lub do chwili, gdy przestaniemy być chrześcijanami.§!"
 gbr_isolation_policy: "Polityka izolacjonizmu"
 desc_gbr_isolation_policy: "Kontynent przestał być dla nas bezpiecznym miejscem. Naszym domem są wyłącznie Wyspy Brytyjskie, dlatego przede wszystkim skupimy się na sprawach wewnętrznych."
 gbr_recovering_prestige: "Odbudowa prestiżu"
 desc_gbr_recovering_prestige: "Porzucenie kontynentu z pewnością odbiło się na naszym prestiżu. Z czasem mocarstwa Europy zrozumieją, że był to jedynie odwrót taktyczny, a nie rezygnacja z naszych roszczeń do ziem francuskich."
 gbr_end_of_the_villeinage: "Zniesienie poddaństwa chłopów"
 desc_gbr_end_of_the_villeinage: "Nasi chłopi nie podlegają już systemowi poddaństwa."
 gbr_english_dutch_trade_partners: "Holenderscy partnerzy handlowi"
 desc_gbr_english_dutch_trade_partners: "Nasze relacje z Holendrami pozwalają nam na lepsze zyski z handlu."
 gbr_naval_dominance: "Dominacja morska"
 desc_gbr_naval_dominance: "Brytania panuje na falach."
 eng_globe_theatre: "Teatr Globe"
 desc_eng_globe_theatre: "Teatr Globe został zbudowany przez Lord Chamberlain's Men, trupę teatralną Williama Shakespeare'a. Wystawiane są w nim liczne wybitne sztuki i przedstawienia, dzięki czemu teatr stał się miejscem o wielkim prestiżu i splendorze."
 gresham_college_royal_society: "Królewskie Towarzystwo Naukowe"
 desc_gresham_college_royal_society: "Królewskie Towarzystwo Londyńskie na rzecz Rozwoju Wiedzy Przyrodniczej to wspólnota naukowców i uczonych propagująca postęp w nauce."
 angevin_age: "Epoka Andegawenów"
 desc_angevin_age: "Nadchodzi nowa era, w której [Root.GetAdjective] [Root.GovernmentName] rości sobie prawa do całego świata. Niech nasi wrogowie drżą, a poddani prosperują, gdy [Root.Monarch.GetTitle] spogląda na ziemie, które wciąż czekają na podbój."
 eng_taxation_of_the_clergy: "Opodatkowanie duchowieństwa"
 desc_eng_taxation_of_the_clergy: "Duchowieństwo znajduje się pod presją wysokich podatków. To kolejny krok korony przeciwko instytucjom kościelnym."
 eng_protects_the_clergy: "Ochrona duchowieństwa"
 desc_eng_protects_the_clergy: "Duchowieństwo jest chronione przed prześladowaniami i presją podatkową."
 eng_taxation_of_the_clergy_prot: "Opodatkowanie duchowieństwa"
 desc_eng_taxation_of_the_clergy_prot: "Duchowieństwo znajduje się pod presją wysokich podatków. To kolejny krok korony przeciwko instytucjom kościelnym."
 eng_protects_the_clergy_prot: "Ochrona duchowieństwa"
 desc_eng_protects_the_clergy_prot: "Duchowni są chronieni przed prześladowaniami i naciskiem podatkowym."
 eng_foreign_religious_control: "Kontrola religijna w rękach doradców"
 desc_eng_foreign_religious_control: "Sprawy religijne znajdują się teraz w rękach stanu [Root.GetClergyName] oraz doradców [Root.Monarch.GetTitle].\n\n§YOtrzymujemy modyfikator zależny od rodzaju i umiejętności doradcy:§!\n -§YFilozof§! i §Yprzyrodnik§!\n    - Tolerancja heretyków: §G+1,00§! za każdy poziom umiejętności\n -§YArtysta§!\n    - Tolerancja prawdziwej wiary: §G+1,00§! za każdy poziom umiejętności\n -§YSkarbnik§! i §YMistrz mennicy§!\n    - Jedność religijna: §G+15,0%§! za każdy poziom umiejętności\n -§YInkwizytor§! i §Yteolog§!\n    - Siła misjonarzy przeciwko heretykom: §G+1,0%§! za każdy poziom umiejętności"
 eng_end_of_the_english_reformation: "Koniec reformacji w Anglii"
 desc_eng_end_of_the_english_reformation: "Katolicy i zwolennicy reformacji wreszcie pojednali się pod sztandarem państwa [Root.GetUsableName]. Nasz naród, niegdyś podzielony przez religię, ponownie jest zjednoczony.\nNa tyle, na ile to możliwe.\n\n§YKatastrofa „Niepokoje religijne” nie może już wybuchnąć w naszym państwie.§!"
 gbr_religious_stability: "Stabilność religijna"
 desc_gbr_religious_stability: "Reformacja dobiegła końca, a stabilność i bezpieczeństwo naszej religii zostały przywrócone."
 gbr_resolved_civil_war: "Przywrócony porządek"
 desc_gbr_resolved_civil_war: "Chaos wojny domowej pozostawił blizny na naszym kraju, lecz ostatecznie udało się przywrócić porządek. Prawowitość korony i wpływy parlamentu ponownie pozostają w równowadze."
 gbr_a_stable_government: "Utrwalony absolutyzm"
 desc_gbr_a_stable_government: "Walka o władzę między parlamentem a koroną zakończyła się bez rozlewu krwi. Rząd przetrwał próby przejęcia pełnej kontroli nad państwem zarówno przez parlament, jak i przez koronę."
 gbr_unified_british_isles_culture: "Zjednoczona tożsamość brytyjska"
 desc_gbr_unified_british_isles_culture: "Brytyjska tożsamość łączy liczne kultury Wysp Brytyjskich w jedną całość, której dominującym składnikiem jest kultura angielska."
 ave_iberian_conquest: "Podbój Iberii"
 desc_ave_iberian_conquest: "Półwysep Iberyjski uległ potędze naszego państwa [Root.GovernmentName]. Jego ludność stanie się częścią [Root.GetAdjective] machiny wojennej!"
 gbr_new_world_dominance: "Dominacja w Nowym Świecie"
 desc_gbr_new_world_dominance: "Nowy Świat i wszystkie jego zasoby należą do państwa [Root.GetAdjective] [Root.GovernmentName]!\n\nWszyscy §Ykolonialni§! poddani otrzymują §G+50,0%§! wydajności produkcji i §G+50,0%§! wydajności handlu."
 ave_new_world_dominance: "Dominacja w Nowym Świecie"
 desc_ave_new_world_dominance: "Nowy Świat i wszystkie jego zasoby należą do państwa [Root.GetAdjective] [Root.GovernmentName]!"
 ave_west_european_empire: "Imperium Europejskie"
 desc_ave_west_european_empire: "Nasze państwo osiągnęło nowy wymiar potęgi, przy którym wszystkie pozostałe wielkie mocarstwa bledną. Europa ugina przed nami kolana!"
 ave_anglo_french_imperium: "Imperium anglo-francuskie"
 desc_ave_anglo_french_imperium: "Unia Anglików i Francuzów. Ambicje dwóch imperialnych narodów połączyły się w jedno wspólne dążenie."
 gbr_influence_of_the_trade_company: "Wpływy kompanii handlowej"
 desc_gbr_influence_of_the_trade_company: "Ta prowincja znajduje się w bezpośredniej strefie wpływów potężnej kompanii handlowej."
 gbr_emperor_of_india: "Władca Indii"
 desc_gbr_emperor_of_india: "Bogactwa Indii należą do nas! Jesteśmy ich prawowitymi władcami i będziemy czerpać z nich ogromne korzyści.\n\n§YPrzedsiębiorstwa handlowe§! i §Yprotektoraty§! otrzymują §G+15,0%§! modyfikatora produkowanych dóbr.\n§YPrzedsiębiorstwa handlowe§! zapewniają teraz zwierzchnikowi §G-75,0%§! kary do handlu poza głównym węzłem handlowym oraz §G+10,0%§! wydajności handlu."
 gbr_emperor_of_india_subject_bonus: "Władca Indii"
 gbr_emperor_of_india_overlord_bonus: "Władca Indii"
 ave_imperial_favoritism: "Przychylność elektorów"
 desc_ave_imperial_favoritism: "Dzięki naszej charyzmie elektorzy Cesarstwa opowiadają się po naszej stronie. Znacznie poprawia to nasz wizerunek publiczny."
 ave_expnansionist_path: "Marsz na Niemcy"
 desc_ave_expnansionist_path: "Dawne potężne Święte Cesarstwo Rzymskie już nie istnieje. Droga do Niemiec stoi otworem przed naszymi ambicjami podbojów."
 ave_imperial_parliament: "Parlament cesarski"
 desc_ave_imperial_parliament: "Jako wielki cesarz Świętego Cesarstwa Rzymskiego rozszerzyliśmy zakres kompetencji [Root.GetParliamentOrFallbackName] o sprawy całego imperium."
 ave_end_of_the_empire: "Koniec imperium"
 desc_ave_end_of_the_empire: "Imperium upadło. Pozostało po nim jedynie odległe wspomnienie, podczas gdy sztandar państwa [Root.GetAdjective] powiewa nad jego dawnymi ziemiami."
 ave_prosperous_metropolis: "Zamożna metropolia"
 desc_ave_prosperous_metropolis: "Ta prowincja przeżywa okres pokoju, wolności, sprawiedliwości i bezpieczeństwa pod rządami nowego imperium."
 gbr_accepted_lowlands: "Zintegrowane Niderlandy"
 desc_gbr_accepted_lowlands: "Kultury Niderlandów zostały zintegrowane z naszą kulturą."
 gbr_accepted_lowlands_tt: "do czasu zdegradowania kultury §Yholenderskiej§! lub §Yflamandzkiej§!"
 gbr_colonial_australia: "Kolonia karna"
 desc_gbr_colonial_australia: "Ci, którzy łamią prawo, mają wybór: mogą gnić w naszych więzieniach albo rozpocząć nowe życie w odległej Australii."
 ave_national_bank: "Zreformowany bank narodowy"
 desc_ave_national_bank: "Nasza waluta i gospodarka przechodzą gruntowne reformy w wielu obszarach."
 ave_local_expanded_barracks: "Rozbudowane koszary"
 desc_ave_local_expanded_barracks: "Koszary i fortyfikacje w tej prowincji zostały dostosowane tak, aby pomieścić więcej żołnierzy i ich rodzin."
 eng_empire_of_the_island: "Awans do rangi imperium"
 desc_eng_empire_of_the_island: "Nie jesteśmy już królestwem, lecz potężnym imperium o światowym zasięgu. Chwała państwa [Root.GetAdjective] będzie trwać wiecznie."
 eng_most_esteemed_university: "Najznamienitszy uniwersytet"
 desc_eng_most_esteemed_university: "Na tej uczelni mogą studiować wyłącznie najwybitniejsi przedstawiciele świata nauki."
 eng_the_man_of_war: "Okręt liniowy"
 desc_eng_the_man_of_war: "Królewska Marynarka Wojenna nie może istnieć bez potężnego okrętu, który będzie symbolem morskiej potęgi państwa [Root.GovernmentName]."
 eng_strict_marines: "Królewska Piechota Morska"
 desc_eng_strict_marines: "W państwie morskim jest rzeczą naturalną, że nasza piechota morska stanowi elitę i skupia najlepszych żołnierzy, jakich może wystawić naród."
 eng_the_redcoat: "Czerwone kurtki"
 desc_eng_the_redcoat: "Pierwotnie był to przydomek naszych żołnierzy, lecz określenie „czerwone kurtki” stało się synonimem dyscypliny naszych formacji piechoty."
 eng_the_two_houses: "Dwie izby"
 eng_order_of_chivalry: "Zakon rycerski"
 eng_jousting_tournaments: "Turnieje rycerskie"
 gbr_pax_britannica: "Pax Britannica"
 ave_pax_angevina: "Pax Angevina"
 trade_protectorate_subject_modifier: "Protektorat handlowy"
 trade_protectorate_low_development_subject_modifier: "Słaby protektorat handlowy"
 trade_protectorate_overlord_modifier: "Protektorat handlowy"
 force_british_union_debate_title: "[Root.GetActsOfUnionDecisionTitle]"
 force_british_union_debate_desc: "[Root.GetActsOfUnionDecisionDesc]"
 force_french_union_debate_title: "[Root.GetActsOfUnionDecisionTitle]"
 force_french_union_debate_desc: "[Root.GetActsOfUnionDecisionDesc]"
 acts_of_union_debate_title: "Wymuszenie debaty nad aktami unii"
 acts_of_union_debate_desc: "Nasze państwo jest podzielone na dwie korony, z których każda ma równie wielkie znaczenie dla naszej władzy. [Root.GetParliamentOrFallbackName] musi teraz przedyskutować przyszłość obu tronów."
 eng_disable_colonial_ventures_title: "Przyznanie autonomii przedsiębiorstwom kolonialnym"
 eng_disable_colonial_ventures_desc: "Zarządzanie sprawami zamorskimi jest wyczerpującym przedsięwzięciem. Rozsądnie byłoby pozwolić kolonistom samodzielnie decydować o najlepszym sposobie prowadzenia ich działalności."
 eng_disable_colonial_ventures_tt: "Wydarzenie „§YPrzedsięwzięcie kolonialne§!” nie będzie już uruchamiane po zakończeniu kolonizacji prowincji."
 eng_enable_colonial_ventures_title: "Odebranie autonomii przedsiębiorstwom kolonialnym"
 eng_enable_colonial_ventures_desc: "Koloniści cieszyli się autonomią wystarczająco długo. Nadszedł czas, by aktywniej zaangażować się w sprawy Nowego Świata."
 eng_enable_colonial_ventures_tt: "Wydarzenie „§YPrzedsięwzięcie kolonialne§!” będzie ponownie uruchamiane po zakończeniu kolonizacji prowincji."
 succesful_province_purchase: "Udany zakup prowincji"
 failed_province_purchase: "Nieudany zakup prowincji"
