 dismantled_the_hre: "Rozwiązano Święte Cesarstwo Rzymskie"
 hre_event.15.t: "Koniec Świętego Cesarstwa Rzymskiego"
 hre_event.15.desc: "Wraz z upadkiem miasta [Emperor.Capital.GetName], [Emperor.Monarch.GetTitle] [Emperor.Monarch.GetName] musiał[Emperor.Monarch.GetANoun] zaakceptować ostateczną porażkę z rąk sił [Root.GetAdjective]. W roku [GetYear], niegdyś prestiżow[Emperor.Monarch.GetAY] [Emperor.Monarch.GetTitle] podpisał[Emperor.Monarch.GetANoun] swoją abdykację z tronu Świętego Cesarstwa Rzymskiego i zwolnił[Emperor.Monarch.GetANoun] wszystkie cesarskie państwa i urzędników z ich przysiąg i zobowiązań wobec cesarstwa.\n\nŚwięte Cesarstwo Rzymskie przestało istnieć, a [Root.Monarch.GetTitle] [Root.Monarch.GetName] na zawsze zostanie zapamiętan[Root.Monarch.GetAY] jako jego niszczyciel[Root.Monarch.GetKaNoun]."
 hre_event.15.a: "Cesarstwo w końcu przestało istnieć."
 hre_event.15.b: "Imperium upadło. Niech żyje państwo [Root.GetName] powstające z popiołów Cesarstwa!"
 estate_janissary_disaster: "Niepodległość janczarów"
 estate_janissary_disaster_desc: "Janczarzy stali się tak potężni, że oderwali się od państwa i utworzyli własne, pozostające poza naszą kontrolą."
 estate_janissaries_disaster_tooltip_cossacks: "Jeśli do tego dojdzie, stan §Yjanczarów§! wyzwoli się i utworzy własne państwo! Będziesz mieć możliwość przejęcia nad nim kontroli."
 estate_janissaries_disaster_tooltip: "Jeśli do tego dojdzie, stan §Yjanczarów§! wyzwoli się i utworzy własne państwo!"
 tur_disaster_ottoman_power_struggle: "Wewnętrzna walka o władzę"
 tur_disaster_ottoman_power_struggle_desc: "Rząd osmański jest skorumpowany do szpiku kości. Sułtan ugina się pod potęgą janczarów, harem podejmuje decyzje państwowe, ejalety rozważają odłączenie się od imperium, paszowie domagają się większej władzy, a nasi poddani ulegają ideom nacjonalizmu."
 tur_disaster_janissary_coup: "Zamach stanu janczarów"
 tur_disaster_janissary_coup_desc: "Niezadowolony z braku bezpośredniego wpływu na rząd korpus janczarów zbuntował się przeciwko swojemu suwerenowi i przejął kontrolę nad państwem."
 tur_disaster_janissary_coup_at: "Podjęliśmy decyzję §YStaw czoła janczarom§! §Y3§! razy (§Y[Root.GetNumOfJanissaryDecisions]§!/§Y3§!)."
 NUM_OF_JANISSARIES_SLAUGHTERED: "[Root.tur_num_of_janissary_decisions.GetValue]"
 tur_disaster_janissary_coup_bt: "§YJanczarzy§! nie mają żadnego przywileju zmniejszającego nasz §Yabsolutyzm§!."
 tur_disaster_plot_of_the_harem: "Intrygi haremu"
 tur_disaster_plot_of_the_harem_desc: "Harem zdobył coraz większe wpływy i władzę nad rządzącym sułtanem. Tam, gdzie niegdyś panował monarcha absolutny, teraz rządzi grupa egoistycznych niewolników i eunuchów."
 tur_disaster_eyalet_rebellion: "Bunt ejaletów"
 tur_disaster_eyalet_rebellion_desc: "Ejalety przejmują kontrolę nad swoimi terytoriami i ogłaszają niepodległość od imperium."
 tur_disaster_eyalet_rebellion_at: "Żadna posiadana prowincja w §YEgipcie§!, §YPersji§! ani §YZachodniej Europie§! nie jest okupowana."
 tur_disaster_pasha_decadence: "Dekadencja paszów"
 tur_disaster_pasha_decadence_desc: "Paszowie uważają się za lepszych od sułtana i niezależnych od niego. Wykorzystają wszystkie dostępne zasoby, aby zagwarantować sobie autonomię."
 tur_disaster_nationalism_wave: "Fala nacjonalizmu"
 tur_disaster_nationalism_wave_desc: "Idee państw narodowych rozprzestrzeniły się wśród naszych poddanych. Ruchy niepodległościowe i bunty zagrażają rozpadowi imperium."
 no_estate_crownland_loss_from_developing: "Rozwój prowincji nie zmniejsza udziału ziemi koronnej."
 estate_dhimmi_millet_system: "System milletów"
 estate_dhimmi_millet_system_desc: "System milletów jest częścią osmańskiej administracji odrębnych wspólnot religijnych, która uznawała autorytet każdej wspólnoty w nadzorowaniu własnych spraw wspólnotowych, głównie poprzez niezależne systemy sądów religijnych i szkół."
 estate_church_freedom_of_interpretation: "Swoboda interpretacji"
 estate_church_freedom_of_interpretation_desc: "Koran może być interpretowany przez każdego. Pozwalając na większą łagodność [Root.GetClergyName_gen], możemy być w stanie zobaczyć unikalny pogląd na naszą religię."
 estate_dhimmi_millet_system_mod: "System milletów"
 desc_estate_dhimmi_millet_system_mod: "System milletów jest częścią osmańskiej administracji odrębnych wspólnot religijnych, która uznawała autorytet każdej wspólnoty w nadzorowaniu własnych spraw wspólnotowych, głównie poprzez niezależne systemy sądów religijnych i szkół."
 tur_every_heathen_province_tt: "Każda posiadana §Ychrześcijańska§! i §Yżydowska§! prowincja zyska §G-5.0%§! kosztu rozwoju"
 tur_removes_dev_cost_tt: "Modyfikator §Ylokalny koszy rozwoju§! zostanie usunięty z prowincji §Ychrześcijańskich§! i §Yżydowskich§!"
 estate_brahmins_development_of_temples: "Rozwój świątyń"
 estate_brahmins_development_of_temples_desc: "Świątynie państwa są miejscami schronienia i siedzibą [Root.GetBrahminsName_gen]. Suwerenność tych instytucji musi być zagwarantowana, a ich rozwój musi być promowany."
 estate_brahmins_development_of_temples_gt: "Każda posiadana §Ydharmiczna§! prowincja z §Y[Root.GetTempleName_ins]§! lub budynkiem wyższego poziomu zyskuje premię:"
 estate_brahmins_development_of_temples_rt: "Modyfikator '§Yrozwój świątyń§!' zostaje usunięty ze wszystkich §Ydharmicznych§! prowincji."
 estate_brahmins_development_of_temples_mod: "Rozwój świątyń"
 desc_estate_brahmins_development_of_temples_mod: "Państwo zagwarantowało rozwój lokalnych świątyń."
 estate_brahmins_expand_the_theology: "Finansowanie studiów teologicznych"
 estate_brahmins_expand_the_theology_desc: "Teologia w naszym państwie odgrywa ważną rolę w nauczaniu nas o naszym miejscu w świecie i miejscu naszych poddanych w wielkim łańcuchu bytu. [Root.GetBrahminsName_CL_Cap] powinni mieć więcej zasobów, aby rozwijać nasze teologiczne zrozumienie."
 estate_brahmins_clerical_education: "Edukacja [Root.GetBrahminsName_gen]"
 estate_brahmins_clerical_education_desc: "[Root.GetBrahminsName_CL_Cap] są elitą intelektualną państwa, zajmującą stanowiska zarówno religijne (lub święte), jak i świeckie. W związku z tym ich edukacja musi być wspierana, a ich rola jako strażników edukacji gwarantowana."
 estate_brahmins_legitimacy_of_rule: "Wsparcie [Root.GetBrahminsName_gen]"
 estate_brahmins_legitimacy_of_rule_desc: "Jako naród muzułmański rządzimy dużą liczbą Hindusów. Legalność naszych rządów jest wątpliwa, chyba że uzyskamy poparcie [Root.GetBrahminsName_gen]."
 estate_brahmins_institutionalized_brahimns: "Zinstytucjonalizowanie [Root.GetBrahminsName_gen]"
 estate_brahmins_institutionalized_brahimns_desc: "[Root.GetBrahminsName_CL_Cap] to potężna klasa w państwie. Chociaż będzie to sprzeczne z ich życzeniami i wolnością, rozsądnie byłoby, gdyby państwo zinstytucjonalizowało klasę [Root.GetBrahminsName_gen] i odebrało im część władzy."
 estate_brahmins_donation_right: "Prawo do darowizny"
 estate_brahmins_donation_right_desc: "Jako duchowa klasa państwa jest rzeczą naturalną, że [Root.GetBrahminsName_CL] mają prawo do otrzymywania darowizn od państwa."
 estate_brahmins_administrative_privileges: "[Root.GetBrahminsName_CL_Cap] skupieni na sobie"
 estate_brahmins_administrative_privileges_desc: "Ogłoszenie [Root.GetBrahminsName_gen]. Wydaje się, że ignorują ekspansję państwa za pomocą środków wojskowych i chcą objąć biurokrację państwa, aby rozszerzyć nasze możliwości za pomocą innych środków."
 estate_church_development_of_temples: "Rozwój świątyń"
 estate_church_development_of_temples_desc: "Świątynie państwa są miejscami schronienia i siedzibą [Root.GetClergyName_gen]. Suwerenność tych instytucji musi być zagwarantowana, a ich rozwój musi być promowany."
 estate_church_development_of_temples_gt: "Każda posiadana prowincja wyznająca §Y[Root.Religion.GetName]§! ze §Yświątynią§! lub §Ykatedrą§! otrzymuje premię:"
 estate_church_development_of_temples_rt: "Modyfikator '§Yrozwój świątyń§!' zostaje usunięty ze wszystkich prowincji wyznających §Y[Root.Religion.GetName]§!."
 estate_church_development_of_temples_mod: "Rozwój świątyń"
 desc_estate_church_development_of_temples_mod: "Państwo zagwarantowało rozwój lokalnych świątyń."
 estate_church_expand_the_theology: "Finansowanie studiów teologicznych"
 estate_church_expand_the_theology_desc: "Teologia w naszym państwie odgrywa ważną rolę w nauczaniu nas o naszym miejscu w świecie i miejscu naszych poddanych w wielkim łańcuchu bytu. [Root.GetClergyName_CL_Cap] powin[Root.GetClergyName_NormEnd] mieć więcej zasobów, aby rozwijać nasze teologiczne zrozumienie."
 estate_church_clerical_education: "Wykształcenie urzędnicze"
 estate_church_clerical_education_desc: "[Root.GetClergyName_CL_Cap] [Root.GetClergyName_BE] elitą intelektualną państwa, zajmującą stanowiska zarówno religijne (lub święte), jak i świeckie. W związku z tym ich edukacja musi być wspierana, a ich rola jako strażników edukacji gwarantowana."
 estate_church_religious_delegation: "Zezwolenie na delegacje religijne"
 estate_church_religious_delegation_desc: "Wiele usług związanych z religią jest obecnie obsługiwanych przez państwo. Pozwalając [Root.GetClergyName_dat] na większą swobodę w [Root.GetClergyName_Whose] działaniach, możemy odciążyć naszą administrację, podczas gdy skupi[Root.GetClergyName_NounA] się na misjach religijnych."
 estate_church_institutionalized_clergy: "Zinstytucjonalizowanie [Root.GetClergyName_gen]"
 estate_church_institutionalized_clergy_desc: "[Root.GetClergyName_CL_Cap] to potężna klasa w państwie. Chociaż będzie to sprzeczne z [Root.GetClergyName_CL_Whose] życzeniami i wolnością, rozsądnie byłoby, gdyby państwo zinstytucjonalizowało klasę [Root.GetClergyName_gen] i odebrało [Root.GetClergyName_Who] część władzy."
 estate_church_donation_right: "Prawo do darowizny"
 estate_church_donation_right_desc: "Jako duchowa klasa państwa jest rzeczą naturalną, że [Root.GetBrahminsName_CL] ma[Root.GetBrahminsName_NounJa] prawo do otrzymywania darowizn od państwa."
 estate_church_administrative_privileges: "Skupienie na pracy urzędowej"
 estate_church_administrative_privileges_desc: "Ogłoszenie [Root.GetClergyName_gen]. Wydaje się, że ignoruj[Root.GetClergyName_EA] ekspansję państwa za pomocą środków wojskowych i chc[Root.GetClergyName_EA] objąć biurokrację państwa, aby rozszerzyć nasze możliwości za pomocą innych środków."
 estate_nobles_english_villeinage: "Villeinage"
 estate_nobles_english_villeinage_desc: "Chłopi podlegają systemowi villeinage. Podobnie jak w przypadku pańszczyzny, chłopi są poważnie ograniczeni w swobodzie poruszania się i służą swojemu właścicielowi."
 estate_nobles_english_copyhold_tenure: "Rozszerzone prawo własności"
 estate_nobles_english_copyhold_tenure_desc: "Dzierżawa dziedziczna jest ewolucją feudalnego systemu villeinage. Podczas gdy prawnym właścicielem ziemi dworskiej pozostawał mesne lord, chłopi pracujący na polu otrzymywali kopię odpowiedniego aktu własności."
 estate_nobles_development_of_castles: "Rozbudowa fortyfikacji"
 estate_nobles_development_of_castles_desc: "Zamki i fortyfikacje są naszymi kluczowymi liniami obrony przed najeźdźcami, którzy zagrażają naszemu istnieniu. Przyznając [Root.GetNobilityName_dat] ziemię z zamkami i przywilej mieszkania w tych fortyfikacjach, możemy zapewnić utrzymanie naszej obrony przez cały czas."
 estate_nobles_development_of_castles_gt: "Każda posiadana prowincja z §Yfortem§! zyskuje premię:"
 estate_nobles_development_of_castles_at: "Każda posiadana prowincja z §Ymurami obronnymi§! zyskuje premię:"
 estate_nobles_development_of_castles_rt: "Modyfikator '§Yrozbudowa fortyfikacji§!' zostaje usunięty ze wszystkich prowincji z §Yfortem§!\nModyfikator '§Yrozbudowa fortyfikacji§!' zostaje usunięty ze wszystkich prowincji z §Ymurami obronnymi§!."
 estate_nobles_development_of_castles_mod: "Rozbudowa fortyfikacji"
 desc_estate_nobles_development_of_castles_mod: "Prowincja ta otrzymuje wsparcie finansowe od lokalnej szlachty, dzięki czemu fortyfikacje na tym obszarze są lepiej utrzymane w porównaniu do innych budynków obronnych."
 estate_nobles_development_of_castles_ramparts_mod: "Rozbudowa obwarowań"
 desc_estate_nobles_development_of_castles_ramparts_mod: "Prowincja ta otrzymuje wsparcie finansowe od lokalnej szlachty, dzięki czemu fortyfikacje na tym obszarze są lepiej utrzymane w porównaniu do innych budynków obronnych."
 estate_nobles_statesman_servitude: "Mężowie stanu [Root.GetNobilityName_gen]"
 estate_nobles_statesman_servitude_desc: "Państwo nie może polegać wyłącznie na kompetentnym władcy. Potrzebuje również odpowiednich mężów stanu na stanowiskach władzy.\n[Root.GetNobilityName_CL_Cap] posiada całą wiedzę i maniery potrzebne do pełnienia takiej roli, jeśli damy [Root.GetNobilityName_Who] taką szansę."
 estate_nobles_royal_court_tasks: "Przyznaj stanowiska dworskie"
 estate_nobles_royal_court_tasks_desc: "Dwór królewski sam w sobie jest złożoną instytucją. Aby zarządzać nim przy mniejszym wysiłku, członkowie [Root.GetNobilityName_gen] są zapraszani do obsadzenia niektórych stanowisk na dworze ich [Root.Monarch.GetRulerGen]."
 estate_nobles_force_conscription: "Pobór [Root.GetNobilityName_gen] do wojska"
 estate_nobles_force_conscription_desc: "Czasami pobory nie wystarczają na kampanie wojskowe państwa. W takich przypadkach mamy prawo siłą wcielić członków [Root.GetNobilityName_gen] i wysłać ich na front.\nJednak prawo to wiąże się z przyznaniem silnych przywilejów dla [Root.GetNobilityName_gen]."
 estate_nobles_noble_officer_right: "Prawo oficerskie dla [Root.GetNobilityName_gen]"
 estate_nobles_noble_officer_right_desc: "Generałem naszej armii nie może być jakiś podrzędny lokaj z chłopskiej rodziny. Tylko szlachetna krew może poprowadzić naszych żołnierzy do zwycięstwa."
 estate_nobles_diet_right: "Prawo do zwoływania zgromadzenia dla [Root.GetNobilityName_gen]"
 estate_nobles_diet_right_desc: "Klasy są potężną instytucją w naszym [Root.GetGovNameIns]. Z prawem dla [Root.GetNobilityName_gen] do zwoływania zgromadzeń według własnych zachcianek, [Root.Monarch.GetTitle] nie ma innego wyboru, jak tylko zgodzić się z życzeniami [Root.GetNobilityName_gen]."
 estate_nobles_expedition_rights: "Prawo do ekspedycji dla [Root.GetNobilityName_gen]"
 estate_nobles_expedition_rights_desc: "Nowy Świat oferuje wiele możliwości - i [Root.GetNobilityName_CL] doskonale zdaje sobie z tego sprawę. Przyznając [Root.GetNobilityName_Who] prawo do rozpoczęcia własnej ekspedycji w Nowym Świecie bez konieczności martwienia się o swój majątek w ojczyźnie, będziemy w stanie zwerbować najodważniejszych konkwistadorów znanych człowiekowi."
 estate_maratha_development_of_marathi_lands: "Promowanie rozwoju marathów"
 estate_maratha_development_of_marathi_lands_desc: "[Root.GetMarathasName_CL_Cap] są jedną z wpływowych kast w naszym [Root.GetGovNameIns]. Obiecanie im wpływów i zasobów państwa zapewni ich lojalność wobec nas."
 estate_maratha_development_of_marathi_lands_gt: "Każda posiadana §Ysungaleska§!, §Ydrawidyjska§! i §Yzachodnio-aryjska§! prowincja (która NIE jest radżastańska lub malwańska) otrzymuje premię:"
 estate_maratha_development_of_marathi_lands_rt: "Modyfikator '§Yrozwój marathów§!' zostaje usunięty ze wszystkich §Ydharmicznych§! prowincji."
 estate_maratha_development_of_marathi_lands_mod: "Rozwój marathów"
 desc_estate_maratha_development_of_marathi_lands_mod: "Prowincja ta otrzymuje ogromne wsparcie od marathów w zakresie jej rozwoju."
 estate_maratha_military_ministerium: "Przyznaj [Root.GetMarathasName_dat] stanowiska ministerialne"
 estate_maratha_military_ministerium_desc: "[Root.GetMarathasName_CL_Cap] są kastą wojowników i jako tacy posiadają wielu zdolnych wojskowych strategów. Przyznanie [Root.GetMarathasName_dat] gwarantowanej pozycji na naszym dworze daje nam łatwy dostęp do ich najbardziej biegłych doradców."
 estate_maratha_royal_court_tasks: "Przyznaj stanowiska dworskie"
 estate_maratha_royal_court_tasks_desc: "Dwór królewski sam w sobie jest złożoną instytucją. Aby zarządzać nim przy mniejszym wysiłku, członkowie [Root.GetMarathasName_gen] są zapraszani do obsadzenia niektórych stanowisk na dworze ich [Root.Monarch.GetRulerGen]."
 estate_maratha_force_conscription: "Pobór [Root.GetMarathasName_gen]"
 estate_maratha_force_conscription_desc: "W razie potrzeby [Root.Monarch.GetTitle] może zaciągnąć wszystkich zdolnych członków [Root.GetMarathasName_gen] do walki w imieniu [Root.GetGovNameGen]. Wiąże się to oczywiście z dodatkowymi przywilejami dla [Root.GetMarathasName_gen]."
 estate_maratha_noble_promotion: "Nominacje szlacheckie dla [Root.GetMarathasName_gen]"
 estate_maratha_noble_promotion_desc: "Niektórzy członkowie [Root.GetMarathasName_gen] są szlachetnej krwi. Jednak w bezpośredniej rywalizacji mają przewagę nad [Root.GetNobilityOrFallbackName_ins]. Promowanie ich pozycji zapewni lojalność [Root.GetMarathasName_gen]."
 estate_rajput_development_of_rajput_lands: "Promowanie rozwoju radźputów"
 estate_rajput_development_of_rajput_lands_desc: "[Root.GetRajputsName_CL_Cap] są jedną z wpływowych kast w naszym [Root.GetGovNameIns]. Obiecanie im wpływów i zasobów państwa zapewni ich lojalność wobec nas."
 estate_rajput_development_of_rajput_lands_gt: "Każda posiadana §Yradżastańska§!, §Ymalwańska§!, §Yhindustańska§!, §Yśrodkowoindyjska§! i §Ywschodnioirańska§! prowincja (która NIE jest syngaleska) otrzymuje premię:"
 estate_rajput_development_of_rajput_lands_rt: "Modyfikator '§Yrozwój radźputów§!' zostaje usunięty ze wszystkich prowincji."
 estate_rajput_development_of_rajput_lands_mod: "Rozwój radźputów"
 desc_estate_rajput_development_of_rajput_lands_mod: "Prowincja ta otrzymuje ogromne wsparcie od radźputów w zakresie jej rozwoju."
 estate_rajput_military_ministerium: "Przyznaj [Root.GetRajputsName_dat] stanowiska ministerialne"
 estate_rajput_military_ministerium_desc: "[Root.GetRajputsName_CL_Cap] są kastą wojowników i jako tacy posiadają wielu zdolnych wojskowych strategów. Przyznanie [Root.GetRajputsName_dat] gwarantowanej pozycji na naszym dworze daje nam łatwy dostęp do ich najbardziej biegłych doradców."
 estate_rajput_royal_court_tasks: "Przyznaj stanowiska dworskie"
 estate_rajput_royal_court_tasks_desc: "Dwór królewski sam w sobie jest złożoną instytucją. Aby zarządzać nim przy mniejszym wysiłku, członkowie [Root.GetRajputsName_gen] są zapraszani do obsadzenia niektórych stanowisk na dworze ich [Root.Monarch.GetRulerGen]."
 estate_rajput_force_conscription: "Pobór [Root.GetRajputsName_gen]"
 estate_rajput_force_conscription_desc: "W razie potrzeby [Root.Monarch.GetTitle] może zaciągnąć wszystkich zdolnych członków [Root.GetRajputsName_gen] do walki w imieniu [Root.GetGovNameGen]. Wiąże się to oczywiście z dodatkowymi przywilejami dla [Root.GetRajputsName_gen]."
 estate_rajput_noble_promotion: "Nominacje szlacheckie dla [Root.GetRajputsName_gen]"
 estate_rajput_noble_promotion_desc: "Niektórzy członkowie [Root.GetRajputsName_gen] są szlachetnej krwi. Jednak w bezpośredniej rywalizacji mają przewagę nad [Root.GetNobilityOrFallbackName_ins]. Promowanie ich pozycji zapewni lojalność [Root.GetRajputsName_gen]."
 estate_burghers_autonomous_trade_companies: "Autonomiczne kompanie handlowe"
 estate_burghers_autonomous_trade_companies_desc: "Kompanie handlowe [Root.GetAdjective] są wysoce autonomicznymi, ale bardzo lojalnymi poddanymi Korony. Przyznając im królewskie czartery i specjalne przywileje, kompanie handlowe są w stanie działać na korzyść [Root.GetGovNameGen]."
 estate_burghers_development_of_cities: "Przywileje rozbudowy miasta"
 estate_burghers_development_of_cities_desc: "Miasta [Root.GetGovNameGen] są klejnotem koronnym [Root.GetAdjective]. [Root.GetBurghersName_CL_Cap] [Root.GetBurghersName_BE] chętn[Root.GetBurghersName_NormEnd] do dalszej rozbudowy miast - jeśli damy [Root.GetBurghersName_Who] na to pozwolenie."
 estate_burghers_development_of_cities_gt: "Każda posiadana prowincja z §Yujściem§! lub §Ycentrum handlowym§! zyskuje premię:"
 estate_burghers_development_of_cities_rt: "Modyfikator '§Yrozbudowa miasta§!' zostaje usunięty ze wszystkich prowincji z §Yujściem§! lub §Ycentrum handlowym§!."
 estate_burghers_development_of_cities_mod: "Rozbudowa miasta"
 desc_estate_burghers_development_of_cities_mod: "Z rozkazu władzy rządzącej mieszczanie tej prowincji mają prawo do rozbudowy miasta do nowych rozmiarów."
 estate_burghers_control_over_the_coinage: "Przyznanie kontroli nad monetą"
 estate_burghers_control_over_the_coinage_desc: "Prawo do bicia monet od dawna znajduje się w rękach [Root.Monarch.GetRulerGen]. W miarę jak państwo się rozrasta, a administracja staje przed coraz większymi wyzwaniami, prawo do bicia monet staje się coraz większym obciążeniem. Pozwalając [Root.GetBurghersName_dat] na bicie monet w naszym imieniu, możemy rozwiązać ten biurokratyczny problem."
 estate_burghers_economical_boost: "Wolność gospodarcza [Root.GetBurghersName_gen]"
 estate_burghers_economical_boost_desc: "Dochody państwa były generowane głównie przez merkantylistyczne podejście do handlu. Pozwalając [Root.GetBurghersName_dat] mieć wolną rękę w sprawach gospodarczych, możemy być w stanie znacznie zwiększyć nasze dochody."
 estate_burghers_force_impressment: "Pobór [Root.GetBurghersName_gen]"
 estate_burghers_force_impressment_desc: "Chociaż nie są szkoleni do walki, w razie potrzeby załogi statków handlowych i ich okrętów mogą zostać siłą wcielone do naszej marynarki wojennej.\nPrawo do takiego poboru wiąże się jednak z wysokimi kosztami na rzecz [Root.GetBurghersName_gen]."
 estate_burghers_naval_school_right: "Szkoła marynarki wojennej dla [Root.GetBurghersName_gen]"
 estate_burghers_naval_school_right_desc: "Tradycyjnie tylko szlachta mogła przejść edukację wojskową. Znosząc te ograniczenia, możemy przyznać to prawo [Root.GetBurghersName_dat]."
 estate_burghers_expanded_monopoly_rights: "Prawo monopolu dla [Root.GetBurghersName_gen]"
 estate_burghers_expanded_monopoly_rights_desc: "Monopole na towary handlowe rzadko są przedmiotem zainteresowania [Root.GovernmentName_gen]. W związku z tym [Root.GetBurghersName_CL] swobodnie wprowadzają własne monopole, gdy tylko zajdzie taka potrzeba."
 estate_burghers_financial_demand: "Środki finansowe [Root.GetBurghersName_gen]"
 estate_burghers_financial_demand_desc: "W razie potrzeby [Root.GovernmentName] może siłą przejąć posiadłości [Root.GetBurghersName_gen]. W zamian [Root.GetBurghersName_CL] ma[Root.GetBurghersName_NounJa] rozszerzone przywileje, które dają [Root.GetBurghersName_who] większą władzę w sprawach państwowych."
 estate_burghers_land_trade_rights: "Posiadłości koronne dla [Root.GetBurghersName_gen]"
 estate_burghers_land_trade_rights_desc: "Wszystko ma swoją cenę, jeśli znajdzie się odpowiedni kupiec. Nasza ziemia nie jest tu wyjątkiem. Pozwalając [Root.GetBurghersName_dat] mieć kontrolę nad częścią naszej królewszczyzny, możemy uzyskać znaczną korzyść dla naszych przychodów."
 estate_vaisyas_land_trade_rights: "Posiadłości koronne dla [Root.GetVaishyasName_gen]"
 estate_vaisyas_land_trade_rights_desc: "Wszystko ma swoją cenę, jeśli znajdzie się odpowiedni kupiec. Nasza ziemia nie jest tu wyjątkiem. Pozwalając [Root.GetVaishyasName_dat] mieć kontrolę nad częścią naszej królewszczyzny, możemy uzyskać znaczną korzyść dla naszych przychodów."
 estate_vaisyas_development_of_cities: "Przywileje rozbudowy miasta"
 estate_vaisyas_development_of_cities_desc: "Miasta [Root.GetGovNameGen] są klejnotem koronnym [Root.GetAdjective]. [Root.GetVaishyasName_CL_Cap] są chętni do dalszej rozbudowy miast - jeśli damy im na to pozwolenie."
 estate_vaisyas_development_of_cities_gt: "Każda posiadana prowincja z §Yujściem§! lub §Ycentrum handlowym§! zyskuje premię:"
 estate_vaisyas_development_of_cities_rt: "Modyfikator '§Yrozbudowa miasta§!' zostaje usunięty ze wszystkich prowincji z §Yujściem§! lub §Ycentrum handlowym§!."
 estate_vaisyas_development_of_cities_mod: "Rozbudowa miasta"
 desc_estate_vaisyas_development_of_cities_mod: "Z rozkazu władzy rządzącej wajśjowie tej prowincji mają prawo do rozbudowy miasta do nowych rozmiarów."
 estate_vaisyas_control_over_the_coinage: "Przyznanie kontroli nad monetą"
 estate_vaisyas_control_over_the_coinage_desc: "Prawo do bicia monet od dawna znajduje się w rękach [Root.Monarch.GetRulerGen]. W miarę jak państwo się rozrasta, a administracja staje przed coraz większymi wyzwaniami, prawo do bicia monet staje się coraz większym obciążeniem. Pozwalając [Root.GetVaishyasName_dat] na bicie monet w naszym imieniu, możemy rozwiązać ten biurokratyczny problem."
 estate_vaisyas_economical_boost: "Wolność gospodarcza [Root.GetVaishyasName_gen]"
 estate_vaisyas_economical_boost_desc: "Dochody państwa były generowane głównie przez merkantylistyczne podejście do handlu. Pozwalając [Root.GetVaishyasName_dat] mieć wolną rękę w sprawach gospodarczych, możemy być w stanie znacznie zwiększyć nasze dochody."
 estate_vaisyas_expanded_guild_rights: "Rozszerzone prawa gildii"
 estate_vaisyas_expanded_guild_rights_desc: "Gildie [Root.GetVaishyasName_gen] są kołem ratunkowym naszej gospodarki. Znaczne rozszerzenie ich praw zapewni ich lojalność i pobłażliwość w odniesieniu do interesów [Root.GetVaishyasName_gen]."
 estate_vaisyas_force_impressment: "Pobór [Root.GetVaishyasName_gen]"
 estate_vaisyas_force_impressment_desc: "Chociaż nie są szkoleni do walki, w razie potrzeby załogi statków handlowych i ich okrętów mogą zostać siłą wcielone do naszej marynarki wojennej.\nPrawo do takiego poboru wiąże się jednak z wysokimi kosztami na rzecz [Root.GetVaishyasName_gen]."
 estate_vaisyas_financial_demand: "Środki finansowe [Root.GetVaishyasName_gen]"
 estate_vaisyas_financial_demand_desc: "W razie potrzeby [Root.GovernmentName] może siłą przejąć posiadłości [Root.GetVaishyasName_gen]. W zamian [Root.GetVaishyasName_CL] ma rozszerzone przywileje, które dają im większą władzę w sprawach państwowych."
 estate_cossacks_freedom_of_the_steppes: "Wolność stepów"
 estate_cossacks_freedom_of_the_steppes_desc: "Przejęcie kontroli nad stepami jest trudnym i obciążającym przedsięwzięciem. Zamiast samodzielnie rządzić stepami, mądrze byłoby pozwolić [Root.GetCossacksName_dat] zaludnić te rozległe obszary, a w zamian zażądać jedynie ich wojskowej służby."
 estate_cossacks_freedom_of_the_steppes_gt: "Każda posiadana §Ystepowa§! prowincja otrzymuje premię:"
 estate_cossacks_freedom_of_the_steppes_rt: "Modyfikator '§Ywolność stepów§!' zostaje usunięty ze wszystkich §Ystepowych§! prowincji."
 estate_cossacks_freedom_of_the_steppes_mod: "Wolność stepów"
 desc_estate_cossacks_freedom_of_the_steppes_mod: "Prowincja ta jest całkowicie samorządna przez kozaków."
 estate_cossacks_grant_military_leadership: "Przywództwo wojskowe [Root.GetCossacksName_gen]"
 estate_cossacks_grant_military_leadership_desc: "[Root.GetCossacksName_CL_Cap] są doskonałymi wojownikami i przywódcami. To naturalne, że powinniśmy dać im szansę sprawdzenia się w roli doradców wojskowych dla naszych armii."
 estate_cossacks_military_service: "Służba wojskowa [Root.GetCossacksName_gen]"
 estate_cossacks_military_service_desc: "Ze względu na bojowy charakter ich kultury, [Root.GetCossacksName_CL] służą armii [Root.GetAdjective] jako oddziały nieregularne, wspierając naszą piechotę i artylerię jako kawaleria."
 estate_cossacks_expand_cossacks_raiders: "Legalizacja najazdów [Root.GetCossacksName_gen]"
 estate_cossacks_expand_cossacks_raiders_desc: "Technicznie rzecz biorąc, [Root.GetCossacksName_CL] są obywatelami [Root.GetAdjective] i dlatego muszą przestrzegać naszych praw. W praktyce nie są oni zbytnio zainteresowani takimi pojęciami jak prawo. [Root.GetCossacksName_CL_Cap] biorą to, czego potrzebują, od tych, którzy niefortunnie z nimi graniczą.\nZrobilibyśmy im wielką przysługę, legalizując ich działania i traktując ich najazdy na obce kraje jako naszą własną odpowiedzialność."
 estate_cossacks_expand_cossacks_raiders_gt: "Wydarzenie '§Ykozacka agresja§!' zapewnia teraz dodatkowe premie dla §Y[Root.GetAdjective]§!."
 estate_cossacks_expand_cossacks_raiders_rt: "Wydarzenie '§Ykozacka agresja§!' nie zapewnia już dodatkowej premii."
 estate_cossacks_expand_cossacks_raiders_at: "Nasi [Root.GetCossacksName_CL] powrócili z łupami, dając efekty:"
 estate_cossacks_exempt_from_bureaucracy: "Zwolnienie z biurokracji"
 estate_cossacks_exempt_from_bureaucracy_desc: "Nikt nie lubi biurokracji - i [Root.GetCossacksName_CL] nie są tu wyjątkiem. Choć utrudnia to kontrolowanie [Root.GetCossacksName_gen], zwolnienie ich z naszej instytucji administracyjnej zagwarantuje przynajmniej ich lojalność."
 estate_nomadic_tribes_autonomy_of_the_tribes: "Autonomia dla [Root.GetTribesName_gen]"
 estate_nomadic_tribes_autonomy_of_the_tribes_desc: "Nasze królestwo jest duże, a infrastruktura jest uboga. Aby utrzymać kontrolę nad stepami, musimy pozwolić [Root.GetTribesName_dat] na autonomię w zarządzaniu ich terytorium w naszym imieniu."
 estate_nomadic_tribes_freedom_of_the_steppes: "Wolność stepów dla [Root.GetTribesName_gen]"
 estate_nomadic_tribes_freedom_of_the_steppes_desc: "Stepy są rozległe. Nietknięte przez osiadłe cywilizacje, są naszym domem. Domem [Root.GetGovNameGen] [Root.GetAdjective]; domem [Root.GetTribesName_gen]. Wszyscy będziemy cieszyć się wolnością stepów."
 estate_nomadic_tribes_freedom_of_the_steppes_gt: "Każda posiadana §Ystepowa§! prowincja otrzymuje premię:"
 estate_nomadic_tribes_freedom_of_the_steppes_rt: "Modyfikator '§Yplemienna wolność stepów§!' zostaje usunięty ze wszystkich §Ystepowych§! prowincji."
 estate_nomadic_tribes_freedom_of_the_steppes_mod: "Plemienna wolność stepów"
 desc_estate_nomadic_tribes_freedom_of_the_steppes_mod: "Prowincja ta jest zarządzana przez plemiona ordy."
 estate_nomadic_tribes_grant_military_leadership: "Wsparcie [Root.GetTribesName_gen] w rządzeniu"
 estate_nomadic_tribes_grant_military_leadership_desc: "Przewodzenie królestwu podzielonemu na tak wiele plemion nie jest zadaniem dla żadnego wielkiego [Root.Monarch.GetRulerGen]. Biorąc pod uwagę wsparcie [Root.GetTribesName_gen] w przywództwie, możemy zapewnić utrzymanie [Root.GetGovNameGen]."
 estate_nomadic_tribes_military_service: "Służba wojskowa [Root.GetTribesName_gen]"
 estate_nomadic_tribes_military_service_desc: "Podczas gdy wszystkie [Root.GetTribesName_CL] wnoszą wkład w wojsko, wciąż zachowują cześć armii dla siebie. Powołanie ich do większej służby wojskowej znacznie wzmocni naszą siłę."
 estate_nomadic_tribes_ensure_tribal_loyalty: "Zapewnienie lojalności [Root.GetTribesName_gen]"
 estate_nomadic_tribes_ensure_tribal_loyalty_desc: "Potęga [Root.Monarch.GetRulerGen] jest niczym bez lojalności poddanych. Lojalność [Root.GetTribesName_gen] musi zostać zapewniona bez względu na koszty."
 estate_nomadic_tribes_ensure_tribal_loyalty_gt: "Zdarzenie '§Yplemienny kryzys sukcesji§!' nie będzie już uruchamiane dla następców, którzy mają co najmniej §Y12§! punktów monarchy."
 estate_nomadic_tribes_ensure_tribal_loyalty_rt: "Zdarzenie '§Yplemienny kryzys sukcesji§!' będzie uruchamiane zawsze niezależnie od ilości punktów monarchy następcy."
 estate_nomadic_tribes_secured_succession: "Zabezpieczona sukcesja"
 estate_nomadic_tribes_secured_succession_desc: "W [Root.GetGovNameGen] sukcesję zapewnia siła. Niestety, siła jest zwodnicza, a młodzi przyszli chanowie zostali zabici w przeszłości, zanim mieli szansę się wykazać.\nChociaż na pewno nie spodoba się to [Root.GetTribesName_dat], sukcesja musi zostać zabezpieczona."
 estate_dhimmi_administrative_privileges: "Samorząd [Root.GetDhimmiName_gen]"
 estate_dhimmi_administrative_privileges_desc: "Prowincje [Root.GetAdjective] są domem dla wielu różnych religii. Pozwalając [Root.GetDhimmiName_CL] zorganizować własny rząd w tych społecznościach, możemy zapewnić stabilność i pokój w tych pogańskich miastach i wioskach."
 estate_dhimmi_development_of_communities: "Rozwój społeczności"
 estate_dhimmi_development_of_communities_desc: "Nasze państwo zawiera wiele pogańskich społeczności zarządzanych przez [Root.GetDhimmiName_gen]. Promowanie rozwoju tych społeczności uprości wysiłki potrzebne do rozbudowy infrastruktury w tych prowincjach."
 estate_dhimmi_development_of_communities_gt: "Każda posiadana prowincja wyznająca §Ypogaństwo§ ze §Yświątynią§! lub §Ykatedrą§! otrzymuje premię:"
 estate_dhimmi_development_of_communities_rt: "Modyfikator '§Yrozwój społecznośc§!' zostaje usunięty ze wszystkich §Ypogańskich§! prowincji."
 estate_dhimmi_development_of_communities_mod: "Rozwój społeczności"
 desc_estate_dhimmi_development_of_communities_mod: "Prowincja ta znajduje się pod opieką zimminich, którzy otrzymuje dodatkowe środki w celu promowania rozwoju lokalnych społeczności."
 estate_dhimmi_grant_trading_privileges: "Przyznanie przywilejów handlowych"
 estate_dhimmi_grant_trading_privileges_desc: "[Root.GetDhimmiName_CL_Cap] są w stanie nawiązać szersze kontakty z innymi narodami. Przyznajemy im przywileje handlowe, aby mogli czerpać z tego dodatkowe korzyści."
 estate_dhimmi_dhimmi_education: "Promuj edukację [Root.GetDhimmiName_dat]"
 estate_dhimmi_dhimmi_education_desc: "[Root.GetDhimmiName_CL_Cap] przynoszą nam wiedzę spoza naszego narodu. Pozwalamy im rozpowszechniać ją wewnątrz, aby wszyscy nasi ludzie mogli z niej skorzystać."
 estate_dhimmi_military_service: "Służba wojskowa [Root.GetDhimmiName_gen]"
 estate_dhimmi_military_service_desc: "Nasza armia zawsze wymaga rozbudowy. Pozwólmy [Root.GetDhimmiName_dat] być jej częścią, a tym samym rozbudujmy ją jeszcze bardziej."
 estate_dhimmi_protected_communities: "Ochrona społeczności [Root.GetDhimmiName_gen]"
 estate_dhimmi_protected_communities_desc: "[Root.GetDhimmiName_CL_Cap] są istotną częścią naszego narodu. Zapewniamy im ochronę w ich społecznościach, aby czuli się mile widziani."
 estate_dhimmi_contribution_demand: "Ustawa o składkach [Root.GetDhimmiName_gen]"
 estate_dhimmi_contribution_demand_desc: "[Root.GetDhimmiName_CL_Cap] są istotną częścią naszego narodu. Prosimy ich o odpowiedni wkład w jego wielkość."
 estate_dhimmi_promote_dhimmi_nobility: "Promowana szlachta spośród [Root.GetDhimmiName_gen]"
 estate_dhimmi_promote_dhimmi_nobility_desc: "Nie wszyscy szlachcice wyznają wiarę [Root.Religion.GetName]. Niektórzy są poganami pod przewodnictwem [Root.GetDhimmiName_gen]. Awansowanie ich do naszej rangi może zdenerwować inne klasy, ale możemy zyskać potężnego sojusznika."
 estate_jains_land_trade_rights: "Posiadłości koronne dla [Root.GetJainsName_gen]"
 estate_jains_land_trade_rights_desc: "Wszystko ma swoją cenę, jeśli znajdzie się odpowiedni kupiec. Nasza ziemia nie jest tu wyjątkiem. Pozwalając [Root.GetJainsName_dat] mieć kontrolę nad częścią naszej królewszczyzny, możemy uzyskać znaczną korzyść dla naszych przychodów."
 estate_jains_development_of_cities: "Przywileje rozbudowy miasta"
 estate_jains_development_of_cities_desc: "Miasta [Root.GetGovNameGen] są klejnotem koronnym [Root.GetAdjective]. [Root.GetJainsName_CL_Cap] są chętni do dalszej rozbudowy miast - jeśli damy im na to pozwolenie."
 estate_jains_development_of_cities_gt: "Każda posiadana prowincja z §Yujściem§! lub §Ycentrum handlowym§! zyskuje premię:"
 estate_jains_development_of_cities_rt: "Modyfikator '§Yrozbudowa miasta§!' zostaje usunięty ze wszystkich prowincji z §Yujściem§! lub §Ycentrum handlowym§!."
 estate_jains_development_of_cities_mod: "Rozbudowa miasta"
 desc_estate_jains_development_of_cities: "Z rozkazu władzy rządzącej dźiniści tej prowincji mają prawo do rozbudowy miasta do nowych rozmiarów."
 estate_jains_right_to_offer_loans: "Przyznanie praw do oferowania pożyczek"
 estate_jains_right_to_offer_loans_desc: "[Root.GetJainsName_CL_Cap] zbudowali sobie reputację lichwiarzy. Przyznając im specjalne prawa w tym zakresie, sprzyjamy ogólnemu przepływowi gospodarki."
 estate_jains_economical_boost: "Wolność gospodarcza [Root.GetJainsName_gen]"
 estate_jains_economical_boost_desc: "Wszystko ma swoją cenę, jeśli znajdzie się odpowiedni kupiec. Nasza ziemia nie jest tu wyjątkiem. Pozwalając [Root.GetJainsName_dat] mieć kontrolę nad częścią naszej królewszczyzny, możemy uzyskać znaczną korzyść dla naszych przychodów."
 estate_jains_incorruptible_offices: "[Root.GetJainsName_gen] w biurokracji"
 estate_jains_incorruptible_offices_desc: "[Root.GetJainsName_CL_Cap] nie są wcale nieistotni w naszym kraju. Przyznanie im stanowisk w naszym rządzie jest korzystne dla ogólnego rozwoju naszego narodu."
 estate_jains_patronize_jain_familiy: "Rozszerzone prawa dżinijskich rodzin"
 estate_jains_patronize_jain_familiy_desc: "Te rodziny są potężne, ale ich wpływ jest ograniczony tylko do [Root.GetJainsName_gen]. Poprzez znaczne rozszerzenie praw [Root.GetJainsName_gen], [Root.GetJainsName_CL] mogą być bardziej pobłażliwi w swoich planach na przyszłość."
 estate_jains_promote_jain_bookkeeping: "Promuj księgowość [Root.GetJainsName_gen]"
 estate_jains_promote_jain_bookkeeping_desc: "Sprawy gospodarki powinny być w rękach [Root.GetJainsName_gen]."
 estate_nobles_mansabdari_cav_maintenance: "Mansabdarowie - oddziały kawalerii"
 estate_nobles_mansabdari_cav_maintenance_desc: "Mansabdarowie muszą dostarczyć państwu własne konie dla kawalerii w zamian za prawo do ziemi lub obietnicę wysokich zarobków."
 estate_nobles_mansabdari_military_service: "Mansabdarowie - służba wojskowa"
 estate_nobles_mansabdari_military_service_desc: "Mansabdarowie są proszeni o pełnienie służby wojskowej dla państwa. Będą dowodzić armiami nasz[Root.GetGovGender_nasz] [Root.GetGovNameGen] i służyć u boku zwykłego żołnierza na froncie."
 estate_nobles_mansabdari_royal_rule: "Mansabdarowie - władza królewska"
 estate_nobles_mansabdari_royal_rule_desc: "Mansabdarowie są podporządkowani władzy królewskiej. Usuwając ich siłą ze stanowisk władzy, [Root.Monarch.GetTitle] może zapewnić sobie władzę nad systemem mansabdari."
 estate_nobles_rynda: "Bojarzy - piechurzy ryndowie"
 estate_nobles_rynda_desc: "Ryndowie, wybierani spośród młodych bojarów, są ochroniarzami [Root.Monarch.GetRulerGen] i pełnią rolę obrońców dworu. Choć tradycyjnie nie biorą udziału w walkach, mogą być wykorzystywani w wojsku jako zbrojni."
 estate_nobles_rynda_at: "Gdy nasz władca jest §Ygenerałem§! zyskujemy do §G+15.0%§! skuteczności bojowej piechoty.\nW przeciwnym razie zyskujemy do §G-20.0%§! kosztu piechoty."
 estate_nobles_landed_army: "Bojarzy - armia lądowa"
 estate_nobles_landed_army_desc: "Armia lądowa to siły kawalerii [Root.GetGovNameGen] [Root.GetAdjective]. Bojarzy zapewniają sobie i swoim zbrojnym sługom wyposażenie na własny koszt."
 estate_nobles_landed_army_tt: "Zyskujemy do  §G+20.0%§! skuteczności bojowej kawalerii."
 estate_nobles_mestnichestvo: "Miestniczestwo"
 estate_nobles_mestnichestvo_desc: "Miestniczestwo to skomplikowany feudalny system hierarchiczny oparty na starszeństwie jednostki w ramach rozszerzonej arystokracji [Root.GetAdjective]. Często prowadzący do przemocy i intryg wśród szlachty, miestniczestwo  eliminuje wszelkie nadzieje na zasługi na wysokich stanowiskach [Root.GetGovNameGen] [Root.GetAdjective]."
 estate_nobles_early_serfdom: "Wczesne poddaństwo"
 estate_nobles_early_serfdom_desc: "Chłopi stali się zależni od [Root.GetNobilityName_gen]. Chociaż system nie został jeszcze zinstytucjonalizowany, jest to pierwszy krok do całkowitego wyeliminowania wolności chłopów."
 estate_nobles_legalized_serfdom: "Zalegalizowane poddaństwo"
 estate_nobles_legalized_serfdom_desc: "Pańszczyzna została prawnie zdefiniowana przez niedawno uchwalone prawo. [Root.GetNobilityName_CL_Cap] ma[Root.GetNobilityName__NounJa] prawo traktować zniewolonych chłopów wedle własnego uznania."
 estate_nobles_total_serfdom: "Całkowite poddaństwo"
 estate_nobles_total_serfdom_desc: "System poddaństwa został zaostrzony do tego stopnia, że w kraju nie pozostał już prawie żaden wolny chłop. Mobilność klasowa jest dla chłopów przeszłością, podczas gdy nasze państwo cieszy się owocami ich pracy."
 estate_nobles_restricted_serfdom: "Ograniczone poddaństwo"
 estate_nobles_restricted_serfdom_desc: "Pańszczyzna została ograniczona jako krok w kierunku zniesienia kajdan nałożonych na chłopów. Choć ku zgorszeniu [Root.GetNobilityName_gen], chłopi mogą teraz zmienić swojego pana."
 estate_nobles_devastating_serfdom: "Niszczycielskie poddaństwo"
 estate_nobles_devastating_serfdom_desc: "Pańszczyzna stała się podstawową częścią naszego społeczeństwa. Do tego stopnia, że nawet idea wolności dla chłopa stała się bluźnierstwem nawet dla najniższych rangą członków [Root.GetNobilityName_gen]."
 estate_nobles_increased_peasant_freedom: "Większa wolność chłopów"
 estate_nobles_increased_peasant_freedom_desc: "Wbrew woli [Root.GetNobilityName_gen], chłopi otrzymali dodatkową swobodę w poruszaniu się. Mogą teraz zmieniać właściciela ziemskiego, kiedy tylko zechcą. Oznacza to, że [Root.GetNobilityName_CL] musi okazywać chłopom więcej litości."
 estate_nobles_peasant_liberation: "Wyzwolenie chłopów"
 estate_nobles_peasant_liberation_desc: "[Root.GetNobilityName_CL_Cap] nie ma[Root.GetNobilityName_NounJa] już prawa do żadnego chłopa pracującego na ich ziemiach. Podczas gdy ta zmiana jest błogosławieństwem dla chłopstwa, [Root.GetNobilityName] żywi[Root.GetNobilityName_NounA] wielką urazę do państwa za wzmocnienie pozycji chłopów."
 estate_burghers_rise_of_the_burghers: "Rozwój mieszczaństwa"
 estate_burghers_rise_of_the_burghers_desc: "Wraz z nowo odkrytą wolnością, chłopi zaangażowali się w handel i rzemiosło. Dzięki temu rozwojowi [Root.GetBurghersName_gen] rośnie w siłę, ponieważ coraz więcej chłopów dołącza do tej klasy ze swoim zarobionym bogactwem."
 estate_burghers_the_new_middle_class: "Nowa klasa średnia"
 estate_burghers_the_new_middle_class_desc: "Większość byłych chłopów weszła do klasy społecznej [Root.GetBurghersName_gen]. Władza i wpływ [Root.GetBurghersName_gen] na dwór są niezaprzeczalne."
 estate_privilege_only_revoked_by_republics: "§RMoże zostać odwołany wyłącznie przez §YRepublikę§!.§!"
 estate_burghers_promote_burgher_bookkeeping: "Promuj księgowość [Root.GetBurghersName_gen]"
 estate_burghers_promote_burgher_bookkeeping_desc: "Sprawy gospodarki powinny być w rękach [Root.GetBurghersName_gen]."
 estate_janissary_sultans_aghas: "Agowie mianowani przez sułtana"
 estate_janissary_sultans_aghas_desc: "Agowie są dowódcami janczarów. Pozwalając [Root.Monarch.GetTitle] mianować agów, możemy zapewnić, że nasze wojska poprowadzą do zwycięstwa kompetentni i przebiegli ludzie."
 estate_janissary_recruited_by_merit: "Rekrutacja według zasług"
 estate_janissary_recruited_by_merit_desc: "Janczarzy są powoływani w ramach systemu dewszirme. To jednak my decydujemy, którzy spośród nowych rekrutów dołączą do ich korpusu. O przydziale do pułków powinny decydować zasługi."
 estate_janissary_professional_soldiers: "Zawodowi żołnierze"
 estate_janissary_professional_soldiers_desc: "Zadaniem janczara jest służba państwu jako elitarny piechur. Każdy janczar powinien być przede wszystkim zawodowym żołnierzem i nie może wykonywać żadnego dodatkowego zawodu."
 estate_janissary_professional_soldiers_mod: "Zawodowi żołnierze janczarscy"
 desc_estate_janissary_professional_soldiers_mod: "Zadaniem janczara jest służba państwu jako elitarny piechur. Każdy janczar powinien być przede wszystkim zawodowym żołnierzem i nie może wykonywać żadnego dodatkowego zawodu."
 estate_janissary_celibacy: "Celibat janczarów"
 estate_janissary_celibacy_desc: "Choć nie jest to formalnie egzekwowane, od każdego janczara oczekuje się, że nie zawrze małżeństwa przed ukończeniem 40 lat, ponieważ jego lojalność należy wyłącznie do [Root.Monarch.GetTitle], a nie do jakiejkolwiek rodziny."
 estate_janissary_minimal_payment: "Ujednolicenie żołdu"
 estate_janissary_minimal_payment_desc: "W przeciwieństwie do wielu innych żołnierzy janczarzy otrzymują należną im część łupów wojennych, a za służbę dostają również regularny żołd."
 estate_janissary_minimal_payment_ct: "Wydarzenie §YJanczarzy domagają się żołdu§! będzie teraz kosztować nas znacznie mniej."
 estate_janissary_minimal_payment_rt: "Wydarzenie §YJanczarzy domagają się żołdu§! nie będzie już zapewniać obniżonego kosztu dla nowego [Root.Monarch.GetTitle]."
 estate_janissary_rough_discipline: "Zapewnienie surowego szkolenia"
 estate_janissary_rough_discipline_desc: "Szkolenie janczarów jest celowo brutalne i wymaga od nich niezwykle wysokiej dyscypliny. Choć zwykłym żołnierzom te metody mogą wydawać się drakońskie, są niezbędne, aby zapewnić gotowość bojową janczarów."
 estate_janissary_rough_discipline_mod: "Drakońskie szkolenie"
 desc_estate_janissary_rough_discipline_mod: "Szkolenie janczarów jest celowo brutalne i wymaga od nich niezwykle wysokiej dyscypliny. Choć zwykłym żołnierzom te metody mogą wydawać się drakońskie, są niezbędne, aby zapewnić gotowość bojową janczarów."
 estate_janissary_loyalty_to_the_sultan: "Lojalność wobec [Root.GovernmentName_gen]"
 estate_janissary_loyalty_to_the_sultan_desc: "Janczarzy przysięgają lojalność [Root.Monarch.GetTitle] i tylko [Root.Monarch.GetHerHim]."
 estate_janissary_strict_devshirme_recruitment: "Rygorystyczny system dewszirme"
 estate_janissary_strict_devshirme_recruitment_desc: "Wszyscy młodzi rekruci korpusu janczarów pochodzą z systemu poboru dzieci, znanego jako dewszirme. Zniewalane, nawracane na islam i wcielane do armii są wyłącznie dzieci wyznawców obcych religii."
 estate_janissary_strict_devshirme_recruitment_mod: "System dewszirme"
 desc_estate_janissary_strict_devshirme_recruitment_mod: "Ta prowincja przekazuje swojego młodego mieszkańca wyznającego obcą religię jako rekruta do armii."
 estate_janissary_strict_devshirme_recruitment_gt: "Każda prowincja wyznająca §Yobcą religię§! otrzymuje następujący efekt:"
 estate_janissary_strict_devshirme_recruitment_rt: "Każda prowincja wyznająca §Yobcą religię§! traci premię."
 estate_janissary_self_appointed_aghas: "Agowie wybierani samodzielnie"
 estate_janissary_self_appointed_aghas_desc: "Dowódcy janczarów nie są już mianowani przez [Root.Monarch.GetTitle]. Zamiast tego janczarzy sami wybierają swoich agów, kierując się własnym rozumieniem zasług."
 estate_janissary_hereditary_ranks: "Nadanie dziedzicznych rang"
 estate_janissary_hereditary_ranks_desc: "Ranga janczara nie jest już określana na podstawie zasług. Stała się stanowiskiem dziedzicznym, dzięki czemu potomkowie janczarów mogą dołączać do korpusu bez konieczności przechodzenia zwyczajowego szkolenia."
 estate_janissary_allow_other_professions: "Zezwolenie na dodatkowe zawody"
 estate_janissary_allow_other_professions_desc: "Janczarzy mieli pierwotnie być wyłącznie żołnierzami. Jednak w czasie pokoju nie zawsze znajdowali zastosowanie.
Dlatego wszyscy janczarzy mogą wykonywać dodatkowy zawód."
 estate_janissary_allow_other_professions_ct: "Zadania wojskowe stanu §Yjanczarów§! zostają zastąpione zadaniami §Ygospodarczymi§!."
 estate_janissary_allow_marriages: "Przyznanie prawa do małżeństwa"
 estate_janissary_allow_marriages_desc: "Janczarzy mogą zawierać małżeństwa i zakładać własne rodziny, kiedy tylko zechcą. Ich dotychczasowa wyłączna lojalność wobec [Root.Monarch.GetTitle] zostaje podzielona z lojalnością wobec współmałżonków."
 estate_janissary_toprak_payment: "Wprowadzenie wynagrodzenia toprak"
 estate_janissary_toprak_payment_desc: "Dotychczasowy żołd nie wystarcza już na zaspokojenie żądań janczarów. Wynagrodzenie za ich służbę obejmuje teraz również część ziem, o które walczą."
 tur_toprak_janissary_wages_tt: "Koszty żołdu janczarów z wydarzenia §YJanczarzy domagają się żołdu§! obejmują teraz §Yziemię koronną§! i zależą od umiejętności §Ydyplomatycznych§! władcy."
 estate_janissary_janissary_officers: "Oficerowie janczarscy"
 estate_janissary_janissary_officers_desc: "Szkolenie janczarów nie jest już sprawą rządu. Zamiast tego janczarzy szkolą się samodzielnie, choć widać wyraźnie, że dyscyplina nie jest już głównym celem tych ćwiczeń."
 estate_janissary_janissary_officers_mod: "Oficerowie janczarscy"
 desc_estate_janissary_janissary_officers_mod: "Szkolenie janczarów nie jest już sprawą rządu. Zamiast tego janczarzy szkolą się samodzielnie, choć widać wyraźnie, że dyscyplina nie jest już głównym celem tych ćwiczeń."
 estate_janissary_guarantee_privileges: "Zagwarantowanie przywilejów"
 estate_janissary_guarantee_privileges_desc: "Choć formalnie janczarzy są lojalni wobec państwa [Root.GovernmentName], ich wierność można zapewnić wyłącznie poprzez zagwarantowanie im przywilejów."
 estate_janissary_janissaries_from_muslims: "Złagodzenie systemu dewszirme"
 estate_janissary_janissaries_from_muslims_desc: "Korzyści płynące ze służby wśród janczarów są ogromne. Nic dziwnego, że muzułmańskie rodziny z państwa [Root.GovernmentName] próbują umieszczać w ich korpusie własne dzieci. Choć pozyskiwanie nowych janczarów nie stanowi już takiego problemu, dyscyplina żołnierzy pozostawia wiele do życzenia."
 estate_janissary_janissaries_from_muslims_mod: "Ignorowany system dewszirme"
 desc_estate_janissary_janissaries_from_muslims_mod: "Korzyści płynące ze służby wśród janczarów są ogromne. Nic dziwnego, że muzułmańskie rodziny z państwa [Root.GovernmentName] próbują umieszczać w ich korpusie własne dzieci. Choć pozyskiwanie nowych janczarów nie stanowi już takiego problemu, dyscyplina żołnierzy pozostawia wiele do życzenia."
 estate_janissary_coup_detat: "Zamach stanu"
 estate_janissary_coup_detat_desc: "Władza nie należy już do [Root.Monarch.GetTitle], lecz jest nieustannie kwestionowana przez siły janczarskie i lojalistów państwa [Root.GetUsableName]."
 estate_janissary_military_reactionaries: "Wojskowi reakcjoniści"
 estate_janissary_military_reactionaries_desc: "Janczarzy czują, że ich styl życia i doktryny wojskowe są zagrożone. Zuchwałość janczarów osłabia dyscyplinę całej naszej armii."
 estate_janissary_puppet_sultan: "Marionetkowy [Root.Monarch.GetTitle]"
 estate_janissary_puppet_sultan_desc: "[Root.Monarch.GetTitle] nie jest już panem samego siebie. Janczarzy mogą narzucać swoją wolę bez żadnego oporu."
 estate_janissary_ottoman_vanguards: "Osmańska awangarda"
 estate_janissary_ottoman_vanguards_desc: "Nasze oddziały janczarskie staną się awangardą naszych sił. Siejąc strach wśród przeciwników na polu bitwy, janczarzy poprowadzą nas ku chwalebnej przyszłości."
 estate_janissary_ottoman_vanguards_mod: "Osmańska awangarda"
 desc_estate_janissary_ottoman_vanguards_mod: "Nasze oddziały janczarskie staną się awangardą naszych sił. Siejąc strach wśród przeciwników na polu bitwy, janczarzy poprowadzą nas ku chwalebnej przyszłości."
 estate_janissaries_hire_advisor: "Zatrudnij doradcę wojskowego"
 estate_janissaries_hire_advisor_desc: "Janczarzy oczekują, że [Root.Monarch.GetTitle] zatrudni nowego doradcę wojskowego."
 estate_janissaries_fire_advisor: "Zwolnij naszego doradcę wojskowego"
 estate_janissaries_fire_advisor_desc: "[Root.Mil_Advisor.GetTitle] [Root.Mil_Advisor.GetName] obraził janczarów. Domagają się, abyśmy go zwolnili!"
 estate_janissaries_three_privileges: "Rozszerz przywileje janczarów"
 estate_janissaries_three_privileges_desc: "Jako elitarna formacja państwa [Root.GetName] janczarzy czują się pokrzywdzeni w wielu aspektach życia. Domagają się potwierdzenia swojego statusu poprzez przyznanie im kolejnych przywilejów."
 estate_janissaries_reduce_war_exhaustion: "Odpocznij po trudach wojny"
 estate_janissaries_reduce_war_exhaustion_desc: "Janczarzy ciężko i długo walczyli podczas naszych ostatnich kampanii. Wielu ich żołnierzy poległo w bitwach. Proszą nas, abyśmy pozwolili państwu odzyskać siły przed rozpoczęciem kolejnych podbojów."
 estate_janissaries_increase_monthly_military_power: "Skup się na naszych zdolnościach wojskowych"
 estate_janissaries_increase_monthly_military_power_desc: "Wojsko jest siłą napędową naszego państwa. Nic dziwnego, że janczarzy chcą, abyśmy koncentrowali się na potrzebach armii."
 estate_janissaries_retake_core: "Odzyskaj [agenda_province.GetName]"
 estate_janissaries_retake_core_desc: "Janczarzy ubolewają nad tym, że [agenda_province.GetName], integralna część naszego państwa, nie znajduje się pod naszą kontrolą. Domagają się odzyskania ziemi, która słusznie nam się należy!"
 estate_janissaries_support_independence: "Poprzyj niepodległość państwa [agenda_country.GetAdjective]"
 estate_janissaries_support_independence_desc: "Janczarzy zwracają uwagę na trudne położenie państwa [agenda_country.GetUsableName], okrutnie podporządkowanego naszym rywalom z państwa [agenda_rival_country.GetUsableName]. Wzywają nas, abyśmy stanęli po stronie sprawiedliwości i poparli niepodległość państwa [agenda_country.GetAdjective]."
 estate_janissaries_gain_corruption: "Przyznaj janczarom swobody"
 estate_janissaries_gain_corruption_desc: "Janczarzy są świadomi swojej pozycji w państwie [Root.GovernmentName] i domagają się większej swobody w sprawach państwowych."
 estate_janissaries_stop_converting_province_x: "Chroń prawa mniejszości w prowincji [agenda_province.GetName]"
 estate_janissaries_stop_converting_province_x_desc: "Janczarzy są oburzeni naszym lekceważeniem praw mniejszości religijnych. Domagają się natychmiastowego odwołania misjonarza z prowincji [agenda_province.GetName]!"
 estate_janissaries_build_an_army: "Zbuduj armię dla naszego narodu"
 estate_janissaries_build_an_army_desc: "Janczarzy uważają, że nasza armia przynosi narodowi wstyd. Pilnie domagają się jej rozbudowy, aby nasze siły zbrojne mogły skutecznie odstraszać wrogów łakomych na nasze ziemie."
 estate_janissaries_recruit_janissaries: "Zrekrutuj pułki janczarów"
 estate_janissaries_recruit_janissaries_desc: "Sami janczarzy chcą udowodnić swoją wartość na polu bitwy. Oczywiście pragną więc służyć w naszych armiach."
 estate_janissaries_humiliate_rival: "Upokórz państwo [agenda_country.GetName]"
 estate_janissaries_humiliate_rival_desc: "Państwo [agenda_country.GetAdjective] [agenda_country.GetGovernmentName] od lat jest cierniem w naszym boku. Janczarzy doskonale o tym wiedzą i domagają się podjęcia działań przeciwko naszemu wieloletniemu rywalowi."
 estate_janissaries_build_army_building_in_y: "Rozbuduj infrastrukturę wojskową w prowincji [agenda_province.GetName]"
 estate_janissaries_build_army_building_in_y_desc: "Janczarzy z prowincji [agenda_province.GetName] wzywają nas do zbudowania nowych ośrodków szkolenia i rekrutacji wojska, aby zapewnić stały dopływ wysokiej jakości rekrutów do armii."
 estate_janissaries_build_soldier_household: "Zbuduj gospodarstwo żołnierskie w prowincji [agenda_province.GetName]"
 estate_janissaries_build_soldier_household_desc: "Janczarzy potrzebują gospodarstwa żołnierskiego w prowincji [agenda_province.GetName], aby szybciej i skuteczniej rekrutować swoich żołnierzy."
 estate_janissaries_crush_revolts: "Zmiażdż buntowników"
 estate_janissaries_crush_revolts_desc: "Janczarzy domagają się wykorzystania ich siły do stłumienia buntów ogarniających nasz kraj."
 estate_janissaries_expand_into_x: "Rozszerz granice na obszar [agenda_province.GetAreaName]"
 estate_janissaries_expand_into_x_desc: "Janczarzy pragną powiększenia dostępnych im sił. Z zazdrością spoglądają na obszar [agenda_province.GetAreaName], który ich zdaniem byłby cennym nabytkiem dla naszego państwa. Wzywają do przeprowadzenia kampanii wojskowej, aby zdobyć jego część."
 estate_janissaries_condottieri_rivals: "Wyślij kondotierów przeciwko państwu [agenda_country.GetUsableName]"
 estate_janissaries_condottieri_rivals_desc: "Nasi rywale z państwa [agenda_country.GetUsableName] próbują rozszerzyć swoje wpływy podczas wojny z państwem [agenda_enemy_country.GetUsableName]. Janczarzy wzywają nas, abyśmy wysłali wojska na pomoc państwu [agenda_enemy_country.GetAdjective] i nie pozwolili rywalom uzyskać nad nami przewagi."
 estate_janissaries_bigger_army_than_rival: "Zabezpiecz się przed państwem [agenda_country.GetUsableName]"
 estate_janissaries_bigger_army_than_rival_desc: "Janczarzy obawiają się, że nasza armia nie poradziłaby sobie w wojnie z państwem [agenda_country.GetAdjective]. Nalegają, abyśmy zwiększyli rekrutację i zapewnili naszym siłom zbrojnym przewagę nad rywalami."
 estate_janissaries_build_up_manpower_reserves: "Zwiększ nasze rezerwy zasobów ludzkich"
 estate_janissaries_build_up_manpower_reserves_desc: "Kurczące się rezerwy zasobów ludzkich niepokoją janczarów. Ostrzegają, że państwo [Root.GetUsableName] pozostanie bezbronne, jeśli wrogowie wykorzystają tę sytuację. Zalecają czasowe wstrzymanie działań i odbudowanie rezerw."
 estate_janissaries_develop_heathen_x: "Zwiększ zasoby ludzkie w prowincji [agenda_province.GetName]"
 estate_janissaries_develop_heathen_x_desc: "Janczarzy proszą nas o inwestycje w rozwój prowincji [agenda_province.GetName]."
 estate_janissaries_build_trade_building_in_y: "Rozbuduj infrastrukturę handlową w prowincji [agenda_province.GetName]"
 estate_janissaries_build_trade_building_in_y_desc: "Janczarzy, niegdyś stan wojowników, a obecnie stan kupiecki, twierdzą, że rynek w prowincji [agenda_province.GetName] jest zbyt mały, by zaspokoić ich potrzeby. Proszą o inwestycję w większy targ, który ich zdaniem znacznie zwiększy dobrobyt prowincji i całego kraju."
 estate_janissaries_increase_trade_power_in_X: "Zwiększ siłę handlu w węźle [agenda_trade_node.GetTradeNodeName]"
 estate_janissaries_increase_trade_power_in_X_desc: "Janczarzy, niegdyś wojownicy, a obecnie kupcy, wzywają nas do zwiększenia obecności handlowej w węźle [agenda_trade_node.GetTradeNodeName], co ich zdaniem znacznie zwiększy dobrobyt narodu."
 estate_janissaries_restore_currency: "Przywróć stabilność waluty"
 estate_janissaries_restore_currency_desc: "Janczarzy, niegdyś żołnierze, a obecnie kupcy, niepokoją się inflacją w państwie [Root.GetUsableName]. Domagają się jej ograniczenia, zanim wymknie się spod kontroli!"
 estate_janissaries_get_cash: "Zgromadź środki w skarbcu"
 estate_janissaries_get_cash_desc: "Opłakany stan naszego skarbca jest powodem wielkiego zaniepokojenia kupieckich janczarów. Zachęcają nas do ograniczenia wydatków, aby uzupełnić rezerwy."
 estate_janissaries_build_university_in_y: "Zbuduj uniwersytet w prowincji [agenda_province.GetName]"
 estate_janissaries_build_university_in_y_desc: "Janczarzy proszą nas o sfinansowanie budowy nowego uniwersytetu w prowincji [agenda_province.GetName], aby przyszli rekruci mogli korzystać z najlepszego wykształcenia, jakie może zaoferować państwo [Root.GetUsableName]."
 estate_janissaries_build_manufactory_in_y: "Zbuduj manufakturę w prowincji [agenda_province.GetName]"
 estate_janissaries_build_manufactory_in_y_desc: "Janczarzy proszą nas o sfinansowanie budowy nowej manufaktury typu [agenda_province.GetManufactory] w prowincji [agenda_province.GetName]. Twierdzą, że będzie to bardzo opłacalna inwestycja, która podwoi produkcję dobra handlowego [agenda_province.GetTradeGoodsName] w tej prowincji."
 estate_janissaries_build_production_building_in_y: "Zwiększ wydajność produkcji w prowincji [agenda_province.GetName]"
 estate_janissaries_build_production_building_in_y_desc: "Przedsiębiorczy janczarzy proszą nas o inwestycje w infrastrukturę produkcyjną prowincji [agenda_province.GetName]. Twierdzą, że rozbudowa zakładów znacznie zwiększy dobrobyt prowincji i całego kraju."
 estate_janissaries_gain_mercantilism: "Zwiększ nasz merkantylizm"
 estate_janissaries_gain_mercantilism_desc: "Kupieccy janczarzy chcą umocnić swoją kontrolę nad naszą gospodarką. Opowiadają się za bardziej merkantylistycznym modelem handlu."
 new_recruitment_center: "Nowy ośrodek rekrutacyjny"
 desc_new_recruitment_center: "Inwestycje państwowe pozwoliły rozbudować infrastrukturę lokalnej rekrutacji."
 janissary_rebels_title: "Bunt janczarów"
 janissary_rebels_name: "Janczarzy państwa $COUNTRY$"
 janissary_rebels_desc: "Janczarzy, których zdemoralizowała obecna sytuacja, domagają się utworzenia własnego państwa. Będą walczyć z niespotykaną dyscypliną i zaciekłością, wykorzystując w boju również artylerię."
 janissary_rebels_army: "Armia zbuntowanych janczarów"
 janissary_rebels_demands: "Zwiększenie wpływów janczarów"
 janissary_rebels_demands_desc: "Zbuntowani janczarzy chcą bronić swoich przywilejów i domagają się zwiększenia wpływów."
 renegade_sultan_son_rebels_title: "Bunt renegata-pretendenta"
 renegade_sultan_son_rebels_name: "Buntownicy-renegaci państwa $COUNTRY$"
 renegade_sultan_son_rebels_desc: "Buntownicy ci są lojalnymi stronnikami zbuntowanego krewnego sułtana, który zamierza przejąć tron ejaletu i wzniecić powstanie przeciwko imperium."
 renegade_sultan_son_rebels_army: "Armia renegata-pretendenta"
 renegade_sultan_son_rebels_demands: "Przejęcie tronu ejaletu"
 renegade_sultan_son_rebels_demands_desc: "Buntownicy popierający pretendenta domagają się, aby zbuntowany krewny sułtana przejął tron ejaletu i dążył do uzyskania niepodległości od imperium."
 independence_rebels_title: "Buntownicy niepodległościowi"
 independence_rebels_name: "Buntownicy niepodległościowi państwa $COUNTRY$"
 independence_rebels_desc: "Buntownicy dążą do uzyskania niepodległości politycznej swojego kraju."
 independence_rebels_army: "Armia niepodległościowa"
 independence_rebels_demands: "Przyznanie niepodległości"
 independence_rebels_demands_desc: "Buntownicy dążą do uzyskania niepodległości politycznej swojego kraju."
 eunuch_rebels_title: "Bunt eunuchów"
 eunuch_rebels_name: "Eunuchowie państwa $COUNTRY$"
 eunuch_rebels_desc: "Buntownicy spośród eunuchów chcą bronić swojej władzy i przywilejów na dworze oraz zwiększyć swoje wpływy."
 eunuch_rebels_army: "Armia zbuntowanych eunuchów"
 eunuch_rebels_demands: "Zwiększenie wpływów eunuchów"
 eunuch_rebels_demands_desc: "Buntownicy domagają się znacznego zwiększenia swoich wpływów na rządy państwa."
 local_janissaries_displeased: "Niezadowolenie miejscowych janczarów"
 local_eunuchs_displeased: "Niezadowolenie miejscowych eunuchów"
 parliamentarians_rebels_title: "Bunt parlamentarzystów"
 parliamentarians_rebels_name: "Parlamentarzyści państwa $COUNTRY$"
 parliamentarians_rebels_desc: "Buntownicy ci są lojalnymi stronnikami §Y$PRETENDER_GENERAL$§W, który sprzeciwia się monarchii i chce ustanowić republikę, na której czele stanie §Y$PRETENDER_MONARCH$§W, a państwem będzie $COUNTRY$."
 parliamentarians_rebels_army: "Armia zbuntowanych parlamentarzystów"
 parliamentarians_rebels_demands: "Ustanowienie republiki parlamentarnej"
 parliamentarians_rebels_demands_desc: "Zbuntowani parlamentarzyści domagają się ustanowienia republiki, na której czele stanie $PRETENDER_MONARCH$, a państwem będzie $COUNTRY$."
 building_manufactory: "Manufaktura"
 ottoman_great_navy: "Wielka flota turecka"
 ottoman_great_navy_desc: "Siła naszej floty tkwi w jej liczebności. Na każdy okręt wystawiony przez wroga na morzu turecka flota wyśle trzy własne."
 maghrebi_corsairs: "Korsarze maghrebscy"
 maghrebi_corsairs_desc: "Żeglarze z Maghrebu od pokoleń trudnią się piractwem i korsarstwem na Morzu Śródziemnym. Łupią i plądrują wybrzeża niewiernych, którzy nie spodziewają się naszych okrętów, dzięki czemu korsarze maghrebscy stanowią dla naszego państwa znaczne źródło dochodów."
 ottoman_power_struggle_events.1.t: "Walka o władzę w Imperium Osmańskim"
 ottoman_power_struggle_events.1.desc: "Imperium Osmańskie, niegdyś potężny uczestnik rywalizacji wielkich mocarstw, budzący strach w sercach wrogów, od lat pogrąża się w dekadencji i stagnacji. Dawniej rządził nim absolutny [Root.Monarch.GetTitle], dziś zaś o władzę rywalizuje wiele wpływowych grup osmańskiego rządu. Najbardziej wyróżniają się janczarzy, którzy twierdzą, że [Root.Monarch.GetName] hańbi ród Osmanów i zamierza zniszczyć siłę militarną imperium, oraz harem próbujący przejąć kontrolę nad dworem poprzez osadzenie na tronie marionetkowego sułtana.
Podczas gdy w wielkim pałacu rodu Osmanów panuje chaos, ejalety i autonomiczni paszowie wykorzystują okazję, by rozszerzyć własne wpływy i dążyć do uniezależnienia się od Imperium Osmańskiego."
 ottoman_power_struggle_events.1.a: "Nadchodzą mroczne czasy..."
 ottoman_power_struggle_events.1.a.at: "Odblokowuje katastrofy: §YZamach stanu janczarów§!, §YIntrygi haremu§!, §YBunt ejaletów§!, §YDekadencja paszów§! i §YRewolucja§!."
 ottoman_power_struggle_events.1.a.tt: "Odblokowuje katastrofy: §YZamach stanu janczarów§!, §YIntrygi haremu§!, §YBunt ejaletów§! i §YDekadencja paszów§!."
 ottoman_power_struggle_events.1.a.bt: "§YKażda z tych katastrof może wystąpić jednocześnie z pozostałymi.§!"
 ottoman_power_struggle_events.1.a.ct: "§YDo zakończenia katastrof wymagane jest ukończenie nowych misji.§!"
 ottoman_power_struggle_events.2.t: "Nowa era dla państwa [Root.GetUsableName]"
 ottoman_power_struggle_events.2.desc: "Wieloletnia walka o władzę między rodem Osmanów a licznymi instytucjami państwa dobiegła końca! [Root.Monarch.GetTitle] [Root.Monarch.GetName] przeprowadził nas przez najciemniejszy okres w historii i wprowadził szeroko zakrojone reformy, które ocaliły państwo [Root.GovernmentName] przed stagnacją i upadkiem. Wiele przestarzałych instytucji zmodernizowano, janczarzy zostali podporządkowani i nie stanowią już zagrożenia dla rządu. Ejalety i paszowie przysięgli wierność swojemu suwerenowi, a poddani naszego państwa cieszą się okresem nowo odkrytego dobrobytu.
Od dziś państwo [Root.GetUsableName] będzie znane jako kraj, który przetrwał próbę czasu i wkroczył w nowy złoty wiek!"
 ottoman_power_struggle_events.2.desc.a: "Rząd osmański nie przypomina już dawnego ustroju. Ponieważ muzułmańskie tradycje i prawa przestały być częścią naszego państwa, harem został naturalnie rozwiązany. Paszowie utracili swoje rangi, a ejalety przekształcono w zwykłe prowincje imperium. Nawet janczarzy zostali zneutralizowani dzięki serii zabójstw i szantaży.
Choć nie było to tak okazałe, jak wielu mogło oczekiwać, [Root.Monarch.GetTitle] [Root.Monarch.GetName] zdołał zakończyć wewnętrzną walkę o władzę w państwie [Root.GetUsableName]."
 ottoman_power_struggle_events.2.desc.rev: "Imperium Osmańskie przeszło okres stagnacji i wewnętrznych niepokojów. Janczarzy podważali autorytet sułtana, a ejalety i paszowie zdobywali coraz większą autonomię. W końcu sama ludność imperium zmęczyła się upadkiem ojczyzny i powstała przeciwko nieudolnemu reżimowi oraz zagrożeniom ze strony wyższych warstw społecznych.
Z popiołów Imperium Osmańskiego powstało wielkie państwo [Root.GovernmentName] – [Root.GetName]!"
 ottoman_power_struggle_events.2.a: "To początek nowego złotego wieku dla państwa [Root.GetUsableName]!"
 ottoman_power_struggle_events.2.b: "Przynajmniej nie nazywają nas już Chorym Człowiekiem Europy."
 ottoman_power_struggle_events.2.c: "Precz z sułtanatem! Niech żyje państwo [Root.GovernmentName]!"
 ottoman_power_struggle_events.3.t: "Kwestionowana legitymizacja [Root.Monarch.GetName]"
 ottoman_power_struggle_events.3.desc: "Odkąd [Root.Monarch.GetName] objął władzę, jego wrogowie pragną usunąć go z tronu. Ostatnio uwagę opinii publicznej przyciągnęła nowa plotka na temat [Root.Monarch.GetTitle], podważająca pobożność, prawowitość i oddanie [Root.Monarch.GetName] państwu [Root.GovernmentName]."
 ottoman_power_struggle_events.3.a: "To tylko plotki. Nic więcej."
 ottoman_power_struggle_events.4.t: "Utrata prestiżu państwa [Root.GetUsableName]"
 ottoman_power_struggle_events.4.desc: "Nie ulega wątpliwości, że nasze państwo [Root.GovernmentName] zmaga się z wewnętrznymi konfliktami. Niestety dostrzegły to państwa z naszej strefy wpływów i zaczęły postrzegać nas jako słabych. Nazywają nas „Chorym Człowiekiem [Root.Capital.GetContinentName]”."
 ottoman_power_struggle_events.4.a: "To oburzające oskarżenia!"
 ottoman_power_struggle_events.5.t: "Stagnacja administracji"
 ottoman_power_struggle_events.5.desc: "Administracja rządowa znajduje się w niepokojącym stanie. Zadania, które niegdyś zajmowały kilka dni, przeciągają się teraz na całe tygodnie, a nawet miesiące. Problem jest szczególnie widoczny w naszym skarbcu, ponieważ nawet najprostsze prace księgowe i biurokratyczne kosztują więcej, niż są warte."
 ottoman_power_struggle_events.5.a: "Trzeba je jednak wykonać. Przeznacz na to pieniądze."
 ottoman_power_struggle_events.5.b: "Księgowość może poczekać. Nie warto z jej powodu doprowadzać do bankructwa."
 ottoman_power_struggle_events.6.t: "Bunty bejlików"
 ottoman_power_struggle_events.6.desc: "Okres stagnacji państwa [Root.GetUsableName] ośmielił naszych gubernatorów bardziej, niż powinien. Bejlikowie, rzekomo lojalni książęta imperium zarządzający prowincjami, otwarcie buntują się przeciwko swojemu [Root.Monarch.GetTitle], domagając się większej autonomii!"
 ottoman_power_struggle_events.6.a: "Pożałują tego."
 ottoman_power_struggle_events.7.t: "Korupcja na dworze"
 ottoman_power_struggle_events.7.desc: "W miarę jak walka o zmianę status quo państwa staje się coraz bardziej widoczna, urzędnicy i członkowie dworu dostrzegają okazję do wzbogacenia się. Korupcja w pałacu królewskim, a także we wszystkich niższych urzędach państwowych, stała się normą."
 ottoman_power_struggle_events.7.a: "Pijawki! Wszyscy co do jednego!"
 ottoman_power_struggle_events.8.t: "Nieefektywna biurokracja"
 ottoman_power_struggle_events.8.desc: "Wiele systemów rządowych ustanowiono we wczesnych latach istnienia imperium. Opierają się zatem na starych tradycjach, a nie na efektywności. Jest to szczególnie widoczne obecnie, ponieważ gubernatorzy i urzędnicy poświęcają swoim obowiązkom znacznie mniej uwagi, niż powinni."
 ottoman_power_struggle_events.8.a: "To niefortunne."
 janissary_coup_events.1.t: "Zamach stanu janczarów"
 janissary_coup_events.1.desc: "Lata stagnacji i dekadencji odcisnęły piętno na rządzie – nawet najprostsze zadania napotykają silny opór. Najpotężniejszą siłą reakcyjną są janczarzy. Niegdyś osobista gwardia [Root.Monarch.GetTitle], postrzegają każdą próbę modernizacji jako zagrożenie dla własnych przywilejów.\n[Root.Monarch.GetTitle] [Root.Monarch.GetName] postanowił dziś to zmienić i spróbował ograniczyć władzę janczarów. Wkrótce potem w [Root.Capital.GetCapitalName] wybuchło wielkie zamieszanie. Janczarzy, od dawna niezadowoleni z tego, co uważają za nieudolne rządy [Root.Monarch.GetTitle], odrzucili podany im chleb i przewrócili kotły na głównym placu. Twierdzą, że [Root.Monarch.GetName] jest hańbą dla rodu Osmanów, uczynił szejka ul-Islama swoim osobistym marionetkowym doradcą i zamierza zniszczyć siłę militarną imperium.\nJanczarzy szybko przejęli kontrolę nad rządem i zdobyli poparcie wielu innych grup politycznych stolicy. [Root.Monarch.GetName] wciąż żyje, lecz nie sprawuje już kontroli nad własnym imperium."
 janissary_coup_events.1.desc.nosheikh: "Lata stagnacji i dekadencji odcisnęły piętno na rządzie – nawet najprostsze zadania napotykają silny opór. Najpotężniejszą siłą reakcyjną są janczarzy. Niegdyś osobista gwardia [Root.Monarch.GetTitle], postrzegają każdą próbę modernizacji jako zagrożenie dla własnych przywilejów.\n[Root.Monarch.GetTitle] [Root.Monarch.GetName] postanowił dziś to zmienić i spróbował ograniczyć władzę janczarów. Wkrótce potem w [Root.Capital.GetCapitalName] wybuchło wielkie zamieszanie. Janczarzy, od dawna niezadowoleni z tego, co uważają za nieudolne rządy [Root.Monarch.GetTitle], odrzucili podany im chleb i przewrócili kotły na głównym placu. Twierdzą, że [Root.Monarch.GetName] jest hańbą dla rodu Osmanów i zamierza zniszczyć siłę militarną imperium.\nJanczarzy szybko przejęli kontrolę nad rządem i zdobyli poparcie wielu innych grup politycznych stolicy. [Root.Monarch.GetName] wciąż żyje, lecz nie sprawuje już kontroli nad własnym imperium."
 janissary_coup_events.1.a: "To bardzo niepokojące."
 janissary_coup_events.1.a.tt: "Wszystkie przyznane, pozytywne przywileje stanu §Yjanczarów§! zostają zamienione na ich §Rnegatywne odpowiedniki§!.
Ogólne wydarzenia janczarskie i pozytywne przywileje dla §Yjanczarów§! zostają wyłączone do końca katastrofy."
 janissary_coup_events.2.t: "Koniec zamachu stanu"
 janissary_coup_events.2.desc.a: "Groby w prowincji [janissary_province.GetName] ciągną się aż po horyzont. To niezbyt przyjemny widok, lecz rezultat brutalnej konieczności. [Root.Monarch.GetName] rozmyśla nad tym, gdy strażnicy ciągną kolejny wóz pełen ciał na niekończący się cmentarz. Niezliczeni janczarzy i lojaliści zginęli podczas zamachu stanu. Choć [Root.Monarch.GetTitle] ostatecznie zwyciężył, liczba istnień poświęconych dla stabilności i bezpieczeństwa państwa [Root.GovernmentName] przygnębia [Root.Monarch.GetName].\n\nRód Osmanów ponownie zatriumfował nad kolejnym wrogiem imperium. Janczarzy są teraz jedynie cieniem dawnej potęgi. Wielu ich członków spoczywa w grobach prowincji [janissary_province.GetName], a ci, którzy pozostali lojalni wobec [Root.Monarch.GetName], zostali wcieleni do regularnej armii państwa [Root.GetUsableName]."
 janissary_coup_events.2.desc.b: "Wbrew wszelkim przeciwnościom [Root.Monarch.GetName] wykorzystał swój dyplomatyczny talent, aby wynegocjować porozumienie z janczarami. Byli porywacze zakładników opuszczają pałac królewski w pokoju, bez rozlewu krwi i ran. Choć nie udało się uniknąć przemocy, przywileje janczarów zostały odebrane na rzecz pozostałych stanów państwa [Root.GetUsableName]. Ci, którzy chcą nadal służyć jako dobrze opłacani żołnierze, pozostają w korpusie, natomiast janczarscy uczeni, właściciele ziemscy i kupcy zostali awansowani odpowiednio do [Root.GetClergyName], [Root.GetNobilityName] i [Root.GetBurghersName]. Negocjacje i debaty trwały kilka lat, lecz przyniosły pokój i stabilność państwu [Root.GovernmentName] – choć kosztem absolutnej władzy [Root.Monarch.GetTitle]."
 janissary_coup_events.2.a: "Tyle śmierci... ale przynajmniej państwo [Root.GovernmentName] przetrwa."
 janissary_coup_events.2.b: "Wreszcie. Janczarzy znów stanowią awangardę naszego państwa."
 janissary_coup_events.3.t: "Bunty na Bałkanach"
 janissary_coup_events.3.desc: "Wydaje się, że buntowniczy janczarzy gromadzą się masowo na naszych bałkańskich ziemiach. Niczym głodne wilki chwytają za broń przeciwko sułtanowi, próbując podstępnie uzurpować sobie koronę, którą otrzymał od samego Boga!"
 janissary_coup_events.3.a: "Przynieście mi bicz!"
 janissary_coup_events.4.t: "Bunty na ziemiach anatolijskich"
 janissary_coup_events.4.desc: "Wydaje się, że buntowniczy janczarzy gromadzą się masowo na naszych anatolijskich ziemiach. Niczym głodne wilki chwytają za broń przeciwko sułtanowi, próbując podstępnie uzurpować sobie koronę, którą otrzymał od samego Boga!"
 janissary_coup_events.4.a: "Na Allaha, posmakują mojego buta!"
 janissary_coup_events.5.t: "Bunty na Bałkanach i w Anatolii"
 janissary_coup_events.5.desc: "Buntowniczym janczarom udało się skoordynować działania i zastosować nową, śmiałą strategię: jednocześnie gromadzą siły na naszych ziemiach bałkańskich i anatolijskich. Nie chodzi już tylko o głód – te wilki chcą zniszczyć samo imperium i obalić sułtana, który traktował ich jak własnych synów!"
 janissary_coup_events.5.a: "Niech Allah okaże im miłosierdzie, bo ja go nie okażę."
 janissary_coup_events.12.t: "Negocjacje z janczarami"
 janissary_coup_events.12.desc: "Choć nie było to łatwe, [Root.Monarch.GetName] i jego wielki wezyr zdołali znaleźć posłuch wśród janczarów. Niektóre orty są gotowe zrzec się części przywilejów zdobytych na przestrzeni wieków w zamian za korzystniejszą pozycję w innych stanach społecznych państwa [Root.GetUsableName]. Te pułki mogą jednak wypowiadać się wyłącznie we własnym imieniu, dlatego odebranie któregokolwiek przywileju nadal wywoła bunt, choć na mniejszą skalę niż krwawa alternatywa. Pozostaje zdecydować, który przywilej należy odebrać..."
 janissary_coup_events.12.a: "Od tej pory agów będzie mianował sułtan."
 janissary_coup_events.12.b: "Ranga janczara nie będzie już dziedziczna."
 janissary_coup_events.12.c: "Janczar ma być zawsze i wyłącznie żołnierzem."
 janissary_coup_events.12.d: "Janczarzy będą mogli zawierać małżeństwa dopiero po ukończeniu czterdziestu lat."
 janissary_coup_events.12.e: "Żołd będzie ponownie niższy, lecz regularny."
 janissary_coup_events.12.f: "Od tej pory oficerowie janczarscy będą pilnować dyscypliny."
 janissary_coup_events.12.g: "Przywileje janczarów nie będą już traktowane jako oczywistość."
 janissary_coup_events.12.h: "Przywróć system dewszirme."
 janissary_coup_events.12.i: "Przerwij ten zamach stanu."
 janissary_coup_events.12.j: "Zmodernizuj janczarów."
 janissary_coup_events.12.k: "Ogranicz wpływ janczarów na tron."
 janissary_coup_events.12.zzz: "Nie można już nic zrobić."
 janissary_coup_events.13.t: "Dezercje janczarów"
 janissary_coup_events.13.desc: "Mój [Root.Monarch.GetTitle]! Wygląda na to, że wielu żołnierzy naszej wielkiej armii postanowiło zdezerterować i przemierza nasze ziemie, próbując uciec przed nadchodzącym chaosem lub przyłączyć się do buntowników! Musimy oddzielić ziarno od plew, lecz wygląda na to, że w rezultacie nasza armia jest zupełnie nieprzygotowana na nadchodzące kłopoty. Czarny dzień w naszych kronikach!"
 janissary_coup_events.13.a: "Bah, stworzymy nową armię! Z działami i karabinami!"
 janissary_coup_events.13.b: "Musimy zabezpieczyć lojalność pozostałej części armii."
 eyalet_rebellion_events.1.t: "Bunt ejaletów"
 eyalet_rebellion_events.1.desc: "Dziś rano do [Root.Monarch.GetName] dotarły niepokojące wieści z prowincji pogranicznych. Ejalety, stanowiące trzon administracji państwa [Root.GetUsableName], otwarcie sprzeciwiły się swojemu [Root.Monarch.GetTitle]. „Sułtan, który nie potrafi nawet kontrolować własnego pałacu w [Root.Capital.GetName], nie ma władzy nad żadnym ejaletem” – oświadczył bejlerbej, ogłaszając faktyczną suwerenność od państwa [Root.GetName]. Ejalety nie zamierzają odpowiadać przed nikim poza sobą."
 eyalet_rebellion_events.1.a: "Nie zapomnimy tej zdrady."
 eyalet_rebellion_events.1.a.tt: "Każdy §Yejalet§! i §Yrdzenny ejalet§! otrzymuje §R+20,0%§! pragnienia wolności."
 eyalet_rebellion_events.2.t: "Koniec buntu ejaletów"
 eyalet_rebellion_events.2.desc: "Ejalety zostały ponownie podporządkowane, a prowincje pograniczne imperium znów są bezpieczne. Wszyscy zdradzieccy bejlerbejowie zostali straceni lub wygnani, a mieszkańcy terytoriów ejaletów wracają do normalnego życia w państwie [Root.GetUsableName]."
 eyalet_rebellion_events.2.a: "Wspaniale."
 eyalet_rebellion_events.3.t: "Państwo [angry_eyalet.GetName] nieposłuszne!"
 eyalet_rebellion_events.3.desc: "Lata samorządności sprawiły, że [angry_eyalet.Monarch.GetTitle] państwa [angry_eyalet.GetName] uwierzył, iż jest własnym sułtanem. On i jego [angry_eyalet.GetAdjective] poddani okazują wielkie nieposłuszeństwo wobec [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 eyalet_rebellion_events.3.a: "Zapłaci za to głową."
 eyalet_rebellion_events.4.t: "Uchylanie się od podatków przez państwo [angry_eyalet.GetName]"
 eyalet_rebellion_events.4.desc: "Ejalet jest jednostką administracyjną naszego imperium i w założeniu nie powinien różnić się znacząco od ziem koronnych i prowincji znajdujących się pod bezpośrednim panowaniem sułtana. W praktyce, ze względu na ogromne rozmiary imperium, wygląda to inaczej i ejalet musi być zarządzany przez namiestnika sułtana.
Niestety [angry_eyalet.Monarch.GetTitle] państwa [angry_eyalet.GetName] nie widzi powodu, by płacić zwyczajową daninę należną ejaletom. Jeśli pozwolimy mu na takie nieposłuszeństwo, inne podległe terytoria mogą wpaść na podobny pomysł..."
 eyalet_rebellion_events.4.a: "Możemy pogodzić się z niższymi podatkami z ejaletów."
 eyalet_rebellion_events.4.b: "Nie możemy okazywać słabości własnym poddanym. Ściągnijcie ten podatek!"
 eyalet_rebellion_events.5.t: "Bunt krewnego!"
 eyalet_rebellion_events.5.desc.son: "Z państwa [angry_eyalet.GetName] dotarły do [Root.Monarch.GetName] ponure wieści. Własny syn władcy, najwyraźniej zmęczony czekaniem, wykorzystał okazję, aby zgromadzić armię w państwie [angry_eyalet.GetName] i zbuntować się przeciwko własnemu [Root.Monarch.GetMotherFather]! Nie zamierza już dłużej czekać na sukcesję."
 eyalet_rebellion_events.5.desc.brother: "Z państwa [angry_eyalet.GetName] dotarły do [Root.Monarch.GetName] ponure wieści. Brat władcy, który przeżył osmańską walkę o sukcesję, wykorzystał okazję, aby zgromadzić armię w państwie [angry_eyalet.GetName] i zbuntować się przeciwko własnemu [Root.Monarch.GetSisterBrother]! Uważa decyzję ojca o wyznaczeniu [Root.Monarch.GetName] na następcę tronu za niesprawiedliwą i próbuje przejąć tron państwa [angry_eyalet.GetName]."
 eyalet_rebellion_events.5.a: "To zdrada nie tylko wobec mnie, lecz także wobec całego rodu Osmanów!"
 eyalet_rebellion_events.6.t: "Powstanie egipskie"
 eyalet_rebellion_events.6.desc: "Od upadku sułtanatu mameluków i ustanowienia państwa [angry_eyalet.GetName] sytuacja w Egipcie jest niepewna dla państwa [Root.GetUsableName]. Wiele systemów rządowych dawnego sułtanatu mameluków przejęto i nadal wykorzystywano, co przez lata prowadziło do rywalizacji między [angry_eyalet.Monarch.GetTitle] państwa [angry_eyalet.GetName] a naszym [Root.Monarch.GetTitle].
Teraz dawne napięcia ponownie narastają, ponieważ [angry_eyalet.Monarch.GetName] domaga się większej autonomii dla siebie i swojego ejaletu."
 eyalet_rebellion_events.6.a: "Przyznaj państwu [angry_eyalet.GetName] tę autonomię."
 eyalet_rebellion_events.6.b: "Więcej autonomii? Nie ma mowy!"
 eyalet_rebellion_events.tt: "Jeśli buntownicy przeforsują swoje żądania, §Yrebelianci niepodległościowi§! wypowiedzą wojnę o niepodległość w imieniu państwa §Y[angry_eyalet.GetName]§!."
 eyalet_rebellion_events.6.c: "Posłuchaj, [angry_eyalet.Monarch.GetName], nie musi do tego dojść..."
 eyalet_rebellion_events.7.t: "Żądanie większej autonomii przez Egipt"
 eyalet_rebellion_events.7.desc: "Ejalet Egiptu przedstawił [Root.Monarch.GetTitle] ultimatum: domaga się większej swobody, w przeciwnym razie wypowie nam wojnę o niepodległość!"
 eyalet_rebellion_events.7.a: "Walczcie i gińcie za swoją niepodległość!"
 eyalet_rebellion_events.7.b: "Państwo [angry_eyalet.GetName] przysparza wyłącznie problemów. Przyznajmy mu niepodległość."
 eyalet_rebellion_events.7.c: "Dobrze. Przyznamy wam te swobody."
 eyalet_rebellion_events.8.t: "Powstanie perskie"
 eyalet_rebellion_events.8.desc: "Region Persji od czasu naszego podboju pozostaje cierniem w boku [Root.Monarch.GetTitle]. Choć niegdyś potężni Timurydzi i Safawidzi już nie istnieją, różnice religijne i kulturowe między poddanymi państwa [angry_eyalet.GetName] a mieszkańcami państwa [Root.GetUsableName] doprowadziły do licznych konfliktów.
Nikogo nie dziwi, że [angry_eyalet.Monarch.GetTitle] [angry_eyalet.Monarch.GetName] postanowił działać i zbuntuje się przeciwko nam, jeśli nie przyznamy państwu [angry_eyalet.GetName] większej autonomii."
 eyalet_rebellion_events.9.t: "Żądanie większej autonomii przez Persję"
 eyalet_rebellion_events.9.desc: "Ejalet Persji przedstawił [Root.Monarch.GetTitle] ultimatum: domaga się większej swobody, w przeciwnym razie wypowie nam wojnę o niepodległość!"
 eyalet_rebellion_events.10.t: "Powstanie w Europie"
 eyalet_rebellion_events.10.desc: "Terytoriami europejskimi położonymi poza Bałkanami zarządzają nasze najbardziej zaufane ejalety. Ich lojalność nie okazała się jednak tak pewna, jak oczekiwaliśmy. Państwo [angry_eyalet.GetName] otwarcie się przeciwko nam buntuje i domaga się większej autonomii."
 eyalet_rebellion_events.11.t: "Żądanie większej autonomii przez państwo europejskie"
 eyalet_rebellion_events.11.desc: "Państwo [angry_eyalet.GetName] przedstawiło [Root.Monarch.GetTitle] ultimatum: domaga się większej swobody, w przeciwnym razie wypowie nam wojnę o niepodległość!"
 eyalet_rebellion_events.12.t: "Powstanie separatystów w prowincji [tur_revolter_province.GetName]"
 eyalet_rebellion_events.12.desc: "Perscy poddani z prowincji [tur_revolter_province.GetName] są niezadowoleni z naszych rządów w Persji. Tęsknią za czasami potęgi Timurydów i gardzą rodem Osmanów z powodu różnic religijnych i kulturowych między kulturą [tur_revolter_province.Culture.GetName] a kulturą [Root.Culture.GetName]."
 eyalet_rebellion_events.12.a: "Zmiażdż to powstanie."
 eyalet_rebellion_events.13.t: "Powstanie separatystów w prowincji [tur_revolter_province.GetName]"
 eyalet_rebellion_events.13.desc: "Egipscy poddani z prowincji [tur_revolter_province.GetName] są niezadowoleni z naszych rządów w Egipcie. Tęsknią za czasami sułtanatu mameluków i pragną utworzyć egipskie państwo narodowe."
 eyalet_rebellion_events.14.t: "Powstanie separatystów w prowincji [tur_revolter_province.GetName]"
 eyalet_rebellion_events.14.desc: "Europejscy poddani z prowincji [tur_revolter_province.GetName] są niezadowoleni z naszych rządów na terytoriach europejskich. Chcą ponownie znaleźć się pod panowaniem chrześcijańskiego państwa kierującego się chrześcijańskimi wartościami.
Jesteśmy zdumieni ich ignorancją."
 pasha_decadence_events.1.t: "Dekadencja paszów"
 pasha_decadence_events.1.desc: "Pogłoski o braku autorytetu i legitymizacji [Root.Monarch.GetName] dotarły do nadmiernie ambitnych paszów. Widząc, że rząd państwa [Root.GetName] zmaga się z wewnętrznymi problemami, rządzący paszowie ogłosili częściową niezależność od [Root.Monarch.GetTitle]."
 pasha_decadence_events.1.a: "Nadchodzą mroczne czasy."
 pasha_decadence_events.2.t: "Koniec dekadencji paszów"
 pasha_decadence_events.2.desc: "Paszowie zostali ponownie podporządkowani. Ich zuchwałość w odrzucaniu rozkazów z [Root.Capital.GetName] jest teraz traktowana jak zbrodnia główna i karana śmiercią. Wielu niegdyś zdegenerowanych paszów ustąpiło ze stanowisk, zostało wygnanych lub zginęło z rąk szturmowych oddziałów sułtana. Wreszcie paszowie znów służą państwu."
 pasha_decadence_events.2.a: "Wreszcie trochę spokoju."
 pasha_decadence_events.3.t: "Pasza z obszaru [tur_pasha_province.GetAreaName] domaga się przywilejów"
 pasha_decadence_events.3.desc: "Dziś na dwór dotarł list od paszy z obszaru [tur_pasha_province.GetAreaName]. Wygląda na to, że lokalny gubernator nabrał odwagi i domaga się przywilejów od [Root.Monarch.GetTitle]. Grozi buntem, jeśli nie spełnimy jego żądań."
 pasha_decadence_events.3.a: "Bunt? Odeślijcie list i każcie mu się wycofać."
 pasha_decadence_events.3.a.tt: "Zażądamy, aby pasza wycofał swoje żądania.
Szanse powodzenia zależą od umiejętności £dip£ i cech osobowości władcy §Y[Root.Monarch.GetName]§!."
 pasha_decadence_events.3.b: "Spełnij jego żądanie."
 pasha_decadence_events.4.t: "Pasza z obszaru [tur_pasha_province.GetAreaName] ustępuje"
 pasha_decadence_events.4.desc: "Na dwór przybył ambasador z obszaru [tur_pasha_province.GetAreaName]. Wygląda na to, że list [Root.Monarch.GetName] przyniósł skutek: pasza prosi o wybaczenie i wycofuje swoje żądania."
 pasha_decadence_events.4.a: "W ostateczności zawsze ustępują."
 pasha_decadence_events.5.t: "Pasza z obszaru [tur_pasha_province.GetAreaName] wszczyna bunt"
 pasha_decadence_events.5.desc: "Na dwór przybył ambasador z obszaru [tur_pasha_province.GetAreaName]. Wygląda na to, że list [Root.Monarch.GetName] nie przyniósł skutku, ponieważ ambasador informuje nas, że pasza wszczyna bunt."
 pasha_decadence_events.5.a: "Nie spodziewałem się tego."
 pasha_decadence_events.6.t: "Bunt bejlików w prowincji [tur_revolter_province.GetName]"
 pasha_decadence_events.6.desc: "Bejlik w prowincji [tur_revolter_province.GetName] wyraził wielkie niezadowolenie z rządów. Mieszkańcy prowincji [tur_revolter_province.GetName] chwycili za broń i grożą gwałtownym powstaniem, jeśli nie przyznamy im autonomii."
 pasha_decadence_events.6.a: "Zmiażdż to powstanie."
 pasha_decadence_events.6.b: "Przyznaj im tę autonomię."
 pasha_decadence_events.7.t: "Greckie powstanie w prowincji [tur_revolter_province.GetName]"
 pasha_decadence_events.7.desc: "Choć Grecja od stuleci jest częścią naszego imperium, jej mieszkańcy zachowali poczucie odrębnej greckiej tożsamości. Ponieważ nasze państwo zmaga się z wewnętrznymi problemami, Grecy z prowincji [tur_revolter_province.GetName] dostrzegli okazję do buntu. Domagają się niepodległości lub przynajmniej znacznej autonomii."
 pasha_decadence_events.7.a: "Natychmiast zakończ to powstanie."
 pasha_decadence_events.7.b: "Przyznaj im poszukiwaną autonomię."
 pasha_decadence_events.8.t: "Serbskie powstanie w prowincji [tur_revolter_province.GetName]"
 pasha_decadence_events.8.desc: "Terytoria Serbii od stuleci należą do naszego państwa [Root.GovernmentName]. Serbska tożsamość nigdy jednak nie uległa naszej obecności. Nawet dziś dumni Serbowie domagają się od nas dodatkowej autonomii i grożą buntami, jeśli nie spełnimy ich żądań."
 pasha_decadence_events.9.t: "Bułgarskie powstanie w prowincji [tur_revolter_province.GetName]"
 pasha_decadence_events.9.desc: "Drugie Cesarstwo Bułgarskie upadło pod naporem wojsk osmańskich w 1396 roku. Od tamtej pory jego terytorium stanowi integralną część naszego imperium. Mieszkańcy tych ziem nadal pragną jednak większej autonomii od rządów państwa [Root.GetAdjective] i grożą buntami, jeśli nie ustąpimy."
 pasha_decadence_events.10.t: "Powstanie kultury [tur_revolter_province.Culture.GetName] w prowincji [tur_revolter_province.GetName]"
 pasha_decadence_events.10.desc: "Choć mieszkańcy prowincji [tur_revolter_province.GetName] wyznają islam, ziemie te nigdy nie należały do kultury [Root.Culture.GetName]. Przystosowały się do nowych warunków pod naszym panowaniem, lecz ich ludność nadal identyfikuje się z kulturą [tur_revolter_province.Culture.GetName]. Gdy dotarły do niej wieści o buntach paszów, uznała, że może domagać się większej autonomii."
 plot_of_the_harem_events.1.t: "Intrygi haremu"
 plot_of_the_harem_events.1.desc: "Od narodzin naszego państwa harem cesarski był jedną z najważniejszych instytucji rządowych. Zapewniając sukcesję sułtanatu, a zarazem stanowiąc symbol bogactwa i potęgi sułtana, harem przez stulecia nieustannie zwiększał swoje wpływy.\n\nSułtanka-walide i inne ważne osobistości haremu nie potrafią już ukrywać niezadowolenia z obecnego stanu rzeczy. Twierdzą, że [Root.Monarch.GetName] nie nadaje się do sprawowania rządów i są zmuszone działać w interesie imperium. [Root.Monarch.GetTitle] [Root.Monarch.GetName] jest jedynie marionetką haremu."
 plot_of_the_harem_events.1.a: "Jestem zakładnikiem własnego haremu. Co za upokorzenie..."
 plot_of_the_harem_events.1.a.tt: "Wydarzenia związane z §Yharemem§! zostają wyłączone na czas trwania tej katastrofy."
 plot_of_the_harem_events.2.t: "Koniec intryg haremu"
 plot_of_the_harem_events.2.desc: "Wpływy haremu dobiegły końca. Dzięki serii reform, przysług i wewnętrznych intryg udało się ponownie podporządkować harem. Eunuchowie, konkubiny, a nawet sama sułtanka-walide zostali odsunięci od spraw rządowych, a zasada rządzenia z siodła ponownie weszła w życie. Żaden nowy sułtan nie stanie się już niewolnikiem własnego haremu."
 plot_of_the_harem_events.2.a: "Wreszcie koniec."
 plot_of_the_harem_events.3.t: "Pretendent powstaje w prowincji [tur_pretender_province.GetName]"
 plot_of_the_harem_events.3.desc.son: "[Root.tur_pretender.GetName], syn [Root.Monarch.GetName], zbuntował się wraz ze swoją matką. Uważa, że jego ojciec jest zbyt słaby, i pragnie odebrać mu tron. Zgromadził armię w prowincji [tur_pretender_province.GetName] i pod przewodnictwem ukochanej matki otwarcie występuje przeciwko własnej krwi."
 plot_of_the_harem_events.3.desc.brother: "[Root.tur_pretender.GetName], brat [Root.Monarch.GetName], zbuntował się wraz ze swoją matką. Uważa, że jego przyrodni brat jest zbyt słaby, i pragnie odebrać mu tron. Zgromadził armię w prowincji [tur_pretender_province.GetName] i pod przewodnictwem ukochanej matki otwarcie występuje przeciwko własnemu rodzeństwu."
 plot_of_the_harem_events.3.a: "[Root.tur_pretender.GetName] zapłaci za to życiem."
 plot_of_the_harem_events.4.t: "Zamach na życie [Root.Heir.GetName]"
 plot_of_the_harem_events.4.desc: "Młody [Root.Heir.GetName] jest wyznaczonym następcą tronu państwa [Root.GetUsableName] i ulubionym dzieckiem [Root.Monarch.GetName]. Nie wszyscy w haremie zgadzają się jednak z decyzją [Root.Monarch.GetTitle] i czują się zmuszeni wziąć sprawy we własne ręce.
Gdziekolwiek pojawia się [Root.Heir.GetName], podążają za nim szepty przyrodnich braci i ich stronników. Krążą pogłoski, że tej nocy zamierzają uderzyć..."
 plot_of_the_harem_events.4.a: "Niech Allah chroni mojego ukochanego [Root.Heir.GetDaughterSon]..."
 plot_of_the_harem_events.5.t: "Korupcja na dworze"
 plot_of_the_harem_events.5.desc: "Harem wykorzystuje swoje wpływy, przez co lojalność naszych doradców przestaje być pewna. Eunuchowie haremu stosują wymuszenia, łapówki i inne niegodziwe metody, aby odciągnąć doradców od [Root.Monarch.GetTitle]."
 plot_of_the_harem_events.5.a: "Fuj... gdyby naprawdę byli lojalni, pozostaliby u mojego boku."
 plot_of_the_harem_events.5.b: "Musimy zapłacić im więcej, aby przekonać ich do pozostania."
 plot_of_the_harem_events.6.t: "Testowanie granic władzy królewskiej"
 plot_of_the_harem_events.6.desc: "Wygląda na to, że „sułtanat kobiet” zaczyna obracać się przeciwko nam. Sułtanka-walide testuje granice władzy królewskiej, którą sułtan hojnie jej przyznał. Te nierozsądne kobiety z sułtanatu ingerują również w sprawy państwowe, na co nie możemy pozwolić. Sułtan nadal jednak darzy matkę względami, twierdząc, że jako matka władcy ma ona prawo doradzać mu w kwestiach ustawodawstwa i administracji. Co powinniśmy zrobić z władzą kobiet?"
 plot_of_the_harem_events.6.a: "To w pełni jej prawo!"
 plot_of_the_harem_events.6.a.tt: "Umocnienie władzy sułtanki-walide doprowadzi do pojawienia się rywalek wewnątrz haremu."
 plot_of_the_harem_events.6.b: "Trzeba ograniczyć jej nadużycia."
 plot_of_the_harem_events.6.b.tt: "Sprzeciwienie się sułtance-walide doprowadzi do kolejnych buntów w przyszłości."
 plot_of_the_harem_events.7.t: "Reakcja haremu"
 plot_of_the_harem_events.7.desc.a: "Odkąd sułtanka-walide przejęła kontrolę zarówno nad haremem, jak i rządem, imperium zmaga się z kolejnymi kryzysami. W końcu Haseki Sultan, ulubiona konkubina [Root.Monarch.GetName], postanowiła wziąć sprawy w swoje ręce. Dzięki intrygom dworskim pozbawiła sułtankę-walide wszelkich wpływów na [Root.Monarch.GetTitle] i zdołała przejąć kontrolę nad haremem cesarskim."
 plot_of_the_harem_events.7.desc.b: "Zuchwałe działania [Root.Monarch.GetName] przeciwko haremowi nie zostały zapomniane. Zbuntowani eunuchowie zdołali zgromadzić siły i zaatakować pałac w [Root.Capital.GetName], aby zdetronizować [Root.Monarch.GetName]."
 plot_of_the_harem_events.7.a: "Wreszcie trochę spokoju w haremie."
 plot_of_the_harem_events.7.b: "Zdrajcy!"
 tur_shattered_the_janissaries: "Rozbicie janczarów"
 desc_tur_shattered_the_janissaries: "Janczarzy są jedynie cieniem dawnej potęgi. Pomyślny Incydent doprowadził do śmierci, wygnania i banicji wielu członków korpusu. W rezultacie stan janczarów nie ma już dawnego wpływu na rząd."
 tur_reformation_of_the_ottoman_estates: "Reforma stanów osmańskich"
 desc_tur_reformation_of_the_ottoman_estates: "[Root.Monarch.GetTitle] zreformował pozycję społeczną i warunki życia stanów. Janczarzy nie są już najbardziej prestiżową klasą społeczną, a ich członkowie mogą porzucić dotychczasowy status i awansować do szlachty, duchowieństwa lub mieszczaństwa. Ci, którzy pozostaną w korpusie, będą służyć państwu [Root.GovernmentName] wyłącznie jako żołnierze."
 tur_inefficient_tax_collection: "Zuchwałość ejaletów"
 desc_tur_inefficient_tax_collection: "Nasza decyzja o przymknięciu oka na uchylanie się od podatków zachęciła inne podległe państwa do podobnych działań. Nasze dochody i limit sił zbrojnych pochodzących od poddanych gwałtownie spadną."
 tur_loyal_pashas: "Lojalni paszowie"
 desc_tur_loyal_pashas: "Paszowie zostali ponownie podporządkowani. Wielu nadmiernie ambitnych paszów wygnano lub stracono, a ich miejsce zajęli ludzie naprawdę lojalni wobec sułtana."
 tur_pasha_backed_down: "Pasza ustąpił"
 desc_tur_pasha_backed_down: "Lokalny pasza wycofał swoje żądania i próbuje teraz zyskać przychylność sułtana, wykonując swoje obowiązki z nowo odkrytym oddaniem."
 tur_pasha_revolt: "Bunt paszy"
 desc_tur_pasha_revolt: "Lokalny pasza wzniecił bunt w tej prowincji. Skutki jego nielojalności będą odczuwalne przez wiele lat."
 tur_reign_of_the_valide_sultan_modifier: "Rządy sułtanki-walide"
 desc_tur_reign_of_the_valide_sultan_modifier: "Sułtanka-walide, matka naszego [Root.Monarch.GetTitle], rządzi krajem z cienia haremu. Decyzje polityczne i państwowe podejmowane przez [Root.Monarch.GetName] pozostają pod silnym wpływem opinii jego matki."
 tur_opposed_valide_sultan_modifier: "Sprzeciw wobec sułtanki-walide"
 desc_tur_opposed_valide_sultan_modifier: "Sułtanka-walide, matka naszego [Root.Monarch.GetTitle], została odsunięta. Nie mogąc już manipulować swoim dzieckiem, harem utracił znaczną część wpływów."
 tur_harem_under_haseki_sultans_control: "Harem pod kontrolą Haseki Sultan"
 desc_tur_harem_under_haseki_sultans_control: "Haseki Sultan jest ulubioną żoną sułtana i ma własne wpływy na władcę. Ponieważ sułtanka-walide okazała się bardziej szkodliwa dla imperium, a zwłaszcza dla haremu, Haseki Sultan przejęła nad nim kontrolę i zapewniła jego lojalność wobec [Root.Monarch.GetName]."
 janissaries_estate_events.1.t: "Wzrost znaczenia janczarów"
 janissaries_estate_events.1.desc: "Janczarzy są elitarnymi oddziałami [Root.Monarch.GetTitle] i pełnią funkcję jego osobistej gwardii. W okresach słabej władzy [Root.Monarch.GetTitle] lub nasilonych żądań janczarów wpływy tego stanu w państwie [Root.GetUsableName] znacznie rosną. Niedawno potrzebowaliśmy ich pomocy w sprawach wewnętrznych, co jeszcze bardziej uświadomiło im ich znaczenie dla państwa [Root.GetAdjective]."
 janissaries_estate_events.1.a: "Dobrze."
 janissaries_estate_events.2.t: "Upadek znaczenia janczarów"
 janissaries_estate_events.2.desc: "Choć janczarzy są zdyscyplinowaną siłą wojskową, nie są odporni na wewnętrzne konflikty. Seria wydarzeń doprowadziła do rywalizacji między poszczególnymi ortami pułków janczarskich, co osłabiło spójność całej formacji. Nie mogą już w pełni poświęcać uwagi sprawom politycznym i wojskowym, a ich wpływy ustępują autorytetowi [Root.Monarch.GetTitle]."
 janissaries_estate_events.3.t: "Czas pokoju"
 janissaries_estate_events.3.desc: "Janczarzy są zdyscyplinowaną i waleczną formacją, szkoloną do walki. Żadne państwo [Root.GovernmentName] nie może jednak pozostawać w stanie wojny bez przerwy. W czasie pokoju janczarzy służą państwu jako policja rządowa, straż pożarna i ochrona pałacu. Ponieważ państwo [Root.GetUsableName] przeżywa obecnie okres pokoju, janczarzy czekają na przydzielenie nowych obowiązków do czasu wybuchu kolejnej wojny."
 janissaries_estate_events.3.a: "Musimy zapewnić bezpieczeństwo państwa."
 janissaries_estate_events.3.b: "Żaden budynek w kraju nie może spłonąć."
 janissaries_estate_events.3.c: "Pałac potrzebuje dodatkowych strażników."
 janissaries_estate_events.4.t: "Własność ziemska janczarów"
 janissaries_estate_events.4.desc: "Janczarzy różnią się od innych formacji wojskowych, ponieważ otrzymują regularny żołd. Choć zazwyczaj wypłacany jest w dukatach, [Root.Monarch.GetTitle] niekiedy przekazuje janczarom własne terytoria jako formę zapłaty. Kilka ort zainteresowało się przejęciem ziemi w prowincji [janissary_province.GetName]. Zwrócili się do swojego [Root.Monarch.GetTitle], domagając się wpływów w tej prowincji jako wynagrodzenia."
 janissaries_estate_events.4.a: "Przyznaj im te ziemie."
 janissaries_estate_events.4.b: "Odmów im takiej zapłaty."
 janissaries_estate_events.5.t: "Rywalizacja ze stanem [Root.GetNobilityOrFallbackName]"
 janissaries_estate_events.5.desc: "Choć nasza armia w dużej mierze podlega janczarom, stan [Root.GetNobilityOrFallbackName] nadal ma znaczny wpływ na większość zwykłych oddziałów. Naturalnie prowadzi to do konfliktów między tymi dwiema grupami. Kwestie takie jak dowództwo nad ortami, obowiązek ochrony [Root.Monarch.GetTitle] i inne szczególne przywileje regularnie stają się przyczyną sporów. W takich sytuacjach [Root.Monarch.GetTitle] musi mediować między stanem [Root.GetNobilityOrFallbackName] a janczarami i rozstrzygać kolejne punkty sporne."
 janissaries_estate_events.5.a: "Opowiedz się po stronie janczarów."
 janissaries_estate_events.5.b: "Opowiedz się po stronie stanu [Root.GetNobilityOrFallbackName]."
 janissaries_estate_events.5.c: "Nie opowiadaj się po żadnej ze stron."
 janissaries_estate_events.5.d: "Wypracuj kompromis z obiema stronami."
 janissaries_estate_events.6.t: "Mehterân"
 janissaries_estate_events.6.desc: "Mehterân to wojskowa orkiestra marszowa janczarów, znana daleko poza granicami państwa [Root.GetUsableName]. Gdziekolwiek maszerują janczarzy, mehterân podąża za nimi, zagrzewając żołnierzy do walki. Janczarzy domagają się przeznaczenia środków państwowych na finansowanie orkiestry."
 janissaries_estate_events.6.a: "Dobrze wydane pieniądze."
 janissaries_estate_events.6.b: "Nie mamy dukatów na muzykę."
 janissaries_estate_events.7.t: "Lojalność wobec [Root.Monarch.GetTitle]"
 janissaries_estate_events.7.desc: "[Root.Monarch.GetTitle] nic nie znaczy bez lojalnych poddanych. Jest to szczególnie prawdziwe, gdy poddanymi są elitarni strażnicy samego [Root.Monarch.GetTitle]. W ostatnich latach janczarzy wykazywali niezwykłe zadowolenie z rządów [Root.Monarch.GetName] w państwie [Root.GovernmentName]. Żołd jest wypłacany terminowo i w odpowiedniej wysokości, a żołnierze są traktowani wyjątkowo dobrze. Lojalność janczarów została zapewniona."
 janissaries_estate_events.7.a: "Doskonale."
 janissaries_estate_events.8.t: "Janczarzy buntują się!"
 janissaries_estate_events.8.desc: "Stosunki między państwem [Root.GetUsableName] a janczarami osiągnęły nowy poziom napięcia. Od lat nasze państwo nie spełnia ich oczekiwań i odmawia przyznania kolejnych praw oraz przywilejów. Zaniedbywanie żołnierzy janczarskich wywołało atmosferę niechęci i nieufności, która grozi wybuchem otwartego konfliktu. Nic dziwnego, że agowie janczarów przedstawili [Root.Monarch.GetTitle] ultimatum: albo ustąpimy i przyznamy janczarom kolejne koncesje, albo będziemy musieli stawić czoła otwartemu buntowi."
 janissaries_estate_events.8.a: "Stali się zbyt zuchwali. Zmiażdż ich."
 janissaries_estate_events.8.b: "Powinniśmy ustąpić. Nie możemy walczyć z własnymi żołnierzami."
 janissaries_estate_events.9.t: "Janczarzy wysuwają żądania"
 janissaries_estate_events.9.desc: "Agowie janczarów zdobyli poważne wpływy na dworze państwa [Root.GetAdjective], co pozwala im wysuwać istotne żądania wobec [Root.Monarch.GetTitle]. Oczywiście postanowili wykorzystać tę okazję, aby przedstawić swoje postulaty w imieniu janczarów."
 janissaries_estate_events.9.a: "Niedorzeczne. Wyrzućcie ich z mojego dworu!"
 janissaries_estate_events.9.b: "Niech dostaną to, czego żądają."
 janissaries_estate_events.10.t: "Narodziny obiecującego janczara"
 janissaries_estate_events.10.desc: "Młody janczar zwrócił uwagę agi. W trakcie swojej kariery żołnierz wywarł silne wrażenie na towarzyszach ze swojego orty. Jego geniusz taktyczny i umiejętności administracyjne zapowiadają wielką przyszłość.
Nic dziwnego, że wkrótce dostrzegł go nawet sam [Root.Monarch.GetTitle]. Młody człowiek przybył dziś na dwór [Root.Monarch.GetName] i z niepokojem czeka na słowa wielkiego [Root.Monarch.GetTitle]."
 janissaries_estate_events.10.a: "Będzie znakomitym generałem."
 janissaries_estate_events.10.b: "Wreszcie dobry komendant na dworze."
 janissaries_estate_events.10.c: "Widzę w nim nowego wielkiego wezyra!"
 janissaries_estate_events.10.d: "Niech zreformuje nasze wojsko."
 janissaries_estate_events.10.e: "Jest utalentowany, ale nie zasługuje na moją uwagę."
 janissaries_estate_events.11.t: "Uczeni i administratorzy spośród janczarów"
 janissaries_estate_events.11.desc: "Odkąd janczarzy uzyskali przywilej wykonywania zawodu poza wojskiem, szeregi uczonych i administratorów w naszym państwie znacznie się powiększyły. Ludzie nauki zgłębiają bogatą literaturę, którą nasze państwo [Root.GovernmentName] stworzyło na przestrzeni wieków, i niechętnie wracają do żołnierskiego życia. Choć jest to korzystne dla administracji, ich niechęć do pierwotnego powołania z pewnością obniży jakość oddziałów janczarskich, jeśli na to pozwolimy."
 janissaries_estate_events.11.a: "Pozwól im realizować prawdziwe zainteresowania."
 janissaries_estate_events.11.b: "Janczarzy są przede wszystkim formacją wojskową."
 janissaries_estate_events.12.t: "Rywalizacja ze stanem [Root.GetBurghersOrFallbackName]"
 janissaries_estate_events.12.desc: "Po uzyskaniu prawa do wykonywania dodatkowych zawodów janczarzy zaangażowali się w handel i kupiectwo. Naturalnie prowadzi to do konfliktu z innym stanem społecznym – [Root.GetBurghersOrFallbackName]. Niedawno między tymi dwiema grupami wybuchł spór dotyczący niektórych praw kupieckich. To [Root.Monarch.GetTitle] musi ostatecznie rozstrzygnąć tę kwestię."
 janissaries_estate_events.12.a: "Opowiedz się po stronie janczarów."
 janissaries_estate_events.12.b: "Opowiedz się po stronie stanu [Root.GetBurghersOrFallbackName]."
 janissaries_estate_events.12.c: "Nie opowiadaj się po żadnej ze stron."
 janissaries_estate_events.12.d: "Wypracuj kompromis z obiema stronami."
 janissaries_estate_events.13.t: "Właściciele ziemscy wśród janczarów"
 janissaries_estate_events.13.desc: "Dzięki przyznaniu prawa do wykonywania dodatkowych zawodów niektórzy janczarzy zdołali zgromadzić wielkie majątki. Ich bogactwo obejmuje nie tylko dukaty, lecz także ziemię. Janczarzy zdobyli prowincję [janissary_province.GetName], lecz aby przejęcie jej na własność stało się oficjalne, muszą najpierw zawrzeć umowę z naszym rządem."
 janissaries_estate_events.13.a: "Pozwól im posiadać prowincję [janissary_province.GetName]."
 janissaries_estate_events.13.b: "Nie. Ziemie państwa [Root.GetUsableName] należą do [Root.Monarch.GetTitle]."
