 codify_single_whip_law_decision_title: "Skodyfikowanie prawa jednego bata"
 codify_single_whip_law_decision_desc: "Skodyfikowanie prawa jednego bata pozwoli włączyć jego postanowienia do kodeksu prawnego naszego państwa."
 reign_in_estates_decision_title: "Poskromienie stronnictw"
 reign_in_estates_decision_desc: "Różne stronnictwa w naszym państwie poczynają sobie coraz śmielej. Oburzają się, gdy żąda się od nich wkładu w dobro wspólne, a zarazem wywierają presję, by w zamian za korupcję otrzymywać przywileje i wpływy. Musimy położyć temu kres, nim cesarstwo pogrąży się w chaosie."
 reform_civil_registration_decision_title: "Rejestracja ludności"
 reform_civil_registration_decision_desc: "System ewidencji wszystkich poddanych naszego państwa, którego celem jest poprawa warunków życia wszystkich tych, którzy żyją pod naszymi sztandarami."
 establish_silver_standard_decision_title: "Standard srebra"
 establish_silver_standard_decision_desc: "Wprowadzenie prawa jednego bata zdecydowanie usprawniło pobór podatków. Musimy jednak podjąć środki ostrożności i przeciwdziałać groźbie niekontrolowanej inflacji."
 kanhe_certificate_decision_title: "Certyfikat Kanhe"
 kanhe_certificate_decision_desc: "Cesarska deklaracja, której celem jest wzmocnienie pozycji naszych kupców w kraju i za granicą, a zarazem zapewnienie naszym poddanym szerszego, wyłącznego dostępu do naszych rynków."
 new_keju_formats_decision_title: "Nowe formy egzaminów keju"
 new_keju_formats_decision_desc: "Reforma ta ma udoskonalić proces selekcji kandydatów na urzędników i przyszłych biurokratów podczas egzaminów cesarskich. Wprowadzenie nowych form testów i podwyższenie wymagań z pewnością przysłuży się naszej administracji."
 inclusive_monarchy_decision_title: "Monarchia otwarta na wszystkich"
 inclusive_monarchy_decision_desc: "Nasze państwo obejmuje rozległe ziemie, a liczba naszych poddanych jest ogromna. Musimy zatem wykazać się doskonałością i tolerancją godną samych Niebios oraz dążyć do stworzenia społeczeństwa, które traktuje wszystkich z godnością i współczuciem."
 promote_bureaucratic_faction_decision_title: "§OPopieranie biurokratów§!"
 promote_bureaucratic_faction_decision_desc: "Dusza naszego państwa tkwi w sprawności procedur administracyjnych. Wspierając i wyróżniając urzędników zamiast zwolenników rozwiązań siłowych, zapobiegniemy przyszłym wewnętrznym walkom o władzę.
§YWzajemnie wyklucza się z reformą „Popieranie generałów”§!
"
 promote_military_faction_decision_title: "§OPopieranie generałów§!"
 promote_military_faction_decision_desc: "Ci, którzy narażają życie, by zapewnić nam wolność, zasługują na większe uznanie niż wygodni biurokraci, bez końca mnożący procedury i wikłający się w gąszcz przepisów.
§YWzajemnie wyklucza się z reformą „Popieranie biurokratów”§!
"
 unifed_trade_market_decision_title: "Zjednoczenie rynków Azji"
 unifed_trade_market_decision_desc: "Dzięki ujednoliceniu dostępu do wszystkich rynków, na które mamy wpływ, nasi kupcy osiągną niewyobrażalne zyski, umacniając nasze wpływy i powiększając skarbiec."
 reform_the_military_branch_decision_title: "Reforma armii"
 reform_the_military_branch_decision_desc: "Cesarstwo naszych rozmiarów potrzebuje zdolnych i odważnych ludzi, którzy będą go bronić. Sama odwaga i męstwo nie wystarczą jednak w dzisiejszych czasach. Szeroko zakrojona reforma stałej armii i uczynienie jej potężniejszą będą miały kluczowe znaczenie dla utrzymania naszej pozycji."
 modernize_the_banners_decision_title: "Upowszechnienie chorągwi"
 modernize_the_banners_decision_desc: "Armia chorągwi wiernie nam służyła, zadając ciosy naszym wrogom i zapewniając nam kluczowe zwycięstwa. Aby utrzymać jej wysoką sprawność i dyscyplinę, musimy ją zreformować i udoskonalić, inaczej grozi jej upadek."
 study_foreign_ship_designs_decision_title: "Badanie obcych konstrukcji okrętów"
 study_foreign_ship_designs_decision_desc: "Obce okręty skrywają wiele sekretów dotyczących kunsztu mistrzów szkutnictwa i rozwiązań konstrukcyjnych. Rozsądnie będzie przeprowadzić reformę w całym państwie i polecić naszym budowniczym okrętów szczegółowe zbadanie tych jednostek."
 tributary_embassies_decision_title: "Poselstwa państw trybutarnych"
 tributary_embassies_decision_desc: "Utrzymywanie łączności ze wszystkimi państwami składającymi nam trybut ma zasadnicze znaczenie dla zapobiegania konfliktom i poprawy komunikacji. Warto zatem przeprowadzić reformę i sfinansować stałe poselstwa w całej naszej strefie wpływów."
 new_world_discovery_decision_title: "Wyprawy do Nowego Świata"
 new_world_discovery_decision_desc: "Nowy Świat obfituje w egzotyczne towary, możliwości handlowe i perspektywy ekspansji, które mogą ugruntować naszą potęgę. Rozsądnie będzie przeznaczyć cesarskie wpływy na wydawanie edyktów nakazujących urzędnikom badanie tych osobliwych krain za horyzontem."
 reform_the_administration_of_china_decision_title: "Reforma administracji"
 reform_the_administration_of_china_decision_desc: "Eunuchowie od zbyt dawna uzurpują sobie władzę. Chiny i cesarski tron należą do cesarza. Musimy zatem ograniczyć ich przywileje i wpływy, aby uchronić się przed niechybną katastrofą."
 mng_pay_50_gov_ref_prog_and_2_stab_for_reduction_tt: "Wydaj §R50§! punktów postępu reform rządowych i §R-2§! stabilności, aby zreformować rząd i zmniejszyć karę „§YPrzeciążenie administracyjne§!” o §G-5§! minimalnej autonomii"
 qng_eight_banners_title: "Osiem Chorągwi"
 qng_eight_banners_desc: "Tradycyjne oddziały łowieckie Dżurdżenów dobrze służyły nam w walkach z rywalami. Jeśli jednak kiedykolwiek zechcemy podbić imperium, musimy przeorganizować nasze siły w zdyscyplinowane regimenty Chorągwi."
 qng_end_yuan_title: "Położyć kres dynastii Yuan"
 qng_end_yuan_desc: "Widmo dawnych dynastii wciąż utrzymuje się przy życiu na ziemiach Mongołów. Musimy wyruszyć na zachód i wymazać ich nazwę z kart historii."
 mjz_unite_home_provinces_title: "Zjednoczenie rozproszonych ziem"
 mjz_unite_home_provinces_desc: "Obszary najgęściej zaludnione przez pokrewne nam plemiona dżurdżeńskie są rozdrobnione i pogrążone w nieustannych konfliktach. Musimy wyruszyć i zjednoczyć je pod jedną chorągwią."
 mjz_dominate_rival_jurchens_title: "Zdominować rywalizujące plemiona Dżurdżenów"
 mjz_dominate_rival_jurchens_desc: "Aby stawić czoła wszystkim zewnętrznym wrogom jako zjednoczona siła, nie możemy pozwolić żadnemu z naszych wodzów gromadzić podejrzanie wielkich wpływów pod własną chorągwią."
 mch_issue_seven_grievances_title: "Ogłosić Siedem Krzywd"
 mch_issue_seven_grievances_desc: "Zbyt długo pozwalaliśmy uzurpatorom zasiadającym na chińskim tronie decydować o naszym losie i traktować nasz lud jak obywateli drugiej kategorii. Musimy przedstawić cesarzowi Chin nasze krzywdy i zmusić go do pokory, by poznał swoje miejsce."
 mch_proclaim_later_jin_title: "Proklamować Późniejszą dynastię Jin"
 mch_proclaim_later_jin_desc: "Nasze sukcesy w Chinach przyniosły owoce naszemu ludowi. Zwycięskie kampanie i zepchnięcie wroga na południe zapewniły nam wystarczający autorytet, by ogłosić początek potężnej dynastii."
 mch_bypass_great_wall_title: "Obejść Wielki Mur"
 mch_bypass_great_wall_desc: "Tak zwany Wielki Mur Chiński jest jedynie reliktem minionej epoki. Musimy przełamać jego obronę i wkroczyć do Chin, przemierzyć ich ziemie, szerząc śmierć, strach i zagładę, oraz zatknąć nasze chorągwie na wszystkich umocnieniach, za którymi ukrywa się cesarz."
 mjz_unite_jurchen_tribes_title: "Zreorganizować plemiona"
 mjz_unite_jurchen_tribes_desc: "Jeśli chcemy skonsolidować naszą władzę, musimy zreorganizować wojowników i ludność naszych społeczności. Powinniśmy wzmocnić nasze szeregi i dopilnować, by wszyscy mieszkańcy naszych ziem przestrzegali prawa plemiennego."
 mch_adopt_alphabet_title: "Pismo mandżurskie"
 mch_adopt_alphabet_desc: "Podstawą każdego ludu jest jego język. Wielu naszych rodaków nie potrafi pisać ani mówić językiem chińskiego cesarza. Nasi przodkowie wielokrotnie padali jednak ofiarą najazdów obcych zdobywców. Odrywano nas od starszyzny i zmuszano do mówienia obcymi językami. Z każdą nową dynastią i kolejnym zdobywcą zmieniali się nasi panowie, a wraz z nimi słowa, którymi kazali nam mówić. Zmienialiśmy się także my — nasze myśli, osobowości i sposób odróżniania dobra od zła. Aby ugruntować naszą pozycję i ochronić się przed obcymi wpływami, potrzebujemy wspólnego języka."
 mjz_into_korea_title: "Królestwo Pustelników"
 mjz_into_korea_desc: "Za górą Paektu leży królestwo Korei, kraina żyznych ziem i obfitych zasobów. Ich bogactwo stanowi zagrożenie. Nie możemy pozwolić im rozwijać się bez przeszkód tak blisko naszych granic, gdyż mogą wyrosnąć na niebezpiecznego rywala."
 mch_ensure_internal_stability_title: "Stabilność stronnictw"
 mch_ensure_internal_stability_desc: "Podbój stanowi kluczowy fundament rozwoju naszego państwa. Jeśli jednak chcemy przetrwać próbę czasu, musimy również zadbać o sprawy wewnętrzne i zapewnić sprawne funkcjonowanie naszego rządu."
 mjz_break_through_korea_title: "Zdobyć Ganggye"
 mjz_break_through_korea_desc: "Umocnienia w górach koreańskiego regionu blokują nam dostęp do niezliczonych łupów i chwały podboju. Zapewnienie sobie przejścia na południe będzie ważnym krokiem na drodze do bogactwa i kolejnych zwycięstw."
 mjz_mount_paektu_title: "Góra Paektu"
 mjz_mount_paektu_desc: "Góra Bukuri, zwana przez Koreańczyków Paektu, jest świętym miejscem pochodzenia naszego ludu. Według legendy niebiańska dziewica mieszkająca nad górskim jeziorem poczęła syna za sprawą owocu upuszczonego przez srokę. Jej syn został pierwszym wodzem Dżurdżenów. Musimy oddać cześć naszym przodkom, wznosząc świątynie w pobliżu góry."
 qng_formalize_ritual_practices_title: "Skodyfikować praktyki rytualne"
 qng_formalize_ritual_practices_desc: "Praktyki religijne nie są w naszym państwie pustą formalnością. Gorliwość i pobożność to jedne z filarów, na których zbudujemy wielkie państwo, oparte na merytokratycznych procedurach, przejrzystości, tolerancji wobec innych oraz szacunku dla współwyznawców."
 mjz_for_the_horde_title: "Za hordę!"
 mjz_for_the_horde_desc: "Stawianie czoła wrogom z zapałem, honorem i odwagą oraz szarżowanie w sam środek bitwy to szlachetna postawa. Nie musimy jednak samotnie rzucać się w objęcia śmierci. Być może znajdziemy sojuszników o podobnych poglądach, połączymy siły i wspólnie pokonamy naszych wrogów!"
 mjz_banners_cost_no_corruption_tt: "\nOdtąd regimenty Chorągwi będą zwracać §G-0.04§! punktu korupcji"
 mng_all_available_estates_granted_land_rights_tt: "Nadano przywilej „§YPrawa do ziemi§!” wszystkim dostępnym §YStanom§!"
 mjz_receive_8_advanced_cav_units_tt: "§lW naszej stolicy pojawi się osiem pułków zaawansowanej kawalerii§!"
 mjz_receive_4_advanced_cav_units_tt: "§lW naszej stolicy pojawią się cztery pułki zaawansowanej kawalerii§!"
 mjz_receive_2_advanced_cav_units_tt: "§lW naszej stolicy pojawią się dwa pułki zaawansowanej kawalerii§!"
 mjz_legendary_conqueror_trait: "Nasz władca otrzyma cechę władcy „§YLegendarny zdobywca§!”"
 mch_enable_qing_decision_tt: "Odblokowanie §Ydecyzji narodowej§! o utworzeniu państwa @QNG Qing"
 mch_inform_about_impact_tt: "
Ten wybór wpłynie na nagrodę w wydarzeniu „§YReformy Nurhaczego§!”"
 mjz_every_province_10_autonomy_tt: "
Autonomia w prowincjach naszej kultury zostanie obniżona o §G-10§!"
 until_we_reform_our_administration_as_qng_desc: "do czasu zreformowania naszego systemu edukacji i administracji jako @QNG Qing"
 mch_war_with_eoc_reward_tt: "Jeśli ukończymy misję, będąc w stanie wojny z §YCesarzem Chin§!, otrzymamy następującą nagrodę:"
 warriors_can_read_some_books_tt: "
Kara wynikająca z wydarzeń takich jak „§YWojownicy nie czytają książek§!” zostanie zmniejszona."
