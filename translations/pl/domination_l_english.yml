 desc_rallied_volunteers_level_5: "Zgromadziliśmy wielu wiernych, którzy zasilą nasze wojska i pomogą nam w walce."
 gc_cas_spa_reconquista_one2_title: "Odzyskać Andaluzję"
 gc_cas_spa_reconquista_one2_desc: "Maurowie korzystali z naszej cierpliwości przez setki lat. Należy ich usunąć i odzyskać Andaluzję dla Korony [Root.GetAdjective]."
 gc_cas_spa_reconquista_four2_title: "Kontynuować rekonkwistę"
 gc_cas_spa_reconquista_four2_desc: "Oprócz realizacji naszych roszczeń na Półwyspie Iberyjskim powinniśmy umocnić swoją obecność w kilku miastach Afryki Północnej, aby zabezpieczyć się przed inwazją."
 gc_cas_spa_iberia_christian2_title: "Nawrócić Iberię"
 gc_cas_spa_iberia_christian2_desc: "Reszta Europy patrzy z dezaprobatą na herezję, która zdaje się szerzyć w naszym kraju. Musimy przywrócić błądzących braci na łono jedynej prawdziwej wiary."
 spa_raise_army_title: "Armie Iberii"
 spa_raise_army_desc: "Rosnąca rywalizacja między państwami iberyjskimi a ich sąsiadami skłania nas do utworzenia stałej armii i floty, które pozwolą stawić czoła przyszłym wyzwaniom."
 spa_reform_armada2_title: "Hiszpańska Armada"
 spa_reform_armada2_desc: "Musimy być gotowi przeciwstawić się szerzeniu herezji w Europie. W tym celu potrzebujemy floty dorównującej nawet Anglii. Nasza Wielka i Najszczęśliwsza Armada musi być w stanie stawić czoła każdemu wrogowi i każdemu sztormowi."
 gc_spa_invade_england2_title: "Najechać Anglię"
 gc_spa_invade_england2_desc: "Nie możemy dopuścić, by Wyspy Brytyjskie pogrążyły się w herezji! W obronie wiary musimy zaokrętować żołnierzy na pokłady Armady i wyruszyć do Anglii, gdzie spróbujemy siłą przejąć władzę."
 spa_sevilla_port_title: "Port w Sewilli"
 spa_sevilla_port_desc: "Sewilla jest już najważniejszym portem Kastylii, położonym na skrzyżowaniu szlaków handlowych Morza Śródziemnego i Atlantyku. Rozbudowa jej infrastruktury może okazać się niezwykle opłacalną inwestycją."
 spa_dominate_sevilla_title: "Casa de Contratación"
 spa_dominate_sevilla_desc: "Musimy powołać nową instytucję, która będzie nadzorować cały handel z Nowym Światem i przyczyni się do uporządkowanej kolonizacji tych ziem."
 gc_cas_spa_la_plata2_title: "Założyć La Platę"
 gc_cas_spa_la_plata2_desc: "Żyzne i zielone ziemie Ameryki Południowej doskonale nadają się do założenia nowej kolonii."
 gc_cas_spa_new_granada2_title: "Nowe Królestwo Grenady"
 gc_cas_spa_new_granada2_desc: "Terytoria południowej części hiszpańskiego wybrzeża kontynentalnego należy zorganizować w jeden spójny organizm administracyjny, który nazwiemy Nowym Królestwem Grenady. W Bogocie trzeba ustanowić królewską audiencję, której powierzymy uprawnienia sądownicze nad kolonią."
 spa_new_world_silver_title: "Handel srebrem"
 spa_new_world_silver_desc: "Podczas eksploracji i kolonizacji Nowego Świata odkryliśmy rozległe złoża metali szlachetnych. Systematyczna eksploatacja i handel tymi kruszcami, zwłaszcza srebrem, znacznie zwiększyłyby nasze stałe dochody."
 spa_papal_favor_title: "Polityka Stolicy Apostolskiej"
 spa_papal_favor_desc: "Od stuleci obecność iberyjskich kardynałów w Stolicy Apostolskiej jest czymś zwyczajnym. Warto rozbudować ich sieć wpływów i wzmocnić pozycję w polityce papieskiej, co może przynieść znaczne korzyści naszym katolickim monarchom."
 spa_rein_in_france_title: "Powściągnąć Francję"
 spa_rein_in_france_desc: "Wpływy Francji od stuleci silnie oddziałują na politykę Półwyspu Iberyjskiego — raz jest ona naszym sojusznikiem, innym razem wrogiem. Musimy zdecydować, czy pozyskać ją jako przyjaciela i zawrzeć kluczowy sojusz, czy też uznać za rywala i zneutralizować zagrożenie, jakie stanowi dla naszej przyszłości."
 spa_tercios_system_title: "Sformować tercios"
 spa_tercios_system_desc: "Nasi dowódcy wojskowi zdobyli w ostatnich dekadach cenne doświadczenie na polach bitew. Być może możemy je wykorzystać, wprowadzając nowy system werbunku i szkolenia, który doprowadzi do powstania nowej formacji wojskowej — tercios."
 spa_reform_tercios_title: "Udoskonalić tercios"
 spa_reform_tercios_desc: "System tercios odnosi ogromne sukcesy od chwili wprowadzenia. Na polach bitew opracowano jednak nowe sposoby walki, które pozwalają je pokonać. Konieczna jest więc reforma organizacji tej formacji, aby zachowała opinię niepokonanej."
 spa_merchant_fleet_title: "Reales Atarazanas"
 spa_merchant_fleet_desc: "Sztuka budowy okrętów rozwinęła się od założenia pierwszych królewskich stoczni Reales Atarazanas w Sewilli i Barcelonie w XIII wieku. Warto zwiększyć teraz liczbę dostępnych nam stoczni, czego domagają się również nasi kupcy."
 gc_cas_spa_spanish_main2_title: "Hiszpańskie Wybrzeże Główne"
 gc_cas_spa_spanish_main2_desc: "Tak zwane Wybrzeże Główne można dostrzec z pokładów naszych statków handlowych, zanim zawiną do Hispanioli. Jeśli dobrobyt Karaibów jest jakąkolwiek wskazówką, warto dokładnie zbadać ten obszar."
 gc_cas_spa_incans2_title: "Skarby Inków"
 gc_cas_spa_incans2_desc: "Inkowie wypełniają swoje świątynie złotem, a mimo to zdają się nie pojmować, jak wielką władzę daje to bogactwo. Zarówno ich ziemie, jak i zgromadzone kruszce byłyby znacznie bezpieczniejsze w naszych rękach."
 gc_cas_spa_potosi2_title: "Srebro z Potosí"
 gc_cas_spa_potosi2_desc: "Odkryliśmy w Cerro Rico złoża srebra bogatsze niż wszystko, co dotąd widzieliśmy. Aby wydobyć jak najwięcej kruszcu, musimy skierować do pracy miejscową ludność, a także sprowadzić tysiące afrykańskich niewolników. Szacowana wartość srebra jest tak wielka, że znacznie przewyższa koszt zakupu kolejnych niewolników. Bezwzględny wyzysk siły roboczej przyniósłby zatem ogromne zyski."
 gc_cas_spa_reconquista_three2_title: "Roszczenia do Aragonii"
 gc_cas_spa_reconquista_three2_desc: "Znaczna część ziem Aragonii znajdowała się niegdyś pod panowaniem państwa [Root.GetName]. Musimy odzyskać je ponownie — siłą lub podstępem."
 gc_cas_spa_italian_ambition2_title: "Wyprawa do Italii"
 gc_cas_spa_italian_ambition2_desc: "Włochy są bogate i gotowe, by po nie sięgnąć. Podobnie jak wielu przed nami, zdobędziemy własną część Italii i zagarniemy jej bogactwa."
 gc_cas_spa_italian_ambition_22_title: "Podbój Italii"
 gc_cas_spa_italian_ambition_22_desc: "Wplątując się w złożoną sieć dynastycznych układów włoskiej polityki, stworzyliśmy wiarygodne podstawy do wysuwania hiszpańskich roszczeń wobec Toskanii i Mediolanu. Same deklaracje jednak nie wystarczą — do ich urzeczywistnienia potrzebujemy naszych sił zbrojnych."
 spa_spanish_road_title: "Droga Hiszpańska"
 spa_spanish_road_desc: "Zapewniwszy sobie kontrolę nad północnymi Włochami i ziemiami Austrii, możemy zrealizować jedną z dawnych ambicji Habsburgów — zdobyć bogate Niderlandy. Najpierw musimy jednak utworzyć sieć placówek wojskowych i zawrzeć sojusze, które utorują drogę naszym armiom."
 gc_spa_spanish_netherlands2_title: "Niderlandy Hiszpańskie"
 gc_spa_spanish_netherlands2_desc: "Nasze roszczenia do Flandrii i Walonii muszą zostać wyegzekwowane — drogą dyplomacji lub mieczem. Musimy również zwalczać wszelkie przejawy herezji pojawiające się w Niderlandach."
 spa_rb_italian_ambition2_title: "Ambicje włoskie"
 spa_rb_italian_ambition2_desc: "Włochy są bogate i gotowe, by po nie sięgnąć. Podobnie jak wielu przed nami, wywalczymy sobie część Italii i zagarnimy jej bogactwa dla siebie."
 gc_spa_hre2_title: "Monarchia uniwersalna"
 gc_spa_hre2_desc: "Nadszedł czas, by Hiszpania stworzyła w Europie uniwersalną monarchię katolicką. W tym celu musimy na zawsze przejąć tron cesarski Świętego Cesarstwa Rzymskiego, znieść urząd elektorów i ustanowić dziedziczną sukcesję."
 gc_cas_spa_caribbean_discovery2_title: "Odkryć Karaiby"
 gc_cas_spa_caribbean_discovery2_desc: "Od dawna przypuszcza się, że zamiast podróżować na wschód, można dotrzeć do Indii, płynąc na zachód. Musimy sprawdzić tę teorię i odnaleźć odpowiednie miejsce do lądowania."
 gc_cas_spa_caribbean_colony2_title: "Kolonia na Karaibach"
 gc_cas_spa_caribbean_colony2_desc: "Rdzenni mieszkańcy odkrytej przez nas Hispanioli są przyjaźni, gościnni, a co najważniejsze — łatwowierni. Powinniśmy zgłosić pretensje do tego regionu, sprowadzając na jego ziemie kolejnych osadników [Root.GetAdjective]."
 gc_cas_spa_mayans2_title: "Podbój Majów"
 gc_cas_spa_mayans2_desc: "Wysłani przez nas odkrywcy powrócili z Jukatanu z opowieściami o tajemniczej, upadłej cywilizacji. Majowie, niegdyś potężna liga władająca całym półwyspem, zostali rozbici na skłócone miasta-państwa, które stanowią łatwy cel dla hiszpańskiego podboju."
 gc_cas_spa_california2_title: "Skolonizować Kalifornię"
 gc_cas_spa_california2_desc: "Rozszerzenie naszych wpływów na Kalifornię byłoby naturalnym przedłużeniem granic Nowej Hiszpanii. Krążą niepotwierdzone pogłoski o dziewiczych złożach złota w tym regionie. Jeśli rzeczywiście istnieją, musimy zabezpieczyć je dla siebie."
 spa_infantes_aragon_title: "Infanci aragońscy"
 spa_infantes_aragon_desc: "Infanci aragońscy to bracia i siostry króla Aragonii Alfonsa V, a zarazem kuzyni kastylijskiego króla Jana II z dynastii Trastámara. Od ćwierćwiecza ich wpływy i ambicje w polityce Kastylii nieustannie rosną, a teraz sytuacja osiąga punkt krytyczny i przełomowy."
 gc_cas_spa_reconquista_two2_title: "Odzyskać Portugalię"
 gc_cas_spa_reconquista_two2_desc: "Królestwo Hiszpanii należy do nas, a jego częścią jest również dawna sąsiadka — Portugalia. Musimy pozbawić ją niezależnego statusu i przywrócić zwierzchnictwo państwa [Root.GetName]."
 spa_handle_austria_title: "Korona Austrii"
 spa_handle_austria_desc: "Nasze interesy we Włoszech wymagają zabezpieczenia pozycji w dynastii Habsburgów, najważniejszym rodzie cesarskim obecnego stulecia."
 gc_spa_austrian_union2_title: "Sukcesja austriacka"
 gc_spa_austrian_union2_desc: "Habsburgowie austriaccy hojnie wydawali swoje potomstwo za przedstawicieli niemal wszystkich znaczących rodów szlacheckich Europy. Zyskali dzięki temu przychylność wielu państw, lecz ich polityka ma dwie strony: małżeństwa dynastyczne połączyły trony licznych krajów, a potomkowie tych związków odziedziczyli również roszczenia do samej Austrii."
 spa_fecho_imperio_title: "Fecho del Imperio"
 spa_fecho_imperio_desc: "Zapewniwszy sobie przyczółek w Cesarstwie dzięki ziemiom austriackim, nadszedł czas, by ubiegać się o koronę cesarską i odnieść sukces tam, gdzie w XIII wieku zawiódł król Alfons X."
 gc_cas_spa_plus_ultra2_title: "Plus Ultra"
 gc_cas_spa_plus_ultra2_desc: "Co znajduje się za Słupami Herkulesa? Nasi dzielni odkrywcy są gotowi się o tym przekonać!"
 gc_cas_spa_hispaniola2_title: "Zająć Hispaniolę"
 gc_cas_spa_hispaniola2_desc: "Wyspa Hispaniola stanie się naszą bramą na Karaiby i dalsze obszary Nowego Świata. Musimy ją skolonizować i założyć misje religijne w Santo Domingo, aby szerzyć słowo Boże w obu Amerykach."
 gc_cas_spa_new_spain2_title: "Wicekrólestwo Nowej Hiszpanii"
 gc_cas_spa_new_spain2_desc: "Nadszedł czas, by umocnić nasze panowanie nad Zatoką Meksykańską poprzez ustanowienie stałego i sprawnie zorganizowanego wicekrólestwa kolonialnego. Real Audiencia będzie pełnić funkcję najwyższego sądu w Nowym Świecie i dopilnuje, by złoto Meksyku bezpiecznie trafiało do Hiszpanii."
 gc_cas_spa_florida2_title: "Ufortyfikować Florydę"
 gc_cas_spa_florida2_desc: "Bagienne ziemie Florydy, położone na północ od Nowej Hiszpanii, nie obfitują w złoto, mogą jednak odegrać kluczową rolę w obronie naszego porządku kolonialnego. Musimy zasiedlić ten region i go ufortyfikować."
 spa_reinforce_royal_authority_title: "Umocnić władzę królewską"
 spa_reinforce_royal_authority_desc: "W ostatnich latach szlachta w kraju [Root.GetName] coraz śmielej występuje przeciwko nam. Musimy teraz wzmocnić naszą władzę i zawrzeć z nią porozumienie na długie lata."
 spa_law_and_order_title: "Prawo i porządek"
 spa_law_and_order_desc: "Musimy zagwarantować przestrzeganie prawa i porządku oraz ułatwić podróżowanie między naszymi zamożnymi miastami. W tym celu należy wesprzeć sądy Chancillería w Valladolid i Grenadzie oraz powołać Świętą Hermandadę jako siłę porządkową."
 spa_economic_reforms_title: "Zreformować skarb"
 spa_economic_reforms_desc: "Po trudnych czasach, które dotknęły nasz kraj, potrzebujemy sprawnego skarbu państwa, aby realizować nowe przedsięwzięcia. Musimy również zreformować system monetarny, a do powodzenia tych działań niezbędne będą rady i zgoda mieszczan."
 spa_new_capital_title: "Nowa stolica"
 spa_new_capital_desc: "Nasz kraj rozrósł się i obejmuje teraz wiele królestw. Choć przywykliśmy do podróżowania między nimi, nadszedł czas, by ustanowić stałą siedzibę naszego dworu."
 spa_system_councils_title: "System rad"
 spa_system_councils_desc: "W ostatnich dekadach potrzeby naszego państwa stale rosły. Warto zatem zreformować rząd i ustanowić rozbudowany system sprawnej administracji, zorganizowanej w rady zajmujące się poszczególnymi dziedzinami i terytoriami."
 gc_cas_spa_west_africa2_title: "Porty Afryki Zachodniej"
 gc_cas_spa_west_africa2_desc: "Wybrzeże Afryki Zachodniej ma kluczowe znaczenie strategiczne. Musimy nie tylko założyć stacje zaopatrzeniowe dla statków opływających Przylądek Dobrej Nadziei, lecz także zapewnić stałe dostawy afrykańskich niewolników transportowanych do naszych kolonii w obu Amerykach."
 gc_cas_spa_discover_spice_islands2_title: "Wypłynąć do Indii Wschodnich"
 gc_cas_spa_discover_spice_islands2_desc: "Daleko na wschodzie leżą legendarne Wyspy Korzenne, skąd pochodzą jedne z najbardziej pożądanych w Europie towarów, takich jak gałka muszkatołowa i goździki. Musimy odkryć morską drogę prowadzącą do tych wysp od wschodu."
 gc_cas_spa_conquer_philippines2_title: "Las Islas Filipinas"
 gc_cas_spa_conquer_philippines2_desc: "Odkryliśmy rozległy archipelag, który nazwaliśmy Las Islas Filipinas. Wyspy obfitują w przyprawy i drogocenne kamienie. Rdzenni mieszkańcy wyznają pogańskie religie, są podzieleni i prawdopodobnie nie zdołają odeprzeć hiszpańskiej inwazji. Powinniśmy wysłać ekspedycję z największymi siłami, jakie możemy oddelegować, by podbić te cenne ziemie."
 gc_cas_spa_havana2_title: "Założyć Hawanę"
 gc_cas_spa_havana2_desc: "Kuba jest największą z wysp karaibskich i obfituje w rdzenną ludność wykorzystywaną do pracy na plantacjach. Musimy założyć tam kolonie i zbudować miasto w naturalnym porcie Zatoki Hawańskiej."
 gc_cas_spa_native_reductions2_title: "Redukcje misyjne"
 gc_cas_spa_native_reductions2_desc: "Uczeni ze szkoły w Salamance zmusili nas do przyznania, że rdzenni mieszkańcy obu Ameryk są ludźmi obdarzonymi duszą, a zatem przysługują im prawa naturalne. Powinniśmy rozważyć zgromadzenie pozostałej ludności tubylczej i systematyczne kształcenie jej na nowo, zamiast po prostu mordować i zniewalać."
 gc_cas_spa_aztecs2_title: "Podbój Azteków"
 gc_cas_spa_aztecs2_desc: "Zgodnie z doktryną entrada samozwańcze Imperium Azteków powinno należeć do nas. Zajmijmy jego ziemie i sprowadźmy złoto do [Root.Capital.GetName]."
 spa_reformed_tercio_modifier: "Zreformowane pułki tercios"
 desc_spa_reformed_tercio_modifier: "Nasze tercios zostały zreformowane i są teraz potężniejsze niż kiedykolwiek wcześniej!"
 spa_powerful_trade_ships_modifier: "Rozbudowa Reales Atarazanas"
 desc_spa_powerful_trade_ships_modifier: "Rozbudowa naszych stoczni przyczyniła się do znacznego ożywienia na szlakach handlowych."
 spa_long_range_logistics_modifier: "Logistyka dalekiego zasięgu"
 desc_spa_long_range_logistics_modifier: "Posterunki wojskowe utworzone na drodze do Niderlandów znacznie poprawiają sprawność działania naszych wojsk."
 spa_backed_by_the_army_modifier: "Ekspansja wojskowa"
 desc_spa_backed_by_the_army_modifier: "Utworzyliśmy nową armię stałą."
 spa_spanish_affluence_modifier: "Hiszpański dobrobyt"
 desc_spa_spanish_affluence_modifier: "Inwestycje poczynione w porcie w Sewilli przynoszą nam coraz większe zyski."
 spa_bid_for_the_hab_crown_modifier: "Starania o koronę Habsburgów"
 desc_spa_bid_for_the_hab_crown_modifier: "Nasza obecność w Europie Środkowej musi być wyraźnie odczuwalna."
 spa_royal_authority_restored_modifier: "Przywrócona władza królewska"
 desc_spa_royal_authority_restored_modifier: "Władza królewska została wreszcie przywrócona w Kastylii."
 estate_nobles_crown_authority_modifier: "Władza Korony"
 spa_valladolid_court_modifier: "Sąd Chancillería w Valladolid"
 desc_spa_valladolid_court_modifier: "Ustanowiliśmy siedzibę naszego wymiaru sprawiedliwości w Valladolid, na północ od rzeki Tag."
 spa_granada_court_modifier: "Sąd Chancillería w Grenadzie"
 desc_spa_granada_court_modifier: "Ustanowiliśmy siedzibę naszego wymiaru sprawiedliwości w Grenadzie, na południe od rzeki Tag."
 spa_spanish_dollar_modifier: "Hiszpański dolar"
 desc_spa_spanish_dollar_modifier: "Pokażcie mi hiszpańskiego dolara!"
 spa_san_lorenzo_escorial_modifier: "San Lorenzo de El Escorial"
 desc_spa_san_lorenzo_escorial_modifier: "San Lorenzo de El Escorial."
 spa_royalists_victorious_modifier: "Zwycięstwo rojalistów"
 desc_spa_royalists_victorious_modifier: "Zwycięstwo rojalistów."
 spa_victorious_infantes_modifier: "Dominacja infantów"
 desc_spa_victorious_infantes_modifier: "Dominacja infantów."
 est_val_infantes_victorious: "Zwycięstwo infantów"
 spa_universal_monarchy_modifier: "Monarchia uniwersalna"
 desc_spa_universal_monarchy_modifier: "Słońce nigdy nie zajdzie nad najpotężniejszym państwem, jakie widział świat. Niech żyje [Root.GetName]!"
 spa_spanish_silver_and_gold_modifier: "Hiszpańskie złoża kruszców"
 desc_spa_spanish_silver_and_gold_modifier: "Wielki napływ srebra i złota z naszych kolonii czyni nasz kraj niewyobrażalnie bogatym."
 spa_overseas_wealth_modifier: "Bogactwo zamorskie"
 desc_spa_overseas_wealth_modifier: "Nasze amerykańskie kolonie stały się jednym z filarów bogactwa naszego kraju."
 spa_victory_netherlands_modifier: "Podporządkowanie Niderlandów"
 desc_spa_victory_netherlands_modifier: "Wreszcie podporządkowaliśmy sobie tych uciążliwych Holendrów!"
 spa_transatlantic_migrations_modifier: "Migracje transatlantyckie"
 desc_spa_transatlantic_migrations_modifier: "Nowy Świat czeka na kolonizację przez naszych osadników."
 spa_invest_in_west_africa_modifier: "Inwestycje w Afryce Zachodniej"
 desc_spa_invest_in_west_africa_modifier: "Inwestycje w Afryce Zachodniej wydają się rozsądnym posunięciem, które zaprocentuje w przyszłości."
 spa_aztecs_conquest_modifier: "Podbój Azteków"
 desc_spa_aztecs_conquest_modifier: "Wreszcie podbiliśmy wojowniczych Azteków! Są teraz bardzo zadowoleni z obopólnych korzyści płynących z wymiany naszych kultur."
 spa_enforced_catholicism_modifier: "Narzucony katolicyzm"
 desc_spa_enforced_catholicism_modifier: "Dbamy o to, by nasi kolonialni poddani wyznawali jedyną prawdziwą wiarę."
 spa_universal_empire_modifier: "Uniwersalne imperium"
 desc_spa_universal_empire_modifier: "Staliśmy się największą potęgą na świecie. Niech wszyscy składają hołd hiszpańskiej Koronie!"
 flavor_spa.18.t: "Infanci aragońscy"
 flavor_spa.18.d: "Infanci aragońscy byli synami i córkami króla Aragonii Ferdynanda I oraz jego żony Eleonory de Alburquerque. Po kompromisie z Caspe w 1412 roku ich ojciec ustanowił w tym królestwie dynastię Trastámara. Byli również kuzynami kastylijskiego króla Jana II i już na początku jego panowania spiskowali, by przejąć nad nim kontrolę i zdobyć władzę w Kastylii. Wspierała ich frakcja krewnych i sojuszników wśród kastylijskiej szlachty. Przeciwstawiło im się jednak drugie stronnictwo, na którego czele stał królewski konetabl Álvaro de Luna, przez dwie dekady główna podpora króla Jana II.\n\nSytuacja pogorszyła się w 1437 roku, gdy wybuchła nowa wojna domowa między stronnictwem infantów aragońskich a obozem Álvara de Luny i następcy tronu, Henryka. Konflikt rozstrzygnęła bitwa pod Olmedo w roku [GetYear]."
 flavor_spa.18.a: "Stoimy po stronie króla!"
 flavor_spa.18.b: "Infanci mają rację!"
 flavor_spa.20.t: "Koniec konfliktu z infantami aragońskimi"
 flavor_spa.20.d: "Walka między stronnictwami infantów aragońskich i rojalistów zakończyła się bitwą pod Olmedo. Jedna z kastylijskich frakcji szlacheckich pokonała drugą — przynajmniej na razie..."
 flavor_spa.20.a: "Ta katastrofalna sytuacja dobiegła końca, na dobre czy na złe..."
 flavor_spa.22.t: "Hiszpański dolar"
 flavor_spa.22.d: "System monetarny Kastylii w drugiej połowie XV wieku pogrążył się w chaosie. Marawedi, główna jednostka obrachunkowa, był nieustannie dewaluowany od XIII wieku. Ponadto w królestwach iberyjskich funkcjonowały różne waluty regionalne, co utrudniało gospodarcze skutki unifikacji politycznej zapoczątkowanej małżeństwem Izabeli Kastylijskiej i Ferdynanda Aragońskiego.\n\nZ tego powodu w roku [GetYear] rozpoczęto reformę monetarną, wprowadzając nową złotą monetę — dukata — oraz srebrnego reala, które miały obowiązywać w obu królestwach. Wobec niespodziewanie dużego napływu srebra z Ameryk w kolejnych dekadach gwałtownie wzrosło znaczenie monety „real de a ocho”, wkrótce powszechnie znanej jako „hiszpański dolar”. Uznaje się ją za pierwszą walutę globalną, ponieważ akceptowali ją kupcy na całym świecie — od Afryki i Ameryki po Europę i Azję."
 flavor_spa.22.a: "Pokażcie mi hiszpańskie dolary!"
 flavor_spa.23.t: "San Lorenzo de El Escorial"
 flavor_spa.23.d: "[Root.Monarch.GetName], monarcha państwa [Root.GetName], nosi wiele przydomków. Jednym z najtrafniejszych jest jednak „Król Biurokrata”. [Root.Monarch.GetSheHeCap] postanowił ustanowić stałą stolicę, kładąc kres dawnej tradycji iberyjskich monarchów, którzy nieustannie podróżowali po swoich ziemiach. Wybrał Madryt ze względu na jego centralne położenie, niezależność od potężnych możnowładców i Kościoła, a niektórzy twierdzą, że także z powodu dobrego zaopatrzenia w wodę. W każdym razie [Root.Monarch.GetName] nie przepada za samym miastem, dlatego postanowił wznieść na jego górzystych obrzeżach wielki klasztor pod wezwaniem świętego Wawrzyńca, który miał być również zwyczajną rezydencją [Root.Monarch.GetHerHis]. Zgromadził tam bogatą bibliotekę i relikwie świętych, czyniąc z klasztoru centrum administracji, w którym przewodniczy codziennym posiedzeniom rad zajmujących się sprawami państwa. Ustanowił tam także królewski panteon, w którym spoczną wszyscy królowie i królowe państwa [Root.GetName] po [Root.Monarch.GetName]."
 flavor_spa.23.a: "Stolica godna światowego imperium!"
 flavor_spa.199.t: "Ferdynand Magellan — legendarny odkrywca!"
 flavor_spa.199.d: "Ferdynand Magellan jest portugalskim odkrywcą, który zamierza poprowadzić pierwszą wyprawę dookoła świata, aby ostatecznie potwierdzić, że Ziemia jest kulista. W roku [GetYear] przygotowuje się do wypłynięcia z flotą pięciu okrętów i około 270 ludźmi, by odnaleźć nową drogę do Wysp Korzennych w Indiach Wschodnich. Jego celem jest odkrycie przejścia, które pozwoli okrętom opłynąć południowy kraniec Ameryki Południowej i wpłynąć na Ocean Spokojny.\n\nWyprawę Magellana mogą czekać liczne trudności, w tym głód i starcia z rdzennymi mieszkańcami odwiedzanych ziem. Odkrywca zamierza jednak dotrzeć do Indii Wschodnich, a następnie wrócić przez Przylądek Dobrej Nadziei. Jego osiągnięcie utoruje drogę przyszłym odkrywcom i kupcom, umożliwiając opłynięcie globu oraz otwierając nowe możliwości europejskiej kolonizacji i handlu w Amerykach i Azji."
 flavor_spa.199.a: "Będzie służył pod naszymi sztandarami!"
 flavor_spa.199.b: "Precz z nim! To najwyraźniej szaleniec!"
 hispanic_monarchy_events.1.t: "Skupić się na Radzie Królewskiej"
 hispanic_monarchy_events.1.desc: "Po wnikliwych naradach sekretarze poszczególnych rad doszli do porozumienia, że w nadchodzących latach rząd powinien skupić się na sprawach wewnętrznych, koordynowanych przez Radę Królewską. Do nas należy decyzja, która konkretna rada pokieruje działaniami rządu."
 hispanic_monarchy_events.1.a: "Rada Kameralna będzie wykonywać wolę królewską i sprawować wymiar sprawiedliwości."
 hispanic_monarchy_events.1.b: "Rada Skarbu uporządkuje finanse państwa i zwiększy nasze dochody."
 hispanic_monarchy_events.1.c: "Nikt nie spodziewa się Rady Inkwizycji!"
 hispanic_monarchy_events.2.t: "Skupić się na Radzie Stanu"
 hispanic_monarchy_events.2.desc: "Po wnikliwych naradach sekretarze poszczególnych rad doszli do porozumienia, że w nadchodzących latach rząd powinien skupić się na sprawach dyplomatycznych, koordynowanych przez Radę Stanu. Do nas należy decyzja, która konkretna rada pokieruje działaniami rządu."
 hispanic_monarchy_events.2.a: "Najważniejszą sprawą będzie zdobycie hegemonii nad Europą!"
 hispanic_monarchy_events.2.b: "Skierujemy stery naszego rządu ku Morzu Śródziemnemu i jego wybrzeżom."
 hispanic_monarchy_events.2.c: "Indie i ich bogactwa mogą okazać się najbardziej dochodowym kierunkiem działań."
 hispanic_monarchy_events.3.t: "Skupić się na Radzie Wojennej"
 hispanic_monarchy_events.3.desc: "Po wnikliwych naradach sekretarze poszczególnych rad doszli do porozumienia, że w nadchodzących latach rząd powinien skupić się na sprawach wojskowych, koordynowanych przez Radę Wojenną. Do nas należy decyzja, która konkretna rada pokieruje działaniami rządu."
 hispanic_monarchy_events.3.a: "Rada Krucjaty pokieruje naszymi działaniami przeciwko niewiernym!"
 hispanic_monarchy_events.3.b: "Rada Zakonów Rycerskich zapewni naszym wojskom dodatkowe zasoby."
 hispanic_monarchy_events.3.c: "Rada Armady zagwarantuje nam dominację na szlakach morskich."
 spa_event_insight_1003_tt: "\n§GInformacje o wydarzeniu§!:\nWydarzenie to ustanowi §YCasa de Contratación§! i zapewni nam potężny, stały modyfikator wspierający przedsięwzięcia kolonialne."
 tercios_reform: "Tercios"
 tercios_reform_desc: "Tercios, dosłownie „trzecie”, stanowiły trzon armii hiszpańskich we wczesnej epoce nowożytnej. Choć historycznie żołnierzy tych formacji werbowano nie tylko w Hiszpanii, lecz także we Włoszech i Walonii, najbardziej cenione tercios rekrutowały się z hiszpańskich prowincji. Przez dziesięciolecia tercios pozostawały niemal niepokonane na polach bitew Europy i basenu Morza Śródziemnego, odgrywając kluczową rolę w rozwoju europejskiej sztuki wojennej."
 system_of_councils_reform: "System rad"
 system_of_councils_reform_desc: "System rad, znany również jako system polisynodalny, został opracowany przez monarchię hiszpańską w celu zarządzania jej różnorodnymi terytoriami we wczesnej epoce nowożytnej. Administrację centralną powierzono grupie kolegialnych organów — rad — złożonych ze szlachty, duchowieństwa i mieszczan, obsługiwanych bezpośrednio przez wykształconych prawników zwanych letrados. Poszczególne rady miały kompetencje dziedzinowe, obejmujące całe imperium hiszpańskie, lub terytorialne, ograniczone do poszczególnych królestw."
 estate_nobles_factionalist_nobility: "Szlachta frakcyjna"
 estate_nobles_factionalist_nobility_desc: "Możni naszego kraju zorganizowali się w odrębne frakcje, które walczą o kontrolę nad ziemią i stopniowo osłabiają władzę Korony."
 infantes_of_aragon: "Infanci aragońscy"
 benedictines: "Benedyktyni"
 benedictines_desc: "Zakon benedyktynów jest najliczniejszym i najbardziej rozpowszechnionym zakonem, którego mnisi od VI wieku przestrzegają reguły św. Benedykta z Nursji."
 carthusians: "Kartuzowie"
 carthusians_desc: "Zakon kartuzów, założony przez Brunona z Kolonii, opiera się na surowej, pustelniczej regule życia klasztornego. Jego klasztory nazywane są kartuzjami."
 hieronymites: "Hieronimici"
 hieronymites_desc: "Zakon św. Hieronima powstał na Półwyspie Iberyjskim w XIV wieku i szybko się rozwijał dzięki przychylności kolejnych monarchii iberyjskich."
 augustinians: "Augustianie"
 augustinians_desc: "Zakon augustianów przestrzega reguły św. Augustyna z Hippony i jest gorliwym krzewicielem kultu Najświętszej Maryi Panny."
 carmelites: "Karmelici"
 carmelites_desc: "Karmelici to zakon żebraczy założony na górze Karmel w Ziemi Świętej. Za swoich duchowych ojców uznaje proroka Eliasza i jego ucznia Elizeusza."
 calatrava_order: "Zakon Calatrava"
 calatrava_order_desc: "Zakon rycerski Calatrava został założony w Kastylii w XII wieku, aby walczyć z kalifatem Almohadów. Stanowił militarną gałąź zakonu cystersów."
 avis_order: "Zakon Avis"
 avis_order_desc: "Zakon rycerski Avis został założony w Portugalii w XII wieku. Pomógł krajowi umocnić niepodległość, a w XV wieku dał nazwę panującej dynastii."
 montesa_order: "Zakon Montesy"
 montesa_order_desc: "Zakon rycerski Montesy powstał po rozwiązaniu aragońskiej gałęzi zakonu templariuszy i pozostawał pod bezpośrednią opieką królów Aragonii."
 santiago_order: "Zakon św. Jakuba"
 santiago_order_desc: "Zakon św. Jakuba powstał w XII wieku w Królestwie Leónu, a jego główna siedziba znajduje się w kastylijskim Uclés. Jest najbardziej rozpowszechnionym iberyjskim zakonem rycerskim i nosi imię św. Jakuba, patrona Hiszpanii."
 san_juan_order: "Zakon św. Jana"
 san_juan_order_desc: "Zakon św. Jana, znany szerzej jako joannici, jest zakonem rycerskim skupiającym działalność we wschodniej części basenu Morza Śródziemnego, choć jego komandorie znajdują się w całej Europie Zachodniej."
 alcantara_order: "Zakon Alcántary"
 alcantara_order_desc: "Zakon Alcántary został założony w XII wieku w Królestwie Leónu, w miejscowości pełniącej funkcję przygranicznej strażnicy na pograniczu Portugalii i kalifatu Almohadów."
 cas_armada_info_tt: "\nJeśli ukończymy tę misję, gdy @ENG Anglia lub @GBR Wielka Brytania wyznaje §Yheretycką§! religię i kwalifikuje się do §Yunii personalnej§!, zamiast tego otrzymamy casus belli §YPrzywrócenie unii§!."
 spa_every_cardinal_1_tax_tt: "\nKażda prowincja z §Ykardynałem§! otrzyma 1 £adm£ rozwoju."
 spa_any_ally_tt: "Posiadać §Ysojusznika§!, który spełnia następujące warunki:\n - Jego stolica znajduje się w regionie §YFrancji§!\n - Jest §Ywielkim mocarstwem§! lub ma co najmniej §Y500§! rozwoju łącznego\n - Ma do nas stosunek wynoszący co najmniej §Y180§!"
 spa_royalist_tt: "\nJeśli ukończyliśmy misję, §Ymiażdżąc§! infantów, negatywne skutki przywileju §YSzlachta frakcyjna§! zostaną §Gzłagodzone§!, a my otrzymamy następującą nagrodę:"
 spa_infantes_tt: "\nJeśli natomiast zdecydowaliśmy się §Yopowiedzieć po stronie§! infantów, negatywne skutki przywileju §YSzlachta frakcyjna§! zostaną §Rwzmocnione§!, a my otrzymamy następującą nagrodę:"
 spa_recent_change_tt: "Niedawno przeniesiono stolicę do prowincji [217.GetName] za sprawą wydarzenia „§YSólo Madrid es Corte§!”."
 ended_infantes_disaster_tt: "Zakończono katastrofę „§YInfanci aragońscy§!”."
 spa_no_isabella_event_tt: "\nWydarzenie „§YIzabela Kastylijska§!” nie wystąpi.\n"
 spa_pu_por_tt: "Ukończenie tej misji, gdy NIE jesteśmy §Ysojusznikiem§! Portugalii @POR ani nie łączy nas z nią §Ymałżeństwo królewskie§!, zapewni nam roszczenie do jej tronu.\n"
 spa_every_gold_province_tt: "Każda prowincja należąca do nas lub naszego §Yniepłacącego trybutu§! poddanego, w której wydobywa się §Yzłoto§!, otrzyma następującą nagrodę:"
 cas_crushed_infantes_tt: "Opowiedziano się po stronie obecnego monarchy podczas katastrofy."
 cas_sided_infantes_tt: "Opowiedziano się po stronie infantów podczas katastrofy."
 cas_impact_mission_tt: "\nWpłynie to na wynik misji „§YInfanci aragońscy§!”."
 spa_had_cas_civil_war_tt: "Doświadczono katastrofy „§YWojna domowa w Kastylii§!”."
 spa_enable_san_juan_holy_order_tt: "\nZapewnia dostęp do zakonu rycerskiego §YSan Juan§!, dopóki pozostajemy §Ychrześcijanami§!."
 enable_jesuit_order_tt: ""
 cas_race_portugal_event_tt: "\nJeśli ukończymy tę misję, zanim @POR Portugalia ukończy jej odpowiednik, otrzymamy następującą nagrodę:"
 gc_ara_navarra2_title: "Podporządkuj sobie Nawarrę"
 gc_ara_navarra2_desc: "Królestwa Kastylii i Francji łakomie spoglądają na ziemie Nawarry. Gdyby którykolwiek z tych krajów je przejął, byłaby to katastrofa dla państwa [Root.GetName]. Musimy więc działać, zanim będzie za późno."
 gc_ara_consultate_of_the_sea2_title: "Konsulat Morski"
 gc_ara_consultate_of_the_sea2_desc: "Konsulat Morski zarządza handlem morskim naszego państwa z Walencji. Skuteczność jego działań zależy jednak od kontroli nad przepływem handlu w zachodniej części Morza Śródziemnego. Musimy wesprzeć jego wysiłki i zapewnić sobie większościowy udział w handlu na okolicznych wodach."
 gc_ara_genoa2_title: "Zdominuj Genuę"
 gc_ara_genoa2_desc: "Zbyt długo musieliśmy konkurować z genueńskimi kupcami. Nadszedł czas, by ostatecznie podporządkować ich naszej woli i przejąć ich miasto."
 gc_ara_italy2_title: "Zapanuj nad Italią"
 gc_ara_italy2_desc: "Musimy wyeliminować ostatnie przejawy oporu wobec naszych rządów we Włoszech. Nawet papież będzie musiał uznać naszą władzę."
 dom_ara_intervene_castile_title: "Interwencja w Kastylii"
 dom_ara_intervene_castile_desc: "Rodzeństwo króla Alfonsa V, infanci aragońscy, od dwóch dekad próbuje przejąć kontrolę nad Kastylią. Nadszedł czas, by udzielić im bardziej bezpośredniego wsparcia – dyplomatycznego lub militarnego."
 gc_ara_portugal2_title: "Unia z Portugalią"
 gc_ara_portugal2_desc: "Nadszedł czas, by zjednoczyć wszystkie królestwa Hiszpanii pod berłem jednego monarchy. Aby tego dokonać, musimy zdobyć koronę Portugalii."
 dom_ara_iberia_title: "Korony Iberii"
 dom_ara_iberia_desc: "Liczne korony Półwyspu Iberyjskiego pozostają podzielone od stuleci. Nadszedł czas, by doprowadzić nasze dzieło do końca i utworzyć Imperium Hiszpańskie."
 dom_ara_med_title: "Nasze Morze"
 dom_ara_med_desc: "Od Słupów Herkulesa aż po Morze Marmara całe Morze Śródziemne będzie należeć do nas. Każdy statek pływający po jego wodach będzie podlegał naszym prawom."
 gc_ara_occitania2_title: "Najazd na Oksytanię"
 gc_ara_occitania2_desc: "Sąsiedztwo Królestwa Francji budzi niepokój wielu państw. Nie możemy mieć pewności, że nasze działania wojskowe i dyplomatyczne wystarczą, by powstrzymać Francuzów, gdyby zdecydowali się na inwazję. Zamiast czekać, musimy przenieść wojnę na ich ziemie!"
 dom_ara_remensa_war_title: "Wojna remensa"
 dom_ara_remensa_war_desc: "Po stuleciach narastających nadużyć ze strony katalońskiej szlachty chłopi remensa podnieśli bunt, organizując się w ramach związku Sindicat Remença. Teraz naszym obowiązkiem jest zaprowadzić porządek w kraju i zaleczyć rany po konflikcie między chłopami a szlachtą."
 dom_ara_catalan_nobility_title: "Katalońska szlachta"
 dom_ara_catalan_nobility_desc: "Po pomyślnym zaprowadzeniu pokoju w kraju musimy zdecydować o losie katalońskiej szlachty po zakończeniu wojny remensa."
 gc_ara_constantinople2_title: "Miasto pożądane przez świat"
 gc_ara_constantinople2_desc: "Konstantynopol, miasto pożądane przez cały świat, jest w zasięgu naszej ręki. Oblężenie z pewnością będzie długie i ciężkie, ale musimy wytrwać. Miasto będzie nasze!"
 gc_ara_tunis2_title: "Podbij Tunis"
 gc_ara_tunis2_desc: "Tunis to coś więcej niż zwykły port piracki. Jest stolicą konkurencyjnej potęgi morskiej, powiązanej z budzącymi grozę Turkami. Musimy go zniszczyć, zanim zagrożenie jeszcze wzrośnie."
 gc_ara_golden_age2_title: "Złote stulecie"
 gc_ara_golden_age2_desc: "Musimy zapoczątkować złotą erę naszego państwa, która przetrwa pokolenia. Nasze bogactwo i prestiż przyćmią wszystkie inne kraje!"
 gc_ara_industry2_title: "Ośrodki przemysłowe"
 gc_ara_industry2_desc: "Wytwarzamy wiele cennych i przetworzonych towarów: szkło, wino, papier, a nawet jedwab. Musimy zapewnić sobie monopol na ich produkcję i rozwijać nasze zakłady wytwórcze."
 dom_ara_med_ambitions_title: "Ambicje śródziemnomorskie"
 dom_ara_med_ambitions_desc: "Musimy nadal zwiększać liczebność i jakość naszej floty, aby stała się skutecznym narzędziem dominacji na całym Morzu Śródziemnym."
 gc_ara_navy2_title: "Flota [Root.GetAdjective]"
 gc_ara_navy2_desc: "Nasze państwo jest rozciągnięte po obu stronach Morza Śródziemnego, dlatego budowa floty musi stać się naszym najwyższym priorytetem. Jeśli nie zdobędziemy panowania na morzu, wrogowie będą mogli bez przeszkód łupić i zajmować nasze ziemie."
 gc_ara_athens2_title: "Roszczenia do Aten"
 gc_ara_athens2_desc: "Korona Aragonii rości sobie prawa do Księstwa Aten, które obecnie jest zagrożone przez turecką nawałę. Powrót pod naszą opiekę przyniósłby korzyści zarówno Atenom, jak i szerzej rozumianemu narodowi greckiemu."
 gc_ara_banking2_title: "Kantor wymiany"
 gc_ara_banking2_desc: "Praktyki bankowe szybko się zmieniają wraz z rozwojem coraz bardziej złożonego handlu. Musimy zadbać o to, by nasze banki zgromadziły wystarczające rezerwy złota, które sfinansują dalszą ekspansję interesów państwa."
 gc_ara_valencian_silk2_title: "Walencki jedwab"
 gc_ara_valencian_silk2_desc: "Zdobyliśmy środki i wiedzę niezbędne do produkcji jedwabiu – jednego z najbardziej pożądanych towarów w Europie, sprowadzanego zazwyczaj dzięki uczestnictwu w handlu na Jedwabnym Szlaku, kontrolowanym obecnie przez naszych muzułmańskich wrogów. Musimy rozpocząć własną produkcję i założyć giełdę jedwabiu, Llotja de la Seda, na której będzie można kupować i sprzedawać ten towar z korzyścią dla naszego państwa."
 gc_ara_trade_guilds2_title: "Gildie Barcelony"
 gc_ara_trade_guilds2_desc: "Gildie Barcelony od zawsze odgrywały znaczącą rolę w życiu miasta. Musimy zapewnić sobie ich lojalność, a także przychylność podobnych organizacji w całym naszym państwie."
 gc_ara_alexandria2_title: "Zajmij Aleksandrię"
 gc_ara_alexandria2_desc: "Aleksandria była niegdyś wielkim miastem, lecz popadła w ruinę. W miarę rozszerzania naszych rządów na wschód powinniśmy ją zdobyć i odbudować, aby bogactwa Egiptu ponownie zaczęły do niej napływać."
 gc_ara_barbary_ports2_title: "Połóż kres piractwu berberyjskiemu"
 gc_ara_barbary_ports2_desc: "Piraccy handlarze niewolników działający na wybrzeżach Afryki Północnej nieustannie zagrażają naszym ziemiom i żegludze. Musimy zdobyć ich korsarskie miasta i położyć kres zagrożeniu, jakie stanowią dla niewinnych chrześcijan."
 gc_ara_provence2_title: "Upokórz Prowansję"
 gc_ara_provence2_desc: "Książę Prowansji uzurpuje sobie prawa do tronów Aragonii i Neapolu. Jego roszczenia nie mogą pozostać bez odpowiedzi."
 gc_ara_naples2_title: "Zintegruj Neapol"
 gc_ara_naples2_desc: "Neapol podlega władzy Aragonii, ale nie sprawujemy nad nim bezpośrednich rządów. Musi zostać w pełni włączony do naszego państwa."
 flavor_ara.12.t: "Infanci aragońscy"
 flavor_ara.12.d: "Infanci aragońscy to rodzeństwo króla Alfonsa V Aragońskiego, drugiego władcy dynastii Trastámara, która objęła tron po kompromisie z Caspe w 1412 roku. Byli również kuzynami kastylijskiego króla Jana II. Już na początku jego panowania spiskowali, by przejąć nad nim kontrolę i zdobyć władzę w Kastylii, korzystając ze wsparcia stronnictwa krewnych i sojuszników wśród kastylijskiej szlachty.

Sytuacja pogorszyła się w 1437 roku, gdy wybuchła nowa wojna domowa między stronnictwem infantów aragońskich a obozem Álvara de Luny i następcy tronu, Henryka. Konflikt zmierza obecnie ku rozstrzygnięciu."
 flavor_ara.12.a: "Nadarza się okazja!"
 flavor_ara.12.b: "Nie powinniśmy poświęcać pokoju..."
 flavor_ara.13.t: "Rozwój handlu w Aleksandrii"
 flavor_ara.13.d: "Towary transportowane Nilem mają ogromną wartość. Przejęcie kontroli nad ich przepływem przyniesie nam nie tylko niewyobrażalne zyski, lecz także dostęp do nowych dóbr z odległych krain. Niedawny podbój delty pozwolił nam zmonopolizować wiele przedsięwzięć handlowych sięgających aż do Indii i jeszcze dalej."
 flavor_ara.13.a: "To znacząco zasili nasz skarbiec!"
 ara_claims_in_castile_tt: "
Uzyskamy trwałe roszczenia do ziem należących do Kastylii @CAS.
"
 ara_if_cas_dip_tt: "
Jeśli ukończymy misję, gdy @CAS będzie naszym §Ypoddanym§! lub §Ysojusznikiem§!, nawiążemy §Yhistoryczną przyjaźń§!.
"
 ara_had_remensa_war_event_tt: "Wystąpiło wydarzenie „§YSindicat Remença§!”."
 ara_become_p_republic_tt: "
Ogłosimy powstanie §YRepubliki Chłopskiej§!!
"
 ara_iberian_struggle_modifier: "Walka o Iberię"
 desc_ara_iberian_struggle_modifier: "Wielowiekowe konflikty między królestwami Półwyspu Iberyjskiego dobiegają końca."
 ara_a_new_power_modifier: "Hegemon Iberii"
 desc_ara_a_new_power_modifier: "Państwo §Y[Root.GetName]§! ostatecznie pokonało pozostałe królestwa Półwyspu Iberyjskiego i ustanowiło swoją hegemonię w regionie."
 ara_masters_med_modifier: "Władcy Morza Śródziemnego"
 desc_ara_masters_med_modifier: "Dążenie do ustanowienia hegemonii państwa §Y[Root.GetName]§! nad Morzem Śródziemnym zakończyło się triumfem naszej floty, najpotężniejszej na całym akwenie."
 ara_governmental_restructuring_modifier: "Reformy wewnętrzne"
 desc_ara_governmental_restructuring_modifier: "Przezwyciężyliśmy wojnę remensa i przystępujemy do niezbędnych reform, które pozwolą krajowi odzyskać siły."
 ara_crushed_the_catalan_estates_modifier: "Pokój społeczny"
 desc_ara_crushed_the_catalan_nobles_modifier: "Nasze starania o zaprowadzenie porządku wśród stanów zakończyły się sukcesem. Teraz wszystkie zgodnie działają na rzecz wspólnego celu."
 ara_unshackled_modifier: "Wyzwoleni"
 desc_ara_unshackled_modifier: "§YRemensa§! zwyciężyli w wojnie przeciwko feudałom, a nasz kraj czeka teraz świetlana przyszłość!"
 ara_italian_influences_modifier: "Wpływy włoskie"
 desc_ara_italian_influences_modifier: "Umocniliśmy naszą pozycję we Włoszech, a nasza kultura wywiera teraz znaczący wpływ na ten region."
 ara_maritime_administration_modifier: "Administracja morska"
 desc_ara_maritime_administration_modifier: "Państwo [Root.GetName] coraz większą uwagę poświęca sprawom morskim, rozbudowując przy tym administrację swoich zamorskich posiadłości."
 diamond_district2: "Dzielnica Diamentów w Barcelonie"
 desc_diamond_district2: "Wspieramy działalność gospodarczą w Barcelonie za pośrednictwem tamtejszych gildii, a efekty tych działań są znakomite."
 spa_employ_galleon_modifier: "Poskromić bezkresne morze"
 desc_spa_employ_galleon_modifier: "Galeony to jedno z najważniejszych osiągnięć w dziedzinie budowy okrętów. Stały się podstawą naszej floty."
 ara_nile_production_monopoly_modifier: "Monopol na produkcję w dolinie Nilu"
 desc_ara_nile_production_monopoly_modifier: "Żyzne ziemie delty i doliny Nilu przynoszą teraz naszemu państwu ogromne bogactwo."
 ara_victory_over_provence_modifier: "Zwycięstwo nad Prowansją"
 desc_ara_victory_over_provence_modifier: "Wyszliśmy zwycięsko ze starcia z naszymi rywalami!"
 peasant_revolt_leader_personality: "Obrońca prostego ludu"
 peasant_revolt_leader_personality_desc: "Celem istnienia tego przywódcy jest ochrona prostego ludu przed nadużyciami ze strony możnych."
 estate_burghers_sindicat_remensa_privilege: "Sindicat Remença"
 estate_burghers_sindicat_remensa_privilege_desc: "Sindicat Remença to gildia katalońskich chłopów, utworzona po ich wystąpieniu przeciwko nadużyciom feudałów."
 consulate_of_the_sea: "Konsulat Morski"
 consulate_of_the_sea_desc: "Nasz nowy organ o charakterze sądowo-administracyjnym, odpowiedzialny za stosowanie prawa morskiego i handlowego, nosi nazwę Konsulatu Morskiego. Umożliwia kupcom rozstrzyganie sporów handlowych bez ingerencji sądów królewskich, a w zamian zapewnia nam wsparcie finansowe."
 courts_of_navarra: "Kortezy Nawarry"
 courts_of_navarra_desc: "Kortezy Nawarry to zgromadzenie obradujące w Królestwie Nawarry, złożone z rycerstwa, duchowieństwa oraz przedstawicieli miast. Strzegą dawnych praw, zwanych fueros, i mają ograniczać władzę monarchy, a zarazem służyć pomocą domowi królewskiemu w sprawach państwowych."
 basque_marines: "Baskijscy marines"
 basque_marines_desc: "Od niepamiętnych czasów nasi ludzie polowali na wieloryby aż po krańce znanego świata, łupili nadmorskie osady i przywozili cenne towary z odległych krain, poznając tajemnice oceanu. Dzięki tym doświadczeniom nasi żeglarze są nieustraszeni i godni zaufania — stanowią cenny nabytek każdej floty."
 fearless_seamen: "Nieustraszeni żeglarze"
 fearless_seamen_desc: "Nasi przodkowie zawsze patrzyli na morze z podziwem i lękiem, lecz perspektywa bogactw, jakie mogło przynieść, skłoniła ich do podjęcia wyzwania. Odważnie zakładali społeczności, które nie tylko żyły nad morzem, ale także z morza, rozwijając niezwykłe umiejętności żeglarskie. Nasi marynarze są znani na całym wybrzeżu Atlantyku."
 shipbuiling_experts: "Mistrzowie budowy okrętów"
 shipbuiling_experts_desc: "Morze oblewające nasze wybrzeża skrywa liczne zasoby, czekające na śmiałków gotowych po nie sięgnąć. Od stuleci nasz brzeg usiany jest portami i stoczniami, w których niestrudzenie buduje się okręty, by zaspokoić nasze pragnienie morskich przygód i przedsięwzięć."
 basque_ferocity: "Baskijska zawziętość"
 basque_ferocity_desc: "Jeszcze przed bitwą pod Roncevaux, opłakiwaną do dziś przez Francuzów, oraz wyprawami Kompanii Nawarryjskiej nasi ludzie słynęli z zaciekłości w walce. Nigdy nie pozwólmy naszym wrogom o tym zapomnieć."
 camara_de_comptos: "Cámara de Comptos"
 camara_de_comptos_desc: "Za panowania pierwszych królów Nawarry wykształconych we Francji do kraju dotarły nowe koncepcje zarządzania państwem. Dzięki nim powołano Cámara de Comptos, której zadaniem było kontrolowanie kondycji finansowej królestwa."
 people_of_the_sea: "Ludzie morza"
 people_of_the_sea_desc: "Nasi ludzie są doświadczonymi żeglarzami, lecz musimy zadbać o to, by każdy sprawny marynarz mógł w razie potrzeby zasilić naszą flotę podczas nadchodzących wojen. Ich umiejętności będą w tym przedsięwzięciu nieocenione."
 an_industrious_folk: "Pracowity lud"
 an_industrious_folk_desc: "Nasza ziemia może nie należy do najbogatszych, lecz Baskowie są pracowitym narodem i ciężko pracują, by wydobyć z niej wszystko, czego potrzebują. Wytapiamy żelazo w hutach, wypalamy węgiel drzewny z drewna naszych lasów i budujemy najlepsze okręty. Dzięki wysiłkowi naszego ludu kraj opływa w dostatki."
 dom_por_clash_ottomans_title: "Starcie z Osmanami"
 dom_por_clash_ottomans_desc: "Nasza ekspansja na Ocean Indyjski i kontrola nad Zatoką Perską sprawiły, że konflikt z Osmanami, hegemonem Bliskiego Wschodu, stał się nieunikniony."
 dom_portugal_exploration_ideas_title: "Żagle odkrywców"
 dom_portugal_exploration_ideas_desc: "Nasze wyprawy wzdłuż wybrzeży Afryki otwierają nowe szlaki i perspektywy dla przyszłości kraju. Musimy wykorzystać tę szansę, aby rozszerzyć zamorskie posiadłości [Root.GetName]."
 dom_portugal_circumnavigation_title: "Wyprawa dookoła świata"
 dom_portugal_circumnavigation_desc: "Wyprawy, które organizowaliśmy w ostatnich dziesięcioleciach, potwierdziły słuszność teorii naukowych o kulistym kształcie Ziemi. Teraz możemy jako pierwsi wysłać ekspedycję, która opłynie cały świat, przynosząc [Root.GetName] ogromny prestiż."
 dom_castile_exploration_ideas_title: "Żagle odkrywców"
 dom_castile_exploration_ideas_desc: "Nasze wyprawy wzdłuż afrykańskiego wybrzeża otwierają nowe szlaki i perspektywy na przyszłość kraju. Musimy wykorzystać tę szansę, aby rozszerzyć zamorskie wpływy państwa [Root.GetName]."
 dom_castile_circumnavigation_title: "Podjąć wyprawę dookoła świata"
 dom_castile_circumnavigation_desc: "Wyprawy, które wspieraliśmy w ostatnich dekadach, dowiodły słuszności naukowych teorii o kulistym kształcie Ziemi. Teraz możemy zostać pierwszym państwem, które zorganizuje ekspedycję opływającą cały glob, przynosząc państwu [Root.GetName] ogromny prestiż."
 triangle_trade_key: "Handel trójkątny"
 por_every_wine_prov_tt: "
Każda należąca do nas prowincja produkująca §Ywino§! otrzyma następującą nagrodę:"
 por_more_likely_to_get_expansionist_tt: "Dopóki posiadamy idee §YOdkryć§! lub §YEkspansji§!, nasi władcy będą częściej zdobywać cechę „§YEkspansjonista§!”."
 second_circumnavigation_tt: "Drugie państwo, które opłynęło świat dookoła."
 por_presence_in_india_modifier: "Obecność w Indiach"
 desc_por_presence_in_india_modifier: "Nasza obecność w Indiach otwiera przed krajem nowe, niezwykle dochodowe rynki."
 por_center_of_portuguese_trade_modifier: "Portugalskie centrum handlu"
 desc_por_center_of_portuguese_trade_modifier: "Nowe centrum handlu dla portugalskich kupców."
 por_struggle_for_iberia_modifier: "Walka o Iberię"
 desc_por_struggle_for_iberia_modifier: "Wielowiekowa rywalizacja między królestwami Półwyspu Iberyjskiego dobiega końca."
 por_reform_navy_1_modifier: "Wschodząca potęga morska"
 desc_por_reform_navy_1_modifier: "Wieloletnie wspieranie i finansowanie portugalskiej floty, zapoczątkowane jeszcze za czasów Henryka Żeglarza, przyniosło efekty. Dysponujemy teraz najbardziej zaawansowaną technologicznie flotą na świecie."
 por_first_circumnavigation_modifier: "Dziedzictwo pierwszej wyprawy dookoła świata"
 desc_por_first_circumnavigation_modifier: "Nasze statki przemierzyły niegościnne porty i morza daleko poza horyzontem. Chwała odkryć i tradycja morskiej doskonałości należą do nas."
 por_elite_marines_modifier: "Elitarna portugalska piechota morska"
 desc_por_elite_marines_modifier: "Szkolenie naszej piechoty morskiej obejmuje wymagające i surowe ćwiczenia, które zmieniają kadetów marynarki w znakomitych żołnierzy."
 dom_portugal_reform_navy_title: "Reforma floty"
 dom_portugal_reform_navy_desc: "Dom Henrique, książę Viseu i wuj króla Afonso V, zasłynął ze wspierania portugalskich wypraw badawczych wzdłuż wybrzeży Afryki Zachodniej oraz reformy floty. Patronował również budowie nowego typu statku – karaweli."
 pru_golden_age_of_thought_modifier: "Złoty wiek"
 desc_pru_golden_age_of_thought_modifier: "Za panowania [Root.Monarch.GetName] Prusy stały się jednym z dominujących mocarstw Europy, dysponując silną armią i wysoce scentralizowaną administracją. Gospodarka rozkwitła, a kraj zasłynął z osiągnięć w sztuce, filozofii i nauce. [Root.Monarch.GetName], jako mecenas sztuki i nauki, wspierał również rozwój kultury pruskiej."
 pru_palace_of_berlin_modifier: "Pałac berliński"
 desc_pru_palace_of_berlin_modifier: "Pałac berliński to rezydencja królów Prus, a później także cesarzy niemieckich. Wzniesiono go pierwotnie w XVI wieku, a w kolejnych stuleciach wielokrotnie przebudowywano i rozbudowywano. W XVIII wieku, za panowania Fryderyka Wielkiego, pałac zyskał barokową formę."
 pru_victory_lower_saxony_modifier: "Zwycięstwo w Dolnej Saksonii"
 desc_pru_victory_lower_saxony_modifier: "W roku [GetYear] wojska [Root.GetAdjective], dowodzone przez [Root.Monarch.GetName], pokonały armię koalicji Dolnej Saksonii, w skład której wchodziło wiele lokalnych państw. Zwycięstwo pozwoliło Prusom poszerzyć terytorium i umocnić pozycję jednego z głównych mocarstw Europy. Bitwa pokazała skuteczność taktyki i dyscypliny pruskich wojsk, które pokonały liczniejszego i lepiej wyposażonego przeciwnika."
 pru_embed_company_modifier: "Kompania z Emden"
 desc_pru_embed_company_modifier: "Kompania z Emden to przedsiębiorstwo handlowe z siedzibą w niemieckim mieście Emden, odgrywające ważną rolę w handlu z Indiami Wschodnimi. Zajmuje się eksportem przypraw, tkanin i porcelany z Azji do Europy. Rozbudowana sieć faktorii oraz nowatorskie praktyki handlowe pozwoliły jej stać się jedną z największych i odnoszących największe sukcesy kompanii swojej epoki. Pomimo konkurencji ze strony innych europejskich przedsiębiorstw kompania nadal się rozwijała i odegrała istotną rolę w rozwoju niemieckiej gospodarki w XVII i XVIII wieku."
 pru_expanded_the_western_domains_modifier: "Poszerzenie zachodnich posiadłości"
 desc_pru_expanded_the_western_domains_modifier: "W tym okresie Prusy, rządzone przez [Root.Monarch.GetName], dążyły do poszerzenia terytorium zarówno poprzez podboje, jak i działania dyplomatyczne. Dzięki serii wojen i traktatów włączono do państwa Hesję, Palatynat oraz część ziem nad Dolnym Renem. Ekspansja znacznie zwiększyła obszar i potęgę Prus, umacniając ich pozycję jako jednego z głównych mocarstw Europy. Nowe ziemie przyniosły państwu dodatkowe zasoby, ludność i wpływy kulturowe, przyczyniając się do jego dalszego rozwoju."
 PRU_bitter_resistance: "Zaciekły opór teologiczny"
 desc_PRU_bitter_resistance: "Obrona naszej tożsamości religijnej ma dla nas ogromne znaczenie."
 PRU_toleranzedikt: "Edykt tolerancyjny"
 desc_PRU_toleranzedikt: "Nie możemy pozwolić, by nasze państwo padło ofiarą małostkowych sporów religijnych. Aby uniknąć tego nieszczęścia, musimy okazać tolerancję naszym współwyznawcom, nawet jeśli zbłądzili."
 BRA_abolished_kreditwerk: "Zniesiono Kreditwerk"
 desc_BRA_abolished_kreditwerk: "Zniesienie historycznego systemu gospodarczego otwiera drogę do innowacji i rozwoju finansowego naszego państwa."
 BRA_reformed_kreditwerk: "Zreformowano Kreditwerk"
 desc_BRA_reformed_kreditwerk: "Reforma historycznego systemu gospodarczego otwiera drogę do innowacji i rozwoju finansowego naszego państwa."
 PRU_investing: "Inwestycje w gospodarkę"
 desc_PRU_investing: "Różnorodne inwestycje i wsparcie fiskalne mogą znacząco pobudzić naszą gospodarkę, gdy staramy się zrównoważyć budżet."
 PRU_reichsthaler: "Reichsthaler"
 desc_PRU_reichsthaler: "Rzetelne zarządzanie naszym handlem ma kluczowe znaczenie dla funkcjonowania państwa."
 monthly_prussian_militarized_society_1: "Miesięczny przyrost wczesnej pruskiej militaryzacji"
 monthly_prussian_militarized_society_2: "Miesięczny przyrost pruskiej militaryzacji"
 monthly_prussian_militarized_society_3: "Miesięczny przyrost całkowitej pruskiej militaryzacji"
 prussian_militarized_society_1_gain_modifier: "Modyfikator przyrostu wczesnej pruskiej militaryzacji"
 prussian_militarized_society_2_gain_modifier: "Modyfikator przyrostu pruskiej militaryzacji"
 prussian_militarized_society_3_gain_modifier: "Modyfikator przyrostu całkowitej pruskiej militaryzacji"
 ability_prussian_militarization_mechanic_1: "Wczesna pruska militaryzacja"
 ability_prussian_militarization_mechanic_2: "Pruska militaryzacja"
 ability_prussian_militarization_mechanic_3: "Całkowita pruska militaryzacja"
 prussian_militarization_mechanic_1: "Wczesna pruska militaryzacja"
 prussian_militarized_society_1: "Pruska militaryzacja"
 boost_militarization: "Zwiększ militaryzację"
 boost_militarization_desc: "Militaryzacja odegrała kluczową rolę w rozwoju Prus w XVII i XVIII wieku. Za panowania króla Fryderyka Wilhelma I Prusy stały się silnie scentralizowanym państwem, w którym szczególny nacisk kładziono na potęgę wojskową. Król uważał armię za fundament państwa i przeznaczał znaczne środki na szkolenie, organizację oraz wyposażenie pruskich wojsk. Dzięki temu Prusy stały się jednym z najsilniejszych mocarstw Europy, zdolnym skutecznie bronić się przed wrogami i poszerzać swoje terytorium. Pruska armia stała się wzorem dla innych europejskich państw, które szeroko naśladowały jej taktykę i strukturę organizacyjną. Militaryzacja była zatem jednym z głównych czynników, które umożliwiły Prusom awans do grona wielkich mocarstw w XVII i XVIII wieku."
 prussian_militarization_mechanic_2: "Pruska militaryzacja"
 prussian_militarized_society_2: "Pruska militaryzacja"
 prussian_militarization_mechanic_3: "Całkowita pruska militaryzacja"
 prussian_militarized_society_3: "Pruska militaryzacja"
 march_divided_fight_united: "Manewry Scharnhorsta"
 march_divided_fight_united_desc: "Pod koniec XVIII wieku Prusy stosowały na polu bitwy szybkie manewry przegrupowania, które stały się ważnym elementem ich taktyki wojskowej. Żołnierzy szkolono do sprawnego przemieszczania się między pozycjami, aby przechytrzyć przeciwnika i przytłoczyć go siłą uderzenia. Nacisk na szybkość i mobilność pozwalał wojskom pruskim błyskawicznie reagować na zmieniającą się sytuację i wykorzystywać nadarzające się okazje. Takie podejście przyczyniło się do sukcesów armii pruskiej w wielu wojnach i ugruntowało jej opinię jako niezwykle skutecznej oraz sprawnej formacji. Taktykę szybkiego rozmieszczania wojsk uwzględniono później w zrewidowanych regulaminach wojskowych, a z czasem stała się ona jednym ze znaków rozpoznawczych pruskiej sztuki wojennej."
 pru_thunderous_advance_modifier: "Natarcie z impetem"
 desc_pru_thunderous_advance_modifier: "Dzięki szybkiemu rozmieszczaniu wojsk i skoordynowanym manewrom przełamiemy linie przeciwnika i zadamy mu decydujące ciosy."
 rewrite_military_manual: "Reforma regulaminu wojskowego"
 rewrite_military_manual_desc: "Pod koniec XVIII wieku pruscy generałowie przepisali regulaminy wojskowe, dostosowując je do zmian w taktyce i technologii prowadzenia wojny. Zaktualizowali doktryny oraz metody walki, aby lepiej odpowiadały realiom nowych pól bitewnych, na których coraz większą rolę odgrywała broń palna i działania na wielką skalę. Zrewidowane regulaminy kładły większy nacisk na szybkość, mobilność i siłę ognia, a ich celem było zwiększenie skuteczności oraz sprawności armii pruskiej. Zmiany te istotnie przyczyniły się do sukcesów pruskich wojsk w ówczesnych konfliktach i pomogły Prusom ugruntować pozycję dominującego mocarstwa w Europie."
 pru_rewrite_military_manual_modifier: "Nowy regulamin wojskowy"
 desc_pru_rewrite_military_manual_modifier: "Pruscy generałowie z końca XVIII wieku zrewidowali regulaminy wojskowe, dostosowując doktryny i taktykę do zmian na polu bitwy. Nowe regulaminy kładły większy nacisk na szybkość, mobilność i siłę ognia, zwiększając skuteczność armii pruskiej."
 pru_adding_provs_in_empire_tt: "
Podbój prowincji nienależących do §YŚwiętego Cesarstwa Rzymskiego§! zapewni jedną z następujących korzyści:"
 pru_if_non_emp_and_ally_tt: "
Jeśli podbijemy prowincję, będąc sojusznikiem obecnego §Ycesarza§!, zyska on §G3§! zaufania do nas."
 pru_if_non_emp_and_no_ally_tt: "
Jeśli nie jesteśmy sojusznikiem obecnego §Ycesarza§!, za każdą podbitą prowincję spoza Cesarstwa zyskamy §G1§! punktu projekcji siły."
 pru_if_emperor_tt: "
Ponadto, jeśli jesteśmy obecnym §Ycesarzem§!, każda podbita przez nas prowincja spoza Cesarstwa o poziomie rozwoju co najmniej §G25§! zapewni §G1§! punkt autorytetu cesarskiego."
 pru_spread_dev_tt: "
