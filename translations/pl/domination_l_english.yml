 fabricate_tributary_cb: "Sfabrykować roszczenie trybutarne"
 fabricate_tributary_cb_title: "Sfabrykować roszczenie trybutarne"
 fabricate_tributary_cb_desc: "Wydaj §R[Root.GetSpyCostHardCodedTributary]§! punktów sieci szpiegowskiej, aby uzyskać przeciwko temu państwu casus belli „Wymuszenie trybutu”."
 fabricate_tributary_cb_tooltip: "Wykorzystajmy nasz boski mandat i tajne działania, aby podporządkować ich §YCesarzowi Chin§!."
 requires_100_spy_network: "§RNie posiadamy wystarczającej sieci szpiegowskiej, aby przeprowadzić tę akcję.§!"
 we_need_more_dev_tt: "§R- Państwo §Y[From.GetName]§! ma większy łączny rozwój niż państwo §Y[Root.GetName]§!.§!"
 has_force_trib_cb_already_tt: "§R- Państwo §Y[Root.GetName]§! ma już casus belli „§YWymuszenie trybutu§!” przeciwko państwu §Y[From.GetName]§!.§!"
 generic_tt_has_access_to_this_privilege_tt: "Uzyskano dostęp do tego §Yprzywileju stanu§!."
 mng_cornerstone_empire2_title: "Fundament imperium"
 mng_cornerstone_empire2_desc: "Państwo obejmujące tak rozległe obszary nie może obyć się bez kilku wpływowych osobistości na dworze. Aby zapewnić stabilność i sprawne funkcjonowanie administracji, musimy wybrać najlepsze rozwiązanie i odpowiednio rozdzielić władzę."
 mng_censorate2_title: "Cenzorat"
 mng_censorate2_desc: "Jako niezwykle sprawna instytucja naszego rządu musimy dołożyć wszelkich starań, by kontynuować centralizację i zwiększać efektywność biurokracji, dostosowując je do rozmiarów naszego ogromnego państwa."
 mng_promote_grand_coordinators2_title: "Powołanie wielkich koordynatorów"
 mng_promote_grand_coordinators2_desc: "Wielki koordynator, będący w Chinach odpowiednikiem wicekróla i znany jako Xunfu, a w naszym państwie jako Junbu, zajmuje ważne miejsce w administracji. Musimy zadbać o awans zdolnych koordynatorów i zapewnić ich lojalność wobec Cesarza."
 mng_reform_civil_registration2_title: "Reforma rejestracji ludności"
 mng_reform_civil_registration2_desc: "System rządów naszej dynastii od wielu pokoleń nie doczekał się większych zmian. Musimy zatem znaleźć właściwy sposób zarządzania rzeszami poddanych żyjących pod naszymi sztandarami oraz odpowiednio ograniczyć negatywne skutki korupcji i przeciążenia administracji."
 mng_examination_system2_title: "System egzaminacyjny"
 mng_examination_system2_desc: "Po usprawnieniu systemu rządów musimy teraz wybrać dalszy kierunek rozwoju naszego imperium. Centralizacja, przekazanie lokalnej władzy poszczególnym osobistościom czy powierzanie wysokich stanowisk członkom dynastii to tylko niektóre z dróg, które może obrać nasz wielki Cesarz."
 mng_mutual_trade_system2_title: "System wzajemnego handlu"
 mng_mutual_trade_system2_desc: "Demonstrowanie naszej potęgi oraz wymiana darów, przysług i pieniędzy w zamian za ochronę to stosunkowo skuteczny i niezwykle dochodowy układ między naszą wielką dynastią a licznymi państwami satelickimi w naszej strefie wpływów. Nie możemy jednak spocząć na laurach. Powinniśmy dalej rozwijać ten system, odnawiając umowy trybutarne i zawierając nowe porozumienia z sojusznikami spoza naszych granic."
 mng_tame_china_sorrow2_title: "Okiełznać smutek Chin"
 mng_tame_china_sorrow2_desc: "Rzeki są życiodajną siłą chińskiej cywilizacji, zapewniając ludności żyzne ziemie i podstawowe środki do życia. Powodzie, które nawiedzają kraj co kilka dziesięcioleci, stanowią jednak poważne zagrożenie nie tylko dla bytu naszych poddanych, lecz także dla stabilności naszych rządów."
 mng_single_whip_law2_title: "Prawo jednego bata"
 mng_single_whip_law2_desc: "Imperium tak rozległe jak nasze bywa trudne w zarządzaniu i sprawnym opodatkowaniu. W rezultacie część potencjalnych dochodów nie trafia do skarbca. Musimy temu zaradzić, wprowadzając nowy, powszechny podatek uiszczany wyłącznie w srebrze, aby scentralizować politykę podatkową."
 mng_pure_land2_title: "Czysta Kraina"
 mng_pure_land2_desc: "Pomimo sukcesów w sprawach wewnętrznych i zagranicznych nie możemy zaniedbywać duchowego wymiaru naszego państwa. Powinniśmy wznosić odpowiednie miejsca kultu, które odzwierciedlą nasze bogactwo oraz przywiązanie do nauk, dzięki którym osiągnęliśmy dobrobyt."
 mng_shengshi_zhishi2_title: "Seisei i Chisei"
 mng_shengshi_zhishi2_desc: "Dzieje dawnych dynastii, podobnie jak historia naszej własnej, zawsze podlegały zmiennym kolejom losu. Okresy rozkwitu, upadku, zniszczenia i odrodzenia są nieodłączną częścią życia. Nie oznacza to jednak, że nie powinniśmy zrobić wszystkiego, co w naszej mocy, by zapewnić rozwój i sprawne rządy naszej dynastii."
 mng_expand_bogue2_title: "Rozbudowa ujścia Bogue"
 mng_expand_bogue2_desc: "Ujście rzeki w prowincji [667.GetName] jest znane w całym naszym państwie jako tętniący życiem ośrodek handlu oraz transportu cennych towarów i zboża. Musimy nieustannie je rozbudowywać, aby obsłużyć coraz większy przepływ dóbr i zaspokoić rosnące potrzeby naszego ludu."
 mng_jing_hang_grand_canal2_title: "Wielki Kanał Keikou"
 mng_jing_hang_grand_canal2_desc: "Umiejętność ujarzmienia nurtu rzek i powodzi nawiedzających brzegi naszych wielkich rzek okaże się niezbędna, jeśli chcemy przetrwać kolejne stulecia. Powodzie przyczyniły się do powstania i upadku wielu dynastii, które panowały przed nami. Musimy więc podjąć odpowiednie działania, by nasza dynastia nie stała się jedynie krótką wzmianką na kartach historii."
 mng_expand_yongle_dadian2_title: "Encyklopedia Yongle"
 mng_expand_yongle_dadian2_desc: "Rozwój druku i kopiowania dzieł literackich w Chinach jest przełomową techniką, która umożliwia upowszechnianie i zachowywanie wiedzy. Udoskonalając metody naszych przodków, możemy rozpowszechnić największe dzieło encyklopedyczne cesarza Yongle, obejmujące setki tomów wiedzy."
 mng_form_depots2_title: "Utworzenie placówek wywiadowczych"
 mng_form_depots2_desc: "Pomimo mianowania lojalnych poddanych i korzystania z przychylności Niebios ludzie służący naszemu znamienitemu Cesarzowi mogą niekiedy ulegać ludzkim słabościom. Aby temu przeciwdziałać, możemy utworzyć placówki wywiadowcze, które będą obserwować poczynania naszych poddanych i ich wewnętrzne sprawy."
 mng_outer_city_beijing2_title: "Zewnętrzne miasto [1816.GetName]"
 mng_outer_city_beijing2_desc: "Miasto [1816.GetName] od dawna stanowi serce Chin i jest domem dla niezliczonych rzesz naszych poddanych. Wraz ze wzrostem liczby mieszkańców konieczne staje się rozszerzenie planów urbanistycznych i powiększenie przestrzeni życiowej w granicach miasta."
 mng_fortify_coast2_title: "Umocnienie wybrzeża"
 mng_fortify_coast2_desc: "Nasze wybrzeża od dawna padają ofiarą bezwzględnych piratów, którzy rabują dorobek zwykłych mieszkańców, a niekiedy porywają ludność nadbrzeżnych osad i sprzedają ją w niewolę. Taka sytuacja jest całkowicie nie do przyjęcia i wymaga zdecydowanych działań."
 mng_cornerstone_empire3_title: "Fundament imperium"
 mng_cornerstone_empire3_desc: "Państwo obejmujące tak rozległe obszary nie może obyć się bez kilku wpływowych osobistości na dworze. Aby zapewnić stabilność i sprawne funkcjonowanie administracji, musimy wybrać najlepsze rozwiązanie i odpowiednio rozdzielić władzę."
