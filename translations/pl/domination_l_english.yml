 mechanic_buffed_streltsy_button_yes: "Interakcja §YWyposaż strzelców§! zmniejsza koszt uzupełniania strat §Ystrzelców§! o §G-10,0%§! i zwiększa szybkość uzupełniania o §G+10,0%§!."
