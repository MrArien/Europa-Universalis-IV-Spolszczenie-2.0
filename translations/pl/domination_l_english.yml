 mechanic_buffed_strong_duchies_yes: "Przywilej klasy '§YSilne księstwa§!' daje o §G+5.0%§! lojalności więcej"
 mechanic_has_upgraded_holy_wars_yes: "Posiada casus belli §YWielka święta wojna§!."
 mechanic_enables_estate_janissaries_yes: "Włącza klasę §Yjanczarów§!."
 mechanic_disables_estate_janissaries_yes: "Wyłącza klasę §Yjanczarów§!."
 mechanic_has_eyalets_yes: "Umożliwia posiadanie poddanych typu §YEjalet§!."
 mechanic_has_eyalets: "Może posiadać ejalety"
 ottoman_provincial_government_system_reform: "System administracji prowincjonalnej"
 ottoman_provincial_government_system_reform_desc: "Powołując gubernatorów prowincji, usprawniamy pobór podatków i wykorzystywanie pozostałych zasobów. Ambitni namiestnicy mogą wprawdzie poświęcać zbyt wiele czasu intrygom i wewnętrznym sporom, lecz dodatkowe korzyści płynące z naszych posiadłości uzasadniają to ryzyko."
 mechanic_pasha_extra_bonuses_yes: "§YPasze§! zapewniają teraz prowincjom należącym do obcych grup kulturowych §G+20,0%§! lokalnego modyfikatora podatków."
 devshirme_system_reform: "System dewszirme"
 devshirme_system_reform_desc: "Od końca XIV do połowy XVII wieku dynastia osmańska nabywała niewolników dla swoich domowników poprzez prawo rekrutacji janczarów. Starannie wybrane niemuzułmańskie dzieci, zwykle chrześcijanie z Bałkanów w wieku od 12 do 14 lat, byli wysyłani, aby mieszkać z rodzinami tureckimi, aby uczyć się tureckiego i zasad islamu, zanim zostaną sprowadzeni do stolicy imperium. Większość dołączyła do Janczarów, wyszkolonych i zdyscyplinowanych oddziałów regularnej piechoty, a tych, którzy wykazywali cechy przywódcze i zdolności intelektualne, posyłano bezpośrednio do domu sułtana, gdzie byli kształceni i, jeśli im się powiodło, mogli awansować na najwyższe stopnie w osmańskiej elicie wojskowo-administracyjnej. Ponieważ ich środki utrzymania zależały od władcy, ci niewolnicy, znani jako kul, wykazywali wielką lojalność i byli kluczowi dla ustanowienia przez dynastię osmańską scentralizowanej kontroli nad imperium."
 tur_not_has_abolished_devshirme_system_tt: "Nie zniesiono §Ysystemu dewszirme§!."
 tur_eyalet_recruits: "Rekruci z ejaletów"
 desc_tur_eyalet_recruits: "Ejalety państwa [Root.GetUsableName] wysyłają własną młodzież wyznającą obce religie do miasta [Root.Capital.GetName], gdzie przechodzi ona szkolenie i przygotowuje się do służby jako żołnierze państwa [Root.GovernmentName]."
 tur_grand_vizier_modifier: "Wielki wezyr"
 desc_tur_grand_vizier_modifier: "Wielki wezyr jest już utalentowanym mężem stanu, jednak rekruterzy nadal wypatrują innych ludzi o wyjątkowych zdolnościach."
 mechanic_has_harem_events_yes: "Występują §Ywydarzenia związane z haremem§!."
 ottoman_siyasah_tax_reform: "Osmański system podatkowy siyasah"
 ottoman_siyasah_tax_reform_desc: "Osmański system podatkowy siyasah łączy dawne prawa bizantyjskie, wybrane z uwzględnieniem szariatu i islamskiej siyasah. Jego celem jest zapewnienie spójnego i kompleksowego systemu podatkowego obowiązującego w całym imperium."
 ottoman_siyasah_tax_reform_tax: "Osmański system podatkowy siyasah"
 desc_ottoman_siyasah_tax_reform_tax: "Ta prowincja podlega kodeksowi prawnemu siyasah i musi płacić podatek na rzecz waqfu."
 ottoman_siyasah_tax_reform_manpower: "Osmański system podatkowy siyasah"
 desc_ottoman_siyasah_tax_reform_manpower: "Ta prowincja podlega kodeksowi prawnemu siyasah i musi płacić daninę krwi na rzecz systemu dewszirme."
 mechanic_more_25_tax_in_true_faith_provinces_yes: "Prowincje wyznające prawdziwą wiarę otrzymują §G+25,0%§! lokalnego modyfikatora podatków."
 mechanic_more_15_manpower_in_heathen_provinces_yes: "Prowincje wyznające obcą religię otrzymują §G+15,0%§! lokalnego modyfikatora zasobów ludzkich."
 mechanic_no_crownland_money_loss_to_age_yes: "Dochód w dukatach ze §YSprzedaży tytułów§! nie jest już zmniejszany wraz z kolejnymi epokami."
 modernized_ottoman_government: "Zmodernizowany rząd osmański"
 modernized_ottoman_government_desc: "Zreformowana forma rządu osmańskiego. Wiele istotnych wad klasycznego ustroju zostało usuniętych, a władza sułtana uległa wzmocnieniu."
 reorganized_ottoman_government: "Zreorganizowany rząd osmański"
 reorganized_ottoman_government_desc: "Zreformowana forma rządu osmańskiego. Wiele istotnych wad klasycznego ustroju zostało usuniętych, a władza sułtana uległa wzmocnieniu. Z powodu braku haremu rząd osmański bardziej przypomina klasyczną zachodnią monarchię absolutną."
 eyalet_government: "Rząd ejaletu"
 eyalet_government_desc: "Ejalet to szczególna jednostka administracyjna pozostająca pod czujnym nadzorem rządu osmańskiego. Jako prowincje pograniczne ejalety mają za zadanie nadzorować region w imieniu sułtana."
 barbary_eyalet_government: "Rząd ejaletu berberyjskiego"
 barbary_eyalet_government_desc: "Ejalet berberyjski to jednostka administracyjna obejmująca poddanych Imperium Osmańskiego z Maghrebu lub państwa pirackie. Zarządzając podległym terytorium, prowadzi również najazdy na wybrzeża."
 EYALET: "Ejalet"
 DEY: "Dej"
 BEYLERBEY: "Bejlerbej"
 ottoman_conscription_reform: "Osmański pobór"
 ottoman_conscription_reform_desc: "Wraz z końcem systemu dewszirme, pobór do armii osmańskiej został odnowiony. Czerpiąc inspirację z europejskich systemów rekrutacji, osmański pobór werbował żołnierzy z każdej wioski i miasta."
 standardized_millets_reform: "Standaryzowane millety"
 standardized_millets_reform_desc: "Millety Imperium Osmańskiego to zbiór islamskich zasad dotyczących traktowania niemuzułmanów w imperium. W przeszłości zasady te były niejednolite, a ich reforma ujednoliciła traktowanie pogan i wprowadziła dodatkowe przepisy dotyczące administracji domeną."
 organized_military_staff_reform: "Zorganizowany personel wojskowy"
 organized_military_staff_reform_desc: "Utrzymując dynamiczną organizację budżetu wojskowego i utrzymując koordynację personelu wojskowego, możemy zapewnić, że straty pułków będą łatwiejsze do odzyskania."
 military_engineering_reform: "Inżynieria wojskowa"
 military_engineering_reform_desc: "Wojnę wygrywa się nie tylko dzięki dyscyplinie naszych żołnierzy, ale także dzięki jakości naszego sprzętu wojskowego. Nasza doktryna powinna skupiać się na wykorzystaniu lepszych modeli artylerii, które są tańsze w utrzymaniu."
 defensive_stance_reform: "Postawa obronna"
 defensive_stance_reform_desc: "Nasza największa siła nie leży w naszych zdolnościach ofensywnych, ale w naszej zdolności do utrzymania obrony. Pozwolenie wrogom na rozbijanie się o nasze mury będzie naszym zwycięstwem."
 sustained_discipline_reform: "Dyscyplina"
 sustained_discipline_reform_desc: "Bardzo ważne jest, aby nasi żołnierze nie stracili dyscypliny w trakcie bitwy. Tylko dzięki musztrze możemy zapewnić naszym ludziom przetrwanie."
 cavalry_warfare_reform: "Wojna kawalerii"
 cavalry_warfare_reform_desc: "Kawaleria jest mobilną siłą naszej armii i służy jako oddziały uderzeniowe w walce. Nasze wojsko koncentruje się na zwiększeniu jej wykorzystania i integracji z naszymi pułkami."
 amphibious_specialization_reform: "Wyspecjalizowane amfibie"
 amphibious_specialization_reform_desc: "Wojny, które prowadzimy, wygrywamy nie tylko na lądzie, ale także na morzu. W związku z tym nasze wojska muszą być przygotowane do działania jako jednostka morska, gotowa do uderzenia w obronę wybrzeża naszych wrogów."
 mechanic_marine_buff_yes: "§YPiechota morska§! otrzymuje następującą premię:\nZużycie zasobów ludzkich pułku: §G-20.0%§!"
 amphibious_specialization_reform_modifier: "Wyspecjalizowane amfibie"
 desc_amphibious_specialization_reform_modifier: "Wojny, które prowadzimy, wygrywamy nie tylko na lądzie, ale także na morzu. W związku z tym nasze wojska muszą być przygotowane do działania jako jednostka morska, gotowa do uderzenia w obronę wybrzeża naszych wrogów."
 mercenary_leadership_reform: "Przywódcy najemników"
 mercenary_leadership_reform_desc: "Choć mamy własną armię, lepiej pozwolić najemnikom poprowadzić szarżę do walki. W najlepszym wypadku ich wiedza przyniesie nam zwycięstwo, a w najgorszym ich ciała ochronią naszych ludzi podczas bitwy."
 maritime_military_reform: "Profesjonalizm marynarki wojennej"
 maritime_military_reform_desc: "Żyjemy lub umieramy dzięki naszej zdolności do zabezpieczania otaczających nas wód. Marynarka wojenna jest najsilniejszym zasobem naszego wojska i jako taka stosuje wiele koncepcji profesjonalizmu i wojskowej finezji w odniesieniu do naszych sił morskich."
 wei_suo_system_reform: "System wei-suo"
 wei_suo_system_reform_desc: "Stopień żołnierza jest dziedziczny. Żołnierze są grupowani w gwardie (wei) i bataliony (suo). Ponieważ co piąte gospodarstwo domowe musi dostarczyć jednego żołnierza do armii, naszym siłom zbrojnym nie powinno zabraknąć zdolnych ludzi do walki na froncie."
 mechanic_improved_military_buildings_yes: "§YKoszary§! i §YPola ćwiczeń§! zapewniają §G+15,0%§! / §G+30,0%§! lokalnego przyrostu garnizonu.
§YObozy pułkowe§! i §YOśrodki poborowe§! zapewniają §G+25,0%§! / §G+50,0%§! lokalnej wielkości garnizonu.
§YGospodarstwa żołnierskie§! zapewniają §G-50,0%§! lokalnego czasu rekrutacji."
 wei_suo_system_reform_barracks_modifier: "System wei-suo"
 desc_wei_suo_system_reform_barracks_modifier: "Ta prowincja podlega systemowi wei-suo."
 wei_suo_system_reform_training_fields_modifier: "System wei-suo"
 desc_wei_suo_system_reform_training_fields_modifier: "Ta prowincja podlega systemowi wei-suo."
 wei_suo_system_reform_regimental_camp_modifier: "System wei-suo"
 desc_wei_suo_system_reform_regimental_camp_modifier: "Ta prowincja podlega systemowi wei-suo."
 wei_suo_system_reform_conscription_center_modifier: "System wei-suo"
 desc_wei_suo_system_reform_conscription_center_modifier: "Ta prowincja podlega systemowi wei-suo."
 wei_suo_system_reform_soldier_households_modifier: "System wei-suo"
 desc_wei_suo_system_reform_soldier_households_modifier: "Ta prowincja podlega systemowi wei-suo."
 eight_banners_reform: "Osiem Chorągwi"
 eight_banners_reform_desc: "Osiem Chorągwi to wojskowy i administracyjny podział naszego państwa. Choć system ten służy przede wszystkim organizacji armii, stanowi również podstawę innych instytucji państwowych."
 eight_banners_reform_modifier: "Osiem Chorągwi"
 desc_eight_banners_reform_modifier: "Prowincja korzysta z systemu Ośmiu Chorągwi."
 mechanic_eight_banners_buff_yes: "§YChorągwie§! otrzymują §G+33,0%§! szybkości uzupełniania strat i §G-10,0%§! wyniszczenia."
 green_standard_army_reform: "Armia Zielonego Sztandaru"
 green_standard_army_reform_desc: "Armia Zielonego Sztandaru jest cesarską armią naszego państwa. Początkowo składała się z oddziałów dezerterów, lecz obecnie stanowi główną siłę zbrojną i policyjną państwa."
 mechanic_manpower_from_capturing_forts_yes: "Zdobycie wrogiego fortu zapewnia zasoby ludzkie odpowiadające §G0,1 roku§! przyrostu na każdy poziom fortu. Efekt może wystąpić dla danego fortu tylko raz na §Y5 lat§!."
 mechanic_manpower_from_defeating_armies_yes: "Zwycięstwo w bitwie zapewnia zasoby ludzkie równe §G10%§! liczby żołnierzy przeciwnika poległych w walce."
 ashigaru_reform: "Pułki ashigaru"
 ashigaru_reform_desc: "Powszechność konfliktów i wojen w Japonii okresu Sengoku doprowadziła do powstania nowej klasy wojowników – ashigaru. Byli oni chłopami, a więc formalnie nie należeli do samurajów, lecz łatwiejszy dostęp do ich usług sprawił, że stali się podstawą każdej armii. Uzbrojeni we włócznie, łuki i miecze, dzięki stałej obecności na polu bitwy zajęli miejsce pomiędzy chłopami a samurajami, a niekiedy zaliczano ich nawet do niższych warstw stanu samurajskiego. Ich znaczenie wzrosło szczególnie po wprowadzeniu tanegashimy teppō – japońskiej odmiany arkebuza lontowego. Łatwiejsza nauka obsługi tej broni w porównaniu z łukiem oraz przewaga liczebna ashigaru nad samurajami sprawiły, że uzbrojeni w broń palną ashigaru stali się trzonem japońskich armii."
 early_bushido_code_reform: "Wczesny kodeks bushidō"
 early_bushido_code_reform_desc: "Bushidō to kodeks moralny określający postawę, zachowanie i styl życia samurajów. Choć w kolejnych stuleciach zyskał niemal mityczny status, jego podstawowe zasady towarzyszyły samurajom od samego początku."
 early_bushido_modifier: "Wczesny kodeks bushidō"
 desc_early_bushido_modifier: "Obowiązują nas zasady wczesnego kodeksu bushidō."
 the_righteous_army_reform: "Armia Sprawiedliwych"
 the_righteous_army_reform_desc: "Nasze państwo mierzy się z wieloma śmiertelnymi zagrożeniami na granicach. Wola naszego ludu niełatwo jednak ulega złamaniu. Wrogie wojska, które wkroczą na nasze ziemie, odczują gniew Armii Sprawiedliwych – nieustępliwej milicji, która pokona przeciwników dzięki wojnie podjazdowej."
 the_righteous_army: "Armia Sprawiedliwych"
 desc_the_righteous_army: "Żaden wróg na tyle głupi, by nas zaatakować, nie opuści naszych ziem żywy. Sami chłopi staną w obronie ojczyzny, wykorzystując wszystkie dostępne środki!"
 kor_righteous_army_ct: "Umożliwia rekrutację kompanii najemników §JArmia Sprawiedliwych§! podczas wojen obronnych.
Zatrudnienie tej kompanii nie kosztuje profesjonalizmu armii, lecz zostaje ona rozwiązana w czasie pokoju."
 the_righteous_army_tt: "do czasu zawarcia pokoju"
 mechanic_has_righteous_army_yes: "Może wezwać §YArmię Sprawiedliwych§! podczas wojen obronnych."
 mansabdari_system_reform: "System mansabdari"
 mansabdari_system_reform_desc: "Mansabdar jest jednostką wojskową naszej administracji. Szlachcie nadaje się prawa do ziemi w zamian za służbę wojskową i administracyjną. W przeciwieństwie do innych formacji szlacheckich mansabdarowie podlegają bezpośrednio monarsze."
 mechanic_enable_mansabdar_privileges_yes: "Odblokowuje §Yprzywileje mansabdarskie§! dla stanu szlacheckiego."
 rajput_military_leadership_reform: "Dowództwo wojskowe radźputów"
 rajput_military_leadership_reform_desc: "Radźputowie dowiedli swoich wyjątkowych zdolności. Powierzając im stanowiska dowódcze w naszej armii, możemy zapewnić sobie ich lojalność i umiejętności podczas nadchodzących bitew."
 the_maratha_army_reform: "Armia marathów"
 the_maratha_army_reform_desc: "Marathowie to kasta wojowników, których dyscyplina zapewnia im niezrównane umiejętności wojskowe. Powołując armię marathów, uwolnimy ich pełny potencjał przeciwko naszym wrogom, przyznając im w zamian dodatkowe wpływy."
 subutais_strategies_reform: "Strategie Subutaja"
 subutais_strategies_reform_desc: "Subutaj był generałem i strategiem wojskowym samego Czyngis-chana. Jego nauki i wskazówki dotyczące wykorzystania machin oblężniczych są legendarne i stanowią obecnie część naszej doktryny wojskowej."
 ahmudan_system_reform: "System ahmudan"
 ahmudan_system_reform_desc: "System ahmudan („służba koronna”) to forma poboru, w której lokalni gubernatorzy dostarczają armii określoną z góry liczbę ludzi. W zamian gubernatorzy i ich prowincje zostają zwolnieni z większości podatków, zobowiązując się do służby wojskowej."
 mechanic_ahmudan_system_yes: "Podczas wojny zapewnia §G-10,0%§! globalnego kosztu pułków i §G+20,0%§! szybkości odzyskiwania zasobów ludzkich.
Podczas wojny obronnej zapewnia dodatkowo §G+7,5%§! morale armii, §G+15,0%§! obrony fortów i §G+10,0%§! szybkości odzyskiwania zasobów ludzkich."
 ability_ahmudan_mechanic: "Interakcje systemu ahmudan"
 ahmudan_system_attacker: "System ahmudan: atakujący"
 ahmudan_system_defender: "System ahmudan: obrońca"
 ghazi_reform: "Wojownicy ghazi"
 ghazi_reform_desc: "Ghazi to najeźdźcy zabezpieczający awangardę naszych wojsk. Walcząc w imieniu władcy przeciwko niewiernym, oddziały ghazi przyciągają tych, którzy szukają chwały, bogactwa i zbawienia na polu bitwy."
 the_cawa_regiments_reform: "Nadanie przywilejów Cawa"
 the_cawa_regiments_reform_desc: "Cawa służą państwu jako zawodowi żołnierze armii cesarskiej. Przyznając im dodatkowe przywileje, możemy zapewnić sobie ich lojalność wobec państwa oraz wsparcie w realizacji naszych ambicji niezwiązanych z wojskiem."
 mechanic_enables_estate_cawa_yes: "Odblokowuje stan §YCawa§!."
 mechanic_disables_estate_cawa_yes: "Usuwa stan §YCawa§!."
 mechanic_buff_cawa_yes: "§YCawa§! otrzymują §G-10,0%§! otrzymywanych obrażeń od ognia."
 the_cawa_regiments_reform_modifier: "Przywileje dla Cawa"
 desc_the_cawa_regiments_reform_modifier: "Przywileje nadane formacji cawa wzmacniają jej pozycję w armii cesarskiej."
 tercio_reform: "Kompania tercio"
 tercio_reform_desc: "Weterani naszych armii, którzy służyli na obcych terytoriach, zostają połączeni w jedną formację – tercio. Dzięki zaawansowanym szykom bojowym, nowej taktyce i zawodowym żołnierzom stanowiącym jej trzon, tercios zapewniają naszej armii budzącą postrach reputację."
 fuero_militar_reform: "Fuero militar"
 fuero_militar_reform_desc: "Przyznając członkom wojska szczególne przywileje, możemy zapewnić naszym żołnierzom morale i lojalność na polu bitwy. Przywileje te określa fuero militar."
 ordennancas_reform: "Ordenanças"
 ordennancas_reform_desc: "Ordenanças to terytorialna organizacja typu milicyjnego. Jej celem jest zapewnienie portugalskiej ludności ram organizacyjnych służby wojskowej oraz stworzenie jednolitego, ogólnokrajowego systemu profesjonalizacji armii portugalskiej."
 mechanic_can_raise_manpower_from_home_region_yes: "Odblokowuje decyzję „§YZbierz oddziały ordenanças§!”, która pozwala pozyskiwać zasoby ludzkie i marynarzy z prowincji położonych w pobliżu stolicy."
 revive_the_almogavars_reform: "Przywróć almogawarów"
 revive_the_almogavars_reform_desc: "Almogawarowie to lekkozbrojna piechota wyspecjalizowana w krótkich potyczkach i najazdach na terytorium wroga. Ich lekkie uzbrojenie pozwala im szybko uderzyć i wycofać się, zanim przeciwnik zdoła przegrupować siły. Almogawarowie utracili znaczenie wraz z zakończeniem rekonkwisty, lecz wobec nowych zagrożeń ich umiejętności ponownie stają się potrzebne."
 mechanic_has_improved_almogavars_yes: "Umożliwia rekrutację kompanii najemników §Yalmogawarów§!.
Kompania almogawarów składa się wyłącznie z piechoty i jej wynajęcie nie obniża §Yprofesjonalizmu armii§!."
 volunteers_of_the_faith_reform: "Ochotnicy Wiary"
 volunteers_of_the_faith_reform_desc: "Berberowie z plemienia Zenata, wygnani z sułtanatu Maroka, służą emiratowi jako pierwsza linia obrony przed chrześcijańskim zagrożeniem. Ci pobożni wojownicy zgłosili się na ochotnika, ponieważ obronę naszych ziem uważają za swój święty obowiązek."
 can_rally_volunteers_from_allies: "Odblokowuje decyzję „§YZbierz Ochotników Wiary§!”, zapewniającą §G+4,0%§! szybkości odzyskiwania zasobów ludzkich za każdego sojusznika lub poddanego wyznającego naszą religię. Premia może osiągnąć maksymalnie §G+20,0%§!."
 mechanic_can_rally_volunteers_from_allies_yes: "Odblokowuje decyzję „§YZbierz Ochotników Wiary§!”, zapewniającą §G+4,0%§! szybkości odzyskiwania zasobów ludzkich za każdego sojusznika lub poddanego wyznającego naszą religię. Premia może osiągnąć maksymalnie §G+20,0%§!."
 condottieri_contracts_reform: "Kontrakty kondotierów"
 condottieri_contracts_reform_desc: "Stałe armie są raczej wyjątkiem niż regułą. Nasze państwo musi więc polegać na najemnikach, którzy stanowią jego siłę zbrojną. Dzięki rozszerzonym kontraktom kondotierskim możemy zapewnić państwu lojalność zawodowych żołnierzy."
 compagnie_dordonnance_reform: "Compagnie d'ordonnance"
 compagnie_dordonnance_reform_desc: "Compagnie d'ordonnance powstała w wyniku działań Stanów Generalnych, które ograniczyły werbunek wojsk do samego władcy. Byli najemnicy dołączyli do kompanii, która obecnie służy państwu jako pierwsza stała armia."
 musketeers_reform: "Muszkieterowie gwardii"
 musketeers_reform_desc: "Muszkieterowie stanowią elitarną formację bojową dworu królewskiego. Służba w ich szeregach jest wielkim zaszczytem, a do kompanii mogą wstąpić wyłącznie szlachcice z wieloletnim doświadczeniem wojskowym."
 mechanic_unlock_musketeer_privileges_yes: "Odblokowuje przywileje dla stanu §Yszlacheckiego§!, które wpływają na skuteczność §Ymuszkieterów§!."
 general_war_commissariat_reform: "Generalny komisariat wojenny"
 general_war_commissariat_reform_desc: "Generalny komisariat wojenny stanowi biurokratyczne zaplecze naszych sił zbrojnych. Wielu jego członków to junkrzy pełniący funkcje doradców i generałów komisariatu."
 doppelsoldner_reform: "Elitarni najemnicy"
 doppelsoldner_reform_desc: "Nasze państwo kładzie duży nacisk na korzystanie z usług najemników. Tam, gdzie inni używają stałych armii, my mamy trwały kontrakt z wieloma profesjonalnymi i dobrze wyposażonymi najemnikami."
 swiss_mercenary_reform: "Szwajcarscy najemnicy"
 swiss_mercenary_reform_desc: "Szwajcarzy mają długą tradycję służby najemnej w armiach różnych królestw i imperiów. Dzięki profesjonalizmowi i dyscyplinie szwajcarscy najemnicy stali się wzorem dla każdego szanującego się żołnierza."
 reformed_roman_legion_reform: "Zreformowany legion rzymski"
 reformed_roman_legion_reform_desc: "Legioniści rzymscy, niegdyś chluba Imperium Rzymskiego, pozostali jedynie wspomnieniem. Powróćmy do dawnych tradycji i taktyk naszego dziedzictwa, reformując legion rzymski, aby ponownie mógł stawić czoła wrogom Rzymu."
 boyars_army_reform: "Służba wojskowa bojarów"
 boyars_army_reform_desc: "Choć korona i bojarzy wielokrotnie przez lata popadali w konflikty, bojarzy pozostają lojalni wobec obrony ojczyzny. Służąc jako wojsko ziemskie i rynda, zapewnią bezpieczeństwo naszemu państwu."
 mechanic_unlock_boyars_military_privileges_yes: "Odblokowuje przywileje dla stanu §Yszlacheckiego§!, które wpływają na naszą piechotę i kawalerię."
 streltsy_reform: "Utworzenie strzelców"
 streltsy_reform_desc: "Strzelcy to skuteczna formacja piechoty uzbrojonej w broń palną, walcząca w zwartych szykach. Jej instytucjonalizacja pozwoli nam zagwarantować stały dostęp do jej usług."
 new_order_regiments_reform: "Pułki nowego wzoru"
 new_order_regiments_reform_desc: "Pułki nowego wzoru są pierwszą próbą westernizacji szkolenia wojskowego w naszym kraju. Składają się z piechoty, kawalerii i artylerii, reprezentując ewolucję naszych wojsk lądowych."
 expanded_devshirme_system_reform: "Rozszerzony system dewszirme"
 expanded_devshirme_system_reform_desc: "System dewszirme opiera się na starannej selekcji niemuzułmańskich dzieci przeznaczonych do służby w janczarach. Zasada ta pozostaje niezmieniona, lecz znacznie poszerzono przedział wiekowy nowych rekrutów, aby zwiększyć liczbę potencjalnych żołnierzy janczarskich."
 tur_devshirme_recruitment: "Rozbudowa systemu dewszirme"
 desc_tur_devshirme_recruitment: "System dewszirme charakteryzuje się staranną selekcją nie-muzułmańskich dzieci do janczarów. Chociaż nadal jest to prawdą, przedział wiekowy dla nowych rekrutów został znacznie poszerzony na korzyść większej liczby potencjalnych żołnierzy dla janczarów. W rezultacie koszt i czas potrzebny do zastąpienia jednego poległego janczara jest znacznie niższy."
 reformed_ottoman_conscription_reform: "Pobór do sekbanów"
 reformed_ottoman_conscription_reform_desc: "Wraz z końcem systemu dewszirme większą rolę w naszej armii zaczęli odgrywać sekbanowie – tymczasowi najemnicy piechoty i rekruci wywodzący się z chłopstwa."
 mansure_army_reform: "Armia mansure"
 mansure_army_reform_desc: "Armia mansure („Zwycięscy Żołnierze Mahometa”) to wielka armia Imperium Osmańskiego powstała po rozwiązaniu korpusu janczarów. W przeciwieństwie do skorumpowanych janczarów jej żołnierze opierają się na dyscyplinie, europejskiej wiedzy wojskowej, musztrze i lojalności wobec sułtanatu."
 janissary_military_reform: "Zreformowani janczarzy"
 janissary_military_reform_desc: "Janczarzy ponownie stanowią trzon sił zbrojnych państwa. Są gotowi ukorzyć się przed sułtanem w zamian za oficjalne uznanie ich za stan w ramach rządu osmańskiego."
 mechanic_can_revoke_janissary_privileges_yes: "Może ręcznie odbierać przywileje §Yjanczarom§!."
 fiqh_laws_reform: "Prawo fiqh"
 fiqh_laws_reform_desc: "Fiqh to wiedza o zasadach prawa islamskiego wywodzących się z jego źródeł. Prawo fiqh stanowi zatem rezultat skodyfikowania przepisów Koranu w naszym własnym kodeksie prawnym."
 sufism_decree_reform: "Dekret suficki"
 sufism_decree_reform_desc: "Sufizm to zbiór praktyk i sposób myślenia skupiający się na duchowym i rytualnym wymiarze islamu. Wiele jego tradycji i wpływów przeniknęło do naszego rządu."
 mechanic_same_religion_subject_bonus_yes: "Wasale, marchie i ejalety wyznające naszą religię otrzymują §G+25,0%§! zasobów ludzkich w prowincjach prawdziwej wiary, §G+25,0%§! globalnego modyfikatora marynarzy oraz §G+15,0%§! wydajności produkcji."
 mechanic_unlock_ottoman_holy_orders_yes: "Odblokowuje święty zakon §YMevlevi§! dla wyznawców §Yislamu sunnickiego§! i §Yibadyzmu§!.
Odblokowuje święty zakon §YBektashi§! dla wyznawców §Yislamu szyickiego§! i §Yibadyzmu§!."
 same_religion_subject_bonus_mod: "Prawo fiqh"
 war_economy_reform: "Gospodarka wojenna"
 war_economy_reform_desc: "Bezpieczeństwo ekonomiczne państwa opiera się na naszej zdolności do prowadzenia i wygrywania wojen. Fabryki w naszym państwie nie mają innego celu niż napędzanie naszych ambicji militarnych."
 mechanic_enables_estate_eunuchs_yes: "Włącza klasę §Yeunuchów§!."
 mechanic_disables_estate_eunuchs_yes: "Wyłącza klasę §Yeunuchów§!."
 tysyatsky_reform: "Urząd tysiackiego"
 tysyatsky_reform_desc: "Tysiaccy byli dowódcami wojskowymi z czasów Rusi Kijowskiej, odpowiedzialnymi za armię ochotniczą. W wielu państwach wschodniosłowiańskich zostali zastąpieni przez wojewodów i namiestników, lecz w niektórych nadal pełnią funkcje sądowe lub handlowe."
 namestnik_reform: "Urząd namiestnika"
 namestnik_reform_desc: "Namiestnik to stanowisko w administracji państwowej, które można porównać do urzędu wicekróla. Odpowiada za lokalną administrację naszych prowincji i państw."
 oprichnina_reform: "Oddziały opryczniny"
 oprichnina_reform_desc: "Oprycznina to formacja policyjna zajmująca się sprawami wewnętrznymi, której zadaniem jest prześladowanie wszelkich niebezpiecznych grup w państwie. Oprycznicy służą wyłącznie samemu władcy."
 vodka_of_the_crown_reform: "Wódka koronna"
 vodka_of_the_crown_reform_desc: "Wódka jest tradycyjnym napojem alkoholowym naszego ludu. Przejmując bezpośrednią kontrolę nad jej produkcją i ustanawiając monopol na ten trunek, możemy również umocnić władzę nad masami dzięki taniej wódce."
 grain_vodka_bonus_prod: "Produkcja wódki"
 desc_grain_vodka_bonus_prod: "Ta prowincja wykorzystuje zboże do produkcji wartościowej wódki."
 mechanic_extra_trade_goods_from_grain_yes: "Każda posiadana prowincja produkująca §Yzboże§! otrzymuje następujące premie:
Lokalna wydajność produkcji: §G+125,0%§!
Lokalne niezadowolenie: §G-1,00§!."
 governing_senate_reform: "Senat rządzący"
 governing_senate_reform_desc: "Senat rządzący jest zgromadzeniem najbardziej zaufanych doradców władcy oraz najwyższą instytucją ustawodawczą, sądowniczą i wykonawczą imperium. W przeciwieństwie do swojego poprzednika, Dumy Bojarskiej, senat zajmuje się sprawami wszystkich stanów i senatorów."
 enforced_autocracy_reform: "Wymuszona autokracja"
 enforced_autocracy_reform_desc: "Władza cesarza jest absolutna i nie może być podporządkowana nikomu innemu. Stany i pozostałe instytucje państwowe podlegają cesarzowi."
 mechanic_can_sell_crownland_to_single_estates_yes: "Może sprzedawać tytuły wybranemu stanowi."
 mechanic_can_seize_crownland_of_single_estates_yes: "Może odbierać ziemię wybranemu stanowi."
 holy_synod_reform: "Najświętszy Synod Rządzący"
 holy_synod_reform_desc: "Władza patriarchatu zbyt długo pozostawała niezależna od cesarza. Powołanie Najświętszego Synodu sprawia, że sprawy Kościoła stają się sprawami państwa, a patriarchat zostaje de facto zniesiony."
 strengthened_the_patriarchy_reform: "Wzmocniony patriarchat"
 strengthened_the_patriarchy_reform_desc: "Państwo i Kościół są odrębnymi podmiotami, z których każdy realizuje własne cele, nie ingerując w sprawy drugiego. Wolność patriarchatu zostaje podkreślona poprzez szereg reform państwowych."
 head_of_the_patriarchy_reform: "Zwierzchnik patriarchatu"
 head_of_the_patriarchy_reform_desc: "Państwo i Kościół tworzą jedną, nierozerwalną całość. Absolutne rządy cesarza znajdują oparcie w patriarchacie."
 peters_government_reform: "Tabela rang"
 peters_government_reform_desc: "Imperium potrzebuje silnej władzy wolnej od ambicji i intryg bojarów. Tabela rang przebudowuje hierarchię szlachecką, nagradzając zasługi w wojsku, biurokracji i innych dziedzinach administracji. Szlachta zostaje związana z cesarzem poprzez osobistą służbę."
 ruthenian_tsardom: "Carstwo ruskie"
 ruthenian_tsardom_desc: "Nasze państwo jest zreformowanym carstwem Rusi Kijowskiej. Pod wpływem dziedzictwa cesarstwa rzymskiego i Kościoła prawosławnego car Rusi Kijowskiej ma święty obowiązek chronić ludność wschodniosłowiańską przed zagrożeniami zewnętrznymi."
 great_russian_republic_reform: "Wielka Federacja Rosyjska"
 great_russian_republic_reform_desc: "Nasze państwo jest nowoczesną federacją kilku wieców, które przysięgły wierność Republice Rosyjskiej. Zachodnie idee i nowoczesne zasady kształtują kulturę rządzenia."
 appanage_reform: "Udzielne księstwo"
 appanage_reform_desc: "Państwo rządzone przez przedstawiciela bocznej linii dynastii swojego suwerena."
 sultanate_of_rum_reform: "Sułtanat Rum"
 sultanate_of_rum_reform_desc: "Rząd Rum został przywrócony pod panowaniem nowej dynastii. Czerpiąc inspirację z Osmanów i Bizantyjczyków, nowy sułtanat zreformował dawne instytucje, aby nie powtórzyć błędów upadłych imperiów."
 beylik_government: "Bejlik"
 beylik_government_desc: "Nasze państwo jest jednym z wielu państw sukcesyjnych sułtanatu Seldżuków. To od nas zależy odzyskanie ziem dawnego imperium i kontynuowanie dziedzictwa Seldżuków."
 al_andalusia_government: "Sułtanat Al-Andalus"
 al_andalusia_government_desc: "Rząd Al-Andalus wykazuje szczególne zainteresowanie mecenatem sztuki i nauki. W przeciwieństwie do wielu innych muzułmańskich sułtanatów państwo jest bardziej otwarte na idee sufizmu."
 russian_empire_reform: "Imperium Rosyjskie"
 russian_empire_reform_desc: "Zreformowane państwo narodu rosyjskiego. W przeciwieństwie do poprzedzającego je carstwa, reforma imperialna czerpie inspirację z zachodnich systemów rządów w kwestiach ustawodawstwa."
 mechanic_has_hangeul_alphabet_decisions_yes: "Dostępne są decyzje związane z §Yalfabetem hangul§!."
 korean_monarchy: "Królestwo Pustelników"
 korean_monarchy_desc: "Nasze państwo koncentruje się na wewnętrznym rozwoju kraju i zarządzaniu sprawami własnego ludu. Zdobycze terytorialne są pożądane, lecz nie stanowią konieczności."
 separation_of_boyars_from_court_reform: "Odsunięcie bojarów od dworu"
 separation_of_boyars_from_court_reform_desc: "Bojarzy stanowią potężną frakcję w naszym państwie, a zarazem zagrożenie dla stabilności dworu i korony. Odsuwając ich od kluczowych stanowisk, możemy dopilnować, by państwu służyli wyłącznie najbardziej lojalni i nieskłonni do stawiania żądań poddani."
 feudal_france_reform: "Francuski feudalizm"
 feudal_france_reform_desc: "Feudalizm silnie wpływa na sprawy francuskiego dworu. Potężni możnowładcy oraz autonomiczni, zdecentralizowani poddani cieszą się bezprecedensową swobodą i wpływem na administrację wewnętrzną."
 mechanic_has_appanages_yes: "Posiada poddanych typu §Yudzielne księstwo§!."
 absolutist_france_reform: "Francuska monarchia absolutystyczna"
 absolutist_france_reform_desc: "Państwo góruje nad różnymi stronnictwami na dworze. Dzięki scentralizowanej władzy i ostatecznemu głosowi monarchy we wszystkich sprawach udało nam się wreszcie zerwać z feudalną przeszłością."
 gendarmes_reform: "Żandarmi"
 gendarmes_reform_desc: "Potężny korpus ciężkiej kawalerii szlacheckiego pochodzenia, słynący z niszczycielskich szarż i wysokiego morale."
 ways_of_perfectionism_reform: "Droga perfekcjonizmu"
 ways_of_perfectionism_reform_desc: "Dzięki biurokratycznemu charakterowi konfucjanizmu nasza administracja może skupić się na jednym aspekcie rozwoju państwa i doprowadzić go do perfekcji."
 devshirme_assign_local_pashas_at: "Każda posiadana prowincja wyznająca §Yobcą religię§! otrzymuje następujące efekty:"
 elective_monarchy_reform: "Monarchia elekcyjna"
 elective_monarchy_reform_desc: "Monarchie elekcyjne wybierają swojego następcę, zamiast dochodzić do władzy poprzez prawo sukcesji. Szlachta może zaproponować kandydata z obcej dynastii, z własnego grona lub innych członków rodziny królewskiej."
 mechanic_has_ruler_election_yes: "Rozpoczyna się §Yelekcja§! gdy nowy władca wstępuje na tron"
 mechanic_has_improved_ruler_election_yes: "Zwiększ umiejętności kandydatów podczas §Yelekcji§!"
 mechanic_cheaper_coastal_province_core_yes: "Prowincje nadbrzeżne wymagają §G-10,0%§! zdolności administracyjnej, a ich przekształcenie w prowincje narodowe kosztuje §G-25,0%§! mniej."
 british_monarchy: "Monarchia brytyjska"
 british_monarchy_desc: "Naturalna ewolucja monarchii angielskiej i szkockiego rządu. Parlamenty obu państw zostały zjednoczone w jeden parlament Wielkiej Brytanii."
 absolute_british_monarchy: "Absolutna monarchia brytyjska"
 absolute_british_monarchy_desc: "Po druzgocącej klęsce parlamentów z rąk rojalistów monarcha pozostaje jedynym suwerennym władcą państwa. Parlament nadal istnieje, lecz został sprowadzony do roli marionetki monarchy."
 angevin_monarchy: "Monarchia andegaweńska"
 angevin_monarchy_desc: "Połączenie monarchii angielskiej z centralizacyjnymi rozwiązaniami Królestwa Francji. Władca odgrywa centralną rolę w rządzeniu, lecz parlament nadal ogranicza jego władzę."
 mechanic_english_parliament_yes: "Posiada §Yparlament angielski§!."
 byzantine_autocracy_reform: "Autokracja bizantyjska"
 byzantine_autocracy_reform_desc: "Ustrój bizantyjski jest reliktem starożytności. Przestarzałe struktury władzy i brak skodyfikowanych zasad sukcesji imperialnej stanowią poważne zagrożenie dla stabilności imperium."
 mechanic_civil_war_on_every_new_ruler_yes: "Po wstąpieniu nowego władcy na tron pojawiają się §Rpretendenci do tronu§!."
 reformed_byzantine_monarchy_reform: "Zreformowana monarchia bizantyjska"
 reformed_byzantine_monarchy_reform_desc: "Dzięki wysiłkowi, krwi i łzom rząd cesarski został zreformowany! Brutalne wojny domowe należą do przeszłości, władza senatu została przywrócona, a wpływ armii cesarskiej na rządy znacznie ograniczony."
 margraviate_reform: "Margrabstwo"
 margraviate_reform_desc: "Margrabstwo to historyczny tytuł nadawany przez cesarza Świętego Cesarstwa Rzymskiego państwom pogranicznym, aby chroniły imperium przed zagrożeniami zewnętrznymi."
 serbian_despotate_reform: "Despotat serbski"
 serbian_despotate_reform_desc: "Despotat serbski jest państwem sukcesyjnym po upadłym Cesarstwie Serbskim. Despota sprawuje najwyższą władzę i kontroluje centralną administrację państwa."
 bulgarian_tsardom_reform: "Carstwo bułgarskie"
 bulgarian_tsardom_reform_desc: "Carstwo zostało wreszcie przywrócone! Turcy zostali wyparci z Bałkanów, a wielkie Cesarstwo Bułgarskie ponownie obejmuje rolę dominującej potęgi regionu."
 tanistry_reform: "Tanistry"
 tanistry_reform_desc: "Gaelicki system dziedziczenia władzy. Władca państwa jest wybierany spośród przedstawicieli jednej z gałęzi panującego rodu, co zapewnia równowagę sił w klanie."
 irish_highkingdom_reform: "Wielkie Królestwo Irlandii"
 irish_highkingdom_reform_desc: "Wielkie Królestwo Irlandii, ukształtowane przez tradycję tanistry i inspirowane monarchiami Szkocji oraz Anglii, stanowi symbol potęgi Irlandczyków na Wyspach Brytyjskich."
 scottish_monarchy_reform: "Monarchia szkocka"
 scottish_monarchy_reform_desc: "Podobnie jak jej angielski odpowiednik, monarchia szkocka skupia się wokół korony, lecz posiada parlament reprezentujący potrzeby zwykłych ludzi."
 caliphate_reform: "Kalifat"
 caliphate_reform_desc: "Kalifatem rządzi kalif, prawowity duchowy następca Proroka. Jako najwyższy autorytet islamu zarówno w sprawach doczesnych, jak i duchowych, kalifowi winni są posłuszeństwo wszyscy muzułmanie."
 barbary_sultanate_reform: "Iktā berberyjska"
 barbary_sultanate_reform_desc: "Berberowie z Wybrzeża Berberyjskiego od dawna trudnią się najazdami i piractwem na wybrzeżach Morza Śródziemnego. Ich państwo zachowuje luźną strukturę feudalną wspieraną przez radę berberyjskich wodzów plemiennych."
 roman_empire_reform: "Cesarstwo Rzymskie"
 roman_empire_reform_desc: "Najbardziej wpływowe imperium w dziejach Europy, którego chwała i splendor nie miały sobie równych. Jako prawowici dziedzice tego tytułu możemy uważać tę wielkość za własną."
 persian_government_reform: "Rząd perski"
 persian_government_reform_desc: "Szach jest absolutnym władcą Persji, a pod jego rządami funkcjonuje złożony system biurokratyczny, który utrzymuje porządek i równowagę w państwie. Obsadzanie stanowisk według zasług, a nie pochodzenia, zapewnia działanie systemu z korzyścią dla całego narodu."
 portuguese_monarchy_reform: "Monarchia portugalska"
 portuguese_monarchy_reform_desc: "Choć Portugalia leży na Półwyspie Iberyjskim, całe jej wybrzeże zwrócone jest ku Atlantykowi, a nie Morzu Śródziemnemu. Dlatego Portugalczycy od zawsze kierowali wzrok na zachodni horyzont, a żegluga po Atlantyku jest dla nich czymś naturalnym."
 holy_imperial_monarchy_reform: "Święta monarchia imperialna"
 holy_imperial_monarchy_reform_desc: "Imperium osiągnęło szczyt swojego splendoru. Jako jedyny prawowity następca Cesarstwa Rzymskiego nie musimy nikomu udowadniać naszego świętego prawa do rządów, otrzymanego od samego Boga."
 burgundian_state_reform: "Państwo burgundzkie"
 burgundian_state_reform_desc: "Interesy Burgundii są podzielone między burgundzkie ziemie książęce na południu i Niderlandy na północy. Położenie w strefie rywalizacji Anglii i Francji sprawiło, że Burgundia od dawna musi lawirować między tymi potęgami."
 bohemian_elective_kingdom_reform: "Czeska monarchia elekcyjna"
 bohemian_elective_kingdom_reform_desc: "Szlachta w Czechach zawsze miała wiele do powiedzenia na temat tego, kto powinien nimi rządzić, a następnego władcę wybiorą spośród wszystkich dostępnych kandydatów, niezależnie od linii krwi."
 stadthalter_monarchy_reform: "Monarchia stadhouderów"
 stadthalter_monarchy_reform_desc: "Stadhouder, czyli namiestnik, to tradycyjna nazwa gubernatorów i zarządców Niderlandów. Tytuł ten stał się dziedziczny i obecnie odpowiada godności królewskiej."
 trade_company_government: "Kompania handlowa"
 trade_company_government_desc: "W praktyce jest to kompania założona w celu eksploatacji i czerpania zysków z handlu zamorskiego. Jej działalność skupia się przede wszystkim na morzu i korzyściach gospodarczych."
 english_parliamentary_republic_government: "Republika konstytucyjna"
 english_parliamentary_republic_government_desc: "Republika, w której cała władza spoczywa w rękach parlamentu, a konstytucja chroni jego prawa. Tam, gdzie niegdyś rządził autokratyczny monarcha, teraz minister reprezentuje Izbę Lordów i Izbę Gmin."
 roman_republic_government: "Republika Rzymska"
 roman_republic_government_desc: "Zanim nastała chwała Cesarstwa Rzymskiego, Republika Rzymska zapisała się na kartach historii. Jako jej prawowici następcy nie mamy wątpliwości, że ta sama chwała należy się nam."
 civic_republicanism_government: "Republikanizm obywatelski"
 civic_republicanism_government_desc: "Jest to nurt republikanizmu inspirowany starożytnością, kładący szczególny nacisk na cnoty obywatelskie. Obywatele poświęcają się wspólnemu dobru publicznemu."
 calvinist_republic_government: "Republika kalwińska"
 calvinist_republic_government_desc: "Republika kalwińska, uznająca ideały i wartości kalwinizmu za podstawę religii państwowej, łączy wierność religijną z republikańskim ustrojem."
 ikko_ikki_reform: "Rząd Ikko-ikki"
 ikko_ikki_reform_desc: "Droga Czystej Krainy oraz moc i nauki Amidy są jedyną drogą naprzód dla naszego narodu. Namu Amida Butsu."
 ikko_ikki_republic_reform: "Republika Ikko-ikki"
 ikko_ikki_republic_reform_desc: "Droga Czystej Krainy oraz moc i nauki Amidy są jedyną drogą naprzód dla naszego narodu. Namu Amida Butsu."
 tibetan_dual_government_reform: "Ganden Phodrang"
 tibetan_dual_government_reform_desc: "Nazwa Ganden Phodrang, oznaczająca „Niebiańską Siedzibę”, pierwotnie odnosiła się do rezydencji Dalajlamy. Ponieważ Dalajlama jest zarówno duchowym, jak i świeckim przywódcą Tybetu, określenie to obejmuje obecnie cały system rządów."
 caliphate_theocracy_reform: "Kalifat"
 caliphate_theocracy_reform_desc: "Kalifatem rządzi kalif, prawowity duchowy następca Proroka. Jako najwyższy autorytet islamu zarówno w sprawach doczesnych, jak i duchowych, kalifowi winni są posłuszeństwo wszyscy muzułmanie."
 dutch_theocracy_reform: "Niderlandzkie arcybiskupstwo"
 dutch_theocracy_reform_desc: "Pozostając bezpośrednio pod władzą samego Boga, ludność Niderlandów i jej rząd darzą Wszechmogącego najwyższą czcią."
 orthodox_patriarchate_reform: "Patriarchat"
 orthodox_patriarchate_reform_desc: "Władzę nad naszym krajem może sprawować wyłącznie patriarcha, jako najwyższy przedstawiciel Boga."
 fifth_monarchists_reform: "Rządy piątych monarchistów"
 fifth_monarchists_reform_desc: "Państwo znalazło się w rękach piątych monarchistów! Tylko ci, którzy zostali zbawieni w oczach Chrystusa, są godni rządzić państwem w jego piątym i ostatnim tysiącleciu!"
 millennialistic_theocracy_reform: "Teokracja millenarystyczna"
 millennialistic_theocracy_reform_desc: "Millenaryści wierzą, że zbliża się Sąd Ostateczny, a poprzedzi go okres złotego wieku na Ziemi. Dlatego nieustannie wypatrują znaków końca czasów."
 zoroastrian_theocracy_reform: "Teokracja zaratusztriańska"
 zoroastrian_theocracy_reform_desc: "Teokracja kierująca się ideałami, naukami i tradycjami zaratusztrianizmu. Rządzona przez mobedów, odrzuca idee tolerancji, aby zabezpieczyć przyszłość zaratusztrianizmu."
 ajuuraan_theocracy_reform: "Teokracja somalijska"
 ajuuraan_theocracy_reform_desc: "Choć władcy sprawują władzę świecką, najwyższym autorytetem pozostaje imam, dlatego rząd ma również ostateczny głos w sprawach duchowych."
 bureaucratic_rule_reform: "Rządy biurokratyczne"
 bureaucratic_rule_reform_desc: "Ustrój oparty na ideach i wartościach głoszonych przez Konfucjusza. Sprawne wykorzystanie biurokracji pozwala utrzymywać w ciągłym ruchu złożony mechanizm państwa."
 house_of_lords_reform: "Wzmocniona Izba Lordów"
 house_of_lords_reform_desc: "Izba Lordów jest wyższą izbą parlamentu i reprezentuje szlachtę oraz duchowieństwo. Wzmacniając jej pozycję w rządzie, monarcha zyskuje zaufanie i lojalność samych wpływowych stanów."
 ministerialis_promotion_reform: "Promocja ministeriałów"
 ministerialis_promotion_reform_desc: "Pierwotnie służący Cesarstwu i uwolnieni z niewoli, ministeriałowie są obecnie rdzeniem niemieckiej klasy rycerskiej i sercem w samej niższej szlachcie."
 justicia_de_aragon_reform: "Justicia de Aragón"
 justicia_de_aragon_reform_desc: "Justicia de Aragón był najwyższym sądem Królestwa Aragonii, utworzonym w XII wieku. Odpowiadał za wymierzanie sprawiedliwości i przestrzeganie prawa w królestwie."
 catalan_cortes_reform: "Kortezy katalońskie"
 catalan_cortes_reform_desc: "Kortezy katalońskie były instytucją polityczną Katalonii. Stanowiły zgromadzenie przedstawicieli różnych terytoriów regionu, którzy spotykali się, aby omawiać sprawy polityczne i podejmować decyzje dotyczące państwa."
 great_council_of_mechelen_reform: "Wielka Rada Mechelen"
 great_council_of_mechelen_reform_desc: "Wielka Rada Mechelen była sądem działającym w Niderlandach w późnym średniowieczu i w okresie wczesnonowożytnym. Odpowiadała za interpretację i stosowanie prawa, wywierając istotny wpływ na rządy i administrację regionu."
 mechanic_no_more_dutch_revolt_yes: "Wyłącza katastrofę §YPowstanie niderlandzkie§!."
 sisterhood_of_jeanne_darc_reform: "Zakon Joanny d’Arc"
 sisterhood_of_jeanne_darc_reform_desc: "Zakon Joanny d’Arc został ustanowiony, aby krzewić ideały Joanny d’Arc, czczonej i pobożnej dziewicy z ludu, która ocaliła Francję przed Anglikami."
 janissary_autocracy_reform: "Stratokracja janczarska"
 janissary_autocracy_reform_desc: "Państwo rządzone przez zbuntowanych janczarów, którzy oderwali się od swojego dawnego suwerena. Ich jedynym przywódcą jest aga, wybierany w sposób przypominający monarchię."
 admiralty_regime_reform: "Rządy admiralicji"
 admiralty_regime_reform_desc: "Monarchia, w której władca jest zarazem najwyższym dowódcą marynarki wojennej. Podczas gdy inne państwa posiadają flotę, tutaj to flota posiada państwo."
 direct_royal_administration_reform: "Bezpośrednia administracja królewska"
 direct_royal_administration_reform_desc: "Administracja państwa znajduje się w rękach monarchy. Władca podejmuje wiele decyzji i ustanawia prawa bez zgody parlamentu."
 administration_of_the_parliament_reform: "Administracja parlamentarna"
 administration_of_the_parliament_reform_desc: "Administracja państwa stała się kluczową częścią samego parlamentu. Władza monarchy została znacznie ograniczona, aby parlament mógł podejmować decyzje bez ingerencji z góry."
 thalassocracy_reform: "Talassokracja"
 thalassocracy_reform_desc: "Talassokracja, władanie przy morzu. Nasz lud od zawsze mieszkał przy morzach i oceanach. Nasze cesarstwo rozciąga się daleko poza ojczyznę, aż do kolonii z dala od naszego morza. Kolejne wybrzeża są podbijane przez okręty, pływające pod naszą banderą. Morze jest chłodne, a jednak jest naszym domem. Nikt nie jest w stanie rzucić nam wyzwania, gdyż sam żywioł nam pomaga."
 sharifate_reform: "Szarifat"
 sharifate_reform_desc: "Szarifatem rządzi szarif, osoba dziedzicząca władzę bezpośrednio od Proroka. Władza szarifa jest zatem legitymizowana wolą Allaha."
 parliamentary_republic_reform: "Republika parlamentarna"
 parliamentary_republic_reform_desc: "Republika, w której cała władza spoczywa w rękach parlamentu. W miejscu dawnego autokratycznego monarchy pojawia się minister reprezentujący Izbę Lordów i Izbę Gmin."
 royal_charters_reform: "Przywileje królewskie"
 royal_charters_reform_desc: "Przywileje królewskie to zezwolenia udzielane przez monarchę osobom lub kompaniom handlowym, nadające im szczególne prawa i uprawnienia. Obecnie wydaje się je przede wszystkim korporacjom i uniwersytetom."
 commercial_trade_empire_reform: "Brytyjska globalna polityka handlowa"
 commercial_trade_empire_reform_desc: "Zasady merkantylizmu okazały się ostatnio nieopłacalne. Rząd nie ogranicza już importu ani eksportu towarów, lecz kieruje się zasadami opisanymi w dziele „Bogactwo narodów”."
 english_conciliarism_reform: "Koncyliaryzm Kościołów"
 english_conciliarism_reform_desc: "Reformacja doprowadziła do rozłamu wśród chrześcijan. Dzięki działaniom koncyliarystycznym państwo przyjmuje stanowisko przychylne katolikom i próbuje naprawić relacje między katolikami a wyznawcami nurtów reformacyjnych."
 anglican_state_church_reform: "Anglikański Kościół państwowy"
 anglican_state_church_reform_desc: "Państwo i Kościół znajdują się w rękach monarchy. W przeciwieństwie do wielu innych odłamów protestantyzmu rząd rozstrzyga jednak kwestie religijne, czerpiąc zarówno z katolicyzmu, jak i z reformacji."
 professional_navy_reform: "Rada Admiralicji"
 professional_navy_reform_desc: "Rada Admiralicji jest najwyższym urzędem morskim państwa. Kierowana przez Lorda Wielkiego Admirała, dba o profesjonalizm naszej floty zarówno w sprawach wojskowych, jak i handlowych."
 qollar_aghasi_regiments_reform: "Pułki qollar-aghasi"
 qollar_aghasi_regiments_reform_desc: "Qollar-aghasi są dowódcami naszych najbardziej elitarnych pułków. Pełnią nie tylko funkcje generałów, lecz także mężów stanu, dzięki czemu mają znaczny wpływ na rząd i sprawy wojskowe."
 royal_marines_reform: "Królewska piechota morska"
 royal_marines_reform_desc: "Królewska piechota morska jest dumą zarówno naszej floty, jak i armii. Nazywana również „pułkiem admirała”, doskonale radzi sobie w walce na lądzie i na morzu."
 manrent_reform: "Manrent"
 manrent_reform_desc: "Manrent to umowa zawierana między wodzami klanów a panującą koroną. W zamian za ochronę i przywileje klany przysięgają wierność władcy i zobowiązują się służyć mu w wojsku."
 merchant_arsenal_reform: "Arsenał kupiecki"
 merchant_arsenal_reform_desc: "Choć nasze państwo skupia się przede wszystkim na zysku i handlu, nie ulega wątpliwości, że interesy te wymagają ochrony zbrojnej. Państwowy arsenał jest przygotowany do konfliktów zbrojnych i przechowuje galeasy oraz inną broń wojenną."
 strengthened_parliament_reform: "Wzmocniony parlament"
 strengthened_parliament_reform_desc: "Parlament jest sercem państwa. Wzmacniając jego władzę i przyznając miejsca przedstawicielom niektórych stanów, możemy zapewnić większą różnorodność spraw i debat."
 parliament_vs_monarchy_reform: "Spór parlamentu z monarchią"
 parliament_vs_monarchy_reform_desc: "Dwór królewski i parlament pozostają w nieustannym konflikcie, próbując zdobyć przewagę nad drugą stroną..."
 league_of_lezhe_reform: "Liga z Lezhë"
 league_of_lezhe_reform_desc: "Sojusz wojskowy i dyplomatyczny albańskiej arystokracji, którego celem jest obrona Albanii przed zagrożeniami zewnętrznymi."
 mechanic_can_force_issue_through_yes: "Może przeforsować §Yustawę parlamentarną§! raz na §Y20 lat§!."
 force_issue_through_title: "Przeforsuj ustawę"
 force_issue_through_desc: "Podejmowanie decyzji przez [Root.GetParliamentOrFallbackName] jest powolnym procesem. Jednak dla [Root.Monarch.GetName] czas ma kluczowe znaczenie. Na mocy uprawnień wynikających z urzędu [Root.GovernmentName] [Root.Monarch.GetName] może zmusić [Root.GetParliamentOrFallbackName] do podjęcia decyzji zgodnej z przedmiotem debaty."
