 jap_ability_bolster_morale: "Zaciągnąć gorliwych ochotników"
 strengthen_bakuhan_system_reform: "Wzmocniony system bakuhan"
 strengthen_bakuhan_system_reform_desc: "Wzmacniając system określający, które ziemie należą do rządu centralnego, a które do lokalnych panów feudalnych, możemy skuteczniej egzekwować naszą władzę."
 reform_the_samurai_reform: "Zreformować samurajów"
 reform_the_samurai_reform_desc: "Nasi samurajowie są dumą naszych armii. Dzięki ich doskonałemu wyszkoleniu i technikom walki żadna siła nie będzie w stanie się nam przeciwstawić."
 ability_land_of_the_christian_sun_mechanic: "§YKraj Chrześcijańskiego Słońca§!"
 flavor_jap.62.t: "Wzrost znaczenia [4815.GetName]"
 flavor_jap.62.d: "Miasto [4815.GetName], którego nazwa oznacza Miasto Lwa i które dawniej nosiło nazwę Temasek, stało się ważnym ośrodkiem handlowym dla różnych malajskich i jawajskich królestw oraz imperiów morskich. Było nawet stolicą królestwa Singapura, od którego później przejęło swoją nazwę. Położone w strategicznym punkcie szlaku handlowego między Chinami a Indiami, nieustannie przyciągało kupców i towary z najdalszych zakątków świata.\\n\\nTen, kto sprawuje nad nim kontrolę i włada przepływającym przez nie handlem, może zdominować wymianę handlową między Wschodem a Zachodem i czerpać ogromne korzyści z obu kierunków."
 flavor_jap.62.a: "Pieniądze wprawiają świat w ruch."
 flavor_jap.63.t: "Okres Edo"
 flavor_jap.63.d: "Okres Edo, którego początek historycy datują na 1603 rok i ustanowienie siogunatu Tokugawów, był dla Japonii czasem wielkiej stabilizacji, dobrobytu i wzrostu gospodarczego. Położenie kresu wewnętrznym walkom i nieustannym wojnom domowym pozwoliło Japończykom skupić się nie tylko na rozwoju gospodarki, lecz także sztuki i nauki. Wzrost liczby ludności przyczynił się do rozwoju miast, co jeszcze bardziej przyspieszyło te przemiany.\\n\\nW tym okresie powstały i rozpowszechniły się nowe rozwiązania finansowe, techniki malarskie, takie jak ukiyo-e, oraz formy rozrywki, między innymi gejsze i teatr kabuki. Rozwinęły się również nowe potrawy, takie jak sushi i tempura. Wszystkie te zjawiska rozkwitły w epoce Edo i stały się nieodłączną częścią japońskiej kultury, rozpoznawalną na całym świecie.\\n\\nDzięki temu bezprecedensowemu okresowi stabilizacji, rozwoju i wzrostu nasz kraj z pewnością będzie w stanie osiągnąć nieznane dotąd wyżyny."
 flavor_jap.63.a: "Zmagania przeszłości mamy już za sobą."
 flavor_jap.64.t: "Los Mandatu"
 flavor_jap.64.d: "Nasz kraj od zawsze żył w cieniu Chin. Wielki Smok uważał się za centrum świata i prawowitego władcę wszystkich jego ziem z mocy samego Mandatu Niebios. W przeszłości byliśmy zmuszeni akceptować te niedorzeczne roszczenia, lecz Tygrys przebudził się i nie będzie już słuchać Smoka!\\n\\nJeśli jakikolwiek kraj może twierdzić, że same Niebiosa powierzyły mu władzę nad tymi ziemiami, to jest nim wyłącznie nasz Boski Naród. Możemy przejąć tron Chin wraz z całą związaną z nim biurokracją albo pozwolić, by państwo to upadło pod ciężarem władzy wyraźnie niższej i pozbawionej prawdziwego boskiego mandatu."
 flavor_jap.64.a: "Należy do mnie i tylko do mnie!"
 flavor_jap.64.b: "Te małostkowe deklaracje są poniżej naszej godności..."
 flavor_jap.65.t: "Dom Wschodzącego Słońca"
 flavor_jap.65.d: "Zbyt długo nasz Boski Cesarz pozostawał w cieniu wojskowej dyktatury sioguna. Zbyt długo jego boska krew skazana była na życie w ukryciu. Na szczęście, w przeciwieństwie do swojej przodkini, bogini Słońca Amaterasu, która zamknęła się w jaskini, pozbawiając świat światła, nie pogodził się z bezczynnością w murach Pałacu Cesarskiego. Nieustannie działał, wykorzystując swoje wpływy, by zdobywać przychylność i poparcie.\\n\\nZ czasem zgromadził wystarczające siły, by zmusić sioguna do zniesienia siogunatu i przywrócenia cesarskiego rodu do faktycznej władzy nad Japonią. Dzięki ponownemu wyniesieniu Żyjącego Kami na czoło państwa nasz naród znów będzie cieszył się boskim dobrobytem."
 flavor_jap.65.a: "Zbyt długo na to czekaliśmy!"
 flavor_jap.66.t: "Księga pięciu kręgów"
 flavor_jap.66.d: "Nasz kraj wydał wielu sławnych wojowników, ale żaden nie zyskał tak trwałej sławy jak legendarny Miyamoto Musashi. Nazywany najlepszym pojedynkowiczem w historii Japonii, wygrał swój pierwszy pojedynek w wieku trzynastu lat i zaczął podróżować i brać udział w pojedynkach w całym kraju, pozostając niepokonanym.\n\nJego doświadczenia są przekazywane za pośrednictwem \"Księgi pięciu kręgów\", w której wyjaśnia wszystkie swoje techniki sztuk walki, mentalność i filozofię. Na jej stronach znajduje się nieoceniona wiedza na temat tego, jak stać się doskonałym wojownikiem, a nasze armie mogłyby wiele skorzystać na jej przeczytaniu."
 flavor_jap.66.a: "Nauki te poprawią naszą  §Yarmię§!."
 flavor_jap.66.b: "Odrzućmy ją, zamiast tego skupmy się na §Mmorzu§!."
 flavor_jap.66.c: "Musimy dokładnie rozważyć nasze możliwości."
 flavor_jap.67.t: "O przyprawach i ziołach"
 flavor_jap.67.d: "Doradcy, uczeni, poeci, a nawet politycy włączyli się w ostatnią wielką debatę, która poruszyła cały kraj. W przeciwieństwie do zwyczajowych ponurych tematów wojny czy ubóstwa, zaprzątających głowy naszych dostojników, ostatnio wszyscy zadają sobie jedno pytanie: przyprawy czy zioła? Obie strony mają mocne argumenty. Przyprawy nadają potrawom i napojom wyrazisty smak oraz charakter, podczas gdy herbata i inne zioła od wieków służą naszemu narodowi swoimi właściwościami leczniczymi i uspokajającymi."
 flavor_jap.67.a: "Uwielbiam przyprawy..."
 flavor_jap.67.b: "...ale to zioła są najlepsze!"
 flavor_jap.68.t: "Pierwsza gejsza"
 flavor_jap.68.d: "Gejsza (lub Geiko) to osoba zajmująca się sztuką, zasadniczo występująca artystka. W miarę jak monety napływały do skarbca Japonii, coraz większa ich część była przeznaczana na kulturę i rozrywkę. Najpopularniejszą formą rozrywki w dzielnicach uciech, wykonywaną zarówno przez mężczyzn, jak i kobiety, był taniec i śpiew przy akompaniamencie instrumentów i nastoletnich tancerek zwanych odoriko. Kiedy te dziewczęta dorastały, przyjmowały różne imiona, aby kontynuować pracę, jedną z tych nazw była 'gejsza'.\n\nZ czasem gejsze zostały docenione za swoją sztukę śpiewu, tańca i gry na shamisenie, specjalizując się w tego rodzaju rozrywce."
 flavor_jap.68.a: "Takie wyrafinowanie i finezja!"
 flavor_jap.69.t: "Poezja i pieśni okresu Edo"
 flavor_jap.69.d: "Dobrobyt epoki Edo sprzyjał rozwojowi i dojrzewaniu kultury oraz rozrywki. Szczególnie rozkwitły liczne formy teatru i muzyki. Różnice między szlachetną klasą samurajów a zwykłymi mieszkańcami miast doprowadziły do powstania odrębnych stylów muzycznych i teatralnych, które z czasem coraz wyraźniej odzwierciedlały podziały społeczne. W tym okresie powstał szczególny styl muzyczny i metryczny zwany kouta lub kinsei kouta-cho. Zdobył tak wielką popularność, że przetrwał do dziś w muzyce ludowej. Była to muzyka na shamisen, instrumencie przypominającym banjo, której zadaniem było akompaniowanie śpiewanym poematom i opowieściom.\\n\\nRozwijała się również poezja: odświeżano i rozbudowywano tradycyjne formy, a także tworzono nowe. Powszechne stało się wspólne układanie utworów przez kilka osób, które naprzemiennie dopisywały kolejne strofy. Z czasem nawet zwykli mieszkańcy zaczęli uczestniczyć w tej praktyce. Strofę otwierającą łańcuch zaczęto postrzegać jako samodzielny utwór, co ostatecznie doprowadziło do powstania haiku.\\n\\nStary staw;\\nżaba wskakuje;\\ndźwięk wody."
 flavor_jap.69.a: "Cóż za pokaz piękna i intelektu."
 flavor_jap.70.t: "Droga Chonindo"
 flavor_jap.70.d: "Zmiany w społeczeństwie po burzliwych czasach okresu Sengoku są dość oczywiste. Wcześniejsze ciągłe walki w całej Japonii w końcu ustały i teraz cieszymy się nieco stabilnym pokojem wewnętrznym, który pozwala na bardziej spokojne życie zwykłych ludzi. W rezultacie napływają oni do szybko rozwijających się miast, a tym samym nasza wcześniej wiejska populacja daje początek Chonin (mieszczanom), a wraz z nimi ich własny styl życia zwany Chonindo. Ich aspiracje do klasy samurajów i ich wartości bushido, wraz z żywym zainteresowaniem rozwojem sztuki i nauki, zaowocowały odrębną nową kulturą masową, skoncentrowaną na doskonałej jakości wykonania. Poezja, przedstawienia, teatry lalkowe, malarstwo i wszystkie inne formy sztuki przeżywają wielki rozwój."
 flavor_jap.70.a: "Co za czas, by żyć!"
 flavor_jap.71.t: "Wielki pożar Meireki"
 flavor_jap.71.d: "Zapoczątkowany przez kapłana, który rzekomo próbował spalić przeklęte kimono, Wielki Pożar Meireki zdziesiątkował prowincję [1028.GetName] i pochłonął ponad 100 000 istnień ludzkich. Ze względu na charakter budynków w prowincji [1028.GetName], które są wykonane z drewna i papieru, pożar, który rozpoczął się w dzielnicy Hongo, szybko rozprzestrzenił się na całe miasto. Niestety, fakt, że zdecydowaliśmy się zbudować nasze budynki tak blisko siebie, odegrał znaczącą rolę w szybkim rozprzestrzenianiu się ognistego zniszczenia."
 flavor_jap.71.a: "Co za tragedia."
 flavor_jap.72.t: "Festiwale Kanda Matsuri w [Root.Capital.GetName]"
 flavor_jap.72.d: "Po burzliwych czasach i nieustannych wojnach okresu Sengoku zaczęto organizować liczne festiwale, czyli matsuri, aby świętować nastały pokój. Jednym z najsłynniejszych jest święto odbywające się przy chramie Kanda Myojin w Edo, popularnym zarówno wśród samurajów, jak i zwykłych mieszkańców. Liczne platformy, przenośne chramy mikoshi i występy towarzyszące procesji sprawiły, że matsuri stało się powszechnie znanym świętem i najważniejszym wydarzeniem w życiu miasta."
 flavor_jap.72.a: "Świętujmy nasze najwspanialsze zwycięstwa!"
 flavor_jap.73.t: "Onna-musha w okresie Edo"
 flavor_jap.73.d: "Onna-musha, pierwotnie wojowniczki służące jako kobiety-bushi, cieszyły się wielkim szacunkiem we wczesnych latach naszego cesarstwa. Należały do klasy samurajów feudalnej Japonii i szkoliły się w posługiwaniu bronią, by w czasie wojny chronić domostwa, rodziny i honor. Z biegiem lat zasłynęły na polach bitew jako zdolne dowódczynie, odnosząc imponujące zwycięstwa i zapisując swoje imiona na kartach historii.\\n\\nJednak pod wpływem neokonfucjanizmu epoki Edo pozycja onna-musha zaczęła wyraźnie słabnąć. Zmieniła się również rola samurajów i ich żon. Samurajowie przestali zajmować się wojną i bitwami, stając się urzędnikami. Kobiety, zwłaszcza córki najznamienitszych rodów, zaczęto traktować jako narzędzia w realizacji ambicji i zdobywaniu władzy. Dawne ideały odważnego oddania i bezinteresowności stopniowo ustępowały miejsca cichej, biernej uległości. Mimo to wiele kobiet nadal pragnie służyć siłom zbrojnym kraju jako dowódczynie i pokornie prosi o możliwość oddania życia za szlachetną sprawę ojczyzny. Jedną z najsłynniejszych wojowniczek była Ohori Tsuruhime. Wielokrotnie odważnie stawała do walki, a jej umiejętności bojowe i przekonanie o boskim natchnieniu sprawiły, że porównywano ją do Joanny d’Arc. Jej dziedzictwo z pewnością uczyni ją jedną z najbardziej rozpoznawalnych wojowniczek w historii Japonii."
 flavor_jap.73.a: "Pozwólmy onna-musha nadal służyć w wojsku."
 flavor_jap.73.b: "Ich epoka dobiegła końca. Będą jedynie pionkami w grze o władzę i urzędnicze wpływy!"
