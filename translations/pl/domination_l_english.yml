 mng_expanded_jinyiwei_secret_police_modifier: "Rozbudowa tajnej policji Jinyiwei"
 desc_mng_expanded_jinyiwei_secret_police_modifier: "Tajna policja naszego rządu uzyskała teraz szersze przywileje i większe uprawnienia."
 mng_estates_and_subjects_unchallenged_modifier: "Niekwestionowana pozycja stanów i poddanych"
 desc_mng_estates_and_subjects_unchallenged_modifier: "Różne siły i stronnictwa działające na naszym dworze nie napotykają już sprzeciwu, dzięki czemu zyskały większe wpływy."
 mng_islamic_mosque_of_beijing_modifier: "Meczet w Pekinie"
 desc_mng_islamic_mosque_of_beijing_modifier: "Wyjątkowa budowla w sercu tego miasta, będąca symbolem silnych więzi dyplomatycznych między nami a naszymi muzułmańskimi sojusznikami."
 mng_earthquake_modifier: "Niedawne silne trzęsienie ziemi"
 desc_mng_earthquake_modifier: "Prowincję niedawno nawiedziło silne trzęsienie ziemi. Usunięcie zniszczeń i skutków przekształcenia terenu zajmie wiele lat."
 haijin_policy_modifier: "Polityka Haijin"
 desc_haijin_policy_modifier: "Nasza obecna polityka zakazuje prowadzenia na dużą skalę wymiany handlowej między naszym dworem a cudzoziemcami."
 shogun_backed_by_mng_modifier: "Wsparcie cesarza Chin"
 desc_shogun_backed_by_mng_modifier: "Nasze państwo cieszy się poparciem potężnego cesarza Chin, co przynosi nam liczne korzyści i zwiększa naszą potęgę."
 mng_hanlin_academy_modifier: "Akademia Hanlin"
 desc_mng_hanlin_academy_modifier: "Jedna z najbardziej znamienitych akademii Imperium, której członkowie zajmują najwyższe pozycje w chińskiej biurokracji."
 mng_reformed_tributary_obligation_system_modifier: "Zreformowane zobowiązania trybutarne"
 desc_mng_reformed_tributary_obligation_system_modifier: "Reforma systemu trybutarnego pozwala nam wywierać większą presję na naszych poddanych, by wywiązywali się z obowiązku płacenia trybutu."
 mng_trading_in_tibetan_horses_modifier: "Handel końmi tybetańskimi"
 desc_mng_trading_in_tibetan_horses_modifier: "Nasze przyjazne nastawienie do mieszkańców zachodnich gór przyniosło korzyści naszej kawalerii."
 mng_great_engineer_modifier: "Wielki inżynier"
 desc_mng_great_engineer_modifier: "Umysł naszego władcy rozkwita, tworząc wspaniałe budowle i opracowując niezwykłe plany."
 mng_official_meeting_conduct_code_modifier: "Kodeks etykiety oficjalnych spotkań"
 desc_mng_official_meeting_conduct_code_modifier: "Bez odpowiedniej etykiety i zasad postępowania nasz pałac stałby się pośmiewiskiem i obiektem drwin."
 mng_empowered_admonishment_branch_modifier: "Wzmocniony urząd napominania"
 desc_mng_empowered_admonishment_branch_modifier: "Wzmocnienie urzędu napominania pozwoli nam powierzyć pałacowej frakcji nadzór nad niesfornymi elementami w zamian za większą stabilność wewnętrzną."
 mng_touring_censors_modifier: "Objazdowi cenzorzy"
 desc_mng_touring_censors_modifier: "Powołanie objazdowych cenzorów sprawi, że właściwych zasad będą przestrzegać nie tylko mieszkańcy naszej stolicy, lecz także wszystkich prowincji Imperium."
 mng_yu_qian_manual_modifier: "Podręcznik Yu Qiana"
 desc_mng_yu_qian_manual_modifier: "Cenne uzupełnienie naszej akademii wojskowej, które na pokolenia wzbogaci naszą wiedzę o sztuce wojennej."
 mng_yu_qian_manual_2_modifier: "Podręcznik Yu Qiana"
 desc_mng_yu_qian_manual_2_modifier: "Cenne uzupełnienie naszej akademii wojskowej, które na pokolenia wzbogaci naszą wiedzę o sztuce wojennej."
 mng_undisputed_mandate_modifier: "Niezachwiany mandat cesarski"
 desc_mng_undisputed_mandate_modifier: "Siły wewnątrz naszych granic, które ośmieliły się podważyć naszą potęgę, zostały zdławione. Droga do reform i umocnienia władzy centralnej stoi otworem."
 mng_trade_access_in_china_modifier: "Dostęp do chińskiego rynku"
 desc_mng_trade_access_in_china_modifier: "Dostęp do lukratywnych możliwości handlowych w Chinach z pewnością przyniesie nam znaczne zyski."
 mng_dragon_roars_modifier: "Ryk Smoka"
 desc_mng_dragon_roars_modifier: "Nadszedł czas, by świat pokłonił się wielkości i potędze chińskiego Cesarza!"
 eoc_census_modifier: "Rozszerzony spis ludności"
 desc_eoc_census_modifier: "Uprawnienia administracyjne, jakimi obdarza nas sprawnie działająca biurokracja, wywierają dalekosiężny i niezwykle skuteczny wpływ na sprawowanie rządów."
 eoc_expanded_palace_bureaucracy_modifier: "Umocniona biurokracja pałacowa"
 desc_eoc_expanded_palace_bureaucracy_modifier: "Oparcie rządów na władzy monarchy i zaufanych doradcach dodatkowo zwiększa sprawność naszej biurokracji."
 mng_first_circumnavigation_modifier: "Władca mórz"
 desc_mng_first_circumnavigation_modifier: "Dzięki przychylności Niebios nasi żeglarze i kapitanowie opanowali morza rozległego świata i dokonali pierwszego opłynięcia globu!"
