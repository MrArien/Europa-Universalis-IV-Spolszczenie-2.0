 russian_modernization_desc: "Modernizacja mierzy rozpowszechnienie nowoczesnych idei w państwie i całym społeczeństwie.

Modernizacja wzrasta dzięki następującym czynnikom:
 - Zatrudnianiu doradców spoza grupy kulturowej [Root.Culture.GetGroupName]
 - Otrzymywaniu pomocy w przekazywaniu wiedzy
 - Posiadaniu przewagi technologicznej
 - Umiejętnościom administracyjnym władcy
 - Kradzieży lub kupowaniu nowoczesnych idei

Modernizacja maleje z następujących powodów:
 - Ujemna stabilność
 - Korupcja
 - Inflacja
 - Bankructwo
 - Przywileje stanowe"
