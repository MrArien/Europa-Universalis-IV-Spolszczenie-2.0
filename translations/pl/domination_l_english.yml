 EST_VAL_LOW_PP: "Niska projekcja siły: "
 estate_eunuchs_ownership: "Posiadłości ziemskie eunuchów"
 EST_VAL_LOW_MANDATE: "Niski Mandat Niebios: §Y+20%§!"
 EST_VAL_LOW_MERITOCRACY: "Niska merytokracja: §Y+20%§!"
 EST_LOW_STABILITY: "Niska stabilność: §Y+10%§!"
 EST_VAL_HIGH_STABILITY: "Wysoka stabilność: "
 EST_TUMU_CRISIS: "Kryzys Tumu: §Y+5%§!"
 EST_VAL_ADM_FOCUS: "Ma §YPerfekcję wewnętrzną§! i £adm£ narodowy priorytet"
 EST_VAL_MIL_FOCUS: "Ma §YPerfekcję zewnętrzną§! i £mil£ narodowy priorytet"
 estate_eunuchs_disaster: "Dominacja eunuchów"
 curtail_eunuch_estate_decision_title: "Ograniczenie wpływów eunuchów"
 curtail_eunuch_estate_decision_desc: "Żałosne próby eunuchów przejęcia władzy muszą się skończyć! Musimy zamanifestować naszą potęgę i odebrać tym żądnym władzy sępom ich przywileje, zanim padniemy ofiarą ich ambicji..."
 estate_eunuchs_develop_x_agenda: "Zwiększenie rozwoju w prowincji [agenda_province.GetName]"
 estate_eunuchs_develop_x_agenda_desc: "Zwiększenie poziomu rozwoju i standardu życia naszych mieszkańców w prowincji [agenda_province.GetName] przyczyni się do realizacji naszych celów i pomnożenia dobrobytu."
 estate_eunuchs_gather_x_gov_reform_agenda: "Reforma rządu"
 estate_eunuchs_gather_x_gov_reform_agenda_desc: "Nasza administracja musi się rozwijać i dostosowywać do upływu czasu, który wymaga innowacji i postępu."
 estate_eunuchs_have_x_decree_agenda: "Wydanie cesarskiego dekretu"
 estate_eunuchs_have_x_decree_agenda_desc: "Na przychylność Niebios musimy odpowiedzieć gorliwym pragnieniem podążania za ich wolą."
 estate_eunuchs_monthly_adm_agenda: "Spełnienie żądań eunuchów"
 estate_eunuchs_monthly_adm_agenda_desc: "Usprawnienie naszej administracji i biurokracji w znacznym stopniu przyczyni się do udobruchania eunuchów."
 estate_eunuchs_recover_meritocracy_agenda: "Przywrócenie merytokracji"
 estate_eunuchs_recover_meritocracy_agenda_desc: "Nasze państwo utraciło sprawność biurokracji, którą niegdyś zapewniali nasi poprzednicy. Musimy dołożyć wszelkich starań, by ją odzyskać."
 estate_eunuchs_improve_imperial_mandate_agenda: "Umocnienie Mandatu Niebios"
 estate_eunuchs_improve_imperial_mandate_agenda_desc: "Nadchodzą trudne czasy. Jeśli nie udowodnimy, że zasługujemy na pozycję władców Chin, czekają nas poważne konsekwencje..."
 estate_eunuchs_hire_advisor_agenda: "Zatrudnienie zdolnego doradcy"
 estate_eunuchs_hire_advisor_agenda_desc: "Nasz dwór musi korzystać z usług najzdolniejszych i najbardziej utalentowanych doradców, jakich może zaoferować nasze rozległe państwo."
 estate_eunuchs_fire_advisor_agenda: "Odwołanie doradcy dyplomatycznego"
 estate_eunuchs_fire_advisor_agenda_desc: "Cesarz nie będzie tolerował nieudolności naszych doradców dyplomatycznych. Musimy pozbyć się tego szkodliwego chwastu i zadbać o nasz administracyjny ogród."
 estate_eunuchs_harmonization_agenda: "Osiągnięcie harmonii"
 estate_eunuchs_harmonization_agenda_desc: "Harmonia jest jedną z podstawowych zasad naszego państwa. Jej osiągnięcie to jedyna droga do stabilności i dobrobytu!"
 estate_eunuchs_four_privileges_agenda: "Zagwarantowanie przywilejów eunuchom"
 estate_eunuchs_four_privileges_agenda_desc: "Rozsądnie będzie zapewnić lojalność naszych eunuchów, nadając im zaszczytne przywileje."
 estate_eunuchs_subject_gifts_agenda: "Wręczenie podarunków"
 estate_eunuchs_subject_gifts_agenda_desc: "Musimy okazać naszą potęgę i zamożność, obdarowując poddanych darami, których nie będą mogli odrzucić."
 estate_eunuchs_forbidden_city_agenda: "Rozbudowa Zakazanego Miasta"
 estate_eunuchs_forbidden_city_agenda_desc: "Rezydencja naszego Cesarza musi być utrzymywana w należytym stanie i zachowywać jak największy prestiż, by odzwierciedlać przychylność Niebios."
 estate_eunuchs_porcelain_tower_agenda: "Rozbudowa Porcelanowej Pagody"
 estate_eunuchs_porcelain_tower_agenda_desc: "Architektura naszej Porcelanowej Pagody odzwierciedla kreatywność i żywotność naszego narodu. Jej rozbudowa i odnowienie tylko zwiększą nasze wpływy kulturowe."
 estate_eunuchs_subsidize_subjects_agenda: "Wsparcie finansowe państw lennych"
 estate_eunuchs_subsidize_subjects_agenda_desc: "Nasi poddani, którzy oddają nam pokłon, nie mają dostępu do bogactw Chin. Mimo to możemy okazać im życzliwość i łaskawość, pozwalając im zakosztować owoców podporządkowania się naszemu Cesarzowi."
