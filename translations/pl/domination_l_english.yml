 estate_janissaries: "Janczarzy"
 estate_janissaries_desc: "Janczarzy są elitarnym korpusem wojskowym lojalnym wyłącznie wobec samego sułtana. Ich szeregi uzupełnia system dewszirme, czyli pobór dzieci, a rekruci przechodzą rygorystyczne szkolenie wojskowe. Dzięki temu janczarzy stanowią najbardziej zdyscyplinowaną formację imperium.
Z biegiem czasu ich wpływy wzrosły do tego stopnia, że stali się odrębnym stanem."
