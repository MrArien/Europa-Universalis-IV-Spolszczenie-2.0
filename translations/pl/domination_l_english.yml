 qng_mercantilism_modifier: "Dominacja merkantylizmu"
 qng_qing_industry_modifier: "Rozkwit przemysłu Qing"
 qing_chinaware: "Błękitna porcelana Qing"
 qng_trade_center_worlds_desire_modifier: "Centrum handlowe pożądane przez cały świat"
 qng_subjugation_of_burma_modifier: "Podporządkowanie Birmy"
 qng_presence_global_market_modifier: "Obecność na rynku światowym"
 qng_industrial_revolution_modifier: "Ognie przemysłu"
 qng_center_of_industrialization_modifier: "Ośrodek industrializacji"
 qng_north_china_gets_tt: "Wszystkie prowincje w §YPółnocnych Chinach§!, należące do nas lub naszych poddanych niebędących państwami trybutarnymi, otrzymają:"
 qng_branching_mission_open_tt: "Wymagania ukończenia tej misji §Ypo otwarciu naszych portów§! będą następujące:"
 qng_complete_3_stab_5_crownland_tt: "
Jeśli ukończymy tę misję, mając §G3§! punkty stabilności, otrzymamy również §Y5% ziemi koronnej§!"
 qng_branching_mission_isolated_tt: "Natomiast wymagania ukończenia tej misji §Ypo odizolowaniu naszych portów§! będą następujące:"
 qng_passing_decree_reduces_autonomy_everywhere_by_5_tt: "
Każdy edykt uchwalony przez nas jako §YCesarz Chin§! obniży autonomię wszystkich posiadanych prowincji o §G-10%§!"
 qng_free_trade_reward_tt: "Jeśli wybierzemy „§YWolny handel§!”:"
 qng_mercantilism_reawrd_tt: "
Jeśli natomiast wybierzemy „§YMerkantylistyczne podejście§!”, otrzymamy:"
 qng_explain_pli_tt: "
Ukończenie misji „§YWspieranie rodzimego przemysłu§!” pozwoli nam rozwinąć §Yprodukcję§! naszych §Ytowarów handlowych§! i wzmocnić produkcję wewnętrzną."
 qng_explain_afe_tt: "Ukończenie misji „§YZezwolenie na wymianę zagraniczną§!” zapewni nam silną pozycję na §Yrynku światowym§! i zmniejszy pragnienie wolności naszych ewentualnych §Ypaństw kolonialnych§!."
 qng_no_westerners_in_our_ports_tt: "Żadne zachodnie państwo nie posiada co najmniej §Y10%§! siły handlu w żadnym z następujących węzłów handlowych:
 §YPekin§!
 §YHangzhou§!
 §YKanton§!"
 qng_explain_cir_tt: "Ukończenie misji „§YChińska rewolucja przemysłowa§!” zapewni nam silny, §Ystały§! bonus do produkcji towarów, a także dostęp do wyjątkowego §Yedyktu państwowego§!."
 qng_explain_ldp_tt: "
Ukończenie misji „§YWypędzenie zagranicznych kupców§!” uczyni nasze rynki „§YCentrum handlowym pożądanym przez cały świat§!”, a nam pozwoli nakładać §Yrestrykcje inflacyjne§! na zagraniczne rynki handlowe zależnie od ich udziału w poszczególnych węzłach."
 qng_pull_the_lever_qing_tt: "
W każdym europejskim nadmorskim węźle handlowym, w którym posiadamy co najmniej §Y25%§! siły handlu, wszystkie państwa niebędące naszymi §Ypodwładnymi§! ani §Ysojusznikami§! doświadczą §Rinflacyjnego załamania gospodarczego§!."
 enable_industrialisation_tt: "
Odblokowuje edykt państwowy „§YSzybka industrializacja§!”, który przyniesie korzyści naszym rozwijającym się prowincjom §Yw trakcie ich rozwoju§!."
 qng_event_insight_12_tt: "
§GInformacje o wydarzeniu§!:
Wydarzenie upamiętni nasze zwycięstwo podczas wypraw birmańskich, wynosząc miasto [586.GetName] i jego §Ycesarski pałac§! do rangi symbolu naszego triumfu."
 flavor_mch.12.t: "Zwycięstwo w mieście [586.GetName]"
 flavor_mch.12.d: "Gdy nasze wojska przekraczają bramy [586.GetName], nie możemy oprzeć się myśli o świetlanej przyszłości, którą zapowiadają nasze liczne zwycięstwa na polach bitew i poza granicami państwa. Wraz ze wzrostem naszych wpływów w Indochinach musimy znaleźć symbol, który z dumą ukażemy nowo podbitym poddanym, aby umocnić nasze panowanie nad tym regionem. Potrzebujemy miasta, które będzie natchnieniem do męstwa i ostoją prestiżu — niezrównanym świadectwem naszej potęgi."
 flavor_mch.12.a: "Miasto godne majestatu naszego Cesarza!"
 flavor_mch.13.t: "Złoty wiek Kangxi i [Root.Monarch.GetName]"
 flavor_mch.13.d: "Dobrobyt i potęga cesarstwa osiągnęły nowy szczyt. Sprawy wewnętrzne układają się pomyślnie, a przyjęty przez nas model merytokratycznych rządów pozwala sprawnie zarządzać Chinami. Dzięki roztropnemu przewodnictwu [Root.Monarch.GetName] nasi biurokraci przekształcili państwo w potęgę handlową, której ludność jest niemal dwukrotnie liczniejsza niż za panowania poprzedniej dynastii. Sinizacja doprowadziła do powstania wyjątkowej wspólnoty kulturowej Hanów i Mandżurów, łączącej zachowanie tożsamości narodowych z asymilacją. Kierując się zamiłowaniem do nauki i sztuki, [Root.Monarch.GetName] zapoczątkował złotą epokę dobrobytu dla wszystkich ludów żyjących pod naszymi sztandarami!"
 flavor_mch.13.a: "To bez wątpienia znak przychylności Niebios!"
 qng_grand_council_reform: "Junji Chu"
 qng_grand_council_reform_desc: "Potężny organ ustawodawczy, złożony z osobiście wybranych doradców, których Cesarz może wezwać w każdej chwili. Ich zdolności administracyjne z pewnością pomogą nam sprawnie zarządzać rozległym cesarstwem."
 chinese_industrialization: "Szybka industrializacja"
 chinese_industrialization_desc: "Tworząc silne ośrodki przemysłowe w naszych prowincjach, zdołamy szybko uprzemysłowić całe państwo."
 solidify_our_borders_title: "Umocnienie naszych granic"
 solidify_our_borders_desc: "Niepokoje, które ogarnęły naszą ojczyznę, grożą pochłonięciem nas wszystkich. Aby przetrwać, musimy rozszerzyć nasze władztwo i zabezpieczyć jego granice."
 mandate_cities_title: "Budowa podstaw potęgi"
 mandate_cities_desc: "Umocnienie naszych praw do władania Chinami wymaga odpowiednio ugruntowanej władzy. Musimy w tym celu podbić najpotężniejsze prowincje cesarstwa i wykorzystać je jako podstawy dalszej ekspansji."
 fate_of_the_mandate_title: "Los Mandatu Niebios"
 fate_of_the_mandate_desc: "Słabość naszego dawnego suwerena doprowadziła do powstania wielu zbuntowanych królestw, które roszczą sobie prawo do miana nowej dynastii mającej poprowadzić Chiny ku nowej epoce. Jednak może być tylko jedna taka dynastia!"
 conquer_xinan_title: "Podbij Xinan"
 conquer_xinan_desc: "Region Xinan stanowi drogę do sąsiednich obszarów na południu i zachodzie naszego rozległego państwa. Pomimo górzystego terenu zamieszkuje go wielu naszych rodaków, którzy pragną ponownie znaleźć się pod rządami potężnego cesarza."
 tributaries_or_conquest_title: "Droga ekspansji"
 tributaries_or_conquest_desc: "Wiele dynastii przed nami rzadko dążyło do ekspansji poza granice naszego państwa. Nie powinniśmy jednak naśladować poprzedników dla samego naśladownictwa. Wybierzmy własną drogę ekspansji, najlepiej odpowiadającą potrzebom i ambicjom naszej dynastii!"
 chi_independence_title: "Upadek Wielkiego Ming"
 chi_independence_desc: "Po dziesięcioleciach nieudolnych rządów i utracie przychylności Niebios panowanie dynastii Ming nad Chinami dobiega końca. Zbuntowane państwa i watażkowie chwytają za broń, próbując narzucić pozostałym własną władzę."
 conquer_north_china_title: "Marsz na [1816.GetName]"
 conquer_north_china_desc: "Ziemie, które niegdyś stanowiły serce kwitnącego imperium, leżą teraz w ruinie i zaniedbaniu. Północne Chiny dostarczą nam nowych żołnierzy i dochodów, gdy będziemy dążyć do zjednoczenia rozdrobnionych ziem."
 chi_unify_china_desc: "Bolesny jest widok ojczyzny pogrążonej w chaosie i walczącej o odzyskanie dawnej świetności. Niebiosa uznały nas za godnych przejęcia cesarskiego Mandatu i zjednoczenia naszych wspaniałych prowincji pod jednym sztandarem."
 chi_unify_china_title: "Zjednocz Chiny"
 chi_project_strength_desc: "Mamy wielu wrogów, którzy pragną odebrać nam to, co słusznie należy do nas. Pomimo naszej potęgi odległe imperia próbują nam dorównać i nas obalić. Nie możemy pozwolić im odebrać nam miejsca w historii!"
 chi_project_strength_title: "Epoka Wielkiego Smoka"
 conquer_south_china_title: "Podbij południowe Chiny"
 conquer_south_china_desc: "Wybrzeża południowych prowincji Chin oferują bogate towary i żyzne ziemie. W połączeniu z wydobyciem metali szlachetnych zwiększenie naszych wpływów w tym regionie przyniesie ogromne korzyści finansowe."
 issue_trade_policy_title: "Wprowadź politykę handlową"
 issue_trade_policy_desc: "Przez nasze granice przepływa coraz większa ilość towarów kupieckich. Rozsądnie będzie ustanowić wytyczne i uregulować ruch handlowy na obszarze naszej jurysdykcji."
 settle_internal_affairs_title: "Stabilny dwór"
 settle_internal_affairs_desc: "Dążąc do zwiększenia wpływów poza granicami, nie możemy zaniedbywać spraw wewnętrznych. Powinniśmy aktywnie dążyć do równowagi i merytokracji w naszej administracji."
 renovate_capital_title: "Odnowa stolicy"
 renovate_capital_desc: "Nasza stolica jest symbolem prężnej i niezależnej dynastii w regionie. Jej splendor i piękno muszą zatem osiągnąć nieporównywalny poziom, godny siedziby cesarza."
 china_prime_entrepot_title: "Rozwijaj rynki"
 china_prime_entrepot_desc: "Wiele prowincji naszego państwa odnotowuje znaczny ruch handlowy. Aby jednak wykorzystać ogromne bogactwo naszych ziem, musimy przekształcić wybrane prowincje w ośrodki handlu."
 chi_warring_era_kingdoms_modifier: "Królestwo nowej epoki walczących państw"
 desc_chi_warring_era_kingdoms_modifier: "Nadchodzi wielka epoka niestabilności i walczących ze sobą królestw!"
 chi_new_emperor_modifier: "Nowy cesarz Chin"
 desc_chi_new_emperor_modifier: "Przywdzianie cesarskiego płaszcza z pewnością zapewniło naszej dynastii trwałe miejsce na kartach historii."
 chi_absolutist_rule_china_modifier: "Rządy absolutystyczne"
 desc_chi_absolutist_rule_china_modifier: "Nikt nie odważy się podważyć naszego prawa do panowania nad Chinami!"
 chi_rising_dynasty_modifier: "Dynastia nowego słońca"
 desc_chi_rising_dynasty_modifier: "Nasze panowanie rozpocznie nową epokę dla Niebios i naszych poddanych."
 chi_rising_dynasty_modifier2: "Dynastia nowego słońca"
 desc_chi_rising_dynasty_modifier2: "Nasze panowanie rozpocznie nową epokę dla Niebios i naszych poddanych."
 era_of_the_great_dragon_modifier: "Epoka Wielkiego Smoka"
 desc_era_of_the_great_dragon_modifier: "Nasze władztwo obejmuje rozległe obszary. Oto epoka Wielkiego Smoka — czas, w którym możemy zapisać się na kartach historii!"
 chi_stable_court_modifier: "Merytokratyczny dwór"
 desc_chi_stable_court_modifier: "Awanse na naszym dworze przyznawane są według ścisłych zasad merytokracji, wyłącznie najzdolniejszym kandydatom."
 chi_imperial_center_of_commerce_modifier: "Cesarskie centrum handlu"
 desc_chi_imperial_center_of_commerce_modifier: "Obszar tej prowincji znajduje się pod osobistą opieką Cesarza jako kluczowy ośrodek handlu, zapewniający nasze bogactwo i dalszy dobrobyt."
 chi_warscore_reward_tt: "
