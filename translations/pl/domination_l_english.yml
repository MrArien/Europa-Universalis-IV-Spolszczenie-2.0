 negotiate_with_the_janissaries_title: "Negocjuj z janczarami"
 negotiate_with_the_janissaries_desc: "Choć po zamachu stanu nie jest to pierwsze rozwiązanie, które przychodzi na myśl, być może uda się porozumieć z janczarami i przekonać ich do oddania części władzy."
 tur_legendary_lawgiver_modifier: "Wielki prawodawca"
