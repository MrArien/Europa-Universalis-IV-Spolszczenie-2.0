 mevlevi_order: "Zakon Mevlevi"
 mevlevi_order_desc: "Zakon Mevlevi, założony w Konyi przez uczniów Dżalal ad-Dina Muhammada Rumiego, jest sunnickim odłamem sufizmu. Poświęca się studiowaniu Koranu oraz dzieł Rumiego."
 bektashi_order: "Zakon Bektaszytów"
 bektashi_order_desc: "Zakon Bektaszytów jest młodym, szyickim odłamem sufizmu. Powstał w Anatolii, a jego wyznawcy uznają Czternastu Niewinnych obok Dwunastu Imamów."
 tur_the_crescent_fleet_title: "Flota Półksiężyca"
 tur_the_crescent_fleet_desc: "Pierwsza flota naszego wielkiego państwa [Root.GovernmentName] powstała w 1323 roku po zdobyciu miasta Karamürsel. Od tego czasu nasza marynarka nieustannie się rozwija.
Jednak nasi morscy rywale – ostatni joannici, genueńska republika handlowa i dożowie Wenecji – wciąż zagrażają naszemu bezpieczeństwu. Rozbudowa floty ma kluczowe znaczenie, jeśli nie chcemy pozostać w tyle za przeciwnikami."
 tur_maritime_presence_title: "Obecność na morzu"
 tur_maritime_presence_desc: "Nasza flota chroni nas na morzu, lecz nie jest to jej jedyne zadanie. Handel na Morzu Śródziemnym ma dla nas ogromne znaczenie, dlatego marynarka powinna zabezpieczać wpływy na rynkach Aleppo, Aleksandrii i Raguzy."
 tur_maritime_presence_tt: "Jedna losowa prowincja w naszym macierzystym węźle handlowym otrzymuje najnowszy budynek §Yhandlowy§! oraz modyfikator „§YDominujący ośrodek handlowy§!” do końca gry, zapewniający:
Lokalna siła handlu: §G+10,00§!
Lokalny koszt rozwoju: §G-5%§!"
 tur_venetian_relations_title: "Stosunki z Wenecją"
 tur_venetian_relations_desc: "Najjaśniejsza Republika Wenecka wielokrotnie ścierała się z naszą potęgą. Od krucjaty nikopolskiej w 1396 roku, przez bitwę pod Gallipoli w 1416 roku, aż po oblężenie Salonik w 1430 roku – nasze państwa pozostawały w nieustannym konflikcie. Jest jednak oczywiste, że obie strony wiele zyskują na wzajemnym handlu.
Powinniśmy zdecydować, jak ułożymy nasze stosunki z Wenecjanami."
 tur_venetian_relations_at: "Jeśli ukończymy tę misję, gdy §YWenecja§! jest naszym sojusznikiem:"
 tur_venetian_relations_bt: "Wydarzenie pozwoli nam wybrać między §Yprzyjęciem układu handlowego z Wenecją§! i przyznaniem jej siły handlu w węźle §YKonstantynopol§! w zamian za premie a §Yodrzuceniem układu handlowego§! i uzyskaniem stałych roszczeń do wszystkich prowincji w regionach §YBałkanów§! i §YAnatolii§!, należących do §YWenecji§!, jej poddanych lub członków jej ligi handlowej."
 tur_the_bospborus_control_title: "Zabezpiecz Bosfor"
 tur_the_bospborus_control_desc: "Bosfor łączy Europę z Azją i jest naszym domem. Przyciąga oczywiście kupców i podróżnych pragnących odwiedzić drugi kontynent.
W naszym interesie leży, aby kontrolę nad Bosforem sprawowali ci, którym możemy zaufać."
 tur_the_bospborus_control_at: "Warunki tej misji zależą od naszego wyboru w wydarzeniu „§YUkład handlowy [Root.GetAdjective]-wenecki?§!” z poprzedniej misji.
Jeśli układ handlowy obowiązuje, misję można ukończyć po spełnieniu następujących warunków:
- Musi być spełniony jeden z poniższych warunków:
    - §YWenecja§! nie istnieje.
    - Opinia §YWenecji§! o państwie §Y[Root.GetName]§! wynosi co najmniej §Y190§!.
    - §YWenecja§! ma największą siłę handlu w węźle §YKonstantynopol§!."
 tur_the_bospborus_control_bt: "Jeśli jednak nie zawarliśmy układu handlowego lub został on zerwany, wymagane są następujące warunki:"
 tur_the_bospborus_control_ct: "Jeśli ukończymy tę misję, gdy obowiązuje nas układ handlowy z §YWenecją§!:"
 tur_the_bospborus_control_dt: "Wydarzenie pozwoli nam ponownie rozważyć układ handlowy i wybrać jedną z możliwości:
 - „§YRozszerz układ handlowy§!” zwiększy premie do §Gprodukcji dóbr handlowych§! w naszych prowincjach w zamian za większą siłę handlu w macierzystym węźle handlowym.
 - „§YZachowaj status quo§!” natychmiast zapewni nam dochód równy §G3 latom§!.
 - „§YZakończ układ handlowy§!” usunie modyfikator §Yukładu handlowego§! i zakończy nasz sojusz z §YWenecją§!, ale zapewni następujące efekty:"
 tur_establish_the_pashas_title: "Powołaj paszów"
 tur_establish_the_pashas_desc: "Tytuł paszy jest wysoką rangą cywilną w naszym systemie politycznym i wojskowym, nadawaną gubernatorom oraz generałom. Wraz z rozwojem imperium powoływanie nowych paszów ma kluczowe znaczenie dla utrzymania i zarządzania podbitymi terytoriami."
 tur_improved_pashas_ct: "Zmniejsza minimalny wzrost lokalnej autonomii do §Y+10,00§! dla §Ypaszów§! zarządzających prowincjami spoza grupy kulturowej §Y[Root.Culture.GetGroupName]§!."
 tur_establish_the_pashas_ct: "Maksymalnie §Y10§! prowincji, w których ustanowiono §Ypaszę§! i które nie należą do grupy kulturowej §Y[Root.Culture.GetGroupName]§!, otrzymuje §G1§! podstawowych zasobów ludzkich."
 tur_guns_of_urban_title: "Działa Urbana"
 tur_guns_of_urban_desc: "Węgierski inżynier i ludwisarz Urban zaoferował nam swoje usługi oraz wiedzę, aby stworzyć działa zdolne skruszyć mury samego Babilonu!
Musimy zapewnić sobie dostęp do jego machin oblężniczych."
 tur_guns_of_urban_at: "Jeśli ukończymy tę misję, zatrudniając §YUrbana§! przed osiągnięciem §Y5. poziomu technologii wojskowej§!, otrzymamy następującą premię:"
 tur_guns_of_urban_ct: "
Ze względu na rozmiary i archaiczną konstrukcję osmańskie działa będą wykorzystywane wyłącznie do prowadzenia oblężeń.
"
 tur_aftermath_of_varna_title: "Pokłosie bitwy pod Warną"
 tur_aftermath_of_varna_desc: "Rozgromienie niewiernej armii krzyżowców pod Warną przełamało ostatni znaczący opór wobec dalszej ekspansji naszych posiadłości w Rumelii. Zbierzmy siły i przygotujmy podbój pozostałości żałosnego, rozpadającego się imperium!"
 tur_aftermath_of_varna_ct: "Wystąpiło wydarzenie „§YZwycięstwo nad krucjatą warneńską§!”.
Wydarzenie uruchomi się w ciągu §Y1 miesiąca§!."
 tur_city_of_worlds_desire_title: "Miasto pożądania świata"
 tur_city_of_worlds_desire_desc: "Cesarstwo Bizantyjskie jest jedynie cieniem dawnej chwały. Niegdyś jego władcy panowali nad Wschodem od Dunaju po Nil, dziś pozostało z niego tylko rozpadające się państwo pogrążone w wewnętrznych konfliktach. Jedyną ostoją jego potęgi jest wielka stolica – Konstantynopol.
Dziś miasto to padnie przed potęgą Osmanów i stanie się najwspanialszym klejnotem dynastii Osmanów oraz naszego nowego imperium!"
 tur_train_the_janissary_title: "Wyszkol janczarów"
 tur_train_the_janissary_desc: "Janczarzy zostali utworzeni w 1365 roku za panowania Murada I i rekrutowali się spośród najsilniejszych synów naszych chrześcijańskich poddanych. Co pięć lat lojalni słudzy sułtana przemierzają imperium w poszukiwaniu tych chłopców i wcielają ich do korpusu janczarów. Zbliża się kolejna fala rekrutacji."
 tur_grant_first_janissary_privileges_title: "Przywileje janczarów"
 tur_grant_first_janissary_privileges_desc: "Większość naszej armii stanowią poborowi, których lojalność należy do szlachty. Janczarzy są jednak inni – służą wyłącznie [Root.Monarch.GetTitle]. Ich posłuszeństwo ma jednak swoją cenę, ponieważ żołnierze ci mają własne ambicje i oczekują nagród."
 tur_refill_the_ortas_title: "Uzupełnij orty"
 tur_refill_the_ortas_desc: "Bitwa pod Warną była dla nas kluczowym zwycięstwem, lecz jej skutki nadal są odczuwalne. Nasze wojska poniosły ciężkie straty, a wiele ort – batalionów naszej wielkiej armii – jest niekompletnych i wymaga uzupełnienia. Powinniśmy rozbudować armię i odrobić straty, aby ponownie móc kontynuować ekspansję."
 tur_refill_the_ortas_tt: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do każdej §Ytureckiej§! prowincji w regionach §YAnatolii§! i §YMaszriku§!."
 tur_conquer_anatolian_beyliks_title: "Podbij bejliki"
 tur_conquer_anatolian_beyliks_desc: "Zdobywca Timur siał spustoszenie na naszych ziemiach podczas najazdu Timurydów na Anatolię ponad 40 lat temu. Choć ostatecznie wyparto ich z naszego terytorium, szkody zostały już wyrządzone, a kilka bejlików wyrwało się spod naszej kontroli. Nadszedł czas, by usunąć tych drobnych książąt z mapy i odzyskać ich ziemie dla imperium."
 tur_unify_anatolia_title: "Zjednocz Anatolię"
 tur_unify_anatolia_desc: "Od rozpadu potężnego sułtanatu Rum region Anatolii pozostaje przedmiotem rywalizacji bejlików, plemion, a nawet pozostałości dawnej dynastii Ajjubidów. Wszystkie te siły ugną się przed naszą potęgą, gdy zjednoczymy Anatolię pod osmańskimi rządami."
 tur_conquer_the_causcasus_title: "Wkrocz w góry"
 tur_conquer_the_causcasus_desc: "Góry Kaukazu od dawna zamieszkują liczne chrześcijańskie plemiona i państwa. Choć ich wojownicy są zahartowani, jest ich zbyt mało, by stawić nam czoła. Powinniśmy przejąć te ziemie, zanim zrobią to nasi wrogowie."
 tur_black_sea_dominance_title: "Zdominuj Morze Czarne"
 tur_black_sea_dominance_desc: "Morze Czarne jest główną drogą handlową łączącą Azję Środkową z Europą. W naszym interesie leży zatem zapewnienie, aby wybrzeże tego bezcennego akwenu znajdowało się wyłącznie pod kontrolą dynastii Osmanów."
 TUR_PONTIC_TRADE: "Kontrola nad Morzem Czarnym"
 tur_black_sea_dominance_tt: "Wybrzeże §YMorza Czarnego§! należy do państwa §Y[Root.GetName]§! lub jego poddanych."
 tur_conquer_mesopotomia_title: "Kolebka cywilizacji"
 tur_conquer_mesopotomia_desc: "Mezopotamia ma ogromne znaczenie z wielu powodów. Dla uczonych jest miejscem, w którym rozkwitły pierwsze ludzkie cywilizacje. Dla ludzi wiary znaczenie Bagdadu dla islamu jest bezdyskusyjne. Dla nas zaś jej żyzne ziemie i strategiczne położenie nad Zatoką Perską czynią ją bezcennym nabytkiem dla nieustannie rosnącego imperium."
 tur_defeat_the_mamluks_title: "Pokonaj Mameluków"
 tur_defeat_the_mamluks_desc: "Sułtanat Mameluków w Egipcie dominuje w świecie islamu od czasu, gdy Mongołowie złupili Bagdad. Choć Mamelucy nazywają się obrońcami kalifa i Świętego Miasta, stali się słabi i zdegenerowani. Nadszedł doskonały moment, by zgłosić roszczenia do ich syryjskich posiadłości i uwolnić najświętsze miasta – Jerozolimę i Damaszek – spod ich władzy."
 tur_defeat_the_mamluks_at: "Wykorzystanie tego casus belli przeciwko @MAM §YMamelukom§! uruchomi specjalny łańcuch wydarzeń, który można wywołać po przejęciu kontroli nad prowincją §Y[MAM.Capital.GetName]§!.
Wydarzenie pozwoli nam ustanowić §Yrdzenny ejalet§! w §YEgipcie§!."
 tur_defeat_the_mamluks_tt: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do obszarów §YBahrajnu§!, §YTabuku§!, §YAn Nafud§!, §Yal-Kasim§!, §YMedyny§! i §YMekki§!."
 tur_conquer_persia_title: "Połóż kres perskiemu zagrożeniu"
 tur_conquer_persia_desc: "Persją władało wiele imperiów, a ostatnim z nich byli Timurydzi – podstępna siła, która spustoszyła wzgórza Anatolii. Choć potęga Timurydów nie jest już taka jak dawniej, w regionie może powstać nowe imperium: nowy perski lew, który spróbuje nas zniszczyć. Musimy uderzyć pierwsi i raz na zawsze usunąć zagrożenie z naszej wschodniej flanki."
 tur_conquer_greece_title: "Zapanuj nad Grecją"
 tur_conquer_greece_desc: "Państwa południowej Grecji mogłyby posłużyć niewiernym za przyczółki do przeprowadzenia przeciwko nam krucjaty. Musimy zabezpieczyć południową flankę, aby zapewnić pomyślność prawdziwemu przywódcy islamu."
 tur_conquer_greece_ct: "Każda posiadana §Ygrecka§! prowincja traci §G100%§! lokalnej autonomii i §G20§! lat separatyzmu."
 tur_push_into_the_balkans_title: "Marsz na północ"
 tur_push_into_the_balkans_desc: "Odkąd węgierski król Zygmunt poprowadził frankijskich krzyżowców przeciwko wojskom osmańskim, nasze ziemie nie są bezpieczne. Choć tamtego dnia Allah zapewnił nam zwycięstwo, musimy posunąć się dalej na Bałkany, aby w przyszłości zagwarantować bezpieczeństwo naszych ziem."
 tur_push_into_the_balkans_ct: "Każda prowincja na §YBałkanach§! należąca do państwa §Y[Root.GetName]§! lub jego poddanych otrzymuje następujące efekty:"
 tur_subjugate_romania_title: "Podporządkuj Rumunów"
 tur_subjugate_romania_desc: "Książęta rumuńskich państw władają stosunkowo ubogimi ziemiami, znajdującymi się w strefach wpływów Węgier i Polski. Nie możemy dopuścić, by terytoria te wpadły w ręce naszych wrogów. Ziemie rumuńskie muszą stać się częścią naszego rosnącego imperium."
 tur_subjugate_romania_at: "Jeśli §Y[WAL.GetName]§! jest naszym poddanym, otrzymuje §G-100%§! pragnienia wolności."
 tur_subjugate_romania_bt: "Jeśli §Y[MOL.GetName]§! jest naszym poddanym, otrzymuje §G-100%§! pragnienia wolności."
 tur_expand_the_devshirme_system_title: "Los systemu dewszirme"
 tur_expand_the_devshirme_system_desc: "Nasze ostatnie podboje przyniosły nam wielu nowych poddanych – wszystkich wyznających błędną wiarę. System dewszirme pozwala pozyskiwać świeżych rekrutów do armii i urzędników spośród podbitych rodzin chrześcijańskich. System ten spotyka się jednak również z krytyką, ponieważ ma swoje wady. Jego dalszy los zależy od nas."
 tur_has_abolished_devshirme_system: "Zniesiono §Ysystem dewszirme§!."
 tur_dismantle_hre_title: "Cesarstwo Rzymskie tylko z nazwy"
 tur_dismantle_hre_desc: "Święte Cesarstwo Rzymskie jest hańbą dla prawdziwych Rzymian. Nazwanie jego systemu rządów nieskutecznym byłoby wręcz komplementem.
Ponownie to na nas spoczywa obowiązek obalenia kolejnego pretendenta do prawdziwego rzymskiego tronu. Święte Cesarstwo Rzymskie – cesarstwo rzymskie tylko z nazwy – musi dziś upaść!"
 tur_conquer_hungary_title: "Zniszcz Węgry"
 tur_conquer_hungary_desc: "Węgry były jednym z głównych uczestników frankijskiej krucjaty przeciwko nam. Nawet jeśli nie istnieją już jako niezależne królestwo i są poddanym dynastii von Habsburgów, Węgrzy nadal stanowią poważne zagrożenie dla naszej dominacji na Bałkanach, długo po klęsce pod Warną.
Musimy uderzyć pierwsi i przejąć ich ziemie, zanim zdołają ponownie zorganizować koalicję przeciwko nam."
 tur_conquer_vienna_title: "Złam potęgę Habsburgów"
 tur_conquer_vienna_desc: "Dynastia von Habsburgów jest największym przeciwnikiem naszych europejskich ambicji. Teraz nasze wspaniałe armie stoją u ich bram, czekając na rozkaz rozpoczęcia oblężenia siedziby habsburskiej potęgi – Wiednia, bramy do Europy."
 tur_conquer_vienna_tt: "Wystąpiło wydarzenie §YUpadek Wiednia§!.
Wydarzenie uruchomi się, jeśli nie wyznajemy §Ychrześcijaństwa§!, wygramy oblężenie prowincji §Y[134.GetName]§! i będziemy ją kontrolować, a co najmniej jedna sąsiednia prowincja będzie należeć do nas lub naszych poddanych."
 tur_conquer_italy_title: "Najedź północne Włochy"
 tur_conquer_italy_desc: "Włosi wielokrotnie angażowali się w konflikty z nami. Na morzu i na lądzie Wenecjanie, Genueńczycy oraz siły papieskie nieustannie szukali sposobu, by położyć kres naszej potędze w Anatolii i na Bałkanach.
Los bywa ironiczny – teraz to my dążymy do zakończenia wpływów północnych Włoch w Europie."
 tur_devleti_rum_title: "Prawdziwe Cesarstwo Rzymskie"
 tur_devleti_rum_desc: "Upadek Cesarstwa Bizantyjskiego nie oznacza końca prawdziwego Cesarstwa Rzymskiego. Jesteśmy jego prawowitą kontynuacją, wybraną przez Allaha. Mamy zatem uzasadnione i boskie prawo do panowania nad dawnym sercem Cesarstwa Rzymskiego – nad samym wielkim miastem Rzymem!"
 tur_address_firman_title: ""
 tur_address_firman_desc: "Po podboju muzułmańskich państw na Półwyspie Iberyjskim tamtejsi muzułmanie są coraz bardziej uciskani przez chrześcijańskich monarchów. Wielu z nich ucieka do sąsiednich państw muzułmańskich. Liczni, dobrze wykształceni uchodźcy mogliby okazać się dla nas bardzo przydatni. Sułtan powinien rozważyć wydanie firmanu, który przyzna im prawo osiedlania się na naszych ziemiach."
 tur_expelling_annexation_of_moriscos_grants_tt: "Jeśli ukończymy tę misję po wygnaniu §Ymorysków§!:"
 tur_moriscos_were_expelled_tt: "§YMoryskowie z Grenady§! zostali wygnani z §YIberii§! lub §Yniedawno§! zaakceptowaliśmy wydarzenie §YMoryskowie szukają schronienia§!.
Wydarzenia te wystąpią, jeśli §Y[GRA.GetName]§! zostanie podbite przez §Y[CAS.GetName]§!."
 tur_alliance_exchange_population_and_historical_friendship_tt: "Jeśli ukończymy tę misję, będąc sojusznikiem lub suwerenem §YGrenady§! albo §YAndaluzji§!:"
 tur_alliance_exchange_population_and_historical_friendship_at: "§Y[GetGranadaOrAndalusia]§! staje się historycznym przyjacielem państwa §Y[Root.GetName]§!.
§Y[GetGranadaOrAndalusia]§! uzyskuje §Yturecki§! jako akceptowaną kulturę, dopóki nie zostanie zdegradowana.
§Y[Root.GetName]§! uzyskuje §Yandaluzyjski§! jako akceptowaną kulturę, dopóki nie zostanie zdegradowana.
Maksymalnie §Y10§! prowincji państwa §Y[GetGranadaOrAndalusia]§! otrzymuje losowo §G1§! poziom rozwoju.
Maksymalnie §Y5§! prowincji państwa §Y[Root.GetName]§! otrzymuje losowo §G2§! poziomy rozwoju."
 tur_allied_married_to_gra_and_tt: "Ma sojusz i małżeństwo królewskie z §YAndaluzją§! lub §YGrenadą§!."
 tur_develop_constantinople_title: "Rozwiń Konstantynijję"
 tur_develop_constantinople_desc: "Konstantynijja wielokrotnie padała ofiarą grabieży, plądrowania i najazdów. To na nas spoczywa obowiązek przywrócenia temu wielkiemu miastu należnej mu świetności."
 tur_rebuild_the_hagia_sophia_title: "Zmień przeznaczenie Hagii Sophii"
 tur_rebuild_the_hagia_sophia_desc: "Niegdyś była to wielka świątynia prawosławia, obecnie znajduje się pod kontrolą wyznawców religii [Root.Religion.GetName]. Jej pierwotna funkcja jako domu Boga dla prawosławia nie jest już odpowiednia. Zamiast tego stanie się świątynią religii [Root.Religion.GetName], której opiekunem będzie [Root.Monarch.GetTitle]."
 tur_expand_the_city_title: "Klejnot Morza Śródziemnego"
 tur_expand_the_city_desc: "Konstantynijja jest sercem naszego imperium. Zasoby naszego państwa służą rozbudowie i rozwojowi metropolii oraz zapewnieniu dobrobytu siedzibie [Root.Monarch.GetTitle]. Miasto rozwija się od czasu podboju, lecz wciąż nie osiągnęło pełnego potencjału, by stać się prawdziwym klejnotem Morza Śródziemnego."
 tur_conquer_egypt_title: "Podporządkuj Egipt"
 tur_conquer_egypt_desc: "Mamelucy są słabi, a ich władza nad Egiptem jest bardzo krucha. Ich siły nie są w stanie obronić sułtanatu. Nadszedł czas, by państwo mameluckie przestało istnieć jako niezależny byt, a Egipt znalazł się pod naszym panowaniem."
 tur_control_the_red_sea_title: "Kontroluj Morze Czerwone"
 tur_control_the_red_sea_desc: "Handel przyprawami jest dochodowym przedsięwzięciem, a towary docierają do Europy przez Zatokę Perską i Morze Czerwone. Dostęp do Zatoki Perskiej nie stanowi większego problemu, lecz południowy kraniec Morza Czerwonego pozostaje poza naszym zasięgiem. Powinniśmy rozszerzyć wpływy na południe i zabezpieczyć cieśninę Bab al-Mandab."
 tur_establish_the_eyalet_of_adal_title: "Ejalet Adal"
 tur_establish_the_eyalet_of_adal_desc: "Nasi muzułmańscy bracia w Rogu Afryki są zagrożeni najazdem chrześcijańskich niewiernych z Etiopii lub, co gorsza, pogańskich ludów Oromo. Powinniśmy interweniować i ustanowić ejalet Adal, aby zabezpieczyć muzułmańską kontrolę nad tym regionem.
Dodatkowymi korzyściami będą wzrost naszych wpływów dyplomatycznych i handlowych w Rogu Afryki oraz umocnienie kontroli nad Morzem Czerwonym."
 tur_conquer_tunis_title: "Zgnieć Hafsydów"
 tur_conquer_tunis_desc: "Korsarscy władcy Maghrebu od zawsze cieszyli się niezależnością. Ich działania przeciwko naszym europejskim wrogom bywają użyteczne, lecz są nieplanowane i chaotyczne. Nadszedł czas, by podporządkować sobie tych zahartowanych żeglarzy i przebiegłych kapitanów oraz wcielić ich do naszej floty."
 tur_al_andalus_eyalet_title: "Ejalet Al-Andalus"
 tur_al_andalus_eyalet_desc: "Niewierni z Iberii zniszczyli muzułmańskie państwa, które przez stulecia dominowały na południu półwyspu, a teraz stanowią bastion chrześcijaństwa w Europie Zachodniej. Nasze granice nigdy nie były bliżej, dlatego wojny i konflikty z Iberami są nieuniknione.
Musimy udowodnić naszą wyższość. Wypędzimy Hiszpanów i Portugalczyków z Iberii, a na ich miejscu ustanowimy ejalet Al-Andalus!"
 tur_al_andalus_eyalet_ct: "Dowolny sojusznik lub poddany państwa §Y[Root.GetName]§!, wyznający religię §Y[Root.Religion.GetName]§! i mający stolicę w §YIberii§!, posiada prowincje §Y[225.GetName]§!, §Y[223.GetName]§!, §Y[226.GetName]§! i §Y[224.GetName]§! oraz §Y6§! innych prowincji w §YIberii§!."
 tur_al_andalus_eyalet_at: "Jeśli ukończymy tę misję za pośrednictwem §Ysojusznika§! lub §Ypoddanego§! w §YIberii§!:"
 tur_al_andalus_eyalet_bt: "Sojusznik lub poddany spełniający wymagania misji również otrzyma ten modyfikator."
 tur_al_andalus_eyalet_dt: "Wydarzenie pozwoli nam ustanowić §Yejalet§! w Iberii."
 tur_the_algerian_corsairs_title: "Algierscy korsarze"
 tur_the_algerian_corsairs_desc: "Algieria i całe Wybrzeże Berberyjskie od średniowiecza stanowią bezpieczną przystań dla muzułmańskich piratów Maghrebu. Podobnie jak tunezyjscy najeźdźcy, Algierczycy i Berberowie mogą przynosić nam korzyści, atakując naszych chrześcijańskich wrogów, lecz ich skuteczność pozostawia... wiele do życzenia. Szkody, jakie mogliby wyrządzić, byłyby znacznie większe, gdybyśmy przejęli kontrolę nad administracją ich państw."
 tur_conquer_morocco_title: "Chroń Maroko"
 tur_conquer_morocco_desc: "Sułtanat Maroka znajduje się w niepewnej sytuacji od czasu, gdy rekonkwista zdziesiątkowała muzułmanów w Iberii. Jako wierni muzułmanie mamy obowiązek przejąć sułtanat Maroka i ochronić go przed zachłannymi chrześcijańskimi królestwami."
 tur_handle_the_egyptian_eyalet_title: "Los Mameluków"
 tur_handle_the_egyptian_eyalet_desc: "Egipt uległ naszemu nieustępliwemu natarciu, a sułtanat mamelucki przestał istnieć. Pozostała jednak jedna kwestia do rozstrzygnięcia: sposób zarządzania nowo podbitym terytorium oraz los Mameluków, którzy niegdyś władali tymi ziemiami niezależnie."
 tur_handle_the_egyptian_eyalet_at: "Wymagania tej misji zostaną ujawnione po ukończeniu misji §YPodporządkuj Egipt§!."
 tur_handle_the_egyptian_eyalet_bt: "Nagrody za tę misję zostaną ujawnione po ukończeniu misji §YPodporządkuj Egipt§!."
 tur_handle_the_egyptian_eyalet_ct: "Maksymalnie §Y10§! prowincji w regionie §YEgiptu§! otrzymuje §G1§! podstawowej produkcji."
 tur_fate_of_the_patriarchate_title: ""
