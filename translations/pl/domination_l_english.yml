 qng_north_china_gets_tt: "Wszystkie prowincje w §YPółnocnych Chinach§!, należące do nas lub naszych poddanych niebędących państwami trybutarnymi, otrzymają:"
 qng_branching_mission_open_tt: "Wymagania ukończenia tej misji §Ypo otwarciu naszych portów§! będą następujące:"
 qng_complete_3_stab_5_crownland_tt: "
Jeśli ukończymy tę misję, mając §G3§! punkty stabilności, otrzymamy również §Y5% ziemi koronnej§!"
 qng_branching_mission_isolated_tt: "Natomiast wymagania ukończenia tej misji §Ypo odizolowaniu naszych portów§! będą następujące:"
 qng_passing_decree_reduces_autonomy_everywhere_by_5_tt: "
Każdy edykt uchwalony przez nas jako §YCesarz Chin§! obniży autonomię wszystkich posiadanych prowincji o §G-10%§!"
 qng_free_trade_reward_tt: "Jeśli wybierzemy „§YWolny handel§!”:"
 qng_mercantilism_reawrd_tt: "
Jeśli natomiast wybierzemy „§YMerkantylistyczne podejście§!”, otrzymamy:"
 qng_explain_pli_tt: "
Ukończenie misji „§YWspieranie rodzimego przemysłu§!” pozwoli nam rozwinąć §Yprodukcję§! naszych §Ytowarów handlowych§! i wzmocnić produkcję wewnętrzną."
 qng_explain_afe_tt: "Ukończenie misji „§YZezwolenie na wymianę zagraniczną§!” zapewni nam silną pozycję na §Yrynku światowym§! i zmniejszy pragnienie wolności naszych ewentualnych §Ypaństw kolonialnych§!."
 qng_no_westerners_in_our_ports_tt: "Żadne zachodnie państwo nie posiada co najmniej §Y10%§! siły handlu w żadnym z następujących węzłów handlowych:
 §YPekin§!
 §YHangzhou§!
 §YKanton§!"
 qng_explain_cir_tt: "Ukończenie misji „§YChińska rewolucja przemysłowa§!” zapewni nam silny, §Ystały§! bonus do produkcji towarów, a także dostęp do wyjątkowego §Yedyktu państwowego§!."
 qng_explain_ldp_tt: "
Ukończenie misji „§YWypędzenie zagranicznych kupców§!” uczyni nasze rynki „§YCentrum handlowym pożądanym przez cały świat§!”, a nam pozwoli nakładać §Yrestrykcje inflacyjne§! na zagraniczne rynki handlowe zależnie od ich udziału w poszczególnych węzłach."
 qng_pull_the_lever_qing_tt: "
W każdym europejskim nadmorskim węźle handlowym, w którym posiadamy co najmniej §Y25%§! siły handlu, wszystkie państwa niebędące naszymi §Ypodwładnymi§! ani §Ysojusznikami§! doświadczą §Rinflacyjnego załamania gospodarczego§!."
 enable_industrialisation_tt: "
Odblokowuje edykt państwowy „§YSzybka industrializacja§!”, który przyniesie korzyści naszym rozwijającym się prowincjom §Yw trakcie ich rozwoju§!."
 qng_event_insight_12_tt: "
§GInformacje o wydarzeniu§!:
Wydarzenie upamiętni nasze zwycięstwo podczas wypraw birmańskich, wynosząc miasto [586.GetName] i jego §Ycesarski pałac§! do rangi symbolu naszego triumfu."
 flavor_mch.12.t: "Zwycięstwo w mieście [586.GetName]"
 flavor_mch.12.d: "Gdy nasze wojska przekraczają bramy [586.GetName], nie możemy oprzeć się myśli o świetlanej przyszłości, którą zapowiadają nasze liczne zwycięstwa na polach bitew i poza granicami państwa. Wraz ze wzrostem naszych wpływów w Indochinach musimy znaleźć symbol, który z dumą ukażemy nowo podbitym poddanym, aby umocnić nasze panowanie nad tym regionem. Potrzebujemy miasta, które będzie natchnieniem do męstwa i ostoją prestiżu — niezrównanym świadectwem naszej potęgi."
 flavor_mch.12.a: "Miasto godne majestatu naszego Cesarza!"
 flavor_mch.13.t: "Złoty wiek Kangxi i [Root.Monarch.GetName]"
 flavor_mch.13.d: "Dobrobyt i potęga cesarstwa osiągnęły nowy szczyt. Sprawy wewnętrzne układają się pomyślnie, a przyjęty przez nas model merytokratycznych rządów pozwala sprawnie zarządzać Chinami. Dzięki roztropnemu przewodnictwu [Root.Monarch.GetName] nasi biurokraci przekształcili państwo w potęgę handlową, której ludność jest niemal dwukrotnie liczniejsza niż za panowania poprzedniej dynastii. Sinizacja doprowadziła do powstania wyjątkowej wspólnoty kulturowej Hanów i Mandżurów, łączącej zachowanie tożsamości narodowych z asymilacją. Kierując się zamiłowaniem do nauki i sztuki, [Root.Monarch.GetName] zapoczątkował złotą epokę dobrobytu dla wszystkich ludów żyjących pod naszymi sztandarami!"
 flavor_mch.13.a: "To bez wątpienia znak przychylności Niebios!"
 qng_grand_council_reform: "Junji Chu"
 qng_grand_council_reform_desc: "Potężny organ ustawodawczy, złożony z osobiście wybranych doradców, których Cesarz może wezwać w każdej chwili. Ich zdolności administracyjne z pewnością pomogą nam sprawnie zarządzać rozległym cesarstwem."
 chinese_industrialization: "Szybka industrializacja"
 chinese_industrialization_desc: "Tworząc silne ośrodki przemysłowe w naszych prowincjach, zdołamy szybko uprzemysłowić całe państwo."
 solidify_our_borders_title: "Umocnienie naszych granic"
 solidify_our_borders_desc: "Niepokoje, które ogarnęły naszą ojczyznę, grożą pochłonięciem nas wszystkich. Aby przetrwać, musimy rozszerzyć nasze władztwo i zabezpieczyć jego granice."
