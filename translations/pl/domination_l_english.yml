 mjz_subjugation_reaward_tt: "
Jeśli ukończymy misję poprzez podporządkowanie sobie państwa §Yałtajskiego§!:"
 mch_manchuria_region_minus_2_provinces_tt: "Region Mandżurii, z wyjątkiem prowincji [1033.GetName] i [4658.GetName], należy do nas lub naszych poddanych niebędących państwami trybutarnymi."
 mch_event_insight_9_tt: "
§GInformacje o wydarzeniu§!:
To wydarzenie opowiada historię §Ylegendarnego wodza§!, który pewnego dnia może zjednoczyć plemiona i ogłosić powstanie nowej §Ydynastii§!."
 mjz_all_country_of_manchuria_of_root_culture_less_army_than_root_tt: "Wszystkie państwa ze stolicą w §Yregionie Mandżurii§!, których kultura jest zgodna z naszą §Ykulturą§!, mają mniejszą §Yarmię§! niż [Root.GetName]."
 mch_event_insight_10_tt: "
§GInformacje o wydarzeniu§!:
To wydarzenie zapewni naszemu władcy §Ypotężny§! modyfikator, gdy rozpoczniemy podbój §YChin§!."
 mch_event_insight_1_tt: "
§GInformacje o wydarzeniu§!:
To wydarzenie pozwoli naszemu oświeconemu władcy przekształcić naszą §Ybiurokrację§! i §Yarmię§!, a tym samym scentralizować sprawy wewnętrzne."
 mch_event_insight_11_tt: "
§GInformacje o wydarzeniu§!:
To wydarzenie pozwoli nam przyjąć jeden z aspektów państwa @KOR Korea jako część naszego kraju."
