 EST_VAL_JANISSARIES_DENIED_LAND_OWNERSHIP: "Odmowa przyznania własności ziemskiej: §Y$VAL$%§!"
 EST_VAL_JANISSARIES_FORCED_TO_FIGHT: "Zmuszenie do walki: §Y$VAL$%§!"
 EST_VAL_EXTENDED_JANISSARY_PRIVILEGES: "Spełnione żądania: §Y$VAL$%§!"
 EST_VAL_NO_EXTENDED_JANISSARY_PRIVILEGES: "Odrzucone żądania: §Y$VAL$%§!"
 janissary_policemen: "Janczarzy jako policja"
 desc_janissary_policemen: "Janczarzy zostali wyznaczeni do pełnienia służby policyjnej na rzecz państwa.\n\n§YTrwa do momentu, gdy państwo [Root.GetUsableName] wypowie wojnę.§!"
 janissary_fireighters: "Janczarzy jako straż pożarna"
 desc_janissary_fireighters: "Janczarzy zostali wyznaczeni do pełnienia służby strażackiej na rzecz państwa.\n\n§YTrwa do momentu, gdy państwo [Root.GetUsableName] wypowie wojnę.§!"
 janissary_palace_guardians: "Janczarzy jako straż pałacowa"
 desc_janissary_palace_guardians: "Janczarzy zostali wyznaczeni do pełnienia służby straży pałacowej.\n\n§YTrwa do momentu, gdy państwo [Root.GetUsableName] wypowie wojnę.§!"
 janissary_mehteran: "Mehterân"
 desc_janissary_mehteran: "Zainwestowaliśmy w okazałą orkiestrę marszową mehterân, aby zagrzewała janczarów do nadchodzących bitew."
 janissary_loyalty_to_the_sultan: "Lojalność wobec władcy"
 desc_janissary_loyalty_to_the_sultan: "Dzięki dobrym stosunkom z janczarami [Root.Monarch.GetTitle] zapewnił sobie ich bezwzględną lojalność na najbliższą przyszłość."
 janissary_scholar_and_merchants: "Uczeni i kupcy wśród janczarów"
 desc_janissary_scholar_and_merchants: "Nasza decyzja, by pozwolić janczarom rozwijać własne zainteresowania, doprowadziła do znacznego wzrostu liczby uczonych i kupców w państwie [Root.GovernmentName]. Odbywa się to jednak kosztem ich gotowości bojowej."
 janissary_unfit_for_fighting: "Zgnuśniali janczarzy"
 desc_janissary_unfit_for_fighting: "Nasza decyzja, by pozwolić janczarom rozwijać własne zainteresowania, doprowadziła do znacznego wzrostu liczby uczonych i kupców w państwie [Root.GovernmentName]. Odbywa się to jednak kosztem ich gotowości bojowej."
 estate_disasters.21.t: "Janczarzy wybijają się na niepodległość"
 estate_disasters.21.d: "Agowie janczarów rozszerzyli swoje wpływy i władzę na rozległe terytoria naszego państwa. Tam, gdzie niegdyś rządzili lojalni paszowie, teraz władzę sprawują janczarzy, którzy nie widzą już powodu, by walczyć dla swojego [Root.Monarch.GetTitle]. [Root.Monarch.GetName] może jedynie zaakceptować fakt, że nie ma już praktycznej kontroli nad tym obszarem ani stacjonującymi tam janczarami. Koronacja własnego przywódcy dopełnia secesji, a my tracimy władzę nad znaczną częścią korpusu janczarskiego."
 random_event.27.t: "Wielki pożar w [Root.Capital.GetName] ([GetDate])"
 random_event.27.desc: "[Root.Capital.GetName] nawiedziła tragedia! Gdy nad miastem pojawiły się olbrzymie chmury dymu, płomienie pochłonęły stare miasto i wiele dzielnic [Root.Capital.GetName]. Przez trzy kolejne dni pożar szalał, niszcząc kluczową infrastrukturę oraz domy mieszkańców."
 random_event.27.a: "Co za fatalny tydzień dla mieszczan."
 establish_sinmun_office_title: "Urząd Sinmun"
 establish_sinmun_office_desc: "Poddani, którzy czują się wyzyskiwani lub niesprawiedliwie traktowani przez rząd albo swoich zwierzchników, mają niewielkie lub żadne możliwości wyrażenia swoich obaw. Zaproponowano utworzenie specjalnej jednostki rządowej, która rozpatrywałaby takie sprawy."
 promote_sojunghwa_decision_title: "Promuj sojunghwa"
 promote_sojunghwa_decision_desc: "Cesarstwo Chińskie upadło pod naporem drobnych barbarzyńców! Sama idea Mandatu Niebios została wypaczona, gdy hordy dzikusów podbiły chińskie ziemie.
To na państwie [Root.GetUsableName] spoczywa obowiązek przejęcia roli prawdziwego chińskiego państwa."
 sojunghwa: "Sojunghwa"
 desc_sojunghwa: "Sojunghwa („Małe Chiny”) jest podstawową ideologią naszego państwa. Dawne Niebiańskie Cesarstwo upadło pod naporem barbarzyńców, a teraz to na nas spoczywa obowiązek kontynuowania jego dziedzictwa."
 mos_the_civil_war_title: "Wojna domowa w Moskwie"
 mos_the_civil_war_desc: "Zgodnie z moskiewską tradycją tron księstwa obejmuje najstarszy brat. Wasyl I znał tę zasadę, a mimo to wyznaczył Wasyla II na swojego następcę. W rezultacie nasze państwo musiało przejść przez dwa okresy wojny domowej. Ostatecznie rywal do tronu, Jurij Dmitrijewicz, został pokonany. Jego syn, Dymitr Szemiaka, nadal jednak pragnie korony. Musimy dopilnować, by ta wojna domowa dobiegła końca."
 mos_the_civil_war_at: "§YWasył II Ślepy§! nie jest już [Root.Monarch.GetTitle] państwa §Y[Root.GetName]§!."
 mos_the_civil_war_bt: "Zakończono łańcuch wydarzeń „§YWojna domowa w Moskwie§!”."
 mos_secure_muscovys_future_title: "Zapewnij silne przywództwo"
 mos_secure_muscovys_future_desc: "Jest oczywiste, że państwo [Root.GovernmentName] stanie w przyszłości przed wieloma wyzwaniami. Potrzebujemy silnego przywództwa, aby im sprostać i poprowadzić państwo [Root.GetUsableName] ku złotej przyszłości."
 mos_rus_window_on_the_west_title: "Okno na Zachód"
 mos_rus_window_on_the_west_desc: "Morze Bałtyckie jest ważnym węzłem handlowym i gospodarczą linią życia państw Polski, Skandynawii i Rusi. Niezwykle istotne jest, abyśmy poprawili dostęp do dochodowego handlu bałtyckiego."
 nov_rus_window_on_the_west_title: "Okno na Zachód"
 nov_rus_window_on_the_west_desc: "Morze Bałtyckie jest ważnym węzłem handlowym i gospodarczą linią życia państw Polski, Skandynawii i Rusi. Niezwykle istotne jest, abyśmy poprawili dostęp do dochodowego handlu bałtyckiego."
 mos_rus_conquer_finland_title: "Podbój Finlandii"
 mos_rus_conquer_finland_desc: "Królestwa skandynawskie od stuleci są cierniem w boku narodu [Root.GetAdjective]. Bezpośrednio rywalizują z nami o dominację w handlu na Morzu Bałtyckim i stanowią zagrożenie, jeśli zgromadzą potężnych sojuszników w Europie. Musimy uderzyć pierwsi i wkroczyć do Skandynawii, podbijając ziemie Finów."
 mos_rus_conquer_finland_at: "To wydarzenie pozwoli nam uwolnić @FIN §YFinlandię§! jako §Yunię personalną§! i odblokuje dostęp do §Jkawalerii hakkapeliitta§!. Alternatywnie otrzymamy 75 £adm£.
"
 nov_rus_conquer_finland_title: "Podbój Finlandii"
 nov_rus_conquer_finland_desc: "Królestwa skandynawskie od stuleci są cierniem w boku narodu [Root.GetAdjective]. Bezpośrednio rywalizują z nami o dominację w handlu na Morzu Bałtyckim i stanowią zagrożenie, jeśli zgromadzą potężnych sojuszników w Europie. Musimy uderzyć pierwsi i wkroczyć do Skandynawii, podbijając ziemie Finów."
 mos_rus_subjugate_scandinavia_title: "Zgładź Lwa Północy"
 mos_rus_subjugate_scandinavia_desc: "Nasze pierwsze natarcie na Finlandię zakończyło się wielkim sukcesem. Lew Północy nadal jednak zasiada na swoim tronie. Musimy kontynuować marsz przez Skandynawię i położyć kres zagrożeniu ze strony trzech królestw."
 mos_rus_subjugate_scandinavia_at: "Jeśli §YFinlandia§! jest naszym poddanym:"
 mos_rus_subjugate_scandinavia_bt: "Misje @FIN §YFinlandii§! mogą być teraz wykonywane, gdy jest ona poddanym."
 mos_rus_subjugate_scandinavia_ct: "Jeśli §YFinlandia§! nie jest naszym poddanym:"
 nov_rus_subjugate_scandinavia_title: "Zgładź Lwa Północy"
 nov_rus_subjugate_scandinavia_desc: "Nasze pierwsze natarcie na Finlandię zakończyło się wielkim sukcesem. Lew Północy nadal jednak zasiada na swoim tronie. Musimy kontynuować marsz przez Skandynawię i położyć kres zagrożeniu ze strony trzech królestw."
 mos_rus_europes_greatest_power_title: "Wschodnie mocarstwo"
 mos_rus_europes_greatest_power_desc: "Scena europejska jest już gotowa. Królestwa upadają lub przekształcają się w imperia, które kształtują świat wedle własnej woli. Nie możemy pozostać w tyle. Spośród wszystkich tych imperiów to Imperium Rosyjskie wzniesie się na szczyt światowych potęg."
 mos_rus_conquer_novgorod_title: "Najedź Nowogród"
 mos_rus_conquer_novgorod_desc: "Republika wiecowa Nowogrodu od stuleci opiera się podporządkowaniu. Ani dzikie hordy, ani zacofani bojarzy nie zdołali doprowadzić do jej upadku. To na nas spoczywa obowiązek położenia kresu tej aroganckiej republice i przejęcia jej terytorium."
 mos_rus_conquer_ruthenia_title: "Podbij Ruś"
 mos_rus_conquer_ruthenia_desc: "Rzeczpospolita jest zbyt słaba i niezdolna do rządzenia dumnymi ludami Rusi i Białorusi. Inne państwa również doszły do tego wniosku. Najwyższy czas działać, zanim region zostanie podzielony między naszych rywali."
 nov_rus_handle_ruthenia_title: "Podbij Ruś"
 nov_rus_handle_ruthenia_desc: "Rzeczpospolita jest zarówno zbyt słaba, jak i niezdolna do rządzenia dumnymi ludami Rusi i Białorusi. Inne kraje również doszły do tego samego wniosku. Najwyższy czas podjąć działania, zapobiegające podzielenia regionu pomiędzy naszych rywali."
 mos_rus_conquer_ruthenia_at: "Wydarzenie pozwoli nam wybrać jeden aspekt rozwoju prowincji §Y[280.GetName]§!."
 mos_rus_partition_poland_title: "Rozbiór Polski"
 mos_rus_partition_poland_desc: "Polska jest słabym państwem kierowanym przez słabych władców. Wiodące narody świata, a zwłaszcza nasz własny, powinny podzielić ją przy pierwszej okazji."
 mos_rus_partition_poland_at: "do czasu zdegradowania dowolnej kultury z grupy kulturowej §Yzachodniosłowiańskiej§!"
 nov_rus_deal_with_poland_title: "Rozbiór Polski"
 nov_rus_deal_with_poland_desc: "Polska jest słabym państwem kierowanym przez słabych władców. Wiodące narody świata, a zwłaszcza nasz własny, powinny podzielić ją przy pierwszej okazji."
 nov_rus_take_danzig_title: "Zdobądź Gdańsk"
 nov_rus_take_danzig_desc: "Gdańsk jest jednym z najbogatszych i najbardziej strategicznych portów na Bałtyku. Oczywiście o miasto zabiegają Krzyżacy, Korona Polska, Hanza i skandynawscy monarchowie. Nie wiedzą jednak, że Gdańsk słusznie należy do Matki Rosji."
 mos_rus_carpathian_conquest_title: "Anektuj Karpaty"
 mos_rus_carpathian_conquest_desc: "Kotlina Karpacka jest domem naszych braci w wierze, którzy cierpią pod heretycką okupacją. Naszym obowiązkiem jest wyzwolić te biedne dusze ze szponów ciemiężycieli."
 mos_rus_carpathian_conquest_at: "do czasu zdegradowania dowolnej kultury z grupy kulturowej §Ykarpackiej§!"
 PERMANENT: "stałe "
 mos_rus_carpathian_conquest_ct: "§Y[Root.GetName]§! otrzymuje [Root.GetPermanentOrEmpty]roszczenia do każdej prowincji §Ypołudniowosłowiańskiej§! w regionie §YBałkanów§!."
 mos_rus_protect_south_slavs_title: "Chroń południowych Słowian"
 mos_rus_protect_south_slavs_desc: "Południowi Słowianie na Bałkanach są zbyt słabi, by sami się obronić. Są jedynie pionkami w rękach bluźnierczego cesarza Świętego Cesarstwa Rzymskiego i diabelskiego sułtana Osmanów. Musimy wkroczyć na Bałkany i ochronić ich przed przeklętymi zagrożeniami."
 mos_rus_protect_south_slavs_at: "do czasu zdegradowania dowolnej kultury z grupy kulturowej §Ypołudniowosłowiańskiej§!"
 mos_rus_protect_south_slavs_bt: "Utwórz grupę kulturową §Y słowiańską§!."
 mos_rus_claim_the_third_rome_title: "Trzeci Rzym"
 mos_rus_claim_the_third_rome_desc: "Po upadku Cesarstwa Bizantyjskiego państwo [Root.GetUsableName] jest jedynym krajem, który może rościć sobie prawo do tytułu „Trzeciego Rzymu”. Tytuł ten, uzyskany dzięki małżeństwu dynastycznemu, pozostaje jednak jedynie roszczeniem, dopóki nie uprawomocnimy go w oczach świata, przejmując kontrolę nad Miastem Pożądania Świata – samym Konstantynopolem."
 mos_rus_claim_the_third_rome_at: "To wydarzenie pozwoli nam przenieść stolicę do prowincji §Y[151.GetName]§! i ją rozwinąć albo kontynuować rozwój prowincji §Y[Root.Capital.GetName]§!."
 nov_rus_involve_in_asian_trade_title: "Handel azjatycki"
 nov_rus_involve_in_asian_trade_desc: "Początkowo kierowani poszukiwaniem futer, rozszerzyliśmy zasięg naszego państwa [Root.GovernmentName] na wschód i dotarliśmy do rynków z towarami nieznanymi naszym zachodnim sąsiadom. Dla pomyślności Matki Rosji musimy zaangażować się w ten handel!"
 nov_rus_involve_in_asian_trade_at: "Jeśli ukończymy tę misję, uczestnicząc w handlu w węźle §YYumen§!:"
 nov_rus_involve_in_asian_trade_bt: "Jeśli ukończymy tę misję, uczestnicząc w handlu w węźle §YLahore§!:"
 nov_rus_dominate_asian_market_title: "Zmonopolizuj rynki azjatyckie"
 nov_rus_dominate_asian_market_desc: "Handel z Indiami i Chinami przynosi ogromne zyski. Nic dziwnego, że nasi rywale również chcą uczestniczyć w tych rynkach. Musimy zapewnić sobie wyłączny dostęp do azjatyckich towarów."
 nov_rus_compete_in_the_channel_title: "Rosyjski szlak"
 nov_rus_compete_in_the_channel_desc: "Uzyskaliśmy pełny dostęp do rynków indyjskich i chińskich, a najcenniejsze towary kierujemy do naszego głównego portu przeładunkowego w Europie. To jednak dopiero początek znacznie większego przedsięwzięcia. Ożywmy Jedwabny Szlak i przekształćmy go w drogę, którą bogactwa Azji będą trafiać do Europy."
 nov_rus_compete_in_the_channel_at: "Państwo [Root.GetName] posiada §Ypremię handlową§! do jednego z następujących dóbr: §Yporcelany§!, §Ytkanin§!, §Ypapieru§!, §Yjedwabiu§!, §Yherbaty§!, §Ybarwników§! lub §Yprzypraw§!."
 RUS_RUSSIAN_ENGLISH_COMPETITION: "Rywalizacja w Kanale"
 RUS_PERMANENT_BATLIC_SEA_ACCESS: "Stały dostęp do Morza Bałtyckiego"
 nov_rus_conquer_muscovy_title: "Połóż kres Moskwie"
 nov_rus_conquer_muscovy_desc: "W początkach naszego istnienia, jeszcze przed proklamowaniem państwa [Root.GovernmentName], rywalizowaliśmy z Rurykowiczami z Moskwy. Nie stanowią już aktywnego zagrożenia, lecz samo ich istnienie jest obrazą dla wszystkiego, co reprezentuje kultura [Root.Culture.GetName]."
 nov_rus_monopolize_lubeck_title: "Zdominuj Lubekę"
 nov_rus_monopolize_lubeck_desc: "Kupcy i handlarze znad Morza Bałtyckiego podróżują do Lubeki, aby sprzedawać swoje towary na jej bogatych rynkach. Miasto musi należeć do nas, abyśmy mogli zmonopolizować tamtejszy handel."
 nov_rus_trade_empire_of_europe_title: "Handlowe imperium Europy"
 nov_rus_trade_empire_of_europe_desc: "Królestwa stają się imperiami dzięki podbojom i rozlewowi krwi. Choć jest to opłacalne, nie dorównuje wyrafinowaniu naszych metod wywierania wpływu. Nasze państwo [Root.GovernmentName] będzie znane światu jako handlowe imperium Europy, kontrolujące przepływ dukatów."
 nov_rus_trade_empire_of_europe_at: "Europejskie węzły handlowe:
    Państwo §Y[Root.GetName]§! ma co najmniej §Y40%§! siły handlu."
 mos_rus_build_up_army_title: "Zbierz armię"
 mos_rus_build_up_army_desc: "Hordy na wschodzie, rosnąca w siłę Polska na zachodzie i imperialistyczne Imperium Osmańskie na południu. Mamy wielu wrogów i niewielu sojuszników. Musimy zgromadzić nasze wojska, jeśli państwo [Root.GetUsableName] ma przetrwać nadchodzące stulecia."
 mos_rus_build_up_army_at: "To wydarzenie pozwoli nam uzyskać potężny modyfikator w zamian za przekształcenie WSZYSTKICH §Ystałych roszczeń§! z naszych misji w §Ytymczasowe roszczenia§!."
 mos_rus_eliminate_the_minors_title: "Zjednocz Rosję"
 mos_rus_eliminate_the_minors_desc: "Ruś jest podzielona między wielu słabych i małostkowych książąt. Żaden z nich nie zasługuje na władzę nad wschodniosłowiańskimi ludami. Dziedzice Ruryka muszą ugiąć kolana przed potęgą państwa [Root.GetUsableName]."
 rus_unifier_of_russia: "Zjednoczyciel Rosji"
 desc_rus_unifier_of_russia: "[Root.Monarch.GetName], [Root.Monarch.GetTitle] Rusi, zjednoczył region rosyjski pod chwalebnymi rządami państwa [Root.GetUsableName]. Niech jego panowanie będzie okresem jedności i siły."
 mos_rus_eliminate_the_minors_at: "Do §Y10§! prowincji w regionie §YRosji§! otrzymuje §G1§! podstawowych zasobów ludzkich."
 mos_rus_conquer_crimea_title: "Dostęp do Morza Czarnego"
 mos_rus_conquer_crimea_desc: "Porty Morza Białego są użyteczne jedynie przez trzy miesiące w roku. Morze Bałtyckie jest bardziej dostępne, lecz zaciekle rywalizują o nie nasi przeciwnicy.
Państwo potrzebuje portu nad ciepłym morzem, aby móc prowadzić handel i żeglugę. Najbliższe takie porty znajdują się na Krymie. Ojczyzna musi zgłosić roszczenia do tego regionu!"
 mos_rus_conquer_the_caucasus_title: "Marsz na Kaukaz"
 mos_rus_conquer_the_caucasus_desc: "Kaukaz jest podzielony między liczne królestwa otoczone przez muzułmańskie zagrożenia. Jeśli nie zainterweniujemy, ich upadek jest nieunikniony. Chrześcijanie zamieszkujący te góry muszą zostać ochronieni – mieczem lub piórem."
 mos_rus_conquer_the_caucasus_tt: "Dowolny sojusznik ze stolicą w regionie §YKaukazu§!:\n    Posiada co najmniej §Y15§! prowincji.\n    Wyznaje religię z grupy §Y[Root.Religion.GetGroupName]§!.\n    Ma co najmniej §Y100§! opinii o państwie §Y[Root.GetName]§!."
 mos_rus_conquer_the_caucasus_at: "Jeśli ukończymy tę misję, podbijając §Y15§! prowincji w regionie §YKaukazu§!:"
 mos_rus_conquer_the_caucasus_bt: "Jeśli ukończymy tę misję, posiadając sojusznika w regionie §YKaukazu§!, który spełnia drugi warunek:"
 mos_rus_conquer_the_caucasus_ct: "Nasz sojusznik również otrzyma ten sam modyfikator.\n\nKażda prowincja w regionie §YKaukazji§! należąca do państwa §Y[Root.GetName]§!, jego poddanych lub sojuszników otrzymuje następujące efekty:"
 mos_rus_conquer_persia_title: "Za Morzem Kaspijskim"
 mos_rus_conquer_persia_desc: "Kaukaz i pustynie Azji Środkowej znajdują się pod naszą kontrolą. Wielki Jedwabny Szlak prowadzi jednak przez perskie góry po drugiej stronie Morza Kaspijskiego. Aby w pełni skorzystać z naszych podbojów, musimy zapewnić sobie dostęp do handlu perskiego – bezpośrednio poprzez podbój lub pośrednio dzięki sojuszowi."
 mos_rus_conquer_persia_at: "Jest częścią węzła handlowego §YPersja§!."
 mos_rus_conquer_persia_bt: "Dowolny sojusznik z grupy religijnej §Y[Root.Religion.GetGroupName]§!, którego stolica znajduje się w regionie §YKaukazu§!, posiada lub ma poddanego posiadającego co najmniej §Y20§! prowincji w regionie §YPersji§!."
 mos_rus_conquer_persia_ct: "Jeśli ukończymy tę misję, podbijając §Y6§! prowincji o istotnym znaczeniu handlowym w węźle §YPersja§!:"
 mos_rus_conquer_persia_dt: "Jeśli ukończymy tę misję, posiadając sojusznika spełniającego drugi warunek:"
 mos_rus_conquer_persia_et: "To wydarzenie pozwoli nam poprosić naszego sojusznika o zostanie poddanym państwa §Y[Root.GetName]§!."
 mos_rus_land_of_churches_title: "Kraj cerkwi"
 mos_rus_land_of_churches_desc: "Konieczne jest, aby każdy obywatel naszego kraju, od księcia po chłopa, miał dostęp do duchowego przewodnictwa naszego kapłaństwa. Każda wioska musi mieć cerkiew."
 icon_climacus_reward_tt: "Jeśli zamówiliśmy §Yikonę św. Jana Klimaka§!:"
 icon_eleusa_reward_tt: "Jeśli zamówiliśmy §Yikonę Eleusy§!:"
 icon_michael_reward_tt: "Jeśli zamówiliśmy §Yikonę św. Michała§!:"
 icon_nicholas_reward_tt: "Jeśli zamówiliśmy §Yikonę św. Mikołaja§!:"
 icon_pancreator_reward_tt: "Jeśli zamówiliśmy §Yikonę Chrystusa Pantokratora§!:"
 mos_rus_russian_patriarchate_title: "Patriarchat Rosyjski"
 mos_rus_russian_patriarchate_desc: "Konstantynopol nie może być duchowym centrum prawosławnego chrześcijaństwa bez legitymizacji cesarza bizantyjskiego. Dlatego musimy go zastąpić i ustanowić Trzeci Rzym!"
 mos_rus_conquer_the_great_horde_title: "Przełam jarzmo tatarskie"
 mos_rus_conquer_the_great_horde_desc: "Wielka Orda i inne koczownicze plemiona na naszych granicach narzuciły dumnemu narodowi rosyjskiemu swoje haniebne jarzmo. Żądając co roku niewspółmiernie wysokiej daniny, hordy stanowią niebezpieczną plagę dla naszego państwa.
Jeśli chcemy stać się wielkim imperium, które rzeczywiście może rościć sobie prawo do dziedzictwa Rzymian, musimy wyzwolić się spod jarzma tatarskiego."
 mos_rus_end_the_tatar_yok_title: "Zniszcz hordy"
 mos_rus_end_the_tatar_yok_desc: "Jarzmo tatarskie zostało przełamane, lecz bezpieczeństwo naszego ludu nadal jest niepewne, dopóki istnieją dziedzice Imperium Mongolskiego. Żaden z tych stepowych nomadów nie uniknie gniewu Matki Rosji!"
 mos_rus_conquer_central_asia_title: "Zjednocz stepy"
 mos_rus_conquer_central_asia_desc: "Mimo że pokonaliśmy wiele z najbardziej niebezpiecznych hord, możemy poprawić naszą strategiczną pozycję na stepach jeszcze bardziej. Zjednoczmy region i podporządkujmy sobie pozostałych nomadów."
 RUS_RUSSIAN_TRADE_MONOPOLY: "Rosyjski monopol handlowy"
 mos_rus_conquer_central_asia_ct: "Jest częścią węzła handlowego §YSamarkanda§!."
 mos_rus_conquer_central_asia_at: "Każde centrum handlowe w regionie §YAzji Środkowej§! należące do państwa §Y[Root.GetName]§! lub jego poddanych otrzymuje następujące efekty:"
 mos_rus_conquer_manchuria_title: "Przejęcie Amuru"
 mos_rus_conquer_manchuria_desc: "Nasza ekspansja na wschód zakończy się wraz z włączeniem wybrzeża Mandżurii. Tam założymy miasto Władywostok, które będzie centrum naszych działań handlowych i morskich na Pacyfiku i w Azji Wschodniej."
 RUS_TRADE_OF_THE_NEW_WORLD: "Handel Nowego Świata"
 mos_integrate_subjects_title: "Poddani Moskwy"
 mos_integrate_subjects_desc: "„Dziel i rządź”. Taką metodę stosowali nasi poprzedni [Root.Monarch.GetTitle], aby zmaksymalizować daninę, którą mogliśmy ściągać dla naszych tatarskich zwierzchników.
Taki sposób decentralizacji przynosi jednak odwrotny skutek, jeśli chcemy stać się dominującą potęgą w naszym regionie. Poddani państwa [Root.GetName] muszą stać się częścią państwa [Root.GovernmentName]."
 nov_establish_the_great_navy_title: "Utwórz wielką flotę"
 nov_establish_the_great_navy_desc: "Potrzebujemy wielkiej floty, aby nasze państwo [Root.GovernmentName] mogło wywierać wpływy poza granicami Rosji. Gospodarcza i militarna przyszłość państwa zależy od naszej marynarki wojennej."
 rmi_grow_to_power_title: "Wzrost potęgi"
 rmi_grow_to_power_desc: "Nasze początki były skromne, a wrogowie potężni i liczni. Mimo wszelkich przeciwności los nam sprzyjał i obecnie jesteśmy dominującą potęgą Europy Wschodniej."
 mos_rus_conquer_kazan_title: "Podbij Kazań"
 mos_rus_conquer_kazan_desc: "Kazań to miasto leżące nad Wołgą, przez które przechodzą kluczowe szlaki handlowe. Aby Rosja rosła w siłę, musimy zająć to miejsce!"
 mos_rus_expand_eastwards_title: "Zagarnij stepy"
 mos_rus_expand_eastwards_desc: "Musimy przenieść walkę na tereny Tatarów ze Złotej Ordy i wbić nasz sztandar w samo serce ich stepów, bo cały ten teren należy do Matki Rosji."
 mos_rus_colonize_west_siberia_title: "Za Ural"
 mos_rus_colonize_west_siberia_desc: "Teraz, gdy uwolniliśmy się z tatarskich okowów, nadszedł czas, by skierować wzrok na wschód. Ziemie za Uralem muszą zostać zdobyte dla Matki Rosji."
 mos_rus_colonize_central_siberia_title: "Kolonizuj Syberię Zachodnią"
 mos_rus_colonize_central_siberia_desc: "Rozpoczęliśmy wypieranie Tatarów z Syberii, lecz nasza kontrola nad tymi regionami jest nadal słaba. Musimy zbudować forty, aby objąć je właściwymi rządami rosyjskimi."
 mos_rus_colonize_eastern_siberia_title: "Wkrocz do Syberii Wschodniej"
 mos_rus_colonize_eastern_siberia_desc: "Nasi odkrywcy otworzyli dla nas rozległe, dzikie tereny Syberii Wschodniej. Musimy wybudować tam forty, zabezpieczając w ten sposób nad nimi kontrolę."
 mos_rus_colonize_alaska_title: "Skolonizuj Alaskę"
 mos_rus_colonize_alaska_desc: "Nasze dążenie do zmonopolizowania handlu futrami prowadzi nas jeszcze dalej na wschód. Czas wypłynąć w kierunku wybrzeża obu Ameryk i założyć kolonię na Alasce, gdzie będzie mnóstwo nowych okazji do zdobycia futer."
 mos_rus_colonize_california_title: "Zasiedl zachodnie wybrzeże"
 mos_rus_colonize_california_desc: "Choć na Alasce znaleźliśmy ogromne ilości futer, nasi odkrywcy donoszą o odkryciu złóż złota na zachodnim wybrzeżu tego obcego kontynentu."
 mos_rus_colonize_canada_title: "Kanadyjskie pogranicze"
 mos_rus_colonize_canada_desc: "Handel futrami kwitnie dzięki naszej kolonii w Nowym Świecie. Pozostało jednak jeszcze wiele ziem do odkrycia i zasiedlenia. Nowy Świat i jego zasoby muszą należeć do Matki Rosji!"
 mos_rus_found_the_russian_tsardom_title: "[Root.GetFoundRussiaMissionTitle]"
 mos_rus_found_the_russian_tsardom_title_monarchy: "Utwórz carstwo"
 mos_rus_found_the_russian_tsardom_title_republic: "Utwórz Wielki Wiec"
 mos_rus_found_the_russian_tsardom_desc: "[Root.GetFoundRussiaMissionDescription]"
 mos_rus_found_the_russian_tsardom_description_monarchy: "Rosjanie wiele wycierpieli: upadek Rusi Kijowskiej pod naporem Mongołów, jarzmo tatarskie, konflikty między Rurykowiczami i zagrożenie polityczne ze strony Nowogrodu. To jednak już przeszłość! Nadszedł czas, by zjednoczyć Rosjan pod koroną jednego cara i samodzielnie kształtować naszą przyszłość!"
 mos_rus_found_the_russian_tsardom_description_republic: "Rosjanie wiele wycierpieli: upadek Rusi Kijowskiej pod naporem Mongołów, jarzmo tatarskie, zagrożenie skandynawskie i żądnych władzy Moskali. To jednak już przeszłość! Nadszedł czas, by zjednoczyć Rosjan pod rządami Wielkiej Republiki Wiecowej i samodzielnie kształtować naszą przyszłość!"
 rus_enact_the_sudebnik_title: "Los tysiackich"
 rus_enact_the_sudebnik_desc: "Tysiaccy byli dowódcami wojskowymi od czasów Rusi Kijowskiej, a obecnie pełnią funkcje sądowe i handlowe. W większości zostali już zniesieni i zastąpieni w wojsku przez wojewodów, a w administracji przez namiestników. W niektórych naszych prowincjach nadal działają jednak tysiaccy. Nadszedł czas, by raz na zawsze zlikwidować to przestarzałe stanowisko."
 rus_enact_the_sudebnik_at: "Jeśli ukończymy tę misję, mając aktywną reformę §YUrząd tysiackiego§!:"
 rus_enact_the_sudebnik_bt: "Jeśli ukończymy tę misję, mając aktywną reformę §YUrząd namiestnika§!:"
 rus_enact_the_sudebnik_ct: "Wystąpiło wydarzenie „§YOstatni tysiacki§!”.
Wydarzenie uruchamia się, gdy posiadamy co najmniej §Y1§! stabilności i osiągniemy §Y3§! poziom reform rządowych."
 rus_book_of_royal_degrees_title: "Księga rang królewskich"
 rus_book_of_royal_degrees_desc: "Jako nowa, rosnąca w siłę potęga Europy Wschodniej musimy zreorganizować i usprawnić naszą biurokrację. Przyszłość państwa [Root.GovernmentName] zależy od sprawności naszego gabinetu."
 rus_book_of_royal_degrees_at: "Wydarzenie pozwoli nam wybrać jeden z trzech kierunków, zapewniających premie związane z administracyjnymi, handlowymi lub wojskowymi aspektami państwa."
 rus_handle_the_boyars_title: "Uporządkuj sprawę bojarów"
 rus_handle_the_boyars_desc: "Bojarzy mają ogromny wpływ na nasz kraj. Nasza przyszłość zależy od ich posłuszeństwa. Powinniśmy zdobyć ich lojalność albo ograniczyć ich władzę – tak czy inaczej, musimy rozwiązać kwestię bojarów."
 rus_handle_the_boyars_at: "Jeśli ukończymy tę misję, gdy stan §Y[Root.GetNobilityName]§! posiada mniej ziemi koronnej niż my:"
 rus_handle_the_boyars_bt: "Jeśli ukończymy tę misję, gdy stan §Y[Root.GetNobilityName]§! posiada więcej ziemi koronnej niż my:"
 rus_the_mestnichestvo_title: "Znieś miestniczestwo"
 rus_the_mestnichestvo_desc: "Hierarchiczny system państwa [Root.GetUsableName] opiera się na miestniczestwie – nadmiernie skomplikowanej i przestarzałej strukturze, która utrudnia obsadzanie stanowisk urzędniczych według zasług. Jest trucizną w naszym społeczeństwie i musi zostać zniesiona."
 rus_show_russian_superiority_title: "Zmodernizuj państwo"
 rus_show_russian_superiority_desc: "Państwo [Root.GetUsableNameCap] opiera się na tradycjach i prawach naszych wschodniosłowiańskich przodków. Choć ustawodawstwo to miało uzasadnienie w czasach mongolskiego panowania, dziś nie jest już odpowiednie. Musimy zmodernizować państwo, jeśli nie chcemy pozostać w tyle za mocarstwami Zachodu."
 rus_show_russian_superiority_at: "Prowincja o najwyższym poziomie rozwoju spośród naszych posiadłości otrzymuje następujące efekty:"
 rus_the_vodka_monopoly_title: "Monopol na wódkę"
 rus_the_vodka_monopoly_desc: "Wódka jest tanim produktem, który można warzyć w dużych ilościach. Ustanowienie monopolu państwowego na ten trunek przyniesie znaczne korzyści: zapewni stałe źródło dochodów i ułatwi kontrolowanie mas."
 rus_enable_vodka_sales_decision_tt: "Odblokowuje decyzję „§YPromuj sprzedaż wódki§!”."
 rus_the_time_of_troubles_title: "Przetrwanie problemów"
 rus_the_time_of_troubles_desc: "Chmury burzowe zbierają się na rosyjskim horyzoncie. Musimy znieść wszelkie trudności, jakie przygotował dla nas los."
 rus_the_time_of_troubles_at: "Jeśli ukończymy tę misję, kończąc katastrofę §YCzasu Wielkiej Smuty§!:"
 rus_the_time_of_troubles_bt: "Jeśli ukończymy tę misję, pomijając katastrofę §YCzasu Wielkiej Smuty§!:"
 rus_the_empire_of_russia_title: "Wielkie imperialne ambicje"
 rus_the_empire_of_russia_desc: "Państwo [Root.GetName] jest silne, lecz sztywne. Rząd i wiele aspektów naszego społeczeństwa opiera się na przestarzałych tradycjach i poglądach, których fundamenty sięgają czasów Rusi Kijowskiej. Tylko prawdziwe imperium [Root.GetAdjective] zdoła przetrwać burzę, jaką stanowią wielkie mocarstwa europejskie."
 rus_the_empire_of_russia_ct: "Ukończ §Ymodernizację§! państwa [Root.GetName] i wprowadź reformę §YImperium Rosyjskie§! albo §YWielka Federacja Rosyjska§!."
 rus_the_empire_of_russia_at: "Odblokowuje misje §YImperium Rosyjskie§!."
 rus_the_empire_of_russia_bt: "Wydarzenie pozwoli nam zmienić flagę państwa. Dodatkowo otrzymamy §G50§! prestiżu. Nadmiar prestiżu zostanie zamieniony na punkty władzy monarchy."
 rus_the_streltsy_title: "Zrekrutuj strzelców"
 rus_the_streltsy_desc: "Pułki strzelców stanowią trzon naszej armii. Musimy nadal rekrutować i zaopatrywać strzelców, aby podtrzymać nasze tradycje wojskowe."
 rus_the_streltsy_at: "Wydarzenie pozwoli nam ustanowić system wynagradzania §Ystrzelców§!."
 has_not_russian_mechanic_tt: "Nie korzysta z §Ymechaniki rosyjskiej§!."
 rus_solidify_serfdom_title: "Los chłopstwa"
 rus_solidify_serfdom_desc: "Pańszczyzna jest potężnym narzędziem zwiększania ogólnej produktywności państwa – a zarazem zniewalania jego ludności. Los chłopstwa leży w naszych rękach."
 rus_enacted_early_serfdom_tt: "W dowolnym momencie przyznano przywilej §YWczesna pańszczyzna§!."
 rus_solidify_serfdom_at: "Pokonano buntowników §Ychłopskich§!."
 rus_enacted_early_disconnection_tt: "W dowolnym momencie przyznano przywilej §YZwiększona wolność chłopów§!."
 rus_solidify_serfdom_bt: "Pokonano buntowników §Yszlacheckich§!."
 rus_solidify_serfdom_ct: "Jeśli ukończymy tę misję, mając kiedykolwiek przyznany przywilej §YWczesna pańszczyzna§!:"
 rus_solidify_serfdom_dt: "§YPrzywileje§! związane z §Ypańszczyzną§! otrzymują dodatkowe modyfikatory warunkowe."
 rus_solidify_serfdom_et: "Jeśli ukończymy tę misję, mając kiedykolwiek przyznany przywilej §YZwiększona wolność chłopów§!:"
 rus_solidify_serfdom_ft: "§YPrzywileje§! związane z §Ywolnością chłopów§! otrzymują dodatkowe modyfikatory warunkowe."
 RUS_has_none_of_the_serfdom_privileges_tt: "Nie posiada aktywnych przywilejów stanowych związanych z §Ychłopstwem§!."
 rus_increase_absolute_rule_title: "Absolutna autokracja"
 rus_increase_absolute_rule_desc: "Tylko absolutny autokrata może poprowadzić państwo [Root.GetUsableName] ku pomyślnej przyszłości. Musimy zapewnić, aby taki władca objął tron i aby żaden stan nie stanowił dla niego zagrożenia."
 rus_increase_absolute_rule_tt: "Co najmniej §Y10§! razy użyto interakcji stanowej §YZajmij ziemię§! (§Y[Root.GetSeizeLandCounter]§!/§Y10§!)."
 rus_role_of_the_church_title: "Zjednaj sobie patriarchat"
 rus_role_of_the_church_desc: "Patriarchat stanowi podstawę naszej legitymizacji do rządzenia Rosjanami. Bez jego poparcia kraj pogrążyłby się w niezgodzie i chaosie. Musimy zapewnić sobie lojalność patriarchy."
 rus_the_courts_direction_title: "Zwesternizuj dwór"
 rus_the_courts_direction_desc: "Aby zreformować strukturę państwa, musimy zadbać o modernizację samego dworu. W tym celu wyślemy delegacje do Europy Zachodniej, aby poznały tamtejsze obyczaje."
 rus_the_courts_direction_at: "Jeśli zatrudniliśmy §Yfilozofa§!:"
 rus_the_courts_direction_bt: "Jeśli zatrudniliśmy §Yprzyrodnika§!:"
 rus_the_courts_direction_ct: "Jeśli zatrudniliśmy §Yartystę§!:"
 rus_the_courts_direction_dt: "Jeśli zatrudniliśmy §Yskarbnika§!:"
 rus_the_courts_direction_et: "Jeśli zatrudniliśmy §Yteologa§!:"
 rus_the_courts_direction_ft: "Jeśli zatrudniliśmy §Ymincerza§!:"
 rus_the_courts_direction_gt: "Jeśli zatrudniliśmy §Yinkwizytora§!:"
 rus_philosopher_focus: "Skupienie na filozofii"
 rus_natural_scientist_focus: "Skupienie na naukach przyrodniczych"
 rus_artist_focus: "Skupienie na sztuce"
 rus_treasurer_focus: "Skupienie na finansach"
 rus_theologian_focus: "Skupienie na teologii"
 rus_master_of_mint_focus: "Skupienie na mennictwie"
 rus_inquisitor_focus: "Skupienie na inkwizycji"
 rus_estabblish_the_russian_navy_title: "Imperialna marynarka rosyjska"
 rus_estabblish_the_russian_navy_desc: "Wielkie mocarstwa świata nie polegają już wyłącznie na armiach, aby wywierać wpływy. Dysponują kosztownymi flotami, których zasięg znacznie przewyższa możliwości zwykłych wojsk lądowych. Utworzenie Imperialnej Marynarki Rosyjskiej, zdolnej rywalizować z naszymi przeciwnikami, jest dla nas sprawą najwyższej wagi."
 rus_estabblish_the_russian_navy_at: "Wydarzenie pozwoli nam wybrać modyfikator wzmacniający handlowy albo wojskowy aspekt naszej floty."
 rus_monopolize_novgorod_title: "Zmonopolizuj Nowogród"
 rus_monopolize_novgorod_desc: "Nowogród i okoliczne ziemie stanowią serce rosyjskiego handlu. Musimy oczywiście zadbać o to, by tylko my sprawowali pełną kontrolę nad własnym centrum handlowym."
 unlock_monopolies_tt: "Odblokowuje przywileje §Ymonopolistyczne§! dla stanów."
 buffed_monopolies_tt: "Przyznawanie §Ymonopoli§! nie zmniejsza już §Yabsolutyzmu§!."
 rus_establish_the_governing_senate_title: "Senat Rządzący"
 rus_establish_the_governing_senate_desc: "Podczas nieobecności naszego [Root.Monarch.GetTitle] musi istnieć instytucja, która będzie pilnować równowagi sił w państwie i zapewniać jego stabilność. Senat Rządzący jest dokładnie tym, czego potrzebuje nasz kraj."
 rus_establish_the_governing_senate_at: "Wydarzenie pozwoli nam wprowadzić reformę rządową §YSenat Rządzący§! albo §YWymuszona autokracja§!."
 rus_pass_issues_in_the_senate_title: "Uchwal ustawy"
 rus_pass_issues_in_the_senate_desc: "Senat Rządzący niewiele znaczy dla państwa, jeśli nie będzie właściwie wykorzystywany. Powinniśmy pozwolić, aby sprawy rosyjskich obywateli trafiały pod jego obrady i były przez niego rozpatrywane."
 rus_pass_issues_in_the_senate_at: "Jeśli ukończymy tę misję, mając aktywną reformę rządową §YSenat Rządzący§!:"
 rus_pass_issues_in_the_senate_bt: "Jeśli ukończymy tę misję, mając aktywną reformę rządową §YWymuszona autokracja§!:"
 rus_pass_issues_in_the_senate_ct: "Państwa podległe mają łącznie co najmniej §Y100§! poziomów rozwoju i mniej niż §Y20%§! pragnienia wolności."
 rus_pass_issues_in_the_senate_tt: "Uchwalono co najmniej §Y10§! ustaw (§Y[Root.issues_passed.GetValue]§!/§Y10§!)."
 rus_most_holy_synod_title: "Najświętszy Synod"
 rus_most_holy_synod_desc: "Kościół odgrywał ważną rolę w historii naszego państwa, lecz coraz wyraźniej widać, że jego pozycję w kraju należy przemyśleć na nowo."
 rus_most_holy_synod_xx: "Reputacja dyplomatyczna wynosi co najmniej §Y2§!.\n   Posiada dowolnego sojusznika lub poddanego z grupy religijnej §Y[Root.Religion.GetGroupName]§!, ale wyznającego religię inną niż §Y[Root.Religion.GetName]§!, który ma co najmniej §Y75§! zaufania i §Y150§! opinii o państwie [Root.GetName].\n\n"
 rus_6_tot_tt: "Posiada co najmniej §Y6§! tolerancji prawdziwej wiary."
 rus_most_holy_synod_at: "Jeśli ukończymy tę misję dzięki §Ysojuszowi§!:"
 rus_most_holy_synod_ct: "Wystąpi wydarzenie, które pozwoli nam wybrać reformę rządową §YNajświętszy Synod Rządzący§!."
 rus_most_holy_synod_bt: "
Jeśli ukończymy tę misję dzięki §Y[Root.GetClergyName]§!:"
 rus_most_holy_synod_dt: "Wystąpi wydarzenie, które pozwoli nam wybrać reformę rządową §YWzmocniony patriarchat§!."
 rus_most_holy_synod_tt: "Zamiast tego wystąpi wydarzenie, które pozwoli nam wybrać reformę rządową §YZwierzchnik patriarchatu§!."
 rus_early_industrialization_title: "Manufaktury państwowe"
 rus_early_industrialization_desc: "Koła przemysłu obracają się nieustannie, a Rosja nie może pozostać w tyle, gdy pojawiają się nowe technologie produkcji. Państwo musi zbudować i kontrolować jak najwięcej wielkich manufaktur."
 rus_early_industrialization_at: "Do §Y10§! losowych posiadanych prowincji, które mają §Y20§! poziomów rozwoju i §Ymanufakturę§!, otrzymuje następujące efekty:"
 rus_the_age_of_revolution_title: "Wielka potęga Wschodu"
 rus_the_age_of_revolution_desc: "Nadszedł czas, aby zebrać owoce naszej pracy. Długo przygotowywaliśmy się do awansu do grona wielkich mocarstw. Teraz zajmiemy należne nam miejsce wśród największych potęg świata!"
 rus_the_age_of_revolution_at: "Na początku §YEpoki rewolucji§! otrzymamy wydarzenie odblokowujące ostatnie §Y3§! misje."
 rus_the_age_of_revolution_bt: "Odblokowuje ostatnie §Y3§! misje."
 rus_dissolve_the_streltsy_title: "Rozwiąż kwestię strzelców"
 rus_dissolve_the_streltsy_desc: "Lojalność strzelców od zawsze budziła wątpliwości ze względu na ich nieustanne żądania. Istnieją tylko dwa sposoby rozwiązania tego problemu: możemy całkowicie rozwiązać formację strzelców albo uznać ją za elitarną siłę państwa [Root.GovernmentName]."
 rus_dissolve_the_streltsy_at: "Jeśli ukończymy tę misję, mając aktywną reformę rządową §YUtworzenie strzelców§!:"
 rus_dissolve_the_streltsy_bt: "Jeśli ukończymy tę misję, NIE mając aktywnej reformy rządowej §YUtworzenie strzelców§!:"
 rus_reform_the_military_title: "Zwesternizuj wojsko"
 rus_reform_the_military_desc: "Nasze wojska lądowe przeszły już wiele reform i ulepszeń, lecz wciąż nie osiągnęły szczytu swoich możliwości. Dzięki pomocy zagranicznych doradców wojskowych i tradycyjnej dyscyplinie armie państwa [Root.GetUsableName] będą walczyć na polu bitwy równie zaciekle jak wojska naszych rywali."
 rus_reform_the_military_at: "Wygraj §Y40§! bitew lądowych lub morskich (§Y[Root.GetNumWonBattles]§!/§Y40§!)."
 rus_reform_the_military_bt: "Wygraj §Y40§! bitew lądowych lub morskich (§Y0§!/§Y40§!).
§YLicznik zaczyna działać po ukończeniu misji „Rozwiąż kwestię strzelców”.§!"
 rus_control_fur_trade_title: "Przejmij kontrolę nad handlem futrami"
 rus_control_fur_trade_desc: "Futra – miękkie złoto Północy i Syberii. Popyt na wysokiej jakości futra nigdy nie wygaśnie. Musimy zapewnić sobie monopol na ten handel."
 rus_peters_reforms_title: "Tabela rang"
 rus_peters_reforms_desc: "Ostatnim etapem modernizacji państwa [Root.GetUsableName] musi być gruntowna przebudowa dawnych hierarchicznych struktur państwowych na rzecz systemu promującego zasługi i zniechęcającego do awansów wynikających wyłącznie z urodzenia."
 nizam_i_cedid_reform: "Nizam-i Cedid"
 nizam_i_cedid_reform_desc: "Nizam-i Cedid to program reform inspirowanych europejskimi ideami i rozwiązaniami, którego celem jest przezwyciężenie stagnacji w siłach zbrojnych i administracji imperium."
 rus_educational_reform_title: "Reformy edukacyjne"
 rus_educational_reform_desc: "Dotychczas edukacja naszego ludu nie miała większego znaczenia. Teraz zapewnienie każdemu obywatelowi dostępu do nauki jest naszym najwyższym priorytetem. W każdym mieście musi powstać uniwersytet."
 rus_educational_reform_at: "Wydarzenie pozwoli nam wybrać jedną premię do §Ytechnologii§!."
 rus_the_glorious_revolution_title: "Rewolucja rosyjska"
 rus_the_glorious_revolution_desc: "Nadeszła epoka rewolucji i Rosja musi opowiedzieć się po jednej ze stron. Czy odpowiemy na wezwanie wolności i przyłączymy się do rewolucji, czy też przeciwstawimy się jej siłą reakcji?"
 rus_the_glorious_revolution_at: "Jeśli ukończymy tę misję jako państwo §Yrewolucyjne§!:"
 rus_the_glorious_revolution_bt: "Jeśli ukończymy tę misję, NIE będąc państwem §Yrewolucyjnym§!:"
 rus_abolish_the_serfdom_title: "Znieś pańszczyznę"
 rus_abolish_the_serfdom_desc: "Pańszczyzna spełniała swoją funkcję, lecz obecnie utrudnia nam wejście w nową, uprzemysłowioną epokę. Chłopstwo musi zostać uwolnione ze szponów szlachty i mieszczaństwa."
 rus_establish_the_russian_navy_title: "Wielka flota Rosji"
 rus_establish_the_russian_navy_desc: "Czym jest wielkie mocarstwo, jeśli nie potrafi wywierać wpływu na innych? Musimy zbudować własną potężną flotę, aby pozostałe wielkie mocarstwa traktowały nas poważnie i abyśmy mogli rozszerzyć nasze wpływy poza Europę."
 rus_establish_the_russian_navy_at: "Wydarzenie pozwoli nam poprawić handlowe lub wojskowe możliwości naszej marynarki wojennej."
 mos_legitimacy_of_the_rurikovich: "Legitymizacja Wasyla"
 desc_mos_legitimacy_of_the_rurikovich: "Zwycięstwo Wasyla nad pretendentem umocniło legitymizację naszej dynastii."
 mos_a_new_russian_authority: "Nowa władza"
 desc_mos_a_new_russian_authority: "Wasyl zawiódł państwo. Jego miejsce zajmie teraz nowy autokrata, który będzie rządził krajem."
 mos_the_secured_future_of_russia: "Świt nowej epoki"
 desc_mos_the_secured_future_of_russia: "Wraz z objęciem tronu przez [Root.Monarch.GetTitle] [Root.Monarch.GetName] przyszłość państwa [Root.GetUsableName] i jego obywateli jest zabezpieczona."
 rus_grand_duke_of_finland: "Wielki książę Finlandii"
 desc_rus_grand_duke_of_finland: "[Root.Monarch.GetName] nosi tytuł wielkiego księcia Finlandii, co czyni go najwyższym suwerenem narodu fińskiego.\n\n§YOdblokowuje dostęp do §Jkawalerii hakkapeliitta§!.§!\n§YModyfikator zostanie usunięty, jeśli Finlandia przestanie być naszym poddanym.§!"
 rus_grand_duke_of_finland_at: "do czasu, gdy §YFinlandia§! przestanie być naszym poddanym"
 rus_developed_trade_post_novgorod: "Rozwinięta placówka handlowa"
 desc_rus_developed_trade_post_novgorod: "Ta prowincja stanowi centrum rosyjskiego handlu i wymiany towarowej w pobliżu Morza Bałtyckiego."
 rus_orthodox_holy_site: "Święte miejsce prawosławia w Kijowie"
 desc_rus_orthodox_holy_site: "Właściciel rozbudował ośrodek religijny tego miasta."
 rus_center_of_commerce: "Kijowskie centrum handlowe"
 desc_rus_center_of_commerce: "Właściciel rozbudował centrum handlowe tego miasta."
 rus_the_west_fort: "Kijowskie fortyfikacje"
 desc_rus_the_west_fort: "Właściciel rozbudował fortyfikacje tego miasta."
 rus_kiev_mohyla_academy: "Akademia Kijowsko-Mohylańska"
 desc_rus_kiev_mohyla_academy: "Właściciel rozbudował akademię tego miasta."
 rus_west_slavic_union: "Hegemonia nad Słowianami Zachodnimi"
 desc_rus_west_slavic_union: "Podbój Polski i pozostałych ziem zachodniosłowiańskich doprowadził do rozszerzenia naszego ustawodawstwa, aby objąć nim te ludy.\n\n§YModyfikator zostanie usunięty, jeśli zdegradujemy dowolną kulturę zachodniosłowiańską.§!"
 rus_carpathian_union: "Hegemonia nad ludami karpackimi"
 desc_rus_carpathian_union: "Podbój Węgier i pozostałych ziem karpackich doprowadził do rozszerzenia naszego ustawodawstwa, aby objąć nim te ludy.\n\n§YModyfikator zostanie usunięty, jeśli zdegradujemy dowolną kulturę karpacką.§!"
 rus_south_slavic_union: "Hegemonia nad Słowianami Południowymi"
 desc_rus_south_slavic_union: "Podbój Bałkanów i pozostałych ziem południowosłowiańskich doprowadził do rozszerzenia naszego ustawodawstwa, aby objąć nim te ludy.\n\n§YModyfikator zostanie usunięty, jeśli zdegradujemy dowolną kulturę południowosłowiańską.§!"
 nov_rus_scandinavian_conquest: "Integracja Skandynawii"
 desc_nov_rus_scandinavian_conquest: "Podbój Skandynawii zmusza nasze państwo do wprowadzenia nowych praw, aby zarządzać podbitą ludnością tych ziem."
 nov_rus_scandinavian_dominance: "Dominacja nad Skandynawią"
 desc_nov_rus_scandinavian_dominance: "Po całkowitym podporządkowaniu Skandynawii ustawodawcy państwa [Root.GetAdjective] opracowali odpowiedni system integracji całej ludności skandynawskiej z naszym społeczeństwem."
 rus_trade_empire: "Handlowe imperium Wschodu"
 desc_rus_trade_empire: "Nasi kupcy dominują w handlu europejskim i wywierają w naszym imieniu wpływ na politykę oraz rynki zagranicznych państw. Zaiste, zbudowaliśmy imperium oparte na handlu i wymianie towarowej."
 rus_expanded_administrative_offices: "Zmiana priorytetów administracji"
 desc_rus_expanded_administrative_offices: "Postanowiliśmy zmienić priorytety naszej administracji, aby ułatwić integrację nowych terytoriów i fabrykowanie roszczeń.\n\n§YWszystkie stałe roszczenia z rosyjskich misji zostają przekształcone w roszczenia tymczasowe.§!"
 rus_russian_caucasian_alliance: "Sojusz rosyjsko-kaukaski"
 desc_rus_russian_caucasian_alliance: "Więzi między Rosją a Kaukazem prowadzą do silnego sojuszu obu regionów."
 rus_reinforced_defenses: "Wzmocniona obrona"
 desc_rus_reinforced_defenses: "W fortyfikacjach Kaukazu rosyjscy i kaukascy obrońcy walczą ramię w ramię, aby chronić region przed obcymi najeźdźcami."
 rus_religious_zeal: "Rosyjska gorliwość religijna"
 desc_rus_religious_zeal: "Religia jest jednym z fundamentów naszego społeczeństwa. Rosyjska gorliwość religijna pozwala nam przetrwać nawet najtrudniejsze czasy."
 the_tatar_yoke: "Jarzmo tatarskie"
 desc_the_tatar_yoke: "\n§RMusimy co roku płacić daninę państwu §Y[466.Owner.GetName]§!, w przeciwnym razie spotka nas gniew Tatarów.§!\n\nPo upadku Rusi Kijowskiej pod naporem Mongołów w 1223 roku Mongołowie, a później Tatarzy, utrzymywali silną kontrolę nad poddanymi ruskimi. Pod przewodnictwem Wielkiego Księstwa Moskiewskiego Rosjanie płacą daninę wielkiemu kniaziowi moskiewskiemu, który przekazuje ją następnie chanowi państwa [466.GetName]. Danina jest możliwa do udźwignięcia, lecz sam fakt jej istnienia stanowi upokorzenie dla każdego szanującego się Słowianina Wschodniego, pragnącego kontynuować dziedzictwo Rzymian.\n\n§YModyfikator zostanie usunięty, jeśli państwo [466.GetName] utraci modyfikator „Jarzmo tatarskie”.§!"
 rus_icon_climacus_bonus: "Inspiracja św. Janem Klimakiem"
 desc_rus_icon_climacus_bonus: "Zamówiona ikona stanowi źródło wielkiej inspiracji dla naszego ludu."
 rus_icon_eleusa_bonus: "Inspiracja Eleusą"
 desc_rus_icon_eleusa_bonus: "Zamówiona ikona stanowi źródło wielkiej inspiracji dla naszego ludu."
 rus_icon_michael_bonus: "Inspiracja św. Michałem"
 desc_rus_icon_michael_bonus: "Zamówiona ikona stanowi źródło wielkiej inspiracji dla naszego ludu."
 rus_icon_nicholas_bonus: "Inspiracja św. Mikołajem"
 desc_rus_icon_nicholas_bonus: "Zamówiona ikona stanowi źródło wielkiej inspiracji dla naszego ludu."
 rus_icon_pancreator_bonus: "Inspiracja Chrystusem Pantokratorem"
 desc_rus_icon_pancreator_bonus: "Zamówiona ikona stanowi źródło wielkiej inspiracji dla naszego ludu."
 rus_end_of_the_horde: "Pogromca hord"
 desc_rus_end_of_the_horde: "Niegdyś byliśmy jedynie wasalem hord ze wschodu, lecz wznieśliśmy się do potęgi i obaliliśmy naszych tatarskich panów! Żadna horda nigdy więcej nie zagrozi narodowi rosyjskiemu!"
 rus_local_russian_trade_center: "Rozwój rynku Azji Środkowej"
 desc_rus_local_russian_trade_center: "Ta prowincja otrzymuje subsydia od rządzącego stanu mieszczańskiego. Dzięki temu zastrzykowi środków ma doskonałe warunki, by rozwinąć się w prawdziwe centrum handlowe Azji Środkowej."
 rus_new_world_trade: "Handel Nowego Świata"
 desc_rus_new_world_trade: "Handel z Nowym Światem zwiększa nasz zasięg i poszerza możliwości."
 nov_rus_great_novgorodian_navy: "Wielka flota nowogrodzka"
 desc_nov_rus_great_novgorodian_navy: "Nasze inwestycje w wielką flotę wywarły ogromne wrażenie na marynarzach. Ich morale jest niezrównane – będą walczyć z wrogiem na morzu do ostatniego człowieka."
 rmi_rus_rising_russian_power: "Rosnąca potęga Rosji"
 desc_rmi_rus_rising_russian_power: "Nasze początki były skromne, a wrogowie potężni i liczni. Mimo wszelkich przeciwności los nam sprzyjał i obecnie jesteśmy dominującą potęgą Europy Wschodniej."
 rus_steppe_conversion: "Nawracanie stepów"
 desc_rus_steppe_conversion: "Stepy zamieszkują wyznawcy obcych religii, którzy nie ujrzeli jeszcze światła Pańskiego. Nasi misjonarze otrzymali motywację, by sprowadzić te dusze na właściwą drogę."
 rus_expansion_into_siberia: "Ekspansja na Syberię"
 desc_rus_expansion_into_siberia: "Dobrowolnie lub siłą – syberyjskie pustkowia zostaną w taki czy inny sposób ujarzmione przez rosyjskich osadników."
 rus_new_world_colonization: "Wyprawa za Pacyfik"
 desc_rus_new_world_colonization: "Zasiedlenie syberyjskiego wybrzeża na wschodzie nie zakończy naszego nieustannego marszu na wschód. Poprowadzimy dzielnych odkrywców i poszukiwaczy przygód do Nowego Świata, aby założyli tam kolonię dla ojczyzny."
 rus_tariffs_of_the_new_world: "Cła na futra"
 desc_rus_tariffs_of_the_new_world: "Kontrola nad Nowym Światem pozwala nam nakładać dochodowe cła na futra bez pogarszania stosunków z naszymi koloniami."
 rus_the_realm_of_the_rus: "Kraina Rusi"
 desc_rus_the_realm_of_the_rus: "Rusini są wreszcie ponownie zjednoczeni. Wolni od tatarskiego ucisku i wewnętrznych sporów, poprowadzimy nasz lud ku nowej chwale."
 rus_bureaucratic_adm_focus: "Biurokratyczne skupienie na administracji"
 desc_rus_bureaucratic_adm_focus: "Reformatorzy i biurokraci naszego państwa wykorzystują czas i zasoby, aby przyspieszyć postęp w sprawach administracyjnych."
 rus_bureaucratic_dip_focus: "Biurokratyczne skupienie na handlu"
 desc_rus_bureaucratic_dip_focus: "Reformatorzy i biurokraci naszego państwa wykorzystują czas i zasoby, aby przyspieszyć postęp w sprawach handlowych."
 rus_bureaucratic_mil_focus: "Biurokratyczne skupienie na wojsku"
 desc_rus_bureaucratic_mil_focus: "Reformatorzy i biurokraci naszego państwa wykorzystują czas i zasoby, aby przyspieszyć postęp w sprawach wojskowych."
 rus_support_of_the_boyars: "Poparcie bojarów"
 desc_rus_support_of_the_boyars: "Bojarzy udzielili nam poparcia, dzięki czemu uzyskaliśmy dostęp do ich pospolitego ruszenia."
 rus_demoted_the_boyars: "Degradacja bojarów"
 desc_rus_demoted_the_boyars: "Bojarzy nie stanowią już problemu dla rządu państwa. Biurokraci mogą wdrażać reformy bez ich zgody."
 rus_early_modernization_modifier: "Wczesna modernizacja"
 desc_rus_early_modernization_modifier: "Nasze państwo przechodzi pierwsze etapy wczesnej modernizacji. Innowacyjne idee są nie tylko mile widziane, lecz także aktywnie wspierane."
 rus_center_of_modernization: "Ośrodek modernizacji"
 desc_rus_center_of_modernization: "Ta prowincja jest siedzibą jednego z pierwszych ośrodków modernizacji i innowacyjności."
 rus_vodka_sales: "Sprzedaż wódki"
 desc_rus_vodka_sales: "Kupcy i handlarze rozpowszechniają wśród zwykłych ludzi wódkę koronną."
 rus_ensured_regular_payment: "Zapewniony regularny żołd"
 desc_rus_ensured_regular_payment: "§RPrzy wstąpieniu nowego władcy na tron należy wypłacić żołd §Ystrzelcom§!.§!\n\nStrzelcy domagali się regularnego wynagrodzenia i złożyliśmy im taką obietnicę. Przy każdym objęciu tronu przez nowego [Root.Monarch.GetTitle] strzelcy przypomną nam o naszej umowie."
 rus_extra_high_payment: "Hojne wynagrodzenie"
 desc_rus_extra_high_payment: "Strzelcy otrzymali wyjątkowo wysokie wynagrodzenie. Ich zdolności bojowe wyraźnie wzrosły."
 rus_high_payment: "Wysokie wynagrodzenie"
 desc_rus_high_payment: "Strzelcy otrzymali regularny żołd w wysokości wyższej, niż oczekiwali."
 rus_no_payment: "Brak wynagrodzenia"
 desc_rus_no_payment: "Strzelcy nie otrzymali żadnego wynagrodzenia. Ich lojalność i wola walki są na najniższym poziomie."
 rus_trade_fleet: "Rosyjska flota handlowa"
 desc_rus_trade_fleet: "Nasza marynarka wojenna koncentruje się na handlowym wykorzystaniu morza."
 rus_war_fleet: "Rosyjska flota wojenna"
 desc_rus_war_fleet: "Nasza marynarka wojenna koncentruje się na militarnym wykorzystaniu morza."
 rus_loyalty_of_the_patriarchy: "Lojalność patriarchatu"
 desc_rus_loyalty_of_the_patriarchy: "Zdobyliśmy lojalność patriarchatu i możemy liczyć na jego poparcie w umacnianiu naszej legitymizacji."
 rus_early_center_of_industrialization: "Wczesny ośrodek industrializacji"
 desc_rus_early_center_of_industrialization: "Ta prowincja jest jedną z pierwszych, w których rozbudowano wielkie manufaktury Rosji."
 rus_great_power_of_the_east: "Wielka potęga Wschodu"
 desc_rus_great_power_of_the_east: "Zebraliśmy owoce naszej pracy. Długo przygotowywaliśmy się do awansu do grona wielkich mocarstw, a teraz zajmiemy należne nam miejsce wśród największych potęg świata!"
 rus_institutionalized_streltsy: "Instytucjonalizacja strzelców"
 desc_rus_institutionalized_streltsy: "Strzelcy stali się pełnoprawną i skodyfikowaną częścią rządu. Ich żołd został wreszcie ustalony i zagwarantowano jego wypłatę. Mogą jednak w przyszłości domagać się więcej."
 rus_standarized_military: "Ujednolicone wojsko"
 desc_rus_standarized_military: "Wojsko państwa [Root.GetAdjective] wyciągnęło wiele wniosków z wykorzystania strzelców i innych formacji w przeszłości, a teraz stosuje je wobec zwykłych oddziałów."
 rus_state_investment: "Zyski z handlu futrami"
 desc_rus_state_investment: "Handel futrami generuje ogromne dochody dla Rosji. Część tych dukatów jest ponownie inwestowana w kraju, aby jeszcze bardziej rozwinąć naszą gospodarkę."
 rus_freed_peasants: "Wolni chłopi"
 desc_rus_freed_peasants: "Chłopi nie są już niewolnikami pańszczyzny ani poddanymi sztywnego systemu mieszczańskiego. Żyją wolno w ramach państwa [Root.GovernmentName]."
 rus_discontent_peasantry: "Niezadowolone chłopstwo"
 desc_rus_discontent_peasantry: "Chłopstwo wyraża wielkie niezadowolenie ze swojej obecnej sytuacji."
 rus_supremacy_of_the_duna: "Dominacja Senatu Rządzącego"
 desc_rus_supremacy_of_the_duna: "Senat Rządzący zajmuje się sprawami stanów, dzięki czemu może zwoływać sejm, zajmować ziemię koronną i sprzedawać tytuły częściej, niż kiedykolwiek mógłby to robić sam władca."
 rus_absolute_rule: "Rządy absolutne"
 desc_rus_absolute_rule: "Wszystkie instytucje rządowe muszą podporządkować się [Root.Monarch.GetTitle]. Nie ma wyjątków."
 russian_eastern_expansion: "Ekspansja na wschód"
 desc_russian_eastern_expansion: "Nasze państwo pragnie rozszerzać swoje granice na nowe terytoria."
 rus_the_strong_motherland: "Silna ojczyzna"
 rus_the_stable_empire: "Stabilne imperium"
 RUS_RUSSIAN_TRADE_INFLUENCE: "Rosyjskie wpływy handlowe"
 nov_rus_asian_market_access: "Dostęp do rynków azjatyckich"
 time_of_troubles_at: "Łączna suma umiejętności £adm£ £dip£ i £mil£ władcy [Root.Monarch.GetName] wynosi co najmniej §Y9§!."
 flavor_rus.35.t: "Iwan IV Groźny"
 flavor_rus.35.desc: "Syn Wasyla III i jego drugiej żony, Heleny Glińskiej, Iwan IV został wielkim księciem moskiewskim w wieku zaledwie trzech lat, po tym jak jego ojciec zmarł wskutek zapalenia nogi. Jego wczesne dzieciństwo upłynęło pod znakiem zaniedbania i upokorzeń ze strony spiskujących bojarów. W wieku szesnastu lat Iwan został koronowany na „cara Wszechrusi”, co przypieczętowało oficjalne powstanie carstwa rosyjskiego – państwa istniejącego de facto już za panowania jego dziadka, Iwana III Wielkiego.\n\nWbrew temu, co sugeruje jego przydomek, pierwsze lata rządów Iwana charakteryzowały pokojowe reformy i modernizacja. Charakter jego panowania zmienił się, gdy uznano go za śmiertelnie chorego, a bojarzy odmówili złożenia przysięgi wierności jego małoletniemu synowi. Od tego czasu Iwan żywił paranoiczną urazę do bojarów, która ostatecznie doprowadziła do rzezi Nowogrodu.\n\nJeśli zostanie wyznaczony na następcę carstwa, wielu jest przekonanych, że państwo osiągnie największą świetność – nawet jeśli będzie to kosztować życie jednego czy dwóch miast."
 flavor_rus.35.a: "Tron [Root.GetAdjective] należy do Iwana."
 flavor_rus.35.b: "Fascynujące."
 flavor_rus.36.t: "Flota państwa [Root.GetUsableName]"
 flavor_rus.36.desc.a: "Choć znamy sztukę budowy statków, państwo [Root.GovernmentName] rzadko budowało jakiekolwiek okręty lub floty. To jednak przeszłość, ponieważ [Root.Monarch.GetName] prezentuje wielką flotę państwa [Root.GetUsableName]. Wspaniałe okręty [Root.GetAdjective] będą służyć państwu we wszystkich sprawach morskich.
Pozostaje jednak jedna kwestia sporna: jakie powinno być przeznaczenie tych okrętów?"
 flavor_rus.36.desc.b: "Wiedza o morzu została dobrze zachowana od czasów dawnej Republiki Nowogrodzkiej. Wielka flota państwa [Root.GetUsableName] znacznie się rozrosła pod względem liczebności i załóg.
Pozostaje jednak jedna kwestia sporna: jakie powinno być przeznaczenie tych okrętów?"
 flavor_rus.36.a: "Flota będzie służyć naszemu handlowi."
 flavor_rus.36.b: "Te okręty są przeznaczone do wojny."
 flavor_rus.37.t: "Senat Rządzący"
 flavor_rus.37.desc: "Podczas nieobecności [Root.Monarch.GetTitle] wybrani senatorowie Senatu Rządzącego sprawują władzę nad państwem [Root.GovernmentName] aż do powrotu władcy. Senat Rządzący zastąpił Dumę Bojarską i pełni funkcję najwyższej instytucji ustawodawczej, sądowniczej oraz wykonawczej państwa [Root.GovernmentName].
Choć znalazł już swoje miejsce w rządzie państwa [Root.GetAdjective], coraz głośniej mówi się o potrzebie formalnego ustanowienia senatu."
 flavor_rus.37.a: "Ustanów Senat Rządzący."
 flavor_rus.37.b: "Zlikwiduj Senat Rządzący."
 flavor_rus.38.t: "Najświętszy Synod"
 flavor_rus.38.desc: "Religia jest jednym z podstawowych filarów naszego narodu. Odkąd sięgamy pamięcią, państwo [Root.GetName] wyznaje prawosławie.
Religia i rząd nie zawsze jednak pozostają w harmonii. Patriarchat, kierowany przez jednego patriarchę, stanowi poważne zagrożenie dla absolutnej władzy [Root.Monarch.GetTitle]. Aby temu przeciwdziałać, powołano Najświętszy Synod, który decentralizuje patriarchat i służy państwu [Root.GovernmentName]."
 flavor_rus.38.a: "Utwórz Najświętszy Synod."
 flavor_rus.38.b: "Obecny system jest wystarczająco dobry."
 flavor_rus.39.t: "Wzmocnienie patriarchatu"
 flavor_rus.39.desc: "Religia jest jednym z podstawowych filarów naszego narodu. Odkąd sięgamy pamięcią, państwo [Root.GetName] wyznaje prawosławie.
Wraz ze wzrostem wpływów patriarchów rośnie również ich kontrola nad rządem. W końcu patriarcha przedstawia [Root.Monarch.GetTitle] propozycję: patriarchat otrzyma dodatkowe przywileje, a w zamian Kościół stanie za [Root.Monarch.GetTitle]."
 flavor_rus.39.a: "Zatwierdź tę propozycję."
 flavor_rus.39.b: "Odrzuć ten pomysł."
 flavor_rus.40.t: "Nowy zwierzchnik patriarchatu"
 flavor_rus.40.desc: "Religia jest jednym z podstawowych filarów naszego narodu. Odkąd sięgamy pamięcią, państwo [Root.GetName] wyznaje prawosławie.
Wpływ [Root.Monarch.GetTitle] na patriarchat stał się nierozróżnialny od jego absolutnej władzy nad państwem [Root.GetUsableName]. W przeciwieństwie do wielu poprzednich [Root.Monarch.GetTitle] [Root.Monarch.GetName] ma okazję przejąć władzę nad patriarchatem i ogłosić się zwierzchnikiem nowego patriarchatu."
 flavor_rus.40.a: "Połącz urząd patriarchy z urzędem [Root.Monarch.GetTitle]."
 flavor_rus.40.b: "Nie powinniśmy ingerować w sprawy Kościoła."
 flavor_rus.44.t: "[Root.GetUsableNameCap] i epoka rewolucji"
 flavor_rus.44.desc: "Na horyzoncie pojawia się nowa epoka. Epoka inna niż wszystkie, ponieważ zagraża samym fundamentom naszego państwa [Root.GovernmentName]!
Idee wolności i swobody coraz szybciej przenikają do umysłów naszych poddanych. Kto wie, jak długo dawne struktury społeczne zdołają się jeszcze utrzymać..."
 flavor_rus.44.a: "Przed państwem [Root.GetUsableName] naprawdę nadchodzą mroczne czasy."
 flavor_rus.45.t: "Westernizacja armii"
 flavor_rus.45.desc: "Dzięki licznym reformom, przebudowom i reorganizacjom wojsko państwa [Root.GetAdjective] niemal nie różni się już od swoich zachodnioeuropejskich odpowiedników. Nasi żołnierze walczą przy użyciu takiej samej broni i taktyki oraz pod dowództwem równie doświadczonych oficerów jak armie innych wielkich mocarstw."
 flavor_rus.45.a: "Niech nasi żołnierze poprowadzą państwo [Root.GetUsableName] ku zwycięstwu."
 flavor_rus.47.t: "Skok innowacyjności"
 flavor_rus.47.desc: "Nasze inwestycje w edukację ludności przyniosły owoce. Młodzi, pełni zapału uczeni rozpoczęli badania terenowe w dziedzinie matematyki, fizyki i chemii.
Ambicje są wielkie, lecz koszty jeszcze większe. Tylko jeden z tych projektów może liczyć na finansowanie."
 flavor_rus.47.a: "Wybierz projekt matematyczny."
 flavor_rus.47.b: "Wybierz projekt fizyczny."
 flavor_rus.47.c: "Wybierz projekt chemiczny."
 flavor_rus.100.t: "Dostosowanie administracji państwa [Root.GetAdjective]"
 flavor_rus.100.desc: "Gdy wojska państwa [Root.GetAdjective] gromadzą się na dworze w prowincji [Root.Capital.GetName], ujawniają się problemy naszej administracji. Wojna jest dla naszego kraju nieunikniona, a państwo będzie się rozrastać wraz z podbojem nowych terytoriów. Doradcy obawiają się, że administracja nie nadąży za naszymi ambicjami i potęgą militarną, dlatego chcą ją zmienić.
Ograniczając znaczenie trwałości naszych roszczeń, zyskalibyśmy więcej zasobów na fabrykowanie i zarządzanie większą liczbą roszczeń, niż nasze wojsko kiedykolwiek zdołałoby zrealizować. Oczywiście nie wszyscy doradcy popierają takie reformy, dlatego decyzja należy do naszego [Root.Monarch.GetTitle]."
 flavor_rus.100.a: "Nie ma powodu, by zmieniać już sprawdzony system."
 flavor_rus.100.a.tt: "Wszystkie §Ystałe roszczenia§! z misji państwa [Root.GetAdjective] pozostają bez zmian."
 flavor_rus.100.b: "Wprowadźmy tę koncepcję. Państwo [Root.GovernmentName] musi się rozwijać!"
 flavor_rus.100.b.tt: "Wszystkie §Ystałe roszczenia§! z misji państwa [Root.GetAdjective] zostają zamienione na §Yroszczenia tymczasowe§!."
 flavor_rus.101.t: "Rozwój handlu w prowincji [310.GetName]"
 flavor_rus.101.desc: "Miasto [310.GetName] należy do najstarszych w regionie. Jego historia sięga IX wieku, kiedy pełniło funkcję ważnego węzła handlowego na szlaku łączącym Skandynawię z Cesarstwem Bizantyjskim. Nic dziwnego, że rozwinęło się w jedno z największych centrów handlowych Europy Wschodniej.
Choć nie jest już stolicą niegdyś potężnej Republiki Nowogrodzkiej, znaczenie [310.GetName] jako ośrodka handlu bałtyckiego ponownie wzrosło pod rządami państwa [Root.GetAdjective]."
 flavor_rus.101.a: "Wspaniale!"
 flavor_rus.102.t: "Założenie Archangielska"
 flavor_rus.102.desc: "Morze Białe jest trudnym akwenem do żeglugi, ponieważ można z niego korzystać zaledwie przez trzy miesiące w roku. Dostęp do morza pozostaje jednak bezsprzecznie bardzo cenny. Kupcy i mieszczanie przenieśli się do prowincji Chołmogory, aby założyć miasto Archangielsk."
 flavor_rus.102.a: "Dobrze."
 flavor_rus.105.t: "Wielkie Księstwo Finlandii"
 flavor_rus.105.desc: "Finowie cieszyli się dużą autonomią oraz integracją z prawami i społeczeństwem swoich dawnych zwierzchników – Szwedów. Oczywiście teraz, gdy podbiliśmy ich ziemie, oczekują od nas podobnego traktowania.
Ustanowienie autonomicznej Finlandii, rządzonej przez naszego [Root.Monarch.GetTitle] jako jego prywatna domena, mogłoby uspokoić Finów."
 flavor_rus.105.a: "Ustanów autonomiczne wielkie księstwo."
 flavor_rus.105.a.tt: "Dopóki ten modyfikator jest aktywny, możemy rekrutować kompanię najemników §Jkawalerii hakkapeliitta§!."
 flavor_rus.105.b: "Odrzuć ten pomysł."
 flavor_rus.106.t: "Prowincja [280.GetName] pod rządami państwa [Root.GetAdjective]"
 flavor_rus.106.desc: "[280.GetName] jest miastem, od którego wzięła nazwę Ruś Kijowska, oraz ważnym ośrodkiem religii prawosławnej. To właśnie tutaj znajdują się najważniejsze postacie religijne naszego państwa [Root.GovernmentName]. Choć znaczenie handlowe miasta pozostaje niewielkie, jego położenie daje mu potencjał, by stać się jaśniejącą latarnią państwa [Root.GetUsableName]."
 flavor_rus.106.a: "Skupmy się na jego znaczeniu religijnym."
 flavor_rus.106.b: "Zainwestujmy w jego potencjał handlowy."
 flavor_rus.106.c: "Przekształćmy miasto w naszą najsilniejszą twierdzę."
 flavor_rus.106.d: "Rozbuduj akademię w prowincji [280.GetName]."
 flavor_rus.114.t: "Założenie Rostowa nad Donem"
 flavor_rus.114.desc: "Handel jest jedną z sił życiowych państwa [Root.GetUsableName]. Jest to szczególnie prawdziwe, gdy prowadzimy wymianę handlową z innymi wielkimi mocarstwami, takimi jak Osmanowie.
[Root.Monarch.GetTitle] [Root.Monarch.GetName] dostrzegł to jako pierwszy i wzniósł fortyfikację kilka kilometrów od Azowa, aby kontrolować handel z Osmanami. Z biegiem lat znaczenie Azowa zmalało, a Rostów nad Donem wyrósł na główny ośrodek handlowy."
 flavor_rus.114.a: "Dobrze."
 flavor_rus.116.t: "Przyszłość sojuszu [Root.GetAdjective]-[rus_persian_ally.GetAdjective]"
 flavor_rus.116.tt: "Wystąpi wydarzenie „§YPrzyszłość sojuszu [Root.GetAdjective]-kaukaskiego§!”."
 flavor_rus.116.desc: "Sojusz, który pierwotnie zawarto z konieczności i z poczucia obowiązku wobec wspólnej grupy religijnej [Root.Religion.GetGroupName], okazał się silniejszy niż jakiekolwiek więzi polityczne w historii państwa [Root.GetUsableName]. Dzięki przebiegłym strategiom i połączonym siłom wyeliminowaliśmy muzułmańskie zagrożenie ze strony Persji, a mieszkańcy państwa [rus_persian_ally.GetUsableName] świętują życie wolne od zagrożenia ze strony wielkich mocarstw.
Oczywiste jest, że państwo [rus_persian_ally.GetAdjective] jest nam winne wdzięczność za udzielone wsparcie. Żadna nagroda nie będzie jednak wystarczająca poza lojalnością wobec korony [Root.GetAdjective]."
 flavor_rus.116.a: "Państwo [rus_persian_ally.GetUsableName] musi uklęknąć przed państwem [Root.GetUsableName]!"
 flavor_rus.117.tt: "Zażądamy podporządkowania państwa §Y[rus_persian_ally.GetUsableName]§!. Jeśli się zgodzi, stanie się naszym §Ywasalem§!.
Państwo §Y[rus_persian_ally.GetUsableName]§! zawsze odmówi, jeśli jego całkowity poziom rozwoju przekracza §Y500§!."
 flavor_rus.116.b: "Państwa [rus_persian_ally.GetUsableNameCap] i [Root.GetUsableName] są sobie równe."
 RUS_PERSIAN_TRADE: "Rosyjska obecność w Persji"
 flavor_rus.117.t: "Państwo [From.GetUsableNameCap] żąda naszego podporządkowania"
 flavor_rus.117.desc: "Ambasador z państwa [From.GetUsableName] ma czelność wkroczyć na dwór państwa [Root.GetAdjective] i zażądać, aby nasz [Root.Monarch.GetTitle] ukorzył się przed ich [From.Monarch.GetTitle]. Państwo [From.GetAdjective] pomogło nam w podboju Persji, a teraz chce, abyśmy zostali jego poddanym."
 flavor_rus.117.a: "Kim jesteśmy, by sprzeciwiać się państwu [From.GetAdjective]?"
 flavor_rus.117.b: "Niedorzeczne!"
 flavor_rus.118.t: "Państwo [From.GetUsableNameCap] ustępuje!"
 flavor_rus.118.desc: "Do naszego dworu dotarły wieści z państwa [From.GetUsableName]. Władca państwa [From.GetAdjective] zaakceptował nasze żądanie. Państwo [From.GetUsableNameCap] jest teraz poddanym korony [Root.GetAdjective]."
 flavor_rus.118.a: "Doskonale!"
 flavor_rus.119.t: "Państwo [From.GetUsableNameCap] stawia opór!"
 flavor_rus.119.desc: "Do naszego dworu dotarły wieści z państwa [From.GetUsableName]. Władca państwa [From.GetAdjective] odrzucił nasze żądanie. Państwo [From.GetAdjective] pluje nam w twarz, choć nasze żądanie było całkowicie uzasadnione."
 flavor_rus.119.a: "I to po wszystkim, co dla nich zrobiliśmy?"
 flavor_rus.120.a.tt: "Każde znane państwo wyznające §Y[Root.Religion.GetName]§! zwiększa swoją opinię o państwie §Y[Root.GetName]§! o §G25§!."
 flavor_rus.122.t: "Koniec hord tatarskich"
 flavor_rus.122.desc: "Hordy tatarskie, niszczyciele Rusi Kijowskiej i ciemiężyciele naszego ludu, przestały istnieć! Ostatni nomadzi uciekają na wschód lub giną na polu bitwy z rąk naszych wojsk, a granice państwa [Root.GetAdjective] przesuwają się coraz dalej na wschód. Państwo [Root.GetUsableNameCap] nigdy więcej nie będzie sługą obcych najeźdźców!"
 flavor_rus.122.a: "Za ojczyznę!"
 flavor_rus.123.t: "Biurokratyczne priorytety"
 flavor_rus.123.desc: "Wraz z rozbudową urzędów państwa [Root.GetUsableName] nasze możliwości osiągnęły nowy poziom. Pozostałe zasoby możemy teraz wykorzystać, aby skupić się na jednym z najważniejszych aspektów funkcjonowania państwa."
 flavor_rus.123.a: "Skup się na administracji państwa."
 flavor_rus.123.b: "Skup się na korzyściach handlowych."
 flavor_rus.123.c: "Skup się na rozwoju wojskowym."
 flavor_rus.124.t: "Ostatni tysiacki"
 flavor_rus.124.desc: "Tysiaccy byli dowódcami wojskowymi od czasów Rusi Kijowskiej. Po jej upadku zaczęli pełnić inne funkcje, obejmując stanowiska sądowe i handlowe. Zostali jednak w większości zlikwidowani i zastąpieni za panowania Dymitra Dońskiego w 1374 roku. Niektórzy tysiaccy nadal pełnią jednak swoje obowiązki."
 flavor_rus.124.a: "Powinni zostać ponownie ustanowieni."
 flavor_rus.124.b: "Powinni zostać zastąpieni przez namiestników."
 flavor_rus.125.t: "Oprycznina"
 flavor_rus.125.desc: "Niektórzy bojarzy z prowincji [revolt_province.GetName] postanowili zdradzić ojczyznę i wzniecić bunt, gdy prowadzimy wojnę.
Ta zdrada nie uszła naszej uwadze. [Root.Monarch.GetTitle], głęboko dotknięty tym wiarołomstwem, domaga się ustanowienia opryczniny – polityki państwowej, która da państwu [Root.GovernmentName] swobodę uciskania uciążliwej szlachty."
 flavor_rus.125.a: "Ta zdrada nie może pozostać bez odpowiedzi."
 flavor_rus.125.b: "Nie warto."
 flavor_rus.126.t: "Spalenie Razriadów"
 flavor_rus.126.desc: "Miestniczestwo opiera się na genealogicznych informacjach o bojarach i skomplikowanej hierarchii ich rodów. Te kluczowe dane publikowane są w postaci Razriadów – ksiąg rejestrowych.
Wraz z rozwojem autokracji w państwie [Root.GetUsableName] i przechodzeniem biurokracji na bardziej scentralizowany system, bezpośrednio podporządkowany [Root.Monarch.GetTitle], międzicznictwo uznano za zbędne. W [GetDate] [Root.Monarch.GetTitle] nakazuje spalić wszystkie Razriady i ostatecznie znosi miestniczestwo."
 flavor_rus.126.a: "Z prochu powstałeś, w proch się obrócisz."
 flavor_rus.127.t: "Piotr Wielki"
 flavor_rus.127.desc: "Syn cara Aleksego i jego żony Natalii Naryszkiny, Piotr odziedziczył tron Rosji w wieku zaledwie dziesięciu lat. Ponieważ nie był pierwszym w kolejce do sukcesji, jego przyrodnia siostra Zofia, wspierana przez nielojalnych strzelców, dokonała zamachu stanu przeciwko młodemu carowi. Podczas tego najazdu zamordowano część krewnych i przyjaciół Piotra. W wieku siedemnastu lat Piotr obalił regencję i zaczął współrządzić Rosją ze swoim przyrodnim bratem Iwanem V. Dopiero po śmierci matki Piotr naprawdę rozpoczął sprawowanie władzy jako suweren Rosji.\nJego panowanie charakteryzowały liczne reformy, które objęły wszystkie dziedziny rosyjskiego społeczeństwa. W pierwszych latach car wprowadził szeroko zakrojone zmiany, których celem była modernizacja Rosji i zbliżenie jej do mocarstw Europy Zachodniej. Na dworze wprowadzono zachodnioeuropejski kodeks ubioru, a wojsko przeszło gruntowną przebudowę. Piotr, zafascynowany statkami od najmłodszych lat, założył pierwszą oficjalną marynarkę wojenną.\n\nPiotr zyskał przydomek „Wielki” dzięki licznym reformom rządowym i przekształceniu carstwa w jedno z czołowych imperiów Europy."
 flavor_rus.127.a: "Tron [Root.GetAdjective] należy do Piotra."
 flavor_rus.128.t: "Wielkie reformy Piotra"
 flavor_rus.128.desc: "W pierwszych latach panowania Piotr Wielki czerpał inspirację z zachodnioeuropejskich doradców: zreorganizował armię, utworzył pierwszą rosyjską marynarkę wojenną, zmodernizował absolutystyczny sposób rządzenia i położył pierwsze fundamenty industrializacji Rosji. Choć jego rządy zaostrzyły również system pańszczyźniany i wymagały rozlewu krwi podczas buntów, cesarz odmienił oblicze Rosji, sprawiając, że pozostałe wielkie mocarstwa musiały ją uznać."
 flavor_rus.128.a: "Podbiłem imperium, lecz nie zdołałem podbić samego siebie."
 flavor_rus.129.t: "Katarzyna Wielka"
 flavor_rus.129.desc: "Urodzona w bocznej linii niemieckiego rodu askańskiego Zofia z Anhalt-Zerbst była jedną z wielu mało znaczących księżniczek Świętego Cesarstwa Rzymskiego. W wieku dziesięciu lat poznała swojego przyszłego męża, Piotra III. Sześć lat później, po ślubie, młoda Zofia przeniosła się do Rosji i z wielkim zapałem uczyła się języka rosyjskiego. Aby przystosować się do nowego otoczenia i zdobyć przychylność panującej wówczas cesarzowej Elżbiety, Zofia przeszła na prawosławie i przyjęła imię Katarzyna.\nMałżeństwo z Piotrem III nie układało się z powodu jego niedojrzałości, a oboje małżonkowie dopuszczali się niewierności. Katarzyna przez wiele lat potajemnie spiskowała przeciwko mężowi, a gdy Piotr odziedziczył tron Rosji, ambitna Katarzyna obaliła cesarza po zaledwie sześciu miesiącach jego panowania.\n\nZa jej rządów Rosja przeżyła renesans kultury, sztuki, nauki i wielu innych idei oświecenia. To właśnie za Katarzyny imperium znacznie rozszerzyło swoje wpływy na zachód."
 flavor_rus.129.a: "To ona musi poprowadzić państwo [Root.GetUsableName] ku wielkości."
 flavor_rus.129.b: "Idealna małżonka dla [Root.Monarch.GetName]."
 flavor_rus.129.c: "Co za niezwykła kobieta."
 flavor_rus.130.t: "Rola strzelców"
 flavor_rus.130.desc: "Strzelcy są elitarnymi oddziałami naszej armii. Rekrutuje się ich spośród ludności wiejskiej i rzemieślników, a służba ma charakter dożywotni. W czasie pokoju strzelcy powinni wracać do swoich zawodów. W związku z tym każda kampania wojskowa jest dla nich niepożądana, ponieważ oznacza utratę dochodów.
Aby temu zaradzić, zaproponowano wprowadzenie gwarantowanego żołdu, który zapewni lojalność strzelców nawet podczas najbardziej wymagających wojen."
 flavor_rus.130.a: "Zagwarantuj regularny żołd."
 flavor_rus.130.a.tt: "§YStrzelcy§! będą domagać się wypłaty żołdu przy każdym objęciu tronu przez nowego władcę."
 flavor_rus.130.b: "Mogą utrzymywać się z ziemi."
 flavor_rus.131.t: "Strzelcy domagają się wypłaty żołdu"
 flavor_rus.131.desc: "Strzelcy zgromadzili się na dworze nowo koronowanego [Root.Monarch.GetTitle]. Ich żądanie jest proste: chcą otrzymać żołd za swoją służbę."
 flavor_rus.131.a: "Wypłaćmy im hojny żołd."
 flavor_rus.131.b: "Wypłaćmy im należny żołd."
 flavor_rus.131.c: "Wypłaćmy im najniższy możliwy żołd."
 flavor_rus.131.d: "Nie wypłacajmy im nic."
 flavor_rus.132.tt: "Strzelcy mogą wzniecić powstanie."
 flavor_rus.132.t: "Powstanie strzelców"
 flavor_rus.132.desc: "Brak żołdu wywołał wielkie niezadowolenie w pułkach strzelców. Zaatakowali oni prowincję [revolt_province.GetName] i domagają się abdykacji [Root.Monarch.GetName] oraz osadzenia na tronie nowego władcy."
 flavor_rus.132.a: "O nie!"
 flavor_rus.134.t: "Zwrot ku Zachodowi"
 flavor_rus.134.desc: "Państwo [Root.GovernmentName] [Root.GetUsableName] przez kilka dziesięcioleci istniało przy niewielkim lub żadnym wpływie mocarstw zachodnich. Zmieniło się to, gdy [Root.Monarch.GetName] wraz ze swoimi kompetentnymi doradcami z Europy Zachodniej przejął kontrolę nad dworem. Dawne, surowe i tradycyjne życie dworskie zastąpił model wzorowany na zachodnich obyczajach. Wiele innych aspektów naszego społeczeństwa nadal wymaga reform, lecz zmiany na dworze są pierwszym krokiem ku nowej Rosji."
 flavor_rus.134.a: "Modernizacja postępuje."
 flavor_rus.200.t: "Proklamacja nowego imperium"
 flavor_rus.200.desc.a: "Wielki [Root.Monarch.GetTitle] [Root.Monarch.GetName], władca [Root.GetUsableName] i zwycięzca wojny rywali, ogłosił swój dekret. Odtąd [Root.Monarch.GetTitle] będzie znany jako [Root.GetEmpressEmperor] wszystkich mieszkańców [Root.GetUsableName]. W konsekwencji państwo [Root.GovernmentName] będzie nosić nazwę Imperium [Root.GetUsableName].\nMocarstwa [Root.Capital.GetContinentName] postrzegają to jako prowokację, lecz ich reakcja jedynie umacnia roszczenia [Root.Monarch.GetName] do nowego tytułu."
 flavor_rus.200.desc.b: "Rada rządząca państwa [Root.GetUsableName], pod przewodnictwem [Root.Monarch.GetName], wielkiego [Root.Monarch.GetTitle] i zwycięzcy wojny rywali, ogłosiła swój dekret. Od tej chwili [Root.GovernmentName] będzie nosić nazwę Wielkiej Republiki Federalnej [Root.GetUsableName]. Władza i autorytet [Root.Monarch.GetTitle] zostaną umocnione, a administrację prowincji powierzy się przedstawicielom wybieranym przez radę mieszczan."
 flavor_rus.200.a: "Niech żyje [Root.GetEmpressEmperor]!"
 flavor_rus.200.b: "Niech żyje republika!"
 flavor_rus.295.t: "Zakup idei"
 flavor_rus.295.desc: "Państwo [From.GetUsableNameCap] słynie z rewolucyjnych osiągnięć w dziedzinie nauki i kultury. Nic więc dziwnego, że [Root.GetAdjective] ambasadorowie zwrócili się do [From.Monarch.GetTitle] z propozycją zakupu niektórych z tych idei."
 flavor_rus.295.a: "Zgoda."
 flavor_rus.295.a.tt: "Przekaż §R-[Root.money_to_transfer_info.GetValue]§! ¤ państwu §Y[From.GetName]§!."
 flavor_rus.296.t: "Zakup idei"
 flavor_rus.296.desc: "Ambasadorowie państwa [From.GetUsableName] przybyli na nasz dwór i przekazali obiecaną sumę dukatów."
 flavor_rus.296.a: "Doskonale!"
 flavor_rus.296.a.tt: "Otrzymujemy §G[From.money_to_transfer_info.GetValue]§! ¤ od państwa §Y[From.GetName]§!."
 flavor_rus.300.t: "Chłopi zostają objęci poddaństwem"
 flavor_rus.300.desc: "W czasach klęsk i chaosu, takich jak wojny, głód, susze czy zarazy, chłopi opuszczają swoje gospodarstwa i uciekają do miast. Ich ziemie zarastają wówczas chwastami. Aby zapobiec podobnym sytuacjom, które mogłyby zagrozić zaopatrzeniu całego kraju w żywność, [Root.Monarch.GetTitle] [Root.Monarch.GetName] wydał dekret zakazujący chłopom opuszczania majątków, w których się urodzili."
 flavor_rus.300.a: "Chłopi rzeczywiście stali się poddanymi."
 flavor_rus.301.tt: "§YChłopi§! wzniecą powstanie przeciwko państwu §Y[Root.GetUsableName]§!."
 flavor_rus.301.t: "Powstanie chłopskie"
 flavor_rus.301.desc: "Nie wszyscy chłopi godzą się z perspektywą życia w poddaństwie. Chłopstwo otwarcie buntuje się przeciwko właścicielom ziemskim w prowincji [rus_peasant_revolt_province.GetName]!"
 flavor_rus.301.a: "Zmiażdżmy ich!"
 flavor_rus.303.t: "Wyzwolenie chłopów"
 flavor_rus.303.desc: "Chłopstwo stanowi fundament państwa [Root.GovernmentName] i musi żyć w opresyjnej zależności feudalnej od właścicieli ziemskich, aby zapewnić państwu dostawy żywności. Poddaństwo pozbawia jednak chłopów wszelkiej samodzielności.\nWrażliwy na ich los [Root.Monarch.GetTitle] [Root.Monarch.GetName] okazał chłopom łaskę i rozluźnił więzi łączące ich ze zwierzchnikami. Niższe warstwy społeczne przyjęły tę decyzję z wdzięcznością, lecz [Root.GetNobilityName] twierdzi, że [Root.Monarch.GetName] stał się miękki i słaby."
 flavor_rus.303.a: "Dobro wielu jest ważniejsze niż dobro nielicznych."
 flavor_rus.304.t: "Powstanie stanu [Root.GetNobilityName]"
 flavor_rus.304.desc: "Decyzja [Root.Monarch.GetName] o zwiększeniu swobody chłopów przysporzyła [Root.Monarch.GetHerHim] wrogów w szeregach stanu [Root.GetNobilityName]. Jego przedstawiciele otwarcie buntują się przeciwko [Root.Monarch.GetTitle] w prowincji [rus_boyars_revolt_province.GetName]."
 flavor_rus.304.a: "Zmiażdżmy ich!"
 flavor_rus.304.tt: "§Y[Root.GetNobilityName]§! wznieci powstanie przeciwko państwu §Y[Root.GetUsableName]§!."
 flavor_rus.306.t: "Sobornoje Ułożenije"
 flavor_rus.306.desc: "Poddaństwo chłopów stało się powszechną praktyką na terytorium państwa [Root.GetUsableName]. Chłopi cierpią pod rządami właścicieli ziemskich, podczas gdy [Root.GetNobilityName] czerpie korzyści z ich pracy.\nPoddaństwo nie zostało jednak zalegalizowane w kodeksie prawnym państwa [Root.GetUsableName], dlatego zasady posiadania poddanych i życia w poddaństwie nie zostały jeszcze ostatecznie określone. Sobornoje Ułożenije z roku [GetYear] daje [Root.Monarch.GetTitle] [Root.Monarch.GetName] możliwość uregulowania tej kwestii — może przypieczętować los chłopów albo wyzwolić poddanych, narażając się na gniew stanu [Root.GetNobilityName]."
 flavor_rus.306.a: "Skodyfikujmy poddaństwo chłopów"
 flavor_rus.306.b: "Wyzwólmy chłopów"
 flavor_rus.307.t: "Pierwsze idee oświecenia"
 flavor_rus.307.desc: "Po wyzwoleniu chłopów spod władzy stanu [Root.GetNobilityName] i innych właścicieli ziemskich ludność wiejska zyskała dużą swobodę przemieszczania się po terytorium państwa [Root.GetUsableName]. Mieszczanie i chłopi cieszą się nowo zdobytą wolnością, lecz przynosi ona niezamierzone konsekwencje dla państwa [Root.GovernmentName]: wśród ludu zaczynają szerzyć się wczesne idee oświecenia, podkreślające wolność niższych warstw społecznych w opozycji do klasy rządzącej. Jeśli prawa chłopów nie zostaną cofnięte, zagrożona będzie sama stabilność państwa [Root.GetUsableName]."
 flavor_rus.307.a: "Zignorujmy te obawy"
 flavor_rus.307.b: "Przywróćmy poddaństwo"
 flavor_rus.308.t: "Wielkie powstanie!"
 flavor_rus.308.desc: "Pomimo wszelkich wysiłków rządu, by za wszelką cenę uspokoić lud, poddani zbuntowali się przeciwko swoim panom i zgromadzili w prowincji [revolt_province.GetName], by rozpocząć otwarte powstanie przeciwko [Root.Monarch.GetTitle]. Na czele buntowników stanęli wywłaszczeni Kozacy, którzy kwestionują prawowitość władzy [Root.Monarch.GetName]. Powstanie skłoniło wielu innych przedstawicieli ludu do wystąpienia przeciwko klasie rządzącej..."
 flavor_rus.308.a: "Lud rusza do walki..."
 flavor_rus.308.a.tt: "Każda posiadana prowincja w regionach §YRosja§!, §YRuś§!, §YUral§! i §YStep Pontyjski§!, w której produkuje się §Yzboże§!, §Yzwierzęta hodowlane§! lub §Ywełnę§!, otrzymuje następujące efekty:"
 flavor_rus.309.t: "Wzrost znaczenia mieszczaństwa"
 flavor_rus.309.desc.a: "Chłopi, niegdyś niewykształcone i ubogie masy [Root.GetUsableName], zaczęli zajmować się handlem i kupiectwem. W rezultacie stan [Root.GetBurghersName] zyskuje na znaczeniu, ponieważ coraz więcej byłych chłopów zdobywa majątek pozwalający im zamieszkać w wielkich miastach państwa [Root.GetUsableName].\nKlasa średnia stała się dominującą siłą w państwie [Root.GetUsableName]."
 flavor_rus.309.a: "Miasta się rozrastają..."
 flavor_rus.309.b: "Włączmy nowych mieszczan do republiki"
 flavor_rus.310.t: "Polityka reakcyjna"
 flavor_rus.310.desc: "Po wielkim powstaniu [Root.Monarch.GetTitle] doszedł do wniosku, że zwykli ludzie budzą raczej strach niż współczucie. W rezultacie władca i poddani sprawujący rządy coraz bardziej skłaniają się ku zacieśnieniu więzów łączących chłopów pańszczyźnianych z ich panami. Wszelkie dążenia do wyzwolenia chłopów zostały stłumione, ponieważ gospodarka [Root.GetUsableName] w dużym stopniu opiera się na poddaństwie, a zmiana tego systemu doprowadziłaby do chaosu w państwie [Root.GovernmentName]."
 flavor_rus.310.a: "Zaciśnijmy kajdany ludu"
 flavor_rus.310.b: "Mimo wszystko wyzwólmy chłopów"
 flavor_rus.311.t: "Awans klasy średniej [Root.GetUsableName]"
 flavor_rus.311.desc.a: "Klasa średnia, niegdyś mało znacząca i pozbawiona osiągnięć w państwie [Root.GetUsableName], urosła do rangi dominującej siły w jego społeczeństwie. Dzięki licznym chłopom, którzy do niej dołączyli, kupcy i mieszczanie zdobyli znaczne wpływy na dworze i zagrażają nawet samej władzy [Root.Monarch.GetTitle] oraz jego szlacheckich poddanych."
 flavor_rus.311.desc.b: "Klasa średnia w państwie [Root.GetUsableName] odgrywała ważną rolę od samego początku. Jednak równowaga sił między republiką a stanem [Root.GetBurghersName] została zachwiana przez licznych chłopów, którzy do niego dołączyli. Ich wpływ na sprawy dworu zagraża samej władzy republiki i stanu [Root.GetNobilityName]."
 flavor_rus.311.a: "Państwo [Root.GovernmentName] przetrwa ten kryzys"
 flavor_rus.311.b: "Obejmijmy nowych członków stanu [Root.GetBurghersName] poddaństwem"
 flavor_rus.312.t: "Ideały oświecenia a poddaństwo chłopów"
 flavor_rus.312.desc: "Zbyt wielu zwykłych ludzi w państwie [Root.GetUsableName] zostało zniewolonych przez system poddaństwa. W rażącej sprzeczności z ideałami oświecenia państwo [Root.GetUsableName] opiera się na ciężkiej pracy chłopów, których traktuje się niemal jak bydło, z którym pracują.\nJednak ze względu na silne wpływy stanu [Root.GetNobilityName] na poddanych i dwór niewiele można zrobić dla tych nieszczęśliwych ludzi. Najwięcej, co [Root.Monarch.GetTitle] [Root.Monarch.GetName] może zaoferować bez wywołania wojny domowej, to edukacja dzieci poddanych, udzielanie im pożyczek, wprowadzenie systemu bezpłatnej opieki medycznej, przyznanie im większej ilości ziemi do użytkowania i unowocześnienie rolnictwa.\nNawet takie zmiany mogą zostać uznane za atak na swobody stanu [Root.GetNobilityName]..."
 flavor_rus.312.a: "Poprawmy warunki życia chłopów pańszczyźnianych."
 flavor_rus.312.b: "Obecny system działa bez zarzutu."
 flavor_rus.313.t: "Konflikt między autokracją a stanem [Root.GetBurghersName]"
 flavor_rus.313.desc: "Stan [Root.GetBurghersName] stał się potężną siłą w państwie [Root.GovernmentName]. Klasa średnia wpływa na wiele istotnych decyzji podejmowanych na szczeblu państwowym. Tam, gdzie niegdyś absolutną władzę sprawował [Root.Monarch.GetTitle], dziś sprawy rządowe znajdują się w rękach stanu [Root.GetBurghersName]. W pewnym sensie władca stał się jedynie ozdobną figurą państwa. Nic więc dziwnego, że stan [Root.GetBurghersName] podjął próbę obalenia państwa [Root.GovernmentName]..."
 flavor_rus.313.a: "Zmiażdżmy stan [Root.GetBurghersName]!"
 flavor_rus.313.b: "Poddajmy się stanowi [Root.GetBurghersName]."
 flavor_rus.350.t: "Los chłopstwa"
 flavor_rus.350.desc: "[Root.Monarch.GetName] umocnił zdobycze terytorialne Rosji, lecz wkrótce po objęciu przez [Root.Monarch.GetSheHe] władzy susza, głód i zaraza doprowadziły do śmierci pół miliona ludzi w prowincji [Root.Capital.GetName]. Chłopi uciekli ze swoich wsi, a ich gospodarstwa zarosły chwastami. [Root.Monarch.GetTitle] i [Root.Monarch.GetHerHis] doradcy muszą zareagować!"
 flavor_rus.350.a: "Przywiążmy chłopów do ziemi, na której się urodzili."
 flavor_rus.350.b: "Pozostawmy sprawy własnemu biegowi."
 flavor_rus.398.t: "Likwidacja poddaństwa"
 flavor_rus.398.desc: "Śmierć ciemiężcom ludu pracującego! Gwardia Rewolucyjna państwa [Root.GetUsableName] przetoczyła się przez rozległe ziemie uprawne i wyzwoliła wszystkich chłopów pańszczyźnianych, których zdołała odnaleźć. Wyzwoleni chłopi dołączyli do gwardii i podążają za nią w walce o wykorzenienie poddaństwa w państwie [Root.GetUsableName], podczas gdy właściciele ziemscy są rozstrzeliwani bez żadnego procesu.\n\nNiezliczeni poddani zostali uwolnieni ze szponów tyrańskiej szlachty, a kolejni dołączą do nich, gdy wyzysk człowieka przez człowieka zostanie zniesiony również w sąsiednich mocarstwach!"
 flavor_rus.398.a: "Ściąć głowy bojarom!"
 flavor_rus.399.t: "Czerwony terror"
 flavor_rus.399.desc: "Śmierć wrogom rewolucji! Gwardia Rewolucyjna, złożona z członków rodzin byłych chłopów pańszczyźnianych, przetoczyła się przez miasta, niosąc ze sobą gniew pokoleń chłopów. Niezliczonych bogatych mieszczan i bojarów postawiono przed sądem, aby rozliczyć ich rodziny z czynów popełnionych w czasach poddaństwa. Choć procesy te przedstawia się jako zło konieczne w walce z wrogami rewolucji, w rzeczywistości są one raczej pokazowymi spektaklami niż rzetelnymi rozprawami. Mimo to wielu mieszczan chłopskiego pochodzenia dołączyło do Gwardii Rewolucyjnej, by siać terror w wielkich miastach państwa [Root.GetUsableName]."
 flavor_rus.399.a: "Rewolucja postępuje!"
 flavor_mos.1.t: "Jarzmo tatarskie"
 flavor_mos.1.desc: "Jarzmo tatarskie to system danin narzucony Rusinom po upadku Rusi Kijowskiej pod naporem Złotej Ordy w 1248 roku. Wielkie Księstwo stało się pośrednikiem między ordami a ziemiami ruskimi, gdy w 1327 roku Iwan I Moskiewski wsparł swoich zwierzchników w stłumieniu powstania dowodzonego przez jego rywala, księcia Tweru. Mongołowie przyznali naszemu księstwu prawo do zarządzania Rusią i pobierania w ich imieniu danin.\n\nObecnie jarzmo tatarskie chyli się ku upadkowi, ponieważ Złota Orda osłabła i rozpadła się pod własnym ciężarem. Choć państwo [Root.GetUsableName] formalnie nadal jest poddanym ord, w rzeczywistości to [Root.Monarch.GetTitle] [Root.Monarch.GetName] włada Rusią, nie podlegając już wpływom Tatarów."
 flavor_mos.1.a: "To jarzmo nie będzie wiecznie ograniczać państwa [Root.GovernmentName]..."
 the_tatar_yoke_desc: "do momentu, gdy prowincja §YSaraj§! przestanie należeć do §Yordy§!"
 flavor_mos.1.a.tt: "§R§Y[Root.GetName]§! musi płacić coroczną daninę państwu §Y[466.Owner.GetName]§!, dopóki ten modyfikator jest aktywny.§!"
 flavor_mos.2.t: "Koniec jarzma tatarskiego"
 flavor_mos.2.desc: "Wraz z upadkiem [466.GetName] na rzecz [466.Owner.GetName] Tatarzy nie są już w stanie wymuszać płacenia daniny na mieszkańcach państwa [Root.GetUsableName]. Państwo [Root.GovernmentName] [Root.GetUsableName] wreszcie uwolniło się spod jarzma tatarskiego!"
 flavor_mos.2.desc_mos: "W miarę wzrostu potęgi [Root.GetName] panowie [466.GetName] mają coraz większe trudności z utrzymaniem nad nami jarzma. Ostatecznie Tatarzy musieli uznać, że jesteśmy zbyt potężni, by mogli narzucać nam swoje żądania. Państwo [Root.GovernmentName] [Root.GetUsableName] wreszcie uwolniło się spod jarzma tatarskiego!"
 flavor_mos.2.desc_mos_too_strong: "Potęga państwa [target_country.GetName] wzrosła do niekontrolowanych rozmiarów. Choć teoretycznie pozostaje ono pod jarzmem tatarskim, w rzeczywistości jego mieszkańcy zdołali stworzyć państwo, które potrafi skutecznie odpierać nasze najazdy. Nie jesteśmy w stanie narzucić państwu [target_country.GetName] naszych żądań. Jarzmo przestało istnieć..."
 flavor_mos.2.desc_horde: "Nadszedł koniec pewnej epoki. Niegdyś dzika orda [Root.GetName], która podbiła Ruś i narzuciła jej jarzmo tatarskie, przekształciła się w nowy rodzaj państwa — taki, który nie musi już polegać na barbarzyńskich metodach, takich jak najazdy, by umacniać swoją władzę polityczną. Choć niektórzy na dworze twierdzą, że za tą zmianą polityki stoi słabość [Root.Monarch.GetTitle], działania [Root.Monarch.GetName] zapoczątkują okres dobrobytu, bliższy temu, co państwa europejskie uznają za cywilizację."
 flavor_mos.2.a: "Jesteśmy panami własnego losu!"
 flavor_mos.2.b: "Zresztą jarzmo wymagało więcej wysiłku, niż było warte."
 flavor_mos.2.c: "Niefortunny obrót wydarzeń..."
 flavor_mos.3.t: "Żądanie daniny"
 flavor_mos.3.desc: "Na dwór [Root.Monarch.GetName] dotarło coroczne żądanie zapłaty daniny. Barbarzyńcy z państwa [466.Owner.GetName] oczekują, że zapłacimy ją w imieniu całej Rusi."
 flavor_mos.3.a: "Zapłaćmy daninę"
 flavor_mos.3.a.tt: "Państwo §Y[Root.GetName]§! płaci §R[Root.mos_tribute_to_pay.GetValue]§! ¤ państwu §Y[466.Owner.GetName]§!."
 flavor_mos.3.b: "Odmówmy zapłaty daniny"
 flavor_mos.3.b.tt: "Państwo §Y[466.Owner.GetName]§! może podjąć działania odwetowe przeciwko mieszkańcom państwa §Y[Root.GetName]§!..."
 flavor_mos.4.t: "Państwo [From.GetName] płaci coroczną daninę"
 flavor_mos.4.desc: "Władca państwa [From.GetName], osobisty piesek wielkiego [Root.Monarch.GetTitle], przysłał posła z żądaną daniną. Ruś zapłaciła za ochronę."
 flavor_mos.4.a: "Doskonale!"
 flavor_mos.4.a.tt: "§Y[From.GetName]§! płaci §Y[Root.mos_tribute_to_pay.GetValue]§! ¤ państwu §Y[Root.GetName]§!."
 flavor_mos.5.t: "Państwo [From.GetName] odmawia zapłaty corocznej daniny"
 flavor_mos.5.desc: "Władca państwa [From.GetName] zdradził potęgę państwa [Root.GetUsableName] i odmówił zapłacenia żądanej daniny! Ruś ściąga na siebie gniew dumnych jeźdźców z państwa [Root.GetUsableName]!"
 flavor_mos.5.a: "Wyślijmy najeźdźców i odbierzmy daninę siłą"
 flavor_mos.5.a.tt: "Każda prowincja państwa §Y[From.GetName]§! w regionie §YRosja§! zostaje złupiona przez państwo §Y[Root.GetName]§!, które zyskuje §G5§! ¤."
 flavor_mos.5.b: "Odpuśćmy im"
 flavor_mos.6.t: "Najeźdźcy z państwa [From.GetName] atakują!"
 flavor_mos.6.desc: "Nasza odmowa zapłacenia daniny państwu [From.GetName] rozgniewała jego władcę. [From.Monarch.GetSheHeCap] wysłał swoich najeźdźców, by łupili, plądrowali i palili nasze osady!"
 flavor_mos.6.a: "O nie!"
 flavor_mos.6.a.tt: "Każda posiadana prowincja w regionie §YRosja§! zostaje złupiona, traci §R5§! ¤, które trafia do państwa §Y[From.GetName]§!."
 flavor_mos.7.t: "Trzeci etap moskiewskiej wojny domowej"
 flavor_mos.7.desc: "Panowanie Wasyla II jest naznaczone niepokojami. Jego dziadek, Dymitr Doński, wyznaczył Wasyla I na prawowitego następcę, a jego brata, Jurija Dmitrijewicza, na kolejnego w linii sukcesji.\nOstatecznie Dymitr i Wasyl I zmarli, a władzę w państwie [Root.GetUsableName] objął syn Wasyla I, Wasyl II. Było to jawne pogwałcenie zasady starszeństwa w dziedziczeniu tronu, dlatego Jurij zbuntował się przeciwko wciąż młodemu wówczas Wasylowi II. Wybuchła moskiewska wojna domowa, w której Wasyl II walczył z Jurijem i jego synami — Wasylem Kosojem oraz Dymitrem Szemiaką.\n\nChoć zagrożenie ze strony Kosoja i Jurija zostało zażegnane, Dymitr Szemiaka nadal zagraża stabilności państwa [Root.GovernmentName]. Dysponując niewielką grupą spiskowców, Dymitr przeprowadził zamach stanu przeciwko Wasylowi II. [Root.Monarch.GetTitle] został pojmany, oślepiony i zesłany do Uglicza, a Dymitr przejął kontrolę nad rządem."
 flavor_mos.7.a: "Zapłaci za to..."
 vasily_ii_in_exile: "Wasyl II na wygnaniu"
 desc_vasily_ii_in_exile: "Dymitr Szemiaka, kuzyn Wasyla II, oślepił i wygnał prawowitego władcę państwa [Root.GetUsableName]. Choć bojarzy oficjalnie nie uznali Dymitra za prawowitego księcia, to właśnie on sprawuje obecnie władzę w państwie.\n\n§YModyfikator zostanie usunięty, gdy Wasyl II powróci z wygnania.§!"
 vasily_ii_in_exile_desc: "do momentu powrotu §Wasyla II§! z wygnania"
 flavor_mos.8.t: "Rządy Dymitra"
 flavor_mos.8.desc: "Podczas wygnania Wasyla II sprawami państwa kieruje Dymitr Szemiaka. Żaden ze stanów nie popiera jednak Szemiaki.\nZamiast tego zwracają się ku oślepionemu Wasylowi II i przysięgają wierność prawowitemu księciu moskiewskiemu. Wraz ze swoimi lojalistami Wasyl II może usunąć Dymitra z dworu i odzyskać tron."
 flavor_mos.8.a: "Połóżmy kres rządom Dymitra raz na zawsze"
 flavor_mos.8.b: "Pozwólmy Dymitrowi zachować tron"
 flavor_mos.9.t: "Klęska Dymitra"
 flavor_mos.9.desc: "Dymitr został pokonany, a rządy Wasyla przywrócono. Zwycięstwo Wasyla zakończyło moskiewską wojnę domową i ostatecznie rozstrzygnęło spór o tron."
 flavor_mos.9.a: "Wreszcie koniec tego sporu."
 flavor_mos.10.t: "Koniec jarzma tatarskiego"
 flavor_mos.10.desc: "Zmiana układu sił między ordami tatarskimi a państwem [Root.GetUsableName] sprawiła, że dalsze egzekwowanie jarzma tatarskiego stało się niemożliwe. Niegdyś wymuszana danina i żądania Tatarów należą już do przeszłości."
 rus_sell_vodka_to_the_people_title: "Promowanie sprzedaży wódki"
 rus_sell_vodka_to_the_people_desc: "Lud zaczyna się niepokoić. Zwiększenie sprzedaży naszej wódki może poprawić nastroje społeczne.\nA przynajmniej skierować agresję ludzi przeciwko sobie nawzajem."
 rus_sell_vodka_to_the_people_bt: "Każda posiadana prowincja produkująca §Yzboże§! traci §R10§! punktów dobrobytu."
 rus_claim_emperor_title_title: "Proklamowanie tytułu cesarskiego"
 rus_claim_emperor_title_desc: "Pozostałe mocarstwa [Root.Capital.GetContinentName] od dawna uważają nas za słabych i niewartych uwagi na światowej scenie politycznej.\nMusimy pokazać im, że nie jesteśmy zacofanym, podupadłym księstwem, lecz prawdziwym imperium. Musimy dowieść naszej potęgi, siły i wyższości!"
 rus_claim_emperor_title_at: "Dowolne państwo będące §Yrywalem§! zostało upokorzone przez §Y[Root.GetName]§!"
 rus_claim_emperor_title_bt: "Nie ma §Yrywali§!"
 hopae_system_decision_title: "Wprowadzenie systemu hopae"
 hopae_system_decision_desc: "System hopae to system identyfikatorów, który wymaga od wszystkich Koreańczyków noszenia tabliczki zawierającej imię i nazwisko, miejsce urodzenia, status społeczny oraz miejsce zamieszkania. Ułatwi to ustalenie, kim są poszczególne osoby i gdzie mieszkają."
 desc_hopae_system: "System hopae to system identyfikatorów, który wymaga od wszystkich Koreańczyków noszenia tabliczki zawierającej imię i nazwisko, miejsce urodzenia, status społeczny oraz miejsce zamieszkania. Ułatwi to ustalenie, kim są poszczególne osoby i gdzie mieszkają."
 enforce_hangeul_alphabet_decision_title: "Wprowadzenie alfabetu hangul"
 enforce_hangeul_alphabet_decision_desc: "Alfabet hangul jest łatwy do opanowania i przystępny, a jego celem jest zwiększenie piśmienności naszego ludu. Ponieważ wynaleziono go stosunkowo niedawno, ludność może potrzebować czasu, by przyzwyczaić się do niego zamiast używać dawnego chińskiego systemu pisma."
 enforce_hangeul_alphabet_decision_tt: "§Y[Root.Monarch.GetName]§! nie wybrał jeszcze §Ywprowadzenia§! ani §Yzniesienia§! alfabetu hangul."
 revoke_hangeul_alphabet_decision_title: "Zniesienie alfabetu hangul"
 revoke_hangeul_alphabet_decision_desc: "Wzrost piśmienności naszego ludu przyniósł znaczny postęp społeczny i technologiczny, ale sprzyja również szerzeniu się niebezpiecznych idei zagrażających państwu. Pozwolenie ludności na samodzielny wybór pisma i rezygnacja z narzucania alfabetu mogą złagodzić napięcia między ludem a państwem."
 hangeul_alphabet: "Wprowadzono alfabet hangul"
 hangeul_alphabet_decision_ct: "§YAlfabet można wprowadzić lub wycofać tylko raz za życia każdego władcy.§!"
 desc_hangeul_alphabet: "Nasz lud jest zmuszony do używania alfabetu hangul. Choć piśmienność wzrasta, wśród niższych warstw koreańskiego społeczeństwa szerzą się idee, które okazują się niebezpieczne dla państwa."
 hangeul_alphabet_revoked: "Zniesiono alfabet hangul"
 desc_hangeul_alphabet_revoked: "Nasz lud nie jest już zmuszony do używania alfabetu hangul. Piśmienność wśród zwykłych ludzi spadnie, ale w zamian społeczeństwo stanie się spokojniejsze."
 por_raise_the_ordenancas_title: "Powołanie milicji Ordenanças"
 por_raise_the_ordenancas_desc: "W razie potrzeby państwo [Root.GovernmentName] może powołać milicję Ordenanças, aby chronić państwo [Root.GetUsableName] przed obcymi najeźdźcami."
 por_raise_the_ordenancas_at: "Otrzymamy zasoby ludzkie i marynarzy w ilości odpowiadającej §G1§! rokowi ich przyrostu ze wszystkich prowincji położonych w promieniu §Y50§! od stolicy [Root.Capital.GetName]."
 por_raise_the_ordenancas_bt: "Ponieważ prowadzimy §Ywojnę obronną§!, decyzja nie wymaga wydania £mil£ punktów militarnych."
 por_raise_the_ordenancas_ct: "Za każde państwo wyznające §Y[Root.Religion.GetName]§!, które jest sojusznikiem lub poddanym państwa §Y[Root.GetName]§!, otrzymujemy §G+4,0%§! szybkości odzyskiwania zasobów ludzkich na §Y10§! lat.\n§YZ tej decyzji można uzyskać maksymalnie §G+20,0%§! szybkości odzyskiwania zasobów ludzkich.§!"
 gra_rally_the_volunteers_title: "Zgromadzenie ochotników"
 gra_rally_the_volunteers_desc: "Nadchodzi czas konfliktu. Wezwijmy ochotników naszej wiary, by stanęli w naszej obronie!"
 gol_the_tatar_yoke: "Jarzmo tatarskie"
 desc_gol_the_tatar_yoke: "Siedziba Tatarów, którzy żądają daniny od poddanych ruskich. Dopóki prowincja ta znajduje się w rękach ordy, Tatarzy zachowują pozycję siły, pozwalającą im wymuszać swoje żądania na ludności ruskiej."
 gol_the_tatar_yoke_tt: "Prowincja nigdy nie należała do państwa, którego reforma rządowa NIE jest §Ykoczownicy stepowi§! ani §YWielkie Państwo Mongolskie§!."
 eng_recruit_the_mercenaries_title: "Wystawienie armii"
 eng_recruit_the_mercenaries_desc: "Tradycyjnie [Root.GetParliamentOrFallbackName] sprzeciwia się wszelkim próbom utrzymywania stałej armii na potrzeby dynastii królewskiej. Zamiast tego państwo [Root.GovernmentName] polega na milicji, najemnikach i pospolitym ruszeniu wystawianym przez stan [Root.GetNobilityName]. Wojna stuletnia wkracza w końcową fazę, a Szkoci zagrażają naszemu bezpieczeństwu, dlatego musimy w jakiś sposób wystawić armię."
 eng_irish_conquest_title: "Podbój Irlandii"
 eng_irish_conquest_desc: "Gaelicka ludność Irlandii, historycznie określana mianem „wrogów Jego Królewskiej Mości w Irlandii”, od dawna pozostaje poza angielskim panowaniem. Nadszedł czas, by podporządkować ją naszej władzy."
 eng_conquer_scotland_title: "Podporządkowanie Szkocji"
 eng_conquer_scotland_desc: "Edward I, znany jako Młot na Szkotów (Scottorum Malleus), dostrzegł, jak ważne dla bezpieczeństwa naszego królestwa jest podporządkowanie Szkotów. Musimy postąpić tak samo."
 eng_conquer_scotland_ct: "To wydarzenie pozwoli nam kupić prowincję §Y[369.GetName]§! od państwa §Y[369.Owner.GetName]§!."
 eng_unify_the_isles_title: "Zjednoczenie Wysp"
 eng_unify_the_isles_desc: "Wyspy Brytyjskie są ojczyzną dwóch królestw — Anglii i Szkocji — oraz licznych drobnych państw irlandzkich. To od nas zależy zjednoczenie wysp pod angielskim panowaniem."
 eng_act_of_union_title: "Akty unii"
 eng_act_of_union_desc: "Ustawodawstwo licznych królestw Wysp Brytyjskich jest rozdzielone i skomplikowane. Choć wszystkie te państwa mają tego samego monarchę, ich prawa i parlamenty nie zostały zjednoczone w ramach jednej konstytucji. Nie możemy pozwolić, by ten stan rzeczy trwał."
 eng_act_of_union_at: "Jeśli utworzyliśmy państwo @GBR §Y[GBR.GetName]§!:"
 eng_act_of_union_bt: "Jeśli utworzyliśmy państwo @AVE §Y[AVE.GetName]§!:"
 eng_act_of_union_ct: "§G20§! punktów podstawowej produkcji zostanie losowo rozdzielonych między posiadane prowincje w regionach §YWielka Brytania§! lub §YFrancja§!."
 eng_war_of_the_roses_title: "Wojna Dwóch Róż"
 eng_war_of_the_roses_desc: "Wielu od dawna przewidywało wybuch tego konfliktu. Musimy za wszelką cenę bezpiecznie przeprowadzić nasz lud przez ten okres niepewności."
 eng_war_of_the_roses_at: "Jeśli ukończymy tę misję w trakcie katastrofy §YWojna Dwóch Róż§!:"
 eng_piety_of_the_state_title: "Pobożność państwa"
 eng_piety_of_the_state_desc: "Jesteśmy krainą błogosławioną przez samego Pana. Instytucje kościelne mają jednak zupełnie odmienne zdanie na temat zarządzania sprawami religijnymi. Musimy zadbać o pobożność państwa i przejąć kontrolę nad Kościołem."
 eng_piety_of_the_state_at: "Jeśli ukończymy tę misję, posiadając reformę rządową §YOddzielenie duchowieństwa od państwa§! lub §YOgraniczenie przywilejów duchowieństwa§!:"
 eng_handle_the_reformation_title: "Rozstrzygnięcie kwestii reformacji"
 eng_handle_the_reformation_desc: "Europę ogarnęła religijna anarchia. Tam, gdzie niegdyś wskazówek udzielał papież, zapanował chaos. Musimy przejąć kontrolę nad sytuacją i zdecydować, jakie stanowisko zajmiemy w sprawach boskich."
 eng_handle_the_reformation_at: "Jeśli ukończymy tę misję, będąc wyznawcami §Ykatolicyzmu§!:"
 eng_handle_the_reformation_bt: "Jeśli ukończymy tę misję, będąc wyznawcami §Yprotestantyzmu§!:"
 eng_handle_the_reformation_ct: "Jeśli ukończymy tę misję, będąc wyznawcami §Yreformowanego§!:"
 eng_handle_the_reformation_dt: "Jeśli ukończymy tę misję, będąc wyznawcami §Yanglikanizmu§!:"
 eng_strengthen_the_monarchy_title: "Umocnienie władzy państwowej"
 eng_strengthen_the_monarchy_desc: "Władza korony zawsze była przedmiotem sporów. Podczas gdy władca uważa swoje rządy za absolutne i pochodzące od Boga, [Root.GetParliamentOrFallbackName] próbuje ograniczać władzę [Root.Monarch.GetTitle].\nIdea absolutyzmu zyskuje na znaczeniu na europejskich dworach, a podobne tendencje pojawiają się również u nas. Musimy podążyć za tym trendem i umocnić ustrój państwa [Root.GetUsableName]."
 eng_the_english_civil_war_title: "Wojny Trzech Królestw"
 eng_the_english_civil_war_desc: "Władza [Root.Monarch.GetTitle] i uprawnienia [Root.GetParliamentOrFallbackName] stoją w wyraźnej sprzeczności. Konflikt między rojalistami a parlamentarzystami jest nieunikniony.\nMusimy zadbać o to, by państwo [Root.GetUsableName] przetrwało ten trudny okres i wyszło z niego silniejsze, z większym autorytetem."
 eng_the_english_civil_war_at: "Ukończono katastrofę §YWojna domowa w Anglii§! lub osiągnięto §Yepokę rewolucji§! bez jej wywołania."
 eng_the_english_civil_war_bt: "Jeśli ukończymy tę misję po zakończeniu §YWojny domowej w Anglii§!:"
 eng_the_english_civil_war_dt: "Odblokowuje §Ykwestie parlamentarne§!, które mogą modyfikować nasze §Yidee narodowe§!."
 eng_english_parliamentarism_title: "Ustawy parlamentu"
 eng_english_parliamentarism_desc: "[Root.GetParliamentOrFallbackName] jest narzędziem państwa. Choć może być potężnym instrumentem, jego potencjał można w pełni wykorzystać jedynie pod warunkiem mądrego kierowania jego pracami."
 gbr_ave_hundred_years_war_title: "Wojna stuletnia"
 gbr_ave_hundred_years_war_desc: "Traktat z Tours zapoczątkował kruchy rozejm między państwem [Root.GetName] a Francją. Obie strony wiedzą, że nie potrwa on długo. Musimy zdecydować, czy dotrzymać postanowień traktatu i cierpliwie czekać, czy też przygotować się do wojny.\nLos państwa [Root.GetUsableName] zależy od tej decyzji."
 gbr_ave_hundred_years_war_at: "To wydarzenie pozwoli nam wybrać między zachowaniem misji @GBR §Ybrytyjskich§!, skupionych na Nowym Świecie i kolonizacji Azji, a misjami @AVE §Yandegaweńskimi§!, koncentrującymi się na dominacji na kontynencie europejskim."
 gbr_develop_british_identity_title: "Kształtowanie brytyjskiej tożsamości"
 gbr_develop_british_identity_desc: "Wyspy Brytyjskie są domem wielu kultur i języków: Szkotów i górali na północy, Irlandczyków z zielonej wyspy oraz Walijczyków i Anglików na południu. Tak duże zróżnicowanie kulturowe nieuchronnie prowadzi do problemów, jeśli nie będziemy nim odpowiednio zarządzać. Musimy stworzyć brytyjską tożsamość, aby ustanowić brytyjską hegemonię na wyspach."
 gbr_develop_british_identity_at: "Jeśli ukończymy tę misję, akceptując kulturę §Ygóralską§! i mając §YIrlandię§! jako poddanego lub akceptując kulturę §Yirlandzką§!:"
 gbr_develop_british_identity_bt: "do czasu zdegradowania kultury §Ygóralskiej§! lub §Yirlandzkiej§!"
 gbr_develop_british_identity_ct: "Jeśli ukończymy tę misję, posiadając §Y50§! prowincji należących do grupy kulturowej §Y[Root.Culture.GetGroupName]§!:"
 gbr_explore_new_world_title: "Odkrycie Ameryk"
 gbr_explore_new_world_desc: "Przyciszone szepty mówią o tajemniczych krainach daleko na zachodzie, pełnych możliwości rozwoju i niewyobrażalnych cudów. Jeśli te opowieści są prawdziwe, ziemie te muszą należeć do nas."
 gbr_colonize_canada_title: "Kolonizacja Kanady"
 gbr_colonize_canada_desc: "Choć Kanada jest zimniejsza i bardziej surowa niż ziemie położone dalej na południe, jej terytorium obfituje w zasoby, które można wykorzystać. W zaśnieżonych górach nie brakuje cennych futer, drewna i minerałów."
 gbr_colonize_canada_ct: "Państwo §Y[Root.GetName]§! lub jego poddani posiadają co najmniej §Y10§! w pełni skolonizowanych prowincji w regionie kolonialnym §YKanada§!."
 ENGLISH_FUR_TRADE: "Angielski handel futrami"
 gbr_seize_ceylon_title: "[Root.GetPreviewColorGBR]Zajęcie Cejlonu[Root.GetPreviewColorGBR_end]"
 gbr_seize_ceylon_desc: "Cejlon to wyspa położona u wybrzeży Indii, której kontrola ma ogromne znaczenie dla zabezpieczenia handlu na Oceanie Indyjskim. Nasi rywale znają zyski płynące z handlu z Indiami i Wyspami Korzennymi, dlatego również dążą do zajęcia Cejlonu. Nie możemy do tego dopuścić."
 COROMANDEL_PRESENCE: "Obecność w Koromandelu"
 gbr_end_the_french_conflict_title: "[Root.GetPreviewColorGBR]Zakończenie konfliktu z Francją[Root.GetPreviewColorGBR_end]"
 gbr_end_the_french_conflict_desc: "Niezależnie od tego, czy pokonamy Francuzów i przejmiemy ich tron, czy też porzucimy kontynentalną Europę, skupiając się na potędze morskiej, nasz konflikt z Francją i kontynentem musi zostać zakończony."
 gbr_end_the_french_conflict_at: "Nie posiada żadnej prowincji w regionie §YFrancja§! poza §Y[87.GetName]§!."
 gbr_end_the_french_conflict_bt: "Prowincje §Y[4385.GetName]§! i §Y[167.GetName]§! należą do państwa §Y[Root.GetName]§! lub jego poddanych oraz posiadają §Ytargowisko§!, §Yskład handlowy§! albo §Ygiełdę§!."
 gbr_abolish_villeinage_title: "[Root.GetPreviewColorGBR]Zniesienie poddaństwa chłopów[Root.GetPreviewColorGBR_end]"
 gbr_abolish_villeinage_desc: "Praca pańszczyźniana okazała się w przeszłości użyteczna. Jest jednak przestarzała i nie przystaje już do państwa [Root.GovernmentName] o naszej randze. Nadszedł czas, by zastąpić ten system, upowszechniając dzierżawę dziedziczną."
 unlock_privilege_estate_nobles_english_copyhold_tenure_tt: "\nOdblokowuje przywilej szlachty „§YRozszerzona dzierżawa dziedziczna§!”."
 gbr_establish_royal_navy_title: "[Root.GetPreviewColorGBR]Utworzenie Królewskiej Marynarki Wojennej[Root.GetPreviewColorGBR_end]"
 gbr_establish_royal_navy_desc: "Nasza obecna flota składa się jedynie z okrętów wystawianych przez stan mieszczański. Jej mobilizacja jest powolna i kosztowna.\nMusimy utworzyć stałą marynarkę wojenną, która będzie bronić naszej wyspy przed obcymi najeźdźcami i zabezpieczy przyszłość państwa [Root.GetUsableName]."
 gbr_rule_britannia_title: "[Root.GetPreviewColorGBR]Panuj, Brytanio![Root.GetPreviewColorGBR_end]"
 gbr_rule_britannia_desc: "Naszą siłą jest flota, a morze jest naszym domem. Naszym przeznaczeniem jest panowanie nad światem z naszych wysp i dominacja dzięki przewadze morskiej!"
 gbr_rule_britannia_at: "Modyfikator zyskuje kolejne poziomy dzięki działaniom parlamentu."
 gbr_colonize_north_america_title: "[Root.GetPreviewColorGBR]Osadnictwo w Ameryce[Root.GetPreviewColorGBR_end]"
 gbr_colonize_north_america_desc: "Ziemie Ameryki wydają się odpowiednie do wielu przedsięwzięć. Na północy słyszeliśmy o futrach i surowcach potrzebnych do budowy okrętów. Południowe obszary nadają się natomiast do uprawy wielu roślin. Musimy założyć tam przyczółki, aby czerpać zyski z tych ziem."
 gbr_colonize_north_america_at: "Państwo §Y[Root.GetName]§! lub jego poddani posiadają co najmniej §Y10§! w pełni skolonizowanych prowincji w regionie kolonialnym §YWschodnia Ameryka§!."
 gbr_dominiate_new_world_title: "[Root.GetPreviewColorGBR]Dominacja w Nowym Świecie[Root.GetPreviewColorGBR_end]"
 gbr_dominiate_new_world_desc: "Ten osobliwy Nowy Świat należy do państwa [Root.GetName]. Wszystkie jego zasoby i ziemie powinny przypaść koronie. Musimy zapewnić sobie dominację w Nowym Świecie i wypędzić każdego, kto ośmieli się ją podważyć."
 gbr_dominiate_new_world_at: "Wszyscy §Ykolonialni§! poddani otrzymują §G+50,0%§! wydajności produkcji i §G+50,0%§! wydajności handlu."
 gbr_establish_first_indian_trade_post_title: "[Root.GetPreviewColorGBR]Kompania Wschodnioindyjska[Root.GetPreviewColorGBR_end]"
 gbr_establish_first_indian_trade_post_desc: "Wiele egzotycznych towarów pochodzi z subkontynentu indyjskiego. Europejskie mocarstwa od wielu lat czerpią korzyści z handlu z Indiami. Nadszedł czas, by dorównać im i założyć własną kompanię handlową w Indiach."
 gbr_establish_first_indian_trade_post_at: "To wydarzenie pozwala nam ustanowić w Indiach @EIC §YKompanię Wschodnioindyjską§! jako poddaną typu §Yprzedsiębiorstwo handlowe§!."
 gbr_conquer_western_india_title: "[Root.GetPreviewColorGBR]Zajęcie zachodniego wybrzeża Indii[Root.GetPreviewColorGBR_end]"
 gbr_conquer_western_india_desc: "Bez wątpienia kontrola nad zachodnim wybrzeżem Indii zapewniłaby nam większy wpływ na cały subkontynent. Zajmijmy te ziemie w imię państwa [Root.GetName]."
 GBR_INDIAN_COASTLINE_CONTROL: "Kontrola wybrzeża Indii"
 gbr_english_superiority_title: "[Root.GetPreviewColorGBR][Root.GetAdjective] triumf[Root.GetPreviewColorGBR_end]"
 gbr_english_superiority_desc: "Mamy wielu potężnych rywali, którzy są jednak również aroganccy. Uważają, że mogą konkurować z nami na morzu, kwestionować nasze roszczenia do obcych ziem i zagrażać naszym interesom.\nMusimy pokazać im, jak bardzo się mylą."
 gbr_the_royal_charter_title: "[Root.GetPreviewColorGBR]Wydanie królewskiego przywileju[Root.GetPreviewColorGBR_end]"
 gbr_the_royal_charter_desc: "Królewskie patenty nadawane są kupcom dostarczającym towary najwyższej jakości na dwór i członkom rodziny królewskiej. Powinniśmy rozważnie wybierać partnerów handlowych i przyznawać im takie przywileje w zamian za korzystne warunki wymiany."
 unlock_privilege_estate_burghers_autonomous_trade_companies_tt: "\nOdblokowuje przywilej mieszczaństwa „§YAutonomiczne kompanie handlowe§!”."
 gbr_the_mediterranean_isles_title: "[Root.GetPreviewColorGBR]Dominacja na Morzu Śródziemnym[Root.GetPreviewColorGBR_end]"
 gbr_the_mediterranean_isles_desc: "Początkowo traktowaliśmy nasze posiadłości na Morzu Śródziemnym jako narzędzie strategiczne w wojnach z sąsiadami. Z czasem stało się jednak jasne, że możemy również kontrolować przepływ handlu w całym regionie. Powinniśmy jeszcze bardziej umocnić tę pozycję."
 gbr_the_mediterranean_isles_tt: "Państwo §Y[Root.GetName]§! otrzymuje trwałe roszczenia do każdej §Ywyspy§! na §YMorzu Śródziemnym§!."
 gbr_colonize_caribbeans_title: "[Root.GetPreviewColorGBR]Kolonizacja Karaibów[Root.GetPreviewColorGBR_end]"
 gbr_colonize_caribbeans_desc: "Wyspy Karaibów oferują lukratywne możliwości pewnym typom dżentelmenów, którzy mają dość determinacji, by je zdobyć, i siły roboczej, by je eksploatować. A takich dżentelmenów nam nie brakuje."
 gbr_discover_india_title: "[Root.GetPreviewColorGBR]Odkrycie Indii[Root.GetPreviewColorGBR_end]"
 gbr_discover_india_desc: "Handel z Indiami trwa od niepamiętnych czasów, lecz z powodu długich szlaków handlowych zyski czerpią z niego inni. Musimy wyposażyć ekspedycję i odnaleźć morską drogę do Indii."
 gbr_discover_india_at: "Państwo §Y[Root.GetName]§! otrzymuje do §Y5§! rdzeni terytorialnych w odkrytych przez siebie nadbrzeżnych prowincjach §YIndii§!."
 gbr_colonize_the_spice_isles_title: "[Root.GetPreviewColorGBR]Kolonizacja Wysp Korzennych[Root.GetPreviewColorGBR_end]"
 gbr_colonize_the_spice_isles_desc: "W najdalszych zakątkach świata można znaleźć niezwykłe przyprawy, tkaniny i egzotyczne kobiety. Powinniśmy zaznaczyć tu swoją obecność dla dobra społeczeństwa [Root.GetAdjective]."
 gbr_conquer_inland_india_title: "[Root.GetPreviewColorGBR]Ekspansja w głąb Indii[Root.GetPreviewColorGBR_end]"
 gbr_conquer_inland_india_desc: "Śródlądowe ziemie Indii słyną z dochodowych kopalń i rzadkich klejnotów. Nie trzeba dodawać, że ich rdzenni mieszkańcy z pewnością zyskaliby na objęciu ich naszą administracją."
 gbr_conquer_inland_india_at: "Do §Y10§! posiadanych prowincji w §YIndiach§! otrzymuje następujący efekt:"
 gbr_masters_of_india_title: "[Root.GetPreviewColorGBR]Władcy Indii[Root.GetPreviewColorGBR_end]"
 gbr_masters_of_india_desc: "Subkontynent indyjski ugina się przed potęgą państwa [Root.GovernmentName] [Root.GetAdjective]. Zbierzmy owoce podboju Indii dla chwały państwa [Root.GetUsableName]!"
 gbr_masters_of_india_at: "§YPrzedsiębiorstwa handlowe§! i §Yprotektoraty§! otrzymują §G+15,0%§! modyfikatora produkowanych dóbr.\n§YPrzedsiębiorstwa handlowe§! zapewniają teraz zwierzchnikowi §G-75,0%§! kary do handlu poza głównym węzłem handlowym oraz §G+5,0%§! wydajności handlu."
 gbr_ave_the_royal_court_title: "Dwór królewski"
 gbr_ave_the_royal_court_desc: "[Root.Monarch.GetTitle] nie może obyć się bez swoich doradców. Niezależnie od tego, jak potoczą się losy państwa [Root.GetUsableName], zawsze będziemy potrzebować kompetentnych konsultantów."
 gbr_allies_on_the_mainland_title: "[Root.GetPreviewColorGBR]Sojusze na kontynencie[Root.GetPreviewColorGBR_end]"
 gbr_allies_on_the_mainland_desc: "Choć nasze priorytety leżą za morzem, nie powinniśmy zapominać o zagrożeniach, jakie może stwarzać nasz rodzimy kontynent, jeśli pozostawimy go bez nadzoru. Powinniśmy zawrzeć sojusze z wrogami naszych wrogów."
 gbr_allies_on_the_mainland_tt: "- Ma stolicę na kontynencie §Y[Root.Capital.GetContinentName]§!\n      - Opinia o państwie §Y[Root.GetName]§! wynosi co najmniej §Y150§!.\n      - Jest państwem §Y[POR.GetName]§! lub ma co najmniej §Y200§! rozwoju całkowitego."
 gbr_take_over_the_lowlands_title: "[Root.GetPreviewColorGBR]Zdobycie wpływów w Niderlandach[Root.GetPreviewColorGBR_end]"
 gbr_take_over_the_lowlands_desc: "Holendrzy i Flamandowie z Niderlandów są pod wieloma względami podobni do nas: dążą do bogactwa dzięki dochodowemu handlowi, utrzymują imponującą flotę i sprzeciwiają się dominacji Francji oraz Hiszpanii. Przeciągnięcie Niderlandów na naszą stronę może zapewnić nam bezcennego sojusznika lub poddanego w tym regionie."
 gbr_take_over_the_lowlands_at: "Jeśli ukończymy tę misję, mając sojusznika w §YNiderlandach§!, który spełnia następujące warunki:"
 gbr_take_over_the_lowlands_ct: "§YSojusznik§! i państwo §Y[Root.GetName]§! stają się §Yhistorycznymi przyjaciółmi§!."
 gbr_trade_dominance_in_europe_title: "[Root.GetPreviewColorGBR]Handel europejski[Root.GetPreviewColorGBR_end]"
 gbr_trade_dominance_in_europe_desc: "Choć wiele towarów z Nowego Świata trafia do naszego węzła handlowego, nie jest on bynajmniej jedynym miejscem w Europie, w którym można osiągnąć znaczne zyski. Rozszerzenie naszych wpływów na kontynencie zapewni nam dominację w europejskim handlu."
 gbr_trade_dominance_in_europe_at: " węzłach handlowych w §YEuropie§!:\n    Państwo §Y[Root.GetName]§! posiada co najmniej §Y30%§! siły handlowej.\n    Państwo §Y[Root.GetName]§! ma największą siłę handlową."
 gbr_sail_around_africa_title: "[Root.GetPreviewColorGBR]Opłynięcie Afryki[Root.GetPreviewColorGBR_end]"
 gbr_sail_around_africa_desc: "Jakie cuda czekają na nas za Przylądkiem Dobrej Nadziei?"
 gbr_sail_around_africa_ct: "Opłynięto Afrykę"
 gbr_seize_the_cape_title: "[Root.GetPreviewColorGBR]Zajęcie Przylądka[Root.GetPreviewColorGBR_end]"
 gbr_seize_the_cape_desc: "Przylądek Dobrej Nadziei jest kluczowym punktem na szlaku do Indii Wschodnich. Kto kontroluje przylądek, ten bez wątpienia kontroluje również azjatyckie ambicje pozostałych wielkich mocarstw.\nPrzylądek musi należeć do nas!"
 gbr_chart_the_southern_sea_title: "[Root.GetPreviewColorGBR]Kartografowanie mórz południowych[Root.GetPreviewColorGBR_end]"
 gbr_chart_the_southern_sea_desc: "Śmiałkowie o prawdziwie brytyjskim hartcie ducha zabiegają o wsparcie rządu, by sporządzić mapy rozległych, nieznanych obszarów południowych oceanów. Plotki głoszą, że znajdują się tam ziemie czekające na zdobycie. Powinniśmy się pospieszyć i założyć dobrze prosperującą kolonię, zanim inni wykorzystają tę okazję."
 gbr_colonize_australia_title: "[Root.GetPreviewColorGBR]Osadnictwo w Australii[Root.GetPreviewColorGBR_end]"
 gbr_colonize_australia_desc: "Nasze wyprawy odkryły istnienie wyspy o niewyobrażalnych rozmiarach. Choć nie jest to południowy kontynent, którego szukaliśmy, ziemia ta powinna stać się częścią państwa [Root.GetName]."
 gbr_conquer_eastern_india_title: "[Root.GetPreviewColorGBR]Podbój Bengalu[Root.GetPreviewColorGBR_end]"
 gbr_conquer_eastern_india_desc: "Kompania Wschodnioindyjska państwa [Root.GetName] od pewnego czasu prowadzi działalność w tym regionie. Na jej prośbę i zgodnie z jej wskazówkami nadszedł czas, by umocnić naszą kontrolę nad żyzną deltą Gangesu."
 gbr_ave_monopolize_the_channel_title: "Monopol w Kanale La Manche"
 gbr_ave_monopolize_the_channel_desc: "Teraz, gdy wyraźnie ugruntowaliśmy naszą dominację kolonialną, z kolonii zaczęły napływać cenne towary. Wszystko, co przepływa przez Kanał La Manche, słusznie należy do nas. Musimy chronić nasze inwestycje zarówno za granicą, jak i w kraju."
 gbr_ave_center_of_worlds_trade_title: "Światowe centra handlu"
 gbr_ave_center_of_worlds_trade_desc: "Wszędzie, dokąd sięgniemy wzrokiem, powinien kwitnąć handel przynoszący niewyobrażalne bogactwa. Nasze targowiska staną się centrami światowego handlu."
 gbr_a_house_divided_title: "Podzielony parlament"
 gbr_a_house_divided_desc: "Wielki parlament składa się z dwóch izb: Izby Gmin, będącej głosem podatników, zwykłych ludzi i mieszczan, oraz Izby Lordów, reprezentującej szlachtę i duchowieństwo.\nMusimy zadbać o lojalność obu izb."
 gbr_ave_early_industry_title: "Początki przemysłu"
 gbr_ave_early_industry_desc: "Wraz z rozwojem naszych rozległych zakładów przemysłowych rośnie zapotrzebowanie na paliwo, a wokół państwa [Root.GetName] powstaje przemysł zmechanizowany. Musimy zwiększyć dostawy przetworzonych surowców."
 gbr_ave_renovate_universities_title: "Odnowa Oksfordu i Cambridge"
 gbr_ave_renovate_universities_desc: "Obiekty wielowiekowych uniwersytetów w Oksfordzie i Cambridge zaczynają nie spełniać swoich zadań. Niewielkie inwestycje powinny znacząco poprawić sytuację."
 ave_conquer_lowlands_at: "Ma stolicę w §YNiderlandach§!, kulturę podstawową §Yholenderską§!, §Yflamandzką§!, §Ywalońską§! lub §Yfryzyjską§! oraz posiada co najmniej §Y15§! prowincji w regionie §YNiderlandy§!."
 gbr_ave_the_great_empire_title: "Imperium [Root.GetAdjective]"
 gbr_ave_the_great_empire_desc: "Imperium [Root.GetAdjective] rozciąga się od wschodu na zachód; niewiele państw może dorównać naszej wytrwałości. Niemniej jednak wciąż istnieje ziemia, która jeszcze nie należy do nas..."
 gbr_ave_english_renaissance_title: "[Root.GetAdjective] renesans"
 gbr_ave_english_renaissance_desc: "Państwo, armia, handel i dyplomacja podlegają zmianom i ewolucji — kultura nie jest tu wyjątkiem. Powinniśmy przyjąć i propagować idee renesansu."
 gbr_ave_create_standing_army_title: "Utworzenie stałej armii"
 gbr_ave_create_standing_army_desc: "Choć parlament patrzy na ten pomysł z podejrzliwością i obawą, ostatnie wojny oraz groźba wojny domowej pokazały, że potrzebujemy stałej armii pod dowództwem [Root.Monarch.GetTitle]. Nie możemy pozostawić państwa [Root.GetUsableName] bezbronnego na wypadek inwazji wroga."
 gbr_ave_the_redcoats_title: "Czerwone kurtki"
 gbr_ave_the_redcoats_desc: "W bitewnym chaosie żołnierze mogą szybko stracić orientację i przez pomyłkę otworzyć ogień do sojuszników oraz towarzyszy broni. Musimy za wszelką cenę unikać takich incydentów.\nWprowadzenie jednolitego umundurowania, dzięki któremu nasi żołnierze będą dobrze widoczni, znacznie ograniczy liczbę takich pomyłek, a przy tym poprawi wygląd naszej armii."
 gbr_ave_the_royal_marines_title: "Królewska Piechota Morska"
 gbr_ave_the_royal_marines_desc: "Morskie położenie naszego państwa wymaga odpowiedniego dostosowania sił zbrojnych. Musimy utworzyć Królewską Piechotę Morską, która będzie chronić zamorskie interesy państwa [Root.GetUsableName]."
 gbr_ave_the_men_of_war_title: "Rozbudowa Królewskiej Marynarki Wojennej"
 gbr_ave_the_men_of_war_desc: "Nasze przetrwanie zależy od zdolności do projekcji siły na morzu. Musimy przygotować państwo do budowy i rozbudowy Królewskiej Marynarki Wojennej."
 ave_eliminate_the_french_minors_title: "[Root.GetPreviewColorGBR]Podporządkowanie książąt[Root.GetPreviewColorGBR_end]"
 ave_eliminate_the_french_minors_desc: "Choć tron Francji znajduje się teraz w [Root.Capital.GetName], region francuski pozostaje zdecentralizowany i podzielony. Niezależne księstwa Prowansji i Bretanii muszą ugiąć kolana przed państwem [Root.GetUsableName]."
 ave_eliminate_the_french_minors_at: "Jeśli ukończymy tę misję, gdy §YFrancja§! jest naszym poddanym:"
 ave_eliminate_the_french_minors_ct: "Musi być spełniony jeden z poniższych warunków:\n    Jest poddanym państwa §Y[Root.GetName]§! lub jego poddanych\n    Nie posiada żadnej prowincji w regionie §YFrancja§!"
 ave_conquer_iberia_title: "[Root.GetPreviewColorGBR]Królestwa Hiszpanii[Root.GetPreviewColorGBR_end]"
 ave_conquer_iberia_desc: "Półwysep Iberyjski jest siedzibą potężnych królestw Aragonii, Kastylii i Portugalii. Każde z nich zagraża naszym interesom we Francji oraz po drugiej stronie rozległego Oceanu Atlantyckiego. Musimy uderzyć pierwsi, zanim Iberyjczycy przypuszczą atak na nas."
 ave_angevin_iberia_title: "[Root.GetPreviewColorGBR]Andegaweńska Iberia[Root.GetPreviewColorGBR_end]"
 ave_angevin_iberia_desc: "Królestwa iberyjskie uległy naszej potędze, lecz ich mieszkańcy nie chcą podporządkować się koronie andegaweńskiej. Oficjalnie przejmiemy koronę hiszpańską i okażemy Iberyjczykom łaskawość, inwestując w ich słabo rozwinięte ziemie."
 ave_promote_angevin_culture_title: "[Root.GetPreviewColorGBR]Kultura andegaweńska[Root.GetPreviewColorGBR_end]"
 ave_promote_angevin_culture_desc: "Wojna stuletnia pogłębiła przepaść między naszą kulturą a kulturą Francji, naszej ojczyzny. Te rany muszą się zagoić, jeśli Imperium Andegaweńskie ma przetrwać próbę czasu."
 ave_promote_angevin_culture_at: "Zatrudniono doradcę kultury §Ybrytyjskiej§! oraz doradcę kultury §Yfrankońskiej§!."
 ave_promote_angevin_culture_bt: "Grupa kulturowa §Ybrytyjska§! zostaje przekształcona w kulturę §Yanglois§! z grupy kulturowej §Yfrancuskiej§!."
 ave_take_the_french_throne_title: "[Root.GetPreviewColorGBR]Zajęcie tronu Francji[Root.GetPreviewColorGBR_end]"
 ave_take_the_french_throne_desc: "Od 1337 roku Anglicy i Francuzi nieustannie walczą o dominację nad francuskim tronem. Sto lat bitew, spustoszenia, śmierci i zniszczenia — ten rozlew krwi może zakończyć się tylko w jeden sposób: całkowitym zwycięstwem nad Francuzami!"
 ave_shatter_frances_nobility_title: "[Root.GetPreviewColorGBR]Złamanie potęgi francuskiej szlachty[Root.GetPreviewColorGBR_end]"
 ave_shatter_frances_nobility_desc: "Wreszcie Francja uznała porażkę i zaakceptowała [Root.Monarch.GetTitle] państwa [Root.GetUsableName] jako jedynego prawowitego suwerena. Podczas gdy francuscy mieszczanie klękają przed swoim prawdziwym [Root.Monarch.GetTitle], francuska szlachta odmawia uznania naszej władzy. Mamy już wystarczająco dużo problemów z angielską szlachtą, dlatego musimy szybko rozprawić się również z francuskimi możnowładcami."
 ave_the_angevin_empire_title: "[Root.GetPreviewColorGBR]Królestwo Andegaweńskie[Root.GetPreviewColorGBR_end]"
 ave_the_angevin_empire_desc: "Królowie andegaweńscy władali niegdyś połową ziem francuskich, zapewniając powszechny dobrobyt i sprawiedliwość. Po naszym zwycięstwie w walce o francuski tron mamy pełne prawo ponownie przywrócić tytuł andegaweński."
 ave_the_angevin_empire_at: "Należy do państwa §Y[Root.GetName]§! lub jego poddanych (bądź poddanych jego poddanych)."
 ave_invade_italy_title: "[Root.GetPreviewColorGBR]Zabezpieczenie przełęczy alpejskich[Root.GetPreviewColorGBR_end]"
 ave_invade_italy_desc: "Po zjednoczeniu regionu francuskiego przełęcze alpejskie stały się naszą nową południowo-wschodnią granicą. Włosi kontrolują te przejścia i mogą z łatwością odciąć nas od bogactw włoskiego handlu. Musimy zabezpieczyć przełęcze i nie dopuścić, by którykolwiek z książąt lub dożów nadmiernie urósł w siłę."
 ave_italian_domination_title: "[Root.GetPreviewColorGBR]Dominacja we Włoszech[Root.GetPreviewColorGBR_end]"
 ave_italian_domination_desc: "Liczne włoskie rody, a także sam papież, spierają się o dominację na Półwyspie Apenińskim. Żaden z tych głupców nie zdaje sobie sprawy, że ich ukochany but znajduje się w andegaweńskiej strefie wpływów. Powinniśmy uprzejmie przypomnieć im, jakie jest ich miejsce."
 ave_dominate_europe_title: "[Root.GetPreviewColorGBR]Dominacja w Europie[Root.GetPreviewColorGBR_end]"
 ave_dominate_europe_desc: "Niegdyś niewielkie królestwo na Wyspach Brytyjskich, nasze państwo [Root.GovernmentName] stało się jedną z najbardziej prestiżowych i wpływowych potęg Europy Zachodniej. Francja należy do nas, a monarchowie iberyjscy klękają przed nami. Nawet papież i cesarz nie mają już władzy, by nam się przeciwstawić.\nOd dziś, od tej chwili, cały kontynent europejski należy do nas!"
 ave_a_kingdom_of_chivalry_title: "[Root.GetPreviewColorGBR]Królestwo rycerskości[Root.GetPreviewColorGBR_end]"
 ave_a_kingdom_of_chivalry_desc: "Wojna stuletnia była jednym z ostatnich konfliktów w Europie, podczas których rycerze wykazywali się prawdziwą rycerskością i honorem w walce. Z biegiem czasu ideały rycerskie niemal całkowicie zanikły.\nTak by się stało, gdyby nie my. Musimy pozostać wierni tym zasadom i przywrócić je na naszym dworze oraz w armii."
 ave_claim_the_empire_title_title: "[Root.GetPreviewColorGBR]Przyjęcie tytułu cesarskiego[Root.GetPreviewColorGBR_end]"
 ave_claim_the_empire_title_desc: "Królestwo Andegaweńskie, które początkowo było jedynie królestwem rywalizującym o władzę z Francją, stało się czymś znacznie większym. W naszych rękach znajdują się całe Francja i Anglia, dlatego zwykły tytuł „króla” nie oddaje już naszej chwały.\nPrzyjmiemy tytuł „cesarza” Imperium Andegaweńskiego!"
 ave_claim_the_empire_title_at: "To wydarzenie nada nam odpowiednią nazwę, która odzwierciedli naszą potęgę."
 ave_claim_the_empire_title_bt: "Nazwa naszego państwa będzie odtąd dynamicznie dostosowywać się do jego ustroju i rangi."
 ave_discover_the_americas_title: "[Root.GetPreviewColorGBR]Odkrycie Ameryk[Root.GetPreviewColorGBR_end]"
 ave_discover_the_americas_desc: "Ciche pogłoski opowiadają o tajemniczych krainach na dalekim zachodzie, które są pełne niewyobrażalnych cudów. Jeśli to prawda, muszą być nasze."
 ave_eliminate_burgundy_title: "[Root.GetPreviewColorGBR]Zajęcie Burgundii[Root.GetPreviewColorGBR_end]"
 ave_eliminate_burgundy_desc: "Nastały ciężkie czasy dla ostatnich pozostałości Księstwa Burgundii znalazły się w trudnych czasach. Nie zapomnieliśmy, kiedy odwrócili się od nas po traktacie z Arras. Zapłacą za to."
 ave_deal_with_the_hre_title: "[Root.GetPreviewColorGBR]Spór ze Świętym Cesarstwem Rzymskim[Root.GetPreviewColorGBR_end]"
 ave_deal_with_the_hre_desc: "Święte Cesarstwo Rzymskie jest świadectwem dawnej potęgi imperium, którego władza została dziś rozdzielona między elektorów i książąt. Ponieważ nasze ambicje sięgają całej Europy, konflikt między państwem [Root.GovernmentName] Andegawenów a Świętym Cesarstwem Rzymskim jest nieunikniony."
 ave_deal_with_the_hre_at: "Jeśli ukończymy tę misję, gdy co najmniej §Y3§! elektorów będzie naszymi poddanymi lub będzie nas popierać w wyborach cesarskich:"
 ave_deal_with_the_hre_bt: "Jeśli ukończymy tę misję, posiadając lub mając poddanego posiadającego co najmniej §Y10§! prowincji w §YNiemczech§!:"
 ave_deal_with_the_hre_ct: "Każde znane państwo w §YŚwiętym Cesarstwie Rzymskim§! traci §G5§! punktów opinii z tytułu agresywnej ekspansji wobec państwa §Y[Root.GetName]§!."
 ave_double_emperorship_title: "[Root.GetPreviewColorGBR]Andegaweńscy królowie u szczytu potęgi[Root.GetPreviewColorGBR_end]"
 ave_double_emperorship_desc: "Nasze majątki rosną. Królowie kłaniają się przed naszym majestatem, a narody kłaniają się naszym wojskom. Do obalenia pozostał tylko jeden tron potężniejszy niż nasz."
 ave_double_emperorship_at: "Jeśli ukończymy tę misję, będąc cesarzem §YŚwiętego Cesarstwa Rzymskiego§!:"
 ave_kingdom_of_metropolises_title: "[Root.GetPreviewColorGBR]Królestwo metropolii[Root.GetPreviewColorGBR_end]"
 ave_kingdom_of_metropolises_desc: "Jako władcy rozległych ziem Anglii i Francji mamy obowiązek zapewnić stabilną infrastrukturę na terytorium obu koron."
 ave_kingdom_of_metropolises_at: "Każda posiadana prowincja o poziomie rozwoju co najmniej §Y20§! w regionach §YFrancja§! i §YWielka Brytania§! otrzymuje następujące efekty:"
 ave_the_angevin_age_title: "[Root.GetPreviewColorGBR]Epoka Andegawenów[Root.GetPreviewColorGBR_end]"
 ave_the_angevin_age_desc: "Nasze państwo [Root.GovernmentName] uważano za relikt średniowiecza — epoki, w której umysły ludzi spowijała ciemność. A jednak przetrwaliśmy. A jednak dominujemy.\nNadszedł czas nowej ery. Epoka Andegawenów poprowadzi kontynent ku świetlanej przyszłości!"
 ave_introduce_the_banking_act_title: "[Root.GetPreviewColorGBR]Wprowadzenie ustawy bankowej[Root.GetPreviewColorGBR_end]"
 ave_introduce_the_banking_act_desc: "Nasze ambicje są wielkie, a cele niebezpieczne. Każde przedsięwzięcie, którego chcemy się podjąć w Europie, wymaga silnego skarbca — silnego, znacjonalizowanego banku. Powinniśmy przygotować rząd i gospodarkę na wprowadzenie państwowego systemu bankowego."
 ave_colonize_america_title: "[Root.GetPreviewColorGBR]Osadnictwo w Ameryce[Root.GetPreviewColorGBR_end]"
 ave_colonize_america_desc: "Ziemie Ameryki mogą zostać wykorzystane bardzo wszechstronnie. Na północy słyszeliśmy o futrach i materiałach do budowy statków. Na południu ziemia wydaje się odpowiednia do uprawy wielu roślin. Musimy stworzyć tam bazy, abyśmy mogli czerpać zyski."
 ave_colonize_america_tt: "Państwo §Y[Root.GetName]§! lub jego poddani posiadają co najmniej §Y10§! w pełni skolonizowanych prowincji w §YNowym Świecie§!."
 ave_colonial_empire_title: "[Root.GetPreviewColorGBR]Imperium kolonialne[Root.GetPreviewColorGBR_end]"
 ave_colonial_empire_desc: "Pan wybrał nas, abyśmy nieśli reszcie świata oświecenie, postęp i chwałę. Naszym przeznaczeniem jest kolonizacja Nowego Świata w imię [Root.Monarch.GetTitle]!"
 ave_conquer_lowlands_title: "[Root.GetPreviewColorGBR]Zdobycie wpływów w Niderlandach[Root.GetPreviewColorGBR_end]"
 ave_conquer_lowlands_desc: "Holendrzy i Flamandowie z Niderlandów są pod wieloma względami podobni do nas: dążą do bogactwa dzięki dochodowemu handlowi, utrzymują imponującą flotę i sprzeciwiają się dominacji Francji oraz Hiszpanii. Przeciągnięcie Niderlandów na naszą stronę może zapewnić nam bezcennego sojusznika lub poddanego w tym regionie."
 ave_perfect_construct_barracks_title: "[Root.GetPreviewColorGBR]Rozbudowa armii[Root.GetPreviewColorGBR_end]"
 ave_perfect_construct_barracks_desc: "Wojna jest przedłużeniem dyplomacji. Niestety głupi monarchowie Europy rozumieją wyłącznie język przemocy, dlatego wojna jest jedyną formą dyplomacji, którą pojmują.\nMusimy zatem zadbać o silne i liczne siły zbrojne, aby móc prowadzić z nimi rozmowy z pozycji siły."
 ave_perfect_construct_barracks_at: "Do §Y5§! posiadanych prowincji, które mają §Yfort§! oraz jeden z budynków zwiększających §Yzasoby ludzkie§!, otrzymuje następujące efekty:"
 ave_combine_land_and_navy_title: "[Root.GetPreviewColorGBR]Zintegrowane siły zbrojne[Root.GetPreviewColorGBR_end]"
 ave_combine_land_and_navy_desc: "Armia królewska i marynarka wojenna są dwiema stronami tej samej monety. Aby ograniczyć biurokrację i zmaksymalizować możliwości szkolenia żołnierzy, powinniśmy połączyć oba rodzaje sił zbrojnych."
 flavor_gbr.23.b.tt: "@SPA §YHiszpania§! zostanie uwolniona jako państwo zależne, pozostające w unii personalnej z państwem §Y[Root.GetName]§!."
 flavor_gbr.24.b.tt: "@ITA §YWłochy§! zostaną uwolnione jako państwo zależne, pozostające w unii personalnej z państwem §Y[Root.GetName]§!."
 ENG_CLERGICAL_PRIVILEGES: "Przywileje duchowieństwa"
 flavor_gbr.104.b: "Nie powinniśmy posuwać się za daleko."
 flavor_gbr.105.b: "Duchowieństwo już wystarczająco ucierpiało."
 flavor_gbr.109.a.tt: "Dopóki ten modyfikator jest aktywny:\n§YOtrzymujemy modyfikator zależny od rodzaju i umiejętności doradcy:§!\n -§YFilozof§! i §Yprzyrodnik§!\n    - Tolerancja heretyków: §G+1,00§! za każdy poziom umiejętności\n -§YArtysta§!\n    - Tolerancja prawdziwej wiary: §G+1,00§! za każdy poziom umiejętności\n -§YSkarbnik§! i §YMistrz mennicy§!\n    - Jedność religijna: §G+15,0%§! za każdy poziom umiejętności\n -§YInkwizytor§! i §Yteolog§!\n    - Siła misjonarzy przeciwko heretykom: §G+1,0%§! za każdy poziom umiejętności"
 flavor_gbr.1.t: "Los państwa [Root.GetUsableName]"
 flavor_gbr.1.desc: "Stosunki między państwem [Root.GovernmentName] [Root.GetUsableName] a państwem [FRA.GovernmentName] [FRA.GetUsableName] zostały na zawsze naznaczone wojną stuletnią. W 1337 roku król Edward III zgłosił pretensje do francuskiego tronu i od tego czasu oba nasze państwa pozostają w nieustannym konflikcie.\nWojna zbliża się ku ostatecznemu rozstrzygnięciu i staje się jasne, że nasz los zależy od stanowiska, jakie zajmiemy wobec Europy kontynentalnej."
 flavor_gbr.1.a: "Kontynent przestał nas interesować."
 flavor_gbr.1.a.tt: "Zachowujemy @GBR §Ybrytyjskie§! misje."
 flavor_gbr.1.b: "Nie możemy porzucić naszych andegaweńskich roszczeń."
 flavor_gbr.1.b.tt: "Zastępuje @GBR §Ybrytyjskie§! misje misjami @AVE §Yandegaweńskimi§!.\nMisje §Yandegaweńskie§! koncentrują się na §Ydominacji w Europie§! zamiast na kolonizacji Nowego Świata i Azji.\n§RNie będziemy mogli utworzyć państwa §YWielka Brytania§!.§!"
 flavor_gbr.2.t: "Zakup prowincji [369.GetName]"
 flavor_gbr.2.desc: "Po podporządkowaniu Szkocji północna część Wysp Brytyjskich znalazła się pod panowaniem państwa [Root.GetAdjective]. Nadal jednak wymykają się nam północne wyspy [369.GetName], [1978.GetName] i [1979.GetName]. Dwie ostatnie mają niewielkie znaczenie, lecz wyspa [369.GetName] musi zostać włączona do naszego państwa.\nByć może udałoby się kupić ją od państwa [369.Owner.GetName]."
 flavor_gbr.2.a: "Kupmy [369.GetName]."
 flavor_gbr.2.a.tt: "Państwo §Y[Root.GetName]§! zaoferuje §Y200§! ¤ państwu §Y[369.Owner.GetName]§! w zamian za prowincję §Y[369.GetName]§!.\n§YGotowość do sprzedaży prowincji zależy od stosunków między państwami [Root.GetName] i [369.Owner.GetName].§!"
 flavor_gbr.2.b: "Nie stać nas teraz na taki wydatek."
 flavor_gbr.2.b.tt: "Odblokowuje decyzję pozwalającą zaoferować państwu §Y[369.Owner.GetName]§! zakup prowincji §Y[369.GetName]§!."
 flavor_gbr.3.t: "Oferta zakupu prowincji [369.GetName]"
 flavor_gbr.3.desc: "Ambasador państwa [From.GetName] przybył na nasz dwór. Przedstawił ofertę korony [From.GetAdjective]: 200 dukatów w zamian za własność prowincji [369.GetName]."
 flavor_gbr.3.a: "Przyjmijmy ofertę."
 flavor_gbr.3.b: "Odprawmy ambasadora."
 flavor_gbr.4.t: "Państwo [369.Owner.GetName] przyjmuje ofertę"
 flavor_gbr.4.desc: "Nasz ambasador powrócił z dworu państwa [369.Owner.GetName]. Donosi, że [369.Owner.Monarch.GetTitle] państwa [369.Owner.GetAdjective] zaakceptował naszą ofertę."
 flavor_gbr.4.a: "Doskonale!"
 flavor_gbr.5.t: "Państwo [369.Owner.GetName] odrzuca ofertę"
 flavor_gbr.5.desc: "Nasz ambasador powrócił z dworu państwa [369.Owner.GetName]. Donosi, że [369.Owner.Monarch.GetTitle] państwa [369.Owner.GetAdjective] odrzucił naszą ofertę."
 flavor_gbr.5.a: "Ich strata."
 flavor_gbr.6.t: "Królestwo Irlandii"
 flavor_gbr.6.desc: "W 1155 roku Henryk II, król Anglii, otrzymał od papieża bullę nadającą mu tytuł „Pana Irlandii”. Od tego czasu państwo [Root.GetUsableNameCap] rości sobie prawa monarsze do Irlandii.\nZ biegiem lat Irlandia stała się częścią państwa [Root.GetUsableName], a nasz tytuł pana tej wyspy stracił na znaczeniu z powodu stosunków między państwem [Root.GetAdjective] a papiestwem. [Root.GetParliamentOrFallbackName] i [Root.Monarch.GetTitle] rozważają teraz kwestie związane z naszymi roszczeniami.\nUstanowienie „Królestwa Irlandii” z pewnością podniosłoby prestiż [Root.Monarch.GetName]. Pozostaje jednak pytanie, czy Irlandią należy rządzić w ramach unii personalnej."
 flavor_gbr.6.a: "Irlandia powinna pozostać pod naszym bezpośrednim panowaniem."
 flavor_gbr.6.b: "Irlandią należy rządzić w ramach unii personalnej."
 flavor_gbr.6.b.tt: "@IRE§YIrlandia§! zostanie uwolniona jako państwo zależne, pozostające w unii personalnej z państwem §Y[Root.GetName]§!."
 flavor_gbr.7.t: "Północnoamerykański handel futrami"
 flavor_gbr.7.desc: "Rdzenni mieszkańcy Ameryki Północnej od zawsze handlowali futrami zwierząt, a Europejczycy kolonizujący Amerykę zaczęli uczestniczyć w tym handlu już od początku swojego przybycia. Osadnicy państwa [Root.GetAdjective] wcześnie założyli faktorie handlowe, które stały się jednym z głównych przedsięwzięć gospodarczych Ameryki Północnej. Nasi kupcy i koloniści czerpią zyski z tego handlu."
 flavor_gbr.7.a: "Doskonale!"
 FUR_TRADE: "Handel futrami"
 flavor_gbr.10.a: "Pozwólmy kompanii przejąć kontrolę nad naszymi sprawami w Indiach"
 flavor_gbr.10.a.tt: "Państwo §Y[Root.GetName]§! uwalnia §YKompanię Wschodnioindyjską§! w §YIndiach§!.\n§YKompania Wschodnioindyjska§! staje się poddanym państwa §Y[Root.GetName]§! typu §Yprzedsiębiorstwo handlowe§!."
 flavor_gbr.10.b: "Możemy sami zarządzać Indiami"
 flavor_gbr.10.c: "Zobaczymy, jak poradzi sobie ta kompania..."
 flavor_gbr.12.t: "Teatr Globe"
 flavor_gbr.12.desc: "Teatr i sztuka zyskują coraz większą popularność wśród naszego ludu, a mieszkańcy miast mogą korzystać z różnorodnych rozrywek. Jako mecenasi i propagatorzy sztuki z dumą otwieramy nowy teatr w samym centrum [Root.Capital.GetCapitalName]. Jest on w rzeczywistości odbudową wcześniejszego obiektu, zwanego po prostu „The Theatre”, który był pierwszym stałym teatrem w całej Anglii. Jego belki przeniesiono na nowe miejsce i wykorzystano do budowy nowego, większego i wspanialszego gmachu.\n\nDzięki nowemu teatrowi nasi mieszkańcy będą mogli oglądać znacznie więcej sztuk, w tym dzieła cenionego Williama Shakespeare'a. Zainteresowanie przedstawieniami wyraził nawet [Root.Monarch.GetTitle] [Root.Monarch.GetName]."
 flavor_gbr.12.a: "Cały świat jest sceną, ale ta najważniejsza znajduje się w [Root.Capital.GetCapitalName]."
 flavor_gbr.13.t: "Królewskie Towarzystwo [Root.Capital.GetCapitalName]"
 flavor_gbr.13.desc: "Jesteśmy ostoją wiedzy i nauki. Uczeni z całego kraju, a nawet z zagranicy, gromadzą się na ulicach i w kolegiach [Root.Capital.GetCapitalName], by dyskutować o najnowszych osiągnięciach. Zaczęli organizować się w grupy, które prowadzą wspólne spotkania i dyskusje. Jedna z takich grup zwróciła uwagę [Root.Monarch.GetTitle] [Root.Monarch.GetName]. [Root.Monarch.GetSheHe] wyraził [Root.Monarch.GetHerHis] aprobatę, oficjalnie obejmując ją patronatem. Od tej pory będzie znana jako Królewskie Towarzystwo [Root.Capital.GetCapitalName].\n\nJego celem będzie wspieranie i rozwijanie nauki, eksperymentów oraz odkryć. Dzięki niemu nasz kraj z pewnością stanie się wzorem postępu. W jego murach będą bywać najtęższe umysły naszego narodu, a nawet całego świata."
 flavor_gbr.13.a: "Ostoja światła!"
 appointment_of_state_minister_tt: "Wybrany przez nas §Ydoradca§! dołącza do dworu."
 appointment_of_state_minister_at: "§YIch koszt jest niższy o §G50,0%§!.§!"
 flavor_gbr.15.t: "Powołanie ministra państwowego"
 flavor_gbr.15.desc: "[Root.GetParliamentOrFallbackName] podjął decyzję. Nowy minister dołączy do dworu, aby wspierać [Root.Monarch.GetTitle] w licznych sprawach państwowych. Zanim zostanie powołany, [Root.Monarch.GetTitle] musi zdecydować, jakie stanowisko obejmie nowy doradca."
 flavor_gbr.15.a: "Nasza administracja potrzebuje biurokraty."
 flavor_gbr.15.a.tt: "Wybierzemy jednego §Ydoradcę administracyjnego§! na dwór państwa [Root.GetName]."
 flavor_gbr.15.b: "Potrzebujemy kogoś o zdolnościach dyplomatycznych."
 flavor_gbr.15.b.tt: "Wybierzemy jednego §Ydoradcę dyplomatycznego§! na dwór państwa [Root.GetName]."
 flavor_gbr.15.c: "Nasza armia potrzebuje utalentowanego dowódcy."
 flavor_gbr.15.c.tt: "Wybierzemy jednego §Ydoradcę wojskowego§! na dwór państwa [Root.GetName]."
 flavor_gbr.16.t: "Powołanie ministra państwowego"
 flavor_gbr.16.desc.adm: "Postanowiliśmy obsadzić administracyjne stanowisko na dworze nowym ministrem. Jest kilku kandydatów, którzy mogliby objąć tę funkcję. To od [Root.Monarch.GetTitle] zależy, jakiego doradcy [Root.Monarch.GetSheHe] potrzebuje."
 flavor_gbr.16.desc.dip: "Postanowiliśmy obsadzić dyplomatyczne stanowisko na dworze nowym ministrem. Jest kilku kandydatów, którzy mogliby objąć tę funkcję. To od [Root.Monarch.GetTitle] zależy, jakiego doradcy [Root.Monarch.GetSheHe] potrzebuje."
 flavor_gbr.16.desc.mil: "Postanowiliśmy obsadzić wojskowe stanowisko na dworze nowym ministrem. Jest kilku kandydatów, którzy mogliby objąć tę funkcję. To od [Root.Monarch.GetTitle] zależy, jakiego doradcy [Root.Monarch.GetSheHe] potrzebuje."
 flavor_gbr.16.desc.zzz: "Uznaliśmy, że nasz ustrój [Root.GovernmentName] jest już wystarczająco dobry. Po co mielibyśmy w ogóle powoływać ministra?"
 flavor_gbr.16.zzz: "[Root.Monarch.GetTitle] ma wystarczające umiejętności, by samodzielnie — [Root.Monarch.GetHerselfHimself] — pełnić każdą funkcję."
 flavor_gbr.16.a: "Zatrudnijmy artystę."
 flavor_gbr.16.b: "Zatrudnijmy inkwizytora."
 flavor_gbr.16.c: "Zatrudnijmy mistrza mennicy."
 flavor_gbr.16.d: "Zatrudnijmy przyrodnika."
 flavor_gbr.16.e: "Zatrudnijmy teologa."
 flavor_gbr.16.f: "Zatrudnijmy skarbnika."
 flavor_gbr.16.g: "Zatrudnijmy filozofa."
 flavor_gbr.16.h: "Zatrudnijmy dyplomatę."
 flavor_gbr.16.i: "Zatrudnijmy gubernatora kolonialnego."
 flavor_gbr.16.j: "Zatrudnijmy reformatora marynarki wojennej."
 flavor_gbr.16.k: "Zatrudnijmy nawigatora."
 flavor_gbr.16.l: "Zatrudnijmy szefa siatki szpiegowskiej."
 flavor_gbr.16.m: "Zatrudnijmy męża stanu."
 flavor_gbr.16.n: "Zatrudnijmy kupca."
 flavor_gbr.16.o: "Zatrudnijmy organizatora armii."
 flavor_gbr.16.p: "Zatrudnijmy reformatora armii."
 flavor_gbr.16.q: "Zatrudnijmy komendanta."
 flavor_gbr.16.r: "Zatrudnijmy wielkiego kapitana."
 flavor_gbr.16.s: "Zatrudnijmy głównego rekrutera."
 flavor_gbr.16.u: "Zatrudnijmy inżyniera wojskowego."
 flavor_gbr.16.v: "Zatrudnijmy kwatermistrza."
 flavor_gbr.20.t: "Państwo andegaweńskie"
 flavor_gbr.20.desc: "Ponieważ nasza sytuacja polityczna uległa zmianie, należy dostosować oficjalną nazwę państwa, aby odzwierciedlała jego obecny status."
 flavor_gbr.20.a: "Niech żyje imperium!"
 flavor_gbr.20.b: "Królestwo za konia."
 flavor_gbr.20.c: "Ach, cóż za niedola..."
 flavor_gbr.20.d: "Republika, która przetrwa próbę czasu!"
 flavor_gbr.20.e: "Niech Pan okaże miłosierdzie, skoro nasze państwo go nie okazuje."
 flavor_gbr.20.f: "Nie potrzebujemy żadnych „korekt” nazwy naszego państwa."
 flavor_gbr.21.t: "Proklamacja Świętego Imperium Światowego"
 flavor_gbr.21.desc: "Państwo [Root.GetUsableNameCap] — przywódca Świętego Cesarstwa Rzymskiego, zdobywca Nowego Świata, władca Europy, Afryki i Azji. Nie jesteśmy już małym królestwem, lecz światowym imperium o potędze niepojętej dla każdego żałosnego państwa, które uważa się za naszego rywala. [Root.Monarch.GetTitle] [Root.Monarch.GetName] ogłosił połączenie licznych tytułów w jeden, zjednoczony urząd: Koronę Świętego Imperium Brytanii!\nOd tej chwili cały świat będzie podlegał imperium, którego jedynym władcą będzie [Root.GetEmpressEmperor] [Root.Monarch.GetName]."
 flavor_gbr.21.a: "Niech żyje Brytania!"
 flavor_gbr.22.t: "Epoka Andegawenów"
 flavor_gbr.22.desc: "Sąsiedzi początkowo uważali państwo [Root.GetUsableNameCap] za relikt minionej epoki, kaprys angielskich królów próbujących przełamać wielowiekowy impas w rywalizacji z władcami Francji. Nieustanne wysiłki na rzecz rozszerzania dominacji i umacniania autorytetu rodzącego się imperium przyniosły jednak powszechne uznanie dla wielkich sukcesów [Root.GetAdjective] [Root.Monarch.GetTitle]. Oto świt nowej epoki — wielokulturowe społeczeństwo naszego państwa naturalnie zmierza ku postępowi dzięki połączeniu bardzo odmiennych tradycji."
 flavor_gbr.22.a: "Świat należy do państwa [Root.GovernmentName]!"
 flavor_gbr.23.t: "Korona iberyjska"
 flavor_gbr.23.desc: "Więzi dynastyczne z Półwyspem Iberyjskim sięgają wielu stuleci wstecz. Zawierano małżeństwa między królami i księżniczkami, takimi jak Alfons VIII Kastylijski i Eleonora, córka Henryka II oraz Eleonory Akwitańskiej, czy Edward I Angielski i Eleonora Kastylijska, siostra Alfonsa X Kastylijskiego. Najnowszym przykładem był Jan z Gandawy, książę Lancaster, syn Edwarda III, który poślubił Konstancję Kastylijską, córkę obalonego króla Piotra I, aby poprzez to małżeństwo zgłosić pretensje do tronu Kastylii.\n\nWięzi te zostały niedawno odnowione i umocnione, gdy wszystkie królestwa Półwyspu Iberyjskiego znalazły się pod naszym panowaniem. Możemy teraz ogłosić unię iberyjską jako jedną z koron naszego zjednoczonego królestwa."
 flavor_gbr.23.a: "Iberia powinna pozostać pod naszym bezpośrednim panowaniem."
 flavor_gbr.23.b: "Iberią należy rządzić w ramach unii personalnej."
 flavor_gbr.24.t: "Korona włoska"
 flavor_gbr.24.desc: "Włochy od stuleci są obiektem pożądania wielu władców. Próby narzucenia swojej władzy włoskim komunom przez dynastię Hohenstaufów zakończyły się jednak całkowitym niepowodzeniem. To ambitne przedsięwzięcie okazało się trudne, ponieważ niezależne miasta-państwa i księstwa półwyspu zaciekle występują przeciwko obcym najeźdźcom, którzy ośmielają się ingerować w ich nieustanne spory.\n\nNasze wysiłki w tym regionie przyniosły jednak owoce i możemy teraz ogłosić unię włoską jako jedną z koron naszego zjednoczonego królestwa."
 flavor_gbr.24.a: "Włochy powinny pozostać pod naszym bezpośrednim panowaniem."
 flavor_gbr.24.b: "Włochami należy rządzić w ramach unii personalnej."
 flavor_gbr.100.t: "Henryk VIII"
 flavor_gbr.100.desc: "Jako trzecie dziecko poprzedniego króla młody Henryk nie był przewidywany jako następca tronu. Dzięki temu otrzymał znakomite wykształcenie, a już od najmłodszych lat nadawano mu pomniejsze tytuły w królestwie, aby zapewnić stabilność wewnętrzną i ograniczyć rozdzielanie tytułów między inne wpływowe rody. Był prawdziwym intelektualistą, pisał po angielsku, francusku i łacinie, stając się uosobieniem człowieka renesansu. Pasjonował się również muzyką — grał na wielu instrumentach i śpiewał.\nChoć nie przygotowywano go formalnie do sprawowania władzy, jego wszechstronne wykształcenie, zdolności dyplomatyczne i ogromna charyzma mogą uczynić z niego jednego z najlepszych władców w historii Anglii."
 flavor_gbr.100.a: "Byłby znakomitym królem!"
 flavor_gbr.100.b: "To niezwykle utalentowany człowiek."
 flavor_gbr.101.t: "Epoka elżbietańska"
 flavor_gbr.101.desc: "Początkowo uznawano ją za domniemaną następczynię tronu, lecz później uznano ją za nieślubne dziecko i usunięto z linii sukcesji po egzekucji jej matki, gdy Elżbieta miała zaledwie dwa lata. Otrzymała znakomite wykształcenie i potrafiła pisać po angielsku, łacinie, włosku, francusku i grecku. Spór o sukcesję po śmierci przyrodniego brata Elżbiety zakończył się, gdy ona i jej przyrodnia siostra Maria wspólnie triumfalnie wjechały do Londynu. Ich porozumienie nie trwało jednak długo, ponieważ Maria była gorliwą katoliczką, zdecydowaną wykorzenić protestantyzm, w którym wychowano Elżbietę. Elżbieta spędziła nawet niemal rok w więzieniu, podejrzewana o wspieranie protestanckich buntowników przeciwko Marii.\nDzięki znakomitemu wykształceniu i łagodnemu usposobieniu bez wątpienia może zostać jedną z najlepszych władczyń w historii Anglii i zapoczątkować najwspanialszy złoty wiek, jaki kiedykolwiek widziano."
 flavor_gbr.101.a: "Byłaby znakomitą władczynią!"
 flavor_gbr.101.b: "Nie nadaje się do rządzenia."
 flavor_gbr.102.t: "Poglądy religijne [Root.Monarch.GetTitle]"
 flavor_gbr.102.desc: "Wraz z postępem epoki reformacji zmieniają się również sprawy religijne państwa [Root.GetUsableName]. Wraz z objęciem tronu [Root.GetAdjective] przez [Root.Monarch.GetTitle] [Root.Monarch.GetName] stosunek państwa [Root.GetAdjective] do religii [Root.Religion.GetName] ponownie stał się przedmiotem zainteresowania dworu."
 flavor_gbr.102.a: "Reformację należy narzucić."
 flavor_gbr.102.a.tt: "Każde znane państwo §Ykatolickie§! traci §R50§! punktów opinii o państwie §Y[Root.GetName]§!."
 flavor_gbr.102.a.at: "Każde znane państwo §Yprotestanckie§!, §Yreformowane§!, §Yanglikańskie§! i §Yhusyckie§! zyskuje §G50§! punktów opinii o państwie §Y[Root.GetName]§!."
 flavor_gbr.102.b: "Państwo [Root.GetUsableNameCap] nie może odwrócić się od papieża"
 flavor_gbr.102.b.tt: "Każde znane państwo §Yprotestanckie§!, §Yreformowane§!, §Yanglikańskie§! i §Yhusyckie§! traci §R50§! punktów opinii o państwie §Y[Root.GetName]§!."
 flavor_gbr.102.b.at: "Każde znane państwo §Ykatolickie§! zyskuje §G50§! punktów opinii o państwie §Y[Root.GetName]§!."
 flavor_gbr.102.c: "Zachowajmy status quo"
 flavor_gbr.103.t: "Likwidacja klasztorów"
 flavor_gbr.103.desc: "Klasztory w państwie [Root.GetUsableName] są potężnymi instytucjami Kościoła katolickiego. Nie tylko stanowią ośrodki wpływów papieża, lecz także gromadzą bogactwa pozostające poza kontrolą państwa.\nNa rozkaz [Root.Monarch.GetHerHis] wysokości dumni żołnierze reformacji zaatakowali jeden z wpływowych klasztorów, zniszczyli jego bluźniercze posągi i zagrabili zgromadzone tam bogactwa."
 flavor_gbr.103.a: "Państwo [Root.GovernmentName] wiele na tym zyska."
 flavor_gbr.104.t: "Zniesienie przywilejów duchowieństwa"
 flavor_gbr.104.desc: "Kierując się ideami reformacji, [Root.Monarch.GetTitle] [Root.Monarch.GetName] szuka sposobów na odebranie duchowieństwu licznych przywilejów. Skoro duchowni nie podlegają już papieżowi, lecz samemu [Root.Monarch.GetTitle] [Root.Monarch.GetHerselfHimself], władza królewska nie może tolerować poddanych, którzy nie są lojalni wobec swojego [Root.Monarch.GetTitle]."
 flavor_gbr.104.a: "Pokłońcie się przed swoim [Root.Monarch.GetTitle]!"
 flavor_gbr.105.t: "Opodatkowanie Kościoła"
 flavor_gbr.105.desc: "Liczne kościoły i klasztory w państwie [Root.GetUsableName] są zwolnione z podatków ze względu na swoje związki ze Stolicą Apostolską. W świetle nowych idei reformacji i dążeń [Root.Monarch.GetName] do uwolnienia państwa [Root.GetUsableName] spod wpływów papieskich Kościół nie będzie już zwolniony z podatków państwa [Root.GetAdjective]."
 flavor_gbr.105.a: "Znacznie zwiększy to nasze dochody."
 flavor_gbr.106.t: "Przywrócenie mszy łacińskiej"
 flavor_gbr.106.desc: "Reformacja zniosła tradycyjną mszę łacińską. Heretyccy chrześcijanie zaczęli odprawiać modlitwy w językach ojczystych, sprzeciwiając się w ten sposób woli Kościoła katolickiego. Dzięki intensywnym prześladowaniom i paleniu na stosie zwolenników reformacji [Root.GetAdjective] żołnierze, działając na rozkaz [Root.Monarch.GetTitle] [Root.Monarch.GetName], zdławili tę praktykę i ponownie przywrócili łacinę w liturgii."
 flavor_gbr.106.a: "Przywrócono porządek."
 flavor_gbr.107.t: "Pojednanie z Rzymem"
 flavor_gbr.107.desc: "Reformacja poważnie naruszyła jedność religijną państwa [Root.GetUsableName]. Działania reformatorów sprawiły, że stosunki między państwem [Root.GetUsableName] a papieżem od dłuższego czasu pozostają napięte.\nDzięki staraniom [Root.Monarch.GetHerHis] wysokości [Root.GetAdjective] dyplomaci zdołali ponownie nawiązać stosunki dyplomatyczne z Państwem Kościelnym. Państwo [Root.GovernmentName] i Rzym znów się pojednują."
 flavor_gbr.107.a: "Niech Pan wybaczy nam grzechy heretyków."
 flavor_gbr.108.t: "Reformacja się rozprzestrzenia!"
 flavor_gbr.108.desc: "Pomimo najlepszych starań [Root.Monarch.GetHerHis] reformacja szerzy się w państwie [Root.GetUsableName]. Jest jasne, że [Root.GetAdjective] lud jest niezadowolony z korupcji Kościoła katolickiego i gotów podążyć za każdym teologiem, który potępia tę instytucję."
 flavor_gbr.108.a: "Przed nami niespokojne czasy..."
 flavor_gbr.109.t: "Sprawy religijne w rękach doradców"
 flavor_gbr.109.desc: "Decyzja [Root.Monarch.GetTitle] [Root.Monarch.GetName], by nie opowiadać się ani po stronie katolików, ani protestantów, doprowadziła do stagnacji na dworze. Działania na rzecz reformacji lub przeciwko niej nie są już podejmowane z inicjatywy monarchy, lecz znajdują się teraz w rękach doradców [Root.Monarch.GetTitle]."
 flavor_gbr.109.a: "Miejmy nadzieję, że trafiły w dobre ręce."
 flavor_gbr.110.t: "Powstanie heretyków w prowincji [revolt_province.GetName]"
 flavor_gbr.110.desc: "Pomimo wyrozumiałości [Root.Monarch.GetHerHis] wysokości w sprawach religijnych poddanych, heretycy z prowincji [revolt_province.GetName] organizują otwarte powstanie przeciwko państwu [Root.GovernmentName]. Tolerancja czy nie — domagają się zniszczenia wiary [Root.Religion.GetName]."
 flavor_gbr.110.a: "O nie."
 flavor_gbr.110.b: "Przyznajmy im autonomię religijną."
 flavor_gbr.111.t: "Porozumienie religijne za panowania [Root.Monarch.GetName]"
 flavor_gbr.111.desc: "Dzięki mądremu przewodnictwu i przywództwu [Root.Monarch.GetTitle] [Root.Monarch.GetName] konflikt religijny między katolikami a protestantami w państwie [Root.GetUsableName] wreszcie dobiegł końca. Dzięki porozumieniu religijnemu za panowania [Root.Monarch.GetName], obejmującemu liczne ustalenia religijne i polityczne, spory wyznaniowe zostały ostatecznie rozstrzygnięte. Choć w odosobnionych miejscach nadal dochodzi do potyczek między katolikami a protestantami, stabilność państwa [Root.GovernmentName] została zabezpieczona."
 flavor_gbr.111.a: "Wreszcie koniec chaosu."
 flavor_gbr.112.t: "Spór między [Root.Monarch.GetTitle] a [Root.GetParliamentOrFallbackName]"
 flavor_gbr.112.desc: "Stosunki między [Root.Monarch.GetTitle] [Root.Monarch.GetName] a [Root.GetParliamentOrFallbackName] od zawsze oscylowały między serdecznością a napięciem. Rozbieżności między interesami poszczególnych regionów a autorytetem [Root.Monarch.GetTitle] nieustannie prowadziły do gorących debat, a różnice poglądów religijnych również wywoływały liczne dyskusje. Ostatnio spór przybrał nowy obrót, gdy niektórzy członkowie [Root.GetParliamentOrFallbackName], broniąc swoich stanowisk przed [Root.Monarch.GetTitle], przemawiali z nadmierną żarliwością, zupełnie nieprzystającą do osób tak wysokiego stanu. [Root.Monarch.GetTitle] był wyraźnie niezadowolony ze sposobu przedstawienia sprawy i natychmiast ją odrzucił.\n\nSprawa została na razie zamknięta, lecz wzrosła determinacja jej zwolenników oraz ich niechęć do [Root.Monarch.GetTitle]. Co więcej, wydaje się, że niespodziewanie przybyło osób gotowych poprzeć tę inicjatywę — zarówno otwarcie, jak i za zamkniętymi drzwiami. Inne ugrupowania wykorzystują ją ponadto jako dowód niezdolności [Root.Monarch.GetTitle] do właściwego rozwiązywania problemów poszczególnych regionów.\n\nTwierdzą, że skoro nawet jedna taka sprawa nie została rozpatrzona, nikt nie wysłucha również ich własnych postulatów i żądań. Dlatego opowiadają się za tym, by [Root.Monarch.GetTitle] nie ingerował w decyzje [Root.GetParliamentOrFallbackName], podczas gdy [Root.Monarch.GetTitle] [Root.Monarch.GetName] [Root.Monarch.GetHerselfHimself] pragnie ograniczyć wpływ [Root.GetParliamentOrFallbackName] na [Root.Monarch.GetHerHis] rządy."
 flavor_gbr.112.a: "Niebezpieczny rozwój wydarzeń."
 flavor_gbr.112.a.tt: "§YMonarchia§! i §Yparlament§! rozpoczęły walkę o władzę. Jeśli którakolwiek ze stron przejmie pełnię władzy nad państwem, konflikt przerodzi się w katastrofę §YWojna domowa w Anglii§!."
 flavor_gbr.113.t: "Konflikt przybiera na sile"
 flavor_gbr.113.desc: "Napięcia między [Root.GetParliamentOrFallbackName] a [Root.Monarch.GetTitle] osiągnęły punkt, z którego nie ma już odwrotu. To, co zaczęło się jako spór o poparcie dla interesów regionalnych, podatki i wydatki wojskowe, przerodziło się w konflikt dotyczący samej roli [Root.GetParliamentOrFallbackName] w rządzeniu państwem. Jedni kwestionują potrzebę istnienia [Root.GetParliamentOrFallbackName], inni — samego [Root.Monarch.GetTitle]. [Root.Monarch.GetTitle] [Root.Monarch.GetName] ma dość konieczności zadowalania grupy ludzi, którzy nieustannie ingerują w [Root.Monarch.GetHerHis] prawowite i niepodważalne prawo do rządzenia, wykorzystując każdą okazję, by podważyć [Root.Monarch.GetHerHis] autorytet. Z drugiej strony wpływowi przedstawiciele regionów zasiadający w [Root.GetParliamentOrFallbackName] ogłosili, że nie będą już słuchać żadnej centralnej i tyrańskiej władzy, oraz zgromadzili wojska na swoich terytoriach, by siłą bronić własnych uprawnień.\n\nZnaczna część naszego kraju ogłosiła, że nie uznaje już naszego panowania, i otwarcie wystąpiła przeciwko nam."
 flavor_gbr.113.a: "Przejdźmy do zdecydowanych negocjacji."
 flavor_gbr.113.a.tt: "§RKatastrofa §YWojna domowa w Anglii§! będzie teraz łatwiejsza do wywołania.§!"
 flavor_gbr.114.t: "Krwawa Maria"
 flavor_gbr.114.desc: "W poszukiwaniu męskiego następcy tronu została odsunięta od sukcesji na rzecz przyrodniego brata i wysłana do Walii, co w okresie jej dorastania pogorszyło relacje z ojcem. Podczas panowania przyrodniego brata, jako gorliwa katoliczka, została jeszcze bardziej odsunięta od dziedziczenia tronu, ponieważ obawiano się, że cofnie protestanckie reformy wprowadzone za jego rządów. Właśnie tego pragnęła Maria — była zdecydowana zniszczyć protestantyzm i wraz z przyrodnią siostrą Elżbietą starała się zdobyć wystarczające poparcie, by odzyskać tytuł królowej.\n\nMimo przeciwności i sprzeciwu dworu mogłaby zostać znakomitą władczynią, odwracając niedawne protestanckie tendencje królestwa i przywracając katolicyzm."
 flavor_gbr.114.a: "Protestantyzm musi zostać wykorzeniony!"
 flavor_gbr.114.b: "Nie nadaje się do rządzenia."
 flavor_gbr.115.t: "Zakon rycerski"
 flavor_gbr.115.desc: "Podczas pierwszych wypraw krzyżowych powstało kilka zakonów wojskowych. Czerpiąc z tej tradycji i łącząc ją z ideałami rycerskości, zaczęto zakładać kolejne zakony działające przy dworach. Opierają się one na idei braterstwa i wiążą się zarówno z zasługami oraz prestiżem, jak i z odpowiednimi odznaczeniami i wyróżnieniami. Niektóre są również związane z konkretnymi rodami szlacheckimi, a nawet objęte patronatem królewskim — obcym lub naszym własnym.\n\nNiektórzy twierdzą, że tego rodzaju zakony należą już do przeszłości, inni zaś uważają, że rycerskość, zasługi i cnoty należy zawsze wychwalać i nagradzać. Nasz naród od zawsze cenił ludzi godnych uznania, a wartości propagowane przez zakony bez wątpienia zasługują na podtrzymywanie. Dlatego nasz kraj wiele zyska na ustanowieniu zakonu rycerskiego, któremu patronować będzie [Root.Monarch.GetTitle], aby przetrwał pokolenia, reprezentując najlepsze wartości naszego narodu i skupiając jego najwybitniejszych przedstawicieli."
 flavor_gbr.115.a: "Świt nowego zakonu."
 flavor_gbr.115.b: "Takie zakony powinny pozostać w przeszłości."
 flavor_gbr.116.t: "Turnieje rycerskie w Anglii"
 flavor_gbr.116.desc: "Turnieje rycerskie od stuleci stanowią tradycję w całej Europie, pozwalając rycerzom prezentować i doskonalić umiejętności bojowe. W ostatnich latach zostały udoskonalone dzięki takim innowacjom jak wprowadzenie przegrody oddzielającej tory jazdy. Zapobiega ona zderzeniom i zapewnia obu jeźdźcom optymalny kąt podczas kruszenia kopii. Postęp w technologii zbroi poprawił również bezpieczeństwo uczestników. W rezultacie turnieje stały się raczej rozrywką i widowiskiem niż rzeczywistym ćwiczeniem wojskowym. Oznacza to jednak, że może w nich uczestniczyć więcej osób niż kiedykolwiek wcześniej."
 flavor_gbr.116.a: "Wspaniały sport."
 flavor_gbr.117.t: "Chwalebna rewolucja"
 flavor_gbr.117.desc: "Mimo że Jakub II był katolikiem, został królem Anglii, Szkocji i Irlandii przy szerokim poparciu. Uważano jednak, że jest to rozwiązanie tymczasowe, ponieważ jego domniemaną następczynią była protestancka córka Maria. Była ona żoną Wilhelma Orańskiego, faktycznego władcy protestanckiej Republiki Zjednoczonych Prowincji. Narodziny męskiego potomka, który wyprzedził Marię w kolejce do tronu, otworzyły drogę do powstania dynastii katolickiej, a proces kilku protestanckich biskupów wywołał szeroki sprzeciw wobec katolicyzmu.\nPodważyło to autorytet Jakuba, a koalicja angielskich mężów stanu zaprosiła Wilhelma do interwencji zbrojnej w obronie religii protestanckiej."
 flavor_gbr.117.a: "Wilhelmie, pomóż nam — jesteś naszą jedyną nadzieją."
 flavor_gbr.118.t: "Piąci monarchiści"
 flavor_gbr.118.desc: "Piąci monarchiści to protestancka sekta opierająca swoje wierzenia na przekonaniu, że przed nadejściem ostatniej, piątej monarchii — Królestwa Bożego na Ziemi — nastąpią cztery inne monarchie. Twierdzą, że ostatnie wydarzenia zwiastują koniec czwartej monarchii, a rządy [Root.Monarch.GetTitle] [Root.Monarch.GetName] powstrzymują nadejście piątej. Uważają się za „zbawionych” i nazywają „świętymi”, rzekomo przygotowując ludność na powtórne przyjście Chrystusa. Choć nie jest to ruch masowy, jego znaczne wpływy oraz fakt, że niektórzy członkowie dopuszczają użycie siły zbrojnej, sprawiają, że nie można go ignorować.\n\nMimo skrajnego charakteru tych poglądów nie da się zaprzeczyć, że zainteresowały one już wpływowych członków rządu, zarówno jawnie, jak i potajemnie. Zignorowanie ich byłoby nierozsądne, zwłaszcza jeśli istnieje możliwość, że powtórne przyjście Chrystusa rzeczywiście jest bliskie."
 flavor_gbr.118.a: "Podążymy za znakami Boga."
 flavor_gbr.118.a.tt: "Piąci monarchiści przejmują władzę w państwie §Y[Root.GetUsableName]§!...\n§R§Y[Root.GetUsableName]§! uzyska dostęp do potężnego, lecz niebezpiecznego ustroju, który zmusi nasz naród do nieustannego prowadzenia wojen. Jeśli przed nadejściem Końca nie podbijemy tysiąca prowincji, czeka nas upadek!§!"
 flavor_gbr.118.b: "Nie powinniśmy ulegać takim szaleństwom."
 flavor_gbr.119.t: "Nowa era piątych monarchistów"
 flavor_gbr.119.desc: "Znaki Boga są jasne! Cztery królestwa dobiegły końca, a nadeszło piąte. Radujcie się, albowiem Pan wkrótce powróci z niebios i znów będzie kroczył pośród nas. Zbawieni zostaną tylko ci, którzy przyjmą Go do serca, a wszyscy pozostali zginą. To my jesteśmy świętymi, tymi, którzy zasługują na zbawienie. Przekonamy tych, którzy wciąż odrzucają Pana, by poszli za nami i naprawdę przyjęli Go do swoich serc.\n\nKrólestwo Boże na Ziemi jest już blisko, a to nam przypadnie w udziale przygotowanie Mu drogi."
 flavor_gbr.119.a: "Niech się stanie Jego wola!"
 flavor_gbr.119.b: "Natychmiast powstrzymajcie to szaleństwo!"
 flavor_gbr.119.b.tt: "§YPiąci monarchiści już nigdy nie będą mieli szansy obalić rządu.§!"
 flavor_gbr.120.t: "Koniec piątych monarchistów"
 flavor_gbr.120.desc.a: "Losy rządów nieustannie się zmieniają. Ci, którzy przez pewien czas cieszą się przychylnością, prędzej czy później ją tracą i zostają odsunięci od władzy. Spotkało to również nas — piąci monarchiści utracili dotychczasowe poparcie, gdy nastroje ludu zmieniły kierunek.\n\nZamknął się kolejny rozdział historii naszego kraju. Osądzi nas historia, niezależnie od tego, czy zmiana okaże się dobra, czy zła. Piąci monarchiści nie będą już nami rządzić. Niech żyje nowy [Root.Monarch.GetTitle] [Root.Monarch.GetName]!"
 flavor_gbr.120.desc.b: "Wszyscy poddaliśmy się potężnej fali piątych monarchistów, porwani ich wezwaniem do oczekiwania na powtórne przyjście Chrystusa. Przygotowywali kraj na to wydarzenie i nadejście Królestwa Bożego na Ziemi. Z nadzieją czekaliśmy na dzień, w którym Jezus zstąpi z niebios i ponownie połączy się z nami w wiecznej szczęśliwości.\n\nLecz ten dzień nie nadszedł.\n\nNajpierw pojawiły się wymówki i usprawiedliwienia błędami w obliczeniach. Potem przyszły obietnice, że nastąpi to jutro, a następnie kolejnego dnia i jeszcze następnego. Ludzie przestali wierzyć tym, którzy ich do tego doprowadzili. Zaczęli otwierać oczy i rozumieć, że nie są „świętymi” i nie zostaną „zbawieni”. Jezus nie zstępował z niebios — przynajmniej jeszcze nie teraz.\n\nNiedowierzanie szybko przerodziło się w nienawiść do tych, którzy ich zwiedli. Tłumy wtargnęły do budynków rządowych i wyciągnęły przywódców, za którymi jeszcze niedawno podążały. Wywleczono ich z gabinetów na place publiczne, gdzie zostali potępieni, skrytykowani i oskarżeni. W większości przypadków ostatecznie ich stracono, a pozostałych uwięziono. Nikt nie uniknął gniewu mściwego tłumu."
 flavor_gbr.120.a: "Koło historii nieuchronnie zatoczyło krąg."
 flavor_gbr.121.t: "Anglikanizm w Świętym Cesarstwie Rzymskim"
 flavor_gbr.121.desc: "Święte Cesarstwo Rzymskie wielokrotnie doświadczało podziałów religijnych. Od wielu lat katolicyzm i protestantyzm walczą o kontrolę nad imperium. Nadszedł czas, by położyć temu kres. Cesarstwem nie będą już rządzić heretyckie wyznania. Jedyną oficjalną religią Świętego Cesarstwa Rzymskiego będzie anglikanizm, zgodnie z wolą samego Boga. Zapewnienie mu statusu jedynego oficjalnego wyznania zagwarantuje naszą dominację nad imperium."
 flavor_gbr.121.a: "Zjednoczeni w jednej wierze."
 flavor_gbr.122.t: "Państwo [Root.GetUsableNameCap] w epoce reformacji"
 flavor_gbr.122.desc: "Reformacja ogarnęła Europę, pogrążając kontynent w religijnym chaosie i anarchii. Autorytet papieża osiągnął najniższy poziom, a liczni teologowie rywalizują ze sobą, przedstawiając odmienne teorie dotyczące mistycznego wymiaru wiary.\nReformacja dotarła oczywiście również do państwa [Root.GetUsableName]. [Root.GetAdjective] spierają się między sobą o wyższość własnych wyznań, podczas gdy stanowisko państwa [Root.GetUsableName] zależy całkowicie od woli ukochanego [Root.Monarch.GetTitle]."
 flavor_gbr.122.a: "Nadchodzą niepewne czasy..."
 flavor_gbr.122.a.tt: "Religia każdego nowego §Y[Root.Monarch.GetTitle]§! i §Ynastępcy tronu§! ma teraz §Y50,0%§! szansy na przynależność do religii §Yheretyckiej§!, dopóki ten modyfikator jest aktywny.\nWładcy mogą przyjąć §Ystanowisko religijne§! wobec reformacji, które wpłynie na przyszłe wydarzenia."
 flavor_gbr.199.t: "Pax Britannica"
 flavor_gbr.199.t.a: "Pax Angevina"
 flavor_gbr.199.t.b: "[Root.GetPaxBritannica]"
 flavor_gbr.199.desc.a: "Nasz kraj osiągnął rozmiary, dobrobyt i stabilność, jakich wcześniej nie widziano. Nasze chwalebne rządy przyniosły ludności bezprecedensowe bogactwo, a na całym świecie szanuje się nasz autorytet. Powiedzenie, że „nad Imperium Brytyjskim słońce nigdy nie zachodzi”, nie jest przenośnią, lecz niezaprzeczalnym faktem.\n\nW czasach pokoju i dobrobytu ludzie zaczęli porównywać naszego [Root.Monarch.GetTitle] [Root.Monarch.GetName] do największych władców przeszłości, a zwłaszcza do Cezara Augusta. Ustanowienie przez niego Cesarstwa Rzymskiego oraz pokój i dobrobyt, jakie ze sobą przyniosło, są zestawiane z rządami [Root.Monarch.GetName] i pomyślnością, którą [Root.Monarch.GetSheHe] [Root.Monarch.GetHerselfHimself] nam zapewnił.\n\nCieszymy się prawdziwym Pax Britannica."
 flavor_gbr.199.desc.b: "Nasz kraj osiągnął rozmiary, dobrobyt i stabilność, jakich wcześniej nie widziano. Nasze chwalebne rządy przyniosły ludności bezprecedensowe bogactwo, a w całej Europie szanuje się nasz autorytet. Połączenie Anglii i Francji okazało się jeszcze większym sukcesem, niż oczekiwaliśmy.\n\nW czasach pokoju i dobrobytu ludzie zaczęli porównywać naszego [Root.Monarch.GetTitle] [Root.Monarch.GetName] do największych władców przeszłości, a zwłaszcza do Cezara Augusta. Ustanowienie przez niego Cesarstwa Rzymskiego oraz pokój i dobrobyt, jakie ze sobą przyniosło, są zestawiane z rządami [Root.Monarch.GetName] i pomyślnością, którą [Root.Monarch.GetSheHe] [Root.Monarch.GetHerselfHimself] nam zapewnił.\n\nCieszymy się prawdziwym Pax Angevin."
 flavor_gbr.199.a: "Jesteśmy najwspanialszym imperium."
 flavor_gbr.200.t: "Przedsięwzięcie kolonialne"
 flavor_gbr.200.desc: "Nasze ostatnie inwestycje kolonialne wyraźnie zaczynają przynosić owoce. Właśnie otrzymaliśmy wiadomość z niedawno założonej kolonii w prowincji [Root.GetName], informującą o pomyślnym utworzeniu osady. Koloniści rozbudowują już swoje domostwa i infrastrukturę, a miejscowe władze nie są pewne, w jakim kierunku powinny rozwijać kolonię. Proszą więc o wskazówki [Root.Owner.Monarch.GetTitle] [Root.Owner.Monarch.GetName], aby nadać jej kierunek rozwoju najkorzystniejszy dla państwa."
 flavor_gbr.200.a: "Wystarczy nam produkcja [Root.GetTradeGoodsName]."
 flavor_gbr.200.grain: "Rozwińmy produkcję zboża."
 flavor_gbr.200.wine: "Rozwińmy produkcję wina."
 flavor_gbr.200.wool: "Rozwińmy produkcję wełny."
 flavor_gbr.200.cloth: "Rozwińmy produkcję tkanin."
 flavor_gbr.200.fish: "Rozwińmy produkcję ryb."
 flavor_gbr.200.fur: "Rozpocznij produkcję futer."
 flavor_gbr.200.salt: "Rozpocznij produkcję soli."
 flavor_gbr.200.naval_supplies: "Rozpocznij produkcję zaopatrzenia okrętowego."
 flavor_gbr.200.copper: "Rozpocznij produkcję miedzi."
 flavor_gbr.200.gold: "Rozpocznij produkcję złota."
 flavor_gbr.200.iron: "Rozpocznij produkcję żelaza."
 flavor_gbr.200.slaves: "Rozpocznij produkcję niewolników."
 flavor_gbr.200.ivory: "Rozpocznij produkcję kości słoniowej."
 flavor_gbr.200.tea: "Rozpocznij produkcję herbaty."
 flavor_gbr.200.chinaware: "Rozpocznij produkcję porcelany."
 flavor_gbr.200.spices: "Rozpocznij produkcję przypraw."
 flavor_gbr.200.coffee: "Rozpocznij produkcję kawy."
 flavor_gbr.200.cotton: "Rozpocznij produkcję bawełny."
 flavor_gbr.200.sugar: "Rozpocznij produkcję cukru."
