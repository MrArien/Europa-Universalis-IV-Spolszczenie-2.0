 fanatic_zeal: "Fanatyczny zapał"
 fanatic_zeal_desc: "Fanatyczny zapał to zbiorowe przekonanie, że koniec jest bliski. Im większy zapał, tym bardziej agresywnie państwo występuje przeciwko tym, którzy sprzeciwiają się nadejściu końca czasów – zarówno wrogom zewnętrznym, jak i wewnętrznym.

Fanatyczny zapał wzrasta o §Y1§! miesięcznie i zmniejsza się o §Y5§! po każdym zwycięstwie w wojnie (osobne traktaty pokojowe nie są uwzględniane)."
