 watergeuzen_reform_desc: ""
 sygnakhs_system_reform: ""
 sygnakhs_system_reform_desc: ""
 cossacks_registry_reform: "Rejestr Kozaków"
 cossacks_registry_reform_desc: "Kozacy zamieszkujący ziemie naszego państwa są znakomitymi jeźdźcami i mistrzami jazdy konnej, stanowiąc cenny atut militarny. Rejestr Kozaków formalnie włączy ich do naszej administracji, a w zamian za przywileje i wpływy pozwoli pozyskać ich cenne usługi."
 lessons_of_the_hussite_wars_reform: "Lekcje z wojen husyckich"
 lessons_of_the_hussite_wars_reform_desc: "Europa próbowała kiedyś pokonać naszą wiarę. W swoich desperackich próbach przejęcia naszych ziem i eksterminacji naszych wiernych, wykuwali nasz hart ducha w ogniu walki. Doświadczenia, z które zdobyliśmy podczas tych nieustannych ataków i działań wojennych, wyryte w naszej skórze, będą cenną lekcją prowadzenia wojny i ostrzeżeniem dla wszystkich, którzy chcą stąpać po ziemiach husyckich, ucieczka lub śmierć."
 rallied_volunteers_level_1: ""
 desc_rallied_volunteers_level_1: "Zgromadziliśmy wielu wiernych, którzy zasilą nasze wojska i pomogą nam w walce."
 rallied_volunteers_level_2: ""
 desc_rallied_volunteers_level_2: "Zgromadziliśmy wielu wiernych, którzy zasilą nasze wojska i pomogą nam w walce."
