 EU_KINGDOM_OF_GOD_ideas_bonus: "Papieska ambicja"
 eu_estate_burghers_control_over_monetary_policy_desc: "Dając [Root.GetBurghersName_dat] ostatnie słowo w sprawie polityki pieniężnej, państwo gwarantuje, że interesy handlowe będą brane pod uwagę przy podejmowaniu kluczowych decyzji gospodarczych."
 eu_estate_burghers_control_over_monetary_policy: "Kontrola nad polityką pieniężną"
 lessons_hundred_years_war: "Lekcje wojny stuletniej"
 lessons_hundred_years_war_desc: "Nieustanne wojny z angielską koroną zapewniły naszym wojskom niezwykłe doświadczenie bojowe. Możemy wykorzystać tę wiedzę, aby dalej rozszerzać nasze wpływy i domenę."
 europes_first_standing_army: "Pierwsza stała armia Europy"
 europes_first_standing_army_desc: "Siła władcy zależy od możliwości jego armii. Ukształtowana w ogniu nieustannych wojen i zahartowana trudami europejskich pól bitewnych, nasza armia stała się zdyscyplinowaną siłą, z którą należy się liczyć."
 divine_right_to_rule: "Boskie prawo do rządzenia"
 divine_right_to_rule_desc: "Nasi władcy posiadają mandat, który w sprawach administracji i wojny przewyższa wszelką inną władzę wewnętrzną. Żadna osoba w naszej domenie nie jest w stanie podważyć boskiego prawa naszego monarchy."
 FRA_ideas_2: "Idee rewolucyjnej Francji"
 FRA_ideas_2_start: "Tradycje rewolucyjnej Francji"
 FRA_ideas_2_bonus: "Ambicje rewolucyjnej Francji"
 revolutionary_tribunal: "Równość wobec prawa"
 revolutionary_tribunal_desc: "Europa jest łupem krwiożerczych tyranów, którzy trzymają swoich poddanych w jarzmie przywilejów. Gdy jednak pozna się zasadę równości wobec prawa, dzięki której każdy człowiek zostaje uznany za równego innym, łatwo przyjąć tę wielką Rewolucję, która zagwarantuje wolność i prawa."
 mandats_territoriaux: "Frank germinal"
 mandats_territoriaux_desc: "Aby nasz wielki naród mógł poradzić sobie z niestabilnością finansową, wprowadzimy nowe papierowe banknoty, które pomogą zwalczyć hiperinflację i przywrócić stabilność naszej gospodarce."
 jourdan_law: "Ustawa Jourdana"
 jourdan_law_desc: "Udana próba reformy ustawodawstwa wojskowego — ustawa Jourdana obejmuje obowiązkiem służby wojskowej wszystkich mężczyzn w wieku od 20 do 25 lat, którzy nie mają małżonka ani dzieci. Biedni i najubożsi mieszkańcy naszego kraju staną się cennym źródłem rekrutów, dzięki którym będziemy mogli realizować rewolucyjne ambicje na całym Starym Kontynencie."
 napoleonic_tactics: "Taktyka napoleońska"
 napoleonic_tactics_desc: "Naszą epokę definiują intensywne ćwiczenia musztry oraz odnowione taktyki pola bitwy. Wykorzystując nowe, szybkie manewry w połączeniu z kawalerią i artylerią, górować będziemy nad naszymi wrogami."
 european_ambitions: "Ambicje europejskie"
 european_ambitions_desc: "Stary Kontynent leży w zasięgu naszej ręki. Otaczające nas monarchie i wrogowie są jedynie drobnymi przeszkodami na drodze do zjednoczenia kontynentu pod przewodnictwem rewolucyjnych ideałów."
 mng_tumu_crisis_title: "Kryzys w Tumu"
 mng_tumu_crisis_desc: "Siły zgromadzone na naszej północno-zachodniej granicy zwiastują upadek naszego wielkiego imperium. Nie możemy ulec ich presji, jeśli nie chcemy ryzykować zagłady naszej wspaniałej dynastii. Władcom Ojratów trzeba przypomnieć, dlaczego powinni się nas obawiać!"
 mng_restore_royal_road_title: "Przywrócenie Drogi Królewskiej"
 mng_restore_royal_road_desc: "Przez stulecia kupcy z dalekiego Zachodu przywozili i sprzedawali rozmaite egzotyczne towary. Jedwab, który eksportowaliśmy i na którym zbudowaliśmy legendarną sławę naszego imperium, znów powinien swobodnie przepływać między nami a naszymi sojusznikami. Niech jedwab płynie!"
 mng_cornerstone_empire_title: "Fundament imperium"
 mng_cornerstone_empire_desc: "Państwo obejmujące tak rozległe ziemie musi polegać na kilku potężnych osobistościach z naszego dworu. Aby zapewnić właściwą stabilność i sprawne funkcjonowanie państwa, musimy wybrać najlepszą drogę i odpowiednio rozdzielić władzę."
 mng_censorate_title: "Cenzorat"
 mng_censorate_desc: "Jako niezwykle sprawna gałąź naszego rządu, Cenzorat musi dołożyć wszelkich starań, aby kontynuować centralizację i zwiększać wydajność biurokracji, tak by sprostać rozmiarom naszej ogromnej domeny."
 mng_promote_grand_coordinators_title: "Wielcy koordynatorzy"
 mng_promote_grand_coordinators_desc: "Odpowiednikiem wicekróla na Wschodzie jest urząd Xunfu, odgrywający istotną rolę w naszej administracji. Musimy awansować kompetentnych koordynatorów i zadbać o ich lojalność wobec cesarza."
 mng_crisis_ming_dynasty_title: "Kryzys dynastii Ming"
 mng_crisis_ming_dynasty_desc: "Nasza dynastia przetrwała już wiele przerażających kryzysów. Być może Niebiosa wystawiają naszego władcę na próbę. Musimy jednak wytrwać w obliczu niebezpieczeństwa i nie ustępować. Od tego zależy przyszłość naszego ludu."
 mng_expand_great_wall_title: "Rozbudowa Wielkiego Muru"
 mng_expand_great_wall_desc: "Wielki Mur chroni nasz lud od pokoleń. Aby nadal skutecznie spełniał swoją rolę, musimy ocenić jego stan, a następnie podjąć działania na rzecz jego modernizacji i rozbudowy, chroniąc zwykłych ludzi przed krwiożerczymi zakusami obcych."
 mng_sail_east_title: "Wyprawa na wschód"
 mng_sail_east_desc: "Morze otaczające nasze wybrzeża skrywa wiele tajemnic, z których większość znajduje się tuż za horyzontem i czeka na odkrycie przez żądnych przygód podróżników i odkrywców. Jakie niezwykłe skarby i odkrycia kryją te ziemie? Z pewnością naszym obowiązkiem jest się o tym przekonać!"
 mng_reform_civil_registration_title: "Reforma rejestracji ludności"
 mng_reform_civil_registration_desc: "System rządów promowany przez naszą dynastię przez ostatnie stulecia uległ niewielkim zmianom. Musimy zatem znaleźć właściwy sposób zarządzania rzeszami poddanych żyjących pod naszym sztandarem oraz odpowiednio ograniczyć negatywne skutki korupcji i nadmiernego rozrostu administracji."
 mng_examination_system_title: "System egzaminacyjny"
 mng_examination_system_desc: "Udoskonaliliśmy już nasz system rządów, teraz musimy wybrać ścieżkę, którą podąży nasze imperium. Centralizacja, przekazanie lokalnej władzy poszczególnym osobistościom czy awansowanie członków dynastii na wysokie stanowiska — to tylko niektóre z dróg, które może obrać nasz wielki cesarz."
 mng_mutual_trade_system_title: "System wzajemnego handlu"
 mng_mutual_trade_system_desc: "Demonstrowanie naszej potęgi oraz wymiana podarunków, przysług i pieniędzy w zamian za ochronę tworzą stosunkowo wydajne i niezwykle dochodowe relacje między naszą wielką dynastią a licznymi państwami satelickimi w naszej strefie wpływów. Nie możemy jednak spocząć na laurach. Musimy nadal rozwijać ten potężny fundament, odnawiając układy trybutarne lub zawierając nowe porozumienia z nowo pozyskanymi sojusznikami spoza naszych granic."
 mng_nomadic_frontier_title: "Granica z koczownikami"
 mng_nomadic_frontier_desc: "Zwykli mieszkańcy naszych ziem od dawna cierpią z powodu najazdów sąsiednich plemion. Głód, spustoszenie i utrata życia to tylko niektóre z powodów, dla których musimy rozwiązać ten problem, zanim wymknie się spod kontroli."
 mng_deal_kama_kagyu_title: "Rozwiąż kwestię Karma Kagju"
 mng_deal_kama_kagyu_desc: "Szkoły myśli w Tybecie nie zawsze zgadzają się ze sobą ani z naszymi poglądami, jednak ich nauki niosą wiedzę, a ich przywódcy cieszą się dużym autorytetem wśród swoich ludzi. Musimy zatem zapewnić ich lojalność wobec naszej dynastii, wykorzystując wszelkie niezbędne środki."
 mng_inward_perfection_title: "Doskonalenie wewnętrzne"
 mng_inward_perfection_desc: "Wielu doradców na naszym dworze opowiada się za ruchem skupionym na doskonaleniu spraw wewnętrznych zamiast na nieustannych podbojach. Istnieje jednak również nowy ruch sprzeciwiający się temu podejściu. Jego zwolennicy twierdzą, że należy kuć żelazo póki gorące i zmiażdżyć wrogów pragnących nas zniszczyć, zanim zgromadzą siły i rzucą nam wyzwanie."
 mng_survey_ocean_shores_title: "Zbadaj wybrzeża oceanów"
 mng_survey_ocean_shores_desc: "Nie tak dawno wyruszyliśmy w serię legendarnych wypraw wzdłuż wybrzeży Azji, demonstrując naszą potęgę w sposób budzący podziw. Teraz ponownie musimy potwierdzić naszą supremację na rozległych ziemiach imperium i powstrzymać potencjalnych zdobywców..."
 mng_tame_china_sorrow_title: "Poskrom Żal Chin"
 mng_tame_china_sorrow_desc: "Rzeki są krwiobiegiem naszej cywilizacji, zapewniają bowiem ludności żyzne ziemie i podstawowe środki do życia. Jednak powodzie, które mogą występować co kilka dziesięcioleci, stanowią ogromne zagrożenie zarówno dla bytu naszych poddanych, jak i dla stabilności naszych rządów."
 mng_single_whip_law_title: "Ustawa o pojedynczym biczu"
 mng_single_whip_law_desc: "Imperium o tak wielkich rozmiarach jak nasze bywa trudne w zarządzaniu i sprawiedliwym opodatkowaniu. W rezultacie część potencjalnych dochodów pozostaje niewykorzystana. Aby temu zaradzić, musimy wprowadzić nowy, powszechny podatek opłacany wyłącznie srebrem, co pozwoli scentralizować naszą politykę podatkową."
 mng_pure_land_title: "Czysta Kraina"
 mng_pure_land_desc: "Pomimo sukcesów w sprawach wewnętrznych i zagranicznych nie możemy zapominać o pielęgnowaniu ogrodu naszej duszy. Powinniśmy wznosić odpowiednie miejsca kultu, które odzwierciedlą nasze bogactwo i przywiązanie do nauk, dzięki którym osiągnęliśmy dobrobyt."
 mng_shengshi_zhishi_title: "Shengshi i Zhishi"
 mng_shengshi_zhishi_desc: "Historia minionych dynastii, podobnie jak dzieje naszej własnej, zawsze podlegała przypływom i odpływom. Okresy wzrostu, dekadencji, zniszczenia i odrodzenia są częścią życia. Nie oznacza to jednak, że nie powinniśmy dołożyć wszelkich starań, by zapewnić rozwój i sprawne rządy naszej dynastii."
 mng_kingdom_joseon_title: "Królestwo Joseon"
 mng_kingdom_joseon_desc: "Na wschodzie leży królestwo Korei — potężny sojusznik, ale i potencjalne zagrożenie dla trwałości naszych rządów. Rozsądnie będzie podjąć kroki w celu rozwiązania tej sytuacji, drogą dyplomatyczną lub militarną, aby chronić nasze interesy."
 mng_repeal_or_improve_haijin_title: "Znieś lub zreformuj Haijin"
 mng_repeal_or_improve_haijin_desc: "Ta misja zostanie odblokowana przez wydarzenie „§YPolityka Haijin Wielkiego Mingu§!” i określi, którą dynamiczną misję otrzymamy."
 mng_improve_haijin_policy_title: "[Root.GetPreviewColorMNG]Ulepsz politykę Haijin[Root.GetPreviewColorMNG_end]"
 mng_improve_haijin_policy_desc: "Obecny zakaz handlu w naszym państwie w dużej mierze szkodzi naszym własnym dochodom. Choć ograniczenie rozległych stosunków handlowych z obcymi jest rozsądnym rozwiązaniem, istnieje wiele możliwości udoskonalenia obecnej polityki i lepszego dostosowania jej do naszej sytuacji gospodarczej."
 mng_repeal_haijin_policy_title: "[Root.GetPreviewColorMNG]Znieś politykę Haijin[Root.GetPreviewColorMNG_end]"
 mng_repeal_haijin_policy_desc: "Nasze rynki zbyt długo pozostawały zamknięte dla cudzoziemców! Nadszedł czas, by obrać kurs na modernizację i wolny handel!"
 mng_expand_bogue_title: "Rozbudowa Bogue"
 mng_expand_bogue_desc: "Ujście rzeki w prowincji [667.GetName] jest znane w całym naszym państwie jako tętniące życiem centrum dochodowego handlu oraz transportu cennych towarów i zboża. Musimy nieustannie je rozbudowywać, aby mogło obsługiwać coraz większy przepływ dóbr i zaspokajać rosnące potrzeby naszego ludu."
 mng_jing_hang_grand_canal_title: "Wielki Kanał Jing-Hang"
 mng_jing_hang_grand_canal_desc: "Opanowanie pływów i powodzi nawiedzających brzegi rzek naszego wielkiego państwa okaże się niezbędne, jeśli chcemy przetrwać nadchodzące stulecia. Powodzie przyczyniały się do upadku wielu poprzednich dynastii, dlatego musimy podjąć konieczne kroki, abyśmy nie stali się jedynie kolejną krótką wzmianką w księgach historii."
 mng_expand_yongle_dadian_title: "Yongle Dadian"
 mng_expand_yongle_dadian_desc: "Rozwój druku i kopiowania dzieł literackich w Chinach jest rewolucyjną techniką, która umożliwia rozpowszechnianie i zachowywanie wiedzy. Udoskonalając metody naszych przodków, możemy rozpowszechnić monumentalne dzieło encyklopedyczne cesarza Yongle, obejmujące setki tomów wiedzy."
 mng_heavens_will_title: "Wola Niebios"
 mng_heavens_will_desc: "Pochodnia Niebios została przekazana naszej dynastii. Aby okazać się godnymi i posiąść potęgę Chin, musimy wykazać się doskonałością i kompetencją niezbędną do zreformowania oraz podporządkowania sobie kraju — czego przez długi czas nie zdołał dokonać żaden władca przed naszą dynastią. To prawdziwa próba łaski dla dzierżyciela Mandatu Niebios."
 mng_thirteen_provinces_title: "Trzynaście prowincji"
 mng_thirteen_provinces_desc: "Nasze stosunki z południowymi sąsiadami z Dai Viet były w ostatnich dziesięcioleciach bardzo burzliwe. Ich władcy zerwali więzi łączące ich z chińskim cesarzem. Musimy przypomnieć im, niezależnie od wybranych środków, komu winni są wierność."
 mng_end_sengoku_jidai_title: "Zakończ okres Sengoku"
 mng_end_sengoku_jidai_desc: "Japonia jest domem dla dzikich wojowników, żądnych władzy panów feudalnych i ducha wojny, który doprowadził do świtu ery Sengoku Jidai. Nie możemy tolerować chuligańskich i niebezpiecznych zachowań tak blisko naszych brzegów, dlatego musimy podjąć działania w celu zdobycia kontroli nad wyspą, bezpośrednio lub pośrednio."
 mng_form_depots_title: "Utwórz magazyny"
 mng_form_depots_desc: "Pomimo wyznaczenia lojalnych poddanych i okazania przychylności niebios, ludzie służący naszemu znamienitemu Cesarzowi mogą czasem paść ofiarą swojej ludzkiej natury. Aby temu przeciwdziałać, powinniśmy pójść naprzód i założyć agencje szpiegowskie, aby mieć oko na sprawy naszych poddanych i wewnętrzne interesy."
 mng_outer_city_beijing_title: "Zewnętrzne miasto [1816.GetName]"
 mng_outer_city_beijing_desc: "Miasto [1816.GetName] było sercem Chin, jako dom dla niezliczonej liczby ludzi w naszym królestwie. Rosnąca liczba ludności chce rozszerzenia planów miasta, co umożliwiłoby powiększenie przestrzeni życiowej w obszarze miejskim."
 mng_fortify_coast_title: "Ufortyfikuj wybrzeże"
 mng_fortify_coast_desc: "Nasze wybrzeża od dawna padają ofiarami bezsensownego piractwa. Nasi ludzie są ograbiani z ciężko zarobionych pieniędzy, a czasem nawet są uprowadzani do niewoli. Ta sytuacja jest nie do zniesienia i dlatego należy się nią zająć w bardzo drastyczny sposób."
 mng_decide_silk_road_route_2tt: "\nCzy powinniśmy zakończyć misję, powierzając ochronę §YSJedwabnego Szlaku§! sojusznikowi, który będzie cieszył się wzrostem swojej §Ywydajności handlowej§! przez §Y25§! lat"
 mng_decide_silk_road_route_tt: "Nasz zaufany sojusznik, który będzie strzec nowego §YSJedwabnego Szlaku§! zyska:"
 mng_kept_restrictions_tt: "Nałożył ograniczenia na Eunuchów w wydarzeniu '§YEunuchowie Imperium [Root.GetAdjective]§!'"
 mng_bow_to_eunuchs_tt: "Jeśli zdecydujemy się upoważnić §YEunuchów§!:"
 mng_palace_bureaucracy_benefits_tt: "Uchwalenie dekretu 'Rozszerz biurokrację pałacową' zapewni również §G-20%§! kosztu doradcy"
 mng_enable_3_grand_coordinators_offices_tt: "Umożliwia korzystanie z 3 §YBiur wielkiego koordynatora§! poprzez ekran §Gstanu§!"
 mng_less_than_3_with_leviathan_tt: "Jeśli wykonamy tę misję, gdy §YWielki Mur§! nie ma poziomu §Y3§!:"
 pol_alternatively_great_wall_expansion_tt: "\nAlternatywnie [698.GetName], [4223.GetName], [702.GetName], [2136.GetName], [1816.GetName] i [697.GetName] zyskają:"
 until_it_is_conquered_desc: "dopóki prowincja nie zostanie oblężona przez wrogą armię"
 mng_explo_ideas_tt: "Jeśli wykonamy misję gdy §Yidee eksploracyjne§! są aktywne:"
 mng_trade_ideas_tt: "\nJeśli wykonamy misję gdy §Yidee handlowe§! są aktywne:"
 mng_estates_govcap_now_grants_another_50_gov_cap_tt: "Czy powinniśmy wybrać §Ywspółpracę z klasami§! przyznając im prawa do naszych ziem, przywilej zostanie §Guzupełniony§! przez §Gobniżenie kosztów stabilności§! jak również:"
 mng_alternatively_pop_census_improved: "\nAlternatywnie, każdy §YDekret spisu ludności§! przyzna również §G+1§! miesięcznej władzy administracyjnej oraz:"
 mng_exam_system_reward_tt: "Jeśli zakończymy misję mając reformę rządową §Ysystem egzaminacyjny§! zyskamy:"
 mng_cmb_reward_tt: "\nAlternatywnie, jeśli zakończymy misję z jakąkolwiek inną reformą rządową poziomu 3, wydamy §R250§! postępu w reformach i zdobędziemy odpowiednią nagrodę:\n\n§MScentralizowana biurokracja§!: Zmniejszenie modyfikatora '§Yprzerost administracji§!' o §G-5%§! minimalnej autonomii"
 mng_db_reward_1_tt: "\n§MZdecentralizowana biurokracja§!:"
