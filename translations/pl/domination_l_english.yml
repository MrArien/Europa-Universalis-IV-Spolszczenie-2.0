 chi_subject_reward_tt: "Jeśli ukończymy misję poprzez zwiększenie §Yliczby§! naszych poddanych, będąc zarazem §YCesarzem Chin§!, otrzymamy §G10§! punktów Mandatu za każdego poddanego oraz następującą nagrodę:"
