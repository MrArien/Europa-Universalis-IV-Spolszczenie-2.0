 slowed_down_development: "Wstrzymany rozwój"
 desc_slowed_down_development: "Rozwój prowincji hamuje niewłaściwe zarządzanie administracją. Minie sporo czasu, zanim jej infrastruktura będzie mogła znacząco się rozbudować."
 regional_boom: "Regionalny boom gospodarczy"
 desc_regional_boom: "Prowincja przeżywa okres dobrobytu, bogactwa i nowych możliwości. Mieszkańcy radują się, wznosząc domy i rozbudowując miasto."
 capital_boom: "Boom gospodarczy w stolicy"
 desc_capital_boom: "Prowincja przeżywa okres dobrobytu, bogactwa i nowych możliwości. Mieszkańcy radują się, wznosząc domy i rozbudowując miasto."
 abandoned_fields: "Opuszczone pola"
 desc_abandoned_fields: "Chłopi opuścili pola uprawne w tej prowincji. Niezależnie od tego, czy uciekli, czy padli ofiarą katastrofy, brakuje już rąk do pracy."
 administrative_challenges: "Trudności administracyjne"
 desc_administrative_challenges: "Nasz rząd napotyka poważne trudności w zarządzaniu coraz bardziej autonomicznymi metropoliami. W rezultacie integracja nowych terytoriów będzie znacznie trudniejsza."
 talented_architect: "Utalentowany architekt"
 desc_talented_architect: "Państwo może korzystać z talentu wizjonerskiego architekta, którego pasja i ciężka praca przyczynią się do rozkwitu naszych miast."
 anglican_aspect: "Aspekt anglikański"
 desc_anglican_aspect: "W przeciwieństwie do wielu innych odłamów i nurtów protestantyzmu, anglikanizm stara się łączyć idee reformacji z tradycjami katolicyzmu.\n\nZyskujemy również §G+1§! do tolerancji heretyków na §Y10§! lat."
 anglican_aspect_aspect_modifier: "Gorliwość aspektu Kościoła"
 desc_anglican_aspect_aspect_modifier: "Wprowadzenie nowego aspektu naszej wiary zainspirowało lud do życia zgodnie z nowym kodeksem."
 spread_the_book_of_common_prayer: "§YUpowszechnienie Księgi Modlitw Powszechnych§!"
 desc_spread_the_book_of_common_prayer: "Księgi modlitewne tradycyjnie spisywano po łacinie, przez co zwykli ludzie musieli bezgranicznie ufać kaznodziejom. Dzięki upowszechnieniu Księgi Modlitw Powszechnych mieszkańcy naszego kraju mogą wreszcie uniezależnić się od duchowieństwa."
 flavor_kor.15.t: "Koniec Armii Sprawiedliwych"
 flavor_kor.15.d: "Armia Sprawiedliwych to oddziały koreańskich chłopów, którzy chwytają za broń, by bronić ojczyzny przed najeźdźcami. W czasie pokoju armia zostaje jednak rozwiązana, a chłopi wracają do pracy na roli."
 flavor_kor.15.a: "Ok"
 flavor_kor.16.t: "Tripitaka Koreana"
 flavor_kor.16.d: "Tripitaka Koreana to zbiór Tripitaki — świętych pism buddyjskich, które łącznie tworzą kanon buddyzmu. Teksty wyryto na drewnianych klockach drukarskich, stanowiących powód do dumy koreańskich uczonych i rzemieślników. Choć w 1232 roku zostały zniszczone przez pożar wzniecony podczas najazdu Mongołów, Tripitaka Koreana została odtworzona w 1249 roku.\nObecnie znajduje się w rękach państwa [Root.GetUsableName]. Jej dalszy los zależy od nas."
 flavor_kor.16.a: "Przenieśmy ją do prowincji [Root.Capital.GetName]."
 flavor_kor.16.b: "Spalmy ją."
 flavor_kor.16.c: "Oszczędźmy Tripitakę."
 tripitaka_koreana: "Tripitaka Koreana"
 desc_tripitaka_koreana: "Zbiór Tripitaki. Te drewniane klocki drukarskie zawierają święte pisma buddyjskie i są powodem do dumy koreańskich uczonych oraz rzemieślników."
 tripitaka_koreana_tt: "§YTripitaka Koreana§! zostanie usunięta z prowincji §Y[tripitaka_koreana_province.GetName]§!."
 flavor_kor.17.t: "Kradzież Tripitaki Koreana"
 flavor_kor.17.d: "Doszło do katastrofy: bramy prowincji [tripitaka_koreana_province.GetName] padły, otwierając drogę do Tripitaki Koreana. Wrogie wojska przejęły święty zbiór pism buddyjskich dla swojego bluźnierczego władcy [From.Monarch.GetName] i przygotowują się do przewiezienia go do prowincji [From.Capital.GetName]."
 flavor_kor.17.a: "To wielkie upokorzenie."
 reinforce_tripitaka_koreana_decision_title: "Wzmocnienie zabezpieczeń Tripitaki Koreana"
 reinforce_tripitaka_koreana_decision_desc: "Wrogowie państwa [Root.GetUsableName] czyhają na bezcenną Tripitakę Koreana. Nie możemy pozwolić, by dostali te pisma w swoje ręce. Musimy natychmiast wzmocnić jej zabezpieczenia!"
 tripitaka_koreana_defenses: "Zabezpieczenia Tripitaki Koreana"
 tripitaka_koreana_defenses_tt: "do momentu, gdy prowincję zdobędzie wróg wyznający religię z grupy §YWschodniej§!"
 evacuate_tripitaka_koreana_decision_title: "Ewakuacja Tripitaki Koreana"
 evacuate_tripitaka_koreana_decision_desc: "Nasz kraj jest atakowany! Tripitaka Koreana może wpaść w ręce wroga! Musimy natychmiast ewakuować ją do prowincji [Root.Capital.GetName]!"
 evacuate_tripitaka_koreana_decision_tt: "§YTripitaka Koreana§! zostanie przeniesiona do prowincji §Y[Root.Capital.GetName]§!."
 government_events.2.desc: "Jego Wysokość [Root.Monarch.GetTitle] [Root.Monarch.GetName] cieszy się opinią wybitnego [Root.Monarch.GetWomanMan] i nie ma sobie równych jako władca.\nWładca o takiej randze i pozycji jak [Root.Monarch.GetHerHisCap] Mość ma kilkoro zdolnych dzieci, z których wiele rokuje nadzieje na przyszłych władców. Nasi doradcy zgodnie twierdzą, że najwyższy czas, aby [Root.Monarch.GetName] wskazał faworyta spośród potencjalnych następców."
 government_events.3.t: "Wybór nowego władcy"
 government_events.3.desc: "Wraz ze śmiercią naszego poprzedniego monarchy krąg doradców [Root.GetGovNameGen] zebrał się, aby wybrać następnego władcę [Root.GetAdjective]."
 government_events.3.a: "Wybierzmy [Root.Monarch.GetName]."
 government_events.3.aa: "Wybierzmy [Root.Heir.GetName]."
 government_events.3.b: "Wybierzmy kogoś z rodu [selected_biggest_country.Monarch.Dynasty.GetName]."
 government_events.3.c: "Korona od naszej szlachty."
 government_events.3.d: "Nasz generał byłby świetnym władcą."
 government_events.3.e: "Tylko admirał może rządzić w [Root.GetGovNameIns]."
 government_events.3.f: "Wybierzmy wpływowego kupca."
 government_events.3.g: "Ktoś z rodu [Root.Monarch.Dynasty.GetName] przejmie władzę."
 decadence.1.t: "Katastrofalne przeciążenie administracji"
 decadence.1.desc: "Państwo [Root.GetUsableNameCap] stoi przed jednym z największych wyzwań administracyjnych w swojej historii. Liczne nowo podbite terytoria wymagają uwagi całej administracji państwa [Root.GetAdjective]. W rezultacie zarządzanie prowincjami pozostawia wiele do życzenia, a lokalna korupcja stała się powszechnym zjawiskiem."
 decadence.1.a: "Nasze państwo sobie z tym poradzi."
 decadence.1.b: "Musimy rozbudować administrację!"
 decadence.2.t: "Wyczerpanie wojną"
 decadence.2.desc: "Wojna pustoszy nasze ziemie. Chłopi, mieszczanie, kupcy — cała ludność niższych warstw musi dźwigać na swoich barkach ciężar śmierci. Tymczasem elity na dworze państwa [Root.GetAdjective] pozostają głuche na cierpienia zwykłych ludzi."
 decadence.2.a: "Jaka wojna? W prowincji [Root.Capital.GetName] nie ma żadnej wojny."
 decadence.2.b: "Powinniśmy ulżyć naszym poddanym w ciężarach wojny."
 decadence.3.t: "Przeciążona administracja"
 decadence.3.desc: "Państwo [Root.GetAdjective] z trudem utrzymuje sprawne funkcjonowanie ustroju [Root.GovernmentName]. Pobieranie podatków oraz egzekwowanie prawa i porządku w prowincjach przygranicznych jest niemal niemożliwe. Niepokoje i bezprawie szerzą się w państwie [Root.GetUsableName], podczas gdy [Root.Monarch.GetTitle] beztrosko zasiada na swoim tronie."
 decadence.3.a: "To problemy plebsu, a nie dworu."
 decadence.3.b: "Musimy szybko rozwiązać te problemy."
 decadence.4.t: "Wielka katastrofa"
 decadence.4.desc: "Państwo [Root.GovernmentName] pogrążyło się w całkowitym chaosie! Autorytet [Root.Monarch.GetTitle] jest zagrożony, a niegdyś dumne państwo [Root.GetUsableName] pogrąża się w nieładzie wywołanym przez katastrofę [Root.GetActiveDisaster]."
 disaster: "Katastrofa"
 decadence.4.a: "Problemy związane z katastrofą [Root.GetActiveDisaster] rozwiążą się same."
 decadence.5.t: "Stan [Root.GetEstate80i30l] przejmuje kontrolę nad państwem"
 decadence.5.desc: "Jeden ze stanów urósł w siłę i przejął niemal pełną kontrolę nad rządem. Podczas gdy inni władcy uznaliby to za tragedię, [Root.Monarch.GetName] dostrzega w tym okazję, by odpocząć i pozwolić innym rządzić państwem w [Root.Monarch.GetHerHis] imieniu."
 decadence.5.a: "Dopóki dobrze zarządzają państwem [Root.GovernmentName]..."
 decadence.5.b: "Odsuńmy ich od władzy!"
 estate: "Stan"
 decadence.6.t: "Korupcja państwa"
 decadence.6.desc: "Sprawy państwowe stają się coraz mniej istotne dla dworu w prowincji [Root.Capital.GetName]. Skarbiec służy wzbogacaniu zamożnych elit, a prawo omija się dzięki łapówkom i korupcji w administracji."
 decadence.6.a: "Łapówki? A gdzie nasza część?"
 decadence.6.b: "To nie może trwać!"
 decadence.7.t: "Chaos religijny"
 decadence.7.desc: "W państwie [Root.GetUsableName] narastają napięcia religijne. Heretycy, innowiercy i wyznawcy dziwacznych rytuałów zagrażają pokojowi w naszym państwie [Root.GovernmentName], podczas gdy dwór przygląda się sytuacji..."
 decadence.7.a: "Zostawmy ich w spokoju. Nikomu nie zagrażają."
 decadence.7.b: "Połóżmy kres temu zagrożeniu ze strony innowierców. W razie potrzeby siłą."
 decadence.8.t: "Upadek z piedestału"
 decadence.8.desc: "Państwo [Root.GetUsableNameCap] było niegdyś świetlistą latarnią świata i szanowanym wielkim mocarstwem. Dziś jest jedynie pośmiewiskiem dla nowych, wschodzących potęg. Dwór [Root.GetAdjective] doskonale zdaje sobie sprawę z opłakanego położenia państwa [Root.GetUsableName] na arenie międzynarodowej, lecz wciąż nie podjęto żadnych działań, by poprawić naszą reputację..."
 decadence.8.a: "Kogo obchodzą opinie głupców?"
 decadence.8.b: "Zreformujmy nasz dwór!"
 decadence.9.t: "Kwestia autorytetu"
 decadence.9.desc: "Rządy [Root.Monarch.GetName] od samego początku sprawowania urzędu [Root.Monarch.GetTitle] w państwie [Root.GovernmentName] są co najwyżej niestabilne, a dwór nie podejmuje niemal żadnych działań, by poprawić wizerunek niezbyt popularnego [Root.Monarch.GetTitle]."
 decadence.9.a: "Reputacja to nie wszystko."
 decadence.9.b: "Zorganizujmy paradę ku czci [Root.Monarch.GetTitle]."
 decadence.10.t: "Niestabilna gospodarka"
 decadence.10.desc: "Utrzymanie dworu państwa [Root.GetUsableName] pochłania znaczną część skarbca. W rezultacie niewiele środków pozostaje dla gospodarki państwa [Root.GetAdjective], która od lat znajduje się w fazie stagnacji..."
 decadence.10.a: "Wybijmy więcej dukatów."
 decadence.10.b: "Musimy zreformować naszą gospodarkę."
 jap_balance_shinokosho_title: "Przywrócenie równowagi shinōkōshō"
 jap_balance_shinokosho_desc: "Społeczeństwo japońskie tradycyjnie opiera się na istnieniu czterech grup: wojowników, rolników, rzemieślników i kupców. Utrzymanie równowagi między nimi zapewni naszemu państwu wielką stabilność."
 jap_expand_gokaido_title: "Rozbudowa Gokaidō"
 jap_expand_gokaido_desc: "Choć nasi wewnętrzni przeciwnicy zostali już pokonani, musimy nadal trzymać lokalnych władców w ryzach. Budowa nowej sieci dróg i stacji pocztowych ułatwi dotarcie ze stolicy do domen daimyō, a przy okazji pobudzi lokalny handel wzdłuż tych szlaków."
 jap_nanban_trade_title: "Handel Nanban"
 jap_nanban_trade_desc: "Przybycie ludzi Zachodu na nasze wybrzeża wyraźnie pokazało znaczenie handlu. Rozbudowa możliwości naszego rynku z pewnością przyniesie nam znaczne zyski."
 jap_conquer_south_china_title: "Podbój południowych Chin"
 jap_conquer_south_china_desc: "Południowe ziemie Chin od zawsze stanowiły źródło ogromnych bogactw. Przejęcie ich pozwoli nam jeszcze bardziej rozszerzyć nasze wpływy."
 jap_maraka_kaikyou_title: "Cieśnina Malakka"
 jap_maraka_kaikyou_desc: "Cieśnina Malakka jest kluczowym punktem, przez który przepływa handel. Musimy ją kontrolować, aby przejąć kontrolę nad tym szlakiem."
 jap_edo_jidai_title: "Epoka Edo"
 jap_edo_jidai_desc: "Musimy objąć kontrolą całe państwo, aby pod naszym światłym przywództwem mogło cieszyć się długim okresem pokoju, dobrobytu i stabilności."
 jap_five_regent_houses_title: "Pięć rodów regentów"
 jap_five_regent_houses_desc: "Urząd regenta tradycyjnie pozostaje w rękach pięciu rodów klanu Fujiwara. Powinniśmy przeciągnąć je na naszą stronę i wykorzystać dla własnych korzyści albo raz na zawsze się z nimi rozprawić."
 jap_port_dejima_title: "Port na Dejimie"
 jap_port_dejima_desc: "Na dworze pojawił się pomysł dotyczący ludzi Zachodu: zbudowania dla nich sztucznej wyspy-portu u wybrzeży Nagasaki, aby mogli swobodnie prowadzić tam handel. Nie będzie to łatwe przedsięwzięcie, ale z pewnością pozwoli zwiększyć napływ towarów, a jednocześnie zachować nad nim ścisłą kontrolę."
 jap_fate_mandate_title: "Mandat, by rządzić wszystkimi"
 jap_fate_mandate_desc: "Wielki chiński Smok od zawsze stanowił wiszące nad nami zagrożenie. Nadszedł czas, aby japoński Tygrys wreszcie pokazał tej jaszczurce, gdzie jego miejsce."
 jap_imjin_war_title: "Wojna Imjin"
 jap_imjin_war_desc: "Korea od dawna jest sztyletem wymierzonym w gardło Japonii. Nadszedł czas, by wreszcie przeprawić się przez morze i zapewnić sobie silną oraz bezpieczną pozycję na półwyspie."
 jap_hegemon_of_asia_title: "Hegemon Azji"
 jap_hegemon_of_asia_desc: "Zadaliśmy już Chinom potężny cios i jasne jest, że zajęliśmy ich miejsce jako największa potęga regionu. Musimy w pełni umocnić naszą dominację, aby wszyscy wiedzieli, kto jest prawdziwym hegemonem całej Azji."
 jap_issue_new_coin_title: "Emisja nowych monet Erizeni-Rei"
 jap_issue_new_coin_desc: "Zdrowe finanse są fundamentem stabilnych rządów. Aby utrzymać porządek i zapewnić ciągłość handlu, musimy zadbać o stały obieg pełnowartościowych monet w państwie."
 jap_permit_ryogaesho_title: "Zezwolenie na działalność ryōgaesho"
 jap_permit_ryogaesho_desc: "Wiele domen daimyō zmaga się z niestabilną sytuacją finansową, przez co niektórzy władcy nie spłacają zaciągniętych pożyczek. Umożliwienie mniejszym kantorom udzielania pewniejszych pożyczek, zabezpieczonych naszymi rezerwami, powinno ustabilizować finanse daimyō i być może przyczynić się do rozwoju zdrowszej gospodarki krajowej."
 jap_survey_secret_fields_title: "Lustracja ukrytych pól"
 jap_survey_secret_fields_desc: "W prowincjach niepokojąco często spotyka się tak zwane „ukryte pola” — grunty rolne, które chłopi ukrywają przed poborcami podatkowymi. Dokładna inwentaryzacja tych niezgłoszonych gruntów powinna znacząco poprawić kondycję naszej gospodarki i skarbca."
 jap_encourage_fudasashi_title: "Wsparcie fudasashi"
 jap_encourage_fudasashi_desc: "Ryż od zawsze stanowił podstawę naszego systemu gospodarczego. W ostatnich latach niektóre grupy kupców zaczęły zakładać magazyny, w których przechowują ryż daimyō w zamian za opłatę. Wystawiają pokwitowania i zaczęły również udzielać pożyczek. System ten ma ogromny potencjał, dlatego powinniśmy go wspierać i czerpać z niego korzyści."
 jap_discover_new_world_title: "Odkryj Nowy Świat"
 jap_discover_new_world_desc: "Jesteśmy Krajem Wschodzącego Słońca, ale krążą pogłoski o innych krainach, leżących daleko poza nami, we wszystkich kierunkach, nawet na wschodzie. Musimy wyruszyć, aby sprawdzić, czy te pogłoski są prawdziwe."
 jap_conquer_north_china_title: "Połóż kres fałszywemu cesarzowi"
 jap_conquer_north_china_desc: "Północne Chiny są kolebką i centrum chińskiego imperium. Ich cesarze mieli niegdyś czelność uważać się za naszych zwierzchników. Najwyższy czas położyć kres ich farsie zwanej imperium i zająć ziemie stanowiące jego historyczne serce."
 jap_new_buddha_title: "Nowy Budda?"
 jap_new_buddha_desc: "Niedawno na nasze wybrzeża przybyli dziwni ludzie z Zachodu, opowiadając o czymś, co początkowo wydawało się kolejną odmianą buddyzmu. W rzeczywistości była to zupełnie inna religia, niezwiązana z buddyzmem, która wywołała w naszym kraju wielkie poruszenie. Musimy zakończyć ten konflikt religijny, aby zjednoczyć lud pod wspólną wiarą."
 jap_shinto_or_christian_title: "Misja dynamiczna"
 jap_shinto_or_christian_desc: "Treść tej misji zależy od tego, czy przyjmiemy katolicyzm, czy pozostaniemy przy shintō."
 jap_restoration_title: "[Root.GetPreviewColorJAP_RELI]Równowaga sił[Root.GetPreviewColorJAP_RELI_end]"
 jap_restoration_desc: "Od zakończenia wojny Genpei w 1185 roku władza w tym kraju spoczywa w rękach samurajów. Zjednoczenie państwa pod naszym przywództwem doprowadziło do powstania niezwykle zamożnego szogunatu, lecz Jego Cesarska Mość nadal mieszka w swoim pałacu. Inni cesarze próbowali już w przeszłości odzyskać kontrolę nad rządami, a jednemu z nich udało się to nawet na pewien czas. Stanowi to nieustanne zagrożenie dla naszej władzy, o którym musimy pamiętać. Z drugiej strony być może powrót cesarza do sprawowania rządów nie jest wcale takim złym pomysłem."
 jap_spread_the_christian_faith_title: "[Root.GetPreviewColorJAP_RELI]Szerzenie wiary chrześcijańskiej[Root.GetPreviewColorJAP_RELI_end]"
 jap_spread_the_christian_faith_desc: "Zachodni ojcowie przekonali nas o błędach naszych dotychczasowych wierzeń i wskazali nam światło Jezusa. Teraz nasza kolej, by nieść Jego światło do wszystkich zakątków Azji."
 jap_bugeijuuhappan_title: "[Root.GetPreviewColorJAP]Bugei Jūhappan[Root.GetPreviewColorJAP_end]"
 jap_bugeijuuhappan_desc: "Bugei Jūhappan, czyli osiemnaście sztuk walki, które każdy samuraj powinien opanować, od zawsze stanowi dumę i tradycję naszych wojsk. Jednak po długim okresie wojen domowych i nastaniu pokoju wewnętrznego część młodszego pokolenia samurajów zaczyna zaniedbywać treningi. Musimy nadal rozwijać szkolenie we wszystkich osiemnastu sztukach walki, aby nasi samurajowie osiągnęli najwyższy poziom bushidō."
 jap_bugeijuuhappan_or_naval_academy_of_japan_title: "Misja dynamiczna"
 jap_bugeijuuhappan_or_naval_academy_of_japan_desc: "Treść tej misji zależy od tego, czy zdecydujemy się rozwinąć armię, czy marynarkę wojenną."
 jap_naval_academy_of_japan_title: "[Root.GetPreviewColorJAP]Nowa akademia morska[Root.GetPreviewColorJAP_end]"
 jap_naval_academy_of_japan_desc: "Mimo że jesteśmy państwem wyspiarskim, dotychczas nie przywiązywaliśmy większej wagi do znaczenia silnej floty. Jeśli chcemy naprawdę rozszerzyć nasze wpływy poza naturalne granice, musimy zainwestować w potężną i skuteczną marynarkę wojenną."
 jap_strengthen_bakuhan_system_title: "Umocnienie systemu bakuhan"
 jap_strengthen_bakuhan_system_desc: "System bakuhan, dzielący ziemie między szogunat a lokalnych panów feudalnych, obowiązuje od czasu zjednoczenia kraju. Musimy w pełni wykorzystać jego możliwości dla dobra naszego państwa."
 jap_deploy_atakebune_title: "Wprowadzenie do służby atakebune"
 jap_deploy_atakebune_desc: "Nasze okręty zawsze były raczej niewielkie i mało imponujące. Nadszedł czas, by zbudować prawdziwe okręty wojenne — potężne, pływające fortece zdolne do transportowania armii. Możemy nawet pokryć je żelaznymi płytami, aby stały się niemal niezniszczalne."
 jap_surpass_the_west_title: "Prześcignięcie Zachodu"
 jap_surpass_the_west_desc: "Nasza marynarka wojenna jest już godna tej nazwy, lecz musimy uzyskać zdecydowaną przewagę nad państwami Zachodu we wszystkich aspektach wojny morskiej. W przeciwnym razie możemy pewnego dnia ujrzeć u wejścia do zatoki Edo ich potężne kanonierki."
 jap_bushido_code_title: "Bushidō"
 jap_bushido_code_desc: "Postępowaniem naszych wojowników zawsze kieruje spójna filozofia cnót i właściwego zachowania."
 jap_train_samurai_title: "Szkolenie samurajów"
 jap_train_samurai_desc: "Samurajowie stanowią trzon naszych sił zbrojnych. Musimy dalej doskonalić ich wyszkolenie, aby żadne inne państwo nie miało szans nam się przeciwstawić."
 jap_proliferation_firearms_title: "Upowszechnienie broni palnej"
 jap_proliferation_firearms_desc: "Broń palna stała się w naszym kraju powszechna, a jej użyteczność jest niezaprzeczalna. Musimy zwiększyć jej produkcję, jeśli nie chcemy pozostać w tyle za naszymi wrogami."
 jap_tanegashima_teppo_title: "Tanegashima-teppō"
 jap_tanegashima_teppo_desc: "Nowy typ arkebuza lontowego, wzorowany na broni odzyskanej z wyspy Tanegashima, okazał się ogromnym ulepszeniem dla wszystkich naszych armii. Musimy jeszcze bardziej zwiększyć jego produkcję, aby dysponować większą liczbą sztuk broni niż jakiekolwiek inne państwo."
 jap_miyadaiku_method_title: "Metoda miyadaiku"
 jap_miyadaiku_method_desc: "Tradycyjne techniki japońskiego ciesielstwa stanowią powód do dumy naszych rzemieślników. Wznoszenie imponujących budowli wyłącznie za pomocą drewnianych połączeń, bez użycia choćby jednego gwoździa, wprawia w zdumienie każdego cudzoziemca. To właśnie te przekazywane z pokolenia na pokolenie techniki pozwalają budowlom przetrwać całe stulecia. Wspierając tych rzemieślników, zapewnimy trwałość naszego państwa na kolejne wieki."
 jap_financial_cliques_title: "Kliki finansowe"
 jap_financial_cliques_desc: "Większość produkcji w kraju znajduje się w rękach najpotężniejszych i najbardziej wpływowych rodzin kupieckich. Powinniśmy zacieśnić z nimi więzi i finansować rozbudowę oraz rozwój produkcji, aby czerpać z niej jeszcze większe korzyści."
 jap_japanese_economic_miracle_title: "Cud gospodarczy"
 jap_japanese_economic_miracle_desc: "Po nieustannych wojnach i walkach wewnętrznych, które trapiły nasz kraj, udało nam się odbudować. Teraz musimy rozwinąć gospodarkę do tego stopnia, aby stała się obiektem zazdrości wszystkich państw świata."
