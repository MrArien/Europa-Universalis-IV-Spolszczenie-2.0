 governmental_power: "Władza absolutna"
 governmental_power_desc: "Władza absolutna wzrasta lub maleje w zależności od naszych działań związanych z [Root.GetParliamentOrFallbackName].

Władza absolutna wzrasta, gdy:
 - Unieważniamy debatę parlamentarną: §Y+20§!
 - Tracimy miejsce w parlamencie: §Y+5§!
 - Przegrywamy debatę parlamentarną: §Y+33§!

Władza absolutna maleje, gdy:
 - Wygrywamy debatę parlamentarną: §Y-20§!
 - Przyznajemy miejsce w parlamencie: §Y-5§!

Przy wartości §Y100§! otrzymujemy następujące efekty:
    Maksymalny absolutyzm: §G+50,00§!
    Miesięczna zmiana autonomii: §G-0,20§!
    Niepokoje narodowe: §R+4,00§!

Przy wartości §Y-100§! otrzymujemy następujące efekty:
    Niepokoje narodowe: §G-4,00§!
    Koszt idei: §R+10,0%§!
    Lata separatyzmu: §R+10§!
    Roczny absolutyzm: §G+1,00§!"
