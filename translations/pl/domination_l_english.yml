 fra_if_bur_subject_and_emperor_dlc_tt: "\nJeśli ukończymy tę misję, gdy @BUR Burgundia jest poddanym niebędącym graczem:"
 fra_alternatively_10_dev_spread_and_tt: "§G10§! rozwoju £adm£ £dip£ £mil£ zostanie rozdzielone w prowincjach §YBurgundii§!, a także:"
 fra_alternatively_10_dev_spread_and_2tt: "\n§G10§! rozwoju £adm£ £dip£ £mil£ zostanie rozdzielone w prowincjach §YBurgundii§!, a także:"
 fra_complete_via_opinion_alliance_and_trust_tt: "\nOstatecznie, jeśli ukończymy misję dzięki opinii i sojuszowi z koroną @BUR burgundzką, będzie bardziej prawdopodobne, że staną po naszej stronie, gdy rozpocznie się incydent cesarski §YBurgundzkie dziedzictwo§! "
 fra_enable_war_on_the_empire_cb_tt: "Odblokowuje casus belli „§YWojna z Cesarstwem§!”, który pozwala nam podbijać ziemie cesarskie §Yniższym kosztem§!."
 fra_if_completed_via_control_tt: "Jeśli ukończymy misję po §Gobleganiu§! prowincji podczas wojny, zażądanie ich w traktacie pokojowym będzie znacznie tańsze."
 fra_alternatively_lose_10_devastation_and_gain_tt: "\nAlternatywnie, jeśli ukończymy misję w czasie pokoju, poziom spustoszenia w obu prowincjach spadnie o §G10§!, a ponadto:"
 fra_every_french_province_changes_to_francien_tt: "Cała grupa kultur §Yfrancuskich§! zostanie zasymilowana z kulturą §Yfrankijską§!, co przyczyni się do upowszechnienia koncepcji §Ylingua franca§!."
 fra_if_possible_gain_empire_else_10_permanent_pp_tt: "\nJeśli ukończymy tę misję, nie mając rangi §RCesarstwa§!, uzyskamy rangę cesarstwa. W przeciwnym razie otrzymamy §G10§! stałej projekcji siły."
 fra_if_pro_190_opinion_and_100_trust_tt: "\nJeśli ukończymy misję, gdy @PRO Prowansja jest naszym poddanym, ma do nas co najmniej §G190§! opinii i §G100§! zaufania, otrzymamy następującą nagrodę:"
 fra_if_alliance_tt: "Jeśli ukończymy misję drogą §Mdyplomatyczną§!:"
 fra_if_conquest_tt: "\nJeśli ukończymy misję drogą §Mpodboju§!:"
 fra_alternatively_if_pro_already_subject_tt: "\nW przeciwnym razie, jeśli @PRO Prowansja jest już naszym §Mpoddanym§!:"
 fra_revolving_missions_based_on_choice: "§YOtrzymamy nowe misje zależnie od sposobu ukończenia tego zadania§!"
 fra_if_align_with_pope_tt: "\nJeśli opowiemy się po stronie @PAP papieża, za każdym razem, gdy zostanie ogłoszona nowa §Ybulla papieska§!, otrzymamy §G25§! losowych punktów monarchy i §G10§! wpływów papieskich, a także:"
 fra_defying_the_pope_tt: "\nJeśli jednak zdecydujemy się przeciwstawić @PAP papieżowi:"
 fra_if_align_pope_protector_of_catholicism_about_defender_of_faith_tt: "Opowiedzenie się po stronie papieża pozwoli nam stać się mieczem i tarczą całego §Yświata chrześcijańskiego§!."
 fra_if_defy_pope_crown_of_naples_tt: "\nJeśli natomiast przeciwstawimy się papieżowi, umocnimy nasze panowanie nad @NAP §YNeapolem§!."
 fra_if_align_pope_restore_outremer_tt: "Opowiedzenie się po stronie papieża pozwoli nam przywrócić §YOutremer§!."
 fra_if_defy_pope_city_of_lights_tt: "\nJeśli natomiast przeciwstawimy się papieżowi, otrzymamy specjalne premie i kontrolę nad [118.GetName] — §YMiastem Świateł§!."
 fra_if_align_pope_piglrimage_jerusalem_tt: "Opowiedzenie się po stronie papieża umożliwi nam odbycie pielgrzymki do @KOJ §YJerozolimy§! i przywrócenie dawnych granic państw krzyżowców."
 fra_if_defy_pope_milanese_succession_tt: "\nJeśli natomiast przeciwstawimy się papieżowi, przejmiemy kontrolę nad domeną mediolańską."
 fra_mlo_wont_cost_dip_tt: "§YUnia personalna§! z @MLO Mediolanem nie będzie zajmować miejsca w limicie stosunków dyplomatycznych."
 fra_every_country_weare_not_allied_with_in_italy_spy_upon_them_tt: "\nW pełni §Gzinfiltrujemy§! dwory każdego §Ywłoskiego§! państwa, które nie jest z nami sprzymierzone."
 fra_if_not_catholic_tt: "Jeśli ukończymy tę misję, nie będąc wyznawcami §Mkatolicyzmu§!, nasz władca otrzyma cechę §MLegendarnego zdobywcy§!, o ile jest to możliwe, a ponadto:"
 fra_restraint_wont_cost_pi_and_no_dip_penalty_and_ruler_papal_puppetmaster_tt: "Jeśli ukończymy tę misję jako wyznawcy §Mkatolicyzmu§!, nasz podbój prowincji [118.GetName] zostanie zalegalizowany i nie spowoduje żadnych §Mkar dyplomatycznych§! ani §Mkar papieskich§!."
 fra_stronger_than_any_cath_tt: "Posiada większą armię niż jakiekolwiek państwo §Ykatolickie§!."
 fra_religious_cb_on_every_muslim_gp_tt: "\nOtrzymamy casus belli §YŚwięta wojna§! przeciwko każdemu §Ymuzułmańskiemu§! mocarstwu, nawet jeśli nie graniczy ono z naszym państwem."
 fra_if_we_complete_mission_while_allied_or_subject_and_175_opinion_and_100_trust_access_to_holy_orders_tt: "\nJeśli ukończymy tę misję, mając iberyjskiego §Ypoddanego§! lub §Ysojusznika§!, który ma do nas co najmniej §Y190§! opinii i §Y100§! zaufania, uzyskamy dostęp do mechaniki chrześcijańskich §YZakonów Świętych§!."
 fra_country_or_subject_or_overlord_owns_tt: "Należy do §Ynas§!, naszego poddanego niebędącego państwem trybutarnym lub naszego §Ysuwerena§!."
 fra_if_choose_to_destroy_empire_tt: "Jeśli zdecydujemy się zniszczyć §YŚwięte Cesarstwo Rzymskie§!, ta misja poprowadzi nas ku rozszerzeniu §Ywschodnich granic niemieckich§! i utworzeniu §Yfrancuskiej strefy buforowej§!."
 fra_if_choose_to_lead_empire_tt: "\nJeśli jednak wybierzemy drogę przywództwa w §YŚwiętym Cesarstwie Rzymskim§!, misja pozwoli nam wpłynąć na §Yelektorów§! i doprowadzić nawet do nowego §Yincydentu cesarskiego§!."
 fra_if_choose_to_break_habsburg_ring_by_conquering_swaths_of_the_germanic_provinces_tt: "Jeśli zdecydujemy się podbić §YŚwięte Cesarstwo Rzymskie§!, ta misja poprowadzi nas do opanowania znacznych obszarów §YPółnocnych§! i §YPołudniowych Niemiec§!."
 fra_if_choose_to_claim_emperorship_and_gain_unique_bonuses_that_will_help_us_shape_empire_tt: "\nJeśli jednak zdecydujemy się odzyskać dziedzictwo Karola Wielkiego, ta ścieżka pomoże nam zdobyć tytuł §Ycesarza§! i zapewni po drodze wyjątkowe premie, które pozwolą nam na nowo ukształtować historię naszego państwa."
 fra_if_choose_declaratio_galica_tt: "Jeśli zdecydujemy się wkroczyć na ziemie niemieckie jako zdobywcy, ta misja zapewni nam potężne premie i dostęp do mechaniki §Yhegemonii militarnej§!."
 fra_if_choose_return_italy_to_hre_and_unique_mercenary_bonuses_tt: "\nAlternatywnie, ścieżka §Ycesarska§! pomoże nam przywrócić ziemie §YKrólestwa w Cieniu§! do Cesarstwa, a nagrodą będzie wyjątkowa mechanika."
 fra_if_choose_dismantle_hre_tt: "Jeśli zdecydujemy się wystąpić przeciwko §YŚwiętemu Cesarstwu Rzymskiemu§!, misja umożliwi nam jego rozwiązanie oraz wykorzystanie §Yniemieckich§! migrantów do zwiększenia rozwoju innych ziem."
 fra_if_choose_expand_the_versailles_as_the_center_of_military_operations_in_the_empire_and_solidify_our_dip_tt: "\nJeśli jednak staniemy na czele §YCesarstwa§!, będziemy mogli uczynić Wersal centrum operacji wojskowych całej naszej domeny politycznej, a także umocnić nasze działania dyplomatyczne w całym §YCesarstwie§!."
 fra_upgrade_buildings_tt: "Infrastruktura §Ymorska§! w prowincji [125.GetName] zostanie zmodernizowana przed czasem."
 fra_organize_raid_parties_for_20_years_tt: "Przez następne §G20§! lat będziemy mogli organizować wyprawy §Yłupieżcze na wybrzeża§!."
 fra_if_knights_exist_gain_tt: "Jeśli Zakon Joannitów @KNI §Rnie istnieje§!:"
 fra_alternatively_tt: "\n§TAlternatywnie§!:"
 fra_exploitation_of_neapolitan_lands_tt: "Eksploatacja naszych neapolitańskich ziem może doprowadzić do przesiedlenia ludności — mieszkańcy domeny neapolitańskiej zostaną przeniesieni do Francji kontynentalnej jako siła robocza w systemie feudalnym."
 fra_if_diplomacy_tt: "Jeśli zdecydujemy się ukończyć tę misję drogą §Mdyplomatyczną§!, zarówno my, jak i wyznaczony przez nas iberyjski §Msojusznik§! otrzymamy:"
 fra_as_long_as_we_maintain_the_alliance_desc: "dopóki utrzymujemy nasz sojusz"
 fra_obtain_new_missions_based_on_choice_tt: "\nOdblokowuje nową misję zależnie od naszego wyboru."
