 desc_allow_local_banners_modifier: " "
 flavor_mng.27.t: "Niezłomny obrońca"
 flavor_mng.27.d: "W godzinie próby, gdy stanęliśmy w obliczu śmiertelnie groźnych wrogów, jeden człowiek podjął się obrony naszej stolicy i ocalił dynastię przed popadnięciem w niepamięć. Yu Qian, skromny urzędnik naszego dworu wojskowego, objął dowództwo nad obroną stolicy i przez wiele tygodni odpierał kolejne fale nieprzyjaciół, aż nadeszły posiłki."
 flavor_mng.27.a: "Należy mu się awans."
 flavor_mng.27.b: "Przyszli dowódcy powinni studiować jego taktykę."
 flavor_mng.27.c: "Uwiecznijmy jego legendę na kartach historii."
 flavor_mng.28.t: "Wielki Urząd Nadzoru [Root.GetName]"
 flavor_mng.28.d: "Cenzorat jest niezwykle skuteczną i wpływową instytucją naszego rządu. Podlegając bezpośrednio Cesarzowi, ma przede wszystkim rozszerzać jego władzę i czujny nadzór na wszystkie szczeble administracji. Sporządza szczegółowe raporty o postępowaniu urzędników dworskich, wykrywa korupcję i stoi na straży moralności. Ostatnie usprawnienia administracyjne pozwoliły nam jeszcze bardziej rozwinąć jeden z obszarów działalności Cenzoratu, zapewniając tym samym należyte postępowanie naszych poddanych."
 flavor_mng.28.a: "§GUrząd Pałacowy§! egzekwujący kodeks postępowania okaże się niezwykle przydatny."
 flavor_mng.28.b: "§YUrząd Napomnień§! dopilnuje przestrzegania właściwych procedur zgodnych z prawem boskim."
 flavor_mng.28.c: "§lWędrowni cenzorzy§! zaprowadzą ład i spokój w całym naszym państwie."
 flavor_mng.28.e: "Nikt nie będzie faworyzowany."
 flavor_mng.29.t: "Absolutyzm w Cesarstwie Mingów"
 flavor_mng.29.d: "W naszych rodzimych krainach od dawna rządziły rozmaite dynastie. Żadna z nich nie zdołała jednak wykorzystać ich prawdziwego potencjału, przytłoczona ogromem swojego państwa. Po raz pierwszy w dziejach nasza dynastia może ogłosić, że całe jej terytorium rzeczywiście podlega cesarzowi i jego niekwestionowanej władzy. Stało się to możliwe przede wszystkim dzięki rozwojowi absolutyzmu i osłabieniu wewnętrznych stronnictw w naszym państwie."
 flavor_mng.29.a: "Cesarz dzierży najwyższą władzę!"
 flavor_mng.30.t: "Keju"
 flavor_mng.30.d: "Staranny dobór biurokratów i urzędników ma kluczowe znaczenie dla imperium tak wielkiego jak nasze. Aby zapewnić sobie odpowiednio liczną grupę zdolnych i przenikliwych ludzi, udoskonaliliśmy cesarski system egzaminacyjny, znany również jako Keju, dostosowując go do potrzeb naszej dynastii. Egzaminy gwarantują, że wszyscy urzędnicy znają zasady kaligrafii i etykiety pisarskiej, chińskie klasyki literackie oraz różne style komunikacji stosowane przez urzędników państwowych. Wspólne standardy umocnią jedność naszego państwa i będą sprzyjać realizacji ideału merytokracji, stanowiącego jeden z fundamentów naszej dynastii. System egzaminacyjny odegra zatem istotną rolę w ograniczaniu wpływów dziedzicznej arystokracji i dowódców wojskowych oraz w rozwoju warstwy uczonych urzędników."
 flavor_mng.30.a: "Najlepsi z najlepszych w służbie cesarza!"
 flavor_mng.31.t: "Ewolucja systemu trybutarnego"
 flavor_mng.31.d: "Trybut od dawna stanowi element relacji między cesarzem Chin a jego poddanymi. Jednak wszystko z czasem się zmienia, a wraz z nim ewoluują sposoby wymiany władzy i trybutu z lordami oraz wodzami pozostającymi pod naszą opieką. Ostatnie zmiany w zasadach dyplomatycznych, określających obowiązki obu stron, utorowały nam drogę do wywierania silniejszej presji na państwa podległe, by płaciły wyższy trybut!"
 flavor_mng.31.a: "Czasy się zmieniają!"
 flavor_mng.32.t: "Wejście na górę Paektu"
 flavor_mng.32.d: "Położona między ziemiami Korei a dzikimi plemionami Dżurdżenów góra Paektu zachwyca niezwykłym pięknem przyrody. Strzeże dostępu do czystych wód i bujnej roślinności, a jej zbocza mają również wielkie znaczenie religijne. Według tradycji właśnie tutaj urodził się Dangun, założyciel Gojoseon, pierwszej koreańskiej dynastii."
 flavor_mng.32.a: "Dar, na którym zbudujemy naszą przyjaźń!"
 flavor_mng.32.b: "Era koczowników dobiega owocnego końca..."
 flavor_mng.33.t: "Szkoła Karma Kagyu i dynastia [From.Monarch.Dynasty.GetName]"
 flavor_mng.33.d: "Karma Kagyu to jedna z największych linii przekazu szkoły Kagyu i jedna z czterech głównych szkół buddyzmu tybetańskiego. Odgrywa ona istotną rolę w wewnętrznej polityce krain położonych na zboczach gór naszej ojczyzny. Mimo naszego odosobnienia wpływa również na politykę zagraniczną, a niektórzy jej przywódcy pełnili funkcję doradców cesarza Chin. Teraz dalekosiężne wpływy chińskiego cesarza docierają także do naszych granic. Żąda on podporządkowania się i uznania swojej władzy nad naszym państwem."
 flavor_mng.33.a: "Uznajemy wielkoduszność dzierżyciela Mandatu Niebios!"
 flavor_mng.33.b: "Ryzykować naszą niepodległość? Niedorzeczność!"
 flavor_mng.34.t: "Wielkie kanały Chin"
 flavor_mng.34.d: "Kanały przecinające całe dorzecza to tylko niektóre z cudów inżynierii stworzonych przez naszych zdolnych planistów, którzy ujarzmiają nurty rzek przepływających przez serce naszego kraju. W połączeniu z wałami wzdłuż Żółtej Rzeki kanały te nawodnią nasze ziemie i zapewnią ludności obfite zasoby, pozwalając naszej dynastii osiągnąć nowy poziom dobrobytu i wyższy standard życia."
 flavor_mng.34.a: "Cud nowoczesnej inżynierii!"
 flavor_mng.35.t: "Wały przeciwpowodziowe na Żółtej Rzece"
 flavor_mng.35.d: "Wzdłuż Wielkich Kanałów, którymi płynie życiodajna woda przez serce naszego państwa, wały na Żółtej Rzece mogą pomóc rolnikom i kupcom poszukującym nowych zasobów okiełznać nurt i siłę jednego z żywiołów natury. Ponieważ chińskie rzeki bywają nieprzewidywalne, powinniśmy zawczasu przygotować się na przyszłe powodzie i ograniczać skutki tych klęsk, dbając o stan wałów."
 flavor_mng.35.a: "Czas i przypływ na nikogo nie czekają!"
 flavor_mng.36.t: "Wielka reforma podatkowa"
 flavor_mng.36.d: "Przez stulecia pobór podatków był codziennym koszmarem gubernatorów prowincji i urzędników. Ostatnie postępy w sprawności biurokracji pozwoliły nam jednak przeprowadzić ogólnokrajową reformę podatkową opartą w całości na srebrze. Mimo ostrzeżeń przeciwników, którzy przewidują problemy wynikające z nadmiernego uzależnienia od metali szlachetnych, polityka ta może okazać się kluczowa dla naszego dobrobytu."
 flavor_mng.36.a: "Jeden standard! Jeden naród!"
 flavor_mng.37.t: "Poseł na dworze Królestwa Pustelników"
 flavor_mng.37.d: "Dzieje i wzajemne relacje Korei oraz naszego państwa są splecione od niepamiętnych czasów. Na znak dobrej woli i aby zapoczątkować nową erę dobrobytu oraz współpracy, ogłośmy całemu światu zacieśnienie naszych więzi dyplomatycznych."
 flavor_mng.37.a: "Nasze wielkie narody będą wspólnie rozkwitać."
 flavor_mng.38.t: "Prawdziwy [Root.Monarch.GetDaughterSon] Niebios"
 flavor_mng.38.d: "Koncepcja Mandatu Niebios obfituje w opowieści o sukcesach i gorzkich upadkach, tajemnicach poruszających serce oraz bezlitosnych objawieniach. Była świadkiem powstania i upadku najpotężniejszych i najbardziej budzących grozę imperiów naszego regionu. Żadne z nich nie ucieleśniało jednak istoty Niebios tak doskonale jak [Root.Monarch.GetName] — światło pośród nieprzeniknionych ciemności."
 flavor_mng.38.a: "[Root.Monarch.GetName] naprawdę pojmuje wolę i porządek wszechświata."
 flavor_mng.39.t: "Dyplomacja z cesarzem Chin"
 flavor_mng.39.d: "Nasze stosunki z cesarzami Chin nie zawsze układały się pomyślnie. Dobry administrator i dyplomata wie jednak, kiedy pochylić głowę, by jej nie stracić. Dlatego niedawno przyjęliśmy na naszym dworze delegację chińskiego cesarza, która zażądała naszego podporządkowania się jego zwierzchnictwu, usankcjonowanemu przez same Niebiosa."
 flavor_mng.39.a: "Z radością się zgadzamy."
 flavor_mng.39.b: "Nigdy!"
 flavor_mng.40.t: "Urzędy Wschodni i Zachodni"
 flavor_mng.40.d: "Potężne instytucje cesarskie od dawna kształtują i sprawują władzę nad sprawami dworu. Aby zapewnić czujny nadzór nad zagrożeniami wewnętrznymi, wielu naszych doradców zaproponowało powołanie takiej instytucji, której zadaniem byłoby wyłącznie zajmowanie się intrygami pałacowymi i wykorzenianiem korupcji w cesarskiej administracji."
 flavor_mng.40.a: "Powołajmy Urząd Zachodni."
 flavor_mng.40.b: "Powołajmy Urząd Wschodni."
 flavor_mng.40.c: "Oko Cesarza widzi wszystko..."
 flavor_mng.41.t: "Porcelanowa Pagoda w Nankinie"
 flavor_mng.41.d: "Wspaniała pagoda, której budowę rozpoczęto w XV wieku, jest świadectwem rozkwitu wierzeń religijnych i doskonałości architektury naszego kraju. Wysoka i bogato zdobiona, góruje nad dachami [1821.GetName], będąc ważnym symbolem religijnym naszego rozległego państwa."
 flavor_mng.41.a: "Piękny owoc naszej kultury duchowej."
 flavor_mng.42.t: "Obecny stan spraw w państwie Mingów"
 flavor_mng.42.d: "Niemal sto lat po powstaniu dynastii Mingów nasze państwo obejmuje już całe terytorium dawnych władców Chin. Owoce podbojów są obfite: uzyskaliśmy dostęp do cesarskiego skarbca, a zgromadzone w nim środki możemy przeznaczyć na dalszy dobrobyt naszego ludu. Jednak w rozległym cesarstwie zaczynają pojawiać się rysy. Nie potrafimy właściwie delegować uprawnień w prowincjach, na północy rosną zagrożenia ze strony sąsiadów, a nasz obecny Cesarz nie dorasta do swoich obowiązków. To niepokojące znaki naszych czasów. Musimy zreformować rząd, zachować przychylność Niebios i zapewnić trwanie naszej dynastii, by na wieki władała Chinami."
 flavor_mng.42.a: "Niebiosa wystawiają nasze wielkie Cesarstwo na próbę..."
 flavor_mng.43.t: "Czystki w administracji Cesarstwa Chin"
 flavor_mng.43.d: "Cykl życia i śmierci dotyczy wszystkich rzeczy, także biurokracji. Zbyt długo niektóre osoby w naszym rządzie cieszyły się przychylnością i bogactwem Cesarza, wzbogacając się na własną rękę i szerząc korupcję wszędzie, gdzie się pojawiły. Powinniśmy ograniczyć ich wpływy i rozprawić się z nieuczciwymi urzędnikami, nim ich potęga nadmiernie wzrośnie!"
 flavor_mng.43.a: "Eunuchowie muszą znać swoje miejsce!"
 flavor_mng.43.b: "Nic nie możemy na to poradzić..."
 flavor_mng.44.t: "Wielkie edykty [Root.Monarch.GetName]"
 flavor_mng.44.d: "Głos Cesarza musi docierać daleko, zważywszy na rozległość naszego państwa. Aby kształtować administrację i ogłaszać prawa, nasi monarchowie często wydają uroczyste edykty. Opatrzone cesarską pieczęcią i doręczane przez urzędowych posłańców dokumenty te mają ogromne znaczenie. Aby zapewnić sprawne i spokojne funkcjonowanie rządu, nasza głowa państwa postanowiła wykorzystać owe edykty do zagwarantowania przejrzystości w sprawach..."
 flavor_mng.44.a: "...Qimwangów."
 flavor_mng.44.b: "...Shangbangów."
 flavor_mng.44.c: "...Shizu."
 flavor_mng.44.e: "...eunuchów."
 flavor_mng.44.f: "...właściwie w żadnych. Wszystko jest tak, jak być powinno."
 flavor_mng.44.g: "...we wszystkich! Nikt nie zostanie oszczędzony."
 flavor_mng.45.t: "Rozbudowa Jinyiwei"
 flavor_mng.45.d: "Jinyiwei, znani również jako Gwardia Haftowanych Mundurów, są uosobieniem prawa i porządku w cesarstwie. Jako tajna policja Cesarza stoją ponad wszystkimi pozostałymi organami wymiaru sprawiedliwości. Mogą aresztować i karać każdego, kogo uznają za wroga państwa; poza ich zasięgiem nie pozostają nawet wysoko postawieni możnowładcy ani krewni samego Cesarza. Choć zadanie to może być trudne, rozsądnie byłoby zwiększyć ich wpływy i zapewnić im środki niezbędne do utrzymania porządku w granicach naszego państwa."
 flavor_mng.45.a: "To słuszna polityka."
 flavor_mng.45.b: "Nie zakłócajmy obecnego porządku."
 flavor_mng.46.t: "Powódź na Żółtej Rzece w roku [GetYear]"
 flavor_mng.46.d: "[GetYear] — przeklęty rok, w którym wezbrane wody Żółtej Rzeki pochłonęły życie tysięcy naszych poddanych i spustoszyły rozległe obszary jej brzegów. Powiada się, że powodzie zwiastują zagładę starych dynastii i narodziny nowych. Miejmy nadzieję, że szybko naprawimy wyrządzone szkody, nim katastrofa ta stanie się początkiem upadku naszego wielkiego państwa."
 flavor_mng.46.a: "Prawdziwa katastrofa!"
 flavor_mng.48.t: "Powódź na Jangcy w roku [GetYear]"
 flavor_mng.48.d: "[GetYear] — przeklęty rok, w którym wezbrane wody Jangcy pochłonęły życie tysięcy naszych poddanych i spustoszyły rozległe obszary jej brzegów. Powiada się, że powodzie zwiastują zagładę starych dynastii i narodziny nowych. Miejmy nadzieję, że szybko naprawimy wyrządzone szkody, nim katastrofa ta stanie się początkiem upadku naszego wielkiego państwa."
 flavor_mng.48.a: "Nie znowu..."
 flavor_mng.50.t: "Wielka Ósemka"
 flavor_mng.50.d: "Kręgi eunuchów niekiedy zdobywały ogromne wpływy w sprawach wewnętrznych i zagranicznych. Ostatnio jednak po pałacu krążą doniesienia o grupie ośmiu wpływowych eunuchów, których potęga i znaczenie dorównują niemal samemu Cesarzowi! Nazywają siebie „Ośmioma Tygrysami” i dążą do przejęcia kontroli nad dworem oraz zmiażdżenia wszystkich przeciwnych im stronnictw w cesarstwie."
 flavor_mng.50.a: "Zaprzestańcie bezprawnych praktyk w imię cesarza!"
 flavor_mng.50.b: "Pozwólmy im zachować upragnioną autonomię."
 flavor_mng.51.t: "Pawilon Piwonii Tang Xianzu"
 flavor_mng.51.d: "Nasza epoka przyniosła wiele osiągnięć naukowych i artystycznych. Jednym z największych powodów do dumy i najwymowniejszych wyrazów naszej kultury jest dramat „Powrót duszy w Pawilonie Piwonii”, napisany przez Tang Xianzu w roku [GetYear]. Opowiada on historię miłości Du Liniang i Liu Mengmeia, których determinacja pozwala pokonać wszelkie przeszkody. Dzieło to ugruntowało pozycję autora jako jednego z najwybitniejszych dramaturgów swoich czasów."
 flavor_mng.51.a: "Wspaniale! Niezwykle! Brawo!"
 flavor_mng.52.t: "Meczet w prowincji [1816.GetName]"
 flavor_mng.52.d: "Wzniesione w roku [GetYear] miejsce kultu jest największym z licznych meczetów powstałych w największych ośrodkach miejskich naszego państwa. Będzie służyć jako centrum religijne dla naszych muzułmańskich poddanych. Ozdobiona pięknymi minaretami i drogocennymi kamieniami budowla, pełna zachwycających dzieł sztuki, stanie się symbolem braterstwa i współpracy naszych państw."
 flavor_mng.52.a: "Znak tolerancji i wspólnego dobrobytu naszych wielkich narodów!"
 flavor_mng.53.t: "Poeta Yang Shen"
 flavor_mng.53.d: "Yang Shen, jeden z najwybitniejszych poetów naszej epoki, jest dumą swojej rodzinnej prowincji Chengdu. Znany pod wieloma pseudonimami literackimi, takimi jak Sheng'an, Bonan Shanren i Bonan Shushi, jest mistrzem pióra i słowa. Stworzył już wiele dzieł, poświęconych przeważnie naturze i kulturze. Niektóre z nich zdobyły tak wielką sławę, że jego nazwisko z pewnością na zawsze zapisze się na kartach historii."
 flavor_mng.53.a: "Jaśniejący symbol największych umysłów naszego państwa."
 flavor_mng.54.t: "Trzęsienie ziemi w roku [GetYear]"
 flavor_mng.54.d: "Nasze prowincje nawiedziła straszliwa tragedia. Niebiosa pociemniały, a ziemia rozstąpiła się, pochłaniając wielu zwykłych ludzi w śmiertelnym uścisku. Miejscowa ludność popada w zabobon, a po okolicy krążą pogłoski, że nasz władca utracił przychylność Niebios..."
 flavor_mng.54.a: "Gdyby tylko przyszło nam żyć w spokojniejszych czasach..."
 flavor_mng.55.t: "Polityka Haijin Wielkich Mingów"
 flavor_mng.55.d: "Chiny od zawsze stanowiły dochodowy rynek dla cudzoziemców. Jednak w ostatnich dziesięcioleciach zdecydowaliśmy się ograniczyć większość handlu z zagranicą i skupić na wymianie wewnętrznej. Czasy się jednak zmieniają, a wraz z nimi nasze podejście. Być może powinniśmy ponownie rozważyć tę politykę, jeśli jej zmiana może przynieść zyski cesarskiemu skarbcowi."
 flavor_mng.55.a: "Powinniśmy dążyć do udoskonalenia obecnej polityki."
 flavor_mng.55.b: "Otwarte rynki i nowa polityka przyniosą nam większe korzyści."
 flavor_mng.55.c: "Musimy dokładnie przemyśleć naszą politykę..."
 flavor_mng.56.t: "Stosunki handlowe między Japonią a Chinami"
 flavor_mng.56.d: "W całej naszej wspólnej historii cesarz Chin zawsze gorliwie popierał prowadzenie handlu na naszych ziemiach. Jeśli zdecydujemy się dopuścić chińskich kupców do części naszych towarów, możemy utracić kontrolę nad własnym monopolem w zamian za przychylność i lepsze stosunki z wielkim smokiem."
 flavor_mng.56.a: "Musimy udzielić chińskim kupcom dostępu do naszych rynków."
 flavor_mng.56.b: "Nie ma mowy!"
 MNG_PRESENCE_IN_JAPAN: "Silna pozycja na japońskich rynkach"
 flavor_mng.57.t: "Eunuchowie Imperium [Root.GetAdjective]"
 flavor_mng.57.d: "Niewiele instytucji w czasie naszych rządów miało tak wielki wpływ jak eunuchowie stojący za cesarzem. Niezależnie od tego, czy przynosi to korzyści, czy szkody, ludzie ci dysponują znacznymi wpływami i niekiedy realizują własne cele, stawiając je nawet ponad wolą samego cesarza. Wielu doradców na naszym dworze wyraża sprzeciw wobec tych praktyk i wzywa nas do ograniczenia wpływów eunuchów..."
 flavor_mng.57.a: "Ich władzę trzeba ograniczyć!"
 flavor_mng.57.a.tt: "Wpłynie to na wymagania misji „§YPodstawa imperium§!”."
 flavor_mng.57.b: "Nie możemy ryzykować ich gniewu..."
 estate_disasters.19.t: "Eunuchowie przejmują władzę"
 estate_disasters.19.d: "Ostatnie wydarzenia w sprawach wewnętrznych, połączone z niezdolnością cesarza do poskromienia rozmaitych stronnictw na dworze, doprowadziły do powstania nowej frakcji, która zagraża obaleniem naszej dynastii i przejęciem chińskiego tronu. Eunuchowie dysponują ogromnymi wpływami i potęgą, do tego stopnia, że ogłosili się prawdziwymi władcami naszego państwa."
 estate_disasters.19.a: "To niemożliwe!"
 estate_disasters.20.t: "Koniec ery eunuchów"
 estate_disasters.20.d: "W końcu władze naszego państwa zdołały ograniczyć wpływy i potęgę stronnictwa eunuchów. Ta próba uzurpacji władzy pozostawiła na naszym kraju głębokie blizny i odmieniła go na gorsze. Musimy teraz rozpocząć leczenie ran zadanych podczas wojny domowej."
 estate_disasters.20.a: "Nikt więcej nie wystąpi przeciw cesarzowi!"
 buzhengshi: "Buzhengshi"
 buzhengshi_desc: "Urzędnicy ci odpowiadają za sprawy finansowe wszystkich podległych im okręgów i prowincji oraz dbają o sprawne funkcjonowanie lokalnej administracji."
 anchasi: "Anchasi"
 anchasi_desc: "Ich głównym zadaniem jest nadzór nad administracją wymiaru sprawiedliwości oraz pilnowanie, by lokalni urzędnicy i zwykli mieszkańcy przestrzegali prawa."
 du_si: "Du Si"
 du_si_desc: "Do obowiązków komisarzy wojskowych należą sprawy wojskowe, takie jak rekrutacja lokalnych garnizonów i sprawna mobilizacja wojsk."
 mng_seal_of_the_emperor_reform: "Pieczęć Wielkiego Ming"
 mng_seal_of_the_emperor_reform_desc: "Ceremoniał odgrywa potężną rolę w ustanawianiu i potwierdzaniu władzy. Cesarska pieczęć Cesarza Chin budzi zatem szacunek, podziw i posłuch należny dziedzicom Niebios."
 estate_eunuchs_bookkeepers_privilege: "Eunuchowie rachmistrzowie"
 estate_eunuchs_bookkeepers_privilege_desc: "Prowadzenie rachunków na dworze Cesarza Chin jest zaszczytnym obowiązkiem. Piecza nad księgami przynosi znaczne wpływy i wymaga stosowania zasad merytokracji."
 estate_eunuchs_western_bureau_privilege: "Urząd Zachodni"
 estate_eunuchs_western_bureau_privilege_desc: "Urząd Zachodni to potężna instytucja nadzorująca sprawy dworu i zwalczająca korupcję."
 estate_eunuchs_eastern_bureau_privilege: "Urząd Wschodni"
 estate_eunuchs_eastern_bureau_privilege_desc: "Urząd Wschodni to potężna instytucja nadzorująca sprawy dworu i zwalczająca korupcję."
 estate_eunuchs_outwards_perfection_privilege: "Doskonałość poza granicami"
 estate_eunuchs_outwards_perfection_privilege_desc: "Porzucamy poszukiwanie sposobów doskonalenia naszego państwa od wewnątrz. Nasi poddani są gotowi sięgnąć po odległe ziemie i rozszerzyć chwałę cesarstwa."
 estate_eunuchs_palace_bureaucracy_privilege: "Rozbudowana biurokracja pałacowa"
 estate_eunuchs_palace_bureaucracy_privilege_desc: "Narzucenie polityki państwa wszystkim zakątkom cesarstwa jest trudnym zadaniem, często utrudnianym przez lokalne władze dążące do autonomii. Eunuchowie chętnie udzielą Cesarzowi pomocy w zamian za dodatkowe przywileje i wesprą go w zarządzaniu sprawami wewnętrznymi."
 estate_eunuchs_delegate_provincial_administration_privilege: "Przekazanie administracji prowincji"
 estate_eunuchs_delegate_provincial_administration_privilege_desc: "W obliczu oznak kryzysu w naszym rozległym państwie i przeciążenia administracji wpływowi eunuchowie przejmą inicjatywę i zadbają o egzekwowanie woli Cesarza nawet w najodleglejszych prowincjach cesarstwa."
 estate_eunuchs_imperial_council_privilege: "Rada Cesarska"
 estate_eunuchs_imperial_council_privilege_desc: "Zapewnienie szerokiego i odpowiednio zróżnicowanego grona kandydatów do rady to rozszerzenie obowiązków eunuchów, które pozwoli zagwarantować sprawną i wszechstronną administrację."
 estate_eunuchs_land_rights_privilege: "Prawo eunuchów do ziemi"
 estate_eunuchs_land_rights_privilege_desc: "Eunuchowie, najlepsi administratorzy państwa, mogą skorzystać z nowego prawa do nabywania i zarządzania ziemią w imieniu Cesarza."
 estate_eunuchs_royal_intrigue_keepers_privilege: "Strażnicy dworskich intryg"
 estate_eunuchs_royal_intrigue_keepers_privilege_desc: "Dopilnowanie, by eunuchowie pilnie obserwowali sprawy pałacu, pozwoli zaprowadzić w nim dyscyplinę i zapewnić wierność wszystkich poddanych koronie."
 estate_eunuchs_promote_eunuch_rights: "Popieranie praw eunuchów"
 estate_eunuchs_promote_eunuch_rights_desc: "Przyznając eunuchom większe prawa, zapewnimy sobie ich długotrwałą lojalność, gdy będziemy reformować cesarstwo i zaprowadzać porządek w jego granicach."
 estate_eunuchs_delegate_subject_diplomacy_privilege: "Powierzenie dyplomacji z państwami lennymi"
 estate_eunuchs_delegate_subject_diplomacy_privilege_desc: "Odtąd stosunki dyplomatyczne między Cesarzem a podległymi nam państwami trybutarnymi będą prowadzić eunuchowie, występujący z cesarską pieczęcią."
 estate_eunuchs_supremacy_over_crown_privilege: "Przewaga nad Cesarzem"
 estate_eunuchs_supremacy_over_crown_privilege_desc: "Wraz z przesuwaniem się równowagi sił ku decentralizacji stany coraz śmielej narzucają swoje priorytety [Root.Monarch.GetTitle], nie pozostawiając [Root.Monarch.GetHerHim] wielkiego wyboru poza podporządkowaniem się ich woli."
 estate_eunuchs_establish_favor_system_privilege: "Ustanowienie systemu przysług"
 estate_eunuchs_establish_favor_system_privilege_desc: "System przysług, w którym eunuchowie pełnią rolę posłów między nami a sąsiadami, to znakomity krok ku umocnieniu naszej wielkości i powagi naszego słowa."
 estate_eunuchs_allow_personal_fortunes_privilege: "Zezwolenie na gromadzenie prywatnych majątków"
 estate_eunuchs_allow_personal_fortunes_privilege_desc: "Podobnie jak wielu innych poddanych naszego państwa, eunuchowie będą mogli odtąd nabywać, posiadać i sprzedawać nieruchomości wzniesione na naszych ziemiach."
 estate_eunuchs_single_whip_law_privilege: "Prawo Pojedynczej Batogi"
 estate_eunuchs_single_whip_law_privilege_desc: "Prawo to ma na celu centralizację i reformę systemu podatkowego naszego Imperium. Dzięki niemu nasz skarbiec wypełni się srebrem, a podatki od poddanych będą pobierane sprawniej."
 estate_eunuchs: "Eunuchowie"
 estate_eunuchs_desc: "Eunuchowie stanowią potężny stan w Imperium Chińskim. Niekiedy ich wpływy ograniczają silni władcy, którzy trzymają ich żelazną ręką. Jeśli jednak panujący monarcha zostanie uznany za słabego lub niezdolnego do rządzenia, eunuchowie szybko potrafią uczynić nawet samego cesarza marionetką w misternie utkanej intrydze."
 eunuchs_influence_modifier: "Wpływy eunuchów"
 eunuchs_loyalty_modifier: "Równowaga lojalności eunuchów"
 eunuchs_privilege_slots: "Maksymalna liczba przywilejów eunuchów"
