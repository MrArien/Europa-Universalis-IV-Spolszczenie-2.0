 mevlevi_order: "Zakon Mevlevi"
 mevlevi_order_desc: "Zakon Mevlevi, założony w Konyi przez uczniów Dżalal ad-Dina Muhammada Rumiego, jest sunnickim odłamem sufizmu. Poświęca się studiowaniu Koranu oraz dzieł Rumiego."
 bektashi_order: "Zakon Bektaszytów"
 bektashi_order_desc: "Zakon Bektaszytów jest młodym, szyickim odłamem sufizmu. Powstał w Anatolii, a jego wyznawcy uznają Czternastu Niewinnych obok Dwunastu Imamów."
 tur_the_crescent_fleet_title: "Flota Półksiężyca"
 tur_the_crescent_fleet_desc: "Pierwsza flota naszego wielkiego państwa [Root.GovernmentName] powstała w 1323 roku po zdobyciu miasta Karamürsel. Od tego czasu nasza marynarka nieustannie się rozwija.
Jednak nasi morscy rywale – ostatni joannici, genueńska republika handlowa i dożowie Wenecji – wciąż zagrażają naszemu bezpieczeństwu. Rozbudowa floty ma kluczowe znaczenie, jeśli nie chcemy pozostać w tyle za przeciwnikami."
 tur_maritime_presence_title: "Obecność na morzu"
 tur_maritime_presence_desc: "Nasza flota chroni nas na morzu, lecz nie jest to jej jedyne zadanie. Handel na Morzu Śródziemnym ma dla nas ogromne znaczenie, dlatego marynarka powinna zabezpieczać wpływy na rynkach Aleppo, Aleksandrii i Raguzy."
 tur_maritime_presence_tt: "Jedna losowa prowincja w naszym macierzystym węźle handlowym otrzymuje najnowszy budynek §Yhandlowy§! oraz modyfikator „§YDominujący ośrodek handlowy§!” do końca gry, zapewniający:
Lokalna siła handlu: §G+10,00§!
Lokalny koszt rozwoju: §G-5%§!"
 tur_venetian_relations_title: "Stosunki z Wenecją"
 tur_venetian_relations_desc: "Najjaśniejsza Republika Wenecka wielokrotnie ścierała się z naszą potęgą. Od krucjaty nikopolskiej w 1396 roku, przez bitwę pod Gallipoli w 1416 roku, aż po oblężenie Salonik w 1430 roku – nasze państwa pozostawały w nieustannym konflikcie. Jest jednak oczywiste, że obie strony wiele zyskują na wzajemnym handlu.
Powinniśmy zdecydować, jak ułożymy nasze stosunki z Wenecjanami."
 tur_venetian_relations_at: "Jeśli ukończymy tę misję, gdy §YWenecja§! jest naszym sojusznikiem:"
 tur_venetian_relations_bt: "Wydarzenie pozwoli nam wybrać między §Yprzyjęciem układu handlowego z Wenecją§! i przyznaniem jej siły handlu w węźle §YKonstantynopol§! w zamian za premie a §Yodrzuceniem układu handlowego§! i uzyskaniem stałych roszczeń do wszystkich prowincji w regionach §YBałkanów§! i §YAnatolii§!, należących do §YWenecji§!, jej poddanych lub członków jej ligi handlowej."
 tur_the_bospborus_control_title: "Zabezpiecz Bosfor"
 tur_the_bospborus_control_desc: "Bosfor łączy Europę z Azją i jest naszym domem. Przyciąga oczywiście kupców i podróżnych pragnących odwiedzić drugi kontynent.
W naszym interesie leży, aby kontrolę nad Bosforem sprawowali ci, którym możemy zaufać."
 tur_the_bospborus_control_at: "Warunki tej misji zależą od naszego wyboru w wydarzeniu „§YUkład handlowy [Root.GetAdjective]-wenecki?§!” z poprzedniej misji.
Jeśli układ handlowy obowiązuje, misję można ukończyć po spełnieniu następujących warunków:
- Musi być spełniony jeden z poniższych warunków:
    - §YWenecja§! nie istnieje.
    - Opinia §YWenecji§! o państwie §Y[Root.GetName]§! wynosi co najmniej §Y190§!.
    - §YWenecja§! ma największą siłę handlu w węźle §YKonstantynopol§!."
 tur_the_bospborus_control_bt: "Jeśli jednak nie zawarliśmy układu handlowego lub został on zerwany, wymagane są następujące warunki:"
 tur_the_bospborus_control_ct: "Jeśli ukończymy tę misję, gdy obowiązuje nas układ handlowy z §YWenecją§!:"
 tur_the_bospborus_control_dt: "Wydarzenie pozwoli nam ponownie rozważyć układ handlowy i wybrać jedną z możliwości:
 - „§YRozszerz układ handlowy§!” zwiększy premie do §Gprodukcji dóbr handlowych§! w naszych prowincjach w zamian za większą siłę handlu w macierzystym węźle handlowym.
 - „§YZachowaj status quo§!” natychmiast zapewni nam dochód równy §G3 latom§!.
 - „§YZakończ układ handlowy§!” usunie modyfikator §Yukładu handlowego§! i zakończy nasz sojusz z §YWenecją§!, ale zapewni następujące efekty:"
 tur_establish_the_pashas_title: "Powołaj paszów"
 tur_establish_the_pashas_desc: "Tytuł paszy jest wysoką rangą cywilną w naszym systemie politycznym i wojskowym, nadawaną gubernatorom oraz generałom. Wraz z rozwojem imperium powoływanie nowych paszów ma kluczowe znaczenie dla utrzymania i zarządzania podbitymi terytoriami."
 tur_improved_pashas_ct: "Zmniejsza minimalny wzrost lokalnej autonomii do §Y+10,00§! dla §Ypaszów§! zarządzających prowincjami spoza grupy kulturowej §Y[Root.Culture.GetGroupName]§!."
 tur_establish_the_pashas_ct: "Maksymalnie §Y10§! prowincji, w których ustanowiono §Ypaszę§! i które nie należą do grupy kulturowej §Y[Root.Culture.GetGroupName]§!, otrzymuje §G1§! podstawowych zasobów ludzkich."
 tur_guns_of_urban_title: "Działa Urbana"
 tur_guns_of_urban_desc: "Węgierski inżynier i ludwisarz Urban zaoferował nam swoje usługi oraz wiedzę, aby stworzyć działa zdolne skruszyć mury samego Babilonu!
Musimy zapewnić sobie dostęp do jego machin oblężniczych."
 tur_guns_of_urban_at: "Jeśli ukończymy tę misję, zatrudniając §YUrbana§! przed osiągnięciem §Y5. poziomu technologii wojskowej§!, otrzymamy następującą premię:"
 tur_guns_of_urban_ct: "
Ze względu na rozmiary i archaiczną konstrukcję osmańskie działa będą wykorzystywane wyłącznie do prowadzenia oblężeń.
"
 tur_aftermath_of_varna_title: "Pokłosie bitwy pod Warną"
 tur_aftermath_of_varna_desc: "Rozgromienie niewiernej armii krzyżowców pod Warną przełamało ostatni znaczący opór wobec dalszej ekspansji naszych posiadłości w Rumelii. Zbierzmy siły i przygotujmy podbój pozostałości żałosnego, rozpadającego się imperium!"
 tur_aftermath_of_varna_ct: "Wystąpiło wydarzenie „§YZwycięstwo nad krucjatą warneńską§!”.
Wydarzenie uruchomi się w ciągu §Y1 miesiąca§!."
 tur_city_of_worlds_desire_title: "Miasto pożądania świata"
 tur_city_of_worlds_desire_desc: "Cesarstwo Bizantyjskie jest jedynie cieniem dawnej chwały. Niegdyś jego władcy panowali nad Wschodem od Dunaju po Nil, dziś pozostało z niego tylko rozpadające się państwo pogrążone w wewnętrznych konfliktach. Jedyną ostoją jego potęgi jest wielka stolica – Konstantynopol.
Dziś miasto to padnie przed potęgą Osmanów i stanie się najwspanialszym klejnotem dynastii Osmanów oraz naszego nowego imperium!"
 tur_train_the_janissary_title: "Wyszkol janczarów"
 tur_train_the_janissary_desc: "Janczarzy zostali utworzeni w 1365 roku za panowania Murada I i rekrutowali się spośród najsilniejszych synów naszych chrześcijańskich poddanych. Co pięć lat lojalni słudzy sułtana przemierzają imperium w poszukiwaniu tych chłopców i wcielają ich do korpusu janczarów. Zbliża się kolejna fala rekrutacji."
 tur_grant_first_janissary_privileges_title: "Przywileje janczarów"
 tur_grant_first_janissary_privileges_desc: "Większość naszej armii stanowią poborowi, których lojalność należy do szlachty. Janczarzy są jednak inni – służą wyłącznie [Root.Monarch.GetTitle]. Ich posłuszeństwo ma jednak swoją cenę, ponieważ żołnierze ci mają własne ambicje i oczekują nagród."
 tur_refill_the_ortas_title: "Uzupełnij orty"
 tur_refill_the_ortas_desc: "Bitwa pod Warną była dla nas kluczowym zwycięstwem, lecz jej skutki nadal są odczuwalne. Nasze wojska poniosły ciężkie straty, a wiele ort – batalionów naszej wielkiej armii – jest niekompletnych i wymaga uzupełnienia. Powinniśmy rozbudować armię i odrobić straty, aby ponownie móc kontynuować ekspansję."
 tur_refill_the_ortas_tt: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do każdej §Ytureckiej§! prowincji w regionach §YAnatolii§! i §YMaszriku§!."
 tur_conquer_anatolian_beyliks_title: "Podbij bejliki"
 tur_conquer_anatolian_beyliks_desc: "Zdobywca Timur siał spustoszenie na naszych ziemiach podczas najazdu Timurydów na Anatolię ponad 40 lat temu. Choć ostatecznie wyparto ich z naszego terytorium, szkody zostały już wyrządzone, a kilka bejlików wyrwało się spod naszej kontroli. Nadszedł czas, by usunąć tych drobnych książąt z mapy i odzyskać ich ziemie dla imperium."
 tur_unify_anatolia_title: "Zjednocz Anatolię"
 tur_unify_anatolia_desc: "Od rozpadu potężnego sułtanatu Rum region Anatolii pozostaje przedmiotem rywalizacji bejlików, plemion, a nawet pozostałości dawnej dynastii Ajjubidów. Wszystkie te siły ugną się przed naszą potęgą, gdy zjednoczymy Anatolię pod osmańskimi rządami."
 tur_conquer_the_causcasus_title: "Wkrocz w góry"
 tur_conquer_the_causcasus_desc: "Góry Kaukazu od dawna zamieszkują liczne chrześcijańskie plemiona i państwa. Choć ich wojownicy są zahartowani, jest ich zbyt mało, by stawić nam czoła. Powinniśmy przejąć te ziemie, zanim zrobią to nasi wrogowie."
 tur_black_sea_dominance_title: "Zdominuj Morze Czarne"
 tur_black_sea_dominance_desc: "Morze Czarne jest główną drogą handlową łączącą Azję Środkową z Europą. W naszym interesie leży zatem zapewnienie, aby wybrzeże tego bezcennego akwenu znajdowało się wyłącznie pod kontrolą dynastii Osmanów."
 TUR_PONTIC_TRADE: "Kontrola nad Morzem Czarnym"
 tur_black_sea_dominance_tt: "Wybrzeże §YMorza Czarnego§! należy do państwa §Y[Root.GetName]§! lub jego poddanych."
 tur_conquer_mesopotomia_title: "Kolebka cywilizacji"
 tur_conquer_mesopotomia_desc: "Mezopotamia ma ogromne znaczenie z wielu powodów. Dla uczonych jest miejscem, w którym rozkwitły pierwsze ludzkie cywilizacje. Dla ludzi wiary znaczenie Bagdadu dla islamu jest bezdyskusyjne. Dla nas zaś jej żyzne ziemie i strategiczne położenie nad Zatoką Perską czynią ją bezcennym nabytkiem dla nieustannie rosnącego imperium."
 tur_defeat_the_mamluks_title: "Pokonaj Mameluków"
 tur_defeat_the_mamluks_desc: "Sułtanat Mameluków w Egipcie dominuje w świecie islamu od czasu, gdy Mongołowie złupili Bagdad. Choć Mamelucy nazywają się obrońcami kalifa i Świętego Miasta, stali się słabi i zdegenerowani. Nadszedł doskonały moment, by zgłosić roszczenia do ich syryjskich posiadłości i uwolnić najświętsze miasta – Jerozolimę i Damaszek – spod ich władzy."
 tur_defeat_the_mamluks_at: "Wykorzystanie tego casus belli przeciwko @MAM §YMamelukom§! uruchomi specjalny łańcuch wydarzeń, który można wywołać po przejęciu kontroli nad prowincją §Y[MAM.Capital.GetName]§!.
Wydarzenie pozwoli nam ustanowić §Yrdzenny ejalet§! w §YEgipcie§!."
 tur_defeat_the_mamluks_tt: "§Y[Root.GetName]§! otrzymuje stałe roszczenia do obszarów §YBahrajnu§!, §YTabuku§!, §YAn Nafud§!, §Yal-Kasim§!, §YMedyny§! i §YMekki§!."
 tur_conquer_persia_title: "Połóż kres perskiemu zagrożeniu"
 tur_conquer_persia_desc: "Persją władało wiele imperiów, a ostatnim z nich byli Timurydzi – podstępna siła, która spustoszyła wzgórza Anatolii. Choć potęga Timurydów nie jest już taka jak dawniej, w regionie może powstać nowe imperium: nowy perski lew, który spróbuje nas zniszczyć. Musimy uderzyć pierwsi i raz na zawsze usunąć zagrożenie z naszej wschodniej flanki."
 tur_conquer_greece_title: "Zapanuj nad Grecją"
 tur_conquer_greece_desc: "Państwa południowej Grecji mogłyby posłużyć niewiernym za przyczółki do przeprowadzenia przeciwko nam krucjaty. Musimy zabezpieczyć południową flankę, aby zapewnić pomyślność prawdziwemu przywódcy islamu."
 tur_conquer_greece_ct: "Każda posiadana §Ygrecka§! prowincja traci §G100%§! lokalnej autonomii i §G20§! lat separatyzmu."
 tur_push_into_the_balkans_title: "Marsz na północ"
 tur_push_into_the_balkans_desc: "Odkąd węgierski król Zygmunt poprowadził frankijskich krzyżowców przeciwko wojskom osmańskim, nasze ziemie nie są bezpieczne. Choć tamtego dnia Allah zapewnił nam zwycięstwo, musimy posunąć się dalej na Bałkany, aby w przyszłości zagwarantować bezpieczeństwo naszych ziem."
 tur_push_into_the_balkans_ct: "Każda prowincja na §YBałkanach§! należąca do państwa §Y[Root.GetName]§! lub jego poddanych otrzymuje następujące efekty:"
 tur_subjugate_romania_title: "Podporządkuj Rumunów"
 tur_subjugate_romania_desc: "Książęta rumuńskich państw władają stosunkowo ubogimi ziemiami, znajdującymi się w strefach wpływów Węgier i Polski. Nie możemy dopuścić, by terytoria te wpadły w ręce naszych wrogów. Ziemie rumuńskie muszą stać się częścią naszego rosnącego imperium."
 tur_subjugate_romania_at: "Jeśli §Y[WAL.GetName]§! jest naszym poddanym, otrzymuje §G-100%§! pragnienia wolności."
 tur_subjugate_romania_bt: "Jeśli §Y[MOL.GetName]§! jest naszym poddanym, otrzymuje §G-100%§! pragnienia wolności."
 tur_expand_the_devshirme_system_title: "Los systemu dewszirme"
 tur_expand_the_devshirme_system_desc: "Nasze ostatnie podboje przyniosły nam wielu nowych poddanych – wszystkich wyznających błędną wiarę. System dewszirme pozwala pozyskiwać świeżych rekrutów do armii i urzędników spośród podbitych rodzin chrześcijańskich. System ten spotyka się jednak również z krytyką, ponieważ ma swoje wady. Jego dalszy los zależy od nas."
 tur_has_abolished_devshirme_system: "Zniesiono §Ysystem dewszirme§!."
 tur_dismantle_hre_title: "Cesarstwo Rzymskie tylko z nazwy"
 tur_dismantle_hre_desc: "Święte Cesarstwo Rzymskie jest hańbą dla prawdziwych Rzymian. Nazwanie jego systemu rządów nieskutecznym byłoby wręcz komplementem.
Ponownie to na nas spoczywa obowiązek obalenia kolejnego pretendenta do prawdziwego rzymskiego tronu. Święte Cesarstwo Rzymskie – cesarstwo rzymskie tylko z nazwy – musi dziś upaść!"
 tur_conquer_hungary_title: "Zniszcz Węgry"
 tur_conquer_hungary_desc: "Węgry były jednym z głównych uczestników frankijskiej krucjaty przeciwko nam. Nawet jeśli nie istnieją już jako niezależne królestwo i są poddanym dynastii von Habsburgów, Węgrzy nadal stanowią poważne zagrożenie dla naszej dominacji na Bałkanach, długo po klęsce pod Warną.
Musimy uderzyć pierwsi i przejąć ich ziemie, zanim zdołają ponownie zorganizować koalicję przeciwko nam."
 tur_conquer_vienna_title: "Złam potęgę Habsburgów"
 tur_conquer_vienna_desc: "Dynastia von Habsburgów jest największym przeciwnikiem naszych europejskich ambicji. Teraz nasze wspaniałe armie stoją u ich bram, czekając na rozkaz rozpoczęcia oblężenia siedziby habsburskiej potęgi – Wiednia, bramy do Europy."
 tur_conquer_vienna_tt: "Wystąpiło wydarzenie §YUpadek Wiednia§!.
Wydarzenie uruchomi się, jeśli nie wyznajemy §Ychrześcijaństwa§!, wygramy oblężenie prowincji §Y[134.GetName]§! i będziemy ją kontrolować, a co najmniej jedna sąsiednia prowincja będzie należeć do nas lub naszych poddanych."
 tur_conquer_italy_title: "Najedź północne Włochy"
 tur_conquer_italy_desc: "Włosi wielokrotnie angażowali się w konflikty z nami. Na morzu i na lądzie Wenecjanie, Genueńczycy oraz siły papieskie nieustannie szukali sposobu, by położyć kres naszej potędze w Anatolii i na Bałkanach.
Los bywa ironiczny – teraz to my dążymy do zakończenia wpływów północnych Włoch w Europie."
 tur_devleti_rum_title: "Prawdziwe Cesarstwo Rzymskie"
 tur_devleti_rum_desc: "Upadek Cesarstwa Bizantyjskiego nie oznacza końca prawdziwego Cesarstwa Rzymskiego. Jesteśmy jego prawowitą kontynuacją, wybraną przez Allaha. Mamy zatem uzasadnione i boskie prawo do panowania nad dawnym sercem Cesarstwa Rzymskiego – nad samym wielkim miastem Rzymem!"
 tur_address_firman_title: "Wydaj firman"
 tur_address_firman_desc: "Po podboju muzułmańskich państw na Półwyspie Iberyjskim tamtejsi muzułmanie są coraz bardziej uciskani przez chrześcijańskich monarchów. Wielu z nich ucieka do sąsiednich państw muzułmańskich. Liczni, dobrze wykształceni uchodźcy mogliby okazać się dla nas bardzo przydatni. Sułtan powinien rozważyć wydanie firmanu, który przyzna im prawo osiedlania się na naszych ziemiach."
 tur_expelling_annexation_of_moriscos_grants_tt: "Jeśli ukończymy tę misję po wygnaniu §Ymorysków§!:"
 tur_moriscos_were_expelled_tt: "§YMoryskowie z Grenady§! zostali wygnani z §YIberii§! lub §Yniedawno§! zaakceptowaliśmy wydarzenie §YMoryskowie szukają schronienia§!.
Wydarzenia te wystąpią, jeśli §Y[GRA.GetName]§! zostanie podbite przez §Y[CAS.GetName]§!."
 tur_alliance_exchange_population_and_historical_friendship_tt: "Jeśli ukończymy tę misję, będąc sojusznikiem lub suwerenem §YGrenady§! albo §YAndaluzji§!:"
 tur_alliance_exchange_population_and_historical_friendship_at: "§Y[GetGranadaOrAndalusia]§! staje się historycznym przyjacielem państwa §Y[Root.GetName]§!.
§Y[GetGranadaOrAndalusia]§! uzyskuje §Yturecki§! jako akceptowaną kulturę, dopóki nie zostanie zdegradowana.
§Y[Root.GetName]§! uzyskuje §Yandaluzyjski§! jako akceptowaną kulturę, dopóki nie zostanie zdegradowana.
Maksymalnie §Y10§! prowincji państwa §Y[GetGranadaOrAndalusia]§! otrzymuje losowo §G1§! poziom rozwoju.
Maksymalnie §Y5§! prowincji państwa §Y[Root.GetName]§! otrzymuje losowo §G2§! poziomy rozwoju."
 tur_allied_married_to_gra_and_tt: "Ma sojusz i małżeństwo królewskie z §YAndaluzją§! lub §YGrenadą§!."
 tur_develop_constantinople_title: "Rozwiń Konstantynijję"
 tur_develop_constantinople_desc: "Konstantynijja wielokrotnie padała ofiarą grabieży, plądrowania i najazdów. To na nas spoczywa obowiązek przywrócenia temu wielkiemu miastu należnej mu świetności."
 tur_rebuild_the_hagia_sophia_title: "Zmień przeznaczenie Hagii Sophii"
 tur_rebuild_the_hagia_sophia_desc: "Niegdyś była to wielka świątynia prawosławia, obecnie znajduje się pod kontrolą wyznawców religii [Root.Religion.GetName]. Jej pierwotna funkcja jako domu Boga dla prawosławia nie jest już odpowiednia. Zamiast tego stanie się świątynią religii [Root.Religion.GetName], której opiekunem będzie [Root.Monarch.GetTitle]."
 tur_expand_the_city_title: "Klejnot Morza Śródziemnego"
 tur_expand_the_city_desc: "Konstantynijja jest sercem naszego imperium. Zasoby naszego państwa służą rozbudowie i rozwojowi metropolii oraz zapewnieniu dobrobytu siedzibie [Root.Monarch.GetTitle]. Miasto rozwija się od czasu podboju, lecz wciąż nie osiągnęło pełnego potencjału, by stać się prawdziwym klejnotem Morza Śródziemnego."
 tur_conquer_egypt_title: "Podporządkuj Egipt"
 tur_conquer_egypt_desc: "Mamelucy są słabi, a ich władza nad Egiptem jest bardzo krucha. Ich siły nie są w stanie obronić sułtanatu. Nadszedł czas, by państwo mameluckie przestało istnieć jako niezależny byt, a Egipt znalazł się pod naszym panowaniem."
 tur_control_the_red_sea_title: "Kontroluj Morze Czerwone"
 tur_control_the_red_sea_desc: "Handel przyprawami jest dochodowym przedsięwzięciem, a towary docierają do Europy przez Zatokę Perską i Morze Czerwone. Dostęp do Zatoki Perskiej nie stanowi większego problemu, lecz południowy kraniec Morza Czerwonego pozostaje poza naszym zasięgiem. Powinniśmy rozszerzyć wpływy na południe i zabezpieczyć cieśninę Bab al-Mandab."
 tur_establish_the_eyalet_of_adal_title: "Ejalet Adal"
 tur_establish_the_eyalet_of_adal_desc: "Nasi muzułmańscy bracia w Rogu Afryki są zagrożeni najazdem chrześcijańskich niewiernych z Etiopii lub, co gorsza, pogańskich ludów Oromo. Powinniśmy interweniować i ustanowić ejalet Adal, aby zabezpieczyć muzułmańską kontrolę nad tym regionem.
Dodatkowymi korzyściami będą wzrost naszych wpływów dyplomatycznych i handlowych w Rogu Afryki oraz umocnienie kontroli nad Morzem Czerwonym."
 tur_conquer_tunis_title: "Zgnieć Hafsydów"
 tur_conquer_tunis_desc: "Korsarscy władcy Maghrebu od zawsze cieszyli się niezależnością. Ich działania przeciwko naszym europejskim wrogom bywają użyteczne, lecz są nieplanowane i chaotyczne. Nadszedł czas, by podporządkować sobie tych zahartowanych żeglarzy i przebiegłych kapitanów oraz wcielić ich do naszej floty."
 tur_al_andalus_eyalet_title: "Ejalet Al-Andalus"
 tur_al_andalus_eyalet_desc: "Niewierni z Iberii zniszczyli muzułmańskie państwa, które przez stulecia dominowały na południu półwyspu, a teraz stanowią bastion chrześcijaństwa w Europie Zachodniej. Nasze granice nigdy nie były bliżej, dlatego wojny i konflikty z Iberami są nieuniknione.
Musimy udowodnić naszą wyższość. Wypędzimy Hiszpanów i Portugalczyków z Iberii, a na ich miejscu ustanowimy ejalet Al-Andalus!"
 tur_al_andalus_eyalet_ct: "Dowolny sojusznik lub poddany państwa §Y[Root.GetName]§!, wyznający religię §Y[Root.Religion.GetName]§! i mający stolicę w §YIberii§!, posiada prowincje §Y[225.GetName]§!, §Y[223.GetName]§!, §Y[226.GetName]§! i §Y[224.GetName]§! oraz §Y6§! innych prowincji w §YIberii§!."
 tur_al_andalus_eyalet_at: "Jeśli ukończymy tę misję za pośrednictwem §Ysojusznika§! lub §Ypoddanego§! w §YIberii§!:"
 tur_al_andalus_eyalet_bt: "Sojusznik lub poddany spełniający wymagania misji również otrzyma ten modyfikator."
 tur_al_andalus_eyalet_dt: "Wydarzenie pozwoli nam ustanowić §Yejalet§! w Iberii."
 tur_the_algerian_corsairs_title: "Algierscy korsarze"
 tur_the_algerian_corsairs_desc: "Algieria i całe Wybrzeże Berberyjskie od średniowiecza stanowią bezpieczną przystań dla muzułmańskich piratów Maghrebu. Podobnie jak tunezyjscy najeźdźcy, Algierczycy i Berberowie mogą przynosić nam korzyści, atakując naszych chrześcijańskich wrogów, lecz ich skuteczność pozostawia... wiele do życzenia. Szkody, jakie mogliby wyrządzić, byłyby znacznie większe, gdybyśmy przejęli kontrolę nad administracją ich państw."
 tur_conquer_morocco_title: "Chroń Maroko"
 tur_conquer_morocco_desc: "Sułtanat Maroka znajduje się w niepewnej sytuacji od czasu, gdy rekonkwista zdziesiątkowała muzułmanów w Iberii. Jako wierni muzułmanie mamy obowiązek przejąć sułtanat Maroka i ochronić go przed zachłannymi chrześcijańskimi królestwami."
 tur_handle_the_egyptian_eyalet_title: "Los Mameluków"
 tur_handle_the_egyptian_eyalet_desc: "Egipt uległ naszemu nieustępliwemu natarciu, a sułtanat mamelucki przestał istnieć. Pozostała jednak jedna kwestia do rozstrzygnięcia: sposób zarządzania nowo podbitym terytorium oraz los Mameluków, którzy niegdyś władali tymi ziemiami niezależnie."
 tur_handle_the_egyptian_eyalet_at: "Wymagania tej misji zostaną ujawnione po ukończeniu misji §YPodporządkuj Egipt§!."
 tur_handle_the_egyptian_eyalet_bt: "Nagrody za tę misję zostaną ujawnione po ukończeniu misji §YPodporządkuj Egipt§!."
 tur_handle_the_egyptian_eyalet_ct: "Maksymalnie §Y10§! prowincji w regionie §YEgiptu§! otrzymuje §G1§! podstawowej produkcji."
 tur_fate_of_the_patriarchate_title: "Los patriarchatu"
 tur_fate_of_the_patriarchate_desc: "Konstantynijja była nie tylko sercem dawnego Cesarstwa Wschodniorzymskiego, lecz także siedzibą patriarchy Greckiego Kościoła Prawosławnego. Miasto znajduje się pod naszą kontrolą, a zatem los patriarchatu spoczywa teraz w naszych rękach."
 tur_fate_of_the_patriarchate_tt: "Wystąpiło wydarzenie §YLos patriarchatu§!.
Wydarzenie uruchomi się, gdy nasza stolica będzie w prowincji §Y[151.GetName]§!, będziemy wyznawać §Yislam§!, a państwo §Y[BYZ.GetName]§! nie będzie istnieć."
 tur_fate_of_the_patriarchate_ct: "Dalsze wymagania zależą od naszego wyboru w wydarzeniu §YLos patriarchatu§!."
 tur_fate_of_the_patriarchate_at: "Nagrody zależą od naszego wyboru w wydarzeniu §YLos patriarchatu§!.
Dostępne nagrody zostaną przedstawione w opcjach wydarzenia."
 tur_allowed_patriarchate_to_exist_tt: "
Wymagania misji §YLos patriarchatu§! zostaną zmienione na:
Ukończone §Y2§! zadania stanu §Y[Root.GetDhimmiName]§!
§Y4§! przywileje aktualnie nadane stanowi §Y[Root.GetDhimmiName]§!

Nagrody misji zostaną zmienione na następujące efekty:"
 tur_closed_patriarchate_down_tt: "
Wymagania misji §YLos patriarchatu§! zostaną zmienione na:
Ukończone §Y2§! zadania stanu §Y[Root.GetClergyName]§!
§Y4§! przywileje aktualnie nadane stanowi §Y[Root.GetClergyName]§!

Nagrody misji zostaną zmienione na następujące efekty:"
 tur_crimean_khaganate_title: "Los Krymu"
 tur_crimean_khaganate_desc: "Za Morzem Czarnym leży chanat Tatarów krymskich. Niegdyś wszyscy drżeli przed potężnymi konnymi wojownikami stepu, lecz czas nie był dla nich łaskawy, a Litwini i Rusini stają się coraz większym zagrożeniem dla ich istnienia. Dla chana są to trudne czasy, ale dla nas doskonała okazja do rozszerzenia wpływów na północy – poprzez podbój lub dyplomację."
 tur_alliance_cri_tt: "Jeśli ukończymy tę misję, gdy §YKrym§! będzie naszym lojalnym §Ysojusznikiem§!:"
 tur_alliance_cri_at: "Podczas wydarzenia §YSukcesja w chanacie krymskim§! państwo §Y[CRI.GetName]§! zostanie §Yprzekonane do złożenia nam hołdu lennego§!."
 tur_alternatively_gain_access_to_tatar_vanguard_merc_comp_and_following_reward_tt: "Jeśli ukończymy tę misję poprzez podbój:"
 tur_subject_crimea_reward_tt: "Jeśli ukończymy tę misję, gdy §YKrym§! będzie naszym §Ypoddanym§!:"
 tur_conquer_arabia_title: "Podbij Arabię"
 tur_conquer_arabia_desc: "Wielki Półwysep Arabski jest kolebką wiary islamskiej i miejscem narodzin wielkiego proroka Mahometa (pokój z nim). Jako pobożni muzułmanie nie mamy wątpliwości, że Arabia powinna znaleźć się pod opieką państwa [Root.GetAdjective]."
 tur_seize_the_caliphate_title: "Przejmij kalifat"
 tur_seize_the_caliphate_desc: "Choć kalifat Abbasydów jako państwo został zniszczony podczas mongolskiego złupienia Bagdadu, członkowie rodu Abbasydów nadal nosili tytuł kalifa, żyjąc jako „goście” Mameluków. Po ich pokonaniu marionetkowy kalif utracił resztki prestiżu i wpływów. Nadszedł czas, by nowy, silny ród objął przywództwo nad ummą!"
 tur_seize_the_caliphate_at: "To wydarzenie odblokuje misje ścieżki §Ylegalizmu§! lub §Ym istycyzmu§!."
 tur_creation_of_persian_eyalet_title: "Utwórz ejalet perski"
 tur_creation_of_persian_eyalet_desc: "Choć perscy heretycy nie stanowią już zagrożenia dla naszej dominacji w świecie arabskim, zarządzanie ich terytoriami po obu stronach Gór Zagros jest trudne. Ponownie potrzebujemy ejaletu, który będzie administrował dla nas regionem Persji."
 tur_creation_of_persian_eyalet_at: "Wystąpiło wydarzenie „§YAdministracja Persji§!”.
Wydarzenie uruchomi się, jeśli my lub nasz poddany będziemy posiadać §Y20§! prowincji w regionie §YPersji§!, a państwa §YPersja§!, §YArdabil§! lub §YFars§! nie będą istnieć."
 tur_creation_of_persian_eyalet_bt: "Dalsze wymagania zależą od naszego wyboru w wydarzeniu §YAdministracja Persji§!."
 tur_the_silk_road_title: "Jedwabny Szlak"
 tur_the_silk_road_desc: "Jedwabny Szlak był główną arterią średniowiecznego handlu, którą wymieniano towary między Azją a Europą. Wzrost naszej potęgi zakończył jednak jego znaczenie handlowe, ponieważ wskutek naszych embarg chrześcijańscy niewierni utracili możliwość handlu ze Wschodem.
Jeśli ponownie chcemy czerpać zyski z handlu z Azją, musimy zadbać o to, by azjatyckie towary docierały do Europy za naszym pośrednictwem."
 tur_imperial_fabrics_title: "Tkaniny cesarskie"
 tur_imperial_fabrics_desc: "Najcenniejszymi towarami przewożonymi Jedwabnym Szlakiem są jedwabie, tkaniny i dywany. Powinniśmy nauczyć się od naszych wschodnich partnerów handlowych wytwarzania materiałów tak doskonałej jakości. Dzięki temu zamiast jedynie handlować cudzymi tkaninami, będziemy mogli sprzedawać własne."
 tur_trade_with_india_title: "Handel z Indiami"
 tur_trade_with_india_desc: "Subkontynent indyjski jest skarbnicą niezwykłych towarów i bezcennych surowców. Możliwości handlowe w Indiach są niewątpliwie liczne, a zarazem niezwykle dochodowe."
 tur_trade_with_india_at: "To wydarzenie sprawi, że handel w §YIndiach§! stanie się bardziej dochodowy dla państwa §Y[Root.GetName]§! i jego indyjskiego sojusznika."
 tur_trade_with_indonesia_title: "Handel z Indonezją"
 tur_trade_with_indonesia_desc: "Europejskie mocarstwa wydają się mieć nienasycony apetyt na przyprawy z Indonezji. Są gotowe płacić za nie zawrotne ceny, nieosiągalne w naszym państwie. Powinniśmy rozszerzyć nasze wpływy zamorskie i przejąć część zysków z tego handlu."
 tur_pax_ottomana_title: "Pax Ottomana"
 tur_pax_ottomana_desc: "Żadne mocarstwo tego świata nie może się z nami równać, a żadne imperium heretyków ani wyznawców obcych religii nie jest w stanie nam zagrozić. Lud naszego wielkiego państwa [Root.GovernmentName] żyje w stabilnych i bezpiecznych czasach, podczas gdy wielki [Root.Monarch.GetTitle] rządzi rozległym imperium z siłą i mądrością."
 tur_embrace_the_military_doctrines_title: "Przyjmij doktryny wojskowe"
 tur_embrace_the_military_doctrines_desc: "Armia jest ucieleśnieniem siły i potęgi imperium. Bez niej żadne państwo nie może narzucać swojej woli na arenie wielkich mocarstw.
Choć w naszych szeregach nie brakuje żołnierzy, to właśnie dyscyplina i doktryny wojskowe pozwolą nam zwyciężać w bitwach. Budowa nowych koszar i ośrodków poborowych może przyciągnąć wojskowych geniuszy, których nasze państwo wyraźnie potrzebuje."
 tur_collect_the_siyasah_title: "Zbierz podatki siyasah"
 tur_collect_the_siyasah_desc: "System podatkowy naszego państwa jest złożoną mozaiką różnych podatków i zwyczajów przejętych z podbitych terytoriów. Brakuje nam jednolitego systemu, który uprościłby biurokrację poboru podatków. Być może inspiracja systemem siyasah stosowanym w innych państwach muzułmańskich pomoże nam rozwiązać ten problem."
 tur_most_humble_ottoman_ceo_title: "Światowe centrum handlu"
 tur_most_humble_ottoman_ceo_desc: "Wraz z rozwojem naszego imperium rośnie znaczenie miasta [Root.Capital.GetName]. Jest oczywiste, że miasto to jest nie tylko sercem naszego państwa, lecz także centrum światowego handlu. Musimy zadbać o to, abyśmy to my czerpali z niego największe korzyści."
 tur_issue_the_kannuname_title: "Ogłoś kanunname"
 tur_issue_the_kannuname_desc: "Jako dobrzy muzułmanie nasi władcy zawsze przestrzegali zasad szariatu ustanowionych przez Proroka (pokój z nim). Wielu naszych poddanych wyznaje jednak inne religie. Dawniej wyznawcy religii księgi mogli prowadzić własne sądy, co doprowadziło do powstania złożonego i nieporęcznego systemu sądowniczego. Nadszedł czas, by stworzyć kodeks prawny, który będzie podstawą rządów prawa dla wszystkich poddanych, niezależnie od wyznania."
 tur_3_toh_tt: "Posiada §Y3§! tolerancji wyznawców obcych religii."
 tur_3_tot_tt: "Posiada §Y3§! tolerancji prawdziwej wiary."
 tur_3_the_tt: "Posiada §Y3§! tolerancji heretyków."
 tur_second_islamic_golden_age_title: "Drugi złoty wiek islamu"
 tur_second_islamic_golden_age_desc: "Złoty wiek islamu był okresem wielkiego rozkwitu nauki, kultury i gospodarki państw muzułmańskich. Dla wielu z nas zakończył się on wraz z tragicznym oblężeniem Bagdadu przez Mongołów w 1258 roku i upadkiem kalifatu Abbasydów.
Wraz z naszym awansem do grona największych potęg nadszedł czas, by ponownie rozbudzić postęp świata islamu."
 tur_any_islamic_nation_higher_dev_or_army_tt: "Żadne inne państwo wyznające §Yislam§! nie ma większego od nas §Ypoziomu rozwoju§! ani §Yliczebności armii§!."
 tur_embrace_legalism_title: "[Root.GetPreviewColorTUR]Przyjmij legalizm[Root.GetPreviewColorTUR_end]"
 tur_embrace_legalism_desc: "Prawa islamu są naszym życiem. Przenikają wszystkie nasze działania, decyzje i osądy. Życie niezgodne ze słowem Allaha nie jest życiem właściwym.
Przyjmijmy wielkie zasady prawne naszej wiary i włączmy je do naszej kultury."
 tur_islamize_the_empire_title: "[Root.GetPreviewColorTUR]Meczety dla [Root.GovernmentName][Root.GetPreviewColorTUR_end]"
 tur_islamize_the_empire_desc: "Choć w naszym państwie [Root.GovernmentName] żyją wyznawcy wielu religii, przede wszystkim jest ono krainą islamu. Żaden chłop nie powinien mieszkać w wiosce opuszczonej przez Allaha."
 tur_rework_the_devshirme_system_title: "[Root.GetPreviewColorTUR]Skodyfikuj fiqh[Root.GetPreviewColorTUR_end]"
 tur_rework_the_devshirme_system_desc: "Fiqh to ludzkie rozumienie szariatu, czyli praw religijnych kształtujących tradycje islamu. Nasza wiara odgrywa kluczową rolę w społeczeństwie i rządzie. Powinniśmy skodyfikować fiqh i uczynić go jednym z filarów naszego państwa."
 tur_embrace_mysticism_title: "[Root.GetPreviewColorTUR]Przyjmij mistycyzm[Root.GetPreviewColorTUR_end]"
 tur_embrace_mysticism_desc: "Islam odgrywa istotną rolę w naszym społeczeństwie i kulturze. Niektórzy poświęcają całe życie prawom i zasadom naszej świętej religii. Nie musi to być cecha negatywna, gdyż istotą naszej wiary jest osiągnięcie bliskości z Allahem.
Przyjmijmy wielki mistycyzm naszej religii."
 tur_expand_the_dhimmi_title: "[Root.GetPreviewColorTUR]Meczety dla wyznawców obcych religii[Root.GetPreviewColorTUR_end]"
 tur_expand_the_dhimmi_desc: "W naszym państwie [Root.GovernmentName] żyją wyznawcy wielu religii. Choć nie zdają sobie z tego sprawy, również są umiłowani przez Allaha. Naszym obowiązkiem jest zapewnić, aby nawet poddani wyznający obce religie mieli meczet, który mogą odwiedzać."
 tur_develop_the_devshime_system_further_title: "[Root.GetPreviewColorTUR]Skodyfikuj sufizm[Root.GetPreviewColorTUR_end]"
 tur_develop_the_devshime_system_further_desc: "Choć nie przestrzegamy islamskiego kodeksu prawnego tak rygorystycznie jak inne muzułmańskie imperia, nadal musimy skodyfikować filozofię i idee sufizmu w naszym państwie."
 tur_one_faith_empire_title: "[Root.GetPreviewColorTUR]Państwo [Root.GovernmentName] wyznające [Root.Religion.GetName][Root.GetPreviewColorTUR_end]"
 tur_one_faith_empire_desc: "Chwała religii [Root.Religion.GetName] jest z nami. Oczyśćmy nasze państwo [Root.GovernmentName] z obcych zwyczajów niewiernych i zapewnijmy rozkwit wierze [Root.Religion.GetName]."
 tur_spread_the_true_faith_title: "[Root.GetPreviewColorTUR]Szerz prawdziwą wiarę[Root.GetPreviewColorTUR_end]"
 tur_spread_the_true_faith_desc: "Naszym boskim obowiązkiem jest szerzenie religii [Root.Religion.GetName] na tym świecie. Dopóki niesiemy światło [Root.Religion.GetName], nikt nie powinien kroczyć ścieżką ciemności!"
 tur_spread_the_true_faith_at: "Przymusowo nawrócono §Y15§! państw na religię §Y[Root.Religion.GetName]§! (§Y[Root.GetNumForceConvertedCountries]§!/§Y15§!)."
 tur_spread_the_true_faith_bt: "Nawrócono §Y150§! prowincji (§Y[Root.GetNumConvertedProvinces]§!/§Y150§!)."
 tur_dummy_mission_1_title: "[Root.GetSelectableMissionTitle]"
 tur_dummy_mission_1_desc: "[Root.GetSelectableMissionDescription]"
 tur_dummy_mission_2_title: "[Root.GetSelectableMissionTitle]"
 tur_dummy_mission_2_desc: "[Root.GetSelectableMissionDescription]"
 tur_dummy_mission_3_title: "[Root.GetSelectableMissionTitle]"
 tur_dummy_mission_3_desc: "[Root.GetSelectableMissionDescription]"
 tur_legalism_path_trigger_tt: "
Jeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ylegalizmu§!, do ukończenia tej misji będą wymagane następujące warunki:"
 tur_mysticism_path_trigger_tt: "
Jeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ymistycyzmu§!, do ukończenia tej misji będą wymagane następujące warunki:"
 tur_legalism_path_effects_tt: "
Jeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ylegalizmu§!, wystąpią następujące efekty:"
 tur_mysticism_path_effects_tt: "
Jeśli państwo §Y[Root.GetName]§! wybierze ścieżkę §Ymistycyzmu§!, wystąpią następujące efekty:"
 TUR_OTTOMAN_RED_SEA_ACCESS: "Osmański dostęp do Morza Czerwonego"
 tur_oppose_the_janissaries_title: "Rozwiąż kwestię janczarów"
 tur_oppose_the_janissaries_desc: "Janczarzy zdobyli potężną pozycję w naszym państwie i stanowią bezpośrednie zagrożenie dla stabilności rządu. Muszą zostać podporządkowani wszelkimi dostępnymi środkami."
 tur_oppose_the_janissaries_bt: "Przez §Y1 rok§! trwała katastrofa §YZamach stanu janczarów§!."
 tur_oppose_the_janissaries_at: "Nie trwa katastrofa §YZamach stanu janczarów§!.
Warunki te ulegną zmianie po wybuchu tej katastrofy."
 tur_oppose_the_janissaries_ct: "Odblokowuje decyzje §YWalcz z janczarami§! i §YNegocjuj z janczarami§! podczas katastrofy §YZamach stanu janczarów§!.
Decyzje te są wymagane do zakończenia katastrofy."
 tur_establish_the_new_army_title: "Zmodernizuj armię"
 tur_establish_the_new_army_desc: "Przez dziesięciolecia nasze siły zbrojne polegały na sile i dyscyplinie janczarów. Gdy ich działalność przestała koncentrować się na wojsku, dyscyplina naszych żołnierzy również gwałtownie osłabła. Nadszedł czas na modernizację armii."
 tur_establish_the_new_army_at: "Podjęto decyzję §YStaw czoła janczarom na Bałkanach§!."
 tur_establish_the_new_army_bt: "Odblokowuje decyzję §YStaw czoła janczarom w Anatolii§!."
 tur_establish_the_new_army_ct: "Odblokowuje decyzję §YStaw czoła janczarom w prowincji [Root.Capital.GetName]§!."
 tur_revoke_the_privileges_title: "Kajdany dewszirme"
 tur_revoke_the_privileges_desc: "System dewszirme przez lata dowodził swojej wartości, stanowiąc główne źródło nowych rekrutów do korpusu janczarów. Z czasem jednak coraz częściej go ignorowano. Obecnie działa wręcz na naszą niekorzyść, przyznając janczarom kolejne przywileje bez żadnych korzyści dla państwa.
Powinniśmy gruntownie zreformować ten przestarzały system albo ostatecznie go znieść."
 tur_the_mansure_reforms_title: "Armia mansure"
 tur_the_mansure_reforms_desc: "Wojsko imperium wymaga całkowitej przebudowy. Epoka janczarów, yayów i derbendżich dobiegła końca. Teraz nowa siła – Zwycięska Armia Mahometa – poprowadzi nasz wielki naród ku zwycięstwu!"
 tur_the_mansure_reforms_ct: "Wystąpiła katastrofa §YZamach stanu janczarów§!."
 tur_the_mansure_reforms_at: "Jeśli ukończymy tę misję, kończąc katastrofę §YZamach stanu janczarów§! po trzykrotnym starciu z buntownikami janczarskimi:"
 tur_crush_the_eyalet_rebellion_title: "Kryzys ejaletów"
 tur_crush_the_eyalet_rebellion_desc: "W miarę jak autorytet naszego [Root.Monarch.GetTitle] jest coraz częściej kwestionowany, ejalety – niegdyś lojalni poddani zarządzający naszymi terytoriami – zwracają się przeciwko nam. Sytuację należy ustabilizować."
 tur_centralize_the_power_title: "Połóż kres buntom ejaletów"
 tur_centralize_the_power_desc: "Niezależnie od tego, czy użyjemy dyplomacji, czy miecza, zbuntowane ejalety muszą zostać ponownie podporządkowane!"
 tur_centralize_the_power_at: "Zakończ katastrofę §YBunt ejaletów§!.
Dodaje dodatkowe §G+20§! punktów do argumentów za podporządkowaniem ejaletów."
 tur_had_power_struggle_for_three_years_tt: "Przez §Y3 lata§! trwała katastrofa §YWewnętrzna walka o władzę§!."
 tur_crush_the_eyalet_rebellion_at: "Przez §Y1 rok§! trwała katastrofa §YBunt ejaletów§!."
 HAS_BONUS_REIGN_IN_REASON: "Posiada dodatkowy argument za podporządkowaniem"
 tur_restructure_the_administration_title: "Przebuduj administrację"
 tur_restructure_the_administration_desc: "Millety – „prawo osobiste” grup wyznaniowych zamieszkujących nasze imperium – nigdy nie zostały ujednolicone. Zamiast tego paszowie mogli dowolnie je interpretować i stosować.
System milletów naszego rządu wymaga reformy, ponieważ pozostawia zbyt dużą autonomię."
 tur_remove_pashas_from_power_title: "Odsuń paszów od władzy"
 tur_remove_pashas_from_power_desc: "Wraz ze stagnacją imperium wielu paszów popadło w dekadencję i stało się nadmiernie ambitnych. Musimy zadbać o to, by władzę zachowali lojalni wobec nas namiestnicy, a buntownicy zostali usunięci."
 tur_remove_pashas_from_power_ct: "Przez §Y5 lat§! trwała katastrofa §YDekadencja paszów§!."
 tur_remove_pashas_from_power_tt: "Zakończ katastrofę §YDekadencja paszów§!."
 tur_regulate_the_harem_title: "Ureguluj funkcjonowanie haremu"
 tur_regulate_the_harem_desc: "Harem jest potężnym podmiotem politycznym w naszym państwie. Pierwotnie miał zapewniać następstwo tronu, lecz konkubiny i eunuchowie rozszerzyli swoje wpływy daleko poza to, na co powinien pozwalać status niewolników.
Jeśli autorytet sułtana ma pozostać nienaruszony, harem musi zostać poddany regulacjom."
 tur_regulate_the_harem_ct: "Przez §Y3 lata§! trwała katastrofa §YIntrygi haremu§!."
 tur_regulate_the_harem_at: "Łączna suma umiejętności £adm£ £dip£ i £mil£ władcy [Root.Monarch.GetName] wynosi co najmniej §Y10§!."
 tur_the_reign_of_women_title: "Sułtanat kobiet"
 tur_the_reign_of_women_desc: "Sułtanat kobiet to określenie okresu w naszej historii, w którym harem miał szczególnie duży wpływ na decyzje polityczne i rządy sułtanów. Część konserwatywnego społeczeństwa postrzega ten okres jako tragiczną katastrofę, inni zaś dostrzegają w nim wielką szansę. Kierunek, w jakim potoczą się te rządy, pozostaje otwarty..."
 tur_the_reign_of_women_at: "Łączna suma umiejętności £adm£ £dip£ i £mil£ władcy [Root.Monarch.GetName] wynosi co najmniej §Y15§!."
 tur_the_reign_of_women_tt: "Zakończ katastrofę §YIntrygi haremu§!."
 tur_the_reign_of_women_bt: "Reforma §YZmodernizowany rząd osmański§! będzie zawierać mechanikę §Yharemu§!.
Reforma zostanie odblokowana po zakończeniu katastrofy §YWewnętrzna walka o władzę§!."
 tur_the_reign_of_women_ct: "Reforma §YZmodernizowany rząd osmański§! NIE będzie zawierać mechaniki §Yharemu§!.
Reforma zostanie odblokowana po zakończeniu katastrofy §YWewnętrzna walka o władzę§!."
 tur_a_new_dawn_title: "Nowy świt"
 tur_a_new_dawn_desc: "Świat uznał nas za słabych – za niewielkie imperium, podobne do Rzymian z dawnych czasów. Stagnacja i zdrada sprowadziły na nas karę.
Niech świat, który pragnie naszego upadku, dowie się, że światło Allaha jest z nami. To, co wydaje się zmierzchem naszego wielkiego imperium, w przyszłych kronikach zostanie nazwane nowym świtem Imperium Osmańskiego!"
 tur_according_to_ruler_ability_tt: "Poniższa nagroda została uzgodniona między §Y[Root.Monarch.GetName]§! a przywódcą korpusu janczarów zgodnie z postanowieniami §YPrawa Toprak§!."
 tur_janissaries_kill_ruler: "Zbuntowani §Yjanczarzy§! mogą pojmać i stracić §Y[Root.Monarch.GetName]§!!"
 flavor_tur.3750.a.tt: "Opinia każdego znanego państwa §Yortodoksyjnego§! o państwie §Y[Root.GetName]§! zmienia się o §G+25§!."
 flavor_tur.3750.b.tt: "Opinia każdego znanego państwa §Yortodoksyjnego§! o państwie §Y[Root.GetName]§! zmienia się o §R-25§!."
 flavor_tur.200.t: "Układ handlowy [Root.GetAdjective]-wenecki?"
 flavor_tur.200.desc: "Choć weneckie państwo [VEN.GovernmentName] i państwo [Root.GetAdjective] [Root.GovernmentName] wielokrotnie w przeszłości popadały ze sobą w konflikty, kupcy obu krajów nieprzerwanie prowadzili wymianę handlową. Sformalizowanie tych nieoficjalnych stosunków w postaci odpowiedniego układu handlowego mogłoby przynieść obu stronom znaczne korzyści. W związku z tym [VEN.Monarch.GetTitle] Wenecji przybył na dwór [Root.Monarch.GetName] z ostateczną propozycją handlową."
 flavor_tur.200.a: "Przyjmij układ handlowy z Wenecją"
 flavor_tur.200.a.tt: "Państwo §Y[Root.GetName]§! zawrze układ handlowy z §YWenecją§!, przyznając jej §G100§! siły handlu w macierzystym węźle handlowym do czasu rozwiązania sojuszu między oboma państwami."
 tur_end_of_venetian_trade_deal_tt: "do czasu zerwania sojuszu z partnerem handlowym przez §YWenecję§! lub §YOsmanów§!"
 TUR_VEN_TRADE_DEAL: "Układ handlowy osmańsko-wenecki"
 flavor_tur.200.b: "Odrzuć układ handlowy"
 flavor_tur.201.t: "Koniec układu handlowego [Root.GetAdjective]-weneckiego"
 flavor_tur.201.desc: "W wyniku ostatnich incydentów i wydarzeń międzynarodowych stosunki między Wenecjanami a nami osiągnęły nowy poziom napięcia, doprowadzając do zerwania sojuszu i rozwiązania układu handlowego."
 flavor_tur.201.a: "Tak już bywa."
 flavor_tur.201.a.tt: "Wszystkie prowincje korzystające z układu handlowego §Rtracą§! premię do produkcji dóbr handlowych."
 flavor_tur.202.t: "Rozszerzyć układ handlowy?"
 flavor_tur.202.desc: "Podpisaliśmy kilka hojnych porozumień z handlowym imperium państwa [tur_ottoman_trade_partner.GetName], aby zapewnić obu stronom korzyści z wymiany handlowej. Z czasem wpływy [tur_ottoman_trade_partner.GetAdjective] w handlu czarnomorskim stale rosły. Warto rozważyć rozszerzenie układu handlowego albo jego zakończenie na rzecz bardziej merkantylistycznej gospodarki."
 flavor_tur.202.a: "Rozszerz układ handlowy"
 TUR_VEN_TRADE_DEAL_EXPANDED: "Rozszerzone układy handlowe osmańsko-weneckie"
 IS_EYALET_EVENT_TT: "To wydarzenie pozwoli nam podnieść rangę naszego poddanego do statusu §Yrdzennego ejaletu§!."
 flavor_tur.202.b: "Utrzymaj status quo"
 flavor_tur.202.c: "Zakończ układ handlowy"
 flavor_tur.203.t: "Zwycięstwo nad krucjatą warneńską"
 flavor_tur.203.desc: "Po klęsce chrześcijan w bitwie pod Warną na Bałkanach ponownie zapanował pokój. Nasz sułtan, najdroższy ojciec Murad, odpowiedział na wezwanie syna i chwycił za broń, by bronić nas przed najeźdźcami. Odniósł wielkie zwycięstwo, choć jego cena była wysoka. Obie strony poniosły ciężkie straty, a nasi żołnierze potrzebują czasu, by dojść do siebie po odniesionych ranach. Chrześcijanie wyszli jednak z tej walki w znacznie gorszym stanie — poległ Władysław III. Zarówno Polska, jak i Węgry pogrążyły się w chaosie bezkrólewia. Inshallah, ich nieszczęścia będą trwać nadal. Nasze zwycięstwo wstrząsnęło Europą i całym chrześcijaństwem, a wszyscy drżą przed potęgą Wzniosłego Państwa Osmańskiego. Nikt nie ośmieli się podnieść ręki, gdy będziemy podbijać Bałkany. Serbia będzie nasza. Wołoszczyzna będzie nasza. Albańczycy zostaną poskromieni, a Skanderbeg zginie jak pies, którym jest. Zdobędziemy również największą nagrodę: Konstantynopol."
 flavor_tur.203.a: "Kości zostały rzucone..."
 flavor_tur.204.t: "Inżynier oblężniczy Urban"
 flavor_tur.204.desc: "Urban był ludwisarzem i inżynierem pochodzącym z węgierskiej prowincji Braszów. Jako jeden z pionierów inżynierii oblężniczej i budowy artylerii utrzymywał się z produkcji machin wojennych. W roku [GetYear] próbował zaoferować swoje usługi cesarzowi bizantyjskiemu, lecz ten nie był w stanie opłacić jego wynagrodzenia ani zapewnić materiałów potrzebnych do budowy tak potężnych dział. Urban został więc zmuszony zwrócić się do osmańskiego [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Obiecał stworzyć armatę wystarczająco wielką i potężną, by wysadzić „same mury Babilonu”."
 flavor_tur.204.a: "Mówisz, że same mury Babilonu?..."
 flavor_tur.204.a.tt: "Mury prowincji §Y[151.GetName]§! runą, gdy tylko nasze wojska rozpoczną jej oblężenie."
 flavor_tur.204.b: "Nie stać nas na jego usługi."
 TUR_GRIP_OVER_THE_BOSPBORUS: "Kontrola nad Bosforem"
 flavor_tur.205.t: "Wielka stolica Konstantynijja"
 flavor_tur.205.desc: "Mury zostały przełamane, brama padła, a klejnot niegdyś potężnego Cesarstwa Rzymskiego znajduje się teraz w naszych rękach. Wspaniały [Root.Monarch.GetTitle] nakazał [Root.Monarch.GetHerHis] wojskom oszczędzić niegdyś kwitnącą metropolię przed dalszym plądrowaniem i niszczeniem, ponieważ ma wobec niej własne plany.
Mury zostaną odbudowane, domy odnowione, a siedziba władzy przeniesiona do Konstantynijji. Rząd pod nadzorem [Root.Monarch.GetName] podejmuje liczne działania, aby przywrócić nowej stolicy Osmanów dawną świetność, między innymi przesiedlając do niej ludność z innych ziem. Napływ mieszkańców przyciągnął wielu utalentowanych ludzi, przede wszystkim rzemieślników, architektów i artystów. Dzięki ich umiejętnościom oraz opiece naszego [Root.Monarch.GetTitle] stolica wkracza w nową złotą erę. Konstantynijja ponownie stanie się perłą Morza Śródziemnego."
 flavor_tur.205.a: "Oto początek naszej ery klasycznej!"
 flavor_tur.206.t: "Wewnętrzna struktura władzy"
 flavor_tur.206.desc: "Rząd osmański łączy rzymski system administracji z prawami i ideami Koranu. Choć sprawdza się w swoich zadaniach, przynosi te same problemy, z którymi musieli mierzyć się dawni Rzymianie: wewnętrzną walkę o władzę. Janczarzy, harem, wysoce autonomiczni paszowie i ejalety oraz poddani dążący do niezależności stanowią poważne zagrożenie dla państwa osmańskiego.

Na szczęście dla młodego [Root.Monarch.GetTitle] [Root.Monarch.GetName] problemy te będą dotyczyć dopiero jego następców, ponieważ obecnie trwa okres wzrostu potęgi Osmanów."
 flavor_tur.206.a: "Obyśmy stworzyli imperium, które przetrwa próbę czasu!"
 flavor_tur.206.a.tt: "Skuteczność i stabilność administracji wewnętrznej mierzy wskaźnik §Ydekadencji osmańskiej§!. Jeśli osiągnie on wartość §Y100§!, może wybuchnąć katastrofa §YWewnętrzna walka o władzę w Imperium Osmańskim§!.
Najedź kursorem na pasek postępu §YDekadencji§! w zakładce §YRząd§! państwa, aby w dowolnym momencie sprawdzić aktualną wartość §Ydekadencji osmańskiej§!."
 flavor_tur.207.t: "Położenie kresu rycerskiej pladze"
 flavor_tur.207.desc: "Samo twierdzenie, że joannici są ludźmi wiary, jest żartem. Być może za czasów Saladyna stanowili szanowaną organizację, choć nadal wyznającą obcą religię. W ostatnich latach zakon stał się jednak zwykłą bandą piratów i rabusiów, nękających nasze szlaki żeglugowe i przejmujących towary pokojowo nastawionych kupców. Na szczęście, odkąd wyparliśmy tę bandę złodziei z Rodos, nasi kupcy mogą ponownie bez przeszkód przemierzać morza, a mieszkańcy nadmorskich osad spać spokojnie, nie obawiając się napadów frankijskich rabusiów."
 flavor_tur.207.a: "Niech nasze wybrzeża będą bezpieczne i niech rozkwitają!"
 flavor_tur.207.a.tt: "Każda prowincja nadbrzeżna dotknięta najazdami korsarskimi otrzyma:"
 flavor_tur.208.t: "Janczarzy"
 flavor_tur.208.desc: "Tradycyjnie armia osmańska składała się głównie z kawalerii. W połowie XIV wieku Orhan I, a później jego syn Murad I, powołali janczarów – elitarną formację, której lojalność należała wyłącznie do sułtana. Rekrutowani spośród jeńców wojennych i niewolników janczarzy stali się trzonem armii osmańskiej, otrzymując regularny żołd i przechodząc rygorystyczne szkolenie.

Z czasem janczarzy zdobywali coraz większą władzę i wpływy w państwie, ponieważ sułtani coraz bardziej polegali na ich usługach. Obecnie stanowią odrębną klasę wojowników w społeczeństwie osmańskim i mogą domagać się znaczących przywilejów, jeśli nie zostaną odpowiednio kontrolowani."
 flavor_tur.208.a: "Ostatecznie są jednak tylko kolejną figurą na szachownicy."
 flavor_tur.209.t: "Ejalet Węgier"
 flavor_tur.209.desc.a: "Królestwo Węgier było jednym z głównych rywali na Bałkanach. Nawet jego najtwardsi obrońcy nie zdołali jednak powstrzymać naszego natarcia i państwo upadło pod naporem wojsk [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Niegdyś potężne królestwo stało się kolejnym z wielu naszych poddanych. Pozostaje teraz zdecydować, jak będzie wyglądać administracja ziem węgierskich..."
 flavor_tur.209.desc.b: "Królestwo Węgier było jednym z głównych rywali na Bałkanach. Nawet jego najtwardsi obrońcy nie zdołali jednak powstrzymać naszego natarcia i państwo upadło pod naporem wojsk [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Niegdyś potężne królestwo jest teraz jedynie zbiorem podbitych terytoriów zarządzanych przez naszych paszów."
 flavor_tur.209.a: "Ustanów rdzenny ejalet Węgier."
 flavor_tur.209.b: "Pozwól Węgrom zarządzać własnymi sprawami."
 flavor_tur.209.c: "Węgry staną się częścią naszego rdzennego terytorium."
 flavor_tur.209.d: "Tak, tak, kolejne królestwo klęka przed naszą potęgą. Och, czas na poezję!"
 flavor_tur.210.t: "Administracja ziem węgierskich"
 flavor_tur.210.desc: "Królestwo Węgier było niegdyś jednym z głównych rywali w naszych działaniach na Bałkanach. Los nie był mu jednak przychylny i jego niewielkie królestwo ostatecznie uklękło przed nami. Liczne prowincje królestwa znajdują się teraz w naszym posiadaniu. Choć wcielenie ich jako ziem narodowych do imperium byłoby prostsze, warto rozważyć utworzenie ejaletu, który zarządzałby w naszym imieniu ziemiami wyznawców obcych religii."
 flavor_tur.210.a: "Utwórz ejalet [first_potential_eyalet.GetName]."
 flavor_tur.210.b: "[second_potential_eyalet.GetName] stanie się naszym ejaletem Karpat."
 flavor_tur.210.c: "Tylko państwo [third_potential_eyalet.GetName] może reprezentować nasze interesy."
 flavor_tur.210.d: "Utworzenie ejaletu w tym regionie przyniosłoby niewielkie korzyści."
 flavor_tur.211.t: "Upadek Wiednia"
 flavor_tur.211.desc: "Wiedeń – siedziba władzy dynastii von Habsburgów, odwiecznych rywali rodu Osmanów – padł przed potęgą Imperium Osmańskiego! Miasto stawiło naszym wojskom godny opór, a sojusz austriacki walczył dzielnie, lecz bezskutecznie. Ostatecznie żaden z przeciwników nie zdołał sprostać naszym przebiegłym taktykom i doskonale zdyscyplinowanym żołnierzom.
Gdy cesarska stolica zostaje złupiona, chrześcijanie Europy drżą przed naszym natarciem. Wiedzą bowiem, że nasz marsz nie zakończy się na Wiedniu!"
 flavor_tur.211.a: "Brama do Europy jest nasza! Niech będzie to zwiastun nowej ery!"
 flavor_tur.211.a.tt: "Każde znane państwo §Ychrześcijańskie§! w regionach §YPółnocnych Niemiec§!, §YPołudniowych Niemiec§! i §YWłoch§! otrzymuje wydarzenie „§YNadchodzi tureckie zagrożenie!§!”."
 flavor_tur.212.t: "Nadchodzi tureckie zagrożenie!"
 flavor_tur.212.desc: "Wiedeń, stolica Świętego Cesarstwa Rzymskiego i główna siła przeciwstawiająca się Imperium Osmańskiemu, upadł! Krwiożerczy janczarzy Osmanów złupili miasto i spustoszyli okoliczne ziemie!
Chrześcijanie całej Europy Środkowej zwracają się do swoich władców, żądając ochrony przed tureckim zagrożeniem, lecz nawet najroztropniejsi królowie i dożowie mogą odczuwać jedynie strach!"
 flavor_tur.212.a: "Koniec jest bliski! Niech Pan zlituje się nad naszymi duszami."
 flavor_tur.213.t: "Podporządkowanie Austrii"
 flavor_tur.213.desc: "Stosunki austriacko-osmańskie od dawna kształtowały konflikty, wojny i rywalizacja o wpływy na Bałkanach. Ostatecznie jednak arcyksiążę Austrii i cesarz ich podróbki Cesarstwa Rzymskiego musieli zaakceptować porażkę – ich księstwo stało się teraz jedynie wasalem naszego państwa [Root.GovernmentName].
Wielki wezyr [Root.Monarch.GetName] zaproponował upokorzenie niegdyś potężnego posiadacza cesarskiego tytułu. Przedstawił dwie możliwości: możemy pozbawić Habsburgów władzy w Austrii i przekształcić ją w prawdziwy ejalet naszego imperium albo pozwolić im zachować ich niewielkie księstwo i zmusić do wykonywania błahych obowiązków administracyjnych, codziennie przypominając im, że są sługami dynastii Osmanów."
 flavor_tur.213.a: "Zachowajmy pragmatyzm. Przekształćmy Austrię w nasz ejalet."
 flavor_tur.213.b: "Habsburski sługo, na ziemi jest plama. Wyczyść ją."
 flavor_tur.214.t: "Administracja północnych Włoch"
 flavor_tur.214.desc: "Księstwa i republiki północnych Włoch od zawsze były podzielone przez wewnętrzne spory i drobne intrygi. Nic dziwnego, że żadne z włoskich państw nie miało z nami szans. Jeden po drugim dożowie i książęta poddawali się [Root.Monarch.GetTitle].
Podbój włoskich państw przebiegł stosunkowo łatwo, lecz zarządzanie tym terytorium stanowi zupełnie inne wyzwanie. Warto rozważyć ustanowienie ejaletu w tym regionie i powierzenie reprezentowania naszej woli jednemu z miejscowych polityków."
 flavor_tur.214.a: "Utwórz ejalet [first_potential_eyalet.GetName]."
 flavor_tur.214.b: "Państwo [second_potential_eyalet.GetName] będzie zarządzać północnymi Włochami."
 flavor_tur.214.c: "Wyznacz paszę dla ejaletu [third_potential_eyalet.GetName]."
 flavor_tur.214.d: "[fourth_potential_eyalet.GetName] będzie naszym administratorem."
 flavor_tur.214.e: "Kupcy z [fifth_potential_eyalet.GetName] mogą zająć się tym zadaniem."
 flavor_tur.215.t: "Los Sycylii"
 flavor_tur.215.desc: "Sycylia, niegdyś siedziba jednego z muzułmańskich królestw średniowiecza, znajduje się teraz pod naszą kontrolą. Zgodnie ze zwyczajem ponownie pojawiło się pytanie, czy powinniśmy ustanowić nowy ejalet na podbitym terytorium. Większość ejaletów wykorzystuje w pewnym stopniu lokalne struktury władzy, aby zarządzać podległymi ziemiami, lecz tym razem [Root.GetClergyName] zwróciło się bezpośrednio do [Root.Monarch.GetName]. Ze względu na historię Sycylii i jej znaczenie jako ważnego ośrodka kulturowego i politycznego średniowiecznego świata muzułmańskiego duchowieństwo pragnie, aby nasz południowowłoski ejalet stanowił odrodzenie samego emiratu Siqilliya."
 flavor_tur.215.a: "Siqilliya powstanie z popiołów."
 flavor_tur.215.b: "Ich czas dawno minął. Południowe Włochy pozostaną pod naszą bezpośrednią kontrolą."
 flavor_tur.216.t: "Korona Rzymu"
 flavor_tur.216.desc: "Rzym jest jednym z najbardziej spornych tytułów w historii świata. Uważano, że jego dzieje zakończyły się wraz z upadkiem Konstantynopola w pierwszej połowie XV wieku. Pomimo wszystkich niedowiarków, którzy odmawiali nam tego tytułu, zgromadziliśmy pod naszą potęgą i kontrolą ziemie dawnego Cesarstwa Rzymskiego. Możemy zatem z dumą ogłosić, że złota era imperiów nadal trwa, a tytuł ten prawowicie należy do naszego sułtana [Root.Monarch.GetName]!"
 flavor_tur.216.a: "Jesteśmy kontynuacją największego imperium świata!"
 flavor_tur.216.b: "Rzym może i jest teraz nasz, lecz naszą tożsamością pozostaje państwo [Root.GetName]."
 flavor_tur.217.t: "Nowa stolica cesarstwa?"
 flavor_tur.217.desc: "Po podboju Rzymu, miasta, od którego Cesarstwo Rzymskie wzięło swoją nazwę, nasze roszczenia do rzymskiej korony nie mogą już być kwestionowane. Ponieważ serce imperium znajduje się teraz w naszych granicach, pojawia się pytanie, czy powinniśmy przenieść stolicę z Konstantynijji do Rzymu. Nasza władza nad Włochami byłaby absolutna, lecz z drugiej strony moglibyśmy rozbudować urzędy i infrastrukturę Konstantynijji, aby umocnić kontrolę nad ejaletami."
 flavor_tur.217.a: "Rzym zostanie nową stolicą."
 tur_accept_all_italian_cultures_tt: "Wszystkie kultury z grupy kulturowej §Yromańskiej§! zostaną zaakceptowane. Efekt zostanie usunięty, jeśli zdegradujemy dowolną kulturę §Yromańską§!."
 tur_take_over_italian_eyalets_tt: "§YEjalety§! ze stolicą we §YWłoszech§! przekażą wszystkie swoje włoskie prowincje państwu §Y[Root.GetName]§!.
§Y[Root.GetName]§! otrzyma rdzeń terytorialny na każdej przekazanej prowincji."
 flavor_tur.217.b: "Konstantynijja jest jedyną prawowitą stolicą imperium."
 tur_enable_central_italy_eyalet_event_tt: "Może wystąpić wydarzenie §YEjalet Rzymu§!."
 flavor_tur.218.t: "Ejalet Rzymu"
 flavor_tur.218.desc: "Wielkie miasto Rzym należy do nas. Jednak decyzja o pozostawieniu stolicy w [Root.Capital.GetName] sprawia, że zarządzanie tak prestiżowym miastem jest trudnym zadaniem. Na szczęście wielu ludzi z entuzjazmem podejmie się administrowania terytorium wokół dawnej cesarskiej stolicy."
 flavor_tur.218.a: "Utwórzmy ejalet [first_potential_eyalet.GetName]."
 flavor_tur.218.b: "Ejalet [second_potential_eyalet.GetName] będzie zarządzać Rzymem."
 flavor_tur.218.c: "Nie potrzebujemy ich pomocy. Sami możemy kontrolować Rzym."
 flavor_tur.219.t: "Moryskowie przybywają z Grenady"
 flavor_tur.219.desc: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] rozesłał po całym imperium odezwy nakazujące przyjąć uchodźców. Zezwolił im osiedlać się w Imperium Osmańskim i uzyskać obywatelstwo. Wyśmiał postępowanie monarchów Kastylii i Aragonii, którzy wypędzili grupę ludzi tak użytecznych dla swoich poddanych. „Ośmielacie się nazywać [CAS.Monarch.GetName] mądrym władcą – powiedział swoim dworzanom – a przecież zubożył [CAS.Monarch.GetHerHis] własny kraj i wzbogacił mój!”. [Root.Monarch.GetName] skierował firman do wszystkich gubernatorów europejskich prowincji, nakazując im nie tylko nie odrzucać hiszpańskich uchodźców, lecz także przyjąć ich życzliwie i gościnnie. Zagroził śmiercią każdemu, kto potraktuje morysków surowo lub odmówi im wstępu do imperium."
 flavor_tur.219.a: "Są tu mile widziani."
 flavor_tur.219.b: "Nie możemy ryzykować gniewu monarchów iberyjskich."
 flavor_tur.220.t: "Ejalet Al-Andalus"
 flavor_tur.220.desc: "Półwysep Iberyjski był niegdyś siedzibą wielu muzułmańskich sułtanatów. Hiszpanie i Portugalczycy ostatecznie wyparli jednak muzułmanów z obszaru dawnego Al-Andalus i na ruinach państw naszych braci w wierze utworzyli własne królestwa. Z woli Allaha niewierni zostali pokonani, a Al-Andalus ponownie uwolniło się spod wpływów iberyjskich.

Administracja Al-Andalus stanowi jednak osobne wyzwanie. Bezpośrednie umocnienie naszej kontroli nad tym regionem wymagałoby ogromnego wysiłku, a korzyści mogłyby nie być tego warte. Utworzenie wielkiego ejaletu Al-Andalus może okazać się najlepszym rozwiązaniem."
 flavor_tur.220.a: "Zaiste. Iberią będzie zarządzać nasz najbardziej prestiżowy ejalet."
 flavor_tur.220.b: "Terytorium Al-Andalus stanie się częścią naszego imperium."
 flavor_tur.221.t: "Ejalet Tunisu"
 flavor_tur.221.desc.a: "Sułtanat Tunezji jest krainą korsarzy i piratów morskich. Choć łączy nas wiara, ich zwyczaje znacznie różnią się od osmańskich. Nie można jednak zaprzeczyć, że ich najazdy na wybrzeża przynoszą nam znaczne korzyści."
 flavor_tur.221.desc.b: "Sułtanat Tunezji jest krainą korsarzy i piratów morskich. Choć łączy nas wiara, ich zwyczaje znacznie różnią się od osmańskich. Nie można jednak zaprzeczyć, że ich najazdy na wybrzeża przynoszą nam znaczne korzyści. Obecnie terytorium to jest zarządzane przez naszych paszów."
 flavor_tur.221.a: "Powinniśmy ustanowić rdzenny ejalet Tunisu."
 flavor_tur.221.b: "Pozwól Tunezyjczykom zarządzać własnymi sprawami."
 flavor_tur.221.c: "Tunis stanie się częścią naszego rdzennego terytorium."
 flavor_tur.222.t: "Administracja Tunisu"
 flavor_tur.222.desc: "Sułtanat Tunezji jest krainą korsarzy i piratów morskich. Choć łączy nas wiara, ich zwyczaje znacznie różnią się od osmańskich. Nie można jednak zaprzeczyć, że ich najazdy na wybrzeża przynoszą nam znaczne korzyści. Warto rozważyć ustanowienie stosunkowo autonomicznego ejaletu, który będzie dzielił się z nami łupami."
 flavor_tur.222.a: "Zaiste. Ustanowimy ejalet [first_potential_eyalet.GetName]."
 flavor_tur.222.b: "Podoba mi się nazwa ejalet [second_potential_eyalet.GetName]."
 flavor_tur.223.t: "Hayreddin Barbarossa"
 flavor_tur.223.desc: "Hizir Reis rozpoczął karierę jako osmański korsarz i zdobył sławę, służąc u boku starszego brata, Oruca Reisa. W 1516 roku bracia zdobyli Algier z rąk Hiszpanów, a Oruc ogłosił się sułtanem. Gdy jego brat zginął w 1518 roku, Hizir odziedziczył przydomek Oruca „Barbarossa” (po włosku „Rudobrody”) i otrzymał honorowe imię Hayreddin. Z biegiem czasu Barbarossa awansował w szeregach osmańskiej marynarki wojennej i odniósł wiele kluczowych zwycięstw na morzu, które doprowadziły do tureckiej dominacji na Morzu Śródziemnym w połowie XVI wieku. Ostatecznie w 1533 roku sułtan Sulejman Wspaniały mianował go kapudan paszą, czyli wielkim admirałem floty osmańskiej."
 flavor_tur.223.a: "Będzie znakomitym admirałem!"
 flavor_tur.224.t: "Administracja Algieru"
 flavor_tur.224.desc: "Algier i Wybrzeże Berberyjskie od stuleci stanowią obszar sporu między ludami Maghrebu a Iberami. Dzięki naszej interwencji chronimy ten region przed dalszą ingerencją chrześcijan.
Zgodnie ze zwyczajem trwają już przygotowania do ustanowienia kolejnego ejaletu..."
 flavor_tur.224.a: "Utwórz ejalet [first_potential_eyalet.GetName]."
 flavor_tur.225.t: "Ejalet Maroka"
 flavor_tur.225.desc: "Sułtanat Maroka przez dziesięciolecia był zagrożony aneksją przez państwa iberyjskie. Na szczęście nasz wielki [Root.Monarch.GetTitle] interweniował w jego obronie i zapewnił marokańskim poddanym nowe miejsce w naszym państwie [Root.GovernmentName]."
 flavor_tur.225.a: "Powinniśmy ustanowić rdzenny ejalet Maroka."
 flavor_tur.225.b: "Marokańczycy będą mieli u nas dobrze."
 flavor_tur.225.c: "Terytorium Maroka powinno stać się zwykłymi prowincjami naszego imperium."
 flavor_tur.226.t: "Administracja Maroka"
 flavor_tur.226.desc: "Sułtanat Maroka przez dziesięciolecia był zagrożony aneksją przez państwa iberyjskie. Na szczęście nasz wielki [Root.Monarch.GetTitle] interweniował w jego obronie i zapewnił marokańskim poddanym nowe miejsce w naszym państwie [Root.GovernmentName]. Odległość między [Root.Capital.GetName] a ziemiami marokańskimi jest jednak zbyt duża, byśmy mogli skutecznie nimi zarządzać. Warto więc rozważyć ustanowienie w tym regionie ejaletu."
 flavor_tur.226.a: "Ejalet [first_potential_eyalet.GetName] będzie naszą najbardziej wysuniętą na zachód granicą."
 flavor_tur.227.t: "Ejalet Adal"
 flavor_tur.227.desc: "Sułtanat Adal jest otoczony przez wrogów islamu. Koptyjskie państwo Etiopii na zachodzie oraz poganie z południa zagrażali istnieniu sułtanatu. Tylko dzięki naszej interwencji mieszkańcy Adalu nie muszą obawiać się ucisku pod rządami wyznawców obcych religii."
 flavor_tur.227.a: "Powinniśmy ustanowić rdzenny ejalet Adal."
 flavor_tur.227.b: "Mieszkańcy Adalu będą mieli u nas dobrze."
 flavor_tur.227.c: "Terytorium Adalu powinno stać się zwykłymi prowincjami naszego imperium."
 flavor_tur.228.t: "Administracja Rogu Afryki"
 flavor_tur.228.desc: "Nasze państwo [Root.GovernmentName] rozszerzyło się na Róg Afryki. Tam, gdzie niegdyś panowały dumne sułtanaty Adal i niewielkie chrześcijańskie królestwa, powiewa teraz flaga Osmanów.
Terytoria położone za Egiptem znajdują się jednak daleko poza naszym zasięgiem. Bezpośrednie zarządzanie nimi byłoby możliwe, lecz większe korzyści może przynieść przekazanie ich pod kontrolę ejaletu."
 flavor_tur.228.a: "Ejalet [first_potential_eyalet.GetName] będzie naszą najbardziej wysuniętą na południe granicą."
 flavor_tur.229.t: "Nowa głowa wspólnoty muzułmańskiej"
 flavor_tur.229.desc: "Od czasu zdobycia Edirne przez Murada Hudavendigara w 1362 roku nasi sułtani formalnie rościli sobie prawo do tytułu kalifa, przywódcy wspólnoty muzułmańskiej. Teraz, gdy przejęliśmy pełną kontrolę nad Kairem, udało nam się jednak sprowadzić do Konstantynijji ostatniego kalifa Abbasydów, Al-Mutawakkila III, aby formalnie przekazał tytuł kalifa sułtanowi [Root.Monarch.GetName], wręczając mu miecz i płaszcz Mahometa. Jest to nie tylko wielkie osiągnięcie dla naszego sułtana w polityce wewnętrznej, lecz także źródło autorytetu nad wszystkimi muzułmanami poza naszymi granicami. Daje nam to większe możliwości ochrony tych, którzy mają nieszczęście żyć pod rządami niemuzułmanów.
Pozostaje jednak pytanie, jaką drogę religijną i duchową obierze nasz kalifat. W naszym rządzie obecne są zarówno legalizm, jak i sufizm, lecz tylko jeden z tych nurtów może stać się podstawą polityki państwa."
 flavor_tur.229.a: "Musimy przyjąć i chronić prawa islamu."
 tur_legalism_path_tt: "Odblokowuje ścieżkę misji §Ylegalizmu§!."
 flavor_tur.229.b: "Tylko poprzez mistycyzm możemy odnaleźć miłosierdzie Allaha."
 tur_mysticism_path_tt: "Odblokowuje ścieżkę misji §Ymistycyzmu§!."
 flavor_tur.230.t: "Koniec kalifatu"
 flavor_tur.230.desc: "Od czasu zdobycia Edirne przez Murada Hudavendigara w 1362 roku nasi sułtani formalnie rościli sobie prawo do tytułu kalifa, przywódcy wspólnoty muzułmańskiej. Kolejne dziesięciolecia zmusiły jednak nasze państwo do przemian i przyjęcia religii [Root.Religion.GetName]. Tytuł kalifa nie ma już zatem dla nas żadnego znaczenia. Los sprawił, że pojmaliśmy kalifa Abbasydów i sprowadziliśmy go do [Root.Capital.GetName]. Ten czyn położył kres idei kalifatu nie tylko w państwie [Root.GetUsableName], lecz także w całym świecie muzułmańskim."
 flavor_tur.230.a: "Cóż za ironiczny obrót spraw."
 tur_non_muslim_path_tt: "Odblokowuje ścieżkę misji §Yreligijnej§!."
 flavor_tur.231.t: "Zwycięstwo dynastii [Root.Monarch.Dynasty.GetName]"
 flavor_tur.231.desc: "„To piękne; tak piękne, że człowiekowi łzy napływają do oczu. Ach, płaczę! Płaczę na widok rozkwitu mojego imperium. Moje armie podporządkowały sobie całą Anatolię, a drobni bejowie i Ak Kojunlu zostali pokonani. Ormianie, Kurdowie i Grecy pontyjscy nazywają mnie swoim sułtanem. Jakże Wszechmogący mnie pobłogosławił, pozwalając mi władać tak rozległymi i wspaniałymi ziemiami! Sam Osman Gazi musi spoglądać na mnie z góry, wiedząc, że jego dziedzictwo jest bezpieczne w moich rękach. Serce drży mi na samą myśl o tym”.
– [Root.Monarch.GetTitle] [Root.Monarch.GetName]"
 flavor_tur.231.a: "Dzień świętowania!"
 flavor_tur.232.t: "Koptyjski Kościół Ortodoksyjny"
 flavor_tur.232.desc: "Koptyjski Kościół i jego wyznawcy zamieszkują region Kaukazu od stuleci. Wojny i klęski głodu pustoszyły te ziemie, gdy kolejni pretendenci do podboju próbowali podporządkować sobie mieszkańców gór. Teraz jednak same góry drżą przed nami, a podzielone chrześcijańskie królestwa i plemiona znalazły się w naszej strefie wpływów."
 flavor_tur.232.a: "Nie ma góry zbyt stromej, byśmy nie mogli jej zdobyć!"
 flavor_tur.233.t: "Ejalet Jemenu"
 flavor_tur.233.desc: "Sułtanat Jemenu zajmuje silną pozycję handlową dzięki położeniu bezpośrednio nad Zatoką Adeńską. Niegdyś zagrożony przez szyickie siły w tym regionie, obecnie jest częścią naszego nieustannie rosnącego imperium i najnowszym kandydatem do ustanowienia ejaletu."
 flavor_tur.233.a: "Powinniśmy ustanowić rdzenny ejalet Jemenu."
 flavor_tur.233.b: "Jemen będzie cieszyć się dobrobytem pod naszym panowaniem."
 flavor_tur.233.c: "Terytorium Jemenu powinno stać się zwykłymi prowincjami naszego imperium."
 flavor_tur.234.t: "Administracja Jemenu"
 flavor_tur.234.desc: "Nasze państwo [Root.GovernmentName] podbiło południowe obszary Arabii. Sułtanat Jemenu i jego terytoria należą teraz do Imperium Osmańskiego.
Zatoka Adeńska leży jednak daleko od [Root.Capital.GetName]. Bezpośrednie zarządzanie tym regionem byłoby możliwe, lecz większe korzyści może przynieść przekazanie go pod kontrolę ejaletu."
 flavor_tur.234.a: "Ejalet [first_potential_eyalet.GetName] będzie chronić zatokę."
 flavor_tur.236.t: "Administracja Persji"
 flavor_tur.236.desc: "Historia Persji i Osmanów jest naznaczona krwią jeszcze na długo przed naszym podbojem tego regionu. Timurydzi spustoszyli znaczne obszary Anatolii i doprowadzili do pierwszego i jedynego bezkrólewia po bitwie pod Ankarą w 1402 roku. Nawet dziś stosunki między Turkami a Persami pozostają napięte z powodu różnic kulturowych i religijnych.
Choć jesteśmy już suwerenem regionu perskiego, to tylko kwestia czasu, zanim Persowie zjednoczą się pod jednym sztandarem, by walczyć o niepodległość. Ustanowienie ejaletu, który zarządzałby tym niespokojnym regionem w naszym imieniu, może być najrozsądniejszym rozwiązaniem."
 flavor_tur.236.a: "Zaiste. Ejalet Persji utrzyma Persów w ryzach."
 eyalet_cores_only_on_owned_provinces_tt: "§YRdzenie są nadawane wyłącznie prowincjom należącym do państwa [Root.GetName].§!"
 flavor_tur.237.t: "Zwierzchnictwo nad Persją"
 flavor_tur.237.desc: "Cesarstwo Perskie zostało pokonane, a jego rozległe posiadłości znalazły się pod sprawiedliwym prawem naszego Najwznioślejszego Kalifatu. Persja była potężnym i groźnym przeciwnikiem, lecz nawet ona nie może stanąć między nami a naszym przeznaczeniem. Podbój kosztował wiele krwi i przyniósł wielu męczenników, ale mieszkańcy tych ziem są naszymi braćmi w wierze i zasługują na szacunek. Będziemy rządzić sprawiedliwie i uczcimy historię tej krainy, przywracając Persji dawną chwałę jako cenionemu członkowi naszego rozrastającego się imperium."
 flavor_tur.237.a: "Ich dziedzictwo i doświadczenie będą służyć [Root.Monarch.GetName]!"
 flavor_tur.238.t: "System milletów"
 flavor_tur.238.desc: "Nowo opracowany system milletów jest częścią osmańskiej administracji odrębnych wspólnot religijnych. Uznaje on prawo każdej wspólnoty do nadzorowania własnych spraw, przede wszystkim za pośrednictwem niezależnych sądów religijnych i szkół. Takie podejście pomoże nam utrzymać silną kontrolę nad niemuzułmańskimi terytoriami na Bałkanach i poza nimi."
 flavor_tur.238.a: "Te wspólnoty są częścią naszego wielkiego imperium."
 flavor_tur.239.t: "Sulejman Wspaniały"
 flavor_tur.239.desc: "Sulejman, syn sułtana Selima I i Hafsy Sultan, nawróconej na islam, wykazał się wyjątkowymi zdolnościami, rzadko spotykanymi wśród ówczesnych sułtanów osmańskich. Był człowiekiem wykształconym i od najmłodszych lat studiował literaturę islamską. Interesował się również dziedzinami, które odstręczały wielu młodych ludzi, takimi jak nauka, historia, literatura i taktyka wojskowa. Jeśli zostanie wyznaczony na następcę tronu, wielu jest przekonanych, że imperium osiągnie największą świetność."
 flavor_tur.239.a: "Korona należy do księcia!"
 flavor_tur.239.b: "Choć [Root.Heir.GetName] rokuje wielkie nadzieje, to on pewnego dnia będzie rządzić."
 tur_10_dev_randomly_given_to_christian_provinces_tt: "§G10§! poziomów rozwoju zostaje losowo rozdzielonych między §Y10§! posiadanych §Ychrześcijańskich§! prowincji."
 flavor_tur.240.t: "Upadek sułtanatu mameluków"
 flavor_tur.240.desc: "Nazwanie państwem systemu wymuszeń, który Mamelucy prowadzili w Egipcie i Lewancie, byłoby co najmniej przesadą. Sam fakt, że ich rządy przetrwały tak długo, graniczy z cudem. Teraz jednak, podczas naszego ostatniego konfliktu, armie wielkiego sułtana zaprowadziły porządek w Syrii i ruszyły na południe, ku Egiptowi. Co więcej, po zdobyciu [From.GetCapitalName] administracja mamelucka niemal całkowicie się załamała i na tych ziemiach nie pozostał żaden rzeczywisty rząd centralny, który mógłby powstrzymać nas przed przejęciem całego sułtanatu. Natychmiastowe zajęcie wszystkich ziem wymagałoby jednak oparcia się na lokalnych elitach, a włączenie terytoriów sułtanatu do naszej administracji byłoby herkulesowym zadaniem."
 flavor_tur.240.a: "Ich ziemie należą do sułtana [Root.Monarch.GetName]!"
 flavor_tur.240.a.tt: "Jeśli utrzymamy §Y[MAM.Capital.GetName]§! przez §Y3 lata§!, mając §Y90%§! wyniku wojennego przeciwko państwu §Y[MAM.GetName]§!, wystąpi wydarzenie §YUpadek sułtanatu mameluków§!, pozwalające zawrzeć biały pokój z §YMamelukami§! i natychmiast utworzyć §Yejalet Egiptu§!."
 flavor_tur.240.b: "Powoli, ale konsekwentnie..."
 flavor_tur.240.b.tt: "Nie będziemy już mieć kolejnej okazji do utworzenia §Yejaletu Egiptu§! bez zawierania traktatu pokojowego."
 flavor_tur.241.t: "Upadek państwa [Root.GovernmentName]"
 flavor_tur.241.desc: "Wraz z turecką okupacją [Root.Capital.GetName] i tak już krucha władza naszego rządu stoi w obliczu całkowitego załamania. Administracja i wojsko pogrążyły się w chaosie, podczas gdy wojska osmańskie przejmują kontrolę nad rozległym regionem Egiptu!"
 flavor_tur.241.a: "Co za okropność!"
 flavor_tur.241.a.tt: "§RJeśli w ciągu najbliższych §Y3 lat§! nie odzyskamy §Y[Root.Capital.GetName]§!, państwo §Y[From.GetName]§! przekształci nas w swojego poddanego typu rdzenny ejalet bez negocjacji pokojowych.§!"
 flavor_tur.242.t: "Upadek sułtanatu mameluków"
 flavor_tur.242.desc: "Miasto [MAM.Capital.GetName] znajduje się pod kontrolą Osmanów, a rząd mamelucki jest bliski upadku. Ten nędzny sułtanat jest jedynie obraźliwym wspomnieniem dawnego kalifatu Abbasydów, zanim rozpadł się na liczne państwa sukcesyjne. Stało się oczywiste, że sułtanat nie jest już w stanie samodzielnie funkcjonować. Uwięzieni w [MAM.Capital.GetName] mameluccy administratorzy zwrócili się do [Root.Monarch.GetName] z propozycją natychmiastowego zakończenia wojny poprzez oddanie całego sułtanatu pod władzę naszego [Root.Monarch.GetTitle] w zamian za możliwość dalszej służby w egipskiej administracji."
 flavor_tur.242.a: "To rozsądny plan. Zakończmy tę wojnę."
 tur_mamlukian_administration_tt: "do czasu, gdy przestaną być poddanym lub gdy ich suweren ukończy misję „§YLos Mameluków§!”"
 flavor_tur.242.b: "Nie. Nie zaakceptujemy stronniczej administracji w Egipcie."
 flavor_tur.243.t: "Niepodległość ejaletu Egiptu"
 flavor_tur.243.desc: "Nie jesteśmy już niewolnikami Imperium Osmańskiego – nasz kraj wreszcie uwolnił się spod jego wpływów! Nasza administracja znajduje się teraz całkowicie pod naszą kontrolą i możemy wreszcie nazywać się Egiptem."
 flavor_tur.243.a: "Wspaniale."
 flavor_tur.244.t: "Egipt pod panowaniem osmańskim"
 flavor_tur.244.desc: "Sułtanat mameluków przestał istnieć. Na jego miejscu powstał nasz ejalet, który będzie zarządzać tymi ziemiami w naszym imieniu. Choć dla wielu byłych urzędników mameluckich oznacza to poważne i niepokojące zmiany, większość Egipcjan postrzega tę sytuację jako zapowiedź rozwoju ojczyzny. Kupcy i rzemieślnicy z [Root.Capital.GetName] podróżują do Aleksandrii w poszukiwaniu nowych możliwości. To tylko kwestia czasu, zanim Egipt osiągnie pełnię swojego potencjału pod opieką tureckich inwestorów."
 flavor_tur.244.a: "Oby przynieśli Egiptowi dobrobyt."
 flavor_tur.245.t: "Lot Legariego Hasana Celebiego"
 flavor_tur.245.desc: "„O mój sułtanie! Bądź błogosławiony, idę porozmawiać z Jezusem!”. Takie słowa Legari Hasan Celebi wypowiedział do [Root.Monarch.GetName], gdy miał wzbić się w powietrze za pomocą osobliwego i dziwacznego urządzenia mechanicznego, wypełnionego chemikaliami i prochem. Kto dziś nadąży za wszystkimi nowymi trendami, którym oddaje się nasz lud? Byle tylko miał ochraniacze na kolana!"
 flavor_tur.245.a: "Kontrola lotów do majora Celebiego!"
 tur_celebi_goes_bye_bye: "Celebi spotyka Jezusa w tragicznej, lecz zabawnej śmierci."
 flavor_tur.245.b: "Precz z tobą, podły żebraku!"
 flavor_tur.246.t: "Cesarska Szkoła Inżynierii Wojskowej"
 flavor_tur.246.desc: "Wszyscy rekruci (acemi oğlan) z systemu dewszirme muszą przejść szkolenie w akademii wojskowej, aby zostać janczarami. Jednak wraz z napływem kolejnych rekrutów z dewszirme do [Root.Capital.GetName] z każdym rokiem staje się coraz bardziej oczywiste, że nie wszyscy uczniowie mają takie same zdolności. Młodzi ludzie o wyjątkowym talencie i umiejętnościach intelektualnych udowodnili, że mogą osiągnąć znacznie więcej niż zwykli piechurzy. Aby wykorzystać ich potencjał, państwo [Root.GovernmentName] otworzyło w [Root.Capital.GetName] Cesarską Szkołę Inżynierii Wojskowej. Jej absolwenci zdobywają wiedzę z zakresu logistyki, manewrów i budowy machin oblężniczych."
 flavor_tur.246.a: "Doskonale."
 flavor_tur.247.t: "Rozwój systemu dewszirme"
 flavor_tur.247.desc: "Wraz z podbojem kolejnych ziem wyznawców obcych religii system dewszirme pilnie potrzebował rozbudowy swojej biurokracji. Dzięki reformom [Root.Monarch.GetName] i jego doradców system rozwinął się w zaawansowaną instytucję państwa [Root.GetUsableName], pozyskującą potencjalnych młodych rekrutów nawet z najodleglejszych zakątków państwa [Root.GovernmentName]. Pozostaje już tylko oficjalna kodyfikacja zmian przez naszego [Root.Monarch.GetTitle]..."
 flavor_tur.247.a: "Skodyfikuj te zmiany."
 flavor_tur.247.b: "Może to poczekać."
 flavor_tur.248.t: "Przedsięwzięcia handlowe na Wschodzie!"
 flavor_tur.248.desc: "Mój [Root.Monarch.GetTitle]! Nasze przedsięwzięcia na Wschodzie przyniosły oczekiwane rezultaty. Okazuje się, że wcześniejsze inwestycje były rozsądnym wydatkiem. Nasi kupcy donoszą, że jesteśmy teraz jedną z największych potęg handlowych między [Root.Capital.GetCapitalName] a Indiami."
 flavor_tur.248.a: "Pieniądze wprawiają świat w ruch!"
 flavor_tur.249.t: "Wprowadzenie systemu siyasah"
 flavor_tur.249.desc: "Sprawne zarządzanie naszymi ziemiami jest fundamentem imperium, które przetrwa próbę czasu. Aby to osiągnąć, sułtan [Root.Monarch.GetName] zebrał najlepsze prawa bizantyjskie, starannie uwzględniając szariat i czerpiąc inspirację z siyasah, by stworzyć jeden spójny system podatkowy dla imperium. Wielki [Root.Monarch.GetTitle] zawarł je w jednym obszernym kodeksie wiedzy i zasad prawnych. Pozostaje już tylko formalna kodyfikacja, która pozwoli wprowadzić reformę w życie."
 flavor_tur.249.a: "Podpisz akt kodyfikacji."
 flavor_tur.249.b: "Nie teraz."
 flavor_tur.250.t: "Miasto Bagdad"
 flavor_tur.250.desc: "Dawna stolica Abbasydów! Bagdad, miasto prawa! Miasto wielkiego kalifa Al-Mansura wpadło w ręce Imperium Osmańskiego, a jego prawowitym i sprawiedliwym dziedzicem jest czcigodny [Root.Monarch.GetName]. O szlachetny Bagdadzie, od dawna cierpiący z powodu niesprawiedliwości i upokorzeń... po tylu latach nędzy i profanacji – najpierw z rąk zdeprawowanych hord z Dalekiego Wschodu, potem haniebnych Timurydów, a wreszcie fatalnego zarządzania przez samozwańcze „Cesarstwo Perskie” – w końcu otrzymujesz właściwego opiekuna! Niech Bagdad na zawsze pozostanie jaśniejącą latarnią hanafickiego prawoznawstwa i inspiracją dla wszystkich wyznawców islamu sunnickiego!"
 flavor_tur.250.a: "Bijące serce innowacji i uczonych badań!"
 flavor_tur.251.t: "Reforma sipahów"
 flavor_tur.251.desc: "Zaciekli i zdyscyplinowani Tatarzy wielokrotnie pokonali niewiernych mieczem i łukiem. Są rzeczywiście potężną i doświadczoną siłą bojową. Mamy okazję zaciągnąć tych wojowników do służby, znacznie zwiększając możliwości naszych sipahów. Choć wzmocniłoby to nasze siły zbrojne, niektórzy obawiają się, że takie rozwiązanie obrazi janczarów i szlachtę."
 flavor_tur.251.a: "Wzmocnij sipahów."
 flavor_tur.251.b: "Nie drażnijmy janczarów."
 flavor_tur.252.t: "Tkactwo, złoto i jedwab"
 flavor_tur.252.desc: "Od starożytności, od chwalebnych czasów Rzymu, jedwab był ulubioną ozdobą szlachty! Żaden materiał nie jest bardziej poszukiwany i żadne imperium nie posiada go więcej niż nasze! To znacznie więcej niż zwykła tkanina – świadectwo bogactwa, potęgi, wpływów i szacunku, przedmiot podziwu zarówno chłopów, jak i możnych. Jak wielkim błogosławieństwem jest nasze położenie, pozwalające czerpać korzyści z handlu tym surowcem, i jak dobitnie świadczy ono o boskim przeznaczeniu naszego imperium i naszego ludu. Tak jak nasze jedwabne szaty otulają ciała monarchów świata i zdobią ich wspaniałe sale, tak nasz wzniosły blask obejmie cały świat."
 tur_25_goods_fabrics_tt: "Każda posiadana prowincja produkująca §Ywełnę§!, §Ytkaniny§!, §Ybawełnę§!, §Yjedwab§! lub §Ybarwniki§! otrzymuje do końca gry §G+10,0%§! lokalnego modyfikatora produkcji dóbr."
 flavor_tur.252.a: "Niech nasze tkaniny zachwycą świat!"
 flavor_tur.253.t: "Rozwój handlu w Egipcie"
 flavor_tur.253.desc: "Odkąd Egipt znalazł się pod opieką naprawdę wielkodusznych władców, którzy inwestują w te ziemie zamiast jedynie ściągać podatki i cła, jak czynili to Mamelucy, ziemie delty Nilu ponownie stały się zamożnym regionem, tętniącym życiem kupców z całego świata. Możemy czerpać znaczne zyski z handlu przepływającego przez Egipt w kierunku Konstantynijji. Oczywistym miejscem inwestycji jest śródziemnomorskie wybrzeże Egiptu. Zgłosił się jednak do nas ambitny inżynier z innym pomysłem na rozwój egipskiego handlu."
 flavor_tur.253.a: "Skoncentrujmy wysiłki na wybrzeżu."
 flavor_tur.253.b: "Mam lepszy pomysł..."
 flavor_tur.254.t: "Trójsądowy system Imperium Osmańskiego"
 flavor_tur.254.desc: "Wraz z rozwojem naszego państwa [Root.GovernmentName] i włączaniem do niego ludów oraz kultur z najodleglejszych ziem stajemy przed pytaniem, jak traktować niemuzułmańskich mieszkańców naszego wspaniałego imperium. Choć nie przyjmują prawdy islamu i nigdy nie będą darzeni takim szacunkiem jak nasi rodowici obywatele, musimy przestrzegać zasad szariatu, traktować wszystkich sprawiedliwie i dbać o właściwe stosowanie prawa. W przeciwnym razie nie będziemy lepsi od barbarzyńskich królów Europy, którzy z największym uprzedzeniem prześladują naszych braci w wierze. Zaproponowano wprowadzenie systemu „trzech sądów”, który pozwoli sprawiedliwiej rozstrzygać sprawy niemuzułmanów oraz podmiotów gospodarczych."
 flavor_tur.254.a: "Prawo sułtańskie jest nadrzędne wobec wszystkich poddanych Osmanów."
 flavor_tur.255.t: "Drugi złoty wiek islamu"
 flavor_tur.255.desc: "Złoty wiek islamu był okresem wielkiego rozkwitu nauki, kultury i gospodarki państw muzułmańskich. Zakończył się wraz z tragicznym oblężeniem Bagdadu przez Mongołów w 1258 roku i upadkiem kalifatu Abbasydów.
Wraz z przywróceniem kalifatu pod rządami [Root.Monarch.GetTitle] [Root.Monarch.GetName] zmienia się postrzeganie całego islamu. Zjednoczeni pod sztandarem Osmanów uczeni, teologowie i artyści mogą ponownie żyć bez trosk doczesnego świata. Naukowcy otrzymują aktywne wsparcie dla swoich badań, a architekci – błogosławieństwo Allaha i zadanie budowy nowych meczetów. Jednocześnie pobożność religijna islamu przeżywa własny renesans. To prawdziwy początek nowej, drugiej złotej ery islamu i wszystkich jego wyznawców."
 flavor_tur.255.a: "Alhamdulillah! Niech nasza wiara przeżywa erę wielkości!"
 tur_enable_second_golden_era_decision_tt: "Każde państwo §Ymuzułmańskie§! może ogłosić §Ydrugi złoty wiek§! lub przedłużyć trwający §Yzłoty wiek§! o §Y50§! lat."
 flavor_tur.255.a.tt: "Każde państwo §Ymuzułmańskie§! otrzymuje wydarzenie „§YDrugi złoty wiek islamu§!”."
 flavor_tur.256.t: "Drugi złoty wiek islamu"
 flavor_tur.256.desc: "Wraz z przywróceniem kalifatu pod rządami [From.Monarch.GetTitle] [From.Monarch.GetName] zmienia się postrzeganie całego islamu. Zjednoczeni pod sztandarem Osmanów uczeni, teologowie i artyści mogą ponownie żyć bez trosk doczesnego świata. Naukowcy otrzymują aktywne wsparcie dla swoich badań, a architekci – błogosławieństwo Allaha i zadanie budowy nowych meczetów. Jednocześnie pobożność religijna islamu przeżywa własny renesans.
Wpływ państwa [From.GetUsableName] jest odczuwalny również w państwie [Root.GetUsableName], ponieważ nasza ludność wydaje się inspirowana wezwaniem [From.Monarch.GetName] do rozpoczęcia nowego złotego wieku islamu."
 flavor_tur.256.a: "Niech będzie to czas bogactwa i pomyślności islamu!"
 flavor_tur.257.t: "Wprowadzenie fiqh"
 flavor_tur.257.desc: "Fiqh to ludzkie rozumienie szariatu, czyli praw religijnych kształtujących tradycje islamu. Ponieważ nasza wiara odgrywa kluczową rolę we wszystkich aspektach społeczeństwa, jest oczywiste, że wielki wezyr [Root.Monarch.GetName] powinien włączyć fiqh do osmańskiego ustawodawstwa. Pozostaje już tylko podpis samego [Root.Monarch.GetTitle]..."
 flavor_tur.257.a: "Od dziś wartości religijne stanowią część prawa osmańskiego."
 flavor_tur.257.b: "Muszę się jeszcze nad tym zastanowić."
 flavor_tur.258.t: "Kodyfikacja sufizmu"
 flavor_tur.258.desc: "Sufizm jest bardzo duchowym i mistycznym nurtem islamu. Odrzucając doczesne pragnienia i troski, dąży do osiągnięcia bliskości z Allahem. Choć może się to wydawać nieintuicyjne, wielki wezyr [Root.Monarch.GetName] opracował koncepcję łączącą filozofię i tradycje sufizmu z ustawodawstwem imperium, nadając prawom legitymację poprzez ich powiązanie z Allahem. Kodyfikacja wymaga jednak podpisu [Root.Monarch.GetTitle], aby mogła wejść w życie..."
 flavor_tur.258.a: "Niech filozofia sufizmu prowadzi imperium."
 flavor_tur.258.b: "Nie widzę powodu, by łączyć mistycyzm z ustawodawstwem."
 flavor_tur.259.t: "Persja pod panowaniem osmańskim"
 flavor_tur.259.desc: "Wrogość między Persami a Osmanami jest niezaprzeczalna. Nawet po wielu latach od podporządkowania Persji rywalizacja między tymi ludami nigdy całkowicie nie wygasła. Nie każdy mieszkaniec [Root.Capital.GetName] ma jednak powód, by nie lubić ludności regionu perskiego. Niektórzy dostrzegają okazję do pomnożenia majątku i postanowili zainwestować w Persji."
 flavor_tur.259.a: "Być może ci osadnicy poprawią nasze stosunki z Persami."
 flavor_tur.260.t: "Rozbudowa cesarskiej biurokracji"
 flavor_tur.260.desc: "Nasze państwo [Root.GovernmentName] osiągnęło granice, o których inni mogą tylko marzyć. Choć na każdej mapie wygląda to wspaniale, rozległość imperium jest poważnym problemem dla urzędników, którzy muszą zarządzać licznymi prowincjami i ejaletami.
[Root.Monarch.GetTitle] [Root.Monarch.GetName] postanowił zareagować, zanim państwo [Root.GetUsableName] padnie ofiarą własnego sukcesu. Dzięki szeroko zakrojonym reformom administracji i biurokracji możliwości organizacyjne państwa [Root.GetUsableName] ulegają znaczącej poprawie."
 flavor_tur.260.a: "Biurokracja nigdy nie będzie powodem naszego spowolnienia!"
 flavor_tur.261.t: "Janczarzy domagają się przywilejów"
 flavor_tur.261.desc: "Niezadowoleni janczarzy przedostali się do prywatnej komnaty sułtana. Z rękami na rękojeściach mieczy domagają się należnych im przywilejów królewskich, podobnie jak inne stany. Według ich pisemnej deklaracji nie do pomyślenia jest, by najbardziej odznaczona formacja zbrojna sułtana była traktowana gorzej niż drobna szlachta i kupcy! Oczekują, że złagodzimy jedno z obowiązujących praw dotyczących janczarów i zastąpimy je przywilejem odpowiadającym życiu janczara."
 flavor_tur.261.a: "Pozwól im samodzielnie mianować swoich agów."
 flavor_tur.261.b: "Uczyń rangę janczara dziedziczną."
 flavor_tur.261.c: "Przyznaj im prawo wykonywania dodatkowego zawodu."
 flavor_tur.261.d: "Przyznaj im prawo do zawierania małżeństw w dowolnym momencie."
 flavor_tur.261.e: "Wprowadź prawo Toprak regulujące ich wynagrodzenie."
 flavor_tur.261.f: "Pozwól janczarom samodzielnie się szkolić."
 flavor_tur.261.g: "Zagwarantuj im przywileje."
 flavor_tur.261.h: "Złagodź system dewszirme na ich korzyść."
 flavor_tur.261.i: "Nigdy!"
 flavor_tur.261.j: "Przecież już macie wszystko, czego chcecie..."
 flavor_tur.262.t: "Sułtanat kobiet"
 flavor_tur.262.desc: "Za panowania Seldżuków w Anatolii arystokratki posiadały ogromne wpływy w sprawach politycznych i administracyjnych. Zaczęło się to jednak zmieniać wraz z pojawieniem się doktryny „rządzenia z siodła”. Wczesna polityka osmańska polegała na przyznawaniu namiestnictw książętom i ich matkom, aby nie mogli rzucić wyzwania prawowitemu następcy tronu. Wszystko zmieniło się na początku XVI wieku.

Wraz z wstąpieniem na tron sułtana Sulejmana I nastąpiło kilka zmian, w tym włączenie haremu cesarskiego do pałacu. W rezultacie matki i żony sułtana uzyskały niemal nieograniczoną władzę w sprawach administracji i dyplomacji. Ten „sułtanat kobiet” doprowadził do znacznego rozwoju robót publicznych, infrastruktury i obronności. Zmiany te spotkały się z ostrą krytyką ze strony mężczyzn w imperium, takich jak wezyrowie i doradcy.

Pojawiło się więc pytanie: czy warto przyznać kobietom haremu tak ogromną władzę?"
 flavor_tur.262.a: "Będą prawą ręką sułtana!"
 flavor_tur.262.b: "Nie możemy dzielić się władzą królewską."
 flavor_tur.262.b.tt: "Ograniczymy władzę haremu, aby nie mógł manipulować przyszłymi [Root.Monarch.GetTitle].
§YNastępcy tronu z wydarzeń haremu będą mieć umiejętności niższe o §R2§! do końca gry, jeśli sprzeciwimy się haremowi.§!"
 flavor_tur.263.t: "Harem wykonuje ruch"
 flavor_tur.263.desc: "Nasza decyzja o odsunięciu haremu cesarskiego od spraw administracji i dyplomacji imperium wzburzyła jego członkinie. Choć to [Root.Monarch.GetName] sprawuje władzę, nie sposób zaprzeczyć wpływowi kobiet na naszego [Root.Monarch.GetTitle]. Poprzez perswazję sułtanka-walide i żony [Root.Monarch.GetName] próbują przekonać [Root.Monarch.GetTitle] do ponownego rozważenia surowego stanowiska wobec haremu."
 flavor_tur.263.a: "Być może harem ma rację."
 flavor_tur.263.b: "Nie znaczy nie, matko!"
 flavor_tur.264.t: "Oddzielenie haremu od państwa"
 flavor_tur.264.desc: "Choć wymagało to przemocy i rozlewu krwi, [Root.Monarch.GetName] zdołał ostatecznie odsunąć harem cesarski od wszelkich spraw politycznych państwa. Zadaniem haremu będzie zapewnienie następcy tronu, podczas gdy sułtan ponownie będzie rządzić swoim krajem z siodła.
Oddzielenie rodziny od państwa ma jednak poważne konsekwencje: przyszli następcy tronu będą mogli uczyć się wyłącznie od ojca, a także będą musieli polegać na radach matek i powierników. Nie ma już zatem gwarancji, że przyszli sułtani będą działać w interesie imperium, gdy nadejdzie ich czas."
 flavor_tur.264.a: "Niech tak będzie."
 flavor_tur.264.a.tt: "§YNastępcy tronu z wydarzeń haremu będą mieć umiejętności niższe o §R2§! do końca gry, jeśli sprzeciwimy się haremowi.§!
Katastrofa §YIntrygi haremu§! nie może już wybuchnąć podczas katastrofy §YWewnętrzna walka o władzę§!."
 flavor_tur.265.t: "Zabezpieczenie linii sukcesji"
 flavor_tur.265.desc: "Obecny Vali Ahad jest osobą, którą uważamy za najodpowiedniejszą do rządzenia naszym imperium. Ma jednak wielu braci. Zazdroszczą mu pozycji następcy tronu i zajmują ważne stanowiska w imperium. Ci niekompetentni głupcy mogą próbować zbuntować się, gdy Vali Ahad obejmie tron, i zakłócić jego rządy. Najlepiej byłoby pozbyć się tych szakali, póki mamy czas. Może to jednak przynieść nieprzewidziane konsekwencje w przyszłości. Powinniśmy dokładnie rozważyć tę decyzję."
 flavor_tur.265.a: "Potrzebujemy tylko JEDNEGO Vali Ahada!"
 tur_killing_of_line_potential_tt: "Próba wyeliminowania wszystkich pozostałych potencjalnych następców tronu może doprowadzić do §Rotwartego buntu§!, w zależności od umiejętności wojskowych naszego władcy."
 flavor_tur.265.b: "Nie ryzykujmy otwartego buntu..."
 tur_the_administration_will_be_damaged_somehow: "Pozostali członkowie rodziny następcy tronu pozostaną pod opieką haremu i będą mogli sabotować nasze państwo..."
 flavor_tur.265.c: "Krew jest gęstsza niż woda, bracie."
 tur_they_go_away_peacefully_tt: "Wzorowy i nienaganny pokaz miłości oraz więzi rodzinnych ze strony [Root.Monarch.GetName] powstrzyma pretendentów przed buntem przeciwko naszemu ukochanemu [Root.Heir.GetName]!"
 flavor_tur.266.t: "Serce złamane po raz pierwszy"
 flavor_tur.266.desc: "Och, jaki niewinny miał uśmiech. Jak przychodził do mnie z pytaniami o imperium. „Ojcze!” – wołał. „Ojcze, jak rozległa jest Ziemia Święta?” – zapytał mnie kiedyś. Pamiętam, jak śmiałem się z nim, gdy jedliśmy owoce. Myślałem… że to, co dla niego zrobiłem, było najlepsze. Najwyraźniej się myliłem. Gdy usłyszał o przedwczesnej śmierci braci, mój zdrowy i pełen sił książę zachorował. Bardzo ciężko. Teraz leży przede mną w wiecznym śnie… Chcę po raz ostatni zobaczyć jego twarz, ale nie potrafię. Poczucie winy będzie mnie pożerać już na zawsze. We śnie będę widzieć twarze pozostałych synów, których bezlitośnie zamordowałem, i nie będę już w stanie spojrzeć w oczy żonie ani konkubinom. Pozostały mi jedynie wina i wstyd."
 flavor_tur.266.a: "Mój chłopcze, mój biedny chłopcze..."
 tur_i_did_this_tt: "Ból spowodowany bezlitosną egzekucją rodzeństwa doprowadził do pogorszenia zdrowia [Root.Heir.GetName], a w końcu do jego śmierci.
Zastąpi go pierwszy zdolny chłopiec z haremu..."
 flavor_tur.267.t: "Los Świętego Miasta"
 flavor_tur.267.desc: "Jerozolima była polem bitwy, na którym wielu wyznawców różnych religii oddawało życie w imię boskich ideałów swojej wiary. W przerwach między starciami liczni chrześcijanie przybywają do świętych miejsc miasta, oddając cześć czczonym przez siebie świętym. Teraz, gdy miasto znalazło się pod naszą kontrolą, musimy zdecydować o jego losie, a wraz z nim o losie wszystkich mieszkańców, niezależnie od wyznania."
 flavor_tur.267.a: "Ponownie stanie się centrum naszej religii!"
 flavor_tur.267.b: "Niech będzie to miasto modlitwy dla każdego pobożnego człowieka."
 flavor_tur.269.t: "Nieoczekiwany list"
 flavor_tur.269.desc: "Zdumiony i zdezorientowany [Root.Monarch.GetName] przygląda się listowi trzymanemu w dłoniach. Choć brzmi to niewiarygodnie, papież [PAP.Monarch.GetName] wysłał oficjalny, własnoręcznie podpisany list do [Root.Monarch.GetTitle].

„Błaha rzecz może uczynić cię największym, najpotężniejszym i najsławniejszym spośród żyjących śmiertelników. Pytasz, co to takiego? Nietrudno ją znaleźć, nie trzeba szukać daleko. Jest wszędzie: odrobina wody, którą zostaniesz ochrzczony, nawrócisz się na chrześcijaństwo i przyjmiesz wiarę Ewangelii.

Gdy to uczynisz, nie będzie na całej ziemi księcia, który dorówna ci sławą lub potęgą. Mianujemy cię cesarzem Greków i Orientu... Wszyscy chrześcijanie będą cię szanować i uczynią rozjemcą w swoich sporach... Wielu dobrowolnie podda się twojej władzy, stanie przed twoim sądem i będzie płacić ci podatki. Otrzymasz prawo poskramiania tyranów, wspierania dobrych i zwalczania złych. Kościół rzymski nie będzie ci się sprzeciwiał... Pierwszy tron duchowy przyjmie cię z taką samą miłością jak innych królów, a nawet większą, stosownie do twojej wyższej pozycji. W tych warunkach możesz z łatwością, bez wojny i rozlewu krwi, zdobyć wiele królestw...

Nigdy nie udzielimy pomocy twoim wrogom. Przeciwnie, wezwiemy cię do walki przeciwko tym, którzy przywłaszczają sobie prawa Kościoła rzymskiego i podnoszą rękę na własną matkę”."
 flavor_tur.269.a: "Korona Rzymska... i wystarczy, że się nawrócę... hmm..."
 flavor_tur.269.b: "Phi. Ten starzec postradał zmysły."
 flavor_tur.270.t: "Import mirry dla dhimmich"
 flavor_tur.270.desc: "Ku wielkiej radości naszych dhimmich żyzne ziemie Adenu zostały obdarzone przez Allaha obfitymi zbiorami mirry i innych poszukiwanych ziół, co jeszcze bardziej wzbogaca nasze już kwitnące szlaki handlowe między Wschodem a Europą. Zaprawdę, jesteśmy błogosławieni!"
 flavor_tur.270.a: "Obdarzymy ich wielkim dobrobytem w imię miłosiernego Allaha!"
 flavor_tur.271.t: "Opłata portowa w Ormuzie"
 flavor_tur.271.desc: "Włączenie Ormuzu do naszego wspaniałego imperium zapewniło nam kontrolę nad kluczowym punktem handlu z Bliskim Wschodem i Arabią. Ponieważ port ten ma ogromne znaczenie dla kupców podróżujących między Lewantem a Indiami, wielki wezyr naturalnie ustanowił na tej wyspie opłatę portową."
 flavor_tur.271.a: "Doskonale."
 flavor_tur.272.t: "Podróż szlakami handlowymi Azji"
 flavor_tur.272.desc: "Nasza ekspansja wzdłuż Jedwabnego Szlaku okazała się bardzo owocnym przedsięwzięciem. Inwestycje w ten szlak handlowy były rozsądną decyzją. Oprócz ogromnych ilości jedwabiu i złota nasi kupcy przywożą nie tylko niezwykłe opowieści, lecz także najróżniejsze egzotyczne zwierzęta, cudowne gobeliny, wyroby z kości i garście półprzezroczystych zielonych kamieni, które podobno są szczególnie cenione przez wschodnich możnych. Nie ma wątpliwości, że import tych towarów może wzmocnić gospodarkę naszego już zamożnego państwa. Szczególne zainteresowanie wykazali kupcy z Kirkkilise..."
 flavor_tur.272.a: "Cóż za interesujące i fascynujące towary."
 TUR_SILK_ROAD_TRADE: "Handel na Jedwabnym Szlaku"
 flavor_tur.273.t: "Surgunowie napływają do [151.GetName]"
 flavor_tur.273.desc: "Wraz z rozpoczęciem naszej wielkiej kampanii na Bałkanach i podbojem Konstantynopola obserwujemy wzmożoną migrację mieszkańców okolicznych miast i wsi do stolicy. Ludzie ci, zwani surgunami, przenieśli się do Konstantynopola w poszukiwaniu lepszych warunków życia i utrzymania. Przyniesie to korzyści nie tylko samym migrantom, lecz także wielkiemu miastu, które zyska dodatkową siłę roboczą. Niech Wszechmogący nieustannie obdarza nas takimi dniami dobrobytu!"
 flavor_tur.273.a: "Są tu mile widziani!"
 flavor_tur.274.t: "Religie dhimmich rozkwitają w [151.GetName]"
 flavor_tur.274.desc: "Ogromny projekt rozwoju Konstantynopola wreszcie zaczyna przynosić owoce. Przez lata mniejszości religijne, takie jak Żydzi i inne wspólnoty, migrowały do Miasta Pożądania Świata. Założyły tam własne społeczności i zaczęły nawiązywać kontakty z innymi grupami wyznaniowymi. Wiele z tych wspólnot rozkwita w Konstantynopolu, zarabiając wystarczająco dużo, by utrzymać siebie i swoje rodziny. Niewiele państw wykazało się taką tolerancją wobec innych religii jak my, dlatego miasto przeżywa swój mały złoty wiek."
 flavor_tur.274.a: "Pod naszym sztandarem wszyscy będą prosperować!"
 flavor_tur.275.t: "Bunty kizylbaszów"
 flavor_tur.275.desc: "Kizylbasze byli turkmeńskimi szyickimi ugrupowaniami bojowymi, które rozkwitły we wschodniej części Półwyspu Anatolijskiego pod koniec XV wieku. Odegrali ważną rolę w konsolidacji Persji przez Safawidów. W 1512 roku Safawidzi rozpoczęli działalność misyjną w Imperium Osmańskim i nawracanie wschodnich plemion turkmeńskich, które ostatecznie dołączyły do ich szeregów. W rezultacie szyiccy Turcy z Azji Mniejszej zaczęli być deportowani do Morei. Safawidzcy kizylbasze wkroczyli do Kurdystanu i pokonali miejscowe tureckie garnizony, mimo znacznej przewagi liczebnej przeciwnika. Imperium Osmańskie stoi teraz na rozdrożu – między całkowitą klęską i upokorzeniem a ostatecznym, wiecznym zwycięstwem!"
 flavor_tur.275.a: "Wielki wezyrze, przynieś mi bicz!"
 flavor_tur.276.t: "Bunty Sahkulu"
 flavor_tur.276.desc: "Lata 1510. były burzliwym okresem w Imperium Osmańskim. Safawidzcy misjonarze i bojownicy kizylbaszy grasowali we wschodnich częściach imperium. W 1511 roku turkmeńscy kizylbasze zjednoczyli się pod przywództwem Sahkulu, syna halify z Teke. Od dawna był cierniem w naszym boku, a teraz ośmielił się napadać na nasze wielkie karawany na wschodzie. W naszym imperium nie ma miejsca dla takich wściekłych i podłych stworzeń. Podnieśmy sztandar Proroka i raz na zawsze zmiażdżmy te bestie!"
 flavor_tur.276.a: "Przeklęci szyici!"
 flavor_tur.277.t: "Włoskie ambicje Mehmeda II"
 flavor_tur.277.desc: "Po upadku Konstantynopola Mehmed II ogłosił Osmanów prawowitymi następcami Cesarstwa Rzymskiego, a siebie jego cesarzem. Umocnił swoje roszczenia, awansując dawną bizantyjską szlachtę na wysokie stanowiska administracyjne, czyniąc Konstantynopol stolicą Imperium Osmańskiego i przywracając mu dawną świetność. Czerpał również inspirację z bizantyjskich tradycji dworskich. Naturalnie roszczenie do rzymskiego dziedzictwa posłużyło Mehmedowi jako uzasadnienie najazdu na Otranto w 1480 roku, którego dalszym celem miał być podbój Rzymu przez Osmanów. Przedsięwzięcie zakończyło się jednak przedwcześnie, gdy Mehmed zmarł 3 maja 1481 roku. Od tamtej pory żaden sułtan osmański nie postawił stopy na włoskiej ziemi jako zdobywca."
 flavor_tur.277.a: "Włochy ugną się przed naszą potęgą!"
 flavor_tur.278.t: "Sojusz francusko-osmański"
 flavor_tur.278.desc: "Habsburgowie od lat są rywalami państwa [Root.GetUsableName]. Choć [Root.Monarch.GetTitle] zdołał obronić [Root.GetUsableName] przed austriacką hegemonią w Europie Środkowej, dynastia ta nadal rośnie w siłę i wpływy – nie tylko w Świętym Cesarstwie Rzymskim, lecz także w Iberii, Polsce i we Włoszech. Aby powstrzymać Habsburgów, potrzebujemy sojusznika.

[Root.Monarch.GetTitle] [Root.Monarch.GetName] znalazł nieoczekiwanego, lecz potencjalnie cennego partnera koalicyjnego. Państwo [TUR.GovernmentName] [TUR.GetUsableName] pozostaje w ciągłym konflikcie z cesarzem z powodu wspólnych interesów na Bałkanach. Choć Osmanowie są niewiernymi muzułmanami, ich celem jest wyeliminowanie zagrożenia ze strony Austriaków i umocnienie władzy na Bałkanach. Warto rozważyć nawiązanie kontaktu z Osmanami i złożenie oficjalnej propozycji sojuszu [TUR.Monarch.GetTitle] [TUR.Monarch.GetName]."
 flavor_tur.278.a: "Powinniśmy poprosić o audiencję u sułtana."
 flavor_tur.278.a.tt: "Wszystkie znane państwa §Ychrześcijańskie§! na kontynencie §Y[Root.Capital.GetContinentName]§!, które nie są naszymi poddanymi, zmniejszają opinię o państwie §Y[Root.GetName]§! o §R-25§!."
 flavor_tur.278.b: "Lilia nigdy nie będzie sojusznikiem Półksiężyca."
 flavor_tur.278.b.tt: "Wszystkie znane państwa §Ychrześcijańskie§! na kontynencie §Y[Root.Capital.GetContinentName]§!, które nie są naszymi poddanymi, zwiększają opinię o państwie §Y[Root.GetName]§! o §G50§!."
 flavor_tur.279.t: "Sojusz francusko-osmański"
 flavor_tur.279.desc: "Habsburgowie od lat są rywalami państwa [Root.GetUsableName]. Choć [Root.Monarch.GetTitle] zdołał obronić [Root.GetUsableName] przed austriacką hegemonią w Europie Środkowej, dynastia ta nadal rośnie w siłę i wpływy – nie tylko w Świętym Cesarstwie Rzymskim, lecz także w Iberii, Polsce i we Włoszech. Aby powstrzymać Habsburgów, potrzebujemy sojusznika.

Los chciał, że taki potencjalny sojusznik pojawił się na dworze [Root.Monarch.GetName]. Dyplomata z państwa [FRA.GovernmentName] Francji zwrócił się do naszego [Root.Monarch.GetTitle] w imieniu swojego władcy, [FRA.Monarch.GetTitle] [FRA.Monarch.GetName]. Francuzi chcą powstrzymać hegemonię Habsburgów, ponieważ zagraża ona ich interesom w Iberii, we Włoszech i w Niderlandach."
 flavor_tur.279.a: "Potężny chrześcijański sojusznik może się przydać."
 flavor_tur.279.b: "Półksiężyc nie powinien mieszać się w sprawy Lilii."
 flavor_tur.280.t: "Państwo [From.GetUsableNameCap] przyjmuje ofertę sojuszu"
 flavor_tur.280.desc: "Mój [Root.Monarch.GetTitle], mądry [From.Monarch.GetName] przyjmuje naszą bezinteresowną ofertę ochrony przed zagrożeniem austriackim. Jesteśmy teraz oficjalnie sprzymierzeni z państwem [From.GetUsableName]."
 flavor_tur.280.a: "Oby doprowadziło to do upadku Habsburgów."
 flavor_tur.281.t: "Państwo [From.GetUsableNameCap] odrzuca ofertę sojuszu"
 flavor_tur.281.desc: "Mój [Root.Monarch.GetTitle], niewierni z państwa [From.GetUsableName] odrzucili naszą skromną ofertę. Najwyraźniej [From.Monarch.GetTitle] woli patrzeć, jak [From.Monarch.GetHerHis] państwo [From.GovernmentName] obraca się w popiół, niż porzucić własną dumę."
 flavor_tur.281.a: "Trudno. To ich zguba, nie nasza."
 flavor_tur.282.t: "Siyer-i Nebi"
 flavor_tur.282.desc: "Żywot proroka Mahometa od zawsze stanowił źródło najwspanialszych dzieł literackich. Jednym z nich jest Siyer-i Nebi, ukończone w 1388 roku przez Mustafę al-Darira z Erzurum na zamówienie mameluckiego sułtana Barkuka. Dzieło to cieszy się wielkim uznaniem, a nasz [Root.Monarch.GetTitle] [Root.Monarch.GetName], kierując się mądrością, postanowił je rozszerzyć i zamówił nową, ilustrowaną kopię księgi. Wykonał ją słynny kaligraf Lufti Abdullah, a rezultat z pewnością zasługuje na podziw. Wspaniałe strony przedstawiają życie Proroka piękniej niż kiedykolwiek wcześniej i na zawsze pozostaną chlubną własnością sułtana. Niech chwała Imperium Osmańskiego trwa wiecznie!"
 flavor_tur.282.a: "Wspaniała literatura ku czci Wielkiego Proroka!"
 flavor_tur.283.t: "Grobowiec Abu Hanify"
 flavor_tur.283.desc: "Imam Abu Hanifa był sunnickim teologiem i prawnikiem, urodzonym w Kufie w perskiej rodzinie. Powszechnie uznawany za założyciela szkoły hanafickiej, został pochowany w meczecie w Bagdadzie, gdzie jego szczątki otaczano czcią. Teraz, po niedawnym podboju tego wielkiego miasta, sułtan musi zdecydować, czy odrestaurować grobowiec Hanify, czy też zachować dukaty i przeznaczyć je na inne cele."
 flavor_tur.283.a: "Odrestauruj jego grobowiec i uczcij jego dziedzictwo!"
 flavor_tur.283.b: "Nasze monety lepiej wydać na coś innego!"
 flavor_tur.284.t: "Epistemologia islamska w epoce [Root.Monarch.GetName]"
 flavor_tur.284.desc: "Epistemologia. Samo to słowo jest równie tajemnicze jak jego znaczenie. Teoria poznania dowolnego zagadnienia określana jest mianem jego epistemologii. Ponieważ nasz sułtan coraz bardziej sprzyja islamskim filozofom, coraz więcej uwagi poświęcają oni zrozumieniu filozoficznych podstaw islamu. Z pewnością przyniesie to nieprzemijającą chwałę osmańskim ulemom dzięki nieustającemu mecenatowi sułtana!"
 flavor_tur.284.a: "Nadchodzi epoka nauki i filozofii!"
 flavor_tur.285.t: "Nieudolna polityka gospodarcza [Root.Monarch.GetName]"
 flavor_tur.285.desc: "Wygląda na to, że skutki nieudolnej polityki gospodarczej sułtana właśnie dały o sobie znać. Gospodarka osmańska załamała się z dnia na dzień. Doprowadziło to do hiperinflacji i powszechnych niepokojów w całym imperium. Minie wiele miesięcy, zanim zdołamy podnieść się po tej katastrofie."
 flavor_tur.285.a: "Wybijcie WSZYSTKO!"
 flavor_tur.286.t: "Los systemu dewszirme"
 flavor_tur.286.desc: "System dewszirme przez lata dowodził swojej wartości, stanowiąc główne źródło nowych rekrutów do korpusu janczarów. Z czasem jednak coraz częściej go ignorowano, ponieważ muzułmańskie rodziny przemycały do niego własne dzieci, licząc na zapewnienie im lepszej przyszłości. Obecnie dewszirme jest już tylko nazwą dawnego sposobu poboru.
Reformy są oczywiście konieczne. Konserwatywna część rządu opowiada się za gruntowną przebudową systemu, podczas gdy sztab wojskowy chce go całkowicie znieść i wprowadzić powszechny pobór."
 flavor_tur.286.a: "Jego czas minął. Wprowadzimy nowe metody pozyskiwania rekrutów."
 flavor_tur.286.b: "W przeszłości dowiódł swojej wartości i zrobi to ponownie."
 flavor_tur.287.t: "Rozszerzenie rekrutacji do armii mansure"
 flavor_tur.287.desc: "Dewszirme jest reliktem przeszłości. Zastąpił je standardowy system rekrutacji, który poszukuje potencjalnych żołnierzy w całym imperium, zamiast ograniczać się wyłącznie do chrześcijańskich mężczyzn. Sztab wojskowy postanowił jeszcze bardziej udoskonalić ten system, aby zwiększyć jego skuteczność. Pozostaje już tylko oficjalna zgoda [Root.Monarch.GetTitle]..."
 flavor_tur.287.a: "Wprowadź te zmiany do systemu poboru."
 flavor_tur.287.b: "Może to poczekać."
 flavor_tur.288.t: "Reforma armii mansure"
 flavor_tur.288.desc: "Stulecia wewnętrznych sporów i korupcji doprowadziły janczarów do dekadencji. Zadowoleni z rosnących wpływów i ingerowania w sprawy sułtana stali się zuchwali i zapomnieli, komu winni są lojalność. Reformy wojskowe spotkały się ze zbrojnym oporem, dlatego [Root.Monarch.GetTitle] [Root.Monarch.GetName] został zmuszony do rozprawienia się z janczarami.

Choć było to brutalne, wyeliminowanie spiskowców janczarskich pozwoliło państwu [Root.GovernmentName] przebudować armię od podstaw. Korpus janczarów zastąpiła armia mansure, wykorzystująca zachodnie strategie, taktyki i wyposażenie, by walczyć w służbie [Root.Monarch.GetTitle]. Pozostaje już tylko oficjalnie znieść stan janczarów."
 flavor_tur.288.a: "Wreszcie armia, która potrafi ochronić imperium."
 flavor_tur.288.b: "Dobrze."
 flavor_tur.289.t: "Kompromis z janczarami"
 flavor_tur.289.desc: "Stulecia wewnętrznych sporów i korupcji doprowadziły janczarów do dekadencji. Zadowoleni z rosnących wpływów i ingerowania w sprawy sułtana stali się zuchwali i zapomnieli, komu winni są lojalność. Ostatecznie jednak [Root.Monarch.GetTitle] i jego wielki wezyr zdołali dojść do porozumienia z korpusem janczarów.

[Root.Monarch.GetName] przekonał agów janczarskich do zaakceptowania nowej pozycji tej formacji jako oficjalnego stanu społecznego, którego członkowie mogą awansować na stanowiska szlacheckie lub kupieckie. Choć rozwiązanie to nie jest tak korzystne jak wcześniejsze przywileje, zmiana hierarchii stanów otwiera możliwości przed janczarami, którzy nie chcą już służyć jako żołnierze, podczas gdy ci urodzeni do walki mogą wrócić do swoich obowiązków."
 flavor_tur.289.a: "Wreszcie janczarzy odzyskali rozsądek."
 flavor_tur.289.b: "Dobrze."
 flavor_tur.290.t: "Reforma milletów"
 flavor_tur.290.desc: "System milletów jest częścią osmańskiej administracji odrębnych wspólnot religijnych. Uznaje on prawo każdej wspólnoty do nadzorowania własnych spraw, przede wszystkim za pośrednictwem niezależnych sądów religijnych i szkół. System ten był jednak niespójny, a przepisy stosowane przez sądy milletów w poszczególnych prowincjach znacznie różniły się od tych obowiązujących u sąsiadów. Niektórzy sprytni paszowie wykorzystywali tę sytuację, aby rozszerzać swoją władzę nad zarządzanymi regionami znacznie poza przyznane im uprawnienia. Ujednolicenie milletów powinno zapewnić spójne traktowanie poddanych we wszystkich zakątkach imperium."
 flavor_tur.290.a: "Nasze imperium nie będzie już zlepkiem sprzecznych praw."
 flavor_tur.290.b: "Dobrze."
 flavor_tur.292.t: "Janczarzy domagają się przywilejów"
 flavor_tur.292.desc: "Niezadowoleni janczarzy przedostali się do prywatnej komnaty sułtana. Z rękami na rękojeściach mieczy domagają się należnych im przywilejów królewskich, podobnie jak inne stany. Według ich pisemnej deklaracji nie do pomyślenia jest, by najbardziej odznaczona formacja zbrojna sułtana była traktowana gorzej niż drobna szlachta i kupcy!"
 flavor_tur.293.t: "Wzrost potęgi janczarów"
 flavor_tur.293.desc: "Wraz ze wzrostem zależności naszej armii od janczarów rośnie ich władza w państwie. Ich wpływ i znaczenie dla systemu rządów oraz wojska nie podlegają już dyskusji. Choć janczarzy są świadomi swojej pozycji, obecnie pozostają lojalni wobec [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Zgodzili się zatem służyć nam jako niezłomna awangarda."
 flavor_tur.293.a: "Doskonale."
 unlock_privilege_estate_janissary_ottoman_vanguards_tt: "Odblokowuje przywilej stanu §Yjanczarów§! „§YOsmanska awangarda§!”"
 flavor_tur.300.t: "Klęska państwa [Root.GetUsableName]"
 flavor_tur.300.desc: "Porażka z rąk państwa [From.GetUsableName] jest poważnym ciosem dla autorytetu [Root.Monarch.GetTitle]. Morale naszego narodu osiągnęło najniższy poziom, a wielu mieszkańców imperium szuka kozła ofiarnego, na którego można zrzucić winę za upokarzającą klęskę."
 flavor_tur.300.a: "Obwiń janczarów"
 flavor_tur.300.b: "Tak już bywa..."
 flavor_tur.301.t: "Nadmierna ekspansja państwa [Root.GovernmentName]"
 flavor_tur.301.desc: "Wraz z rozrostem państwa [Root.GovernmentName] i przesuwaniem jego granic administracja dworska napotyka coraz więcej problemów. Choć ostatni podbój zakończył się wspaniałym sukcesem, zarządzanie nowo zdobytymi prowincjami okazuje się zbyt trudne dla naszych urzędników."
 flavor_tur.301.a: "Wykorzystaj wszystkie nasze zasoby, by temu zaradzić."
 flavor_tur.301.b: "Nadmierna ekspansja to tylko abstrakcyjne pojęcie."
 flavor_tur.998.t: "Zdrada rodu Osmanów!"
 flavor_tur.998.desc: "Ród Osmanów spotkała tragedia: krewny [Root.Monarch.GetName] przejął władzę w państwie [From.GetName] i rozpoczął wojnę o niepodległość przeciwko nam!"
 flavor_tur.998.a: "Zapłaci głową za tę zdradę!"
 flavor_tur.999.t: "Najnowsza fascynacja [Root.Monarch.GetTitle]"
 flavor_tur.999.desc: "„Cóż za wspaniała flaga! Zwierzę pełne siły, potęgi i piękna! Doprawdy zachwycające!”. Wielki wezyr nie może powstrzymać się od zastanawiania, jakie szaleństwo opętało jego [Root.Monarch.GetTitle], jednocześnie starając się nie okazywać żadnych emocji. Mądry doradca nie chce skończyć na szafocie tylko dlatego, że nie zdołał powstrzymać śmiechu na widok tego, co ma przed oczami. „Mów, mój najwierniejszy wezyrze. Powiadasz, że nasi ludzie znaleźli tę flagę podczas marszu przez prowincję Taungoo?”. Wielki wezyr odpowiada opanowanym tonem i zwięźle. Obserwuje [Root.Monarch.GetName], który wydaje się zachwycony flagą dynastii Taungoo: białym sztandarem z wizerunkiem stylizowanego pawia pośrodku. Choć jest wyjątkowa, wezyr nie jest nią szczególnie zachwycony. W końcu wiele państw, które upadły przed [Root.GetUsableName], miało własne, niepowtarzalne flagi.
Co w imię Allaha jest w niej tak fascynującego? – zastanawia się wezyr, podczas gdy [Root.Monarch.GetName] wybucha entuzjazmem. „Wezyrze, powiadom mój dwór. Przeniesiemy się do Istaungoo i uczynimy je naszą stolicą! Sam chcę zobaczyć te legendarne pawie!”.

Nawet dla najbardziej stoickiego doradcy było to zbyt wiele. Niezależnie od tego, jakie szaleństwo opętało [Root.Monarch.GetTitle], wezyr musi teraz przemówić dla dobra państwa [Root.GovernmentName]."
 flavor_tur.999.a: "Wybacz mi, mój [Root.Monarch.GetTitle], powinniśmy raczej skupić się na rozwoju [Root.Capital.GetName]."
 flavor_tur.999.a.tt: "W ciągu najbliższych dni wielkiego wezyra może zastąpić paw..."
 flavor_tur.999.b: "Tak się stanie, mój [Root.Monarch.GetTitle]."
 flavor_tur.1000.t: "Niepodległość ejaletu"
 flavor_tur.1000.desc: "Jeszcze kilka dekad temu wydawało się to nie do pomyślenia, lecz [Root.Monarch.GetName] zdołał zapewnić państwu [Root.GetName] pełną niezależność od dawnych suwerenów. Niegdyś niewielki ejalet, prowincja imperium, może wreszcie stanąć na własnych nogach i podążyć za swoim przeznaczeniem."
 flavor_tur.1000.a: "Wreszcie sami decydujemy o własnym losie!"
 tur_city_of_faiths: "Miasto wyznań"
 tur_ottoman_venetian_trade_deal_modifier: "Układ handlowy osmańsko-wenecki"
 desc_tur_ottoman_venetian_trade_deal_modifier: "Zawarliśmy porozumienie handlowe z rządem Wenecji, pozwalające kupcom obu państw swobodnie podróżować i handlować na naszych ziemiach. Choć zmniejszy to nasze wpływy handlowe we własnych portach, w dłuższej perspektywie przyniesie wielki dobrobyt.

§YModyfikator zostanie automatycznie usunięty, gdy Osmanowie lub Wenecja zerwą sojusz z drugim partnerem.§!"
 tur_ottoman_venetian_trade_deal_modifier_prov: "Układ handlowy osmańsko-wenecki"
 desc_tur_ottoman_venetian_trade_deal_modifier_prov: "Ta prowincja korzysta z układu handlowego osmańsko-weneckiego.

§YModyfikator zostanie automatycznie usunięty, gdy Osmanowie lub Wenecja zerwą sojusz z drugim partnerem.§!"
 tur_ottoman_venetian_expanded_trade_deal_modifier: "Rozszerzony układ handlowy osmańsko-wenecki"
 desc_tur_ottoman_venetian_expanded_trade_deal_modifier: "Porozumienie handlowe z Wenecjanami zostało jeszcze bardziej rozszerzone. Choć umacnia to ich kontrolę nad handlem czarnomorskim, rekompensują nam to opłaty wnoszone na rzecz państwa [Root.GetName]."
 tur_ottoman_venetian_expanded_trade_deal_modifier_prov: "Rozszerzony układ handlowy osmańsko-wenecki"
 desc_tur_ottoman_venetian_expanded_trade_deal_modifier_prov: "Ta prowincja korzysta z rozszerzonego układu handlowego osmańsko-weneckiego.

§YModyfikator zostanie automatycznie usunięty, gdy Osmanowie lub Wenecja zerwą sojusz z drugim partnerem.§!"
 tur_economical_reforms: "Reformy gospodarcze"
 desc_tur_economical_reforms: "Wprowadziliśmy merkantylistyczne reformy handlowe, aby przełamać dominację zachodnich kupców nad handlem czarnomorskim."
 tur_early_cannons_modifier: "Wczesne działa Urbana"
 desc_tur_early_cannons_modifier: "Koszt dział Urbana został w całości pokryty dzięki przekazaniu mu obfitych funduszy i materiałów. Niestety, przyszła artyleria nie będzie już tak tania..."
 tur_resettlement_of_constantinople: "Ponowne zasiedlenie Konstantynopola"
 desc_tur_resettlement_of_constantinople: "Niegdyś wielkie miasto Konstantynopol padło ofiarą zniszczeń, grabieży krzyżowców i osmańskich najazdów. Jako nowa stolica Imperium Osmańskiego szybko podnosi się jednak po tych strasznych wydarzeniach, ponieważ coraz więcej ludzi migruje do tego tętniącego życiem miasta."
 tur_preperation_for_naval_war: "Przygotowania do wojny morskiej"
 desc_tur_preperation_for_naval_war: "Nasze stosunki z włoskimi państwami morskimi osiągnęły nowy poziom napięcia. Wybuch wojny jest tylko kwestią czasu.
Przygotujmy nasze okręty na nadchodzące starcia."
 tur_janissary_example: "Przykład janczarów"
 desc_tur_janissary_example: "Dyscyplina i gotowość bojowa janczarów stanowią wzór dla wszystkich naszych wojsk, zapewniając im niezrównane morale."
 tur_protection_from_raids_modifier: "Ochrona przed najazdami"
 desc_tur_protection_from_raids_modifier: "Drobni rycerze nie będą już zagrażać bezpieczeństwu i dobrobytowi tego portu."
 tur_janissary_loyalty: "Lojalność janczarów"
 desc_tur_janissary_loyalty: "Choć janczarzy są na tyle potężni i wpływowi, by utworzyć własny stan, ich lojalność nadal należy do [Root.Monarch.GetTitle]. Oby ich służba osmańskiemu państwu [Root.GovernmentName] przyniosła wielkie korzyści."
 tur_the_ottoman_rule: "Rządy osmańskie"
 desc_tur_the_ottoman_rule: "Naszym państwem rządzi dynastia Osmanów, a jego ustrój łączy rzymski system administracji z prawami i ideami Koranu. Choć skutecznie pozwala zarządzać rozległymi ziemiami, niesie ze sobą również problemy związane z wewnętrzną walką o władzę."
 tur_respected_the_patriarchate: "Uszanowanie patriarchatu"
 desc_tur_respected_the_patriarchate: "Nasza decyzja o uszanowaniu patriarchatu sprawia, że nasze rządy nad chrześcijanami wyznającymi obcą religię nie są kwestionowane."
 tur_removed_the_patriarchate: "Likwidacja patriarchatu"
 desc_tur_removed_the_patriarchate: "Nasza decyzja o likwidacji patriarchatu jest postrzegana jako wielki sukces islamu."
 tur_local_millet_rule: "Wpływy lokalnego milletu"
 desc_tur_local_millet_rule: "Ta prowincja znajduje się pod wpływem lokalnego milletu, który dba o rozwiązywanie niepokojów, zanim sprawa trafi przed sąd."
 tur_integration_of_a_core_eyalet: "Integracja rdzennego ejaletu"
 desc_tur_integration_of_a_core_eyalet: "Choć ejalety odgrywają kluczową rolę w naszym rządzie, niektóre obszary warto podporządkować bezpośrednio [Root.Monarch.GetTitle]. Przygotowujemy zatem proces integracji naszych rdzennych poddanych typu ejalet."
 tur_advance_into_europe: "Marsz w głąb Europy"
 desc_tur_advance_into_europe: "Wielkie miasto Wiedeń upadło. Święte Cesarstwo Rzymskie, niegdyś poważna przeszkoda dla naszej ekspansji, pokazało światu, że nie jest w stanie nas powstrzymać. Droga do Europy stoi przed nami otworem!"
 tur_turkish_fear: "Strach przed Turkami"
 desc_tur_turkish_fear: "Szybka ekspansja Imperium Osmańskiego w Europie wywołuje strach i panikę wśród naszego ludu. Atmosferę państwa [Root.GovernmentName] zdominowały niepokoje i niepewność co do przyszłości."
 tur_march_for_rome: "Marsz na Rzym"
 desc_tur_march_for_rome: "Nasza kampania w północnych Włoszech została pobłogosławiona przez Allaha. Włosi, zdezorientowani i pogrążeni w chaosie wskutek naszych podbojów, nie są w stanie stawić nam skutecznego oporu.
Nadszedł czas, by pomaszerować na Rzym i zdobyć to, co prawowicie nam się należy!"
 tur_crown_of_rome_modifier: "Korona Rzymu"
 desc_tur_crown_of_rome_modifier: "Jesteśmy zdobywcami obu rzymskich stolic. Nasze roszczenia do rzymskiej korony nie mogą już być kwestionowane!"
 tur_legitimate_roman_empire_modifier: "Prawowite Cesarstwo Rzymskie"
 desc_tur_legitimate_roman_empire_modifier: "Jesteś Rzymianinem! I ty jesteś Rzymianinem! Wszyscy jesteśmy Rzymianami!"
 tur_expanded_governmential_offices: "Rozbudowane urzędy państwowe"
 desc_tur_expanded_governmential_offices: "Budynki administracji państwowej w tej prowincji znacznie przyspieszają jej rozwój."
 tur_eyalet_management: "Rozbudowana administracja ejaletów"
 desc_tur_eyalet_management: "Nasza decyzja o skupieniu się na administracji państwa zamiast przenoszenia stolicy uprościła zarządzanie ejaletami naszego imperium."
 tur_turkish_andalusian_relations_gra: "Stosunki turecko-andaluzyjskie"
 desc_tur_turkish_andalusian_relations_gra: "To nie sprawa nikogo poza Turkami.
I, jak się okazuje, Andaluzyjczykami."
 tur_turkish_andalusian_relations_tur: "Stosunki turecko-andaluzyjskie"
 desc_tur_turkish_andalusian_relations_tur: "To nie sprawa nikogo poza Turkami.
I, jak się okazuje, Andaluzyjczykami."
 tur_morisco_refugees_modifier: "Uchodźcy moryscy"
 desc_tur_morisco_refugees_modifier: "Ta prowincja przyjęła muzułmańskich i żydowskich uchodźców z Iberii. Moryskowie osiedlają się tutaj i rozpoczynają nowe życie pod osmańską ochroną."
 tur_conquest_of_iberia: "Podbój Iberii"
 desc_tur_conquest_of_iberia: "Półwysep Iberyjski został wyzwolony spod władzy chrześcijańskich niewiernych. Muzułmanie na całym świecie radują się, gdy rekonkwista zostaje odwrócona!"
 tur_re_reconquista: "Ponowna rekonkwista Iberii"
 desc_tur_re_reconquista: "Nasz sojusznik odegrał kluczową rolę w zniszczeniu chrześcijańskiej dominacji w Iberii. Ta relacja powinna się rozwijać, podczas gdy świat chrześcijański będzie drżał przed nami."
 tur_romanian_tribute: "Danina rumuńska"
 desc_tur_romanian_tribute: "Rumuni zostali podporządkowani. Muszą teraz płacić nam daninę w postaci zasobów ludzkich i dukatów."
 tur_control_over_the_red_sea: "Kontrola nad Morzem Czerwonym"
 desc_tur_control_over_the_red_sea: "Morze Czerwone rzeczywiście należy do nas. Żaden statek handlowy nie wpływa na nie bez uiszczenia nam opłaty, a nasz zasięg morski w Azji jest większy niż kiedykolwiek."
 tur_religious_legal_code_level_1: "Kodeks prawa religijnego"
 desc_tur_religious_legal_code_level_1: "Naszym krajem rządzi się, kierując prawami, tradycjami i zasadami islamu. Islamski legalizm odgrywa istotną rolę w naszym codziennym życiu."
 tur_religious_legal_code_level_2: "Wielki kodeks prawa religijnego"
 desc_tur_religious_legal_code_level_2: "Naszym krajem rządzi się, kierując prawami, tradycjami i zasadami islamu. Islamski legalizm odgrywa istotną rolę w naszym codziennym życiu."
 tur_religious_legal_code_level_3: "Wspaniały kodeks prawa religijnego"
 desc_tur_religious_legal_code_level_3: "Naszym krajem rządzi się, kierując prawami, tradycjami i zasadami islamu. Islamski legalizm odgrywa istotną rolę w naszym codziennym życiu."
 tur_spiritual_focus_level_1: "Skupienie duchowe"
 desc_tur_spiritual_focus_level_1: "Mistycyzm — bliskość z Allahem stanowi jeden z filarów naszego społeczeństwa. W przeciwieństwie do państw, które przestrzegają islamskiego kodeksu prawnego w najdrobniejszych szczegółach, przyjmujemy swobodniejszą interpretację Koranu."
 tur_spiritual_focus_level_2: "Wielkie skupienie duchowe"
 desc_tur_spiritual_focus_level_2: "Mistycyzm — bliskość z Allahem stanowi jeden z filarów naszego społeczeństwa. W przeciwieństwie do państw, które przestrzegają islamskiego kodeksu prawnego w najdrobniejszych szczegółach, przyjmujemy swobodniejszą interpretację Koranu."
 tur_spiritual_focus_level_3: "Wspaniałe skupienie duchowe"
 desc_tur_spiritual_focus_level_3: "Mistycyzm — bliskość z Allahem stanowi jeden z filarów naszego społeczeństwa. W przeciwieństwie do państw, które przestrzegają islamskiego kodeksu prawnego w najdrobniejszych szczegółach, przyjmujemy swobodniejszą interpretację Koranu."
 tur_one_faith_empire_mod: "Imperium jednej wiary"
 desc_tur_one_faith_empire_mod: "Dzięki rozlewowi krwi, prześladowaniom i innym metodom wyznawcy obcych religii w naszym [Root.GovernmentName] zostali wyeliminowani. Rządzimy państwem, w którym panuje jedna wiara."
 tur_religious_empire: "Imperium religijne"
 desc_tur_religious_empire: "Łączy nas wspólna wiara i przekonania. Głosimy na świecie nauki religii [Root.Religion.GetName] i sprowadzamy wyznawców obcych religii oraz heretyków na właściwą drogę."
 tur_competent_pashas: "Lojalność paszów"
 desc_tur_competent_pashas: "Paszowie w tej prowincji dowiedli szczególnej lojalności wobec swojego sułtana."
 tur_imperial_muslim_center: "Cesarskie centrum islamu"
 desc_tur_imperial_muslim_center: "To miasto jest centrum wiary muzułmańskiej w imperium. Uczeni, filozofowie i pobożni ludzie z całego kraju przybywają tu, by zajmować się sprawami religijnymi."
 tur_the_gem_of_worlds_desire: "Klejnot pożądania świata"
 desc_tur_the_gem_of_worlds_desire: "Tutejsze targowiska czynią z tej prowincji klejnot pożądania świata. Kupcy ze wszystkich zakątków globu pokonują długą drogę do miasta, by handlować i nawiązywać nowe kontakty handlowe."
 tur_mamlukian_administration: "Administracja mamelucka"
 desc_tur_mamlukian_administration: "Rządzą nami mameluccy namiestnicy, jednak wpływy Osmanów znacząco obniżają sprawność administracji.\n\n§YNie można dokonać aneksji, gdy ten modyfikator jest aktywny.§!"
 tur_indonesian_trade: "Handel osmańsko-indonezyjski"
 desc_tur_indonesian_trade: "Nasi kupcy dotarli do bogatych wysp korzennych Indonezji. Prowadzony tam handel z pewnością powiększy zasoby naszego skarbca."
 tur_center_of_ottoman_commerce: "Ośrodek handlu osmańskiego"
 desc_tur_center_of_ottoman_commerce: "To miasto jest ośrodkiem handlu Imperium Osmańskiego. Jest tak okazałe i znaczące, że można je nazwać „Światowym Centrum Handlu”. Stało się sercem światowego handlu, do którego kupcy ze Starego i Nowego Świata przybywają, by prowadzić interesy."
 tur_pax_ottomana: "Pax Ottomana"
 desc_tur_pax_ottomana: "Jesteśmy potężnym orłem rzymskiego dziedzictwa. Nasze wspaniałe imperium góruje nad światem, gotowe przetrwać próbę czasu. Niech nasza chwała trwa wiecznie. Devlet-i Ebed-müddet!"
 tur_tatar_vanguard_modifier: "Tatarska straż przednia"
 desc_tur_tatar_vanguard_modifier: "Chanat Krymski wysyła najlepsze oddziały kawalerii, aby wzmocnić naszą armię.\n\nTen modyfikator obowiązuje, dopóki §YKrym§! pozostaje naszym poddanym."
 tur_the_imperial_capital: "Stolica imperium"
 desc_tur_the_imperial_capital: "Konstantynopol jest sercem Imperium Osmańskiego. Rzemieślnicy, przedstawiciele duchowieństwa i szlachty, kupcy, politycy — wszyscy najważniejsi ludzie przybywają do tego miasta i osiedlają się w jego murach."
 tur_imperial_school_of_military_engineering: "Cesarska Szkoła Inżynierii Wojskowej"
 desc_tur_imperial_school_of_military_engineering: "W tym mieście mieści się Cesarska Szkoła Inżynierii Wojskowej. Kształci się w niej wielu wybitnych specjalistów od oblężeń, których wiedzę można wykorzystać na polu bitwy przeciwko umocnieniom wroga."
 tur_the_turkish_national_force: "Turecka Gwardia Narodowa"
 desc_tur_the_turkish_national_force: "Wraz z modernizacją armii państwowej w naszym kraju powstała nowa gwardia, której zadaniem jest ochrona imperium w tych mrocznych czasach."
 tur_weakened_the_harem: "Osłabiony harem"
 desc_tur_weakened_the_harem: "Harem z czasem zdobył zbyt wielkie wpływy, dlatego nasz wielki sułtan ukrócił jego potęgę i zagwarantował, że żaden eunuch ani konkubina nie będą już mogli wpływać na rząd i dwór.\n\nNastępcy pochodzący z haremu mają o §R2§! mniej punktów umiejętności, dopóki ten modyfikator jest aktywny."
 tur_reign_of_women_modifier: "Rządy kobiet"
 desc_tur_reign_of_women_modifier: "Okres ten, znany również jako „Sułtanat kobiet”, był etapem historii Imperium Osmańskiego, w którym harem wywierał znaczny wpływ na sułtana i podejmowane przez niego decyzje. Sprawami administracji i dyplomacji zajmowały się wówczas matki i żony sułtanów."
 tur_secured_vali_ahad_modifier: "Zabezpieczona sukcesja następcy tronu"
 desc_tur_secured_vali_ahad_modifier: "Sukcesja została zabezpieczona, ponieważ wszyscy zbuntowani bracia zostali straceni lub wygnani z kraju."
 tur_rebellion_line_modifier: "Buntownicza linia sukcesji"
 desc_tur_rebellion_line_modifier: "Pozostawienie brata przy życiu okazało się zgubne. Mimo okazanej mu łaski sułtana próbuje on uzurpować sobie tron, podburzając naszych lojalnych poddanych do wystąpienia przeciwko władcy..."
 tur_sabotaged_bureaucracy_modifier: "Zdewastowana biurokracja"
 desc_tur_sabotaged_bureaucracy_modifier: "Bratu sułtana darowano życie. W podzięce za tę łaskę dopuścił się sabotażu naszej biurokracji.\nPowinniśmy byli stracić tego błazna..."
 tur_hormuz_toll_modifier: "Cło w Ormuz"
 desc_tur_hormuz_toll_modifier: "Opłatę za przepłynięcie cieśniny Ormuz wprowadził wielki wezyr Imperium Osmańskiego. Wszystkie zagraniczne statki transportowe przepływające przez cieśninę muszą uiścić opłatę na rzecz imperium."
 tur_abu_hanifa_mosque_modifier: "Meczet Abu Hanify"
 desc_tur_abu_hanifa_mosque_modifier: "W tej prowincji znajduje się grobowiec Abu Hanify, niegdyś wybitnego teologa i prawnika. Wzniesiony nad nim meczet został odrestaurowany ku jego czci i odzyskał dawną świetność."
 tur_embraced_legalism_modifier: "Przyjęcie legalizmu"
 desc_tur_embraced_legalism_modifier: "Wybraliśmy drogę legalizmu i w pełni przyjmujemy związane z nią wartości."
 tur_embraced_mysticism_modifier: "Przyjęcie mistycyzmu"
 desc_tur_embraced_mysticism_modifier: "Wybraliśmy ścieżkę mistycyzmu i w pełni przyjmujemy jego wartości."
 tur_end_of_the_caliphate_modifier: "Koniec kalifatu"
 desc_tur_end_of_the_caliphate_modifier: "Kalifat przestał istnieć. Autorytet, który niegdyś zapewniał, stał się jedynie opowieścią, a my zostaniemy zapamiętani jako jego niszczyciele."
 tur_integration_in_the_ottoman_government_modifier: "Integracja z rządem osmańskim"
 desc_tur_integration_in_the_ottoman_government_modifier: "Ta prowincja jest w trakcie przekształcania w integralną część Imperium Osmańskiego. Jej lokalna administracja dokłada wszelkich starań, by utrzymać niską autonomię i zapewnić wysoki napływ nowych rekrutów."
 tur_caucasian_conquest: "Podbój Kaukazu"
 desc_tur_caucasian_conquest: "Ta prowincja podlega osmańskiemu podbojowi Kaukazu. Choć dopiero niedawno stała się częścią imperium, już otrzymuje inwestycje od jego mieszkańców, aby stać się wartościowym nabytkiem dla państwa."
 tur_conquest_of_persia: "Zdobywcy Persji"
 desc_tur_conquest_of_persia: "Nasza kampania przeciwko Persji przynosi nam wielką chwałę. Imperia upadają, aby nasze mogło władać ich ziemiami!"
 tur_egyptian_annexation: "Kampania egipska"
 desc_tur_egyptian_annexation: "Decyzja o nieanektowaniu całego sułtanatu mameluków podczas jednej wojny pozwala naszej biurokracji przygotować się do wielkiego podboju, który nas czeka. Egipt upadnie, choć zajmie to więcej czasu."
 tur_exporting_to_the_west_modifier: "Eksport na Zachód"
 desc_tur_exporting_to_the_west_modifier: "Towary z Dalekiego Wschodu docierają za naszym pośrednictwem na Daleki Zachód."
 tur_trade_center_of_the_ottoman_empire_modifier: "Ośrodek handlowy Imperium Osmańskiego"
 desc_tur_trade_center_of_the_ottoman_empire_modifier: "Ta prowincja jest ważnym ośrodkiem handlowym Imperium Osmańskiego. Kupcy z całego subkontynentu odwiedzają ją, aby prowadzić wymianę handlową."
 tur_baghdad_city_of_learning: "Kontrola nad miastem nauki"
 desc_tur_baghdad_city_of_learning: "Bagdad był niegdyś kulturalnym i naukowym centrum świata islamu. Teraz, gdy znajduje się pod naszą kontrolą, miasto przeżywa nowy renesans nauki i kultury, pozwalając nam z łatwością odkrywać nowe technologie."
 tur_allowed_tatars_in_sipahi_modifier: "Tatarscy sipahowie"
 desc_tur_allowed_tatars_in_sipahi_modifier: "Postanowiliśmy przyjąć Tatarów w nasze szeregi. Choć janczarzy czują się zagrożeni, Tatarzy okażą się niezwykle użytecznymi oddziałami kawalerii."
 tur_safeguarded_jan_privileges_modifier: "Ochrona przywilejów janczarów"
 desc_tur_safeguarded_jan_privileges_modifier: "Postanowiliśmy nie przyjmować Tatarów w nasze szeregi. Janczarzy doceniają ten gest."
 tur_increased_fabric_production_modifier: "Zwiększona produkcja tkanin"
 desc_tur_increased_fabric_production_modifier: "Ta prowincja korzysta z handlu tkaninami. Miejscowa ludność jest dzięki temu bardziej skłonna do zwiększania produkcji swoich wyrobów na potrzeby handlu."
 tur_golden_silk_modifier: "Złoty jedwab"
 desc_tur_golden_silk_modifier: "Jedwab jest krwią naszej gospodarki. Równie cenny jak złoto, osmański jedwab jest poszukiwany we wszystkich częściach naszego wielkiego imperium i służy jako alternatywna waluta."
 tur_second_islamic_golden_era_modifier: "Drugi złoty wiek islamu"
 desc_tur_second_islamic_golden_era_modifier: "Islam ponownie przeżywa rozkwit. Ludzie obdarzeni łaską Allaha dokonują wielkich przełomów kulturowych, społecznych i technologicznych, a państwa muzułmańskie przechodzą renesans sztuki i nauki."
 tur_investment_into_infrastructure: "Zagraniczni inwestorzy"
 desc_tur_investment_into_infrastructure: "Ta prowincja otrzymuje wsparcie od zagranicznych inwestorów, którzy próbują tu pomnożyć swój majątek."
 tur_jade_techniques_of_far_east_modifier: "Techniki obróbki jadeitu z Dalekiego Wschodu"
 desc_tur_jade_techniques_of_far_east_modifier: "Kupcy podróżujący Jedwabnym Szlakiem przywieźli z Azji do Europy nie tylko towary, lecz także wiedzę i materiały, dzięki którym prowincja może wytwarzać własną odmianę porcelany."
 tur_peak_of_ottoman_empire: "Rozbudowana administracja imperialna"
 desc_tur_peak_of_ottoman_empire: "Wielki [Root.Monarch.GetTitle] przeprowadził szeroko zakrojone reformy administracji i biurokracji imperium, pozwalając nam integrować i utrzymywać więcej terytoriów niż kiedykolwiek wcześniej."
 tur_major_centre_myrrh_production_modifier: "Główny ośrodek produkcji mirry"
 desc_tur_major_centre_myrrh_production_modifier: "Ta prowincja leży na żyznych ziemiach Adenu. Dzięki właściwościom gleby produkcja mirry i innych składników kadzideł jest tu znacznie większa."
 tur_secured_loyalty_of_the_harem: "Uregulowanie funkcjonowania haremu"
 desc_tur_secured_loyalty_of_the_harem: "Dzięki intrygom, rozgrywkom dyplomatycznym na dworze i szantażowi udało się częściowo przywrócić kontrolę nad haremem."
 tur_growing_influence_of_the_janissaries: "Rosnące wpływy janczarów"
 desc_tur_growing_influence_of_the_janissaries: "Nasza armia coraz częściej korzysta z usług janczarów. Stało się to tak powszechne, że wojsko i sułtan uzależnili się od ich pomocy, pozwalając janczarom zdobywać władzę znacznie większą, niż pierwotnie im przeznaczono."
 tur_reigned_the_eyalets: "Podporządkowanie ejaletów"
 desc_tur_reigned_the_eyalets: "Ejalety zostały ponownie podporządkowane i nie ośmielają się już sprzeciwiać swojemu suwerenowi."
 tur_a_reborn_empire_modifier: "Odrodzone imperium"
 desc_tur_a_reborn_empire_modifier: "Przezwyciężyliśmy najmroczniejszy okres w historii Osmanów. Zdradzieccy janczarzy, spiskujący harem i zbuntowani paszowie nie zdołali rzucić wielkiego imperium na kolana!"
 tur_the_republic_of_turkiye: "Republika Turcji"
 desc_tur_the_republic_of_turkiye: "Sułtanat przestał istnieć, lecz wielkość Turków trwa nadal! Niech świat drży przed potęgą rewolucji prowadzonej przez nasz wspaniały kraj!"
 restore_devshirme_system_title: "Przywróć system dewszirme"
 restore_devshirme_system_desc: "System dewszirme został wypaczony. Muzułmańskie rodziny przemycają do korpusu janczarów własne dzieci, podczas gdy poddani wyznający obce religie oddają nam najsłabszych. Musimy jak najszybciej naprawić te szkody, zanim dyscyplina janczarów jeszcze bardziej osłabnie."
 second_islamic_golden_era_descision_title: "Drugi złoty wiek islamu"
 second_islamic_golden_era_descision_desc: "Islam ponownie staje się jedną z dominujących potęg świata. Wraz z odrodzeniem kalifatu osmańskiego rozkwita postęp kulturowy i technologiczny państw muzułmańskich.
Zaprawdę, żyjemy w drugim złotym wieku islamu."
 tur_assigned_local_pasha: "Pasza wywodzący się z miejscowej ludności"
 desc_tur_assigned_local_pasha: "Pasza zarządzający tą prowincją został wybrany spośród cenionych przedstawicieli miejscowej ludności."
 tur_expanded_administration: "Zdecentralizowana administracja"
 desc_tur_expanded_administration: "Ze względu na zdecentralizowany charakter naszego ustroju proces integracji nowych terytoriów prowadzą lokalni paszowie, co zmniejsza obciążenie rządu centralnego."
 face_the_janissaries_1_title: "Staw czoła janczarom na Bałkanach"
 face_the_janissaries_1_desc: "Janczarzy zdobyli zbyt wielką władzę i wpływy. Trzeba ich powstrzymać ogniem naszych dział i stalą naszych mieczy!"
 face_the_janissaries_2_title: "Staw czoła janczarom w Anatolii"
 face_the_janissaries_2_desc: "Janczarzy zdobyli zbyt wielką władzę i wpływy. Trzeba ich powstrzymać ogniem naszych dział i stalą naszych mieczy!"
