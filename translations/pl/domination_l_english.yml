 ability_ottoman_decadence_mechanic: "Wskaźnik dekadencji"
 ottoman_decadence: "Dekadencja"
 ottoman_decadence_desc: "Dekadencja określa, ile rzeczywistej władzy znajduje się w rękach władcy oraz w jakim stopniu obecny stan państwa jest traktowany jako coś oczywistego. Im większa dekadencja, tym trudniej utrzymać państwo i dorównać innym wielkim potęgom.

Dekadencja wzrasta z następujących powodów:
 - Pozostawanie w pokoju
 - Nielojalność janczarów i posiadanie przez nich ziemi koronnej
 - Ujemna stabilność
 - Korupcja
 - Przekroczenie zdolności administracyjnej
 - Średnie pragnienie wolności poddanych
 - Średnia autonomia krajowa
 - Przegrywanie bitew, w których [Root.Monarch.GetTitle] dowodzi armią

Dekadencja maleje z następujących powodów:
 - Absolutyzm
 - Realizacja zadań stanowych
 - Wygrywanie bitew, w których [Root.Monarch.GetTitle] dowodzi armią
 - Dodatnia stabilność

Jeśli dekadencja osiągnie §R100§!, może wybuchnąć katastrofa §RWewnętrzna walka o władzę§!."
