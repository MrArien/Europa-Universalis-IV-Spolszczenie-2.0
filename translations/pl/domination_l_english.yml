 system_of_councils_mechanic_desc: "System rad został opracowany przez monarchię hiszpańską, aby umożliwić zarządzanie bardzo odległymi i zróżnicowanymi ziemiami za pomocą rozbudowanej biurokracji, zorganizowanej w rady tematyczne lub terytorialne. System osiągnął szczyt rozwoju za panowania Filipa II, zwanego również „Królem Biurokratą”."
