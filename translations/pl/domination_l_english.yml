 flavor_brapru.24.b: "Ostrożnie odmawiamy."
 flavor_brapru.42.t: "Katastrofa we Frankonii"
 flavor_brapru.42.d: "Nasze próby umocnienia władzy nad ziemiami frankońskimi zakończyły się katastrofą. Po kilku latach starań sytuację w Dolnych Niemczech można określić wyłącznie jako całkowitą porażkę, a wkrótce odczujemy jej konsekwencje. Byliśmy o krok od wielkości..."
 flavor_brapru.42.a: "Byliśmy tak blisko!"
 flavor_brapru.43.t: "Berlińska dysputa religijna"
 flavor_brapru.43.d: "W Berlinie zgromadzili się liczni teologowie i uczeni, aby wziąć udział w wydarzeniu, które może zdarzyć się tylko raz w życiu. Cel jest prosty: pojednanie różnic między teologią luterańską a kalwińską. Od dawna jesteśmy ostoją wolności religijnej w Cesarstwie i zapewniamy schronienie osobom prześladowanym przez inkwizycję. Mimo to napięcia wciąż rosną, a mieszkańcy opowiadają się po przeciwnych stronach konfliktu, który przerodził się w protestancką schizmę przypominającą rozłam Kościoła rzymskiego. Miejmy nadzieję, że ta konferencja przyniesie pokój."
 flavor_brapru.43.a: "To wielki postęp!"
 flavor_brapru.43.b: "Kościołów nie da się zjednoczyć. To strata czasu!"
 flavor_brapru.44.t: "Edykt tolerancyjny"
 flavor_brapru.44.d: "W obliczu narastających napięć religijnych obowiązkiem państwa [Root.GetName] jest powstrzymanie rozprzestrzeniania się konfliktu i przygotowanie się na nadchodzące trudności. Edykt tolerancyjny wydany przez [Root.Monarch.GetName] stanowi, że Kościoły luterański i reformowany mają być traktowane na równi, a ich wzajemne stosunki będą regulowane prawem."
 flavor_brapru.44.a: "Wprowadźmy edykt siłą!"
 flavor_brapru.44.b: "To tylko wywoła jeszcze większe niezadowolenie."
 flavor_brapru.45.t: "Los Kreditwerku"
 flavor_brapru.45.d: "Długi poddanych i monarchów nie mogą pozostawać bez finansowania. Zanim pragmatyzm stał się podstawą rządzenia, administracja państw opierała się na prostych rozwiązaniach, a Kreditwerk jest pozostałością tamtej epoki. Finansując długi margrabstwa za pośrednictwem stanów, [Root.Monarch.GetTitle] mógł nadal zaciągać pożyczki na lichwiarskich warunkach. Być może nadszedł czas, by raz na zawsze ukrócić działalność tej instytucji."
 flavor_brapru.45.a: "Ta odrażająca instytucja zasługuje na równie odrażający koniec."
 flavor_brapru.45.b: "Zreformujmy Kreditwerk i podporządkujmy go rządowi."
 flavor_brapru.46.t: "Bracia Humboldtowie"
 flavor_brapru.46.d: "Bracia Humboldtowie byli pruskimi filozofami, językoznawcami, urzędnikami państwowymi, dyplomatami i założycielami Uniwersytetu Humboldtów w Berlinie. Starszy z braci, Wilhelm von Humboldt, poświęcił swoje badania filozoficznym zagadnieniom życia i był prawdziwym intelektualistą. Młodszy, Alexander von Humboldt, koncentrował się natomiast na kolejnych przełomowych odkryciach. Wyruszał na liczne wyprawy do Ameryki Hiszpańskiej, Rosji i Stanów Zjednoczonych. Bracia Humboldtowie byli bez wątpienia parą wybitnych umysłów."
 flavor_brapru.46.a: "Nieprzemijająca filozofia Wilhelma wskaże nam drogę."
 flavor_brapru.46.b: "Przełomowe odkrycia Alexandra ukształtują nasze państwo."
 flavor_brapru.47.t: "O talarach, groszach i fenigach"
 flavor_brapru.47.d: "Wskutek nieustannych wahań podaży pieniądza polityka monetarna jest zazwyczaj łączona z polityką fiskalną i pozostawiana w gestii stanów. Podaż monet rzadko znajduje się zatem pod bezpośrednią kontrolą władcy. Ostatnio zaczęliśmy jednak kłaść większy nacisk na kontrolowanie obiegu pieniądza w państwie. Nadszedł więc czas, aby wybrać kierunek dalszych działań."
 flavor_brapru.47.a: "Wspierajmy i gromadźmy rezerwy."
 flavor_brapru.47.b: "Inwestuj i stabilizuj"
 flavor_brapru.47.c: "Przebijmy nową monetę – reichsthalera!"
