 flavor_mch.9.t: "Wzrost potęgi Nurhaciego"
 flavor_mch.9.d: "Jeden z naszych najszlachetniejszych i najdzielniejszych wojowników, Nurhaci, dowiódł, że jest cennym nabytkiem dla rozwijającego się państwa. Jego reorganizacja i zjednoczenie różnych plemion dżurdżeńskich pod naszym sztandarem dały nam środki niezbędne do walki z ciemiężycielami. Z czasem Nurhaci miał przypuścić zmasowany atak na rozpadające się Cesarstwo Ming, kładąc podwaliny pod nową dynastię, która zdominowała region. Do jego legendarnych osiągnięć należą reformy systemu chorągwianego oraz stworzenie pisma mandżurskiego."
 flavor_mch.9.a: "Będzie przewodził rodzącemu się wielkiemu mocarstwu!"
 flavor_mch.9.b: "Wykorzystajmy jego talent wojskowy na polu bitwy."
 flavor_mch.9.c: "Jego rady okażą się cenne na dworze i na polach ćwiczeń."
 flavor_mch.10.t: "Siedem krzywd"
 flavor_mch.10.d: "Historycznie manifest ten został po raz pierwszy ogłoszony przez przywódcę Mandżurów, Nurhaciego, trzynastego dnia czwartego miesiąca księżycowego trzeciego roku ery Tianming. Wrogość między plemionami mandżurskimi a dynastią Ming osiągnęła szczyt, prowadząc do otwartej wojny między obiema potęgami. Siedem krzywd przedstawia się następująco:

Ming bez powodu zabili ojca i dziadka [Root.Monarch.GetName].
Ming uciskali nasz lud i faworyzowali rywalizujące klany.
Ming złamali porozumienie dotyczące ziem zawarte z [Root.Monarch.GetName].
Ming wysłali wojska, aby chronić naszych wrogów przed nami.
Ming poparli plany innych klanów, które zamierzały złamać obietnicę złożoną naszemu władcy.
Ming zmusili [Root.Monarch.GetName] do oddania ziem w Chaihe, Sancha i Fuan.
Urzędnik dynastii Ming, Shang Bozhi, nadużywał swojej władzy i bezwzględnie uciskał lud."
 flavor_mch.10.a: "Nadeszła nasza chwila!"
 flavor_mch.11.t: "Podbój Korei"
 flavor_mch.11.d: "Korea i jej liczni mieszkańcy znaleźli się teraz całkowicie w naszym zasięgu. To, co niegdyś było wspaniałym królestwem, pełnym wybitnych umysłów i potężnych władców, stanie się jedynie szczeblem, po którym wzniesiemy się ku własnej chwale. Ich historia zakończy się tam, gdzie zaczyna się nasza. Na całym ich terytorium będziemy głosić chwałę naszego ludu i badać koreańskie społeczeństwo, aby czerpać z niego naukę."
 flavor_mch.11.a: "Zbadajmy ich alfabet..."
 flavor_mch.11.b: "Musimy poznać ich system rolnictwa!"
 flavor_mch.11.c: "Ich sztuka wojenna okaże się bardzo przydatna."
 flavor_mch.11.e: "Niech będzie to biblioteka królewska – nasi wojownicy będą czytać książki!"
 flavor_mch.11.f: "Zostaną włączeni do kultury zwycięzców."
 legendary_conqueror_personality: "Legendarny zdobywca"
 desc_legendary_conqueror_personality: "Zdobywca zahartowany w ogniu wojny i zwycięstw. Ten władca ma charakter i doświadczenie, które pozwolą mu stanąć w jednym szeregu z największymi i najbardziej podziwianymi zdobywcami w historii."
 TIM_legendary_conqueror_flag: "Legendarny zdobywca"
 legendary_conqueror_personality_die_desc: "Podboje [Root.Monarch.GetHerHisCap] przyniosły chwałę naszemu narodowi."
 ancestor_legendary_conqueror_personality: "Legendarny zdobywca"
 desc_ancestor_legendary_conqueror_personality: ""
 ancestor_legendary_conqueror_personality_die_desc: "[Root.Monarch.GetHerHisCap] podboje przyniosły chwałę naszemu narodowi."
 great_engineer_personality: "Wielki inżynier"
 desc_great_engineer_personality: "Wizjoner i pionier w dziedzinie budownictwa. Niezależnie od tego, czy kieruje nim własna ambicja i zapał, czy pragnienie poprawy losu poddanych, nasz władca wykazuje niezwykłe zdolności w planowaniu i realizacji przedsięwzięć budowlanych."
 TIM_legendary_architect_flag: "Legendarny architekt"
 great_engineer_personality_die_desc: "[Root.Monarch.GetHerHisCap] budowle przyniosły nam bezprecedensowy prestiż."
 ancestor_great_engineer_personality: "Wielki inżynier"
 desc_ancestor_great_engineer_personality: ""
 ancestor_great_engineer_personality_die_desc: "[Root.Monarch.GetHerHisCap] budowle przyniosły nam bezprecedensowy prestiż."
 dragon_tiger_general_personality: "Smok i Tygrys"
 desc_dragon_tiger_general_personality: "Ten generał słynie z szybkości, z jaką porusza się konno, oraz niszczycielskich szarż prowadzonych wraz z podległymi mu oddziałami jazdy."
 dragon_tiger_general_personality_die_desc: "Nasi podli wrogowie nie zapomną jego legendarnych manewrów."
 LJN: "Późniejsza dynastia Jin"
 LJN_ADJ: "Dżurdżeńskie"
 qng_north_china_title: "Umocnienie władzy w północnych Chinach"
 qng_north_china_desc: "Nasza walka dopiero się rozpoczęła! Dążąc do podporządkowania sobie Chin, musimy umocnić nasze panowanie na północnych ziemiach, w sercu dawnego cesarstwa."
 qng_green_standard_army_title: "Armia Zielonej Chorągwi"
 qng_green_standard_army_desc: "Chińskie armie pogrążone są w chaosie, a ich generałowie szybko tracą zaufanie do swych władców. Jeśli zdołamy opanować dostatecznie rozległe obszary północnych Chin, dowódcy ci mogą postanowić przejść na naszą stronę, zamiast służyć skazanemu na upadek Cesarzowi. Rozsądnie będzie wyszkolić tych nowo pozyskanych żołnierzy i utworzyć z nich regularną armię godną nowego Cesarza Chin!"
 qng_annex_tibet_title: "Aneksja Tybetu"
 qng_annex_tibet_desc: "Wielu Mongołów zaczęło przyjmować tybetańską odmianę buddyzmu. Powinniśmy podbić Tybet, aby mieć pewność, że wyznawcy tej religii znajdą się pod panowaniem naszych sztandarów."
 qng_modernize_the_banners_title: "Modernizacja Chorągwi"
 qng_modernize_the_banners_desc: "Oddziały Chorągwi wiernie nam służyły. Jeśli jednak chcemy nadążyć za przemianami sztuki wojennej, musimy je zmodernizować i zadbać o ich gotowość bojową."
 qng_incorporate_han_title: "Włączenie Chińczyków Han"
 qng_incorporate_han_desc: "Podbój cesarstwa Mingów nie będzie łatwym zadaniem. Pokonanie ich generałów i słabo wyszkolonych wojsk w bitwie może się okazać najmniejszym z naszych problemów. Ich ludność liczy miliony, a sprawowanie nad nią rządów wymaga zawarcia pewnych porozumień i współpracy — musimy jednak zadbać, by przyniosły one korzyści przede wszystkim nam."
 qng_extinguish_ming_title: "Ostateczny kres dynastii Ming"
 qng_extinguish_ming_desc: "Dopóki istnieje choćby ostatni bastion lojalistów dynastii Ming, nasze panowanie nad Chinami nigdy nie będzie w pełni bezpieczne. Musimy całkowicie zniszczyć dynastię Ming."
 qng_ten_grand_campaigns_title: "Dziesięć Wielkich Wypraw"
 qng_ten_grand_campaigns_desc: "Podbój Chin pozwolił mieszkańcom odległych rubieży cesarstwa wznieść się ponad dotychczasowy stan. Musimy przeprowadzić serię wypraw, by przywrócić porządek na tych ziemiach i rozszerzyć potęgę Wielkiego Qing nad naszymi wrogami."
 qng_campaign_in_burma_title: "Wyprawa do Birmy"
 qng_campaign_in_burma_desc: "Kolejni lojaliści dynastii Ming uciekli w góry Birmy, szukając schronienia u władców Szanów i Bamarów. Musimy im dowieść, że przed tymi, którzy prawowicie dzierżą Mandat Niebios, nie ma dokąd uciec."
 qng_three_feudatories_title: "Trzej Feudałowie"
 qng_three_feudatories_desc: "W miarę jak nasza kampania przesuwa się coraz dalej na południe Chin, musimy rozważyć, czy przynajmniej w krótkiej perspektywie łatwiej będzie powierzyć rządy w tym regionie gubernatorom dynastii Ming, którzy przeszli na stronę Qing. Musimy znaleźć sposób, by wykorzystać sytuację na południu."
 qng_junji_chu_title: "Rada Junji Chu"
 qng_junji_chu_desc: "Ustanowiona przez cesarza Qing [Root.Monarch.GetName] w roku [GetYear] rada Junji Chu, powszechnie znana jako Wielka Rada, jest jednym z najpotężniejszych i najbardziej wpływowych organów ustawodawczych. Musimy wykorzystać nasze zdolności prawne i elastyczność, aby powołać radę przyboczną wspierającą głowę państwa."
 qng_integrate_taiwan_title: "Zintegruj Tajwan"
 qng_integrate_taiwan_desc: "Lojaliści dynastii Ming, piraci i europejscy oportuniści tłumnie przybywają na wybrzeża Tajwanu. Wyspa nigdy nie została włączona do Chin, a wielu uważa ją za barbarzyńskie odludzie. Nie możemy jednak dłużej ignorować jej strategicznego znaczenia, zwłaszcza gdy znajduje się w rękach naszych wrogów."
 qng_conquer_south_china_title: "Zabezpiecz południowe Chiny"
 qng_conquer_south_china_desc: "Ziemie na południe od prowincji [1821.GetName] są pełne buntów i zniszczeń, a ich mieszkańcy gotowi są powitać nas jako wyzwolicieli zesłanych przez Niebiosa. Musimy szybko wkroczyć do akcji i zabezpieczyć bogate, żyzne ziemie południowego wybrzeża oraz obszary położone dalej na zachód."
 qng_balance_mandate_title: "Przywróć równowagę Mandatu"
 qng_balance_mandate_desc: "Niebiosa obdarzą nas swoją przychylnością. Po niepowodzeniach wynikających z nieudolnej administracji dynastii Ming odważnie wypełnimy próżnię władzy pozostawioną przez poprzednią dynastię i zapiszemy własne imiona na kartach historii!"
 qng_high_qing_era_title: "Dobrobytna epoka Qing"
 qng_high_qing_era_desc: "Zawirowania, walki i wojny sprawiły, że całe Chiny wraz z ich ogromnym bogactwem znalazły się w naszych rękach. Wojna nie jest jednak jedyną ani najlepszą drogą do historycznej wielkości. Aby nasza dynastia zasłużyła na miano godnej i cesarskiej, musimy inwestować zarówno w rozwój wewnętrzny, jak i zewnętrzny, pielęgnując kulturę oraz piśmienność."
 qng_library_four_treasuries_title: "Biblioteka Czterech Skarbców"
 qng_library_four_treasuries_desc: "Cała historia Chin została zgromadzona w naszych archiwach, z których usunięto materiały wrogie dynastii Qing, aby zapobiec szerzeniu się sprzeciwu."
 qng_regulate_trade_title: "Globalizacja handlu"
 qng_regulate_trade_desc: "Cudzoziemcy od zawsze pragnęli wpływać na nasz handel wewnętrzny. Dochodowe umowy handlowe zawierane w naszym państwie mogłyby przynieść im ogromne korzyści finansowe. Musimy jednak zachować zdecydowaną postawę i wybrać właściwy kierunek działania, aby nie paść ofiarą ich wyzysku."
 qng_branching_mission_trade_1_title: "§YMisja rozgałęziona§!"
 qng_branching_mission_trade_1_desc: " "
 qng_branching_mission_trade_2_title: "§YMisja rozgałęziona§!"
 qng_branching_mission_trade_2_desc: " "
 qng_promote_local_industry_title: "[Root.GetPreviewColorQNG]Wspieraj rodzimy przemysł[Root.GetPreviewColorQNG_end]"
 qng_promote_local_industry_desc: "Nasz lud jest najsilniejszy, gdy działa wspólnie z rodakami na rzecz wielkiego cesarza. Zamiast poniżać się, zwracając ku cudzoziemcom, powinniśmy skupić się na krajowej produkcji."
 qng_expel_foreign_merchants_title: "[Root.GetPreviewColorQNG]Wypędź zagranicznych kupców[Root.GetPreviewColorQNG_end]"
 qng_expel_foreign_merchants_desc: "Zbyt długo zagraniczni kupcy z odległych krain wykorzystywali naszą gościnność i hojność. Nadszedł czas, by przejąć kontrolę nad naszymi rynkami i pozbyć się tych pasożytów."
 qng_allow_foreign_exchanges_title: "[Root.GetPreviewColorQNG]Zezwól na wymianę zagraniczną[Root.GetPreviewColorQNG_end]"
 qng_allow_foreign_exchanges_desc: "Tak potężne i zamożne państwo jak nasze może wiele zyskać, rozszerzając zasięg handlu i dopuszczając do niego cudzoziemców oraz kupców ze wszystkich zakątków świata. Globalny handel przypomina przypływ, który unosi wszystkie łodzie. Musimy szybko wykorzystać tę szansę."
 qng_chinese_industrial_revolution_title: "[Root.GetPreviewColorQNG]Rewolucja przemysłowa[Root.GetPreviewColorQNG_end]"
 qng_chinese_industrial_revolution_desc: "Ryk silników, radosny świst pary i postęp wiedzy napędzają nasz rozwój, gdy wykorzystujemy gwałtowny wzrost gospodarczy. Linie produkcyjne, industrializacja i pojawienie się nowych maszyn utorują drogę naszemu wspaniałemu przebudzeniu przemysłowemu."
 qng_new_banners_modifier: "Nowe pułki chorągwiane"
 qng_new_banners2_modifier: "Nowe pułki chorągwiane"
 qng_gate_to_the_east_modifier: "Brama między Wschodem a Zachodem"
 qng_han_cooperation_modifier: "Współpraca z Hanami"
