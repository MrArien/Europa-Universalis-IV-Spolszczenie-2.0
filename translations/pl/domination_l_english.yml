 appanages_event.1.t: "Szlachta dawnego księstwa udzielnego oburzona"
 appanages_event.1.desc: "Po aneksji jednego z naszych poddanych szlachta tych ziem wyraziła oburzenie i niezadowolenie ze swojej nowej pozycji w państwie [Root.GetUsableName]. Ludzie ci, niegdyś dzierżący tytuły i ziemie, są teraz jedynie kolejnymi poddanymi, którzy mają służyć [Root.Monarch.GetTitle]."
