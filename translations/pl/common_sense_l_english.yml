l_english:
 papacy_events.1.t: "Gwardia Szwajcarska"
 papacy_events.1.d: "Atrament zasechł na umowie ustanawiającej Pontyfikalną Gwardię Szwajcarską. Ten elitarny pułk składa się ze zdyscyplinowanych i doświadczonych mężczyzn absolutnie lojalnych wobec Ojca Świętego. Przysięgli służyć Państwu Kościelnemu aż do Sądu Ostatecznego."
 papacy_events.1.a: "Będą dobrze bronić Kościoła."
 papacy_events.2.t: "Papież prosi o Gwardię Szwajcarską"
 papacy_events.2.d: "Nasi żołnierze szukają fortuny za granicą, co doprowadziło do tego, że zyskali reputację najbardziej zdyscyplinowanych, lojalnych i potężnych żołnierzy stosujących rewolucyjne taktyki bitewne. Wielu chce zatrudnić naszych żołnierzy, nawet papieża, który chce zawrzeć z nami pakt. Prosi, abyśmy dostarczali [From.GetName] stały korpus szwajcarskich najemników. Z pewnością zwiększy to nasz prestiż i da nam inne korzyści."
 papacy_events.2.a: "Wyślij gwardzistów do papieża."
 papacy_events.2.b: "Nie, potrzebujemy ich więcej."
 papacy_events.3.t: "Szwajcaria wysyła Gwardię Szwajcarską"
 papacy_events.3.d: "Doszła wiadomość ze Szwajcarii o wyrażeniu zgody na pakt. Głosi ona również, że Szwajcaria dostrzega przykrą sytuację dla Kościoła Pańskiego, Matki Chrześcijaństwa i zdaje sobie sprawę, jak poważne i niebezpieczne jest to, że każdy tyran, żądny bogactwa, może bezkarnie atakować wspólną Matkę Chrześcijaństwa."
 papacy_events.3.a: "Jesteśmy bardzo wdzięczni za to!"
 papacy_events.4.t: "Nie dla Gwardii Szwajcarskiej"
 papacy_events.4.d: "Z uwagi na wybitność szwajcarskich najemników i duże zapotrzebowanie ze strony innych państw, Szwajcaria odrzuciła naszą umowę i odmówiła wysłania nam jednostek do obrony."
 papacy_events.4.a: "Ale... potrzebujemy ich!"
 papacy_events.5.t: "Passetto di Borgo"
 papacy_events.5.d: "Rzym jest stracony! Wróg zbliża się, aby aresztować [Root.Monarch.GetRulerGen]. [Root.Monarch.GetName] może uciec z pomocą Passetto di Borgo, przejścia, które łączy Pałac Apostolski z Zamkiem Świętego Anioła. Wielu papieży używało tego przejścia jako drogi ucieczki i teraz [Root.Monarch.GetName] musi rozważyć, czy uciec z miasta."
 papacy_events.5.a: "Ucieknij przez przejście!"
 papacy_events.5.b: "Papież nie opuści Rzymu."
 papacy_events.6.t: "Kardynał-nepot"
 papacy_events.6.d: "Papieże mają długą tradycję mianowania swoich krewnych do Kolegium Kardynałów. Niektórzy nazywają to nepotyzmem, ale mimo to kardynałowie-nepoci mają zapewnione miejsce w Kurii. Teraz gdy nadszedł czas, aby mianować nowego kardynała w [cardinal_nephew_country.GetName], papież [Root.Monarch.GetName] musi zdecydować, czy krewny jest odpowiednią osobą do zamieszkania w [cardinal_nephew_province.GetName]."
 papacy_events.6.a: "Nie. To tradycja, którą powinniśmy zakończyć."
 papacy_events.6.b: "Krewny papieża będzie dobrym kardynałem."
 papacy_events.7.t: "Kardynał-nepot papieża"
 papacy_events.7.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] prosi nas o ustanowienie swego krewnego kardynałem w [Root.GetName]. Jest to powszechna praktyka, lecz niektórzy widzą w tym rażący nepotyzm."
 papacy_events.7.a: "Przyjmijmy kardynała, nepota papieża."
 papacy_events.7.b: "Nie możemy zgodzić się na nepotyzm w Kościele."
 papacy_events.8.t: "Kardynał-nepot zaakceptowany"
 papacy_events.8.d: "[From.Owner.GetName] akceptuje krewnego papieża jako nowego kardynała w [From.GetName]."
 papacy_events.8.a: "Doskonale!"
 papacy_events.9.t: "Kardynał-nepot odrzucony"
 papacy_events.9.d: "[From.Owner.GetName] odmawia mianowania krewnego papieża nowym kardynałem w [From.GetName]."
 papacy_events.9.a: "Rozczarowujące."
 papacy_events.10.t: "Złupienie Rzymu"
 papacy_events.10.d: "Rzym po złupieniu wygląda jak pobojowisko. Wróg dzięki swojej przewadze liczebnej z łatwością wygrał szturm na mury. Na schodach do Bazyliki Świętego Piotra, leżą zmasakrowane ciała gwardzistów, którzy znaleźli się w Domu Ojca jeszcze przed rozpoczęciem plądrowania miasta. Pożary, grabież i egzekucje trwały aż do momentu gdy wrogowie opuścili nasze Święte Miasto ze wszystkim co zdołali unieść."
 papacy_events.10.a: "Wzmocnijmy garnizon, nigdy nie może się to powtórzyć."
 papacy_events.10.b: "Odbudujmy zniszczone miasto."
 papacy_events.11.t: "Biblioteka Watykańska"
 papacy_events.11.d: "Kościół Katolicki posiada ogromną liczbę dzieł pisanych, z różnych epok. Zapewnione fundusze pozwoliły na utrwalenie i poszerzenie wiedzy o Chrześcijaństwie poprzez stworzenie wspaniałej biblioteki za murami Watykanu. Założenie Biblioteki Watykańskiej pozwoli stworzyć z Rzymu centrum świata nauki."
 papacy_events.11.a: "Załóżmy ją i skupmy się na dziełach dotyczących administracji."
 papacy_events.11.b: "Nasz wysiłek powinien skupić się na dziełach dyplomatycznych."
 papacy_events.11.c: "Załóżmy bibliotekę z myślą o sztuce wojennej."
 papacy_events.11.e: "Musimy nad tym dłużej pomyśleć."
 papacy_events.12.t: "Kaplica Sykstyńska"
 papacy_events.12.d: "Cappella Maggiore - Kaplica Większa - służy do odprawiania mszy, które mogą odbywać się w mniejszych, mniej publicznych miejscach niż bazyliki. Lata nie były łaskawe dla wspaniałej niegdyś kaplicy, którą zdobił Fra Angelico, jej mury są pochylone i jest zrujnowana. Kaplica powinna zostać rozebrana, ponieważ konstrukcja nie jest wystarczająco bezpieczna dla tak wielu mszy, które odbywają się tam każdego roku. Nowy, bardziej okazały budynek powinien zająć jej miejsce. Wielu znanych artystów było by zaszczyconych, gdyby zostali poproszeni o udekorowanie nowej Kaplicy Sykstyńskiej."
 papacy_events.12.a: "Zburz stare i zbuduj nowe w tym samym miejscu."
 papacy_events.12.b: "Przestań korzystać ze starej kaplicy, są inne budynki, z których możemy skorzystać."
 papacy_events.13.t: "Zdobienia Kaplicy Sykstyńskiej"
 papacy_events.13.d: "Nie ma już starej, podupadłej Cappelli Maggiore - na jej miejscu stoi teraz okazała Kaplica Sykstyńska. Świątynia Salomona i Kaplice Sykstyńskie mają takie same wymiary, jak te podane w Starym Testamencie. Na zewnątrz nie ma ozdobnych detali, budynek podzielony jest na trzy kondygnacje ze sklepieniem i sześcioma wysokimi łukowymi oknami po bokach, po dwa na każdym końcu. Piękna w swej prostocie kaplica mogłaby zostać wzbogacona o freski namalowane przez najlepszych artystów naszych czasów."
 papacy_events.13.a: "Zatrudnij Sandro Botticelli."
 papacy_events.13.b: "Zatrudnij Domenico Ghirlandaio."
 papacy_events.13.c: "Zatrudnij Pietro Perugino."
 papacy_events.13.e: "Zatrudnij Michała Anioła."
 papacy_events.13.f: "Znajdź kogoś, kto ozdobi kaplicę!"
 papacy_events.13.g: "Zostaw to tak, jak jest, nie musimy tego teraz robić."
 papacy_events.14.t: "Sprzedaż odpustów"
 papacy_events.14.d: "Wiele państw zaczęło za pieniądze sprzedawać odpusty, dzięki czemu bogatsi ludzie mogą uratować swoje dusze i pomimo grzechu dalej normalnie żyć. Praktyki te przynoszą spore zyski dla skarbca Kościoła, i chociaż niektórzy je potępiają, inni uważają, że powinny one pozostać dozwolone."
 papacy_events.14.a: "Zabraniamy tej praktyki!"
 papacy_events.14.b: "Świat się kręci wokół pieniędzy..."
 papacy_events.15.t: "Osądzenie symonii"
 papacy_events.15.d: "W Dziejach Apostolskich 8:9-24 Szymon Mag zaoferował dwóm apostołom Piotrowi i Janowi pieniądze, jeśli upoważnią go do udzielania mocy Ducha Świętego każdemu, na kim położy ręce. Ten akt sprzedaży duchowych rzeczy, takich jak godności i urzędy kościelne, nazywany jest symonią od imienia tego człowieka, a wielu władców dało się omamić blaskiem złota, by sprzedać biskupstwa."
 papacy_events.15.a: "Potraktujemy to jako przestępstwo!"
 papacy_events.15.b: "To praktyka, na którą można pozwolić."
 papacy_events.16.t: "Kult relikwii - zezwolić czy zabronić?"
 papacy_events.16.d: "Kościoły zawsze przechowywały relikwie świętych, aby oddawać im cześć, a niekiedy nawet użyć ich do leczenia chorych i niedołężnych. Ta długoletnia praktyka została zakwestionowana, a niektórzy uważają ją za bałwochwalstwo oraz herezję, którą należy zakazać. Sprzedaż relikwii przynosiła bogactwo wielu kościołom i gdyby tylko Papież publicznie ogłosił swoje poparcie dla tej praktyki, część pieniędzy trafiłaby do naszych skarbców."
 papacy_events.16.a: "Zapobiegaj sprzedaży relikwii!"
 papacy_events.16.b: "Będziemy bogatsi, jeśli tylko się na to zgodzimy i zaczniemy praktykować."
 papacy_events.17.t: "Galileusz"
 papacy_events.17.d: "Myśl, że Ziemia i planety krążą wokół Słońca, jest ideą, o której Mikołaj Kopernik po raz pierwszy napisał w swojej książce 'De revolutionibus orbium coelestium' w 1543 roku. Teraz Galileusz promował tę myśl w swojej książce 'Sidereus Nuncius' - 'Gwiezdny Posłaniec'. Propagowanie kontrowersyjnych poglądów przysporzyło mu wielu wrogów w Kościele katolickim i chociaż bylibyśmy najciekawszym przeciwnikiem debaty, może powinniśmy być ostrożni i po prostu uwięzić go, aby głoszone przez niego idee nie dotarły do opinii publicznej."
 papacy_events.17.a: "Zaproś go do omówienia teologii."
 papacy_events.17.b: "Musi stanąć przed sądem."
 papacy_events.18.t: "Sublimis Deus"
 papacy_events.18.d: "Ku naszemu przerażeniu dowiedzieliśmy się, że kraje katolickie zniewoliły Indian Zachodu i Południa, aby wykorzystać ich jako tanią siłę roboczą. Wcześniejsi papieże na to pozwolili, argumentując, że ci nowi ludzie nie są naprawdę ludźmi i nie mają dusz. Nowy Testament mówi, że ewangelia została ogłoszona wszystkim narodom, a ponieważ oni nie wierzą w naszego Boga, być może nie nie mają znaczenia. Ludzkość jest podzielona na trzy rasy: Europejczyków, Azjatów i Afrykanów, po jednej na każdego z synów Noego, a Indianie z obu Ameryk nie pasują do tych podziałów. Teraz, gdy wiemy, że ci poganie mogą się nawrócić, nadszedł czas, aby zrewidować nasze stare wierzenia i uznać ich za ludzi z duszami, dla których Bóg ma swój cel."
 papacy_events.18.a: "Potępiaj to i upewnij się, że każdy katolik wie, iż jest to złe."
 papacy_events.18.b: "Ich celem jest niewolnictwo."
 papacy_events.19.t: "Papież potępia niewolnictwo"
 papacy_events.19.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] wydał nową bullę papieską Sublimis Deus, która zakazuje zniewolenia Indian z Zachodu i Południa oraz wszystkich innych ludzi."
 papacy_events.19.a: "Przyjmij bullę papieską."
 papacy_events.19.b: "Odrzuć i kontynuuj zniewolenie tych ludzi."
 papacy_events.20.t: "[From.GetName] Podąża za dekretem papieża"
 papacy_events.20.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] potępi niewolnictwo."
 papacy_events.20.a: "Wspaniale!"
 papacy_events.21.t: "[From.GetName] lekceważy dekret papieża"
 papacy_events.21.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] odmawia potępienia niewolnictwa Indian mieszkających na Zachodzie i Południu."
 papacy_events.21.a: "Odmawia? Jak to możliwe!?"
 papacy_events.22.t: "Procesy o czary"
 papacy_events.22.d: "Mieszkańcy prowincji cierpiący z powodu głodu, chorób i niefortunnych wydarzeń, twierdzą, że za ich nieszczęściem stoją gusła i czary. Kobiety, dzieci i mężczyźni byli oskarżani o bycie czarownikami lub czarownicami, czczenie diabła oraz stanowienie zagrożenia dla chrześcijaństwa. To zaszło tak daleko, że ludzie zlinczowali osoby posądzone o czary. Nie było mowy o uczciwym procesie!"
 papacy_events.22.a: "Nie ma czarów i czarowników!"
 papacy_events.22.b: "Nie będziemy się wtrącać, nie teraz."
 papacy_events.22.c: "Wyślij posłańca do papieża z prośbą o radę."
 papacy_events.22.e: "Nic z tym nie rób."
 papacy_events.23.t: "Papież potępia procesy o czary"
 papacy_events.23.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] wysłał posłańca, aby omówić niedawne polowania na czarownice w naszym kraju. Zdecydowanie potępia procesy o czary, zwłaszcza samosądy, do których dochodziło, gdy zdesperowani ludzie sami wymierzali karę domniemanym czarownicom. „Nie ma żadnych czarownic ani czarów, są jedynie przesądy i próby zrzucenia winy za cierpienie na niewinne kobiety, dzieci i mężczyzn”. Możemy nie podzielać tego poglądu, ale [From.Monarch.GetName] jest [From.Monarch.GetTitle]..."
 papacy_events.23.a: "Zakończcie polowania na czarownice i procesy!"
 papacy_events.23.b: "To czarownice są winne naszemu cierpieniu. Nie możemy tego przerwać!"
 papacy_events.24.t: "$FROMCOUNTRY$ kończy procesy o czary"
 papacy_events.24.tooltip: "Nigdy więcej procesów o czary!"
 papacy_events.24.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] zakończył polowania na czarownice w państwie $FROMCOUNTRY$ i ogłosił, że czary oraz czarnoksięstwo są jedynie niedorzecznymi przesądami."
 papacy_events.24.a: "To wspaniale!"
 papacy_events.24.b: "Co? Jak [From.Monarch.GetSheHe] śmie występować przeciwko majestatowi [Root.Monarch.GetRulerGen]?"
 papacy_events.25.t: "$FROMCOUNTRY$ zezwala na procesy o czary."
 papacy_events.25.tooltip: "Stosy, stosy dla wszystkich!"
 papacy_events.25.d: "Cierpienia poddanych [From.Monarch.GetTitle] [From.Monarch.GetName] zatwardziły serce [From.Monarch.GetHerHis], dlatego procesy o czary będą kontynuowane w państwie $FROMCOUNTRY$."
 papacy_events.25.a: "Nie takie były polecenia!"
 papacy_events.25.b: "Wspaniale!"
 papacy_events.26.t: "Procesy o czary w $FROMCOUNTRY$"
 papacy_events.26.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] prosi [Root.Monarch.GetTitle] o radę w sprawie niedawnych polowań na czarownice i procesów o czary. Mieszkańcy państwa $FROMCOUNTRY$ obwiniają czary i czarnoksięstwo za klęski głodu, choroby oraz inne nieszczęścia. Cierpienia doprowadziły do oskarżania kobiet, dzieci i mężczyzn o oddawanie czci Diabłu i zagrażanie chrześcijaństwu. Czy należy zakazać tych polowań i procesów, czy też pozwolić ludziom ścigać, oskarżać i karać osoby, które mogą być niewinne i nie mieć nic wspólnego z czarami?"
 papacy_events.26.a: "Potęp polowania na czarownice i procesy o czary!"
 papacy_events.26.b: "Powinniśmy pozwolić ludziom kontynuować tę praktykę."
 papacy_events.27.t: "[From.Monarch.GetTitle] potępia procesy o czary"
 papacy_events.27.d: "Po zwróceniu się do [From.Monarch.GetTitle] [From.Monarch.GetName] o radę w sprawie czarów i tego, czy powinniśmy kontynuować polowania oraz procesy, długo czekaliśmy na odpowiedź. W końcu nadeszła, opatrzona podpisem [From.Monarch.GetTitle] na końcu oficjalnego dokumentu: „Natychmiast zaprzestańcie polowań na czarownice i procesów o czary!”"
 papacy_events.27.a: "Usłuchamy."
 papacy_events.27.b: "Odmawiamy."
 papacy_events.28.t: "[From.Monarch.GetTitle]: zezwala na procesy o czary"
 papacy_events.28.d: "Wiadomość od [From.Monarch.GetTitle] była całkowicie jasna: należy ścigać osoby parające się czarami i czarnoksięstwem, sądzić oskarżonych, a winnych karać za grzeszne czyny. Wszyscy, którzy oddają cześć Diabłu, uczestniczą w sabatach czarownic i zagrażają chrześcijaństwu, spłoną w piekle!"
 papacy_events.28.a: "Rozumiemy i zgadzamy się."
 papacy_events.28.b: "Odmawiamy!"
 papacy_events.29.t: "Papież rywala"
 papacy_events.29.d: "Poprzedni kontroler papiestwa jest rywalem naszego obecnego kontrolera. Istnieje wiele decyzji, bulli papieskich i dekretów wydanych przez poprzedniego [Root.Monarch.GetTitle], które można unieważnić. Splamiłoby to reputację byłego [Root.Monarch.GetTitle] i przedstawiło go jako niekompetentnego, co spotkałoby się z wdzięcznością i aprobatą obecnego kontrolera papiestwa."
 papacy_events.29.a: "W takim razie wymażemy jego dokonania."
 papacy_events.29.b: "Każdy papież powinien być szanowany, nawet ten zły."
 papacy_events.30.t: "Rywalizacja pomiędzy papieżami"
 papacy_events.30.d: "Poprzedni [From.Monarch.GetTitle] znajdował się pod kontrolą jednego z naszych rywali. Gdyby [From.Monarch.GetTitle] [From.Monarch.GetName] wymazał jego dokonania, uchylając decyzje, anulując bulle papieskie i odwołując wydane przez niego dekrety, splamiłoby to reputację zarówno poprzedniego [From.Monarch.GetTitle], jak i naszego rywala!"
 papacy_events.30.a: "[From.Monarch.GetTitle] [From.Monarch.GetName] unieważnił decyzje poprzedniego papieża!"
 papacy_events.30.b: "Nic nie zrobił!?"
 papacy_events.31.t: "Rywalizacja papieska"
 papacy_events.31.d: "Obecny kontroler papiestwa wywiera presję na [From.Monarch.GetTitle] [From.Monarch.GetName], by ten unieważnił decyzje, bulle papieskie i dekrety poprzedniego [From.Monarch.GetTitle], za którego pontyfikatu to my kontrolowaliśmy papiestwo. Splamiłoby to reputację naszą i naszego [From.Monarch.GetTitle], przedstawiając nas obu jako niekompetentnych!"
 papacy_events.31.a: "Ten drań... [From.Monarch.GetName] naprawdę to zrobił!"
 papacy_events.31.b: "[From.Monarch.GetTitle] [From.Monarch.GetName] odmawia!"
 opinion_swiss_guard: "Wysłano Gwardię Szwajcarską"
 opinion_no_swiss_guard: "Nie dla Gwardii Szwajcarskiej"
 pap_swiss_guard: "Gwardia Szwajcarska"
 desc_pap_swiss_guard: "Zdyscyplinowani i lojalni żołnierze stosujący rewolucyjne taktyki bitewne - Gwardia Szwajcarska to najsilniejsze wojsko najemne na świecie."
 opinion_popes_pet: "Pupil papieża"
 mil_vatican_library: "Biblioteka Watykańska — wydanie wojskowe"
 desc_mil_vatican_library: "Skupiając się na dziełach wojskowych i wspierając badania nad sztuką wojenną, niedawno założona Biblioteka Watykańska stanie się najważniejszym na świecie zbiorem ksiąg poświęconych wojnie, żołnierzom, armii i praktykom wojskowym."
 dip_vatican_library: "Biblioteka Watykańska — wydanie dyplomatyczne"
 desc_dip_vatican_library: "Dyplomaci są zachęcani do spisywania relacji ze swoich podróży, negocjacji i codziennej pracy, które następnie zostaną opublikowane i włączone do zbiorów Biblioteki Watykańskiej. Dzięki tym dziełom uczeni mogą analizować i badać różne praktyki dyplomatyczne, ustalając, kiedy, jak i dlaczego sprawdzają się najlepiej."
 adm_vatican_library: "Biblioteka Watykańska — wydanie administracyjne"
 desc_adm_vatican_library: "Podstawą nowej Biblioteki Watykańskiej jest wielki zbiór ksiąg, rękopisów i dokumentów wszelkiego rodzaju, poświęconych głównie zagadnieniom administracyjnym."
 pap_sistine_chapel: "Kaplica Sykstyńska"
 desc_pap_sistine_chapel: "W miejscu, gdzie niegdyś stała stara, opuszczona i popadająca w ruinę Cappella Maggiore, wznosi się teraz wspaniała nowa Kaplica Sykstyńska."
 pap_sistinechapel_botticelli: "Kaplica Sykstyńska ozdobiona przez Botticellego"
 desc_pap_sistinechapel_botticelli: "Ściany Kaplicy Sykstyńskiej zdobią teraz freski Sandra Botticellego. Jego dzieła to „Kuszenie Chrystusa”, „Ukaranie buntowników” i „Próba Mojżesza”."
 pap_sistinechapel_ghirlandaio: "Kaplica Sykstyńska ozdobiona przez Ghirlandaia"
 desc_pap_sistinechapel_ghirlandaio: "Wielki artysta Domenico Ghirlandaio należał do zespołu florenckich i umbryjskich malarzy, którzy stworzyli na ścianach Kaplicy Sykstyńskiej cykl fresków przedstawiających życie Mojżesza i Jezusa. Namalował „Powołanie Apostołów” oraz „Zmartwychwstanie Chrystusa”."
 pap_sistinechapel_perugino: "Kaplica Sykstyńska ozdobiona przez Perugina"
 desc_pap_sistinechapel_perugino: "Umbryjski malarz Pietro Perugino ozdobił ścianę ołtarzową Kaplicy Sykstyńskiej freskami „Wniebowzięcie”, „Narodzenie” i „Mojżesz w sitowiu”. Na ścianach namalował również „Mojżesza i Seforę”, „Chrzest Chrystusa” oraz „Przekazanie kluczy”."
 pap_sistinechapel_michelangelo: "Kaplica Sykstyńska ozdobiona przez Michała Anioła"
 desc_pap_sistinechapel_michelangelo: "Michał Anioł ponownie ozdobił sufit Kaplicy Sykstyńskiej, który wcześniej przedstawiał złote gwiazdy na błękitnym niebie. Teraz widnieją na nim sceny z Księgi Rodzaju: stworzenie świata, upadek człowieka, obietnica zbawienia przekazana przez proroków oraz genealogia Chrystusa."
 pap_sistinechapel_decorated: "Ozdobiona Kaplica Sykstyńska"
 desc_pap_sistinechapel_decorated: "Zespół umbryjskich i florenckich malarzy pomalował ściany Kaplicy Sykstyńskiej serią fresków ukazujących życie Mojżesza i Jezusa."
 pap_indulgences: "Sprzedawanie odpustów"
 desc_pap_indulgences: "Sprzedawanie odpustów przynosi zyski dla naszego skarbca i pozwala bogatym uratować swoje dusze i pomimo grzechu dalej żyć normalnie."
 pap_simony: "Symonia"
 desc_pap_simony: "Złoto pozyskane ze sprzedaży stanowisk i godności kościelnych wpływa do naszego skarbca."
 pap_veneration_relics: "Adoracja relikwii"
 desc_pap_veneration_relics: "Relikwie świętych, czyli ich szczątki, takie jak kości lub przedmioty osobiste, są sprzedawane przez kościoły, stopniowo przynosząc im coraz większe bogactwo."
 disables_indulgences: "Wydarzenie 'Sprzedawanie odpustów' dla katolickich państw zostanie wyłączone."
 disables_simony: "Wydarzenie 'Symonia' dla katolickich państw zostanie wyłączone."
 disables_veneration_of_relics: "Wydarzenie 'Adoracja relikwii' dla katolickich państw zostanie wyłączone."
 opinion_condemn_slavery: "Potępiono niewolnictwo"
 opinion_allows_slavery: "Zezwolono na niewolnictwo"
 pap_condemn_slavery: "Potępiono niewolnictwo"
 desc_pap_condemn_slavery: "Papież zadekretował, że odrażająca praktyka niewolnictwa powinna zostać zakazana, a handel niewolnikami zdelegalizowany."
 opinion_condemn_witchtrials_good: "Potępiono procesy o czary"
 opinion_condemn_witchtrials_bad: "Potępiono procesy o czary"
 opinion_allows_witchtrials_good: "Zezwolono na procesy o czary"
 opinion_allows_witchtrials_bad: "Zezwolono na procesy o czary"
 RAZE_POWER_GAIN: "Zysk z dewastacji"
 MODIFIER_LOOT_AMOUNT: "Szybkość plądrowania"
 opinion_erased_rival_pope: "Unieważnił decyzje papieża-rywala"
 opinion_erased_pope: "Anulowano decyzje naszego papieża"
 opinion_not_erased_rival_pope: "Nie anulowano decyzji papieża-rywala"
 opinion_not_erased_pope: "Nie unieważnił decyzji naszego poprzedniego papieża"
 opinion_cardinal_nephew: "Kardynał-nepot"
 devotion_events.1.t: "Szpital powszechny"
 devotion_events.1.d: "Pojawiła się propozycja utworzenia szpitala powszechnego, miejsca, w którym potrzebujący mogliby znaleźć schronienie i pomoc. Zdrowie publiczne ma ogromne znaczenie, a zapewnienie bezpłatnych kursów położnictwa oraz utworzenie placówek zwalczających choroby poprawiłoby dobrobyt wszystkich mieszkańców."
 devotion_events.1.a: "Jeśli ma to poprawić zdrowie publiczne, na co jeszcze czekamy? Do dzieła!"
 devotion_events.1.b: "Modlitwa rozwiąże wszystkie ich problemy, nie marnujmy na to pieniędzy!"
 devotion_events.2.t: "Utrzymanie fortu"
 devotion_events.2.d: "Nasze forty stanowią najważniejszą obronę przed intruzami i wrogami, ale bardzo potrzebują renowacji. Aby to sfinansować, musielibyśmy podnieść podatki, a to z pewnością zdenerwuje tych, którzy je płacą."
 devotion_events.2.a: "Potrzebujemy tego, ignorować motłoch!"
 devotion_events.2.b: "Zróbmy tyle, na ile pozwalają nam obecne środki."
 devotion_events.3.t: "Modernizacja fortów"
 devotion_events.3.d: "Nasze forty nie wyglądają już tak, jakby miały rozpaść się na naszych oczach. Są teraz wystarczająco solidne, by wytrzymać większość ataków na ich mury. Ich obrona, choć sprawna i imponująca mimo upływu lat, nadal ustępuje fortyfikacjom innych państw. Aby sfinansować niezbędną modernizację i ulepszenia naszych fortów, musielibyśmy sięgnąć głęboko do kieszeni podatników."
 devotion_events.3.a: "To dla większego dobra... kto chciałby paść ofiarą najazdu?"
 devotion_events.3.b: "W obecnym stanie są wystarczająco dobre."
 devotion_events.4.t: "Zbyt wysokie podatki"
 devotion_events.4.d: "Z wysokich murów i zza grubych wież naszych odnowionych fortów trudno słuchać gniewnych protestów obywateli przeciwko podwyższonym podatkom. Mimo to słyszymy ich groźby buntu i rebelii, jeśli nie obniżymy danin."
 devotion_events.4.a: "Słyszymy was i niechętnie przystajemy na żądania."
 devotion_events.4.b: "Co mówicie? NIC NIE SŁYSZYMY!"
 devotion_events.5.t: "Ozdabianie fortów"
 devotion_events.5.d: "Do jednego z naszych fortów podarowano witraż, a efekt jest zachwycający. Tak bardzo, że rozważamy ozdobienie każdego należącego do nas fortu witrażem z naszym herbem."
 devotion_events.5.a: "Próżność jest grzechem, nawet jeśli chodzi o fort!"
 devotion_events.5.b: "Po prostu podnieśmy podatki, by za to zapłacić."
 devotion_events.6.t: "Dążenie do wolności religijnej"
 devotion_events.6.d: "Mężczyzna znany z radykalnych poglądów na reformę religijną potępia w swoich kazaniach kapłanów i doktryny wiary [Root.Religion.GetName]. Doprowadziło to do licznych skarg oraz żądań wolności religijnej ze strony naszych niezbyt lojalnych poddanych."
 devotion_events.6.a: "Nasz kraj wyznaje [Root.Religion.GetName] i zawsze będzie wyznawać [Root.Religion.GetName]!"
 devotion_events.6.b: "Przyznajmy miastu pełną wolność religijną."
 devotion_events.7.t: "Fałszywe wierzenia"
 devotion_events.7.d: "Jednym z celów państwa [Root.GovernmentName] jest szerzenie wiary [Root.Religion.GetName] i ochrona jej przed herezją. To szlachetna sprawa, lecz gdy herezja pojawia się w samym sercu naszego kraju, przynosi nam hańbę. Jedna z naszych prowincji nie wyznaje wiary [Root.Religion.GetName]. Ponieważ naszym zadaniem jest szerzenie prawdziwej wiary, musimy się tym zająć, inaczej okryjemy się wieczną hańbą."
 devotion_events.7.a: "Wyślijmy misjonarzy i zintensyfikujmy wysiłki nawracania heretyków."
 devotion_events.7.b: "W takim razie pozostaniemy w hańbie."
 devotion_events.8.t: "Fałszowanie dokumentów"
 devotion_events.8.d: "Fałszowanie dokumentów, sporządzanie podróbek lub antydatowanie ich w celu potwierdzenia własnych roszczeń było powszechną metodą obrony przed aneksją i uzurpacją w okresach walki o rozszerzenie terytorium lub przywilejów. Także dziś stosuje się te wątpliwe praktyki, a nawet my zastanawiamy się, czy nie mogłyby przynieść nam korzyści. Miejmy nadzieję, że nikt nie dostrzeże niezgodności..."
 devotion_events.8.a: "Sfałszujmy te dokumenty."
 devotion_events.8.b: "Nie chcę widzieć tego plugastwa w naszych archiwach!"
 devotion_events.8.ct: "Fałszerstwo może zostać odkryte..."
 devotion_events.9.t: "Sfałszowane dokumenty"
 devotion_events.9.d: "Mimo naszych najlepszych starań, by ukryć fałszerstwo, podróbki i antydatowane dokumenty, prawda wyszła na jaw. Chcieliśmy jedynie chronić państwo [Root.Country.GetName] przed tymi, którzy dążyliby do aneksji i uzurpacji naszych prowincji."
 devotion_events.9.a: "Przekupcie, szantażujcie i pobijcie każdego, kto zdradził tę tajemnicę!"
 devotion_events.10.t: "Miejscowy szlachcic"
 devotion_events.10.d: "[Root.Heir.GetName] szybko zdobył zaufanie i przychylność mieszkańców państwa [Root.Country.GetName], zwłaszcza miejscowych arystokratów, do których należał [Root.Heir.GetSheHe] przed objęciem pozycji następcy [Root.Monarch.GetTitle]. Pomogło nam to odzyskać autorytet, a nasza władza jest teraz silniejsza niż kiedykolwiek."
 devotion_events.10.a: "Jakież szczęście, że wybraliśmy właśnie [Root.Heir.GetHerHim]!"
 devotion_events.11.t: "Zagraniczny szlachcic"
 devotion_events.11.d: "Następca [Root.Monarch.GetTitle], [Root.Heir.GetName], oprócz wielkiego talentu dyplomatycznego, zdolności wojskowych i administracyjnych, wniósł również sojusze oraz kontakty z zagranicznymi dworami, które mogą okazać się nieocenione."
 devotion_events.11.a: "Mieliśmy wątpliwości co do [Root.Heir.GetHerHim], ale dawno już minęły."
 devotion_events.12.t: "Kupiecki syn"
 devotion_events.12.d: "Bystrość umysłu w negocjacjach i talent do targowania się, odziedziczone zapewne po kupieckich rodzicach [Root.Heir.GetHerHis], sprawiły, że mieszczanie, wolni chłopi i szlachta państwa [Root.Country.GetName] szanują i obawiają się [Root.Heir.GetName]. Nikt nie będzie próbował oszukać [Root.Heir.GetHerHim] podczas targów ani negocjacji, gdy [Root.Heir.GetName] zostanie [Root.Monarch.GetTitle]."
 devotion_events.12.a: "Nasz następca może być zwykłym synem kupca, ale [Root.Heir.GetSheHe] udowodnił, na co go stać! [Root.Heir.GetHerselfHimself]!"
 devotion_events.13.t: "Utalentowany teolog"
 devotion_events.13.d: "Biegły w naukach dotyczących spraw boskich przyszły [Root.Monarch.GetTitle], [Root.Heir.GetName], potrafi wykorzystywać różne metody analizy i argumentacji, by rozumieć, wyjaśniać, bronić i propagować liczne zagadnienia religijne."
 devotion_events.13.a: "Od początku wiedzieliśmy, że [Root.Heir.GetSheHe] będzie mądrze rządzić państwem [Root.Country.GetName]."
 devotion_events.14.t: "Miejscowy kaznodzieja"
 devotion_events.14.d: "Ludzie radowali się, gdy miejscowy kaznodzieja [Root.Heir.GetName] został wybrany na następcę [Root.Monarch.GetTitle] [Root.Monarch.GetName] z państwa [Root.Country.GetName]. Czy cieszyli się, ponieważ widzieli w tym koniec nieustannych kazań [Root.Heir.GetHerHis], czy dlatego, że wierzyli, iż [Root.Heir.GetHerHim] uda się odmienić państwo [Root.Country.GetName]? Niezależnie od powodów lud popiera i darzy zaufaniem przyszłego [Root.Monarch.GetTitle], [Root.Heir.GetName]."
 devotion_events.14.a: "[Root.Heir.GetName] cieszył się poparciem ludu, a teraz [Root.Heir.GetSheHe] ma również nasze."
 devotion_events.15.t: "Podważanie władzy"
 devotion_events.15.d: "Zaczęło się, jak zwykle, od plotek, pogłosek i ukradkowych spojrzeń pełnych pogardy oraz złośliwości. Jeśli podważanie rządów [Root.Monarch.GetTitle] [Root.Monarch.GetName] posunie się za daleko, a ludzie uznają, że [Root.Monarch.GetSheHe] nie został prawidłowo wybrany na władcę państwa [Root.Country.GetName], przestaną tylko mówić i mogą spróbować obalić [Root.Monarch.GetHerHim]!"
 devotion_events.15.a: "Jak to się stało?"
 devotion_events.16.t: "Zakaz pielgrzymek i zabobonnych praktyk"
 devotion_events.16.d: "Surowa, dyktatorska postawa [Root.Monarch.GetTitle] [Root.Monarch.GetName] wzburzyła chłopów i mieszczan państwa [Root.Country.GetName], którzy domagają się zniesienia zakazu pielgrzymek i zabobonnych praktyk. Gniew tych prostaczków z powodu zakazów, które z czasem przyniosą korzyść wszystkim, nie jest czymś, co można lekceważyć."
 devotion_events.16.a: "Cofamy zakaz. Idźcie na pielgrzymkę, dokąd tylko chcecie!"
 devotion_events.16.b: "Decyzja pozostaje w mocy. Jeszcze nam za nią podziękujecie!"
 devotion_events.17.t: "Wielki spór w państwie [Root.GetName]"
 devotion_events.17.d: "Poważny konflikt z miastem [Root.GetCapitalName] zaszedł za daleko! Mieszczanie pojmali kilku wasali [Root.Owner.Monarch.GetTitle], a mimo naszych najlepszych starań — zastosowania anatem i interdyktu — miasto nadal stawia opór! Rozpoczęto wzmacnianie miejskich fortyfikacji i mieszkańcy będą walczyć z każdym, kto spróbuje zdobyć miasto. Próbowaliśmy nakazać przywrócenie murów miejskich do ich poprzednich rozmiarów, lecz odmówiono."
 devotion_events.17.a: "Nie ustępujmy, prędzej czy później zmienią zdanie."
 devotion_events.17.b: "Dajmy im to, czego chcą..."
 devotion_events.18.t: "Szaleniec-wizjoner"
 devotion_events.18.d: "Twierdzi, że jest jasnowidzem, który ujrzał obywatelską chwałę, zniszczenie świeckiej sztuki i kultury oraz wielki potop, który oczyści [Root.Capital.GetName] z plugastwa. Szalony kaznodzieja nawołuje do odnowy wiary [Root.Religion.GetName] i rozpoczął skrajną kampanię purytańską. Z pomocą młodych mężczyzn z [Root.Capital.GetName] może wywołać zamieszki, a nawet zakwestionować prawo [Root.Monarch.GetTitle] [Root.Monarch.GetName] do sprawowania władzy!"
 devotion_events.18.a: "Dopilnujcie, by na zawsze zamilkł!"
 devotion_events.18.b: "Nie zwracajmy uwagi na jego tyrady ani na nie reagujmy."
 devotion_events.19.t: "Rada zgodna z naszymi upodobaniami"
 devotion_events.19.d: "Ku naszemu rozczarowaniu, choć nie zaskoczeniu, nieustanny konflikt między [Root.Monarch.GetTitle] a każdą instytucją w państwie [Root.Country.GetName] — kościelną, edukacyjną, prawną, medyczną, fiskalną, administracyjną i publicystyczną — nasila się z każdą kolejną proponowaną reformą. Powołując do poszczególnych instytucji ludzi o podobnych poglądach, być może zdołamy przekonać niechętną ludność do przyjęcia bardziej elastycznego stanowiska."
 devotion_events.19.a: "Zaczniemy od naszych własnych doradców."
 devotion_events.19.b: "Mocniej przypomnijmy ludziom, kto jest [Root.Monarch.GetTitle] państwa [Root.Country.GetName]!"
 devotion_events.20.t: "Konflikt społeczny i polityczny w państwie [Root.GetName]"
 devotion_events.20.d: "Miejscowa arystokracja, gildie i niższe warstwy społeczne uwikłały się w konflikt, który doradcy państwa [Root.Owner.GetName] uznali za okazję do wzmocnienia wpływów [Root.Owner.Monarch.GetTitle] w mieście [Root.GetCapitalName]. Zachęty ze strony doradców [Root.Owner.Monarch.GetName] skłoniły gildie do buntu przeciwko arystokracji. Otworzyły one bramy miasta, umożliwiając armii [Root.Owner.Monarch.GetTitle] [Root.Owner.Monarch.GetName] zajęcie miasta. To doskonała okazja, by podporządkować je [Root.Owner.Monarch.GetTitle] i ograniczyć jego prawa!"
 devotion_events.20.a: "Wmaszerujmy do miasta i przejmijmy nad nim kontrolę!"
 devotion_events.20.b: "Nie ma potrzeby okupacji. Miasto już należy do nas."
 devotion_events.21.t: "Świeccy wśród nas"
 devotion_events.21.d: "Każdy incydent obniżający nasze oddanie sprawom państwa [Root.Country.GetName] sprawia, że coraz więcej problemów puka do naszych drzwi. Niektórzy uważają, że kwestie religijne należy wyłączyć ze spraw cywilnych, a ich liczba stale rośnie. Domagają się zmian i chcą, byśmy zsekularyzowali nasz rząd."
 devotion_events.21.a: "Niech tak będzie."
 devotion_events.21.b: "Na razie nie podejmiemy tak radykalnego kroku."
 devotion_events.22.t: "Rządy rozpusty"
 devotion_events.22.d: "Rozczarowani tym, co postrzegają jako korupcję i zepsucie, współwyznawcy przestali przekazywać nam datki i odmawiają ochotniczej służby w naszych armiach, które mają stanowić bastion wiary [Root.Religion.GetName]."
 devotion_events.22.a: "To katastrofa, prawdziwa katastrofa!"
 devotion_events.23.t: "Skorumpowany [Root.Monarch.GetTitle]"
 devotion_events.23.d: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] stał się skorumpowany i skupia się na [Root.Monarch.GetHerHis] własnych celach zamiast na dobru wiary. Nasi poddani stracili do [Root.Monarch.GetHerHim] zaufanie."
 devotion_events.23.a: "Zignorujmy niegodziwość [Root.Monarch.GetTitle]."
 devotion_events.23.b: "Spróbujmy coś zmienić."
 devotion_events.24.t: "Ochotnicy do świętej walki"
 devotion_events.24.d: "Zainspirowani naszą świętą sprawą ochotnicy ze świata wyznawców wiary [Root.Religion.GetName] przybyli, by pomóc nam walczyć z niewiernymi i szerzyć prawdziwą wiarę!"
 devotion_events.24.a: "Wspaniale! Cóż za znakomita inicjatywa."
 devotion_events.25.t: "Nowy władca"
 devotion_events.25.d: "Życie [Root.Monarch.GetTitle] nie wygląda tak, jak sobie wyobrażałeś. Władza, którą sprawujesz, jest mniejsza niż ta przysługująca królowi, księciu, kalifowi, a nawet emirowi. Ciągła presja, by przestrzegać surowych zasad i praw wiary [Root.Religion.GetName] oraz ich egzekwować, doprowadziła cię do wyczerpania. Czy nadszedł czas, jak sugerują niektórzy doradcy, by zsekularyzować państwo [Root.Country.GetName] i przyjąć inny tytuł władcy?"
 devotion_events.25.a: "Tak, niech zamiast tego moje czoło przygniecie ciężar korony."
 devotion_events.25.b: "Nie, zachowam tytuł [Root.Monarch.GetTitle]."
 devotion_events.26.t: "Wpływowy reformator"
 devotion_events.26.d: "Bezkompromisowy [Root.Heir.GetWomanMan], doskonale obeznany ze sztuką retoryki, przyszły władca [Root.Heir.GetName], już teraz wykorzystuje [Root.Heir.GetHerHis] zdolności w szczytnym celu, głosząc [Root.Heir.GetHerHis] poglądy każdemu, kto zechce słuchać. Przedstawiciele wyższych sfer chętnie próbują dowieść [Root.Heir.GetHerHim] swojej błyskotliwości, podczas gdy innych fascynuje po prostu przystojny [Root.Heir.GetWomanMan]. Niezależnie od powodów, w [Root.Heir.GetName] jest coś wyjątkowego — nawet osoby zwykle zupełnie niezainteresowane polityką włączają się w dyskusję."
 devotion_events.26.a: "[Root.Heir.GetSheHeCap] może być właśnie tym, czego potrzebuje państwo [Root.Country.GetName]."
 devotion_events.100.t: "[Root.GovernmentName] rywalizuje z miastem"
 devotion_events.100.d: "[Root.GovernmentName] rywalizuje z jednym z naszych miast, co przez wiele lat niszczyło stosunki między nami. Mieszkańcy miasta nie chcą, aby [Root.Monarch.GetTitle] [Root.Monarch.GetName] sprawował[Root.Monarch.GetANoun] nad nim władzę oraz by w czasach niepokojów i wojny mógł[Root.Monarch.GetANoun] się w nim chronić."
 devotion_events.100.a: "Wcześniej czy później opamiętają się."
 devotion_events.100.b: "Wzmocnij naszą władzę!"
 devotion_events.101.t: "Latarnia Światła"
 devotion_events.101.d: "Ohydna heretycka księga „Latarnia Światła” głosi, że główną przyczyną prześladowań pierwszych chrześcijan było bezprawne zatrzymywanie przez kapłanów cennych dóbr. Porównuje również siedziby arcybiskupów i biskupów do siedzib Antychrysta. Księgę znaleziono u zatwardziałego heretyka, który mimo wielu lat spędzonych w więzieniu i licznych pełnych łez wyrzeczeń nadal najwyraźniej nie zamierza zmienić swojego postępowania."
 devotion_events.101.a: "Ponownie skazać heretyka na więzienie."
 devotion_events.101.b: "Spal heretyka."
 devotion_events.102.t: "Nieuczciwe podatki"
 devotion_events.102.d: "Jednemu z naszych miast przyznano przywilej wyboru własnej rady i burmistrza, co oczywiście doprowadziło do nieustannej walki między nimi a [Root.Monarch.GetTitle]. Spór o władzę w mieście wywołał również niepokoje, ponieważ burmistrzowie i rajcy nakładają niesprawiedliwe podatki. Musimy szybko umocnić nasz autorytet i odzyskać kontrolę nad miastem, nie wzbudzając przy tym podejrzeń winowajców co do naszych zamiarów."
 devotion_events.102.a: "Zaprosić ich na uroczystą kolację i tam aresztować!"
 devotion_events.102.b: "Zakłóciłoby to stabilność naszego państwa. Lepiej tego uniknąć."
 devotion_events.103.t: "Uroczysta kolacja"
 devotion_events.103.d: "Uczta jest wystawna, tak jak powinna być. Jedzenia i napojów nie brakuje, a nikt nie wyjdzie stąd z pustym żołądkiem — za to z pewnością z kacem. Burmistrz i rajcy piją na umór i nie będą w stanie oprzeć się stanowczym, trzeźwym strażnikom. W trakcie kolejnych dań uroczystej kolacji niechęć między [Root.Monarch.GetTitle] [Root.Monarch.GetName] a radą miejską zdaje się zniknąć. Czy powinniśmy zrealizować plan aresztowania burmistrza i rajców?"
 devotion_events.103.a: "Aresztować ich i zmusić do zrzeczenia się przywilejów."
 devotion_events.103.b: "Najwyraźniej udało nam się poprawić stosunki. Nie ma potrzeby podejmować pochopnych działań."
 devotion_events.104.t: "Ognisko próżności"
 devotion_events.104.d: "W [Root.Capital.GetCapitalName] działa gorliwy kaznodzieja, którego kazania pod gołym niebem, poświęcone pokusom próżności, skłoniły zwolenników do zbierania i palenia kosmetyków, dzieł sztuki, książek uznanych za niemoralne oraz instrumentów muzycznych. Grzmi, że przedmioty te mogą prowadzić do grzechu, i namawia ludzi, zwłaszcza słynnych artystów państwa [Root.Country.GetName], by przynosili na jego stosy rzeczy, które uznaje za niemoralne."
 devotion_events.104.a: "Powstrzymać tego człowieka!"
 devotion_events.104.b: "Pozwólmy mu działać, ale uratujmy dzieła sztuki."
 devotion_events.105.t: "Igła Biskupia"
 devotion_events.105.d: "Ufortyfikowane miasto [Root.Province.GetName] pozwala [Root.Owner.Monarch.GetTitle] państwa [Root.Country.GetName] wchodzić wyłącznie przez bardzo wąską bramę zwaną Acus Episcopi, czyli Igłą Biskupią. Jej szerokość uniemożliwia wejście w asyście rycerzy, a straż miejska odmawia wpuszczenia żołnierzy [Root.Owner.Monarch.GetTitle] [Root.Owner.Monarch.GetName] przez zwykłe bramy miejskie."
 devotion_events.105.a: "Wyważyć bramy miasta! Nikt nie powstrzyma nas przed wejściem do własnego miasta."
 devotion_events.105.b: "Niechętnie zaakceptować miejskie zasady."
 devotion_events.106.t: "Podzielona władza"
 devotion_events.107.t: "Jubileusz w [Root.Capital.GetName]"
 devotion_events.107.d: "Jubileusz, czyli rok święty, wiąże się z pielgrzymką do świętego miejsca, takiego jak Rzym lub nasza własna stolica. To szczególny rok odpuszczenia grzechów i powszechnych odpustów, który papież zwykle ogłasza co 25 lub 50 lat. Kto jednak powiedział, że nie możemy zorganizować własnego jubileuszu w [Root.Capital.GetName]?"
 devotion_events.107.a: "Cudowny pomysł — wyrażamy zgodę!"
 devotion_events.107.b: "Nie w tym roku. Może w przyszłym?"
 devotion_events.108.t: "Jubileusz w [From.Capital.GetName]"
 devotion_events.108.d: "[From.Monarch.GetTitle] państwa [From.Country.GetName] ogłosił jubileusz w [From.Capital.GetName], rok święty odpuszczenia grzechów i powszechnych odpustów. Jest to chrześcijańska tradycja sięgająca 1300 roku, kiedy papież Bonifacy VIII ogłosił rok święty w Rzymie."
 devotion_events.108.a: "To przywilej, który powinien należeć do nas. Nie każdy chrześcijański władca powinien mieć do niego prawo!"
 devotion_events.108.b: "To wspaniały pomysł!"
 devotion_events.109.t: "[From.Monarch.GetTitle] reaguje na jubileusz w [Root.Capital.GetName]"
 devotion_events.109.d: "Tradycja jubileuszy rozpoczęła się w 1300 roku, gdy papież Bonifacy VIII ogłosił rok święty w Rzymie. [From.Monarch.GetTitle] [From.Monarch.GetName] wysłał do nas posłańca, gdy wiadomość o jubileuszu w [Root.Capital.GetName] dotarła do [From.Monarch.GetHerHim]. Obawiamy się reakcji [Root.Monarch.GetHerHis]..."
 devotion_events.109.a: "...i wcale mu się to nie podoba."
 devotion_events.109.b: "...ale nie musimy się martwić. Wyraża aprobatę!"
 devotion_events.110.t: "Podopieczny papieża"
 devotion_events.110.d: "Opieka [PAP.Monarch.GetTitle] [PAP.Monarch.GetName] ukształtowała osobowość [Root.Heir.GetName]. Mądrość [PAP.Monarch.GetTitle] prowadziła [Root.Heir.GetName] i zapewniła [Root.Heir.GetHerHim] szacunek oraz oddanie mieszkańców państwa [Root.Country.GetName]."
 devotion_events.110.a: "[PAP.Monarch.GetTitle] uwierzył w [Root.Heir.GetHerHim], a teraz my również."
 devotion_events.117.t: "Konfiskata kościoła reformowanego"
 devotion_events.117.d: "Pewien opat skonfiskował kościół reformowany! Jego działanie nie zostało zatwierdzone przez [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Gdybyśmy wiedzieli o jego zamiarach, przekonalibyśmy opata, by wybrał inny budynek na swoją kaplicę. Wydarzenie to oczywiście wzburzyło mieszkańców dotkniętej prowincji. Chociaż zmusiliśmy opata do zwrotu kościoła, rozwścieczeni chłopi i mieszczanie nie zapomną tej zniewagi."
 devotion_events.117.a: "Czego jeszcze chcą?"
 devotion_events.118.t: "Hallesches Heilthum"
 devotion_events.118.d: "Zmarły [Root.Monarch.GetTitle] obawiał się o [Root.Monarch.GetHerHis] spokój w niebie i zgromadził wiele relikwii, by mieć pewność, że [Root.Monarch.GetSheHe] spędzi w czyśćcu jak najmniej czasu. Niedawno odnaleziono 8100 relikwii i 42 święte szkielety ukryte w różnych zakamarkach dawnej rezydencji byłego [Root.Monarch.GetTitle]."
 devotion_events.118.a: "To sprzedaż odpustów doprowadziła do powstania wiary [Root.Religion.GetName]! Ukryjmy je."
 devotion_events.118.b: "Zróbmy dla nich miejsce. Ciekawe, czy [Root.Monarch.GetTitle] trafił do nieba..."
 devotion_events.119.t: "Pogłoska o głowie klaczy"
 devotion_events.119.d: "Szepty i ukradkowe spojrzenia towarzyszące [Root.Monarch.GetTitle] [Root.Monarch.GetName], gdy [Root.Monarch.GetSheHe] przemierza ulice [Root.Capital.GetName], są skutkiem niepokojącej plotki. Ludzie naprawdę wierzą, że [Root.Monarch.GetTitle] [Root.Monarch.GetName] nie został uroczyście konsekrowany, lecz namaszczono go z Biblią przyciśniętą do [Root.Monarch.GetHerHis] szyi, w podejrzanej tawernie!"
 devotion_events.119.a: "Zignorujmy sprawę i módlmy się, by sama ucichła."
 devotion_events.119.b: "Zaprzeczam!"
 dev_confiscated_reformed_church: "Skonfiskowano majątki Kościoła kalwińskiego"
 desc_dev_confiscated_reformed_church: "Konfiskata kościoła reformowanego przez opata poważnie wzburzyła chłopów i mieszczan, mimo że świątynia została już zwrócona."
 devotion_events.200.t: "Miejscowy imam i chatib"
 devotion_events.200.d: "[Root.Heir.GetName] prowadził modlitwy w meczecie i wygłaszał kazania podczas piątkowych modlitw zbiorowych, zanim [Root.Heir.GetSheHe] został wybrany na władcę państwa [Root.Country.GetName] po [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Miejscowa wspólnota, która wybrała [Root.Heir.GetHerHim] na imama i chatiba, z żalem przyjmie odejście [Root.Heir.GetName], ponieważ niewielu jest równie uczonych i cnotliwych jak [Root.Heir.GetHerHim] w objaśnianiu wiernym podstaw islamu. Po odejściu [Root.Heir.GetSheHe] wierni będą musieli kierować pytania religijne do kogoś mniej kompetentnego niż [Root.Heir.GetName]. To, co oni stracą, my jednak zyskamy."
 devotion_events.200.a: "Mądrze postąpiliśmy, wybierając [Root.Heir.GetName] na naszego przyszłego [Root.Monarch.GetTitle]."
 devotion_events.201.t: "Zasady przewodnie"
 devotion_events.201.d: "Niektórzy mogą twierdzić, że Al-Szura jest częścią struktury władzy, lecz nie stanowi jednego z jej filarów. Spotkania powinny odbywać się zgodnie z naukami islamu, a konsultacje — z wytycznymi Koranu i Sunny. Przywódca powinien być wybierany spośród uczestników, by przewodniczyć obradom. Dyskusje opierają się na muszawarze i mudzakarze — naradzie i dążeniu do porozumienia. Każdy może wyrazić swoją opinię, a głos większości jest przyjmowany, o ile nie narusza nauk Koranu i Sunny."
 devotion_events.201.a: "Uczyńmy ją jednym z filarów państwa."
 devotion_events.201.b: "Wydaje się to łatwym sposobem zarządzania naszym krajem."
 devotion_events.202.t: "Serce pełne miłosierdzia"
 devotion_events.202.d: "Ali, kuzyn Proroka, powiedział kiedyś: „Napełnij swe serce miłosierdziem, miłością i życzliwością wobec poddanych. Nie bądź dla nich żarłocznym drapieżnikiem, który widzi w nich łatwą zdobycz, gdyż są oni dwojakiego rodzaju: albo są twoimi braćmi w wierze, albo równymi ci istotami stworzonymi przez Boga. Błędy przydarzają im się niepostrzeżenie, słabości ich pokonują, a złe uczynki i grzechy popełniają zarówno umyślnie, jak i nieświadomie. Przebaczaj im więc i okazuj wyrozumiałość w takim stopniu, w jakim sam pragniesz, by Bóg obdarzył cię przebaczeniem i miłosierdziem. Ty jesteś ponad nimi, ten, który cię ustanowił, jest ponad tobą, a Bóg jest ponad tym, który cię ustanowił. Bóg powierzył ci troskę o zaspokojenie ich potrzeb i wystawia cię na próbę za ich pośrednictwem”.\nJego słowa niosą cenną lekcję. Możemy poświęcić się jej realizacji lub znaleźć sposób, by włączyć ją do naszej administracji."
 devotion_events.202.a: "Inshallah."
 devotion_events.202.b: "Mądre słowa, których będziemy przestrzegać."
 devotion_events.203.t: "Bajt al-Mal"
 devotion_events.203.d: "Dom Skarbu zarządza podatkami i pełni funkcję skarbca, w którym prowadzi się rozliczenia finansów osobistych oraz wydatków państwowych. Administruje również zakatem — podatkiem płaconym przez każdego zamożnego muzułmanina, który następnie rozdziela się między potrzebujących, bezrobotnych, rannych i osoby niezdolne do pracy. Pomimo trudności, z jakimi zmagało się państwo [Root.Country.GetName] w minionym roku, jego mieszkańcom wiodło się lepiej. Wpływy z zakatu do Bajt al-Mal przekroczyły wszelkie nasze oczekiwania. Co powinniśmy zrobić z tą nadwyżką dukatów?"
 devotion_events.203.a: "Pieniądze trafią do naszych wielkich skarbców."
 devotion_events.203.b: "Jak zawsze przekażemy je ubogim i potrzebującym."
 devotion_events.204.t: "Edukacja kobiet"
 devotion_events.204.d: "Mahomet, pokój z nim, chwalił kobiety z Ansar, ponieważ wstyd nie powstrzymywał ich przed zgłębianiem islamu. Fatima al-Fihri, założycielka uniwersytetu Al-Karawijjin, Lubna z Kordoby, utalentowana matematyczka, oraz Fatima bint Abi al-Qasim Abd ar-Rahman ibn Muhammad ibn Ghalib al-Ansari asz-Szarrat, której prace z zakresu teorii prawa, jurysprudencji i mistycyzmu świadczą o rozległej wiedzy w naukach islamskich, są wspaniałymi przykładami tego, co można osiągnąć dzięki edukacji kobiet. Na przestrzeni dziejów kobiety dowodziły, że chcą i potrafią zgłębiać islam oraz kontynuować szerzenie wiary [Root.Religion.GetName]. Dając kobietom szerokie możliwości nauki i nauczania, będziemy mogli znacznie szybciej szerzyć naszą wiarę."
 devotion_events.204.a: "Edukacja powinna być dostępna dla wszystkich — kobiet i mężczyzn."
 devotion_events.204.b: "Musimy się nad tym zastanowić, zanim podejmiemy jakąkolwiek decyzję."
 devotion_events.205.t: "Bazar"
 devotion_events.205.d: "[Root.Capital.GetName] przyciąga kupców i handlarzy z całego świata. Dźwięki i zapachy zniecierpliwionych zwierząt, głosy targujących się ludzi, woń przypraw oraz mnogość barw strojów, tkanin i dywanów sprzedawanych na miejscowym targowisku mogą przytłaczać. W jego centrum pozostawiono niezabudowany plac przeznaczony pod meczet, lecz targowisko stale się rozrasta i miejsce to mogłoby zostać lepiej wykorzystane na kolejne stragany."
 devotion_events.205.a: "Pozwólmy kupcom zająć więcej miejsca."
 devotion_events.205.b: "Uczyńmy z tego miejsca dom modlitwy."
 devotion_events.206.t: "Oczyszczenie religijne"
 devotion_events.206.d: "Sam Mahomet rozbił bożki po odzyskaniu Mekki, a nasi doradcy zachęcają nas, byśmy poszli za przykładem Proroka, oczyścili państwo [Root.Country.GetName] i przywrócili islam do jego prostych początków. Bałwochwalstwo jest zakazane, a mimo to ludzie pielgrzymują do świętych miejsc i modlą się przy grobowcach w prowincji [Root.Province.GetName]. Czy jest to haram — grzech, czy też należy im wybaczyć?"
 devotion_events.206.a: "Oczyśćmy tę prowincję z grzechu!"
 devotion_events.206.b: "To nie haram, lecz mubah — czyn niezalecany, ale niebędący grzechem."
 devotion_events.207.t: "Skorumpowany gubernator"
 devotion_events.207.d: "Przed mianowaniem każdego gubernatora rejestruje się jego majątek i inne istotne informacje. Dane te przechowuje się w specjalnym urzędzie i sprawdza co roku, szukając niezgodności w rozliczeniach finansowych. Ma to zapobiegać korupcji i łapownictwu, lecz czasami system zawodzi."
 devotion_events.207.a: "Powierzmy urząd komuś lepiej wykwalifikowanemu i mniej podatnemu na łapówki."
 devotion_events.207.b: "Wysłałem cię tam jako gubernatora, a nie kupca!"
 devotion_events.207.c: "Zignorujmy sprawę."
 devotion_events.208.t: "Kafir na naszym dworze"
 devotion_events.208.d: "$THEOLOGIAN$$INQUISITOR$$PHILOSOPHER$$NATURAL_SCIENTIST$ uraził niewłaściwą osobę wyznającą wiarę [Root.Religion.GetName] wypowiedzią, którą można było zinterpretować jako świadome porzucenie islamu przez doradcę. Zanim zdołaliśmy przerwać dyskusję i być może uchronić $THEOLOGIAN$$INQUISITOR$$PHILOSOPHER$$NATURAL_SCIENTIST$ przed oskarżeniami, padło już stwierdzenie, że jest kafirem — niewierzącym."
 devotion_events.208.a: "Zignorujmy to, wybaczmy i zapomnijmy."
 devotion_events.208.b: "Spróbujmy znaleźć rozwiązanie."
 devotion_events.208.c: "Zwolnij doradcę."
 devotion_events.209.t: "Przewrót przeciwko zepsuciu"
 devotion_events.209.d: "Skargi na rozpustę i dekadencki styl życia [Root.Monarch.GetTitle] [Root.Monarch.GetName] oraz jego odmowę przywrócenia prestiżu islamu stają się coraz powszechniejsze. Chłopi szemrają gniewnie, że [Root.Monarch.GetName] spędza [Root.Monarch.GetHerHis] dnie na spaniu, a noce z niewolnicami i muzykami. Imam z [Root.Capital.GetName] wymienił [Root.Monarch.GetTitle] podczas publicznej modlitwy, a chłopi obrzucili go nawet kamieniami!"
 devotion_events.209.a: "Obiecuję poprawę."
 devotion_events.209.b: "Chłopi mogą wygłaszać dowolne zarzuty, ale to ja jestem [Root.Monarch.GetTitle]!"
 devotion_events.210.t: "Rafidydzi"
 devotion_events.210.d: "Szyici — których nazywamy rafidytami, ponieważ odrzucają islamską władzę i przywództwo oraz nie uznają Abu Bakra, Umara i Usmana za następców proroka Mahometa, pokój z nim — ujawnili swoją obecność w naszych prowincjach i przyciągnęli kolejnych zwolenników. Nazywają siebie również rawafid, czyli „odrzucającymi”, i szczycą się tym, że zawsze odrzucali zło, zamiast się ku niemu skłaniać."
 devotion_events.210.a: "Nie traćmy czasu — wypędźmy ich z państwa [Root.Country.GetName]!"
 devotion_events.210.b: "Mogą wierzyć i nazywać siebie, jak tylko zechcą."
 devotion_events.211.t: "Nasibici"
 devotion_events.211.d: "W naszych prowincjach pojawili się nasibici, czyli ludzie nienawidzący Ahl al-Bajt — rodziny proroka Mahometa — oraz jej zwolenników. Sunnici, którzy błędnie uważają Abu Bakra, Umara i Usmana za prawowitych następców Mahometa, pokój z nim, zagrażają jedności religijnej państwa [Root.Country.GetName]."
 devotion_events.211.a: "Dla sunnitów nie ma miejsca w państwie [Root.Country.GetName]."
 devotion_events.211.b: "Zostawmy ich w spokoju. Pewnego dnia zrozumieją swój błąd."
 devotion_events.212.t: "Nieuczciwość w madżlisie"
 devotion_events.212.d: "Rada zwołała madżlis, by omówić ważne i pilne sprawy państwa [Root.Country.GetName]. Choć twarze zebranych wyglądały na szczere, słowa brzmiały prawdziwie, a intencje były podstępne i nieuczciwe! Pieniądze roztrwoniono, prestiż utracono, a nadzieje na sprawiedliwy madżlis działający dla dobra państwa [Root.Country.GetName] legły w gruzach."
 devotion_events.212.a: "Zróbmy, co w naszej mocy, by uleczyć tę ranę na naszej dumie."
 devotion_events.212.b: "Zaufaliśmy im, a oni nas zdradzili."
 devotion_events.212.c: "Winię siebie za zbytnią naiwność."
 devotion_events.213.t: "Doradca oskarżony o szirk"
 devotion_events.213.d: "Praca doradcy wystawia go na kontakt z różnymi kulturami, religiami i tradycjami. Zawsze przymykaliśmy oko na osobliwe zwyczaje $STATESMAN$$TRADER$$DIPLOMAT$$COLONIAL_GOVERNOR$ oraz obsesję naszego doradcy na punkcie iluminowanych rękopisów i miniatur. Nasze podejrzenia wzrosły, gdy usłyszeliśmy plotki i opowieści służby oraz dworzan. Nigdy jednak nie spodziewaliśmy się zobaczyć wyrazu twarzy $STATESMAN$$TRADER$$DIPLOMAT$$COLONIAL_GOVERNOR$, gdy imam oskarżył go o szirk — praktykowanie bałwochwalstwa!"
 devotion_events.213.a: "$STATESMAN$$TRADER$$DIPLOMAT$$COLONIAL_GOVERNOR$ musi odejść z dworu, natychmiast!"
 devotion_events.213.b: "Odrzućmy te podejrzenia — $STATESMAN$$TRADER$$DIPLOMAT$$COLONIAL_GOVERNOR$ jest dobrym doradcą."
 devotion_events.214.t: "Znieść bałwochwalstwo?"
 devotion_events.214.d: "„Podważana jest twoja władza” — mówi doradca. „Ludzie wątpią w twoją pobożność. Musisz ustanowić zwierzchność religijną i polityczną! Bałwochwalstwo jest haram, a mimo to twoi poddani modlą się do świętych, pielgrzymują do grobowców i meczetów oraz oddają cześć drzewom, jaskiniom, a nawet kamieniom. Pokaż swoją siłę religijną, zakaż tych praktyk i sięgnij po władzę, która prawowicie ci przysługuje!”"
 devotion_events.214.a: "Dobrze, zakażmy wielu takich praktyk."
 devotion_events.214.b: "Co mnie to obchodzi?"
 devotion_events.215.t: "Podatki czy rolnictwo"
 devotion_events.215.d: "Mieszkańcy państwa [Root.Country.GetName] to koczownicy i chłopi utrzymujący się z tego, co daje ziemia. Nasi gubernatorzy oczekują, że zdecydujemy, na czym powinniśmy się skupić: na podatkach czy rolnictwie. Jeden z doradców twierdzi, że rozwój ziemi jest ważniejszy niż pobór podatków. Podatki można uzyskiwać jedynie dzięki zagospodarowaniu ziemi, a żądanie danin bez wcześniejszych inwestycji doprowadzi do ruiny państwa [Root.Country.GetName] i jego mieszkańców. Inny uważa, że ludzie sami rozwiną swoje ziemie bez ingerencji, jeśli nałoży się na nich podatki i wyjaśni powody tych żądań."
 devotion_events.215.a: "Skupmy się na podatkach."
 devotion_events.215.b: "Skupmy się na rolnictwie."
 devotion_events.215.c: "Spróbujmy zachować równowagę między nimi."
 devotion_events.216.t: "Reformy pobożnych"
 devotion_events.216.d: "Po wielu spotkaniach, dyskusjach i obradach madżlis nasi ministrowie oraz doradcy przedstawili nam kilka reform do rozważenia. Każdy zaprezentował własne pomysły, a my mamy wybrać jeden z dwóch. Pierwsza propozycja zakłada zakaz prowadzenia działalności gospodarczej przez urzędników państwowych, takich jak dyplomaci i gubernatorzy. Dzięki temu mogliby w pełni skupić się na swoich obowiązkach, co powinno poprawić jakość ich pracy. Druga reforma przewiduje przekazanie ubogim pastwisk i rezerwatów łowieckich, które obecnie są zarezerwowane dla rodzin dostojników, aby można było uprawiać tam ziemię. Należałoby również zakazać pracy przymusowej bez wynagrodzenia."
 devotion_events.216.a: "Zakazać urzędnikom państwowym prowadzenia działalności gospodarczej."
 devotion_events.216.b: "Rozdzielić ziemię między ubogich."
 devotion_events.216.c: "Nie wybierajmy żadnej z tych reform."
 devotion_events.217.t: "Nowe szkoły"
 devotion_events.217.d: "W każdej prowincji i każdym mieście powinna znajdować się przynajmniej jedna medresa — szkoła religijna zapewniająca bezpłatną naukę, wyśmienite posiłki, darmowe książki, a nawet stypendia dla każdego ucznia. Powinny odbywać się coroczne egzaminy, a najlepsi uczniowie otrzymywaliby nagrody i rekomendacje na wysokie, zaszczytne stanowiska. Czy szkoły te powinny nauczać hadisów — przekazów o naukach, czynach i wypowiedziach proroka Mahometa, pokój z nim — czy też fiqhu i imanu, czyli teologii i wiary?"
 devotion_events.217.a: "Medresy powinny nauczać hadisów."
 devotion_events.217.b: "Medresy powinny nauczać fiqhu i imanu."
 devotion_events.217.c: "Utwórzmy dwie medresy: jedną nauczającą hadisów, a drugą fiqhu i imanu."
 devotion_events.217.e: "Obecnie nie stać nas na żadne szkoły."
 devotion_events.218.t: "Sulh"
 devotion_events.218.d: "Przybyły do ciebie dwie strony konfliktu. Proszą cię o mediację w sporze i przedstawiają dokumenty, świadków oraz inne dowody. Przyglądając się dostarczonemu materiałowi zastanawiasz się, jak ogłosić zawieszenie broni i jak przygotować ugodę, aby zachować honor i status obu stron. Ten spór majątkowy nie jest pierwszym, który musisz rozstrzygnąć, ale jest to delikatna kwestia, którą należy rozstrzygnąć w taki sposób, aby zapobiec cyklowi zemsty. Obaj mają roszczenia, które powinny im dać prawo do ziemi, ale które z nich są prawdziwe, a które fałszywe?"
 devotion_events.218.a: "Przyznać temu człowiekowi całą ziemię."
 devotion_events.218.b: "Podzielić ziemię na dwie części."
 devotion_events.218.c: "Nakazać im rozstrzygnięcie tego błahego sporu gdzie indziej."
 devotion_events.219.t: "Kadi, hisba i muhtasib"
 devotion_events.219.d: "Zaledwie kilka miesięcy po mianowaniu kadiego — sędziego orzekającego zgodnie z szariatem — przychodzi on do ciebie z zatroskaną twarzą i niespokojnym wzrokiem. Opowiada o zepsuciu, przestępstwach i bezbożnym postępowaniu twoich poddanych. Stanowczo przypomina ci o hisbie, czyli ustanowionym przez Boga obowiązku interweniowania, nakazywania dobra i zakazywania zła. Prawa Allaha muszą być przestrzegane. Twoi poddani potrzebują mutawwinów, policji religijnej, która będzie egzekwować szariat."
 devotion_events.219.a: "Znajdźmy ochotników i wyszkolmy ich na muhtasibów."
 devotion_events.219.b: "Nie sądzę, by był to właściwy sposób rozwiązania problemu."
 dev_general_hospital: "Szpital powszechny"
 desc_dev_general_hospital: "Nowy szpital powszechny, oferujący bezpłatne kursy położnictwa i placówki zwalczające choroby, poprawił zdrowie publiczne oraz dobrobyt mieszkańców naszego kraju."
 dev_fort_maintenance: "Utrzymanie fortu"
 desc_dev_fort_maintenance: "Nasze miasta przekazują fundusze na utrzymanie fortów."
 dev_heretical_expulsion: "Wypędzenie heretyków"
 desc_dev_heretical_expulsion: "Wypędzono Heretyków z tej prowincji."
 opinion_jubilee_good: "Papież zgadza się na Rok Jubileuszowy"
 opinion_jubilee_bad: "Papież nie zgadza się na Rok Jubileuszowy"
 dev_jubilee: "Rok Jubileuszowy"
 desc_dev_jubilee: "Jubileusz to rok święty, w którym odpuszcza się grzechy i udziela powszechnych odpustów, a wierni pielgrzymują do świętych miast."
 theocracy.1.tt: "Ten wybór może wpłynąć na inne wydarzenia."
 opinion_confiscated_church: "Skonfiskowano majątki Kościoła kalwińskiego"
 dev_religious_cleansing: "Oczyszczenie religijne"
 desc_dev_religious_cleansing: "Dążymy do przywrócenia islamu do jego prostych początków i naśladowania Mahometa, który po odzyskaniu Mekki rozbił bożki."
 dev_rafida: "Rafidydzi"
 desc_dev_rafida: "Szyitów nazywa się czasem rafidytami — „odrzucającymi” — ponieważ odmawiają uznania Abu Bakra, Umara i Usmana za następców proroka Mahometa."
 dev_nasibi: "Nasibici"
 desc_dev_nasibi: "Sunnici, którzy nienawidzą Ahl al-Bajt — rodziny proroka Mahometa — oraz jej zwolenników, błędnie uważają Abu Bakra, Umara i Usmana za prawowitych następców Mahometa."
 dev_idolatry_abolished: "Zniesienie bałwochwalstwa"
 desc_dev_idolatry_abolished: "Zakazano modlitw do świętych, pielgrzymek do grobowców i meczetów oraz oddawania czci drzewom, jaskiniom i kamieniom."
 dev_focus_taxes: "Skup się na podatkach"
 desc_dev_focus_taxes: "Gubernatorzy otrzymali polecenie skupienia się na podatkach — rozwiązaniu niezbyt pobożnym, ale bardzo skutecznym."
 dev_focus_agriculture: "Skup się na rolnictwie"
 desc_dev_focus_agriculture: "Gubernatorzy otrzymali polecenie skupienia się na rolnictwie — rozwiązaniu bardzo pobożnym, które, miejmy nadzieję, przyniesie efekty z czasem."
 dev_balance_tax_agriculture: "Równowaga między podatkami a rolnictwem"
 desc_dev_balance_tax_agriculture: "Gubernatorzy otrzymali polecenie równomiernego rozłożenia wysiłków między pobór podatków a rozwój rolnictwa."
 dev_hadith_madrasa: "Medresa hadisów"
 desc_dev_hadith_madrasa: "Szkoła nauczająca zbioru przekazów o naukach, czynach i wypowiedziach proroka Mahometa."
 dev_fiqah_madrasa: "Medresa fiqhu i imanu"
 desc_dev_fiqah_madrasa: "Szkoła nauczająca teologii i zasad wiary."
 dev_hadith_fiqah_madrasa: "Jedna medresa hadisów i jedna medresa fiqhu oraz imanu."
 desc_dev_hadith_fiqah_madrasa: "W każdej prowincji i mieście znajdują się dwie szkoły: jedna naucza hadisów, a druga fiqhu i imanu."
 dev_mutaween: "Muhtasib"
 desc_dev_mutaween: "Policja religijna będzie egzekwować w naszych prowincjach szariat — prawa Allaha."
 dev_educated_women: "Wykształcone kobiety"
 desc_dev_educated_women: "Kobietom zapewniono szerokie możliwości zgłębiania islamu i nauczania innych."
 dev_modern_forts: "Skargi na nowoczesne forty"
 desc_dev_modern_forts: "Koszty unowocześniania i upiększania naszych fortów irytują zwykłych ludzi, których podatki przeznacza się na udogodnienia uznawane przez nich za zbędne."
 add_country_unrest_5_modifier: "Kraj wzburzony niepopularną decyzją"
 desc_add_country_unrest_5_modifier: "W całym kraju wybuchły zamieszki. Działania władcy wzbudziły niezadowolenie, a chłopi protestują, wymachując widłami."
 protestantism_events.1.t: "Reformator szuka bezpiecznego schronienia"
 protestantism_events.1.d: "Obawiając się o własne bezpieczeństwo, jeden z największych teologów naszych czasów musiał opuścić ojczyznę. Jako kraj protestancki mamy obowiązek zapewnić temu człowiekowi bezpieczne schronienie, a jego przyjęcie niewątpliwie wzmocni pozycję naszego Kościoła państwowego. Przynajmniej dopóty, dopóki reformator będzie zgadzał się z naszą polityką."
 protestantism_events.1.a: "Przyjmijmy tego wielkiego człowieka z otwartymi ramionami!"
 protestantism_events.1.a.tt: "Dopóki reformator będzie przebywał w granicach naszego państwa, może krytykować lub popierać politykę naszego Kościoła państwowego."
 protestantism_events.1.b: "Odprawmy go."
 protected_reformer: "Udzielono schronienia reformatorowi"
 did_not_protect_reformer: "Odmówiono schronienia reformatorowi"
 harbouring_reformer: "Gościmy reformatora"
 desc_harbouring_reformer: "Pozwoliliśmy jednemu z najbardziej aktywnych teologów reformacji osiedlić się w naszym kraju. Jego sława i dzieła wzbogacają nasz Kościół państwowy."
 protestantism_events.2.t: "Reformator szuka schronienia w państwie [From.GetName]"
 protestantism_events.2.d: "Jeden z najbardziej znanych zwolenników reformacji w naszym kraju wyjechał do państwa [From.GetName], twierdząc, że obawia się prześladowań ze strony miejscowych władz katolickich. Nie poprzestał na samym wyjeździe — teraz tworzy pamflety, w których wyszydza nie tylko Kościół katolicki, lecz także swoją dawną ojczyznę."
 protestantism_events.2.a: "Oburzające!"
 protestantism_events.3.t: "Reformator krytykuje Kościół państwowy"
 protestantism_events.3.d: "Obecność w naszych granicach reformatora o silnym charakterze nie obyła się bez tarć. Człowiek, który już raz porzucił własną ojczyznę, najwyraźniej nie zamierza łagodzić swoich poglądów, by dostosować je do polityki nowego kraju."
 protestantism_events.3.a: "Życie pod naszą ochroną oznacza poparcie dla Kościoła!"
 protestantism_events.3.b: "Cóż, skoro tak bardzo ci na tym zależy..."
 protestantism_events.4.t: "Potępienie Kościoła państwowego!"
 protestantism_events.4.d: "Rozczarowany naszą niezdolnością do pełnego przyjęcia reformacji zagraniczny reformator wyjechał do ziem księcia bardziej przychylnego jego poglądom. W dłuższej perspektywie może to wzmocnić nasz Kościół, lecz już teraz krążą pamflety podważające prawdziwość nauk Kościoła państwa [Root.GetName]."
 protestantism_events.4.a: "Rozumiem."
 protestantism_events.5.t: "Wycofanie krytyki"
 protestantism_events.5.d: "Wystarczyła ostra reprymenda. Niewielki kryzys w stosunkach z naszym Kościołem państwowym minął, a niepokojące głosy krytyki ucichły."
 protestantism_events.5.a: "Wspaniale!"
 protestantism_events.6.t: "Strach przed kryptokatolikami"
 protestantism_events.6.d: "W naszym państwie nieustannie obawiamy się, że niektórzy spośród tych, którzy deklarują pełną wiarę we wszystkie zasady naszego Kościoła państwowego, potajemnie sympatyzują z katolicyzmem. O jednej z rodzin szlacheckich, mocno zakorzenionej w strukturach państwa, mówi się, że skłania się ku papiestwu. Z upływem lat plotki te nie cichną i coraz trudniej je ignorować."
 protestantism_events.6.a: "Ograniczmy tej rodzinie możliwość obejmowania urzędów."
 protestantism_events.6.b: "Należy postawić ich przed sądem."
 protestantism_events.6.c: "Zignorujmy te podłe pogłoski."
 catholics_in_hiding: "Prześladowanie kryptokatolików"
 desc_catholics_in_hiding: "Nasza aktywna polityka prześladowania osób podejrzewanych o kryptokatolicyzm ograniczyła skłonność urzędników do krytykowania Kościoła państwowego, lecz sprawiła również, że niektórzy całkowicie rezygnują z kariery w służbie państwowej."
 rumored_crypto_catholics: "Obawa przed kryptokatolikami"
 desc_rumored_crypto_catholics: "Nasza niechęć do badania pogłosek o kryptokatolikach potajemnie próbujących podważyć państwo podsyciła liczne teorie spiskowe na prowincji."
 protestantism_events.7.t: "„Ostatnie dni” państwa [Root.GetName]"
 protestantism_events.7.d: "Żarliwość religijna ogarnęła państwo [Root.GetName], ponieważ ludność uwierzyła, że koniec świata jest coraz bliżej. Chłopi mówią o znakach na niebie, a miejscowi kapłani głoszą kazania o apokalipsie, wbrew doktrynie Kościoła państwowego. Wraz z rozprzestrzenianiem się millenaryzmu winą obarcza się państwo i sam Kościół państwowy, który deklaruje protestantyzm, lecz najwyraźniej nie postępuje zgodnie z własną nazwą.\nOficjalne reakcje były dotąd bardzo słabe, ponieważ nawet wśród duchowieństwa [Root.Owner.Capital.GetCapitalName] niektórzy uważają te obawy za uzasadnione."
 protestantism_events.7.a: "Spróbujmy uspokoić sytuację."
 protestantism_events.7.b: "Zareagujmy stanowczo."
 protestantism_events.7.c: "Mają rację, że się boją. Pokutujcie, albowiem koniec jest bliski!"
 millenarianism: "Millenaryzm"
 desc_millenarianism: "Wiernych tej prowincji ogarnęła wiara, że gwałtowny koniec świata jest bliski. Przekonanie, że kres dni oczyści społeczeństwo z wszelkiej korupcji i grzechu, zmobilizowało miejscową ludność przeciwko nam i Kościołowi państwowemu."
 fear_of_god: "Strach przed apokalipsą"
 desc_fear_of_god: "„Wiemy ze świętych pism, a wszyscy uczeni potwierdzają to samo, że świat miał przetrwać 6000 lat”.\nWielu w naszym kraju uważa, że nasze dni są policzone, a nasz Kościół Narodowy robi co w jego mocy, aby wykorzystać to przekonanie. Podczas gdy grozi nam podsycenie milenijnych antyrządowych nastrojów, zdecydowana większość koncentruje się na zapewnieniu bezpieczeństwa ich duszom."
 protestantism_events.8.t: "Chciwość"
 protestantism_events.8.d: "Niektórzy członkowie naszego Kościoła państwowego dotkliwie ucierpieli z powodu nadmiernie wysokich stóp procentowych. Pojawiają się głosy sprzeciwu i krążą pamflety potępiające „lichwę i oszustwo”, głoszące, że na każdej ulicy można spotkać drobnych lichwiarzy.\nNasze państwo i jego Kościół uznają, że pobieranie odsetek jest zgodne z zasadami dobrego chrześcijaństwa, lecz w niektórych przypadkach prowadzi do nadużyć. Być może należałoby jeszcze bardziej obniżyć dopuszczalny poziom odsetek, aby ograniczyć najgorsze przypadki."
 protestantism_events.8.a: "Zignorujmy malkontentów."
 protestantism_events.8.b: "Na pewien czas obniżmy dopuszczalną wysokość odsetek."
 prot_economic_downturn: "Spowolnienie gospodarcze"
 desc_prot_economic_downturn: "Powszechne stosowanie nadmiernie wysokich stóp procentowych i spekulacji finansowych doprowadziło w tym regionie do spowolnienia gospodarczego. Niektórzy obwiniają za to Kościół państwowy, który złagodził chrześcijański zakaz lichwy."
 stricter_usury_regulations: "Surowsze przepisy przeciwko lichwie"
 desc_stricter_usury_regulations: "Aby ograniczyć najgorsze nadużycia związane z pobieraniem odsetek od pożyczek, nieznacznie zmieniliśmy maksymalną dopuszczalną wysokość oprocentowania."
 protestantism_events.9.t: "Przesłanie dla wiernych"
 protestantism_events.9.d: "Jedną z największych zalet Kościoła państwowego jest możliwość jednoczesnego dotarcia do wszystkich wiernych w naszym kraju. Zbliża się ogólnokrajowy dzień modlitwy, podczas którego kazanie jest zwyczajowo częściowo ustalane przez centralne władze Kościoła państwowego. Na czym powinno skupiać się nauczanie w nadchodzących latach?"
 protestantism_events.9.a: "Wdzięczność za pokój, którym obecnie się cieszymy."
 protestantism_events.9.b: "Uzasadnienie słuszności naszych wojen."
 protestantism_events.9.c: "Czystość wiary."
 protestantism_events.9.dd: "Jedność Chrześcijaństwa."
 protestantism_events.9.e: "Unikanie ingerencji w sprawy lokalne."
 prot_peace: "Propagowanie wartości pokoju"
 desc_prot_peace: "Wykorzystaliśmy kazanie podczas ogólnokrajowego dnia modlitwy, by uświadomić poddanym wielką wartość pokoju oraz to, że każdy dobry chrześcijanin powinien dokładać wszelkich starań, by go zachować."
 prot_wars: "Propagowanie słuszności naszych wojen"
 desc_prot_wars: "Wykorzystaliśmy kazanie podczas ogólnokrajowego dnia modlitwy, by uświadomić poddanym słuszność naszej sprawy w prowadzonych wojnach."
 prot_purity_of_faith: "Propagowanie czystości naszej wiary"
 desc_prot_purity_of_faith: "Wykorzystaliśmy kazanie podczas ogólnokrajowego dnia modlitwy, by uświadomić poddanym wielką wartość zachowania czystości naszej wiary oraz wskazać, jak rozpoznawać tych, którzy chcieliby ją splamić."
 prot_christian_unity: "Propaguj Jedność Chrześcijaństwa"
 desc_prot_christian_unity: "Wygłosiliśmy kazanie Narodowego Dnia Modlitwy, aby nasi poddani zrozumieli wielką wartość związania się z Chrześcijaństwem jako całością przeciwko niewiernym."
 protestantism_events.10.t: "Opór wobec reformacji w państwie [Root.GetName]"
 protestantism_events.10.d: "Wciąż są ludzie, zwłaszcza na wsi, którzy sprzeciwiają się Kościołowi państwowemu [Root.Owner.GetName] i tęsknią za powrotem pod skrzydła Kościoła rzymskiego. Istnieje jednak zasadnicza różnica między wątpliwościami religijnymi a otwartym buntem, a jak dotąd w państwie [Root.GetName] panował spokój. Kościół państwowy pozostawiał większość tych ludzi w spokoju, o ile uczestniczyli w nabożeństwach i płacili podatki.\nWygląda na to, że pokój nie miał trwać wiecznie. Niedawne zbieranie sreber kościelnych w tym regionie zostało uznane przez miejscową ludność za otwarte wypowiedzenie wojny. Ludzie chwycili za broń, by chronić swoje kościoły przed chciwymi rękami władz z [Root.Owner.Capital.GetCapitalName]."
 protestantism_events.10.a: "Czas użyć nieco bardziej stanowczych argumentów."
 protestantism_events.10.b: "Na razie zwolnijmy ten region z obowiązku."
 protestantism_events.11.t: "$THEOLOGIAN$ potępia Kościół państwa [Root.GetName]"
 protestantism_events.11.d: "$THEOLOGIAN$ miał obiecującą karierę na długo przed dotarciem reformacji do naszego kraju i utworzeniem Kościoła państwowego [Root.GetName]. Jako osoba wpływowa, o ugruntowanych poglądach, $THEOLOGIAN$ niełatwo dał się przekonać do przyjęcia nowego charakteru Kościoła. Z biegiem lat opór ten tylko narastał i obecnie $THEOLOGIAN$ jawnie sprzeciwia się Kościołowi. Członek dworu nie może otwarcie występować przeciwko [Root.Monarch.GetName] — musimy coś z tym zrobić!"
 catholic_stronghold: "Katolicka enklawa"
 desc_catholic_stronghold: "Mieszkańcy tej prowincji zostali zwolnieni z obowiązku przynależności do Kościoła państwowego i na razie mogą praktykować swoją dawną wiarę katolicką."
 protestantism_events.11.a: "Wypędzić $THEOLOGIAN$."
 protestantism_events.11.b: "Postawić $THEOLOGIAN$ przed sądem za bluźnierstwo i nakazać $THEOLOGIAN_POSS_PRONOUN$ egzekucję."
 protestantism_events.11.c: "To jest nieszczęście."
 protestantism_events.12.t: "Katolicki myśliciel na dworze"
 protestantism_events.12.d: "$NATURAL_SCIENTIST$PHILOSOPHER$ słynie ze swojego bystrego umysłu, a $NATURAL_SCIENTIST_POSS_PRONOUN$PHILOSOPHER_POSS_PRONOUN$ obecność na naszym dworze dodaje splendoru naszemu imieniu. $NATURAL_SCIENTIST_CAP_ADJ$PHILOSOPHER_CAP_ADJ$ jest jednak również zagorzałym katolikiem i pozwoliliśmy $NATURAL_SCIENTIST_POSS_PRONOUN$PHILOSOPHER_POSS_PRONOUN$ praktykować $NATURAL_SCIENTIST_POSS_PRONOUN$PHILOSOPHER_POSS_PRONOUN$ wiarę według własnego uznania, aby zechciał przybyć do naszego kraju. Sam Kościół państwa [Root.GetName] nie odważyłby się krytykować [Root.Monarch.GetName], lecz na ulicach [Root.Capital.GetCapitalName] krążą pogłoski, że $NATURAL_SCIENTIST$PHILOSOPHER$ próbuje zaszczepić wywrotowe katolickie idee w umyśle [Root.Monarch.GetName]."
 protestantism_events.12.a: "Pozwól mu rozmawiać."
 protestantism_events.12.b: "Usunąć $NATURAL_SCIENTIST$$PHILOSOPHER$ z dworu."
 protestantism_events.13.t: "Wpływy doradcy $TREASURER$$PHILOSOPHER$$ARTIST$$THEOLOGIAN$$MASTER_OF_MINT$$INQUISITOR$"
 protestantism_events.13.d: "Krążą pogłoski, że $TREASURER$$PHILOSOPHER$$ARTIST$$THEOLOGIAN$$MASTER_OF_MINT$$INQUISITOR$, bliski doradca [Root.Monarch.GetName], w rzeczywistości skrywa sympatie kalwińskie. Ostatnio kilka ustaw oskarżono o potajemne zbliżanie naszego kraju do ideałów Kościołów reformowanych."
 protestantism_events.13.a: "Odrzućmy te pogłoski jako niedorzeczne."
 protestantism_events.13.b: "Publicznie odetnij się od $TREASURER$$PHILOSOPHER$$ARTIST$$THEOLOGIAN$$MASTER_OF_MINT$$INQUISITOR$."
 protestantism_events.13.c: "Spróbujmy wprowadzić poprawki do budzących sprzeciw ustaw."
 protestantism_events.14.t: "Edukacja [Root.Heir.GetName]"
 protestantism_events.14.d: "Wszyscy nauczyciele [Root.Heir.GetName] uważają [Root.Heir.GetHerHim] za wyjątkowo obiecującego przyszłego władcę. Pod każdym względem związanym ze sztuką rządzenia [Root.Heir.GetName] wykazał [Root.Heir.GetHerselfHimself] zainteresowanie i talent. Władze religijne zaczęły się jednak obawiać, że [Root.Heir.GetSheHe] zbyt mocno zainteresował się porzuconą przez nas wiarą katolicką."
 protestantism_events.14.a: "Dzięki temu [Root.Heir.GetHerHim] stanie się lepszym władcą."
 protestantism_events.14.a.tt: "[Root.Heir.GetName] będzie mógł rozwijać swoje zainteresowanie katolicyzmem."
 protestantism_events.14.b: "Zakazać wszelkich studiów nad naukami papistów."
 protestantism_events.14.b.tt: "[Root.Heir.GetName] nie będzie mógł rozwijać swojego zainteresowania katolicyzmem."
 protestantism_events.15.t: "Katolickie sympatie [Root.Monarch.GetName]"
 protestantism_events.15.d: "Nie jest tajemnicą, że [Root.Monarch.GetName] doskonale rozumie wiarę katolicką — być może znacznie lepiej, niż życzyliby sobie tego duchowni naszego Kościoła państwowego. Mimo to koronacja [Root.Monarch.GetHerHis] była popularnym wydarzeniem, a lud zdaje się popierać nowego władcę. Znajomość obcych wyznań może niewątpliwie przydać się władcy protestanckiego królestwa, a niewielu odważyłoby się oskarżyć [Root.Monarch.GetName] o kryptokatolicyzm."
 protestantism_events.15.a: "Niech żyje [Root.Monarch.GetName]!"
 tolerant_monarch: "Tolerancyjny władca"
 desc_tolerant_monarch: "Nasz władca słynie z doskonałego zrozumienia innych wyznań, dzięki czemu mniejszości religijne w naszym państwie cieszą się przywilejami, których w innych okolicznościach by nie otrzymały."
 protestantism_events.16.t: "Sumienie [Root.Monarch.GetName]"
 protestantism_events.16.d: "Minęły lata, a [Root.Monarch.GetName] dowiódł, że jest uczciwym i sprawiedliwym władcą. Duchowieństwo nie obawia się już nagłego katolickiego przewrotu, a jego nienawiść do papiestwa złagodniała dzięki zrozumieniu tej religii przez [Root.Monarch.GetName].\nSam [Root.Monarch.GetName] [Root.Monarch.GetHerselfHimself] zmaga się jednak z niepokojem. Z biegiem lat [Root.Monarch.GetSheHe] uświadomił sobie, że [Root.Monarch.GetHerHis] osobista wiara jest znacznie bliższa katolikom, których [Root.Monarch.GetSheHe] tak gorliwie chronił, niż dogmatycznemu Kościołowi państwowemu [Root.GetName]."
 protestantism_events.16.a: "Osobista abdykacja jest jedynym rozwiązaniem."
 protestantism_events.16.b: "[Root.Monarch.GetName] będzie musiał dalej żyć z dręczącym sumieniem."
 plagued_concience: "Dręczone sumienie"
 desc_plagued_concience: "Nasz władca jest daleki od gorliwego wyznawania nauk naszego Kościoła państwowego. Choć nie wpływa to bezpośrednio na naszą politykę, prowadzenie samego Kościoła stało się dla niego sprawą drugorzędną."
 protestantism_events.17.t: "Tarcia między [Root.Heir.GetName] a [Root.Monarch.GetName]"
 protestantism_events.17.d: "Zainteresowanie katolicyzmem [Root.Heir.GetName] zdaje się z biegiem lat tylko rosnąć. [Root.Heir.GetSheHe] otacza [Root.Heir.GetHerselfHimself] gronem filozofów, uczonych i artystów ze świata katolickiego. Stało się to powodem niemałego zakłopotania. Jako głowa Kościoła państwa [Root.GetName] [Root.Monarch.GetName] ma obowiązek stać na straży wartości reformacji. Jeśli nie uda się przekonać [Root.Heir.GetName] do zmiany [Root.Heir.GetHerHis] postępowania, autorytet naszego Kościoła może ucierpieć."
 protestantism_events.17.a: "Spróbujmy zmusić [Root.Heir.GetName] do zmiany [Root.Heir.GetHerHis] postępowania."
 protestantism_events.17.b: "Zgódźmy się, że się nie zgadzamy."
 protestantism_events.18.t: "[Root.Heir.GetName] dostrzega błędy [Root.Heir.GetHerHis] postępowania"
 protestantism_events.18.d: "Gdy jasno przedstawiono [Root.Heir.GetHerHim] nasze oczekiwania i wyjaśniono [Root.Heir.GetHerHim], czego się od niego wymaga, [Root.Heir.GetName] zgodził się wyraźniej odciąć [Root.Heir.GetHerselfHimself] od katolików i ich wierzeń."
 protestantism_events.18.a: "Chwała Bogu!"
 protestantism_events.19.t: "[Root.Capital.GetCapitalName] warte mszy"
 protestantism_events.19.d: "Od [Root.Monarch.GetHerHis] młodości [Root.Monarch.GetName] wątpił w prawdziwość nauk Kościoła państwa [Root.GetName]. Teraz [Root.Monarch.GetSheHe] zdecydował się nie tylko na osobiste nawrócenie, lecz także rozpoczął kontrreformację w całym królestwie. Droga przed nami z pewnością nie będzie łatwa, ale nikt nie jest tak przekonany jak [Root.Monarch.GetName], że wszystko zakończy się pomyślnie."
 protestantism_events.19.a: "Złóżmy naszą wiarę w Bogu."
 catholic_zealot: "Nawrócony monarcha"
 desc_catholic_zealot: "Nasz władca nawrócił kraj z osobistego przekonania, że katolicyzm jest prawdziwą wiarą, i zrobi wszystko, by wszyscy poddani poszli w jego ślady."
 protestantism_events.20.t: "[Root.Heir.GetName] nie chce iść na kompromis"
 protestantism_events.20.d: "Mimo że jak najdokładniej przedstawiliśmy oczekiwania wobec następcy tronu, [Root.Heir.GetName] uparcie podtrzymuje [Root.Heir.GetHerHis] szkodliwą fascynację Kościołem katolickim. W stolicy propagandyści i satyrycy zaczęli już rozpowszechniać pamflety o tym, że [Root.Monarch.GetName] nie potrafi zapanować nawet nad własną rodziną, a co dopiero chronić wiernych królestwa."
 protestantism_events.20.a: "Nic nie da się zrobić."
 protestantism_events.20.b: "Nie mamy wyboru — musimy wydziedziczyć [Root.Heir.GetName]!"
 protestantism_events.21.t: "Kłopotliwy duchowny"
 protestantism_events.21.d: "$THEOLOGIAN$$INQUISITOR$ zrobił znakomitą karierę: zaczynał jako nisko postawiony kapłan parafialny, a ostatecznie dotarł na sam szczyt hierarchii kościelnej. Przez lata zaczęto uważać go za jeden z filarów Kościoła państwa [Root.GetName]. Niepokoi więc fakt, że $THEOLOGIAN$$INQUISITOR$ zaczął kwestionować kierunek, w którym zmierza Kościół. Choć $THEOLOGIAN$$INQUISITOR$ unika bezpośredniej krytyki [Root.Monarch.GetName] [Root.Monarch.GetHerselfHimself], trudno uznać słowa $THEOLOGIAN_POSS_PRONOUN$$INQUISITOR_POSS_PRONOUN$ za nieszkodliwe dla Kościoła państwowego."
 protestantism_events.21.a: "Z pewnością znajdziemy kogoś, kto zajmie miejsce $THEOLOGIAN$$INQUISITOR$."
 protestantism_events.21.b: "Pozwólmy $THEOLOGIAN$INQUISITOR$ działać, ale dopilnujmy, by nie miał realnej władzy."
 protestantism_events.22.t: "Wciąż żywa nadzieja na pojednanie"
 protestantism_events.22.d: "Wciąż są ludzie tęskniący za czasami, gdy wiara chrześcijańska była zjednoczona. Uważają reformację i narodziny protestantyzmu za konieczne, lecz ubolewają, że nie można było ich przeprowadzić bez rozłamu.\nChoć intencje tych osób są dobre, podobne poglądy mogą być bardzo szkodliwe dla Kościoła państwowego takiego jak nasz. Niepokoi nas zatem, że część urzędników kościelnych, a także niektórzy pracownicy naszych seminariów, podzielają takie idee."
 protestantism_events.22.a: "Wystarczy reprymenda."
 protestantism_events.22.b: "Zgarnijmy najważniejszych z nich i osądźmy za zdradę."
 phillipists: "Filipisci"
 desc_phillipists: "Choć jest to źle widziane, niektórzy członkowie hierarchii naszego Kościoła państwowego rozważają ponowne zjednoczenie z Rzymem. Nasza niezdolność do zdecydowanego rozprawienia się z tymi tendencjami utrudnia nawracanie pozostałych katolików w granicach naszego państwa."
 protestantism_events.23.t: "Protestancka diaspora"
 protestantism_events.23.d: "W miarę jak chrześcijaństwo ulega coraz większym podziałom, strumień uchodźców religijnych stale przybiera na sile. Konflikty wyznaniowe w największych państwach katolickich zmusiły wielu protestantów do opuszczenia ojczyzny. Jako kraj protestancki posiadający własny Kościół możemy zapewnić im ochronę, a także dobrze wykorzystać ich umiejętności i majątek.\nProtestantyzm jest jednak daleki od jedności i nie jest pewne, czy wszyscy przybysze uznają Kościół państwa [Root.GetName] za zgodny z własnymi przekonaniami. Przyjęcie wszystkich protestanckich imigrantów byłoby godne pochwały, lecz rozsądniej może być wybrać tych, których umiejętności mogą nam się przydać."
 protestantism_events.23.a: "Otwórzmy nasze granice dla wszystkich protestantów."
 protestantism_events.23.b: "Przyjmijmy tylko tych, którzy mogą nam się przydać."
 protestantism_events.23.c: "Odprawmy ich."
 protestantism_events.23.dd: "Przyznajmy im ziemię w Nowym Świecie."
 protestant_influx: "Protestanccy imigranci"
 desc_protestant_influx: "Nasz kraj przyjął wielu protestanckich imigrantów uciekających z katolickich ojczyzn. Ich wyznanie może nie być dokładnie takie jak nasze, lecz łączy nas wspólny wróg — papież — a ich umiejętności możemy dobrze wykorzystać."
 protestant_refugees: "Napływ protestanckich uchodźców"
 desc_protestant_refugees: "Osiedliła się tu duża liczba protestanckich imigrantów, którzy porzucili swoje katolickie ojczyzny. Nie są przyzwyczajeni do naszego Kościoła państwowego, co wywołało pewne napięcia, lecz prowincja odnotowała ogólną poprawę sytuacji gospodarczej."
 welcomed_fleeing_protestants: "Przyjęto uchodźców"
 turned_away_fleeing_protestants: "Odprawiono uchodźców"
 protestant_refugees_to_the_colonies: "Protestancka emigracja"
 desc_protestant_refugees_to_the_colonies: "Nasza ojczyzna obiecała grupie protestanckich emigrantów ochronę w tutejszych koloniach."
 protestantism_events.24.t: "Krytyka oficjalnego przekładu Biblii"
 protestantism_events.24.d: "Zatwierdzenie przekładu Biblii przez państwo w znacznym stopniu zjednoczyło protestantów w naszym kraju. Zarówno opinia publiczna, jak i większość teologów uważa, że nasz przekład jest znacznie wierniejszy pierwotnym założeniom naszej religii.\nSą jednak również tacy, którzy uznają oficjalny przekład Biblii za dalece niedoskonały. Niektóre grupy twierdzą, że jest po prostu przestarzały i wymaga modernizacji. Inne uważają, że zbyt sprzyja rządzącemu państwu i że wykorzystujemy go do podporządkowania sobie poddanych. Jeszcze inni sądzą, że zmiany poszły zbyt daleko i że w przekładzie nadal zachowano wiele błędów nagromadzonych w poprzednich wersjach Biblii."
 protestantism_events.24.a: "Pozostańmy przy obecnej wersji."
 protestantism_events.24.b: "Zlećmy przygotowanie nowego przekładu."
 new_bible_translation: "Nowy przekład Biblii"
 desc_new_bible_translation: "Trwają prace nad nowym przekładem Biblii, który ma stać się oficjalną wersją używaną przez nasz Kościół państwowy. Celem jest stworzenie tekstu, który w możliwie największym stopniu zaspokoi potrzeby państwa i uwzględni zastrzeżenia zgłaszane wobec poprzedniego przekładu."
 controversy_over_official_bible: "Kontrowersje wokół oficjalnego przekładu Biblii"
 desc_controversy_over_official_bible: "Opublikowaliśmy oficjalny przekład Biblii przeznaczony dla naszego Kościoła państwowego. Przyczynił się on do znacznego ujednolicenia wiary i odrzucenia dawnych katolickich naleciałości. Żaden pojedynczy przekład nie zadowoli jednak wszystkich, którzy wcześniej korzystali z różnych wersji Biblii. Wygląda na to, że grupy reprezentujące niemal cały przekrój poglądów religijnych znalazły fragment, wobec którego zgłaszają zastrzeżenia. Mimo to postanowiliśmy pozostać przy naszej wersji, przekonani, że ostatecznie przetrwa wszystkie pozostałe."
 protestantism_events.25.t: "Dylemat [Root.Monarch.GetName]"
 protestantism_events.25.d: "Nie jest tajemnicą, że małżeństwo [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] małżonka nie należy do najszczęśliwszych, a spłodzenie następcy tronu okazało się poważnym problemem. Krążą pogłoski, że [Root.Monarch.GetName] miał kilka pozamałżeńskich romansów, przez co reputacja naszego królestwa może zostać nadszarpnięta. [Root.Monarch.GetName] nie chce jednak nawet słyszeć o rozwodzie i uważa takie rozwiązanie za głęboko niemoralne.\nZamiast tego [Root.Monarch.GetSheHe] twierdzi, że skoro wielożeństwo było dopuszczalne wśród patriarchów, można powołać się na ten precedens i zezwolić [Root.Monarch.GetHerHim] na drugi związek. Reformatorzy poproszeni o opinię są, delikatnie mówiąc, bardzo powściągliwi, lecz [Root.Monarch.GetName] wydaje się przekonany, że jest to najlepsze rozwiązanie [Root.Heir.GetHerHis] problemu."
 protestantism_events.25.a: "Wielożeństwo jest grzechem."
 protestantism_events.25.b: "Jeśli było wystarczająco dobre dla patriarchów, jest wystarczająco dobre dla mnie."
 protestantism_events.25.c: "Jeśli było wystarczająco dobre dla moich poprzedników, jest wystarczająco dobre dla mnie."
 protestant_bigamy: "Wielożeństwo"
 desc_protestant_bigamy: "Zamiast żyć w grzechu z partnerami poza związkiem małżeńskim lub trwać w pozbawionym miłości małżeństwie, nasz władca poszedł za przykładem patriarchów i poślubił więcej niż jedną osobę."
 bigamy_of_ruler: "Wielożeństwo"
 protestantism_events.26.t: "Przeciążone sądy"
 protestantism_events.26.d: "Bezpośrednie włączenie prawa mojżeszowego do ustawodawstwa państwa [Root.GetName] doprowadziło w niektórych częściach kraju do bezprecedensowego rozrostu wymiaru sprawiedliwości. Nieustanny napływ oskarżeń przerodził się w niemal niemożliwą do opanowania liczbę spraw sądowych. Znacznie wzrosła również liczba wyroków śmierci. Gdyby nie istniejąca już praktyka udzielania dyspensy od takiego wyroku w zamian za określoną sumę pieniędzy wypłacaną przez skazanego, znaleźlibyśmy się w bardzo trudnej sytuacji."
 protestantism_events.26.a: "Skoro zostali skazani, zgrzeszyli i muszą ponieść karę."
 protestantism_events.26.b: "Przydzielmy sądom więcej środków, by mogły sobie z tym poradzić."
 mosaic_law_accusations: "Przeciążone sądy"
 desc_mosaic_law_accusations: "Włączenie prawa mojżeszowego bezpośrednio do ustawodawstwa naszego kraju sprawiło, że stosunkowo powszechne przestępstwa, takie jak cudzołóstwo, są karane śmiercią. Mieszkańcy tego regionu często korzystają z tych przepisów. Choć wzrost autorytetu sądów jest budujący, liczba spraw osiągnęła niemal niemożliwy do opanowania poziom."
 protestantism_events.27.t: "Surowy teolog"
 protestantism_events.27.d: "Niedawno z systemu edukacyjnego Kościoła państwa [Root.GetName] wyłonił się niezwykły człowiek. To kapłan o wyjątkowej charyzmie i niezłomnych przekonaniach, który zamiast dążyć do zmiany Kościoła zgodnie z własnymi poglądami, postanowił zaszczepiać wierność protestanckim tradycjom i dogmatom Kościoła państwowego.\nW obecnych czasach taki człowiek jest rzadkością i niewątpliwie moglibyśmy dobrze wykorzystać jego zdolności."
 protestantism_events.27.a: "Pozwólmy mu kształcić naszych kapłanów."
 protestantism_events.27.b: "Wykorzystajmy go do walki z herezją."
 protestantism_events.27.c: "Lojalność i tradycja — oto wartości, których potrzebuje przywódca naszego Kościoła."
 stern_theologian_education: "Surowy teolog"
 desc_stern_theologian_education: "Edukacja kapłanów naszego Kościoła państwowego znajduje się pod ogromnym wpływem niezwykle charyzmatycznego i dogmatycznego przywódcy, który potrafi zaszczepić duchowieństwu właściwą gorliwość wobec naszego Kościoła."
 stern_theologian_mission: "Surowy teolog"
 desc_stern_theologian_mission: "Dzieło nawracania pogan i heretyków prowadzi niezwykle charyzmatyczny i dogmatyczny przywódca, który jak mało kto potrafi zainspirować ludzi do przyłączenia się do Kościoła państwowego."
 stern_theologian_leader: "Surowy teolog"
 desc_stern_theologian_leader: "Na czele naszego Kościoła państwowego stoi niezwykle charyzmatyczny i dogmatyczny przywódca — surowy teolog, który ponad wszystko ceni tradycję i lojalność."
 protestantism_events.28.t: "Sakramentarianie"
 protestantism_events.28.d: "To, czy ciało Chrystusa jest rzeczywiście fizycznie obecne podczas Eucharystii, było jednym z głównych punktów spornych między protestantami a katolikami w czasie reformacji. Niektórzy mają jednak trudności nawet z zaakceptowaniem luterańskiej nauki o unii sakramentalnej. Niedawna publikacja, która zyskała pewien rozgłos w naszym kraju, wydaje się dziełem jednej z takich grup. Wkrótce zapewne zostanie zapomniana, lecz w krótkiej perspektywie podważa prawowitość naszego Kościoła państwowego."
 protestantism_events.28.a: "Jaka szkoda."
 protestantism_events.28.b: "To pachnie kryptokalwinizmem. Odnajdźmy prowodyrów i wypędźmy ich."
 protestantism_events.28.c: "Spróbujmy ograniczyć rozpowszechnianie tych pamfletów."
 protestantism_events.29.t: "Reformator chwali Kościół państwa [Root.GetName]"
 protestantism_events.29.d: "Jeden z wielkich myślicieli stojących na czele reformacji przedstawił niedawno nasz kraj jako wzór godny naśladowania w jednej ze swoich publikacji oraz podczas dysputy. Z pewnością wzmocni to naszą międzynarodową reputację i dodatkowo umocni autorytet samego Kościoła."
 protestantism_events.29.a: "Wykorzystajmy to w naszej propagandzie wewnętrznej."
 protestantism_events.29.b: "Pomoże nam to zbliżyć się do innych protestantów."
 protestantism_events.29.b.tt: "Stosunki ze wszystkimi państwami §Ykatolickimi§! pogorszą się o §R35§!.\nStosunki ze wszystkimi państwami §Yprotestanckimi§! poprawią się o §G35§!.\nEfekty te zanikną w ciągu najbliższych 12 lat."
 beacon_of_protestantism: "Wzorcowe państwo protestanckie"
 protestant_ideal: "Wzorcowe państwo protestanckie"
 protestantism_events.31.t: "Obieg wrogich publikacji"
 protestantism_events.31.d: "Ostatnio zaczęto rozpowszechniać liczne pamflety, drzeworyty i inne drobne publikacje, niewątpliwie finansowane przez naszych wrogów. W tych podłych tekstach twierdzi się, że wiele aspektów działalności Kościoła państwa [Root.GetName] zostało wymyślonych dla wygody państwa.\nWątpliwe, by ta krytyka trwale nadszarpnęła reputację naszego Kościoła państwowego, lecz w krótkiej perspektywie z pewnością mu zaszkodziła."
 protestantism_events.30.t: "Procesy o czary w państwie [Root.GetName]"
 protestantism_events.30.d: "Przejście od przynależności do szeroko rozumianego Kościoła rzymskokatolickiego do lokalnego Kościoła państwa [Root.Owner.GetName] przebiegło na ogół pomyślnie, lecz w niektórych regionach nie jest jasne, gdzie spoczywa władza. W dawnych czasach, gdy pojawiały się podejrzenia o czary, Kościół katolicki często angażował się w sprawę i potrafił powściągnąć gniew miejscowej ludności. Reformacja natomiast znacznie wzmocniła wiarę w ludowe odmiany chrześcijaństwa.\nW państwie [Root.GetName] kilka kobiet oskarżono o czary, a poszukiwania kolejnych podejrzanych już się rozpoczęły. Miejscowi kapłani i urzędnicy sądowi zaangażowali się w procesy, lecz państwo dotąd nie interweniowało. Liczba kobiet oczekujących na proces stale rośnie i być może będziemy musieli podjąć działania."
 protestantism_events.30.a: "Poprzyjmy procesy."
 protestantism_events.30.a.tt: "Dopóki procesy będą trwały, istnieje ryzyko, że rozprzestrzenią się na kolejne prowincje lub wymkną się spod kontroli."
 protestantism_events.30.b: "Zignorujmy procesy."
 protestantism_events.30.c: "Musimy powstrzymać te procesy."
 protestantism_events.30.c.tt: "Procesy o czary nie rozprzestrzenią się z tej prowincji ani nie wymkną się spod kontroli."
 protestantism_events.31.a: "Jaka szkoda."
 protestantism_events.31.b: "Oko za oko — rozpocznijmy kontrkampanię."
 protestantism_events.32.t: "Włączanie nowych regionów"
 protestantism_events.32.d: "Wraz z ekspansją naszego kraju na nowe obszary zamieszkane przez protestantów rozpoczęliśmy proces włączania ich do Kościoła państwowego. Wprowadzenie rejestrów parafialnych na niektórych niedawno zdobytych ziemiach przyniosło zaskakujące odkrycie: region ten jest znacznie gęściej zaludniony, niż przypuszczali jego dawni władcy."
 protestantism_events.32.a: "Wspaniale!"
 protestantism_events.33.t: "Pietyzm"
 protestantism_events.33.d: "W naszym kraju zaczyna rozwijać się nowy rodzaj ruchu protestanckiego. Pietyści koncentrują się na zbawieniu wewnętrznym i wykazują niewielkie zainteresowanie studiami teologicznymi oraz dogmatami Kościoła państwowego."
 protestantism_events.33.a: "Spróbujmy ograniczyć jego wpływy."
 protestantism_events.33.b: "Podejdźmy do pietystów z zainteresowaniem."
 spread_of_pietism: "Rozprzestrzenianie się pietyzmu"
 desc_spread_of_pietism: "Pietyści wierzą w wewnętrzną religijność jednostki, a nie w dogmaty teologiczne. Brak zainteresowania ściśle określonymi zasadami osłabił autorytet naszego Kościoła państwowego, jednocześnie zbliżając nas do innych Kościołów ewangelickich."
 protestantism_events.34.t: "Ikonoklastyczne zamieszki w państwie [Root.GetName]"
 protestantism_events.34.d: "Niechęć do ikon i wizerunków dawnego Kościoła katolickiego łączy wielu protestantów. Dlatego polityka zezwalania na ich obecność w Kościele państwa [Root.Owner.GetName] nigdy nie była całkowicie bezproblemowa.\nRozwścieczona ludność państwa [Root.GetName], uznająca te wizerunki za przejaw bałwochwalstwa, wtargnęła do wielu kościołów w prowincji, rozbijając malowane okna oraz niszcząc ikony i ołtarze."
 protestantism_events.34.a: "Ukarzmy sprawców."
 protestantism_events.34.b: "Napraw i odbuduj zniszczone kościoły"
 iconoclast_riot: "Zamieszki ikonoklastów"
 desc_iconoclast_riot: "Buntownicy zniszczyli w tej prowincji ołtarze, obrazy i malowane okna, chcąc wykorzenić to, co uznają za bałwochwalstwo w naszym Kościele państwowym."
 protestantism_events.35.t: "Charyzmatyczny kaznodzieja-patriota w państwie [Root.GetName]"
 protestantism_events.35.d: "Region [Root.GetName] jest pełen niewielkich kościołów protestanckich, które odrzucają ideę scentralizowanego, dogmatycznego Kościoła.\nZyskał tu rozgłos wpływowy kaznodzieja. Jego kazania jednoczą miejscowe wspólnoty i umacniają ich determinację, by zachować niezależność od Kościoła dawnej ojczyzny."
 protestantism_events.35.a: "Doskonale."
 protestantism_events.35.b: "Zróbmy, co w naszej mocy, by ograniczyć jego wpływy."
 patriot_preacher: "Kaznodzieja-patriota"
 desc_patriot_preacher: "Charyzmatyczny kaznodzieja w tej prowincji nawołuje do uzyskania pełnej wolności religijnej od naszej ojczyzny."
 colonial_religious_tensions: "Napięcia religijne"
 desc_colonial_religious_tensions: "W tej prowincji panuje wysokie napięcie z powodu agitacji na rzecz kilku sprzecznych ze sobą wyznań."
 loyalist_preacher: "Kaznodzieja-lojalista"
 desc_loyalist_preacher: "Charyzmatyczny kaznodzieja w tej prowincji nawołuje do poparcia Kościoła państwowego naszej ojczyzny."
 protestantism_events.36.t: "Napięcia religijne w państwie [Root.GetName]"
 protestantism_events.36.d: "Wskutek polityki naszej ojczyzny, polegającej na wysyłaniu heretyków religijnych do kolonii, w naszych osadach można spotkać wiele różnych wyznań. Wszystkie można uznać za protestanckie w takiej czy innej formie, lecz ich poglądy w wielu kwestiach są często skrajnie odmienne. Prowincję [Root.GetName] zasiedliły liczne grupy należące do dwóch teologicznie przeciwnych Kościołów: jeden jest bliższy europejskim Kościołom reformowanym, drugi zaś protestanckim Kościołom państwowym. Obie grupy są jednak równie niechętne kontroli ze strony Kościoła państwowego, który opuściły. Napięcie jest wysokie i najlepiej będzie rozdzielić je już teraz, zanim sytuacja wymknie się spod kontroli."
 protestantism_events.36.a: "Po co rozróżniać heretyków? Niech kłócą się, jeśli mają na to ochotę."
 protestantism_events.36.b: "Przekonajmy stronnictwo reformowane do przeniesienia się na inne ziemie."
 protestantism_events.36.c: "Przekonajmy stronnictwo protestanckie do przeniesienia się na inne ziemie."
 protestantism_events.37.t: "Charyzmatyczny kaznodzieja-lojalista w państwie [Root.GetName]"
 protestantism_events.37.d: "Pomimo mnogości wyznań protestanckich na tych ziemiach mieszkańcy państwa [Root.GetName] pozostają wierni Kościołowi państwowemu naszej ojczyzny. Niedawne pojawienie się charyzmatycznego kaznodziei, który występuje przeciwko tym, którzy chcieliby zerwać więzi z tym Kościołem, jeszcze bardziej umocniło lojalność ludności [Root.GetName]."
 protestantism_events.37.a: "Doskonale."
 protestantism_events.37.b: "Musimy zrobić, co w naszej mocy, by zaszczepić tym ludziom wartość wolności."
 protestantism_events.38.t: "Napięcia religijne w państwie [Root.GetName]"
 protestantism_events.38.d: "Niewielu ludzi kusi obietnica nowego życia w koloniach tak bardzo, jak dysydentów religijnych. W rezultacie nasze ziemie zamieszkują liczne wspólnoty chrześcijańskie. Dzięki ogromnym obszarom dostępnych do zasiedlenia ich współistnienie nie stanowi tak wielkiego problemu, jak w ojczyźnie.\nNie obywa się jednak bez lokalnych konfliktów i wygląda na to, że wieści o niektórych z nich dotarły już do kraju. Otrzymaliśmy z ojczyzny rozkazy, by uważniej przyglądać się tym, którzy domagają się wolności religijnej na naszych ziemiach."
 protestantism_events.38.a: "Spróbujmy wymusić większą jednolitość z Kościołem państwowym."
 protestantism_events.38.b: "To problem wyłącznie samego Kościoła państwowego."
 protestantism_events.39.t: "Napięcia religijne w państwie [From.GetName]"
 protestantism_events.39.d: "Wielu heretyków z naszych ziem postanowiło osiedlić się w koloniach. Przeważnie przynosi to korzyści zarówno nam, jak i koloniom, lecz ostatnio dotarły do nas wieści o nadmiernym wykorzystywaniu przez niektóre grupy swobód religijnych, jakie zapewnia życie kolonialne. Przedstawiciele Kościoła państwa [Root.GetName] uważają, że musimy działać, zanim kolonie zainspirują heretyków również w ojczyźnie."
 protestantism_events.39.a: "Spróbujmy umocnić kontrolę Kościoła państwowego nad koloniami."
 protestantism_events.39.b: "To, co nasi poddani robią na innym kontynencie, nie powinno nas obchodzić."
 protestantism_events.40.t: "Państwo postrzegane jako obrońca czarownic"
 protestantism_events.40.d: "Nasze próby powściągnięcia coraz bardziej paranoicznego polowania na czarownice w państwie [From.GetName] zostały tam całkowicie opacznie zrozumiane przez miejscową ludność. Nasi wysłannicy sami zostali oskarżeni o czary, a część mieszkańców stała się wrogo nastawiona do każdej obcej władzy próbującej chronić czarownice, które rzekomo nawiedzają ten region."
 protestantism_events.40.a: "Rozumiem."
 protestantism_events.41.t: "Polowanie na czarownice wymyka się spod kontroli"
 protestantism_events.41.d: "Najbardziej przerażające historie dotarły do nas z trwających na wsi procesów czarownic. W ciągu jednego dnia osądzono i zabito ponad 70 kobiet, a poszukiwania kolejnych trwają i nie poprzestaną. Lokalne władze nie zwróciły się do nas o opinię w tej sprawie. Liczba ofiar śmiertelnych i utrata władzy centralnej prawdopodobnie na zawsze odcisną piętno na regionie. Przywódcy naszego Kościoła Państwowego w mieście [Root.Capital.GetCapitalName] wydają się być tak samo bezsilni jak wszyscy inni, aby to powstrzymać."
 protestantism_events.41.a: "Musimy powstrzymać to szaleństwo!"
 protestantism_events.41.b: "Oni wykonują bożą wolę!"
 protestantism_events.42.t: "Śmierć Następcy"
 protestantism_events.42.d: "Śmierć następcy jest zawsze smutnym wydarzeniem, ale w głębi ducha najwyżsi hierarchowie Kościoła [Root.GetName] przyjęli tę wiadomość z pewną ulgą. Teraz nie muszą się już martwić o władcę, w którego głowie lgną się katolickie idee.."
 protestantism_events.42.a: "Rozumiem."
 prot_witch_trials: "Procesy o czary"
 desc_prot_witch_trials: "Obecnie na tym obszarze trwają poszukiwania czarownic, a lokalne władze osądzają i potępiają wszystkie czarownice, które się pojawią. W miarę jak sytuacja staje się coraz bardziej napięta, lokalna gospodarka zaczyna cierpieć z powodu niepewności i zakłóceń spowodowanych zarówno plotkami, jak i ogólnym strachem, a także śmiercią wielu osób ze wszystkich grup społecznych."
 escalated_witch_trials: "Nasilone polowania na czarownice"
 desc_escalated_witch_trials: "Procesy o czary na tym obszarze wymknęły się spod kontroli, zamieniając się w ślepą nagonkę, w której każdy może paść ofiarą oskarżeń i stanąć w obliczu śmierci. Region jest pochłonięty przez paranoję, a lokalne społeczeństwo z tego powodu bardzo cierpi. Kościół państwowy ma tu niewielką władzę, ponieważ lokalni kaznodzieje i sędziowie szybko decydują o tym, kto przeżyje, a kto umrze."
 prot_stopped_witch_trials: "Powstrzymano procesy o czary"
 desc_prot_stopped_witch_trials: "Liczne procesy o czary na tym obszarze groziły rozbiciem lokalnej społeczności — sąsiedzi zaczęli donosić na siebie nawzajem. Władze jednak wkroczyły do akcji i podjęły próbę opanowania sytuacji. Choć nie wszyscy są zadowoleni z takiego rozwiązania, napięcia zdają się słabnąć."
 custodian_of_the_two_holy_mosques: "Opiekun Świętych Miast"
 desc_custodian_of_the_two_holy_mosques: "Kontrolujemy Mekkę i Medynę, a wraz z nimi najświętsze sanktuaria w świecie islamu."
 organised_through_bishops_aspect: "Organizacja za pośrednictwem biskupów"
 desc_organised_through_bishops_aspect: "Biskupi byli kiedyś przywódcami jednego kościoła, ograniczonego do obszaru miejskiego. Obecnie przewodzą kościołom na większym obszarze i nie służą już poszczególnym zborom. Kapłani są wyznaczani do obsługi każdej kongregacji i działają jako delegaci biskupa.\n\nZyskamy również §G-10%§! do kosztu budowy przez §Y10§! lat."
 priests_may_marry_aspect: "Zezwolenie kapłanom na małżeństwo"
 desc_priests_may_marry_aspect: "Cesarz Justynian I uznał wszystkie małżeństwa zawarte przez duchownych mających święcenia kapłańskie za nieważne, a dzieci z takich małżeństw za nieślubne. Kapłani zawsze, mniej lub bardziej nielegalnie, mieszkali ze swoimi żonami i zakładali rodziny, chociaż oczekuje się od nich celibatu. Zezwalając księżom na zawieranie małżeństw, przypieczętowujemy aprobatę dla małżeństw duchownych i potępiamy śluby celibatu na gruncie biblijnym.\n\nZyskamy również §G+1§! tolerancji dla Prawdziwej Wiary na §Y10§! lat."
 adult_baptism_aspect: "Chrzest dorosłych"
 desc_adult_baptism_aspect: "Chrzest dorosłych, udzielany na podstawie wyznania wiary w Jezusa Chrystusa i jako przyjęcie do lokalnej wspólnoty wiernych, praktykują ci, którzy uważają, że łaska zbawienia i członkostwo w Kościele są darami od Boga. Wiara osoby przyjmującej chrzest musi zostać wyrażona osobiście i nie może być jej przekazana ani przeniesiona przez inną osobę. \n\n Otrzymamy również §G+10%§! siły ludzkiej w prowincjach prawdziwej wiary na §Y10§! lat."
 holy_sacraments_aspect: "Święte sakramenty"
 desc_holy_sacraments_aspect: "Siedem sakramentów to obrzędy będące skutecznymi znakami łaski, ustanowione przez Chrystusa i powierzone Kościołowi, za pośrednictwem których udzielane jest nam życie Boże. Święte sakramenty to: chrzest, bierzmowanie lub chrystianizacja, Eucharystia, pokuta, namaszczenie chorych, święcenia kapłańskie i małżeństwo. \n\n Otrzymamy również §G+5%§! obrażeń zadawanych morale na §Y10§! lat."
 saints_accept_prayers_aspect: "Święci przyjmują modlitwy"
 desc_saints_accept_prayers_aspect: "Wstawiennictwo świętych, czyli możliwość proszenia ich o modlitwę i wstawianie się za innymi, jest doktryną popieraną przez nasz Kościół. \n\n Otrzymamy również §G+100%§! tradycji armii z bitew na §Y10§! lat."
 icons_images_aspect: "Ikony"
 desc_icons_images_aspect: "Wizerunki Jezusa, Maryi, świętych i aniołów, odlewane w metalu, rzeźbione w kamieniu, wyszywane na tkaninach, malowane na drewnie lub wykonywane na wiele innych sposobów, często są zdobione. Ikony były przedmiotem sporów i sprzeciwu, lecz ich popularność zapewniła im przetrwanie, a Kościół ostatecznie pogodził się z zezwoleniem na ich kult. \n\n Otrzymamy również §G-10%§! kosztu doradców z kultury władcy na §Y10§! lat."
 legalised_divorces_aspect: "Legalizacja rozwodów"
 desc_legalised_divorces_aspect: "Władze kościelne orzekały o unieważnieniu małżeństw, dopóki nie zaczęto uważać ich za umowy cywilne. Władze świeckie mogą orzec „divortium a vinculo matrimonii”, czyli rozwód rozwiązujący wszystkie więzi małżeńskie, a tym samym zakończyć związek. \n\n Otrzymamy również §G+10%§! przyrostu postępu reform na §Y10§! lat."
 heretics_deported_aspect: "Wypędzanie heretyków"
 desc_heretics_deported_aspect: "Egzekucje heretyków sprzeciwiających się naszemu Kościołowi w kwestiach wiary lub poglądów uznanych za heretyckie zastępujemy deportacją osób winnych tego grzechu. \n\n Otrzymamy również §G+10%§! szansy na osadników na §Y10§! lat."
 parish_registers_aspect: "Rejestry parafialne"
 desc_parish_registers_aspect: "Szczegóły dotyczące chrztów, małżeństw i pogrzebów będą odtąd zapisywane w księdze parafialnej. Każdy proboszcz będzie prowadził księgę, w której będzie rejestrował te wydarzenia, i przechowywał ją w bezpiecznej skrzyni zamykanej na cztery spusty.\n\nZyskamy również §G-0,10%§! rocznej korupcji przez §Y10§! lat."
 individual_creeds_aspect: "Indywidualne wyznania wiary"
 desc_individual_creeds_aspect: "Akceptacja i większa tolerancja dla wolnomyślicielstwa, które pozwala ludziom samodzielnie kształtować opinie i przekonania religijne, prowadzi do wzrostu poziomu technologicznego.\n\nZyskamy również §G+2§! dostępnych doradców przez §Y10§! lat."
 allow_usury_aspect: "Zezwolenie na lichwę"
 desc_allow_usury_aspect: "Pożyczki pieniężne z odsetkami, które wzbogacają wierzyciela, są teraz dozwolone i nie są już uznawane za grzeszne.\n\nZyskamy również §G-0,5%§! rocznych odsetek przez §Y10§! lat."
 translated_bibles_aspect: "Przekłady Biblii"
 desc_translated_bibles_aspect: "Tłumaczenie Biblii na inne języki zapewnia ludziom najlepsze źródło wiedzy o Bogu, przemawiające do ich umysłów i serc. \n\n Otrzymamy również §G+25%§! rozprzestrzeniania się instytucji w prowincjach prawdziwej wiary na §Y10§! lat."
 justified_religious_war_aspect: "Uzasadniony konflikt"
 desc_justified_religious_war_aspect: "Nowemu Kościołowi naszego kraju zagrażają zarówno poganie, jak i heretycy. W wojnie o przetrwanie Kościół uzasadni nasze konflikty, odwołując się do Biblii. \n\n Otrzymamy również §G-10%§! kosztu wojennego w wojnach z innymi religiami na §Y10§! lat."
 war_preaches_aspect: "Kazania wojenne"
 desc_war_preaches_aspect: "W czasach konfliktów wiara podtrzymuje nadzieję naszego ludu. Kościół naszego państwa będzie głosił nauki świętej księgi, by podtrzymywać morale ludności nawet w najciemniejszych chwilach. \n\n Otrzymamy również §G-100%§! kosztu podatków wojennych na §Y10§! lat."
 head_of_the_church_aspect: "Głowa Kościoła"
 desc_head_of_the_church_aspect: "Kościół nie podlega już zewnętrznemu, skorumpowanemu teokracie. Wszystkie sprawy religijne będą odtąd kierowane do władcy, który obejmuje urząd nowej głowy Kościoła. \n\n Otrzymamy również §G+1%§! rocznego absolutyzmu na §Y10§! lat."
 organised_through_bishops_aspect_modifier: "Gorliwość religijna"
 desc_organised_through_bishops_aspect_modifier: "Wprowadzenie nowego aspektu naszej wiary zainspirowało lud do życia zgodnie z nowym kodeksem."
 priests_may_marry_aspect_modifier: "Gorliwość religijna"
