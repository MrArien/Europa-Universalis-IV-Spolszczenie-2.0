 enforce_religion_desc: "Zmusisz ich do nawrócenia się na twoją religię (czyli §Y$RELIGION$§!), zmieniając ich dążenia niepodległościowych o $LD$."
 scutage_desc: ""
 scutage_ld: "Zniesienie tarczowego zwiększy ich dążenia niepodległościowe o $VAL$."
 subsidize_armies_desc: "Wysyła §Y$MP$§! twoich miesięcznych zasobów ludzkich do twojej marchii. Zmieni to opinię tego kraju na twój temat o $OPINION$."
