 subject_interaction_events.40.d: "Nasza prawowita ziemia w państwie [rightful_province.GetName] znajduje się pod naszymi rządami. To niestosowna sytuacja i jeśli tak dalej pójdzie, znajdziemy się jeszcze bardziej w ich cieniu. Nie możemy na to pozwolić, musimy odzyskać naszą prawowitą ziemię!"
