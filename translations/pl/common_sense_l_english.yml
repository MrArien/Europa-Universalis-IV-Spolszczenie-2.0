 wedge_throw: "„Rzut klinem”"
 desc_wedge_throw: "Rolnicy w tej prowincji znaleźli się w trudnym położeniu. Aby pomóc im stanąć na nogi, zmniejszyliśmy ich obciążenia podatkowe i udzieliliśmy im trzyletniej pożyczki."
 poor_rice_harvests: "Słabe zbiory ryżu"
 desc_poor_rice_harvests: "Rolnicy w tej prowincji znaleźli się w trudnym położeniu. Ponieważ odmówiliśmy zmniejszenia ich obciążeń podatkowych i udzielenia pożyczek, region wrze z oburzenia na władzę państwową."
 monastaries_blooming: "Rozkwit klasztorów"
 desc_monastaries_blooming: "Mądre decyzje naszego władcy bardzo korzystnie wpłynęły na działalność klasztorów w tym regionie i doprowadziły do ogólnej poprawy sytuacji. Same klasztory są bogate, a mnisi zdyscyplinowani, dzięki czemu cała prowincja prosperuje — od chorych i ubogich po zdrowych i zamożnych."
 gifted_white_elephant: "Podarowany biały słoń"
 cleansing_of_monasteries: "Oczyszczenie klasztorów"
 desc_cleansing_of_monasteries: "Aby poprawić bardzo niski poziom dyscypliny monastycznej w tym regionie, zastosowaliśmy niezwykle surowe i brutalne kary wobec osób łamiących śluby. Takie oczyszczenia bywają konieczne, choć są godne ubolewania. Sytuacja zdaje się powoli poprawiać."
 strict_punishment_of_monks: "Surowe kary dla mnichów"
 desc_strict_punishment_of_monks: "Aby poprawić niski poziom dyscypliny monastycznej w tym regionie, wprowadziliśmy znacznie ściślejszą kontrolę i nałożyliśmy grzywny na krnąbrnych mnichów. Każdy mnich przyłapany na hańbieniu swoich ślubów lub zakonu będzie musiał przekazać państwu znaczną liczbę sztuk bydła."
 lacking_monastic_discipline: "Niski poziom dyscypliny monastycznej"
 desc_lacking_monastic_discipline: "Brak dyscypliny w klasztorach tego regionu jest powszechnie znany. W rezultacie obszar ten cierpi zarówno gospodarczo, jak i duchowo. Władza świecka ma obowiązek ograniczać takie nadużycia w klasztorach, lecz tym razem zawiodła."
 forced_labor: "Roboty przymusowe"
 desc_forced_labor: "Zmusiliśmy rolników z okolicznych prowincji do pomocy w rozwoju tej prowincji dla wspólnego dobra."
 human_sacrifice: "„Ofiara z ludzi”"
 desc_human_sacrifice: "Poprosiliśmy rolników z okolicznych prowincji o pomoc w rozwoju tego obszaru, oferując im rekompensatę za utracone dochody."
 bountiful_harvest: "Obfite żniwa"
 desc_bountiful_harvest: "Po wyjątkowo obfitych zbiorach żywność jest tania, a nasze spichlerze pełne."
 political_rival_crushed: "Pokonano rywala politycznego"
 desc_political_rival_crushed: "Wykorzystaliśmy krótką serię niepowodzeń jednego z naszych politycznych rywali. Został teraz przechytrzony do tego stopnia, że prawdopodobnie już nigdy nie będzie stanowił problemu. Inni obserwowali nasze działania i dwa razy się zastanowią, zanim w przyszłości spróbują podważyć władzę państwową."
 hostile_monastery: "Wrogi klasztor"
 desc_hostile_monastery: "Mnisi w tej prowincji są otwarcie wrogo nastawieni do państwa i jego władcy z powodu postępowania, które uznają za rażące nadużycie ze strony rządzącego."
 social_bandit: "Ludowy banita"
 desc_social_bandit: "Niezwykle skuteczna banda rozbójników nęka ten region i wymyka się oddziałom państwowym. Dzięki swoim sukcesom sama banda, a zwłaszcza jej przywódca, zdobyła popularność nawet poza najbliższą okolicą. Nie wiadomo, czy ich cele rzeczywiście mają podłoże ideologiczne, lecz zaczęli stawać się symbolem oporu przeciwko władzy centralnej i autorytetowi państwa."
 social_bandit_local_search: "Ludowy banita"
 desc_social_bandit_local_search: "Niezwykle skuteczna banda rozbójników nęka ten region i wymyka się oddziałom państwowym. Dzięki swoim sukcesom sama banda, a zwłaszcza jej przywódca, zdobyła popularność nawet poza najbliższą okolicą. Nie wiadomo, czy ich cele rzeczywiście mają podłoże ideologiczne, lecz zaczęli stawać się symbolem oporu przeciwko władzy centralnej i autorytetowi państwa."
 upset_theravada_monks: "Urażony zakon monastyczny"
 desc_upset_theravada_monks: "Wskutek sporu z orzeczeniem naszego władcy w sprawie dotyczącej zakonu bardzo wpływowy miejscowy zakon monastyczny jest obecnie wyraźnie wrogo nastawiony."
 pleased_theravada_nobles: "Zadowolona miejscowa arystokracja"
 desc_pleased_theravada_nobles: "Korzystne dla naszego władcy rozstrzygnięcie sporu prawnego sprawiło, że wpływowa rodzina z tego regionu darzy go wielką przychylnością."
 pleased_theravada_monks: "Zadowolony zakon monastyczny"
 desc_pleased_theravada_monks: "Korzystne dla naszego władcy rozstrzygnięcie sporu prawnego sprawiło, że miejscowy klasztor w tym regionie darzy go wielką przychylnością."
 upset_theravada_nobles: "Urażona miejscowa arystokracja"
 desc_upset_theravada_nobles: "Wskutek sporu z orzeczeniem naszego władcy w sprawie dotyczącej wpływowej rodziny z tego regionu jest ona obecnie wyraźnie wrogo nastawiona."
 regulate_the_monastaries_title: "Ureguluj działalność klasztorów"
 regulate_the_monastaries_desc: "Duchowe bogactwo najważniejszych klasztorów naszego kraju jest nieustannym atutem dla władcy, lecz klasztory te mają również skłonność do popadania w korupcję i rozluźniania dyscypliny. Musimy ograniczyć nadużycia mnichów i stworzyć zbiór surowych praw, przewidujących dotkliwe kary dla tych, którzy nie wypełniają obowiązków — zarówno pojedynczych mnichów, jak i całych zakonów."
 regulated_monasteries: "Uregulowane prawo monastyczne"
 desc_regulated_monasteries: "Stworzyliśmy stanowczy i surowy zbiór praw, by zapewnić dyscyplinę zakonom monastycznym w naszym kraju. Na tych, którzy uchybiają obowiązkom przywódców duchowych — zarówno pojedynczych mnichów, jak i całe zakony — czekają dotkliwe kary."
 invite_lama_title: "Zaproś lamę do osiedlenia się w naszym kraju"
 invite_lama_desc: "Powinniśmy zaprosić potężnego lamę do osiedlenia się w naszej stolicy. Otaczając opieką tego człowieka i jego przyszłe wcielenia, możemy stworzyć trwałe dziedzictwo naszej dynastii."
 vajrayana_lama: "Lama"
 desc_vajrayana_lama: "Potężny lama osiedlił się w naszej stolicy i zawarł sojusz z naszymi władcami."
 influx_of_tibetan_monks: "Napływ tybetańskich mnichów"
 desc_influx_of_tibetan_monks: "Delegacja tybetańskich mnichów przybyła na te ziemie, by szerzyć buddyzm tutaj oraz we wszystkich zakątkach naszego kraju."
 vajrayana_great_monastery: "Wielki klasztor"
 desc_vajrayana_great_monastery: "W tej prowincji znajduje się jeden z największych klasztorów naszego kraju. Choć przekazanie tak dużej części ziemi innemu podmiotowi zawsze stanowi obciążenie finansowe dla państwa, bogata i prężnie rozwijająca się wspólnota mnichów przyczynia się do rozwoju prowincji."
 adopt_vajrayana_title: "Przyjmij buddyzm wadżrajany"
 adopt_vajrayana_desc: "Religia Tybetu jest potężnym narzędziem, a buddyzm był niegdyś wspierany przez wielkie imperia. Nawróćmy nasz kraj na tę potężną nową religię i poznajmy wartość pokoju oraz dyscypliny."
 destruction_of_idols: "Niszczenie bożków"
 desc_destruction_of_idols: "Kampania niszczenia pogańskich bożków w naszym kraju nie przysparza nam przyjaciół wśród zagorzałych zwolenników dawnej religii, lecz znacznie przyspiesza nawracanie pogan, nawet jeśli szczerość niektórych z nich może budzić wątpliwości."
 hampered_growth: "Zahamowany rozwój"
 desc_hampered_growth: "Prowincja rozwijała się szybciej, niż pozwalała na to jej infrastruktura. W rezultacie narastają napięcia społeczne."
 improvement_program: "Rozbudowa infrastruktury"
 desc_improvement_program: "Aby wesprzeć szybki rozwój tej prowincji, dostarczono jej dodatkową żywność i zmniejszono obciążenia podatkowe."
