 siphon_income_desc: "Pobierz $VAL$ ich rocznego przychodu ($AMOUNT$), co pogorszy wasze stosunki o $OPINION$ i zwiększy ich dążenia niepodległościowe o $LD$."
 support_loyalists_desc: ""
 send_officers_desc: "Wysyła do nich oficerów i instruktorów wojskowych, co będzie nas kosztowało $VAL$ (obecnie $AMOUNT|Y$¤ miesięcznie) utrzymania ich armii. Zmieni to ich dążenia niepodległościowe o $LD$."
 divert_trade_desc: "Poddany musi oddać ci $VAL$ swojej siły handlowej. Zmienia dążenia niepodległościowe o $LD$."
 seize_territory_desc: "Wymusza przekazanie ci jednej z ich prowincji w zasięgu unarodowienia. To ich rozgniewa."
 seize_territory_desc3: ""
 start_colonial_war_desc: "Twoje państwo kolonijne rozpocznie wojnę z innym państwem kolonijnym lub tubylcami. Musisz wybrać jeden z dostępnych dlań casus belli."
 start_colonial_war_desc2: "Kraj §Y$SUBJECT$§! wypowie wojnę z tytułu §Y$CB$§! krajowi §Y$TARGET$§!."
