 subject_interaction_events.1.t: "Pretendent do tytułu [Root.Monarch.GetTitle] podnosi bunt"
 subject_interaction_events.1.d: "Poprzedni, obecnie obalony władca państwa [Root.Country.GetName] miał liczną rodzinę i przynajmniej jeden z jej członków uważa, że ma większe prawa do tronu państwa [Root.Country.GetName] niż [Root.Monarch.GetTitle] [Root.Monarch.GetName]. Udało mu się zgromadzić pokaźne grono zwolenników i teraz maszeruje w kierunku [Root.Capital.GetName], zamierzając osadzić na tronie „prawowitego” [Root.Monarch.GetTitle]."
 subject_interaction_events.1.a: "Poprośmy o pomoc suwerena."
 subject_interaction_events.1.b: "Rozwiążmy ten problem samodzielnie."
 subject_interaction_events.2.t: "Kraj [From.Country.GetName] prosi o pomoc"
 subject_interaction_events.2.d: "Armia rebeliantów dowodzona przez pretendenta maszeruje w kierunku stolicy [From.Country.GetAdjective] mieście [From.Capital.GetName]! Członkowie rodziny obalonego monarchy [From.Country.GetAdjective] zdołali zebrać dość dużą grupę zwolenników i teraz próbują zdetronizować [From.Monarch.GetRulerGen] [From.Country.GetAdjective]."
 subject_interaction_events.2.a: "Wyślij im złoto i żołnierzy."
 subject_interaction_events.2.b: "Będą musieli sami sobie z tym poradzić."
 subject_interaction_events.3.t: "Pomoc przybywa?"
 subject_interaction_events.3.d: "Buntownicy popierający pretendenta zbliżają się do nas, a posłaniec wysłany do [From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.Country.GetName] powinien wkrótce wrócić. Jeśli dopisze nam szczęście, być może przywiezie żołnierzy i złoto z państwa [From.Country.GetName], które pomogą nam odeprzeć tych przeklętych buntowników!"
 subject_interaction_events.3.a: "[From.Monarch.GetName] z państwa [From.Country.GetName] przysłał nam złoto i żołnierzy!"
 subject_interaction_events.3.b: "[From.Monarch.GetName] odmówił udzielenia nam pomocy!"
 subject_interaction_events.4.t: "Niekompetentny kuzyn w państwie [incompetent_cousin_country.GetName]"
 subject_interaction_events.4.d: "Nasz ukochany kuzyn, który rządzi naszym państwem podległym [incompetent_cousin_country.GetName], okazał się niekompetentnym błaznem, niezdolnym i niegodnym sprawowania władzy nad jakimkolwiek krajem."
 subject_interaction_events.4.a: "Spróbujmy znaleźć lepszego władcę dla państwa [incompetent_cousin_country.GetName]."
 subject_interaction_events.4.b: "To może jedynie doprowadzić do nieładu w kraju. Zostawmy sprawę w spokoju."
 subject_interaction_events.5.t: "Kompetentny kuzyn"
 subject_interaction_events.5.d: "Przeprowadzono reformy, zwolniono bezużytecznych ministrów i doradców, armia i marynarka nigdy nie miały się lepiej... Wygląda na to, że nasz kuzyn dobrze służy naszemu wasalowi, rządząc twardą ręką i podejmując kompetentne decyzje."
 subject_interaction_events.5.a: "Jeśli kiedykolwiek mieliśmy wątpliwości, to już dawno o nich zapomnieliśmy."
 subject_interaction_events.6.t: "Kuzyn rości sobie prawa do tronu państwa [Root.Country.GetName]"
 subject_interaction_events.6.d: "Nasza słaba kontrola nad tronem państwa [Root.Country.GetName] wzmocniła roszczenia naszego kuzyna, a ten drań twierdzi, że to jemu należy się korona! Moglibyśmy łatwo go obalić, lecz dla zachowania pokoju lepiej byłoby przekupić go, by wycofał swoje roszczenia."
 subject_interaction_events.6.a: "Obalmy naszego kuzyna!"
 subject_interaction_events.6.b: "Spróbujmy go przekupić."
 subject_interaction_events.7.t: "Niewłaściwe wykorzystanie siły ludzkiej"
 subject_interaction_events.7.d: "Siła ludzka, którą wysłaliśmy do naszego państwa podległego, została wykorzystana w sposób, jakiego nigdy byśmy się nie spodziewali! Ludzi zmuszono do budowania dróg i budynków, sprzątania placów miejskich z odpadków i śmieci, a ani razu nie zobaczyli pola bitwy. Drogi są wprawdzie szersze i lepsze niż wcześniej, budynki solidniejsze, a place miejskie nieskazitelnie czyste, ale przecież nie do tego mieli służyć ci ludzie!"
 subject_interaction_events.7.a: "Powiedzmy im, jak właściwie wykorzystywać siłę ludzką!"
 subject_interaction_events.7.b: "Wykazali się zaradnością. Należą im się pochwały!"
 subject_interaction_events.8.t: "Zaradność czy nagana"
 subject_interaction_events.8.d: "[From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.Country.GetName] przysłał nam siłę ludzką i dofinansował naszą armię, lecz w tych spokojnych czasach nie potrzebowaliśmy żołnierzy. Zamiast pozwalać im bezczynnie trenować, jeść i spać, znaleźliśmy dla nich zajęcie. Budowali drogi i budynki, sprzątali place miejskie z odpadków i śmieci oraz wykonywali inne pożyteczne prace, które w przeciwnym razie wymagałyby więcej czasu i pieniędzy, niż ma państwo [Root.Country.GetName]."
 subject_interaction_events.8.a: "[From.Monarch.GetTitle] [From.Monarch.GetName] uważa, że zmarnowaliśmy siłę ludzką."
 subject_interaction_events.8.b: "[From.Monarch.GetTitle] [From.Monarch.GetName] pochwalił naszą zaradność."
 subject_interaction_events.9.t: "Zagrożenie ze strony obcej siły ludzkiej"
 subject_interaction_events.9.d: "Od kiedy nasz suweren zaczął dofinansowywać armię, nie brakuje nam siły ludzkiej, lecz przybycie nowych żołnierzy wywołało wiele problemów. Ich kultura, język, tradycje, a czasem nawet religia różnią się od naszych, co powoduje liczne trudności. Są mniej zdyscyplinowani lub po prostu odmawiają wykonywania rozkazów naszych generałów."
 subject_interaction_events.9.a: "Odeślijmy ich tam, skąd przybyli."
 subject_interaction_events.9.b: "Spróbujmy nauczyć ich właściwego zachowania."
 subject_interaction_events.10.t: "Siła ludzka sieje zamęt w państwie [From.Country.GetName]"
 subject_interaction_events.10.d: "Współpraca ludzi z różnych kultur, posługujących się odmiennymi językami, kierujących się innymi tradycjami, a czasem nawet wyznających różne religie, zawsze prowadzi do problemów. Żołnierze, których wysłaliśmy do państwa [From.Country.GetName], sprawili więcej kłopotów, niż [From.Monarch.GetTitle] [From.Monarch.GetName] był skłonny tolerować. W rezultacie część z nich odesłano do nas."
 subject_interaction_events.10.a: "Nasi ludzie potrafią wykonywać rozkazy. [From.Monarch.GetName] nie postarał się wystarczająco!"
 subject_interaction_events.11.t: "Żołnierze maszerują na żołądkach"
 subject_interaction_events.11.d: "Żywność, broń, odzież i wszelkiego rodzaju wyposażenie są niezbędne, by nasze armie zwyciężały w każdej bitwie. Ostatni napływ siły ludzkiej pozwolił nam jednak zaciągnąć więcej żołnierzy, niż jesteśmy w stanie utrzymać."
 subject_interaction_events.11.a: "Poprośmy suwerena o więcej pieniędzy na utrzymanie wojska."
 subject_interaction_events.11.b: "Rozwiążmy problem w inny sposób."
 subject_interaction_events.12.t: "Potrzeby państwa [From.Country.GetName] w zakresie utrzymania wojska"
 subject_interaction_events.12.d: "Każdy przyzwoity żołnierz potrzebuje żywności, broni, odzieży i innego wyposażenia, by jak najlepiej służyć ziemi, która wydaje mu rozkazy. Państwo [From.Country.GetName] zna swoje ograniczenia w zapewnianiu tych rzeczy żołnierzom, których może zaciągnąć, i poprosiło nas o niewielkie wsparcie, by mogło utrzymać przekazaną mu przez nas siłę ludzką."
 subject_interaction_events.12.a: "Wyślij im generała."
 subject_interaction_events.12.b: "Potrzebują dobrego doradcy."
 subject_interaction_events.12.c: "Poślij więcej żołnierzy i złota."
 subject_interaction_events.12.e: "Mają wszystko, czego potrzebują, więcej im nie damy."
 subject_interaction_events.13.tt1: "Wysłano generała do kraju [From.Country.GetName]"
 subject_interaction_events.13.tt2: "Wysłano doradcę do kraju [From.Country.GetName]"
 subject_interaction_events.13.tt3: "Wysłano więcej złota i zasobów ludzkich do kraju [From.Country.GetName]"
 subject_interaction_events.13.tt4: "Nic nie wysłano do kraju [From.Country.GetName]"
 subject_interaction_events.13.t: "Państwo [From.Country.GetName] odpowiada na żądanie wsparcia"
 subject_interaction_events.13.d: "Wątpiliśmy, że [From.Monarch.GetTitle] [From.Monarch.GetName] z państwa [From.Country.GetName] przekaże nam jakiekolwiek środki na utrzymanie armii, lecz mimo to mieliśmy nadzieję na pomoc, która naprawdę poprawiłaby naszą sytuację. Generał, doradca, a może nawet więcej złota i siły ludzkiej? Co, jeśli w ogóle cokolwiek, otrzymamy?"
 subject_interaction_events.13.a: "Kraj [From.Country.GetName] wysłał generała."
 subject_interaction_events.13.b: "Kraj [From.Country.GetName] wysłał doradcę."
 subject_interaction_events.13.c: "Kraj [From.Country.GetName] wysłał złoto i zasoby ludzkie."
 subject_interaction_events.13.e: "Kraj [From.Country.GetName] nic nie wysłał."
 subject_interaction_events.14.t: "Embarga i przemytnicy"
 subject_interaction_events.14.d: "Niedawne embarga nałożone na rywali naszego suwerena mogą doprowadzić nas do finansowej ruiny. Na szczęście w państwie [Root.Country.GetName] są szanowane osoby, które chętnie pomogą nam rozwiązać problemy handlowe. Nazywanie tak niewielkiego przedsięwzięcia „przemytem” może wydawać się przesadą, lecz właśnie tym ono jest. Ponieważ możemy w ten sposób łamać niektóre embarga nałożone na nas przez suwerena, prawdopodobnie nie będzie on zadowolony z naszego postępowania."
 subject_interaction_events.14.a: "Taka okazja rzadko się zdarza. Musimy ją przyjąć!"
 subject_interaction_events.14.b: "Nie warto ryzykować gniewu naszego suwerena."
 subject_interaction_events.14.ct: "Istnieje niewielka szansa, że nasz suweren zauważy tę działalność."
 subject_interaction_events.15.t: "Przemytnicy naszego wasala"
 subject_interaction_events.15.d: "Embarga nałożone na naszych rywali nie przynoszą tak dobrych rezultatów, jak oczekiwaliśmy. Jednym z powodów może być fakt, że jeden z naszych wasali nadal z nimi handluje! Przemycają towary w obie strony, niwecząc nasze cele i sprawiając, że wyglądamy na słabych. Skala przemytu jest niewielka, lecz może wyrządzić nam poważne szkody.\nZ drugiej strony wpływowe środowiska biznesowe są gotowe zapłacić za przymykanie oka na ten proceder."
 subject_interaction_events.15.a: "Natychmiast nakażmy im zaprzestanie przemytu!"
 subject_interaction_events.15.b: "Mogą kontynuować tę niewielką działalność."
 subject_interaction_events.16.tt1: "Nasz wasal otrzymuje żądanie zaprzestania przemytu"
 subject_interaction_events.16.tt2: "Nasz wasal otrzymuje żądanie ograniczenia skali przemytu"
 subject_interaction_events.16.t: "Przyłapani!"
 subject_interaction_events.16.d: "Państwo [From.Country.GetName] ujawniło naszą operację przemytniczą. Przemytników dosłownie przyłapano na gorącym uczynku podczas rozładunku towarów przeznaczonych dla jednego z rywali państwa [From.Country.GetName]. Tchórze wyznali wszystko, nawet od jak dawna trwał ten proceder."
 subject_interaction_events.16.a: "Zmuszają nas do zaprzestania przemytu!"
 subject_interaction_events.16.b: "Jeśli zachowamy niewielką skalę, możemy kontynuować."
 subject_interaction_events.17.t: "Wojna nigdy się nie zmienia"
 subject_interaction_events.17.d: "W zamian za spokój nasi wasale są zobowiązani płacić suwerenowi wyższe daniny. Nie są wzywani do żadnej z naszych wojen, co uważamy za korzystny układ — za trochę złota zostają wyłączeni z niemal wszystkich konfliktów. Jeden z wasali zastanawia się jednak, czy nie lepiej byłoby uczestniczyć w wojnach zamiast płacić, jak to określa, „absurdalnie wysokie sumy”."
 subject_interaction_events.17.a: "Niewdzięczni idioci!"
 subject_interaction_events.18.t: "Korzyści ze skutażu"
 subject_interaction_events.18.d: "Gdy nasze zniszczone wojną ziemie powoli podnoszą się z ruin, zauważyliśmy w oczach ambasadora naszego wasala mieszaninę zrozumienia, strachu i ulgi, że oglądane przez niego ziemie nie należą do niego. „Teraz — mówi — złoto, które płacimy w ramach skutażu, by uniknąć udziału w wojnach, wydaje się niewielką sumą, z którą łatwo możemy się rozstać w zamian za pokój”."
 subject_interaction_events.18.a: "Mówiliśmy im, że to zadziała!"
 subject_interaction_events.19.t: "Niesforni rekruci"
 subject_interaction_events.19.d: "Żołnierze, których wysłaliśmy do jednego z naszych wasali w ramach dofinansowania armii, zbuntowali się! Grożą wybuchem rebelii, jeśli nie wycofamy ich z ziem naszego wasala i nie pozwolimy im wrócić do domu."
 subject_interaction_events.19.a: "Jeśli przymkniemy na to oko, może sami odejdą."
 subject_interaction_events.19.b: "Spróbujmy uspokoić te niesforne oddziały. Pozwólmy im wrócić, jeśli tego właśnie chcą."
 subject_interaction_events.20.t: "Rozrzutni lojaliści"
 subject_interaction_events.20.d: "Płacimy lojalistom, by utrzymywali dążenie do niepodległości w państwie naszego młodszego partnera na niskim i możliwym do opanowania poziomie. Najnowsze raporty zawierają jednak coraz bardziej rozpaczliwe prośby o pieniądze. Środki te muszą być roztrwaniane, zamiast służyć zapewnieniu trwałości unii między naszym krajem a ich państwem!"
 subject_interaction_events.20.a: "Przekonajmy ich, by lepiej planowali miesięczne wydatki."
 subject_interaction_events.20.b: "Wyślij im niewielką sumkę, aby zapewnić sobie ich lojalność."
 subject_interaction_events.21.t: "Kompromitacja lojalistów"
 subject_interaction_events.21.d: "Wszyscy cenimy patriotów i lojalistów — ludzi kochających ojczyznę i gotowych bronić jej za wszelką cenę. Kiedy jednak kompromitują nas przed całym dworem, nasza sympatia do nich gwałtownie maleje. Nie za to im płacimy, nie za to co miesiąc znikają w ich chciwych kieszeniach tak pokaźne sumy! Unia, której staramy się bronić, jest warta więcej niż ich wszawych głów."
 subject_interaction_events.21.a: "Ściąć ich głowy i umieścić na murach [Root.Capital.GetName]!"
 subject_interaction_events.21.b: "Z pewnością możemy znaleźć sposób, by zapomnieć i wybaczyć to niefortunne zdarzenie."
 subject_interaction_events.22.t: "Skuteczni lojaliści"
 subject_interaction_events.22.d: "Pieniądze przekazane lojalistom w jednym z krajów, z którymi łączy nas unia, zostały wykorzystane lepiej, niż mogliśmy sobie wyobrazić i przewidzieć. Dążenie do niepodległości tamtejszej ludności spadło znacznie bardziej, niż sądziliśmy, że to możliwe."
 subject_interaction_events.22.a: "To miła niespodzianka!"
 subject_interaction_events.23.t: "Lojaliści wywołują rebelię"
 subject_interaction_events.23.d: "Kraj połączony z nami unią nawiedziła plaga szaleńców uzbrojonych we wszystko, co zdołali znaleźć. Rozwścieczeni postępowaniem lojalistów chwycili za broń! Zamiast umocnić więź między naszymi państwami, lojaliści zaszkodzili krajowi i doprowadzili do pojawienia się buntowników."
 subject_interaction_events.23.a: "Spróbujmy naprawić wyrządzone przez nich szkody."
 subject_interaction_events.23.b: "Nic nie możemy zrobić."
 subject_interaction_events.24.t: "Okrutne zachowanie nieokrzesanych funkcjonariuszy"
 subject_interaction_events.24.d: "'Wiele małych strumieni tworzy wielką powódź' - przysłowie, które niestety okazało się prawdziwe w naszym protektoracie. Małe wydarzenia, ledwo zauważalne dla nas, ale wielkie zniewagi dla tych, którzy byli ich świadkami lub byli na nie narażeni, wraz ze starszymi narzekaniami i gorzkimi wspomnieniami z czasów, gdy kraj stał się naszym protektoratem, stały się ostatnią kroplą. Godne pożałowania, nie, okrutne zachowanie wysłanych przez nas oficerów doprowadziło do rozłamu i złych relacji między nami a protektoratem."
 subject_interaction_events.24.a: "Musimy nauczyć naszych oficerów, jak stać się dżentelmenami!"
 subject_interaction_events.25.t: "Dżentelmen i oficer"
 subject_interaction_events.25.d: "Kodeks postępowania, który staraliśmy się wpoić wszystkim oficerom, zanim opuścili nasz kraj, aby pracować jako instruktorzy wojskowi w jednym z naszych protektoratów, mógł nie być czasem straconym. Otrzymaliśmy wiadomość, w której pochwalono i wyrażono, jak imponujące jest zachowanie i surowa dyscyplina tych oficerów, a my jako cały kraj powinniśmy być dumni, że udało nam się zrobić dżentelmenów z naszych oficerów."
 subject_interaction_events.25.a: "Nie możemy być bardziej dumni."
 subject_interaction_events.26.t: "Im więcej sprzedajemy, tym więcej siejemy i tym więcej zbieramy"
 subject_interaction_events.26.d: "Kontrolujemy handel naszego protektoratu, a im więcej jego produktów rolnych i wyrobów zdołamy wyeksportować, tym większe stają się zbiory! W jakiś sposób udało nam się zwiększyć zarówno jakość, jak i ilość produkcji, a przy tym podnieść naszą siłę handlową."
 subject_interaction_events.26.a: "Ilość i jakość — właśnie o to chodzi."
 subject_interaction_events.27.t: "Negatywne skutki eksportu"
 subject_interaction_events.27.d: "Kupcy i handlarze z naszych protektoratów ponieśli poważne straty, gdy zdecydowaliśmy się przejąć kontrolę nad ich siłą handlową. Ich skargi na „trudności” wywołane tą polityką handlową dotarły do władcy protektoratu, który przyznał im rację i jasno dał do zrozumienia, że nasze stosunki z jego państwem na tym cierpią."
 subject_interaction_events.27.a: "Dopóki tylko narzekają, nic nas to nie obchodzi."
 subject_interaction_events.28.t: "Rywalizacja rodzeństwa"
 subject_interaction_events.28.d: "Nigdy nie jest przyjemnie patrzeć, jak rodzeństwo się kłóci — a może jednak jest... zwłaszcza gdy tym rodzeństwem są dwa państwa, z których jedno jest protektoratem państwa [Root.Country.GetName]. Być może moglibyśmy pośredniczyć w sporze i spróbować wymusić... wynegocjować między nimi biały pokój?"
 subject_interaction_events.28.a: "Zbadajmy sprawę i podejmijmy mediację."
 subject_interaction_events.28.b: "Bijcie się! Bijcie! Bijcie!"
 subject_interaction_events.29.t: "Kwestionowana legitymizacja"
 subject_interaction_events.29.d: "Choć nasza kontrola nad tronem państwa [Root.Country.GetName] może słabnąć, a nasza prawowitość jest kwestionowana, nasza duma i prestiż ucierpiały, gdy jeden z poddanych publicznie wystąpił przeciwko nam. Twierdzi, że nie mamy prawa próbować nim rządzić, skoro ledwie radzimy sobie z zarządzaniem własnym krajem."
 subject_interaction_events.29.a: "Zgromić ich za publiczne wystąpienie przeciwko nam."
 subject_interaction_events.29.b: "Mogą mieć rację i nie powinno to wpływać na ich opinię o nas."
 subject_interaction_events.30.t: "Dziura zwana bankructwem"
 subject_interaction_events.30.d: "Władca pragnący wszystkiego, co najlepsze w kraju, skarbiec zarządzany przez chciwych i niekompetentnych ludzi, nieudane inwestycje i zbyt wiele pożyczek... Tak właśnie kopie się dół zwany bankructwem. Być może wszystkie te czynniki, a może tylko jeden z nich, sprawiły, że jedno z naszych państw podległych potknęło się i wpadło na samo dno. Możemy pomóc mu wydostać się częściowo z tej dziury, przekazując pieniądze, albo zignorować problem i pozwolić mu radzić sobie samodzielnie."
 subject_interaction_events.30.a: "Zainterweniujmy, wyślijmy im pieniądze i drabinę!"
 subject_interaction_events.30.b: "Sami są sobie winni!"
 subject_interaction_events.31.t: "Kwestia praw"
 subject_interaction_events.31.d: "Nasz wasal posiada obecnie ziemie, do których mamy roszczenia. Gdybyśmy chcieli przejąć tę prowincję dla siebie, bez wątpienia traktowaliby nas z pogardą i nieufnością. Z drugiej strony nie byliby w stanie powstrzymać nas przed przejęciem kontroli nad tym obszarem, gdybyśmy sobie tego życzyli."
 subject_interaction_events.31.a: "Weźmy prowincję."
 subject_interaction_events.31.b: "Zrezygnujmy z roszczenia i prowincji narodowej."
 subject_interaction_events.31.c: "Ta sytuacja nam odpowiada, zostawmy tak jak jest."
