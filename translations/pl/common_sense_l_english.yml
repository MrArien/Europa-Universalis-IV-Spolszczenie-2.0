 subject_interaction_events.41.t: "Prawo własności"
 subject_interaction_events.41.d: "Ostatnio nasi poddani z [From.GetGovNameGen] [From.GetAdjective] uznali za stosowne przypomnieć nam o napięciach spowodowanych posiadaniem przez nas ziemi w państwie [rightful_province.GetName], którą uważają za słusznie należącą do nich. Oddanie im tych ziem pokazałoby, że jesteśmy życzliwą potęgą, jednak takie posunięcie mogłoby nas również osłabić."
