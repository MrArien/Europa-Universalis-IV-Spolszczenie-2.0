 parlaments.23.t: "Domaganie się reprezentacji"
 parlaments.23.d: "Wiele wrogich publikacji zaczęło krążyć w miastach [Root.GetAdjective]. Anonimowi, ale bardzo krytyczni autorzy twierdzą, że nasz rząd jest \"autokratyczny\" i domagają się zarówno pisemnej konstytucji, jak i parlamentu, w którym różne części naszego kraju mogą być reprezentowane."
