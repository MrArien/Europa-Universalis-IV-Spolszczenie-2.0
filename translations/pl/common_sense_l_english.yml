 parlaments.2.t: "Zgniła dzielnica"
 parlaments.2.d: "Ze względu na swoje miejsce parlamencie, [Root.GetName] może pochwalić się sporym wpływem na politykę naszego kraju. Miejsce to jest jednak jedyną rzeczą, która odróżnia ten obszar od znacznie bogatszych części naszego państwa, takich jak prowincja [envious_province.GetName], która patrzy na miasto [Root.GetName] z wielką zazdrością. Jest to coś, z czego zdali sobie sprawę lokalni właściciele ziemscy, a dzięki łapówkom i groźbom, głos z miasta [Root.GetName] jest całkowicie kontrolowany przez kilka skorumpowanych, ale wpływowych osób."
 parlaments.2.a: "Zgnilizna!"
 parlaments.2.a.tt: "To miejsce w parlamencie zmieni od teraz swój schemat głosowania."
 parlaments.2.b: "Musimy zmienić przydział miejsca."
