 free_cities.11.t: "Państwo [From.GetName] prosi o pomoc ze zbuntowaną szlachtą"
 free_cities.11.d: "Doszły nas słuchy, że Wolne Miasto [From.Country.GetName] zmaga się z posiadającą ziemię szlachtą, której nie podoba się status [From.Country.GetAdjective] jako Wolnego Miasta. Państwo prosi nas o pomoc w upomnieniu szlachty i zmuszeniu jej do zaakceptowania świeckiego przywództwa [From.Monarch.GetRulerGen], wolnego od królewskich tytułów i przywilejów."
 free_cities.11.a: "Otrzymają naszą pomoc."
 free_cities.11.b: "Jeśli nie radzą sobie ze swoimi obywatelami, to czy naprawdę nadają się do rządzenia krajem?"
