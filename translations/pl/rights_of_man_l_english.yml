 consort_events.303.t: "Umiejętności dyplomatyczne [Root.GetConsortGen]"
 consort_events.303.da: "Dorastając w mieście [origin_of_consort.GetName], [Root.Consort.GetName] lubił[Root.Consort.GetANoun] studiować ludzi. [Root.Consort.GetSheHeCap] często bawił[Root.Consort.GetANoun] się próbując przewidzieć działania ludzi wokół, uznając to nie tylko za zabawę, ale z biegiem lat coraz bardziej przydatny nawyk. Na szczęście przeprowadzka na dwór królewski [Root.GetAdjective] nie sprawiła, że [Root.Consort.GetName] porzucił[Root.Consort.GetANoun] swojego talentu do intryg. Wręcz przeciwnie, [Root.Consort.GetSheHe] nabrał[Root.Consort.GetANoun] dużo praktyki - podczas niektórych z naszych ostatnich negocjacji z zagranicznymi dyplomatami umiejętności te okazały się bardzo wartościowe dla rady."
 consort_events.303.db: "Dorastając w mieście [origin_of_consort.GetName], [Root.Consort.GetName] lubił[Root.Consort.GetANoun] poznawać świat. [Root.Consort.GetSheHeCap] zawsze zadawał[Root.Consort.GetANoun] pytania i często zastanawiał[Root.Consort.GetANoun] się, jak ułatwić ludziom życie lub jak sprawić, by dane zadanie było bardziej efektywne. A jeszcze lepiej, jak przekonać kogoś innego, że sposób organizacji zadania wymyślony przez ni[Root.Consort.GetAEgo] jest właściwy. Na szczęście przeprowadzka na dwór królewski [Root.GetAdjective] nie sprawiła, że [Root.Consort.GetName] porzucił[Root.Consort.GetANoun] swoje mażenia o dowodzeniu ludźmi. Wręcz przeciwnie, [Root.Consort.GetSheHe] nabrał[Root.Consort.GetANoun] dużo praktyki - podczas niektórych z naszych ostatnich negocjacji z zagranicznymi dyplomatami [Root.Consort.GetHerHis] pomysły otrzymały bardzo pozytywne opinie."
 consort_events.303.dc: "Dorastając w mieście [origin_of_consort.GetName], [Root.Consort.GetName] lubił[Root.Consort.GetANoun] spędzać czas z innymi. [Root.Consort.GetSheHeCap] był[Root.Consort.GetANoun] niezwykle spokojnym dzieckiem, doskonale wyczuwającym uczucia swoich przyjaciół, a nawet każdego, kogo napotkał[Root.Consort.GetANoun]. Ten niemal szósty zmysł podczas interakcji z ludźmi nie tylko sprawił, że [Root.Consort.GetName] stał[Root.Consort.GetANoun] się wysoko cenion[Root.Consort.GetAYm] i poszukiwan[Root.Consort.GetAYm] gościem na kolacji, odkąd [Root.Consort.GetSheHe] przybył[Root.Consort.GetANoun] do miasta [Root.Capital.GetCapitalName] - przełożyło się to również na inne sprawy państwowe. Podczas niedawnego spotkania z zagranicznymi dyplomatami mówi się, że nienaganne taktyki negocjacyjne [Root.GetConsortGen] były główną atrakcją wydarzenia!"
 consort_events.303.dd: "Dorastając, [Root.Consort.GetName] lubił[Root.Consort.GetANoun] studiować ludzi. [Root.Consort.GetSheHeCap] często bawił[Root.Consort.GetANoun] się próbując przewidzieć działania ludzi wokół, uznając to nie tylko za zabawę, ale z biegiem lat coraz bardziej przydatny nawyk. Na szczęście przeprowadzka na dwór królewski [Root.GetAdjective] nie sprawiła, że [Root.Consort.GetName] porzucił[Root.Consort.GetANoun] swojego talentu do intryg. Wręcz przeciwnie, [Root.Consort.GetSheHe] nabrał[Root.Consort.GetANoun] dużo praktyki - podczas niektórych z naszych ostatnich negocjacji z zagranicznymi dyplomatami umiejętności te okazały się bardzo wartościowe dla rady."
 consort_events.303.de: "Dorastając, [Root.Consort.GetName] lubił[Root.Consort.GetANoun] poznawać świat. [Root.Consort.GetSheHeCap] zawsze zadawał[Root.Consort.GetANoun] pytania i często zastanawiał[Root.Consort.GetANoun] się, jak ułatwić ludziom życie lub jak sprawić, by dane zadanie było bardziej efektywne. A jeszcze lepiej, jak przekonać kogoś innego, że sposób organizacji zadania wymyślony przez ni[Root.Consort.GetAEgo] jest właściwy. Na szczęście przeprowadzka na dwór królewski [Root.GetAdjective] nie sprawiła, że [Root.Consort.GetName] porzucił[Root.Consort.GetANoun] swoje mażenia o dowodzeniu ludźmi. Wręcz przeciwnie, [Root.Consort.GetSheHe] nabrał[Root.Consort.GetANoun] dużo praktyki - podczas niektórych z naszych ostatnich negocjacji z zagranicznymi dyplomatami [Root.Consort.GetHerHis] pomysły otrzymały bardzo pozytywne opinie."
 consort_events.303.df: "Dorastając, [Root.Consort.GetName] lubił[Root.Consort.GetANoun] spędzać czas z innymi. [Root.Consort.GetSheHeCap] był[Root.Consort.GetANoun] niezwykle spokojnym dzieckiem, doskonale wyczuwającym uczucia swoich przyjaciół, a nawet każdego, kogo napotkał[Root.Consort.GetANoun]. Ten niemal szósty zmysł podczas interakcji z ludźmi nie tylko sprawił, że [Root.Consort.GetName] stał[Root.Consort.GetANoun] się wysoko cenion[Root.Consort.GetAYm] i poszukiwan[Root.Consort.GetAYm] gościem na kolacji, odkąd [Root.Consort.GetSheHe] przybył[Root.Consort.GetANoun] do miasta [Root.Capital.GetCapitalName] - przełożyło się to również na inne sprawy państwowe. Podczas niedawnego spotkania z zagranicznymi dyplomatami mówi się, że nienaganne taktyki negocjacyjne [Root.GetConsortGen] były główną atrakcją wydarzenia!"
 consort_events.303.a: "Doskonale."
 consort_events.304.t: "Idee administracyjne [Root.GetConsortGen]"
 consort_events.304.da: "W połączeniu z silnym kompasem moralnym, [Root.Consort.GetName] zawsze miał[Root.Consort.GetANoun] poczucie porządku. Decyzje podejmowane przez ni[Root.Consort.GetAEgo] są decyzjami godnymi zaufania - czy to w kwestiach politycznych, czy podczas przyjacielskiej rozmowy, [Root.Consort.GetName] jest elokwentn[Root.Consort.GetAY]. Przyniosło to j[Root.Consort.GetEjEmu] pewien podziw podczas [Root.Consort.GetHerHis] pierwszych dni w mieście [origin_of_consort.GetName]. Co jednak najważniejsze, słowa [Root.GetConsortGen] są prawdziwe, co sprawia, że nawet najbardziej uparci członkowie dworu słuchają [Root.Consort.GetHerHis] rad."
