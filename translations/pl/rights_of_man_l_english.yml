 consort_events.311.t: "[Root.Consort.GetTitle] ludu"
 consort_events.311.d: "Stało się dla nas jasne, że [Root.Consort.GetTitle] [Root.Consort.GetName] to [Root.Consort.GetWomanMan] o złotym sercu. [Root.Consort.GetSheHeCap] zawsze robi wszystko, by zadowolić [Root.Consort.GetHerHis] [Root.Monarch.GetWifeHusband_acc] i traktuje swoich przyjaciół z niezrównaną życzliwością. Podczas niedawnej podróży do prowincji [poor_province.GetName] [Root.Consort.GetTitle] [Root.Consort.GetName] na własne oczy widział[Root.Consort.GetANoun] cierpienie najbiedniejszych chłopów. Od tego czasu opracowuje plan pomocy najbardziej ubogim poddanym. Aby jednak wcielić te pomysły w życie, [Root.Consort.GetName] potrzebuje pewnych funduszy ze skarbca państwa."
 consort_events.311.a: "Ludzie są pod naszą opieką. [Root.Consort.GetSheHeCap] ma nasze wsparcie."
 consort_events.311.b: "Mamy ważniejsze sprawy na głowie."
 consort_events.312.t: "Dwoje w swoim rodzaju"
 consort_events.312.da: "Nasz[Root.Consort.GetANoun] [Root.Consort.GetTitle] [Root.Consort.GetName] zaimponował[Root.Consort.GetANoun] wielu mężczyznom i kobietom na swoim dworze bystrym dowcipem i rozległą wiedzą o świecie przyrody. [Root.Consort.GetSheHeCap] od dawna jest kolekcjoner[Root.Consort.GetKaEm] tomów o botanice i chemii, oraz koresponduje z kilkoma najbystrzejszymi umysłami naszego pokolenia. Obecnie jeden z tych naukowców odwiedza nasz dwór na zaproszenie [Root.GetConsortGen]. Można ich spotkać dyskutujących o wszelkiego rodzaju nowych teoriach do późnych godzin nocnych. [Root.Consort.GetTitle] [Root.Consort.GetName] poprosił[Root.Consort.GetANoun] nas o złożenie oferty naukowcowi, twierdząc, że byłby on znacznie lepszym doradcą niż [Root.GetAdv_Adm_Title] [Root.Adm_Advisor.GetName], któr[Root.GetAdv_Adm_AEgo] obecnie zatrudniamy."
 consort_events.312.db: "Zazwyczaj [Root.Consort.GetTitle] akceptuje swoją ograniczoną władzę i poświęca swoje życie różnym rozrywkom i rodzinie, ale nie [Root.Consort.GetName]. [Root.Consort.GetSheHeCap] jest szczerze zainteresowan[Root.Consort.GetAY] wszystkimi tajnikami spraw rządowych. Przez lata zaprzyjaźnił[Root.Consort.GetANoun] się z wieloma wielkimi myślicielami, politykami i dyplomatami. Wśród nich jest jeden z naszych najbardziej znanych mężów stanu, z którym  spędził[Root.Consort.GetANoun] ostatnio dużo czasu. Teraz [Root.Consort.GetTitle] [Root.Consort.GetName] poprosił[Root.Consort.GetANoun] nas o złożenie mężowi stanu oferty, twierdząc, że byłby on znacznie lepszym doradcą niż [Root.GetAdv_Dip_Title] [Root.Dip_Advisor.GetName], któr[Root.GetAdv_Dip_AEgo] obecnie zatrudniamy."
 consort_events.312.dc: "Żadn[Root.Consort.GetAY] inn[Root.Consort.GetAY] [Root.Consort.GetTitle] nie jest tak odważn[Root.Consort.GetAY] jak nasz[Root.Consort.GetANoun] [Root.Consort.GetName]! Taktyka i organizacja wojskowa zawsze bardzo [Root.Consort.GetHerHim] interesowały. Oprócz codziennych ćwiczeń z mieczem, [Root.Consort.GetSheHe] spędza wiele godzin każdego dnia studiując sztukę wojenną. W ciągu ostatnich kilku miesięcy lepiej poznał[Root.Consort.GetANoun] jednego z naszych najbardziej szanowanych dowódców, a ten z kolei wziął naszego [Root.GetConsortGen] pod swoje skrzydła, ucząc j[Root.Consort.GetAEgo] wszystkiego, co [Root.Consort.GetSheHe] chciał[Root.Consort.GetANoun]by wiedzieć. Teraz [Root.Consort.GetTitle] [Root.Consort.GetName] poprosił[Root.Consort.GetANoun] nas o złożenie komendantowi oferty, twierdząc, że byłby on znacznie lepszym doradcą niż [Root.GetAdv_Mil_Title] [Root.Mil_Advisor.GetName], któr[Root.Mil_Advisor.GetAdv_Mil_AEgo] obecnie zatrudniamy."
 consort_events.312.a: "[Root.Consort.GetTitle] [Root.Consort.GetName] ma rację! Powinniśmy zaproponować [Root.Consort.GetHerHis] znajomemu pracę"
 consort_events.312.a.tt: "Przyjaciel [Root.GetConsortGen] zostaje doradcą na dworze."
 consort_events.312.b: "Nie, po prostu poprosimy [Root.GetAdv_Adm_acc] o cięższą pracę."
 consort_events.312.b.tt: "[Root.GetAdv_Adm_Title] §Y[Root.Adm_Advisor.GetName]§! będzie pracować jeszcze ciężej, aby utrzymać swoje stanowisko."
 consort_events.312.c: "Nie, po prostu poprosimy [Root.GetAdv_Dip_acc] o cięższą pracę."
 consort_events.312.c.tt: "[Root.GetAdv_Dip_Title] §Y[Root.Dip_Advisor.GetName]§! będzie pracować jeszcze ciężej, aby utrzymać swoje stanowisko."
 consort_events.312.d: "Nie, po prostu poprosimy [Root.GetAdv_Mil_acc] o cięższą pracę."
 consort_events.312.d.tt: "[Root.GetAdv_Mil_Title] §Y[Root.Mil_Advisor.GetName]§! będzie pracować jeszcze ciężej, aby utrzymać swoje stanowisko."
 consort_events.313.t: "Cud narodzin"
 consort_events.313.d: "W tych mrocznych dniach wojny i śmierci przypomnienie o nowych początkach może złagodzić ból naszego ludu. Nasz[Root.Monarch.GetANoun] wielk[Root.Monarch.GetAI] [Root.Monarch.GetTitle] [Root.Monarch.GetName] i [Root.Monarch.GetHerHis] szlachetn[Root.Consort.GetAY] [Root.Consort.GetTitle] [Root.Consort.GetName] zostali pobłogosławieni kolejnym dzieckiem. Pojawienie się dziecka przyniosło nową nadzieję i energię parze królewskiej, a co za tym idzie, ich dworowi i poddanym. Wiele osób marzy, że to dziecko dorośnie w lepszej, jaśniejszej przyszłości i że wszystkie walki będą tego warte."
 consort_events.313.a: "Niech będą błogosławieni [Root.Monarch.GetName], [Root.Consort.GetName] i ich nowe dziecko!"
 consort_events.313.a.tt: "Narodziny nowego dziecka rodu [Root.Monarch.Dynasty.GetName] ożywia ludność [Root.GetAdjective]."
 consort_events.314.t: "Żądze ciała"
 consort_events.314.da: "Chociaż udało nam się ukryć prawdę przed resztą dworu, jest tylko kwestią czasu, kiedy wyjdzie ona na jaw, chyba że coś zrobimy. [Root.Monarch.GetTitle] [Root.Monarch.GetName] niedawno odkrył[Root.Monarch.GetANoun], że [Root.Monarch.GetHerHis] [Root.Consort.GetWifeHusband], [Root.Consort.GetTitle] [Root.Consort.GetName], ma romans! To nie wszystko. Drug[Root.Consort.GetAIm] winowajc[Root.Consort.GetZyniaA] jest nikt inny jak nasz[Root.GetAdv_Adm_ANoun] doradc[Root.GetAdv_Adm_ZyniA] [Root.Adm_Advisor.GetName]. Zaufanie, jakim [Root.Adm_Advisor.GetHerHim] obdarzyliśmy, było oczywiście bezpodstawne. Co gorsza, rodzi to również pytanie dotyczące prawowitości [Root.Heir.GetDaughterSon_gen] [Root.Monarch.GetRulerGen], [Root.Heir.GetName] z rodu [Root.Heir.Dynasty.GetName]."
 consort_events.314.db: "Chociaż udało nam się ukryć prawdę przed resztą dworu, jest tylko kwestią czasu, kiedy wyjdzie ona na jaw, chyba że coś zrobimy. [Root.Monarch.GetTitle] [Root.Monarch.GetName] niedawno odkrył[Root.Monarch.GetANoun], że [Root.Monarch.GetHerHis] [Root.Consort.GetWifeHusband], [Root.Consort.GetTitle] [Root.Consort.GetName], ma romans! To nie wszystko. Drug[Root.Consort.GetAIm] winowajc[Root.Consort.GetZyniaA] jest nikt inny jak nasz[Root.GetAdv_Adm_ANoun] doradc[Root.GetAdv_Adm_ZyniA] [Root.Adm_Advisor.GetName]. Zaufanie, jakim [Root.Adm_Advisor.GetHerHim] obdarzyliśmy, było oczywiście bezpodstawne."
 consort_events.314.a: "Teraz przynajmniej wiemy. Możemy podjąć kroki, by utrzymać to w tajemnicy."
 consort_events.314.a.tt: "Zezwól na kontynuowanie romansu §Y[Root.GetConsortGen]§! robiąc wszystko, co w naszej mocy, by nie ujawniać tego publicznie."
 consort_events.314.b: "Tak dalej być nie może. Dowiedz się, czego chce [Root.Adm_Advisor.GetName] w zamian za milczenie."
 consort_events.314.b.tt: "Przekup [Root.GetAdv_Adm_Title] §Y[Root.Adm_Advisor.GetName]§! aby opuścił[Root.GetAdv_Adm_ANoun] dwór i nigdy nie wspominał[Root.GetAdv_Adm_ANoun] nikomu o tej sprawie."
 consort_events.314.c: "To jest zdrada stanu! [Root.Adm_Advisor.GetName] zapłaci za to głową!"
 consort_events.314.c.tt: "[Root.GetAdv_Adm_Title] §Y[Root.Adm_Advisor.GetName]§! zostaje stracon[Root.GetAdv_Adm_AY]. Bez wystarczającego wyjaśnienia akt ten będzie postrzegany jako despotyczny i wywoła niepokoje w mieście §Y[Root.Capital.GetName]§! i okolicy."
 consort_events.314.d: "[Root.Consort.GetTitle] nie może być cudzołożniczką. [Root.Consort.GetName] musi odejść."
 consort_events.314.e: "[Root.Consort.GetTitle] nie może być cudzołożnikiem. [Root.Consort.GetName] musi odejść."
