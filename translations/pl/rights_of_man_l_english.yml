 consort_events.306.t: "Wspólny interes"
 consort_events.306.da: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] jest znan[Root.Monarch.GetAY] z tego, że ma zdolności do organizacji. Upewnienie się, że zarówno ludzie, jak i administracja [Root.GetAdjective] przestrzegają prawa, jednocześnie aktualizując i dostosowując system do czasów, w których żyjemy, jest bardzo interesujące dla [Root.Monarch.GetRulerGen]. Wyobraź sobie radość [Root.Monarch.GetHerHis], gdy zdał[Root.Monarch.GetANoun] sobie sprawę, że [Root.Monarch.GetHerHis] [Root.Consort.GetWifeHusband] podziela wiele z tych pomysłów!\n'Rozmowa z tobą jest tak stymulująca jak każde spotkanie rady!', [Root.Monarch.GetSheHe] wykrzyk[Root.Monarch.GetEndPast] do [Root.GetConsortGen] pewnego popołudnia. [Root.Consort.GetSheHeCap] odpowiedział[Root.Consort.GetANoun] z uśmiechem, również ciesząc się z więzi z [Root.Consort.GetHerHis] [Root.Monarch.GetWifeHusband_ins] w tych sprawach."
 consort_events.306.db: "Nie jest tajemnicą, że zarówno [Root.Monarch.GetTitle] [Root.Monarch.GetName], jak i [Root.Consort.GetTitle] [Root.Consort.GetName] potrafią dobierać słowa, a tym samym wpływać na ludzi. Oboje potrafią sprawić, że nieznajomy czuje się doskonale w ich obecności i w jakiś sposób zawsze udaje im się być tym, który wygłasza końcowy argument w dyskusji. Choć może nie do końca dorównują sobie urokiem i wykorzystują różne osobiste atuty, z czasem zaczęli czerpać przyjemność ze wspólnych imprez towarzyskich, często uśmiechając się do siebie z daleka. Pewne jest to, że nasze państwo ma się lepiej od czasu rozpoczęcia ich związku."
 consort_events.306.dc: "Za pierwszym razem, gdy [Root.Consort.GetName] obserwował[Root.Consort.GetANoun] walkę [Root.Monarch.GetRulerGen] z [Root.Monarch.GetHerHis] żołnierzami podczas treningu, [Root.Consort.GetSheHe] był[Root.Consort.GetANoun] pod wrażeniem. Nie każdemu szlachetn[Root.Monarch.GetEjEmu] [Root.Monarch.GetWomanMan_dat] podoba się praca fizyczna polegająca na nauce władania własną bronią. 'Ale [Root.Monarch.GetTitle] [Root.Monarch.GetName] nie jest jak każd[Root.Monarch.GetAY]', pomyślał[Root.Consort.GetANoun], zanim pod[Root.Consort.GetEszlaSzedl] do [Root.Consort.GetHerHis] [Root.Monarch.GetWifeHusband_gen], by pochwalić [Root.Monarch.GetHerHis] umiejętności. [Root.Consort.GetSheHeCap] zdobył[Root.Consort.GetANoun] się nawet na odwagę, by zapytać [Root.Monarch.GetHerHim] o opinię na temat obecnej sytuacji militarnej [Root.GetGovNameGen]. Zaintrygowany tym wzajemnym zainteresowaniem wojskowymi aspektami [Root.GetAdjective], [Root.Monarch.GetTitle] zyskał[Root.Monarch.GetANoun] wiele nowych pomysłów dla swojej armii."
 consort_events.306.dd: "[Root.Monarch.GetTitle] [Root.Monarch.GetName] jest znan[Root.Monarch.GetAY] z tego, że ma zdolności do organizacji. Upewnienie się, że zarówno ludzie, jak i administracja [Root.GetAdjective] przestrzegają prawa, jednocześnie aktualizując i dostosowując system do czasów, w których żyjemy, jest bardzo interesujące dla [Root.Monarch.GetRulerGen]. Wyobraź sobie radość [Root.Monarch.GetHerHis], gdy zdał[Root.Monarch.GetANoun] sobie sprawę, że [Root.Monarch.GetHerHis] [Root.Consort.GetWifeHusband] podziela wiele z tych pomysłów!\n'Rozmowa z tobą jest tak stymulująca jak każde spotkanie rady!', [Root.Monarch.GetSheHe] wykrzyk[Root.Monarch.GetEndPast] do [Root.GetConsortGen] pewnego popołudnia. [Root.Consort.GetSheHeCap] odpowiedział[Root.Consort.GetANoun] z uśmiechem, również ciesząc się z więzi z [Root.Consort.GetHerHis] [Root.Monarch.GetWifeHusband_ins] w tych sprawach."
 consort_events.306.de: "Nie jest tajemnicą, że zarówno [Root.Monarch.GetTitle] [Root.Monarch.GetName], jak i [Root.Consort.GetTitle] [Root.Consort.GetName] potrafią dobierać słowa, a tym samym wpływać na ludzi. Oboje potrafią sprawić, że nieznajomy czuje się doskonale w ich obecności i w jakiś sposób zawsze udaje im się być tym, który wygłasza końcowy argument w dyskusji. Choć może nie do końca dorównują sobie urokiem i wykorzystują różne osobiste atuty, z czasem zaczęli czerpać przyjemność ze wspólnych imprez towarzyskich, często uśmiechając się do siebie z daleka. Pewne jest to, że nasze państwo ma się lepiej od czasu rozpoczęcia ich związku."
 consort_events.306.df: "Za pierwszym razem, gdy [Root.Consort.GetName] obserwował[Root.Consort.GetANoun] walkę [Root.Monarch.GetRulerGen] z [Root.Monarch.GetHerHis] żołnierzami podczas treningu, [Root.Consort.GetSheHe] był[Root.Consort.GetANoun] pod wrażeniem. Nie każdemu szlachetn[Root.Monarch.GetEjEmu] [Root.Monarch.GetWomanMan_dat] podoba się praca fizyczna polegająca na nauce władania własną bronią. 'Ale [Root.Monarch.GetTitle] [Root.Monarch.GetName] nie jest jak każd[Root.Monarch.GetAY]', pomyślał[Root.Consort.GetANoun], zanim pod[Root.Consort.GetEszlaSzedl] do [Root.Consort.GetHerHis] [Root.Monarch.GetWifeHusband_gen], by pochwalić [Root.Monarch.GetHerHis] umiejętności. [Root.Consort.GetSheHeCap] zdobył[Root.Consort.GetANoun] się nawet na odwagę, by zapytać [Root.Monarch.GetHerHim] o opinię na temat obecnej sytuacji militarnej [Root.GetGovNameGen]. Zaintrygowany tym wzajemnym zainteresowaniem wojskowymi aspektami [Root.GetAdjective], [Root.Monarch.GetTitle] zyskał[Root.Monarch.GetANoun] wiele nowych pomysłów dla swojej armii."
 consort_events.306.a: "Ta dwójka świetnie do siebie pasuje."
