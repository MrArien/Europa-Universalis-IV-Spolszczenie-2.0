 consort_events.54.t: "Umiejętności [Root.GetConsortGen]"
 consort_events.54.da: "Odkąd [Root.Consort.GetName] przybył[Root.Consort.GetANoun] na dwór, bardzo interesował[Root.Consort.GetANoun] się sprawami administracyjnymi [Root.GetAdjective]. Osiągnęł[Root.Consort.GetANoun] punkt, w którym stał[Root.Consort.GetANoun] się autorytetem w sprawach związanych z personelem i zarządzaniem zamkiem, ciesząc się zaufaniem nie tylko [Root.Monarch.GetRulerGen], ale także całej szlachty. Rzadko kiedy państwo działa tak sprawnie."
 consort_events.54.db: "Każdy, kim rozmawiał[Root.Consort.GetName] [Root.Consort.GetANoun], może potwierdzić fakt, że [Root.Consort.GetSheHe] umie dobierać słowa. Niezależnie od tego, czy [Root.Consort.GetSheHe] był[Root.Consort.GetANoun] kształcon[Root.Consort.GetAY] na dyplomat[Root.Consort.GetKNoun]ę, czy nie, radzenie sobie z zagranicznymi ministrami i delikatnymi sprawami dworu wydaje się być czymś, do czego [Root.Consort.GetTitle] jest dobrze przystosowan[Root.Consort.GetAY] - wydaje się, że sama [Root.Consort.GetHerHis] obecność ma uspokajający wpływ na ludzi."
 consort_events.54.dc: "[Root.Consort.GetName] staje się znan[Root.Consort.GetAY] z zainteresowania wojskiem. [Root.Consort.GetSheHeCap] jest często widywan[Root.Consort.GetAY] na spacerach z naszymi generałami, zaangażowan[Root.Consort.GetAY] w głębokie rozmowy.[Root.Consort.GetSheHe] zacz[Root.Consort.GetEndPast] nawet uczestniczyć w radzie wojennej. Na początku wydawało się, że [Root.Consort.GetTitle] był[Root.Consort.GetANoun] po prostu ciekaw[Root.Consort.GetAY] i chciał[Root.Consort.GetANoun] poznać strategię wojskową, ale ostatnio [Root.Consort.GetName] zacz[Root.Consort.GetEndPast] przedstawiać własne rady - rady, których ludzie słuchają. Oczywiste jest, że jest [Root.Consort.GetWomanMan_ins], któr[Root.Consort.GetAY] nadaje się do tych spraw."
 consort_events.54.dd: "Jeszcze zanim [Root.Consort.GetName] wżenił[Root.Consort.GetANoun] się w najważniejsze rody szlacheckie, jakie [Root.GetName] ma do zaoferowania, [Root.Consort.GetTitle] był[Root.Consort.GetANoun] znan[Root.Consort.GetAY] jako wszechstronn[Root.Consort.GetAY] [Root.Consort.GetWomanMan], często imponując wielu gościom swym uczonym intelektem i dowcipem, jednocześnie wykazując imponującą wiedzę na temat strategii wojskowej. Być może właśnie dlatego [Root.Consort.GetSheHe] został[Root.Consort.GetANoun] wybran[Root.Consort.GetAY] na małżonk[Root.Consort.GetEA]? Niezależnie od tego, od czasu przybycia [Root.Consort.GetHerHis] na dwór, [Root.Consort.GetTitle] nadal wywiera wyjątkowe wrażenie zarówno na szlachcicach, jak i zwykłych ludziach."
 consort_events.54.a: "[Root.Consort.GetName] jest błogosławiony."
 consort_events.54.b: "Świat potrzebuje więcej ludzi takich jak [Root.Consort.GetName]."
 consort_events.54.c: "Zawsze przydadzą się nam strategowie."
 consort_events.54.d: "Tak[Root.Consort.GetAI] [Root.Consort.GetName] to skarb."
