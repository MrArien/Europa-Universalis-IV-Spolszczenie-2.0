 consort_events.56.f: "Potrzebujemy więcej ludzi do naszej armii."
 consort_events.56.f.tt: "Wyślij list do [marriage_partner.GetConsortGen] [marriage_partner.GetAdjective], prosząc [marriage_partner.Consort.GetHerHim] o zasoby ludzkie."
 consort_events.56.g: "Nie potrzebujemy pomocy ze strony [marriage_partner.GetAdjective] ani dynastii [marriage_partner.Monarch.Dynasty.GetName]!"
 consort_events.57.t: "Przyjaciele w potrzebie"
 consort_events.57.da: "[Root.Consort.GetTitle] nasz[Root.Monarch.GetEjEgo] znamienit[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen], [Root.Consort.GetName], niedawno przyniósł[Root.Consort.GetANoun] nam prośbę od [Root.Consort.GetHerHis] rodu, dynastii [From.Monarch.Dynasty.GetName] z [From.GetAdjective]. Najwyraźniej [From.Monarch.GetTitle] [From.Monarch.GetName] pilnie potrzebuje pieniędzy i zapytał[From.Monarch.GetANoun] nas, najbardziej zaufanych przyjaciół, czy możemy w jakikolwiek sposób pomóc. [From.Monarch.GetHerHisCap] list  jest pełen komplementów na temat naszej wspaniałej gospodarki."
 consort_events.57.db: "[Root.Consort.GetTitle] nasz[Root.Monarch.GetEjEgo] znamienit[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen], [Root.Consort.GetName], niedawno przyniósł[Root.Consort.GetANoun] nam prośbę od [Root.Consort.GetHerHis] rodu, dynastii [From.Monarch.Dynasty.GetName] z [From.GetAdjective]. Najwyraźniej administracja [From.Monarch.GetRulerGen] [From.GetAdjective] jest w wielkim nieładzie i [From.Monarch.GetSheHe] poprosi nas, najbardziej zaufanych przyjaciół [From.Monarch.GetHerHis], czy możemy w jakikolwiek sposób pomóc. [From.Monarch.GetHerHisCap] list jest pełen komplementów na temat naszych utalentowanych księgowych i biurokratów."
 consort_events.57.dc: "[Root.Consort.GetTitle] nasz[Root.Monarch.GetEjEgo] znamienit[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen], [Root.Consort.GetName], niedawno przyniósł[Root.Consort.GetANoun] nam prośbę od [Root.Consort.GetHerHis] rodu, dynastii [From.Monarch.Dynasty.GetName] z [From.GetAdjective]. Najwyraźniej [From.Monarch.GetTitle] [From.Monarch.GetName] jest ostatnio nękan[From.Monarch.GetAY] skandalami dyplomatycznymi i  [From.Monarch.GetSheHe] poprosi nas, najbardziej zaufanych przyjaciół [From.Monarch.GetHerHis], czy możemy w jakikolwiek sposób pomóc. [From.Monarch.GetHerHisCap] list jest pełen komplementów na temat naszej międzynarodowej reputacji i dobrze wyszkolonych przedstawicieli. "
 consort_events.57.dd: "[Root.Consort.GetTitle] nasz[Root.Monarch.GetEjEgo] znamienit[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen], [Root.Consort.GetName], niedawno przyniósł[Root.Consort.GetANoun] nam prośbę od [Root.Consort.GetHerHis] rodu, dynastii [From.Monarch.Dynasty.GetName] z [From.GetAdjective]. Najwyraźniej [From.Monarch.GetTitle] [From.Monarch.GetName] boryka się z poważnymi problemami dotyczącymi szkolenia żołnierzy i [From.Monarch.GetSheHe] poprosi nas, najbardziej zaufanych przyjaciół [From.Monarch.GetHerHis], czy możemy w jakikolwiek sposób pomóc. [From.Monarch.GetHerHisCap] list jest pełen komplementów na temat naszej wspaniałej armii i genialnych generałów."
 consort_events.57.de: "[Root.Consort.GetTitle] nasz[Root.Monarch.GetEjEgo] znamienit[Root.Monarch.GetEjEgo] [Root.Monarch.GetRulerGen], [Root.Consort.GetName], niedawno przyniósł[Root.Consort.GetANoun] nam prośbę od [Root.Consort.GetHerHis] rodu, dynastii [From.Monarch.Dynasty.GetName] z [From.GetAdjective]. Najwyraźniej [From.Monarch.GetTitle] [From.Monarch.GetName] został dotknięty poważnym brakiem zasobów ludzkich dla [From.Monarch.GetHerHis] armii i [From.Monarch.GetSheHe] poprosi nas, najbardziej zaufanych przyjaciół [From.Monarch.GetHerHis], czy możemy w jakikolwiek sposób pomóc. [From.Monarch.GetHerHisCap] list jest pełen komplementów na temat naszych dzielnych żołnierzy i kwitnącej populacji."
 consort_events.57.a: "Z pewnością znajdziemy trochę monet dla naszych przyjaciół z [From.GetAdjective]."
 consort_events.57.b: "Wyślemy kilku naszych najlepszych administratorów, aby im pomogli."
 consort_events.57.c: "Kilku naszych najbardziej utalentowanych dyplomatów zostanie wysłanych do pomocy."
 consort_events.57.d: "Jeden z naszych najlepszych generałów zostanie wysłany, aby nauczyć ich naszych metod."
 consort_events.57.e: "Niektórzy sprawni mężczyźni zostaną wysłani do [From.GetAdjective]."
 consort_events.57.f: "A co dostalibyśmy w zamian? Nie, nigdy!"
 consort_events.58.t: "Pomocna dłoń"
 consort_events.58.da: "Wreszcie otrzymaliśmy odpowiedź od najdroższ[From.Consort.GetEjEgo] [From.GetConsortGen] w sprawie naszej prośby dla [From.Consort.GetHerHis] [From.Monarch.GetWifeHusband_gen]. Najszlachetniejsz[From.Monarch.GetAY] [From.Monarch.GetTitle] [From.Monarch.GetName] postanowił[From.Monarch.GetANoun] ją spełnić! Odpowiedź wróciła z kuframi złota, które wypełnią nasz pustoszejący skarbiec. List z podziękowaniami zostanie natychmiast wysłany do hojnego [From.Monarch.GetRulerGen] [From.GetAdjective]. Niech panuje jak najdłużej!"
 consort_events.58.db: "Wreszcie otrzymaliśmy odpowiedź od najdroższ[From.Consort.GetEjEgo] [From.GetConsortGen] w sprawie naszej prośby dla [From.Consort.GetHerHis] [From.Monarch.GetWifeHusband_gen]. Najszlachetniejsz[From.Monarch.GetAY] [From.Monarch.GetTitle] [From.Monarch.GetName] postanowił[From.Monarch.GetANoun] ją spełnić! Odpowiedź została przekazana z powrotem przez najlepszych administratorów [From.GetAdjective], którzy są tutaj, aby doradzać nam w sprawach związanych z prowadzeniem naszego kraju. List z podziękowaniami zostanie natychmiast wysłany do hojnego [From.Monarch.GetRulerGen] [From.GetAdjective]. Niech panuje jak najdłużej!"
 consort_events.58.dc: "Wreszcie otrzymaliśmy odpowiedź od najdroższ[From.Consort.GetEjEgo] [From.GetConsortGen] w sprawie naszej prośby dla [From.Consort.GetHerHis] [From.Monarch.GetWifeHusband_gen]. Najszlachetniejsz[From.Monarch.GetAY] [From.Monarch.GetTitle] [From.Monarch.GetName] postanowił[From.Monarch.GetANoun] ją spełnić! Odpowiedź została przekazana z powrotem przez najlepszych dyplomatów [From.GetAdjective], którzy są tutaj, aby uczyć naszych własnych przedstawicieli. List z podziękowaniami zostanie natychmiast wysłany do hojnego [From.Monarch.GetRulerGen] [From.GetAdjective]. Niech panuje jak najdłużej!"
 consort_events.58.dd: "Wreszcie otrzymaliśmy odpowiedź od najdroższ[From.Consort.GetEjEgo] [From.GetConsortGen] w sprawie naszej prośby dla [From.Consort.GetHerHis] [From.Monarch.GetWifeHusband_gen]. Najszlachetniejsz[From.Monarch.GetAY] [From.Monarch.GetTitle] [From.Monarch.GetName] postanowił[From.Monarch.GetANoun] ją spełnić! Odpowiedź została dostarczona przez jednego z najlepszych [From.Monarch.GetHerHis] generałów, który jest tutaj, aby uczyć naszych oficerów o tym, jak prowadzone jest szkolenie wojskowe w państwie [From.GetName]. List z podziękowaniami zostanie natychmiast wysłany do hojnego [From.Monarch.GetRulerGen] [From.GetAdjective]. Niech panuje jak najdłużej!"
 consort_events.58.de: "Wreszcie otrzymaliśmy odpowiedź od najdroższ[From.Consort.GetEjEgo] [From.GetConsortGen] w sprawie naszej prośby dla [From.Consort.GetHerHis] [From.Monarch.GetWifeHusband_gen]. Najszlachetniejsz[From.Monarch.GetAY] [From.Monarch.GetTitle] [From.Monarch.GetName] postanowił[From.Monarch.GetANoun] ją spełnić! Odpowiedź została nam odesłana wraz z oddziałem rekrutów z [From.GetAdjective]. List z podziękowaniami zostanie natychmiast wysłany do hojnego [From.Monarch.GetRulerGen] [From.GetAdjective]. Niech panuje jak najdłużej!"
 consort_events.58.a: "Zawsze wiedzieliśmy, że [From.GetName] to nasz prawdziwy przyjaciel."
 consort_events.59.t: "Złamane obietnice"
 consort_events.59.d: "Kiedy poślubiliśmy nasz[From.Consort.GetAEgo] [From.Consort.GetWifeHusband_acc] z [From.GetGovNameGen] [From.GetAdjective], myśleliśmy, że między naszymi krajami powstała silna więź. Chociaż nigdy nie zhańbilibyśmy naszej części tej umowy, najwyraźniej [From.Monarch.GetTitle] [From.Monarch.GetName] nie ma takich skrupułów. List z [From.Consort.GetHerHis] odpowiedzią dotarł do nas dzisiaj. Nie dość, że [From.Monarch.GetTitle] [From.Monarch.GetName] odrzucił[From.Monarch.GetANoun] naszą prośbę, to jeszcze miał[From.Monarch.GetANoun] czelność zganić nas za nasze 'skandaliczne żądania'!"
 consort_events.59.a: "To przewinienie nie zostanie zapomniane."
