 domain_of_spouses_family: "Siedziba silnej arystokracji"
 desc_domain_of_spouses_family: "To siedziba rodziny naszego królewskiego małżonka. Ich bliskie więzi z naszym władcą zapewniły im szereg lokalnych przywilejów, których nie można łatwo cofnąć, dopóki trwa związek."
 consort_events.2.t: "Dom dynastii [Root.Consort.Dynasty.GetName]"
 consort_events.2.d: "Dzięki związkowi [Root.Monarch.GetRulerGen] i [Root.GetConsortGen] zyskaliśmy nie tylko małżonka, ale także nowego sojusznika w królestwie. [Root.Consort.Dynasty.GetName] to stara i wpływowa rodzina, a ich siedziba w mieście [origin_of_queens_family.GetName] jest klejnotem [Root.GetGovNameGen].\nOczywiście przyjaźń musi iść w obie strony i oczekuje się, że [Root.Consort.GetName] będzie mówić w imieniu [Root.Consort.GetHerHis] krewnych, podczas gdy [Root.Monarch.GetTitle] bardzo uważnie będzie rozważał[Root.Monarch.GetANoun] taką radę."
 consort_events.2.a: "Za wieczną przyjaźń!"
 consort_events.2.a.tt: "[origin_of_queens_family.GetName] jest siedzibą rodziny nasz[Root.Consort.GetEjEgo] [Root.GetConsortGen]. Prowincja ta będzie mniej skłonna do buntu, ale otrzyma przywileje utrudniające jej opodatkowanie lub konwersję."
 consort_events.3.t: "Wielkie oczekiwania"
 consort_events.3.d: "Małżeństwo polityczne jest zarówno związkiem, jak i umową o wzajemnym wsparciu. Ród [Root.Consort.Dynasty.GetName] oczekuje, że [Root.Monarch.GetTitle] będzie słuchać rad [Root.GetConsortGen] i aktywnie dbać o ich (i [Root.Monarch.GetHerHis]) interesy."
 consort_events.3.a: "Wszystko dla nasz[Root.Consort.GetEjEgo] drogi[Root.Consort.GetEjEgo] [Root.Monarch.GetRulerGen]."
 consort_events.3.a.tt.0: "Ród [Root.Consort.Dynasty.GetName] będzie pamiętać, że przyszliśmy im z pomocą."
 consort_events.3.a.tt.1: "Korona sfinansuje rozwój ziem rodu [Root.Consort.Dynasty.GetName]."
 consort_events.3.a.tt.2: "Korona spłaci część długu rodu [Root.Consort.Dynasty.GetName]."
 consort_events.3.a.tt.3: "Korona będzie wspierać interesy rodu [Root.Consort.Dynasty.GetName] w królestwie."
 consort_events.3.a.tt.4: "Korona pomoże pozbyć się niechętnego do współpracy doradcy."
 consort_events.3.a.tt.5: "Oficerowie z rodu [Root.Consort.Dynasty.GetName] będą faworyzowani przy awansach niezależnie od zasług."
 consort_events.3.a.tt.6: "Oficerowie z rodu [Root.Consort.Dynasty.GetName] będą faworyzowani przy awansach niezależnie od zasług."
 consort_events.3.a.tt.6b: "Będziemy promować interesy rodu [Root.Consort.Dynasty.GetName] podczas tworzenia nowych przepisów."
 consort_events.3.b: "Przepraszamy, żadnych specjalnych przysług."
 consort_events.3.b.tt: "Spowoduje to mniejszą współpracę z rodem [Root.Consort.Dynasty.GetName] na poziomie lokalnym, a także będzie miało przykre konsekwencje w przyszłości."
 consort_events.4.t: "Małżeńska rozkosz"
 consort_events.4.d: "[Root.Consort.GetTitle] jest oczywiście dobrym doradcą. Jednak oprócz tej roli nasz[Root.Consort.GetANoun] [Root.GetConsortGen] jest również przedstawicielem korony w rodzie [Root.Consort.Dynasty.GetName] i vice versa. Czasami nie jest to układ bez korzyści.\nDziś [Root.Consort.GetName] wydaje się być bardzo zadowolon[Root.Consort.GetAY], mogąc ogłosić, że [Root.Consort.GetHerHis] rodzina zdecydowała się okazać swoje poparcie dla tronu."
 consort_events.4.a: "Niech ten związek przyniesie korzyści obu rodom."
 consort_events.4.a.tt.0: "Ród [Root.Consort.Dynasty.GetName] uzna nas za swoich dłużników."
 consort_events.4.a.tt.1: "Ród [Root.Consort.Dynasty.GetName] pomoże rozwinąć infrastrukturę królestwa."
 consort_events.4.a.tt.2: "Ród [Root.Consort.Dynasty.GetName] wpłaci pieniądze do królewskiego skarbca."
