 consort_events.56.b: "Potrzebujemy pomocy w zarządzaniu naszą administracją."
 consort_events.56.b.tt: "Wyślij list do [marriage_partner.GetConsortGen] [marriage_partner.GetAdjective], prosząc [marriage_partner.Consort.GetHerHim] o pomoc administracyjną."
 consort_events.56.c: "Nasi dyplomaci z pewnością mogliby uczyć się od [marriage_partner.GetAdjective]."
 consort_events.56.c.tt: "Wyślij list do [marriage_partner.GetConsortGen] [marriage_partner.GetAdjective], prosząc [marriage_partner.Consort.GetHerHim] o pomoc dyplomatyczną."
