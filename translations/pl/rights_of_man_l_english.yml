 consort_events.6.t: "Kochać i być kochanym"
 consort_events.6.d: "Królewskie małżeństwo rzadko jest kwestią miłości. Jest to raczej dyplomatyczna okazja, której nie można zmarnować. Bardzo ważne jest również, aby przyszła małżonka miała odpowiedni status i korzystne jest, jeśli pochodzi z zagranicy, aby nie zakłócać równowagi polityki wewnętrznej. \n\nJednak nawet [Root.Monarch.GetTitle] może się zakochać. Wtedy wszystkie takie sprawy zdają się znikać - przynajmniej z [Root.Monarch.GetHerHis] punktu widzenia. Ktoś z prowincji [consort_home.GetName] wpadł w oko [Root.Monarch.GetRulerGen]. [Root.Monarch.GetSheHeCap] wydaje się być szczęśliwsz[Root.Monarch.GetAY] niż kiedykolwiek, całkowicie i bezgranicznie zauroczon[Root.Monarch.GetAY]. Podczas gdy nasi szlachcice i doradcy są niezadowoleni, związek [Root.Monarch.GetRulerGen] ma silne poparcie wśród zwykłych mieszkańców królestwa."
 consort_events.6.a: "Niech [Root.Monarch.GetTitle] spełni pragnienie swego serca."
 consort_events.6.b: "Poślubić nisko urodzonego? Całkowicie wykluczone!"
 consort_of_the_people: "Małżonka ludu"
 desc_consort_of_the_people: "Małżonka naszego władcy jest kochana przez zwykłych ludzi, co łagodzi uciążliwe tarcia między elitą a jej poddanymi."
 home_of_consort: "Ojczyzna małżonki"
 desc_home_of_consort: "Nasz władca poślubił nisko urodzoną z tej prowincji, co jest źródłem wielkiej radości i dumy dla miejscowego pospólstwa."
 nobles_displeased_with_consort: "Szlachta niezadowolona z małżonki"
 desc_nobles_displeased_with_consort: "Szlachta nie jest zadowolona z wyboru małżonki przez władcę."
 consort_events.51.t: "Więzi rodzinne"
 consort_events.51.da: "Przez ostatnie kilka dni przyjmowaliśmy gościa z dworu królewskiego [origin_country_of_consort.GetAdjective], niegdysiejszego domu [Root.GetConsortGen]. Po całym tygodniu polowań, ucztowania i plotkowania z rodziną, siostra [Root.GetConsortGen] w końcu przygotowuje się do powrotu do miasta [origin_country_of_consort.Capital.GetCapitalName]. Zapewnia nas, że świetnie się bawiła i że rodzina królewska musi wkrótce odwiedzić miasto [origin_country_of_consort.Capital.GetCapitalName]. Z zachwytem w głosie mówi, że z pewnością poinformuje wszystkich w domu o tym, że młody następca [Root.GetGovNameGen] z [Root.GetAdjective] wygląda tak jak jej [Root.Consort.GetSisterBrother] [Root.Consort.GetName] w młodości."
 consort_events.51.db: "Przez ostatnie kilka dni przyjmowaliśmy gościa z dworu królewskiego [origin_country_of_consort.GetAdjective], niegdysiejszego domu [Root.GetConsortGen]. Po całym tygodniu polowań, ucztowania i plotkowania z rodziną, kuzynka [Root.GetConsortGen] w końcu przygotowuje się do powrotu do miasta [origin_country_of_consort.Capital.GetCapitalName]. Zapewnia nas, że spędziła wspaniały czas i z głębokim ukłonem wdzięczności mówi, że z pewnością poinformuje wszystkich w domu o tym, jak doskonałym dla niej i jej ukochan[Root.Consort.GetEjEgo] kuzyn[Root.Consort.GetKiA] jest  [Root.GovernmentName] [Root.Country.GetAdjective]"
 consort_events.51.a: "To właśnie oznacza 'rodzina'."
 consort_events.51.a.tt: "Rodzina królewska §Y[origin_country_of_consort.GetAdjective]§! dowie się o wymianie uprzejmości."
 we_are_kin: "Jesteśmy rodziną"
 consort_events.52.t: "Heretyk na dworze"
 consort_events.52.da: "Mieszkańcy [Root.Country.GetAdjective] byli zadowoleni, gdy [Root.Monarch.GetTitle] [Root.Monarch.GetName] ogłosił[Root.Monarch.GetANoun], że [Root.Monarch.GetHerHis] [Root.Consort.GetWifeHusband_ins] zostanie [Root.Consort.GetName]. W tym czasie niewiele mówiło się o [Root.Consort.GetHerHis] pochodzeniu lub [Root.Consort.GetHerHis] wychowaniu w mieście [origin_country_of_consort.Capital.GetCapitalName] - dla większości zwykłych ludzi członkowie rodziny królewskiej są rasą samą w sobie i nie dbają o takie szczegóły. Niedawno jednak zaczęły krążyć plotki na ten temat... Niektórzy twierdzą, że [Root.Consort.GetTitle] odmówił[Root.Consort.GetANoun] porzucenia starej wiary, [origin_country_of_consort.Religion.GetReligion_gen] - podczas gdy ludzie mogli zrozumieć potrzebę małżeństwa z obcokrajowcami, są mniej skłonni do tego, gdy chodzi o bycie rządzonym przez heretyka."
 consort_events.52.a: "Jak oni śmieli?"
 consort_events.52.a.tt: "[Root.Consort.GetTitle] nie posiada wad - zwykli ludzie z czasem przestaną plotkować."
 consort_events.52.b: "[Root.Consort.GetName] sprawia więcej problemów niż jest wart[Root.Consort.GetAY]."
 consort_events.52.b.tt: "Próba rozwodu z [Root.Consort.GetWifeHusband_ins]. Rodzina królewska z miasta §Y[origin_country_of_consort.GetName]§! dowie się o tym."
 heretic_royalty: "Heretyk na dworze"
 desc_heretic_royalty: "Ludzie są zdenerwowani domniemanymi heretyckimi przekonaniami królewskiej małżonki."
