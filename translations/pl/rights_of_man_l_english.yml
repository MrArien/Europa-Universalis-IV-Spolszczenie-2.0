 EACH_DAIMYO: "Każdy daimyo"
 overlord_sankin_kotai: "Sankin kotai"
 subject_sankin_kotai: "Sankin kotai"
 overlord_expel_ronin: "Wygnani ronini"
 subject_expel_ronin: "Wygnani ronini"
 overlord_sword_hunt: "Polowanie na miecze"
 subject_sword_hunt: "Polowanie na miecze"
 ottoman_government: "Osmański rząd"
 ottoman_government_desc: "Rząd osmański jest pod wieloma względami synonimem rodziny królewskiej. Harem zapewnia, że dziedziców na osmański tron nigdy nie zabraknie."
 ottoman_government_legacy: "Osmański rząd"
 ottoman_government_legacy_desc: "Osmański rząd jest pod wieloma względami synonimem rodziny królewskiej. Harem zapewnia, że dziedziców na osmański tron nigdy nie zabraknie."
 coptic_conquest_of_alexandria_title: "Uwolnij Aleksandrię"
 coptic_conquest_of_alexandria_desc: "Patriarchat Aleksandrii i całej Afryki to największy koptyjski Kościół na świecie, ale jego wieloletnia siedziba, a także spora część społeczności koptyjskiej, znajdują się pod rządami obcych władców. Musimy uwolnić Aleksandrię i odżywić egipską społeczność Koptów!"
 coptic_conquest_of_qasr_ibrim_title: "Podbij Kasr Ibrim "
 coptic_conquest_of_qasr_ibrim_desc: "Choć cały czas pozostaje ona głównym centrum pobożności Koptów z Nubii, bazylika w Kasr Ibrim jest tylko cieniem samej siebie. Musimy podbić Kasr Ibrim, aby przywrócić honor społeczności Koptów w Nubii!"
 coptic_conquest_of_cairo_title: "Wyzwolić Kair"
 coptic_conquest_of_cairo_desc: "Kair to największe istniejące miasto koptyjskie i od wieków jest domem patriarchy Aleksandrii. Nie możemy oddać miasta w ręce niewiernych. Musimy wyzwolić wspólnotę koptyjską w Kairze i uwolnić egipskich Koptów."
 the_faithful_liberated: "Uwolnienie wiernych"
 desc_the_faithful_liberated: "Wierni koptyjscy z tej prowincji zostali uwolnieni od obcych rządów."
 coptic_flavor.1.t: "Święte serce państwa [Root.GetName]"
 coptic_flavor.1.da: "Niegdyś Aksum było sercem starożytnego Imperium Aksumitów – bastionu władzy chrześcijańskiej, położonego na rozdrożu Afryki, Arabii i grecko-rzymskiego świata. Pośród obelisków i ruin pałaców, odbudowaliśmy kościoły tego dawnego potężnego narodu.\n\nNajwspanialszym z nich jest Kościół Matki Bożej z Syjonu. Był miejscem koronacji władców etiopskich, potomków Menelika I, syna króla Salomona i królowej Saby, który przywiózł tutaj Arkę Przymierza. Każdego roku tysiące pielgrzymów zamieszkujące nasze [Root.GovernmentName] przybywają z najdalszych zakątków i spoza jego granic, aby odwiedzić to święte miejsce."
 coptic_flavor.1.db: "Chwalmy Pana, Aksum jest nasze! Niegdyś serce starożytnego Imperium Aksumitów – bastionu władzy chrześcijańskiej, położonego na rozdrożu Afryki, Arabii i grecko-rzymskiego świata. Pośród obelisków i ruin pałaców, odbudujemy kościoły tego dawnego potężnego narodu.\n\nNajwspanialszym z nich jest Kościół Matki Bożej z Syjonu. Był miejscem koronacji władców etiopskich, potomków Menelika I, syna króla Salomona i królowej Saby, który przywiózł tutaj Arkę Przymierza. Każdego roku tysiące pielgrzymów odwiedzają to święte miejsce."
 coptic_flavor.1.a: "Aksum po raz kolejny zabłyśnie nieskończoną chwałą Boga!"
 coptic_flavor.2.t: "Święte serce państwa [From.GetName]"
 coptic_flavor.2.d: "Starożytne miasto Aksum spoczywa bezpiecznie w rękach Koptów. Niegdyś serce starożytnego Imperium Aksumitów – bastionu władzy chrześcijańskiej, położonego na rozdrożu Afryki, Arabii i grecko-rzymskiego świata. Pośród obelisków i ruin pałaców państwo [From.GetName] odbudowuje kościoły tego dawnego potężnego narodu.\n\nNajwspanialszym z nich jest Kościół Matki Bożej z Syjonu. Był miejscem koronacji władców etiopskich, potomków Menelika I, syna króla Salomona i królowej Saby, który przywiózł tutaj Arkę Przymierza. Każdego roku tysiące pielgrzymów odwiedzają to święte miejsce."
 coptic_flavor.3.t: "Perła Morza Śródziemnego"
 coptic_flavor.3.d: "Radujcie się - święte miasto Aleksandria wróciło pod władze Koptów! Historyczna siedziba naszego świętego Kościoła została uwolniona spod obcych rządów.\n\nAleksandria to dumne starożytne miasto założone przez Aleksandra Wielkiego. Nazywało ją swoim domem wielu mędrów epoki starożytnej. Przez stulecia mędrcy uczyli się i nauczali w Wielkiej Bibliotece, a potem Katechetycznej Szkole w Aleksandrii, pierwszej takiej uczelni na świecie. Zamierzamy odtworzyć święte hale wiedzy i wyszkolić najlepszych teologów na świecie."
 coptic_flavor.3.a: "Boże błogosław Aleksandrię!"
 coptic_flavor.3.a.tt: "Koptowie mieszkający w obszarze §YDelty Nilu§! mogą wyjść z ukrycia."
 coptic_flavor.4.d: "Radujcie się - święte miasto Aleksandria wróciło pod władze Koptów! Historyczna siedziba naszego świętego Kościoła została uwolniona spod obcych rządów przez państwo [From.GetName].\n\nAleksandria to dumne starożytne miasto założone przez Aleksandra Wielkiego. Nazywało ją swoim domem wielu mędrów epoki starożytnej. Przez stulecia mędrcy uczyli się i nauczali w Wielkiej Bibliotece, a potem Katechetycznej Szkole w Aleksandrii, pierwszej takiej uczelni na świecie. Zamierzamy odtworzyć święte hale wiedzy i wyszkolić najlepszych teologów na świecie."
 coptic_flavor.5.t: "Serce Armenii"
 coptic_flavor.5.da: "W końcu jesteśmy ponownie wolni, a Erywań wraz ze świętą Katedrą w Eczmiadzynie został uwolniony! Katedra ta była schronieniem dla naszego ludu, naszą bezpieczną przystanią w trudnych czasach. W czasach, gdy nasz lud nie miał państwa, Eczmiadzyn pozostał naszym centrum narodowo-politycznym. Przez stulecia wojen i klęsk odnaleźliśmy siłę i wolę, by teraz przywrócić naszej matce dawną chwałę."
 coptic_flavor.5.db: "Erywań wraz ze świętą Bazyliką w Eczmiadzynie został uwolniony! Przez stulecia katedra ta była narodowo-politycznym centrum pozbawionego własnego państwa ludu Armenii. Przez stulecia wojen i klęsk odnaleźli oni siłę i wolę do odbudowy dawnej chwały świątyni i odtworzenia bezpiecznej przystani dla chrześcijan w Armenii."
 coptic_flavor.5.a: "Uczyńmy ponownie Erywań wielkim!"
 coptic_flavor.6.d: "Erywań został uwolniony spod obcych rządów przez naszych przyjaciół w wierze koptyjskiej, państwo [From.GetName]! We wczesnym IV wieku zbudowano tutaj świętą Bazylikę w Eczmiadzynie. Przez lata katedra ta była narodowo-politycznym centrum pozbawionego własnego państwa ludu Armenii. Przez stulecia wojen i klęsk odnaleźli oni siłę i wolę do odbudowy dawnej chwały świątyni!"
 coptic_flavor.6.a: "Nasza wiara się jeszcze bardziej wzmacnia!"
 coptic_flavor.7.t: "Kolebka chrześcijaństwa"
 coptic_flavor.7.d: "Starożytne miasto Antiochia stała się częścią naszego świętego państwa! Antiochia była centrum wczesnego chrześcijaństwa w epoce rzymskiej. Żydzi nawróceni tam przez apostoła Piotra zostali jako pierwsi nazwani chrześcijanami. W tamtych czasach założono tam wiele klasztorów. Odtąd Antiochia została dotknięta przez liczne wojny, a w XIII wieku została zdobyta przez Mameluków, zaś całość jej chrześcijańskiej populacji została przemocą zgładzona. W honorze za ich poświęcenie, odbudujemy Antiochię i jej klasztory, czyniąc ją jeszcze bardziej chwalebną, niż kiedykolwiek!"
 coptic_flavor.7.a: "Panie, pobłogosław to miasto!"
 coptic_flavor.8.d: "Starożytne miasto Antiochia stała się częścią [From.GetAdjective]! Antiochia była centrum wczesnego chrześcijaństwa w epoce rzymskiej. Żydzi nawróceni tam przez apostoła Piotra zostali jako pierwsi nazwani chrześcijanami. W tamtych czasach założono tam wiele klasztorów. Odtąd Antiochia została dotknięta przez liczne wojny, a w XIII wieku została zdobyta przez Mameluków, zaś całość jej chrześcijańskiej populacji została przemocą zgładzona. W honorze za ich poświęcenie, Antiochia i jej klasztory zostaną odbudowane, czyniąc ją jeszcze bardziej chwalebną, niż kiedykolwiek!"
 coptic_flavor.9.t: "Nad brzegiem Nilu"
 coptic_flavor.9.d: "Chwała Panu, Kasr Ibrim należy do nas! Przez wiele lat to wielkie chrześcijańskie miasto trwało niewzruszenie, choć ze wszystkich stron otaczali je wrogowie naszej wiary. Położone na szczycie urwiska nad potężnym Nilem, Kasr Ibrim pozostało bastionem chrześcijaństwa w Dolnej Nubii, nawet gdy reszta regionu pogrążyła się w mroku. Włączenie go do naszego państwa [Root.GovernmentName] ma jednak nie tylko znaczenie religijne — miasto jest również ośrodkiem handlu i polityki. Dzięki tym zasobom [Root.GetName] stanie się jeszcze potężniejsze!"
 coptic_flavor.9.a: "To początek chwalebnej epoki!"
 coptic_flavor.9.a.tt: "Koptowie w obszarach §YDolna Nubia i Dongola§! wychodzą z ukrycia."
 coptic_flavor.10.d: "Chwała Panu, Kasr Ibrim należy do koptyjskiego państwa [From.GovernmentName] [From.GetName]! Przez wiele lat to wielkie chrześcijańskie miasto trwało niewzruszenie, choć ze wszystkich stron otaczali je wrogowie naszej wiary. Położone na szczycie urwiska nad potężnym Nilem, Kasr Ibrim pozostało bastionem chrześcijaństwa w Dolnej Nubii, nawet gdy reszta regionu pogrążyła się w mroku. Teraz [From.GetName] wykorzysta wielkie zasoby polityczne i gospodarcze miasta, by szerzyć w całej Nubii słowo jedynego prawdziwego Boga."
 coptic_flavor.11.t: "Klasztor Świętego Antoniego"
 coptic_flavor.11.d: "Głęboko w górach nad Morzem Czerwonym, w ukrytej oazie, leży jedno z naszych najświętszych miejsc - Klasztor Świętego Antoniego. Wybudowany przez naśladowców Antoniego w IV wieku, ten chrześcijański klasztor jest jednym z najstarszych na świecie. Święty Antoni, pierwszy z ojców pustyni, znany jest jako ojciec wszystkich mnichów. Udał się na pustynię, gdzie spędził wiele lat jako pustelnik, poświęcając swoje życie Bogu. W czasie Wielkiego Prześladowania wrócił do cywilizacji, aby pocieszać uwięzionych, ryzykując życie dla swoich chrześcijańskich braci. Pod koniec swojego życia osiadł przy oazie, gdzie dziś stoi wielki klasztor. Tysiące pielgrzymów każdego roku podąża śladami Antoniego, a teraz, gdy As-Suwajs jest pod naszą ochroną, możemy zagwarantować, że bezpiecznie dotrą do celu."
 coptic_flavor.11.a: "Będziemy podążać ścieżkami św. Antoniego."
 coptic_flavor.11.a.tt: "Koptowie mieszkający w obszarze §YWzgórza Morza Czerwonego§! mogą wyjść z ukrycia."
 coptic_flavor.12.d: "Głęboko w górach nad Morzem Czerwonym, w ukrytej oazie, leży jedno z naszych najświętszych miejsc - Klasztor Świętego Antoniego. Wybudowany przez naśladowców Antoniego w IV wieku, ten chrześcijański klasztor jest jednym z najstarszych na świecie. Święty Antoni, pierwszy z ojców pustyni, znany jest jako ojciec wszystkich mnichów. Udał się na pustynię, gdzie spędził wiele lat jako pustelnik, poświęcając swoje życie Bogu. W czasie Wielkiego Prześladowania wrócił do cywilizacji, aby pocieszać uwięzionych, ryzykując życie dla swoich chrześcijańskich braci. Pod koniec swojego życia osiadł przy oazie, gdzie dziś stoi wielki klasztor. Tysiące pielgrzymów każdego roku podąża śladami Antoniego, a teraz, gdy As-Suwajs jest pod ochroną [From.GetAdjective], będą mogli bezpiecznie dotrzeć do celu."
 coptic_flavor.13.t: "Święta Katarzyna od koła"
 coptic_flavor.13.d: "U podnóża świętej góry Synaj, gdzie Mojżesz otrzymał Dziesięć Przykazań, stoi klasztor poświęcony świętej Katarzynie Aleksandryjskiej. Katarzyna była oddaną uczennicą i naśladowczynią Chrystusa. Kiedy rzymski cesarz Maksencjusz zaczął prześladować chrześcijan, młoda odważna panna skarciła go za jego okrucieństwo. Cesarz zebrał pięćdziesięciu swoich najlepszych filozofów i oratorów, aby z nią debatować, ale mądra Katarzyna wygrała. Mimo że była następnie więziona i torturowana, Maksencjusz poniósł kolejną porażkę, gdyż wielu jego najbliższych poddanych nawróciło się dzięki elokwencji i pobożności Katarzyny. Wściekły cesarz skazał Katarzynę na śmierć poprzez łamanie na kole, które jednak roztrzaskało się pod wpływem jej dotyku. W końcu została ścięta, choć jej męczeństwo pomogło rozniecić światło Chrystusa w wielu bezbożnych sercach."
 coptic_flavor.13.a: "Klasztor Świętej Katarzyny na Synaju jest teraz pod naszą opieką."
 coptic_flavor.14.a: "Klasztor Świętej Katarzyny na Synaju jest teraz pod ochroną [From.GetAdjective]."
 coptic_flavor.15.t: "Patriarcha Afryki"
 coptic_flavor.15.d: "Chwalmy Pana w tym najwspanialszym dniu! Przez kolejne wieki wszyscy Koptowie będą celebrować ten dzień na pamiątkę naszego wielkiego zwycięstwa. Wreszcie uwolniliśmy naszego czcigodnego patriarchę, papieża Aleksandrii, z jego złotej klatki w Kairze! Nie będziemy już musieli płaszczyć się przed naszymi wrogami ani czekać dziesiątki lat na mianowanie nowych biskupów. Jest to najważniejszy krok na naszej drodze do przywrócenia Kościołowi koptyjskiemu dawnej świetności, a nawet czegoś więcej."
 coptic_flavor.15.a: "Teraz już nic nas nie powstrzyma!"
 coptic_flavor.15.a.tt: "Koptowie mieszkający w obszarze §YBahari§! mogą wyjść z ukrycia."
 coptic_flavor.16.a: "Niech Bóg błogosławi państwu [From.GovernmentName] [From.GetName]!"
 coptic_flavor.16.d: "Chwalmy Pana w tym najwspanialszym dniu! Przez kolejne stulecia wszyscy Koptowie będą obchodzić tę rocznicę, wspominając wielkie zwycięstwo. Wreszcie nasz czcigodny patriarcha, papież Aleksandrii, został uwolniony przez [From.GetAdjective] państwo [From.GovernmentName] ze złotej klatki w Kairze! Nie będziemy już musieli płaszczyć się przed wrogami ani czekać dziesięcioleci na mianowanie nowych biskupów. To niezwykle ważny krok na drodze do przywrócenia Kościołowi koptyjskiemu dawnej wielkości, a nawet jej przewyższenia."
 coptic_flavor.20.t: "Znaczenie wyższego wykształcenia"
 coptic_flavor.20.d: "Klasztory naszego państwa [Root.GovernmentName] słyną jako ośrodki nauki i sztuki. W każdej szkole klasztornej pracuje wielu uczonych duchownych, specjalizujących się między innymi w historii Kościoła, egzegezie Pisma Świętego, czytaniu, gramatyce, poezji, muzyce, kaligrafii i malarstwie. Klasztory rywalizują o pozyskanie najwybitniejszych mistrzów, zapewniając im wielki szacunek i wysokie wynagrodzenie. W zamian uczeni przekazują wiedzę swoim uczniom — przyszłym duchownym oraz ambitnym możnowładcom. Samo pochodzenie z wpływowej rodziny rzadko wystarcza, by dołączyć do chrześcijańskiej elity. Każdy, kto odgrywa istotną rolę w zarządzaniu naszym krajem, kształcił się w jednej z najbardziej prestiżowych szkół klasztornych.\\n\\nSkontaktowały się z nami dwie takie szkoły, prosząc o wsparcie. Jeśli zdecydujemy się objąć je patronatem, może to przynieść korzyści rozwojowi nauki w naszym państwie."
 coptic_flavor.20.a: "Wesprzemy szkołę specjalizującą się w administracji."
 coptic_flavor.20.a.tt: "Zainwestuj w szkołę klasztorną o profilu administracyjnym."
 coptic_flavor.20.b: "Najlepiej inwestować w sprawy dyplomacji."
 coptic_flavor.20.b.tt: "Zainwestuj w szkołę klasztorną ze specjalizacją dyplomatyczną."
 coptic_flavor.20.c: "Te instytucje mają już dość wpływów. Może to one powinny wspierać nas?"
 coptic_flavor.20.c.tt: "Nałóż dodatkowy podatek na szkoły klasztorne. Wszystko dla dobra państwa."
 administration_monastery_school: "Klasztorna Szkoła Administracji"
 desc_administration_monastery_school: "Nasz rozwój technologiczny jest wzmocniony przez wysoce prestiżową szkołę klasztorną, która specjalizuje się w sprawach administracji."
 diplomacy_monastery_school: "Klasztorna Szkoła Dyplomacji"
 desc_diplomacy_monastery_school: "Nasz rozwój technologiczny jest wspierany przez prestiżową szkołę klasztorną, która specjalizuje się w sprawach dyplomacji."
 coptic_flavor.28.t: "Narodziny Kościoła"
 coptic_flavor.28.d: "Dziś, pięćdziesiąt dni po Wielkanocy, obchodzimy uroczystość Zesłania Ducha Świętego. W tym świętym dniu, wiele wieków temu, narodził się nasz Kościół. Duch Święty zstąpił na Apostołów i innych wyznawców Chrystusa w postaci ognistych języków. Dzięki temu głosili oni słowo Pańskie we wszystkich językach świata i nawrócili tysiące dusz na prawdziwą wiarę. W ten sposób rozpoczęła się nowa era, epoka mesjańska Królestwa Bożego. Na pamiątkę tego wielkiego wydarzenia obchodzimy w Kościele jedną z największych uroczystości. Wspólnie czytamy fragmenty Biblii, śpiewamy radosne hymny i klękamy na modlitwie."
 coptic_flavor.29.t: "Święto Niedzieli Palmowej"
 coptic_flavor.29.d: "Jako Koptowie obchodzimy Niedzielę Palmową, która jest jednym z siedmiu większych świąt Pańskich. W siódmą niedzielę Wielkiego Postu upamiętniamy i przeżywamy triumfalny wjazd Jezusa do świętego miasta Jerozolimy. To właśnie w tym dniu wypędził On kupców i bankierów ze Świątyni. Tłum, który radośnie witał Mesjasza, wymachiwał nad głowami gałązkami palmowymi i tak samo czynimy my, gdy w tym radosnym dniu przechodzimy przez kościół. Podczas procesji śpiewamy radosne hymny i jest to naprawdę jeden z naszych ulubionych momentów w roku kościelnym."
 coptic_flavor.29.a: "W tym wielkim dniu nie oszczędza się na wydatkach!"
 coptic_flavor.28.a.tt: "Poświęć znaczną ilość środków na uroczystość Zesłania Ducha Świętego."
 coptic_flavor.29.a.tt: "Poświęć znaczną ilość środków na święto Niedzieli Palmowej."
 coptic_flavor.29.b: "Nasza miłość do Chrystusa nie jest mierzona w złocie."
 coptic_flavor.28.b.tt: "Jak zwykle obchodź Zielone Świątki."
 coptic_flavor.29.b.tt: "Jak zwykle obchodź Niedzielę Palmową."
 celebrating_lords_feast: "Obchody Święta Pańskiego"
 desc_celebrating_lords_feast: "Obchodzimy jedno z siedmiu większych świąt Pańskich. Nie szczędzimy wydatków na to radosne wydarzenie."
 coptic_flavor.30.t: "W poszukiwaniu duszy"
 coptic_flavor.30.d: "Kilka rozmów o religii, parę błyskotliwych argumentów na temat ludzkiej moralności i jeden z naszych najuczeńszych możnowładców postanowił poświęcić się życiu zakonnemu. „Pójdę śladami świętego Szenutego, archimandryty — może pewnego dnia sam założę klasztor!” — wykrzykuje z pasją.\\nNie wszyscy jednak podzielają decyzję możnowładcy. Choć zaczął już rozdawać swój majątek, być może wciąż można odwieść go od tego zamiaru."
 coptic_flavor.30.a: "Przydałby nam się taki zapał w niektórych prowincjach..."
 coptic_flavor.30.a.tt: "Możnowładca zostanie misjonarzem, pełniącym na rzecz [Root.Monarch.GetTitle] świętą służbę większą niż życie mnicha."
 coptic_flavor.30.b: "Chwileczkę! Na dworze przydadzą nam się uczeni!"
 coptic_flavor.30.b.tt: "Możnowładca zostanie naszym zaufanym doradcą."
 coptic_flavor.30.c: "Pozwólmy mu odnaleźć Boga."
 coptic_flavor.30.c.tt: "Możnowładca opuści dwór, by spędzić życie w odosobnieniu."
 enthusiastic_believer: "Gorliwy wyznawca"
 desc_enthusiastic_believer: "Pewien pobożny szlachcic przyjął święty obowiązek szerzenia wiary wśród zagubionych dusz w naszym państwie."
 coptic_flavor.31.t: "Biały Klasztor"
 coptic_flavor.31.d: "Prowincja Quina wysłała swoich przedstawicieli, aby prosić o środki i wsparcie w odbudowie słynnego starego klasztoru, o którym mówi się, że był domem samego świętego archimandryty Szenutego z Atripe. Fundamenty kamiennych murów zostały położone ponad tysiąc lat temu, a pobożni czciciele z okolicy pragną jedynie przywrócić budowli jej dawną świetność. Z waszą pomocą stanie się on ponownie ośrodkiem wyższej edukacji i studiów nad świętymi pismami - zapewniają."
 coptic_flavor.31.a: "Niech mają swoje książki!"
 coptic_flavor.31.a.tt: "Klasztor zostanie odbudowany."
 coptic_flavor.31.b: "Na tym świecie jest więcej wiedzy niż ta naukowa."
 coptic_flavor.31.b.tt: "Przedstawiciele zostają odesłani do domu rozczarowani."
 songs_of_the_pious: "Pieśni pobożne"
 desc_songs_of_the_pious: "W regionie powstał niedawno nowy kościół. Hymny są mile widzianym dodatkiem do tej ziemi."
 scripture_studies: "Studiowanie świętych pism"
 desc_scripture_studies: "Znajdujący się w regionie Biały Klasztor znany jest z imponującej biblioteki."
 coptic_flavor.32.t: "Nowa era"
 coptic_flavor.32.d: "Z prowincji [pious_province.GetName] dotarła do nas wieść o grupie prostych ludzi, którzy regularnie gromadzą się na wiejskich terenach, by oddawać cześć Panu. Według naszych posłańców od pewnego czasu próbują zbudować miejsce kultu, lecz dodatkowe fundusze mogłyby znacznie przyspieszyć to przedsięwzięcie."
 coptic_flavor.32.a: "Pobożni zostaną nagrodzeni! Zbudujmy kościół!"
 coptic_flavor.32.a.tt: "Powstanie nowy kościół."
 coptic_flavor.32.b: "Mamy ważniejsze sprawy na głowie."
 coptic_flavor.40.t: "Patriarcha [cairo_province.GetName]"
 coptic_flavor.40.d: "Religia koptyjska od dawna jest obecna w prowincji [cairo_province.GetName]. Niektórzy zagraniczni zwolennicy patriarchy twierdzą nawet, że przetrzymujemy Koptów w niewoli na naszych ziemiach... Może należy im przypomnieć, jak naprawdę wygląda sytuacja?"
 coptic_flavor.40.a: "Wyślij wiadomości przypominające sąsiadowi o moich tolerancyjnych rządach."
 coptic_flavor.40.a.tt: "Istnieje szansa, że państwo §Y[ally_to_patriarch.GetName]§! doceni ten gest."
 coptic_flavor.40.b: "Przypomnijmy im, kto sprawuje władzę nad ich papieżem."
 coptic_flavor.40.b.tt: "Istnieje szansa, że państwu §Y[ally_to_patriarch.GetName]§! nie spodoba się ten gest."
 coptic_flavor.40.c: "Nie powinniśmy się angażować."
 coptic_flavor.41.t: "Siedziba patriarchy"
 coptic_flavor.41.d: "Nasi sąsiedzi z państwa [From.GetName] przysłali nam wiadomości o obecnym położeniu błogosławionego patriarchy [cairo_province.GetName]. Z listu wynika, że Jego Świątobliwość jest bardzo zadowolony z poziomu tolerancji religijnej panującej pod rządami [From.GetAdjective]."
 coptic_flavor.41.a: "Miło to słyszeć!"
 coptic_flavor.41.a.tt: "To może być początek pięknej przyjaźni — oba państwa otrzymają modyfikator opinii §YPrzychylność dyplomacji§!, a ich wzajemna opinia wzrośnie o §G+25§!."
 coptic_flavor.41.b: "Czy to jakiś żart?! Naśmiewają się z nas!"
 coptic_flavor.41.b.tt: "Wyślij gniewną odpowiedź."
 coptic_flavor.42.t: "Uwięziony patriarcha"
 coptic_flavor.42.d: "Nasi sąsiedzi z państwa [From.GetName] przysłali nam wiadomość, przypominając, że przetrzymują błogosławionego patriarchę [cairo_province.GetName]. Dopóki Jego Świątobliwość żyje, nie możemy być pewni, jaki poziom tolerancji religijnej rzeczywiście panuje pod rządami [From.GetAdjective]."
 coptic_flavor.42.a: "Nie możemy na to pozwolić! Zawoalowana groźba wciąż jest groźbą!"
 coptic_flavor.42.a.tt: "Dajemy im znać, co o tym myślimy."
 coptic_flavor.42.b: "Nie powinniśmy dać się sprowokować."
 coptic_flavor.42.b.tt: "Na razie puścimy to płazem."
 coptic_flavor.43.t: "Odpowiedź Koptów"
 coptic_flavor.43.da: "Koptowie z państwa [From.GetAdjective] z zadowoleniem przyjęli nasze życzliwe wiadomości! Być może nasze ludy będą żyć w harmonii przez kolejne stulecia?"
 coptic_flavor.43.a: "Miejmy nadzieję."
 coptic_flavor.43.a.tt: "To może być początek pięknej przyjaźni — oba państwa otrzymają modyfikator opinii §YPrzychylność dyplomacji§!, a ich wzajemna opinia wzrośnie o §G+25§!."
 coptic_flavor.43.db: "Podejrzliwi [From.GetAdjective] poczuli się urażeni naszymi wiadomościami, uznając je za zawoalowaną groźbę pod adresem ich patriarchy. W odpowiedzi obsypali nas niewiarygodną liczbą przekleństw. Być może popełniliśmy błąd?"
 coptic_flavor.43.b: "To nie nasza wina."
 coptic_flavor.43.dc: "[From.GetAdjective] poczuli się urażeni naszą zawoalowaną groźbą pod adresem ich patriarchy [cairo_province.GetName]. W odpowiedzi ich władcy wystosowali wojownicze ostrzeżenie, że nie pozwolą tknąć choćby jednego Koptu."
 coptic_flavor.43.c: "Tego właśnie się spodziewaliśmy."
 coptic_flavor.43.dd: "[From.GetAdjective] nie odpowiedzieli na nasze zawoalowane groźby pod adresem ich patriarchy [cairo_province.GetName]. Albo nie dbają o swoje święte miejsce, albo zbyt boją się potężnego [Root.GetName], by wystąpić przeciwko nam."
 coptic_flavor.43.d: "Dostali wiadomość."
 SELECT_CULTURE_CONFIRM_TITLE: "Potwierdź zmianę kulturową"
 PROMOTE_CULTURE_CONFIRM_TITLE: "Potwierdź promowanie kultury"
 DEMOTE_CULTURE_CONFIRM_TITLE: "Potwierdź degradację kultury"
 SELECT_CULTURE_CONFIRM_DESC: "Zmiana naszej głównej kultury na kulturę $NAME|Y$ będzie nas kosztować $COST|Y$£dip.\nCzy na pewno chcesz to zrobić?"
 PROMOTE_CULTURE_CONFIRM_DESC: "Promowanie kultury $NAME|Y$ na kulturę akceptowaną będzie nas kosztować $COST|Y$£dip.\nCzy na pewno chcesz to zrobić?"
 DEMOTE_CULTURE_CONFIRM_DESC: "Degradacja kultury $NAME|Y$ poprzez pozbawienie jej statusu kultury akceptowanej będzie nas kosztować $COST|Y$£dip.\nPonadto §Ypoziom niepokojów§! we wszystkich prowincjach tej kultury wzrośnie o $UNREST$ na okres $YEARS$ lat.\nCzy na pewno chcesz to zrobić?"
 coptic_flavor.33.t: "Sojusznicy wiary"
 coptic_flavor.33.d: "Jesteśmy dumni, że jesteśmy Koptami i wyznawcami prawdziwej wiary. Choć niezachwianie trwamy przy naszych przekonaniach i nigdy nie porzucimy Chrystusa, odizolowanie od reszty wspólnoty chrześcijańskiej stanowi naszą słabość. Z wielu stron otaczają nas religijni wrogowie. Nadchodząca wojna nie jest kwestią tego, czy wybuchnie, lecz kiedy to nastąpi. Zanim do niej dojdzie, powinniśmy poszukać potężnych sojuszników. Daleko na północy znajduje się wielkie chrześcijańskie państwo, lecz nie znamy dokładnego położenia jego ziem ani odległości, jaka nas od nich dzieli. Możemy jednak sfinansować wyprawę, której celem będzie odnalezienie tego kraju."
 coptic_flavor.33.a: "Wyślijmy grupę naszych najlepszych odkrywców, kapłanów i dyplomatów!"
 coptic_flavor.33.a.tt: "Wyślij ekspedycję na północ w poszukiwaniu braci chrześcijan. Sukces nie jest gwarantowany, ale moglibyśmy uzyskać jakąś pomoc w sprawie naszych wspólnych wrogów religijnych."
 coptic_flavor.33.b: "Nie potrzebujemy wsparcia, gdy Bóg jest po naszej stronie."
 coptic_flavor.33.b.tt: "Nie wysyłamy ekspedycji."
 coptic_flavor.34.t: "Książki lub miecze"
 coptic_flavor.34.d: "Grupa koptyjskich dyplomatów z sąsiedniego państwa [From.GetName] przekroczyła nasze granice. Wśród przybyszów jest wyjątkowo wielu kapłanów. Nasi doradcy podejrzewają, że próbują nawiązać kontakt z innymi chrześcijanami na północy. Dyplomaci niepokojąco skąpią informacji o celu swojej misji. Być może chodzi jedynie o sprawy religijne, ale co, jeśli próbują zgromadzić sojuszników przeciwko nam? Fanatyczni niewierni mogliby zaatakować nas z wielu stron!"
 coptic_flavor.34.a: "To tylko przypuszczenia. Możemy przepuścić dyplomatów [From.GetAdjective]."
 coptic_flavor.34.b: "Nie możemy ryzykować. Zatrzymajcie ich."
 coptic_flavor.35.t: "Wróg wiary"
 coptic_flavor.35.d: "Dotarła do nas wiadomość, że nasi podli sąsiedzi z państwa [From.GovernmentName] [From.GetName] pojmali naszych dyplomatów! Nie chcą ani pozwolić im kontynuować podróży, ani odesłać ich do ojczyzny. Możemy jedynie mieć nadzieję, że zmienią zdanie. Ten haniebny atak na pokojową misję poselską potwierdza jednak nasze podejrzenia. [From.GetName] jest niebezpiecznym wrogiem jedynej prawdziwej wiary."
 coptic_flavor.35.a: "Niech Bóg porazi niewiernych!"
 coptic_flavor.36.t: "Bracia zza morza"
 coptic_flavor.36.d: "Czasami przypominamy sobie, jak rozległy jest świat poza granicami naszych państw. Odwiedziła nas osobliwa grupa ludzi z krain leżących daleko na południu. Większość mówi jedynie we własnym, dziwnie brzmiącym języku, lecz kilku z nich porozumiało się z naszymi tłumaczami po arabsku. Twierdzą, że przybywają z wielkiego państwa [sent_diplomats.GovernmentName] [sent_diplomats.GetName] i szukają przyjaciół wśród współwyznawców. Niewiele wiemy o chrześcijanach z południa, lecz ci [sent_diplomats.GetAdjective] wydają się prawdziwymi wiernymi. Z zapałem mówią o Chrystusie i znają Pismo znacznie lepiej niż przeciętny możnowładca. Ich kraj jest podobno otoczony przez religijnych wrogów, dlatego proszą nas o pomoc w obronie prawdziwej wiary. Konflikt jest zbyt odległy i nieznany, byśmy mogli bezpośrednio się w niego zaangażować, możemy jednak podzielić się z nimi częścią naszej wiedzy i zasobów."
 coptic_flavor.36.a: "Oczywiście, że wam pomożemy, bracia. Wszystko dla jedynego prawdziwego Boga!"
 coptic_flavor.36.a.tt: "Dyplomaci [From.GetAdjective] wracają do ojczyzny z zasobami, które pomogą im bronić chrześcijaństwa."
 coptic_flavor.36.b: "To nie jest nasze zmartwienie. Mamy własne wojny do stoczenia."
 coptic_flavor.36.b.tt: "Dyplomaci [From.GetAdjective] wracają do ojczyzny z pustymi rękami."
 coptic_flavor.37.t: "Przyjaciele w odległych krainach"
 coptic_flavor.37.d: "Chwalmy Pana, nasi dyplomaci wreszcie wrócili z podróży na północ! Nie tylko powrócili do nas cali i zdrowi, lecz przywieźli także wiele interesujących ksiąg i opowieści ze swoich wojaży. Większość pochodzi z państwa [From.GovernmentName] [From.GetName], gdzie nasi posłowie zostali bardzo dobrze przyjęci. Liczyliśmy być może na więcej niż samą wiedzę, ale jesteśmy wdzięczni za wszystko, co ofiarowali nam Bóg i nasi współwyznawcy. Dopilnujemy, by ich dar się nie zmarnował."
 coptic_flavor.37.a: "Czy to początek trwałej przyjaźni między naszymi państwami?"
 coptic_flavor.38.t: "Samotni na świecie"
 coptic_flavor.38.d: "Wysłani na północ dyplomaci, wreszcie wrócili po żmudnej i długiej podróży. Co prawda udało im się w końcu dotrzeć do ziem chrześcijańskich, lecz wrócili z pustymi rękoma. Chociaż mogło się wydawać, że napotkani chrześcijanie ich słuchają, tylko kilku naprawdę zależało. Jesteśmy podwójnie przeklęci w naszym odosobnieniu – nie tylko jesteśmy otoczeni przez wroga, ale również dystans od reszty wspólnoty chrześcijańskiej czyni nas wyrzutkami. To, co dzieje się w państwie [Root.GetName] widocznie ich nie obchodzi. Być może nasze drogi są zbyt odmienne, aby z nami obcować. Wygląda na to, że Koptowie są samotni na tym świecie."
 coptic_flavor.38.a: "Nie możemy stracić wiary. Bóg jest jedynym sojusznikiem, jakiego potrzebujemy."
 opinion_captured_diplomats: "Pojmani dyplomaci"
 coptic_flavor.100.t: "Pielgrzymi z [Root.GetName]"
 coptic_flavor.100.da: "W ostatnim czasie wiele zagubionych dusz przybywa do klasztoru w prowincji [Root.GetName], szukając duchowego przewodnictwa. Region staje się coraz popularniejszym celem pielgrzymów pragnących pokuty i rozgrzeszenia zgodnie z naukami świętego Antoniego. Pustynne jaskinie doskonale nadają się do życia pustelniczego, pozwalając najbardziej oddanym Koptom spędzać lata w kontemplacyjnym odosobnieniu.\\n\\nMieszkańcy [Root.GetName] są dumni z tej pobożności. Kilka odpowiednio dobranych słów zachęty mogłoby jeszcze bardziej podnieść ich poczucie własnej wartości..."
 coptic_flavor.100.db: "W ostatnim czasie wiele zagubionych dusz przybywa do klasztoru w prowincji [Root.GetName], szukając duchowego przewodnictwa. Region staje się coraz popularniejszym celem pielgrzymów pragnących pokuty i rozgrzeszenia zgodnie z naukami świętego Antoniego. Okoliczne pustkowia doskonale nadają się do życia pustelniczego, pozwalając najbardziej oddanym Koptom spędzać lata w kontemplacyjnym odosobnieniu.\\n\\nMieszkańcy [Root.GetName] są dumni z tej pobożności. Kilka odpowiednio dobranych słów zachęty mogłoby jeszcze bardziej rozbudzić ich entuzjazm..."
 coptic_flavor.100.a: "Przypomnijmy ludowi o zaletach ciężkiej pracy."
 coptic_flavor.100.b: "Powiedzmy im, że musimy być gotowi bronić naszej wiary za wszelką cenę."
 inspired_workers: "Zainspirowani robotnicy"
 desc_inspired_workers: "Robotnicy w tym regionie czerpią siłę z pobożności swojej wspólnoty."
 inspired_soldiers: "Zainspirowani żołnierze"
 desc_inspired_soldiers: "Żołnierze w tym regionie czerpią siłę z pobożności swojej wspólnoty."
 coptic_flavor.101.t: "Złupiony klasztor"
 coptic_flavor.101.d: "Jedna z naszych prowincji wysłała przedstawicieli z prośbą o środki i wsparcie w odbudowie starego klasztoru, niedawno złupionego podczas najazdu rozbójników. Fundamenty kamiennych murów położono przed pokoleniami, a mieszkańcy od dawna pragną przywrócić budowlę do dawnej świetności i uczynić z niej miejsce świętego kultu. Każda pomoc udzielona wspólnocie może zyskać nam przychylność miejscowej ludności."
 coptic_flavor.101.a: "Wyślijmy im nieco zasobów."
 coptic_flavor.101.a.tt: "Klasztor zostanie odbudowany."
 coptic_flavor.101.b: "Mogą modlić się we własnych domach."
 coptic_flavor.101.b.tt: "Przedstawiciele wrócą do domu rozczarowani."
 monastery_repaired: "Odbudowany klasztor"
 desc_monastery_repaired: "Klasztor, który spłonął w tym miejscu, został szybko odbudowany."
 coptic_flavor.150.t: "Szerszy świat chrześcijański"
 coptic_flavor.150.d: "Podbój Aleksandrii jest wielkim zwycięstwem nie tylko dla Koptów z Egiptu. Wielkie włoskie miasta kupieckie mają stałe przedstawicielstwa w tym ważnym porcie i bardzo chętnie prowadzą z nami interesy. Kupcy rywalizują teraz o względy [Root.Monarch.GetTitle], który dokonał tego, czego nie zdołali osiągnąć krzyżowcy. Dzięki ich pośrednictwu nawiązaliśmy kontakty z wieloma innymi państwami chrześcijańskimi we wschodniej części Morza Śródziemnego."
 coptic_flavor.150.a: "„Pamiętajcie, aby często gromadzić się razem, dziękować Bogu i głosić Jego chwałę”."
 coptic_flavor.150.a.tt: "Nasze mapy wschodniej części Morza Śródziemnego są teraz dokładniejsze."
 HOLY_SITE_1227_DESC: "W Aksum wznosi się Kościół Najświętszej Marii Panny z Syjonu, zbudowany w IV wieku za panowania Ezany, pierwszego chrześcijańskiego władcy starożytnego imperium Aksum. Według legend to właśnie tutaj wielki cesarz Menelik I, syn króla Salomona i królowej Saby, przywiózł Arkę Przymierza po swojej podróży do Jerozolimy."
 HOLY_SITE_358_DESC: "Aleksandria jest historyczną siedzibą Kościoła koptyjskiego, choć od XI wieku jego patriarcha, papież Aleksandrii, rezyduje w Kairze. Gdy papież mieszkał w Aleksandrii, jego siedzibą była katedra św. Marka, wzniesiona ku czci Marka Ewangelisty, założyciela Kościoła koptyjskiego. Od tysiącleci Aleksandria pozostaje ośrodkiem nauki; to tutaj powstała pierwsza na świecie szkoła katechetyczna."
 HOLY_SITE_419_DESC: "Według tradycji katedrę w Eczmiadzynie w Wagharszapat założyli święty Grzegorz Oświeciciel i święty Tiridates Wielki. Mimo wielowiekowej obcej okupacji pozostaje ona jednym z najważniejszych świętych miejsc Ormiańskiego Kościoła Apostolskiego."
 HOLY_SITE_2313_DESC: "Antiochia, kolebka chrześcijaństwa, była ważnym ośrodkiem tej religii w czasach rzymskich. Stała się siedzibą jednego z pięciu pierwotnych patriarchatów, obok Konstantynopola, Jerozolimy, Aleksandrii i Rzymu. Niegdyś tętniąca życiem metropolia licząca pół miliona mieszkańców podupadła wskutek zniszczeń podczas krucjat. W XIII wieku miasto zostało zrównane z ziemią przez muzułmanów, a cała jego chrześcijańska ludność została zniewolona lub wymordowana."
 HOLY_SITE_1234_DESC: "Starożytne miasto Kasr Ibrim stało się ośrodkiem chrześcijaństwa w VIII wieku, a największy rozkwit osiągnęło w okresie eparchii Nobadii. Nawet gdy reszta Makurii przyjęła islam, mieszkańcy Kasr Ibrim pozostali chrześcijanami i wyznają tę wiarę do dziś. Położone na szczycie urwiska górującego nad Nilem miasto zyskało wielkie znaczenie gospodarcze, polityczne i religijne."
 MDEATH_HAREM_SUCCESSION: "Ponieważ nasz władca nie wyznaczył preferowanego następcy, sułtanem zostanie mniej znaczący syn z dynastii $DYNASTY|Y$."
 harem_events.1.t: "Synowie [Root.Monarch.GetName]"
 harem_events.1.da: "Jego Cesarska Mość [Root.Monarch.GetName] [Root.Monarch.GetTitle], władca dynastii Osmanów, sułtan sułtanów i chan chanów, cieszy się opinią wielkiego człowieka, a jego pozycja jako władcy nie podlega dyskusji.\\nZgodnie ze swoją rangą i możliwościami sułtan spłodził kilku zdolnych synów, z których wielu zapowiada się na przyszłych władców. Zarówno oni sami, jak i urzędnicy państwowi wiedzą jednak, że tron może odziedziczyć tylko jeden, a pozostali nie otrzymają nagrody pocieszenia. Nasi wezyrowie stanowczo twierdzą, że nadszedł czas, by [Root.Monarch.GetName] wskazał faworyta spośród potencjalnych następców. Nie zakończy to zapewne rywalizacji o jego względy, ale powinno zapobiec najgorszym walkom o sukcesję, które mogłyby wybuchnąć, gdyby nasz [Root.Monarch.GetTitle] odszedł z tego świata bez wyznaczenia następcy."
 harem_events.1.db: "Jego Cesarska Mość [Root.Monarch.GetName] [Root.Monarch.GetTitle], władca dynastii Osmanów, sułtan sułtanów, chan chanów, Kajser-i Rum i cesarz trzech miast: Konstantynopola, Adrianopola i Bursy, cieszy się opinią wielkiego człowieka, a jego pozycja jako władcy nie podlega dyskusji.\\nZgodnie ze swoją rangą i możliwościami sułtan spłodził kilku zdolnych synów, z których wielu zapowiada się na przyszłych władców. Zarówno oni sami, jak i urzędnicy państwowi wiedzą jednak, że tron może odziedziczyć tylko jeden, a pozostali nie otrzymają nagrody pocieszenia. Nasi wezyrowie stanowczo twierdzą, że nadszedł czas, by [Root.Monarch.GetName] wskazał faworyta spośród potencjalnych następców. Nie zakończy to zapewne rywalizacji o jego względy, ale powinno zapobiec najgorszym walkom o sukcesję, które mogłyby wybuchnąć, gdyby nasz [Root.Monarch.GetTitle] odszedł z tego świata bez wyznaczenia następcy."
 harem_events.1.dc: "Jego Cesarska Mość [Root.Monarch.GetName] [Root.Monarch.GetTitle], władca dynastii Osmanów, sułtan sułtanów, chan chanów, opiekun dwóch szlachetnych sanktuariów, Kajser-i Rum i cesarz trzech miast: Konstantynopola, Adrianopola i Bursy, cieszy się opinią wielkiego człowieka, a jego pozycja jako władcy nie podlega dyskusji.\\nZgodnie ze swoją rangą i możliwościami sułtan spłodził kilku zdolnych synów, z których wielu zapowiada się na przyszłych władców. Zarówno oni sami, jak i urzędnicy państwowi wiedzą jednak, że tron może odziedziczyć tylko jeden, a pozostali nie otrzymają nagrody pocieszenia. Nasi wezyrowie stanowczo twierdzą, że nadszedł czas, by [Root.Monarch.GetName] wskazał faworyta spośród potencjalnych następców. Nie zakończy to zapewne rywalizacji o jego względy, ale powinno zapobiec najgorszym walkom o sukcesję, które mogłyby wybuchnąć, gdyby nasz [Root.Monarch.GetTitle] odszedł z tego świata bez wyznaczenia następcy."
 harem_events.1.dd: "Jego Cesarska Mość [Root.Monarch.GetName] [Root.Monarch.GetTitle], władca dynastii Osmanów, sułtan sułtanów, chan chanów, Kajser-i Rum, cesarz trzech miast: Konstantynopola, Adrianopola i Bursy, dowódca wiernych i następca Proroka Pana Wszechświata, opiekun dwóch szlachetnych sanktuariów, cieszy się opinią wielkiego człowieka, a jego pozycja jako władcy nie podlega dyskusji.\\nZgodnie ze swoją rangą i możliwościami sułtan spłodził kilku zdolnych synów, z których wielu zapowiada się na przyszłych władców. Zarówno oni sami, jak i urzędnicy państwowi doskonale wiedzą, że tron może odziedziczyć tylko jeden, a pozostali znają swój los. Nasi wezyrowie stanowczo twierdzą, że nadszedł czas, by [Root.Monarch.GetName] wskazał faworyta spośród potencjalnych następców. Nie zakończy to zapewne rywalizacji o jego względy, ale powinno zapobiec najgorszym walkom o sukcesję, które mogłyby wybuchnąć, gdyby nasz [Root.Monarch.GetTitle] odszedł z tego świata bez wyznaczenia następcy."
 harem_events.1.female: "Jej Cesarska Mość [Root.Monarch.GetName] [Root.Monarch.GetTitle], władczyni dynastii Osmanów i sułtanka sułtanów, cieszy się opinią wielkiej kobiety, a jej pozycja jako władczyni nie podlega dyskusji.\\nZgodnie ze swoją rangą i możliwościami sułtanka wydała na świat kilkoro zdolnych dzieci, z których wiele zapowiada się na przyszłych władców. Zarówno oni sami, jak i urzędnicy państwowi doskonale wiedzą, że tron może odziedziczyć tylko jedno z nich, a pozostali znają swój los. Nasi wezyrowie stanowczo twierdzą, że nadszedł czas, by [Root.Monarch.GetName] wskazała faworyta spośród potencjalnych następców. Nie zakończy to zapewne rywalizacji o jej względy, ale powinno zapobiec najgorszym walkom o sukcesję, które mogłyby wybuchnąć, gdyby nasza [Root.Monarch.GetTitle] odeszła z tego świata bez wyznaczenia następcy."
 harem_events.1.a: "Naszym faworytem jest pobożny syn."
 harem_events.1.b: "Naszym faworytem jest najsilniejszy syn."
 harem_events.1.c: "Naszym faworytem jest najpilniejszy w nauce syn."
 harem_events.1.d: "Naszym faworytem jest najbardziej towarzyski syn."
 harem_events.1.e: "Naszym faworytem jest urodzony przywódca."
 harem_events.1.f: "Naszym faworytem jest najprzystojniejszy syn."
 harem_events.1.g: "Naszym faworytem jest przedsiębiorczy syn."
 harem_events.1.h: "Naszym faworytem jest najbardziej dociekliwy syn."
 harem_events.1.i: "Naszym faworytem jest syn o największych zdolnościach."
 harem_events.1.j: "Naszym faworytem jest hojny syn."
 harem_events.2.t: "Kılıç alayı"
 harem_events.2.d: "Osmańska ceremonia koronacyjna jest jednym z najwspanialszych wydarzeń, jakie większość ludzi zobaczy w życiu. Koronacja [Root.Monarch.GetName] nie jest wyjątkiem. Gdy szarif Konyi przypasuje [Root.Monarch.GetName] Miecz Osmana, nasi wezyrowie spoglądają jednak na [Root.Monarch.GetHerHim] z pewną obawą. [Root.Monarch.GetSheHeCap] nigdy nie należał do najbardziej oczywistych kandydatów i prawdopodobnie nie zasiadłby na tronie, gdyby wcześniej wyłoniono wyraźnego faworyta.\\nNiektórzy twierdzą wręcz, że to przeciętność [Root.Monarch.GetHerHis] pozwoliła [Root.Monarch.GetName] zwyciężyć. Wybitniejsi ludzie nie uważali [Root.Monarch.GetHerHim] za zagrożenie, a inni liczyli, że będą mogli rządzić imperium za [Root.Monarch.GetHerHis] pośrednictwem. Jedno nasz nowy [Root.Monarch.GetTitle] udowodnił bezsprzecznie: gdy zajdzie taka potrzeba, [Root.Monarch.GetSheHe] nie zawaha się wbić sztyletu w plecy tym, którzy [Root.Monarch.GetHerHim] zaufali."
 harem_events.2.a: "Niech żyje [Root.Monarch.GetTitle]!"
 harem_events.2.a.tt: "Tylko czas pokaże, jakim władcą okaże się §Y[Root.Monarch.GetName]§!."
 harem_events.3.t: "Sancaga çikma"
 harem_events.3.d: "Nasz faworyt i następca tronu, [Root.Heir.GetName], jest młody i wciąż musi się wiele nauczyć o życiu oraz o tym, jak być dobrym władcą. Większość naszych wezyrów uważa, że powinniśmy podtrzymać dynastię tradycję powierzania synom urzędów gubernatorów i zarządców niewielkich prowincji. W ten sposób mogą poznać obowiązki władcy. Przydzielając im odpowiednio silne prowincje, możemy również ograniczyć ryzyko przyszłej walki o sukcesję. Prowincja [sancaga_cikma_province.GetName] służyła już niegdyś jako takie gubernatorstwo i zapewne doskonale nada się dla [Root.Heir.GetName].\\nInni, w tym nasza matka, sułtanka-walide, uważają, że młody [Root.Heir.GetName] najwięcej skorzysta na edukacji za murami Cesarskiego Haremu. Będzie tam miał stały dostęp do dobrych nauczycieli i opiekę osób, które go znają. Dzięki temu pozostanie również z dala od miejsc, w których mógłby przedwcześnie rozwinąć ambicje polityczne."
 harem_events.3.a: "Rządy w prowincji [sancaga_cikma_province.GetName] dobrze mu zrobią."
 harem_events.3.a.tt: "§Y[Root.Heir.GetName]§! otrzyma pełną kontrolę nad prowincją §Y[sancaga_cikma_province.GetName]§! i jeśli wszystko pójdzie dobrze, powróci z większymi zdolnościami przywódczymi."
 harem_events.3.b: "Cesarski Harem to idealne miejsce dla młodego [Root.Heir.GetWomanMan]!"
 harem_events.3.b.tt: "§Y[Root.Heir.GetName]§! pozostanie w §Y[Root.Capital.GetCapitalName]§!, gdzie będzie bezpieczniejszy, lecz nie będzie miał okazji rozwijać swoich zdolności przywódczych."
 heir_in_training: "Następca Gubernatora"
 desc_heir_in_training: "Powierzyliśmy tę prowincję naszemu następcy tronu, mając nadzieję, że zdobyte doświadczenie wzmocni jego przyszłe zdolności przywódcze."
 harem_events.4.t: "Sancaga çikma"
 harem_events.4.d: "[Root.Heir.GetName] powrócił z okresu sprawowania urzędu gubernatora. Według [Root.Heir.GetHerselfHimself] doświadczenie to wzbogaciło [Root.Heir.GetHerHim] na wiele sposobów, a [Root.Heir.GetSheHe] jest lepiej przygotowany niż kiedykolwiek, by objąć tron, gdy Bóg wezwie naszego czcigodnego [Root.Monarch.GetTitle]. Nie dostrzegamy jednak wyraźnych oznak, by nasz faworyt rzeczywiście czegoś się nauczył. W haremie krążą za to plotki, że jedynym sposobem, w jaki [Root.Heir.GetName] się wzbogacił, było napełnianie własnych kieszeni podczas poboru lokalnych podatków."
 harem_events.4.a: "W takim razie wszystko w porządku."
 harem_events.4.a.tt: "§Y[Root.Heir.GetName]§! jest starszy i mądrzejszy, lecz poza tym pozostał tą samą osobą, którą był przed wyjazdem."
 harem_events.5.t: "Roszczenia [Root.Heir.GetName] do tronu"
 harem_events.5.da: "Sprawowanie urzędu gubernatora prowincji niewątpliwie może nauczyć wielu cennych rzeczy tych, którzy pewnego dnia będą rządzić imperium. Pozwala również po raz pierwszy zakosztować prawdziwej władzy. Plotki o szerzącej się chorobie w pałacu Topkapı musiały dotrzeć do [Root.Heir.GetName]. Zamiast zbadać sytuację lub modlić się o nasze zdrowie, [Root.Heir.GetSheHe] uznał, że to doskonała okazja, by przejąć władzę, która i tak miała mu kiedyś przypaść."
 harem_events.5.db: "Sprawowanie urzędu gubernatora prowincji niewątpliwie może nauczyć wielu cennych rzeczy tych, którzy pewnego dnia będą rządzić imperium. Pozwala również po raz pierwszy zakosztować prawdziwej władzy. Plotki o szerzącej się chorobie w Pałacu Królewskim musiały dotrzeć do [Root.Heir.GetName]. Zamiast zbadać sytuację lub modlić się o nasze zdrowie, [Root.Heir.GetSheHe] uznał, że to doskonała okazja, by przejąć władzę, która i tak miała mu kiedyś przypaść."
 harem_events.5.a: "Zdrada!"
 harem_events.6.t: "Lata spędzone w prowincji [heir_governorship_province.GetName]"
 harem_events.6.d: "[Root.Heir.GetName] powrócił do [Root.Capital.GetCapitalName] po zakończeniu kadencji gubernatora prowincji [heir_governorship_province.GetName]. [Root.Heir.GetSheHeCap] twierdzi, że te lata nauczyły [Root.Heir.GetHerHim] wielu rzeczy o kierowaniu rządem i funkcjonowaniu naszego systemu prowincjonalnego na szczeblu lokalnym. Podczas pobytu z dala od [Root.Capital.GetCapitalName] [Root.Heir.GetSheHe] miał wiele okazji, by dowodzić miejscowymi wojskami, nadzorować administrację i radzić sobie z lokalnymi możnowładcami."
 harem_events.6.a: "Wyśmienicie..."
 harem_events.7.t: "Strach przed jedwabnym sznurem"
 harem_events.7.d: "Podczas ustalania szczegółów sukcesji po [Root.Monarch.GetName] dotarły do nas wieści z [enthronement_or_death.GetName]. Wygląda na to, że jeden z braci Jego Cesarskiej Mości woli zginąć w walce, niż poddać się tradycyjnym procedurom po przegranej walce o tron. Podczas piątkowych modlitw w [enthronement_or_death.GetName] odczytano jego imię i wkrótce zgromadzono armię, która ma obalić naszego nowego [Root.Monarch.GetTitle]."
 harem_events.7.a: "Zabić ich. Zabić ich wszystkich."
 harem_events.8.t: "Śmierć sułtanki-walide"
 harem_events.8.da: "Odkąd [Root.Monarch.GetSheHe] był młodym szahzade w Cesarskim Hare­mie, [Root.Monarch.GetName] zawsze miał przy sobie [Root.Monarch.GetHerHis] matkę. Przez całą karierę służyła mu radą i ochroną, a gdy [Root.Monarch.GetSheHe] wstąpił na tron, pozostała jedną z najbliższych powiernic i najbardziej wpływowych doradczyń. Choć była już bardzo starą kobietą, wieść o jej śmierci ciężko dotknęła naszego [Root.Monarch.GetTitle], który stracił jednocześnie dobrą przyjaciółkę, doradczynię i matkę."
 harem_events.8.db: "Odkąd był młodym szahzade w Cesarskim Hare­mie, [Root.Monarch.GetName] zawsze miał przy sobie matkę. Przez całą jego karierę służyła mu radą i ochroną, a gdy [Root.Monarch.GetSheHe] wstąpił na tron, pozostała jedną z jego najbliższych powiernic i najbardziej wpływowych doradczyń. Wiadomość o jej przedwczesnej śmierci była dla naszego [Root.Monarch.GetTitle] ciężkim ciosem i zaskoczeniem. Stracił dobrą przyjaciółkę, doradczynię i matkę o wiele za wcześnie."
 harem_events.8.dc: "Odkąd [Root.Monarch.GetSheHe] był młodym szahzade w Cesarskim Hare­mie, [Root.Monarch.GetName] zawsze miał przy sobie matkę. Przez całą jego karierę służyła mu radą i ochroną, a gdy [Root.Monarch.GetSheHe] wstąpił na tron, pozostała jedną z jego najbliższych powiernic i najbardziej wpływowych doradczyń. Wiadomość o jej przedwczesnej śmierci jest ciężkim ciosem dla naszego [Root.Monarch.GetTitle], który stracił dobrą przyjaciółkę, doradczynię i matkę."
 harem_events.8.a: "Imperium będzie ją opłakiwać przez trzy dni."
 harem_events.8.b: "Musimy przeznaczyć ziemie na fundację dobroczynną ku jej pamięci!"
 waqf_for_dead_valide_sultan: "Fundacja ku pamięci sułtanki-walide"
 desc_waqf_for_dead_valide_sultan: "Przeznaczyliśmy dochody z kilku źródeł w tej prowincji na utrzymanie meczetu i jadłodajni ku pamięci naszej Cesarskiej Matki, sułtanki-walide."
 harem_events.9.t: "Obrzędy przejścia"
 harem_events.9.d: "Podobnie jak dawni sułtani, [Root.Heir.GetName] pragnie zdobyć sławę jako zdobywca i [Root.Monarch.GetTitle], który poprowadzi imperium z grzbietu konia. Ponieważ [Root.Monarch.GetName] nadal cieszy się dobrym zdrowiem, a my nie pozwoliliśmy następcy tronu osobiście wyruszyć na pole bitwy, spełnienie tego marzenia pozostaje niepewne. Pozostali szahzade zaczęli już drwić z [Root.Heir.GetName], a [Root.Heir.GetHerHis] matka błaga [Root.Monarch.GetName], by powierzył [Root.Heir.GetHerHim] własne dowództwo.\\nNie jest to nierozsądna prośba, choć należy zastanowić się nad motywami tych, którzy próbują nakłonić naszego faworyta do ryzykowania życia i zdrowia."
 harem_events.9.a: "To dobrze mu zrobi."
 harem_events.9.b: "W haremie jest znacznie bezpieczniej."
 harem_events.10.t: "Zdrada w rodzinie"
 harem_events.10.d: "Dotarły do nas wieści, że ukochany i najbardziej faworyzowany syn, [Root.Heir.GetName], spiskuje przeciwko własnemu ojcu i zamierza obalić państwo. Nasza zaufana i najbliższa małżonka, sułtanka haseki, błaga nas, byśmy usunęli tę zarazę z naszego organizmu i kazali zamordować [Root.Heir.GetName].\\nNie ma wątpliwości, że sułtanka haseki kieruje się w tej sprawie własnym interesem — [Root.Heir.GetName] nie jest jej synem, a jego następca najpewniej nim będzie. Nasi ministrowie również mówią jednak o zdradzie [Root.Heir.GetName], a on sam może stanowić realne zagrożenie."
 harem_events.10.a: "[Root.Heir.GetName] musi zginąć..."
 harem_events.10.a.tt: "Wyślij skrytobójców, by zabili §Y[Root.Heir.GetName]§!.\\nJeśli im się nie powiedzie, wywoła to bunt niezależnie od jego winy."
 harem_events.10.b: "Wezwijmy [Root.Heir.GetName], by się bronił."
 harem_events.10.b.tt: "Jeśli plotki są prawdziwe, da to §Y[Root.Heir.GetName]§! czas na zgromadzenie większej armii."
 harem_events.10.c: "Nie będę słuchać tych kłamstw!"
 harem_events.10.c.tt: "§Y[Root.Consort.GetName]§! traci łaskę.\\nJeśli plotki są prawdziwe, da to §Y[Root.Heir.GetName]§! czas na zgromadzenie większej armii."
 harem_events.11.t: "[Root.Heir.GetName] jest niewinny"
 harem_events.11.d: "Po otrzymaniu czasu na przedstawienie swojej sprawy [Root.Heir.GetName] całkowicie przekonał naszego [Root.Monarch.GetTitle] o swojej niewinności i pozostanie najbardziej faworyzowanym spośród naszych następców. Cała ta sytuacja umocniła jego pozycję na dworze oraz wśród mieszkańców [Root.Capital.GetCapitalName]."
 harem_events.11.a: "Niełatwo mnie oszukać."
 harem_events.12.t: "Spisek [Root.Heir.GetName]"
 harem_events.12.d: "Czas, który zapewniła nasza niezdecydowana postawa, wystarczył [Root.Heir.GetName], by zgromadzić armię buntowników, którą zamierzał wystawić. Siódmego dnia po ujawnieniu spisku, gdy słońce chyli się ku zachodowi, wojska maszerują już w stronę [Root.Capital.GetCapitalName]."
 harem_events.12.a: "Tak synu?"
 harem_events.13.t: "Los księcia korony"
 harem_events.13.d: "Skrytobójcy wysłani przez nas, by zabić Vali Ahada, powrócili po pomyślnym wykonaniu zadania. Nigdy nie dowiemy się, czy rzeczywiście był winny zdrady."
 harem_events.13.a: "Wielka tragedia."
 harem_events.14.t: "Los księcia korony"
 harem_events.14.d: "Skrytobójcy, których posłaliśmy w celu zabicia księcia korony, odnieśli porażkę. Nasz były dziedzic uciekł ze stolicy wraz z grupą swoich najbliższych zwolenników i przygotowuje się do walki o życie."
 harem_events.14.a: "Wielka tragedia."
 harem_events.15.t: "Książę-gubernator na pograniczu"
 harem_events.15.da: "Zgodnie z naszym turkijskim dziedzictwem pozwoliliśmy kilku szahzadom pełnić funkcję gubernatorów różnych prowincji imperium. Obecna wojna z niewiernymi [enemy_neighbor_ottomans.GetAdjective] dała książęcemu gubernatorowi prowincji [ottoman_prince_here.GetName] okazję, by dowieść wartości jako dowódca wojskowy i gazi. Według doniesień dołożył wszelkich starań, by pokonać wrogie oddziały w swoim regionie, przenosząc walki na drugą stronę granicy. Wierni tłumnie garną się pod jego sztandary, a elita wojskowa zaczyna zwracać na niego uwagę i może poprzeć go w przyszłej walce o sukcesję."
 harem_events.15.db: "Zgodnie z naszym turkijskim dziedzictwem pozwoliliśmy kilku szahzadom pełnić funkcję gubernatorów różnych prowincji imperium. Obecna wojna z [enemy_neighbor_ottomans.GetAdjective] dała książęcemu gubernatorowi prowincji [ottoman_prince_here.GetName] okazję, by dowieść swoich zdolności dowódcy wojskowego. Według doniesień dołożył wszelkich starań, by pokonać wrogie oddziały w swoim regionie, przenosząc walki na drugą stronę granicy. Rekruci tłumnie garną się pod jego sztandary, a elita wojskowa zaczyna zwracać na niego uwagę i może poprzeć go w przyszłej walce o sukcesję."
 harem_events.15.a: "Dowiódł, że zasługuje na miano naszego nowego faworyta."
 harem_events.15.b: "Udowodnił sobie, że jest prawdziwym synem Osmana."
 harem_events.15.b.tt: "Pozycja §Y[Root.Heir.GetName]§! nieco słabnie, ponieważ jego przeciwnicy zyskują na sile."
 harem_events.16.t: "Wsparcie sułtanki-walide"
 harem_events.16.d: "Ogłoszenie [Root.Heir.GetName] preferowanym następcą tronu i Vali Ahadem spotkało się z przewidywalnie chłodnym przyjęciem pozostałych książąt cesarskich i ich matek. Mimo to droga [Root.Heir.GetHerHis] do objęcia tronu okazała się znacznie trudniejsza, niż mogliśmy mieć nadzieję — wielu obarcza za to winą naszą sułtankę haseki, [Root.Consort.GetName].\\nZdecydowana położyć kres tak destrukcyjnym intrygom sułtanka-walide, matka Jego Cesarskiej Wysokości [Root.Monarch.GetHerselfHimself], wkroczyła do akcji, by chronić [Root.Heir.GetName]."
 harem_events.16.a: "Dzięki mamo!"
 harem_events.17.t: "Konflikt między [Root.Consort.GetName] a sułtanką-walide"
 harem_events.17.d: "Najbardziej faworyzowana małżonka [Root.Monarch.GetName], sułtanka haseki, oraz [Root.Monarch.GetHerHis] matka, sułtanka-walide, to kobiety o wielkich wpływach i ambicjach. Obie kontrolują własne stronnictwa w Cesarskim Hare­mie i choć twierdzą, że kierują się dobrem [Root.Monarch.GetName], konflikt ich interesów był nieunikniony. [Root.Consort.GetName] próbuje doprowadzić do zastąpienia [Root.Heir.GetName] jednym ze swoich synów, lecz sułtanka-walide nie zamierza na to pozwolić. Obie kobiety zdążyły już zainwestować w ten spór znaczną część swojego prestiżu."
 harem_events.17.a: "Opowiedzmy się po stronie matki sułtana."
 harem_events.17.a.tt: "Poparcie sułtanki-walide jest od nas oczekiwane i przyniesie nam nieco prestiżu. §Y[Root.Consort.GetName]§! zostanie jednak przechytrzona, a jej miejsce jako sułtanki haseki zajmie nowa małżonka."
 harem_events.17.b: "Opowiedzmy się po stronie [Root.Consort.GetName]."
 harem_events.17.b.tt: "Sprzeciwiając się radom sułtanki-walide, §Y[Root.Monarch.GetName]§! utraci jej poparcie."
 harem_events.17.c: "Nie opowiadajmy się po żadnej ze stron."
 harem_events.17.c.tt: "Konflikt będzie narastał i osłabi roszczenia naszego obecnego faworyzowanego następcy tronu."
 harem_events.18.t: "Ambicje sułtanki-walide"
 harem_events.18.d: "Podobnie jak wielu sułtanów przed nim, [Root.Monarch.GetName] jest bardzo związany ze swoją matką. Dzięki łasce Boga sułtanka-walide jest potężną sojuszniczką, przyjaciółką i powierniczką naszego [Root.Monarch.GetTitle]. Aby to podkreślić, przyznano jej niezwykle hojny zasiłek. Część tych pieniędzy przeznacza na własne potrzeby, lecz wykorzystuje je również dla dobra państwa. Nasza matka nie jest jednak usatysfakcjonowana i poprosiła o jeszcze hojniejsze uposażenie, które pozwoliłoby jej finansować ambitne projekty budowlane w samym [Root.Capital.GetCapitalName]."
 harem_events.18.a: "Dla Ciebie wszystko."
 harem_events.18.b: "Wykonuje wspaniałą pracę, ale musi znać swoje granice."
 architectural_work_of_valide_sultan: "Fundusze budowlane sułtanki-walide"
 desc_architectural_work_of_valide_sultan: "Sułtanka-walide szczególnie interesuje się rozwojem tego miasta, które ma stać się metropolią godną naszego imperium."
 harem_events.19.t: "Wpływowa sułtanka haseki"
 harem_events.19.d: "[Root.Owner.Consort.GetName] nie tylko zdobyła serce [Root.Owner.Monarch.GetTitle], lecz jest również energiczną kobietą o własnych ambicjach. Jej nieustanne wysiłki na rzecz umocnienia państwa [Root.Owner.Monarch.GetName] przynoszą korzyści zarówno [Root.Owner.Monarch.GetHerHim], jak i poddanym.\\nNiedawno kilka przedsięwzięć dobroczynnych sfinansowanych przez [Root.Owner.Consort.GetName] w prowincji [Root.GetName] i jej okolicach sprawiło, że cały region rozkwitł."
 harem_events.19.a: "Taka wspaniała kobieta."
 charitable_work_of_haseki: "Działalność dobroczynna sułtanki haseki"
 desc_charitable_work_of_haseki: "Sułtanka haseki przeznaczyła znaczne środki na działalność dobroczynną w tym regionie. Budowane są akwedukty, meczety i szpitale, a ubodzy otrzymują pożywienie. Dzięki temu cały obszar rozkwita."
 harem_events.20.t: "Rzucono wyzwanie małżonce [Root.Consort.GetName]"
 harem_events.20.d: "Haseki Sultan jest nie tylko ulubioną małżonką władcy [Root.Monarch.GetTitle], ale także panią imperialnego haremu oraz najpotężniejszą kobietą w imperium poza sułtanką. Osiągniecie i utrzymanie tej pozycji to marzenie każdej innej małżonki w haremie. \nNie powinno zatem dziwić, że [Root.Monarch.GetTitle] zainteresował się młodą i ambitną kobietą..."
 harem_events.20.a: "Nigdy nie moglibyśmy porzucić takiej osoby, jak [Root.Consort.GetName]."
 harem_events.20.b: "Już czas kochanie."
 harem_events.21.t: "[Root.Monarch.GetTitle] zyskała rywala."
 harem_events.21.d: "Ponieważ [Root.Monarch.GetName] nie wskazał jeszcze faworytki spośród swoich małżonek, każda z nich zabiega o należne jej miejsce u boku sułtana. Cesarski Harem jest pełen intryg, a dokonanie świadomego wyboru sułtanki haseki — jednego z najwyższych zaszczytów w imperium — wydaje się obecnie niemal niemożliwe. Na szczęście matka [Root.Monarch.GetName] dobrze zna układy panujące w haremie i przedstawiła mu małżonkę, którą uważa za odpowiednią kandydatkę."
 harem_events.21.a: "Wspaniale!"
 harem_events.21.b: "Sam będę podejmować decyzje, matko..."
 harem_events.21.c: "Nie zamykajmy sobie żadnych możliwości."
 harem_events.22.t: "[Root.GetName] i książęta cesarscy"
 harem_events.22.d: "Zgodnie ze zwyczajem niektórymi naszymi prowincjami zarządzają książęta cesarscy, aby mogli nauczyć się rządzenia przed objęciem tronu. Wiadomo również, że prowincje te mogą stać się ich bazą władzy podczas walki o sukcesję. Taka rywalizacja często pozwala też pozbyć się nieudolnych pretendentów.\\nCzasami jednak sprawy przybierają jeszcze gorszy obrót. Wygląda na to, że jeden z naszych książąt-gubernatorów zdołał aktywnie zniszczyć zasoby znajdujące się pod jego kontrolą. Jeśli szybko nie zareagujemy, dochody zostaną trwale ograniczone. Niestety, choć książę nie jest naszym faworytem, cieszy się poparciem wpływowych grup w [Root.Owner.Capital.GetCapitalName]. Odebranie mu urzędu wywoła więc sprzeciw."
 harem_events.22.a: "Natychmiast go odwołajmy."
 harem_events.22.b: "Znajdźmy pretekst, by sprowadzić go z powrotem później."
 harem_events.23.t: "Zabawa w króla"
 harem_events.23.d: "Wraz z upływem lat nasz [Root.Monarch.GetTitle] starzeje się, a [Root.Monarch.GetHerHis] synowie stają się coraz bardziej niecierpliwi. Regularnie krążą nieuzasadnione plotki o pogarszającym się zdrowiu władcy, a różne stronnictwa dworskie opowiadają się po stronie licznych pretendentów spośród jego synów. Jeden z nich uznał, że odległe miejsce w domniemanej linii sukcesji uzasadnia podjęcie ryzyka. [revolter_prince.GetName], jeden z synów [Root.Monarch.GetName], chwycił za broń przeciwko [Root.Monarch.GetHerHim]."
 harem_events.23.a: "Zabić ich wszystkich."
 harem_events.24.t: "[Root.GetName] rozkwita"
 harem_events.24.d: "Zarządzanie prowincją [Root.GetName] powierzono niedawno jednemu z naszych książąt cesarskich. Nie spodziewaliśmy się, że zdoła on osiągnąć tak wiele w tak krótkim czasie. Lokalna gospodarka kwitnie, a ośrodki miejskie przyciągają coraz więcej kupców i rzemieślników. Dochody wydają się trwale wzrosnąć.\\nNiektórzy uznaliby to za pomyślny znak. Może powinniśmy uczynić tego syna naszym nowym faworytem?"
 harem_events.24.a: "Właśnie takiego człowieka szukamy."
 harem_events.24.b: "Nie wyciągajmy pochopnych wniosków."
 harem_events.24.b.tt: "Sukces tego księcia osłabia roszczenia naszego faworyzowanego następcy tronu."
 yemoja_cult: "Jemaja"
 yemoja_cult_desc: "Jemaja, bogini wód, jest potężną oriszą wśród ludu Joruba. Ludzie wzywają ją do ochrony kobiet, dla pomyślnych morskich wypraw oraz udanych zbiorów."
 roog_cult: "Roog"
 roog_cult_desc: "Roog, Stwórca, to imię i boska siła czczona przez lud Serer. Składając ofiary duchom przodków zwanym Pangool, uznajemy świętość naszego życia."
 nyame_cult: "Nyame"
 nyame_cult_desc: "Według ludu Aszanti Nyame, bóg nieba, stworzył pierwszych ludzi. Dziećmi Nyame są Abosom — pomniejsze bóstwa i przodkowie, którzy pomagają ludziom na ziemi. Wszyscy stanowimy jedność."
 cwezi_cult: "Cwezi"
 cwezi_cult_desc: "Pielęgnujemy tradycje dawnego imperium Kitara. Utrzymując dobre relacje z duchami natury oraz czcząc przodków z Kitara i rody opiekujące się ich świątyniami, możemy liczyć na boską przychylność."
 central_african_ancestor_cult: "Mlira"
 central_african_ancestor_cult_desc: "Za pośrednictwem wyroczni możemy porozumiewać się ze zmarłymi przodkami i duchami natury. Dzięki temu oddajemy cześć tym, którzy byli przed nami, i zyskujemy pomoc w radzeniu sobie z nieprzyjaznym otoczeniem."
 mwari_cult: "Mwari"
 mwari_cult_desc: "Czcimy wielkiego boga Mwari, który stworzył świat z niczego i sprawia, że góry drżą, gdy przemawia. Mwari jest jedynym prawdziwym bogiem, a nasz władca jest jego wyrocznią i głosem na ziemi."
 enkai_cult: "Enkai"
 enkai_cult_desc: "Podążamy za Enkai, Człowiekiem na Niebie, który zesłał nam swoje stada i uczynił nas prawowitymi właścicielami całego bydła na świecie. Jako władca niebios błogosławi nas deszczem albo odmawia go w gniewie."
 waaq_cult: "Waaq"
 waaq_cult_desc: "Wielki Waaq jest Bogiem Nieba, najwyższym i wszechpotężnym władcą wszechświata. Jego wyznawcy modlą się o pokój i harmonię, wierząc, że równowaga świata jest niezbędna, by uniknąć katastrof i nieszczęść."
 zanahary_cult: "Zanahary"
 zanahary_cult_desc: "Zanahary, Stwórca, ma podwójną naturę: jest mężczyzną i kobietą, światłem i ciemnością, niebem i ziemią. Przodkowie są najważniejszymi członkami wspólnoty, ponieważ pozostają w bezpośrednim kontakcie z boskością, podczas gdy żyjący są jedynie ich tymczasowym przedłużeniem."
 christianity_cult: "Chrześcijaństwo"
 christianity_cult_desc: "Podążamy ścieżką Boga, który sprowadził na ziemię Jezusa Chrystusa, aby umarł za nasze grzechy."
 islam_cult: "Islam"
 islam_cult_desc: "Podążamy drogą wielkiego Boga, którego nauki objawił światu jego prorok Mahomet."
 buddhism_cult: "Dharmy Buddy"
 buddhism_cult_desc: "Podążamy drogą wielkiego nauczyciela Gautamy Buddy, który żył na ziemi wiele stuleci temu. Dzięki niemu poznaliśmy cztery szlachetne prawdy, odrodzenie oraz naturę tego świata."
 dharmic_cult: "Sanatana Dharma"
 dharmic_cult_desc: "Podążamy za odwiecznymi naukami bogów hinduizmu. Od nich poznaliśmy reinkarnację oraz sposób skutecznego organizowania społeczeństwa za pomocą systemu kastowego."
 south_central_american_cult: "Teotl"
 south_central_american_cult_desc: "Poznaliśmy mistyczne nauki bogów Teotl zza morza. Dzięki ofiarom i uważnej obserwacji nieba możemy wpływać na życie na ziemi i zapobiec końcowi cywilizacji, jaką znamy."
 norse_cult: "Freja"
 norse_cult_desc: "Podążamy za piękną i ukochaną Freją, boginią miłości, wojny i magii. Dzięki jej darowi w postaci magii seid, możemy dokonać wspaniałych podbojów!"
 zoroastrian_cult: "Mazdayasna"
 zoroastrian_cult_desc: "Podążamy za naukami proroka Zaratustry i czcimy mądrego Ahura Mazdę. Zgodnie z wolą bogów będziemy podtrzymywać święte ognie na wieki."
 jewish_cult: "Haymanot"
 jewish_cult_desc: "Wierzymy w jedynego Boga i jesteśmy dziećmi Abrahama. Przez stulecia utraciliśmy więź z naszymi żydowskimi korzeniami, lecz teraz ponownie przyjmujemy ich tradycje."
 CONFIRM_NEW_CULT_TITLE: "Przyjmowanie Kultu"
 CONFIRM_NEW_CULT_DESC: "Wybierając ten kult, przyjmujemy jego tradycje i zobowiązujemy się przestrzegać wymagań, jakie nakłada on na naszego władcę."
 RV_NO_CULT: "Nie wybrano Kultu"
 RV_NO_CULT_TITLE: "Brak obecnego Kultu"
 RV_NO_CULT_DESC: "Twoja religia pozwala ci wybrać kult, który chcesz wyznawać. Każdy kult będzie miał swoje własne efekty i będzie trwał do czasu zmiany monarchy."
 RV_PICK_CULT: "Wybierz Kult"
 RV_PICK_CULT_THIS: "Wybierz: $CULTNAME$"
 HAS_ADOPTED_CULT: "Wyznaje kult $CULTNAME|Y$"
 NOT_HAS_ADOPTED_CULT: "Nie wyznaje kultu $CULTNAME|Y$"
 HAS_UNLOCKED_CULT: "Odblokowano kult $CULTNAME|Y$"
 NOT_HAS_UNLOCKED_CULT: "Nie odblokowano kultu $CULTNAME|Y$"
 CHANGE_CULT_EFFECT: "Zmień kult na $CULTNAME|Y$"
 UNLOCK_CULT_EFFECT: "Odblokuj kult $CULTNAME|Y$"
 fetishist_flavor.1.t: "Starszyzna Jorubów"
 fetishist_flavor.1.d: "Nasi wojownicy zainteresowali się mieszkańcami tego regionu i ich głęboką duchowością. Miejscowi starsi mówią o wewnętrznej równowadze, szacunku dla Ziemi i dążeniu do transcendencji. Kluczową rolę w ich wierzeniach odgrywają orisze — duchy lub przejawy boskości, stale obecne w codziennym życiu wyznawców. Wspominają również o „Atunwa”, czyli reinkarnacji w obrębie rodziny, a ceremonie związane z kolejnymi etapami życia otaczają wielką czcią.\\n\\nNiektóre zagubione dusze w naszych armiach zaczęły medytować i szukać pocieszenia u jednej z najbardziej czczonych orisz — „Yemoi”, Matki Wód."
 fetishist_flavor.1.a: "Ciekawe"
 fetishist_flavor.2.t: "Czuwające Pangool"
 fetishist_flavor.2.d: "Spotkaliśmy lud czczący niebiańskiego boga Rooga, Władcę Świata. Mówią, że Roog jest początkiem i końcem wszystkiego, a jego świętość jest tak wielka, że wyznawcom nie wolno nawet tworzyć wizerunków wszechobecnego boga. Nie zwracają się też bezpośrednio do Stwórcy w modlitwach ani prosząc o boską przychylność. Zamiast tego oddają cześć pradawnym duchom zwanym Pangool, pośrednikom między światami. Niektóre z nich mają być duchami przodków, a przyjęcie przez nie po śmierci pozwala przejść do Jaaniiw — nocnej krainy i świętej siedziby duszy.\\n\\nCzęść naszych wojowników zafascynowały opowieści tego ludu. Aby nie błąkać się później między światami, zgodnie z miejscową tradycją składają ofiary u stóp wysokich drzew ku czci Pangool."
 fetishist_flavor.2.a: "Fascynujący!"
 fetishist_flavor.3.t: "Dzieci Architekta"
 fetishist_flavor.3.d: "„Jeśli przyzywam jednego, przyzywam wszystkich” — można usłyszeć od jednego z wyznawców. Często modlą się nad rzekami i strumieniami, oddając cześć Nyame, Ojcu Niebios. Wierzą w dusze zwierząt i roślin, w Abosom — pomniejsze duchy otaczające nasz świat — oraz porozumiewają się z przodkami za pomocą wyszukanych rytuałów.\\n\\nPrzede wszystkim społeczność ta wydaje się niezwykle zżyta. Opowiadając o czynach przodków, jej członkowie czasem mówią o sobie w liczbie pojedynczej, jakby stanowili jedność. Niektórzy z naszych uczonych uznają to za osobliwość wynikającą z błędnego tłumaczenia, inni zaś twierdzą, że wyznawcy postrzegają siebie jako coś większego niż pojedyncza osoba — część wspólnego ducha, zwłaszcza w obrębie rodziny. „Są jak dwugłowy krokodyl z jednym żołądkiem — nie walczą ze sobą o pożywienie” — sugerują nasi doradcy."
 fetishist_flavor.3.a: "Intrygujące."
 fetishist_flavor.4.t: "Przyszłość [Root.Monarch.GetTitle]"
 fetishist_flavor.4.d.a: "Przygotowując się do nadchodzących bitew, [Root.Monarch.GetTitle] odwiedził niedawno swojego babalawo. Ojciec tajemnic posiada mądrość Orunmili, a każda wskazówka dotycząca przeznaczenia [Root.Monarch.GetTitle], jego Ori, jest mile widziana. Wróżbita wprawił jednak [Root.Monarch.GetName] w zakłopotanie, oznajmiając, że następca tronu [Root.Heir.GetName] w jakiś sposób sprowadzi na [Root.Monarch.GetTitle] [Root.Monarch.GetName] przedwczesną śmierć. Bitwa? Trucizna? Wypadek?\\n\\n„Która z tych rzeczy?” — zażądał odpowiedzi [Root.Monarch.GetTitle], lecz znaki nie były jednoznaczne. Rozwiązanie tej sprawy wymaga teraz niezwykłej ostrożności."
 fetishist_flavor.4.d.b: "Przygotowując się do nadchodzących bitew, [Root.Monarch.GetTitle] odwiedził niedawno swojego jasnowidza. Tajemniczy starzec posiada wielką mądrość, a każda wskazówka dotycząca przeznaczenia [Root.Monarch.GetTitle] jest mile widziana. Wróżbita wprawił jednak [Root.Monarch.GetName] w zakłopotanie, oznajmiając, że następca tronu [Root.Heir.GetName] w jakiś sposób sprowadzi na [Root.Monarch.GetTitle] [Root.Monarch.GetName] przedwczesną śmierć. Bitwa? Trucizna? Wypadek?\\n\\n„Która z tych rzeczy?” — zażądał odpowiedzi [Root.Monarch.GetTitle], lecz znaki nie były jednoznaczne. Rozwiązanie tej sprawy wymaga teraz niezwykłej ostrożności."
 fetishist_flavor.4.a: "Pozbądźmy się następcy tronu."
 fetishist_flavor.4.a.tt: "Wojownicy będą pod wrażeniem naszej stanowczości."
 fetishist_flavor.4.b: "[Root.Heir.GetName] jest jeszcze dzieckiem. To niedorzeczne."
 fetishist_flavor.4.b.tt: "Lud będzie rozczarowany obojętnością okazaną przez władcę."
 fetishist_flavor.4.c: "Pozbądźmy się następcy tronu [Root.Heir.GetName]."
 fetishist_flavor.4.d: "To jakieś brednie."
 fetishist_flavor.5.t: "Droga z miasta [nonchalant_neighbor.Capital.GetCapitalName]"
 fetishist_flavor.5.d.a: "[Root.Monarch.GetTitle] utracił swojego krewnego. Wysłany do nas list opisuje, jak zasadzka bandytów napadła na podróżującą świtę mężów stanów, a następnie zmusiła do skoku z urwiska pozostałych wracających z miasta [nonchalant_neighbor.Capital.GetCapitalName] z sąsiadującego państwa [nonchalant_neighbor.GetName] do domu. Resztki dobytku, które udało się odzyskać, zostały wysłane do miasta [Root.Capital.GetCapitalName]. Niestety, gdy [Root.Monarch.GetTitle] [Root.Monarch.GetName] dowiedział się, że [Root.Monarch.GetHerHis] krewny i przyjaciel odszedł z tego świata, pogrążył się w smutku i rozpaczy. Co gorsza, list z państwa [nonchalant_neighbor.GetName] nic nie wspomina o tym, czy wzięto pod uwagę prawidłową ceremonię pogrzebową. \n\nCzy życzą nam źle z tym Oku igbe, śmiercią w buszu tak jak w przypadku, gdy [Root.Monarch.GetTitle] stracił swojego bliskiego?"
 fetishist_flavor.5.d.b: "Kuzyn [Root.Monarch.GetTitle] zmarł. W przysłanym nam liście opisano zasadzkę bandytów na orszak podróżujących dostojników. Wszyscy zostali zepchnięci z urwiska podczas powrotu z wizyty w [nonchalant_neighbor.Capital.GetCapitalName], stolicy sąsiedniego państwa [nonchalant_neighbor.GetName]. Nieliczne przedmioty, które udało się odzyskać, odesłano do [Root.Capital.GetCapitalName], lecz [Root.Monarch.GetTitle] [Root.Monarch.GetName] jest zdruzgotany śmiercią swojego ulubionego krewnego. Co gorsza, list z państwa [nonchalant_neighbor.GetName] nie wspomina, czy zadbano o właściwy pogrzeb.\\n\\nDrogi kuzyn wkrótce odrodzi się w świecie widzialnym lub niewidzialnym, lecz myśl, że zmarła nie otrzymała należytych obrzędów pogrzebowych, dręczy [Root.Monarch.GetTitle], który samotnie rozmyśla o własnej śmiertelności."
 fetishist_flavor.5.d.c: "Kuzyn [Root.Monarch.GetTitle] zmarł. W przysłanym nam liście opisano zasadzkę bandytów na orszak podróżujących dostojników. Wszyscy zostali zepchnięci z urwiska podczas powrotu z wizyty w [nonchalant_neighbor.Capital.GetCapitalName], stolicy sąsiedniego państwa [nonchalant_neighbor.GetName]. Nieliczne przedmioty, które udało się odzyskać, odesłano do [Root.Capital.GetCapitalName], lecz [Root.Monarch.GetTitle] [Root.Monarch.GetName] jest zdruzgotany śmiercią swojego ulubionego krewnego. Co gorsza, list z państwa [nonchalant_neighbor.GetName] nie wspomina, czy zadbano o właściwy pogrzeb.\\n\\nDroga kuzynka przekroczyła już zasłonę świata żywych i jest teraz bliżej Nyame. Mimo to myśl, że nie otrzymała należytych obrzędów pogrzebowych, dręczy [Root.Monarch.GetTitle]."
 fetishist_flavor.5.d.d: " "
 fetishist_flavor.5.a: "Musimy odzyskać ciało i zadbać o odpowiednie obrzędy."
 fetishist_flavor.5.a.tt: "Przekażemy podziękowania, wynajmiemy ludzi, którzy udadzą się do państwa [nonchalant_neighbor.GetName], i sami opłacimy wymagane ceremonie. Niech [Root.GetCult] doda sił [Root.Monarch.GetTitle]."
 fetishist_flavor.5.b: "Nie będziemy tolerować takich kpin z naszej wiary."
 fetishist_flavor.5.b.tt: "Władcy państwa [nonchalant_neighbor.GetName] otrzymają rozzłoszczony list."
 fetishist_flavor.5.c: "To trudne czasy dla nas wszystkich."
 fetishist_flavor.5.c.tt: "Odpuścimy. [nonchalant_neighbor.GetName] otrzyma list z naszymi podziękowaniami za informację o zdarzeniu."
 fetishist_flavor.6.t: "Gniew [From.Monarch.GetTitle]"
 fetishist_flavor.6.d.a: "Otrzymaliśmy wojowniczy list od sąsiedniego państwa [From.GetName], najwyraźniej w odpowiedzi na wiadomość naszych dyplomatów o tragicznym napadzie bandytów na dostojników [From.GetAdjective]. Wygląda na to, że jedną z ofiar był krewny [From.Monarch.GetTitle], a [From.Monarch.GetSheHe] jest oburzony, że w przekazanej informacji nie wspomniano o świętych obrzędach należnych [From.Monarch.GetHerHis] bliskim.\\n\\nKult [From.GetCult] wymaga więcej, niż zakładali nasi ambasadorowie."
 fetishist_flavor.6.d.b: "Nasi sąsiedzi z państwa [From.GetName] przysłali nam wrogie ostrzeżenie w odpowiedzi na niedawno przekazane informacje o napadzie bandytów na dostojników [From.GetAdjective]. Przyczyną urazy wydaje się niewłaściwe przeprowadzenie obrzędów pogrzebowych lub niezapewnienie odzyskania ciał. Trudno to wywnioskować z chaotycznej mieszaniny obelg zawartej w liście. Wygląda na to, że kult [From.GetCult] jest dość skomplikowany..."
 fetishist_flavor.6.a: "Nie obchodzi nas to."
 fetishist_flavor.6.a.tt: "Nawet jeśli łączą nas wierzenia [From.GetCult], nie możemy przejmować się każdą drobnostką tego świata."
 fetishist_flavor.6.b: "Nie obchodzi nas to."
 fetishist_flavor.6.b.tt: "Wyznawcy [From.GetCult] nie różnią się tak bardzo od nas, ale nie możemy spełniać każdego ich kaprysu."
 fetishist_flavor.6.c: "Niektórym nigdy nie można dogodzić."
 fetishist_flavor.7.t: "Staw staje się rzeką"
 fetishist_flavor.7.d.a: "[Root.Monarch.GetName] odzyskał spokój, odkąd zadbano o pogrzeb [Root.Monarch.GetHerHis] kuzyna. W ceremonii uczestniczyli nawet dyplomaci z państwa [nonchalant_neighbor.GetName]. Świadomość, że krewny [Root.Monarch.GetHerHis] spoczywa bezpiecznie w ramionach bogini Yemoi, przynosi ulgę [Root.Monarch.GetTitle], a pieśni pogrzebowe wciąż rozbrzmiewają w jego myślach.\\n\\n„Gdy zobaczysz antylopę kob na drodze do pola,\\nGdy zobaczysz antylopę kob na drodze do rzeki —\\nPozostaw strzały w kołczanie\\nI pozwól zmarłym odejść w pokoju”."
 fetishist_flavor.7.d.b: "[Root.Monarch.GetName] odzyskał spokój, odkąd zadbano o pogrzeb [Root.Monarch.GetHerHis] kuzyna. W ceremonii uczestniczyli nawet dyplomaci z państwa [nonchalant_neighbor.GetName], a świadomość, że krewny [Root.Monarch.GetTitle] bezpiecznie przeszedł do kolejnego etapu podróży ku krainie cieni, przynosi mu wielką pociechę.\\n\\n„Będziesz pamiętany przez pokolenia, mój przyjacielu” — mówi [Root.Monarch.GetSheHe], po czym zwraca się z uśmiechem ku Bogu Nieba."
 fetishist_flavor.7.d.c: "[Root.Monarch.GetName] odzyskał spokój, odkąd zadbano o pogrzeb [Root.Monarch.GetHerHis] kuzyna. W uroczystej ceremonii uczestniczyli nawet dyplomaci z państwa [nonchalant_neighbor.GetName]. Świadomość, że krewny [Root.Monarch.GetTitle] otrzymał wszystkie obrzędy niezbędne do zachowania równowagi ze światem duchów, przyniosła mu wielką pociechę.\\n\\nWieczorem lekki wiatr przepływa przez komnaty [Root.Monarch.GetName], wywołując uśmiech na [Root.Monarch.GetHerHim] twarzy. Bóg Nieba na wiele sposobów daje znać o swojej obecności. „A zatem wciąż jesteśmy razem” — mówi [Root.Monarch.GetSheHe], zapadając w sen."
 fetishist_flavor.7.a: "Błogosławieni niech będą zmarli."
 fetishist_flavor.7.a.tt: "Wszystkie posiadane prowincje Fetyszystów otrzymują modyfikator '§YPogoda ducha§!' na §Y5 lat§!, dający następujące efekty:\nMorale armii: §G+15.0%§!\nCzas werbowania: §G-20.0%§!"
 fetishist_flavor.8.t: "Synowie Nyame"
 fetishist_flavor.8.d.a: "Mieszkańcy prowincji [tormented_province.GetName] są zaniepokojeni chorobą jednej z najbardziej szanowanych osób w społeczności. Wpływowa starsza wioski od ponad tygodnia leży w łóżku i nie odzyskała przytomności. Nasi doradcy sugerują, by zachęcić miejscowych do modlitwy, lecz do kogo powinny zwrócić się zagubione dusze? Z jednej strony jest Tano, bóg rzeki i syn Nyame, który podobno spieszy z pomocą człowiekowi w ostatnich godzinach życia, by wyrwać go Śmierci. Z drugiej strony Anansi, podstępny oszust, być może również zechciałby pomóc w zamian za coś cennego."
 fetishist_flavor.8.a: "Powinni zwrócić się do Tano, bóstwa rzeki."
 fetishist_flavor.8.a.tt: "Nie ma gwarancji, że modlitwa przyniesie jakikolwiek skutek.\\n"
 fetishist_flavor.8.b: "Powinni zwrócić się do przebiegłego Anansiego."
 fetishist_flavor.8.b.tt: "Mieszkańcy mogą przynajmniej poczuć się lepiej, składając wszystkie możliwe ofiary.\\n"
 fetishist_flavor.9.t: "Pełzający Pangool"
 fetishist_flavor.9.d: "Z prowincji [heathen_province.GetName] dotarła pogłoska o olbrzymim wężu, który zamieszkał na drzewie pośrodku wiejskiego placu. Początkowo mieszkańcy byli przerażeni, lecz zwierzę nie próbowało nikogo skrzywdzić, a z czasem zyskało nawet sympatię miejscowych, którzy zaczęli nadawać mu pieszczotliwe imiona. W końcu mądra kobieta z okolicy ogłosiła, że wąż jest święty i z pewnością stanowi ducha, który przybrał postać gada. Zachęciło to ludzi do składania mu ofiar i przynoszenia pożywienia."
 fetishist_flavor.9.a: "Pangool przybył, by nam pomóc."
 fetishist_flavor.10.a: "Rozumiem."
 fetishist_flavor.11.t: " "
 fetishist_flavor.11.a: "Rozumiem."
 the_will_of_tano: "Wola Tano"
 desc_the_will_of_tano: "Starsza wioski cudownie wyzdrowiała z choroby, która wydawała się śmiertelna. To wydarzenie dodało sił wojownikom w prowincji."
 the_whim_of_anansi: "Kaprys Anansiego"
 desc_the_whim_of_anansi: "Starsza wioski cudownie wyzdrowiała z choroby, która wydawała się śmiertelna. To wydarzenie dodało sił robotnikom w prowincji."
 serenity_of_faith: "Spokój ducha"
 desc_serenity_of_faith: "Władca tej krainy jest człowiekiem głębokiej wiary i inspiruje swój lud do wielkich czynów."
 decisive_ruler: "Stanowczy władca"
 desc_decisive_ruler: "Lud jest pod wrażeniem oddania władcy tradycyjnym wierzeniom."
 nonchalant_ruler: "Obojętny władca"
 desc_nonchalant_ruler: "Lud nie jest pod wrażeniem obojętności władcy wobec tradycyjnych wierzeń."
 presence_of_the_ancestors: "Obecność przodków"
 desc_presence_of_the_ancestors: "Mieszkańcy tej krainy byli świadkami tego, co uznają za znak od Pangool."
 fetishist_flavor.101.t: "Bohaterowie Cwezi z Kitara"
 fetishist_flavor.101.d: "Niegdyś Cwezi władali tymi ziemiami, a ich imperium Kitara obejmowało cały znany ludziom świat. Podczas naszych podróży spotykamy coraz więcej ludów, które uważają się za spadkobierców Kitara i czczą dawnych bohaterów. Duchy wciąż istnieją w otaczającym nas świecie, w przyrodzie i w naszych umysłach, a niektórzy potrafią porozumiewać się z Cwezi za pośrednictwem wyroczni i wróżbitów. Na ich ziemiach spotkaliśmy wędrowne kapłanki, które potrafią przywoływać te duchy, a za ich pośrednictwem łagodzić choroby, bezpłodność i nieszczęścia. Są ludzie, którzy poświęcają całe życie zaginionym przodkom i ich sanktuariom. Wszelka władza doczesna musi wypływać z więzi z przeszłością, a nikt nie może być godzien rządzenia bez bezpośredniego związku z duchami Cwezi."
 fetishist_flavor.101.a: "Ciekawe"
 fetishist_flavor.102.t: "Kult Mliry"
 fetishist_flavor.102.d: "Spotkaliśmy lud, który czci własnych przodków niczym bogów. Dzięki potężnym wyroczniom może nieustannie utrzymywać kontakt ze swoimi poprzednikami. Dbałość o groby i świątynie przodków zapewnia im możliwość dalszej ochrony żyjących."
 fetishist_flavor.102.a: "Chcę dowiedzieć się więcej..."
 fetishist_flavor.103.t: "Najwyższy Stwórca"
 fetishist_flavor.103.d: "„Niegdyś nie było niczego. Wówczas Mwari stworzył świat i wyprowadził człowieka z dziury w ziemi. Mwari stworzył góry i może sprawić, że zadrżą od jego głosu. Mwari rozpalił znane ludziom ognie i Mwari zsyła deszcz. Mwari jest ojcem i matką ludzkości, będzie nas strzegł w obliczu przeciwności”.\\nOstatnio spotykamy coraz więcej wyznawców Mwari. Łączy ich przekonanie, że nie istnieje żadna inna siła duchowa poza ich jedynym bogiem. Chętnie i otwarcie mówią o jego istnieniu, lecz pilnie strzegą tajemnic samego kultu."
 fetishist_flavor.103.a: "Nyadenga - Musikavanahu - Muvambapasi"
 fetishist_flavor.130.t: "Głos naszych przodków"
 fetishist_flavor.130.d: "Królewska wyrocznia przyniosła dobre wieści. Po wykonaniu wielkiego tańca rytualnego, niezbędnego do nawiązania kontaktu z naszymi najbardziej czczonymi przodkami i zasięgnięcia ich rady w sprawie nadchodzącego roku, wygląda na to, że czeka nas świetlana przyszłość. Szczegóły trudno poznać zza zasłony śmierci, lecz z pewnością oznacza to coś dobrego."
 fetishist_flavor.130.a: "Z pewnością będziemy zbierać owoce tych działań przez wiele lat."
 fetishist_flavor.130.b: "To dowód naszej silnej więzi z tymi, którzy byli przed nami."
 ancestral_support: "Wsparcie przodków"
 desc_ancestral_support: "Seria pomyślnych znaków pomaga utrzymać spokój w naszym państwie. Bliskie więzi z przodkami pozwoliły naszej społeczności zachować stabilność i dobrobyt."
 fetishist_flavor.131.t: "Troska o tych, którzy byli przed nami"
 fetishist_flavor.131.d: "Opieka nad świątyniami przodków pozostaje stałym wyzwaniem dla naszego [Root.Monarch.GetTitle]. Zasugerowano, że najlepszym rozwiązaniem byłoby mianowanie jednego z najbardziej lojalnych ministrów stałym opiekunem sanktuariów i przyznanie mu odpowiedniego budżetu. Jeśli pozwolą nam na to finanse, takie rozwiązanie miałoby niewiele wad — przynajmniej dopóki możemy zaufać wyznaczonej osobie..."
 fetishist_flavor.131.a: "Znam idealną osobę do tego zadania!"
 fetishist_flavor.131.b: "Nie ufam nikomu poza sobą."
 ancestral_shrine_caretaker: "Opiekun świątyń przodków"
 desc_ancestral_shrine_caretaker: "Zatrudniliśmy grupę stałych urzędników, którzy nadzorują opiekę nad świątyniami przodków. Zajmują się przede wszystkim codziennym utrzymaniem sanktuariów, lecz niektórzy oczekują od nich również, że będą przemawiać w imieniu naszych przodków."
 fetishist_flavor.132.t: "Władca poddany w wątpliwość"
 fetishist_flavor.132.d: "Powołanie opiekuna świątyń przodków okazało się na ogół udanym posunięciem. Sanktuaria są zadbane, a nasz urzędnik tak silnie związał się z duchami, że we współpracy z wyroczniami stworzył nowy zestaw obrzędów ku ich czci. Oczekuje się nawet, że w pewnych sprawach będzie przemawiał w ich imieniu.\\nWygląda jednak na to, że opiekun zaczął przedkładać lojalność wobec przodków nad lojalność wobec swojego [Root.Monarch.GetTitle]. Ostatnio zabiega o zwiększenie budżetu na utrzymanie świętych sanktuariów. Trudno sprzeciwiać się woli przodków, lecz niepokoi nas, że ktoś uważa, iż może przemawiać w ich imieniu przeciwko nam..."
 fetishist_flavor.132.a: "Zgódźmy się zwiększyć budżet świątyń."
 fetishist_flavor.132.b: "Czas odzyskać władzę nad naszymi przodkami!"
 fetishist_flavor.133.t: "Przychylność $RANDOM_OLD_MONARCH$"
 fetishist_flavor.133.d: "Czasami czyny dokonane za życia są tak wielkie, że wszyscy potrafią dostrzec, co z nich wynika. Wróżbici zgodnie twierdzą, że $RANDOM_OLD_MONARCH$ był tak wybitną postacią, iż tytuł [Root.Monarch.GetTitle] nie oddaje jego wielkości — powinniśmy mówić raczej o bogu lub bóstwie. Nasi ludzie wspominają $RANDOM_OLD_MONARCH$ z czcią i już zaczęli oddawać cześć zmarłemu [Root.Monarch.GetTitle] oraz tym, którzy przywołują jego ducha."
 fetishist_flavor.133.a: "Chwała $RANDOM_OLD_MONARCH$!"
 fetishist_flavor.150.t: "Mwari, jedyny bóg"
 fetishist_flavor.150.d: "Chociaż zaakceptowaliśmy naturę Mwari jako jedynego stwórcę i źródła wszelkiej mocy, wygląda na to, że nie wszyscy nasi poddani są przekonani co do jego wielkości. W [Root.GetName] powszechne oddanie dla ich własnych starożytnych duchów stało się zbyt silne dla zmagań naszych kapłanów."
 fetishist_flavor.150.a: "Musimy im pokazać drogę."
 fetishist_flavor.150.b: "Na razie możemy być trochę wyrozumiali."
 fetishist_flavor.150.c: "On rządzi tą ziemią!"
 religious_leniency: "Religijna wyrozumiałość"
 desc_religious_leniency: "Postanowiliśmy kierować się pragmatyzmem i dopuściliśmy w tej prowincji pewne odstępstwa od religii państwowej."
 enforced_mwari_orthodoxy: "Wymuszona ortodoksja Mwari"
 desc_enforced_mwari_orthodoxy: "Siłą rozprawiliśmy się z każdym, kto kwestionował pozycję Mwari jako jedynego boga, narzucając tej prowincji surowe zasady i kontrolę."
 mwari_forced_conversions_of_heathens: "Przymusowe nawracanie innowierców"
 desc_mwari_forced_conversions_of_heathens: "Rozpoczęliśmy w tej prowincji kampanię nawracania, aby niewierni ujrzeli prawdziwe światło wielkości Mwari."
 fetishist_flavor.151.t: "Mwari i duchy Mhondoro"
 fetishist_flavor.151.d: "Mwari jest stwórcą wszystkiego i źródłem wszelkiej mocy, lecz ma również podległe mu duchy, które pomagają mu kierować światem. Podobnie wielki władca musi polegać na podległych mu wodzach, którzy zarządzają codziennymi sprawami poszczególnych wiosek. Dopóki żyjemy zgodnie z wolą Mwari, możemy liczyć na wsparcie duchów Mhondoro. Nic więc dziwnego, że wróżbici z państwa [Root.GetName] upomnieli miejscowych wodzów i umocnili naszą władzę nad regionem."
 fetishist_flavor.151.a: "To on jest panem niebios!"
 fetishist_flavor.152.t: "Gniew Mwari"
 fetishist_flavor.152.d: "Podczas niedawnych niepokojów w prowincji [wrath_of_mwari.GetName] miejscowi wodzowie pod naszym dowództwem postanowili stracić pojmanych przywódców wroga. Nie skonsultowali jednak tej decyzji z wróżbitami Mwari i złamali kilka jego zasad. Większość ludzi rozumie, że działali bez naszego oficjalnego upoważnienia, lecz fakt, że ani my, ani duchy Mwari nie zdołaliśmy ich powstrzymać, wywołał powszechne niezadowolenie. Miejscowi twierdzą zwłaszcza, że sam Mwari przemówił, wyrażając wielkie niezadowolenie z przebiegu tych wydarzeń."
 fetishist_flavor.152.a: "Postaramy się poprawić."
 fetishist_flavor.153.t: "Wiara prowincji [Root.GetName]"
 fetishist_flavor.153.d: "Miejscowy wódz prowincji [Root.GetName] głośno protestuje przeciwko polityce naszego [Root.Owner.Monarch.GetTitle], twierdząc, że ignorujemy głos Mwari i jego zastępców. Sam wódz utrzymuje natomiast, że pozostaje w bliskim kontakcie z miejscowymi wróżbitami i duchem Mhondoro. Choć brzmi to nieprawdopodobnie, do protestu zaczęli przyłączać się kolejni ludzie i wydaje się, że otwarty bunt jest tylko kwestią czasu."
 fetishist_flavor.153.a: "Będziemy musieli pokazać im, jak bardzo się mylą."
 fetishist_flavor.154.t: "Królewskie ognie"
 fetishist_flavor.154.d: "Państwo takie jak nasze wymaga pewnego zakresu delegowania władzy. Na szczęście nasz [Root.Monarch.GetTitle] doskonale ocenia charaktery, a w wyborze i kontrolowaniu poddanych pomagają nam również Mwari i jego zastępcy.\\nZgodnie ze zwyczajem wodzowie poszczególnych ziem przybywają raz w roku do [Root.Capital.GetCapitalName], by złożyć raport i publicznie potwierdzić swoją lojalność. Podczas wielkiej ceremonii mają ponownie rozpalić królewskie ognie i zabrać je do swoich prowincji jako znak więzi z nami i z Mwari. Z wielkim rozdrażnieniem odnotowujemy więc, że w tym roku niektórzy wodzowie nie przybyli, przesyłając jedynie marne wymówki dotyczące odległości."
 fetishist_flavor.154.a: "Możemy pozwolić im zrezygnować z udziału."
 fetishist_flavor.154.b: "Jeśli na to pozwolimy, inni pójdą w ich ślady."
 firexit: "Upadek autorytetu"
 desc_firexit: "Przymknęliśmy oko na to, że odlegli wodzowie nie przybywają do naszej stolicy, by odnowić przysięgę służby i ponownie rozpalić królewskie ognie."
 forced_mwari_adherence: "Wymuszona centralizacja"
 desc_forced_mwari_adherence: "Zmusiliśmy wszystkich wodzów w państwie do przestrzegania tradycyjnych zasad zwierzchnictwa, regularnego przybywania do stolicy i ponownego rozpalania królewskich ogni Mwari."
 fetishist_flavor.170.t: "Niedola prowincji [Root.GetName]"
 fetishist_flavor.170.d: "Mieszkańcy prowincji [Root.GetName] obawiają się, że duchy Cwezi są niezadowolone z ich postępowania. Według powszechnego przekonania liczba ciąż gwałtownie spadła, a komplikacje porodowe stały się częstsze. Ludzie przypisują to niedawnemu zaniedbaniu niewielkiego sanktuarium w [Root.GetCapitalName]."
 fetishist_flavor.170.a: "Nic nie możemy zrobić ."
 fetishist_flavor.170.b: "Musimy poprosić o pomoc kapłanki Cwezi."
 fetishist_flavor.170.b.tt: "Wzmacniając pozycję kapłanek Cwezi, prosząc je o konsultację z duchami i przeprowadzenie rytuału inicjacji miejscowych kobiet, mamy dużą szansę zapobiec lokalnej katastrofie."
 fetishist_flavor.170.c: "Musimy ofiarować [Root.Owner.Consort.GetName] duchowi Cwezi."
 fetishist_flavor.170.c.tt: "Jako małżonka ducha Cwezi [Root.Owner.Consort.GetName] będzie mogła działać w naszym imieniu i położyć kres problemowi. Nigdy więcej nie będzie jednak mogła pełnić funkcji królowej naszego państwa."
 fetishist_flavor.171.t: "Wsparcie duchów"
 fetishist_flavor.171.d: "Przodkowie Cwezi odpowiedzieli na nasze prośby o pomoc. Powszechnie uznaje się, że okolice prowincji [Root.GetName] nie cierpią już z powodu straszliwej klątwy bezpłodności, która niegdyś je dotknęła."
 fetishist_flavor.171.a: "Udało nam się zapobiec nadciągającej katastrofie w prowincji [Root.GetName]."
 fetishist_flavor.172.t: "Duchowe opuszczenie"
 fetishist_flavor.172.d: "Duchy Cwezi nie są pod wrażeniem naszych wysiłków, by uzyskać ich pomoc w walce ze straszliwą plagą bezpłodności, która dotknęła prowincję [Root.GetName]. Mieszkańcy uciekają z tego obszaru, chcąc uniknąć okropnej klątwy, która według powszechnego przekonania pozbawi ich zdolności do posiadania dzieci."
 fetishist_flavor.172.a: "Zostaliśmy poddani próbie i okazaliśmy się niegodni."
 fertility_concerns: "Spadek płodności"
 desc_fertility_concerns: "Wyraźny spadek liczby narodzin w tym regionie wskazuje, że duchy są na nas rozgniewane. W rezultacie wielu mieszkańców przenosi się w inne części kraju, licząc na uniknięcie ich gniewu."
 fetishist_flavor.173.t: "Wędrowna czarodziejka"
 fetishist_flavor.173.d: "Do [Root.Capital.GetCapitalName] przybyła grupa kapłanek, na której czele stoi potężna czarodziejka. Kobiety proszą o gościnę. Dzięki tajemnym rytuałom opętania przez duchy potrafią rozmawiać bezpośrednio z wielkimi duchami dawnego Cwezi. Odmowa udzielenia im gościny nie wchodzi w grę — sposób, w jaki potraktujemy tę grupę, prawdopodobnie wpłynie na wsparcie, jakiego możemy oczekiwać dla naszego [Root.Monarch.GetTitle]."
 fetishist_flavor.173.a: "Możemy zaoferować skromne kwatery, nie oczekując wiele w zamian."
 fetishist_flavor.173.b: "Przypomnijmy ludowi o naszych bliskich więziach z Kitara."
 fetishist_flavor.173.c: "Zapewnijmy uzdrowienie i pocieszenie wszystkim potrzebującym w [Root.Capital.GetCapitalName]."
 fetishist_flavor.174.t: "Zły znak"
 fetishist_flavor.174.da: "Wróżbici z [Root.Capital.GetCapitalName] mają wizje nadciągającego zniszczenia. Zapewniają nas, że duchy Cwezi ze starego Kitara zrobią wszystko, co w ich mocy, by nas ochronić, lecz możemy być pewni, że nadchodzą ciężkie czasy."
 fetishist_flavor.174.a: "Ponure słowa..."
 fetishist_flavor.174.b: "Wróżbici staną między nami a bohaterami dawnych czasów."
 fetishist_flavor.175.t: "Świątynia duchów"
 fetishist_flavor.175.d: "Przedstawiciel jednej z największych świątyń w naszym kraju poprosił o audiencję u naszego [Root.Monarch.GetTitle]. Chce, byśmy sfinansowali rozbudowę sanktuarium i sprowadzili kolejnych kapłanów ducha Cwezi, który w nim przebywa. Według opiekuna świątynia, choć nie jest zaniedbana, nie nadaje się do przechowywania naszych wielkich przodków. Ostrzegł nas, że nie możemy oczekiwać wielkich rzeczy, dopóki czegoś z tym nie zrobimy.\\nSamo to byłoby niepokojące, lecz sprawą zainteresował się również miejscowy demagog. Ponieważ [Root.Monarch.GetName] jest tak oczerniany przez miejscowe duchowieństwo, trudno nie podejrzewać, że obaj działają w porozumieniu."
 fetishist_flavor.175.a: "Pozwolimy kapłance działać bez ograniczeń."
 fetishist_flavor.175.b: ""
