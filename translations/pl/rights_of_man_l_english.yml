 SEND_ADDITIONAL_TROOPS_DESCRIPTION: "Wyślij państwu $SUBJECT|Y$ $AMOUNT|Y$£icon_manpower£ jako pomoc dla ich działań wojennych. Zmniejszy to ich dążenia niepodległościowe o §G$LD$%§!."
 OVERLORD_SENT_ADDITIONAL_TROOPS: "wysłali nam $MANPOWER$£icon_manpower£."
 DEMAND_ARTIFACTS_TITLE: "Zażądaj artefaktów"
 DEMAND_ARTIFACTS_NO_ARTIFACTS: "Ponieważ oni mają ujemny prestiż, artefakty $SUBJECTADJECTIVE$ są bezwartościowe."
 DEMAND_ARTIFACTS_DESCRIPTION: "Pokaż państwu $SUBJECT|Y$, gdzie ich miejsce, żądając od nich najwyższej jakości przedmiotów. Dzięki temu nasz prestiż zwiększy się ich kosztem o $PRESTIGE|Y$, ale również ich dążenia niepodległościowe wzrosną o §R$LD$%§!."
 OVERLORD_DEMANDED_ARTIFACTS: "zmusili nas do oddania naszych najcenniejszych artefaktów, co kosztowało nas $PRESTIGE|R$ prestiżu. Nie mogliśmy nic zrobić."
 DEMAND_ADDITIONAL_TRIBUTE_TITLE: "Zażądaj dodatkowego trybutu"
 DEMAND_ADDITIONAL_TRIBUTE_DESCRIPTION: "Zażądaj od poddanego państwa $SUBJECT|Y$ dodatkowych $TRIBUTE|Y$¤ jako symbol dobrej woli. W końcu są naszym §Ywasalem§!. To jednak zwiększyłoby ich dążenia niepodległościowe o §R$LD$%§!."
 DEMAND_ADDITIONAL_TRIBUTE_BROKE: "Nie mają wymaganych $TRIBUTE|Y$¤."
 OVERLORD_DEMANDED_ADDITIONAL_TRIBUTE: "wyślemy im dodatkowy trybut w wysokości $TRIBUTE|Y$¤. Kiedy będą z tego zadowoleni?"
 FORCE_SEPPUKU_TITLE: "Wymuś seppuku"
 FORCE_SEPPUKU_DESCRIPTION: "Podżegający do wojny Daimyo są plamą na honorze ich klanu. Tylko śmierć jest jedynym wyjściem. Jeżeli zmusimy, żeby $DAIMYO|Y$ popełnił/a seppuku, $HISHER$ następca powinien zauważyć korzyści płynące z bardziej pokojowej drogi.\n\nPowinniśmy również otrzymać $X|Y$-krotność punktów monarchy na podstawie umiejętności ich nowego władcy."
 CANT_SEPPUKU_REGENT: "$MONARCH$ nie może popełnić seppuku."
 CANT_SEPPUKU_PEACEFUL: "$DAIMYO$ nie wypowiedział ani jednej wojny."
 RETURN_LAND_TITLE: "Zwróć ziemię"
 RETURN_LAND_DESCRIPTION: "Posiadają ziemię, która prawowicie nie należy do nich. Sprostujmy to."
 RETURN_LAND_SPECIFIC_DESC: "Państwo $TAKER|Y$ otrzyma zwrot prowincji $PROVINCE|Y$. Dążenia niepodległościowe państwa $GIVERS|Y$ wzrosną o $LD$ i będą wynosić w sumie $LD_TOTAL$."
 RETURN_LAND_NO_ELIGBLE: "Brak odpowiedniej prowincji do zwrotu."
 RETURN_LAND_EFFECT: "Państwo $WHO$ otrzymało zwrot prowincji $PROVINCE$."
 OVERLORD_RETURNED_LAND: "zmusili nas do zwrotu prowincji $PROVINCE|Y$ państwu $WHO|Y$."
 CONTRIBUTE_TO_CAPITAL_TITLE: "Wspomóż rozwój stolicy"
 CONTRIBUTE_TO_CAPITAL_DESCRIPTION: "Wymuś ich najlepiej rozwiniętą prowincję, $PROVINCE|Y$ do wspomożenia rozwoju naszej stolicy, $CAPITALNAME|Y$, rozwojem typu $DEVTYPE|Y$. Ich prowincja utraci $LOST|Y$ punktów rozwoju, a nasza zyska $GAINED|Y$."
 CONTRIBUTE_TO_CAPITAL_GENERAL_DESC: "Wymuś ich najlepiej rozwiniętą prowincję do wspożenia rozwoju naszej stolicy, $CAPITALNAME|Y$. Ich prowincja utraci $LOST|Y$ punktów rozwoju, a nasza zyska $GAINED|Y$."
 CONTRIBUTE_TO_CAPITAL_NO_TARGET: "Żadna ich prowincja nie ma co najmniej $MINDEV$ punktów rozwoju tego samego typu."
 CONTRIBUTE_TO_CAPITAL_SIEGE: "$CAPITAL$ jest w stanie oblężenia!"
 CONTRIBUTE_TO_CAPITAL_OCCUPIED: "$CAPITAL$ jest okupowana przez wroga!"
 CONTRIBUTE_TO_CAPITAL_TOO_SMALL: "Ich państwo jest zbyt słabe, a $NAME$, ich najlepiej rozwinięta prowincja, potrzebuje co najmniej $DEV$ punktów rozwoju, aby mogła wspomóc rozwój naszej stolicy."
 OVERLORD_CONTRIBUTED_TO_CAPITAL: "ukraść $AMOUNT|Y$ $DEVTYPE|Y$ z prowincji $TAKENFROM|Y$."
 INCREASE: "Wzrost"
 DECREASE: "Zmniejsz"
 CHANGE: "Zmiana"
 CHANGE_ISOLATION_TITLE: "$INCREASEDECREASE$ Izolacjonizm "
 CHANGE_ISOLATION_DESCRIPTION: "Zmień poziom ich Izolacjonizmu na bliższy naszemu!"
 CHANGE_ISOLATION_SAME: "Oni posiadają ten sam poziom Izolacjonizmu co my."
 CONSCRIPT_GENERAL_TITLE: "Zwerbuj generała "
 CONSCRIPT_GENERAL_SPECIFIC_DESC: "Zwerbuj $NAME|Y$ ($FIRE$/$SHOCK$/$MANUEVER$/$SIEGE$), ich najlepszego generała, do naszej armii."
 CONSCRIPT_GENERAL_DESCRIPTION: "Zwerbuj ich najlepszego generała do naszej armii."
 CONSCRIPT_GENERAL_NO_TARGET: "Brak generała. "
 OVERLORD_CONSCRIPTED_GENERAL: "zwerbowali naszego generała $NAME|Y$ ($FIRE$/$SHOCK$/$MANUEVER$/$SIEGE$) do swojej armii. On już nam nie służy."
 WE_CONSCRIPTED_GENERAL: "pozwolili swojemu generałowi $NAME|Y$ ($FIRE$/$SHOCK$/$MANUEVER$/$SIEGE$) służyć w naszej armii. Był zbyt dobry, by dowodzić armią tak słabego państwa."
 NO_VALID_SUBJECT: "Nie masz żadnych Daimyo. "
 TOO_ILLEGITIMATE: "Twoja legitymizacja jest zbyt niska!"
 COOLDOWN_UNTIL: "$ACTION$ można użyć tylko raz na $YEARS$ lat. Będziesz mógł to zrobić ponownie po $UNTIL|Y$."
 sword_hunt: "Polowanie na miecze"
 sword_hunt_desc: "Wśród naszych poddanych jest wielu dysydentów, zwłaszcza roninów i Ikko-ikki, którzy stanowią potencjalne zagrożenie dla naszych prawych rządów nad Japonią. Powinniśmy przeprowadzić Polowanie na miecze, rozkazując naszym armiom w całym kraju konfiskować broń od tych, którzy mogą chcieć nam zagrozić."
 sankin_kotai: "Sankin kotai"
 sankin_kotai_desc: "Zobowiązujemy naszych poddanych do okresowych wizyt w mieście [Root.Capital.GetCapitalName], a kluczowych członków ich dworu zatrzymujemy jako zakładników. To sprawi, że nasi podwładni zostaną obciążeni dyplomatycznie, a my zwiększymy swoje wpływy."
 expel_ronin: "Wymuś wygnanie roninów"
 expel_ronin_desc: "Roninowie to kłopotliwa zbieranina. Ci pozbawieni pana samuraje przemierzają kraj, często znajdując sobie nowe życie jako bandyci, opryszkowie i włóczędzy. Przeprowadzimy spis ludności w głównych miastach na ziemiach naszych poddanych i wypędzimy wszystkich Roninów na wieś, co zapewni nam przychylność Daimyo."
 SHOGUN_INTERACTIONS_EFFECT_INTRO: "Państwo $WHO$ straci $LEGITIMACY|R$ punktów legitymizacji, a ponadto przez §Y$YEARS$ lat będą obowiązywać następujące efekty:\n"
 WHO_GETS_WHAT: "Państwo $WHO$ otrzyma:\n$WHAT$\n"
